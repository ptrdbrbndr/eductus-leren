<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" font-family="'DM Sans', Arial, sans-serif" width="1400" height="800" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .pool { fill:#FFFFFF; stroke:#14213D; stroke-width:1.8; }
    .lane-tool-bg { fill:#EEF2F7; }
    .lane-div { stroke:#14213D; stroke-width:1; stroke-dasharray:2 3; }
    .pool-title { font-size:12px; font-weight:700; fill:#14213D; letter-spacing:.1em; }
    .lane-title { font-size:11.5px; font-weight:700; fill:#14213D; }
    .task { fill:#CFE0F2; stroke:#14213D; stroke-width:1.5; }
    .task-service { fill:#FBF6E9; stroke:#14213D; stroke-width:1.5; }
    .task-label { font-size:11px; fill:#14213D; }
    .icon { stroke:#14213D; stroke-width:1.2; fill:none; }
    .evt-start { fill:#FBFAF7; stroke:#14213D; stroke-width:1.8; }
    .evt-end { fill:#E9A13B; stroke:#14213D; stroke-width:3; }
    .evt-label { font-size:10.5px; fill:#14213D; text-anchor:middle; }
    .gw { fill:#FBF6E9; stroke:#14213D; stroke-width:1.6; }
    .gw-x { stroke:#14213D; stroke-width:1.6; }
    .gw-label { font-size:10.5px; font-weight:700; fill:#14213D; text-anchor:middle; }
    .seq { stroke:#14213D; stroke-width:1.7; fill:none; marker-end:url(#seqarr); }
    .rej { stroke:#B9791F; stroke-width:1.5; fill:none; stroke-dasharray:5 3; marker-end:url(#rejarr); }
    .flow-label { font-size:10px; font-weight:700; fill:#14213D; }
    .flow-label-rej { font-size:10px; font-weight:700; fill:#B9791F; }
    .desc-label { font-size:10.5px; fill:#55606F; }
    .desc-label-rej { font-size:10.5px; fill:#B9791F; }
    .annot { fill:none; stroke:#55606F; stroke-width:1.2; }
    .assoc { stroke:#55606F; stroke-width:1; stroke-dasharray:2 2; fill:none; }
    .annot-text { font-size:10.5px; fill:#55606F; }
    .label { font-size:14px; font-weight:700; fill:#14213D; }
    .sub { font-size:12px; fill:#55606F; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    .legend-text { font-size:9.5px; fill:#55606F; }
  </style>
  <marker id="seqarr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#14213D"/></marker>
  <marker id="rejarr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#B9791F"/></marker>
</defs>
<rect width="1400" height="800" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 21 · BPMN-PROCESNOTATIE</text>
<text x="40" y="62" class="title">Figuur 21.3 — De publicatiestraat als BPMN-proces</text>

<!-- legend -->
<g>
  <circle cx="50" cy="98" r="9" class="evt-start"/><text x="64" y="102" class="legend-text">start event</text>
  <circle cx="150" cy="98" r="9" class="evt-end"/><text x="164" y="102" class="legend-text">end event</text>
  <rect x="240" y="90" width="34" height="18" rx="4" class="task"/><path d="M251,95 a3,3 0 1,0 0.1,0" class="icon"/><text x="284" y="102" class="legend-text">user task</text>
  <rect x="360" y="90" width="34" height="18" rx="4" class="task-service"/><rect x="366" y="95" width="10" height="8" class="icon"/><text x="404" y="102" class="legend-text">business rule task</text>
  <rect x="510" y="90" width="34" height="18" rx="4" class="task"/><circle cx="521" cy="99" r="4" class="icon"/><text x="554" y="102" class="legend-text">service task</text>
  <polygon points="640,90 656,99 640,108 624,99" class="gw"/><text x="666" y="102" class="legend-text">exclusive gateway</text>
  <line x1="800" y1="99" x2="830" y2="99" class="seq"/><text x="836" y="102" class="legend-text">sequence flow</text>
  <line x1="940" y1="99" x2="970" y2="99" class="rej"/><text x="976" y="102" class="legend-text">afwijzing / lus terug naar concept</text>
</g>

<!-- POOL -->
<rect x="40" y="130" width="1320" height="560" class="pool"/>
<rect x="75" y="317" width="1285" height="187" class="lane-tool-bg"/>
<text x="57" y="410" class="pool-title" transform="rotate(-90 57 410)" text-anchor="middle">PUBLICATIESTRAAT</text>
<line x1="75" y1="317" x2="1360" y2="317" class="lane-div"/>
<line x1="75" y1="504" x2="1360" y2="504" class="lane-div"/>
<text x="90" y="150" class="lane-title">MODELLEUR</text>
<text x="90" y="337" class="lane-title">PROCESBEHEERDER (incl. machinale toets)</text>
<text x="90" y="524" class="lane-title">PROCESEIGENAAR</text>

<!-- Start event -->
<circle cx="130" cy="235" r="16" class="evt-start"/>
<text x="130" y="270" class="evt-label">Model gereed</text>
<text x="130" y="284" class="evt-label">[concept]</text>

<!-- Task A: Modelleur -->
<rect x="190" y="205" width="190" height="60" rx="8" class="task"/>
<circle cx="205" cy="217" r="4" class="icon"/><path d="M198,229 q7,-9 14,0" class="icon"/>
<text x="285" y="231" text-anchor="middle" class="task-label">Concept (opnieuw)</text>
<text x="285" y="245" text-anchor="middle" class="task-label">indienen voor review</text>

<!-- Task B: Procesbeheerder / machinale toets (business rule) -->
<rect x="440" y="375" width="200" height="60" rx="8" class="task-service"/>
<rect x="452" y="387" width="20" height="16" class="icon"/><line x1="452" y1="393" x2="472" y2="393" class="icon"/><line x1="462" y1="387" x2="462" y2="403" class="icon"/>
<text x="540" y="401" text-anchor="middle" class="task-label">Machinale toets</text>
<text x="540" y="415" text-anchor="middle" class="task-label">vrijgavecriteria (§21.2)</text>

<!-- Gateway G1 -->
<polygon points="740,370 775,405 740,440 705,405" class="gw"/>
<text x="740" y="460" class="gw-label">Voldoet?</text>

<!-- Task C: Proceseigenaar -->
<rect x="830" y="567" width="200" height="60" rx="8" class="task"/>
<circle cx="845" cy="579" r="4" class="icon"/><path d="M838,591 q7,-9 14,0" class="icon"/>
<text x="930" y="593" text-anchor="middle" class="task-label">Inhoudelijke</text>
<text x="930" y="607" text-anchor="middle" class="task-label">beoordeling</text>

<!-- Gateway G2 -->
<polygon points="1110,562 1145,597 1110,632 1075,597" class="gw"/>
<text x="1110" y="652" class="gw-label">Goedgekeurd?</text>

<!-- Task D: Procesbeheerder / publiceren (service) -->
<rect x="1160" y="375" width="150" height="60" rx="8" class="task-service"/>
<circle cx="1172" cy="387" r="4.5" class="icon"/><line x1="1172" y1="382" x2="1172" y2="392" class="icon"/><line x1="1167" y1="387" x2="1177" y2="387" class="icon"/>
<text x="1235" y="401" text-anchor="middle" class="task-label">Publiceren als</text>
<text x="1235" y="415" text-anchor="middle" class="task-label">vastgesteld</text>

<!-- End event -->
<circle cx="1340" cy="405" r="18" class="evt-end"/>
<text x="1340" y="440" class="evt-label">Vastgesteld</text>
<text x="1340" y="454" class="evt-label">(gepubliceerd)</text>

<!-- Main sequence flows -->
<path d="M146,235 H190" class="seq"/>
<path d="M380,235 H430 V405 H440" class="seq"/>
<path d="M640,405 H705" class="seq"/>
<path d="M775,405 H930 V567" class="seq"/>
<text x="790" y="397" class="flow-label">ja</text>
<path d="M1030,597 H1075" class="seq"/>
<path d="M1145,597 H1235 V437" class="seq"/>
<text x="1152" y="590" class="flow-label">ja</text>
<path d="M1310,405 H1322" class="seq"/>

<!-- Rejection loops -->
<path d="M740,370 V178 H285 V205" class="rej"/>
<text x="748" y="358" class="flow-label-rej">nee</text>
<text x="512" y="171" text-anchor="middle" class="desc-label-rej">afgekeurd (machinaal) → concept</text>

<path d="M1110,562 V136 H150 V225 H190" class="rej"/>
<text x="1118" y="548" class="flow-label-rej">nee</text>
<text x="630" y="150" text-anchor="middle" class="desc-label-rej">afgekeurd (inhoudelijk) → concept</text>

<!-- Text annotation: vervallen follow-up -->
<path d="M1090,705 h20 M1090,705 v70 M1090,775 h20" class="annot"/>
<text x="1120" y="722" class="annot-text">Vervolg (apart, §21.2): zodra een</text>
<text x="1120" y="737" class="annot-text">nieuwe versie wordt vastgesteld,</text>
<text x="1120" y="752" class="annot-text">markeert de procesbeheerder de</text>
<text x="1120" y="767" class="annot-text">vorige versie 'vervallen'.</text>
<path d="M1340,423 C1340,600 1200,650 1110,703" class="assoc"/>

</svg>
