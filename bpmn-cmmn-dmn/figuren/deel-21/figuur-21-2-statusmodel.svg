<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" font-family="'DM Sans', Arial, sans-serif" width="1000" height="600" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .state-concept { fill:#CFE0F2; stroke:#14213D; stroke-width:1.6; }
    .state-review { fill:#FBF6E9; stroke:#14213D; stroke-width:1.6; }
    .state-vastgesteld { fill:#E9A13B; stroke:#14213D; stroke-width:1.8; }
    .state-vervallen { fill:#E3E0D8; stroke:#55606F; stroke-width:1.6; stroke-dasharray:5 3; }
    .state-label { font-size:15px; font-weight:700; fill:#14213D; }
    .state-label-light { font-size:15px; font-weight:700; fill:#FBFAF7; }
    .state-label-muted { font-size:15px; font-weight:700; fill:#55606F; }
    .state-sub { font-size:10.5px; fill:#55606F; }
    .state-sub-light { font-size:10.5px; fill:#FBF6E9; }
    .initial { fill:#14213D; }
    .arrow { stroke:#14213D; stroke-width:1.6; fill:none; marker-end:url(#arr); }
    .arrow-back { stroke:#55606F; stroke-width:1.4; fill:none; stroke-dasharray:5 3; marker-end:url(#arrgrey); }
    .arrow-down { stroke:#14213D; stroke-width:1.6; fill:none; marker-end:url(#arr); }
    .edge-label { font-size:10.5px; fill:#14213D; }
    .edge-label-back { font-size:10.5px; fill:#55606F; }
    .label { font-size:14px; font-weight:700; fill:#14213D; }
    .sub { font-size:12px; fill:#55606F; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    .caption { font-size:11px; fill:#55606F; font-style:italic; }
  </style>
  <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#14213D"/></marker>
  <marker id="arrgrey" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
</defs>
<rect width="1000" height="600" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 21 · CONCEPTDIAGRAM · TOESTANDSDIAGRAM</text>
<text x="40" y="62" class="title">Figuur 21.2 — Het statusmodel van een model</text>

<!-- initial pseudostate -->
<circle cx="25" cy="295" r="8" class="initial"/>
<line x1="33" y1="295" x2="58" y2="295" class="arrow"/>

<!-- Concept -->
<rect x="60" y="260" width="190" height="70" rx="8" class="state-concept"/>
<text x="155" y="292" text-anchor="middle" class="state-label">Concept</text>
<text x="155" y="310" text-anchor="middle" class="state-sub">in ontwikkeling, nog niet gedeeld</text>

<!-- In review -->
<rect x="390" y="260" width="190" height="70" rx="8" class="state-review"/>
<text x="485" y="292" text-anchor="middle" class="state-label">In review</text>
<text x="485" y="310" text-anchor="middle" class="state-sub">voorgelegd (reviewprotocol §11.5)</text>

<!-- Vastgesteld -->
<rect x="720" y="260" width="190" height="70" rx="8" class="state-vastgesteld"/>
<text x="815" y="292" text-anchor="middle" class="state-label-light">Vastgesteld</text>
<text x="815" y="310" text-anchor="middle" class="state-sub-light">de geldende versie</text>

<!-- Vervallen -->
<rect x="720" y="440" width="190" height="70" rx="8" class="state-vervallen"/>
<text x="815" y="472" text-anchor="middle" class="state-label-muted">Vervallen</text>
<text x="815" y="490" text-anchor="middle" class="state-sub">vervangen, of proces bestaat niet meer</text>

<!-- Concept -> In review -->
<line x1="252" y1="278" x2="388" y2="278" class="arrow"/>
<text x="320" y="255" text-anchor="middle" class="edge-label">indienen voor</text>
<text x="320" y="268" text-anchor="middle" class="edge-label">review</text>

<!-- In review -> Concept (reject) -->
<line x1="388" y1="315" x2="252" y2="315" class="arrow-back"/>
<text x="320" y="345" text-anchor="middle" class="edge-label-back">afgekeurd —</text>
<text x="320" y="358" text-anchor="middle" class="edge-label-back">terug naar concept</text>

<!-- In review -> Vastgesteld -->
<line x1="582" y1="278" x2="718" y2="278" class="arrow"/>
<text x="650" y="240" text-anchor="middle" class="edge-label">vrijgavecriteria voldaan:</text>
<text x="650" y="253" text-anchor="middle" class="edge-label">machinale toets +</text>
<text x="650" y="266" text-anchor="middle" class="edge-label">goedkeuring proceseigenaar</text>

<!-- Vastgesteld -> In review (wijziging) -->
<line x1="718" y1="315" x2="582" y2="315" class="arrow-back"/>
<text x="650" y="345" text-anchor="middle" class="edge-label-back">nieuwe versie ingediend</text>
<text x="650" y="358" text-anchor="middle" class="edge-label-back">(wijziging)</text>

<!-- Vastgesteld -> Vervallen -->
<line x1="815" y1="332" x2="815" y2="438" class="arrow-down"/>
<text x="835" y="378" class="edge-label">vervangen door</text>
<text x="835" y="391" class="edge-label">nieuwere versie, of</text>
<text x="835" y="404" class="edge-label">proces vervalt</text>

<text x="40" y="565" class="caption">Overgangen zijn onderworpen aan de vrijgavecriteria uit §21.2; het mechanisme dat de overgangen afdwingt is de publicatiestraat (figuur 21.3).</text>
</svg>
