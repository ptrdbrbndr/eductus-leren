<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" font-family="'DM Sans', Arial, sans-serif" width="1000" height="800" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .node { fill:#CFE0F2; stroke:#14213D; stroke-width:1.6; }
    .node-decide { fill:#FBF6E9; stroke:#E9A13B; stroke-width:1.8; }
    .node-label { font-size:14px; font-weight:700; fill:#14213D; }
    .node-sub { font-size:10.5px; fill:#55606F; }
    .center-ring { fill:none; stroke:#E9A13B; stroke-width:1.6; stroke-dasharray:6 5; }
    .clock { fill:#FBFAF7; stroke:#14213D; stroke-width:1.6; }
    .cadence-label { font-size:13px; font-weight:700; fill:#B9791F; letter-spacing:.06em; }
    .cadence-sub { font-size:10px; fill:#55606F; }
    .arc { stroke:#14213D; stroke-width:1.8; fill:none; marker-end:url(#arr); }
    .side-box { fill:#FFFFFF; stroke:#14213D; stroke-width:1.2; stroke-dasharray:3 3; }
    .side-text { font-size:10px; fill:#14213D; }
    .arrow-down { stroke:#14213D; stroke-width:1.5; fill:none; marker-end:url(#arr); }
    .callout { fill:#FBF6E9; stroke:#E9A13B; stroke-width:1.4; }
    .callout-title { font-size:12.5px; font-weight:700; fill:#B9791F; }
    .callout-text { font-size:12px; fill:#14213D; }
    .label { font-size:14px; font-weight:700; fill:#14213D; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
  </style>
  <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#14213D"/></marker>
</defs>
<rect width="1000" height="800" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 21 · CONCEPTDIAGRAM</text>
<text x="40" y="62" class="title">Figuur 21.4 — De feedbackloop van mining naar beheer</text>

<!-- center cadence marker -->
<circle cx="500" cy="355" r="125" class="center-ring"/>
<circle cx="500" cy="325" r="20" class="clock"/>
<line x1="500" y1="325" x2="500" y2="313" stroke="#14213D" stroke-width="1.6"/>
<line x1="500" y1="325" x2="509" y2="329" stroke="#14213D" stroke-width="1.6"/>
<text x="500" y="368" text-anchor="middle" class="cadence-label">ELK KWARTAAL</text>
<text x="500" y="383" text-anchor="middle" class="cadence-sub">het beheerritme (§21.4)</text>

<!-- N: Conformance-run -->
<rect x="395" y="85" width="210" height="100" rx="8" class="node"/>
<text x="500" y="122" text-anchor="middle" class="node-label">Conformance-run</text>
<text x="500" y="142" text-anchor="middle" class="node-sub">Retroductus tegen de</text>
<text x="500" y="156" text-anchor="middle" class="node-sub">vastgestelde modellen (deel 20)</text>

<!-- E: Bevindingen -->
<rect x="655" y="305" width="210" height="100" rx="8" class="node"/>
<text x="760" y="342" text-anchor="middle" class="node-label">Bevindingen</text>
<text x="760" y="362" text-anchor="middle" class="node-sub">afwijkingen geclassificeerd</text>
<text x="760" y="376" text-anchor="middle" class="node-sub">volgens §20.5</text>

<!-- S: Reviewproces -->
<rect x="395" y="525" width="210" height="100" rx="8" class="node"/>
<text x="500" y="562" text-anchor="middle" class="node-label">Reviewproces</text>
<text x="500" y="582" text-anchor="middle" class="node-sub">procesbeheerder signaleert,</text>
<text x="500" y="596" text-anchor="middle" class="node-sub">ingebed in het beheerritme (§21.3)</text>

<!-- W: Besluit & actie -->
<rect x="135" y="305" width="210" height="100" rx="8" class="node-decide"/>
<text x="240" y="342" text-anchor="middle" class="node-label">Besluit &amp; actie</text>
<text x="240" y="362" text-anchor="middle" class="node-sub">proceseigenaar: wijziging /</text>
<text x="240" y="376" text-anchor="middle" class="node-sub">interventie / niets doen (§21.5)</text>

<!-- Arcs clockwise N -> E -> S -> W -> N -->
<path d="M605,135 C700,135 760,215 760,303" class="arc"/>
<path d="M760,407 C760,497 700,575 607,575" class="arc"/>
<path d="M395,575 C300,575 240,497 240,407" class="arc"/>
<path d="M240,303 C240,215 300,135 393,135" class="arc"/>

<!-- side box: modelwijziging naar publicatiestraat -->
<line x1="240" y1="405" x2="240" y2="483" class="arrow-down"/>
<rect x="135" y="485" width="210" height="70" rx="6" class="side-box"/>
<text x="145" y="507" class="side-text">Bij modelwijziging:</text>
<text x="145" y="521" class="side-text">publicatiestraat (fig. 21.3) →</text>
<text x="145" y="535" class="side-text">nieuwe vastgestelde versie,</text>
<text x="145" y="549" class="side-text">terug de repository in (§21.2)</text>

<!-- callout -->
<rect x="80" y="680" width="840" height="90" rx="5" class="callout"/>
<text x="100" y="704" class="callout-title">Wanneer het ritme zelf faalt</text>
<text x="100" y="724" class="callout-text">Een afwijking die drie kwartalen op rij terugkeert zonder besluit, is een signaal dat het beheerritme</text>
<text x="100" y="742" class="callout-text">zelf niet functioneert — niet alleen dat het proces een probleem heeft (§21.4).</text>
</svg>
