<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 560" font-family="'DM Sans', Arial, sans-serif" width="1160" height="560" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .panel { fill:#FFFFFF; stroke:#E3E0D8; stroke-width:1.5; }
    .task { fill:#CFE0F2; stroke:#14213D; stroke-width:1.4; }
    .task-new { fill:#FBF6E9; stroke:#E9A13B; stroke-width:2.2; }
    .task-label { font-size:10px; fill:#14213D; }
    .evt-start { fill:#FBFAF7; stroke:#14213D; stroke-width:1.6; }
    .evt-end { fill:#FBFAF7; stroke:#14213D; stroke-width:2.8; }
    .evt-inter { fill:#FBFAF7; stroke:#14213D; stroke-width:1.2; }
    .evt-inter-new { fill:#FBF6E9; stroke:#E9A13B; stroke-width:2.2; }
    .seq { stroke:#14213D; stroke-width:1.5; fill:none; marker-end:url(#seqarr); }
    .label { font-size:14px; font-weight:700; fill:#14213D; }
    .sub { font-size:11.5px; fill:#55606F; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    .paneltitle { font-size:13px; font-weight:700; }
    .badge { fill:#E9A13B; }
    .badgetext { font-size:9px; font-weight:700; fill:#FBFAF7; }
    .callout { fill:#FFFFFF; stroke:#E3E0D8; stroke-width:1.4; }
  </style>
  <marker id="seqarr" markerWidth="8" markerHeight="8" refX="5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="#14213D"/></marker>
</defs>
<rect width="1160" height="560" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 14 · VOOR / NA — BPMN-PROCESNOTATIE</text>
<text x="40" y="64" class="title">Figuur 14.6 — Legacy-koppelvlakbeperking verwerkt: batchverwerking in plaats van realtime</text>

<!-- VOOR -->
<rect x="30" y="90" width="1100" height="170" class="panel" rx="4"/>
<text x="50" y="116" class="paneltitle" style="fill:#B9433D">VOOR — ontwerp gaat uit van realtime bevestiging</text>

<circle cx="80" cy="200" r="13" class="evt-start"/>
<rect x="130" y="178" width="220" height="44" rx="10" class="task"/>
<text x="240" y="196" text-anchor="middle" class="task-label">Mutatie doorgeven aan</text>
<text x="240" y="210" text-anchor="middle" class="task-label">polisadministratie</text>
<rect x="420" y="178" width="220" height="44" rx="10" class="task"/>
<text x="530" y="196" text-anchor="middle" class="task-label">Deelnemer bevestigen</text>
<text x="530" y="210" text-anchor="middle" class="task-label" style="font-size:8.5px;font-style:italic">(veronderstelt direct antwoord)</text>
<circle cx="720" cy="200" r="14" class="evt-end"/>
<line x1="93" y1="200" x2="130" y2="200" class="seq"/>
<line x1="350" y1="200" x2="420" y2="200" class="seq"/>
<line x1="640" y1="200" x2="706" y2="200" class="seq"/>

<text x="800" y="180" class="sub">Dit lijkt correct op de tekentafel: het koppelvlak wordt aangeroepen en</text>
<text x="800" y="198" class="sub">de bevestiging volgt meteen. In werkelijkheid verwerkt het 35 jaar oude</text>
<text x="800" y="216" class="sub">polisadministratiesysteem mutaties pas in de nachtelijke batch — het</text>
<text x="800" y="234" class="sub">model belooft iets wat het koppelvlak niet waarmaakt (§14.7).</text>

<!-- NA -->
<rect x="30" y="300" width="1100" height="230" class="panel" rx="4"/>
<text x="50" y="326" class="paneltitle" style="fill:#2563A8">NA — expliciete wachtstap toegevoegd</text>

<circle cx="80" cy="420" r="12" class="evt-start"/>
<rect x="120" y="400" width="170" height="42" rx="9" class="task"/>
<text x="205" y="418" text-anchor="middle" class="task-label" style="font-size:9.5px">Mutatie doorgeven aan</text>
<text x="205" y="431" text-anchor="middle" class="task-label" style="font-size:9.5px">polisadministratie</text>

<rect x="320" y="400" width="160" height="42" rx="9" class="task"/>
<text x="400" y="418" text-anchor="middle" class="task-label" style="font-size:9.5px">Voorlopige bevestiging</text>
<text x="400" y="431" text-anchor="middle" class="task-label" style="font-size:9.5px">versturen</text>

<!-- NEW timer event -->
<circle cx="560" cy="421" r="17" class="evt-inter-new"/>
<circle cx="560" cy="421" r="13" class="evt-inter-new"/>
<circle cx="560" cy="421" r="8" fill="none" stroke="#E9A13B" stroke-width="1.3"/>
<line x1="560" y1="421" x2="560" y2="415" stroke="#E9A13B" stroke-width="1.3"/>
<line x1="560" y1="421" x2="565" y2="424" stroke="#E9A13B" stroke-width="1.3"/>
<rect x="530" y="446" width="60" height="16" rx="8" class="badge"/>
<text x="560" y="458" text-anchor="middle" class="badgetext">NIEUW</text>
<text x="560" y="480" text-anchor="middle" class="task-label" style="font-size:9px">Wachten op</text>
<text x="560" y="492" text-anchor="middle" class="task-label" style="font-size:9px">nachtverwerking</text>

<circle cx="660" cy="421" r="14" class="evt-inter"/>
<circle cx="660" cy="421" r="10.5" class="evt-inter"/>
<path d="M653,417 h14 v9 l-7,5 -7,-5 z" stroke="#14213D" stroke-width="1.1" fill="none"/>
<text x="660" y="470" text-anchor="middle" class="task-label" style="font-size:8.5px">Definitieve verwerking</text>
<text x="660" y="482" text-anchor="middle" class="task-label" style="font-size:8.5px">bevestigd</text>

<rect x="720" y="400" width="180" height="42" rx="9" class="task"/>
<text x="810" y="418" text-anchor="middle" class="task-label" style="font-size:9.5px">Deelnemer definitief</text>
<text x="810" y="431" text-anchor="middle" class="task-label" style="font-size:9.5px">bevestigen</text>

<circle cx="960" cy="421" r="14" class="evt-end"/>

<line x1="92" y1="420" x2="120" y2="420" class="seq"/>
<line x1="290" y1="420" x2="320" y2="420" class="seq"/>
<line x1="480" y1="420" x2="542" y2="421" class="seq"/>
<line x1="578" y1="421" x2="642" y2="421" class="seq"/>
<line x1="678" y1="421" x2="720" y2="420" class="seq"/>
<line x1="900" y1="420" x2="946" y2="421" class="seq"/>

<text x="120" y="500" class="sub">Twee toevoegingen ten opzichte van het ontwerp op de tekentafel: (1) een "voorlopige bevestiging" aan de deelnemer</text>
<text x="120" y="516" class="sub">meteen na de aanroep, en (2) een expliciete timer-wachtstap vóór de definitieve bevestiging. Beide zijn een compromis</text>
<text x="120" y="532" class="sub">dat te verantwoorden moet zijn — inclusief de consequentie voor de doorlooptijd uit deel 12 (§14.7).</text>

</svg>
