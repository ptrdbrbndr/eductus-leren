<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" font-family="'DM Sans', Arial, sans-serif" width="1080" height="560" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .task { fill:#CFE0F2; stroke:#14213D; stroke-width:1.5; }
    .task-shadow { fill:#DCEAF7; stroke:#6FA3D6; stroke-width:1.2; }
    .task-label { font-size:11px; fill:#14213D; }
    .evt-start { fill:#FBFAF7; stroke:#14213D; stroke-width:1.6; }
    .evt-end { fill:#FBFAF7; stroke:#14213D; stroke-width:3; }
    .dataobj { fill:#FBF6E9; stroke:#14213D; stroke-width:1.4; }
    .seq { stroke:#14213D; stroke-width:1.6; fill:none; marker-end:url(#seqarr); }
    .assoc { stroke:#55606F; stroke-width:1.3; stroke-dasharray:3 3; fill:none; marker-end:url(#assocarr); }
    .label { font-size:14px; font-weight:700; fill:#14213D; }
    .sub { font-size:12px; fill:#55606F; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    .stackitem { fill:#FBF6E9; stroke:#14213D; stroke-width:1.1; }
    .callout { fill:#FFFFFF; stroke:#E3E0D8; stroke-width:1.4; }
    .calltext { font-size:11px; fill:#14213D; }
  </style>
  <marker id="seqarr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#14213D"/></marker>
  <marker id="assocarr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#55606F" stroke-width="1.2"/></marker>
</defs>
<rect width="1080" height="560" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 14 · BPMN-PROCESNOTATIE</text>
<text x="40" y="64" class="title">Figuur 14.4 — Multi-instance met instantiedata</text>
<text x="40" y="86" class="sub">Opbouwjaren berekenen over alle dienstverbanden van een deelnemer: collectie in, per instantie een resultaat, geaggregeerd resultaat uit.</text>

<circle cx="70" cy="300" r="14" class="evt-start"/>

<!-- collection data object: stacked items -->
<g>
  <rect x="130" y="140" width="150" height="34" rx="4" class="stackitem" transform="translate(10,10)"/>
  <rect x="130" y="140" width="150" height="34" rx="4" class="stackitem" transform="translate(5,5)"/>
  <rect x="130" y="140" width="150" height="34" rx="4" class="stackitem"/>
  <text x="205" y="161" text-anchor="middle" class="task-label" style="font-size:9.5px;font-weight:700">Dienstverbanden</text>
</g>
<text x="205" y="205" text-anchor="middle" class="task-label" style="font-size:9.5px">[Collectie] — data input</text>
<path d="M205,220 C205,250 190,260 175,278" class="assoc"/>

<!-- multi-instance activity: stacked task with MI marker -->
<rect x="180" y="278" width="180" height="55" rx="10" class="task-shadow" transform="translate(14,-14)"/>
<rect x="180" y="278" width="180" height="55" rx="10" class="task-shadow" transform="translate(7,-7)"/>
<rect x="180" y="278" width="180" height="55" rx="10" class="task"/>
<text x="270" y="300" text-anchor="middle" class="task-label" style="font-weight:700">Opbouwjaren</text>
<text x="270" y="315" text-anchor="middle" class="task-label" style="font-weight:700">berekenen</text>
<!-- MI marker: three vertical bars bottom center -->
<line x1="262" y1="323" x2="262" y2="331" stroke="#14213D" stroke-width="2"/>
<line x1="270" y1="323" x2="270" y2="331" stroke="#14213D" stroke-width="2"/>
<line x1="278" y1="323" x2="278" y2="331" stroke="#14213D" stroke-width="2"/>

<line x1="84" y1="305" x2="180" y2="305" class="seq"/>

<!-- per-instance result -->
<path d="M420,278 h150 v34 h-134 l-16,-16 z" class="dataobj"/>
<text x="495" y="299" text-anchor="middle" class="task-label" style="font-size:9.5px">Opbouwjaren</text>
<text x="495" y="310" text-anchor="middle" class="task-label" style="font-size:9px">(per instantie)</text>
<path d="M360,300 C385,300 400,300 418,300" class="assoc"/>
<text x="390" y="290" class="task-label" style="font-size:8.5px">data output (instantie)</text>

<!-- aggregation -->
<circle cx="640" cy="300" r="18" fill="#FBF6E9" stroke="#E9A13B" stroke-width="1.8"/>
<text x="640" y="306" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#E9A13B">Σ</text>
<path d="M570,300 C595,300 615,300 622,300" class="assoc"/>
<text x="595" y="322" class="task-label" style="font-size:8.5px">aggregatie</text>

<path d="M658,300 C680,300 700,300 718,300" class="assoc"/>
<path d="M718,283 h150 v34 h-134 l-16,-16 z" class="dataobj"/>
<text x="793" y="304" text-anchor="middle" class="task-label" style="font-size:9.5px">Totaal opbouwjaren</text>
<text x="793" y="316" text-anchor="middle" class="task-label" style="font-size:9px">— data output (proces)</text>

<line x1="360" y1="305" x2="880" y2="305" class="seq" opacity="0"/>
<circle cx="960" cy="305" r="15" class="evt-end"/>
<path d="M870,300 C900,300 930,300 946,304" class="seq"/>

<!-- callouts -->
<rect x="60" y="400" width="960" height="130" rx="6" class="callout"/>
<text x="80" y="424" class="calltext" style="font-weight:700">De drie ontwerpvragen van multi-instance (§14.5)</text>
<text x="80" y="448" class="calltext"><tspan style="font-weight:700">Cardinaliteit</tspan> — het aantal instanties is niet vooraf vast: het verschilt per deelnemer met het aantal dienstverbanden.</text>
<text x="80" y="470" class="calltext"><tspan style="font-weight:700">Completion condition</tspan> — hier: alle instanties moeten voltooien voordat geaggregeerd wordt (geen vroegtijdige stop).</text>
<text x="80" y="492" class="calltext"><tspan style="font-weight:700">Instantiedata</tspan> — elke instantie krijgt één dienstverband als input en levert één opbouwjarenresultaat, dat</text>
<text x="80" y="512" class="calltext">na afloop wordt samengevoegd tot het totaal — de aggregatielogica is zelf een ontwerpvraag.</text>

</svg>
