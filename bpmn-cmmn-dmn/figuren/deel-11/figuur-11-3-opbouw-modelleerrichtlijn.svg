<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'DM Sans', Arial, sans-serif" width="960" height="640" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:11.5px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:22px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .blk { stroke:#14213D; stroke-width:1.5; }
      .num { font-size:15px; font-weight:700; fill:#FBFAF7; text-anchor:middle; }
      .card-head { font-size:10px; font-weight:700; fill:#2563A8; letter-spacing:.06em; }
      .card-txt { font-size:10.8px; fill:#14213D; }
      .badge-txt { font-size:10px; font-weight:700; fill:#FBFAF7; }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
</defs>
<rect width="960" height="640" class="paper"/>
<text x="40" y="26" class="kicker">DEEL 11 · CONCEPTDIAGRAM</text>
<text x="40" y="50" class="title">Opbouw van een modelleerrichtlijn als document, met de</text>
<text x="40" y="76" class="title">verplichte onderdelen gemarkeerd.</text>

<line x1="85" y1="125" x2="85" y2="550" stroke="#CFE0F2" stroke-width="4"/>

<!-- BLOK 1: Inleiding -->
<rect x="60" y="100" width="840" height="50" rx="6" fill="#EEF2F7" stroke="#14213D" stroke-width="1.5"/>
<circle cx="85" cy="125" r="16" class="blue-dark"/>
<text x="85" y="130" class="num">1</text>
<text x="115" y="131" class="label">Inleiding — doel van de richtlijn</text>
<rect x="758" y="112" width="122" height="24" rx="12" class="amber-fill"/>
<path d="M769,124 l4,4 l7,-8" fill="none" stroke="#FBFAF7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="787" y="128" class="badge-txt">VERPLICHT</text>

<!-- BLOK 2: Regel 1..N -->
<rect x="60" y="170" width="840" height="250" rx="6" fill="#FBF6E9" stroke="#14213D" stroke-width="1.5"/>
<circle cx="85" cy="195" r="16" class="blue-dark"/>
<text x="85" y="200" class="num">2</text>
<text x="115" y="199" class="label">Regel 1..N — elke regel volgt een vaste structuur</text>
<text x="115" y="216" class="sub">(herhaal deze opbouw voor iedere afzonderlijke modelleerregel)</text>
<rect x="758" y="182" width="122" height="24" rx="12" class="amber-fill"/>
<path d="M769,194 l4,4 l7,-8" fill="none" stroke="#FBFAF7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="787" y="198" class="badge-txt">VERPLICHT</text>

<text x="88" y="245" class="sub" font-style="italic">Volledig uitgewerkt voorbeeld van één regel:</text>

<!-- card 1: de regel -->
<rect x="88" y="255" width="190" height="150" rx="6" fill="#FBFAF7" stroke="#14213D" stroke-width="1"/>
<text x="100" y="275" class="card-head">DE REGEL</text>
<text x="100" y="298" class="card-txt">Elk proces heeft</text>
<text x="100" y="312" class="card-txt">precies één</text>
<text x="100" y="326" class="card-txt">startevent.</text>
<rect x="100" y="368" width="80" height="20" rx="10" class="amber-fill"/>
<text x="140" y="382" text-anchor="middle" class="badge-txt" font-size="9">Verplicht</text>

<!-- card 2: motivatie -->
<rect x="286" y="255" width="190" height="150" rx="6" fill="#FBFAF7" stroke="#14213D" stroke-width="1"/>
<text x="298" y="275" class="card-head">MOTIVATIE</text>
<text x="298" y="298" class="card-txt">Voorkomt ambiguïteit</text>
<text x="298" y="312" class="card-txt">over waar het proces</text>
<text x="298" y="326" class="card-txt">start; noodzakelijk</text>
<text x="298" y="340" class="card-txt">voor automatische</text>
<text x="298" y="354" class="card-txt">structuurvalidatie.</text>

<!-- card 3: goed voorbeeld -->
<rect x="484" y="255" width="190" height="150" rx="6" fill="#FBFAF7" stroke="#14213D" stroke-width="1"/>
<text x="496" y="275" class="card-head">GOED VOORBEELD</text>
<circle cx="502" cy="296" r="9" class="blue-dark"/>
<path d="M497,296 l3.5,4 l6,-8" fill="none" stroke="#FBFAF7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="518" y="300" class="card-txt">Eén startevent</text>
<text x="496" y="320" class="card-txt">→ duidelijk, eenduidig</text>
<text x="496" y="334" class="card-txt">toegangspunt voor het</text>
<text x="496" y="348" class="card-txt">proces.</text>

<!-- card 4: fout voorbeeld -->
<rect x="682" y="255" width="190" height="150" rx="6" fill="#FBFAF7" stroke="#14213D" stroke-width="1"/>
<text x="694" y="275" class="card-head">FOUT VOORBEELD</text>
<circle cx="700" cy="296" r="9" class="amber-fill"/>
<path d="M696,292 l8,8 M704,292 l-8,8" stroke="#FBFAF7" stroke-width="2" stroke-linecap="round"/>
<text x="716" y="300" class="card-txt">Twee startevents</text>
<text x="694" y="320" class="card-txt">zonder voorwaarde →</text>
<text x="694" y="334" class="card-txt">onduidelijk waar het</text>
<text x="694" y="348" class="card-txt">proces start.</text>

<!-- BLOK 3: Uitzonderingen -->
<rect x="60" y="440" width="840" height="60" rx="6" fill="#EEF2F7" stroke="#14213D" stroke-width="1.5"/>
<circle cx="85" cy="470" r="16" class="blue-dark"/>
<text x="85" y="475" class="num">3</text>
<text x="115" y="466" class="label">Uitzonderingen — wanneer afwijken, wie beslist</text>
<text x="115" y="483" class="sub">bevat: afwijkcriteria + wie de escalatie beoordeelt en beslist</text>
<rect x="758" y="452" width="122" height="24" rx="12" class="amber-fill"/>
<path d="M769,464 l4,4 l7,-8" fill="none" stroke="#FBFAF7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="787" y="468" class="badge-txt">VERPLICHT</text>

<!-- BLOK 4: verwijzing reviewproces -->
<rect x="60" y="520" width="840" height="60" rx="6" fill="#EEF2F7" stroke="#14213D" stroke-width="1.5"/>
<circle cx="85" cy="550" r="16" class="blue-dark"/>
<text x="85" y="555" class="num">4</text>
<text x="115" y="546" class="label">Verwijzing naar het reviewproces</text>
<text x="115" y="563" class="sub">zie deel 11.4 — reviewprotocol in BPMN-notatie</text>
<rect x="758" y="532" width="122" height="24" rx="12" class="amber-fill"/>
<path d="M769,544 l4,4 l7,-8" fill="none" stroke="#FBFAF7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="787" y="548" class="badge-txt">VERPLICHT</text>

<text x="60" y="612" class="sub">Verplicht = onmisbaar onderdeel van een volwaardige modelleerrichtlijn. Overige toevoegingen</text>
<text x="60" y="628" class="sub">(zoals een changelog of extra toelichting) zijn optioneel en niet in dit schema opgenomen.</text>
</svg>
