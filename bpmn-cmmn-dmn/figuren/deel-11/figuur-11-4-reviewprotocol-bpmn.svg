<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="'DM Sans', Arial, sans-serif" width="960" height="600" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBF6E9; }
      .sub { font-size:12px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:22px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#14213D; stroke-width:1.6; fill:none; marker-end:url(#arr); }
      .task { fill:#CBDCEF; stroke:#14213D; stroke-width:1.5; }
      .task-alt { fill:#EEF2F7; stroke:#14213D; stroke-width:1.5; }
      .task-txt { font-size:11px; font-weight:700; fill:#14213D; text-anchor:middle; }
      .gw { fill:#FBF6E9; stroke:#14213D; stroke-width:1.6; }
      .gw-txt { font-size:10px; font-weight:700; fill:#14213D; text-anchor:middle; }
      .ev-txt { font-size:10px; font-weight:600; fill:#14213D; text-anchor:middle; }
      .flow-lbl { font-size:10px; font-weight:700; fill:#2563A8; }
      .lane-txt { font-size:13px; font-weight:700; fill:#14213D; text-anchor:middle; }
      .lane-txt-sm { font-size:10.5px; font-weight:700; fill:#14213D; text-anchor:middle; }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#14213D"/></marker>
</defs>
<rect width="960" height="600" class="paper"/>
<text x="40" y="26" class="kicker">DEEL 11 · BPMN</text>
<text x="40" y="50" class="title">Het reviewprotocol als processchema (in BPMN), met de</text>
<text x="40" y="76" class="title">rolverdeling tussen peer review en inhoudelijke review.</text>

<!-- POOL -->
<rect x="50" y="100" width="870" height="470" fill="#FBFAF7" stroke="#14213D" stroke-width="2"/>
<line x1="78" y1="100" x2="78" y2="570" stroke="#14213D" stroke-width="1.3"/>
<line x1="200" y1="100" x2="200" y2="570" stroke="#14213D" stroke-width="1"/>
<line x1="50" y1="290" x2="920" y2="290" stroke="#14213D" stroke-width="1"/>
<line x1="50" y1="430" x2="920" y2="430" stroke="#14213D" stroke-width="1"/>

<text transform="rotate(-90,64,335)" x="64" y="335" text-anchor="middle" class="label">Reviewproces modelleerrichtlijn</text>

<text x="139" y="199" class="lane-txt">Modelleur</text>
<text x="139" y="364" class="lane-txt">Peer</text>
<text x="139" y="380" class="lane-txt">reviewer</text>
<text x="139" y="474" class="lane-txt-sm">Inhoudelijke</text>
<text x="139" y="490" class="lane-txt-sm">reviewer</text>
<text x="139" y="506" class="lane-txt-sm">(proceseigenaar/</text>
<text x="139" y="521" class="lane-txt-sm">vakspecialist)</text>

<!-- SEQUENCE FLOWS (drawn first, under shapes) -->
<path class="arrow" d="M240,155 L266,155"/>
<path class="arrow" d="M366,155 L392,155"/>
<path class="arrow" d="M432,155 L490,155 L490,360 L458,360"/>
<path class="arrow" d="M412,175 L412,245 L376,245"/>
<path class="arrow" d="M568,360 L594,360"/>
<path class="arrow" d="M634,360 L700,360 L700,500 L660,500"/>
<path class="arrow" d="M614,340 L614,268 L321,268"/>
<path class="arrow" d="M790,500 L816,500"/>
<path class="arrow" d="M856,500 L872,500"/>
<path class="arrow" d="M836,480 L836,222 L321,222"/>
<path class="arrow" d="M290,222 L290,178"/>

<!-- flow labels -->
<rect x="440" y="139" width="24" height="14" fill="#FBFAF7"/>
<text x="452" y="150" text-anchor="middle" class="flow-lbl">ja</text>
<rect x="414" y="200" width="30" height="14" fill="#FBFAF7"/>
<text x="429" y="211" class="flow-lbl">nee</text>
<rect x="644" y="344" width="24" height="14" fill="#FBFAF7"/>
<text x="656" y="355" text-anchor="middle" class="flow-lbl">ja</text>
<rect x="618" y="298" width="30" height="14" fill="#FBFAF7"/>
<text x="622" y="309" class="flow-lbl">nee</text>
<rect x="850" y="484" width="24" height="14" fill="#FBFAF7"/>
<text x="862" y="495" text-anchor="middle" class="flow-lbl">ja</text>
<rect x="840" y="345" width="30" height="14" fill="#FBFAF7"/>
<text x="844" y="356" class="flow-lbl">nee</text>

<!-- START EVENT -->
<circle cx="225" cy="155" r="15" fill="#FBFAF7" stroke="#14213D" stroke-width="1.5"/>
<text x="225" y="184" text-anchor="middle" class="ev-txt">Model ingediend</text>

<!-- TASK: Automatische validatie (service task) -->
<rect x="266" y="132" width="100" height="46" rx="9" class="task"/>
<g transform="translate(272,136)">
  <circle cx="6" cy="6" r="3.4" fill="none" stroke="#14213D" stroke-width="1.1"/>
  <circle cx="6" cy="6" r="1.1" fill="#14213D"/>
  <line x1="6" y1="0.5" x2="6" y2="2.2" stroke="#14213D" stroke-width="1.1"/>
  <line x1="6" y1="9.8" x2="6" y2="11.5" stroke="#14213D" stroke-width="1.1"/>
  <line x1="0.5" y1="6" x2="2.2" y2="6" stroke="#14213D" stroke-width="1.1"/>
  <line x1="9.8" y1="6" x2="11.5" y2="6" stroke="#14213D" stroke-width="1.1"/>
  <line x1="2.3" y1="2.3" x2="3.5" y2="3.5" stroke="#14213D" stroke-width="1"/>
  <line x1="8.5" y1="8.5" x2="9.7" y2="9.7" stroke="#14213D" stroke-width="1"/>
  <line x1="9.7" y1="2.3" x2="8.5" y2="3.5" stroke="#14213D" stroke-width="1"/>
  <line x1="3.5" y1="8.5" x2="2.3" y2="9.7" stroke="#14213D" stroke-width="1"/>
</g>
<text x="316" y="156" class="task-txt">Automatische</text>
<text x="316" y="170" class="task-txt">validatie</text>

<!-- GATEWAY XOR1 -->
<polygon points="412,135 432,155 412,175 392,155" class="gw"/>
<line x1="404" y1="147" x2="420" y2="163" stroke="#14213D" stroke-width="1.6"/>
<line x1="420" y1="147" x2="404" y2="163" stroke="#14213D" stroke-width="1.6"/>
<text x="412" y="122" class="gw-txt">Structureel OK?</text>

<!-- TASK: Corrigeren (user task, loop-back) -->
<rect x="266" y="222" width="110" height="46" rx="9" class="task-alt"/>
<g transform="translate(272,228)">
  <circle cx="6" cy="3.5" r="3" fill="#14213D"/>
  <path d="M0,13 C0,8 3,6.5 6,6.5 C9,6.5 12,8 12,13 Z" fill="#14213D"/>
</g>
<text x="321" y="249" class="task-txt">Corrigeren</text>

<!-- TASK: Peer review (user task) -->
<rect x="458" y="335" width="110" height="50" rx="9" class="task"/>
<g transform="translate(464,341)">
  <circle cx="6" cy="3.5" r="3" fill="#14213D"/>
  <path d="M0,13 C0,8 3,6.5 6,6.5 C9,6.5 12,8 12,13 Z" fill="#14213D"/>
</g>
<text x="513" y="356" class="task-txt">Peer review —</text>
<text x="513" y="370" class="task-txt">structuur &amp; stijl</text>

<!-- GATEWAY XOR2 -->
<polygon points="614,340 634,360 614,380 594,360" class="gw"/>
<line x1="606" y1="352" x2="622" y2="368" stroke="#14213D" stroke-width="1.6"/>
<line x1="622" y1="352" x2="606" y2="368" stroke="#14213D" stroke-width="1.6"/>
<text x="614" y="327" class="gw-txt">Akkoord?</text>

<!-- TASK: Inhoudelijke review (user task) -->
<rect x="660" y="472" width="130" height="56" rx="9" class="task"/>
<g transform="translate(666,478)">
  <circle cx="6" cy="3.5" r="3" fill="#14213D"/>
  <path d="M0,13 C0,8 3,6.5 6,6.5 C9,6.5 12,8 12,13 Z" fill="#14213D"/>
</g>
<text x="725" y="492" class="task-txt">Inhoudelijke review —</text>
<text x="725" y="506" class="task-txt">klopt het met de</text>
<text x="725" y="520" class="task-txt">werkelijkheid?</text>

<!-- GATEWAY XOR3 -->
<polygon points="836,480 856,500 836,520 816,500" class="gw"/>
<line x1="828" y1="492" x2="844" y2="508" stroke="#14213D" stroke-width="1.6"/>
<line x1="844" y1="492" x2="828" y2="508" stroke="#14213D" stroke-width="1.6"/>
<text x="836" y="467" class="gw-txt">Akkoord?</text>

<!-- END EVENT -->
<circle cx="889" cy="500" r="17" fill="#FBFAF7" stroke="#14213D" stroke-width="3.2"/>
<text x="889" y="531" text-anchor="middle" class="ev-txt">Model vastgesteld</text>
</svg>
