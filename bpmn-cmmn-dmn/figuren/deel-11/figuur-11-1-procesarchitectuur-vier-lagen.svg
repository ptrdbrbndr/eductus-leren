<rect x="133" y="523" width="14" height="14" fill="#FBFAF7" stroke="#14213D" stroke-width="1.2"/>
<line x1="140" y1="526" x2="140" y2="534" stroke="#14213D" stroke-width="1.2"/>
<line x1="136" y1="530" x2="144" y2="530" stroke="#14213D" stroke-width="1.2"/>

<text x="920" y="558" text-anchor="end" class="note">Vierde laag alleen waar nodig — vuistregel: &gt;20–30</text>
<text x="920" y="574" text-anchor="end" class="note">elementen per proces.</text>
