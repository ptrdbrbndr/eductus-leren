<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:22px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .blk { stroke:#14213D; stroke-width:1.5; }
      .lbl-sm { font-size:10.5px; font-weight:700; fill:#14213D; text-anchor:middle; }
      .lbl-sm-light { font-size:10.5px; font-weight:700; fill:#FBFAF7; text-anchor:middle; }
      .rowlabel { font-size:11px; font-weight:700; fill:#55606F; letter-spacing:.05em; }
      .note { font-size:11.5px; fill:#55606F; font-style:italic; }
      .zoomline { stroke:#E9A13B; stroke-width:1.4; stroke-dasharray:5,4; fill:none; }
      .zoomfill { fill:#E9A13B; opacity:.09; }
      .hl { stroke:#E9A13B; stroke-width:2.5; }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
</defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="26" class="kicker">DEEL 11 · CONCEPTDIAGRAM</text>
<text x="40" y="50" class="title">Procesarchitectuur Meridiaan in vier lagen, met het</text>
<text x="40" y="76" class="title">Mutatieplatform-domein uitgewerkt.</text>

<!-- zoom funnels (drawn first, behind blocks) -->
<polygon class="zoomfill" points="474,144 598,144 889,250 183,250"/>
<line class="zoomline" x1="474" y1="144" x2="183" y2="250"/>
<line class="zoomline" x1="598" y1="144" x2="889" y2="250"/>

<polygon class="zoomfill" points="183,294 313,294 429,370 67,370"/>
<line class="zoomline" x1="183" y1="294" x2="67" y2="370"/>
