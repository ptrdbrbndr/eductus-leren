<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 680" font-family="'DM Sans', Arial, sans-serif" width="980" height="680" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .panel { fill:#FFFFFF; stroke:#E3E0D8; stroke-width:1.5; }
      .zoneA { fill:#EEF2F7; }
      .zoneB { fill:#CFE0F2; }
      .zoneC { fill:#FBF6E9; }
      .axis { stroke:#14213D; stroke-width:1.8; marker-end:url(#arrnavy); }
      .gridline { stroke:#E3E0D8; stroke-width:1; }
      .diagonal { stroke:#2563A8; stroke-width:1.6; stroke-dasharray:6 4; fill:none; }
      .axislabel { font-size:12px; font-weight:700; fill:#55606F; }
      .zonelabel { font-size:12.5px; font-weight:700; fill:#14213D; }
      .zonesub { font-size:10.5px; fill:#55606F; }
      .dept { fill:#2563A8; stroke:#14213D; stroke-width:1.4; }
      .deptwarn { fill:#E9A13B; stroke:#14213D; stroke-width:1.6; }
      .deptlabel { font-size:12px; font-weight:700; fill:#14213D; }
      .deptsub { font-size:10.5px; fill:#55606F; }
      .badge-live { fill:#2563A8; }
      .badge-legacy { fill:#8a8478; }
      .badgetext { font-size:9px; fill:#FBFAF7; font-weight:700; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .sub { font-size:12px; fill:#55606F; }
      .warntext { font-size:11px; fill:#8a5a12; font-style:italic; }
      .warnarrow { stroke:#8a5a12; stroke-width:1.4; stroke-dasharray:3 3; fill:none; marker-end:url(#arramber); }
      .callout { fill:#FFFFFF; stroke:#14213D; stroke-width:1.2; }
      .calltext { font-size:10.5px; fill:#14213D; }
    </style>
    <marker id="arrnavy" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#14213D"/></marker>
    <marker id="arramber" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8a5a12"/></marker>
</defs>
<rect width="980" height="680" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 28 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Figuur 28.4 — Autonomie per werktype, vijf afdelingen van Meridiaan</text>
<text x="40" y="84" class="sub">Verticaal: onzekerheid van het werk. Horizontaal: passende autonomie. De juiste combinatie ligt op de diagonaal (§28.5).</text>

<!-- main panel -->
<rect x="150" y="110" width="760" height="480" class="panel" rx="4"/>

<!-- background zones (BPMN / CMMN / ACM banden, diagonaal) -->
<polygon points="150,590 150,430 470,110 630,110 150,590" class="zoneA" opacity="0.6"/>
<polygon points="470,110 630,110 910,390 910,590 310,590" class="zoneB" opacity="0.5"/>
<polygon points="630,110 910,110 910,390" class="zoneC" opacity="0.6"/>

<!-- diagonal: passende band -->
<path d="M170,570 L890,130" class="diagonal"/>

<!-- axes -->
<line x1="150" y1="590" x2="150" y2="105" class="axis"/>
<line x1="150" y1="590" x2="915" y2="590" class="axis"/>
<text x="145" y="98" class="axislabel" text-anchor="middle">hoog</text>
<text x="145" y="605" class="axislabel" text-anchor="middle">laag</text>
<text x="55" y="350" class="axislabel" transform="rotate(-90 55 350)">ONZEKERHEID VAN HET WERK</text>
<text x="170" y="618" class="axislabel">weinig</text>
<text x="860" y="618" class="axislabel">veel</text>
<text x="530" y="640" class="axislabel" text-anchor="middle">PASSENDE AUTONOMIE</text>

<!-- zone labels -->
<text x="230" y="500" class="zonelabel">BPMN</text>
<text x="230" y="516" class="zonesub">strak gestuurd</text>
<text x="470" y="330" class="zonelabel">CMMN</text>
<text x="470" y="346" class="zonesub">keuzevrijheid binnen structuur</text>
<text x="740" y="200" class="zonelabel">ACM</text>
<text x="740" y="216" class="zonesub">kenniswerker ontwerpt zelf</text>

<!-- departments on the diagonal -->
<!-- Deelnemermutaties -->
<g transform="translate(230,540)">
  <circle r="13" class="dept"/>
  <rect x="-9" y="-30" width="18" height="14" rx="3" class="badge-live"/>
  <text x="0" y="-19.5" class="badgetext" text-anchor="middle">MP</text>
  <text x="0" y="30" class="deptlabel" text-anchor="middle">Deelnemermutaties</text>
  <text x="0" y="45" class="deptsub" text-anchor="middle">hoge herhaling, lage onzekerheid</text>
</g>

<!-- Uitkeringen -->
<g transform="translate(320,478)">
  <circle r="13" class="dept"/>
  <rect x="-9" y="-30" width="18" height="14" rx="3" class="badge-live"/>
  <text x="0" y="-19.5" class="badgetext" text-anchor="middle">MP</text>
  <text x="0" y="30" class="deptlabel" text-anchor="middle">Uitkeringen</text>
  <text x="0" y="45" class="deptsub" text-anchor="middle">gestandaardiseerd, BPMN</text>
</g>

<!-- Waardeoverdracht -->
<g transform="translate(430,405)">
  <circle r="13" class="dept"/>
  <rect x="-9" y="-30" width="18" height="14" rx="3" class="badge-live"/>
  <text x="0" y="-19.5" class="badgetext" text-anchor="middle">MP</text>
  <text x="0" y="30" class="deptlabel" text-anchor="middle">Waardeoverdracht</text>
  <text x="0" y="45" class="deptsub" text-anchor="middle">grens BPMN/CMMN</text>
</g>

<!-- Klachten & Bezwaren -->
<g transform="translate(590,270)">
  <circle r="14" class="dept"/>
  <rect x="-30" y="-32" width="60" height="14" rx="3" class="badge-legacy"/>
  <text x="0" y="-21.5" class="badgetext" text-anchor="middle">LEGACY</text>
  <text x="0" y="32" class="deptlabel" text-anchor="middle">Klachten &amp; Bezwaren</text>
  <text x="0" y="47" class="deptsub" text-anchor="middle">beperkte onzekerheid, herkenbaar patroon</text>
</g>

<!-- Bijzondere Situaties -->
<g transform="translate(790,170)">
  <circle r="15" class="deptwarn"/>
  <rect x="-30" y="-34" width="60" height="14" rx="3" class="badge-legacy"/>
  <text x="0" y="-23.5" class="badgetext" text-anchor="middle">LEGACY</text>
  <text x="0" y="34" class="deptlabel" text-anchor="middle">Bijzondere Situaties</text>
  <text x="0" y="49" class="deptsub" text-anchor="middle">hoge, structurele onzekerheid</text>
</g>

<!-- waarschuwing: geforceerd in verkeerd vak -->
<g>
  <path d="M790,190 C 720,270 560,420 340,500" class="warnarrow"/>
  <rect x="330" y="500" width="230" height="42" rx="6" class="callout" stroke="#E9A13B"/>
  <text x="340" y="516" class="warntext" font-weight="700">niet doen:</text>
  <text x="340" y="532" class="calltext">Bijzondere Situaties in een strak</text>
  <text x="340" y="544" class="calltext" font-size="9.5">gestuurd proces persen (§28.5)</text>
</g>

<!-- legend -->
<rect x="720" y="440" width="180" height="72" rx="6" class="callout"/>
<rect x="734" y="452" width="18" height="14" rx="3" class="badge-live"/>
<text x="758" y="463" class="calltext">MP — live op Mutatieplatform</text>
<rect x="734" y="474" width="18" height="14" rx="3" class="badge-legacy"/>
<text x="758" y="485" class="calltext">LEGACY — nog niet gemigreerd</text>
<line x1="734" y1="500" x2="752" y2="500" class="diagonal"/>
<text x="758" y="503" class="calltext">band van passende autonomie</text>

</svg>
