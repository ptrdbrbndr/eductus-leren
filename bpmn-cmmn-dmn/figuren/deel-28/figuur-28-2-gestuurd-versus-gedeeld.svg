<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 660" font-family="'DM Sans', Arial, sans-serif" width="980" height="660" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .navy { fill:#14213D; }
      .blue-dark { fill:#2563A8; }
      .blue-fill { fill:#CFE0F2; }
      .amber-fill { fill:#E9A13B; }
      .amber-light { fill:#FBF6E9; }
      .neutral-light { fill:#EEF2F7; }
      .card-body { fill:#FFFFFF; }
      .label { font-size:15px; font-weight:700; fill:#14213D; }
      .label-light { font-size:16px; font-weight:700; fill:#FBFAF7; text-anchor:middle; }
      .body { font-size:12.5px; fill:#14213D; }
      .sub { font-size:12px; fill:#55606F; }
      .tag { font-size:11px; fill:#55606F; font-style:italic; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .mkicker { font-size:10.5px; fill:#2563A8; font-weight:700; letter-spacing:.08em; }
      .tasklabel { font-size:11.5px; fill:#14213D; }
      .num { font-size:11px; font-weight:700; fill:#FBFAF7; }
      .sentry { fill:#FFFFFF; stroke:#14213D; stroke-width:1.3; }
      .discretionary { fill:#FFFFFF; stroke:#55606F; stroke-width:1.2; stroke-dasharray:4 3; }
      .milestone { fill:#CFE0F2; stroke:#14213D; stroke-width:1.3; }
      .conn { stroke:#8a8478; stroke-width:1.1; fill:none; stroke-dasharray:3 3; }
      .person { stroke:#14213D; stroke-width:1.2; fill:none; }
      .doc { fill:#FFFFFF; stroke:#14213D; stroke-width:1.2; }
    </style>
</defs>
<rect width="980" height="660" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 28 · CONCEPT- EN NOTATIEDIAGRAM</text>
<text x="40" y="64" class="title">Figuur 28.2 — Het dossier: gestuurde structuur of gedeelde werkruimte</text>
<text x="40" y="84" class="sub">Zelfde soort dossier, twee fundamenteel verschillende manieren om het te ondersteunen (§28.2).</text>

<!-- ===================== LINKS: CMMN — GESTUURDE STRUCTUUR ===================== -->
<g>
  <rect x="40" y="112" width="440" height="500" rx="12" class="card-body" stroke="#14213D" stroke-width="1.5"/>
  <rect x="40" y="112" width="440" height="46" rx="12" class="navy"/>
  <rect x="40" y="134" width="440" height="24" class="navy"/>
  <text x="260" y="141" class="label-light">Gestuurde structuur — CMMN</text>
  <text x="260" y="182" class="sub" text-anchor="middle">een casemodel: vaste set handelingen, volgorde vrij</text>

  <!-- CMMN Stage notation: folder tab + rounded rect -->
  <g transform="translate(90,200)">
    <rect x="0" y="-10" width="70" height="16" rx="2" fill="#FBFAF7" stroke="#14213D" stroke-width="1.3"/>
    <rect x="0" y="0" width="360" height="370" rx="10" class="neutral-light" stroke="#14213D" stroke-width="1.6"/>
    <text x="14" y="24" class="body" font-weight="700">Dossier Bijzondere Situaties</text>

    <!-- sentry entry op boundary bovenaan -->
    <rect x="-6" y="52" width="11" height="11" class="sentry" transform="rotate(45 -0.5 57.5)"/>

    <!-- human task 1 -->
    <g transform="translate(24,44)">
      <rect x="0" y="0" width="312" height="42" rx="8" fill="#FFFFFF" stroke="#14213D" stroke-width="1.3"/>
      <circle cx="18" cy="14" r="6" fill="none" stroke="#14213D" stroke-width="1.1"/>
      <path d="M9,32 a9,9 0 0 1 18,0" fill="none" stroke="#14213D" stroke-width="1.1"/>
      <circle cx="288" cy="21" r="10" class="blue-fill" stroke="#14213D" stroke-width="1"/>
      <text x="288" y="25" class="num" fill="#14213D" text-anchor="middle">1</text>
      <text x="36" y="26" class="tasklabel">Dossier openen en categoriseren</text>
    </g>

    <!-- sentry tussen 1 en 2 -->
    <rect x="212" y="90" width="11" height="11" class="sentry" transform="rotate(45 217.5 95.5)"/>

    <!-- human task 2 -->
    <g transform="translate(24,108)">
      <rect x="0" y="0" width="312" height="42" rx="8" fill="#FFFFFF" stroke="#14213D" stroke-width="1.3"/>
      <circle cx="18" cy="14" r="6" fill="none" stroke="#14213D" stroke-width="1.1"/>
      <path d="M9,32 a9,9 0 0 1 18,0" fill="none" stroke="#14213D" stroke-width="1.1"/>
      <circle cx="288" cy="21" r="10" class="blue-fill" stroke="#14213D" stroke-width="1"/>
      <text x="288" y="25" class="num" fill="#14213D" text-anchor="middle">2</text>
      <text x="36" y="26" class="tasklabel">Beoordelen tegen discretionary items</text>
    </g>

    <!-- discretionary item (dashed) -->
    <g transform="translate(24,172)">
      <rect x="0" y="0" width="312" height="42" rx="8" class="discretionary"/>
      <circle cx="18" cy="14" r="6" fill="none" stroke="#55606F" stroke-width="1.1"/>
      <path d="M9,32 a9,9 0 0 1 18,0" fill="none" stroke="#55606F" stroke-width="1.1"/>
      <text x="36" y="26" class="tasklabel" fill="#55606F">Discretionary item: extra advies inwinnen</text>
    </g>

    <!-- human task 3 -->
    <g transform="translate(24,236)">
      <rect x="0" y="0" width="312" height="42" rx="8" fill="#FFFFFF" stroke="#14213D" stroke-width="1.3"/>
      <circle cx="18" cy="14" r="6" fill="none" stroke="#14213D" stroke-width="1.1"/>
      <path d="M9,32 a9,9 0 0 1 18,0" fill="none" stroke="#14213D" stroke-width="1.1"/>
      <circle cx="288" cy="21" r="10" class="blue-fill" stroke="#14213D" stroke-width="1"/>
      <text x="288" y="25" class="num" fill="#14213D" text-anchor="middle">3</text>
      <text x="36" y="26" class="tasklabel">Besluit vastleggen en communiceren</text>
    </g>

    <!-- milestone -->
    <g transform="translate(90,302)">
      <path d="M0,20 a80,20 0 0 1 160,0 a80,20 0 0 1 -160,0 z" class="milestone"/>
      <text x="80" y="24" class="tasklabel" text-anchor="middle" font-weight="700">Dossier afgerond</text>
    </g>

    <text x="14" y="352" class="tag">discretionary items en sentries: deel 17, §17.1 en §17.3</text>
  </g>
</g>

<!-- ===================== RECHTS: ACM — GEDEELDE WERKRUIMTE ===================== -->
<g>
  <rect x="500" y="112" width="440" height="500" rx="12" class="card-body" stroke="#E9A13B" stroke-width="1.5"/>
  <rect x="500" y="112" width="440" height="46" rx="12" class="amber-fill"/>
  <rect x="500" y="134" width="440" height="24" class="amber-fill"/>
  <text x="720" y="141" class="label-light" fill="#14213D">Gedeelde werkruimte — ACM</text>
  <text x="720" y="182" class="sub" text-anchor="middle">geen vooraf bekende set handelingen, geen vaste volgorde</text>

  <g transform="translate(720,380)">
    <!-- behandelaar in het midden -->
    <circle cx="0" cy="0" r="30" class="amber-light" stroke="#14213D" stroke-width="1.4"/>
    <circle cx="0" cy="-8" r="8" class="person"/>
    <path d="M-13,16 a13,13 0 0 1 26,0" class="person"/>
    <text x="0" y="46" class="tag" text-anchor="middle">behandelaar bepaalt zelf de volgende stap</text>

    <!-- documenten, notities, communicatie: gelijkwaardig, los verbonden -->
    <g transform="translate(-160,-140)">
      <rect x="-24" y="-16" width="48" height="34" rx="4" class="doc"/>
      <path d="M-14,-8 h28 M-14,0 h28 M-14,8 h18" stroke="#14213D" stroke-width="1"/>
      <text x="0" y="34" class="tag" text-anchor="middle">document</text>
    </g>
    <g transform="translate(150,-150)">
      <circle cx="0" cy="0" r="22" class="doc"/>
      <path d="M-10,-4 h20 M-10,4 h14" stroke="#14213D" stroke-width="1"/>
      <text x="0" y="38" class="tag" text-anchor="middle">notitie</text>
    </g>
    <g transform="translate(-170,110)">
      <path d="M-24,-16 h48 a6,6 0 0 1 6,6 v18 a6,6 0 0 1 -6,6 h-32 l-14,12 v-12 h-2 a6,6 0 0 1 -6,-6 v-18 a6,6 0 0 1 6,-6 z" class="doc"/>
      <text x="0" y="40" class="tag" text-anchor="middle">communicatie</text>
    </g>
    <g transform="translate(165,120)">
      <rect x="-26" y="-16" width="52" height="34" rx="4" class="doc"/>
      <circle cx="-12" cy="0" r="3" fill="#14213D"/>
      <circle cx="0" cy="0" r="3" fill="#14213D"/>
      <circle cx="12" cy="0" r="3" fill="#14213D"/>
      <text x="0" y="38" class="tag" text-anchor="middle">eerdere stappen</text>
    </g>
    <g transform="translate(0,-190)">
      <rect x="-30" y="-14" width="60" height="28" rx="14" class="doc"/>
      <text x="0" y="5" class="tag" text-anchor="middle">precedent</text>
    </g>

    <!-- losse, niet-hierarchische verbindingen: alles bereikbaar, geen vaste route -->
    <path d="M-30,-8 L-140,-124" class="conn"/>
    <path d="M25,-15 L140,-134" class="conn"/>
    <path d="M-25,15 L-150,100" class="conn"/>
    <path d="M25,18 L145,108" class="conn"/>
    <path d="M-5,-28 L-2,-176" class="conn"/>
    <path d="M-140,-140 L150,-150" class="conn"/>
    <path d="M-160,100 L155,115" class="conn"/>
  </g>

  <text x="520" y="580" class="tag">geen enkel element is "de volgende stap" — dat bepaalt de kenniswerker (§28.2)</text>
</g>

</svg>
