<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 480" font-family="'DM Sans', Arial, sans-serif" width="980" height="480" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .navy { fill:#14213D; }
      .blue-dark { fill:#2563A8; }
      .blue-fill { fill:#CFE0F2; }
      .amber-fill { fill:#E9A13B; }
      .amber-light { fill:#FBF6E9; }
      .neutral-light { fill:#EEF2F7; }
      .card-body { fill:#FFFFFF; }
      .label { font-size:14.5px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; text-anchor:middle; }
      .body { font-size:12px; fill:#14213D; }
      .sub { font-size:11.5px; fill:#55606F; }
      .tag { font-size:11px; fill:#55606F; font-style:italic; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .stepnum { font-size:13px; font-weight:700; fill:#FBFAF7; }
      .arrow { stroke:#14213D; stroke-width:1.8; fill:none; marker-end:url(#arrnavy); }
      .person { stroke:#14213D; stroke-width:1.3; fill:none; }
      .doc { fill:#FFFFFF; stroke:#14213D; stroke-width:1.3; }
      .banner { fill:#FBF6E9; stroke:#E9A13B; stroke-width:1.4; }
      .bannertext { font-size:13px; fill:#8a5a12; font-weight:700; }
    </style>
    <marker id="arrnavy" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#14213D"/></marker>
</defs>
<rect width="980" height="480" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 28 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Figuur 28.3 — Een precedentmechanisme</text>
<text x="40" y="84" class="sub">Van eerdere aanpak naar zichtbare suggestie — structuur die suggereert, niet voorschrijft (§28.3).</text>

<!-- STAP 1 -->
<g transform="translate(70,130)">
  <rect x="0" y="0" width="250" height="240" rx="12" class="card-body" stroke="#CFE0F2" stroke-width="1.5"/>
  <circle cx="26" cy="26" r="16" class="blue-dark"/>
  <text x="26" y="31" class="stepnum" text-anchor="middle">1</text>
  <text x="52" y="31" class="label">Eerdere behandeling vastgelegd</text>

  <g transform="translate(125,120)">
    <rect x="-40" y="-45" width="80" height="90" rx="6" class="doc"/>
    <path d="M-26,-25 h52 M-26,-9 h52 M-26,7 h52 M-26,23 h34" stroke="#14213D" stroke-width="1.1"/>
    <circle cx="30" cy="30" r="16" class="blue-fill" stroke="#14213D" stroke-width="1.3"/>
    <path d="M22,30 l6,6 l12,-13" fill="none" stroke="#14213D" stroke-width="2"/>
  </g>
  <text x="125" y="212" class="sub" text-anchor="middle">wat een behandelaar deed bij een</text>
  <text x="125" y="228" class="sub" text-anchor="middle">vergelijkbaar eerder dossier</text>
</g>
<path d="M322,250 L378,250" class="arrow"/>

<!-- STAP 2 -->
<g transform="translate(380,130)">
  <rect x="0" y="0" width="250" height="240" rx="12" class="card-body" stroke="#CFE0F2" stroke-width="1.5"/>
  <circle cx="26" cy="26" r="16" class="blue-dark"/>
  <text x="26" y="31" class="stepnum" text-anchor="middle">2</text>
  <text x="52" y="31" class="label">Precedent zichtbaar gemaakt</text>

  <g transform="translate(125,120)">
    <path d="M0,-30 C 30,-30 42,-6 42,10 C 42,30 22,40 0,40 C -22,40 -42,30 -42,10 C -42,-6 -30,-30 0,-30 Z" class="amber-light" stroke="#14213D" stroke-width="1.3"/>
    <circle cx="0" cy="4" r="14" fill="#FFFFFF" stroke="#14213D" stroke-width="1.2"/>
    <circle cx="0" cy="4" r="6" class="amber-fill" stroke="#14213D" stroke-width="1"/>
  </g>
  <text x="125" y="212" class="sub" text-anchor="middle">gekoppeld aan een vergelijkbaar</text>
  <text x="125" y="228" class="sub" text-anchor="middle">nieuw dossier — zichtbaar, niet verstopt</text>
</g>
<path d="M632,250 L688,250" class="arrow"/>

<!-- STAP 3 -->
<g transform="translate(690,130)">
  <rect x="0" y="0" width="250" height="240" rx="12" class="card-body" stroke="#E9A13B" stroke-width="1.5"/>
  <circle cx="26" cy="26" r="16" class="amber-fill"/>
  <text x="26" y="31" class="stepnum" fill="#14213D" text-anchor="middle">3</text>
  <text x="52" y="31" class="label">Suggestie aan volgende behandelaar</text>

  <g transform="translate(125,120)">
    <circle cx="-20" cy="10" r="16" fill="none" stroke="#14213D" stroke-width="1.3"/>
    <path d="M-36,42 a16,16 0 0 1 32,0" fill="none" stroke="#14213D" stroke-width="1.3"/>
    <path d="M6,-30 h58 a8,8 0 0 1 8,8 v26 a8,8 0 0 1 -8,8 h-38 l-14,14 v-14 h-6 a8,8 0 0 1 -8,-8 v-26 a8,8 0 0 1 8,-8 z"
          fill="#FFFFFF" stroke="#55606F" stroke-width="1.3" stroke-dasharray="4 3"/>
    <text x="35" y="-8" class="sub" text-anchor="middle">suggestie</text>
  </g>
  <text x="125" y="212" class="sub" text-anchor="middle">informatie, geen voorschrift —</text>
  <text x="125" y="228" class="sub" text-anchor="middle">afwijken is geen fout</text>
</g>

<!-- banner -->
<rect x="70" y="410" width="870" height="46" rx="8" class="banner"/>
<text x="505" y="438" class="bannertext" text-anchor="middle">Nadrukkelijk niet verplicht — het verschil tussen deze suggestie en een regel is het verschil tussen ACM en een (informeel) CMMN-model</text>

</svg>
