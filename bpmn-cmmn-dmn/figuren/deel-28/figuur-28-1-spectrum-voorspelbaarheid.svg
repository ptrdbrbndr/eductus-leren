<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 660" font-family="'DM Sans', Arial, sans-serif" width="980" height="660" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .navy { fill:#14213D; }
      .blue-dark { fill:#2563A8; }
      .blue-fill { fill:#CFE0F2; }
      .blue-mid { fill:#6FA3D6; }
      .amber-fill { fill:#E9A13B; }
      .amber-light { fill:#FBF6E9; }
      .neutral-light { fill:#EEF2F7; }
      .card-body { fill:#FFFFFF; }
      .label { font-size:15px; font-weight:700; fill:#14213D; }
      .label-light { font-size:15px; font-weight:700; fill:#FBFAF7; text-anchor:middle; }
      .body { font-size:12px; fill:#14213D; }
      .sub { font-size:12px; fill:#55606F; }
      .tag { font-size:11px; fill:#55606F; font-style:italic; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .mkicker { font-size:10.5px; fill:#2563A8; font-weight:700; letter-spacing:.08em; }
      .quote { font-size:12.5px; fill:#14213D; font-style:italic; }
      .arrow { stroke:#55606F; stroke-width:1.6; fill:none; marker-end:url(#arr); }
      .arrow2 { stroke:#14213D; stroke-width:1.4; fill:none; marker-end:url(#arrnavy); }
      .dashed { stroke:#8a5a12; stroke-width:1.3; fill:none; stroke-dasharray:4 3; }
      .sentry { fill:#FFFFFF; stroke:#14213D; stroke-width:1.3; }
      .axisline { stroke:#14213D; stroke-width:2; marker-end:url(#arrnavy); }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrnavy" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#14213D"/></marker>
</defs>
<rect width="980" height="660" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 28 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Figuur 28.1 — Het spectrum van voorspelbaarheid</text>
<text x="40" y="84" class="sub">BPMN, CMMN en ACM zijn geen concurrerende talen, maar antwoorden op een andere mate van onzekerheid.</text>

<!-- axis -->
<line x1="60" y1="112" x2="920" y2="112" class="axisline"/>
<text x="60" y="104" class="sub">← volledig voorspelbaar</text>
<text x="920" y="104" class="sub" text-anchor="end">volledig onvoorspelbaar →</text>

<!-- ===================== KOLOM 1: BPMN ===================== -->
<g>
  <rect x="40" y="140" width="280" height="480" rx="12" class="card-body" stroke="#CFE0F2" stroke-width="1.5"/>
  <rect x="40" y="140" width="280" height="46" rx="12" class="blue-dark"/>
  <rect x="40" y="162" width="280" height="24" class="blue-dark"/>
  <text x="180" y="169" class="label-light">BPMN</text>

  <!-- icoon: sequence flow met taken -->
  <g transform="translate(180,240)">
    <circle cx="-96" cy="0" r="9" fill="none" stroke="#14213D" stroke-width="1.4"/>
    <rect x="-72" y="-14" width="46" height="28" rx="6" class="blue-fill" stroke="#14213D" stroke-width="1.2"/>
    <path d="M-26,0 L-2,0" class="arrow2"/>
    <rect x="0" y="-14" width="46" height="28" rx="6" class="blue-fill" stroke="#14213D" stroke-width="1.2"/>
    <path d="M46,0 L70,0" class="arrow2"/>
    <circle cx="90" cy="0" r="10" fill="none" stroke="#14213D" stroke-width="2.6"/>
  </g>
  <text x="180" y="284" class="sub" text-anchor="middle">vaste volgorde, vaste taken</text>

  <text x="60" y="318" class="body">De volgorde ligt vast en de</text>
  <text x="60" y="336" class="body">beschikbare stappen liggen vast.</text>
  <text x="60" y="354" class="body">Hoge herhaling, lage onzekerheid.</text>
  <text x="60" y="372" class="body">Autonomie: weinig (§28.5).</text>

  <rect x="60" y="520" width="240" height="78" rx="8" class="neutral-light" stroke="#14213D" stroke-width="1"/>
  <text x="76" y="542" class="mkicker">MERIDIAAN PENSIOEN</text>
  <text x="76" y="564" class="body" font-weight="700">Deelnemermutaties</text>
  <text x="76" y="582" class="tag">live op het Mutatieplatform</text>
</g>

<!-- ===================== KOLOM 2: CMMN ===================== -->
<g>
  <rect x="350" y="140" width="280" height="480" rx="12" class="card-body" stroke="#14213D" stroke-width="1.5"/>
  <rect x="350" y="140" width="280" height="46" rx="12" class="navy"/>
  <rect x="350" y="162" width="280" height="24" class="navy"/>
  <text x="490" y="169" class="label-light">CMMN</text>

  <!-- icoon: stage met sentries -->
  <g transform="translate(490,240)">
    <rect x="-58" y="-28" width="24" height="12" rx="2" fill="#FBFAF7" stroke="#14213D" stroke-width="1.3"/>
    <rect x="-58" y="-24" width="116" height="60" rx="8" class="neutral-light" stroke="#14213D" stroke-width="1.4"/>
    <rect x="-46" y="-10" width="42" height="18" rx="5" fill="#FFFFFF" stroke="#14213D" stroke-width="1.1"/>
    <circle cx="-40" cy="-13.5" r="3" fill="none" stroke="#14213D" stroke-width="0.9"/>
    <rect x="4" y="-10" width="42" height="18" rx="5" fill="#FFFFFF" stroke="#14213D" stroke-width="1.1"/>
    <circle cx="10" cy="-13.5" r="3" fill="none" stroke="#14213D" stroke-width="0.9"/>
    <rect x="-2" y="-32" width="9" height="9" class="sentry" transform="rotate(45 2.5 -27.5)"/>
    <rect x="52" y="4" width="9" height="9" class="sentry" transform="rotate(45 56.5 8.5)"/>
  </g>
  <text x="490" y="284" class="sub" text-anchor="middle">volgorde vrij, handelingen vast</text>

  <text x="370" y="318" class="body">De volgorde ligt niet vast, maar</text>
  <text x="370" y="336" class="body">de beschikbare handelingen wel:</text>
  <text x="370" y="354" class="body">een vaste set discretionary items</text>
  <text x="370" y="372" class="body">waaruit gekozen wordt (§28.1).</text>
  <text x="370" y="390" class="body">Autonomie: CMMN-achtige</text>
  <text x="370" y="408" class="body">keuzevrijheid (§28.5).</text>

  <rect x="370" y="520" width="240" height="78" rx="8" class="neutral-light" stroke="#14213D" stroke-width="1"/>
  <text x="386" y="542" class="mkicker">MERIDIAAN PENSIOEN</text>
  <text x="386" y="564" class="body" font-weight="700">Klachten &amp; Bezwaren</text>
  <text x="386" y="582" class="tag">nog op het legacy-landschap</text>
</g>

<!-- ===================== KOLOM 3: ACM ===================== -->
<g>
  <rect x="660" y="140" width="280" height="480" rx="12" class="card-body" stroke="#E9A13B" stroke-width="1.5"/>
  <rect x="660" y="140" width="280" height="46" rx="12" class="amber-fill"/>
  <rect x="660" y="162" width="280" height="24" class="amber-fill"/>
  <text x="800" y="169" class="label-light" fill="#14213D">ACM</text>

  <!-- icoon: los netwerk zonder vaste structuur -->
  <g transform="translate(800,240)">
    <circle cx="-60" cy="-14" r="9" class="amber-light" stroke="#14213D" stroke-width="1.1"/>
    <circle cx="-10" cy="-26" r="9" class="amber-light" stroke="#14213D" stroke-width="1.1"/>
    <circle cx="42" cy="-8" r="9" class="amber-light" stroke="#14213D" stroke-width="1.1"/>
    <circle cx="-30" cy="20" r="9" class="amber-light" stroke="#14213D" stroke-width="1.1"/>
    <circle cx="26" cy="24" r="9" class="amber-light" stroke="#14213D" stroke-width="1.1"/>
    <path d="M-53,-16 L-18,-24" class="dashed"/>
    <path d="M-2,-22 L34,-11" class="dashed"/>
    <path d="M-56,-7 L-33,13" class="dashed"/>
    <path d="M-23,25 L18,25" class="dashed"/>
    <path d="M35,-2 L28,16" class="dashed"/>
    <path d="M-52,-19 L-27,17" class="dashed"/>
  </g>
  <text x="800" y="284" class="sub" text-anchor="middle">geen vaste structuur, geen vaste set</text>

  <text x="680" y="318" class="body">Ook de beschikbare handelingen</text>
  <text x="680" y="336" class="body">liggen niet vast — de kenniswerker</text>
  <text x="680" y="354" class="body">ontwerpt zijn eigen traject (§28.2).</text>
  <text x="680" y="372" class="body">Autonomie: hoog, structureel</text>
  <text x="680" y="390" class="body">onzeker werk (§28.5).</text>

  <rect x="680" y="520" width="240" height="78" rx="8" class="neutral-light" stroke="#14213D" stroke-width="1"/>
  <text x="696" y="542" class="mkicker">MERIDIAAN PENSIOEN</text>
  <text x="696" y="564" class="body" font-weight="700">Bijzondere Situaties</text>
  <text x="696" y="582" class="tag">meest uitzonderlijke dossiers (§28.1)</text>
</g>

<!-- verbindende quote tussen CMMN en ACM -->
<g>
  <path d="M490,144 C 490,110 800,110 800,144" fill="none" stroke="#8a5a12" stroke-width="1.2" stroke-dasharray="3,3"/>
  <rect x="470" y="94" width="340" height="16" fill="#FBFAF7"/>
  <text x="640" y="106" class="quote" text-anchor="middle">"de volgorde ligt niet vast" (CMMN) → "de handelingen liggen niet vast" (ACM)</text>
</g>

</svg>
