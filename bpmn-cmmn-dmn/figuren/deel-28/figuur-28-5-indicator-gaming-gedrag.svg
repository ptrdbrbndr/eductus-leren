<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="'DM Sans', Arial, sans-serif" width="980" height="560" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .navy { fill:#14213D; }
      .blue-dark { fill:#2563A8; }
      .blue-fill { fill:#CFE0F2; }
      .amber-fill { fill:#E9A13B; }
      .amber-light { fill:#FBF6E9; }
      .neutral-light { fill:#EEF2F7; }
      .card-body { fill:#FFFFFF; }
      .label { font-size:13px; font-weight:700; fill:#14213D; }
      .body { font-size:12px; fill:#14213D; }
      .sub { font-size:11.5px; fill:#55606F; }
      .tag { font-size:10.5px; fill:#55606F; font-style:italic; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .colhead { font-size:11px; font-weight:700; fill:#55606F; letter-spacing:.08em; }
      .arrow { stroke:#8a5a12; stroke-width:1.8; fill:none; marker-end:url(#arramber); }
      .banner { fill:#FBF6E9; stroke:#E9A13B; stroke-width:1.4; }
      .bannertext { font-size:13px; fill:#8a5a12; font-weight:700; }
    </style>
    <marker id="arramber" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8a5a12"/></marker>
</defs>
<rect width="980" height="560" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 28 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Figuur 28.5 — Een indicator en het gedrag dat hij uitlokt</text>
<text x="40" y="84" class="sub">Elke indicator die gemeten wordt, kan gespeeld worden (§28.6) — drie voorbeelden bij kenniswerk.</text>

<text x="200" y="112" class="colhead">INDICATOR</text>
<text x="700" y="112" class="colhead">MOGELIJK ONGEWENST GEDRAG</text>

<!-- RIJ 1 -->
<g transform="translate(0,130)">
  <rect x="70" y="0" width="300" height="88" rx="10" class="card-body" stroke="#CFE0F2" stroke-width="1.5"/>
  <g transform="translate(105,44)">
    <circle r="24" fill="none" stroke="#14213D" stroke-width="2"/>
    <path d="M-14,10 A18,18 0 0 1 14,10" fill="none" stroke="#14213D" stroke-width="2"/>
    <path d="M0,0 L10,-14" stroke="#14213D" stroke-width="2.2"/>
    <circle r="3" fill="#14213D"/>
  </g>
  <text x="140" y="34" class="label">Aantal afgehandelde dossiers</text>
  <text x="140" y="50" class="label">per week</text>
  <text x="140" y="70" class="tag">meet volume, niet zorgvuldigheid</text>

  <path d="M372,44 L588,44" class="arrow"/>

  <rect x="590" y="0" width="320" height="88" rx="10" class="card-body" stroke="#E9A13B" stroke-width="1.5"/>
  <g transform="translate(625,44)">
    <path d="M-18,10 L-6,-8 L4,4 L18,-14" fill="none" stroke="#8a5a12" stroke-width="2.2"/>
    <path d="M8,-14 L18,-14 L18,-4" fill="none" stroke="#8a5a12" stroke-width="2.2"/>
  </g>
  <text x="660" y="28" class="body" font-weight="700">Snelheid boven zorgvuldigheid —</text>
  <text x="660" y="46" class="body" font-weight="700">juist bij het werk waar</text>
  <text x="660" y="64" class="body" font-weight="700">zorgvuldigheid het meest telt</text>
</g>

<!-- RIJ 2 -->
<g transform="translate(0,242)">
  <rect x="70" y="0" width="300" height="88" rx="10" class="card-body" stroke="#CFE0F2" stroke-width="1.5"/>
  <g transform="translate(105,44)">
    <circle r="24" fill="none" stroke="#14213D" stroke-width="2"/>
    <path d="M-14,10 A18,18 0 0 1 14,10" fill="none" stroke="#14213D" stroke-width="2"/>
    <path d="M0,0 L-12,-12" stroke="#14213D" stroke-width="2.2"/>
    <circle r="3" fill="#14213D"/>
  </g>
  <text x="140" y="34" class="label">Gemiddelde doorlooptijd</text>
  <text x="140" y="50" class="label">per dossier</text>
  <text x="140" y="70" class="tag">meet tijd, niet complexiteit</text>

  <path d="M372,44 L588,44" class="arrow"/>

  <rect x="590" y="0" width="320" height="88" rx="10" class="card-body" stroke="#E9A13B" stroke-width="1.5"/>
  <g transform="translate(625,44)">
    <rect x="-20" y="-18" width="40" height="36" rx="5" fill="none" stroke="#8a5a12" stroke-width="1.8"/>
    <path d="M-20,-18 L20,18 M20,-18 L-20,18" stroke="#8a5a12" stroke-width="1.8"/>
  </g>
  <text x="660" y="28" class="body" font-weight="700">Complexe dossiers vermijden</text>
  <text x="660" y="46" class="body" font-weight="700">of versimpelen — precies de</text>
  <text x="660" y="64" class="body" font-weight="700">dossiers die aandacht vragen</text>
</g>

<!-- RIJ 3 -->
<g transform="translate(0,354)">
  <rect x="70" y="0" width="300" height="88" rx="10" class="card-body" stroke="#CFE0F2" stroke-width="1.5"/>
  <g transform="translate(105,44)">
    <circle r="24" fill="none" stroke="#14213D" stroke-width="2"/>
    <path d="M-14,10 A18,18 0 0 1 14,10" fill="none" stroke="#14213D" stroke-width="2"/>
    <path d="M0,0 L4,-16" stroke="#14213D" stroke-width="2.2"/>
    <circle r="3" fill="#14213D"/>
  </g>
  <text x="140" y="28" class="label">% dossiers zonder</text>
  <text x="140" y="44" class="label">vervolgklacht</text>
  <text x="140" y="62" class="tag">meet uitkomstkwaliteit —</text>
  <text x="140" y="76" class="tag">"wat wél werkt" (§28.6)</text>

  <path d="M372,44 L588,44" class="arrow"/>

  <rect x="590" y="0" width="320" height="88" rx="10" class="card-body" stroke="#E9A13B" stroke-width="1.5"/>
  <g transform="translate(625,44)">
    <path d="M-18,-14 L18,14 M-18,14 L18,-14" stroke="#8a5a12" stroke-width="1.6" opacity="0.5"/>
    <circle r="20" fill="none" stroke="#8a5a12" stroke-width="1.8" stroke-dasharray="4 3"/>
  </g>
  <text x="660" y="24" class="body" font-weight="700">Twijfelgevallen afwentelen of</text>
  <text x="660" y="42" class="body" font-weight="700">niet als klacht laten registreren —</text>
  <text x="660" y="60" class="body" font-weight="700">ook een "goede" indicator is</text>
  <text x="660" y="78" class="body" font-weight="700">niet immuun (§28.6)</text>
</g>

<!-- banner -->
<rect x="70" y="470" width="840" height="56" rx="8" class="banner"/>
<text x="490" y="494" class="bannertext" text-anchor="middle">"Welk ongewenst gedrag zou deze indicator kunnen uitlokken?"</text>
<text x="490" y="514" class="bannertext" text-anchor="middle" font-weight="400" font-style="italic" font-size="12">hoort standaard bij het ontwerp van elke indicator, ook bij kenniswerk (§28.6)</text>

</svg>
