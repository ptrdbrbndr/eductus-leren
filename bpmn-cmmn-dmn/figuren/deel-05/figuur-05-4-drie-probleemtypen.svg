<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="'DM Sans', Arial, sans-serif" width="960" height="700" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .task { fill:#FFFFFF; stroke:#14213D; stroke-width:1.6; }
      .task-bad { fill:#FFFFFF; stroke:#14213D; stroke-width:1.6; }
      .event-start { fill:#FFFFFF; stroke:#14213D; stroke-width:1.4; }
      .event-end-ring { fill:none; stroke:#14213D; stroke-width:3; }
      .gateway { fill:#CFE0F2; stroke:#14213D; stroke-width:1.8; }
      .label { font-size:12.5px; font-weight:700; fill:#14213D; }
      .label-bad { font-size:12.5px; font-weight:700; fill:#55606F; font-style:italic; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-sm { font-size:10.5px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .poolname { font-size:12px; font-weight:700; fill:#14213D; }
      .arrow { stroke:#14213D; stroke-width:1.6; fill:none; marker-end:url(#arr); }
      .badge-text { font-size:13px; font-weight:700; fill:#FBFAF7; }
      .callout-text { font-size:11px; font-weight:700; }
      .callout-sub { font-size:10.5px; fill:#55606F; }
      .legend-title { font-size:12px; font-weight:700; fill:#14213D; }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#14213D"/></marker>
</defs>
<rect width="960" height="700" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 05 · DRIE SOORTEN VALIDATIE</text>
<text x="40" y="64" class="title">Figuur 5.4 — Eén model, drie probleemtypen</text>
<text x="40" y="86" class="sub">Structureel, semantisch en stilistisch zijn onafhankelijke manieren waarop een model kan falen (§5.4).</text>

<!-- Pools -->
<rect x="60" y="120" width="330" height="150" fill="#FFFFFF" stroke="#14213D" stroke-width="1.6"/>
<rect x="60" y="120" width="24" height="150" fill="#EEF2F7" stroke="#14213D" stroke-width="1.6"/>
<text x="72" y="195" class="poolname" transform="rotate(-90 72 195)" text-anchor="middle">Deelnemer</text>

<rect x="440" y="120" width="460" height="230" fill="#FFFFFF" stroke="#14213D" stroke-width="1.6"/>
<rect x="440" y="120" width="24" height="230" fill="#CFE0F2" stroke="#14213D" stroke-width="1.6"/>
<text x="452" y="235" class="poolname" transform="rotate(-90 452 235)" text-anchor="middle">Meridiaan Pensioen</text>

<!-- Deelnemer pool content -->
<circle cx="150" cy="195" r="15" class="event-start"/>
<text x="150" y="222" text-anchor="middle" class="sub-sm">Aanvraag</text>
<text x="150" y="234" text-anchor="middle" class="sub-sm">ingediend</text>

<rect x="220" y="177" width="140" height="36" class="task" rx="8"/>
<text x="290" y="199" text-anchor="middle" class="label-bad">Aanvraag beoordeeld</text>

<path d="M165,195 L220,195" class="arrow"/>

<!-- STRUCTURAL ERROR: solid sequence flow crossing pool boundary instead of message flow -->
<path d="M360,195 L440,195" stroke="#14213D" stroke-width="1.6" fill="none" marker-end="url(#arr)"/>

<!-- Meridiaan Pensioen pool content -->
<rect x="500" y="177" width="140" height="36" class="task-bad" rx="8"/>
<text x="570" y="199" text-anchor="middle" class="label">Aanvraag registreren</text>

<polygon points="700,195 725,175 750,195 725,215" class="gateway"/>
<text x="725" y="235" text-anchor="middle" class="sub-sm">Binnen termijn?</text>

<rect x="790" y="177" width="120" height="36" class="task" rx="8"/>
<text x="850" y="199" text-anchor="middle" class="label">Uitkering toekennen</text>

<path d="M640,195 L700,195" class="arrow"/>
<path d="M750,195 L790,195" class="arrow"/>
<text x="762" y="182" class="sub-sm" font-weight="700">ja</text>
<!-- "nee" pad ontbreekt hier bewust: semantische fout -->

<circle cx="890" cy="280" r="14" class="event-end-ring"/>
<circle cx="890" cy="280" r="8" fill="#14213D"/>
<path d="M850,213 L850,280 L876,280" class="arrow"/>

<!-- Stylistic: landscape mixed with detail — an oversized detail box floating loosely without lane discipline -->
<rect x="500" y="270" width="140" height="30" fill="#EEF2F7" stroke="#55606F" stroke-width="1" stroke-dasharray="3 2"/>
<text x="570" y="289" text-anchor="middle" class="sub-sm" fill="#55606F">Klantcontact — Backoffice (2 rollen, geen lanes)</text>

<!-- Callout badges -->
<!-- 1 structural: on the crossing sequence flow -->
<circle cx="400" cy="175" r="14" fill="#2563A8"/>
<text x="400" y="180" text-anchor="middle" class="badge-text">1</text>
<line x1="400" y1="189" x2="400" y2="196" stroke="#2563A8" stroke-width="1.4"/>

<!-- 2 semantic: on the missing "nee" branch at the gateway -->
<circle cx="725" cy="150" r="14" fill="#E9A13B"/>
<text x="725" y="155" text-anchor="middle" class="badge-text">2</text>
<line x1="725" y1="164" x2="725" y2="175" stroke="#E9A13B" stroke-width="1.4"/>

<!-- 3 stylistic: on the "Aanvraag beoordeeld" task -->
<circle cx="290" cy="150" r="14" fill="#14213D"/>
<text x="290" y="155" text-anchor="middle" class="badge-text">3</text>
<line x1="290" y1="164" x2="290" y2="177" stroke="#14213D" stroke-width="1.4"/>

<!-- Legend -->
<rect x="60" y="390" width="840" height="270" rx="8" fill="#FFFFFF" stroke="#CFE0F2" stroke-width="1.2"/>
<text x="80" y="418" class="legend-title">Drie onafhankelijke manieren waarop dit model faalt</text>

<circle cx="92" cy="452" r="12" fill="#2563A8"/>
<text x="92" y="457" text-anchor="middle" class="badge-text" font-size="11">1</text>
<text x="115" y="450" class="callout-text" fill="#2563A8">STRUCTUREEL</text>
<text x="115" y="468" class="callout-sub">Sequence flow loopt over de poolgrens (Deelnemer → Meridiaan Pensioen).</text>
<text x="115" y="484" class="callout-sub">Dit moet een message flow zijn (gestippeld, open pijlpunt) — een tool</text>
<text x="115" y="500" class="callout-sub">detecteert dit automatisch, zoals Conductus.</text>

<circle cx="92" cy="540" r="12" fill="#E9A13B"/>
<text x="92" y="545" text-anchor="middle" class="badge-text" font-size="11">2</text>
<text x="115" y="538" class="callout-text" fill="#E9A13B">SEMANTISCH</text>
<text x="115" y="556" class="callout-sub">De gateway "Binnen termijn?" heeft alleen een "ja"-pad. Het "nee"-geval</text>
<text x="115" y="572" class="callout-sub">(niet binnen termijn) ontbreekt — het model dekt de werkelijkheid niet</text>
<text x="115" y="588" class="callout-sub">volledig. Geen tool ziet dit; het vereist proceskennis.</text>

<circle cx="480" cy="452" r="12" fill="#14213D"/>
<text x="480" y="457" text-anchor="middle" class="badge-text" font-size="11">3</text>
<text x="503" y="450" class="callout-text" fill="#14213D">STILISTISCH</text>
<text x="503" y="468" class="callout-sub">"Aanvraag beoordeeld" is een toestand, geen handeling — moet</text>
<text x="503" y="484" class="callout-sub">"Aanvraag beoordelen" zijn (fout #6, §5.5). Verderop staan twee rollen</text>
<text x="503" y="500" class="callout-sub">los genoemd zonder lanes: geen duidelijke structuur voor de lezer.</text>

<text x="80" y="628" class="sub" font-weight="700" fill="#14213D">Structureel foutloos en semantisch correct sluit stilistisch onbruikbaar niet uit — en omgekeerd.</text>
<text x="80" y="646" class="sub">De twee moeilijkst te herstellen fouten (semantisch, stilistisch) zijn ook de twee die geen tool signaleert.</text>
</svg>
