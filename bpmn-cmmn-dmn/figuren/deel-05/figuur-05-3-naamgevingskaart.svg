<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .card { fill:#FFFFFF; stroke:#CFE0F2; stroke-width:1.2; }
      .rowband { fill:#EEF2F7; }
      .headband { fill:#14213D; }
      .headtext { font-size:12.5px; font-weight:700; fill:#FBFAF7; letter-spacing:.04em; }
      .cell-type { font-size:14px; font-weight:700; fill:#14213D; }
      .cell-conv { font-size:12.5px; fill:#55606F; }
      .cell-ex { font-size:13.5px; font-weight:600; fill:#2563A8; font-style:italic; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .sub { font-size:12px; fill:#55606F; }
      .icon-stroke { fill:none; stroke:#14213D; stroke-width:1.6; }
      .icon-fill { fill:#CFE0F2; stroke:#14213D; stroke-width:1.6; }
      .icon-amber { fill:#FBF6E9; stroke:#E9A13B; stroke-width:1.6; }
</style>
</defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 05 · REFERENTIEKAART</text>
<text x="40" y="64" class="title">Figuur 5.3 — Naamgevingsconventies in één oogopslag</text>
<text x="40" y="86" class="sub">Vijf elementtypen, hun conventie en een voorbeeld uit de Meridiaan Pensioen-casus (§5.3).</text>

<rect x="40" y="110" width="880" height="470" rx="10" class="card"/>

<!-- header row -->
<rect x="40" y="110" width="880" height="42" class="headband" rx="10"/>
<text x="130" y="136" class="headtext" text-anchor="middle" dominant-baseline="middle">ELEMENT</text>
<text x="430" y="136" class="headtext" text-anchor="middle" dominant-baseline="middle">CONVENTIE</text>
<text x="770" y="136" class="headtext" text-anchor="middle" dominant-baseline="middle">VOORBEELD</text>

<!-- row separators / bands -->
<rect x="40" y="152" width="880" height="66" fill="#FFFFFF"/>
<rect x="40" y="218" width="880" height="66" class="rowband"/>
<rect x="40" y="284" width="880" height="66" fill="#FFFFFF"/>
<rect x="40" y="350" width="880" height="66" class="rowband"/>
<rect x="40" y="416" width="880" height="66" fill="#FFFFFF"/>

<line x1="40" y1="152" x2="920" y2="152" stroke="#CFE0F2" stroke-width="1"/>
<line x1="40" y1="218" x2="920" y2="218" stroke="#CFE0F2" stroke-width="1"/>
<line x1="40" y1="284" x2="920" y2="284" stroke="#CFE0F2" stroke-width="1"/>
<line x1="40" y1="350" x2="920" y2="350" stroke="#CFE0F2" stroke-width="1"/>
<line x1="40" y1="416" x2="920" y2="416" stroke="#CFE0F2" stroke-width="1"/>
<line x1="40" y1="482" x2="920" y2="482" stroke="#CFE0F2" stroke-width="1"/>
<line x1="230" y1="110" x2="230" y2="482" stroke="#CFE0F2" stroke-width="1"/>
<line x1="630" y1="110" x2="630" y2="482" stroke="#CFE0F2" stroke-width="1"/>

<!-- Row 1: Activiteit -->
<rect x="70" y="167" width="66" height="34" rx="8" class="icon-fill"/>
<text x="103" y="188" text-anchor="middle" font-size="10" font-weight="700" fill="#14213D">taak</text>
<text x="160" y="180" class="cell-type">Activiteit</text>
<text x="160" y="199" class="cell-conv">Werkwoord + object, gebiedend/infinitief</text>
<text x="255" y="188" class="cell-conv" font-weight="700" fill="#14213D">Werkwoord + object</text>
<text x="255" y="207" class="cell-conv">gebiedende / infinitiefvorm</text>
<text x="655" y="192" class="cell-ex">"Aanvraag beoordelen"</text>

<!-- Row 2: Event -->
<circle cx="103" cy="251" r="18" class="icon-stroke"/>
<text x="160" y="246" class="cell-type">Event</text>
<text x="255" y="254" class="cell-conv" font-weight="700" fill="#14213D">Voltooide vorm</text>
<text x="255" y="273" class="cell-conv">(iets is gebeurd)</text>
<text x="655" y="258" class="cell-ex">"Aanvraag ontvangen"</text>

<!-- Row 3: Gateway -->
<polygon points="103,300 122,317 103,334 84,317" class="icon-amber"/>
<text x="160" y="312" class="cell-type">Gateway</text>
<text x="255" y="320" class="cell-conv" font-weight="700" fill="#14213D">Vraagvorm</text>
<text x="255" y="339" class="cell-conv">geen handeling</text>
<text x="655" y="324" class="cell-ex">"Binnen termijn?"</text>

<!-- Row 4: Pool -->
<rect x="70" y="367" width="66" height="34" fill="none" stroke="#14213D" stroke-width="1.6"/>
<rect x="70" y="367" width="14" height="34" fill="#CFE0F2" stroke="#14213D" stroke-width="1.6"/>
<text x="160" y="378" class="cell-type">Pool</text>
<text x="255" y="386" class="cell-conv" font-weight="700" fill="#14213D">Naam deelnemer</text>
<text x="255" y="405" class="cell-conv">/ organisatie</text>
<text x="655" y="390" class="cell-ex">"Meridiaan Pensioen"</text>

<!-- Row 5: Lane -->
<rect x="70" y="433" width="66" height="34" fill="#EEF2F7" stroke="#14213D" stroke-width="1.4"/>
<line x1="70" y1="450" x2="136" y2="450" stroke="#14213D" stroke-width="1"/>
<text x="160" y="444" class="cell-type">Lane</text>
<text x="255" y="452" class="cell-conv" font-weight="700" fill="#14213D">Naam rol / afdeling</text>
<text x="655" y="456" class="cell-ex">"Klantcontact"</text>

<text x="60" y="510" class="sub">Vuistregel bij de gateway: nooit "Beoordelen" (dat is een activiteit) — altijd een vraag waarvan het</text>
<text x="60" y="528" class="sub">antwoord de uitgaande paden verklaart, bijvoorbeeld "ja" / "nee" op "Binnen termijn?".</text>
<text x="60" y="556" class="sub" font-weight="700" fill="#14213D">Consistentie tussen modellen weegt zwaarder dan persoonlijke voorkeur binnen één model.</text>
</svg>
