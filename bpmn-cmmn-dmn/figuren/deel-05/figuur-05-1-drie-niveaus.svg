<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 900" font-family="'DM Sans', Arial, sans-serif" width="960" height="900" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .band { fill:#EEF2F7; stroke:#CFE0F2; stroke-width:1; }
      .blue-fill { fill:#CFE0F2; }
      .blue-dark { fill:#2563A8; }
      .amber-fill { fill:#FBF6E9; stroke:#E9A13B; }
      .navy-stroke { stroke:#14213D; }
      .task { fill:#FFFFFF; stroke:#14213D; stroke-width:1.6; rx:8; }
      .subtask { fill:#FFFFFF; stroke:#2563A8; stroke-width:1.4; rx:7; }
      .event-start { fill:#FFFFFF; stroke:#14213D; stroke-width:1.4; }
      .event-end { fill:#14213D; stroke:#14213D; stroke-width:3; }
      .event-end-ring { fill:none; stroke:#14213D; stroke-width:3; }
      .gateway { fill:#FBF6E9; stroke:#E9A13B; stroke-width:1.8; }
      .label { font-size:13px; font-weight:700; fill:#14213D; }
      .label-sm { font-size:11px; font-weight:700; fill:#14213D; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-sm { font-size:10.5px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .band-title { font-size:13px; font-weight:700; fill:#2563A8; letter-spacing:.06em; }
      .arrow { stroke:#14213D; stroke-width:1.6; fill:none; marker-end:url(#arr); }
      .poolname { font-size:12px; font-weight:700; fill:#14213D; }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#14213D"/></marker>
</defs>
<rect width="960" height="900" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 05 · MODELLEERNIVEAUS</text>
<text x="40" y="64" class="title">Figuur 5.1 — Hetzelfde procesfragment, drie niveaus</text>
<text x="40" y="86" class="sub">Casus: aanvraagafhandeling bij Meridiaan Pensioen N.V. — steeds hetzelfde stuk proces, met toenemend detail.</text>

<!-- BAND 1: LANDSCHAP -->
<rect x="40" y="112" width="880" height="150" class="band" rx="6"/>
<text x="60" y="136" class="band-title">NIVEAU 1 — LANDSCHAP</text>
<text x="60" y="153" class="sub-sm">Collaboration diagram met collapsed pools, geen interne stappen zichtbaar</text>

<!-- collapsed pools -->
<rect x="90" y="175" width="150" height="60" rx="6" fill="#FFFFFF" stroke="#14213D" stroke-width="1.6"/>
<text x="165" y="209" text-anchor="middle" class="label-sm">Deelnemer</text>
<rect x="330" y="175" width="220" height="60" rx="6" fill="#CFE0F2" stroke="#14213D" stroke-width="1.6"/>
<text x="440" y="203" text-anchor="middle" class="label-sm">Meridiaan Pensioen</text>
<text x="440" y="219" text-anchor="middle" class="sub-sm">(collapsed pool)</text>
<rect x="640" y="175" width="180" height="60" rx="6" fill="#FFFFFF" stroke="#14213D" stroke-width="1.6"/>
<text x="730" y="209" text-anchor="middle" class="label-sm">Uitkeringsadministratie</text>

<line x1="240" y1="205" x2="330" y2="205" stroke="#55606F" stroke-width="1.4" stroke-dasharray="4 3"/>
<circle cx="240" cy="205" r="4" fill="none" stroke="#55606F" stroke-width="1.4"/>
<path d="M323,205 L330,205" stroke="#55606F" stroke-width="1.4" fill="none"/>
<polygon points="330,201 338,205 330,209" fill="none" stroke="#55606F" stroke-width="1.4"/>

<line x1="550" y1="205" x2="640" y2="205" stroke="#55606F" stroke-width="1.4" stroke-dasharray="4 3"/>
<circle cx="550" cy="205" r="4" fill="none" stroke="#55606F" stroke-width="1.4"/>
<polygon points="640,201 648,205 640,209" fill="none" stroke="#55606F" stroke-width="1.4"/>
<text x="440" y="255" text-anchor="middle" class="sub-sm">Alleen deelnemers (pools) en hun onderlinge berichtuitwisseling — geen taken zichtbaar</text>

<!-- BAND 2: PROCES -->
<rect x="40" y="282" width="880" height="230" class="band" rx="6"/>
<text x="60" y="306" class="band-title">NIVEAU 2 — PROCES</text>
<text x="60" y="323" class="sub-sm">Activiteiten, events en gateways binnen één proces — leesbaar voor businesspubliek</text>

<!-- pool Meridiaan Pensioen with two lanes -->
<rect x="90" y="340" width="800" height="150" fill="#FFFFFF" stroke="#14213D" stroke-width="1.6"/>
<rect x="90" y="340" width="24" height="150" fill="#CFE0F2" stroke="#14213D" stroke-width="1.6"/>
<text x="102" y="415" class="poolname" transform="rotate(-90 102 415)" text-anchor="middle">Meridiaan Pensioen</text>

<line x1="114" y1="415" x2="890" y2="415" stroke="#CFE0F2" stroke-width="1.4"/>
<rect x="114" y="340" width="26" height="75" fill="#EEF2F7" stroke="#14213D" stroke-width="1"/>
<text x="127" y="378" class="sub-sm" transform="rotate(-90 127 378)" text-anchor="middle">Klantcontact</text>
<rect x="114" y="415" width="26" height="75" fill="#EEF2F7" stroke="#14213D" stroke-width="1"/>
<text x="127" y="453" class="sub-sm" transform="rotate(-90 127 453)" text-anchor="middle">Backoffice</text>

<!-- lane Klantcontact content -->
<circle cx="185" cy="378" r="16" class="event-start"/>
<text x="185" y="382" text-anchor="middle" class="sub-sm">msg</text>
<text x="185" y="404" text-anchor="middle" class="sub-sm">Aanvraag ontvangen</text>

<rect x="240" y="360" width="130" height="36" class="task" rx="8"/>
<text x="305" y="382" text-anchor="middle" class="label-sm">Aanvraag registreren</text>

<!-- lane Backoffice content -->
<rect x="420" y="435" width="140" height="36" class="task" rx="8"/>
<text x="490" y="457" text-anchor="middle" class="label-sm">Aanvraag beoordelen</text>

<polygon points="620,453 645,433 670,453 645,473" class="gateway"/>
<text x="645" y="490" text-anchor="middle" class="sub-sm">Binnen termijn?</text>

<rect x="700" y="435" width="140" height="36" class="task" rx="8"/>
<text x="770" y="457" text-anchor="middle" class="label-sm">Uitkering toekennen</text>

<circle cx="870" cy="453" r="15" class="event-end-ring"/>
<circle cx="870" cy="453" r="9" fill="#14213D"/>

<!-- flows level 2 -->
<path d="M201,378 L240,378" class="arrow"/>
<path d="M370,378 L400,378 L400,453 L420,453" class="arrow"/>
<path d="M560,453 L620,453" class="arrow"/>
<path d="M670,453 L700,453" class="arrow"/>
<path d="M840,453 L855,453" class="arrow"/>
<text x="655" y="440" class="sub-sm" fill="#2563A8">ja</text>

<!-- BAND 3: SUBPROCES -->
<rect x="40" y="532" width="880" height="230" class="band" rx="6"/>
<text x="60" y="556" class="band-title">NIVEAU 3 — SUBPROCES</text>
<text x="60" y="573" class="sub-sm">Detail binnen het collapsed subprocess "Aanvraag beoordelen" — precies genoeg voor specificatie</text>

<rect x="90" y="595" width="800" height="145" rx="10" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.8" stroke-dasharray="2 0"/>
<text x="106" y="618" class="label-sm" fill="#2563A8">Subproces: Aanvraag beoordelen</text>

<circle cx="150" cy="668" r="14" class="event-start"/>
<text x="150" y="694" text-anchor="middle" class="sub-sm">start</text>

<rect x="200" y="650" width="130" height="36" class="subtask" rx="7"/>
<text x="265" y="672" text-anchor="middle" class="label-sm">Dossier openen</text>

<rect x="365" y="650" width="150" height="36" class="subtask" rx="7"/>
<text x="440" y="672" text-anchor="middle" class="label-sm">Gegevens verifiëren</text>

<polygon points="550,668 573,650 596,668 573,686" class="gateway"/>
<text x="573" y="702" text-anchor="middle" class="sub-sm">Compleet?</text>

<rect x="630" y="650" width="140" height="36" class="subtask" rx="7"/>
<text x="700" y="672" text-anchor="middle" class="label-sm">Advies opstellen</text>

<circle cx="815" cy="668" r="14" class="event-end-ring"/>
<circle cx="815" cy="668" r="8" fill="#14213D"/>

<path d="M164,668 L200,668" class="arrow"/>
<path d="M330,668 L365,668" class="arrow"/>
<path d="M515,668 L550,668" class="arrow"/>
<path d="M596,668 L630,668" class="arrow"/>
<path d="M770,668 L801,668" class="arrow"/>
<text x="600" y="655" class="sub-sm" fill="#2563A8">ja</text>

<text x="60" y="805" class="sub" fill="#55606F">Zelfde processtap ("aanvraag beoordelen"), drie keer getekend op het niveau dat bij het publiek past. Meng deze niveaus nooit in één diagram (§5.1).</text>
</svg>
