<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:13px; font-weight:700; fill:#14213D; }
      .sub { font-size:11px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .link { stroke:#2563A8; stroke-width:1.75; fill:none; }
      .linkgrey { stroke:#55606F; stroke-width:1.5; stroke-dasharray:5 4; fill:none; }
      .node { fill:#E9A13B; stroke:#14213D; stroke-width:1.25; }
    </style>
</defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 23 · KETENDIAGRAM</text>
<text x="40" y="64" class="title">De traceerbaarheidsketen: capability → proces → applicatie</text>

<text x="50" y="98" class="kicker">CAPABILITY</text>
<text x="365" y="98" class="kicker">PROCES</text>
<text x="680" y="98" class="kicker">APPLICATIE</text>

<!-- capability boxes -->
<g id="cap">
<rect x="50" y="112" width="230" height="56" rx="8" fill="#CFE0F2" stroke="#14213D" stroke-width="1.5"/>
<text x="165" y="136" text-anchor="middle" class="label">Deelnemersmutaties</text>
<text x="165" y="152" text-anchor="middle" class="label">verwerken</text>

<rect x="50" y="196" width="230" height="56" rx="8" fill="#CFE0F2" stroke="#14213D" stroke-width="1.5"/>
<text x="165" y="220" text-anchor="middle" class="label">Werkgeversmutaties</text>
<text x="165" y="236" text-anchor="middle" class="label">verwerken</text>

<rect x="50" y="280" width="230" height="56" rx="8" fill="#CFE0F2" stroke="#14213D" stroke-width="1.5"/>
<text x="165" y="304" text-anchor="middle" class="label">Waardeoverdracht</text>
<text x="165" y="320" text-anchor="middle" class="label">verwerken</text>

<rect x="50" y="364" width="230" height="56" rx="8" fill="#CFE0F2" stroke="#14213D" stroke-width="1.5"/>
<text x="165" y="388" text-anchor="middle" class="label">Klachten en bezwaren</text>
<text x="165" y="404" text-anchor="middle" class="label">behandelen</text>

<rect x="50" y="448" width="230" height="56" rx="8" fill="#CFE0F2" stroke="#14213D" stroke-width="1.5"/>
<text x="165" y="472" text-anchor="middle" class="label">Bijzondere situaties</text>
<text x="165" y="488" text-anchor="middle" class="label">beoordelen</text>
</g>

<!-- process boxes -->
<g id="proc">
<rect x="365" y="112" width="230" height="56" rx="8" fill="#FBF6E9" stroke="#14213D" stroke-width="1.5"/>
<text x="480" y="136" text-anchor="middle" class="label">Deelnemermutaties</text>
<text x="480" y="152" text-anchor="middle" class="sub">proces (deel 11)</text>

<rect x="365" y="196" width="230" height="56" rx="8" fill="#FBF6E9" stroke="#14213D" stroke-width="1.5"/>
<text x="480" y="220" text-anchor="middle" class="label">Werkgevermutaties</text>
<text x="480" y="236" text-anchor="middle" class="sub">proces (deel 11)</text>

<rect x="365" y="280" width="230" height="56" rx="8" fill="#FBF6E9" stroke="#14213D" stroke-width="1.5"/>
<text x="480" y="304" text-anchor="middle" class="label">Waardeoverdrachten</text>
<text x="480" y="320" text-anchor="middle" class="sub">proces (deel 11)</text>

<rect x="365" y="364" width="230" height="56" rx="8" fill="#FBF6E9" stroke="#14213D" stroke-width="1.5"/>
<text x="480" y="388" text-anchor="middle" class="label">Klachten &amp; Bezwaren</text>
<text x="480" y="404" text-anchor="middle" class="sub">proces (deel 11)</text>

<rect x="365" y="448" width="230" height="56" rx="8" fill="#FBF6E9" stroke="#14213D" stroke-width="1.5"/>
<text x="480" y="472" text-anchor="middle" class="label">Bijzondere Situaties</text>
<text x="480" y="488" text-anchor="middle" class="sub">proces (deel 11)</text>
</g>

<!-- capability -> proces connectors -->
<line x1="280" y1="140" x2="365" y2="140" class="link"/>
<circle cx="322" cy="140" r="4" class="node"/>
<line x1="280" y1="224" x2="365" y2="224" class="link"/>
<circle cx="322" cy="224" r="4" class="node"/>
<line x1="280" y1="308" x2="365" y2="308" class="link"/>
<circle cx="322" cy="308" r="4" class="node"/>
<line x1="280" y1="392" x2="365" y2="392" class="link"/>
<circle cx="322" cy="392" r="4" class="node"/>
<line x1="280" y1="476" x2="365" y2="476" class="link"/>
<circle cx="322" cy="476" r="4" class="node"/>

<!-- applicatie boxes -->
<rect x="680" y="112" width="230" height="224" rx="10" fill="#EEF2F7" stroke="#2563A8" stroke-width="1.75"/>
<text x="795" y="210" text-anchor="middle" class="label">Mutatieplatform</text>
<text x="795" y="228" text-anchor="middle" class="label">(Locked Platform)</text>
<text x="795" y="248" text-anchor="middle" class="sub">event-driven, FSM/CQRS</text>
<text x="795" y="264" text-anchor="middle" class="sub">live voor 3 van de 5 processen</text>

<rect x="680" y="364" width="230" height="140" rx="10" fill="#E3E0D8" stroke="#14213D" stroke-width="1.75"/>
<text x="795" y="418" text-anchor="middle" class="label">Legacy-polis-</text>
<text x="795" y="436" text-anchor="middle" class="label">administratiesysteem</text>
<text x="795" y="454" text-anchor="middle" class="sub">batch, 35 jaar oud</text>

<!-- proces -> applicatie connectors -->
<path d="M595,140 C640,140 640,180 680,180" class="link"/>
<path d="M595,224 C640,224 640,224 680,224" class="link"/>
<path d="M595,308 C640,308 640,270 680,270" class="link"/>
<circle cx="620" cy="140" r="4" class="node"/>
<circle cx="620" cy="224" r="4" class="node"/>
<circle cx="620" cy="308" r="4" class="node"/>

<path d="M595,392 C640,392 640,412 680,412" class="link"/>
<path d="M595,476 C640,476 640,456 680,456" class="link"/>
<circle cx="620" cy="392" r="4" class="node"/>
<circle cx="620" cy="476" r="4" class="node"/>

<!-- koppelvlak between the two applications -->
<line x1="795" y1="336" x2="795" y2="364" class="linkgrey"/>
<text x="805" y="354" class="sub">koppelvlak (deel 14, §14.7)</text>

<text x="50" y="540" class="sub" font-style="italic">Gegeven een capability laat de keten in één oogopslag zien welke processen en applicaties geraakt worden —</text>
<text x="50" y="556" class="sub" font-style="italic">mits de keten actueel is. Een verouderde keten oogt gezaghebbend en klopt niet meer (§23.3).</text>
</svg>
