<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:13px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:11.5px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .badge-live { fill:#2563A8; }
      .badge-legacy { fill:#E9A13B; }
    </style>
</defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 23 · LANDSCHAPSDIAGRAM</text>
<text x="40" y="64" class="title">Eén landschap, twee toestanden tegelijk</text>

<text x="480" y="94" text-anchor="middle" class="sub">Meridiaan mutatieverwerking — Programma Stelselovergang</text>

<!-- overgangslijn -->
<line x1="480" y1="110" x2="480" y2="560" stroke="#14213D" stroke-width="2" stroke-dasharray="8 5"/>
<rect x="420" y="290" width="120" height="30" rx="6" fill="#FBFAF7" stroke="#14213D" stroke-width="1.25"/>
<text x="480" y="309" text-anchor="middle" class="sub" font-weight="700" fill="#14213D">overgangslijn</text>

<!-- left zone: Locked Platform -->
<rect x="40" y="110" width="420" height="450" rx="12" fill="#CFE0F2" opacity="0.45" stroke="#2563A8" stroke-width="1.75"/>
<text x="250" y="140" text-anchor="middle" class="label">MUTATIEPLATFORM — Locked Platform</text>
<text x="250" y="158" text-anchor="middle" class="sub">event-driven, FSM/CQRS-architectuur — hoofdspoor voor uitvoering</text>

<g>
<rect x="70" y="182" width="360" height="70" rx="10" fill="#FFFFFF" stroke="#14213D" stroke-width="1.5"/>
<text x="90" y="212" class="label">Deelnemermutaties</text>
<text x="90" y="228" class="sub">hoog-volume, standaardiseerbaar</text>
<rect x="330" y="192" width="80" height="24" rx="12" class="badge-live"/>
<text x="370" y="208" text-anchor="middle" class="label-light">LIVE</text>
</g>
<g>
<rect x="70" y="266" width="360" height="70" rx="10" fill="#FFFFFF" stroke="#14213D" stroke-width="1.5"/>
<text x="90" y="296" class="label">Werkgevermutaties</text>
<text x="90" y="312" class="sub">hoog-volume, standaardiseerbaar</text>
<rect x="330" y="276" width="80" height="24" rx="12" class="badge-live"/>
<text x="370" y="292" text-anchor="middle" class="label-light">LIVE</text>
</g>
<g>
<rect x="70" y="350" width="360" height="70" rx="10" fill="#FFFFFF" stroke="#14213D" stroke-width="1.5"/>
<text x="90" y="380" class="label">Waardeoverdrachten</text>
<text x="90" y="396" class="sub">invaren-gevoelig, transitie-kritiek</text>
<rect x="330" y="360" width="80" height="24" rx="12" class="badge-live"/>
<text x="370" y="376" text-anchor="middle" class="label-light">LIVE</text>
</g>

<text x="70" y="450" class="sub" font-style="italic">3 van de 5 afdelingen. Elke deelnemermutatie op dit</text>
<text x="70" y="466" class="sub" font-style="italic">platform loopt event-driven, direct doorverwerkt.</text>

<!-- right zone: legacy -->
<rect x="500" y="110" width="420" height="450" rx="12" fill="#FBF6E9" opacity="0.7" stroke="#E9A13B" stroke-width="1.75"/>
<text x="710" y="140" text-anchor="middle" class="label">LEGACY-LANDSCHAP</text>
<text x="710" y="158" text-anchor="middle" class="sub">polisadministratiesysteem — batch, 35 jaar oud — terugvalspoor</text>

<g>
<rect x="530" y="182" width="360" height="70" rx="10" fill="#FFFFFF" stroke="#14213D" stroke-width="1.5"/>
<text x="550" y="212" class="label">Klachten &amp; Bezwaren</text>
<text x="550" y="228" class="sub">dossiergedreven kenniswerk</text>
<rect x="740" y="188" width="150" height="24" rx="12" class="badge-legacy"/>
<text x="815" y="204" text-anchor="middle" class="label" font-size="11">NOG NIET GEMIGREERD</text>
</g>
<g>
<rect x="530" y="266" width="360" height="70" rx="10" fill="#FFFFFF" stroke="#14213D" stroke-width="1.5"/>
<text x="550" y="296" class="label">Bijzondere Situaties</text>
<text x="550" y="312" class="sub">dossiergedreven kenniswerk</text>
<rect x="740" y="272" width="150" height="24" rx="12" class="badge-legacy"/>
<text x="815" y="288" text-anchor="middle" class="label" font-size="11">NOG NIET GEMIGREERD</text>
</g>

<text x="530" y="450" class="sub" font-style="italic">2 van de 5 afdelingen. Verwerking blijft batch-</text>
<text x="530" y="466" class="sub" font-style="italic">gebonden, met beperkte foutrespons (deel 14, §14.7).</text>

<!-- footer tooling note -->
<rect x="40" y="574" width="880" height="34" rx="8" fill="#EEF2F7" stroke="#14213D" stroke-width="1"/>
<text x="480" y="596" text-anchor="middle" class="sub">Uitvoering: Locked Platform is het hoofdspoor · Conductus (Flowable) blijft terugvaloptie bij expliciete CMMN 1.1-vereisten</text>
</svg>
