<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .card { fill:#FFFFFF; stroke:#E3E0D8; stroke-width:1.3; }
    .cardhead { fill:#14213D; }
    .cardhead-t { font-size:12.5px; font-weight:700; fill:#FBFAF7; }
    .axis { stroke:#B9C4D0; stroke-width:1.2; }
    .sub { font-size:10px; fill:#55606F; }
    .lbl { font-size:11px; font-weight:700; fill:#14213D; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    .whisker { stroke:#55606F; stroke-width:1.4; }
    .box { fill:#CFE0F2; stroke:#2563A8; stroke-width:1.3; }
    .median { stroke:#14213D; stroke-width:2; }
    .bar-task { fill:#2563A8; }
    .bar-disc { fill:#E9A13B; }
    .line { fill:none; stroke:#E9A13B; stroke-width:2.4; }
    .area { fill:#FBF6E9; }
    .dot { fill:#E9A13B; stroke:#FBFAF7; stroke-width:1.5; }
  </style>
</defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 17 · DASHBOARD</text>
<text x="40" y="64" class="title">Caseperformance meten zonder vast pad</text>

<rect x="30" y="82" width="900" height="30" rx="6" class="cardhead"/>
<text x="46" y="102" class="cardhead-t">Caseperformance — Klachten &amp; Bezwaren · geen vaste stappen, dus geen doorlooptijd per stap</text>

<!-- Panel A: doorlooptijd tot milestone -->
<rect x="30" y="128" width="430" height="215" rx="10" class="card"/>
<text x="46" y="150" class="lbl">Doorlooptijd tot milestone (dagen)</text>
<text x="46" y="165" class="sub">spreiding min–max, box = kern van de gevallen, streep = mediaan</text>

<line x1="140" y1="310" x2="430" y2="310" class="axis"/>
<line x1="140" y1="185" x2="140" y2="310" class="axis"/>
<text x="140" y="322" class="sub" text-anchor="middle">0</text>
<text x="212" y="322" class="sub" text-anchor="middle">20</text>
<text x="285" y="322" class="sub" text-anchor="middle">40</text>
<text x="357" y="322" class="sub" text-anchor="middle">60</text>
<text x="430" y="322" class="sub" text-anchor="middle">80 d</text>

<text x="46" y="200" class="sub">M1 ontvangst bevestigd</text>
<line x1="147" y1="198" x2="183" y2="198" class="whisker"/>
<rect x="152" y="191" width="20" height="14" class="box"/>
<line x1="162" y1="191" x2="162" y2="205" class="median"/>

<text x="46" y="240" class="sub">M2 onderzoek afgerond</text>
<line x1="194" y1="238" x2="303" y2="238" class="whisker"/>
<rect x="215" y="231" width="35" height="14" class="box"/>
<line x1="238" y1="231" x2="238" y2="245" class="median"/>

<text x="46" y="280" class="sub">M3 besluit genomen</text>
<line x1="267" y1="278" x2="412" y2="278" class="whisker"/>
<rect x="305" y="271" width="45" height="14" class="box"/>
<line x1="328" y1="271" x2="328" y2="285" class="median"/>

<text x="46" y="335" class="sub" font-style="italic">Grote spreiding is inherent aan dossierwerk — geen signaal op zich.</text>

<!-- Panel B: workload -->
<rect x="490" y="128" width="440" height="215" rx="10" class="card"/>
<text x="506" y="150" class="lbl">Workload per behandelaar</text>
<text x="506" y="165" class="sub">actieve discretionary items + open tasks</text>

<line x1="540" y1="315" x2="900" y2="315" class="axis"/>
<line x1="540" y1="185" x2="540" y2="315" class="axis"/>
<text x="524" y="195" class="sub" text-anchor="end">12</text>
<text x="524" y="255" class="sub" text-anchor="end">6</text>
<text x="524" y="318" class="sub" text-anchor="end">0</text>

<!-- bars: baseline y=315, scale 10.5px/unit -->
<g>
  <rect x="560" y="272" width="34" height="43" class="bar-task"/>
  <rect x="560" y="251" width="34" height="21" class="bar-disc"/>
  <text x="577" y="330" class="sub" text-anchor="middle">A</text>

  <rect x="620" y="251" width="34" height="64" class="bar-task"/>
  <rect x="620" y="219" width="34" height="32" class="bar-disc"/>
  <text x="637" y="330" class="sub" text-anchor="middle">B</text>

  <rect x="680" y="293" width="34" height="22" class="bar-task"/>
  <rect x="680" y="282" width="34" height="11" class="bar-disc"/>
  <text x="697" y="330" class="sub" text-anchor="middle">C</text>

  <rect x="740" y="230" width="34" height="85" class="bar-task"/>
  <rect x="740" y="177" width="34" height="53" class="bar-disc"/>
  <text x="757" y="330" class="sub" text-anchor="middle">D</text>

  <rect x="800" y="257" width="34" height="58" class="bar-task"/>
  <rect x="800" y="234" width="34" height="23" class="bar-disc"/>
  <text x="817" y="330" class="sub" text-anchor="middle">E</text>
</g>
<rect x="855" y="188" width="10" height="10" class="bar-task"/>
<text x="869" y="197" class="sub">open tasks</text>
<rect x="855" y="203" width="10" height="10" class="bar-disc"/>
<text x="869" y="212" class="sub">discretionary</text>

<!-- Panel C: escalatietrend -->
<rect x="30" y="358" width="900" height="235" rx="10" class="card"/>
<text x="46" y="382" class="lbl">Escalatietrend — inzet plan fragment "Juridisch vooronderzoek"</text>
<text x="46" y="397" class="sub">aandeel klachtdossiers waarin het fragment wordt toegevoegd, per maand</text>

<line x1="90" y1="560" x2="890" y2="560" class="axis"/>
<line x1="90" y1="420" x2="90" y2="560" class="axis"/>
<text x="76" y="424" class="sub" text-anchor="end">30%</text>
<text x="76" y="493" class="sub" text-anchor="end">15%</text>
<text x="76" y="563" class="sub" text-anchor="end">0%</text>

<polygon points="120,540 250,522 380,505 510,483 640,460 770,440 770,560 120,560" class="area"/>
<polyline points="120,540 250,522 380,505 510,483 640,460 770,440" class="line"/>
<circle cx="120" cy="540" r="4" class="dot"/>
<circle cx="250" cy="522" r="4" class="dot"/>
<circle cx="380" cy="505" r="4" class="dot"/>
<circle cx="510" cy="483" r="4" class="dot"/>
<circle cx="640" cy="460" r="4" class="dot"/>
<circle cx="770" cy="440" r="4" class="dot"/>

<text x="120" y="576" class="sub" text-anchor="middle">mrt</text>
<text x="250" y="576" class="sub" text-anchor="middle">apr</text>
<text x="380" y="576" class="sub" text-anchor="middle">mei</text>
<text x="510" y="576" class="sub" text-anchor="middle">jun</text>
<text x="640" y="576" class="sub" text-anchor="middle">jul</text>
<text x="770" y="576" class="sub" text-anchor="middle">aug</text>

<text x="800" y="430" class="sub" font-weight="700" fill="#9c6a1f">stijgende trend —</text>
<text x="800" y="443" class="sub" font-weight="700" fill="#9c6a1f">signaal op zich,</text>
<text x="800" y="456" class="sub" font-weight="700" fill="#9c6a1f">los van individueel dossier</text>
</svg>
