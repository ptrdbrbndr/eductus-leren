<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .task { fill:#CFE0F2; stroke:#14213D; stroke-width:1.5; }
    .task-disc { fill:#CFE0F2; stroke:#14213D; stroke-width:1.5; stroke-dasharray:5,3; }
    .milestone { fill:#EEF2F7; stroke:#14213D; stroke-width:1.6; }
    .fragment-box { fill:#FFFFFF; stroke:#2563A8; stroke-width:1.6; stroke-dasharray:6,4; }
    .stage { fill:#EEF2F7; stroke:#14213D; stroke-width:1.6; }
    .stage-tab { fill:#EEF2F7; stroke:#14213D; stroke-width:1.6; }
    .disc-mini { fill:#FBFAF7; stroke:#14213D; stroke-width:1.2; stroke-dasharray:3,2; }
    .disc-mini-amber { fill:#FBF6E9; stroke:#E9A13B; stroke-width:1.4; stroke-dasharray:3,2; }
    .label { font-size:12px; font-weight:700; fill:#14213D; }
    .label-sm { font-size:10.5px; font-weight:700; fill:#14213D; }
    .sub { font-size:10.5px; fill:#55606F; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    .panelhead { font-size:14px; font-weight:700; fill:#2563A8; }
    .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
    .conn { stroke:#55606F; stroke-width:1.2; fill:none; stroke-dasharray:2,2; }
    .sentry { fill:#FFFFFF; stroke:#14213D; stroke-width:1.5; }
    .th { fill:#CFE0F2; }
    .grid { stroke:#B9C4D0; stroke-width:1; }
  </style>
  <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
</defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 17 · CMMN-NOTATIE</text>
<text x="40" y="64" class="title">Plan fragment als herbruikbaar blok, met autorisatie</text>
<text x="40" y="84" class="sub">Voorbeeld: het fragment "Juridisch vooronderzoek" binnen de stage Bijzondere Situaties.</text>

<!-- ===================== LEFT: fragment notation ===================== -->
<rect x="30" y="105" width="530" height="270" rx="14" class="fragment-box"/>
<text x="50" y="128" class="panelhead">Plan fragment — Juridisch vooronderzoek</text>

<!-- human task 1 -->
<rect x="55" y="145" width="180" height="54" rx="10" class="task"/>
<circle cx="70" cy="160" r="5" fill="none" stroke="#14213D" stroke-width="1.3"/>
<path d="M63,172 q7,-9 14,0 z" fill="none" stroke="#14213D" stroke-width="1.3"/>
<text x="145" y="176" class="label-sm" text-anchor="middle">Extern advies</text>
<text x="145" y="189" class="label-sm" text-anchor="middle">opvragen</text>

<!-- connector to task 2 with sentry -->
<line x1="235" y1="172" x2="272" y2="172" class="conn"/>
<g transform="translate(280,172)"><rect x="-7" y="-7" width="14" height="14" class="sentry" transform="rotate(45 0 0)"/></g>
<line x1="288" y1="172" x2="315" y2="172" class="conn"/>

<!-- human task 2 (discretionary) -->
<rect x="320" y="145" width="200" height="54" rx="10" class="task-disc"/>
<circle cx="335" cy="160" r="5" fill="none" stroke="#14213D" stroke-width="1.3"/>
<path d="M328,172 q7,-9 14,0 z" fill="none" stroke="#14213D" stroke-width="1.3"/>
<text x="420" y="176" class="label-sm" text-anchor="middle">Advies beoordelen</text>
<text x="420" y="189" class="label-sm" text-anchor="middle">(discretionary)</text>

<!-- process task -->
<rect x="55" y="222" width="200" height="54" rx="10" class="task"/>
<line x1="63" y1="222" x2="63" y2="276" stroke="#14213D" stroke-width="1.3"/>
<line x1="68" y1="222" x2="68" y2="276" stroke="#14213D" stroke-width="1.3"/>
<text x="162" y="245" class="label-sm" text-anchor="middle">Dossier laten</text>
<text x="162" y="258" class="label-sm" text-anchor="middle">toetsen (process task)</text>

<line x1="255" y1="249" x2="290" y2="249" class="conn"/>
<line x1="290" y1="249" x2="290" y2="215" class="conn"/>
<line x1="420" y1="199" x2="420" y2="215" class="conn"/>
<g transform="translate(355,300)"><rect x="-7" y="-7" width="14" height="14" class="sentry" transform="rotate(45 0 0)"/></g>
<line x1="290" y1="215" x2="345" y2="298" class="conn"/>
<line x1="420" y1="215" x2="365" y2="298" class="conn"/>

<!-- milestone -->
<rect x="205" y="315" width="300" height="38" rx="19" class="milestone"/>
<text x="355" y="339" class="label-sm" text-anchor="middle">Milestone: Vooronderzoek afgerond</text>

<!-- arrow down to planning table -->
<line x1="295" y1="375" x2="295" y2="410" class="arrow"/>
<text x="380" y="398" class="sub">in één keer toevoegen aan de planning table</text>

<!-- stage with planning table -->
<rect x="55" y="415" width="25" height="14" rx="4" class="stage-tab"/>
<rect x="30" y="425" width="530" height="150" rx="12" class="stage"/>
<text x="50" y="450" class="label">Stage: Vooronderzoek — planning table</text>

<rect x="55" y="465" width="220" height="30" rx="6" class="disc-mini"/>
<text x="165" y="485" class="sub" text-anchor="middle">+ Rappel versturen (standaard)</text>

<rect x="55" y="505" width="220" height="30" rx="6" class="disc-mini-amber"/>
<text x="165" y="525" class="sub" text-anchor="middle" font-weight="700">+ Juridisch vooronderzoek (fragment)</text>

<rect x="300" y="465" width="240" height="70" rx="6" fill="#FFFFFF" stroke="#B9C4D0" stroke-width="1"/>
<text x="320" y="484" class="sub" font-weight="700">Toevoegen als geheel:</text>
<text x="320" y="500" class="sub">alle drie de taken en de</text>
<text x="320" y="514" class="sub">milestone worden in één</text>
<text x="320" y="528" class="sub">keuze geactiveerd.</text>

<!-- ===================== RIGHT: authorization ===================== -->
<text x="600" y="118" class="panelhead">Autorisatie — case planner-rollen</text>
<text x="600" y="136" class="sub">Wie mag welke discretionaire optie inzetten?</text>

<g transform="translate(600,155)">
  <rect x="0" y="0" width="120" height="40" class="th"/>
  <rect x="120" y="0" width="110" height="40" class="th"/>
  <rect x="230" y="0" width="110" height="40" class="th"/>
  <text x="60" y="16" class="label-sm" text-anchor="middle">Case planner-rol</text>
  <text x="175" y="16" class="label-sm" text-anchor="middle">Rappel</text>
  <text x="175" y="30" class="label-sm" text-anchor="middle">versturen</text>
  <text x="285" y="16" class="label-sm" text-anchor="middle">Fragment: Juridisch</text>
  <text x="285" y="30" class="label-sm" text-anchor="middle">vooronderzoek</text>

  <rect x="0" y="40" width="340" height="42" fill="#FFFFFF"/>
  <text x="10" y="65" class="label-sm">Junior behandelaar</text>
  <text x="175" y="65" class="sub" text-anchor="middle" font-size="14">✓</text>
  <text x="285" y="65" class="sub" text-anchor="middle" font-size="14">—</text>

  <rect x="0" y="82" width="340" height="42" fill="#EEF2F7"/>
  <text x="10" y="107" class="label-sm">Senior behandelaar</text>
  <text x="175" y="107" class="sub" text-anchor="middle" font-size="14">✓</text>
  <text x="285" y="107" class="sub" text-anchor="middle" font-size="14">✓</text>

  <rect x="0" y="124" width="340" height="42" fill="#FFFFFF"/>
  <text x="10" y="149" class="label-sm">Casemanager</text>
  <text x="175" y="149" class="sub" text-anchor="middle" font-size="14">✓</text>
  <text x="285" y="149" class="sub" text-anchor="middle" font-size="14">✓</text>

  <rect x="0" y="0" width="340" height="166" fill="none" class="grid"/>
  <line x1="0" y1="40" x2="340" y2="40" class="grid"/>
  <line x1="0" y1="82" x2="340" y2="82" class="grid"/>
  <line x1="0" y1="124" x2="340" y2="124" class="grid"/>
  <line x1="120" y1="0" x2="120" y2="166" class="grid"/>
  <line x1="230" y1="0" x2="230" y2="166" class="grid"/>
</g>

<rect x="600" y="345" width="340" height="90" rx="8" fill="#FBF6E9" stroke="#E9A13B" stroke-width="1.3"/>
<text x="615" y="366" class="sub" font-weight="700" fill="#9c6a1f">Waarom dit niet in de kale notatie zit</text>
<text x="615" y="384" class="sub">CMMN legt vast wélke discretionary items</text>
<text x="615" y="398" class="sub">bestaan, niet wíe ze mag inzetten. Dat is een</text>
<text x="615" y="412" class="sub">afspraak in de begeleidende documentatie —</text>
<text x="615" y="426" class="sub">vergelijkbaar met resource/performer bij BPMN.</text>
</svg>
