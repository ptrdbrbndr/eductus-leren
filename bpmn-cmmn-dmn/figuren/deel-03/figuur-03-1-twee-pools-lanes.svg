<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" font-family="'DM Sans', Arial, sans-serif" width="1180" height="560" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .pool { fill:#FFFFFF; stroke:#14213D; stroke-width:1.5; }
    .pool-band { fill:#CFE0F2; stroke:#14213D; stroke-width:1.5; }
    .lane-band { fill:#EEF2F7; }
    .pool-name { font-size:12px; font-weight:700; fill:#14213D; }
    .lane-name { font-size:10.5px; font-weight:700; fill:#14213D; }
    .task { fill:#CFE0F2; stroke:#14213D; stroke-width:1.4; }
    .task-label { font-size:11px; fill:#14213D; text-anchor:middle; }
    .evt-start { fill:#FBFAF7; stroke:#14213D; stroke-width:1.6; }
    .evt-end { fill:#FBFAF7; stroke:#14213D; stroke-width:3.2; }
    .evt-label { font-size:10.5px; fill:#14213D; text-anchor:middle; }
    .icon { stroke:#14213D; stroke-width:1.2; fill:none; stroke-linejoin:round; stroke-linecap:round; }
    .seq { stroke:#14213D; stroke-width:1.6; fill:none; marker-end:url(#seqarr); }
    .msg { stroke:#55606F; stroke-width:1.3; stroke-dasharray:4 3; fill:none; marker-end:url(#msgarr); marker-start:url(#msgcirc); }
    .label { font-size:14px; font-weight:700; fill:#14213D; }
    .sub { font-size:11.5px; fill:#55606F; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    .footer { font-size:11px; fill:#55606F; }
  </style>
  <marker id="seqarr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#14213D"/></marker>
  <marker id="msgarr" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#55606F" stroke-width="1.3"/></marker>
  <marker id="msgcirc" markerWidth="8" markerHeight="8" refX="3" refY="3" orient="auto"><circle cx="3" cy="3" r="2.6" fill="#FBFAF7" stroke="#55606F" stroke-width="1.1"/></marker>
  <symbol id="ic-envelope-sm" viewBox="0 0 14 10"><rect x="0.5" y="0.5" width="13" height="9" class="icon"/><polyline points="0.5,0.5 7,6 13.5,0.5" class="icon"/></symbol>
  <symbol id="ic-send" viewBox="0 0 20 16"><rect x="0.5" y="3.5" width="17" height="11" class="icon"/><polyline points="0.5,3.5 9,10 17.5,3.5" class="icon"/><path d="M12,3 L19,0.5 M19,0.5 L16.5,1 M19,0.5 L18.3,3" class="icon"/></symbol>
  <symbol id="ic-person" viewBox="0 0 16 16"><circle cx="8" cy="4.2" r="3" class="icon"/><path d="M2,15.5 C2,10.5 5,8.3 8,8.3 C11,8.3 14,10.5 14,15.5" class="icon"/></symbol>
  <symbol id="ic-gear" viewBox="0 0 18 18"><circle cx="9" cy="9" r="4" class="icon"/><circle cx="9" cy="9" r="1.5" fill="#14213D"/><g class="icon"><line x1="9" y1="1" x2="9" y2="4"/><line x1="9" y1="14" x2="9" y2="17"/><line x1="1" y1="9" x2="4" y2="9"/><line x1="14" y1="9" x2="17" y2="9"/><line x1="3.2" y1="3.2" x2="5.3" y2="5.3"/><line x1="12.7" y1="12.7" x2="14.8" y2="14.8"/><line x1="14.8" y1="3.2" x2="12.7" y2="5.3"/><line x1="5.3" y1="12.7" x2="3.2" y2="14.8"/></g></symbol>
</defs>
<rect width="1180" height="560" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 03 · BPMN-NOTATIE</text>
<text x="40" y="64" class="title">Figuur 3.1 — Twee pools met lanes: de deelnemer en Meridiaan</text>
<text x="40" y="84" class="sub">Message flow tussen de pools, sequence flow binnen elke pool (reader §3.2)</text>

<!-- Pool Deelnemer -->
<rect x="40" y="150" width="230" height="160" class="pool" rx="3"/>
<text x="52" y="172" class="pool-name">Deelnemer</text>
<line x1="40" y1="180" x2="270" y2="180" stroke="#14213D" stroke-width="1"/>
<circle cx="90" cy="245" r="13" class="evt-start"/>
<rect x="130" y="220" width="120" height="50" rx="10" class="task"/>
<use href="#ic-send" x="138" y="228" width="20" height="16"/>
<text x="190" y="250" class="task-label">Adreswijziging</text>
<text x="190" y="263" class="task-label">indienen</text>
<line x1="103" y1="245" x2="130" y2="245" class="seq"/>

<!-- Pool Meridiaan -->
<rect x="360" y="110" width="780" height="380" class="pool" rx="3"/>
<rect x="360" y="110" width="24" height="380" class="pool-band"/>
<text class="pool-name" transform="rotate(-90 376 300)" x="376" y="300" text-anchor="middle">Meridiaan Pensioen N.V.</text>
<rect x="384" y="110" width="20" height="380" class="lane-band"/>
<line x1="384" y1="300" x2="1140" y2="300" stroke="#14213D" stroke-width="1"/>
<line x1="404" y1="110" x2="404" y2="490" stroke="#14213D" stroke-width="1"/>
<text class="lane-name" transform="rotate(-90 396 205)" x="396" y="205" text-anchor="middle">Portaal</text>
<text class="lane-name" transform="rotate(-90 396 395)" x="396" y="395" text-anchor="middle" style="font-size:9.5px">Medewerker Klantcontact</text>

<!-- Portaal lane content -->
<circle cx="450" cy="190" r="13" class="evt-start"/>
<use href="#ic-envelope-sm" x="443" y="185" width="14" height="10"/>
<rect x="500" y="165" width="160" height="50" rx="10" class="task"/>
<use href="#ic-gear" x="508" y="173" width="18" height="18"/>
<text x="590" y="192" class="task-label">Mutatie</text>
<text x="590" y="205" class="task-label">registreren</text>
<line x1="463" y1="190" x2="500" y2="190" class="seq"/>

<!-- Medewerker Klantcontact lane content -->
<rect x="500" y="360" width="160" height="50" rx="10" class="task"/>
<use href="#ic-person" x="512" y="368" width="16" height="16"/>
<text x="600" y="390" class="task-label">Mutatie verwerken</text>
<line x1="580" y1="215" x2="580" y2="360" class="seq"/>
<circle cx="770" cy="385" r="14" class="evt-end"/>
<line x1="660" y1="385" x2="756" y2="385" class="seq"/>
<text x="770" y="418" class="evt-label">Mutatie verwerkt</text>

<!-- Message flow between pools -->
<path d="M250,245 C 320,245 380,190 437,190" class="msg"/>

<!-- Legend -->
<line x1="400" y1="518" x2="440" y2="518" class="seq"/>
<text x="448" y="522" class="footer">sequence flow — binnen één pool</text>
<line x1="400" y1="538" x2="440" y2="538" class="msg"/>
<text x="448" y="542" class="footer">message flow — tussen pools, geen volgordebetekenis</text>
<text x="40" y="540" class="footer">Casus: e-mailadreswijziging bij Meridiaan Pensioen N.V.</text>
</svg>
