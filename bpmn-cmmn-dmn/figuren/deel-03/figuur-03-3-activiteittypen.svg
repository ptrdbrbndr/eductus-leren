<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 760" font-family="'DM Sans', Arial, sans-serif" width="1040" height="760" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .task { fill:#CFE0F2; stroke:#14213D; stroke-width:1.4; }
    .task-plain { fill:#EEF2F7; stroke:#14213D; stroke-width:1.4; }
    .task-label { font-size:13px; font-weight:700; fill:#14213D; text-anchor:middle; }
    .task-sub { font-size:10.5px; fill:#55606F; text-anchor:middle; }
    .icon { stroke:#14213D; stroke-width:1.2; fill:none; stroke-linejoin:round; stroke-linecap:round; }
    .miniseq { stroke:#14213D; stroke-width:1.2; fill:none; marker-end:url(#miniarr); }
    .mini-evt-start { fill:#FBFAF7; stroke:#14213D; stroke-width:1.3; }
    .mini-evt-end { fill:#FBFAF7; stroke:#14213D; stroke-width:2.4; }
    .label { font-size:14px; font-weight:700; fill:#14213D; }
    .sub { font-size:11.5px; fill:#55606F; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    .footer { font-size:11px; fill:#55606F; }
  </style>
  <marker id="miniarr" markerWidth="7" markerHeight="7" refX="5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="#14213D"/></marker>
  <symbol id="ic-person" viewBox="0 0 16 16"><circle cx="8" cy="4.2" r="3" class="icon"/><path d="M2,15.5 C2,10.5 5,8.3 8,8.3 C11,8.3 14,10.5 14,15.5" class="icon"/></symbol>
  <symbol id="ic-gear" viewBox="0 0 18 18"><circle cx="9" cy="9" r="4" class="icon"/><circle cx="9" cy="9" r="1.5" fill="#14213D"/><g class="icon"><line x1="9" y1="1" x2="9" y2="4"/><line x1="9" y1="14" x2="9" y2="17"/><line x1="1" y1="9" x2="4" y2="9"/><line x1="14" y1="9" x2="17" y2="9"/><line x1="3.2" y1="3.2" x2="5.3" y2="5.3"/><line x1="12.7" y1="12.7" x2="14.8" y2="14.8"/><line x1="14.8" y1="3.2" x2="12.7" y2="5.3"/><line x1="5.3" y1="12.7" x2="3.2" y2="14.8"/></g></symbol>
  <symbol id="ic-hand" viewBox="0 0 16 16"><rect x="3" y="7" width="10" height="8" rx="3" class="icon"/><line x1="5.5" y1="7" x2="5.5" y2="2" class="icon"/><line x1="8" y1="7" x2="8" y2="1.5" class="icon"/><line x1="10.5" y1="7" x2="10.5" y2="2.5" class="icon"/></symbol>
  <symbol id="ic-send" viewBox="0 0 20 16"><rect x="0.5" y="3.5" width="17" height="11" class="icon"/><polyline points="0.5,3.5 9,10 17.5,3.5" class="icon"/><path d="M12,3 L19,0.5 M19,0.5 L16.5,1 M19,0.5 L18.3,3" class="icon"/></symbol>
  <symbol id="ic-receive" viewBox="0 0 20 16"><rect x="0.5" y="3.5" width="17" height="11" class="icon"/><polyline points="0.5,3.5 9,10 17.5,3.5" class="icon"/><path d="M19,0.5 L12,3 M12,3 L13.2,1 M12,3 L14.5,3.3" class="icon"/></symbol>
  <symbol id="ic-table" viewBox="0 0 18 14"><rect x="0.5" y="0.5" width="17" height="13" class="icon"/><line x1="0.5" y1="5" x2="17.5" y2="5" class="icon"/><line x1="0.5" y1="9.5" x2="17.5" y2="9.5" class="icon"/><line x1="9" y1="0.5" x2="9" y2="13.5" class="icon"/></symbol>
  <symbol id="ic-plus" viewBox="0 0 14 14"><rect x="0.5" y="0.5" width="13" height="13" fill="#FBFAF7" stroke="#14213D" stroke-width="1.2"/><line x1="7" y1="3" x2="7" y2="11" stroke="#14213D" stroke-width="1.4"/><line x1="3" y1="7" x2="11" y2="7" stroke="#14213D" stroke-width="1.4"/></symbol>
</defs>
<rect width="1040" height="760" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 03 · BPMN-NOTATIE</text>
<text x="40" y="64" class="title">Figuur 3.3 — Activiteittypen en hun markers</text>
<text x="40" y="84" class="sub">Afgeronde rechthoek als basisvorm; het icoontje linksboven toont het type (reader §3.3)</text>

<!-- Row 1 -->
<!-- (1,1) Task -->
<rect x="90" y="150" width="200" height="70" rx="14" class="task-plain"/>
<text x="190" y="242" class="task-label">Task</text>
<text x="190" y="260" class="task-sub">geen marker — enkelvoudige stap</text>

<!-- (1,2) User task -->
<rect x="420" y="150" width="200" height="70" rx="14" class="task"/>
<use href="#ic-person" x="430" y="160" width="18" height="18"/>
<text x="520" y="242" class="task-label">User task</text>
<text x="520" y="260" class="task-sub">marker: mensfiguur</text>

<!-- (1,3) Service task -->
<rect x="750" y="150" width="200" height="70" rx="14" class="task"/>
<use href="#ic-gear" x="758" y="158" width="20" height="20"/>
<text x="850" y="242" class="task-label">Service task</text>
<text x="850" y="260" class="task-sub">marker: tandwiel</text>

<!-- Row 2 -->
<!-- (2,1) Manual task -->
<rect x="90" y="350" width="200" height="70" rx="14" class="task"/>
<use href="#ic-hand" x="100" y="360" width="18" height="18"/>
<text x="190" y="442" class="task-label">Manual task</text>
<text x="190" y="460" class="task-sub">marker: hand</text>

<!-- (2,2) Send task -->
<rect x="420" y="350" width="200" height="70" rx="14" class="task"/>
<use href="#ic-send" x="428" y="360" width="20" height="16"/>
<text x="520" y="442" class="task-label">Send task</text>
<text x="520" y="460" class="task-sub">marker: envelop, pijl naar buiten</text>

<!-- (2,3) Receive task -->
<rect x="750" y="350" width="200" height="70" rx="14" class="task"/>
<use href="#ic-receive" x="758" y="360" width="20" height="16"/>
<text x="850" y="442" class="task-label">Receive task</text>
<text x="850" y="460" class="task-sub">marker: envelop, pijl naar binnen</text>

<!-- Row 3 -->
<!-- (3,1) Business rule task -->
<rect x="90" y="550" width="200" height="70" rx="14" class="task"/>
<use href="#ic-table" x="98" y="560" width="20" height="16"/>
<text x="190" y="642" class="task-label">Business rule task</text>
<text x="190" y="660" class="task-sub">marker: tabelletje — koppelt aan DMN</text>

<!-- (3,2) Collapsed subprocess -->
<rect x="420" y="550" width="200" height="70" rx="14" class="task-plain"/>
<use href="#ic-plus" x="513" y="606" width="14" height="14"/>
<text x="520" y="642" class="task-label">Subprocess (collapsed)</text>
<text x="520" y="660" class="task-sub">marker: plusteken onderaan midden</text>

<!-- (3,3) Expanded subprocess -->
<rect x="750" y="550" width="200" height="70" rx="14" class="task-plain"/>
<circle cx="770" cy="585" r="8" class="mini-evt-start"/>
<rect x="800" y="573" width="70" height="24" rx="6" fill="#CFE0F2" stroke="#14213D" stroke-width="1.1"/>
<circle cx="920" cy="585" r="8" class="mini-evt-end"/>
<line x1="778" y1="585" x2="798" y2="585" class="miniseq"/>
<line x1="870" y1="585" x2="910" y2="585" class="miniseq"/>
<text x="850" y="642" class="task-label">Subprocess (expanded)</text>
<text x="850" y="660" class="task-sub">inhoud zichtbaar, geen plusmarker</text>

<line x1="40" y1="700" x2="1000" y2="700" stroke="#E3E0D8" stroke-width="1"/>
<text x="40" y="726" class="footer">Naamgeving (reader §3.3): werkwoord plus object, gebiedende of infinitiefvorm — "Aanvraag beoordelen", niet "Aanvraagbeoordeling".</text>
</svg>
