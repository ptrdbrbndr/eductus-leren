<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'DM Sans', Arial, sans-serif" width="960" height="560" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .th { fill:#14213D; }
    .th-t { font-size:12px; font-weight:700; fill:#FBFAF7; }
    .rowlbl { fill:#FFFFFF; }
    .rowlbl-alt { fill:#EEF2F7; }
    .own { fill:#2563A8; }
    .own-t { font-size:11px; font-weight:700; fill:#FBFAF7; }
    .read { fill:#CFE0F2; }
    .read-t { font-size:11px; font-weight:700; fill:#14213D; }
    .none-t { font-size:12px; fill:#B9C4D0; }
    .rowtext { font-size:11px; font-weight:700; fill:#14213D; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    .sub { font-size:10.5px; fill:#55606F; }
    .grid { stroke:#E3E0D8; stroke-width:1; }
  </style>
</defs>
<rect width="960" height="560" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 18 · MATRIX</text>
<text x="40" y="64" class="title">Bron van waarheid: eigenaar en lezers per gegeven</text>
<text x="40" y="84" class="sub">Voor elk gegeven één eigenaar; de andere modellen lezen, maar wijzigen het niet zelf.</text>

<g transform="translate(40,110)">
  <!-- header -->
  <rect x="0" y="0" width="240" height="46" class="th"/>
  <text x="12" y="28" class="th-t">Gegeven</text>
  <rect x="240" y="0" width="165" height="46" class="th"/>
  <text x="322" y="20" class="th-t" text-anchor="middle">BPMN-</text>
  <text x="322" y="34" class="th-t" text-anchor="middle">proces</text>
  <rect x="405" y="0" width="165" height="46" class="th"/>
  <text x="487" y="20" class="th-t" text-anchor="middle">CMMN-</text>
  <text x="487" y="34" class="th-t" text-anchor="middle">case</text>
  <rect x="570" y="0" width="165" height="46" class="th"/>
  <text x="652" y="20" class="th-t" text-anchor="middle">DMN-</text>
  <text x="652" y="34" class="th-t" text-anchor="middle">decision</text>
  <rect x="735" y="0" width="165" height="46" class="th"/>
  <text x="817" y="20" class="th-t" text-anchor="middle">Legacy</text>
  <text x="817" y="34" class="th-t" text-anchor="middle">polissysteem</text>

  <!-- row helper macro via repeated groups -->
  <!-- Row 1 -->
  <g transform="translate(0,46)">
    <rect x="0" y="0" width="240" height="52" class="rowlbl"/>
    <text x="12" y="22" class="rowtext">Status van de mutatie</text>
    <text x="12" y="38" class="sub">(binnen het proces)</text>
    <rect x="240" y="0" width="165" height="52" class="own"/><text x="322" y="30" class="own-t" text-anchor="middle">Eigenaar</text>
    <rect x="405" y="0" width="165" height="52" class="read"/><text x="487" y="30" class="read-t" text-anchor="middle">Leest</text>
    <rect x="570" y="0" width="165" height="52" fill="#FFFFFF"/><text x="652" y="30" class="none-t" text-anchor="middle">—</text>
    <rect x="735" y="0" width="165" height="52" fill="#FFFFFF"/><text x="817" y="30" class="none-t" text-anchor="middle">—</text>
  </g>
  <!-- Row 2 -->
  <g transform="translate(0,98)">
    <rect x="0" y="0" width="240" height="52" class="rowlbl-alt"/>
    <text x="12" y="22" class="rowtext">Uitkomst classificatie-</text>
    <text x="12" y="38" class="rowtext">beslissing (route)</text>
    <rect x="240" y="0" width="165" height="52" class="read"/><text x="322" y="30" class="read-t" text-anchor="middle">Leest</text>
    <rect x="405" y="0" width="165" height="52" class="read"/><text x="487" y="30" class="read-t" text-anchor="middle">Leest</text>
    <rect x="570" y="0" width="165" height="52" class="own"/><text x="652" y="30" class="own-t" text-anchor="middle">Eigenaar</text>
    <rect x="735" y="0" width="165" height="52" fill="#FFFFFF"/><text x="817" y="30" class="none-t" text-anchor="middle">—</text>
  </g>
  <!-- Row 3 -->
  <g transform="translate(0,150)">
    <rect x="0" y="0" width="240" height="52" class="rowlbl"/>
    <text x="12" y="22" class="rowtext">Status herberekening</text>
    <text x="12" y="38" class="sub">(process task)</text>
    <rect x="240" y="0" width="165" height="52" class="own"/><text x="322" y="30" class="own-t" text-anchor="middle">Eigenaar</text>
    <rect x="405" y="0" width="165" height="52" class="read"/><text x="487" y="30" class="read-t" text-anchor="middle">Leest</text>
    <rect x="570" y="0" width="165" height="52" fill="#FFFFFF"/><text x="652" y="30" class="none-t" text-anchor="middle">—</text>
    <rect x="735" y="0" width="165" height="52" fill="#FFFFFF"/><text x="817" y="30" class="none-t" text-anchor="middle">—</text>
  </g>
  <!-- Row 4 -->
  <g transform="translate(0,202)">
    <rect x="0" y="0" width="240" height="52" class="rowlbl-alt"/>
    <text x="12" y="22" class="rowtext">Dossierstatus klacht</text>
    <rect x="240" y="0" width="165" height="52" class="read"/><text x="322" y="30" class="read-t" text-anchor="middle">Leest</text>
    <rect x="405" y="0" width="165" height="52" class="own"/><text x="487" y="30" class="own-t" text-anchor="middle">Eigenaar</text>
    <rect x="570" y="0" width="165" height="52" fill="#FFFFFF"/><text x="652" y="30" class="none-t" text-anchor="middle">—</text>
    <rect x="735" y="0" width="165" height="52" fill="#FFFFFF"/><text x="817" y="30" class="none-t" text-anchor="middle">—</text>
  </g>
  <!-- Row 5 -->
  <g transform="translate(0,254)">
    <rect x="0" y="0" width="240" height="52" class="rowlbl"/>
    <text x="12" y="22" class="rowtext">NAW-gegevens deelnemer</text>
    <text x="12" y="38" class="sub">(35 jaar oud bronsysteem)</text>
    <rect x="240" y="0" width="165" height="52" class="read"/><text x="322" y="30" class="read-t" text-anchor="middle">Leest</text>
    <rect x="405" y="0" width="165" height="52" class="read"/><text x="487" y="30" class="read-t" text-anchor="middle">Leest</text>
    <rect x="570" y="0" width="165" height="52" class="read"/><text x="652" y="30" class="read-t" text-anchor="middle">Leest</text>
    <rect x="735" y="0" width="165" height="52" class="own"/><text x="817" y="30" class="own-t" text-anchor="middle">Eigenaar</text>
  </g>
  <!-- Row 6 -->
  <g transform="translate(0,306)">
    <rect x="0" y="0" width="240" height="52" class="rowlbl-alt"/>
    <text x="12" y="22" class="rowtext">Versie beslislogica</text>
    <text x="12" y="38" class="sub">(regelrepository, deel 16)</text>
    <rect x="240" y="0" width="165" height="52" class="read"/><text x="322" y="30" class="read-t" text-anchor="middle">Leest</text>
    <rect x="405" y="0" width="165" height="52" class="read"/><text x="487" y="30" class="read-t" text-anchor="middle">Leest</text>
    <rect x="570" y="0" width="165" height="52" class="own"/><text x="652" y="30" class="own-t" text-anchor="middle">Eigenaar</text>
    <rect x="735" y="0" width="165" height="52" fill="#FFFFFF"/><text x="817" y="30" class="none-t" text-anchor="middle">—</text>
  </g>

  <!-- grid lines -->
  <rect x="0" y="0" width="900" height="358" fill="none" class="grid" stroke-width="1.5"/>
  <line x1="0" y1="46" x2="900" y2="46" class="grid"/>
  <line x1="0" y1="98" x2="900" y2="98" class="grid"/>
  <line x1="0" y1="150" x2="900" y2="150" class="grid"/>
  <line x1="0" y1="202" x2="900" y2="202" class="grid"/>
  <line x1="0" y1="254" x2="900" y2="254" class="grid"/>
  <line x1="0" y1="306" x2="900" y2="306" class="grid"/>
  <line x1="240" y1="0" x2="240" y2="358" class="grid"/>
  <line x1="405" y1="0" x2="405" y2="358" class="grid"/>
  <line x1="570" y1="0" x2="570" y2="358" class="grid"/>
  <line x1="735" y1="0" x2="735" y2="358" class="grid"/>
</g>

<rect x="40" y="482" width="880" height="46" rx="8" fill="#FBF6E9" stroke="#E9A13B" stroke-width="1.3"/>
<text x="480" y="502" class="sub" text-anchor="middle" font-weight="700" fill="#9c6a1f">Het legacy polissysteem blijft eigenaar van de NAW-gegevens — elk model leest via het koppelvlak.</text>
<text x="480" y="518" class="sub" text-anchor="middle" fill="#9c6a1f">Houden twee modellen zelf een status bij voor hetzelfde gegeven, dan lopen ze uit de pas (§18.4).</text>
</svg>
