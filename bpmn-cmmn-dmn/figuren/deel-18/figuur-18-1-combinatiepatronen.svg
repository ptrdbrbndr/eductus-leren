<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'DM Sans', Arial, sans-serif" width="960" height="560" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .panel { fill:#FFFFFF; stroke:#E3E0D8; stroke-width:1.3; }
    .task { fill:#CFE0F2; stroke:#14213D; stroke-width:1.3; }
    .stage { fill:#EEF2F7; stroke:#14213D; stroke-width:1.4; }
    .decision { fill:#FBF6E9; stroke:#14213D; stroke-width:1.5; }
    .pool { fill:#FFFFFF; stroke:#55606F; stroke-width:1.2; }
    .patname { font-size:12.3px; font-weight:700; fill:#14213D; }
    .sub { font-size:9.6px; fill:#55606F; }
    .lbl { font-size:8.6px; font-weight:700; fill:#14213D; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    .arrow { stroke:#55606F; stroke-width:1.4; fill:none; marker-end:url(#arr); }
    .kp { fill:#E9A13B; stroke:#14213D; stroke-width:1.2; }
    .kplabel { font-size:8.3px; font-weight:700; fill:#9c6a1f; }
  </style>
  <marker id="arr" markerWidth="8" markerHeight="8" refX="5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="#55606F"/></marker>
</defs>
<rect width="960" height="560" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 18 · PATRONEN</text>
<text x="40" y="64" class="title">De vijf combinatiepatronen, met het koppelpunt gemarkeerd</text>
<text x="40" y="84" class="sub">Elk patroon voegt één koppelpunt toe — elk koppelpunt is een plek waar twee modellen synchroon moeten blijven.</text>

<rect x="30" y="100" width="176" height="410" rx="10" class="panel"/>
<rect x="214" y="100" width="176" height="410" rx="10" class="panel"/>
<rect x="398" y="100" width="176" height="410" rx="10" class="panel"/>
<rect x="582" y="100" width="176" height="410" rx="10" class="panel"/>
<rect x="766" y="100" width="176" height="410" rx="10" class="panel"/>

<!-- 1: Proces roept beslissing aan -->
<g transform="translate(30,0)">
  <text x="88" y="122" class="patname" text-anchor="middle">Proces roept</text>
  <text x="88" y="137" class="patname" text-anchor="middle">beslissing aan</text>
  <rect x="43" y="160" width="100" height="40" rx="8" class="task"/>
  <rect x="51" y="167" width="14" height="10" fill="none" stroke="#14213D" stroke-width="1"/>
  <line x1="51" y1="172" x2="65" y2="172" stroke="#14213D" stroke-width="0.8"/>
  <line x1="58" y1="167" x2="58" y2="177" stroke="#14213D" stroke-width="0.8"/>
  <text x="93" y="184" class="lbl" text-anchor="middle">Classificeren</text>
  <text x="93" y="195" class="lbl" text-anchor="middle" font-size="7.5">(business rule task)</text>
  <line x1="93" y1="200" x2="93" y2="228" class="arrow"/>
  <circle cx="93" cy="214" r="7" class="kp"/>
  <text x="93" y="248" class="kplabel" text-anchor="middle">koppelpunt</text>
  <rect x="58" y="232" width="70" height="34" class="decision"/>
  <text x="93" y="253" class="lbl" text-anchor="middle">Decision</text>
  <text x="93" y="300" class="sub" text-anchor="middle">Eenvoudigste patroon —</text>
  <text x="93" y="313" class="sub" text-anchor="middle" font-weight="700">komt verreweg het</text>
  <text x="93" y="326" class="sub" text-anchor="middle" font-weight="700">vaakst voor, kost het</text>
  <text x="93" y="339" class="sub" text-anchor="middle" font-weight="700">minst.</text>
</g>

<!-- 2: Case bevat processen -->
<g transform="translate(214,0)">
  <text x="88" y="122" class="patname" text-anchor="middle">Case bevat</text>
  <text x="88" y="137" class="patname" text-anchor="middle">processen</text>
  <rect x="43" y="163" width="25" height="11" rx="4" class="stage"/>
  <rect x="25" y="174" width="130" height="70" rx="10" class="stage"/>
  <text x="90" y="192" class="sub" text-anchor="middle">Case</text>
  <rect x="55" y="200" width="70" height="34" rx="7" class="task"/>
  <line x1="63" y1="200" x2="63" y2="234" stroke="#14213D" stroke-width="1"/>
  <line x1="68" y1="200" x2="68" y2="234" stroke="#14213D" stroke-width="1"/>
  <text x="97" y="220" class="lbl" text-anchor="middle" font-size="7.5">process</text>
  <text x="97" y="230" class="lbl" text-anchor="middle" font-size="7.5">task</text>
  <line x1="125" y1="217" x2="150" y2="217" class="arrow"/>
  <circle cx="138" cy="217" r="7" class="kp"/>
  <rect x="150" y="200" width="18" height="34" class="pool"/>
  <line x1="153" y1="207" x2="163" y2="207" stroke="#55606F" stroke-width="1"/>
  <line x1="153" y1="215" x2="163" y2="215" stroke="#55606F" stroke-width="1"/>
  <line x1="153" y1="223" x2="163" y2="223" stroke="#55606F" stroke-width="1"/>
  <text x="90" y="260" class="kplabel" text-anchor="middle">koppelpunt</text>
  <text x="90" y="300" class="sub" text-anchor="middle">Voor het gestructureerde</text>
  <text x="90" y="313" class="sub" text-anchor="middle" font-weight="700">deel van een verder</text>
  <text x="90" y="326" class="sub" text-anchor="middle" font-weight="700">ongestructureerd dossier.</text>
</g>

<!-- 3: Proces start een case -->
<g transform="translate(398,0)">
  <text x="88" y="122" class="patname" text-anchor="middle">Proces start</text>
  <text x="88" y="137" class="patname" text-anchor="middle">een case</text>
  <circle cx="20" cy="195" r="8" fill="#FFFFFF" stroke="#14213D" stroke-width="1.3"/>
  <line x1="28" y1="195" x2="42" y2="195" class="arrow"/>
  <rect x="42" y="180" width="36" height="30" rx="6" class="task"/>
  <line x1="78" y1="195" x2="98" y2="195" class="arrow"/>
  <circle cx="88" cy="195" r="7" class="kp"/>
  <rect x="98" y="182" width="20" height="11" rx="4" class="stage"/>
  <rect x="98" y="192" width="65" height="45" rx="10" class="stage"/>
  <text x="130" y="218" class="sub" text-anchor="middle">Case</text>
  <text x="88" y="250" class="kplabel" text-anchor="middle">koppelpunt</text>
  <text x="90" y="300" class="sub" text-anchor="middle">Spiegelbeeld van patroon 2</text>
  <text x="90" y="313" class="sub" text-anchor="middle" font-weight="700">— merendeel gestructureerd,</text>
  <text x="90" y="326" class="sub" text-anchor="middle" font-weight="700">uitzonderlijk deel vraagt</text>
  <text x="90" y="339" class="sub" text-anchor="middle" font-weight="700">casebehandeling.</text>
</g>

<!-- 4: Case bevat cases -->
<g transform="translate(582,0)">
  <text x="88" y="122" class="patname" text-anchor="middle">Case bevat cases</text>
  <rect x="33" y="163" width="25" height="11" rx="4" class="stage"/>
  <rect x="15" y="174" width="150" height="80" rx="10" class="stage"/>
  <text x="90" y="192" class="sub" text-anchor="middle">Hoofdklacht (case)</text>
  <rect x="45" y="200" width="90" height="40" rx="8" class="task"/>
  <line x1="53" y1="200" x2="53" y2="240" stroke="#14213D" stroke-width="1"/>
  <line x1="58" y1="200" x2="58" y2="240" stroke="#14213D" stroke-width="1"/>
  <rect x="63" y="208" width="15" height="9" rx="3" fill="#FFFFFF" stroke="#14213D" stroke-width="0.9"/>
  <text x="90" y="230" class="lbl" text-anchor="middle" font-size="7.5">case task:</text>
  <text x="90" y="238" class="lbl" text-anchor="middle" font-size="7.5">deelonderzoek</text>
  <circle cx="90" cy="200" r="6" class="kp"/>
  <text x="90" y="264" class="kplabel" text-anchor="middle">koppelpunt</text>
  <text x="90" y="298" class="sub" text-anchor="middle">Deeldossiers met een</text>
  <text x="90" y="311" class="sub" text-anchor="middle" font-weight="700">eigen levenscyclus —</text>
  <text x="90" y="324" class="sub" text-anchor="middle" font-weight="700">duurste patroon om te</text>
  <text x="90" y="337" class="sub" text-anchor="middle" font-weight="700">onderhouden.</text>
</g>

<!-- 5: Beslissing binnen een case -->
<g transform="translate(766,0)">
  <text x="88" y="122" class="patname" text-anchor="middle">Beslissing</text>
  <text x="88" y="137" class="patname" text-anchor="middle">binnen een case</text>
  <rect x="33" y="163" width="25" height="11" rx="4" class="stage"/>
  <rect x="15" y="174" width="150" height="60" rx="10" class="stage"/>
  <text x="90" y="192" class="sub" text-anchor="middle">Case</text>
  <rect x="45" y="200" width="80" height="26" rx="6" class="task"/>
  <rect x="52" y="205" width="14" height="9" fill="none" stroke="#14213D" stroke-width="0.9"/>
  <line x1="52" y1="209" x2="66" y2="209" stroke="#14213D" stroke-width="0.7"/>
  <text x="90" y="217" class="lbl" text-anchor="middle" font-size="7.5">decision task</text>
  <line x1="125" y1="213" x2="150" y2="213" class="arrow"/>
  <circle cx="138" cy="213" r="7" class="kp"/>
  <rect x="150" y="196" width="18" height="34" class="decision"/>
  <text x="90" y="255" class="kplabel" text-anchor="middle">koppelpunt</text>
  <text x="90" y="288" class="sub" text-anchor="middle">Voor een beslismoment in</text>
  <text x="90" y="301" class="sub" text-anchor="middle" font-weight="700">een dossier zonder verder</text>
  <text x="90" y="314" class="sub" text-anchor="middle" font-weight="700">vaste volgorde.</text>
</g>

<rect x="30" y="522" width="912" height="30" rx="6" fill="#EEF2F7"/>
<text x="486" y="542" class="sub" text-anchor="middle">Kies het eenvoudigste patroon dat de werkelijkheid nog correct weergeeft — niet het meest indrukwekkende.</text>
</svg>
