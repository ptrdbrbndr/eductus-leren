<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" font-family="'DM Sans', Arial, sans-serif" width="1100" height="720" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .stage { fill:#FFFFFF; stroke:#14213D; stroke-width:1.6; }
    .stagetxt { font-size:13.5px; font-weight:700; fill:#14213D; text-anchor:middle; }
    .stagesub { font-size:10.5px; fill:#55606F; text-anchor:middle; }
    .arrow { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arr); }
    .label { font-size:14px; font-weight:700; fill:#14213D; }
    .sub { font-size:12px; fill:#55606F; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    .panel { fill:#FFFFFF; stroke:#E3E0D8; stroke-width:1.3; }
    .tlaxis { stroke:#55606F; stroke-width:1.4; }
    .tlmark { fill:#14213D; }
    .tltxt { font-size:10.5px; fill:#14213D; text-anchor:middle; }
    .tlsub { font-size:9.5px; fill:#55606F; text-anchor:middle; }
    .riskband { fill:#FBF6E9; stroke:#E9A13B; stroke-width:1.4; }
    .risktxt { font-size:11.5px; font-weight:700; fill:#8A5A12; }
  </style>
  <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#2563A8"/></marker>
</defs>
<rect width="1100" height="720" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 27 · MODEL RISK MANAGEMENT-RAAMWERK</text>
<text x="40" y="64" class="title">Figuur 27.4 — Het model risk management-raamwerk</text>
<text x="40" y="86" class="sub">Beslislogica als risico-object, met het scenario "jarenlang fout" uitgewerkt (§27.5).</text>

<!-- Cycle of 4 stages -->
<rect x="60" y="120" width="220" height="90" rx="8" class="stage"/>
<text x="170" y="152" class="stagetxt">Validatie vóór</text>
<text x="170" y="170" class="stagetxt">ingebruikname</text>
<text x="170" y="192" class="stagesub">testcases, review, akkoord eigenaar</text>

<path d="M280,165 H340" class="arrow"/>

<rect x="340" y="120" width="220" height="90" rx="8" class="stage"/>
<text x="450" y="152" class="stagetxt">Eigenaarschap</text>
<text x="450" y="170" class="stagetxt">toegewezen</text>
<text x="450" y="192" class="stagesub">één verantwoordelijke per decision</text>

<path d="M560,165 H620" class="arrow"/>

<rect x="620" y="120" width="220" height="90" rx="8" class="stage"/>
<text x="730" y="152" class="stagetxt">Periodieke</text>
<text x="730" y="170" class="stagetxt">herbeoordeling</text>
<text x="730" y="192" class="stagesub">vast ritme, zoals mining-feedbackloop (§21.4)</text>

<path d="M840,165 H900" class="arrow"/>

<rect x="900" y="120" width="160" height="90" rx="8" class="stage" style="fill:#FBF6E9; stroke:#B8721B;"/>
<text x="980" y="152" class="stagetxt" style="fill:#8A5A12;">Signaal van</text>
<text x="980" y="170" class="stagetxt" style="fill:#8A5A12;">buitenaf</text>
<text x="980" y="192" class="stagesub" style="fill:#8A5A12;">deelnemer, audit, mining</text>

<!-- return arrow closing the loop -->
<path d="M980,210 C980,260 170,260 170,210" class="arrow" style="stroke:#55606F;" marker-end="url(#arr)"/>
<text x="575" y="252" text-anchor="middle" class="stagesub">terug naar herbeoordeling — het ritme herhaalt zich</text>

<!-- Timeline inset: "jarenlang fout" -->
<rect x="60" y="300" width="1000" height="380" class="panel" rx="8"/>
<text x="84" y="330" class="label" style="font-size:15px;">Scenario uitgewerkt: een regel die jarenlang ongemerkt fout stond</text>
<text x="84" y="350" class="sub">Een uitzonderingsregel voor een kleine populatie wordt zelden geraakt — daardoor blijft een fout lang onzichtbaar.</text>

<line x1="120" y1="450" x2="1020" y2="450" class="tlaxis"/>

<!-- markers -->
<circle cx="180" cy="450" r="6" class="tlmark"/>
<text x="180" y="475" class="tltxt">2023</text>
<text x="180" y="490" class="tlsub">Regel in productie</text>
<text x="180" y="503" class="tlsub">(gevalideerd, akkoord)</text>

<circle cx="360" cy="450" r="6" fill="#B8721B"/>
<text x="360" y="475" class="tltxt" style="fill:#8A5A12; font-weight:700;">2024</text>
<text x="360" y="490" class="tlsub" style="fill:#8A5A12;">Onderliggende wet wijzigt</text>
<text x="360" y="503" class="tlsub" style="fill:#8A5A12;">regel niet meegewijzigd</text>

<!-- risk band showing the unnoticed years -->
<rect x="360" y="440" width="480" height="20" class="riskband" fill-opacity=".55"/>
<text x="600" y="425" text-anchor="middle" class="risktxt">± 3 jaar ongemerkt fout — regel zelden geraakt (kleine populatie)</text>

<circle cx="600" cy="450" r="5" fill="#B8721B"/>
<text x="600" y="530" text-anchor="middle" class="tlsub">Periodieke herbeoordeling gemist:</text>
<text x="600" y="543" text-anchor="middle" class="tlsub">regel viel buiten het reguliere ritme</text>

<circle cx="840" cy="450" r="7" fill="#E9A13B" stroke="#8A5A12" stroke-width="1.6"/>
<text x="840" y="475" class="tltxt" style="fill:#8A5A12; font-weight:700;">2027</text>
<text x="840" y="490" class="tlsub" style="fill:#8A5A12;">Mining-bevinding (deel 25)</text>
<text x="840" y="503" class="tlsub" style="fill:#8A5A12;">legt afwijking bloot</text>

<circle cx="980" cy="450" r="6" class="tlmark"/>
<text x="980" y="475" class="tltxt">2027</text>
<text x="980" y="490" class="tlsub">Herstel + hertoetsing</text>
<text x="980" y="503" class="tlsub">populatie, terugmelding</text>

<!-- conclusion box -->
<rect x="84" y="570" width="936" height="90" fill="#EEF2F7" stroke="#14213D" stroke-width="1.2" rx="6"/>
<text x="100" y="594" class="stagesub" style="font-size:11.5px; fill:#14213D; font-weight:700;">Les: validatie bij ingebruikname is niet genoeg.</text>
<text x="100" y="614" class="stagesub" style="font-size:11.5px; fill:#14213D;">Een vast herbeoordelingsritme — ongeacht hoe vaak een regel geraakt wordt — is de enige structurele</text>
<text x="100" y="632" class="stagesub" style="font-size:11.5px; fill:#14213D;">bescherming tegen dit scenario. Zeldzaam geraakte regels verdienen extra aandacht, niet minder.</text>
</svg>
