<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" font-family="'DM Sans', Arial, sans-serif" width="1100" height="700" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .decision { fill:#FFFFFF; stroke:#14213D; stroke-width:1.6; }
    .inputdata { fill:#CFE0F2; stroke:#14213D; stroke-width:1.3; }
    .mlmodel { fill:#FBF6E9; stroke:#B8721B; stroke-width:1.8; }
    .mlnet { stroke:#B8721B; stroke-width:1.1; fill:none; }
    .mlnode { fill:#E9A13B; stroke:#8A5A12; stroke-width:1; }
    .dname { font-size:13px; font-weight:700; fill:#14213D; text-anchor:middle; }
    .dsub { font-size:10.5px; fill:#55606F; text-anchor:middle; }
    .mlname { font-size:13px; font-weight:700; fill:#8A5A12; text-anchor:middle; }
    .req { stroke:#14213D; stroke-width:1.6; fill:none; marker-end:url(#arr); }
    .req-cross { stroke:#8A5A12; stroke-width:1.8; fill:none; marker-end:url(#arrml); }
    .zonelabel { font-size:12px; font-weight:700; fill:#14213D; letter-spacing:.06em; }
    .zonelabel-ml { font-size:12px; font-weight:700; fill:#8A5A12; letter-spacing:.06em; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    .sub { font-size:12px; fill:#55606F; }
    .legend-box { fill:#FFFFFF; stroke:#E3E0D8; stroke-width:1.2; }
    .legend-txt { font-size:11px; fill:#14213D; }
    .gate { fill:#FFFFFF; stroke:#14213D; stroke-width:1.6; stroke-dasharray:5 3; }
  </style>
  <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#14213D"/></marker>
  <marker id="arrml" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#8A5A12"/></marker>
</defs>
<rect width="1100" height="700" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 27 · DRD (NOTATIE-CORRECT) — REGEL VERSUS MODEL</text>
<text x="40" y="64" class="title">Figuur 27.2 — De grens tussen regel (DMN) en model (ML) in één beslisproces</text>
<text x="40" y="86" class="sub">Frauderisico-indicatie voor het definitief transitieoverzicht: waar eindigt de tabel, waar begint het model (§27.2).</text>

<!-- DMN zone -->
<rect x="40" y="115" width="490" height="500" fill="#CFE0F2" fill-opacity=".25" stroke="#2563A8" stroke-width="1.3" stroke-dasharray="4 3" rx="8"/>
<text x="56" y="138" class="zonelabel">DMN-ZONE — DETERMINISTISCH</text>
<text x="56" y="153" class="dsub" style="text-anchor:start;">zelfde invoer → altijd zelfde uitvoer, herleidbaar tot een bron</text>

<!-- ML zone -->
<rect x="570" y="115" width="490" height="500" fill="#FBF6E9" fill-opacity=".4" stroke="#B8721B" stroke-width="1.3" stroke-dasharray="4 3" rx="8"/>
<text x="586" y="138" class="zonelabel-ml">ML-ZONE — STATISTISCH</text>
<text x="586" y="153" class="dsub" style="text-anchor:start; fill:#8A5A12;">patroon in trainingsdata, met inherente onzekerheidsmarge</text>

<!-- vertical boundary -->
<line x1="545" y1="105" x2="545" y2="630" stroke="#14213D" stroke-width="2.2" stroke-dasharray="2 5"/>
<text x="545" y="98" text-anchor="middle" class="dsub" style="font-weight:700;">GRENS — expliciet in het ontwerp</text>

<!-- Input data -->
<rect x="60" y="185" width="150" height="50" rx="25" class="inputdata"/>
<text x="135" y="207" class="dname" style="font-size:12px;">Deelnemergegevens</text>
<text x="135" y="222" class="dsub">(polis, mutaties)</text>

<!-- Decision 1 DMN -->
<rect x="260" y="185" width="200" height="60" class="decision"/>
<text x="360" y="210" class="dname">Basisaanspraak</text>
<text x="360" y="228" class="dname">berekenen (oud/nieuw)</text>

<!-- Decision 2 DMN -->
<rect x="60" y="290" width="200" height="60" class="decision"/>
<text x="160" y="315" class="dname">Compensatie</text>
<text x="160" y="333" class="dname">toewijzen</text>

<!-- ML model node: cloud with network pattern, distinct from flat decision rectangle -->
<g>
  <path d="M700,200 c-22,0 -34,16 -34,30 c-14,2 -24,14 -24,28 c0,17 14,30 32,30 h108 c18,0 32,-13 32,-30 c0,-15 -11,-27 -25,-29 c-1,-16 -14,-29 -31,-29 c-6,0 -12,1 -17,4 c-6,-8 -19,-14 -41,-4 z" class="mlmodel"/>
  <circle cx="668" cy="238" r="4" class="mlnode"/>
  <circle cx="700" cy="222" r="4" class="mlnode"/>
  <circle cx="700" cy="255" r="4" class="mlnode"/>
  <circle cx="735" cy="235" r="4" class="mlnode"/>
  <circle cx="735" cy="262" r="4" class="mlnode"/>
  <circle cx="768" cy="245" r="4" class="mlnode"/>
  <line x1="668" y1="238" x2="700" y2="222" class="mlnet"/>
  <line x1="668" y1="238" x2="700" y2="255" class="mlnet"/>
  <line x1="700" y1="222" x2="735" y2="235" class="mlnet"/>
  <line x1="700" y1="255" x2="735" y2="235" class="mlnet"/>
  <line x1="700" y1="255" x2="735" y2="262" class="mlnet"/>
  <line x1="735" y1="235" x2="768" y2="245" class="mlnet"/>
  <line x1="735" y1="262" x2="768" y2="245" class="mlnet"/>
</g>
<text x="716" y="300" class="mlname">ML-model</text>
<text x="716" y="316" class="dsub" style="fill:#8A5A12;">Frauderisico-indicatie</text>
<text x="716" y="331" class="dsub" style="fill:#8A5A12;">(geen DMN-decision — getraind model)</text>

<!-- confidence gate -->
<rect x="620" y="360" width="200" height="56" class="gate"/>
<text x="720" y="384" class="dname" style="font-size:11.5px;">Zekerheidsdrempel</text>
<text x="720" y="400" class="dsub">laag → menselijke beoordeling</text>

<!-- DMN decision 3 - final -->
<rect x="220" y="470" width="260" height="66" class="decision"/>
<text x="350" y="497" class="dname">Definitief transitie-</text>
<text x="350" y="515" class="dname">overzicht vaststellen</text>

<!-- human review (crosses back from ML to DMN side conceptually) -->
<rect x="800" y="470" width="220" height="66" fill="#EEF2F7" stroke="#14213D" stroke-width="1.4" rx="6"/>
<text x="910" y="497" class="dname" style="font-size:12px;">Menselijke</text>
<text x="910" y="515" class="dname" style="font-size:12px;">beoordeling (§27.4)</text>

<!-- arrows -->
<line x1="210" y1="210" x2="260" y2="212" class="req"/>
<line x1="360" y1="245" x2="200" y2="290" class="req"/>
<line x1="160" y1="350" x2="290" y2="470" class="req"/>
<line x1="460" y1="220" x2="668" y2="235" class="req-cross"/>
<line x1="716" y1="330" x2="716" y2="360" class="req-cross"/>
<line x1="720" y1="416" x2="480" y2="490" class="req-cross"/>
<line x1="820" y1="388" x2="910" y2="470" class="req-cross"/>
<line x1="800" y1="503" x2="480" y2="503" class="req-cross"/>

<!-- Legend -->
<rect x="40" y="640" width="1020" height="46" class="legend-box" rx="6"/>
<rect x="56" y="652" width="28" height="16" class="decision"/>
<text x="92" y="664" class="legend-txt">Decision (DMN)</text>
<circle cx="230" cy="660" r="8" class="mlmodel"/>
<text x="248" y="664" class="legend-txt">ML-model (afwijkende vorm — géén DMN-decision)</text>
<line x1="500" y1="660" x2="530" y2="660" class="req"/>
<text x="538" y="664" class="legend-txt">Information requirement (binnen één zone)</text>
<line x1="760" y1="660" x2="790" y2="660" class="req-cross"/>
<text x="798" y="664" class="legend-txt">Information requirement over de grens DMN↔ML</text>
</svg>
