<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" font-family="'DM Sans', Arial, sans-serif" width="1120" height="640" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    .sub { font-size:12px; fill:#55606F; }
    .track { stroke-width:1.6; }
    .track-old { fill:#EEF2F7; stroke:#55606F; }
    .track-new { fill:#CFE0F2; stroke:#2563A8; }
    .tracklabel { font-size:13px; font-weight:700; fill:#14213D; }
    .seg { stroke:#14213D; stroke-width:1.3; }
    .segtxt { font-size:10.5px; font-weight:700; fill:#14213D; text-anchor:middle; }
    .segsub { font-size:9px; fill:#55606F; text-anchor:middle; }
    .migarrow { stroke:#E9A13B; stroke-width:2; fill:none; marker-end:url(#arrm); }
    .datemark { stroke:#14213D; stroke-width:1.2; stroke-dasharray:3 3; }
    .datetxt { font-size:10.5px; fill:#14213D; font-weight:700; text-anchor:middle; }
  </style>
  <marker id="arrm" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#E9A13B"/></marker>
</defs>
<rect width="1120" height="640" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 27 · BITEMPORALITEIT OP LANDSCHAPSSCHAAL</text>
<text x="40" y="64" class="title">Figuur 27.6 — Twee stelsels naast elkaar, per populatie, in de transitieperiode</text>
<text x="40" y="86" class="sub">Oude en nieuwe rekenregels blijven tegelijk correct voor verschillende populaties — dezelfde bitemporaliteit als deel 16, nu op landschapsschaal (§27.7).</text>

<!-- timeline axis dates -->
<line x1="140" y1="130" x2="140" y2="570" class="datemark"/>
<text x="140" y="120" class="datetxt">nu (2026)</text>
<line x1="560" y1="130" x2="560" y2="570" class="datemark"/>
<text x="560" y="120" class="datetxt">2027</text>
<line x1="980" y1="130" x2="980" y2="570" class="datemark" style="stroke:#2563A8; stroke-width:2;"/>
<text x="980" y="120" class="datetxt" style="fill:#2563A8;">1 jan 2028</text>

<!-- Old rules track -->
<rect x="100" y="180" width="920" height="90" rx="8" class="track track-old"/>
<text x="118" y="205" class="tracklabel">Oude rekenregels</text>
<text x="118" y="221" class="segsub" style="text-anchor:start;">bindend voor aanspraken vóór transitiedatum</text>

<!-- population segments on old track, shrinking over time -->
<rect x="140" y="235" width="780" height="24" fill="#FFFFFF" class="seg" rx="3"/>
<text x="530" y="251" class="segtxt">Alle populaties (A–D) — huidig stelsel</text>

<!-- New rules track -->
<rect x="100" y="330" width="920" height="90" rx="8" class="track track-new"/>
<text x="118" y="355" class="tracklabel">Nieuwe rekenregels</text>
<text x="118" y="371" class="segsub" style="text-anchor:start;">solidaire premieregeling — bindend na overgang per populatie</text>

<rect x="560" y="385" width="130" height="24" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.3" rx="3"/>
<text x="625" y="401" class="segtxt" style="fill:#2563A8;">Populatie A</text>

<rect x="700" y="385" width="120" height="24" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.3" rx="3"/>
<text x="760" y="401" class="segtxt" style="fill:#2563A8;">Populatie B</text>

<rect x="830" y="385" width="120" height="24" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.3" rx="3"/>
<text x="890" y="401" class="segtxt" style="fill:#2563A8;">Populatie C</text>

<rect x="960" y="385" width="60" height="24" fill="#2563A8" stroke="#14213D" stroke-width="1.3" rx="3"/>
<text x="990" y="401" class="segtxt" style="fill:#FBFAF7; font-size:9px;">D</text>

<!-- migration arrows: population segments moving from old to new at staggered points -->
<path d="M600,235 C600,300 625,300 625,385" class="migarrow"/>
<text x="600" y="292" class="segsub" style="fill:#8A5A12;">Populatie A</text>
<text x="600" y="304" class="segsub" style="fill:#8A5A12;">pensioengerechtigd, kleine groep</text>

<path d="M740,235 C740,300 760,300 760,385" class="migarrow"/>
<text x="740" y="292" class="segsub" style="fill:#8A5A12;">Populatie B</text>
<text x="740" y="304" class="segsub" style="fill:#8A5A12;">actieve deelnemers, cohort 1</text>

<path d="M870,235 C870,300 890,300 890,385" class="migarrow"/>
<text x="870" y="292" class="segsub" style="fill:#8A5A12;">Populatie C</text>
<text x="870" y="304" class="segsub" style="fill:#8A5A12;">actieve deelnemers, cohort 2</text>

<path d="M960,235 C960,300 990,300 990,385" class="migarrow"/>
<text x="960" y="292" class="segsub" style="fill:#8A5A12;">Populatie D</text>
<text x="960" y="304" class="segsub" style="fill:#8A5A12;">laatste groep, per 1-1-2028</text>

<!-- remaining old-track segment shrinking -->
<rect x="140" y="235" width="420" height="24" fill="none" stroke="#55606F" stroke-width="1" stroke-dasharray="2 2"/>

<!-- explanatory box -->
<rect x="100" y="450" width="920" height="150" fill="#FFFFFF" stroke="#E3E0D8" stroke-width="1.3" rx="8"/>
<text x="120" y="474" class="tracklabel" style="font-size:13px;">Wie wint, wie verliest</text>
<text x="120" y="496" class="segsub" style="text-anchor:start; font-size:11.5px;">Elke deelnemer wordt beoordeeld onder de regels die golden op het moment dat zijn aanspraak werd vastgesteld —</text>
<text x="120" y="514" class="segsub" style="text-anchor:start; font-size:11.5px;">"wat gold wanneer, en voor wie" (deel 16, §16.2), nu toegepast op een compleet nieuwe generatie regels.</text>
<text x="120" y="536" class="segsub" style="text-anchor:start; font-size:11.5px; font-weight:700; fill:#14213D;">Prijs van correct naast elkaar laten werken: aanzienlijk meer ontwerp- en testwerk dan "op de transitiedatum</text>
<text x="120" y="554" class="segsub" style="text-anchor:start; font-size:11.5px; font-weight:700; fill:#14213D;">omschakelen" — maar dat laatste doet elke deelnemer wiens dossier de datumgrens overschrijdt, tekort.</text>
<text x="120" y="576" class="segsub" style="text-anchor:start; font-size:11.5px;">DNB's eis aan datakwaliteit (casusdossier §6) en de wens om snel om te schakelen staan hier tegenover elkaar.</text>
</svg>
