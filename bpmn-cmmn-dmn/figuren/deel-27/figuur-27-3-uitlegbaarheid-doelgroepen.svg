<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" font-family="'DM Sans', Arial, sans-serif" width="1100" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .panel { fill:#FFFFFF; stroke:#E3E0D8; stroke-width:1.4; }
    .panelhead { fill:#2563A8; }
    .headtxt { font-size:15px; font-weight:700; fill:#FBFAF7; text-anchor:middle; }
    .headsub { font-size:10.5px; fill:#CFE0F2; text-anchor:middle; }
    .bubble { fill:#EEF2F7; stroke:#14213D; stroke-width:1.1; }
    .bubbletxt { font-size:11.5px; fill:#14213D; }
    .label { font-size:14px; font-weight:700; fill:#14213D; }
    .sub { font-size:12px; fill:#55606F; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    .tag { font-size:10px; font-weight:700; fill:#8A5A12; }
    .icon-stroke { stroke:#2563A8; stroke-width:2; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  </style>
</defs>
<rect width="1100" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 27 · UITLEGBAARHEID</text>
<text x="40" y="64" class="title">Figuur 27.3 — Uitlegbaarheid per doelgroep</text>
<text x="40" y="86" class="sub">Elk drie een andere mate van detail nodig, maar allemaal recht op een uitleg die klopt met wat werkelijk gebeurde (§27.3).</text>

<!-- Panel 1: Deelnemer -->
<rect x="40" y="115" width="320" height="470" class="panel" rx="8"/>
<rect x="40" y="115" width="320" height="56" class="panelhead" rx="8"/>
<rect x="40" y="145" width="320" height="26" fill="#2563A8"/>
<text x="200" y="140" class="headtxt">Deelnemer</text>
<text x="200" y="158" class="headsub">"waarom krijg ik dit bedrag?"</text>

<circle cx="90" cy="205" r="22" fill="#CFE0F2" stroke="#2563A8" stroke-width="1.6"/>
<path d="M80,210 q10,-14 20,0" class="icon-stroke"/>
<circle cx="84" cy="200" r="2" fill="#2563A8"/>
<circle cx="96" cy="200" r="2" fill="#2563A8"/>

<rect x="130" y="188" width="200" height="46" rx="10" class="bubble"/>
<text x="140" y="205" class="bubbletxt">"Uw aanspraak is per</text>
<text x="140" y="220" class="bubbletxt">1-1-2028 herrekend naar</text>
<text x="140" y="233" class="bubbletxt" style="font-size:10.5px;">het nieuwe stelsel: € 412 → € 438"</text>

<text x="56" y="272" class="tag">UITLEG IN EIGEN TAAL</text>
<rect x="56" y="282" width="288" height="130" fill="#FBFAF7" stroke="#E3E0D8" rx="6"/>
<text x="68" y="302" class="bubbletxt" style="font-size:11px;">Concrete bedragen, herkenbare</text>
<text x="68" y="318" class="bubbletxt" style="font-size:11px;">momenten ("vanaf uw pensioendatum"),</text>
<text x="68" y="334" class="bubbletxt" style="font-size:11px;">geen artikelverwijzingen. Eén</text>
<text x="68" y="350" class="bubbletxt" style="font-size:11px;">menselijk aanspreekpunt bij vragen</text>
<text x="68" y="366" class="bubbletxt" style="font-size:11px;">(§27.4 — definitief transitieoverzicht).</text>
<text x="68" y="392" class="bubbletxt" style="font-size:11px; font-weight:700;">Bron: DMN-decisiontabel, direct</text>
<text x="68" y="406" class="bubbletxt" style="font-size:11px; font-weight:700;">herleidbaar naar deze regel.</text>

<rect x="56" y="430" width="288" height="130" fill="#FBF6E9" stroke="#E9A13B" rx="6"/>
<text x="68" y="450" class="bubbletxt" style="font-size:11px; font-weight:700;">Grondslag (Pw)</text>
<text x="68" y="468" class="bubbletxt" style="font-size:11px;">Art. 48 Pw: informatie correct,</text>
<text x="68" y="484" class="bubbletxt" style="font-size:11px;">duidelijk, evenwichtig, tijdig.</text>
<text x="68" y="504" class="bubbletxt" style="font-size:11px;">Diepgang: laag detail, hoge</text>
<text x="68" y="520" class="bubbletxt" style="font-size:11px;">herkenbaarheid.</text>

<!-- Panel 2: Klachtbehandelaar -->
<rect x="390" y="115" width="320" height="470" class="panel" rx="8"/>
<rect x="390" y="115" width="320" height="56" class="panelhead" rx="8" style="fill:#14213D;"/>
<rect x="390" y="145" width="320" height="26" fill="#14213D"/>
<text x="550" y="140" class="headtxt">Klachtbehandelaar</text>
<text x="550" y="158" class="headsub">beoordeelt een bezwaar</text>

<rect x="440" y="188" width="220" height="46" rx="8" fill="#EEF2F7" stroke="#14213D" stroke-width="1.4"/>
<text x="450" y="205" class="bubbletxt">Regel: Kortingspercentage</text>
<text x="450" y="220" class="bubbletxt">vervroeging = 4,2% (art. 7.3)</text>
<text x="450" y="233" class="bubbletxt" style="font-size:10px;">invoer: 3 jaar vervroeging, geen PP</text>

<text x="406" y="272" class="tag">UITLEG IN EIGEN TAAL</text>
<rect x="406" y="282" width="288" height="130" fill="#FBFAF7" stroke="#E3E0D8" rx="6"/>
<text x="418" y="302" class="bubbletxt" style="font-size:11px;">Volledige regel + toegepaste</text>
<text x="418" y="318" class="bubbletxt" style="font-size:11px;">invoerwaarden zichtbaar, stap</text>
<text x="418" y="334" class="bubbletxt" style="font-size:11px;">voor stap: welke rij van de</text>
<text x="418" y="350" class="bubbletxt" style="font-size:11px;">beslistabel is geraakt, en waarom.</text>
<text x="418" y="376" class="bubbletxt" style="font-size:11px; font-weight:700;">Kan vergelijken met vorige</text>
<text x="418" y="392" class="bubbletxt" style="font-size:11px; font-weight:700;">berekening (audit trail, deel 26).</text>

<rect x="406" y="430" width="288" height="130" fill="#FBF6E9" stroke="#E9A13B" rx="6"/>
<text x="418" y="450" class="bubbletxt" style="font-size:11px; font-weight:700;">Grondslag</text>
<text x="418" y="468" class="bubbletxt" style="font-size:11px;">Herleidbaarheid tot wetsartikel</text>
<text x="418" y="484" class="bubbletxt" style="font-size:11px;">(deel 16, §16.2).</text>
<text x="418" y="504" class="bubbletxt" style="font-size:11px;">Diepgang: middel — regel +</text>
<text x="418" y="520" class="bubbletxt" style="font-size:11px;">invoerwaarden, geen broncode.</text>

<!-- Panel 3: Toezichthouder -->
<rect x="740" y="115" width="320" height="470" class="panel" rx="8"/>
<rect x="740" y="115" width="320" height="56" fill="#8A5A12" rx="8"/>
<rect x="740" y="145" width="320" height="26" fill="#8A5A12"/>
<text x="900" y="140" class="headtxt">Toezichthouder</text>
<text x="900" y="158" class="headsub">DNB / AFM toetst een besluit</text>

<rect x="790" y="188" width="220" height="46" rx="8" fill="#EEF2F7" stroke="#14213D" stroke-width="1.4"/>
<text x="800" y="205" class="bubbletxt">Volledige DRD + versiehistorie</text>
<text x="800" y="220" class="bubbletxt">+ validatie- en wijzigingslog</text>
<text x="800" y="233" class="bubbletxt" style="font-size:10px;">(model risk management, §27.5)</text>

<text x="756" y="272" class="tag">UITLEG IN EIGEN TAAL</text>
<rect x="756" y="282" width="288" height="130" fill="#FBFAF7" stroke="#E3E0D8" rx="6"/>
<text x="768" y="302" class="bubbletxt" style="font-size:11px;">Volledige herleidbaarheid: elke</text>
<text x="768" y="318" class="bubbletxt" style="font-size:11px;">regel, wie hem goedkeurde,</text>
<text x="768" y="334" class="bubbletxt" style="font-size:11px;">wanneer herbeoordeeld, en het</text>
<text x="768" y="350" class="bubbletxt" style="font-size:11px;">eigenaarschap per decision.</text>
<text x="768" y="376" class="bubbletxt" style="font-size:11px; font-weight:700;">Waar ML meespeelt: expliciete</text>
<text x="768" y="392" class="bubbletxt" style="font-size:11px; font-weight:700;">grensmarkering (§27.2) verplicht.</text>

<rect x="756" y="430" width="288" height="130" fill="#FBF6E9" stroke="#E9A13B" rx="6"/>
<text x="768" y="450" class="bubbletxt" style="font-size:11px; font-weight:700;">Grondslag</text>
<text x="768" y="468" class="bubbletxt" style="font-size:11px;">Art. 150i Pw, DNB Good Practices</text>
<text x="768" y="484" class="bubbletxt" style="font-size:11px;">datakwaliteit.</text>
<text x="768" y="504" class="bubbletxt" style="font-size:11px;">Diepgang: volledig — elke stap,</text>
<text x="768" y="520" class="bubbletxt" style="font-size:11px;">elk eigenaarschap, elke bron.</text>
</svg>
