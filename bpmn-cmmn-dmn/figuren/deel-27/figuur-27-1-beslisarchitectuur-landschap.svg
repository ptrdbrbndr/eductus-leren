<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 800" font-family="'DM Sans', Arial, sans-serif" width="1180" height="800" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .decision { fill:#FFFFFF; stroke:#14213D; stroke-width:1.5; }
    .dname { font-size:11.5px; font-weight:700; fill:#14213D; text-anchor:middle; }
    .zone { stroke-width:1.4; stroke-dasharray:4 3; rx:10; }
    .zone-a { fill:#CFE0F2; fill-opacity:.45; stroke:#2563A8; }
    .zone-b { fill:#FBF6E9; fill-opacity:.6; stroke:#B8860B; }
    .zone-c { fill:#EEF2F7; fill-opacity:.7; stroke:#55606F; }
    .zone-d { fill:#E3E0D8; fill-opacity:.5; stroke:#55606F; }
    .zone-risk { fill:#FDECC8; fill-opacity:.55; stroke:#E9A13B; stroke-width:2.2; stroke-dasharray:5 3; }
    .zonelabel { font-size:13px; font-weight:700; fill:#14213D; }
    .zonesub { font-size:10.5px; fill:#55606F; }
    .req { stroke:#14213D; stroke-width:1.3; fill:none; marker-end:url(#arr); opacity:.85; }
    .req-risk { stroke:#B8721B; stroke-width:1.3; fill:none; marker-end:url(#arrrisk); }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    .sub { font-size:12px; fill:#55606F; }
    .callout { font-size:11.5px; font-weight:700; fill:#8A5A12; }
    .callout-sub { font-size:10.5px; fill:#6B4A16; }
    .legend-box { fill:#FFFFFF; stroke:#E3E0D8; stroke-width:1.2; }
    .legend-txt { font-size:10.5px; fill:#14213D; }
  </style>
  <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#14213D"/></marker>
  <marker id="arrrisk" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#B8721B"/></marker>
</defs>
<rect width="1180" height="800" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 27 · BESLISARCHITECTUUR (LANDSCHAPSNIVEAU)</text>
<text x="40" y="64" class="title">Figuur 27.1 — Een beslisarchitectuur van een heel landschap</text>
<text x="40" y="86" class="sub">Tientallen decisions, gegroepeerd naar eigenaar; één cluster is te fijnmazig geworden (§27.1).</text>

<!-- Zone: Actuariaat / Financien -->
<rect x="40" y="115" width="330" height="190" class="zone zone-a"/>
<text x="56" y="135" class="zonelabel">Actuariaat &amp; Financiën</text>
<text x="56" y="150" class="zonesub">eigenaar: hoofd Actuariaat</text>

<rect x="60" y="165" width="140" height="46" class="decision"/>
<text x="130" y="185" class="dname">Aanspraak</text>
<text x="130" y="199" class="dname">vaststellen (oud)</text>

<rect x="220" y="165" width="130" height="46" class="decision"/>
<text x="285" y="185" class="dname">Aanspraak</text>
<text x="285" y="199" class="dname">vaststellen (nieuw)</text>

<rect x="60" y="235" width="140" height="46" class="decision"/>
<text x="130" y="255" class="dname">Dekkingsgraad-</text>
<text x="130" y="269" class="dname">toets invaren</text>

<rect x="220" y="235" width="130" height="46" class="decision"/>
<text x="285" y="255" class="dname">Compensatie</text>
<text x="285" y="269" class="dname">berekenen</text>

<!-- Zone: Compliance & Risk -->
<rect x="410" y="115" width="330" height="190" class="zone zone-b"/>
<text x="426" y="135" class="zonelabel">Compliance &amp; Risk</text>
<text x="426" y="150" class="zonesub">eigenaar: hoofd Risk &amp; Compliance</text>

<rect x="430" y="165" width="140" height="46" class="decision"/>
<text x="500" y="185" class="dname">Evenwichtigheids-</text>
<text x="500" y="199" class="dname">toets (art. 105 Pw)</text>

<rect x="590" y="165" width="130" height="46" class="decision"/>
<text x="655" y="185" class="dname">Datakwaliteits-</text>
<text x="655" y="199" class="dname">classificatie</text>

<rect x="430" y="235" width="140" height="46" class="decision"/>
<text x="500" y="255" class="dname">Complex dossier</text>
<text x="500" y="269" class="dname">markeren</text>

<rect x="590" y="235" width="130" height="46" class="decision"/>
<text x="655" y="255" class="dname">Ontheffing 150oa</text>
<text x="655" y="269" class="dname">toepasbaar?</text>

<!-- Zone: Klantprocessen -->
<rect x="780" y="115" width="360" height="190" class="zone zone-c"/>
<text x="796" y="135" class="zonelabel">Klantprocessen</text>
<text x="796" y="150" class="zonesub">eigenaar: hoofd Klantprocessen</text>

<rect x="800" y="165" width="150" height="46" class="decision"/>
<text x="875" y="185" class="dname">Definitief transitie-</text>
<text x="875" y="199" class="dname">overzicht opstellen</text>

<rect x="970" y="165" width="150" height="46" class="decision"/>
<text x="1045" y="185" class="dname">Uitkeringspercentage</text>
<text x="1045" y="199" class="dname">bepalen</text>

<rect x="800" y="235" width="150" height="46" class="decision"/>
<text x="875" y="255" class="dname">Communicatielaag</text>
<text x="875" y="269" class="dname">kiezen (art. 48 Pw)</text>

<rect x="970" y="235" width="150" height="46" class="decision"/>
<text x="1045" y="255" class="dname">Doelgroep-</text>
<text x="1045" y="269" class="dname">indeling bepalen</text>

<!-- Zone: te fijnmazig cluster -->
<rect x="40" y="345" width="560" height="230" class="zone zone-risk"/>
<text x="56" y="367" class="callout">Klachten &amp; Bijzondere Situaties — te fijnmazig</text>
<text x="56" y="382" class="callout-sub">15 losse micro-decisions, dicht verweven: een web van onderlinge aanroepen (§27.1)</text>

<g>
<rect x="60" y="400" width="90" height="34" class="decision"/><text x="105" y="421" class="dname" style="font-size:9.5px">Klachttype</text>
<rect x="170" y="400" width="90" height="34" class="decision"/><text x="215" y="421" class="dname" style="font-size:9.5px">Termijntoets</text>
<rect x="280" y="400" width="90" height="34" class="decision"/><text x="325" y="421" class="dname" style="font-size:9.5px">Escalatieroute</text>
<rect x="390" y="400" width="90" height="34" class="decision"/><text x="435" y="421" class="dname" style="font-size:9.5px">Bewijslast</text>
<rect x="500" y="400" width="90" height="34" class="decision"/><text x="545" y="421" class="dname" style="font-size:9.5px">Hoorrecht-check</text>

<rect x="60" y="450" width="90" height="34" class="decision"/><text x="105" y="471" class="dname" style="font-size:9.5px">Compensatie-vorm</text>
<rect x="170" y="450" width="90" height="34" class="decision"/><text x="215" y="471" class="dname" style="font-size:9.5px">Mandaatniveau</text>
<rect x="280" y="450" width="90" height="34" class="decision"/><text x="325" y="471" class="dname" style="font-size:9.5px">Herzieningsroute</text>
<rect x="390" y="450" width="90" height="34" class="decision"/><text x="435" y="471" class="dname" style="font-size:9.5px">Uitzonderingscode</text>
<rect x="500" y="450" width="90" height="34" class="decision"/><text x="545" y="471" class="dname" style="font-size:9.5px">Dossierstatus</text>

<rect x="60" y="500" width="90" height="34" class="decision"/><text x="105" y="521" class="dname" style="font-size:9.5px">Bijz. situatie-tag</text>
<rect x="170" y="500" width="90" height="34" class="decision"/><text x="215" y="521" class="dname" style="font-size:9.5px">Vervolgactie</text>
<rect x="280" y="500" width="90" height="34" class="decision"/><text x="325" y="521" class="dname" style="font-size:9.5px">Prioriteitscode</text>
<rect x="390" y="500" width="90" height="34" class="decision"/><text x="435" y="521" class="dname" style="font-size:9.5px">Herstelactie</text>
<rect x="500" y="500" width="90" height="34" class="decision"/><text x="545" y="521" class="dname" style="font-size:9.5px">Afsluitcode</text>
</g>
<!-- dense web of cross-arrows to visualize fragmentation -->
<g class="req" style="stroke:#B8721B; opacity:.55;">
<line x1="150" y1="417" x2="170" y2="417"/>
<line x1="260" y1="417" x2="280" y2="417"/>
<line x1="370" y1="417" x2="390" y2="417"/>
<line x1="480" y1="417" x2="500" y2="417"/>
<line x1="105" y1="434" x2="105" y2="450"/>
<line x1="215" y1="434" x2="215" y2="450"/>
<line x1="325" y1="434" x2="325" y2="450"/>
<line x1="435" y1="434" x2="435" y2="450"/>
<line x1="545" y1="434" x2="545" y2="450"/>
<line x1="150" y1="467" x2="170" y2="467"/>
<line x1="260" y1="467" x2="280" y2="467"/>
<line x1="370" y1="467" x2="390" y2="467"/>
<line x1="480" y1="467" x2="500" y2="467"/>
<line x1="105" y1="484" x2="105" y2="500"/>
<line x1="215" y1="484" x2="215" y2="500"/>
<line x1="325" y1="484" x2="325" y2="500"/>
<line x1="435" y1="484" x2="435" y2="500"/>
<line x1="150" y1="517" x2="170" y2="517"/>
<line x1="260" y1="517" x2="280" y2="517"/>
<line x1="370" y1="517" x2="390" y2="517"/>
<line x1="480" y1="517" x2="500" y2="517"/>
<line x1="150" y1="400" x2="280" y2="450"/>
<line x1="590" y1="417" x2="105" y2="500"/>
<line x1="325" y1="400" x2="435" y2="500"/>
</g>
<text x="56" y="555" class="callout-sub">Risico: elke wijziging raakt meerdere buren tegelijk — geen enkele decision is nog los te toetsen.</text>

<!-- cross-group information requirements -->
<line x1="200" y1="258" x2="430" y2="248" class="req"/>
<line x1="350" y1="188" x2="430" y2="188" class="req"/>
<line x1="720" y1="188" x2="800" y2="188" class="req"/>
<line x1="720" y1="258" x2="800" y2="258" class="req"/>
<line x1="875" y1="211" x2="875" y2="235" class="req"/>
<line x1="1045" y1="211" x2="1045" y2="235" class="req"/>
<line x1="600" y1="345" x2="875" y2="281" class="req-risk"/>
<line x1="130" y1="345" x2="130" y2="281" class="req"/>

<!-- Legend -->
<rect x="640" y="345" width="500" height="230" class="legend-box" rx="6"/>
<text x="658" y="368" class="legend-txt" style="font-weight:700; font-size:12px;">Legenda</text>
<rect x="658" y="382" width="30" height="16" class="decision"/>
<text x="698" y="394" class="legend-txt">Decision (DMN-notatie: platte rechthoek)</text>
<line x1="658" y1="416" x2="688" y2="416" class="req"/>
<text x="698" y="420" class="legend-txt">Information requirement (tussen decisions)</text>
<rect x="658" y="434" width="30" height="16" class="zone-a" style="stroke:#2563A8; stroke-width:1.4; stroke-dasharray:4 3;"/>
<rect x="658" y="434" width="30" height="16" fill="none" stroke="#2563A8" stroke-width="1.4" stroke-dasharray="4 3"/>
<text x="698" y="446" class="legend-txt">Groepering naar eigenaar (kleurzone = 1 eigenaar)</text>
<rect x="658" y="464" width="30" height="16" fill="none" stroke="#E9A13B" stroke-width="2.2" stroke-dasharray="5 3"/>
<text x="698" y="476" class="legend-txt">Cluster met te hoge fragmentatie (§27.1)</text>
<text x="658" y="506" class="zonesub" style="font-size:11px;">Granulariteit is een architectuurkeuze: te grof = één</text>
<text x="658" y="522" class="zonesub" style="font-size:11px;">alles-doende service, te fijn = een onoverzichtelijk web</text>
<text x="658" y="538" class="zonesub" style="font-size:11px;">van aanroepen. Zonder eigenaar veroudert een decision</text>
<text x="658" y="554" class="zonesub" style="font-size:11px;">net zo onopgemerkt als een proces zonder proceseigenaar.</text>
</svg>
