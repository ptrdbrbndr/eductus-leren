<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .step { fill:#CFE0F2; stroke:#2563A8; stroke-width:1.5; }
      .step-text { font-size:13px; font-weight:700; fill:#14213D; text-anchor:middle; }
      .flow { stroke:#14213D; stroke-width:2; fill:none; marker-end:url(#arr); }
      .marker-circle { fill:#FBFAF7; stroke:#14213D; stroke-width:1.5; }
      .marker-circle-end { fill:#FBFAF7; stroke:#14213D; stroke-width:3; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:26px; fill:#14213D; font-weight:600; }
      .note { font-size:12px; fill:#55606F; }
      .pin { fill:#E9A13B; stroke:#14213D; stroke-width:1.5; }
      .pin-text { font-size:11px; font-weight:700; fill:#14213D; text-anchor:middle; }
      .meetbox { fill:#FBF6E9; stroke:#E9A13B; stroke-width:1.25; }
      .meetbox-title { font-size:12.5px; font-weight:700; fill:#5A3B0E; }
      .meetbox-text { font-size:11px; fill:#5A3B0E; }
      .span { stroke:#2563A8; stroke-width:1.5; fill:none; }
      .span-text { font-size:12px; font-weight:700; fill:#2563A8; text-anchor:middle; }
      .leader { stroke:#E9A13B; stroke-width:1.25; stroke-dasharray:3 3; }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#14213D"/></marker>
</defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 02 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Meetpunten in het proces e-mailadreswijziging</text>
<text x="40" y="86" class="note">Vier standaarddimensies, elk met een eigen meetpunt in hetzelfde procesmodel.</text>

<!-- doorlooptijd span boven het hele proces -->
<path d="M120,140 L120,160 L840,160 L840,140" class="span"/>
<text x="480" y="135" class="span-text">Doorlooptijd — van ontvangst tot bevestiging</text>

<!-- start marker -->
<circle cx="90" cy="300" r="20" class="marker-circle"/>
<text x="90" y="305" class="pin-text" font-size="10">start</text>

<!-- stappen -->
<rect x="150" y="270" width="160" height="60" rx="12" class="step"/>
<text x="230" y="295" class="step-text">Mutatie</text>
<text x="230" y="312" class="step-text">ontvangen</text>

<rect x="380" y="270" width="160" height="60" rx="12" class="step"/>
<text x="460" y="295" class="step-text">Identiteit</text>
<text x="460" y="312" class="step-text">verifiëren</text>

<rect x="610" y="270" width="180" height="60" rx="12" class="step"/>
<text x="700" y="295" class="step-text">Adres verwerken</text>
<text x="700" y="312" class="step-text">in systeem</text>

<!-- flows -->
<path d="M110,300 L146,300" class="flow"/>
<path d="M310,300 L376,300" class="flow"/>
<path d="M540,300 L606,300" class="flow"/>
<path d="M790,300 L826,300" class="flow"/>

<!-- end marker -->
<circle cx="855" cy="300" r="20" class="marker-circle-end"/>
<text x="855" y="305" class="pin-text" font-size="9">gereed</text>

<!-- meetpunt 1: capaciteit bij start -->
<circle cx="90" cy="255" r="14" class="pin"/>
<text x="90" y="259" class="pin-text">C</text>
<path d="M90,241 L90,220" class="leader"/>
<rect x="20" y="150" width="180" height="70" rx="8" class="meetbox"/>
<text x="35" y="170" class="meetbox-title">Capaciteit</text>
<text x="35" y="186" class="meetbox-text">volume mutaties dat het</text>
<text x="35" y="200" class="meetbox-text">proces per week aankan</text>

<!-- meetpunt 2: kosten bij verwerken -->
<circle cx="700" cy="255" r="14" class="pin"/>
<text x="700" y="259" class="pin-text">K€</text>
<path d="M700,241 L700,220" class="leader"/>
<rect x="610" y="150" width="180" height="70" rx="8" class="meetbox"/>
<text x="625" y="170" class="meetbox-title">Kosten</text>
<text x="625" y="186" class="meetbox-text">verwerkingskosten</text>
<text x="625" y="200" class="meetbox-text">per mutatie</text>

<!-- meetpunt 3: kwaliteit bij einde -->
<circle cx="855" cy="345" r="14" class="pin"/>
<text x="855" y="349" class="pin-text">Q</text>
<path d="M855,359 L855,410" class="leader"/>
<rect x="765" y="410" width="180" height="70" rx="8" class="meetbox"/>
<text x="780" y="430" class="meetbox-title">Kwaliteit</text>
<text x="780" y="446" class="meetbox-text">fouten, herbewerking,</text>
<text x="780" y="460" class="meetbox-text">klachten na afhandeling</text>

<!-- meetpunt 4: doorlooptijd al bovenaan als span, koppel label -->
<circle cx="480" cy="160" r="14" class="pin"/>
<text x="480" y="164" class="pin-text">T</text>
<path d="M480,174 L480,220" class="leader"/>
<rect x="330" y="410" width="220" height="70" rx="8" class="meetbox"/>
<text x="345" y="430" class="meetbox-title">Doorlooptijd</text>
<text x="345" y="446" class="meetbox-text">gemeten van "mutatie ontvangen"</text>
<text x="345" y="460" class="meetbox-text">tot "gereedmelding", norm: 5 werkdagen</text>
<path d="M480,220 L440,410" class="leader"/>

<!-- voetnoot -->
<rect x="20" y="510" width="920" height="80" rx="8" fill="#EEF2F7" stroke="#CFE0F2" stroke-width="1"/>
<text x="38" y="534" class="note" font-weight="700" fill="#14213D">Een indicator zonder norm is geen indicator maar een getal.</text>
<text x="38" y="554" class="note">Leg bij elk meetpunt drie dingen vast: wat wordt gemeten, waar in het proces, en wat de norm is.</text>
<text x="38" y="574" class="note">Doorlooptijd en het percentage-binnen-norm zijn volgend; de actuele bezetting is leidend — je kunt nog bijsturen.</text>
</svg>
