<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="'DM Sans', Arial, sans-serif" width="960" height="680" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-dark { fill:#2563A8; }
      .blue-fill { fill:#CFE0F2; }
      .amber-light { fill:#FBF6E9; }
      .band-text { font-size:18px; font-weight:700; fill:#14213D; }
      .band-text-light { font-size:18px; font-weight:700; fill:#FBFAF7; }
      .def { font-size:12.5px; fill:#DCE8F5; font-style:italic; }
      .def-dark { font-size:12.5px; fill:#55606F; font-style:italic; }
      .chip { fill:#FFFFFF; stroke:#14213D; stroke-width:1; }
      .chip-text { font-size:12px; fill:#14213D; text-anchor:middle; }
      .chip-amber { fill:#FFFFFF; stroke:#5A3B0E; stroke-width:1; }
      .chip-text-amber { font-size:12px; fill:#5A3B0E; text-anchor:middle; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:26px; fill:#14213D; font-weight:600; }
      .steer { stroke:#5A3B0E; stroke-width:1.75; fill:none; }
      .steer-arrow { stroke:#5A3B0E; stroke-width:1.75; fill:none; marker-end:url(#arrAmb); }
      .note { font-size:12px; fill:#55606F; }
      .cell-title { font-size:13.5px; font-weight:700; fill:#2563A8; }
    </style>
    <marker id="arrAmb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5A3B0E"/></marker>
</defs>
<rect width="960" height="680" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 02 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Procesarchitectuur: drie lagen van samenhang</text>
<text x="40" y="86" class="note">De gestructureerde weergave van hoe processen samenhangen — vaak als een "procesplaat".</text>

<!-- stuur/bewaak-structuur links -->
<path d="M95,427 L95,120" class="steer"/>
<path d="M140,427 L95,427" class="steer"/>
<path d="M95,120 L140,120" class="steer-arrow"/>
<path d="M95,297 L140,297" class="steer-arrow"/>
<text x="24" y="300" class="note" transform="rotate(-90 24 300)">stuurt en bewaakt</text>

<!-- Laag 1: Hoofdprocessen -->
<rect x="140" y="112" width="680" height="110" rx="10" class="blue-dark"/>
<text x="170" y="140" class="band-text-light">Hoofdprocessen</text>
<text x="170" y="160" class="def">leveren direct waarde aan de externe klant (de deelnemer)</text>
<rect x="170" y="172" width="190" height="38" rx="8" class="chip"/>
<text x="265" y="188" class="chip-text">Pensioenaanspraken</text>
<text x="265" y="203" class="chip-text">vaststellen</text>
<rect x="380" y="172" width="150" height="38" rx="8" class="chip"/>
<text x="455" y="195" class="chip-text">Uitkeren</text>
<rect x="550" y="172" width="220" height="38" rx="8" class="chip"/>
<text x="660" y="188" class="chip-text">Deelnemers</text>
<text x="660" y="203" class="chip-text">informeren</text>

<!-- Laag 2: Ondersteunende processen -->
<rect x="140" y="242" width="680" height="110" rx="10" class="blue-fill" stroke="#2563A8" stroke-width="1.5"/>
<text x="170" y="270" class="band-text">Ondersteunende processen</text>
<text x="170" y="290" class="def-dark">maken de hoofdprocessen mogelijk, leveren geen externe waarde</text>
<rect x="170" y="302" width="120" height="38" rx="8" class="chip"/>
<text x="230" y="325" class="chip-text">HR</text>
<rect x="310" y="302" width="170" height="38" rx="8" class="chip"/>
<text x="395" y="325" class="chip-text">IT-beheer</text>
<rect x="500" y="302" width="270" height="38" rx="8" class="chip"/>
<text x="635" y="325" class="chip-text">Financiële administratie</text>

<!-- Laag 3: Besturende processen -->
<rect x="140" y="372" width="680" height="110" rx="10" class="amber-light" stroke="#E9A13B" stroke-width="2"/>
<text x="170" y="400" class="band-text" fill="#5A3B0E">Besturende processen</text>
<text x="170" y="420" class="def-dark" fill="#5A3B0E">sturen en bewaken de andere twee lagen</text>
<rect x="170" y="432" width="180" height="38" rx="8" class="chip-amber"/>
<text x="260" y="455" class="chip-text-amber">Strategievorming</text>
<rect x="370" y="432" width="180" height="38" rx="8" class="chip-amber"/>
<text x="460" y="455" class="chip-text-amber">Risicomanagement</text>
<rect x="570" y="432" width="200" height="38" rx="8" class="chip-amber"/>
<text x="670" y="455" class="chip-text-amber">Kwaliteitsbeleid</text>

<!-- Eén BPMN-model = één cel -->
<rect x="140" y="510" width="680" height="86" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1" stroke-dasharray="4 3"/>
<text x="160" y="536" class="cell-title">Eén BPMN-model = één cel in de plaat</text>
<text x="160" y="558" class="note">bijv. "aanspraak vaststellen bij overlijden van een deelnemer" — een BPMN-model dat je in deel 3 leert maken.</text>
<text x="160" y="576" class="note">Zonder de plaat weet je niet waar de cel bij hoort, en modelleer je losse eilanden.</text>

<text x="140" y="632" class="note">Bedrijfsproces: gestructureerde, samenhangende activiteiten die een uitkomst met waarde leveren aan een klant of afnemer.</text>
</svg>
