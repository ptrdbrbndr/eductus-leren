<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 640" font-family="'DM Sans', Arial, sans-serif" width="1040" height="640" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    .lbl { font-size:12px; fill:#14213D; font-weight:600; }
    .lbl-sm { font-size:11px; fill:#14213D; }
    .sub { font-size:10.5px; fill:#55606F; }
    .icon-line { stroke:#14213D; stroke-width:1.3; fill:none; }
    .thin { stroke:#14213D; stroke-width:1.5; fill:#FFFFFF; }
    .thick { stroke:#14213D; stroke-width:3.2; fill:#FFFFFF; }
    .task { stroke:#14213D; stroke-width:1.5; fill:#FFFFFF; }
    .task-hi { stroke:#2563A8; stroke-width:2.4; fill:#CFE0F2; }
    .flow { stroke:#14213D; stroke-width:1.6; fill:none; marker-end:url(#arr3); }
    .panel { fill:#FFFFFF; stroke:#CFE0F2; stroke-width:1.4; }
    .row-lbl { font-size:11px; fill:#2563A8; font-weight:700; letter-spacing:.04em; }
    .row-val { font-size:11px; fill:#14213D; }
    .row-val-mono { font-size:10.5px; fill:#14213D; font-family:'DM Sans', monospace; }
    .div { stroke:#E3E0D8; stroke-width:1; }
    .connline { stroke:#E9A13B; stroke-width:1.6; stroke-dasharray:5 3; fill:none; marker-end:url(#arramber); }
  </style>
  <marker id="arr3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#14213D"/></marker>
  <marker id="arramber" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#E9A13B"/></marker>
</defs>
<rect width="1040" height="640" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 19 · FIGUUR 19.2 · BPMN-FRAGMENT + CONFIGURATIE</text>
<text x="40" y="64" class="title">Een uitvoerbare service task met connectorconfiguratie</text>

<!-- ===== process fragment (top) ===== -->
<g transform="translate(40,100)">
  <text x="0" y="-14" class="sub">fragment: Deelnemermutatie verwerken — dagdeel 1, §19.2</text>

  <circle cx="24" cy="50" r="16" class="thin"/>
  <text x="24" y="86" text-anchor="middle" class="sub">Mutatie</text>
  <text x="24" y="98" text-anchor="middle" class="sub">ontvangen</text>
  <path d="M40,50 L82,50" class="flow"/>

  <!-- highlighted service task -->
  <rect x="82" y="18" width="180" height="64" rx="10" class="task-hi"/>
  <g transform="translate(92,26)">
    <circle r="7" class="icon-line"/><circle r="2.3" fill="#14213D"/>
    <line x1="0" y1="-7" x2="0" y2="-10" class="icon-line"/>
    <line x1="0" y1="7" x2="0" y2="10" class="icon-line"/>
    <line x1="-7" y1="0" x2="-10" y2="0" class="icon-line"/>
    <line x1="7" y1="0" x2="10" y2="0" class="icon-line"/>
    <line x1="-5" y1="-5" x2="-7" y2="-7" class="icon-line"/>
    <line x1="5" y1="5" x2="7" y2="7" class="icon-line"/>
    <line x1="5" y1="-5" x2="7" y2="-7" class="icon-line"/>
    <line x1="-5" y1="5" x2="-7" y2="7" class="icon-line"/>
  </g>
  <text x="172" y="46" text-anchor="middle" class="lbl-sm" font-weight="700">Aanroep legacy-</text>
  <text x="172" y="61" text-anchor="middle" class="lbl-sm" font-weight="700">koppelvlak</text>
  <text x="172" y="76" text-anchor="middle" class="sub">service task</text>
  <path d="M262,50 L304,50" class="flow"/>

  <path d="M304,34 L332,50 L304,66 L276,50 Z" fill="#FFFFFF" stroke="#14213D" stroke-width="1.5"/>
  <path d="M296,42 L312,58 M312,42 L296,58" stroke="#14213D" stroke-width="1.3"/>
  <path d="M332,50 L374,50" class="flow"/>
  <text x="345" y="42" class="sub" font-style="italic">gelukt?</text>

  <circle cx="392" cy="50" r="18" class="thick"/>
  <text x="392" y="88" text-anchor="middle" class="sub">Vervolg</text>

  <path d="M304,66 L304,110 L392,110" class="flow"/>
  <circle cx="410" cy="110" r="18" class="thin"/>
  <circle cx="410" cy="110" r="14" class="thin"/>
  <g transform="translate(410,110)"><path d="M-5,-5 L2,0 L-2,2 L5,6" class="icon-line"/></g>
  <text x="410" y="140" text-anchor="middle" class="sub">Foutafhandeling</text>
</g>

<!-- connector leader from task to panel -->
<path d="M262,150 L262,190 L520,190 L520,220" class="connline"/>

<!-- ===== configuration panel (bottom) ===== -->
<g transform="translate(360,240)">
  <rect x="0" y="0" width="480" height="360" rx="10" class="panel"/>
  <rect x="0" y="0" width="480" height="40" rx="10" fill="#2563A8"/>
  <rect x="0" y="24" width="480" height="16" fill="#2563A8"/>
  <text x="20" y="26" fill="#FBFAF7" font-size="13" font-weight="700">Connectorconfiguratie — Aanroep legacy-koppelvlak</text>

  <text x="20" y="66" class="row-lbl">ENDPOINT</text>
  <text x="20" y="84" class="row-val-mono">POST https://koppelvlak.meridiaan.local/mutatie/v2</text>
  <line x1="20" y1="98" x2="460" y2="98" class="div"/>

  <text x="20" y="120" class="row-lbl">AUTHENTICATIE</text>
  <text x="20" y="138" class="row-val">Service-account, OAuth2 client credentials, scope "mutatie:schrijf"</text>
  <line x1="20" y1="152" x2="460" y2="152" class="div"/>

  <text x="20" y="174" class="row-lbl">INPUTMAPPING (proces → aanroep)</text>
  <text x="20" y="192" class="row-val-mono">mutatieId       → payload.referentie</text>
  <text x="20" y="208" class="row-val-mono">deelnemerBsn    → payload.subject.bsn</text>
  <text x="20" y="224" class="row-val-mono">mutatieType     → payload.type</text>
  <line x1="20" y1="238" x2="460" y2="238" class="div"/>

  <text x="20" y="260" class="row-lbl">OUTPUTMAPPING (antwoord → proces)</text>
  <text x="20" y="278" class="row-val-mono">response.status → mutatieStatus</text>
  <text x="20" y="294" class="row-val-mono">response.dossierRef → dossierId</text>
  <line x1="20" y1="308" x2="460" y2="308" class="div"/>

  <text x="20" y="330" class="row-lbl">FOUTGEDRAG</text>
  <text x="20" y="348" class="row-val">HTTP 5xx → BPMN-error "koppelvlak-onbereikbaar"; 3× retry, backoff 30s</text>
</g>

<text x="40" y="622" class="sub">De service task zelf is standaard BPMN-notatie; de configuratie ernaast bepaalt of het uitvoerbaar is (§19.1–§19.2).</text>
</svg>
