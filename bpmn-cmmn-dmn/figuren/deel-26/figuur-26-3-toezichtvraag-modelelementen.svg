<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 600" font-family="'DM Sans', Arial, sans-serif" width="1180" height="600" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    .banner { fill:#FBF6E9; stroke:#E9A13B; stroke-width:1.3; }
    .bannerlabel { font-size:11.5px; font-weight:700; fill:#8a6a1f; letter-spacing:.04em; }
    .bannerq { font-size:14px; fill:#14213D; font-weight:600; }
    .lanebox { fill:#FFFFFF; stroke:#14213D; stroke-width:1.4; }
    .lanelabel { font-size:11.5px; font-weight:700; fill:#14213D; }
    .evt { fill:#FBFAF7; stroke:#14213D; stroke-width:1.3; }
    .evtend { fill:#FBFAF7; stroke:#14213D; stroke-width:2.8; }
    .evtlabel { font-size:10.5px; fill:#55606F; }
    .task { fill:#FFFFFF; stroke:#14213D; stroke-width:1.4; }
    .taskhi { fill:#FBF6E9; stroke:#E9A13B; stroke-width:2.4; }
    .tasktxt { font-size:11.5px; fill:#14213D; }
    .tasksub { font-size:9.5px; fill:#55606F; }
    .gw { fill:#FFFFFF; stroke:#14213D; stroke-width:1.4; }
    .gwlabel { font-size:10.5px; fill:#14213D; font-weight:700; }
    .arrow { stroke:#55606F; stroke-width:1.6; fill:none; marker-end:url(#arr); }
    .flowlabel { font-size:10px; fill:#55606F; }
    .leader { stroke:#E9A13B; stroke-width:1.3; stroke-dasharray:4 3; fill:none; }
    .annbox { fill:#EEF2F7; stroke:#14213D; stroke-width:1.1; }
    .annhead { font-size:11px; font-weight:700; fill:#14213D; }
    .annsub { font-size:9.5px; fill:#55606F; }
  </style>
  <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
</defs>
<rect width="1180" height="600" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 26 · BPMN-PROCESFRAGMENT · TOEZICHT</text>
<text x="40" y="64" class="title">Figuur 26.3 — Een toezichtvraag met de onderbouwende modelelementen gemarkeerd</text>

<rect x="40" y="82" width="1100" height="64" rx="8" class="banner"/>
<text x="58" y="103" class="bannerlabel">TOEZICHTVRAAG (DNB, GOOD PRACTICE DATAKWALITEIT — CASUSDOSSIER §6)</text>
<text x="58" y="126" class="bannerq">"Bevat het datakwaliteitsproces stappen voor risicoanalyse, rapportage en aparte behandeling van complexe dossiers?"</text>

<rect x="40" y="170" width="1100" height="270" rx="6" class="lanebox"/>
<text x="56" y="190" class="lanelabel">Risicoteam — datakwaliteit invaren</text>

<circle cx="100" cy="250" r="15" class="evt"/>
<text x="100" y="277" text-anchor="middle" class="evtlabel">Dossier</text>
<text x="100" y="290" text-anchor="middle" class="evtlabel">ontvangen</text>
<path d="M115,250 L150,250" class="arrow"/>

<rect x="150" y="212" width="190" height="76" rx="8" class="taskhi"/>
<circle cx="168" cy="228" r="4.5" fill="none" stroke="#14213D" stroke-width="1.1"/>
<path d="M161,242 q7,-9 14,0" fill="none" stroke="#14213D" stroke-width="1.1"/>
<text x="186" y="245" class="tasktxt" style="font-weight:700">Risicoanalyse</text>
<text x="186" y="262" class="tasktxt">uitvoeren</text>
<path d="M340,250 L370,250" class="arrow"/>

<path d="M400,220 L430,250 L400,280 L370,250 Z" class="gw"/>
<path d="M392,242 L408,258 M408,242 L392,258" stroke="#14213D" stroke-width="1.2"/>
<text x="400" y="207" text-anchor="middle" class="gwlabel">Complex dossier?</text>

<path d="M400,280 L400,368 L470,368" class="arrow"/>
<text x="404" y="320" class="flowlabel">ja — risicogroep</text>

<rect x="470" y="330" width="250" height="76" rx="8" class="taskhi"/>
<circle cx="488" cy="346" r="4.5" fill="none" stroke="#14213D" stroke-width="1.1"/>
<path d="M481,360 q7,-9 14,0" fill="none" stroke="#14213D" stroke-width="1.1"/>
<text x="506" y="358" class="tasktxt" style="font-weight:700">Apart behandelen</text>
<text x="506" y="374" class="tasktxt">door risicoteam</text>
<text x="506" y="390" class="tasksub">(complex dossier / risicogroep)</text>

<path d="M720,368 L760,368 L760,276" class="arrow"/>

<path d="M430,250 L734,250" class="arrow"/>
<text x="440" y="243" class="flowlabel">nee — standaard dossier</text>

<path d="M760,224 L786,250 L760,276 L734,250 Z" class="gw"/>
<path d="M786,250 L820,250" class="arrow"/>

<rect x="820" y="212" width="210" height="76" rx="8" class="taskhi"/>
<circle cx="838" cy="228" r="4.5" fill="none" stroke="#14213D" stroke-width="1.1"/>
<path d="M831,242 q7,-9 14,0" fill="none" stroke="#14213D" stroke-width="1.1"/>
<text x="856" y="245" class="tasktxt" style="font-weight:700">Rapporteren</text>
<text x="856" y="262" class="tasktxt">aan bestuur</text>
<path d="M1030,250 L1075,250" class="arrow"/>

<circle cx="1090" cy="250" r="15" class="evtend"/>
<text x="1090" y="277" text-anchor="middle" class="evtlabel">Datakwaliteit</text>
<text x="1090" y="290" text-anchor="middle" class="evtlabel">vastgesteld</text>

<!-- annotations -->
<path d="M245,288 L245,470" class="leader"/>
<rect x="130" y="470" width="230" height="80" rx="7" class="annbox"/>
<text x="144" y="490" class="annhead">→ onderbouwt: risicoanalyse</text>
<text x="144" y="506" class="annsub">DNB Good Practice — gestructureerd</text>
<text x="144" y="519" class="annsub">stappenplan risicoanalyse</text>
<text x="144" y="538" class="annsub">datakwaliteit vóór invaren</text>

<path d="M595,406 L595,470" class="leader"/>
<rect x="480" y="470" width="250" height="80" rx="7" class="annbox"/>
<text x="494" y="490" class="annhead">→ onderbouwt: aparte behandeling</text>
<text x="494" y="506" class="annsub">complexe dossiers (risicogroepen) —</text>
<text x="494" y="519" class="annsub">data die niet eenduidig is, casus-</text>
<text x="494" y="532" class="annsub">dossier §6</text>

<path d="M925,288 L925,470" class="leader"/>
<rect x="810" y="470" width="230" height="80" rx="7" class="annbox"/>
<text x="824" y="490" class="annhead">→ onderbouwt: rapportage</text>
<text x="824" y="506" class="annsub">basis voor het expliciete</text>
<text x="824" y="519" class="annsub">bestuursbesluit over datakwaliteit</text>
<text x="824" y="532" class="annsub">bij invaren (casusdossier §6)</text>

</svg>
