<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'DM Sans', Arial, sans-serif" width="960" height="640" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-fill { fill:#CFE0F2; }
      .blue-dark { fill:#2563A8; }
      .amber-fill { fill:#FBF6E9; }
      .grey-fill { fill:#EEF2F7; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .body { font-size:12.5px; fill:#14213D; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.6; fill:none; marker-end:url(#arr); }
      .dashed { stroke:#55606F; stroke-width:1.2; stroke-dasharray:4 3; fill:none; }
      .stepbox { stroke-width:1.6; }
      .chaintitle { font-size:12px; font-weight:700; letter-spacing:.06em; }
      .evt { fill:#FBFAF7; stroke:#14213D; stroke-width:1.3; }
      .task { fill:#FFFFFF; stroke:#14213D; stroke-width:1.4; rx:8; }
      .taskhi { fill:#FBF6E9; stroke:#E9A13B; stroke-width:2; rx:8; }
      .tasktxt { font-size:11px; fill:#14213D; }
      .roletag { font-size:10px; fill:#55606F; }
      .quote { font-size:13px; font-style:italic; fill:#14213D; }
    </style>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
</defs>
<rect width="960" height="640" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 26 · KETENDIAGRAM</text>
<text x="40" y="64" class="title">Figuur 26.1 — Risico → maatregel → modelelement: datakwaliteit bij invaren</text>

<!-- three chain boxes -->
<rect x="30" y="96" width="270" height="150" rx="8" class="amber-fill stepbox" stroke="#E9A13B"/>
<text x="50" y="122" class="chaintitle" fill="#8a6a1f">RISICO</text>
<text x="50" y="146" class="body">Datakwaliteit bij invaren is</text>
<text x="50" y="163" class="body">onvoldoende geborgd: gegevens</text>
<text x="50" y="180" class="body">van een complex dossier zijn niet</text>
<text x="50" y="197" class="body">eenduidig vastgesteld</text>
<text x="50" y="222" class="sub">casusdossier §6 — risicogroepen</text>

<rect x="345" y="96" width="270" height="150" rx="8" class="blue-fill stepbox" stroke="#2563A8"/>
<text x="365" y="122" class="chaintitle" fill="#1c4d84">MAATREGEL</text>
<text x="365" y="146" class="body">Vierogencontrole op complexe</text>
<text x="365" y="163" class="body">dossiers vóór invaren: een tweede</text>
<text x="365" y="180" class="body">beoordelaar autoriseert de</text>
<text x="365" y="197" class="body">vaststelling voordat die telt</text>
<text x="365" y="222" class="sub">casusdossier §6 — bestuursbesluit</text>

<rect x="660" y="96" width="270" height="150" rx="8" class="grey-fill stepbox" stroke="#14213D"/>
<text x="680" y="122" class="chaintitle" fill="#14213D">MODELELEMENT</text>
<!-- mini task icon with user + lock accent -->
<rect x="680" y="140" width="230" height="46" rx="7" fill="#FFFFFF" stroke="#14213D" stroke-width="1.3"/>
<circle cx="694" cy="153" r="4.2" fill="none" stroke="#14213D" stroke-width="1.1"/>
<path d="M687,166 q7,-9 14,0" fill="none" stroke="#14213D" stroke-width="1.1"/>
<text x="710" y="158" class="tasktxt" style="font-weight:700">Controleren door</text>
<text x="710" y="171" class="tasktxt">tweede beoordelaar</text>
<g transform="translate(892,144)">
  <rect x="0" y="4" width="12" height="9" rx="1.5" fill="#E9A13B" stroke="#14213D" stroke-width="0.8"/>
  <path d="M2,4 v-3 a4,4 0 0 1 8,0 v3" fill="none" stroke="#14213D" stroke-width="1"/>
</g>
<text x="680" y="204" class="body">performer ≠ performer van de</text>
<text x="680" y="219" class="body">voorgaande taak (§26.2)</text>

<path d="M300,171 L345,171" class="arrow"/>
<path d="M615,171 L660,171" class="arrow"/>

<!-- quote footer -->
<rect x="30" y="266" width="900" height="52" rx="8" fill="#FBF6E9" stroke="#E9A13B" stroke-width="1.2"/>
<text x="480" y="298" text-anchor="middle" class="quote">"Een maatregel die niet in het model staat, bestaat in de praktijk niet" — §26.1</text>

<!-- connector to concrete fragment -->
<path d="M795,246 L795,270 M795,270 L795,300" class="dashed"/>
<text x="805" y="342" class="sub">zichtbaar in het model als:</text>
<path d="M795,300 L795,352" class="dashed"/>

<!-- concrete BPMN fragment -->
<circle cx="90" cy="470" r="16" class="evt"/>
<text x="90" y="497" text-anchor="middle" class="sub">start</text>
<path d="M106,470 L150,470" class="arrow"/>

<rect x="150" y="440" width="190" height="60" rx="8" class="task"/>
<circle cx="166" cy="456" r="4.2" fill="none" stroke="#14213D" stroke-width="1.1"/>
<path d="M159,469 q7,-9 14,0" fill="none" stroke="#14213D" stroke-width="1.1"/>
<text x="182" y="463" class="tasktxt" style="font-weight:700">Dossier beoordelen</text>
<text x="182" y="479" class="tasktxt">complexe zaak</text>
<text x="150" y="512" class="roletag">rol: Behandelaar</text>
<path d="M340,470 L384,470" class="arrow"/>

<rect x="384" y="435" width="220" height="70" rx="8" class="taskhi"/>
<circle cx="400" cy="452" r="4.2" fill="none" stroke="#14213D" stroke-width="1.1"/>
<path d="M393,465 q7,-9 14,0" fill="none" stroke="#14213D" stroke-width="1.1"/>
<g transform="translate(576,441)">
  <rect x="0" y="4" width="12" height="9" rx="1.5" fill="#E9A13B" stroke="#14213D" stroke-width="0.8"/>
  <path d="M2,4 v-3 a4,4 0 0 1 8,0 v3" fill="none" stroke="#14213D" stroke-width="1"/>
</g>
<text x="416" y="459" class="tasktxt" style="font-weight:700">Controleren door</text>
<text x="416" y="474" class="tasktxt">tweede beoordelaar</text>
<text x="416" y="489" class="tasktxt" fill="#8a6a1f">(dit modelelement)</text>
<text x="384" y="518" class="roletag">rol: Tweede beoordelaar (≠ Behandelaar)</text>

<path d="M604,470 L648,470" class="arrow"/>
<circle cx="672" cy="470" r="16" fill="#FBFAF7" stroke="#14213D" stroke-width="2.6"/>
<text x="672" y="497" text-anchor="middle" class="sub">eind</text>

</svg>
