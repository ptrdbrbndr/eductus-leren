<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 640" font-family="'DM Sans', Arial, sans-serif" width="1240" height="640" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .panel { fill:#FFFFFF; stroke:#E3E0D8; stroke-width:1.5; }
    .pool { fill:#FFFFFF; stroke:#14213D; stroke-width:1.5; }
    .pool-collapsed { fill:#CFE0F2; stroke:#14213D; stroke-width:1.5; }
    .lane-title { font-size:11px; font-weight:700; fill:#14213D; }
    .task { fill:#CFE0F2; stroke:#14213D; stroke-width:1.4; }
    .task-label { font-size:10.5px; fill:#14213D; }
    .evt-start { fill:#FBFAF7; stroke:#14213D; stroke-width:1.6; }
    .evt-inter { fill:#FBFAF7; stroke:#14213D; stroke-width:1.2; }
    .evt-end { fill:#FBFAF7; stroke:#14213D; stroke-width:3; }
    .icon { stroke:#14213D; stroke-width:1.1; fill:none; }
    .seq { stroke:#14213D; stroke-width:1.6; fill:none; marker-end:url(#seqarr); }
    .msg { stroke:#55606F; stroke-width:1.3; stroke-dasharray:4 3; fill:none; marker-end:url(#msgarr); marker-start:url(#msgcirc); }
    .conv-link { stroke:#55606F; stroke-width:1.3; fill:none; }
    .choreo { fill:#FBFAF7; stroke:#14213D; stroke-width:1.5; }
    .choreo-band-init { fill:#FFFFFF; }
    .choreo-band-other { fill:#CFE0F2; }
    .choreo-mid { fill:#FBF6E9; }
    .amber { fill:#E9A13B; }
    .label { font-size:14px; font-weight:700; fill:#14213D; }
    .sub { font-size:11.5px; fill:#55606F; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    .paneltitle { font-size:13px; font-weight:700; fill:#2563A8; }
    .hexlabel { font-size:10.5px; font-weight:700; fill:#14213D; }
    .caption { font-size:10.5px; fill:#55606F; font-style:italic; }
  </style>
  <marker id="seqarr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#14213D"/></marker>
  <marker id="msgarr" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#55606F" stroke-width="1.3"/></marker>
  <marker id="msgcirc" markerWidth="8" markerHeight="8" refX="3" refY="3" orient="auto"><circle cx="3" cy="3" r="2.6" fill="#FBFAF7" stroke="#55606F" stroke-width="1.1"/></marker>
</defs>
<rect width="1240" height="640" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 13 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Figuur 13.1 — Drie diagramtypen, één scenario: de waardeoverdracht met een ketenpartner</text>

<!-- PANEL 1: Collaboration -->
<rect x="30" y="90" width="380" height="500" class="panel" rx="4"/>
<text x="50" y="116" class="paneltitle">1. COLLABORATION DIAGRAM</text>
<text x="50" y="132" class="sub">toont ook het interne proces van Meridiaan</text>

<rect x="50" y="150" width="340" height="150" class="pool" rx="3"/>
<text x="58" y="168" class="lane-title" transform="rotate(0)">Meridiaan Pensioen N.V.</text>
<circle cx="80" cy="225" r="14" class="evt-start"/>
<rect x="120" y="205" width="90" height="40" rx="10" class="task"/>
<path d="M126,213 h20 v14 l-10,8 -10,-8 z" class="icon"/>
<text x="152" y="230" text-anchor="middle" class="task-label">Aanvraag versturen</text>
<circle cx="250" cy="225" r="14" class="evt-inter"/>
<circle cx="250" cy="225" r="10.5" class="evt-inter"/>
<path d="M243,221 h14 v9 l-7,5 -7,-5 z" class="icon"/>
<circle cx="330" cy="225" r="15" class="evt-end"/>
<path d="M324,219 l12,12 M336,219 l-12,12" stroke="#14213D" stroke-width="1.6"/>
<line x1="94" y1="225" x2="120" y2="225" class="seq"/>
<line x1="210" y1="225" x2="236" y2="225" class="seq"/>
<line x1="264" y1="225" x2="315" y2="225" class="seq"/>

<rect x="50" y="330" width="340" height="70" class="pool-collapsed" rx="3"/>
<text x="220" y="370" text-anchor="middle" class="lane-title">Andere pensioenuitvoerder (black box)</text>

<path d="M165,245 C165,290 220,300 220,330" class="msg"/>
<path d="M220,330 C220,300 250,290 250,245" class="msg"/>
<text x="60" y="318" class="caption">message flow — gestippeld, open cirkel bij bron</text>

<!-- PANEL 2: Choreography -->
<rect x="430" y="90" width="380" height="500" class="panel" rx="4"/>
<text x="450" y="116" class="paneltitle">2. CHOREOGRAPHY DIAGRAM</text>
<text x="450" y="132" class="sub">toont uitsluitend de berichtuitwisseling zelf</text>

<!-- choreo activity 1: Meridiaan initiates -->
<rect x="460" y="180" width="180" height="66" rx="8" class="choreo"/>
<rect x="460" y="180" width="180" height="22" class="choreo-band-init" stroke="#14213D" stroke-width="1"/>
<text x="550" y="195" text-anchor="middle" class="hexlabel">Meridiaan</text>
<rect x="460" y="202" width="180" height="22" class="choreo-mid" stroke="#14213D" stroke-width="1"/>
<path d="M545,208 h20 v10 l-10,7 -10,-7 z" class="icon"/>
<text x="600" y="217" class="task-label">Aanvraag WO</text>
<rect x="460" y="224" width="180" height="22" class="choreo-band-other" stroke="#14213D" stroke-width="1"/>
<text x="550" y="239" text-anchor="middle" class="hexlabel">Andere uitvoerder</text>

<line x1="640" y1="213" x2="695" y2="213" class="seq"/>

<!-- choreo activity 2: reply, andere uitvoerder initiates -->
<rect x="700" y="180" width="180" height="66" rx="8" class="choreo"/>
<rect x="700" y="180" width="180" height="22" class="choreo-band-other" stroke="#14213D" stroke-width="1"/>
<text x="790" y="195" text-anchor="middle" class="hexlabel">Meridiaan</text>
<rect x="700" y="202" width="180" height="22" class="choreo-mid" stroke="#14213D" stroke-width="1"/>
<path d="M785,208 h20 v10 l-10,7 -10,-7 z" class="icon"/>
<text x="840" y="217" class="task-label">Bevestiging</text>
<rect x="700" y="224" width="180" height="22" class="choreo-band-init" stroke="#14213D" stroke-width="1"/>
<text x="790" y="239" text-anchor="middle" class="hexlabel">Andere uitvoerder</text>

<text x="450" y="290" class="sub" style="font-size:10.5px">Witte band = initiërende partij van dat bericht.</text>
<text x="450" y="306" class="sub" style="font-size:10.5px">Geen van beide interne processen zichtbaar —</text>
<text x="450" y="322" class="sub" style="font-size:10.5px">daarom in de praktijk zelden gebruikt (§13.1).</text>

<!-- PANEL 3: Conversation -->
<rect x="860" y="90" width="350" height="500" class="panel" rx="4"/>
<text x="880" y="116" class="paneltitle">3. CONVERSATION DIAGRAM</text>
<text x="880" y="132" class="sub">overzicht: wie wisselt berichten uit</text>

<rect x="880" y="200" width="150" height="34" rx="17" class="pool"/>
<text x="955" y="221" text-anchor="middle" class="lane-title">Meridiaan</text>

<rect x="1050" y="200" width="150" height="34" rx="17" class="pool"/>
<text x="1125" y="221" text-anchor="middle" class="lane-title" style="font-size:10px">Andere uitvoerder</text>

<polygon points="1005,300 1035,285 1065,300 1065,330 1035,345 1005,330" class="task"/>
<text x="1035" y="320" text-anchor="middle" class="hexlabel" style="font-size:9.5px">Waarde-</text>
<text x="1035" y="332" text-anchor="middle" class="hexlabel" style="font-size:9.5px">overdracht</text>

<line x1="955" y1="234" x2="1015" y2="298" class="conv-link"/>
<line x1="1125" y1="234" x2="1055" y2="298" class="conv-link"/>

<text x="880" y="400" class="sub" style="font-size:10.5px">Conversatienode (zeshoek) clustert alle</text>
<text x="880" y="416" class="sub" style="font-size:10.5px">berichten tussen de twee partijen tot één</text>
<text x="880" y="432" class="sub" style="font-size:10.5px">onderwerp, zonder volgorde te tonen —</text>
<text x="880" y="448" class="sub" style="font-size:10.5px">nuttig als eerste overzicht bij een complex</text>
<text x="880" y="464" class="sub" style="font-size:10.5px">landschap met veel partijen (§13.1).</text>

</svg>
