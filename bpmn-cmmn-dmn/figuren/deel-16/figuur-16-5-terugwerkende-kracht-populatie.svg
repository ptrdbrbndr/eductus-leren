<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 520" font-family="'DM Sans', Arial, sans-serif" width="1040" height="520" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .axis { stroke:#14213D; stroke-width:1.6; }
    .monthlabel { font-size:11px; fill:#55606F; text-anchor:middle; }
    .gapband { fill:#FCE9C9; opacity:.75; }
    .refline { stroke:#14213D; stroke-width:1; stroke-dasharray:4 3; opacity:.6; }
    .reflabel { font-size:10.5px; font-weight:700; fill:#14213D; text-anchor:middle; }
    .dotgrey { fill:#B9C2CE; stroke:#55606F; stroke-width:1; }
    .dotamber { fill:#E9A13B; stroke:#14213D; stroke-width:1.3; }
    .dotblue { fill:#2563A8; stroke:#14213D; stroke-width:1.3; }
    .legendtxt { font-size:11.5px; fill:#14213D; }
    .label { font-size:14px; font-weight:700; fill:#14213D; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    .sub { font-size:12px; fill:#55606F; }
    .note { font-size:11px; fill:#55606F; }
    .summarybox { fill:#FFFFFF; stroke:#E3E0D8; stroke-width:1.3; }
    .summarytitle { font-size:12px; font-weight:700; fill:#14213D; }
    .summarytxt { font-size:11px; fill:#14213D; }
  </style>
</defs>
<rect width="1040" height="520" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 16 · TIJDLIJN</text>
<text x="40" y="64" class="title">Figuur 16.5 — Terugwerkende kracht: welke populatie wordt geraakt</text>
<text x="40" y="86" class="sub">Elke stip is een dossier vervroegde uittreding, geplot op verwerkingsdatum, juni t/m oktober (vervolg op Figuur 16.4).</text>

<!-- Month axis -->
<line x1="120" y1="300" x2="920" y2="300" class="axis"/>
<text x="170" y="322" class="monthlabel">juni</text>
<text x="340" y="322" class="monthlabel">juli</text>
<text x="510" y="322" class="monthlabel">augustus</text>
<text x="680" y="322" class="monthlabel">september</text>
<text x="850" y="322" class="monthlabel">oktober</text>

<!-- gap band: getroffen periode -->
<rect x="340" y="140" width="340" height="180" class="gapband"/>
<line x1="340" y1="140" x2="340" y2="320" class="refline"/>
<line x1="680" y1="140" x2="680" y2="320" class="refline"/>
<text x="340" y="128" class="reflabel">1 juli — regel effectief</text>
<text x="680" y="128" class="reflabel">1 sep — regel geregistreerd</text>

<!-- case dots: before (grey) -->
<circle cx="150" cy="300" r="9" class="dotgrey"/>
<circle cx="190" cy="300" r="9" class="dotgrey"/>
<circle cx="230" cy="300" r="9" class="dotgrey"/>
<circle cx="270" cy="300" r="9" class="dotgrey"/>
<circle cx="310" cy="300" r="9" class="dotgrey"/>

<!-- case dots: affected window (amber) -->
<circle cx="380" cy="300" r="9" class="dotamber"/>
<circle cx="430" cy="300" r="9" class="dotamber"/>
<circle cx="480" cy="300" r="9" class="dotamber"/>
<circle cx="540" cy="300" r="9" class="dotamber"/>
<circle cx="590" cy="300" r="9" class="dotamber"/>
<circle cx="640" cy="300" r="9" class="dotamber"/>

<!-- case dots: after (blue) -->
<circle cx="730" cy="300" r="9" class="dotblue"/>
<circle cx="790" cy="300" r="9" class="dotblue"/>
<circle cx="850" cy="300" r="9" class="dotblue"/>

<!-- legend -->
<circle cx="120" cy="360" r="8" class="dotgrey"/>
<text x="136" y="365" class="legendtxt">vóór 1 juli — oude regel gold toen ook al, correct</text>
<circle cx="120" cy="382" r="8" class="dotamber"/>
<text x="136" y="387" class="legendtxt">1 juli – 1 sep — verwerkt met de oude regel, maar de nieuwe regel gold al: moet herzien</text>
<circle cx="120" cy="404" r="8" class="dotblue"/>
<text x="136" y="409" class="legendtxt">na 1 sep — nieuwe regel al in het systeem, correct verwerkt</text>

<!-- summary -->
<rect x="700" y="360" width="290" height="90" class="summarybox" rx="5"/>
<text x="716" y="382" class="summarytitle">Getroffen populatie</text>
<text x="716" y="400" class="summarytxt">6 dossiers vervroegde uittreding,</text>
<text x="716" y="416" class="summarytxt">verwerkt tussen 1 juli en 1 sep,</text>
<text x="716" y="432" class="summarytxt">moeten worden herberekend.</text>

<text x="40" y="482" class="note">Zonder een repository die versies met effectieve datums bijhoudt, moet deze populatie handmatig worden</text>
<text x="40" y="498" class="note">gereconstrueerd uit oude documenten en verwerkingslogs — precies het werk dat niemand onder tijdsdruk wil doen (§16.5).</text>
</svg>
