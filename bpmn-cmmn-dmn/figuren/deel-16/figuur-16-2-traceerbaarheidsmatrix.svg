<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 560" font-family="'DM Sans', Arial, sans-serif" width="1020" height="560" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .th { fill:#2563A8; }
    .thtxt { font-size:12px; font-weight:700; fill:#FBFAF7; }
    .cell { fill:#FFFFFF; stroke:#E3E0D8; stroke-width:1; }
    .cellalt { fill:#EEF2F7; stroke:#E3E0D8; stroke-width:1; }
    .celltxt { font-size:11px; fill:#14213D; }
    .celltxtsub { font-size:10px; fill:#55606F; }
    .label { font-size:14px; font-weight:700; fill:#14213D; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    .sub { font-size:12px; fill:#55606F; }
    .note { font-size:11px; fill:#55606F; }
  </style>
</defs>
<rect width="1020" height="560" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 16 · TRACEERBAARHEID</text>
<text x="40" y="64" class="title">Figuur 16.2 — Traceerbaarheidsmatrix vervroegde-uittredingregels</text>
<text x="40" y="86" class="sub">Elke regel uit de tabel van Figuur 15.4, herleid naar zijn bron in het pensioenreglement (§16.2).</text>

<!-- Header -->
<rect x="40" y="130" width="230" height="46" class="th"/>
<text x="52" y="150" class="thtxt">Regel</text>
<text x="52" y="166" class="thtxt" style="font-size:9.5px;font-weight:400;">(decision: Kortingspercentage vervroeging)</text>
<rect x="270" y="130" width="290" height="46" class="th"/>
<text x="282" y="158" class="thtxt">Bron / artikelverwijzing</text>
<rect x="560" y="130" width="180" height="46" class="th"/>
<text x="572" y="158" class="thtxt">Versie &amp; effectieve datum</text>
<rect x="740" y="130" width="240" height="46" class="th"/>
<text x="752" y="150" class="thtxt">Vertaald door / goedgekeurd</text>

<!-- Row 1 -->
<rect x="40" y="176" width="230" height="56" class="cell"/>
<text x="52" y="196" class="celltxt">R1: leeftijd &gt; 65 → 3%</text>
<text x="52" y="212" class="celltxtsub">rij 1, hit policy F</text>
<rect x="270" y="176" width="290" height="56" class="cell"/>
<text x="282" y="196" class="celltxt">Pensioenreglement art. 7.3 lid 2</text>
<text x="282" y="212" class="celltxtsub">vervroegingsstaffel, hoofdregel</text>
<rect x="560" y="176" width="180" height="56" class="cell"/>
<text x="572" y="196" class="celltxt">v2.1</text>
<text x="572" y="212" class="celltxtsub">effectief 1 jan 2025</text>
<rect x="740" y="176" width="240" height="56" class="cell"/>
<text x="752" y="196" class="celltxt">J. de Wit (actuaris)</text>
<text x="752" y="212" class="celltxtsub">goedgekeurd: compliance-functie</text>

<!-- Row 2 -->
<rect x="40" y="232" width="230" height="56" class="cellalt"/>
<text x="52" y="252" class="celltxt">R2: leeftijd [60..70) → 3%</text>
<text x="52" y="268" class="celltxtsub">rij 2, hit policy F</text>
<rect x="270" y="232" width="290" height="56" class="cellalt"/>
<text x="282" y="252" class="celltxt">Pensioenreglement art. 7.3 lid 2</text>
<text x="282" y="268" class="celltxtsub">zelfde artikel als R1 — zie Figuur 15.4</text>
<rect x="560" y="232" width="180" height="56" class="cellalt"/>
<text x="572" y="252" class="celltxt">v2.1</text>
<text x="572" y="268" class="celltxtsub">effectief 1 jan 2025</text>
<rect x="740" y="232" width="240" height="56" class="cellalt"/>
<text x="752" y="252" class="celltxt">J. de Wit (actuaris)</text>
<text x="752" y="268" class="celltxtsub">goedgekeurd: compliance-functie</text>

<!-- Row 3 -->
<rect x="40" y="288" width="230" height="56" class="cell"/>
<text x="52" y="308" class="celltxt">R3: leeftijd [50..60) → 6%</text>
<text x="52" y="324" class="celltxtsub">rij 3, hit policy F</text>
<rect x="270" y="288" width="290" height="56" class="cell"/>
<text x="282" y="308" class="celltxt">Pensioenreglement art. 7.3 lid 1</text>
<text x="282" y="324" class="celltxtsub">oudere staffelband, ongewijzigd sinds 2021</text>
<rect x="560" y="288" width="180" height="56" class="cell"/>
<text x="572" y="308" class="celltxt">v2.0</text>
<text x="572" y="324" class="celltxtsub">effectief 1 jul 2021</text>
<rect x="740" y="288" width="240" height="56" class="cell"/>
<text x="752" y="308" class="celltxt">J. de Wit (actuaris)</text>
<text x="752" y="324" class="celltxtsub">goedgekeurd: compliance-functie</text>

<!-- Row 4 -->
<rect x="40" y="344" width="230" height="56" class="cellalt"/>
<text x="52" y="364" class="celltxt">R4: leeftijd &gt; 70 &amp; partner ja</text>
<text x="52" y="380" class="celltxtsub">rij 4 — onbereikbaar, zie Figuur 15.4</text>
<rect x="270" y="344" width="290" height="56" class="cellalt"/>
<text x="282" y="364" class="celltxt">Pensioenreglement art. 7.4</text>
<text x="282" y="380" class="celltxtsub">partnertoeslag bij vervroeging</text>
<rect x="560" y="344" width="180" height="56" class="cellalt"/>
<text x="572" y="364" class="celltxt">v1.4</text>
<text x="572" y="380" class="celltxtsub">effectief 1 jan 2019</text>
<rect x="740" y="344" width="240" height="56" class="cellalt"/>
<text x="752" y="364" class="celltxt">R. Hamdi (jurist)</text>
<text x="752" y="380" class="celltxtsub">goedgekeurd: compliance-functie</text>

<!-- Row 5 -->
<rect x="40" y="400" width="230" height="56" class="cell"/>
<text x="52" y="420" class="celltxt">R5: leeftijd &lt;= 50 → 7%</text>
<text x="52" y="436" class="celltxtsub">rij 5, hit policy F</text>
<rect x="270" y="400" width="290" height="56" class="cell"/>
<text x="282" y="420" class="celltxt">Pensioenreglement art. 7.3 lid 0</text>
<text x="282" y="436" class="celltxtsub">uitzonderingsbepaling, laagste band</text>
<rect x="560" y="400" width="180" height="56" class="cell"/>
<text x="572" y="420" class="celltxt">v2.1</text>
<text x="572" y="436" class="celltxtsub">effectief 1 jan 2025</text>
<rect x="740" y="400" width="240" height="56" class="cell"/>
<text x="752" y="420" class="celltxt">J. de Wit (actuaris)</text>
<text x="752" y="436" class="celltxtsub">goedgekeurd: compliance-functie</text>

<rect x="40" y="130" width="940" height="326" fill="none" stroke="#14213D" stroke-width="1.6"/>

<text x="40" y="486" class="note">Bij een DNB-vraag "waarom wordt deze vervroegde uittreding met dit percentage gekort" is dit het antwoord —</text>
<text x="40" y="502" class="note">niet "zo hebben we het altijd gedaan". Regel R4 blijft in de matrix staan óók al is hij onbereikbaar (Figuur 15.4):</text>
<text x="40" y="518" class="note">traceerbaarheid geldt voor élke regel, ongeacht of de tabelanalyse hem al als fout heeft gemarkeerd.</text>
</svg>
