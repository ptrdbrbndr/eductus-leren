<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="'DM Sans', Arial, sans-serif" width="1000" height="560" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-fill { fill:#CFE0F2; }
      .navy { fill:#14213D; }
      .label { font-size:13.5px; font-weight:700; fill:#14213D; text-anchor:middle; }
      .label-dim { font-size:13.5px; font-weight:700; fill:#9AA4B2; text-anchor:middle; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-mid { font-size:11.5px; fill:#55606F; text-anchor:middle; }
      .panel-h { font-size:19px; font-weight:700; fill:#14213D; text-anchor:middle; }
      .panel-sub { font-size:12px; fill:#55606F; text-anchor:middle; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .task { fill:#CFE0F2; stroke:#14213D; stroke-width:1.6; }
      .task-dim { fill:#EEF2F7; stroke:#B9C2CE; stroke-width:1.4; stroke-dasharray:4,3; }
      .ring-thin { fill:#FBFAF7; stroke:#14213D; stroke-width:1.5; }
      .ring-thick { fill:#FBFAF7; stroke:#14213D; stroke-width:3.5; }
      .ring-thick-dim { fill:#EEF2F7; stroke:#B9C2CE; stroke-width:3; }
      .ring-double-solid { fill:#FBFAF7; stroke:#14213D; stroke-width:1.6; }
      .ring-double-dashed { fill:#FBFAF7; stroke:#14213D; stroke-width:1.6; stroke-dasharray:3,2.4; }
      .flow { stroke:#14213D; stroke-width:1.7; fill:none; marker-end:url(#arr); }
      .flow-dim { stroke:#B9C2CE; stroke-width:1.5; fill:none; stroke-dasharray:4,3; marker-end:url(#arrdim); }
      .icon-stroke { fill:none; stroke:#14213D; stroke-width:1.6; stroke-linejoin:round; stroke-linecap:round; }
      .icon-fill { fill:#14213D; }
    </style>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#14213D"/></marker>
    <marker id="arrdim" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#B9C2CE"/></marker>
</defs>
<rect width="1000" height="560" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 04 · BPMN-NOTATIE</text>
<text x="40" y="64" class="title">Interrupting versus non-interrupting boundary event</text>

<line x1="500" y1="95" x2="500" y2="520" stroke="#E3E0D8" stroke-width="1.2"/>

<!-- LEFT: interrupting -->
<text x="260" y="112" class="panel-h">Interrupting</text>
<text x="260" y="130" class="panel-sub">doorgetrokken dubbele rand — activiteit stopt</text>

<circle cx="70" cy="200" r="16" class="ring-thin"/>
<path d="M86,200 L150,200" class="flow"/>

<rect x="150" y="170" width="180" height="60" rx="10" class="task"/>
<circle cx="167" cy="185" r="8" fill="none" stroke="#14213D" stroke-width="1.3"/>
<circle cx="167" cy="185" r="8" fill="none" stroke="#14213D" stroke-width="1.3" stroke-dasharray="1.2,2.2"/>
<text x="240" y="207" class="label">Systeemaanroep uitvoeren</text>

<path d="M330,200 L426,200" class="flow-dim"/>
<line x1="372" y1="192" x2="384" y2="208" stroke="#B9C2CE" stroke-width="1.6"/>
<line x1="384" y1="192" x2="372" y2="208" stroke="#B9C2CE" stroke-width="1.6"/>
<circle cx="450" cy="200" r="18" class="ring-thick-dim"/>
<text x="450" y="238" class="label-dim">Verwerkt</text>
<text x="450" y="253" class="sub-mid" fill="#9AA4B2">(niet bereikt bij fout)</text>

<circle cx="240" cy="230" r="15" class="ring-double-solid"/>
<circle cx="240" cy="230" r="10" class="ring-double-solid"/>
<polyline points="235,224 242,229 237,231 245,239" class="icon-stroke"/>

<path d="M240,245 L240,320 L246,320" class="flow"/>
<rect x="150" y="320" width="180" height="60" rx="10" class="task"/>
<circle cx="167" cy="335" r="8" fill="none" stroke="#14213D" stroke-width="1.3"/>
<path d="M162,335 h10 M167,330 v10" stroke="#14213D" stroke-width="1.1"/>
<text x="240" y="357" class="label">Fout melden aan behandelaar</text>

<path d="M330,350 L396,350" class="flow"/>
<circle cx="418" cy="350" r="18" class="ring-thick"/>
<text x="418" y="388" class="label">Aanvraag afgebroken</text>

<text x="40" y="470" class="sub">Zodra het error boundary event optreedt, stopt "Systeemaanroep</text>
<text x="40" y="488" class="sub">uitvoeren" direct; het proces vervolgt alleen via het foutpad.</text>

<!-- RIGHT: non-interrupting -->
<text x="740" y="112" class="panel-h">Non-interrupting</text>
<text x="740" y="130" class="panel-sub">gestippelde dubbele rand — activiteit loopt door</text>

<circle cx="550" cy="200" r="16" class="ring-thin"/>
<path d="M566,200 L630,200" class="flow"/>

<rect x="630" y="170" width="180" height="60" rx="10" class="task"/>
<circle cx="647" cy="185" r="8" fill="none" stroke="#14213D" stroke-width="1.3"/>
<path d="M643,190 q4,-8 8,0 M647,178 v-2" stroke="#14213D" stroke-width="1.1" fill="none"/>
<text x="720" y="207" class="label">Aanvraag goedkeuren</text>

<path d="M810,200 L896,200" class="flow"/>
<circle cx="918" cy="200" r="18" class="ring-thick"/>
<text x="918" y="238" class="label">Aanvraag</text>
<text x="918" y="253" class="sub-mid">goedgekeurd</text>

<circle cx="720" cy="230" r="15" class="ring-double-dashed"/>
<circle cx="720" cy="230" r="10" class="ring-double-dashed"/>
<circle cx="720" cy="230" r="5.5" fill="none" stroke="#14213D" stroke-width="1.3"/>
<line x1="720" y1="230" x2="720" y2="226" stroke="#14213D" stroke-width="1.3"/>
<line x1="720" y1="230" x2="723" y2="231" stroke="#14213D" stroke-width="1.3"/>

<path d="M720,245 L720,320 L726,320" class="flow"/>
<rect x="630" y="320" width="180" height="60" rx="10" class="task"/>
<circle cx="647" cy="335" r="8" fill="none" stroke="#14213D" stroke-width="1.3"/>
<path d="M642,335 h10 M647,330 v10" stroke="#14213D" stroke-width="1.1"/>
<text x="720" y="357" class="label">Escaleren naar teamleider</text>

<path d="M810,350 L876,350" class="flow"/>
<circle cx="898" cy="350" r="18" class="ring-thick"/>
<text x="898" y="388" class="label">Geëscaleerd</text>

<text x="520" y="470" class="sub">"Aanvraag goedkeuren" loopt gewoon door naar "Aanvraag</text>
<text x="520" y="488" class="sub">goedgekeurd"; het boundary event opent er een parallel pad naast.</text>
</svg>
