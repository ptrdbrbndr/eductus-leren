<text x="40" y="64" class="title">Tokenlogica: splitsing en samenkomst moeten aansluiten</text>

<!-- ROW 1: FOUT -->
<text x="40" y="112" class="row-h-warn">Fout — parallel split gevolgd door exclusive join</text>

