<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" font-family="'DM Sans', Arial, sans-serif" width="1080" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .task { fill:#CFE0F2; stroke:#14213D; stroke-width:1.3; }
      .gw { fill:#FBF6E9; stroke:#14213D; stroke-width:1.5; }
      .ring-thin { fill:#FBFAF7; stroke:#14213D; stroke-width:1.3; }
      .ring-thick { fill:#FBFAF7; stroke:#14213D; stroke-width:2.4; }
      .token { fill:#E9A13B; stroke:#14213D; stroke-width:0.8; }
      .flow { stroke:#14213D; stroke-width:1.3; fill:none; marker-end:url(#arr); }
      .flow-plain { stroke:#14213D; stroke-width:1.3; fill:none; }
      .label-sm { font-size:10.5px; font-weight:700; fill:#14213D; text-anchor:middle; }
      .step { font-size:12px; font-weight:700; fill:#2563A8; text-anchor:middle; letter-spacing:.04em; }
      .cap { font-size:11px; fill:#55606F; text-anchor:middle; }
      .cap-warn { font-size:11px; fill:#B4511C; text-anchor:middle; font-weight:700; }
      .row-h { font-size:17px; font-weight:700; fill:#14213D; }
      .row-h-warn { font-size:17px; font-weight:700; fill:#B4511C; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .icon-stroke { fill:none; stroke:#14213D; stroke-width:1.3; }
    </style>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="4.5" refY="2.2" orient="auto"><path d="M0,0 L4.5,2.2 L0,4.4 Z" fill="#14213D"/></marker>
</defs>
<rect width="1080" height="620" class="paper"/>
