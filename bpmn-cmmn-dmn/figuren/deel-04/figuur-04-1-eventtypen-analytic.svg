<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="'DM Sans', Arial, sans-serif" width="960" height="440" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-fill { fill:#CFE0F2; }
      .blue-dark { fill:#2563A8; }
      .amber-fill { fill:#E9A13B; }
      .navy { fill:#14213D; }
      .label { font-size:14px; font-weight:700; fill:#14213D; text-anchor:middle; }
      .sub { font-size:11.5px; fill:#55606F; text-anchor:middle; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .ring-thin { fill:#FBFAF7; stroke:#14213D; stroke-width:1.5; }
      .ring-thick { fill:#FBFAF7; stroke:#14213D; stroke-width:3.5; }
      .icon-stroke { fill:none; stroke:#14213D; stroke-width:1.8; stroke-linejoin:round; stroke-linecap:round; }
      .icon-fill { fill:#14213D; }
      .footer { font-size:11px; fill:#55606F; }
    </style>
</defs>
<rect width="960" height="440" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 04 · BPMN-NOTATIE</text>
<text x="40" y="64" class="title">De zes aanvullende eventtypen</text>
<text x="40" y="86" class="sub" text-anchor="start">Aanvullend op figuur 3.4 (none / message / timer) — analytic subclass, BPMN 2.0.2 hoofdstuk 10</text>

<!-- Column 1: Error -->
<g>
  <circle cx="120" cy="200" r="32" class="ring-thin"/>
  <circle cx="120" cy="200" r="26" class="ring-thin"/>
  <polyline points="112,186 124,198 114,202 128,218" class="icon-stroke"/>
  <text x="120" y="256" class="label">Error</text>
  <text x="120" y="275" class="sub">onderbreekt door een fout</text>
</g>

<!-- Column 2: Escalation -->
<g>
  <circle cx="266" cy="200" r="32" class="ring-thin"/>
  <circle cx="266" cy="200" r="26" class="ring-thin"/>
  <polygon points="266,188 276,209 256,209" class="icon-stroke"/>
  <text x="266" y="256" class="label">Escalation</text>
  <text x="266" y="275" class="sub">signaleert naar hoger niveau</text>
</g>

<!-- Column 3: Signal -->
<g>
  <circle cx="412" cy="200" r="32" class="ring-thin"/>
  <circle cx="412" cy="200" r="26" class="ring-thin"/>
  <polygon points="412,187 424,211 400,211" class="icon-stroke"/>
  <polygon points="412,199 418,211 406,211" class="icon-stroke"/>
  <text x="412" y="256" class="label">Signal</text>
  <text x="412" y="275" class="sub">breed bericht, geen adressant</text>
</g>

<!-- Column 4: Conditional -->
<g>
  <circle cx="558" cy="200" r="32" class="ring-thin"/>
  <circle cx="558" cy="200" r="26" class="ring-thin"/>
  <line x1="558" y1="189" x2="558" y2="211" class="icon-stroke"/>
  <line x1="548" y1="194" x2="568" y2="206" class="icon-stroke"/>
  <line x1="568" y1="194" x2="548" y2="206" class="icon-stroke"/>
  <text x="558" y="256" class="label">Conditional</text>
  <text x="558" y="275" class="sub">treedt op bij een voorwaarde</text>
</g>

<!-- Column 5: Compensation -->
<g>
  <circle cx="704" cy="200" r="32" class="ring-thin"/>
  <circle cx="704" cy="200" r="26" class="ring-thin"/>
  <polygon points="702,190 702,210 692,200" class="icon-fill"/>
  <polygon points="714,190 714,210 704,200" class="icon-fill"/>
  <text x="704" y="256" class="label">Compensation</text>
  <text x="704" y="275" class="sub">maakt eerder werk ongedaan</text>
</g>

<!-- Column 6: Terminate -->
<g>
  <circle cx="850" cy="200" r="32" class="ring-thick"/>
  <circle cx="850" cy="200" r="14" class="icon-fill"/>
  <text x="850" y="256" class="label">Terminate</text>
  <text x="850" y="275" class="sub">stopt het hele proces direct</text>
</g>

<line x1="40" y1="330" x2="920" y2="330" stroke="#E3E0D8" stroke-width="1"/>
<text x="40" y="358" class="footer">Getekend als intermediate event (dubbele dunne rand); terminate is per definitie een end event (dikke rand, gevulde stip erin).</text>
<text x="40" y="376" class="footer">Het link event heeft in deze huisstijl geen eigen trigger-icoon (louter een diagram-koppelpunt) en valt buiten deze zes.</text>
</svg>
