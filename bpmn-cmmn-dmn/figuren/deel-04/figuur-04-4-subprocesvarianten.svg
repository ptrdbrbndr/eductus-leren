<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 400" font-family="'DM Sans', Arial, sans-serif" width="1080" height="400" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-fill { fill:#CFE0F2; }
      .light-fill { fill:#EEF2F7; }
      .task { fill:#CFE0F2; stroke:#14213D; stroke-width:1.3; }
      .sp { fill:#CFE0F2; stroke:#14213D; stroke-width:1.7; }
      .sp-dashed { fill:#EEF2F7; stroke:#14213D; stroke-width:1.7; stroke-dasharray:6,4; }
      .sp-inner { fill:none; stroke:#14213D; stroke-width:1.2; }
      .ring-thin { fill:#FBFAF7; stroke:#14213D; stroke-width:1.4; }
      .ring-thick { fill:#FBFAF7; stroke:#14213D; stroke-width:2.6; }
      .label-sm { font-size:11.5px; font-weight:700; fill:#14213D; text-anchor:middle; }
      .sub { font-size:11.5px; fill:#55606F; text-anchor:middle; }
      .panel-h { font-size:17px; font-weight:700; fill:#14213D; text-anchor:middle; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .flow { stroke:#14213D; stroke-width:1.4; fill:none; marker-end:url(#arr); }
      .icon-stroke { fill:none; stroke:#14213D; stroke-width:1.3; stroke-linejoin:round; stroke-linecap:round; }
    </style>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="#14213D"/></marker>
</defs>
<rect width="1080" height="400" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 04 · BPMN-NOTATIE</text>
<text x="40" y="64" class="title">De vier subprocesvarianten</text>

<!-- Column 1: Embedded -->
<text x="150" y="106" class="panel-h">Embedded</text>
<rect x="60" y="130" width="180" height="110" rx="12" class="sp"/>
<rect x="141" y="228" width="18" height="18" rx="3" fill="#FBFAF7" stroke="#14213D" stroke-width="1.3"/>
<line x1="150" y1="232" x2="150" y2="242" stroke="#14213D" stroke-width="1.3"/>
<line x1="145" y1="237" x2="155" y2="237" stroke="#14213D" stroke-width="1.3"/>
<text x="150" y="280" class="sub">geen eigen herbruikbare</text>
<text x="150" y="296" class="sub">definitie; groepeert een</text>
<text x="150" y="312" class="sub">deel van dit model</text>

<!-- Column 2: Event subprocess -->
<text x="410" y="106" class="panel-h">Event subprocess</text>
<rect x="320" y="130" width="180" height="110" rx="12" class="sp-dashed"/>
<circle cx="350" cy="160" r="12" class="ring-thin"/>
<circle cx="350" cy="160" r="8" class="ring-thin"/>
<polyline points="345,156 352,161 347,164 355,172" class="icon-stroke"/>
<path d="M362,160 L392,160" class="flow"/>
<rect x="392" y="145" width="66" height="30" rx="6" class="task"/>
<text x="425" y="164" class="label-sm">Herstellen</text>
<path d="M458,160 L472,160" class="flow"/>
<circle cx="482" cy="160" r="10" class="ring-thick"/>
<text x="410" y="205" class="sub" font-style="italic">getriggerd bij error, ongeacht</text>
<text x="410" y="220" class="sub" font-style="italic">waar het hoofdproces is</text>
<text x="410" y="280" class="sub">getriggerd door een event,</text>
<text x="410" y="296" class="sub">niet in de normale flow van</text>
<text x="410" y="312" class="sub">het hoofdproces</text>

<!-- Column 3: Transaction -->
<text x="670" y="106" class="panel-h">Transaction</text>
<rect x="580" y="130" width="180" height="110" rx="12" class="sp"/>
<rect x="587" y="137" width="166" height="96" rx="8" class="sp-inner"/>
<rect x="661" y="228" width="18" height="18" rx="3" fill="#FBFAF7" stroke="#14213D" stroke-width="1.3"/>
<line x1="670" y1="232" x2="670" y2="242" stroke="#14213D" stroke-width="1.3"/>
<line x1="665" y1="237" x2="675" y2="237" stroke="#14213D" stroke-width="1.3"/>
<text x="670" y="280" class="sub">alles-of-niets: bij falen</text>
<text x="670" y="296" class="sub">wordt al het voltooide werk</text>
<text x="670" y="312" class="sub">gecompenseerd</text>

<!-- Column 4: Ad-hoc -->
<text x="930" y="106" class="panel-h">Ad-hoc subprocess</text>
<rect x="840" y="130" width="180" height="110" rx="12" class="sp"/>
<path d="M918,238 q4,-7 8,0 q4,-7 8,0" class="icon-stroke"/>
<text x="930" y="280" class="sub">activiteiten zonder vaste</text>
<text x="930" y="296" class="sub">volgorde, met een</text>
<text x="930" y="312" class="sub">voltooiingsconditie</text>

<line x1="40" y1="345" x2="1040" y2="345" stroke="#E3E0D8" stroke-width="1"/>
<text x="40" y="368" class="sub" text-anchor="start">Collapsed getekend, behalve het event subprocess: die toont per definitie zijn interne start event.</text>
</svg>
