<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" font-family="'DM Sans', Arial, sans-serif" width="1080" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-fill { fill:#CFE0F2; }
      .amber-fill { fill:#E9A13B; }
      .gw { fill:#FBF6E9; stroke:#14213D; stroke-width:1.8; }
      .gw-inner { fill:none; stroke:#14213D; stroke-width:1.3; }
      .task { fill:#CFE0F2; stroke:#14213D; stroke-width:1.5; }
      .ring-thin { fill:#FBFAF7; stroke:#14213D; stroke-width:1.4; }
      .label { font-size:13px; font-weight:700; fill:#14213D; text-anchor:middle; }
      .label-sm { font-size:11.5px; font-weight:700; fill:#14213D; text-anchor:middle; }
      .cond { font-size:10.5px; fill:#55606F; font-style:italic; text-anchor:middle; }
      .sub { font-size:12px; fill:#55606F; }
      .panel-h { font-size:18px; font-weight:700; fill:#14213D; text-anchor:middle; }
      .panel-tag { font-size:11px; fill:#2563A8; font-weight:700; letter-spacing:.06em; text-anchor:middle; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .flow { stroke:#14213D; stroke-width:1.6; fill:none; marker-end:url(#arr); }
      .icon-stroke { fill:none; stroke:#14213D; stroke-width:1.4; stroke-linejoin:round; stroke-linecap:round; }
    </style>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#14213D"/></marker>
</defs>
<rect width="1080" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 04 · BPMN-NOTATIE</text>
<text x="40" y="64" class="title">Event-based, inclusive en complex gateway</text>

<line x1="365" y1="95" x2="365" y2="575" stroke="#E3E0D8" stroke-width="1.2"/>
<line x1="715" y1="95" x2="715" y2="575" stroke="#E3E0D8" stroke-width="1.2"/>

<!-- COLUMN 1: Event-based -->
<text x="190" y="112" class="panel-h">Event-based gateway</text>
<text x="190" y="130" class="panel-tag">ROUTEERT OP WELK EVENT EERST OPTREEDT</text>

<polygon points="190,138 232,180 190,222 148,180" class="gw"/>
<polygon points="190,146 224,180 190,214 156,180" class="gw-inner"/>
<polygon points="190,168 200,175 196,187 184,187 180,175" fill="none" stroke="#14213D" stroke-width="1.3"/>

<text x="190" y="252" class="label-sm">Voorbeeld</text>
<polygon points="100,285 118,300 100,315 82,300" class="gw"/>
<path d="M118,300 L172,300" class="flow"/>
<path d="M100,285 L100,265 L280,265 L280,285" class="flow" marker-end="none" fill="none" stroke="#14213D" stroke-width="1.6"/>

<circle cx="190" cy="300" r="13" class="ring-thin"/>
<circle cx="190" cy="300" r="9" class="ring-thin"/>
<path d="M183,296 l7,5 l7,-5 M183,296 v9 h14 v-9" fill="none" stroke="#14213D" stroke-width="1.1"/>
<text x="190" y="325" class="cond">Bevestiging ontvangen</text>
<path d="M190,313 L190,340" class="flow"/>
<rect x="140" y="340" width="100" height="42" rx="8" class="task"/>
<text x="190" y="365" class="label-sm">Bevestiging</text>
<text x="190" y="378" class="label-sm">verwerken</text>

<path d="M118,300 L172,300" class="flow"/>
<circle cx="280" cy="300" r="13" class="ring-thin"/>
<circle cx="280" cy="300" r="9" class="ring-thin"/>
<circle cx="280" cy="300" r="4.5" fill="none" stroke="#14213D" stroke-width="1.1"/>
<line x1="280" y1="300" x2="280" y2="296.5" stroke="#14213D" stroke-width="1.1"/>
<line x1="280" y1="300" x2="283" y2="301" stroke="#14213D" stroke-width="1.1"/>
<path d="M118,300 L267,300" class="flow"/>
<text x="280" y="325" class="cond">14 dagen verstreken</text>
<path d="M280,313 L280,340" class="flow"/>
<rect x="230" y="340" width="100" height="42" rx="8" class="task"/>
<text x="280" y="365" class="label-sm">Herinnering</text>
<text x="280" y="378" class="label-sm">versturen</text>

<text x="30" y="410" class="sub">Na "Verzoek versturen": het eerste event dat</text>
<text x="30" y="426" class="sub">optreedt — bericht óf timer — bepaalt het pad.</text>
<text x="30" y="442" class="sub">De andere tak vervalt op dat moment.</text>

<!-- COLUMN 2: Inclusive -->
<text x="540" y="112" class="panel-h">Inclusive gateway (OR)</text>
<text x="540" y="130" class="panel-tag">EEN OF MEER PADEN, AFHANKELIJK VAN CONDITIES</text>

<polygon points="540,138 582,180 540,222 498,180" class="gw"/>
<circle cx="540" cy="180" r="16" fill="none" stroke="#14213D" stroke-width="1.6"/>

<text x="540" y="252" class="label-sm">Voorbeeld</text>
<polygon points="465,320 483,335 465,350 447,335" class="gw"/>
<path d="M465,320 L465,300 L590,300 L590,280" class="flow" fill="none" stroke="#14213D" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="590" y="270" class="cond">bedrag &gt; 1000</text>
<rect x="540" y="280" width="120" height="42" rx="8" class="task"/>
<text x="600" y="305" class="label-sm">Extra controle</text>

<path d="M465,350 L465,370 L590,370 L590,390" class="flow" fill="none" stroke="#14213D" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="590" y="380" class="cond">altijd</text>
<rect x="540" y="390" width="120" height="42" rx="8" class="task"/>
<text x="600" y="415" class="label-sm">Standaard verwerken</text>

<text x="415" y="452" class="sub">Beide condities kunnen tegelijk waar zijn: dan lopen</text>
<text x="415" y="468" class="sub">beide paden, en wacht de join op alle geactiveerde</text>
<text x="415" y="484" class="sub">paden — nul, één of alle tegelijk (§4.4).</text>

<!-- COLUMN 3: Complex -->
<text x="890" y="112" class="panel-h">Complex gateway</text>
<text x="890" y="130" class="panel-tag">LOGICA BUITEN DE ANDERE GATEWAYTYPEN</text>

<polygon points="890,138 932,180 890,222 848,180" class="gw"/>
<line x1="890" y1="169" x2="890" y2="191" class="icon-stroke"/>
<line x1="879" y1="174" x2="901" y2="186" class="icon-stroke"/>
<line x1="901" y1="174" x2="879" y2="186" class="icon-stroke"/>

<text x="890" y="252" class="label-sm">Voorbeeld</text>
<text x="815" y="278" class="cond">dekkingsgraad &lt; 100%</text>
<text x="815" y="330" class="cond">én mutatie &gt; 3</text>
<text x="815" y="382" class="cond">én binnen kwartaal</text>
<path d="M840,275 L872,300" class="flow"/>
<path d="M840,330 L872,325" class="flow"/>
<path d="M840,382 L872,350" class="flow"/>
<polygon points="890,308 908,325 890,342 872,325" class="gw"/>
<path d="M908,325 L950,325" class="flow"/>
<rect x="950" y="304" width="90" height="42" rx="8" class="task"/>
<text x="995" y="322" class="label-sm">Route</text>
<text x="995" y="335" class="label-sm">bepalen</text>

<text x="765" y="410" class="sub">Zelden nodig — combinatielogica als deze is meestal</text>
<text x="765" y="426" class="sub">een DMN-beslisregel (deel 6/8), geen gateway.</text>
</svg>
