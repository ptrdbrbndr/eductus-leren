<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 820" font-family="'DM Sans', Arial, sans-serif" width="1080" height="820" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .pool { fill:#FFFFFF; stroke:#14213D; stroke-width:1.6; }
      .pool-tab { fill:#CFE0F2; stroke:#14213D; stroke-width:1.6; }
      .pool-collapsed { fill:#14213D; stroke:#14213D; stroke-width:1.6; }
      .tab-label { font-size:14px; font-weight:700; fill:#14213D; text-anchor:middle; }
      .task { fill:#CFE0F2; stroke:#14213D; stroke-width:1.4; }
      .gw { fill:#FBF6E9; stroke:#14213D; stroke-width:1.6; }
      .gw-inner { fill:none; stroke:#14213D; stroke-width:1.1; }
      .ring-thin { fill:#FBFAF7; stroke:#14213D; stroke-width:1.3; }
      .ring-thick { fill:#FBFAF7; stroke:#14213D; stroke-width:2.6; }
      .ring-double { fill:#FBFAF7; stroke:#14213D; stroke-width:1.3; }
      .ring-double-solid { fill:#FBFAF7; stroke:#14213D; stroke-width:1.5; }
      .sp-dashed { fill:#EEF2F7; stroke:#14213D; stroke-width:1.6; stroke-dasharray:6,4; }
      .label { font-size:12.5px; font-weight:700; fill:#14213D; text-anchor:middle; }
      .label-w { font-size:14px; font-weight:700; fill:#FBFAF7; text-anchor:middle; }
      .cap { font-size:11px; fill:#55606F; text-anchor:middle; }
      .cap-left { font-size:11px; fill:#55606F; }
      .note { font-size:10.5px; fill:#55606F; font-style:italic; }
      .note-box { fill:#FBF6E9; stroke:#E9A13B; stroke-width:1.2; }
      .flow { stroke:#14213D; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .msg-flow { stroke:#14213D; stroke-width:1.3; stroke-dasharray:4,3; fill:none; marker-start:url(#msgstart); marker-end:url(#msgarr); }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .icon-stroke { fill:none; stroke:#14213D; stroke-width:1.3; stroke-linejoin:round; stroke-linecap:round; }
      .tag { font-size:10.5px; font-weight:700; fill:#2563A8; letter-spacing:.06em; }
    </style>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="#14213D"/></marker>
    <marker id="msgarr" markerWidth="8" markerHeight="8" refX="5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="none" stroke="#14213D" stroke-width="1"/></marker>
    <marker id="msgstart" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><circle cx="3.5" cy="3.5" r="2.6" fill="#FBFAF7" stroke="#14213D" stroke-width="1"/></marker>
</defs>
<rect width="1080" height="820" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 04 · BPMN-NOTATIE</text>
<text x="40" y="64" class="title">WI-114 (waardeoverdracht) — uitgebreid met event subprocess</text>
<text x="40" y="84" class="cap-left">Basismodel van deel 3, opdracht 5, met foutafhandeling toegevoegd via een event subprocess (§4.5)</text>

<!-- POOL: Deelnemer -->
<rect x="40" y="100" width="1000" height="130" class="pool"/>
<rect x="40" y="100" width="28" height="130" class="pool-tab"/>
<text x="54" y="165" class="tab-label" transform="rotate(-90 54 165)">Deelnemer</text>

<circle cx="110" cy="180" r="12" class="ring-thin"/>
<path d="M122,180 L150,180" class="flow"/>
<rect x="150" y="155" width="190" height="50" rx="8" class="task"/>
<circle cx="167" cy="170" r="7" fill="none" stroke="#14213D" stroke-width="1.1"/>
<path d="M161,167 l6,4 l6,-4" fill="none" stroke="#14213D" stroke-width="1"/>
<text x="245" y="185" class="label">Verzoek om aanvulling</text>
<text x="245" y="199" class="label">ontvangen</text>

<path d="M340,180 L390,180" class="flow"/>
<rect x="390" y="155" width="170" height="50" rx="8" class="task"/>
<polygon points="407,163 421,163 421,177 407,177" fill="#14213D"/>
<path d="M407,163 l7,6 l7,-6" fill="none" stroke="#FBFAF7" stroke-width="1"/>
<text x="475" y="185" class="label">Aanvulling</text>
<text x="475" y="199" class="label">versturen</text>

<path d="M560,180 L590,180" class="flow"/>
<circle cx="606" cy="180" r="13" class="ring-thick"/>
<text x="606" y="212" class="cap">Aanvulling verstuurd</text>

<!-- POOL: Meridiaan -->
<rect x="40" y="240" width="1000" height="430" class="pool"/>
<rect x="40" y="240" width="28" height="430" class="pool-tab"/>
<text x="54" y="455" class="tab-label" transform="rotate(-90 54 455)">Meridiaan</text>

<!-- main flow -->
<circle cx="112" cy="310" r="13" class="ring-thin"/>
<text x="112" y="340" class="cap">Aanvraag</text>
<text x="112" y="353" class="cap">ontvangen</text>
<path d="M125,310 L152,310" class="flow"/>
<rect x="152" y="285" width="150" height="50" rx="8" class="task"/>
<circle cx="169" cy="300" r="7" fill="none" stroke="#14213D" stroke-width="1.1"/>
<path d="M164,297 q5,-6 10,0 M169,290 v-1.5" fill="none" stroke="#14213D" stroke-width="0.9"/>
<text x="227" y="315" class="label">Aanvraag openen</text>

<path d="M302,310 L328,310" class="flow"/>
<polygon points="345,294 361,310 345,326 329,310" class="gw"/>
<line x1="337" y1="310" x2="353" y2="310" stroke="#14213D" stroke-width="1"/>
<line x1="345" y1="302" x2="345" y2="318" stroke="#14213D" stroke-width="1" transform="rotate(45 345 310)"/>
<text x="345" y="270" class="cap">Volledig?</text>

<path d="M361,310 L400,310" class="flow"/>
<text x="380" y="298" class="cap">ja</text>
<rect x="400" y="285" width="170" height="50" rx="8" class="task"/>
<circle cx="417" cy="300" r="7" fill="none" stroke="#14213D" stroke-width="1.1"/>
<path d="M412,297 q5,-6 10,0 M417,290 v-1.5" fill="none" stroke="#14213D" stroke-width="0.9"/>
<text x="485" y="315" class="label">Aanvraag doorzetten</text>

<path d="M570,310 L598,310" class="flow"/>
<circle cx="614" cy="310" r="13" class="ring-thick"/>
<text x="614" y="342" class="cap">Aanvraag compleet</text>
<text x="614" y="355" class="cap">ontvangen</text>

<path d="M345,326 L345,365 L272,365" class="flow"/>
<text x="300" y="352" class="cap">nee</text>
<rect x="272" y="365" width="200" height="50" rx="8" class="task"/>
<polygon points="289,373 303,373 303,387 289,387" fill="#14213D"/>
<path d="M289,373 l7,6 l7,-6" fill="none" stroke="#FBFAF7" stroke-width="1"/>
<text x="372" y="386" class="label">Verzoek om aanvulling</text>
<text x="372" y="400" class="label">versturen</text>

<path d="M372,415 L372,235" class="msg-flow" marker-end="url(#msgarr)"/>

<path d="M472,390 L500,390" class="flow"/>
<polygon points="516,375 530,390 516,405 502,390" class="gw"/>
<polygon points="516,375 526,382 522,392 510,392 506,382" fill="none" stroke="#14213D" stroke-width="1"/>
<polygon points="512,378 520,378 526,384 522,394 510,394 506,384" fill="none" stroke="#14213D" stroke-width="0.8"/>
<text x="516" y="425" class="cap">event-based</text>

<path d="M530,382 L600,355" class="flow"/>
<circle cx="618" cy="345" r="13" class="ring-double"/>
<circle cx="618" cy="345" r="9" class="ring-double"/>
<path d="M611,341 l7,5 l7,-5 M611,341 v9 h14 v-9" fill="none" stroke="#14213D" stroke-width="1"/>
<text x="618" y="320" class="cap">Aanvulling ontvangen</text>
<path d="M618,155 L618,332" class="msg-flow" marker-end="url(#msgarr)"/>

<path d="M618,332 L618,310 L570,310" class="flow" marker-end="none"/>
<path d="M618,332 Q618,300 572,308" fill="none" stroke="#14213D" stroke-width="1.5" marker-end="url(#arr)"/>

<path d="M530,398 L600,425" class="flow"/>
<circle cx="618" cy="435" r="13" class="ring-double"/>
<circle cx="618" cy="435" r="9" class="ring-double"/>
<circle cx="618" cy="435" r="4" fill="none" stroke="#14213D" stroke-width="1"/>
<line x1="618" y1="435" x2="618" y2="431" stroke="#14213D" stroke-width="1"/>
<line x1="618" y1="435" x2="621" y2="436" stroke="#14213D" stroke-width="1"/>
<text x="618" y="460" class="cap">14 dagen verstreken</text>

<path d="M631,435 L660,435" class="flow"/>
<circle cx="676" cy="435" r="13" class="ring-thick"/>
<text x="676" y="467" class="cap">Aanvraag niet</text>
<text x="676" y="480" class="cap">aangevuld</text>

<rect x="700" y="360" width="270" height="70" rx="6" class="note-box"/>
<text x="712" y="378" class="note">Keuze opdracht 5: event-based gateway laat het</text>
<text x="712" y="392" class="note">eerst optredende event (bericht óf termijn) het</text>
<text x="712" y="406" class="note">vervolg bepalen — voorkomt onnodig blijven</text>
<text x="712" y="420" class="note">wachten na een tijdige reactie.</text>

<!-- event subprocess -->
<rect x="88" y="500" width="912" height="150" class="sp-dashed"/>
<text x="104" y="520" class="tag">EVENT SUBPROCESS · INTERRUPTING</text>

<circle cx="160" cy="580" r="13" class="ring-double-solid"/>
<circle cx="160" cy="580" r="9" class="ring-double-solid"/>
<polyline points="155,575 163,581 157,585 166,596" class="icon-stroke"/>
<text x="160" y="612" class="cap">Systeemfout tijdens</text>
<text x="160" y="625" class="cap">verwerking</text>

<path d="M173,580 L210,580" class="flow"/>
<rect x="210" y="555" width="230" height="50" rx="8" class="task"/>
<circle cx="227" cy="570" r="7" fill="none" stroke="#14213D" stroke-width="1.1"/>
<path d="M222,570 h10 M227,565 v10" stroke="#14213D" stroke-width="0.9"/>
<text x="325" y="585" class="label">Fout melden aan behandelaar</text>

<path d="M440,580 L468,580" class="flow"/>
<circle cx="484" cy="580" r="13" class="ring-thick"/>
<text x="484" y="612" class="cap">Verwerking</text>
<text x="484" y="625" class="cap">afgebroken (fout)</text>

<rect x="560" y="545" width="410" height="70" rx="6" class="note-box"/>
<text x="572" y="563" class="note">Onafhankelijk van de hoofdflow hierboven: geactiveerd zodra</text>
<text x="572" y="577" class="note">deze fout optreedt, ongeacht welke stap op dat moment loopt —</text>
<text x="572" y="591" class="note">het alternatief voor losse boundary events op elke activiteit</text>
<text x="572" y="605" class="note">(§4.5, keuzevraag).</text>

<!-- POOL: Werkgever (collapsed) -->
<rect x="40" y="690" width="1000" height="70" class="pool-collapsed"/>
<text x="540" y="731" class="label-w">Werkgever (collapsed)</text>

<text x="40" y="790" class="note">Werkgever is in dit fragment van WI-114 (volledigheidscontrole) niet actief betrokken; de pool is opgenomen omdat</text>
<text x="40" y="804" class="note">de opdracht drie pools voorschrijft, maar bevat voor dit deelfragment geen sequence- of message flow.</text>
</svg>
