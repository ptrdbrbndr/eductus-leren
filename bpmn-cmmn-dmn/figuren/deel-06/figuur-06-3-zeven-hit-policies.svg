<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 700" font-family="'DM Sans', Arial, sans-serif" width="1440" height="700" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .boxbg { fill:#FFFFFF; stroke:#E3E0D8; stroke-width:1.5; }
      .headerfill { fill:#CFE0F2; }
      .hitpolicyfill { fill:#E9A13B; }
      .gridline { stroke:#14213D; stroke-width:1; }
      .headtext { font-size:11.5px; font-weight:700; fill:#14213D; }
      .celltext { font-size:11.5px; fill:#14213D; }
      .hittext { font-size:14px; font-weight:800; fill:#14213D; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .boxkicker { font-size:9.5px; fill:#55606F; letter-spacing:.1em; }
      .boxtitle { font-size:14.5px; font-weight:700; fill:#14213D; }
      .caption { font-size:10.5px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .sub { font-size:12px; fill:#55606F; }
    </style>
</defs>
<rect width="1440" height="700" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 06 · DMN-NOTATIE</text>
<text x="40" y="64" class="title">Figuur 6.3 — De zeven hit policies</text>
<text x="40" y="86" class="sub">Elk voorbeeld toont een minitabel die het gedrag van de policy illustreert bij een overlappende of volledige situatie.</text>

<!-- ===== BOX 1: Unique (U) ===== -->
<rect x="40" y="110" width="315" height="250" class="boxbg"/>
<text x="55" y="126" class="boxkicker">HIT POLICY</text>
<text x="55" y="144" class="boxtitle">Unique (U)</text>
<rect x="55" y="156" width="28" height="24" class="hitpolicyfill"/>
<text x="69" y="172" text-anchor="middle" class="hittext">U</text>
<rect x="83" y="156" width="140" height="24" class="headerfill"/>
<rect x="226" y="156" width="114" height="24" class="headerfill"/>
<text x="153" y="172" text-anchor="middle" class="headtext">Leeftijd</text>
<text x="283" y="172" text-anchor="middle" class="headtext">Categorie</text>
<text x="153" y="195" text-anchor="middle" class="celltext">&lt; 30</text>
<text x="283" y="195" text-anchor="middle" class="celltext">Jong</text>
<text x="153" y="217" text-anchor="middle" class="celltext">[30..60]</text>
<text x="283" y="217" text-anchor="middle" class="celltext">Middel</text>
<text x="153" y="239" text-anchor="middle" class="celltext">&gt; 60</text>
<text x="283" y="239" text-anchor="middle" class="celltext">Senior</text>
<line x1="55" y1="156" x2="340" y2="156" class="gridline"/>
<line x1="55" y1="180" x2="340" y2="180" class="gridline"/>
<line x1="55" y1="202" x2="340" y2="202" class="gridline"/>
<line x1="55" y1="224" x2="340" y2="224" class="gridline"/>
<line x1="55" y1="246" x2="340" y2="246" class="gridline"/>
<line x1="55" y1="156" x2="55" y2="246" class="gridline"/>
<line x1="83" y1="156" x2="83" y2="246" class="gridline"/>
<line x1="223" y1="156" x2="223" y2="246" class="gridline"/>
<line x1="226" y1="156" x2="226" y2="246" class="gridline"/>
<line x1="340" y1="156" x2="340" y2="246" class="gridline"/>
<text x="55" y="266" class="caption">Regels sluiten elkaar uit: elke leeftijd</text>
<text x="55" y="282" class="caption">past in precies één rij.</text>

<!-- ===== BOX 2: Any (A) ===== -->
<rect x="375" y="110" width="315" height="250" class="boxbg"/>
<text x="390" y="126" class="boxkicker">HIT POLICY</text>
<text x="390" y="144" class="boxtitle">Any (A)</text>
<rect x="390" y="156" width="28" height="24" class="hitpolicyfill"/>
<text x="404" y="172" text-anchor="middle" class="hittext">A</text>
<rect x="418" y="156" width="140" height="24" class="headerfill"/>
<rect x="561" y="156" width="114" height="24" class="headerfill"/>
<text x="488" y="172" text-anchor="middle" class="headtext">Bedrag</text>
<text x="618" y="172" text-anchor="middle" class="headtext">Actie</text>
<text x="488" y="195" text-anchor="middle" class="celltext">&gt; 10.000</text>
<text x="618" y="195" text-anchor="middle" class="celltext">Escaleren</text>
<text x="488" y="217" text-anchor="middle" class="celltext">&gt; 50.000</text>
<text x="618" y="217" text-anchor="middle" class="celltext">Escaleren</text>
<line x1="390" y1="156" x2="675" y2="156" class="gridline"/>
<line x1="390" y1="180" x2="675" y2="180" class="gridline"/>
<line x1="390" y1="202" x2="675" y2="202" class="gridline"/>
<line x1="390" y1="224" x2="675" y2="224" class="gridline"/>
<line x1="390" y1="156" x2="390" y2="224" class="gridline"/>
<line x1="418" y1="156" x2="418" y2="224" class="gridline"/>
<line x1="558" y1="156" x2="558" y2="224" class="gridline"/>
<line x1="561" y1="156" x2="561" y2="224" class="gridline"/>
<line x1="675" y1="156" x2="675" y2="224" class="gridline"/>
<text x="390" y="244" class="caption">Rijen overlappen (bv. 60.000) maar geven</text>
<text x="390" y="260" class="caption">dezelfde uitkomst — toegestaan bij Any.</text>

<!-- ===== BOX 3: Priority (P) ===== -->
<rect x="710" y="110" width="315" height="250" class="boxbg"/>
<text x="725" y="126" class="boxkicker">HIT POLICY</text>
<text x="725" y="144" class="boxtitle">Priority (P)</text>
<rect x="725" y="156" width="28" height="24" class="hitpolicyfill"/>
<text x="739" y="172" text-anchor="middle" class="hittext">P</text>
<rect x="753" y="156" width="140" height="24" class="headerfill"/>
<rect x="896" y="156" width="114" height="24" class="headerfill"/>
<text x="823" y="172" text-anchor="middle" class="headtext">Voorwaarde</text>
<text x="953" y="172" text-anchor="middle" class="headtext">Uitkomst</text>
<text x="823" y="195" text-anchor="middle" class="celltext">Dekkingsgraad&lt;100%</text>
<text x="953" y="195" text-anchor="middle" class="celltext">Afwijzen</text>
<text x="823" y="217" text-anchor="middle" class="celltext">Bedrag&gt;afkoopgrens</text>
<text x="953" y="217" text-anchor="middle" class="celltext">Aanhouden</text>
<line x1="725" y1="156" x2="1010" y2="156" class="gridline"/>
<line x1="725" y1="180" x2="1010" y2="180" class="gridline"/>
<line x1="725" y1="202" x2="1010" y2="202" class="gridline"/>
