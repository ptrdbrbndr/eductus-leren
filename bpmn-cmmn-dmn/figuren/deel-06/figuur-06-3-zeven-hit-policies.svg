<line x1="863" y1="446" x2="863" y2="514" class="gridline"/>
<text x="578" y="534" class="caption">Uitvoer gesorteerd op vaste volgorde</text>
<text x="578" y="550" class="caption">Hoog vóór Midden — niet op rijvolgorde.</text>

