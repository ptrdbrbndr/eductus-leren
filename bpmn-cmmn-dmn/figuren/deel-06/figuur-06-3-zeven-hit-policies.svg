<line x1="411" y1="446" x2="411" y2="514" class="gridline"/>
<line x1="414" y1="446" x2="414" y2="514" class="gridline"/>
<line x1="528" y1="446" x2="528" y2="514" class="gridline"/>
<text x="243" y="534" class="caption">Alle ware rijen tellen mee; met SUM:</text>
<text x="243" y="550" class="caption">beide waar → totaal € 80.</text>

<!-- ===== BOX 6: Output order (O) ===== -->
<rect x="563" y="400" width="315" height="250" class="boxbg"/>
<text x="578" y="416" class="boxkicker">HIT POLICY</text>
