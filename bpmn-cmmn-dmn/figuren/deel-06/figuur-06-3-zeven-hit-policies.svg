<text x="1288" y="195" text-anchor="middle" class="celltext">Pensioen</text>
<text x="1158" y="217" text-anchor="middle" class="celltext">≥ 18</text>
<text x="1288" y="217" text-anchor="middle" class="celltext">Actief</text>
<text x="1158" y="239" text-anchor="middle" class="celltext">&lt; 18</text>
<text x="1288" y="239" text-anchor="middle" class="celltext">Onbekend</text>
<line x1="1060" y1="156" x2="1345" y2="156" class="gridline"/>
<line x1="1060" y1="180" x2="1345" y2="180" class="gridline"/>
<line x1="1060" y1="202" x2="1345" y2="202" class="gridline"/>
<line x1="1060" y1="224" x2="1345" y2="224" class="gridline"/>
<line x1="1060" y1="246" x2="1345" y2="246" class="gridline"/>
<line x1="1060" y1="156" x2="1060" y2="246" class="gridline"/>
<line x1="1088" y1="156" x2="1088" y2="246" class="gridline"/>
<line x1="1228" y1="156" x2="1228" y2="246" class="gridline"/>
<line x1="1231" y1="156" x2="1231" y2="246" class="gridline"/>
<line x1="1345" y1="156" x2="1345" y2="246" class="gridline"/>
<text x="1060" y="266" class="caption">Eerste rij die waar is, van boven naar</text>
<text x="1060" y="282" class="caption">beneden, wint — volgorde is betekenisvol.</text>

<!-- ===== BOX 5: Collect (C) ===== -->
<rect x="228" y="400" width="315" height="250" class="boxbg"/>
<text x="243" y="416" class="boxkicker">HIT POLICY</text>
