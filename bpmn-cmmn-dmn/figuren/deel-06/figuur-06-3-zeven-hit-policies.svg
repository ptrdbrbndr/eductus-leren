<text x="341" y="507" text-anchor="middle" class="celltext">Kind ten laste</text>
<text x="471" y="507" text-anchor="middle" class="celltext">€ 30</text>
<line x1="243" y1="446" x2="528" y2="446" class="gridline"/>
<line x1="243" y1="470" x2="528" y2="470" class="gridline"/>
<line x1="243" y1="492" x2="528" y2="492" class="gridline"/>
