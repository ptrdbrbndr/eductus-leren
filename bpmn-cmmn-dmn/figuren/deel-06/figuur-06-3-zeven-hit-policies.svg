<line x1="725" y1="156" x2="725" y2="224" class="gridline"/>
<line x1="753" y1="156" x2="753" y2="224" class="gridline"/>
<line x1="893" y1="156" x2="893" y2="224" class="gridline"/>
<line x1="896" y1="156" x2="896" y2="224" class="gridline"/>
<line x1="1010" y1="156" x2="1010" y2="224" class="gridline"/>
<text x="725" y="244" class="caption">Bij overlap wint de vooraf bepaalde</text>
<text x="725" y="260" class="caption">prioriteit: Afwijzen vóór Aanhouden.</text>

<!-- ===== BOX 4: First (F) ===== -->
<rect x="1045" y="110" width="315" height="250" class="boxbg"/>
<text x="1060" y="126" class="boxkicker">HIT POLICY</text>
<text x="1060" y="144" class="boxtitle">First (F)</text>
