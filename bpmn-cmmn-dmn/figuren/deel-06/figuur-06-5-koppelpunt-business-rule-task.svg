<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" font-family="'DM Sans', Arial, sans-serif" width="1000" height="780" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .task { fill:#EEF2F7; stroke:#14213D; stroke-width:1.8; }
      .gateway { fill:#FFFFFF; stroke:#14213D; stroke-width:1.8; }
      .event { fill:#FFFFFF; stroke:#14213D; stroke-width:2; }
      .decision { fill:#CFE0F2; stroke:#2563A8; stroke-width:2; }
      .inputdata { fill:#EEF2F7; stroke:#14213D; stroke-width:1.5; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-small { font-size:12px; font-weight:600; fill:#14213D; }
      .sub { font-size:12px; fill:#55606F; }
      .subitalic { font-size:10.5px; fill:#55606F; font-style:italic; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .flowlabel { font-size:11px; fill:#55606F; }
      .seqflow { stroke:#14213D; stroke-width:1.8; fill:none; marker-end:url(#arrBpmn); }
      .inforeq { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrDmn); }
      .couple { stroke:#E9A13B; stroke-width:2.5; fill:none; stroke-dasharray:7 5; marker-end:url(#arrAmber); }
      .coupletext { font-size:12px; fill:#B4791E; font-weight:700; font-style:italic; }
      .divider { stroke:#E3E0D8; stroke-width:1.5; }
    </style>
    <marker id="arrBpmn" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#14213D"/></marker>
    <marker id="arrDmn" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arrAmber" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#E9A13B"/></marker>
</defs>
<rect width="1000" height="780" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 06 · DMN-NOTATIE</text>
<text x="40" y="64" class="title">Figuur 6.5 — Koppelpunt: business rule task en DRD</text>
<text x="40" y="86" class="sub">Het BPMN-procesfragment van WI-114 roept de decision uit figuur 6.1 aan via een business rule task.</text>

<!-- BPMN section -->
<text x="40" y="114" class="kicker">BPMN — PROCESFRAGMENT (WI-114)</text>

<circle cx="90" cy="185" r="16" class="event"/>
<text x="90" y="216" text-anchor="middle" class="sub">Start</text>
<path d="M 106 185 L 158 185" class="seqflow"/>

<rect x="160" y="135" width="230" height="100" rx="8" class="task"/>
<rect x="174" y="147" width="24" height="18" fill="none" stroke="#14213D" stroke-width="1.2"/>
<line x1="186" y1="147" x2="186" y2="165" stroke="#14213D" stroke-width="1.2"/>
<line x1="174" y1="156" x2="198" y2="156" stroke="#14213D" stroke-width="1.2"/>
<text x="275" y="192" text-anchor="middle" class="label">Aanvraag waardeoverdracht</text>
<text x="275" y="210" text-anchor="middle" class="label">beoordelen</text>
<text x="275" y="227" text-anchor="middle" class="subitalic">Business rule task</text>

<path d="M 390 185 L 428 185" class="seqflow"/>

<polygon points="465,150 500,185 465,220 430,185" class="gateway"/>
<line x1="452" y1="172" x2="478" y2="198" stroke="#14213D" stroke-width="1.5"/>
<line x1="478" y1="172" x2="452" y2="198" stroke="#14213D" stroke-width="1.5"/>

<path d="M 500 178 C 560 140, 600 110, 634 97" class="seqflow"/>
<path d="M 500 185 L 634 185" class="seqflow"/>
<path d="M 500 192 C 560 230, 600 260, 634 273" class="seqflow"/>

<text x="560" y="128" text-anchor="middle" class="flowlabel">[Goedkeuren]</text>
<text x="560" y="176" text-anchor="middle" class="flowlabel">[Aanhouden]</text>
<text x="560" y="252" text-anchor="middle" class="flowlabel">[Afwijzen]</text>

<circle cx="650" cy="95" r="16" class="event"/>
<circle cx="650" cy="185" r="16" class="event"/>
<circle cx="650" cy="275" r="16" class="event"/>
<text x="674" y="90" class="sub">Goedgekeurd</text>
<text x="674" y="180" class="sub">Aangehouden</text>
<text x="674" y="270" class="sub">Afgewezen</text>
<text x="674" y="103" class="subitalic">(einde)</text>
<text x="674" y="193" class="subitalic">(einde)</text>
<text x="674" y="283" class="subitalic">(einde)</text>

<line x1="40" y1="360" x2="960" y2="360" class="divider"/>

<!-- DMN section -->
<text x="40" y="392" class="kicker">DRD — DEZELFDE DECISION ALS IN FIGUUR 6.1</text>

<rect x="370" y="420" width="260" height="76" class="decision"/>
<text x="500" y="452" text-anchor="middle" class="label">Aanvraag waardeoverdracht</text>
<text x="500" y="470" text-anchor="middle" class="label">beoordelen</text>
<text x="500" y="488" text-anchor="middle" class="sub">Decision</text>

<rect x="40" y="560" width="260" height="54" rx="27" class="inputdata"/>
<text x="170" y="583" text-anchor="middle" class="label-small">Actief</text>
<text x="170" y="599" text-anchor="middle" class="label-small">dienstverband</text>

<rect x="370" y="560" width="260" height="54" rx="27" class="inputdata"/>
<text x="500" y="583" text-anchor="middle" class="label-small">Overdrachtswaarde</text>
<text x="500" y="599" text-anchor="middle" class="label-small">t.o.v. afkoopgrens</text>

<rect x="700" y="560" width="260" height="54" rx="27" class="inputdata"/>
<text x="830" y="583" text-anchor="middle" class="label-small">Dekkingsgraad beide</text>
<text x="830" y="599" text-anchor="middle" class="label-small">fondsen ≥ 100%</text>

<path d="M 200 560 C 260 520, 380 500, 425 497" class="inforeq"/>
<path d="M 500 560 L 500 497" class="inforeq"/>
<path d="M 800 560 C 740 520, 620 500, 575 497" class="inforeq"/>

<!-- coupling arrow: business rule task -> decision -->
<path d="M 275 236 C 275 320, 400 340, 493 419" class="couple"/>
<text x="300" y="330" class="coupletext">koppelpunt: business rule task</text>
<text x="300" y="346" class="coupletext">roept decision aan</text>

<!-- legend -->
<rect x="40" y="670" width="920" height="90" fill="#EEF2F7" stroke="#E3E0D8" stroke-width="1"/>
<text x="58" y="692" class="kicker">LEGENDA</text>
<line x1="58" y1="712" x2="110" y2="712" class="seqflow"/>
<text x="120" y="716" class="sub">BPMN sequence flow (procesvolgorde)</text>
<line x1="58" y1="734" x2="110" y2="734" class="inforeq"/>
<text x="120" y="738" class="sub">DMN information requirement (input data → decision)</text>
<line x1="480" y1="712" x2="532" y2="712" class="couple"/>
<text x="542" y="716" class="sub">Koppelpunt: business rule task ↔ decision (geen standaard-pijltype)</text>
<text x="480" y="738" class="sub">Wijzigt de beslistabel, dan wijzigt dit BPMN-fragment niet — scheiding van zorgen (§1.2, §6.7).</text>
</svg>
