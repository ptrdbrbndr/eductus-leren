<text x="930" y="220" text-anchor="middle" class="celltext">nee</text>
<text x="1108" y="220" text-anchor="middle" class="celltext">Partnertoeslag</text>

<text x="770" y="254" text-anchor="middle" class="celltext">nee</text>
<text x="930" y="254" text-anchor="middle" class="celltext">ja</text>
<text x="1108" y="254" text-anchor="middle" class="celltext">Kindertoeslag</text>

<text x="770" y="288" text-anchor="middle" class="celltext" font-weight="700">nee</text>
<text x="930" y="288" text-anchor="middle" class="celltext" font-weight="700">nee</text>
<text x="1108" y="288" text-anchor="middle" class="celltext" font-weight="700">Geen toeslag</text>

<line x1="660" y1="130" x2="1203" y2="130" class="gridline"/>
<line x1="660" y1="164" x2="1203" y2="164" class="gridline"/>
