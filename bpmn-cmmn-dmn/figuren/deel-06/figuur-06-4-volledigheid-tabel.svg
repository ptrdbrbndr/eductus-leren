<line x1="1203" y1="130" x2="1203" y2="300" class="gridline"/>
<rect x="660" y="130" width="543" height="170" class="outerline"/>

<text x="660" y="336" class="sub">De toegevoegde regel (gemarkeerd) dekt het ontbrekende geval. Nu zijn alle vier combinaties</text>
<text x="660" y="354" class="sub">van de twee booleaanse inputs aanwezig — de tabel is volledig én, bij hit policy U, overlapvrij.</text>
</svg>
