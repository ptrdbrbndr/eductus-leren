<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 460" font-family="'DM Sans', Arial, sans-serif" width="1260" height="460" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .headerfill { fill:#CFE0F2; }
      .hitpolicyfill { fill:#E9A13B; }
      .rowfill1 { fill:#FFFFFF; }
      .rowfill2 { fill:#FBF6E9; }
      .fixfill { fill:#E9A13B; }
      .gridline { stroke:#14213D; stroke-width:1; }
      .outerline { stroke:#14213D; stroke-width:2; fill:none; }
      .ghostline { stroke:#E9A13B; stroke-width:2; stroke-dasharray:6 4; fill:none; }
      .headtext { font-size:13px; font-weight:700; fill:#14213D; }
      .celltext { font-size:13px; fill:#14213D; }
      .hittext { font-size:16px; font-weight:800; fill:#14213D; }
      .ghosttext { font-size:12.5px; font-weight:700; fill:#B4791E; font-style:italic; }
      .sub { font-size:12px; fill:#55606F; }
      .subtitle { font-size:14px; font-weight:700; fill:#14213D; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#E9A13B; stroke-width:2.5; fill:none; marker-end:url(#arr2); }
    </style>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#E9A13B"/></marker>
</defs>
<rect width="1260" height="460" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 06 · DMN-NOTATIE</text>
<text x="40" y="64" class="title">Figuur 6.4 — Volledigheid: ontbrekend geval en de correctie</text>
<text x="40" y="86" class="sub">Toeslagcategorie op basis van partnerregistratie en kinderen ten laste — twee booleaanse inputs, vier mogelijke combinaties.</text>

<!-- ===== LEFT: incomplete table ===== -->
<text x="50" y="118" class="subtitle">Onvolledig — mist het geval nee / nee</text>

<!-- header fills -->
<rect x="50" y="130" width="30" height="34" class="hitpolicyfill"/>
<rect x="80" y="130" width="160" height="34" class="headerfill"/>
<rect x="240" y="130" width="160" height="34" class="headerfill"/>
<rect x="403" y="130" width="190" height="34" class="headerfill"/>
<text x="65" y="152" text-anchor="middle" class="hittext">U</text>
<text x="160" y="146" text-anchor="middle" class="headtext">Partner</text>
<text x="160" y="161" text-anchor="middle" class="headtext">geregistreerd</text>
<text x="320" y="146" text-anchor="middle" class="headtext">Kinderen</text>
<text x="320" y="161" text-anchor="middle" class="headtext">ten laste</text>
<text x="498" y="152" text-anchor="middle" class="headtext">Toeslagcategorie</text>

<!-- data rows -->
<rect x="50" y="164" width="543" height="34" class="rowfill1"/>
<rect x="50" y="198" width="543" height="34" class="rowfill2"/>
<rect x="50" y="232" width="543" height="34" class="rowfill1"/>

<text x="160" y="186" text-anchor="middle" class="celltext">ja</text>
<text x="320" y="186" text-anchor="middle" class="celltext">ja</text>
<text x="498" y="186" text-anchor="middle" class="celltext">Gezinstoeslag</text>

<text x="160" y="220" text-anchor="middle" class="celltext">ja</text>
<text x="320" y="220" text-anchor="middle" class="celltext">nee</text>
<text x="498" y="220" text-anchor="middle" class="celltext">Partnertoeslag</text>

<text x="160" y="254" text-anchor="middle" class="celltext">nee</text>
<text x="320" y="254" text-anchor="middle" class="celltext">ja</text>
<text x="498" y="254" text-anchor="middle" class="celltext">Kindertoeslag</text>

<!-- ghost row: missing case -->
<rect x="52" y="268" width="539" height="34" fill="#FBF6E9"/>
<rect x="52" y="268" width="539" height="34" class="ghostline"/>
<text x="160" y="290" text-anchor="middle" class="ghosttext">nee</text>
<text x="320" y="290" text-anchor="middle" class="ghosttext">nee</text>
<text x="498" y="290" text-anchor="middle" class="ghosttext">? — ontbrekend geval</text>

<!-- grid lines -->
<line x1="50" y1="130" x2="593" y2="130" class="gridline"/>
<line x1="50" y1="164" x2="593" y2="164" class="gridline"/>
<line x1="50" y1="198" x2="593" y2="198" class="gridline"/>
<line x1="50" y1="232" x2="593" y2="232" class="gridline"/>
<line x1="50" y1="266" x2="593" y2="266" class="gridline"/>
<line x1="50" y1="130" x2="50" y2="266" class="gridline"/>
<line x1="80" y1="130" x2="80" y2="266" class="gridline"/>
<line x1="240" y1="130" x2="240" y2="266" class="gridline"/>
<line x1="400" y1="130" x2="400" y2="266" class="outerline"/>
<line x1="403" y1="130" x2="403" y2="266" class="gridline"/>
<line x1="593" y1="130" x2="593" y2="266" class="gridline"/>
<rect x="50" y="130" width="543" height="136" class="outerline"/>

<text x="50" y="336" class="sub">Drie booleaanse regels dekken slechts drie van de vier combinaties. Het geval "geen partner,</text>
<text x="50" y="354" class="sub">geen kinderen" loopt vast: geen enkele regel is van toepassing wanneer dit zich voordoet.</text>

<!-- coupling arrow -->
<path d="M 606 220 L 646 220" class="arrow"/>
<text x="626" y="205" text-anchor="middle" class="sub" font-size="11px">+ 1 regel</text>

<!-- ===== RIGHT: complete table ===== -->
<text x="660" y="118" class="subtitle">Volledig — alle vier combinaties gedekt</text>

