<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="'DM Sans', Arial, sans-serif" width="1000" height="420" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .headerfill { fill:#CFE0F2; }
      .hitpolicyfill { fill:#E9A13B; }
      .rowfill1 { fill:#FFFFFF; }
      .rowfill2 { fill:#FBF6E9; }
      .gridline { stroke:#14213D; stroke-width:1; }
      .outerline { stroke:#14213D; stroke-width:2; fill:none; }
      .doubleline { stroke:#14213D; stroke-width:1; }
      .headtext { font-size:13px; font-weight:700; fill:#14213D; }
      .celltext { font-size:13px; fill:#14213D; }
      .hittext { font-size:16px; font-weight:800; fill:#14213D; }
      .sub { font-size:12px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    </style>
</defs>
<rect width="1000" height="420" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 06 · DMN-NOTATIE</text>
<text x="40" y="64" class="title">Figuur 6.2 — Beslistabel bij §6.3, met hit policy</text>
<text x="40" y="86" class="sub">Aanvraag waardeoverdracht — drie inputkolommen, één outputkolom, hit policy Unique (U)</text>

<!-- Table geometry: x0=60,y0=110; col widths: HP 56, in1 190, in2 240, in3 240, out 214 -->
<!-- rows: header 50, 4 data rows x 44 -->

<!-- header fills -->
<rect x="60" y="110" width="56" height="50" class="hitpolicyfill"/>
<rect x="116" y="110" width="190" height="50" class="headerfill"/>
<rect x="306" y="110" width="240" height="50" class="headerfill"/>
<rect x="546" y="110" width="240" height="50" class="headerfill"/>
<rect x="786" y="110" width="214" height="50" class="headerfill"/>

<!-- alternating row fills -->
<rect x="60" y="160" width="940" height="44" class="rowfill1"/>
<rect x="60" y="204" width="940" height="44" class="rowfill2"/>
<rect x="60" y="248" width="940" height="44" class="rowfill1"/>
<rect x="60" y="292" width="940" height="44" class="rowfill2"/>

<!-- hit policy code -->
<text x="88" y="140" text-anchor="middle" class="hittext">U</text>

<!-- header texts -->
<text x="211" y="132" text-anchor="middle" class="headtext">Actief</text>
<text x="211" y="148" text-anchor="middle" class="headtext">dienstverband</text>

<text x="426" y="132" text-anchor="middle" class="headtext">Overdrachtswaarde</text>
<text x="426" y="148" text-anchor="middle" class="headtext">boven afkoopgrens</text>

<text x="666" y="132" text-anchor="middle" class="headtext">Dekkingsgraad beide</text>
<text x="666" y="148" text-anchor="middle" class="headtext">fondsen ≥ 100%</text>

<text x="893" y="140" text-anchor="middle" class="headtext">Uitkomst</text>

<!-- data rows -->
<!-- row1 -->
<text x="211" y="187" text-anchor="middle" class="celltext">ja</text>
<text x="426" y="187" text-anchor="middle" class="celltext">ja</text>
<text x="666" y="187" text-anchor="middle" class="celltext">ja</text>
<text x="893" y="187" text-anchor="middle" class="celltext">Goedkeuren</text>

<!-- row2 -->
<text x="211" y="231" text-anchor="middle" class="celltext">ja</text>
<text x="426" y="231" text-anchor="middle" class="celltext">ja</text>
<text x="666" y="231" text-anchor="middle" class="celltext">nee</text>
<text x="893" y="231" text-anchor="middle" class="celltext">Aanhouden</text>

<!-- row3 -->
<text x="211" y="275" text-anchor="middle" class="celltext">ja</text>
<text x="426" y="275" text-anchor="middle" class="celltext">nee</text>
<text x="666" y="275" text-anchor="middle" class="celltext">—</text>
<text x="893" y="275" text-anchor="middle" class="celltext">Afwijzen</text>

<!-- row4 -->
<text x="211" y="319" text-anchor="middle" class="celltext">nee</text>
<text x="426" y="319" text-anchor="middle" class="celltext">—</text>
<text x="666" y="319" text-anchor="middle" class="celltext">—</text>
<text x="893" y="319" text-anchor="middle" class="celltext">Afwijzen (na nader</text>
<text x="893" y="333" text-anchor="middle" class="celltext" font-size="11px">onderzoek)</text>

<!-- grid lines: horizontal -->
<line x1="60" y1="110" x2="1000" y2="110" class="gridline"/>
<line x1="60" y1="160" x2="1000" y2="160" class="gridline"/>
<line x1="60" y1="204" x2="1000" y2="204" class="gridline"/>
<line x1="60" y1="248" x2="1000" y2="248" class="gridline"/>
<line x1="60" y1="292" x2="1000" y2="292" class="gridline"/>
<line x1="60" y1="336" x2="1000" y2="336" class="gridline"/>

<!-- grid lines: vertical -->
<line x1="60" y1="110" x2="60" y2="336" class="gridline"/>
<line x1="116" y1="110" x2="116" y2="336" class="gridline"/>
<line x1="306" y1="110" x2="306" y2="336" class="gridline"/>
<line x1="546" y1="110" x2="546" y2="336" class="gridline"/>
<!-- double line between input and output -->
<line x1="782" y1="110" x2="782" y2="336" class="doubleline"/>
<line x1="786" y1="110" x2="786" y2="336" class="gridline"/>
<line x1="1000" y1="110" x2="1000" y2="336" class="gridline"/>

<!-- outer border -->
<rect x="60" y="110" width="940" height="226" class="outerline"/>

<text x="60" y="368" class="sub">Hit policy: Unique (U) — de vier regels dekken samen alle acht mogelijke combinaties van de drie booleaanse inputs,</text>
<text x="60" y="386" class="sub">zonder dat twee regels ooit tegelijk waar kunnen zijn. Een lege cel (—) betekent "niet van toepassing", niet "onbekend".</text>
</svg>
