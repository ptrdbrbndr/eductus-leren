<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 700" font-family="'DM Sans', Arial, sans-serif" width="1160" height="700" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .axis { stroke:#14213D; stroke-width:1.6; fill:none; marker-end:url(#axisarr); }
    .point { fill:#2563A8; stroke:#14213D; stroke-width:1.3; }
    .ptlabel { font-size:13.5px; font-weight:700; fill:#14213D; }
    .axislabel { font-size:12.5px; font-weight:700; fill:#14213D; letter-spacing:.06em; }
    .axissub { font-size:11px; fill:#55606F; }
    .callout { fill:#FBF6E9; stroke:#E9A13B; stroke-width:1.6; }
    .callout-title { font-size:12.5px; font-weight:700; fill:#14213D; }
    .callout-kicker { font-size:9.5px; font-weight:700; fill:#E9A13B; letter-spacing:.08em; }
    .callout-text { font-size:11.5px; fill:#55606F; }
    .leader { stroke:#E9A13B; stroke-width:1.3; fill:none; stroke-dasharray:3 3; }
    .label { font-size:14px; font-weight:700; fill:#14213D; }
    .sub { font-size:12px; fill:#55606F; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    .colhead { font-size:11px; font-weight:700; fill:#55606F; letter-spacing:.1em; }
    .quadgrid { stroke:#E3E0D8; stroke-width:1; stroke-dasharray:2 4; }
  </style>
  <marker id="axisarr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#14213D"/></marker>
</defs>
<rect width="1160" height="700" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 12 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Figuur 12.1 — Vijf discovery-technieken: diepte versus breedte</text>
<text x="40" y="86" class="sub">Elke techniek heeft een eigen blinde vlek — daarom worden ze in combinatie ingezet (§12.2).</text>

<!-- quadrant midlines -->
<line x1="450" y1="110" x2="450" y2="560" class="quadgrid"/>
<line x1="140" y1="335" x2="785" y2="335" class="quadgrid"/>

<!-- axes -->
<line x1="140" y1="560" x2="140" y2="95" class="axis"/>
<line x1="140" y1="560" x2="785" y2="560" class="axis"/>

<!-- axis titles -->
<text x="35" y="335" class="axislabel" text-anchor="middle" transform="rotate(-90 35 335)">DIEPTE</text>
<text x="460" y="614" class="axislabel" text-anchor="middle">BREEDTE</text>

<!-- axis end labels -->
<text x="60" y="118" class="axissub">diepgaand</text>
<text x="60" y="552" class="axissub">oppervlakkig</text>
<text x="145" y="580" class="axissub">smal / één rol</text>
<text x="782" y="580" class="axissub" text-anchor="end">breed / hele organisatie</text>

<!-- data points -->
<circle cx="586" cy="313" r="8" class="point"/>
<text x="598" y="309" class="ptlabel">Workshops</text>

<circle cx="239" cy="178" r="8" class="point"/>
<text x="251" y="174" class="ptlabel">Interviews</text>

<circle cx="301" cy="236" r="8" class="point"/>
<text x="313" y="257" class="ptlabel">Observatie</text>

<circle cx="686" cy="488" r="8" class="point"/>
<text x="698" y="484" class="ptlabel">Documentanalyse</text>

<circle cx="648" cy="398" r="8" class="point"/>
<text x="530" y="416" class="ptlabel">Systeemanalyse</text>

<!-- leaders -->
<path d="M594,309 Q700,240 806,145" class="leader"/>
<path d="M247,178 Q540,150 806,223" class="leader"/>
<path d="M309,236 Q560,262 806,301" class="leader"/>
<path d="M694,488 Q760,430 806,379" class="leader"/>
<path d="M656,398 Q745,422 806,457" class="leader"/>

<!-- callout column -->
<text x="810" y="90" class="colhead">BLINDE VLEK PER TECHNIEK</text>

<rect x="810" y="112" width="320" height="66" rx="6" class="callout"/>
<text x="826" y="132" class="callout-kicker">WORKSHOPS</text>
<text x="826" y="150" class="callout-text">blinde vlek: mening van de</text>
<text x="826" y="165" class="callout-text">luidste stem</text>

<rect x="810" y="190" width="320" height="66" rx="6" class="callout"/>
<text x="826" y="210" class="callout-kicker">INTERVIEWS</text>
<text x="826" y="228" class="callout-text">blinde vlek: tegenstrijdige</text>
<text x="826" y="243" class="callout-text">verhalen tussen rollen</text>

<rect x="810" y="268" width="320" height="66" rx="6" class="callout"/>
<text x="826" y="288" class="callout-kicker">OBSERVATIE</text>
<text x="826" y="306" class="callout-text">blinde vlek: toont alleen de</text>
<text x="826" y="321" class="callout-text">geobserveerde periode</text>

<rect x="810" y="346" width="320" height="66" rx="6" class="callout"/>
<text x="826" y="366" class="callout-kicker">DOCUMENTANALYSE</text>
<text x="826" y="384" class="callout-text">blinde vlek: toont het bedoelde</text>
<text x="826" y="399" class="callout-text">proces, niet het uitgevoerde</text>

<rect x="810" y="424" width="320" height="66" rx="6" class="callout"/>
<text x="826" y="444" class="callout-kicker">SYSTEEMANALYSE</text>
<text x="826" y="462" class="callout-text">blinde vlek: toont wat het systeem</text>
<text x="826" y="477" class="callout-text">toestaat, niet wat mensen doen</text>

<text x="810" y="524" class="sub" style="font-style:italic">Vijf technieken, vijf verschillende blinde vlekken — vandaar de</text>
<text x="810" y="540" class="sub" style="font-style:italic">triangulatie in §12.2: geen enkele techniek volstaat alleen.</text>

</svg>
