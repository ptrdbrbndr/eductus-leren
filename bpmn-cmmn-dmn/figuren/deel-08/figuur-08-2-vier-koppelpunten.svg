<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'DM Sans', Arial, sans-serif" width="960" height="640" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .bpmn-shape { fill:#CFE0F2; stroke:#2563A8; stroke-width:2; }
      .cmmn-shape { fill:#FBF6E9; stroke:#E9A13B; stroke-width:2; }
      .dmn-shape { fill:#EEF2F7; stroke:#14213D; stroke-width:2; }
      .taalabel { font-size:18px; font-weight:700; fill:#14213D; font-family:'Cormorant Garamond', Georgia, serif; }
      .label { font-size:13px; font-weight:700; fill:#14213D; }
      .num { font-size:12px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:11.5px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#14213D; stroke-width:1.8; fill:none; marker-end:url(#arr); }
      .arrow-dashed { stroke:#55606F; stroke-width:1.6; fill:none; marker-end:url(#arrgrey); stroke-dasharray:5 3; }
      .badge { fill:#E9A13B; stroke:#14213D; stroke-width:1.2; }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#14213D"/></marker>
    <marker id="arrgrey" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
</defs>
<rect width="960" height="640" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 08 · KOPPELPUNTEN</text>
<text x="40" y="64" class="title">Figuur 8.2 — De vier koppelpunten tussen de talen</text>

<!-- BPMN symbol: top left -->
<rect x="110" y="140" width="150" height="90" rx="16" class="bpmn-shape"/>
<text x="185" y="180" text-anchor="middle" class="taalabel">BPMN</text>
<text x="185" y="200" text-anchor="middle" class="sub">proces</text>

<!-- CMMN symbol: top right -->
<g>
  <path d="M700,140 h60 l14,14 h76 v76 h-150 z" class="cmmn-shape"/>
  <text x="775" y="188" text-anchor="middle" class="taalabel">CMMN</text>
  <text x="775" y="208" text-anchor="middle" class="sub">casemodel</text>
</g>

<!-- DMN symbol: bottom center -->
<rect x="380" y="420" width="200" height="70" class="dmn-shape"/>
<text x="480" y="450" text-anchor="middle" class="taalabel">DMN</text>
<text x="480" y="470" text-anchor="middle" class="sub">decision</text>

<!-- Koppelpunt 1: BPMN -> DMN (business rule task) -->
<path d="M235,230 C260,320 380,400 420,430" class="arrow"/>
<circle cx="300" cy="330" r="15" class="badge"/>
<text x="300" y="334" text-anchor="middle" class="num">1</text>
<text x="235" y="300" class="label">business rule task</text>
<text x="235" y="317" class="sub">(BPMN → DMN)</text>

<!-- Koppelpunt 2: CMMN -> CMMN self loop (case task) -->
<path d="M860,150 C930,120 930,220 862,222" class="arrow"/>
<circle cx="905" cy="185" r="15" class="badge"/>
<text x="905" y="189" text-anchor="middle" class="num">2</text>
<text x="795" y="120" class="label">case task</text>
<text x="795" y="137" class="sub">(CMMN → CMMN,</text>
<text x="795" y="152" class="sub">deeldossier)</text>

<!-- Koppelpunt 3: CMMN -> BPMN (process task) -->
<path d="M700,195 C500,195 400,195 262,190" class="arrow"/>
<circle cx="480" cy="195" r="15" class="badge"/>
<text x="480" y="199" text-anchor="middle" class="num">3</text>
<text x="440" y="235" class="label">process task</text>
<text x="440" y="252" class="sub">(CMMN → BPMN)</text>

<!-- Koppelpunt 4: BPMN -> BPMN self loop (call activity), dashed alt to CMMN -->
<path d="M110,175 C40,150 40,240 108,222" class="arrow"/>
<circle cx="60" cy="185" r="15" class="badge"/>
<text x="60" y="189" text-anchor="middle" class="num">4</text>
<text x="18" y="120" class="label">call activity</text>
<text x="18" y="137" class="sub">(BPMN → BPMN,</text>
<text x="18" y="152" class="sub">herbruikbaar subproces)</text>

<path d="M185,230 C280,320 500,300 700,205" class="arrow-dashed"/>
<text x="330" y="290" class="sub" style="font-style:italic">call activity → CMMN, indien de tooling</text>
<text x="330" y="306" class="sub" style="font-style:italic">een verwijzing naar een case toestaat</text>

<!-- legend box -->
<rect x="640" y="530" width="290" height="90" rx="4" fill="#FFFFFF" stroke="#E3E0D8" stroke-width="1.2"/>
<text x="656" y="552" class="label" style="font-size:12px">Meest voorkomende patroon</text>
<text x="656" y="570" class="sub">Case met process tasks voor gestructureerde</text>
<text x="656" y="585" class="sub">delen, discretionary items voor het</text>
<text x="656" y="600" class="sub">ongestructureerde deel — sommige daarvan</text>
<text x="656" y="615" class="sub">bevatten zelf weer een business rule task.</text>

</svg>
