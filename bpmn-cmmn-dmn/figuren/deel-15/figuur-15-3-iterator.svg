<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" font-family="'DM Sans', Arial, sans-serif" width="1040" height="560" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .stagehead { font-size:11px; font-weight:700; fill:#2563A8; letter-spacing:.08em; }
    .ctxbox { fill:#CFE0F2; stroke:#14213D; stroke-width:1.4; }
    .ctxname { font-size:12.5px; font-weight:700; fill:#14213D; }
    .ctxsub { font-size:11px; fill:#55606F; }
    .codebox { fill:#EEF2F7; stroke:#14213D; stroke-width:1.3; }
    .code { font-family:'DM Sans', monospace; font-size:12px; fill:#14213D; }
    .listbox { fill:#FFFFFF; stroke:#14213D; stroke-width:1.4; }
    .listtxt { font-size:14px; font-weight:700; fill:#14213D; }
    .resultbox { fill:#E9A13B; stroke:#14213D; stroke-width:1.6; }
    .resulttxt { font-size:16px; font-weight:700; fill:#14213D; }
    .flow { stroke:#55606F; stroke-width:1.8; fill:none; marker-end:url(#flowarr); }
    .label { font-size:14px; font-weight:700; fill:#14213D; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    .sub { font-size:12px; fill:#55606F; }
    .note { font-size:10.5px; fill:#55606F; }
  </style>
  <marker id="flowarr" markerWidth="11" markerHeight="11" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#55606F"/></marker>
</defs>
<rect width="1040" height="560" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 15 · FEEL ITERATOR (NOTATIE-CORRECT)</text>
<text x="40" y="64" class="title">Figuur 15.3 — Iterator: lijst dienstverbanden in, totaal opbouwjaren uit</text>
<text x="40" y="86" class="sub">sum(for d in dienstverbanden return d.jaren) — een deelnemer met meerdere dienstverbanden (§15.4).</text>

<!-- Stage 1: list in -->
<text x="40" y="128" class="stagehead">1. LIJST IN — DIENSTVERBANDEN</text>
<rect x="40" y="142" width="230" height="60" class="ctxbox" rx="4"/>
<text x="56" y="164" class="ctxname">Dienstverband 1</text>
<text x="56" y="182" class="ctxsub">2005–2010 · jaren: 5</text>

<rect x="40" y="212" width="230" height="60" class="ctxbox" rx="4"/>
<text x="56" y="234" class="ctxname">Dienstverband 2</text>
<text x="56" y="252" class="ctxsub">2011–2023 · jaren: 12</text>

<rect x="40" y="282" width="230" height="60" class="ctxbox" rx="4"/>
<text x="56" y="304" class="ctxname">Dienstverband 3</text>
<text x="56" y="322" class="ctxsub">2023–2026 · jaren: 3</text>

<text x="40" y="372" class="note">FEEL-lijst van contexts:</text>
<text x="40" y="388" class="note">[{jaren:5}, {jaren:12}, {jaren:3}]</text>

<!-- flow arrow 1 -->
<path d="M280,232 H360" class="flow"/>

<!-- Stage 2: iterator -->
<text x="360" y="128" class="stagehead">2. ITERATOR (FOR)</text>
<rect x="360" y="180" width="260" height="80" class="codebox" rx="4"/>
<text x="378" y="212" class="code">for d in dienstverbanden</text>
<text x="378" y="232" class="code">return d.jaren</text>
<text x="378" y="252" class="code" style="fill:#55606F; font-size:10.5px">transformeert lijst → lijst</text>

<rect x="360" y="290" width="260" height="52" class="listbox" rx="4"/>
<text x="490" y="323" text-anchor="middle" class="listtxt">[ 5, 12, 3 ]</text>
<text x="490" y="368" text-anchor="middle" class="note">tussenresultaat: lijst met jarentotalen</text>
<text x="490" y="384" text-anchor="middle" class="note">per dienstverband</text>

<!-- flow arrow 2 -->
<path d="M620,316 H700" class="flow"/>

<!-- Stage 3: aggregatie -->
<text x="700" y="128" class="stagehead">3. AGGREGATIE (SUM)</text>
<rect x="700" y="180" width="270" height="60" class="codebox" rx="4"/>
<text x="716" y="212" class="code">sum(for d in dienstverbanden</text>
<text x="716" y="228" class="code" style="font-size:11px">&#160;&#160;&#160;&#160;return d.jaren)</text>

<rect x="700" y="270" width="270" height="90" class="resultbox" rx="4"/>
<text x="835" y="308" text-anchor="middle" class="resulttxt">Totaal opbouwjaren</text>
<text x="835" y="340" text-anchor="middle" class="resulttxt" style="font-size:24px">= 20</text>

<text x="700" y="392" class="note">Eén getal — de lijst wordt herleid tot</text>
<text x="700" y="408" class="note">één aggregaatwaarde. Deze waarde is</text>
<text x="700" y="424" class="note">zelf weer input voor een volgende decision.</text>
</svg>
