<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" font-family="'DM Sans', Arial, sans-serif" width="1080" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .th { fill:#2563A8; }
    .thtxt { font-size:12.5px; font-weight:700; fill:#FBFAF7; text-anchor:middle; }
    .cell { fill:#FFFFFF; stroke:#E3E0D8; stroke-width:1; }
    .cellalt { fill:#EEF2F7; stroke:#E3E0D8; stroke-width:1; }
    .celltxt { font-size:11.5px; fill:#14213D; text-anchor:middle; }
    .mcell { fill:#FFFFFF; stroke:#E3E0D8; stroke-width:1; }
    .mcellalt { fill:#EEF2F7; stroke:#E3E0D8; stroke-width:1; }
    .mgap { fill:#FCE9C9; stroke:#E9A13B; stroke-width:1.6; }
    .mgaphead { fill:#E9A13B; }
    .check { fill:#2563A8; }
    .checktxt { font-size:14px; font-weight:700; fill:#FBFAF7; text-anchor:middle; }
    .label { font-size:14px; font-weight:700; fill:#14213D; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    .sub { font-size:12px; fill:#55606F; }
    .note { font-size:11.5px; fill:#55606F; }
    .callout { fill:#FFFFFF; stroke:#E9A13B; stroke-width:1.4; }
    .calltitle { font-size:12.5px; font-weight:700; fill:#B5761F; }
    .calltxt { font-size:11px; fill:#14213D; }
    .summarybox { fill:#CFE0F2; stroke:#14213D; stroke-width:1.3; }
    .summarytxt { font-size:14px; font-weight:700; fill:#14213D; }
  </style>
</defs>
<rect width="1080" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 15 · TESTEN (DEKKINGSMATRIX)</text>
<text x="40" y="64" class="title">Figuur 15.5 — Testset met dekkingsmatrix</text>
<text x="40" y="86" class="sub">Testgevallen tegen de tabel "Kortingspercentage vervroeging" uit Figuur 15.4 — welke regel wordt door welk testgeval geraakt? (§15.7)</text>

<!-- Left: testcase table -->
<rect x="40" y="150" width="60" height="40" class="th"/><text x="70" y="175" class="thtxt">TC</text>
<rect x="100" y="150" width="90" height="40" class="th"/><text x="145" y="175" class="thtxt">Leeftijd</text>
<rect x="190" y="150" width="90" height="40" class="th"/><text x="235" y="170" class="thtxt">Partner-</text><text x="235" y="184" class="thtxt" style="font-size:10px">pensioen</text>
<rect x="280" y="150" width="100" height="40" class="th"/><text x="330" y="175" class="thtxt">Verwacht</text>

<!-- Matrix header -->
<rect x="420" y="150" width="90" height="40" class="th"/><text x="465" y="175" class="thtxt">R1</text>
<rect x="510" y="150" width="90" height="40" class="th"/><text x="555" y="175" class="thtxt">R2</text>
<rect x="600" y="150" width="90" height="40" class="th"/><text x="645" y="175" class="thtxt">R3</text>
<rect x="690" y="150" width="90" height="40" class="mgaphead"/><text x="735" y="175" class="thtxt">R4</text>
<rect x="780" y="150" width="90" height="40" class="th"/><text x="825" y="175" class="thtxt">R5</text>

<!-- Row generator: 6 rows, y starts 190, height 40 -->
<!-- TC1 -->
<rect x="40" y="190" width="60" height="40" class="cell"/><text x="70" y="215" class="celltxt">TC1</text>
<rect x="100" y="190" width="90" height="40" class="cell"/><text x="145" y="215" class="celltxt">70</text>
<rect x="190" y="190" width="90" height="40" class="cell"/><text x="235" y="215" class="celltxt">nee</text>
<rect x="280" y="190" width="100" height="40" class="cell"/><text x="330" y="215" class="celltxt">3%</text>
<rect x="420" y="190" width="90" height="40" class="mcell"/><circle cx="465" cy="210" r="13" class="check"/><text x="465" y="215" class="checktxt">&#10003;</text>
<rect x="510" y="190" width="90" height="40" class="mcell"/>
<rect x="600" y="190" width="90" height="40" class="mcell"/>
<rect x="690" y="190" width="90" height="40" class="mgap"/>
<rect x="780" y="190" width="90" height="40" class="mcell"/>

<!-- TC2 -->
<rect x="40" y="230" width="60" height="40" class="cellalt"/><text x="70" y="255" class="celltxt">TC2</text>
<rect x="100" y="230" width="90" height="40" class="cellalt"/><text x="145" y="255" class="celltxt">65 (grens)</text>
<rect x="190" y="230" width="90" height="40" class="cellalt"/><text x="235" y="255" class="celltxt">nee</text>
<rect x="280" y="230" width="100" height="40" class="cellalt"/><text x="330" y="255" class="celltxt">3%</text>
<rect x="420" y="230" width="90" height="40" class="mcellalt"/>
<rect x="510" y="230" width="90" height="40" class="mcellalt"/><circle cx="555" cy="250" r="13" class="check"/><text x="555" y="255" class="checktxt">&#10003;</text>
<rect x="600" y="230" width="90" height="40" class="mcellalt"/>
<rect x="690" y="230" width="90" height="40" class="mgap"/>
<rect x="780" y="230" width="90" height="40" class="mcellalt"/>

<!-- TC3 -->
<rect x="40" y="270" width="60" height="40" class="cell"/><text x="70" y="295" class="celltxt">TC3</text>
<rect x="100" y="270" width="90" height="40" class="cell"/><text x="145" y="295" class="celltxt">55</text>
<rect x="190" y="270" width="90" height="40" class="cell"/><text x="235" y="295" class="celltxt">nee</text>
<rect x="280" y="270" width="100" height="40" class="cell"/><text x="330" y="295" class="celltxt">6%</text>
<rect x="420" y="270" width="90" height="40" class="mcell"/>
<rect x="510" y="270" width="90" height="40" class="mcell"/>
<rect x="600" y="270" width="90" height="40" class="mcell"/><circle cx="645" cy="290" r="13" class="check"/><text x="645" y="295" class="checktxt">&#10003;</text>
<rect x="690" y="270" width="90" height="40" class="mgap"/>
<rect x="780" y="270" width="90" height="40" class="mcell"/>

<!-- TC4 -->
<rect x="40" y="310" width="60" height="40" class="cellalt"/><text x="70" y="335" class="celltxt">TC4</text>
<rect x="100" y="310" width="90" height="40" class="cellalt"/><text x="145" y="335" class="celltxt">71</text>
<rect x="190" y="310" width="90" height="40" class="cellalt"/><text x="235" y="335" class="celltxt">ja</text>
<rect x="280" y="310" width="100" height="40" class="cellalt"/><text x="330" y="335" class="celltxt">3%</text>
<rect x="420" y="310" width="90" height="40" class="mcellalt"/><circle cx="465" cy="330" r="13" class="check"/><text x="465" y="335" class="checktxt">&#10003;</text>
<rect x="510" y="310" width="90" height="40" class="mcellalt"/>
<rect x="600" y="310" width="90" height="40" class="mcellalt"/>
<rect x="690" y="310" width="90" height="40" class="mgap"/>
<rect x="780" y="310" width="90" height="40" class="mcellalt"/>

<!-- TC5 -->
<rect x="40" y="350" width="60" height="40" class="cell"/><text x="70" y="375" class="celltxt">TC5</text>
<rect x="100" y="350" width="90" height="40" class="cell"/><text x="145" y="375" class="celltxt">45</text>
<rect x="190" y="350" width="90" height="40" class="cell"/><text x="235" y="375" class="celltxt">nee</text>
<rect x="280" y="350" width="100" height="40" class="cell"/><text x="330" y="375" class="celltxt">7%</text>
<rect x="420" y="350" width="90" height="40" class="mcell"/>
<rect x="510" y="350" width="90" height="40" class="mcell"/>
<rect x="600" y="350" width="90" height="40" class="mcell"/>
<rect x="690" y="350" width="90" height="40" class="mgap"/>
<rect x="780" y="350" width="90" height="40" class="mcell"/><circle cx="825" cy="370" r="13" class="check"/><text x="825" y="375" class="checktxt">&#10003;</text>

<!-- TC6 -->
<rect x="40" y="390" width="60" height="40" class="cellalt"/><text x="70" y="415" class="celltxt">TC6</text>
<rect x="100" y="390" width="90" height="40" class="cellalt"/><text x="145" y="415" class="celltxt">60 (grens)</text>
<rect x="190" y="390" width="90" height="40" class="cellalt"/><text x="235" y="415" class="celltxt">nee</text>
<rect x="280" y="390" width="100" height="40" class="cellalt"/><text x="330" y="415" class="celltxt">3%</text>
<rect x="420" y="390" width="90" height="40" class="mcellalt"/>
<rect x="510" y="390" width="90" height="40" class="mcellalt"/><circle cx="555" cy="410" r="13" class="check"/><text x="555" y="415" class="checktxt">&#10003;</text>
<rect x="600" y="390" width="90" height="40" class="mcellalt"/>
<rect x="690" y="390" width="90" height="40" class="mgap"/>
<rect x="780" y="390" width="90" height="40" class="mcellalt"/>

<!-- outer border -->
<rect x="40" y="150" width="830" height="280" fill="none" stroke="#14213D" stroke-width="1.6"/>
<line x1="420" y1="150" x2="420" y2="430" stroke="#14213D" stroke-width="1.6"/>

<!-- Gap callout -->
<rect x="900" y="230" width="150" height="130" class="callout" rx="4"/>
<text x="914" y="252" class="calltitle">Regel 4 = gat</text>
<text x="914" y="270" class="calltxt">Geen testgeval raakt</text>
<text x="914" y="285" class="calltxt">regel 4 — consistent</text>
<text x="914" y="300" class="calltxt">met de bevinding uit</text>
<text x="914" y="315" class="calltxt">Figuur 15.4 dat regel 4</text>
<text x="914" y="330" class="calltxt">onbereikbaar is.</text>
<path d="M900,280 H870" class="calltxt" stroke="#E9A13B" stroke-width="1.4" fill="none" stroke-dasharray="3 2"/>

<!-- Summary -->
<rect x="40" y="450" width="830" height="60" class="summarybox" rx="4"/>
<text x="60" y="486" class="summarytxt">Dekkingsgraad: 4 van de 5 regels geraakt = 80% — regel 4 blijft ongevalideerd door de testset.</text>

<text x="40" y="540" class="note">TC2 en TC6 testen bewust de grenswaarden (leeftijd 65 en 60) tussen regel 1/2 en regel 2/3 — de plek waar</text>
<text x="40" y="558" class="note">een tabelfout zich het eerst zou tonen. TC4 bevestigt dat regel 1 óók bij partnerpensioen = ja als eerste vuurt.</text>
</svg>
