<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="'DM Sans', Arial, sans-serif" width="960" height="660" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .panel { fill:#FFFFFF; stroke:#E3E0D8; stroke-width:1.5; }
      .quadA { fill:#FBF6E9; }
      .quadB { fill:#EEF2F7; }
      .quadC { fill:#FFFFFF; }
      .quadD { fill:#EEF2F7; }
      .axis { stroke:#14213D; stroke-width:1.6; }
      .midline { stroke:#E3E0D8; stroke-width:1.4; stroke-dasharray:5 3; }
      .quadlabel { font-size:13px; font-weight:700; fill:#14213D; }
      .quadsub { font-size:10.5px; fill:#55606F; }
      .axislabel { font-size:11.5px; font-weight:700; fill:#55606F; letter-spacing:.05em; }
      .dot { stroke:#14213D; stroke-width:1.6; }
      .dotdirectie { fill:#2563A8; }
      .dotdnb { fill:#14213D; }
      .dotafm { fill:#6FA3D6; }
      .dotdeeln { fill:#E9A13B; }
      .dotit { fill:#FFFFFF; stroke:#55606F; stroke-dasharray:3 2; }
      .stlabel { font-size:12px; font-weight:700; fill:#14213D; }
      .stsub { font-size:10px; fill:#55606F; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .sub { font-size:12.5px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .callout { fill:#EEF2F7; stroke:#14213D; stroke-width:1.2; }
      .calltext { font-size:12px; fill:#14213D; }
</style>
</defs>
<rect width="960" height="660" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 29 · MATRIX</text>
<text x="40" y="64" class="title">Figuur 29.3 — Prioriteringsmatrix onder tijdsdruk</text>
<text x="40" y="84" class="sub">Macht/invloed op de uitkomst (horizontaal) tegen belang bij wat er wijkt (verticaal) — casusdossier §9.</text>

<!-- panel -->
<rect x="40" y="102" width="890" height="480" class="panel" rx="4"/>

<!-- quadrant fills -->
<rect x="230" y="120" width="315" height="235" class="quadA"/>
<rect x="545" y="120" width="315" height="235" class="quadA"/>
<rect x="230" y="355" width="315" height="215" class="quadC"/>
<rect x="545" y="355" width="315" height="215" class="quadB"/>

<!-- axes -->
<line x1="230" y1="120" x2="230" y2="570" class="axis"/>
<line x1="230" y1="570" x2="860" y2="570" class="axis"/>
<line x1="545" y1="120" x2="545" y2="570" class="midline"/>
<line x1="230" y1="355" x2="860" y2="355" class="midline"/>

<!-- axis labels -->
<text x="545" y="596" text-anchor="middle" class="axislabel">MACHT / INVLOED OP DE UITKOMST →</text>
<text x="245" y="592" class="axislabel">laag</text>
<text x="845" y="592" text-anchor="end" class="axislabel">hoog</text>
<text x="80" y="345" text-anchor="middle" class="axislabel" transform="rotate(-90 80 345)">BELANG BIJ WAT ER WIJKT →</text>

<!-- quadrant titles -->
<text x="250" y="145" class="quadlabel">Nauw betrekken, informeren</text>
<text x="250" y="160" class="quadsub">hoog belang, beperkte macht</text>

<text x="565" y="145" class="quadlabel">Sleutelspelers — actief managen</text>
<text x="565" y="160" class="quadsub">hoog belang én hoge macht</text>

<text x="250" y="380" class="quadlabel">Weinig prioriteit nu</text>
<text x="250" y="395" class="quadsub">laag belang, beperkte macht</text>

<text x="565" y="380" class="quadlabel">Tevreden houden</text>
<text x="565" y="395" class="quadsub">hoge macht, laag belang (nu)</text>

<!-- stakeholder dots -->
<!-- Directie/bestuur -->
<circle cx="775" cy="195" r="15" class="dot dotdirectie"/>
<text x="795" y="190" class="stlabel">Directie / bestuur</text>
<text x="795" y="204" class="stsub">wil de termijn halen</text>

<!-- DNB -->
<circle cx="720" cy="165" r="15" class="dot dotdnb"/>
<text x="640" y="150" text-anchor="end" class="stlabel">DNB</text>
<text x="640" y="164" text-anchor="end" class="stsub">wil datakwaliteit niet laten wijken</text>

<!-- AFM -->
<circle cx="680" cy="235" r="15" class="dot dotafm"/>
<text x="600" y="253" text-anchor="end" class="stlabel">AFM</text>
<text x="600" y="267" text-anchor="end" class="stsub">wil communicatiezorgvuldigheid</text>
<text x="600" y="280" text-anchor="end" class="stsub">niet laten wijken</text>

<!-- Deelnemersvertegenwoordiging -->
<circle cx="340" cy="220" r="15" class="dot dotdeeln"/>
<text x="360" y="215" class="stlabel">Deelnemersvertegen-</text>
<text x="360" y="229" class="stlabel">woordiging</text>
<text x="360" y="243" class="stsub">hoorrecht (art. 150g Pw),</text>
<text x="360" y="256" class="stsub">geen vetorecht</text>

<!-- IT -->
<circle cx="565" cy="315" r="14" class="dot dotit"/>
<text x="585" y="311" class="stlabel">IT (vijfde stem)</text>
<text x="585" y="325" class="stsub">geen wettelijke basis, wel</text>
<text x="585" y="338" class="stsub">harde haalbaarheidsmacht</text>

<!-- callout -->
<rect x="60" y="592" width="840" height="56" rx="8" class="callout"/>
<text x="480" y="614" text-anchor="middle" class="calltext">Drie van de vier — directie, DNB, AFM — zitten in het kwadrant sleutelspelers: elk kan de voortgang blokkeren als hun belang wijkt.</text>
<text x="480" y="632" text-anchor="middle" class="calltext">Alleen de deelnemersvertegenwoordiging heeft hoorrecht, geen vetorecht — nauw betrekken, niet negeren (§29.3).</text>
</svg>
