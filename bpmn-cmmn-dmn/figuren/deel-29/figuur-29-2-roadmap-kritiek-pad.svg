<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="'DM Sans', Arial, sans-serif" width="960" height="660" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .panel { fill:#FFFFFF; stroke:#E3E0D8; stroke-width:1.5; }
      .rowlabel { font-size:12.5px; font-weight:700; fill:#14213D; }
      .rowsub { font-size:10.5px; fill:#55606F; }
      .gridline { stroke:#E3E0D8; stroke-width:1.2; stroke-dasharray:4 3; }
      .axisline { stroke:#14213D; stroke-width:1.4; }
      .barcrit { fill:#E9A13B; stroke:#8a5a12; stroke-width:1.4; }
      .barnorm { fill:#CFE0F2; stroke:#2563A8; stroke-width:1.4; }
      .bartxt { font-size:10.5px; font-weight:700; fill:#14213D; }
      .bartxtlight { font-size:10.5px; font-weight:700; fill:#5c3d0a; }
      .milecrit { fill:#E9A13B; stroke:#8a5a12; stroke-width:1.6; }
      .milenorm { fill:#2563A8; stroke:#14213D; stroke-width:1.4; }
      .arrow { stroke:#8a5a12; stroke-width:1.8; fill:none; marker-end:url(#arramber); }
      .arrowblue { stroke:#55606F; stroke-width:1.4; fill:none; marker-end:url(#arrgrey); }
      .datelabel { font-size:11px; font-weight:700; fill:#14213D; }
      .datesub { font-size:9.5px; fill:#55606F; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .sub { font-size:12.5px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .bracket { stroke:#8a5a12; stroke-width:1.4; fill:none; }
      .brackettxt { font-size:10px; fill:#8a5a12; font-weight:700; }
      .legendtxt { font-size:11px; fill:#14213D; }
    </style>
    <marker id="arramber" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8a5a12"/></marker>
    <marker id="arrgrey" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
</defs>
<rect width="960" height="660" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 29 · ROADMAP</text>
<text x="40" y="64" class="title">Figuur 29.2 — Roadmap met kritiek pad, incl. het halfvoltooide Mutatieplatform</text>
<text x="40" y="84" class="sub">Amber = kritiek pad (geen speling tot 1 januari 2028). Blauw = afhankelijk, niet doorlooptijdbepalend.</text>

<!-- panel -->
<rect x="40" y="102" width="890" height="470" class="panel" rx="4"/>

<!-- vertical gridlines -->
<line x1="260" y1="112" x2="260" y2="540" class="gridline"/>
<line x1="420" y1="112" x2="420" y2="540" class="gridline"/>
<line x1="804" y1="112" x2="804" y2="540" class="gridline"/>

<text x="260" y="122" text-anchor="middle" class="datelabel">nu</text>
<text x="260" y="134" text-anchor="middle" class="datesub">aug 2026</text>
<text x="420" y="122" text-anchor="middle" class="datelabel">1 jan 2027</text>
<text x="420" y="134" text-anchor="middle" class="datesub">implementatie-/communicatieplan</text>
<text x="804" y="122" text-anchor="middle" class="datelabel">1 jan 2028</text>
<text x="804" y="134" text-anchor="middle" class="datesub">transitie / invaren (uiterste datum)</text>

<!-- Row 0: Mutatieplatform migratie -->
<text x="55" y="168" class="rowlabel">Mutatieplatform migratie</text>
<text x="55" y="182" class="rowsub">Klachten &amp; Bezwaren, Bijzondere Situaties</text>
<rect x="260" y="192" width="448" height="26" rx="5" class="barcrit"/>
<text x="270" y="209" class="bartxtlight">halfvoltooid — nog 2 van 5 afdelingen</text>

<!-- annotation: samenloop -->
<line x1="420" y1="192" x2="420" y2="176" class="axisline"/>
<rect x="432" y="150" width="230" height="34" rx="6" fill="#FBF6E9" stroke="#E9A13B" stroke-width="1.2"/>
<text x="442" y="164" class="bartxtlight">samenloop: platform is hier</text>
<text x="442" y="177" class="bartxtlight">nog niet klaar (casusdossier §8)</text>

<!-- Row 1: IT-capaciteit stelselovergang -->
<text x="55" y="248" class="rowlabel">IT-capaciteit stelselovergang</text>
<text x="55" y="262" class="rowsub">bouw &amp; testen invaren, datakwaliteit</text>
<rect x="260" y="272" width="544" height="26" rx="5" class="barcrit"/>
<text x="270" y="289" class="bartxtlight">geen speling — eindigt exact op de transitiedatum</text>

<!-- bracket showing shared capacity between row0 and row1 -->
<path d="M264,220 C264,236 264,236 264,270" class="bracket" stroke-dasharray="3 2"/>
<path d="M700,220 C700,236 700,236 700,270" class="bracket" stroke-dasharray="3 2"/>
<text x="264" y="234" class="brackettxt">gedeelde IT-capaciteit — geen ruimte voor parallel zonder competitie (§29.2)</text>

<!-- Row 2: milestone implementatie/communicatieplan -->
<text x="55" y="330" class="rowlabel">Implementatieplan (DNB) &amp;</text>
<text x="55" y="344" class="rowsub">Communicatieplan (AFM)</text>
<path d="M420,336 l14,14 l-14,14 l-14,-14 Z" class="milenorm"/>
<text x="450" y="345" class="bartxt">uiterlijk 1 jaar vóór transitiedatum</text>
<path d="M420,298 L420,336" class="arrowblue"/>

<!-- Row 3: prognose overzichten -->
<text x="55" y="400" class="rowlabel">Prognose-transitieoverzichten</text>
<text x="55" y="414" class="rowsub">naar alle 380.000 deelnemers</text>
<rect x="420" y="424" width="224" height="26" rx="5" class="barnorm"/>
<text x="430" y="441" class="bartxt">2027</text>
<path d="M420,364 L420,424" class="arrowblue"/>

<!-- Row 4: transitie & invaren milestone -->
<text x="55" y="480" class="rowlabel">Transitie &amp; invaren</text>
<text x="55" y="494" class="rowsub">uiterste wettelijke datum</text>
<path d="M804,466 l16,16 l-16,16 l-16,-16 Z" class="milecrit"/>
<text x="830" y="488" class="bartxtlight">1 januari 2028 — wijkt niet (§1)</text>
<path d="M708,205 C 760,205 790,300 804,466" class="arrow"/>
<path d="M804,298 L804,466" class="arrow"/>
<path d="M644,437 L804,466" class="arrowblue"/>

<!-- Row 5: definitieve overzichten -->
<text x="55" y="530" class="rowlabel">Definitieve transitieoverzichten</text>
<text x="55" y="544" class="rowsub">+ datakwaliteitstoetsing ná invaren</text>
<rect x="820" y="518" width="80" height="26" rx="5" class="barnorm"/>
<text x="828" y="535" class="bartxt">2028 e.v.</text>
<path d="M820,482 L820,518" class="arrowblue"/>

<!-- legend -->
<rect x="60" y="556" width="850" height="90" rx="6" fill="#FFFFFF" stroke="#E3E0D8" stroke-width="1.2"/>
<rect x="78" y="568" width="18" height="14" rx="3" class="barcrit"/>
<text x="104" y="579" class="legendtxt">kritiek pad — geen speling, bepaalt de einddatum</text>
<rect x="78" y="590" width="18" height="14" rx="3" class="barnorm"/>
<text x="104" y="601" class="legendtxt">afhankelijk, maar niet doorlooptijdbepalend</text>
<text x="440" y="579" class="legendtxt">Een roadmap die alles parallel plant zonder deze competitie te benoemen,</text>
<text x="440" y="595" class="legendtxt">is een wensenlijst — geen plan (§29.2).</text>
<text x="78" y="622" class="legendtxt">De Mutatieplatform-migratie en de bouw/test van de stelselovergang delen dezelfde beperkte IT-capaciteit;</text>
<text x="78" y="638" class="legendtxt">op de implementatieplan-deadline (1 jan 2027) is het platform nog niet klaar — die spanning is het uitgangspunt van de planning.</text>

</svg>
