<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="'DM Sans', Arial, sans-serif" width="960" height="700" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .hub { fill:#14213D; stroke:#14213D; stroke-width:2; }
      .hublabel { font-size:15px; font-weight:700; fill:#FBFAF7; }
      .hubsub { font-size:10.5px; fill:#CFE0F2; }
      .spoke { stroke:#55606F; stroke-width:1.6; fill:none; }
      .box { fill:#FFFFFF; stroke:#2563A8; stroke-width:1.6; }
      .boxamber { fill:#FBF6E9; stroke:#E9A13B; stroke-width:2.2; }
      .boxlabel { font-size:15px; font-weight:700; fill:#14213D; }
      .boxsub { font-size:11.5px; fill:#55606F; }
      .boxsubamber { font-size:11px; fill:#8a5a12; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .sub { font-size:12.5px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .callout { fill:#EEF2F7; stroke:#14213D; stroke-width:1.2; }
      .calltext { font-size:12.5px; fill:#14213D; }
    </style>
</defs>
<rect width="960" height="700" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 29 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Figuur 29.1 — Het target operating model: vijf componenten</text>
<text x="40" y="86" class="sub">Procesmodellen zijn één component naast organisatie, technologie, data en sturing — niet het hele TOM (§29.1).</text>

<!-- spokes (drawn first, covered by hub and boxes) -->
<line x1="480" y1="380" x2="480" y2="150" class="spoke"/>
<line x1="480" y1="380" x2="699" y2="309" class="spoke"/>
<line x1="480" y1="380" x2="615" y2="566" class="spoke"/>
<line x1="480" y1="380" x2="345" y2="566" class="spoke"/>
<line x1="480" y1="380" x2="261" y2="309" class="spoke"/>

<!-- hub -->
<circle cx="480" cy="380" r="76" class="hub"/>
<text x="480" y="374" text-anchor="middle" class="hublabel">TARGET</text>
<text x="480" y="392" text-anchor="middle" class="hublabel">OPERATING MODEL</text>
<text x="480" y="410" text-anchor="middle" class="hubsub">hoe Meridiaan na de transitie werkt</text>

<!-- Processen (top, amber highlight) -->
<rect x="385" y="100" width="190" height="100" rx="10" class="boxamber"/>
<text x="480" y="130" text-anchor="middle" class="boxlabel">Processen</text>
<text x="480" y="150" text-anchor="middle" class="boxsubamber">onderwerp van deze cursus —</text>
<text x="480" y="164" text-anchor="middle" class="boxsubamber">één van vijf, niet het geheel</text>
<text x="480" y="182" text-anchor="middle" class="boxsubamber">(§29.1)</text>

<!-- Technologie (upper right) -->
<rect x="604" y="259" width="190" height="100" rx="10" class="box"/>
<text x="699" y="292" text-anchor="middle" class="boxlabel">Technologie</text>
<text x="699" y="312" text-anchor="middle" class="boxsub">systemen, platformen</text>
<text x="699" y="328" text-anchor="middle" class="boxsub">(o.a. Mutatieplatform)</text>

<!-- Data (lower right) -->
<rect x="520" y="516" width="190" height="100" rx="10" class="box"/>
<text x="615" y="549" text-anchor="middle" class="boxlabel">Data</text>
<text x="615" y="569" text-anchor="middle" class="boxsub">welke gegevens, waar</text>
<text x="615" y="585" text-anchor="middle" class="boxsub">(datakwaliteit invaren)</text>

<!-- Sturing (lower left) -->
<rect x="250" y="516" width="190" height="100" rx="10" class="box"/>
<text x="345" y="549" text-anchor="middle" class="boxlabel">Sturing</text>
<text x="345" y="569" text-anchor="middle" class="boxsub">governance, besluitvorming</text>
<text x="345" y="585" text-anchor="middle" class="boxsub">(bestuursbesluit datakwaliteit)</text>

<!-- Organisatie (upper left) -->
<rect x="166" y="259" width="190" height="100" rx="10" class="box"/>
<text x="261" y="292" text-anchor="middle" class="boxlabel">Organisatie</text>
<text x="261" y="312" text-anchor="middle" class="boxsub">rollen, structuur</text>
<text x="261" y="328" text-anchor="middle" class="boxsub">(circa 1.200 medewerkers)</text>

<!-- callout -->
<rect x="120" y="636" width="720" height="52" rx="8" class="callout"/>
<text x="480" y="658" text-anchor="middle" class="calltext">Een perfect procesontwerp zonder de bijbehorende organisatiestructuur is niet uitvoerbaar —</text>
<text x="480" y="676" text-anchor="middle" class="calltext">alle vijf componenten moeten samen bewegen (§29.1).</text>

</svg>
