<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'DM Sans', Arial, sans-serif" width="960" height="640" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .panel { fill:#FFFFFF; stroke:#E3E0D8; stroke-width:1.5; }
      .node { fill:#CFE0F2; stroke:#14213D; stroke-width:1.3; }
      .node-se { fill:#EEF2F7; stroke:#14213D; stroke-width:1.3; }
      .label { font-size:13px; font-weight:700; fill:#14213D; }
      .nodetext { font-size:9.5px; font-weight:700; fill:#14213D; }
      .sub { font-size:11px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .paneltitle { font-size:14px; font-weight:700; fill:#14213D; }
      .panelsub { font-size:10.5px; fill:#55606F; }
      .edge-thin { stroke:#6FA3D6; stroke-width:1.1; fill:none; marker-end:url(#arrB); }
      .edge-mid { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrB); }
      .edge-thick { stroke:#14213D; stroke-width:3.2; fill:none; marker-end:url(#arrD); }
      .block { fill:none; stroke:#E9A13B; stroke-width:1.4; stroke-dasharray:4,3; }
      .blocklabel { font-size:9.5px; fill:#8a5a12; font-weight:700; }
      .badge { fill:#14213D; }
      .badgetext { font-size:12px; font-weight:700; fill:#FBFAF7; letter-spacing:.05em; }
      .badgesub { font-size:9.5px; fill:#CFE0F2; }
    </style>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="#2563A8"/></marker>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="#14213D"/></marker>
</defs>
<rect width="960" height="640" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 25 · DISCOVERY-VERGELIJKING</text>
<text x="40" y="64" class="title">Figuur 25.2 — Hetzelfde event log, drie verschillende modellen</text>
<text x="40" y="84" class="sub">Discovery-run in Retroductus op het Deelnemermutaties-log (§25.2)</text>

<!-- Retroductus badge -->
<rect x="700" y="42" width="220" height="34" rx="6" class="badge"/>
<text x="712" y="61" class="badgetext">RETRODUCTUS</text>
<text x="712" y="72" class="badgesub" font-size="8.5">procesmining-motor · discovery-run</text>

<!-- Panel 1: Alpha -->
<rect x="30" y="110" width="290" height="470" rx="6" class="panel"/>
<text x="175" y="136" text-anchor="middle" class="paneltitle">Alpha-algoritme</text>
<text x="175" y="152" text-anchor="middle" class="panelsub">eenvoudig, gevoelig voor ruis</text>
<g transform="translate(45,150)">
  <circle cx="130" cy="30" r="16" class="node-se"/><text x="130" y="34" text-anchor="middle" class="nodetext">Start</text>
  <rect x="30" y="90" width="80" height="30" rx="6" class="node"/><text x="70" y="109" text-anchor="middle" class="nodetext">Ontvangst</text>
  <rect x="150" y="90" width="80" height="30" rx="6" class="node"/><text x="190" y="109" text-anchor="middle" class="nodetext">Verrijking</text>
  <rect x="30" y="170" width="80" height="30" rx="6" class="node"/><text x="70" y="189" text-anchor="middle" class="nodetext">Uitzondering</text>
  <rect x="150" y="170" width="80" height="30" rx="6" class="node"/><text x="190" y="189" text-anchor="middle" class="nodetext">Verwerking</text>
  <circle cx="130" cy="260" r="17" class="node-se" stroke-width="2.6"/><text x="130" y="264" text-anchor="middle" class="nodetext">Einde</text>

  <path d="M120,38 L78,90" class="edge-thin"/>
  <path d="M140,38 L182,90" class="edge-thin"/>
  <path d="M105,105 L155,105" class="edge-thin"/>
  <path d="M70,120 L70,170" class="edge-thin"/>
  <path d="M190,120 L190,170" class="edge-thin"/>
  <path d="M105,110 L155,175" class="edge-thin"/>
  <path d="M110,185 L150,185" class="edge-thin"/>
  <path d="M180,120 L75,175" class="edge-thin"/>
  <path d="M70,200 L120,255" class="edge-thin"/>
  <path d="M190,200 L140,255" class="edge-thin"/>
  <path d="M110,185 L130,255" class="edge-thin"/>
  <path d="M215,200 L145,45" class="edge-thin"/>
</g>
<text x="45" y="600" class="sub" font-style="italic" font-size="9.5">Elke waargenomen volgorde wordt even zwaar</text>
<text x="45" y="613" class="sub" font-style="italic" font-size="9.5">meegenomen — ruis en patroon door elkaar.</text>

<!-- Panel 2: Heuristic -->
<rect x="335" y="110" width="290" height="470" rx="6" class="panel"/>
<text x="480" y="136" text-anchor="middle" class="paneltitle">Heuristic miner</text>
<text x="480" y="152" text-anchor="middle" class="panelsub">robuuster, werkt met frequentiedrempels</text>
<g transform="translate(350,150)">
  <circle cx="130" cy="30" r="16" class="node-se"/><text x="130" y="34" text-anchor="middle" class="nodetext">Start</text>
  <rect x="30" y="90" width="80" height="30" rx="6" class="node"/><text x="70" y="109" text-anchor="middle" class="nodetext">Ontvangst</text>
  <rect x="150" y="90" width="80" height="30" rx="6" class="node"/><text x="190" y="109" text-anchor="middle" class="nodetext">Verrijking</text>
  <rect x="30" y="170" width="80" height="30" rx="6" class="node"/><text x="70" y="189" text-anchor="middle" class="nodetext">Uitzondering</text>
  <rect x="150" y="170" width="80" height="30" rx="6" class="node"/><text x="190" y="189" text-anchor="middle" class="nodetext">Verwerking</text>
  <circle cx="130" cy="260" r="17" class="node-se" stroke-width="2.6"/><text x="130" y="264" text-anchor="middle" class="nodetext">Einde</text>

  <path d="M122,42 L78,90" class="edge-thick"/>
  <path d="M105,105 L155,105" class="edge-thick"/>
  <path d="M190,120 L190,170" class="edge-thick"/>
  <path d="M190,200 L140,255" class="edge-thick"/>
  <path d="M70,120 L70,170" class="edge-thin"/>
  <path d="M110,185 L150,185" class="edge-thin"/>
</g>
<text x="350" y="580" class="sub" font-size="9.5">Dikke lijn = boven de drempel (hoofdpad).</text>
<text x="350" y="600" class="sub" font-size="9.5">Dunne lijn = zeldzaam, net niet gefilterd.</text>
<text x="350" y="613" class="sub font-style italic" font-size="9.5" font-style="italic">Ontvangst → Verwerking direct: onder de drempel, weggelaten.</text>

<!-- Panel 3: Inductive -->
<rect x="640" y="110" width="290" height="470" rx="6" class="panel"/>
<text x="785" y="136" text-anchor="middle" class="paneltitle">Inductive miner</text>
<text x="785" y="152" text-anchor="middle" class="panelsub">garandeert een sound model</text>
<g transform="translate(655,150)">
  <circle cx="130" cy="30" r="16" class="node-se"/><text x="130" y="34" text-anchor="middle" class="nodetext">Start</text>
  <rect x="90" y="80" width="80" height="30" rx="6" class="node"/><text x="130" y="99" text-anchor="middle" class="nodetext">Ontvangst</text>

  <rect x="40" y="150" width="180" height="90" class="block"/>
  <text x="130" y="144" text-anchor="middle" class="blocklabel">parallel block (§25.2)</text>
  <rect x="55" y="170" width="70" height="30" rx="6" class="node"/><text x="90" y="189" text-anchor="middle" class="nodetext">Verrijking</text>
  <rect x="145" y="170" width="70" height="30" rx="6" class="node"/><text x="180" y="189" text-anchor="middle" class="nodetext">Uitzondering</text>

  <rect x="90" y="270" width="80" height="30" rx="6" class="node"/><text x="130" y="289" text-anchor="middle" class="nodetext">Verwerking</text>
  <circle cx="130" cy="335" r="17" class="node-se" stroke-width="2.6"/><text x="130" y="339" text-anchor="middle" class="nodetext">Einde</text>

  <path d="M130,46 L130,80" class="edge-thick"/>
  <path d="M120,110 L95,170" class="edge-thick"/>
  <path d="M140,110 L175,170" class="edge-thick"/>
  <path d="M95,200 L120,270" class="edge-thick"/>
  <path d="M175,200 L145,270" class="edge-thick"/>
  <path d="M130,300 L130,318" class="edge-thick"/>
</g>
<text x="655" y="580" class="sub" font-size="9.5">Geen kruisende lijnen: alle paden vormen</text>
<text x="655" y="600" class="sub" font-size="9.5">een sluitend blok — correct, maar de</text>
<text x="655" y="613" class="sub" font-style="italic" font-size="9.5">grens tussen Verrijking/Uitzondering is abstracter.</text>
</svg>
