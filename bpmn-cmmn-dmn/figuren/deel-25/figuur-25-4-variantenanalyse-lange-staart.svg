<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .panel { fill:#FFFFFF; stroke:#E3E0D8; stroke-width:1.5; }
      .axis { stroke:#14213D; stroke-width:1.5; }
      .gridline { stroke:#E3E0D8; stroke-width:1; }
      .bar-main { fill:#2563A8; }
      .bar-tail { fill:#E9A13B; }
      .barlabel { font-size:10.5px; font-weight:700; fill:#14213D; }
      .axistick { font-size:10px; fill:#55606F; }
      .varlabel { font-size:10px; fill:#55606F; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .sub { font-size:12px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .legendtext { font-size:11px; fill:#14213D; }
      .cumline { stroke:#14213D; stroke-width:1.6; fill:none; stroke-dasharray:2,2; }
      .cumdot { fill:#14213D; }
      .dash80 { stroke:#55606F; stroke-width:1; stroke-dasharray:4,3; }
      .callout { fill:#FBF6E9; stroke:#E9A13B; stroke-width:1.4; }
      .calltitle { font-size:11.5px; font-weight:700; fill:#8a5a12; }
      .calltext { font-size:10.6px; fill:#55606F; }
      .bracket { stroke:#8a5a12; stroke-width:1.5; fill:none; }
    </style>
</defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 25 · VARIANTENANALYSE</text>
<text x="40" y="64" class="title">Figuur 25.4 — Deelnemermutaties: varianten en de lange staart</text>
<text x="40" y="84" class="sub">34 varianten in het event log, aflopend gesorteerd op frequentie (§25.4)</text>

<rect x="40" y="105" width="880" height="380" class="panel" rx="4"/>

<!-- y-axis left: % van cases -->
<g>
  <line x1="110" y1="440" x2="880" y2="440" class="axis"/>
  <line x1="110" y1="130" x2="110" y2="440" class="axis"/>
  <line x1="110" y1="130" x2="880" y2="130" class="gridline"/>
  <line x1="110" y1="207" x2="880" y2="207" class="gridline"/>
  <line x1="110" y1="285" x2="880" y2="285" class="gridline"/>
  <line x1="110" y1="362" x2="880" y2="362" class="gridline"/>
  <text x="98" y="444" text-anchor="end" class="axistick">0%</text>
  <text x="98" y="366" text-anchor="end" class="axistick">8%</text>
  <text x="98" y="289" text-anchor="end" class="axistick">16%</text>
  <text x="98" y="211" text-anchor="end" class="axistick">24%</text>
  <text x="98" y="134" text-anchor="end" class="axistick">32%</text>
  <text x="60" y="290" text-anchor="middle" class="axistick" transform="rotate(-90,60,290)">% van cases</text>
</g>

<!-- bars: V1..V8 explicit descending, then grouped tail -->
<!-- scale: 1% = 9.7px -->
<g>
  <!-- V1 32% -->
  <rect x="130" y="130.4" width="46" height="309.6" class="bar-main"/>
  <text x="153" y="122" text-anchor="middle" class="barlabel">32%</text>
  <text x="153" y="455" text-anchor="middle" class="varlabel">V1</text>
  <!-- V2 18% -->
  <rect x="186" y="265.4" width="46" height="174.6" class="bar-main"/>
  <text x="209" y="257" text-anchor="middle" class="barlabel">18%</text>
  <text x="209" y="455" text-anchor="middle" class="varlabel">V2</text>
  <!-- V3 12% -->
  <rect x="242" y="323" width="46" height="117" class="bar-main"/>
  <text x="265" y="315" text-anchor="middle" class="barlabel">12%</text>
  <text x="265" y="455" text-anchor="middle" class="varlabel">V3</text>
  <!-- V4 9% -->
  <rect x="298" y="352.7" width="46" height="87.3" class="bar-main"/>
  <text x="321" y="345" text-anchor="middle" class="barlabel">9%</text>
  <text x="321" y="455" text-anchor="middle" class="varlabel">V4</text>
  <!-- V5 6% -->
  <rect x="354" y="381.8" width="46" height="58.2" class="bar-main"/>
  <text x="377" y="374" text-anchor="middle" class="barlabel">6%</text>
  <text x="377" y="455" text-anchor="middle" class="varlabel">V5</text>
  <!-- V6 4% -->
  <rect x="410" y="401.2" width="46" height="38.8" class="bar-main"/>
  <text x="433" y="394" text-anchor="middle" class="barlabel">4%</text>
  <text x="433" y="455" text-anchor="middle" class="varlabel">V6</text>
  <!-- V7 3% -->
  <rect x="466" y="410.9" width="46" height="29.1" class="bar-main"/>
  <text x="489" y="403" text-anchor="middle" class="barlabel">3%</text>
  <text x="489" y="455" text-anchor="middle" class="varlabel">V7</text>
  <!-- V8 2% -->
  <rect x="522" y="420.6" width="46" height="19.4" class="bar-main"/>
  <text x="545" y="413" text-anchor="middle" class="barlabel">2%</text>
  <text x="545" y="455" text-anchor="middle" class="varlabel">V8</text>

  <!-- tail: V9-V34, 26 varianten, together 14%, drawn as many thin amber bars -->
  <g class="bar-tail">
    <rect x="582" y="429" width="10" height="11"/>
    <rect x="594" y="431" width="10" height="9"/>
    <rect x="606" y="432" width="10" height="8"/>
    <rect x="618" y="433" width="10" height="7"/>
    <rect x="630" y="433" width="10" height="7"/>
    <rect x="642" y="434" width="10" height="6"/>
    <rect x="654" y="434" width="10" height="6"/>
    <rect x="666" y="435" width="10" height="5"/>
    <rect x="678" y="435" width="10" height="5"/>
    <rect x="690" y="436" width="10" height="4"/>
    <rect x="702" y="436" width="10" height="4"/>
    <rect x="714" y="437" width="10" height="3"/>
    <rect x="726" y="437" width="10" height="3"/>
    <rect x="738" y="437" width="10" height="3"/>
    <rect x="750" y="438" width="10" height="2"/>
    <rect x="762" y="438" width="10" height="2"/>
    <rect x="774" y="438" width="10" height="2"/>
    <rect x="786" y="439" width="10" height="1"/>
    <rect x="798" y="439" width="10" height="1"/>
    <rect x="810" y="439" width="10" height="1"/>
  </g>
  <text x="696" y="455" text-anchor="middle" class="varlabel">V9 – V34 (26 varianten)</text>

  <!-- bracket over the tail -->
  <path d="M580,410 L580,400 L820,400 L820,410" class="bracket"/>
  <text x="700" y="392" text-anchor="middle" class="calltitle">lange staart — samen 14% van de cases</text>
</g>

<!-- 80% dashed line, crosses around V4 -->
<line x1="110" y1="207" x2="880" y2="207" class="dash80"/>
<text x="825" y="203" class="axistick">cumulatief 80% bij V1–V4</text>

<!-- legend -->
<rect x="700" y="140" width="16" height="16" class="bar-main"/>
<text x="722" y="152" class="legendtext">hoofdvarianten (V1–V8, 86%)</text>
<rect x="700" y="160" width="16" height="16" class="bar-tail"/>
<text x="722" y="172" class="legendtext">lange staart (V9–V34, 14%)</text>

<rect x="40" y="500" width="880" height="100" rx="6" class="callout"/>
<text x="58" y="522" class="calltitle">Wat de lange staart betekent voor de standaardisatieambitie</text>
<text x="58" y="540" class="calltext">Vier varianten dekken 80% van de Deelnemermutaties-cases — een sterk gestandaardiseerd kernproces. De</text>
<text x="58" y="556" class="calltext">resterende 26 varianten (14%) zijn niet automatisch "fout": een deel is incidentele afhandelingsfout, een deel</text>
<text x="58" y="572" class="calltext">is legitieme uitzonderingsafhandeling die niet zomaar wegontworpen kan worden zonder nader onderzoek (§25.4).</text>
</svg>
