<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'DM Sans', Arial, sans-serif" width="960" height="640" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .navy { fill:#14213D; }
      .blue-dark { fill:#2563A8; }
      .blue-fill { fill:#CFE0F2; }
      .amber-fill { fill:#E9A13B; }
      .amber-light { fill:#FBF6E9; }
      .neutral-light { fill:#EEF2F7; }
      .white { fill:#FFFFFF; }
      .label-light { font-size:15px; font-weight:700; fill:#FBFAF7; text-anchor:middle; }
      .label { font-size:14px; font-weight:700; fill:#14213D; text-anchor:middle; }
      .body { font-size:11.5px; fill:#14213D; text-anchor:middle; }
      .sub { font-size:11px; fill:#55606F; text-anchor:middle; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:26px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .frametag { font-size:11px; font-weight:700; fill:#8A5A0E; letter-spacing:.06em; text-anchor:middle; }
      .arrow { stroke:#55606F; stroke-width:1.4; fill:none; stroke-dasharray:4,3; marker-end:url(#arr); }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
</defs>
<rect width="960" height="640" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 01 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Het OMG-standaardenlandschap</text>

<!-- buitenkader: OMG -->
<rect x="50" y="95" width="860" height="500" rx="16" fill="#FFFFFF" stroke="#14213D" stroke-width="2"/>
<text x="480" y="120" class="sub" font-weight="700" letter-spacing=".1em">OBJECT MANAGEMENT GROUP (OMG) — GEMEENSCHAPPELIJK METAMODEL, XML-UITWISSELING, CERTIFICERING</text>

<!-- BMM band boven -->
<rect x="80" y="140" width="800" height="80" rx="10" class="amber-light" stroke="#E9A13B" stroke-width="2"/>
<text x="480" y="164" class="frametag">BMM 1.3 — BUSINESS MOTIVATION MODEL</text>
<text x="480" y="184" class="body">Waarom de organisatie doet wat ze doet</text>
<text x="480" y="202" class="sub">Kernbegrip: ends &amp; means · komt terug in deel 2</text>

<path d="M480,220 L480,255" class="arrow"/>
<text x="620" y="245" class="sub">verbindt processen aan doelstellingen</text>

<!-- kern: drie notaties -->
<rect x="80" y="265" width="246" height="190" rx="10" class="blue-dark"/>
<text x="203" y="296" class="label-light">BPMN 2.0.2</text>
<text x="203" y="318" font-size="11" fill="#FBFAF7" text-anchor="middle">Business Process Model</text>
<text x="203" y="333" font-size="11" fill="#FBFAF7" text-anchor="middle">and Notation</text>
<line x1="110" y1="345" x2="296" y2="345" stroke="#FBFAF7" stroke-width="1" opacity="0.5"/>
<text x="203" y="368" font-size="11" fill="#FBFAF7" text-anchor="middle">Processen met een volgorde</text>
<text x="203" y="392" font-size="10.5" fill="#CFE0F2" text-anchor="middle">Kernbegrip: sequence flow,</text>
<text x="203" y="407" font-size="10.5" fill="#CFE0F2" text-anchor="middle">token</text>
<text x="203" y="435" font-size="10" fill="#FBF6E9" text-anchor="middle" font-style="italic">breed ondersteund — de facto</text>
<text x="203" y="448" font-size="10" fill="#FBF6E9" text-anchor="middle" font-style="italic">standaard</text>

<rect x="357" y="265" width="246" height="190" rx="10" class="navy"/>
<text x="480" y="296" class="label-light">CMMN 1.1</text>
<text x="480" y="318" font-size="11" fill="#FBFAF7" text-anchor="middle">Case Management Model</text>
<text x="480" y="333" font-size="11" fill="#FBFAF7" text-anchor="middle">and Notation</text>
<line x1="387" y1="345" x2="573" y2="345" stroke="#FBFAF7" stroke-width="1" opacity="0.5"/>
<text x="480" y="368" font-size="11" fill="#FBFAF7" text-anchor="middle">Dossiers zonder vaste volgorde</text>
<text x="480" y="392" font-size="10.5" fill="#CFE0F2" text-anchor="middle">Kernbegrip: case file,</text>
<text x="480" y="407" font-size="10.5" fill="#CFE0F2" text-anchor="middle">sentry</text>
<text x="480" y="435" font-size="10" fill="#FBF6E9" text-anchor="middle" font-style="italic">minst geadopteerd — toets</text>
<text x="480" y="448" font-size="10" fill="#FBF6E9" text-anchor="middle" font-style="italic">bij toolkeuze</text>

<rect x="634" y="265" width="246" height="190" rx="10" class="blue-dark"/>
<text x="757" y="296" class="label-light">DMN</text>
<text x="757" y="318" font-size="11" fill="#FBFAF7" text-anchor="middle">Decision Model</text>
<text x="757" y="333" font-size="11" fill="#FBFAF7" text-anchor="middle">and Notation</text>
<line x1="664" y1="345" x2="850" y2="345" stroke="#FBFAF7" stroke-width="1" opacity="0.5"/>
<text x="757" y="368" font-size="11" fill="#FBFAF7" text-anchor="middle">Beslissingen en beslislogica</text>
<text x="757" y="392" font-size="10.5" fill="#CFE0F2" text-anchor="middle">Kernbegrip: decision,</text>
<text x="757" y="407" font-size="10.5" fill="#CFE0F2" text-anchor="middle">beslistabel</text>
<text x="757" y="435" font-size="10" fill="#FBF6E9" text-anchor="middle" font-style="italic">tien jaar vaste plek — direct</text>
<text x="757" y="448" font-size="10" fill="#FBF6E9" text-anchor="middle" font-style="italic">uitvoerbaar</text>

<path d="M480,505 L480,540" class="arrow"/>
<text x="620" y="530" class="sub">meet het vermogen tot procesbeheersing</text>

<!-- BPMM band onder -->
<rect x="80" y="540" width="800" height="45" rx="10" class="amber-light" stroke="#E9A13B" stroke-width="2"/>
<text x="480" y="558" class="frametag">BPMM 1.0 — BUSINESS PROCESS MATURITY MODEL</text>
<text x="480" y="574" class="sub">Hoe volwassen de procesbeheersing is · kernbegrip: volwassenheidsniveau</text>

</svg>
