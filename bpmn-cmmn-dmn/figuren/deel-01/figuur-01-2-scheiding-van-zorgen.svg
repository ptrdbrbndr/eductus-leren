<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" font-family="'DM Sans', Arial, sans-serif" width="1000" height="660" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .navy { fill:#14213D; }
      .blue-dark { fill:#2563A8; }
      .blue-fill { fill:#CFE0F2; }
      .amber-fill { fill:#E9A13B; }
      .amber-light { fill:#FBF6E9; }
      .neutral-light { fill:#EEF2F7; }
      .white { fill:#FFFFFF; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .body { font-size:11px; fill:#14213D; }
      .sub { font-size:12px; fill:#55606F; }
      .gwlabel { font-size:9.5px; fill:#14213D; text-anchor:middle; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .panelkicker { font-size:12px; font-weight:700; fill:#2563A8; letter-spacing:.04em; }
      .panelkicker2 { font-size:12px; font-weight:700; fill:#E9A13B; letter-spacing:.04em; }
      .seq { stroke:#14213D; stroke-width:1.6; fill:none; marker-end:url(#arrSeq); }
      .info { stroke:#14213D; stroke-width:1.5; fill:none; marker-end:url(#arrSeq); }
      .invoke { stroke:#55606F; stroke-width:1.3; fill:none; stroke-dasharray:4,3; marker-end:url(#arrGrey); }
      .diamond { fill:#FBF6E9; stroke:#14213D; stroke-width:1.6; }
      .task { fill:#CFE0F2; stroke:#14213D; stroke-width:1.6; }
      .event-start { fill:#FBFAF7; stroke:#14213D; stroke-width:1.4; }
      .event-end { fill:#FBFAF7; stroke:#14213D; stroke-width:3; }
      .decision { fill:#2563A8; stroke:#14213D; stroke-width:1.6; }
      .inputdata { fill:#FBF6E9; stroke:#14213D; stroke-width:1.4; }
    </style>
    <marker id="arrSeq" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#14213D"/></marker>
    <marker id="arrGrey" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#55606F"/></marker>
</defs>
<rect width="1000" height="660" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 01 · BPMN-FRAGMENT &amp; DRD</text>
<text x="40" y="64" class="title">Wat er misgaat zonder scheiding — en het alternatief</text>

<!-- middenlijn -->
<line x1="500" y1="95" x2="500" y2="628" stroke="#E3E0D8" stroke-width="1.5"/>

<!-- ============ LINKS: BPMN-fragment met vijf gateways ============ -->
<text x="40" y="102" class="panelkicker">VÓÓR — beslislogica verspreid over vijf gateways</text>

<circle cx="55" cy="330" r="16" class="event-start"/>
<text x="55" y="358" class="sub" text-anchor="middle" font-size="10">Mutatie</text>
<text x="55" y="370" class="sub" text-anchor="middle" font-size="10">ontvangen</text>

<path d="M71,330 L98,330" class="seq"/>
<g transform="translate(115,330)">
  <path d="M0,-20 L20,0 L0,20 L-20,0 Z" class="diamond"/>
  <text x="0" y="4" text-anchor="middle" font-size="13" font-weight="700" fill="#14213D">X</text>
  <text x="0" y="-30" class="gwlabel">Leeftijd ≥ 65?</text>
</g>

<path d="M135,330 L162,330" class="seq"/>
<g transform="translate(179,330)">
  <path d="M0,-20 L20,0 L0,20 L-20,0 Z" class="diamond"/>
  <text x="0" y="4" text-anchor="middle" font-size="13" font-weight="700" fill="#14213D">X</text>
  <text x="0" y="42" class="gwlabel">Diensttijd ≥ 10 jr?</text>
</g>

<path d="M199,330 L226,330" class="seq"/>
<g transform="translate(243,330)">
  <path d="M0,-20 L20,0 L0,20 L-20,0 Z" class="diamond"/>
  <text x="0" y="4" text-anchor="middle" font-size="13" font-weight="700" fill="#14213D">X</text>
  <text x="0" y="-30" class="gwlabel">Partner bekend?</text>
</g>

<path d="M263,330 L290,330" class="seq"/>
<g transform="translate(307,330)">
  <path d="M0,-20 L20,0 L0,20 L-20,0 Z" class="diamond"/>
  <text x="0" y="4" text-anchor="middle" font-size="13" font-weight="700" fill="#14213D">X</text>
  <text x="0" y="46" class="gwlabel">Waardeoverdracht</text>
  <text x="0" y="58" class="gwlabel">ontvangen?</text>
</g>

<path d="M327,330 L354,330" class="seq"/>
<g transform="translate(371,330)">
  <path d="M0,-20 L20,0 L0,20 L-20,0 Z" class="diamond"/>
  <text x="0" y="4" text-anchor="middle" font-size="13" font-weight="700" fill="#14213D">X</text>
  <text x="0" y="-30" class="gwlabel">Fraudesignaal?</text>
</g>

<path d="M391,330 L418,330" class="seq"/>
<circle cx="435" cy="330" r="16" class="event-end"/>
<text x="435" y="358" class="sub" text-anchor="middle" font-size="10">Geaccepteerd /</text>
<text x="435" y="370" class="sub" text-anchor="middle" font-size="10">afgewezen</text>

<rect x="40" y="410" width="420" height="150" rx="8" class="neutral-light" stroke="#14213D" stroke-width="1"/>
<text x="56" y="434" class="body" font-weight="700">Wat hier misgaat</text>
<text x="56" y="454" class="body">Elke gateway bevat een conditie uit het</text>
<text x="56" y="470" class="body">acceptatiebeleid. Wijzigt het beleid, dan</text>
<text x="56" y="486" class="body">moet het procesmodel open. Niemand ziet</text>
<text x="56" y="502" class="body">welke regels gelden zonder het hele</text>
<text x="56" y="518" class="body">diagram te lezen — proces en beslissing</text>
<text x="56" y="534" class="body">zitten onlosmakelijk in elkaar verweven.</text>

<!-- ============ RECHTS: business rule task + DRD ============ -->
<text x="520" y="102" class="panelkicker2">NÁ — één business rule task, logica in een DRD</text>

<text x="520" y="128" class="sub" font-weight="700">BPMN — hetzelfde proces</text>
<circle cx="535" cy="165" r="14" class="event-start"/>
<path d="M549,165 L585,165" class="seq"/>
<rect x="585" y="140" width="150" height="50" rx="10" class="task"/>
<path d="M596,150 h14 M596,156 h14 M596,162 h10" stroke="#14213D" stroke-width="1.2"/>
<text x="660" y="171" class="body" text-anchor="middle" font-weight="700">Acceptatie bepalen</text>
<path d="M735,165 L771,165" class="seq"/>
<circle cx="786" cy="165" r="14" class="event-end"/>
<text x="660" y="205" class="sub" text-anchor="middle" font-size="10.5">business rule task — roept één beslissing aan</text>

<path d="M660,190 L660,235" class="invoke"/>
<text x="672" y="222" class="sub" font-size="10">roept aan</text>

<!-- DRD -->
<rect x="620" y="235" width="180" height="52" rx="4" class="decision"/>
<text x="710" y="266" font-size="12.5" font-weight="700" fill="#FBFAF7" text-anchor="middle">Acceptatiebeslissing</text>

<g>
  <path d="M580,390 L660,290" class="info"/>
  <path d="M660,400 L695,290" class="info"/>
  <path d="M760,400 L725,290" class="info"/>
  <path d="M840,390 L760,290" class="info"/>
  <path d="M900,340 L790,265" class="info"/>
</g>

<rect x="530" y="393" width="100" height="34" rx="17" class="inputdata"/>
<text x="580" y="415" font-size="10.5" text-anchor="middle">Leeftijd</text>

<rect x="620" y="403" width="100" height="34" rx="17" class="inputdata"/>
<text x="670" y="425" font-size="10.5" text-anchor="middle">Diensttijd</text>

<rect x="712" y="403" width="110" height="34" rx="17" class="inputdata"/>
<text x="767" y="425" font-size="10.5" text-anchor="middle">Partnergegevens</text>

<rect x="792" y="393" width="120" height="34" rx="17" class="inputdata"/>
<text x="852" y="415" font-size="10" text-anchor="middle">Waardeoverdracht</text>

<rect x="850" y="333" width="110" height="34" rx="17" class="inputdata"/>
<text x="905" y="355" font-size="10" text-anchor="middle">Fraudesignaal</text>

<rect x="520" y="460" width="440" height="100" rx="8" class="neutral-light" stroke="#14213D" stroke-width="1"/>
<text x="536" y="484" class="body" font-weight="700">Wat hier verandert</text>
<text x="536" y="504" class="body">Dezelfde vijf criteria, nu als DMN-decision</text>
<text x="536" y="520" class="body">requirements diagram: één decision, vijf input</text>
<text x="536" y="536" class="body">data, aangeroepen door één business rule task.</text>
<text x="536" y="552" class="body">Wijzigt het beleid, dan wijzigt alleen de DRD.</text>

</svg>
