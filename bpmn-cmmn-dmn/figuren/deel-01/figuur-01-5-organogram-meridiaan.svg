<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="'DM Sans', Arial, sans-serif" width="960" height="700" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .navy { fill:#14213D; }
      .blue-dark { fill:#2563A8; }
      .blue-fill { fill:#CFE0F2; }
      .amber-fill { fill:#E9A13B; }
      .amber-light { fill:#FBF6E9; }
      .neutral-light { fill:#EEF2F7; }
      .label-light { font-size:13px; font-weight:700; fill:#FBFAF7; text-anchor:middle; }
      .label { font-size:13px; font-weight:700; fill:#14213D; text-anchor:middle; }
      .body { font-size:11px; fill:#14213D; text-anchor:middle; }
      .sub { font-size:10.5px; fill:#55606F; text-anchor:middle; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:26px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .conn { stroke:#55606F; stroke-width:1.3; fill:none; }
    </style>
</defs>
<rect width="960" height="700" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 01 · ORGANOGRAM (HOOFDLIJNEN)</text>
<text x="40" y="64" class="title">Meridiaan Pensioen N.V. — Klantcontact uitgelicht</text>

<!-- top -->
<rect x="330" y="100" width="300" height="66" rx="10" class="navy"/>
<text x="480" y="126" class="label-light">Meridiaan Pensioen N.V.</text>
<text x="480" y="145" font-size="10.5" fill="#CFE0F2" text-anchor="middle">380.000 deelnemers · ca. 1.200 medewerkers</text>
<text x="480" y="159" font-size="10.5" fill="#CFE0F2" text-anchor="middle">onder toezicht van DNB</text>

<!-- niveau 2 -->
<path d="M480,166 L480,190" class="conn"/>
<path d="M480,190 L160,190 L160,215" class="conn"/>
<path d="M480,190 L320,190 L320,215" class="conn"/>
<path d="M480,190 L480,215" class="conn"/>
<path d="M480,190 L640,190 L640,215" class="conn"/>
<path d="M480,190 L800,190 L800,215" class="conn"/>

<rect x="90" y="216" width="140" height="66" rx="9" fill="#FFFFFF" stroke="#14213D" stroke-width="1.4"/>
<text x="160" y="245" class="label">Pensioenbeheer</text>
<text x="160" y="264" class="sub">aanspraken, uitkeringen</text>

<rect x="250" y="210" width="140" height="78" rx="9" class="amber-fill" stroke="#14213D" stroke-width="2.2"/>
<text x="320" y="238" class="label">Klantcontact</text>
<text x="320" y="256" font-size="10.5" font-weight="700" fill="#14213D" text-anchor="middle">± 90.000 mutaties/jr</text>
<text x="320" y="272" class="sub">uitgelicht in dit figuur</text>

<rect x="410" y="216" width="140" height="66" rx="9" fill="#FFFFFF" stroke="#14213D" stroke-width="1.4"/>
<text x="480" y="245" class="label">Vermogensbeheer</text>
<text x="480" y="264" class="sub">beleggingen, dekking</text>

<rect x="570" y="216" width="140" height="66" rx="9" fill="#FFFFFF" stroke="#14213D" stroke-width="1.4"/>
<text x="640" y="240" class="label">Bedrijfsvoering</text>
<text x="640" y="255" class="label">&amp; IT</text>
<text x="640" y="272" class="sub">systemen, data</text>

<rect x="730" y="216" width="140" height="66" rx="9" fill="#FFFFFF" stroke="#14213D" stroke-width="1.4"/>
<text x="800" y="240" class="label">Compliance</text>
<text x="800" y="255" class="label">&amp; Risk</text>
<text x="800" y="272" class="sub">DNB-toezicht</text>

<!-- niveau 3: onder klantcontact -->
<path d="M320,288 L320,320" class="conn" stroke="#8A5A0E" stroke-width="1.6"/>
<path d="M320,320 L150,320 L150,350" class="conn" stroke="#8A5A0E" stroke-width="1.6"/>
<path d="M320,320 L320,350" class="conn" stroke="#8A5A0E" stroke-width="1.6"/>
<path d="M320,320 L500,320 L500,350" class="conn" stroke="#8A5A0E" stroke-width="1.6"/>

<rect x="60" y="352" width="180" height="100" rx="9" class="blue-fill" stroke="#14213D" stroke-width="1.4"/>
<text x="150" y="378" class="label">Mutaties</text>
<text x="150" y="394" class="sub">(o.a. adreswijziging)</text>
<text x="150" y="418" font-size="10.5" font-weight="700" fill="#14213D" text-anchor="middle">Routinewerk</text>
<text x="150" y="434" class="sub">hoog volume, hoge</text>
<text x="150" y="447" class="sub">automatiseringsgraad</text>

<rect x="260" y="352" width="180" height="100" rx="9" class="neutral-light" stroke="#14213D" stroke-width="1.4"/>
<text x="350" y="378" class="label">Waardeoverdrachten</text>
<text x="350" y="398" font-size="10.5" font-weight="700" fill="#14213D" text-anchor="middle">Deels routine,</text>
<text x="350" y="413" font-size="10.5" font-weight="700" fill="#14213D" text-anchor="middle">deels dossier</text>
<text x="350" y="434" class="sub">overdracht van waarde</text>
<text x="350" y="447" class="sub">tussen pensioenuitvoerders</text>

<rect x="460" y="352" width="180" height="100" rx="9" class="amber-light" stroke="#14213D" stroke-width="1.4"/>
<text x="550" y="378" class="label">Klachten &amp; Bezwaren</text>
<text x="550" y="398" font-size="10.5" font-weight="700" fill="#14213D" text-anchor="middle">Dossierwerk</text>
<text x="550" y="420" class="sub">o.a. klacht over</text>
<text x="550" y="434" class="sub">pensioenberekening</text>
<text x="550" y="447" class="sub">laag volume, hoge complexiteit</text>

<!-- legenda -->
<rect x="60" y="500" width="840" height="90" rx="8" fill="#FFFFFF" stroke="#E3E0D8" stroke-width="1.4"/>
<text x="80" y="524" class="body" text-anchor="start" font-weight="700">Legenda</text>
<rect x="80" y="536" width="18" height="18" rx="3" class="amber-fill" stroke="#14213D" stroke-width="1"/>
<text x="106" y="550" class="body" text-anchor="start">Uitgelicht: afdeling Klantcontact en haar drie soorten mutatiewerk</text>
<rect x="80" y="560" width="18" height="18" rx="3" fill="#FFFFFF" stroke="#14213D" stroke-width="1.4"/>
<text x="106" y="574" class="body" text-anchor="start">Overige onderdelen op hoofdlijnen — niet verder uitgewerkt in dit figuur</text>

<text x="480" y="620" class="sub" font-style="italic">Alle drie de soorten werk uit §1.1 komen samen binnen één afdeling — en op dit moment in één systeem.</text>
</svg>
