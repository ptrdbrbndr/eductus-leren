<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" font-family="'DM Sans', Arial, sans-serif" width="980" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .navy { fill:#14213D; }
      .blue-dark { fill:#2563A8; }
      .blue-fill { fill:#CFE0F2; }
      .amber-fill { fill:#E9A13B; }
      .amber-light { fill:#FBF6E9; }
      .neutral-light { fill:#EEF2F7; }
      .card-body { fill:#FFFFFF; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:15px; font-weight:700; fill:#FBFAF7; text-anchor:middle; }
      .num { font-size:16px; font-weight:700; fill:#FBFAF7; text-anchor:middle; }
      .body { font-size:12px; fill:#14213D; }
      .bodyb { font-size:12.5px; font-weight:700; fill:#14213D; }
      .sub { font-size:11.5px; fill:#55606F; }
      .tag { font-size:11px; fill:#55606F; font-style:italic; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .mkicker { font-size:10.5px; fill:#2563A8; font-weight:700; letter-spacing:.08em; }
      .arrow { stroke:#55606F; stroke-width:1.6; fill:none; marker-end:url(#arr); }
      .dashed { stroke:#8a5a12; stroke-width:1.1; fill:none; stroke-dasharray:4 3; }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
</defs>
<rect width="980" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 30 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Figuur 30.2 — De CBPP-aanvraagprocedure</text>
<text x="40" y="86" class="sub">Vier stappen naar de CBPP-certificering van ABPMP, met wat je onderweg documenteert (§30.2).</text>

<!-- ===================== VIER STAPPEN ===================== -->
<!-- stap 1 -->
<g>
  <rect x="50" y="130" width="200" height="100" rx="10" class="card-body" stroke="#CFE0F2" stroke-width="1.5"/>
  <circle cx="80" cy="150" r="15" class="blue-dark"/>
  <text x="80" y="155" class="num">1</text>
  <text x="105" y="155" class="bodyb">Ervaringseis</text>
  <text x="66" y="180" class="sub">Aantoonbare werkervaring</text>
  <text x="66" y="196" class="sub">in procesmanagement, over</text>
  <text x="66" y="212" class="sub">een minimumperiode.</text>
</g>
<path d="M254,180 L273,180" class="arrow"/>

<!-- stap 2 -->
<g>
  <rect x="277" y="130" width="200" height="100" rx="10" class="card-body" stroke="#CFE0F2" stroke-width="1.5"/>
  <circle cx="307" cy="150" r="15" class="blue-dark"/>
  <text x="307" y="155" class="num">2</text>
  <text x="332" y="155" class="bodyb">Referenties</text>
  <text x="293" y="180" class="sub">Personen die de opgegeven</text>
  <text x="293" y="196" class="sub">werkervaring kunnen</text>
  <text x="293" y="212" class="sub">bevestigen.</text>
</g>
<path d="M481,180 L500,180" class="arrow"/>

<!-- stap 3 -->
<g>
  <rect x="504" y="130" width="200" height="100" rx="10" class="card-body" stroke="#CFE0F2" stroke-width="1.5"/>
  <circle cx="534" cy="150" r="15" class="blue-dark"/>
  <text x="534" y="155" class="num">3</text>
  <text x="559" y="155" class="bodyb">Aanvraag indienen</text>
  <text x="520" y="180" class="sub">Werkervaring + referenties</text>
  <text x="520" y="196" class="sub">samen aangeleverd bij</text>
  <text x="520" y="212" class="sub">ABPMP.</text>
</g>
<path d="M708,180 L727,180" class="arrow"/>

<!-- stap 4 -->
<g>
  <rect x="731" y="130" width="200" height="100" rx="10" class="card-body" stroke="#CFE0F2" stroke-width="1.5"/>
  <circle cx="761" cy="150" r="15" class="blue-dark"/>
  <text x="761" y="155" class="num">4</text>
  <text x="786" y="155" class="bodyb">Examenopzet</text>
  <text x="747" y="180" class="sub">Toetst de CBOK langs</text>
  <text x="747" y="196" class="sub">dezelfde domeinen als</text>
  <text x="747" y="212" class="sub">deze cursus.</text>
</g>

<!-- connectoren omlaag -->
<path d="M150,230 L150,250" class="dashed"/>
<path d="M377,230 L377,250" class="dashed"/>
<path d="M604,230 L604,250" class="dashed"/>
<path d="M831,230 L831,250" class="dashed"/>

<!-- ===================== ONDER STAP 1+2: DOCUMENTATIEKAART ===================== -->
<g>
  <rect x="50" y="252" width="427" height="200" rx="12" class="neutral-light" stroke="#14213D" stroke-width="1"/>
  <text x="70" y="278" class="mkicker">WAT TE DOCUMENTEREN PER PROJECT (§30.2)</text>

  <text x="70" y="304" class="bodyb">Rol</text>
  <text x="70" y="320" class="sub">bijv. proceseigenaar, projectleider, business analist</text>
  <line x1="70" y1="330" x2="457" y2="330" stroke="#CFE0F2" stroke-width="1"/>

  <text x="70" y="352" class="bodyb">Periode</text>
  <text x="70" y="368" class="sub">startmaand – eindmaand van de betrokkenheid</text>
  <line x1="70" y1="378" x2="457" y2="378" stroke="#CFE0F2" stroke-width="1"/>

  <text x="70" y="400" class="bodyb">Verantwoordelijkheid</text>
  <text x="70" y="416" class="sub">korte beschrijving van de verantwoordelijkheid</text>

  <text x="70" y="440" class="tag">Bij voorkeur vanaf nu bijhouden, in plaats van achteraf reconstrueren.</text>
</g>

<!-- ===================== ONDER STAP 3: NOTITIE ===================== -->
<g>
  <rect x="504" y="252" width="200" height="200" rx="12" class="neutral-light" stroke="#14213D" stroke-width="1"/>
  <text x="524" y="278" class="mkicker">BIJ ABPMP</text>
  <text x="524" y="308" class="sub">Overzicht van</text>
  <text x="524" y="324" class="sub">werkervaring en</text>
  <text x="524" y="340" class="sub">referenties samen</text>
  <text x="524" y="356" class="sub">aangeleverd als</text>
  <text x="524" y="372" class="sub">CBPP-aanvraag.</text>
  <rect x="524" y="392" width="160" height="40" rx="6" class="amber-light" stroke="#E9A13B" stroke-width="1"/>
  <text x="604" y="416" class="tag" text-anchor="middle">geen dienstenaanbod — §30.2</text>
</g>

<!-- ===================== ONDER STAP 4: CBOK-DOMEINEN ===================== -->
<g>
  <rect x="731" y="252" width="200" height="200" rx="12" class="neutral-light" stroke="#14213D" stroke-width="1"/>
  <text x="751" y="278" class="mkicker">CBOK — GETOETST IN HET EXAMEN</text>

  <circle cx="757" cy="304" r="4" class="amber-fill"/>
  <text x="770" y="309" class="body">Procesarchitectuur</text>

  <circle cx="757" cy="332" r="4" class="amber-fill"/>
  <text x="770" y="337" class="body">Procesontwerp</text>

  <circle cx="757" cy="360" r="4" class="amber-fill"/>
  <text x="770" y="365" class="body">Procesbeheersing</text>

  <circle cx="757" cy="388" r="4" class="amber-fill"/>
  <text x="770" y="393" class="body">Veranderdomein</text>

  <text x="751" y="420" class="sub">= procesarchitectuur, -ontwerp,</text>
  <text x="751" y="436" class="sub">-beheersing en het veranderdomein.</text>
</g>

<!-- ===================== BANNER ===================== -->
<rect x="50" y="480" width="881" height="50" rx="10" class="amber-light" stroke="#E9A13B" stroke-width="1.3"/>
<text x="490" y="501" class="bodyb" text-anchor="middle">Reconstructie achteraf is beduidend lastiger dan lopend bijhouden.</text>
<text x="490" y="518" class="sub" text-anchor="middle">Begin nu met documenteren — ook als de CBPP-aanvraag nog ver weg lijkt (§30.2).</text>

</svg>
