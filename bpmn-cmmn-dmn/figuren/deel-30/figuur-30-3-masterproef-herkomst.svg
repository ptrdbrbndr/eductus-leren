<path d="M660.0,265.9 L582.4,326.2" class="arrow2"/>
<path d="M701.7,447.9 L625.9,431.0" class="arrow2"/>
<path d="M585.3,593.8 L526.3,475.4" class="arrow2"/>
<path d="M396.7,593.8 L453.7,475.4" class="arrow2"/>
<path d="M280.3,447.9 L354.1,431.0" class="arrow2"/>
<path d="M322.0,265.9 L397.6,326.2" class="arrow2"/>

<!-- ===================== HUB ===================== -->
<g>
  <rect x="360" y="330" width="260" height="140" rx="16" class="amber-fill" stroke="#14213D" stroke-width="1.6"/>
  <text x="490" y="372" class="hubkicker">MASTERPROEF</text>
  <text x="490" y="398" class="hubtitle">Bestuursnotitie</text>
