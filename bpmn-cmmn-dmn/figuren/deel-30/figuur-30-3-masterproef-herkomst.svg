<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 780" font-family="'DM Sans', Arial, sans-serif" width="980" height="780" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .navy { fill:#14213D; }
      .blue-dark { fill:#2563A8; }
      .blue-fill { fill:#CFE0F2; }
      .amber-fill { fill:#E9A13B; }
      .amber-light { fill:#FBF6E9; }
      .neutral-light { fill:#EEF2F7; }
      .card-body { fill:#FFFFFF; }
      .body { font-size:12px; fill:#14213D; }
      .bodyb { font-size:13px; font-weight:700; fill:#14213D; text-anchor:middle; }
      .sub { font-size:11px; fill:#55606F; text-anchor:middle; }
      .tag { font-size:11px; fill:#55606F; font-style:italic; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .mkicker { font-size:10.5px; fill:#2563A8; font-weight:700; letter-spacing:.08em; text-anchor:middle; }
      .hubkicker { font-size:11px; fill:#14213D; font-weight:700; letter-spacing:.1em; text-anchor:middle; }
      .hubtitle { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; text-anchor:middle; }
      .hubsub { font-size:13px; fill:#14213D; text-anchor:middle; }
      .hubtag { font-size:11px; fill:#14213D; font-style:italic; text-anchor:middle; }
      .arrow2 { stroke:#14213D; stroke-width:1.5; fill:none; marker-end:url(#arrnavy); }
    </style>
    <marker id="arrnavy" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#14213D"/></marker>
</defs>
<rect width="980" height="780" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 30 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Figuur 30.3 — De masterproef-onderdelen en hun herkomst</text>
<text x="40" y="86" class="sub" text-anchor="start">Zeven onderdelen uit deel 23 t/m 29, gebundeld tot één bestuursnotitie voor de raad van bestuur (§30.4).</text>

<!-- ===================== PIJLEN NAAR HUB (eerst, zodat kaarten erover heen liggen) ===================== -->
