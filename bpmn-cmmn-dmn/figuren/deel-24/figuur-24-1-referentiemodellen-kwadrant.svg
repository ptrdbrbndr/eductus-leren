<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" font-family="'DM Sans', Arial, sans-serif" width="980" height="640" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .panel { fill:#FFFFFF; stroke:#E3E0D8; stroke-width:1.5; }
      .row-a { fill:#EEF2F7; }
      .row-b { fill:#FFFFFF; }
      .row-line { stroke:#E3E0D8; stroke-width:1; }
      .axis { stroke:#14213D; stroke-width:1.5; }
      .rowlabel { font-size:12.5px; font-weight:700; fill:#14213D; }
      .rowsub { font-size:10.5px; fill:#55606F; }
      .axislabel { font-size:11.5px; font-weight:700; fill:#55606F; letter-spacing:.04em; }
      .dot-generic { fill:#CFE0F2; stroke:#2563A8; stroke-width:1.8; }
      .dot-sector { fill:#2563A8; stroke:#14213D; stroke-width:1.2; }
      .dot-amber { fill:#E9A13B; stroke:#14213D; stroke-width:1.6; }
      .modlabel { font-size:12.5px; font-weight:700; fill:#14213D; }
      .modsub { font-size:10px; fill:#55606F; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .sub { font-size:12px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .zone { fill:#FBF6E9; stroke:#E9A13B; stroke-width:1.4; stroke-dasharray:5 3; }
      .zonelabel { font-size:10.5px; font-weight:700; fill:#8a5a12; }
      .callout { fill:#FFFFFF; stroke:#14213D; stroke-width:1.2; }
      .calltext { font-size:10.5px; fill:#14213D; }
    </style>
</defs>
<rect width="980" height="640" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 24 · CONCEPTDIAGRAM</text>
<text x="40" y="62" class="title">Figuur 24.1 — Referentiemodellen naar bereik en sector</text>
<text x="40" y="82" class="sub">Horizontale as: bereik van het model. Rijen: sector van herkomst. Amber = het startpunt voor Meridiaan.</text>

<!-- main panel -->
<rect x="40" y="105" width="900" height="470" class="panel" rx="4"/>

<!-- rows: generic-overstijgend / logistiek / telecom / bank / verzekering -->
<!-- row geometry: x from 220 to 900, y rows of 78px starting 120 -->
<g>
  <rect x="220" y="120" width="680" height="78" class="row-a"/>
  <rect x="220" y="198" width="680" height="78" class="row-b"/>
  <rect x="220" y="276" width="680" height="78" class="row-a"/>
  <rect x="220" y="354" width="680" height="78" class="row-b"/>
  <rect x="220" y="432" width="680" height="78" class="row-a"/>
</g>
<line x1="220" y1="120" x2="220" y2="510" class="axis"/>
<line x1="220" y1="510" x2="900" y2="510" class="axis"/>

<!-- row labels -->
<text x="60" y="163" class="rowlabel">Sector-overstijgend</text>
<text x="60" y="179" class="rowsub">generiek raamwerk</text>

<text x="60" y="241" class="rowlabel">Logistiek</text>
<text x="60" y="257" class="rowsub">keten &amp; supply chain</text>

<text x="60" y="319" class="rowlabel">Telecom</text>
<text x="60" y="335" class="rowsub">operationeel &amp; beheer</text>

<text x="60" y="397" class="rowlabel">Financieel — bank</text>
<text x="60" y="413" class="rowsub">bankprocessen</text>

<text x="60" y="475" class="rowlabel">Financieel — verzekering</text>
<text x="60" y="491" class="rowsub">verzekeringsprocessen</text>

<!-- x-axis labels -->
<text x="260" y="533" class="axislabel">← GENERIEK, BREED TOEPASBAAR</text>
<text x="700" y="533" class="axislabel" text-anchor="end">SECTOR-SPECIFIEK →</text>

<!-- pensioen zone spanning bank + verzekering rows -->
<rect x="620" y="354" width="220" height="156" class="zone" rx="4"/>
<text x="630" y="370" class="zonelabel">pensioenuitvoering zit hier</text>
<text x="630" y="384" class="zonelabel">tussen — geen exacte match (§24.3)</text>

<!-- APQC PCF: generic row, far left -->
<circle cx="270" cy="159" r="15" class="dot-amber"/>
<text x="295" y="155" class="modlabel">APQC PCF</text>
<text x="295" y="170" class="modsub">Meridiaan's startpunt (§24.2)</text>

<!-- SCOR: logistiek row, mid-right (sector-bound) -->
<circle cx="760" cy="237" r="13" class="dot-sector"/>
<text x="785" y="233" class="modlabel">SCOR</text>
<text x="785" y="248" class="modsub">illustratief, niet direct bruikbaar</text>

<!-- eTOM: telecom row, mid-right -->
<circle cx="760" cy="315" r="13" class="dot-sector"/>
<text x="785" y="311" class="modlabel">eTOM</text>
<text x="785" y="326" class="modsub">illustratief, niet direct bruikbaar</text>

<!-- BIAN: bank row, right -->
<circle cx="700" cy="393" r="13" class="dot-sector"/>
<text x="640" y="410" class="modlabel" text-anchor="end">BIAN</text>
<text x="640" y="424" class="modsub" text-anchor="end">bouwstenen bruikbaar</text>

<!-- ACORD: verzekering row, right -->
<circle cx="700" cy="471" r="13" class="dot-sector"/>
<text x="640" y="488" class="modlabel" text-anchor="end">ACORD</text>
<text x="640" y="502" class="modsub" text-anchor="end">bouwstenen bruikbaar</text>

<!-- legend -->
<rect x="700" y="120" width="200" height="66" class="callout" rx="4"/>
<circle cx="716" cy="136" r="8" class="dot-amber"/>
<text x="730" y="140" class="calltext">generiek startpunt, Meridiaan</text>
<circle cx="716" cy="156" r="7" class="dot-sector"/>
<text x="730" y="160" class="calltext">sectoraal, geen exacte match</text>
<rect x="710" y="168" width="14" height="10" class="zone"/>
<text x="730" y="177" class="calltext">pensioen: tussen bank/verzekering</text>

</svg>
