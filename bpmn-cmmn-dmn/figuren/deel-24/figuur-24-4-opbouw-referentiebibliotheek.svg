<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 660" font-family="'DM Sans', Arial, sans-serif" width="940" height="660" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .step { stroke:#14213D; stroke-width:1.6; }
      .step1 { fill:#EEF2F7; }
      .step2 { fill:#CFE0F2; }
      .step3 { fill:#6FA3D6; }
      .step4 { fill:#2563A8; }
      .steplabel-dark { font-size:14px; font-weight:700; fill:#14213D; }
      .steplabel-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .stepsub-dark { font-size:11px; fill:#55606F; }
      .stepsub-light { font-size:11px; fill:#EEF2F7; }
      .stepnum { font-size:20px; font-weight:700; fill:#14213D; font-family:'Cormorant Garamond', Georgia, serif; }
      .stepnum-light { font-size:20px; font-weight:700; fill:#FBFAF7; font-family:'Cormorant Garamond', Georgia, serif; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .instance { fill:#FFFFFF; stroke:#CFE0F2; stroke-width:1.3; }
      .instlabel { font-size:9.5px; fill:#55606F; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .sub { font-size:12px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .amber-note { fill:#FBF6E9; stroke:#E9A13B; stroke-width:1.4; }
      .notetext { font-size:11px; fill:#8a5a12; font-weight:700; }
      .notetext2 { font-size:10.5px; fill:#55606F; }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
</defs>
<rect width="940" height="660" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 24 · CONCEPTDIAGRAM</text>
<text x="40" y="62" class="title">Figuur 24.4 — Van terugkerend patroon naar bouwsteen</text>
<text x="40" y="82" class="sub">Opbouw van een eigen referentiebibliotheek voor Meridiaan (§24.6), onderaan breed, bovenaan smal.</text>

<!-- Stap 0: losse gemodelleerde processen (instances) -->
<text x="40" y="128" class="steplabel-dark">Uitgangspunt</text>
<text x="40" y="144" class="stepsub-dark">meerdere reeds gemodelleerde processen bij Meridiaan</text>
<g>
  <rect x="60" y="158" width="90" height="40" rx="6" class="instance"/>
  <text x="105" y="176" text-anchor="middle" class="instlabel">Aanvraag WO</text>
  <text x="105" y="189" text-anchor="middle" class="instlabel">(werkgever A)</text>

  <rect x="170" y="158" width="90" height="40" rx="6" class="instance"/>
  <text x="215" y="176" text-anchor="middle" class="instlabel">Aanvraag WO</text>
  <text x="215" y="189" text-anchor="middle" class="instlabel">(uitvoerder B)</text>

  <rect x="280" y="158" width="90" height="40" rx="6" class="instance"/>
  <text x="325" y="176" text-anchor="middle" class="instlabel">Bezwaar-</text>
  <text x="325" y="189" text-anchor="middle" class="instlabel">afhandeling</text>

  <rect x="390" y="158" width="90" height="40" rx="6" class="instance"/>
  <text x="435" y="176" text-anchor="middle" class="instlabel">Deelnemer-</text>
  <text x="435" y="189" text-anchor="middle" class="instlabel">identificatie</text>

  <rect x="500" y="158" width="90" height="40" rx="6" class="instance"/>
  <text x="545" y="176" text-anchor="middle" class="instlabel">Gegevens-</text>
  <text x="545" y="189" text-anchor="middle" class="instlabel">validatie</text>

  <rect x="610" y="158" width="90" height="40" rx="6" class="instance"/>
  <text x="655" y="176" text-anchor="middle" class="instlabel">Klantcontact-</text>
  <text x="655" y="189" text-anchor="middle" class="instlabel">registratie</text>

  <rect x="720" y="158" width="90" height="40" rx="6" class="instance"/>
  <text x="765" y="176" text-anchor="middle" class="instlabel">Uitkerings-</text>
  <text x="765" y="189" text-anchor="middle" class="instlabel">berekening</text>
</g>

<line x1="435" y1="198" x2="435" y2="225" class="arrow"/>

<!-- Trapezoid funnel steps (wide bottom, narrow top visually stacked top-to-bottom as steps 1..4) -->
<!-- Step 1: herkende patronen (widest) -->
<polygon points="120,230 750,230 690,300 180,300" class="step step1 step"/>
<text x="435" y="255" text-anchor="middle" class="stepnum">1</text>
<text x="435" y="275" text-anchor="middle" class="steplabel-dark">Terugkerend patroon herkend</text>
<text x="435" y="292" text-anchor="middle" class="stepsub-dark">zelfde structuur duikt op in meerdere gemodelleerde processen</text>

<line x1="435" y1="300" x2="435" y2="322" class="arrow"/>

<!-- Step 2: gegeneraliseerd -->
<polygon points="195,325 675,325 625,390 245,390" class="step step2 step"/>
<text x="435" y="348" text-anchor="middle" class="stepnum">2</text>
<text x="435" y="368" text-anchor="middle" class="steplabel-dark">Gegeneraliseerd</text>
<text x="435" y="384" text-anchor="middle" class="stepsub-dark">organisatie-specifieke details losgelaten, kern behouden</text>

<line x1="435" y1="390" x2="435" y2="412" class="arrow"/>

<!-- Step 3: gedocumenteerd + genoemd -->
<polygon points="255,415 615,415 575,480 295,480" class="step step3 step"/>
<text x="435" y="438" text-anchor="middle" class="stepnum-light">3</text>
<text x="435" y="458" text-anchor="middle" class="steplabel-light">Gedocumenteerd en benoemd</text>
<text x="435" y="474" text-anchor="middle" class="stepsub-light">eigen naam, toepassingsvoorwaarden, eigenaar</text>

<line x1="435" y1="480" x2="435" y2="502" class="arrow"/>

<!-- Step 4: bouwsteen in bibliotheek (narrowest) -->
<polygon points="325,505 545,505 515,570 355,570" class="step step4 step"/>
<text x="435" y="530" text-anchor="middle" class="stepnum-light">4</text>
<text x="435" y="550" text-anchor="middle" class="steplabel-light">Bouwsteen in bibliotheek</text>
<text x="435" y="564" text-anchor="middle" class="stepsub-light" style="font-size:10px">herbruikbaar, vindbaar, onderhouden</text>

<!-- side note on maintenance -->
<rect x="590" y="500" width="310" height="90" class="amber-note" rx="6"/>
<text x="608" y="522" class="notetext">Onderhouden (§24.6)</text>
<text x="608" y="542" class="notetext2">Een bibliotheek die niet wordt bijgehouden,</text>
<text x="608" y="557" class="notetext2">veroudert net zo snel als een referentiemodel</text>
<text x="608" y="572" class="notetext2">dat niet getailord wordt.</text>

<text x="40" y="620" class="stepsub-dark" style="font-size:11px">Vergelijk het hybride referentiemodel uit deel 18, §18.5 — daar op procesniveau, hier op ondernemingsniveau.</text>

</svg>
