<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="'DM Sans', Arial, sans-serif" width="960" height="600" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .panel { fill:#FFFFFF; stroke:#E3E0D8; stroke-width:1.5; }
      .axis { stroke:#14213D; stroke-width:1.5; }
      .gridline { stroke:#E3E0D8; stroke-width:1; }
      .bar-reuse { fill:#2563A8; }
      .bar-new { fill:#CFE0F2; stroke:#6FA3D6; stroke-width:1; }
      .barlabel { font-size:12px; font-weight:700; fill:#FBFAF7; }
      .barlabel-dark { font-size:12px; font-weight:700; fill:#14213D; }
      .axistick { font-size:10.5px; fill:#55606F; }
      .periodlabel { font-size:12.5px; font-weight:700; fill:#14213D; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .sub { font-size:12px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .legendtext { font-size:11.5px; fill:#14213D; }
      .callout { fill:#FBF6E9; stroke:#E9A13B; stroke-width:1.4; }
      .calltitle { font-size:11.5px; font-weight:700; fill:#8a5a12; }
      .calltext { font-size:10.8px; fill:#55606F; }
    </style>
</defs>
<rect width="960" height="600" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 24 · CONCEPTDIAGRAM</text>
<text x="40" y="62" class="title">Figuur 24.5 — Hergebruikmeting van de referentiebibliotheek</text>
<text x="40" y="82" class="sub">Welk deel van nieuwe modellen komt uit de bibliotheek, versus opnieuw ontworpen (§24.6)?</text>

<rect x="40" y="105" width="880" height="400" class="panel" rx="4"/>

<!-- y-axis gridlines 0/25/50/75/100 -->
<g>
  <line x1="120" y1="450" x2="860" y2="450" class="axis"/>
  <line x1="120" y1="130" x2="120" y2="450" class="axis"/>
  <line x1="120" y1="370" x2="860" y2="370" class="gridline"/>
  <line x1="120" y1="290" x2="860" y2="290" class="gridline"/>
  <line x1="120" y1="210" x2="860" y2="210" class="gridline"/>
  <line x1="120" y1="130" x2="860" y2="130" class="gridline"/>
  <text x="108" y="454" text-anchor="end" class="axistick">0%</text>
  <text x="108" y="374" text-anchor="end" class="axistick">25%</text>
  <text x="108" y="294" text-anchor="end" class="axistick">50%</text>
  <text x="108" y="214" text-anchor="end" class="axistick">75%</text>
  <text x="108" y="134" text-anchor="end" class="axistick">100%</text>
</g>

<!-- four stacked bars: bibliotheek start, na 6 mnd, na 12 mnd, na 18 mnd -->
<!-- bar 1: 10% reuse -->
<g>
  <rect x="180" y="418" width="120" height="32" class="bar-reuse"/>
  <rect x="180" y="130" width="120" height="288" class="bar-new"/>
  <text x="240" y="440" text-anchor="middle" class="barlabel">10%</text>
  <text x="240" y="270" text-anchor="middle" class="barlabel-dark">90% opnieuw ontworpen</text>
  <text x="240" y="470" text-anchor="middle" class="periodlabel">Bibliotheek net</text>
  <text x="240" y="486" text-anchor="middle" class="periodlabel">gestart</text>
</g>

<!-- bar 2: 28% reuse -->
<g>
  <rect x="360" y="360" width="120" height="90" class="bar-reuse"/>
  <text x="420" y="382" text-anchor="middle" class="barlabel">28%</text>
  <rect x="360" y="130" width="120" height="230" class="bar-new"/>
  <text x="420" y="250" text-anchor="middle" class="barlabel-dark">72% opnieuw ontworpen</text>
  <text x="420" y="470" text-anchor="middle" class="periodlabel">Na 6 maanden</text>
</g>

<!-- bar 3: 47% reuse -->
<g>
  <rect x="540" y="298" width="120" height="152" class="bar-reuse"/>
  <text x="600" y="330" text-anchor="middle" class="barlabel">47%</text>
  <rect x="540" y="130" width="120" height="168" class="bar-new"/>
  <text x="600" y="220" text-anchor="middle" class="barlabel-dark">53% opnieuw</text>
  <text x="600" y="470" text-anchor="middle" class="periodlabel">Na 12 maanden</text>
</g>

<!-- bar 4: 61% reuse -->
<g>
  <rect x="720" y="255" width="120" height="195" class="bar-reuse"/>
  <text x="780" y="290" text-anchor="middle" class="barlabel">61%</text>
  <rect x="720" y="130" width="120" height="125" class="bar-new"/>
  <text x="780" y="195" text-anchor="middle" class="barlabel-dark">39% opnieuw</text>
  <text x="780" y="470" text-anchor="middle" class="periodlabel">Na 18 maanden</text>
</g>

<!-- legend -->
<rect x="640" y="115" width="16" height="16" class="bar-reuse"/>
<text x="662" y="128" class="legendtext">uit bibliotheek hergebruikt</text>
<rect x="640" y="135" width="16" height="16" class="bar-new"/>
<text x="662" y="148" class="legendtext">opnieuw ontworpen</text>

<!-- callout -->
<rect x="40" y="520" width="880" height="65" class="callout" rx="6"/>
<text x="60" y="542" class="calltitle">Waarom meten (§24.6)</text>
<text x="60" y="560" class="calltext">Een bibliotheek die niemand hergebruikt, is duur ontwerpwerk zonder rendement — ongeacht hoe elegant hij is.</text>
<text x="60" y="576" class="calltext">Een stijgende lijn (zoals hierboven) toont dat de bibliotheek daadwerkelijk wordt geraadpleegd, niet alleen gevuld.</text>

</svg>
