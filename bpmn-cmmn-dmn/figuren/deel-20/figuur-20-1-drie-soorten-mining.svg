<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" font-family="'DM Sans', Arial, sans-serif" width="1080" height="560" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    .colcard { fill:#FFFFFF; stroke:#E3E0D8; stroke-width:1.3; }
    .colcard-hi { fill:#FBF6E9; stroke:#E9A13B; stroke-width:2.6; }
    .colhead { font-size:15px; font-weight:700; fill:#14213D; }
    .colhead-hi { font-size:15px; font-weight:700; fill:#14213D; }
    .sub { font-size:10.6px; fill:#55606F; }
    .box { fill:#EEF2F7; stroke:#14213D; stroke-width:1.3; }
    .box-blue { fill:#CFE0F2; stroke:#2563A8; stroke-width:1.6; }
    .box-lbl { font-size:11px; fill:#14213D; font-weight:600; }
    .arrow { stroke:#55606F; stroke-width:1.6; fill:none; marker-end:url(#arr6); }
    .badge { font-size:9.6px; fill:#7A5A16; }
    .tag { fill:#E9A13B; }
  </style>
  <marker id="arr6" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#55606F"/></marker>
</defs>
<rect width="1080" height="560" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 20 · FIGUUR 20.1 · OVERZICHT</text>
<text x="40" y="64" class="title">De drie soorten procesmining, conformance checking uitgelicht</text>

<!-- DISCOVERY -->
<g transform="translate(40,100)">
  <rect x="0" y="0" width="300" height="400" rx="10" class="colcard"/>
  <text x="20" y="34" class="colhead">Discovery</text>
  <text x="20" y="52" class="sub">nog geen model — leid het af uit data</text>

  <rect x="30" y="90" width="240" height="46" rx="8" class="box"/>
  <text x="150" y="118" text-anchor="middle" class="box-lbl">Event log</text>
  <path d="M150,136 L150,176" class="arrow"/>
  <text x="164" y="160" class="sub" font-style="italic">algoritme</text>
  <rect x="30" y="176" width="240" height="46" rx="8" class="box-blue"/>
  <text x="150" y="204" text-anchor="middle" class="box-lbl">Afgeleid procesmodel</text>

  <text x="20" y="270" class="sub">Nuttig wanneer er nog geen</text>
  <text x="20" y="286" class="sub">model bestaat om tegen af te</text>
  <text x="20" y="302" class="sub">zetten.</text>
  <text x="20" y="330" class="sub" font-weight="700">Niveau 3, deel 25 — verdieping.</text>
</g>

<!-- CONFORMANCE (highlighted) -->
<g transform="translate(370,88)">
  <rect x="0" y="0" width="340" height="424" rx="10" class="colcard-hi"/>
  <text x="20" y="36" class="colhead-hi">Conformance checking</text>
  <text x="20" y="54" class="sub">onderwerp van dit deel</text>

  <rect x="20" y="90" width="130" height="46" rx="8" class="box-blue"/>
  <text x="85" y="118" text-anchor="middle" class="box-lbl">Model</text>
  <rect x="190" y="90" width="130" height="46" rx="8" class="box"/>
  <text x="255" y="118" text-anchor="middle" class="box-lbl">Event log</text>

  <path d="M85,136 L150,186" class="arrow"/>
  <path d="M255,136 L190,186" class="arrow"/>

  <rect x="60" y="186" width="220" height="46" rx="8" fill="#E9A13B"/>
  <text x="170" y="214" text-anchor="middle" class="box-lbl" fill="#14213D" font-weight="700">Vergelijking</text>

  <path d="M170,232 L170,270" class="arrow"/>
  <rect x="40" y="270" width="260" height="72" rx="8" class="box"/>
  <text x="170" y="292" text-anchor="middle" class="box-lbl">Fitness · ontbrekende stappen</text>
  <text x="170" y="308" text-anchor="middle" class="box-lbl">toegevoegde stappen · volgorde</text>
  <text x="170" y="326" text-anchor="middle" class="sub">(§20.4)</text>

  <text x="20" y="374" class="sub">Legt een bestaand model naast de</text>
  <text x="20" y="390" class="sub">werkelijke data en stelt de afwijkingen vast.</text>
  <text x="20" y="408" class="sub" font-weight="700">Voor wie al modellen heeft gemaakt.</text>
</g>

<!-- ENHANCEMENT -->
<g transform="translate(740,100)">
  <rect x="0" y="0" width="300" height="400" rx="10" class="colcard"/>
  <text x="20" y="34" class="colhead">Enhancement</text>
  <text x="20" y="52" class="sub">verrijk een bestaand model met data</text>

  <rect x="30" y="90" width="110" height="46" rx="8" class="box-blue"/>
  <text x="85" y="118" text-anchor="middle" class="box-lbl">Model</text>
  <rect x="160" y="90" width="110" height="46" rx="8" class="box"/>
  <text x="215" y="118" text-anchor="middle" class="box-lbl">Event log</text>
  <path d="M85,136 L150,176" class="arrow"/>
  <path d="M215,136 L180,176" class="arrow"/>

  <rect x="30" y="176" width="240" height="56" rx="8" class="box-blue"/>
  <text x="150" y="200" text-anchor="middle" class="box-lbl">Verrijkt model</text>
  <text x="150" y="216" text-anchor="middle" class="sub">bv. gem. doorlooptijd per stap</text>

  <text x="20" y="270" class="sub">Het model klopt al (of is met</text>
  <text x="20" y="286" class="sub">conformance bevestigd) — hier</text>
  <text x="20" y="302" class="sub">voeg je er cijfers aan toe.</text>
  <text x="20" y="330" class="sub" font-weight="700">Niveau 3, deel 25 — verdieping.</text>
</g>

<text x="40" y="536" class="sub">Dit deel richt zich uitsluitend op conformance checking (§20.1) — de meest directe toepassing voor wie al een to-be model heeft.</text>
</svg>
