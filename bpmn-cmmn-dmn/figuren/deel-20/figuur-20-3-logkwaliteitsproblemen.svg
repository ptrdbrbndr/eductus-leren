<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" font-family="'DM Sans', Arial, sans-serif" width="1120" height="700" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    .hcell { fill:#2563A8; }
    .hlbl { font-size:11.5px; fill:#FBFAF7; font-weight:700; }
    .cell { fill:#FFFFFF; stroke:#CFE0F2; stroke-width:1; }
    .cell-alt { fill:#EEF2F7; stroke:#CFE0F2; stroke-width:1; }
    .cell-bad { fill:#FBF6E9; stroke:#E9A13B; stroke-width:1.8; }
    .val { font-size:10.4px; fill:#14213D; font-family:'DM Sans', monospace; }
    .num { fill:#E9A13B; }
    .numtxt { font-size:11px; fill:#14213D; font-weight:800; }
    .call { fill:#FFFFFF; stroke:#E9A13B; stroke-width:1.4; }
    .call-h { font-size:11px; font-weight:700; fill:#14213D; }
    .call-b { font-size:10.2px; fill:#14213D; }
    .leader { stroke:#E9A13B; stroke-width:1.3; stroke-dasharray:3 2; fill:none; }
  </style>
</defs>
<rect width="1120" height="700" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 20 · FIGUUR 20.3 · VOORBEELDLOG MET FOUTEN</text>
<text x="40" y="64" class="title">Vier logkwaliteitsproblemen gemarkeerd in een voorbeeldlog</text>
<text x="40" y="86" class="call-b" fill="#55606F">Logperiode van dit uittreksel: 2026-03-01 t/m 2026-03-31.</text>

<g transform="translate(40,110)">
  <rect x="0" y="0" width="150" height="34" class="hcell"/><text x="75" y="22" text-anchor="middle" class="hlbl">Case-ID</text>
  <rect x="150" y="0" width="240" height="34" class="hcell"/><text x="270" y="22" text-anchor="middle" class="hlbl">Activiteit</text>
  <rect x="390" y="0" width="180" height="34" class="hcell"/><text x="480" y="22" text-anchor="middle" class="hlbl">Tijdstempel</text>
  <rect x="570" y="0" width="140" height="34" class="hcell"/><text x="640" y="22" text-anchor="middle" class="hlbl">Resource</text>

  <!-- row: normal -->
  <g font-size="10.4">
    <rect x="0" y="34" width="150" height="32" class="cell"/><text x="10" y="55" class="val">MUT-08841</text>
    <rect x="150" y="34" width="240" height="32" class="cell"/><text x="160" y="55" class="val">Aanvraag ontvangen</text>
    <rect x="390" y="34" width="180" height="32" class="cell"/><text x="400" y="55" class="val">2026-03-02 09:14</text>
    <rect x="570" y="34" width="140" height="32" class="cell"/><text x="580" y="55" class="val">systeem</text>

    <!-- PROBLEM 1: naamgevingsverschil -->
    <rect x="0" y="66" width="150" height="32" class="cell-alt"/><text x="10" y="87" class="val">MUT-08841</text>
    <rect x="150" y="66" width="240" height="32" class="cell-bad"/><text x="160" y="87" class="val">STEP_04_VALID</text>
    <rect x="390" y="66" width="180" height="32" class="cell-alt"/><text x="400" y="87" class="val">2026-03-02 09:41</text>
    <rect x="570" y="66" width="140" height="32" class="cell-alt"/><text x="580" y="87" class="val">J. Peters</text>
    <circle cx="365" cy="82" r="10" class="num"/><text x="365" y="86" text-anchor="middle" class="numtxt" fill="#FBFAF7">1</text>

    <!-- PROBLEM 2: onjuiste tijdstempel (eerder dan vorige regel) -->
    <rect x="0" y="98" width="150" height="32" class="cell"/><text x="10" y="119" class="val">MUT-08841</text>
    <rect x="150" y="98" width="240" height="32" class="cell"/><text x="160" y="119" class="val">Aanvraag beoordelen</text>
    <rect x="390" y="98" width="180" height="32" class="cell-bad"/><text x="400" y="119" class="val">2026-03-02 09:38</text>
    <rect x="570" y="98" width="140" height="32" class="cell"/><text x="580" y="119" class="val">J. Peters</text>
    <circle cx="480" cy="114" r="10" class="num"/><text x="480" y="118" text-anchor="middle" class="numtxt" fill="#FBFAF7">2</text>

    <!-- normal end -->
    <rect x="0" y="130" width="150" height="32" class="cell-alt"/><text x="10" y="151" class="val">MUT-08841</text>
    <rect x="150" y="130" width="240" height="32" class="cell-alt"/><text x="160" y="151" class="val">Mutatie verwerkt</text>
    <rect x="390" y="130" width="180" height="32" class="cell-alt"/><text x="400" y="151" class="val">2026-03-02 14:02</text>
    <rect x="570" y="130" width="140" height="32" class="cell-alt"/><text x="580" y="151" class="val">systeem</text>

    <!-- PROBLEM 3: ontbrekend event (gat tussen ontvangst en direct verwerkt) -->
    <rect x="0" y="162" width="150" height="32" class="cell"/><text x="10" y="183" class="val">MUT-08855</text>
    <rect x="150" y="162" width="240" height="32" class="cell"/><text x="160" y="183" class="val">Aanvraag ontvangen</text>
    <rect x="390" y="162" width="180" height="32" class="cell"/><text x="400" y="183" class="val">2026-03-05 08:20</text>
    <rect x="570" y="162" width="140" height="32" class="cell"/><text x="580" y="183" class="val">systeem</text>

    <rect x="0" y="194" width="150" height="32" fill="none" stroke="#E9A13B" stroke-width="1.6" stroke-dasharray="4 3"/><text x="10" y="215" class="val" fill="#7A5A16">MUT-08855</text>
    <rect x="150" y="194" width="240" height="32" class="cell-bad"/><text x="160" y="215" class="val" fill="#7A5A16">( geen beoordelingsstap )</text>
    <rect x="390" y="194" width="180" height="32" fill="none" stroke="#E9A13B" stroke-width="1.6" stroke-dasharray="4 3"/><text x="400" y="215" class="val" fill="#7A5A16">—</text>
    <rect x="570" y="194" width="140" height="32" fill="none" stroke="#E9A13B" stroke-width="1.6" stroke-dasharray="4 3"/><text x="580" y="215" class="val" fill="#7A5A16">—</text>
    <circle cx="270" cy="210" r="10" class="num"/><text x="270" y="214" text-anchor="middle" class="numtxt" fill="#FBFAF7">3</text>

    <rect x="0" y="226" width="150" height="32" class="cell-alt"/><text x="10" y="247" class="val">MUT-08855</text>
    <rect x="150" y="226" width="240" height="32" class="cell-alt"/><text x="160" y="247" class="val">Mutatie verwerkt</text>
    <rect x="390" y="226" width="180" height="32" class="cell-alt"/><text x="400" y="247" class="val">2026-03-05 08:24</text>
    <rect x="570" y="226" width="140" height="32" class="cell-alt"/><text x="580" y="247" class="val">systeem</text>

    <!-- PROBLEM 4: grensoverschrijdende case -->
    <rect x="0" y="258" width="150" height="32" class="cell-bad"/><text x="10" y="279" class="val" fill="#7A5A16">MUT-08801</text>
    <rect x="150" y="258" width="240" height="32" class="cell"/><text x="160" y="279" class="val">Aanvulling ontvangen</text>
    <rect x="390" y="258" width="180" height="32" class="cell-bad"/><text x="400" y="279" class="val" fill="#7A5A16">2026-03-01 07:55</text>
    <rect x="570" y="258" width="140" height="32" class="cell"/><text x="580" y="279" class="val">systeem</text>
    <circle cx="75" cy="274" r="10" class="num"/><text x="75" y="278" text-anchor="middle" class="numtxt" fill="#FBFAF7">4</text>
  </g>
</g>

<!-- callouts -->
<g transform="translate(40,420)">
  <rect x="0" y="0" width="255" height="120" rx="8" class="call"/>
  <circle cx="20" cy="20" r="10" class="num"/><text x="20" y="24" text-anchor="middle" class="numtxt" fill="#FBFAF7">1</text>
  <text x="38" y="24" class="call-h">Naamgevingsverschil</text>
  <text x="14" y="46" class="call-b">Systeem logt "STEP_04_VALID", het</text>
  <text x="14" y="62" class="call-b">model toont "Volledigheid controleren".</text>
  <text x="14" y="80" class="call-b">Zonder mapping: valse afwijkingen</text>
  <text x="14" y="96" class="call-b">die niets met de werkelijkheid te</text>
  <text x="14" y="112" class="call-b">maken hebben.</text>

  <rect x="275" y="0" width="255" height="120" rx="8" class="call"/>
  <circle cx="295" cy="20" r="10" class="num"/><text x="295" y="24" text-anchor="middle" class="numtxt" fill="#FBFAF7">2</text>
  <text x="313" y="24" class="call-h">Onjuiste tijdstempel</text>
  <text x="289" y="46" class="call-b">09:38 ligt vóór de voorgaande regel</text>
  <text x="289" y="62" class="call-b">(09:41) — een systeem dat verwer-</text>
  <text x="289" y="78" class="call-b">kingstijd logt in plaats van het</text>
  <text x="289" y="94" class="call-b">werkelijke moment husselt de</text>
  <text x="289" y="110" class="call-b">volgorde door elkaar.</text>

  <rect x="550" y="0" width="255" height="120" rx="8" class="call"/>
  <circle cx="570" cy="20" r="10" class="num"/><text x="570" y="24" text-anchor="middle" class="numtxt" fill="#FBFAF7">3</text>
  <text x="588" y="24" class="call-h">Ontbrekend event</text>
  <text x="564" y="46" class="call-b">Een beoordelingsstap die in</text>
  <text x="564" y="62" class="call-b">werkelijkheid plaatsvond (bv.</text>
  <text x="564" y="78" class="call-b">telefonisch) maar niet gelogd is —</text>
  <text x="564" y="94" class="call-b">het proces oogt korter dan het was.</text>

  <rect x="825" y="0" width="255" height="120" rx="8" class="call"/>
  <circle cx="845" cy="20" r="10" class="num"/><text x="845" y="24" text-anchor="middle" class="numtxt" fill="#FBFAF7">4</text>
  <text x="863" y="24" class="call-h">Grensoverschrijdende case</text>
  <text x="839" y="46" class="call-b">MUT-08801 begon vóór 2026-03-01</text>
  <text x="839" y="62" class="call-b">(de startdatum van dit uittreksel).</text>
  <text x="839" y="78" class="call-b">Dreigt onterecht als "incompleet"</text>
  <text x="839" y="94" class="call-b">of "afwijkend" gemarkeerd te worden.</text>
</g>

<rect x="40" y="560" width="1040" height="60" rx="8" fill="#EEF2F7" stroke="#CFE0F2"/>
<text x="56" y="584" class="call-b" font-weight="700">Waarom eerst dit, en pas dan de uitkomst (§20.3)</text>
<text x="56" y="602" class="call-b">Een conformance-analyse op een slechte log levert precieze, overtuigend ogende getallen die niets over de werkelijkheid zeggen.</text>
</svg>
