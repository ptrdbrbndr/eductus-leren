<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 620" font-family="'DM Sans', Arial, sans-serif" width="1180" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    .colhead { font-size:12px; font-weight:700; fill:#14213D; letter-spacing:.06em; }
    .node1 { fill:#EEF2F7; stroke:#14213D; stroke-width:1.4; }
    .node2a { fill:#FBF6E9; stroke:#E9A13B; stroke-width:1.8; }
    .node2b { fill:#E3E0D8; stroke:#55606F; stroke-width:1.8; }
    .node2c { fill:#EEF2F7; stroke:#55606F; stroke-width:1.4; stroke-dasharray:4 3; }
    .node3 { fill:#CFE0F2; stroke:#2563A8; stroke-width:1.8; }
    .ntxt { font-size:10.4px; fill:#14213D; }
    .ntxt-b { font-size:10.6px; fill:#14213D; font-weight:700; }
    .flow { stroke:#B8C4D4; stroke-width:8; fill:none; opacity:.8; }
    .flow-a { stroke:#F0CE93; stroke-width:8; fill:none; opacity:.85; }
    .flow-g { stroke:#C9CBBF; stroke-width:8; fill:none; opacity:.85; }
  </style>
</defs>
<rect width="1180" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 20 · FIGUUR 20.6 · OPBOUW BEVINDINGENRAPPORT</text>
<text x="40" y="64" class="title">Van afwijking naar categorie naar voorstel</text>

<text x="70" y="106" class="colhead">AFWIJKING (§20.4)</text>
<text x="470" y="106" class="colhead">CATEGORIE (§20.5)</text>
<text x="870" y="106" class="colhead">VOORSTEL (§20.6)</text>

<!-- connecting flows drawn first (behind nodes) -->
<path d="M300,160 C400,160 400,160 460,160" class="flow-a"/>
<path d="M300,290 C400,290 400,290 460,290" class="flow-g"/>
<path d="M300,420 C400,420 400,420 460,420" class="flow"/>

<path d="M760,160 C830,160 830,160 860,160" class="flow-a"/>
<path d="M760,290 C830,290 830,290 860,290" class="flow-g"/>
<path d="M760,420 C830,420 830,420 860,420" class="flow"/>

<!-- ROW 1 -->
<rect x="40" y="128" width="260" height="64" rx="8" class="node1"/>
<text x="56" y="150" class="ntxt-b">"Telefonisch contact"</text>
<text x="56" y="166" class="ntxt">19% van de cases, niet in het</text>
<text x="56" y="180" class="ntxt">model — toegevoegde stap</text>

<rect x="460" y="128" width="300" height="64" rx="8" class="node2a"/>
<text x="476" y="150" class="ntxt-b" fill="#7A5A16">Legitieme, niet-vastgelegde</text>
<text x="476" y="166" class="ntxt" fill="#7A5A16">variant — een bekende, vertrouwde</text>
<text x="476" y="180" class="ntxt" fill="#7A5A16">route die nooit is opgenomen</text>

<rect x="860" y="128" width="280" height="64" rx="8" class="node3"/>
<text x="876" y="150" class="ntxt-b">Modelwijziging</text>
<text x="876" y="166" class="ntxt">route toevoegen als expliciete</text>
<text x="876" y="180" class="ntxt">variant naast de hoofdstroom</text>

<!-- ROW 2 -->
<rect x="40" y="258" width="260" height="64" rx="8" class="node1"/>
<text x="56" y="280" class="ntxt-b">"Volledigheid controleren"</text>
<text x="56" y="296" class="ntxt">overgeslagen in 13% van de</text>
<text x="56" y="310" class="ntxt">cases — ontbrekende stap</text>

<rect x="460" y="258" width="300" height="64" rx="8" class="node2b"/>
<text x="476" y="280" class="ntxt-b">De werkelijkheid is fout</text>
<text x="476" y="296" class="ntxt">systeemondersteuning voor deze</text>
<text x="476" y="310" class="ntxt">stap ontbreekt in het formulier</text>

<rect x="860" y="258" width="280" height="64" rx="8" class="node3"/>
<text x="876" y="280" class="ntxt-b">Procesinterventie</text>
<text x="876" y="296" class="ntxt">controle-veld toevoegen aan het</text>
<text x="876" y="310" class="ntxt">formulier, geen modelwijziging</text>

<!-- ROW 3 -->
<rect x="40" y="388" width="260" height="64" rx="8" class="node1"/>
<text x="56" y="410" class="ntxt-b">Tijdsverschil van enkele</text>
<text x="56" y="426" class="ntxt">minuten bij piekbelasting,</text>
<text x="56" y="440" class="ntxt">4% van de cases</text>

<rect x="460" y="388" width="300" height="64" rx="8" class="node2c"/>
<text x="476" y="410" class="ntxt-b">Geen structureel patroon</text>
<text x="476" y="426" class="ntxt">incidenteel, geen van de drie</text>
<text x="476" y="440" class="ntxt">categorieën van toepassing</text>

<rect x="860" y="388" width="280" height="64" rx="8" class="node1"/>
<text x="876" y="410" class="ntxt-b">Bewust niets doen</text>
<text x="876" y="426" class="ntxt">expliciet vastgelegd — kosten</text>
<text x="876" y="440" class="ntxt">van ingrijpen wegen niet op</text>

<rect x="40" y="490" width="1100" height="100" rx="10" fill="#FFFFFF" stroke="#E3E0D8"/>
<text x="60" y="514" class="ntxt-b">Geen resultaat zonder deze laatste kolom (§20.6)</text>
<text x="60" y="536" font-size="11" fill="#14213D">Een miningrapport dat eindigt bij "hier zijn de afwijkingen" is een tussenstap, geen resultaat. Voor elke</text>
<text x="60" y="554" font-size="11" fill="#14213D">significante bevinding hoort één van drie uitkomsten: modelwijziging, procesinterventie, of bewust niets doen —</text>
<text x="60" y="572" font-size="11" fill="#14213D">mits expliciet vastgelegd. Een bevinding zonder voorstel is, in de woorden van de stelling uit §opdracht 7, een verwijt.</text>
</svg>
