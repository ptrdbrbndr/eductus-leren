<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" font-family="'DM Sans', Arial, sans-serif" width="1120" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    .q { fill:#EEF2F7; stroke:#14213D; stroke-width:1.5; }
    .q-lbl { font-size:12.5px; fill:#14213D; font-weight:700; }
    .out1 { fill:#CFE0F2; stroke:#2563A8; stroke-width:2; }
    .out2 { fill:#E3E0D8; stroke:#55606F; stroke-width:2; }
    .out3 { fill:#FBF6E9; stroke:#E9A13B; stroke-width:2.4; }
    .out-lbl { font-size:11.5px; fill:#14213D; font-weight:700; }
    .out-sub { font-size:10px; fill:#14213D; }
    .edge { stroke:#55606F; stroke-width:1.4; fill:none; marker-end:url(#arr8); }
    .edgelbl { font-size:10px; fill:#55606F; font-style:italic; }
  </style>
  <marker id="arr8" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#55606F"/></marker>
</defs>
<rect width="1120" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 20 · FIGUUR 20.5 · BESLISBOOM</text>
<text x="40" y="64" class="title">De drie verklaringen voor een afwijking (§20.5)</text>

<rect x="410" y="96" width="300" height="60" rx="8" class="q"/>
<text x="560" y="120" text-anchor="middle" class="q-lbl">Conformance-afwijking geconstateerd</text>
<text x="560" y="140" text-anchor="middle" class="q-lbl">— wie heeft gelijk?</text>

<path d="M480,156 L190,220" class="edge"/>
<path d="M560,156 L560,220" class="edge"/>
<path d="M640,156 L930,220" class="edge"/>

<!-- branch 1: model verouderd -->
<rect x="40" y="220" width="300" height="90" rx="8" class="q"/>
<text x="190" y="244" text-anchor="middle" class="q-lbl">Is het proces in de praktijk</text>
<text x="190" y="262" text-anchor="middle" class="q-lbl">geëvolueerd zonder dat het</text>
<text x="190" y="280" text-anchor="middle" class="q-lbl">model werd bijgewerkt?</text>
<path d="M190,310 L190,360" class="edge"/>
<text x="200" y="340" class="edgelbl">ja</text>
<rect x="40" y="360" width="300" height="120" rx="8" class="out1"/>
<text x="190" y="384" text-anchor="middle" class="out-lbl">Het model is verouderd</text>
<text x="60" y="406" class="out-sub">Nieuwe koppeling of werkwijze die</text>
<text x="60" y="422" class="out-sub">nooit is doorgevoerd — zelfde</text>
<text x="60" y="438" class="out-sub">probleem als de modellenbiblio-</text>
<text x="60" y="454" class="out-sub">theek uit niveau 1, deel 2.</text>
<text x="60" y="472" class="out-sub" font-weight="700">Vervolg: modelwijziging (§20.6)</text>

<!-- branch 2: werkelijkheid fout -->
<rect x="410" y="220" width="300" height="90" rx="8" class="q"/>
<text x="560" y="244" text-anchor="middle" class="q-lbl">Volgen medewerkers de</text>
<text x="560" y="262" text-anchor="middle" class="q-lbl">voorgeschreven werkwijze niet</text>
<text x="560" y="280" text-anchor="middle" class="q-lbl">(ervaren als overbodig / geen support)?</text>
<path d="M560,310 L560,360" class="edge"/>
<text x="570" y="340" class="edgelbl">ja</text>
<rect x="410" y="360" width="300" height="120" rx="8" class="out2"/>
<text x="560" y="384" text-anchor="middle" class="out-lbl">De werkelijkheid is fout</text>
<text x="430" y="406" class="out-sub">Een stap wordt als overbodig</text>
<text x="430" y="422" class="out-sub">ervaren, of de systeemondersteu-</text>
<text x="430" y="438" class="out-sub">ning voor die stap ontbreekt.</text>
<text x="430" y="454" class="out-sub">Signaal voor training of sturing.</text>
<text x="430" y="472" class="out-sub" font-weight="700">Vervolg: procesinterventie (§20.6)</text>

<!-- branch 3: legitieme variant -->
<rect x="780" y="220" width="300" height="90" rx="8" class="q"/>
<text x="930" y="244" text-anchor="middle" class="q-lbl">Is de afwijking een bewuste,</text>
<text x="930" y="262" text-anchor="middle" class="q-lbl">geldige aanpassing voor</text>
<text x="930" y="280" text-anchor="middle" class="q-lbl">specifieke gevallen?</text>
<path d="M930,310 L930,360" class="edge"/>
<text x="940" y="340" class="edgelbl">ja</text>
<rect x="780" y="360" width="300" height="120" rx="8" class="out3"/>
<text x="930" y="384" text-anchor="middle" class="out-lbl">Legitieme, niet-vastgelegde variant</text>
<text x="800" y="406" class="out-sub">Bv. een versnelde route voor een</text>
<text x="800" y="422" class="out-sub">vaste, vertrouwde klant — nooit</text>
<text x="800" y="438" class="out-sub">formeel opgenomen, geen fout van</text>
<text x="800" y="454" class="out-sub">model of medewerker.</text>
<text x="800" y="472" class="out-sub" font-weight="700">Vervolg: formaliseren of afbouwen</text>

<rect x="40" y="500" width="1040" height="100" rx="10" fill="#FFFFFF" stroke="#E3E0D8"/>
<text x="60" y="524" class="q-lbl">De meest onderschatte tak</text>
<text x="60" y="546" font-size="11" fill="#14213D">De derde categorie (rechts, amber) wordt het vaakst gemist, juist omdat de eerste twee zo voor de hand</text>
<text x="60" y="564" font-size="11" fill="#14213D">liggend zijn als verklaring. In de praktijk is dit ook de categorie die het vaakst daadwerkelijk aan de</text>
<text x="60" y="582" font-size="11" fill="#14213D">orde is — laat het gesprek over "wie heeft gelijk" er daarom niet te snel aan voorbijgaan.</text>
</svg>
