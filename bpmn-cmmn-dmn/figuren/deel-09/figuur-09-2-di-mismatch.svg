<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'DM Sans', Arial, sans-serif" width="960" height="560" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .panel { fill:#FFFFFF; stroke:#E3E0D8; stroke-width:1.4; }
      .evt { fill:#FBFAF7; stroke:#14213D; stroke-width:1.6; }
      .evt-end { fill:#FBFAF7; stroke:#14213D; stroke-width:3; }
      .task { fill:#CFE0F2; stroke:#14213D; stroke-width:1.6; }
      .flow { stroke:#14213D; stroke-width:1.6; fill:none; marker-end:url(#arr); }
      .label { font-size:12.5px; font-weight:700; fill:#14213D; }
      .sub { font-size:12px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .panelkicker { font-size:12px; font-weight:700; fill:#2563A8; letter-spacing:.08em; }
      .diffbox { fill:none; stroke:#E9A13B; stroke-width:2; stroke-dasharray:5,3; }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#14213D"/></marker>
</defs>
<rect width="960" height="560" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 09 · TOOLING</text>
<text x="40" y="64" class="title">Figuur 9.2 — Zelfde model, tool A geëxporteerd en in tool B geïmporteerd</text>
<text x="40" y="86" class="sub">Model identiek (drie elementen, twee sequence flows) — DI-informatie wijkt af: andere posities, andere routering — §9.1/§9.2</text>

<!-- Panel A -->
<rect x="40" y="120" width="410" height="360" class="panel"/>
<text x="60" y="148" class="panelkicker">TOOL A — export</text>
<circle cx="120" cy="220" r="18" class="evt"/>
<text x="120" y="256" text-anchor="middle" class="sub">Aanvraag</text>
<text x="120" y="270" text-anchor="middle" class="sub">ontvangen</text>
<rect x="200" y="196" width="140" height="60" rx="8" class="task"/>
<text x="270" y="222" text-anchor="middle" class="label">Aanvraag</text>
<text x="270" y="238" text-anchor="middle" class="label">beoordelen</text>
<circle cx="410" cy="226" r="19" class="evt-end"/>
<text x="410" y="262" text-anchor="middle" class="sub">Verwerkt</text>
<path d="M138,220 L200,222" class="flow"/>
<path d="M340,226 L391,226" class="flow"/>
<text x="60" y="420" class="sub">Layout: horizontale rij, y ≈ 196–256</text>
<text x="60" y="440" class="sub">Bounds Task_1: x=200, y=196, w=140, h=60</text>
<text x="60" y="460" class="sub">Sequence flow: rechte lijnen</text>

<!-- Panel B -->
<rect x="510" y="120" width="410" height="360" class="panel"/>
<text x="530" y="148" class="panelkicker">TOOL B — na import</text>
<circle cx="590" cy="200" r="18" class="evt"/>
<text x="590" y="180" text-anchor="middle" class="sub">Aanvraag ontvangen</text>
<rect x="640" y="290" width="150" height="66" rx="8" class="task"/>
<text x="715" y="316" text-anchor="middle" class="label">Aanvraag</text>
<text x="715" y="332" text-anchor="middle" class="label">beoordelen</text>
<circle cx="860" cy="230" r="19" class="evt-end"/>
<text x="860" y="205" text-anchor="middle" class="sub">Verwerkt</text>
<path d="M602,213 C 630,250 660,270 690,292" class="flow"/>
<path d="M780,300 C 820,280 845,255 855,248" class="flow"/>
<rect x="562" y="172" width="330" height="200" class="diffbox"/>
<text x="562" y="392" class="sub" fill="#8a5a12" font-weight="700">Zelfde drie elementen, andere posities en routering</text>
<text x="530" y="440" class="sub">Layout: verspreid, y ≈ 172–372</text>
<text x="530" y="460" class="sub">Bounds Task_1: x=640, y=290, w=150, h=66</text>
<text x="530" y="480" class="sub">Sequence flow: gebogen paden</text>

<rect x="40" y="500" width="880" height="46" fill="#EEF2F7" stroke="#E3E0D8" stroke-width="1"/>
<text x="58" y="528" class="sub">Model (elementen, eigenschappen, relaties) is in beide tools identiek — alleen de DI (dc:Bounds, routing) verschilt na import.</text>
</svg>
