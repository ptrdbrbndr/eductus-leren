<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .folder { fill:#CFE0F2; stroke:#14213D; stroke-width:1.2; }
      .folder-sub { fill:#EEF2F7; stroke:#14213D; stroke-width:1; }
      .file { fill:#FBF6E9; stroke:#E9A13B; stroke-width:1; }
      .label { font-size:13px; font-weight:700; fill:#14213D; }
      .sub { font-size:11.5px; fill:#55606F; }
      .mono { font-family:'Courier New', monospace; font-size:12px; fill:#14213D; }
      .mono-sub { font-family:'Courier New', monospace; font-size:11.5px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .guide { stroke:#B9C4D3; stroke-width:1; }
    </style>
</defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 09 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Figuur 9.5 — Voorbeeld-mapstructuur voor een modelrepository</text>
<text x="40" y="86" class="sub">Aansluitend op de procesarchitectuur (deel 2, §2.2): hoofd-, ondersteunende en besturende processen — §9.5</text>

<!-- tree -->
<rect x="40" y="110" width="560" height="470" fill="#FFFFFF" stroke="#E3E0D8" stroke-width="1.2"/>

<rect x="58" y="126" width="150" height="26" rx="4" class="folder"/>
<text x="72" y="144" class="mono" font-weight="700">modellen/</text>

<line x1="70" y1="152" x2="70" y2="440" class="guide"/>

<rect x="90" y="160" width="230" height="24" rx="4" class="folder-sub"/>
<text x="100" y="177" class="mono">01-hoofdprocessen/</text>
<line x1="70" y1="172" x2="90" y2="172" class="guide"/>

<line x1="100" y1="184" x2="100" y2="270" class="guide"/>
<rect x="110" y="192" width="270" height="22" rx="4" class="folder-sub"/>
<text x="120" y="208" class="mono-sub">pensioenaanspraken-vaststellen/</text>
<line x1="100" y1="202" x2="110" y2="202" class="guide"/>
<rect x="130" y="218" width="330" height="20" rx="3" class="file"/>
<text x="140" y="233" class="mono-sub">v2.1_pensioenaanspraak-vaststellen.bpmn</text>
<rect x="110" y="244" width="270" height="22" rx="4" class="folder-sub"/>
<text x="120" y="260" class="mono-sub">deelnemers-informeren/</text>

<line x1="70" y1="172" x2="70" y2="276" class="guide"/>
<rect x="90" y="276" width="230" height="24" rx="4" class="folder-sub"/>
<text x="100" y="293" class="mono">02-ondersteunende-processen/</text>
<line x1="70" y1="288" x2="90" y2="288" class="guide"/>
<line x1="100" y1="300" x2="100" y2="352" class="guide"/>
<rect x="110" y="308" width="270" height="22" rx="4" class="folder-sub"/>
<text x="120" y="324" class="mono-sub">mutatieverwerking-klantcontact/</text>
<line x1="100" y1="318" x2="110" y2="318" class="guide"/>
<rect x="130" y="334" width="330" height="20" rx="3" class="file"/>
<text x="140" y="349" class="mono-sub">v3.0_e-mailadreswijziging.bpmn</text>

<rect x="90" y="366" width="230" height="24" rx="4" class="folder-sub"/>
<text x="100" y="383" class="mono">03-besturende-processen/</text>
<line x1="70" y1="378" x2="90" y2="378" class="guide"/>
<line x1="100" y1="390" x2="100" y2="418" class="guide"/>
<rect x="110" y="398" width="270" height="22" rx="4" class="folder-sub"/>
<text x="120" y="414" class="mono-sub">risicomanagement/</text>

<rect x="90" y="430" width="230" height="24" rx="4" class="folder-sub"/>
<text x="100" y="447" class="mono">04-beslismodellen/</text>
<line x1="70" y1="442" x2="90" y2="442" class="guide"/>
<rect x="110" y="458" width="330" height="20" rx="3" class="file"/>
<text x="120" y="473" class="mono-sub">v1.4_waardeoverdracht-beoordelen.dmn</text>

<text x="58" y="510" class="sub" font-weight="700" fill="#14213D">CHANGELOG.md</text>
<text x="58" y="528" class="sub">— per model: versienummer, datum, auteur, wat wijzigde</text>
<text x="58" y="550" class="sub" font-weight="700" fill="#14213D">Naamgeving:</text>
<text x="58" y="568" class="sub">v‹major›.‹minor›_‹domeinbegrip-in-proces-naamgeving›.‹bpmn|dmn|cmmn›</text>

<!-- side notes -->
<rect x="620" y="110" width="300" height="470" fill="#EEF2F7" stroke="#E3E0D8" stroke-width="1"/>
<text x="638" y="136" class="label">Drie basisafspraken (§9.5)</text>

<text x="638" y="168" class="label" font-size="12.5">Versiebeheer</text>
<text x="638" y="188" class="sub">Elk model heeft een</text>
<text x="638" y="204" class="sub">versienummer en</text>
<text x="638" y="220" class="sub">wijzigingsgeschiedenis —</text>
<text x="638" y="236" class="sub">voorkomt de Meridiaan-</text>
<text x="638" y="252" class="sub">bibliotheek-fout (deel 2, §2.1)</text>

<text x="638" y="290" class="label" font-size="12.5">Naamgeving</text>
<text x="638" y="310" class="sub">Consistente conventie voor</text>
<text x="638" y="326" class="sub">bestandsnamen, gekoppeld</text>
<text x="638" y="342" class="sub">aan de elementnaamgeving</text>
<text x="638" y="358" class="sub">(deel 5, §5.3)</text>

<text x="638" y="396" class="label" font-size="12.5">Mapstructuur</text>
<text x="638" y="416" class="sub">Sluit aan bij de</text>
<text x="638" y="432" class="sub">procesarchitectuur uit</text>
<text x="638" y="448" class="sub">deel 2, §2.2 — hoofd-,</text>
<text x="638" y="464" class="sub">ondersteunend, besturend —</text>
<text x="638" y="480" class="sub">zodat een model op een</text>
<text x="638" y="496" class="sub">voorspelbare plek staat</text>

<text x="638" y="540" class="sub" font-style="italic">Volledige governance (wie mag</text>
<text x="638" y="556" class="sub" font-style="italic">wijzigen, publicatiestraat) volgt</text>
<text x="638" y="572" class="sub" font-style="italic">in deel 21, niveau 2.</text>
</svg>
