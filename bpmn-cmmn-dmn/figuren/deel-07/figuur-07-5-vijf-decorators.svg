<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" font-family="'DM Sans', Arial, sans-serif" width="1100" height="420" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .task-fill { fill:#FFFFFF; stroke:#14213D; stroke-width:1.75; }
      .task-dashed { fill:#FFFFFF; stroke:#14213D; stroke-width:1.75; stroke-dasharray:6,4; }
      .stage-fill { fill:#EEF2F7; stroke:#14213D; stroke-width:1.75; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .sub { font-size:11px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .note { font-size:12px; fill:#55606F; }
      .amber-fill { fill:#E9A13B; }
      .badge-stroke { fill:#FBFAF7; stroke:#14213D; stroke-width:1.3; }
    </style>
    <marker id="reparr" markerWidth="8" markerHeight="8" refX="4" refY="2" orient="auto"><path d="M0,0 L4,2 L0,4 Z" fill="#14213D"/></marker>
</defs>
<rect width="1100" height="420" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 07 · CMMN-NOTATIE</text>
<text x="40" y="64" class="title">De vijf decorators</text>
<text x="40" y="86" class="note">Kleine symbolen die bepalen hoe een element zich gedraagt — niet of het kan gebeuren.</text>

<!-- 1 Required -->
<g transform="translate(40,130)">
  <rect x="0" y="0" width="180" height="110" rx="12" class="task-fill"/>
  <text x="90" y="55" text-anchor="middle" class="sub">taak / stage</text>
  <circle cx="168" cy="12" r="11" class="amber-fill" stroke="#14213D" stroke-width="1.2"/>
  <text x="168" y="17" text-anchor="middle" style="font-size:14px; font-weight:800; fill:#14213D">!</text>
  <text x="90" y="132" text-anchor="middle" class="label">Required</text>
  <text x="90" y="150" text-anchor="middle" class="sub">moet voltooid zijn</text>
  <text x="90" y="164" text-anchor="middle" class="sub">voor afronding</text>
</g>

<!-- 2 Repetition -->
<g transform="translate(240,130)">
  <rect x="0" y="0" width="180" height="110" rx="12" class="task-fill"/>
  <text x="90" y="55" text-anchor="middle" class="sub">taak / stage</text>
  <circle cx="168" cy="12" r="11" class="badge-stroke"/>
  <path d="M162,7 A6,6 0 1 1 161,17" fill="none" stroke="#14213D" stroke-width="1.4" marker-end="url(#reparr)"/>
  <text x="90" y="132" text-anchor="middle" class="label">Repetition</text>
  <text x="90" y="150" text-anchor="middle" class="sub">kan meerdere keren</text>
  <text x="90" y="164" text-anchor="middle" class="sub">worden uitgevoerd</text>
</g>

<!-- 3 Manual activation -->
<g transform="translate(440,130)">
  <rect x="0" y="0" width="180" height="110" rx="12" class="task-fill"/>
  <text x="90" y="55" text-anchor="middle" class="sub">taak / stage</text>
  <circle cx="168" cy="12" r="11" class="badge-stroke"/>
  <path d="M163,6 L163,18 L172,12 Z" fill="#14213D"/>
  <text x="90" y="132" text-anchor="middle" class="label">Manual activation</text>
  <text x="90" y="150" text-anchor="middle" class="sub">wacht op expliciete</text>
  <text x="90" y="164" text-anchor="middle" class="sub">start door behandelaar</text>
</g>

<!-- 4 Auto-complete -->
<g transform="translate(640,130)">
  <rect x="0" y="0" width="180" height="110" rx="12" class="stage-fill"/>
  <path d="M14,12 L28,12" stroke="#14213D" stroke-width="1.3"/>
  <path d="M14,8 L18,4" stroke="#14213D" stroke-width="1.3"/>
  <text x="90" y="60" text-anchor="middle" class="sub">stage</text>
  <circle cx="168" cy="12" r="11" class="badge-stroke"/>
  <path d="M163,12 L167,16 L174,7" fill="none" stroke="#14213D" stroke-width="1.6"/>
  <text x="90" y="132" text-anchor="middle" class="label">Auto-complete</text>
  <text x="90" y="150" text-anchor="middle" class="sub">sluit zelf af zodra alle</text>
  <text x="90" y="164" text-anchor="middle" class="sub">required-elementen klaar zijn</text>
</g>

<!-- 5 Discretionary -->
<g transform="translate(840,130)">
  <rect x="0" y="0" width="180" height="110" rx="12" class="task-dashed"/>
  <text x="90" y="55" text-anchor="middle" class="sub">taak / stage</text>
  <text x="90" y="132" text-anchor="middle" class="label">Discretionary</text>
  <text x="90" y="150" text-anchor="middle" class="sub">gestippelde rand — door</text>
  <text x="90" y="164" text-anchor="middle" class="sub">behandelaar zelf toegevoegd</text>
</g>

<text x="550" y="340" text-anchor="middle" class="note">De eerste vier zijn corner-badges op een vast plan item; discretionary is de gestippelde rand uit §7.5</text>
<text x="550" y="358" text-anchor="middle" class="note">en volgt hier als vijfde decorator, in lijn met de sturing die het dossier aan het model geeft.</text>
</svg>
