<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 720" font-family="'DM Sans', Arial, sans-serif" width="1150" height="720" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .case-fill { fill:#FFFFFF; stroke:#14213D; stroke-width:2; }
      .case-tab { fill:#14213D; }
      .stage-fill { fill:#EEF2F7; stroke:#14213D; stroke-width:1.75; }
      .stage-tab { fill:#EEF2F7; stroke:#14213D; stroke-width:1.75; }
      .task-fill { fill:#FFFFFF; stroke:#14213D; stroke-width:1.5; }
      .milestone-fill { fill:#FBF6E9; stroke:#14213D; stroke-width:1.5; }
      .cfi-fill { fill:#CFE0F2; stroke:#14213D; stroke-width:1.25; }
      .label { font-size:13.5px; font-weight:700; fill:#14213D; }
      .label-light { font-size:12px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:11px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:26px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .note { font-size:12px; fill:#55606F; }
      .connector { stroke:#55606F; stroke-width:1.3; fill:none; stroke-dasharray:4,3; }
      .navy-line { stroke:#14213D; stroke-width:2; }
    </style>
    <g id="icon-doc">
      <path d="M0,0 H30 L38,8 V44 H0 Z" fill="#CFE0F2" stroke="#14213D" stroke-width="1.2"/>
      <path d="M30,0 L30,8 L38,8 Z" fill="#FBFAF7" stroke="#14213D" stroke-width="1"/>
    </g>
    <g id="icon-person">
      <circle cx="8" cy="5" r="3.4" fill="#14213D"/>
      <path d="M1,15 Q8,8 15,15 Z" fill="#14213D"/>
    </g>
</defs>
<rect width="1150" height="720" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 07 · CMMN-NOTATIE</text>
<text x="40" y="64" class="title">Casemodel klachtbehandeling bij Meridiaan</text>
<text x="40" y="86" class="note">Case file, stages, taken en milestones — de bouwstenen van een case, nog zonder sentries of decorators.</text>

<!-- CASE FILE PANEL -->
<text x="40" y="120" class="kicker">CASE FILE</text>
<g>
  <use href="#icon-doc" x="40" y="140"/>
  <rect x="86" y="140" width="164" height="48" rx="6" class="cfi-fill"/>
  <text x="168" y="160" text-anchor="middle" class="label" style="font-size:12px">Klachtdossier</text>
  <text x="168" y="176" text-anchor="middle" class="sub">case file item</text>

  <use href="#icon-doc" x="40" y="215"/>
  <rect x="86" y="215" width="164" height="48" rx="6" class="cfi-fill"/>
  <text x="168" y="235" text-anchor="middle" class="label" style="font-size:12px">Polisgegevens</text>
  <text x="168" y="251" text-anchor="middle" class="sub">case file item</text>

  <use href="#icon-doc" x="40" y="290"/>
  <rect x="86" y="290" width="164" height="48" rx="6" class="cfi-fill"/>
  <text x="168" y="310" text-anchor="middle" class="label" style="font-size:12px">Berekening</text>
  <text x="168" y="326" text-anchor="middle" class="sub">case file item</text>
</g>

<!-- Connectors from case file to plan items (drawn before plan model so they sit behind) -->
<path d="M250,164 C 290,164 300,197 340,197" class="connector"/>
<path d="M250,239 C 300,239 300,205 340,205" class="connector"/>
<path d="M250,239 C 400,239 650,197 740,197" class="connector"/>
<path d="M250,314 C 450,314 650,205 740,205" class="connector"/>

<!-- CASE PLAN MODEL -->
<rect x="310" y="78" width="210" height="22" rx="4" class="case-tab"/>
<text x="320" y="94" class="label-light">CASE: Klachtbehandeling</text>
<rect x="290" y="95" width="820" height="470" rx="16" class="case-fill"/>

<!-- STAGE A -->
<rect x="335" y="127" width="170" height="17" rx="3" class="stage-tab"/>
<text x="343" y="140" class="sub" style="font-weight:700; font-size:10.5px">STAGE: Klacht vaststellen</text>
<rect x="320" y="140" width="380" height="270" rx="14" class="stage-fill"/>

<g>
  <rect x="340" y="170" width="340" height="55" rx="10" class="task-fill"/>
  <use href="#icon-person" x="352" y="180"/>
  <text x="518" y="203" text-anchor="middle" class="label">Dossier opvragen bij polisadministratie</text>

  <rect x="340" y="235" width="340" height="55" rx="10" class="task-fill"/>
  <use href="#icon-person" x="352" y="245"/>
  <text x="518" y="268" text-anchor="middle" class="label">Contact opnemen met deelnemer</text>

  <rect x="340" y="300" width="340" height="45" rx="22" class="milestone-fill"/>
  <text x="510" y="328" text-anchor="middle" class="label">Milestone: oorzaak vastgesteld</text>
</g>

<!-- STAGE B -->
<rect x="735" y="127" width="150" height="17" rx="3" class="stage-tab"/>
<text x="743" y="140" class="sub" style="font-weight:700; font-size:10.5px">STAGE: Klacht afhandelen</text>
<rect x="720" y="140" width="350" height="270" rx="14" class="stage-fill"/>

<g>
  <rect x="740" y="170" width="310" height="55" rx="10" class="task-fill"/>
  <line x1="748" y1="176" x2="748" y2="219" class="navy-line"/>
  <line x1="753" y1="176" x2="753" y2="219" class="navy-line"/>
  <text x="900" y="203" text-anchor="middle" class="label">Herberekening laten uitvoeren</text>

  <rect x="740" y="235" width="145" height="55" rx="10" class="task-fill"/>
  <use href="#icon-person" x="750" y="245"/>
  <text x="812" y="268" text-anchor="middle" class="label" style="font-size:11.5px">Juridisch advies inwinnen</text>

  <rect x="905" y="235" width="145" height="55" rx="10" class="task-fill"/>
  <use href="#icon-person" x="915" y="245"/>
  <text x="977" y="268" text-anchor="middle" class="label" style="font-size:11.5px">Klacht direct afhandelen</text>

  <rect x="740" y="300" width="310" height="45" rx="22" class="milestone-fill"/>
  <text x="895" y="328" text-anchor="middle" class="label">Milestone: deelnemer geïnformeerd</text>
</g>

<!-- Case-level milestone -->
<rect x="320" y="430" width="750" height="50" rx="25" class="milestone-fill"/>
<text x="695" y="461" text-anchor="middle" class="label" style="font-size:15px">Milestone: klacht afgehandeld</text>

<!-- Legend -->
<g transform="translate(40,600)">
  <text x="0" y="0" class="kicker">LEGENDA</text>
  <rect x="0" y="14" width="26" height="18" rx="4" class="stage-fill"/>
  <text x="34" y="28" class="sub">Stage</text>

  <rect x="120" y="14" width="26" height="18" rx="5" class="task-fill"/>
  <use href="#icon-person" x="123" y="17" transform="scale(0.7)"/>
  <text x="154" y="28" class="sub">Human task</text>

  <rect x="260" y="14" width="26" height="18" rx="5" class="task-fill"/>
  <line x1="265" y1="16" x2="265" y2="30" class="navy-line" stroke-width="1.4"/>
  <line x1="268" y1="16" x2="268" y2="30" class="navy-line" stroke-width="1.4"/>
  <text x="294" y="28" class="sub">Process task</text>

  <rect x="400" y="14" width="40" height="20" rx="10" class="milestone-fill"/>
  <text x="450" y="28" class="sub">Milestone</text>

  <use href="#icon-doc" x="540" y="12" transform="scale(0.55)"/>
  <text x="558" y="28" class="sub">Case file item</text>

  <line x1="640" y1="24" x2="680" y2="24" class="connector"/>
  <text x="688" y="28" class="sub">leest / schrijft</text>
</g>
</svg>
