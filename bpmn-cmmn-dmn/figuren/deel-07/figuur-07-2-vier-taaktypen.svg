<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'DM Sans', Arial, sans-serif" width="960" height="460" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .task-fill { fill:#FFFFFF; stroke:#14213D; stroke-width:1.75; }
      .navy-line { stroke:#14213D; stroke-width:2; }
      .label { font-size:15px; font-weight:700; fill:#14213D; }
      .sub { font-size:11.5px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .note { font-size:12px; fill:#55606F; }
    </style>
    <g id="icon-person">
      <circle cx="7" cy="4.6" r="3" fill="#14213D"/>
      <path d="M0.5,14 Q7,7 13.5,14 Z" fill="#14213D"/>
    </g>
    <g id="icon-grid">
      <rect x="0" y="0" width="20" height="14" rx="1.5" fill="none" stroke="#14213D" stroke-width="1.3"/>
      <line x1="0" y1="7" x2="20" y2="7" stroke="#14213D" stroke-width="1.1"/>
      <line x1="6.6" y1="0" x2="6.6" y2="14" stroke="#14213D" stroke-width="1.1"/>
      <line x1="13.3" y1="0" x2="13.3" y2="14" stroke="#14213D" stroke-width="1.1"/>
    </g>
    <g id="icon-case">
      <rect x="3" y="3" width="9" height="4" rx="1" fill="#FBFAF7" stroke="#14213D" stroke-width="1.1"/>
      <rect x="0" y="6" width="20" height="14" rx="2.5" fill="#FBFAF7" stroke="#14213D" stroke-width="1.3"/>
    </g>
</defs>
<rect width="960" height="460" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 07 · CMMN-NOTATIE</text>
<text x="40" y="64" class="title">De vier taaktypen</text>
<text x="40" y="86" class="note">Elke case bestaat uit taken in vier vormen — herkenbaar aan het symbool linksboven of de dubbele rand.</text>

<!-- Column 1: Human task -->
<g transform="translate(40,130)">
  <rect x="0" y="0" width="190" height="140" rx="14" class="task-fill"/>
  <use href="#icon-person" x="14" y="12"/>
  <text x="95" y="78" text-anchor="middle" class="label">Human task</text>
  <text x="95" y="98" text-anchor="middle" class="sub">werk door een mens,</text>
  <text x="95" y="113" text-anchor="middle" class="sub">vaak met formulier</text>
</g>

<!-- Column 2: Process task -->
<g transform="translate(257,130)">
  <rect x="0" y="0" width="190" height="140" rx="14" class="task-fill"/>
  <line x1="6" y1="8" x2="6" y2="132" class="navy-line"/>
  <line x1="10" y1="8" x2="10" y2="132" class="navy-line"/>
  <text x="95" y="78" text-anchor="middle" class="label">Process task</text>
  <text x="95" y="98" text-anchor="middle" class="sub">aanroep naar een</text>
  <text x="95" y="113" text-anchor="middle" class="sub">BPMN-proces</text>
</g>

<!-- Column 3: Decision task -->
<g transform="translate(474,130)">
  <rect x="0" y="0" width="190" height="140" rx="14" class="task-fill"/>
  <use href="#icon-grid" x="14" y="12"/>
  <text x="95" y="78" text-anchor="middle" class="label">Decision task</text>
  <text x="95" y="98" text-anchor="middle" class="sub">aanroep naar een</text>
  <text x="95" y="113" text-anchor="middle" class="sub">DMN-beslissing</text>
</g>

<!-- Column 4: Case task -->
<g transform="translate(691,130)">
  <rect x="0" y="0" width="190" height="140" rx="14" class="task-fill"/>
  <line x1="6" y1="8" x2="6" y2="132" class="navy-line"/>
  <line x1="10" y1="8" x2="10" y2="132" class="navy-line"/>
  <use href="#icon-case" x="160" y="10"/>
  <text x="95" y="78" text-anchor="middle" class="label">Case task</text>
  <text x="95" y="98" text-anchor="middle" class="sub">aanroep naar een</text>
  <text x="95" y="113" text-anchor="middle" class="sub">andere case</text>
</g>

<text x="480" y="310" text-anchor="middle" class="note">Process task en decision task zijn de koppelpunten met BPMN en DMN — verder uitgewerkt in deel 8.</text>
<text x="480" y="330" text-anchor="middle" class="note">Case task roept een deeldossier aan als een dossier zelf weer deeldossiers bevat.</text>
</svg>
