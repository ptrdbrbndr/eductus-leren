<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="'DM Sans', Arial, sans-serif" width="960" height="520" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:13px; font-weight:700; fill:#14213D; }
      .sub { font-size:11px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .bar { fill:#2563A8; }
    </style>
</defs>
<rect width="960" height="520" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 10 · INSTRUMENT</text>
<text x="40" y="64" class="title">Het beoordelingsschema van de rubric</text>
<text x="40" y="96" class="sub">Een onderbouwd "dit niet" weegt zwaarder dan een volledig ogende lijst die alles claimt te doen.</text>

<g>
<text x="40" y="140" class="label" font-size="12">1 · Volledigheid van de diagnose</text>
<rect x="40" y="150" width="620" height="18" rx="4" fill="#DFDCD3"/>
<rect x="40" y="150" width="560" height="18" rx="4" class="bar"/>
<text x="680" y="164" class="sub">CIA-element, AVG-beginsel, aanwezig/aantoonbaar/werkend</text>
</g>

<g>
<text x="40" y="200" class="label" font-size="12">2 · Kwaliteit van de prioritering</text>
<rect x="40" y="210" width="620" height="18" rx="4" fill="#DFDCD3"/>
<rect x="40" y="210" width="500" height="18" rx="4" class="bar"/>
<text x="680" y="224" class="sub">urgentie, impact, haalbaarheid — niet alles even belangrijk</text>
</g>

<g>
<text x="40" y="260" class="label" font-size="12">3 · Bruikbaarheid van de drieslag</text>
<rect x="40" y="270" width="620" height="18" rx="4" fill="#DFDCD3"/>
<rect x="40" y="270" width="500" height="18" rx="4" class="bar"/>
<text x="680" y="284" class="sub">symptoom, wortel, structurele maatregel — niet alleen symptoom</text>
</g>

<g>
<text x="40" y="320" class="label" font-size="12" fill="#9A5F0D">4 · Het onderbouwde "nee, dit niet"</text>
<rect x="40" y="330" width="620" height="18" rx="4" fill="#DFDCD3"/>
<rect x="40" y="330" width="600" height="18" rx="4" fill="#E9A13B"/>
<text x="680" y="344" class="sub" fill="#9A5F0D" font-weight="700">zwaarst wegend criterium van de vijf</text>
</g>

<g>
<text x="40" y="380" class="label" font-size="12">5 · Standvastigheid onder tegenspraak</text>
<rect x="40" y="390" width="620" height="18" rx="4" fill="#DFDCD3"/>
<rect x="40" y="390" width="480" height="18" rx="4" class="bar"/>
<text x="680" y="404" class="sub">inhoudelijke argumenten, durft een punt te herzien</text>
</g>

<rect x="150" y="440" width="660" height="60" rx="8" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
<text x="480" y="465" text-anchor="middle" class="sub" fill="#9A5F0D">Vier rolspelers bevragen elk vanuit hun eigen belang: Karin, Tarik, Sanne, Ruud</text>
<text x="480" y="483" text-anchor="middle" class="sub">— een nulmeting die alles aanbeveelt zonder ooit iets af te wijzen, scoort laag</text>
</svg>
