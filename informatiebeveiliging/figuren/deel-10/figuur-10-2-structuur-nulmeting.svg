<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'DM Sans', Arial, sans-serif" width="960" height="560" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:13px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:13px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:11.5px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .num { font-size:14px; font-weight:700; fill:#FFFFFF; }
    </style>
</defs>
<rect width="960" height="560" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 10 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Voorbeeldstructuur voor de schriftelijke nulmeting</text>
<text x="40" y="96" class="sub">Onderdeel A van de capstone — Merels beveiligingsnulmeting voor Meridiaan.</text>

<g>
<circle cx="60" cy="150" r="16" fill="#1A4F8B"/><text x="60" y="156" text-anchor="middle" class="num">1</text>
<rect x="90" y="128" width="830" height="44" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="108" y="155" class="label" font-size="12">Bevindingen — accounts, testomgevingen, mailbox + 2 eigen (deel 6, 7)</text>
</g>
<g>
<circle cx="60" cy="204" r="16" fill="#1A4F8B"/><text x="60" y="210" text-anchor="middle" class="num">2</text>
<rect x="90" y="182" width="830" height="44" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="108" y="209" class="label" font-size="12">Per bevinding: CIA-element/AVG-beginsel + aanwezig/aantoonbaar/werkend</text>
</g>
<g>
<circle cx="60" cy="258" r="16" fill="#1A4F8B"/><text x="60" y="264" text-anchor="middle" class="num">3</text>
<rect x="90" y="236" width="830" height="44" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="108" y="263" class="label" font-size="12">Prioritering — de drie meest urgente bevindingen, met onderbouwing</text>
</g>
<g>
<circle cx="60" cy="312" r="16" fill="#1A4F8B"/><text x="60" y="318" text-anchor="middle" class="num">4</text>
<rect x="90" y="290" width="830" height="44" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="108" y="317" class="label" font-size="12">Voor de top drie: symptoom / wortel / structurele maatregel (deel 5, 8)</text>
</g>
<g>
<circle cx="60" cy="366" r="16" fill="#E8A020"/><text x="60" y="372" text-anchor="middle" class="num" fill="#0D1B2A">5</text>
<rect x="90" y="344" width="830" height="44" rx="6" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>
<text x="108" y="371" class="label" font-size="12" fill="#8A5A0E">Minstens één bevinding waarbij je expliciet adviseert iets niet te doen</text>
</g>

<rect x="150" y="420" width="660" height="100" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="480" y="448" text-anchor="middle" class="label" font-size="12">Onderdeel B — de verdediging</text>
<text x="480" y="470" text-anchor="middle" class="sub">Groepsopdracht: Karin, Tarik, Sanne en Ruud bevragen de nulmeting,</text>
<text x="480" y="488" text-anchor="middle" class="sub">elk vanuit hun eigen belang — haalbaarheid, architectuur, rechtmatigheid, uitvoerbaarheid</text>
<text x="480" y="506" text-anchor="middle" class="sub">beoordeeld op de vijf criteria van de rubric (figuur 10-1)</text>
</svg>
