<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:13px; font-weight:700; fill:#0D1B2A; }
      .sub { font-size:11.5px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .tag { font-size:10px; font-weight:700; fill:#F5F4F0; }
    </style>
</defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 8 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">De zes tekortkomingen van de testomgevingen</text>
<text x="40" y="96" class="sub">Elk gekoppeld aan het deel waarin het onderliggende begrip werd geïntroduceerd.</text>

<g>
<rect x="40" y="130" width="880" height="66" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<rect x="60" y="148" width="60" height="30" rx="5" fill="#1A4F8B"/><text x="90" y="168" text-anchor="middle" class="tag">DEEL 3+8</text>
<text x="140" y="163" class="label">Geen vermelding in het verwerkingsregister</text>
<text x="140" y="182" class="sub">onzichtbare verwerking — in strijd met de verantwoordingsplicht</text>
</g>
<g>
<rect x="40" y="204" width="880" height="66" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<rect x="60" y="222" width="60" height="30" rx="5" fill="#1A4F8B"/><text x="90" y="242" text-anchor="middle" class="tag">DEEL 3</text>
<text x="140" y="237" class="label">Geen vastgestelde grondslag</text>
<text x="140" y="256" class="sub">"we hadden het nodig" is een motivatie, geen grondslag uit de zes</text>
</g>
<g>
<rect x="40" y="278" width="880" height="66" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<rect x="60" y="296" width="60" height="30" rx="5" fill="#1A4F8B"/><text x="90" y="316" text-anchor="middle" class="tag">DEEL 8</text>
<text x="140" y="311" class="label">Geen bewaartermijn</text>
<text x="140" y="330" class="sub">de data staat er al jaren, zonder vastgestelde grens</text>
</g>
<g>
<rect x="40" y="352" width="880" height="66" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<rect x="60" y="370" width="60" height="30" rx="5" fill="#1A4F8B"/><text x="90" y="390" text-anchor="middle" class="tag">DEEL 5</text>
<text x="140" y="385" class="label">Schending van need-to-know</text>
<text x="140" y="404" class="sub">een brede groep ziet dezelfde gevoelige data als in productie</text>
</g>
<g>
<rect x="40" y="426" width="880" height="66" rx="6" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>
<rect x="60" y="444" width="60" height="30" rx="5" fill="#E8A020"/><text x="90" y="464" text-anchor="middle" class="tag" fill="#0D1B2A">DEEL 6</text>
<text x="140" y="459" class="label" fill="#8A5A0E">Waarschijnlijk geen echte anonimisering</text>
<text x="140" y="478" class="sub">"gewoon een kopie" is niet eens pseudonimisering</text>
</g>
<g>
<rect x="40" y="500" width="880" height="66" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<rect x="60" y="518" width="60" height="30" rx="5" fill="#1A4F8B"/><text x="90" y="538" text-anchor="middle" class="tag">DEEL 8</text>
<text x="140" y="533" class="label">Mogelijk verwerkersrelatie zonder overeenkomst</text>
<text x="140" y="552" class="sub">als een externe testpartij toegang heeft</text>
</g>
</svg>
