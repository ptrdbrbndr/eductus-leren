<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 460" font-family="'DM Sans', Arial, sans-serif" width="1040" height="460" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:12px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:12px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:10.5px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .cell { font-size:10.5px; fill:#0D1B2A; }
    </style>
</defs>
<rect width="1040" height="460" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 8 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Het verwerkingsregister — de testomgevingen als ontbrekende rij</text>

<rect x="40" y="100" width="960" height="40" fill="#1A4F8B"/>
<text x="55" y="125" class="label-light">DOEL</text>
<text x="225" y="125" class="label-light">CATEGORIEËN</text>
<text x="415" y="125" class="label-light">GRONDSLAG</text>
<text x="565" y="125" class="label-light">BEWAARTERMIJN</text>
<text x="740" y="125" class="label-light">MAATREGELEN</text>
<text x="900" y="125" class="label-light">STATUS</text>

<rect x="40" y="140" width="960" height="46" fill="#FFFFFF" stroke="#E4E1D8"/>
<text x="55" y="167" class="cell">Pensioenregeling uitvoeren</text>
<text x="225" y="167" class="cell">NAW, BSN, salaris</text>
<text x="415" y="167" class="cell">Overeenkomst</text>
<text x="565" y="167" class="cell">tot X jaar na einde</text>
<text x="740" y="167" class="cell">toegangscontrole, TLS</text>
<text x="900" y="167" class="cell" fill="#1A4F8B" font-weight="700">vastgelegd</text>

<rect x="40" y="186" width="960" height="46" fill="#FFFFFF" stroke="#E4E1D8"/>
<text x="55" y="213" class="cell">Aanlevering DNB</text>
<text x="225" y="213" class="cell">geaggregeerde cijfers</text>
<text x="415" y="213" class="cell">Wettelijke verplichting</text>
<text x="565" y="213" class="cell">per aanlevercyclus</text>
<text x="740" y="213" class="cell">export-log</text>
<text x="900" y="213" class="cell" fill="#1A4F8B" font-weight="700">vastgelegd</text>

<rect x="40" y="232" width="960" height="60" fill="#F5F4F0" stroke="#E8A020" stroke-width="2.5" stroke-dasharray="6 4"/>
<text x="55" y="255" class="cell" fill="#8A5A0E" font-weight="700">Software testen</text>
<text x="225" y="255" class="cell" fill="#8A5A0E">volledige productiekopie —</text>
<text x="225" y="270" class="cell" fill="#8A5A0E">incl. medische gegevens</text>
<text x="415" y="255" class="cell" fill="#8A5A0E">?</text>
<text x="565" y="255" class="cell" fill="#8A5A0E">?</text>
<text x="740" y="255" class="cell" fill="#8A5A0E">onbekend</text>
<text x="900" y="255" class="cell" fill="#8A5A0E" font-weight="700">ONZICHTBAAR</text>

<rect x="40" y="298" width="960" height="46" fill="#FFFFFF" stroke="#E4E1D8"/>
<text x="55" y="325" class="cell" fill="#5B6675" font-style="italic">— drie testomgevingen zijn hier nooit als rij ingevuld —</text>

<rect x="150" y="370" width="740" height="70" rx="8" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>
<text x="520" y="396" text-anchor="middle" class="cell" fill="#8A5A0E" font-weight="700">"Staat dit ergens in ons verwerkingsregister?" — Sannes eerste vraag</text>
<text x="520" y="416" text-anchor="middle" class="cell">Een verwerking die feitelijk plaatsvindt maar organisatorisch niet bestaat</text>
</svg>
