<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 460" font-family="'DM Sans', Arial, sans-serif" width="1040" height="460" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:12px; font-weight:700; fill:#14213D; }
      .label-light { font-size:12px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:10.5px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .cell { font-size:10.5px; fill:#14213D; }
    </style>
</defs>
<rect width="1040" height="460" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 8 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Het verwerkingsregister — de testomgevingen als ontbrekende rij</text>

<rect x="40" y="100" width="960" height="40" fill="#2563A8"/>
<text x="55" y="125" class="label-light">DOEL</text>
<text x="225" y="125" class="label-light">CATEGORIEËN</text>
<text x="415" y="125" class="label-light">GRONDSLAG</text>
<text x="565" y="125" class="label-light">BEWAARTERMIJN</text>
<text x="740" y="125" class="label-light">MAATREGELEN</text>
<text x="900" y="125" class="label-light">STATUS</text>

<rect x="40" y="140" width="960" height="46" fill="#FFFFFF" stroke="#DFDCD3"/>
<text x="55" y="167" class="cell">Pensioenregeling uitvoeren</text>
<text x="225" y="167" class="cell">NAW, BSN, salaris</text>
<text x="415" y="167" class="cell">Overeenkomst</text>
<text x="565" y="167" class="cell">tot X jaar na einde</text>
<text x="740" y="167" class="cell">toegangscontrole, TLS</text>
<text x="900" y="167" class="cell" fill="#2563A8" font-weight="700">vastgelegd</text>

<rect x="40" y="186" width="960" height="46" fill="#FFFFFF" stroke="#DFDCD3"/>
<text x="55" y="213" class="cell">Aanlevering DNB</text>
<text x="225" y="213" class="cell">geaggregeerde cijfers</text>
<text x="415" y="213" class="cell">Wettelijke verplichting</text>
<text x="565" y="213" class="cell">per aanlevercyclus</text>
<text x="740" y="213" class="cell">export-log</text>
<text x="900" y="213" class="cell" fill="#2563A8" font-weight="700">vastgelegd</text>

<rect x="40" y="232" width="960" height="60" fill="#FBFAF7" stroke="#E9A13B" stroke-width="2.5" stroke-dasharray="6 4"/>
<text x="55" y="255" class="cell" fill="#9A5F0D" font-weight="700">Software testen</text>
<text x="225" y="255" class="cell" fill="#9A5F0D">volledige productiekopie —</text>
<text x="225" y="270" class="cell" fill="#9A5F0D">incl. medische gegevens</text>
<text x="415" y="255" class="cell" fill="#9A5F0D">?</text>
<text x="565" y="255" class="cell" fill="#9A5F0D">?</text>
<text x="740" y="255" class="cell" fill="#9A5F0D">onbekend</text>
<text x="900" y="255" class="cell" fill="#9A5F0D" font-weight="700">ONZICHTBAAR</text>

<rect x="40" y="298" width="960" height="46" fill="#FFFFFF" stroke="#DFDCD3"/>
<text x="55" y="325" class="cell" fill="#55606F" font-style="italic">— drie testomgevingen zijn hier nooit als rij ingevuld —</text>

<rect x="150" y="370" width="740" height="70" rx="8" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
<text x="520" y="396" text-anchor="middle" class="cell" fill="#9A5F0D" font-weight="700">"Staat dit ergens in ons verwerkingsregister?" — Sannes eerste vraag</text>
<text x="520" y="416" text-anchor="middle" class="cell">Een verwerking die feitelijk plaatsvindt maar organisatorisch niet bestaat</text>
</svg>
