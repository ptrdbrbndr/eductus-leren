<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'DM Sans', Arial, sans-serif" width="960" height="460" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:13px; font-weight:700; fill:#14213D; }
      .sub { font-size:11.5px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    </style>
</defs>
<rect width="960" height="460" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 5 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Multifactorauthenticatie — drie categorieën, minstens twee nodig</text>
<text x="40" y="96" class="sub">Een aanvaller moet beide in handen krijgen — aanzienlijk lastiger dan één.</text>

<rect x="50" y="140" width="270" height="220" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<circle cx="185" cy="180" r="20" fill="#2563A8"/>
<text x="185" y="187" text-anchor="middle" fill="#FBFAF7" font-weight="700" font-size="16">1</text>
<text x="185" y="225" text-anchor="middle" class="label">Iets wat je weet</text>
<text x="185" y="255" text-anchor="middle" class="sub">wachtwoord, pincode</text>
<rect x="70" y="290" width="230" height="50" rx="6" fill="#FBFAF7" stroke="#E9A13B" stroke-width="2"/>
<text x="185" y="320" text-anchor="middle" class="sub" fill="#9A5F0D" font-size="11">kan gestolen, geraden of hergebruikt zijn</text>

<rect x="345" y="140" width="270" height="220" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<circle cx="480" cy="180" r="20" fill="#2563A8"/>
<text x="480" y="187" text-anchor="middle" fill="#FBFAF7" font-weight="700" font-size="16">2</text>
<text x="480" y="225" text-anchor="middle" class="label">Iets wat je hebt</text>
<text x="480" y="255" text-anchor="middle" class="sub">authenticatie-app, token, smartcard</text>
<rect x="365" y="290" width="230" height="50" rx="6" fill="#FBFAF7" stroke="#2563A8" stroke-width="1.5"/>
<text x="480" y="320" text-anchor="middle" class="sub" font-size="11">onafhankelijk van het wachtwoord</text>

<rect x="640" y="140" width="270" height="220" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<circle cx="775" cy="180" r="20" fill="#2563A8"/>
<text x="775" y="187" text-anchor="middle" fill="#FBFAF7" font-weight="700" font-size="16">3</text>
<text x="775" y="225" text-anchor="middle" class="label">Iets wat je bent</text>
<text x="775" y="255" text-anchor="middle" class="sub">vingerafdruk, gezichtsherkenning</text>
<rect x="660" y="290" width="230" height="50" rx="6" fill="#FBFAF7" stroke="#2563A8" stroke-width="1.5"/>
<text x="775" y="320" text-anchor="middle" class="sub" font-size="11">biometrisch, niet over te dragen</text>

<rect x="150" y="385" width="660" height="55" rx="8" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
<text x="480" y="418" text-anchor="middle" class="sub" fill="#9A5F0D">Twee wachtwoorden na elkaar is geen MFA — dat is twee keer categorie 1</text>
</svg>
