<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="'DM Sans', Arial, sans-serif" width="960" height="420" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:15px; font-weight:700; fill:#14213D; }
      .label-light { font-size:15px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#2563A8; stroke-width:2.5; fill:none; marker-end:url(#arrb); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563A8"/></marker>
</defs>
<rect width="960" height="420" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 5 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Authenticatie en autorisatie — twee vragen, geen synoniemen</text>
<text x="40" y="96" class="sub">Elk systeem moet allebei goed hebben — sterk in de één zegt niets over de ander.</text>

<rect x="60" y="140" width="360" height="160" rx="8" fill="#2563A8"/>
<text x="240" y="175" text-anchor="middle" class="label-light">1 · AUTHENTICATIE</text>
<text x="240" y="205" text-anchor="middle" class="sub-light" font-size="14" font-style="italic">"Ben jij wie je zegt dat je bent?"</text>
<text x="240" y="235" text-anchor="middle" class="sub-light">wachtwoord, vingerafdruk, app-code</text>
<text x="240" y="260" text-anchor="middle" class="sub-light">— het moment van inloggen</text>

<path d="M420,220 L540,220" class="arrow"/>

<rect x="540" y="140" width="360" height="160" rx="8" fill="#14213D"/>
<text x="720" y="175" text-anchor="middle" class="label-light">2 · AUTORISATIE</text>
<text x="720" y="205" text-anchor="middle" class="sub-light" font-size="14" font-style="italic">"Mag jij dit specifieke doen?"</text>
<text x="720" y="235" text-anchor="middle" class="sub-light">bepaalt wat een geauthenticeerde</text>
<text x="720" y="252" text-anchor="middle" class="sub-light">gebruiker vervolgens kan zien of doen</text>

<rect x="150" y="330" width="660" height="70" rx="8" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
<text x="480" y="355" text-anchor="middle" class="sub" fill="#9A5F0D">De verlopen accounts: geen autorisatieprobleem (de rechten pasten bij het werk)</text>
<text x="480" y="375" text-anchor="middle" class="sub" fill="#9A5F0D">— wel een authenticatieprobleem dat nooit is stopgezet bij vertrek</text>
</svg>
