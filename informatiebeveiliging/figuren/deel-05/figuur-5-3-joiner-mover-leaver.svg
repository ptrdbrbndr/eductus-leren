<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="'DM Sans', Arial, sans-serif" width="900" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:11.5px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563A8"/></marker>
</defs>
<rect width="900" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 5 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Joiner–mover–leaver — waar het bij Meridiaan misging</text>
<text x="40" y="96" class="sub">Een cyclus die telkens rond zou moeten lopen — bij Meridiaan brak hij op één punt.</text>

<circle cx="450" cy="330" r="150" fill="none" stroke="#6FA3D6" stroke-width="2" stroke-dasharray="6 5"/>

<circle cx="450" cy="180" r="70" fill="#2563A8"/>
<text x="450" y="172" text-anchor="middle" class="label-light">JOINER</text>
<text x="450" y="192" text-anchor="middle" class="sub" fill="#DFDCD3" font-size="10">toegang bij indiensttreding</text>

<circle cx="620" cy="430" r="70" fill="#2563A8"/>
<text x="620" y="422" text-anchor="middle" class="label-light">MOVER</text>
<text x="620" y="440" text-anchor="middle" class="sub" fill="#DFDCD3" font-size="10">functiewijziging —</text>
<text x="620" y="454" text-anchor="middle" class="sub" fill="#DFDCD3" font-size="10">privilege creep dreigt</text>

<circle cx="280" cy="430" r="72" fill="#E9A13B" stroke="#9A5F0D" stroke-width="3"/>
<text x="280" y="422" text-anchor="middle" class="label" fill="#14213D">LEAVER</text>
<text x="280" y="440" text-anchor="middle" font-size="10" fill="#14213D">toegang intrekken —</text>
<text x="280" y="454" text-anchor="middle" font-size="10" fill="#14213D">hier ging het mis</text>

<path d="M505,220 Q580,280 585,370" class="arrow" fill="none"/>
<path d="M555,470 Q450,510 345,470" class="arrow" fill="none"/>
<path d="M245,375 Q300,270 395,220" class="arrow" fill="none" stroke-dasharray="5 4" opacity="0.4"/>

<rect x="60" y="530" width="780" height="70" rx="8" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
<text x="450" y="558" text-anchor="middle" class="sub" fill="#9A5F0D">214 accounts, geen sluitend leaver-proces: 8 van 20 gecontroleerde accounts</text>
<text x="450" y="578" text-anchor="middle" class="sub" fill="#9A5F0D">hoorden bij mensen die al jaren waren vertrokken</text>
</svg>
