<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:13px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:13px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:11px; fill:#3A4250; }
      .sub-light { font-size:11px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .leader { stroke:#5B6675; stroke-width:1; fill:none; }
    </style>
</defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 28 · PIRAMIDE</text>
<text x="40" y="64" class="title">De risicocategorieën van de AI-verordening</text>
<text x="40" y="96" class="sub" fill="#5B6675">Zwaardere eisen naarmate het risico groter is — dezelfde logica als ISO 27001 en DORA.</text>

<polygon points="100,520 860,520 765,425 195,425" fill="#C5D8F0" stroke="#1A4F8B" stroke-width="1.5"/>
<polygon points="195,425 765,425 670,330 290,330" fill="#8AAFD4" stroke="#1A4F8B" stroke-width="1.5"/>
<polygon points="290,330 670,330 575,235 385,235" fill="#E8A020" stroke="#8A5A0E" stroke-width="1.5"/>
<polygon points="385,235 575,235 500,140 460,140" fill="#0D1B2A" stroke="#0D1B2A" stroke-width="1.5"/>

<text x="480" y="465" text-anchor="middle" class="label">MINIMAAL</text>
<text x="480" y="484" text-anchor="middle" class="sub">de meeste toepassingen — geen extra eisen</text>

<text x="480" y="370" text-anchor="middle" class="label">BEPERKT</text>
<text x="480" y="389" text-anchor="middle" class="sub">transparantieverplichting (bijv. chatbots)</text>

<text x="480" y="275" text-anchor="middle" class="label" fill="#0D1B2A">HOOG</text>
<text x="480" y="293" text-anchor="middle" class="sub" fill="#5B3B0E">Meridiaans fraudedetectiesysteem, latere fase</text>

<line x1="500" y1="150" x2="640" y2="150" class="leader"/>
<line x1="640" y1="150" x2="640" y2="130" class="leader"/>
<text x="650" y="120" class="label" font-size="12">ONAANVAARDBAAR</text>
<text x="650" y="137" class="sub">verboden</text>

<rect x="640" y="290" width="220" height="90" rx="6" fill="#FFFFFF" stroke="#8A5A0E" stroke-width="2"/>
<text x="750" y="312" text-anchor="middle" class="sub" font-weight="700" fill="#8A5A0E">HOOG vereist:</text>
<text x="660" y="330" class="sub" font-size="10">risicobeheersysteem</text>
<text x="660" y="345" class="sub" font-size="10">datakwaliteit trainingsdata</text>
<text x="660" y="360" class="sub" font-size="10">transparantie &amp; menselijk toezicht</text>

<text x="480" y="570" text-anchor="middle" class="sub" fill="#8A5A0E" font-size="12">financiële toepassingen die de toegang tot diensten beïnvloeden, vallen doorgaans in HOOG</text>
</svg>
