<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="'DM Sans', Arial, sans-serif" width="960" height="600" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .sub { font-size:12px; fill:#0D1B2A; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
    </style>
</defs>
<rect width="960" height="600" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 28 · VENN-DIAGRAM</text>
<text x="40" y="64" class="title">AVG-vraagstukken versus AI-verordening-vraagstukken</text>
<text x="40" y="96" class="sub" fill="#5B6675">Geen apart AI-privacyregime — wel scherpere vormen van vraagstukken die deze cursus al kent.</text>

<circle cx="330" cy="320" r="200" fill="#C5D8F0" fill-opacity="0.75" stroke="#1A4F8B" stroke-width="2"/>
<circle cx="630" cy="320" r="200" fill="#8AAFD4" fill-opacity="0.75" stroke="#1A4F8B" stroke-width="2"/>

<text x="220" y="150" class="label">AVG</text>
<text x="700" y="150" text-anchor="end" class="label">AI-VERORDENING</text>

<text x="180" y="240" class="sub" font-weight="700">Grondslag &amp; doelbinding</text>
<text x="180" y="258" class="sub" font-size="11">deel 3, 17</text>
<text x="180" y="300" class="sub" font-weight="700">Minimale gegevens-</text>
<text x="180" y="316" class="sub" font-weight="700">verwerking</text>
<text x="180" y="332" class="sub" font-size="11">deel 3</text>
<text x="180" y="374" class="sub" font-weight="700">Geautomatiseerde</text>
<text x="180" y="390" class="sub" font-weight="700">besluitvorming</text>
<text x="180" y="406" class="sub" font-size="11">deel 17</text>

<text x="790" y="240" text-anchor="end" class="sub" font-weight="700">Risicocategorieën</text>
<text x="790" y="256" text-anchor="end" class="sub" font-size="11">piramide, figuur 28-2</text>
<text x="790" y="300" text-anchor="end" class="sub" font-weight="700">Datakwaliteit</text>
<text x="790" y="316" text-anchor="end" class="sub" font-weight="700">trainingsdata</text>
<text x="790" y="374" text-anchor="end" class="sub" font-weight="700">Menselijk toezicht</text>
<text x="790" y="390" text-anchor="end" class="sub" font-weight="700">&amp; transparantie</text>

<rect x="435" y="290" width="90" height="60" rx="6" fill="#F5F4F0" stroke="#E8A020" stroke-width="2"/>
<text x="480" y="312" text-anchor="middle" class="sub" fill="#8A5A0E" font-weight="700" font-size="11">DPIA</text>
<text x="480" y="328" text-anchor="middle" class="sub" fill="#8A5A0E" font-size="9">deel 16, 17</text>
<text x="480" y="342" text-anchor="middle" class="sub" fill="#8A5A0E" font-size="9">dekt beide</text>

<text x="480" y="565" text-anchor="middle" class="sub" fill="#8A5A0E" font-weight="400">een goed uitgevoerde DPIA levert al veel bewijs dat de AI-verordening ook vraagt — maar niet alles</text>
</svg>
