<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="'DM Sans', Arial, sans-serif" width="960" height="480" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:13px; font-weight:700; fill:#0D1B2A; }
      .sub { font-size:11px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#1A4F8B; stroke-width:1.5; fill:none; }
      .arrow-amber { stroke:#E8A020; stroke-width:1.5; fill:none; stroke-dasharray:4 3; }
    </style>
</defs>
<rect width="960" height="480" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 28 · TIJDLIJN</text>
<text x="40" y="64" class="title">"Harvest now, decrypt later"</text>
<text x="40" y="96" class="sub">De dreiging hoeft nu niet te bestaan om nu al relevant te zijn.</text>

<rect x="60" y="140" width="300" height="110" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="210" y="164" text-anchor="middle" class="label" font-size="12">VANDAAG (2026)</text>
<text x="80" y="188" class="sub">data versleuteld verstuurd</text>
<text x="80" y="204" class="sub">of opgeslagen — een aanvaller</text>
<text x="80" y="220" class="sub">onderschept en bewaart het</text>
<text x="80" y="236" class="sub" font-weight="700" fill="#1A4F8B">("harvest now")</text>

<rect x="600" y="140" width="300" height="110" rx="8" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5" stroke-dasharray="6 4"/>
<text x="750" y="164" text-anchor="middle" class="label" font-size="12">TOEKOMST — onbekend wanneer</text>
<text x="620" y="188" class="sub">quantumcomputer wordt</text>
<text x="620" y="204" class="sub">krachtig genoeg — de aanvaller</text>
<text x="620" y="220" class="sub">ontsleutelt de data alsnog</text>
<text x="620" y="236" class="sub" font-weight="700" fill="#8A5A0E">("decrypt later")</text>

<line x1="100" y1="300" x2="900" y2="300" stroke="#5B6675" stroke-width="1.5"/>
<line x1="210" y1="250" x2="210" y2="292" class="arrow"/>
<circle cx="210" cy="300" r="8" fill="#1A4F8B"/>
<line x1="750" y1="250" x2="750" y2="292" class="arrow-amber"/>
<circle cx="750" cy="300" r="8" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>

<line x1="210" y1="340" x2="210" y2="360" stroke="#8A5A0E" stroke-width="1.5"/>
<line x1="750" y1="340" x2="750" y2="360" stroke="#8A5A0E" stroke-width="1.5"/>
<line x1="210" y1="360" x2="750" y2="360" stroke="#8A5A0E" stroke-width="2"/>
<text x="480" y="385" text-anchor="middle" class="sub" fill="#8A5A0E" font-weight="700">bewaartermijn pensioengegevens: kan decennia beslaan (deel 8)</text>

<text x="480" y="440" text-anchor="middle" class="sub" fill="#8A5A0E">cryptografische wendbaarheid is het antwoord — niet wachten tot de dreiging concreet is</text>
</svg>
