<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="'DM Sans', Arial, sans-serif" width="960" height="500" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    </style>
</defs>
<rect width="960" height="500" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 20 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Meetwaarden die niet liegen</text>
<text x="40" y="96" class="sub">Niet elke meetwaarde is even bruikbaar — sommige verleiden juist tot een verkeerde conclusie.</text>

<rect x="60" y="130" width="400" height="290" rx="8" fill="#F4F2EC" stroke="#55606F" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="260" y="162" text-anchor="middle" class="label">MISLEIDEND</text>
<rect x="90" y="182" width="340" height="60" rx="6" fill="#FFFFFF"/>
<text x="260" y="208" text-anchor="middle" class="sub" font-weight="700">"Aantal beveiligingsincidenten"</text>
<text x="260" y="226" text-anchor="middle" class="sub" font-size="11">dalend cijfer, twee tegenstrijdige lezingen</text>
<text x="110" y="272" class="sub">— beter geworden, óf</text>
<text x="110" y="290" class="sub">— detectie verslechterd</text>
<text x="110" y="316" class="sub">gekozen omdat makkelijk</text>
<text x="110" y="332" class="sub">te meten, niet omdat het</text>
<text x="110" y="348" class="sub">een risico dekt</text>
<text x="110" y="378" class="sub">geen vergelijkbaarheid over</text>
<text x="110" y="394" class="sub">tijd zonder context</text>

<rect x="500" y="130" width="400" height="290" rx="8" fill="#2563A8"/>
<text x="700" y="162" text-anchor="middle" class="label-light">GOED</text>
<rect x="530" y="182" width="340" height="80" rx="6" fill="#E9A13B"/>
<text x="700" y="206" text-anchor="middle" class="sub" fill="#6B4509" font-weight="700">Incidenten gemeld ván</text>
<text x="700" y="224" text-anchor="middle" class="sub" fill="#6B4509" font-weight="700">medewerkers zelf</text>
<text x="700" y="244" text-anchor="middle" class="sub" fill="#6B4509" font-size="11">stijgend aantal = gezonde meldingscultuur</text>
<text x="550" y="292" class="sub-light">+ gemiddelde tijd tot detectie</text>
<text x="550" y="308" class="sub-light">(deel 7, logging)</text>
<text x="550" y="334" class="sub-light">— direct gekoppeld aan een</text>
<text x="550" y="350" class="sub-light">   risico of doel</text>
<text x="550" y="374" class="sub-light">— gekoppeld aan een</text>
<text x="550" y="390" class="sub-light">   verantwoordelijke die het kan</text>
<text x="550" y="406" class="sub-light">   beïnvloeden</text>

<text x="480" y="460" text-anchor="middle" class="sub" fill="#9A5F0D">een meetwaarde zonder eigenaar wordt zelden structureel bijgehouden</text>
</svg>
