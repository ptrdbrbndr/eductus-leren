<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="'DM Sans', Arial, sans-serif" width="960" height="600" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .sub-light { font-size:12px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .lvl { font-size:22px; font-weight:700; font-family:'Cormorant Garamond', Georgia, serif; }
    </style>
</defs>
<rect width="960" height="600" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 20 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Het vierniveau-model — DNB, sinds 2026</text>
<text x="40" y="96" class="sub">"Aanwezig, aantoonbaar, werkend" is vrijwel letterlijk "opzet, bestaan en werking" in toezichtstaal.</text>

<rect x="40" y="140" width="200" height="130" fill="#F0EDE4" stroke="#5B6675" stroke-width="1"/>
<text x="140" y="170" text-anchor="middle" class="lvl" fill="#5B6675">0</text>
<text x="140" y="196" text-anchor="middle" class="label" font-size="12">Niet bestaand</text>
<text x="60" y="220" class="sub" font-size="11">geen maatregel of</text>
<text x="60" y="236" class="sub" font-size="11">proces</text>

<rect x="240" y="140" width="200" height="130" fill="#C5D8F0"/>
<text x="340" y="170" text-anchor="middle" class="lvl" fill="#1A4F8B">1</text>
<text x="340" y="196" text-anchor="middle" class="label" font-size="12">Initieel</text>
<text x="260" y="220" class="sub" font-size="11">ad hoc, afhankelijk</text>
<text x="260" y="236" class="sub" font-size="11">van individuen</text>
<text x="260" y="256" class="sub" font-size="10" font-style="italic">Meridiaan in deel 1</text>

<rect x="440" y="140" width="200" height="130" fill="#8AAFD4"/>
<text x="540" y="170" text-anchor="middle" class="lvl" fill="#0D1B2A">2</text>
<text x="540" y="196" text-anchor="middle" class="label" font-size="12">Herhaalbaar, informeel</text>
<text x="460" y="220" class="sub" font-size="11">consistent maar niet</text>
<text x="460" y="236" class="sub" font-size="11">vastgelegd</text>
<text x="460" y="256" class="sub" font-size="10" font-style="italic">kennis vertrekt met de persoon</text>

<rect x="640" y="130" width="280" height="150" fill="#1A4F8B" stroke="#E8A020" stroke-width="3"/>
<text x="780" y="164" text-anchor="middle" class="lvl" fill="#F5F4F0">3</text>
<text x="780" y="190" text-anchor="middle" class="label-light" font-size="13">Gedefinieerd</text>

<line x1="70" y1="300" x2="890" y2="300" stroke="#5B6675" stroke-width="1"/>

<rect x="660" y="316" width="240" height="80" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="780" y="340" text-anchor="middle" class="label" font-size="12">OPZET</text>
<text x="680" y="360" class="sub" font-size="10.5">proces is beschreven</text>

<rect x="660" y="404" width="240" height="80" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="780" y="428" text-anchor="middle" class="label" font-size="12">BESTAAN</text>
<text x="680" y="448" class="sub" font-size="10.5">aantoonbaar gevolgd, met bewijs</text>

<rect x="660" y="492" width="240" height="80" rx="6" fill="#E8A020"/>
<text x="780" y="516" text-anchor="middle" class="label" font-size="12" fill="#5A3A08">WERKING</text>
<text x="680" y="536" class="sub" font-size="10.5" fill="#5A3A08">bereikt het beoogde resultaat,</text>
<text x="680" y="550" class="sub" font-size="10.5" fill="#5A3A08">niet alleen op papier</text>

<text x="330" y="470" class="sub" font-weight="700">Alle drie tegelijk — niet</text>
<text x="330" y="490" class="sub" font-weight="700">alleen "ja" op de eerste vraag</text>
<text x="330" y="514" class="sub">"hebben we een beleid voor X?"</text>
<text x="330" y="532" class="sub">beantwoordt alléén opzet</text>
</svg>
