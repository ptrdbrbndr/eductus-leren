<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:13px; font-weight:700; fill:#14213D; }
      .sub { font-size:11px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-amber { stroke:#E9A13B; stroke-width:2; fill:none; marker-end:url(#arra); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#E9A13B"/></marker>
</defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 29 · BESLISBOOM</text>
<text x="40" y="64" class="title">De DNB-toets als snelle ethische controle</text>
<text x="40" y="96" class="sub">Bij twijfel: één simpele vraag, met een directe uitkomst.</text>

<rect x="330" y="120" width="300" height="50" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="480" y="150" text-anchor="middle" class="sub" font-weight="700">twijfel over een handelwijze, communicatie of besluit</text>

<line x1="480" y1="170" x2="480" y2="198" class="arrow"/>

<polygon points="480,200 660,285 480,370 300,285" fill="#6FA3D6" stroke="#2563A8" stroke-width="2"/>
<text x="480" y="265" text-anchor="middle" class="sub" font-weight="700" fill="#14213D">DNB-TOETS: kan ik dit rustig</text>
<text x="480" y="283" text-anchor="middle" class="sub" font-weight="700" fill="#14213D">en volledig uitleggen aan een</text>
<text x="480" y="301" text-anchor="middle" class="sub" font-weight="700" fill="#14213D">toezichthouder die alle</text>
<text x="480" y="319" text-anchor="middle" class="sub" font-weight="700" fill="#14213D">feiten kent?</text>

<line x1="655" y1="285" x2="700" y2="285" class="arrow"/>
<text x="678" y="275" text-anchor="middle" class="sub" font-weight="700" fill="#2563A8">JA</text>
<rect x="705" y="250" width="205" height="90" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="807" y="280" text-anchor="middle" class="sub" font-weight="700">handelwijze is</text>
<text x="807" y="296" text-anchor="middle" class="sub" font-weight="700">verantwoord</text>
<text x="807" y="316" text-anchor="middle" class="sub">— doorgaan</text>

<line x1="305" y1="285" x2="260" y2="285" class="arrow-amber"/>
<text x="282" y="275" text-anchor="middle" class="sub" font-weight="700" fill="#9A5F0D">NEE</text>
<rect x="50" y="240" width="205" height="110" rx="8" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
<text x="152" y="266" text-anchor="middle" class="sub" font-weight="700" fill="#9A5F0D">iets zou verzwegen of</text>
<text x="152" y="282" text-anchor="middle" class="sub" font-weight="700" fill="#9A5F0D">afgezwakt worden</text>
<text x="152" y="304" text-anchor="middle" class="sub">→ handelwijze deugt niet,</text>
<text x="152" y="320" text-anchor="middle" class="sub">ongeacht de bedoeling</text>

<line x1="480" y1="370" x2="480" y2="398" class="arrow"/>

<rect x="230" y="404" width="500" height="80" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="480" y="428" text-anchor="middle" class="sub" font-weight="700">Merels casus, drie maanden later</text>
<text x="480" y="448" text-anchor="middle" class="sub">"we hebben het destijds klein ingeschat</text>
<text x="480" y="464" text-anchor="middle" class="sub">en niet formeel beoordeeld" — niet uit te leggen zonder ongemak</text>

<line x1="480" y1="484" x2="480" y2="510" class="arrow-amber"/>

<rect x="230" y="516" width="500" height="70" rx="8" fill="#E9A13B"/>
<text x="480" y="544" text-anchor="middle" class="label" font-size="12">NEE → alsnog formeel beoordelen</text>
<text x="480" y="564" text-anchor="middle" class="sub" fill="#14213D">mail naar Sanne, in kopie naar Hugo</text>
</svg>
