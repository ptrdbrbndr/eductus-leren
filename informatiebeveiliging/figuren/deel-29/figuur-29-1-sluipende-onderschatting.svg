<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="'DM Sans', Arial, sans-serif" width="960" height="580" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:12px; font-weight:700; fill:#0D1B2A; }
      .sub { font-size:11px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .quote { font-size:11px; font-style:italic; fill:#0D1B2A; }
      .arrow { stroke:#5B6675; stroke-width:1.5; fill:none; marker-end:url(#arrg); }
    </style>
    <marker id="arrg" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5B6675"/></marker>
</defs>
<rect width="960" height="580" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 29 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">De sluipende onderschatting van een incident</text>
<text x="40" y="96" class="sub">Zelden een openlijke leugen — elke herformulering lijkt op zichzelf onschuldig.</text>

<line x1="100" y1="450" x2="880" y2="450" stroke="#0D1B2A" stroke-width="1.5"/>

<text x="210" y="240" text-anchor="middle" class="label" font-size="11">DAG 0</text>
<rect x="140" y="255" width="140" height="195" fill="#8AAFD4" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="210" y="475" text-anchor="middle" class="quote">"waarschijnlijk</text>
<text x="210" y="490" text-anchor="middle" class="quote">beperkt"</text>
<path d="M290 350 L310 350" class="arrow"/>

<text x="390" y="280" text-anchor="middle" class="label" font-size="11">WEEK 1</text>
<rect x="320" y="295" width="140" height="155" fill="#8AAFD4" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="390" y="475" text-anchor="middle" class="quote">"zeker beperkt"</text>
<text x="390" y="490" text-anchor="middle" class="sub">(herinnering vervormt)</text>
<path d="M470 380 L490 380" class="arrow"/>

<text x="570" y="320" text-anchor="middle" class="label" font-size="11">MAAND 2</text>
<rect x="500" y="335" width="140" height="115" fill="#8AAFD4" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="570" y="475" text-anchor="middle" class="quote">"waarschijnlijk niet</text>
<text x="570" y="490" text-anchor="middle" class="quote">opgemerkt"</text>
<path d="M650 400 L670 400" class="arrow"/>

<text x="750" y="360" text-anchor="middle" class="label" font-size="11">MAAND 3 — NU</text>
<rect x="680" y="375" width="140" height="75" fill="#E8A020" stroke="#8A5A0E" stroke-width="2.5"/>
<text x="750" y="475" text-anchor="middle" class="quote" fill="#8A5A0E">"dit was toch</text>
<text x="750" y="490" text-anchor="middle" class="quote" fill="#8A5A0E">niet zo erg"</text>

<rect x="60" y="510" width="840" height="50" rx="8" fill="#FFFFFF" stroke="#E8A020" stroke-width="2"/>
<text x="480" y="540" text-anchor="middle" class="sub" fill="#8A5A0E" font-weight="700">geen bewust besluit om niet te melden — de meldingsplicht wordt stilzwijgend omzeild</text>
</svg>
