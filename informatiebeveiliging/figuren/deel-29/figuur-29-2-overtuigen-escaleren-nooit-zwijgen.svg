<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="'DM Sans', Arial, sans-serif" width="960" height="520" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:11px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .num { font-size:14px; font-weight:700; fill:#F5F4F0; }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1A4F8B"/></marker>
</defs>
<rect width="960" height="520" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 29 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Overtuigen — escaleren — nooit zwijgen</text>
<text x="40" y="96" class="sub">Drie stappen die niemand mag overslaan, en die niemand verder mag gaan dan noodzakelijk.</text>

<rect x="100" y="140" width="220" height="190" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<circle cx="132" cy="170" r="15" fill="#1A4F8B"/><text x="132" y="175" text-anchor="middle" class="num">1</text>
<text x="158" y="175" class="label" font-size="13">OVERTUIGEN</text>
<text x="118" y="205" class="sub">advies helder, met bewijs</text>
<text x="118" y="221" class="sub">en de juiste urgentie</text>
<text x="118" y="237" class="sub">herhalen, desnoods</text>
<text x="118" y="253" class="sub">meermaals — tot het bestuur</text>
<text x="118" y="269" class="sub">de implicaties volledig</text>
<text x="118" y="285" class="sub">begrijpt</text>

<line x1="320" y1="235" x2="360" y2="235" class="arrow"/>

<rect x="370" y="140" width="220" height="190" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<circle cx="402" cy="170" r="15" fill="#1A4F8B"/><text x="402" y="175" text-anchor="middle" class="num">2</text>
<text x="428" y="175" class="label" font-size="13">ESCALEREN</text>
<text x="388" y="205" class="sub">als overtuigen niet werkt:</text>
<text x="388" y="221" class="sub">het punt op een hoger</text>
<text x="388" y="237" class="sub">niveau brengen — voltallig</text>
<text x="388" y="253" class="sub">bestuur, raad van commis-</text>
<text x="388" y="269" class="sub">sarissen, of een onafhanke-</text>
<text x="388" y="285" class="sub">lijke derde in de governance</text>

<line x1="590" y1="235" x2="630" y2="235" class="arrow"/>

<rect x="640" y="140" width="220" height="190" rx="8" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>
<circle cx="672" cy="170" r="15" fill="#E8A020"/><text x="672" y="175" text-anchor="middle" class="num" fill="#0D1B2A">3</text>
<text x="698" y="175" class="label" font-size="13" fill="#8A5A0E">NOOIT ZWIJGEN</text>
<text x="658" y="205" class="sub">advies en positie</text>
<text x="658" y="221" class="sub">aantoonbaar vastleggen</text>
<text x="658" y="237" class="sub">(deel 23) — in het uiterste</text>
<text x="658" y="253" class="sub">geval de grens van wat je</text>
<text x="658" y="269" class="sub">professioneel kunt</text>
<text x="658" y="285" class="sub">verantwoorden</text>

<line x1="100" y1="360" x2="860" y2="360" stroke="#0D1B2A" stroke-width="2" stroke-dasharray="8 5"/>
<text x="480" y="352" text-anchor="middle" class="sub" font-weight="700">— grens van het mandaat —</text>

<rect x="230" y="375" width="500" height="70" rx="8" fill="#0D1B2A"/>
<circle cx="270" cy="410" r="16" fill="none" stroke="#E8A020" stroke-width="3"/>
<line x1="260" y1="400" x2="280" y2="420" stroke="#E8A020" stroke-width="3"/>
<text x="300" y="402" class="label-light" font-size="12">NIET toegestaan</text>
<text x="300" y="420" class="sub-light" font-size="10" fill="#E4E1D8">zelf, buiten het bestuur om,</text>
<text x="300" y="435" class="sub-light" font-size="10" fill="#E4E1D8">alsnog melden of naar buiten brengen</text>

<text x="480" y="485" text-anchor="middle" class="sub" fill="#8A5A0E">geen enkele stap mag worden overgeslagen, en niemand mag verder gaan dan stap 3</text>
</svg>
