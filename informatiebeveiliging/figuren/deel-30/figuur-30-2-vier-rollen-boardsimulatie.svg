<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'DM Sans', Arial, sans-serif" width="960" height="640" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .sub { font-size:11px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .tag { font-size:10px; font-weight:700; letter-spacing:.05em; }
    </style>
</defs>
<rect width="960" height="640" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 30 · MATRIX</text>
<text x="40" y="64" class="title">De vier rollen van de boardsimulatie</text>
<text x="40" y="96" class="sub">Elke rol brengt een eigen belang mee — en dus een eigen spanning met de andere drie.</text>

<rect x="70" y="130" width="405" height="215" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="94" y="160" class="label" font-size="13">Hugo Prins</text>
<text x="94" y="178" class="sub">bestuurder, portefeuille IT &amp; risico</text>
<text x="94" y="206" class="tag" fill="#1A4F8B">BELANG</text>
<text x="94" y="224" class="sub">snelle, opgeloste situatie —</text>
<text x="94" y="240" class="sub">enorme tijdsdruk van de Stelselovergang</text>
<text x="94" y="268" class="tag" fill="#8A5A0E">SPANNING</text>
<text x="94" y="286" class="sub">vatbaar voor de verleiding het incident</text>
<text x="94" y="302" class="sub">klein te houden — vaak onbewust (deel 29)</text>
<text x="94" y="320" class="sub">niet vijandig, wel onder druk</text>

<rect x="485" y="130" width="405" height="215" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="509" y="160" class="label" font-size="13">De DNB-toezichthouder</text>
<text x="509" y="178" class="sub">rolspeler, lopend onderzoek (deel 25)</text>
<text x="509" y="206" class="tag" fill="#1A4F8B">BELANG</text>
<text x="509" y="224" class="sub">scherpe, feitelijke vragen over</text>
<text x="509" y="240" class="sub">procesbeheersing en ketenrisico</text>
<text x="509" y="268" class="tag" fill="#8A5A0E">SPANNING</text>
<text x="509" y="286" class="sub">test of Meridiaan structureel in</text>
<text x="509" y="302" class="sub">controle is — niet alleen dit ene</text>
<text x="509" y="318" class="sub">incident (deel 24, 25)</text>

<rect x="70" y="365" width="405" height="215" rx="8" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>
<text x="94" y="395" class="label" font-size="13">Sanne</text>
<text x="94" y="413" class="sub">FG, namens de privacykant</text>
<text x="94" y="441" class="tag" fill="#1A4F8B">BELANG</text>
<text x="94" y="459" class="sub">doorvragen op grondslag, DPIA</text>
<text x="94" y="475" class="sub">en de drempel voor informeren</text>
<text x="94" y="503" class="tag" fill="#8A5A0E">SPANNING</text>
<text x="94" y="521" class="sub">laat de privacydimensie niet onder-</text>
<text x="94" y="537" class="sub">geschikt maken aan de tijdsdruk</text>
<text x="94" y="553" class="sub">van de Stelselovergang</text>

<rect x="485" y="365" width="405" height="215" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="509" y="395" class="label" font-size="13">Dennis Kolthoff</text>
<text x="509" y="413" class="sub">leveranciersdirecteur</text>
<text x="509" y="441" class="tag" fill="#1A4F8B">BELANG</text>
<text x="509" y="459" class="sub">niet als enige schuldige</text>
<text x="509" y="475" class="sub">afgeschilderd worden</text>
<text x="509" y="503" class="tag" fill="#8A5A0E">SPANNING</text>
<text x="509" y="521" class="sub">draagt zowel (nieuwe) feiten aan als</text>
<text x="509" y="537" class="sub">verdedigt zichzelf: het ontbreken in het</text>
<text x="509" y="553" class="sub">register is mede Meridiaans fout</text>

<text x="480" y="615" text-anchor="middle" class="sub" fill="#8A5A0E">standhouden tegen alle vier tegelijk, met behoud van een terecht punt erkennen</text>
</svg>
