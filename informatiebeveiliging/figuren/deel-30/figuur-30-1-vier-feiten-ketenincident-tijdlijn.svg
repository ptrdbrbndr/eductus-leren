<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="'DM Sans', Arial, sans-serif" width="960" height="580" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:12px; font-weight:700; fill:#0D1B2A; }
      .sub { font-size:11px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#1A4F8B; stroke-width:1.5; fill:none; }
      .arrow-amber { stroke:#E8A020; stroke-width:1.5; fill:none; stroke-dasharray:4 3; }
    </style>
</defs>
<rect width="960" height="580" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 30 · TIJDLIJN</text>
<text x="40" y="64" class="title">De vier feiten van het ketenincident</text>
<text x="40" y="96" class="sub">Ze komen niet in deze volgorde of op hetzelfde moment aan het licht — precies zoals een echt incident zich ontvouwt.</text>

<line x1="80" y1="320" x2="900" y2="320" stroke="#0D1B2A" stroke-width="1.5"/>

<circle cx="140" cy="320" r="8" fill="#0D1B2A"/>
<line x1="140" y1="220" x2="140" y2="312" class="arrow"/>
<rect x="50" y="140" width="180" height="80" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="140" y="164" text-anchor="middle" class="label" font-size="11">DINSDAGOCHTEND</text>
<text x="140" y="184" text-anchor="middle" class="sub">melding Kolthoff:</text>
<text x="140" y="200" text-anchor="middle" class="sub">inbraak, 3 dagen eerder</text>

<rect x="80" y="336" width="800" height="26" rx="6" fill="#C5D8F0" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="480" y="354" text-anchor="middle" class="sub" font-weight="700">FEIT 3 — communicatiecampagne naar 340.000 deelnemers loopt gewoon door</text>

<circle cx="380" cy="320" r="8" fill="#1A4F8B"/>
<line x1="380" y1="220" x2="380" y2="312" class="arrow"/>
<rect x="290" y="140" width="180" height="80" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="380" y="162" text-anchor="middle" class="label" font-size="11">FEIT 1</text>
<text x="380" y="180" text-anchor="middle" class="sub">bijzondere persoons-</text>
<text x="380" y="196" text-anchor="middle" class="sub">gegevens (arbeidsonge-</text>
<text x="380" y="212" text-anchor="middle" class="sub">schiktheid) in de dataset</text>

<circle cx="580" cy="320" r="8" fill="#1A4F8B"/>
<line x1="580" y1="220" x2="580" y2="312" class="arrow"/>
<rect x="490" y="140" width="180" height="80" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="580" y="162" text-anchor="middle" class="label" font-size="11">FEIT 2</text>
<text x="580" y="180" text-anchor="middle" class="sub">leverancier ontbreekt</text>
<text x="580" y="196" text-anchor="middle" class="sub">in het DORA-informatie-</text>
<text x="580" y="212" text-anchor="middle" class="sub">register</text>

<circle cx="800" cy="320" r="8" fill="none" stroke="#E8A020" stroke-width="3"/>
<line x1="800" y1="380" x2="800" y2="328" class="arrow-amber"/>
<rect x="700" y="386" width="200" height="100" rx="8" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>
<text x="800" y="410" text-anchor="middle" class="label" font-size="11" fill="#8A5A0E">FEIT 4</text>
<text x="800" y="428" text-anchor="middle" class="sub">interne mail: omvang</text>
<text x="800" y="444" text-anchor="middle" class="sub">bewust "strak" definiëren</text>
<text x="800" y="460" text-anchor="middle" class="sub">— per ongeluk breed</text>
<text x="800" y="476" text-anchor="middle" class="sub">verspreid, moment onzeker</text>

<text x="480" y="550" text-anchor="middle" class="sub" fill="#8A5A0E">de helft van de feiten is vooraf bekend — de andere helft komt pas tijdens de boardsimulatie naar boven</text>
</svg>
