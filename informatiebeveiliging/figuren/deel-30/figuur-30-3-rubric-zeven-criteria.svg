<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="'DM Sans', Arial, sans-serif" width="960" height="700" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:13px; font-weight:700; fill:#0D1B2A; }
      .sub { font-size:11px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .num { font-size:13px; font-weight:700; fill:#F5F4F0; }
    </style>
</defs>
<rect width="960" height="700" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 30 · INSTRUMENT</text>
<text x="40" y="64" class="title">De rubric: zeven criteria voor de masterproef</text>
<text x="40" y="96" class="sub">Criterium 5 en 6 wegen het zwaarst — een onderbouwd "nee" telt zwaarder dan een oppervlakkig "ja".</text>

<rect x="60" y="130" width="840" height="60" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<circle cx="92" cy="160" r="15" fill="#1A4F8B"/><text x="92" y="165" text-anchor="middle" class="num">1</text>
<text x="118" y="155" class="label" font-size="12">Volledigheid van de diagnose</text>
<text x="118" y="173" class="sub">zijn alle vier kernfeiten, inclusief hun onderlinge spanning, herkend?</text>

<rect x="60" y="198" width="840" height="60" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<circle cx="92" cy="228" r="15" fill="#1A4F8B"/><text x="92" y="233" text-anchor="middle" class="num">2</text>
<text x="118" y="223" class="label" font-size="12">Kwaliteit van de meldingsanalyse</text>
<text x="118" y="241" class="sub">worden AVG en DORA correct behandeld, niet als één ongedifferentieerd geheel?</text>

<rect x="60" y="266" width="840" height="60" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<circle cx="92" cy="296" r="15" fill="#1A4F8B"/><text x="92" y="301" text-anchor="middle" class="num">3</text>
<text x="118" y="291" class="label" font-size="12">De ketenrisico-analyse</text>
<text x="118" y="309" class="sub">wordt de ontbrekende registratie herkend als systeemfout, niet als toeval?</text>

<rect x="60" y="334" width="840" height="60" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<circle cx="92" cy="364" r="15" fill="#1A4F8B"/><text x="92" y="369" text-anchor="middle" class="num">4</text>
<text x="118" y="359" class="label" font-size="12">Privacydimensie in balans met de procesdimensie</text>
<text x="118" y="377" class="sub">overschaduwt de AP-taal de DNB-taal, of andersom?</text>

<rect x="60" y="402" width="840" height="66" rx="6" fill="#FFFFFF" stroke="#E8A020" stroke-width="3"/>
<circle cx="92" cy="435" r="16" fill="#E8A020"/><text x="92" y="440" text-anchor="middle" class="num" fill="#0D1B2A">5</text>
<text x="118" y="427" class="label" font-size="12" fill="#8A5A0E">Het onderbouwde "nee, dit niet"</text>
<text x="118" y="445" class="sub">zichtbare, beargumenteerde afwijzing van een verleidelijke maar onjuiste route</text>
<rect x="745" y="415" width="140" height="38" rx="18" fill="#E8A020"/>
<text x="815" y="439" text-anchor="middle" class="label" font-size="11" fill="#0D1B2A">ZWAARSTWEGEND</text>

<rect x="60" y="476" width="840" height="66" rx="6" fill="#FFFFFF" stroke="#E8A020" stroke-width="3"/>
<circle cx="92" cy="509" r="16" fill="#E8A020"/><text x="92" y="514" text-anchor="middle" class="num" fill="#0D1B2A">6</text>
<text x="118" y="501" class="label" font-size="12" fill="#8A5A0E">Ethische standvastigheid onder druk</text>
<text x="118" y="519" class="sub">wordt de DNB-toets (deel 29) zichtbaar toegepast, ook tegen Hugo's druk in?</text>
<rect x="745" y="489" width="140" height="38" rx="18" fill="#E8A020"/>
<text x="815" y="513" text-anchor="middle" class="label" font-size="11" fill="#0D1B2A">ZWAARSTWEGEND</text>

<rect x="60" y="550" width="840" height="60" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<circle cx="92" cy="580" r="15" fill="#1A4F8B"/><text x="92" y="585" text-anchor="middle" class="num">7</text>
<text x="118" y="575" class="label" font-size="12">Standvastigheid onder tegenspraak</text>
<text x="118" y="593" class="sub">houdt stand tegen kritiek, én erkent een terecht punt zonder de kernpositie op te geven</text>

<text x="480" y="645" text-anchor="middle" class="sub" fill="#8A5A0E">een onderbouwd "nee, dit niet" weegt zwaarder dan een oppervlakkig "ja, we doen alles goed"</text>
</svg>
