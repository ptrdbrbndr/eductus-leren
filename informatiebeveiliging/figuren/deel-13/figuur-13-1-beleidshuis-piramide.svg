<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .sub-light { font-size:12px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
    </style>
</defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 13 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Het beleidshuis: van abstract naar concreet</text>
<text x="40" y="96" class="sub">Het topdocument blijft stabiel; de onderliggende lagen bewegen mee met de praktijk.</text>

<!-- layer 1: beleid, narrowest, top -->
<polygon points="430,130 530,130 570,215 390,215" fill="#1A4F8B"/>
<text x="480" y="160" text-anchor="middle" class="label-light">BELEID</text>
<text x="480" y="180" text-anchor="middle" class="sub-light" font-size="11">bestuur, kort,</text>
<text x="480" y="196" text-anchor="middle" class="sub-light" font-size="11">verandert zelden</text>

<!-- layer 2: standaarden -->
<polygon points="390,220 570,220 630,320 330,320" fill="#8AAFD4"/>
<text x="480" y="255" text-anchor="middle" class="label">STANDAARDEN</text>
<text x="480" y="275" text-anchor="middle" class="sub" font-size="11">wachtwoord-, cryptografie-, classificatiestandaard —</text>
<text x="480" y="292" text-anchor="middle" class="sub" font-size="11">periodiek herzien</text>

<!-- layer 3: baselines -->
<polygon points="330,325 630,325 700,435 260,435" fill="#C5D8F0"/>
<text x="480" y="368" text-anchor="middle" class="label">BASELINES</text>
<text x="480" y="390" text-anchor="middle" class="sub" font-size="11">minimale, geconfigureerde uitgangssituatie —</text>
<text x="480" y="407" text-anchor="middle" class="sub" font-size="11">"iets waar Tarik tegenaan kan bouwen"</text>

<!-- layer 4: richtlijnen -->
<polygon points="260,440 700,440 780,555 180,555" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="480" y="485" text-anchor="middle" class="label">RICHTLIJNEN EN PROCEDURES</text>
<text x="480" y="507" text-anchor="middle" class="sub" font-size="11">stap-voor-stap: hoe voer je een toegangscontrole uit,</text>
<text x="480" y="524" text-anchor="middle" class="sub" font-size="11">hoe rapporteer je een incident</text>

<text x="480" y="590" text-anchor="middle" class="sub" fill="#8A5A0E">wijzigt de cryptografische aanbeveling? alleen de standaard verandert — het beleid blijft stabiel</text>
</svg>
