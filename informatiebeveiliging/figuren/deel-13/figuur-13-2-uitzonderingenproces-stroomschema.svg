<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" font-family="'DM Sans', Arial, sans-serif" width="960" height="760" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .num { font-size:13px; font-weight:700; fill:#FFFFFF; }
      .ex { font-size:11.5px; fill:#8A5A0E; font-style:italic; }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1A4F8B"/></marker>
</defs>
<rect width="960" height="760" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 13 · STROOMSCHEMA</text>
<text x="40" y="64" class="title">Het uitzonderingenproces, met Tariks casus ingevuld</text>
<text x="40" y="94" class="sub">Vijf stappen tussen "nooit" en "prima, doe wat nodig is" — met Tariks verouderde integratie als doorlopend voorbeeld.</text>

<!-- step 1 -->
<circle cx="70" cy="140" r="16" fill="#1A4F8B"/><text x="70" y="145" text-anchor="middle" class="num">1</text>
<rect x="100" y="118" width="500" height="60" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="120" y="142" class="label">De aanvraag</text>
<text x="120" y="162" class="sub">onderbouwing + voorgestelde compenserende maatregel</text>
<text x="620" y="150" class="ex">Tarik: oudere authenticatiemethode voor verouderd</text>
<text x="620" y="166" class="ex">extern systeem, tijdelijke integratie</text>
<line x1="70" y1="178" x2="70" y2="212" class="arrow"/>

<!-- step 2 -->
<circle cx="70" cy="228" r="16" fill="#1A4F8B"/><text x="70" y="233" text-anchor="middle" class="num">2</text>
<rect x="100" y="206" width="500" height="60" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="120" y="230" class="label">De risicobeoordeling</text>
<text x="120" y="250" class="sub">zelfde kader als deel 12: risico + compenserende maatregel acceptabel?</text>
<text x="620" y="238" class="ex">extra zonering + verscherpte logging rond die ene</text>
<text x="620" y="254" class="ex">verbinding</text>
<line x1="70" y1="266" x2="70" y2="300" class="arrow"/>

<!-- step 3 -->
<circle cx="70" cy="316" r="16" fill="#1A4F8B"/><text x="70" y="321" text-anchor="middle" class="num">3</text>
<rect x="100" y="294" width="500" height="60" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="120" y="318" class="label">De juiste eigenaar beslist</text>
<text x="120" y="338" class="sub">niet Merel (adviseert) — de risico-eigenaar die bij de reikwijdte past</text>
<text x="620" y="326" class="ex">Karin, risico-eigenaar architectuurkeuzes,</text>
<text x="620" y="342" class="ex">keurt goed</text>
<line x1="70" y1="354" x2="70" y2="388" class="arrow"/>

<!-- step 4 -->
<circle cx="70" cy="404" r="16" fill="#E8A020"/><text x="70" y="409" text-anchor="middle" class="num" fill="#0D1B2A">4</text>
<rect x="100" y="382" width="500" height="60" rx="8" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>
<text x="120" y="406" class="label" fill="#8A5A0E">Een vervaldatum — verplicht</text>
<text x="120" y="426" class="sub">zonder vervaldatum: stilzwijgend permanent, makkelijk vergeten</text>
<text x="620" y="414" class="ex">gekoppeld aan de geplande vervanging van het</text>
<text x="620" y="430" class="ex">externe systeem</text>
<line x1="70" y1="442" x2="70" y2="476" class="arrow"/>

<!-- step 5 -->
<circle cx="70" cy="492" r="16" fill="#1A4F8B"/><text x="70" y="497" text-anchor="middle" class="num">5</text>
<rect x="100" y="470" width="500" height="60" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="120" y="494" class="label">Registratie</text>
<text x="120" y="514" class="sub">vastgelegd voor de auditor (deel 21, deel 26)</text>

<rect x="100" y="570" width="760" height="90" rx="8" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>
<text x="480" y="598" text-anchor="middle" class="label" fill="#8A5A0E">WAARSCHUWING VOORUIT (deel 19)</text>
<text x="480" y="620" text-anchor="middle" class="sub">Precies stap 4 is waar het misgaat: een uitzondering zónder vervaldatum blijft stilzwijgend</text>
<text x="480" y="638" text-anchor="middle" class="sub">bestaan — en wordt later de onderliggende oorzaak van het Mutatieplatform-incident</text>
</svg>
