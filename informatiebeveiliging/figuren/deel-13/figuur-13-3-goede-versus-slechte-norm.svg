<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'DM Sans', Arial, sans-serif" width="960" height="560" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .sub-light { font-size:12px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .quote { font-size:14px; fill:#0D1B2A; font-style:italic; }
      .quote-light { font-size:14px; fill:#F5F4F0; font-style:italic; }
    </style>
</defs>
<rect width="960" height="560" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 13 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Een norm die gehaald kan worden</text>
<text x="40" y="96" class="sub">Te streng leidt tot stilzwijgende non-conformiteit — erger dan een iets minder strenge, wél nageleefde norm.</text>

<rect x="60" y="130" width="400" height="360" rx="8" fill="#F0EDE4" stroke="#5B6675" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="260" y="162" text-anchor="middle" class="label">SLECHT GEFORMULEERD</text>
<rect x="90" y="182" width="340" height="60" rx="6" fill="#FFFFFF"/>
<text x="260" y="208" text-anchor="middle" class="quote" font-size="12">"Wachtwoorden moeten sterk zijn."</text>
<text x="260" y="226" text-anchor="middle" class="sub" font-size="11">geen interpretatieruimte-toets, geen minimum</text>
<text x="110" y="278" class="sub">— niet specifiek genoeg: iedereen</text>
<text x="110" y="296" class="sub">vult "sterk" anders in</text>
<text x="110" y="322" class="sub">— geen eigenaar voor periodieke</text>
<text x="110" y="340" class="sub">actualisatie</text>
<text x="110" y="366" class="sub">— niet getoetst aan een bestaand</text>
<text x="110" y="384" class="sub">legacysysteem — mogelijk onhaalbaar</text>
<text x="260" y="450" text-anchor="middle" class="sub" font-style="italic">gevolg: stilzwijgende non-conformiteit —</text>
<text x="260" y="468" text-anchor="middle" class="sub" font-style="italic">op papier in orde, in werkelijkheid niets aantoonbaar</text>

<rect x="500" y="130" width="400" height="360" rx="8" fill="#1A4F8B"/>
<text x="700" y="162" text-anchor="middle" class="label-light">GOED GEFORMULEERD</text>
<rect x="530" y="182" width="340" height="70" rx="6" fill="#F5F4F0"/>
<text x="700" y="204" text-anchor="middle" class="quote" font-size="12">"Wachtwoorden: minimaal 14 tekens,</text>
<text x="700" y="222" text-anchor="middle" class="quote" font-size="12">MFA verplicht voor alle externe toegang."</text>
<text x="700" y="240" text-anchor="middle" class="sub" font-size="11">concreet minimum, geen interpretatieruimte</text>
<text x="550" y="278" class="sub-light">— specifiek genoeg om zonder</text>
<text x="550" y="296" class="sub-light">interpretatie toe te passen</text>
<text x="550" y="322" class="sub-light">— haalbaar getoetst met Tarik,</text>
<text x="550" y="340" class="sub-light">niet alleen bedacht door security</text>
<text x="550" y="366" class="sub-light">— eigenaar en herzieningsritme</text>
<text x="550" y="384" class="sub-light">expliciet benoemd</text>
<text x="700" y="450" text-anchor="middle" class="sub-light" font-style="italic">gevolg: wordt daadwerkelijk nageleefd —</text>
<text x="700" y="468" text-anchor="middle" class="sub-light" font-style="italic">aanwezig én aantoonbaar</text>

<text x="480" y="530" text-anchor="middle" class="sub" fill="#8A5A0E">een norm die niemand volgt, is erger dan een iets minder strenge norm die wél wordt gehaald</text>
</svg>
