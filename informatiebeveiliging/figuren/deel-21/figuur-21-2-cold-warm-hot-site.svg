<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'DM Sans', Arial, sans-serif" width="960" height="560" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .sub { font-size:12px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .axis { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arrg); }
      .axtext { font-size:12px; fill:#55606F; font-weight:700; }
    </style>
    <marker id="arrg" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#55606F"/></marker>
</defs>
<rect width="960" height="560" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 21 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Drie niveaus van paraatheid</text>
<text x="40" y="96" class="sub">De keuze volgt rechtstreeks uit de vastgestelde RTO — niet uit "voor de zekerheid".</text>

<line x1="120" y1="480" x2="880" y2="480" class="axis"/>
<text x="500" y="512" text-anchor="middle" class="axtext">HERSTELTIJD — van traag (dagen) naar snel (minuten)</text>

<line x1="120" y1="480" x2="120" y2="140" class="axis"/>
<text x="70" y="300" text-anchor="middle" class="axtext" transform="rotate(-90 70 300)">KOSTEN — oplopend</text>

<!-- cold -->
<circle cx="240" cy="430" r="60" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="240" y="418" text-anchor="middle" class="label" font-size="13">Cold site</text>
<text x="240" y="438" text-anchor="middle" class="sub" font-size="10">uren tot dagen</text>
<text x="240" y="454" text-anchor="middle" class="sub" font-size="10">relatief goedkoop</text>

<!-- warm -->
<circle cx="500" cy="320" r="70" fill="#6FA3D6"/>
<text x="500" y="308" text-anchor="middle" class="label" font-size="13">Warm site</text>
<text x="500" y="328" text-anchor="middle" class="sub" font-size="10">uren</text>
<text x="500" y="344" text-anchor="middle" class="sub" font-size="10">deels ingericht, periodiek bijgewerkt</text>

<!-- hot -->
<circle cx="760" cy="190" r="82" fill="#2563A8" stroke="#E9A13B" stroke-width="3"/>
<text x="760" y="176" text-anchor="middle" class="label" fill="#FBFAF7" font-size="13">Hot site</text>
<text x="760" y="198" text-anchor="middle" class="sub" fill="#DFDCD3" font-size="10">minuten</text>
<text x="760" y="214" text-anchor="middle" class="sub" fill="#DFDCD3" font-size="10">continu actief,</text>
<text x="760" y="228" text-anchor="middle" class="sub" fill="#DFDCD3" font-size="10">aanzienlijk duurder</text>

<rect x="140" y="530" width="0" height="0"/>
<text x="500" y="548" text-anchor="middle" class="sub" fill="#9A5F0D">RTO 4 uur voor de kernberekening → warm site; RTO enkele dagen voor minder kritieke systemen → cold site volstaat</text>
</svg>
