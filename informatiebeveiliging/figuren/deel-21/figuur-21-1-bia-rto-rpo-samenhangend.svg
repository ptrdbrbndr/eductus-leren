<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'DM Sans', Arial, sans-serif" width="960" height="560" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .sub-light { font-size:12px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1A4F8B"/></marker>
</defs>
<rect width="960" height="560" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 21 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">BIA, RTO en RPO als samenhangend geheel</text>
<text x="40" y="96" class="sub">De BIA komt eerst — pas dan zijn RTO en RPO zinvol vast te stellen.</text>

<rect x="330" y="130" width="300" height="70" rx="8" fill="#1A4F8B"/>
<text x="480" y="160" text-anchor="middle" class="label-light">BIA — Bedrijfsimpactanalyse</text>
<text x="480" y="182" text-anchor="middle" class="sub-light">impact van uitval na een uur, dag, week?</text>

<line x1="410" y1="200" x2="330" y2="240" class="arrow"/>
<line x1="550" y1="200" x2="630" y2="240" class="arrow"/>

<rect x="140" y="242" width="300" height="150" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="290" y="270" text-anchor="middle" class="label">RTO — Recovery Time Objective</text>
<text x="160" y="296" class="sub">hoe lang mag het systeem</text>
<text x="160" y="312" class="sub">maximaal uitvallen?</text>
<rect x="160" y="326" width="260" height="52" rx="6" fill="#C5D8F0"/>
<text x="290" y="348" text-anchor="middle" class="sub" font-weight="700">kernberekening: max. 4 uur</text>
<text x="290" y="366" text-anchor="middle" class="sub" font-size="11">financiële impact op kwetsbare deelnemers</text>

<rect x="520" y="242" width="300" height="150" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="670" y="270" text-anchor="middle" class="label">RPO — Recovery Point Objective</text>
<text x="540" y="296" class="sub">hoeveel gegevensverlies is</text>
<text x="540" y="312" class="sub">maximaal acceptabel?</text>
<rect x="540" y="326" width="260" height="52" rx="6" fill="#C5D8F0"/>
<text x="670" y="348" text-anchor="middle" class="sub" font-weight="700">kernberekening: max. 1 uur</text>
<text x="670" y="366" text-anchor="middle" class="sub" font-size="11">mutaties te waardevol om meer te verliezen</text>

<rect x="140" y="420" width="680" height="90" rx="8" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>
<text x="480" y="448" text-anchor="middle" class="sub" fill="#8A5A0E" font-weight="700">niet uitwisselbaar, elk vraagt een andere technische aanpak</text>
<text x="480" y="470" text-anchor="middle" class="sub">een uitstekende RTO met een slechte RPO (snel online, groot datagat) is een</text>
<text x="480" y="488" text-anchor="middle" class="sub">onvolledige oplossing als de BIA een andere combinatie vereist</text>
</svg>
