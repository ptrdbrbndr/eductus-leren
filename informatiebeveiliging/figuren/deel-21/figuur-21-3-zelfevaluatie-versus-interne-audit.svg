<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="'DM Sans', Arial, sans-serif" width="960" height="480" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .sub-light { font-size:12px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
    </style>
</defs>
<rect width="960" height="480" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 21 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Zelfevaluatie naast interne audit</text>
<text x="40" y="96" class="sub">Onafhankelijkheid is het onderscheid — niet de diepgang van de vragen.</text>

<rect x="60" y="130" width="380" height="250" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="250" y="162" text-anchor="middle" class="label">ZELFEVALUATIE (deel 20)</text>
<circle cx="120" cy="200" r="26" fill="#C5D8F0"/>
<text x="120" y="206" text-anchor="middle" class="sub" font-weight="700">Merel</text>
<text x="160" y="196" class="sub">beoordeelt haar</text>
<text x="160" y="212" class="sub">eigen ISMS</text>
<text x="80" y="260" class="sub">Uitgevoerd door de eigen</text>
<text x="80" y="276" class="sub">securityfunctie zelf</text>
<text x="80" y="304" class="sub" font-weight="700">Waardevol, maar niet</text>
<text x="80" y="320" class="sub" font-weight="700">onafhankelijk</text>
<text x="80" y="346" class="sub" font-style="italic">— eigen blinde vlekken</text>
<text x="80" y="362" class="sub" font-style="italic">blijven bestaan</text>

<rect x="520" y="130" width="380" height="250" rx="8" fill="#1A4F8B"/>
<text x="710" y="162" text-anchor="middle" class="label-light">INTERNE AUDIT (deel 21)</text>
<circle cx="580" cy="200" r="26" fill="#E8A020"/>
<text x="580" y="206" text-anchor="middle" class="sub" fill="#5A3A08" font-weight="700">auditor</text>
<text x="620" y="196" fill="#E4E1D8" font-size="12">niet verantwoordelijk</text>
<text x="620" y="212" fill="#E4E1D8" font-size="12">voor het beoordeelde</text>
<text x="620" y="228" fill="#E4E1D8" font-size="12">onderdeel</text>
<text x="540" y="260" fill="#E4E1D8" font-size="12">Vereist door clausule 9 —</text>
<text x="540" y="276" fill="#E4E1D8" font-size="12">three lines of defence (deel 4)</text>
<text x="540" y="304" class="sub-light" font-weight="700">Nooit non-conformiteiten</text>
<text x="540" y="320" class="sub-light" font-weight="700">vinden is verdacht</text>
<text x="540" y="346" fill="#E4E1D8" font-size="11" font-style="italic">suggereert oppervlakkige toetsing,</text>
<text x="540" y="362" fill="#E4E1D8" font-size="11" font-style="italic">niet een schone praktijk</text>

<text x="480" y="440" text-anchor="middle" class="sub" fill="#8A5A0E">het eerste, interne oefenen voor de volledige externe certificeringsaudit van deel 26 (niveau 3)</text>
</svg>
