<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="'DM Sans', Arial, sans-serif" width="960" height="500" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:13px; font-weight:700; fill:#14213D; }
      .label-light { font-size:13px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:11.5px; fill:#55606F; }
      .sub-light { font-size:11.5px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563A8"/></marker>
</defs>
<rect width="960" height="500" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 9 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Een eerste, eenvoudig incidentproces</text>
<text x="40" y="96" class="sub">Zodat een melding nooit meer acht maanden onbeantwoord blijft.</text>

<rect x="380" y="130" width="200" height="60" rx="8" fill="#2563A8"/>
<text x="480" y="155" text-anchor="middle" class="label-light" font-size="12">1 · Eén duidelijk</text>
<text x="480" y="173" text-anchor="middle" class="label-light" font-size="12">meldpunt</text>

<line x1="480" y1="190" x2="480" y2="215" class="arrow"/>
<rect x="380" y="215" width="200" height="70" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="480" y="240" text-anchor="middle" class="label" font-size="12">2 · Eerste beoordeling</text>
<text x="480" y="258" text-anchor="middle" class="sub">incident, datalek, allebei,</text>
<text x="480" y="272" text-anchor="middle" class="sub">of geen van beide?</text>

<line x1="480" y1="285" x2="480" y2="310" class="arrow"/>
<rect x="380" y="310" width="200" height="60" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="480" y="335" text-anchor="middle" class="label" font-size="12">3 · Vaste</text>
<text x="480" y="353" text-anchor="middle" class="label" font-size="12">verantwoordelijke</text>

<line x1="480" y1="370" x2="480" y2="395" class="arrow"/>
<rect x="330" y="395" width="300" height="65" rx="8" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
<text x="480" y="420" text-anchor="middle" class="label" fill="#9A5F0D" font-size="12">4 · Vaste route naar Sanne</text>
<text x="480" y="440" text-anchor="middle" class="sub">zodra persoonsgegevens mogelijk geraakt zijn</text>

<text x="700" y="240" class="sub" font-style="italic">niet alleen "hacks" —</text>
<text x="700" y="256" class="sub" font-style="italic">ook onbedoelde fouten en</text>
<text x="700" y="272" class="sub" font-style="italic">externe meldingen (responsible</text>
<text x="700" y="288" class="sub" font-style="italic">disclosure)</text>

<line x1="590" y1="245" x2="690" y2="245" stroke="#55606F" stroke-dasharray="3 3"/>
</svg>
