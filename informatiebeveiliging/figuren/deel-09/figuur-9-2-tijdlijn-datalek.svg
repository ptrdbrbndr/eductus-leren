<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 460" font-family="'DM Sans', Arial, sans-serif" width="1040" height="460" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .axis { stroke:#1A4F8B; stroke-width:2.5; }
      .tick { stroke:#8AAFD4; stroke-width:1.5; }
      .dot { fill:#1A4F8B; }
      .e-label { font-size:12px; fill:#0D1B2A; text-anchor:middle; font-weight:700; }
      .e-sub { font-size:10.5px; fill:#5B6675; text-anchor:middle; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#0D1B2A; font-weight:600; }
    </style>
</defs>
<rect width="1040" height="460" class="paper"/>
<text x="40" y="42" class="kicker">DEEL 9 · CONCEPTDIAGRAM</text>
<text x="40" y="72" class="title">De tijdlijn van een datalek</text>

<line x1="70" y1="240" x2="970" y2="240" class="axis"/>

<circle cx="110" cy="240" r="8" class="dot"/>
<text x="110" y="205" class="e-label">Ontdekking</text>
<text x="110" y="222" class="e-sub">of "had moeten</text>
<text x="110" y="236" class="e-sub">ontdekken" bij</text>
<text x="110" y="250" class="e-sub" dy="14">goede logging</text>

<line x1="230" y1="232" x2="230" y2="248" class="tick" stroke="#E8A020" stroke-width="2.5"/>
<circle cx="410" cy="240" r="8" fill="#E8A020"/>
<line x1="230" y1="240" x2="410" y2="240" stroke="#E8A020" stroke-width="4"/>
<text x="320" y="205" class="e-label" fill="#8A5A0E">72 uur</text>
<text x="320" y="222" class="e-sub">melding aan de AP —</text>
<text x="320" y="236" class="e-sub">mag in fasen, mag niet</text>
<text x="320" y="288" class="e-sub" dy="0">wachten tot alles zeker is</text>

<circle cx="620" cy="240" r="8" class="dot"/>
<text x="620" y="205" class="e-label">Gefaseerde aanvulling</text>
<text x="620" y="222" class="e-sub">volledige omvang vaak</text>
<text x="620" y="236" class="e-sub">nog niet bekend binnen 72u</text>

<circle cx="870" cy="240" r="9" fill="#1A4F8B"/>
<text x="870" y="205" class="e-label">Betrokkenen informeren</text>
<text x="870" y="222" class="e-sub">alleen bij hoog risico —</text>
<text x="870" y="236" class="e-sub">drempel ligt hoger dan</text>
<text x="870" y="250" class="e-sub">de AP-melddrempel</text>

<rect x="150" y="330" width="740" height="90" rx="8" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>
<text x="520" y="358" text-anchor="middle" class="e-label" fill="#8A5A0E">Uitzondering op de meldplicht</text>
<text x="520" y="380" text-anchor="middle" class="e-sub">onwaarschijnlijk risico voor betrokkenen — bijvoorbeeld data die door sterke</text>
<text x="520" y="398" text-anchor="middle" class="e-sub">versleuteling feitelijk onbruikbaar was, met een sleutel die niet is gecompromitteerd</text>
</svg>
