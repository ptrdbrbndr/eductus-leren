<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="'DM Sans', Arial, sans-serif" width="960" height="540" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:13px; font-weight:700; fill:#14213D; }
      .label-light { font-size:13px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:11px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    </style>
</defs>
<rect width="960" height="540" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 9 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Beveiligingsincident versus datalek — met de drie meldingen uit de mailbox</text>
<text x="40" y="96" class="sub">Elk datalek is een beveiligingsincident — niet elk beveiligingsincident is een datalek.</text>

<circle cx="480" cy="330" r="190" fill="#CBDCEF" fill-opacity="0.5" stroke="#2563A8" stroke-width="2"/>
<circle cx="480" cy="360" r="100" fill="#E9A13B" fill-opacity="0.4" stroke="#E9A13B" stroke-width="2.5"/>

<text x="480" y="175" text-anchor="middle" class="label">BEVEILIGINGSINCIDENT</text>
<text x="480" y="193" text-anchor="middle" class="sub">raakt CIA — vertrouwelijkheid, integriteit of beschikbaarheid</text>

<text x="480" y="345" text-anchor="middle" class="label" fill="#9A5F0D">DATALEK</text>
<text x="480" y="363" text-anchor="middle" class="sub">raakt persoonsgegevens — meldplicht mogelijk</text>

<rect x="500" y="378" width="230" height="55" rx="6" fill="#FFFFFF" stroke="#9A5F0D" stroke-width="2"/>
<text x="615" y="398" text-anchor="middle" class="sub" font-weight="700">Verkeerd verstuurde bijlage</text>
<text x="615" y="415" text-anchor="middle" class="sub">datalek zodra persoonsgegevens</text>

<rect x="220" y="230" width="230" height="60" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="335" y="252" text-anchor="middle" class="sub" font-weight="700">Ongebruikelijk inlogpatroon</text>
<text x="335" y="270" text-anchor="middle" class="sub">incident — wordt datalek als</text>
<text x="335" y="285" text-anchor="middle" class="sub">onbevoegd is ingelogd én data geraakt</text>

<rect x="60" y="450" width="290" height="70" rx="6" fill="#FFFFFF" stroke="#55606F" stroke-dasharray="4 3"/>
<text x="205" y="475" text-anchor="middle" class="sub" font-weight="700">Kwetsbaarheidsmelding</text>
<text x="205" y="493" text-anchor="middle" class="sub">geen van beide — een signaal</text>
<text x="205" y="508" text-anchor="middle" class="sub">dat, onbeantwoord, tot een van beide leidt</text>

<line x1="205" y1="450" x2="335" y2="292" stroke="#55606F" stroke-dasharray="3 3"/>
</svg>
