<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:13px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:13px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:11px; fill:#5B6675; }
      .sub-light { font-size:11px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .num { font-size:14px; font-weight:700; fill:#FFFFFF; }
      .arrow { stroke:#1A4F8B; stroke-width:2.2; fill:none; marker-end:url(#arrb); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1A4F8B"/></marker>
</defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 11 · CONCEPTDIAGRAM</text>
<text x="40" y="62" class="title">De ISMS-cyclus: zeven clausules die nooit stilstaan</text>
<text x="40" y="88" class="sub">Context bepaalt de scope, leiderschap zet de kaders, en verbetering voedt de volgende ronde.</text>

<!-- Row 1: C4 -> C5 -> C6 -> C7 -->
<rect x="40" y="120" width="200" height="110" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<circle cx="66" cy="146" r="15" fill="#1A4F8B"/><text x="66" y="151" text-anchor="middle" class="num">4</text>
<text x="90" y="151" class="label">Context</text>
<text x="58" y="176" class="sub">scope: Mutatieplatform +</text>
<text x="58" y="192" class="sub">gekoppelde systemen</text>
<text x="58" y="212" class="sub">en processen</text>

<line x1="240" y1="175" x2="278" y2="175" class="arrow"/>
<rect x="280" y="120" width="200" height="110" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<circle cx="306" cy="146" r="15" fill="#1A4F8B"/><text x="306" y="151" text-anchor="middle" class="num">5</text>
<text x="330" y="151" class="label">Leiderschap</text>
<text x="298" y="176" class="sub">bestuur stelt beleid</text>
<text x="298" y="192" class="sub">en rollen vast (deel 4:</text>
<text x="298" y="208" class="sub">three lines of defence)</text>

<line x1="480" y1="175" x2="518" y2="175" class="arrow"/>
<rect x="520" y="120" width="200" height="110" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<circle cx="546" cy="146" r="15" fill="#1A4F8B"/><text x="546" y="151" text-anchor="middle" class="num">6</text>
<text x="570" y="151" class="label">Planning</text>
<text x="538" y="176" class="sub">risicobeoordeling en</text>
<text x="538" y="192" class="sub">meetbare doelen</text>
<text x="538" y="208" class="sub">(deel 12)</text>

<line x1="720" y1="175" x2="758" y2="175" class="arrow"/>
<rect x="720" y="120" width="0" height="0"/>
<rect x="760" y="120" width="160" height="110" rx="8" fill="#1A4F8B" stroke="#E8A020" stroke-width="2.5"/>
<circle cx="786" cy="146" r="15" fill="#F5F4F0"/><text x="786" y="151" text-anchor="middle" class="num" fill="#1A4F8B">7</text>
<text x="805" y="151" class="label-light">Ondersteuning</text>
<text x="778" y="176" class="sub-light">middelen, bewustzijn,</text>
<text x="778" y="192" class="sub-light">vastgelegde</text>
<text x="778" y="208" class="sub-light">documentatie</text>

<!-- turn down -->
<path d="M840 230 L840 260" class="arrow"/>

<!-- Row 2: C8 <- C9 <- C10, i.e. drawn right to left visually but arrows flow C8 -> C9 -> C10 -->
<rect x="760" y="262" width="160" height="110" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<circle cx="786" cy="288" r="15" fill="#1A4F8B"/><text x="786" y="293" text-anchor="middle" class="num">8</text>
<text x="805" y="293" class="label">Uitvoering</text>
<text x="778" y="318" class="sub">maatregelen</text>
<text x="778" y="334" class="sub">daadwerkelijk</text>
<text x="778" y="350" class="sub">toegepast</text>

<line x1="760" y1="317" x2="722" y2="317" class="arrow"/>
<rect x="520" y="262" width="200" height="110" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<circle cx="546" cy="288" r="15" fill="#1A4F8B"/><text x="546" y="293" text-anchor="middle" class="num">9</text>
<text x="570" y="293" class="label">Evaluatie</text>
<text x="538" y="318" class="sub">monitoring, interne</text>
<text x="538" y="334" class="sub">audit, directie-</text>
<text x="538" y="350" class="sub">beoordeling</text>

<line x1="520" y1="317" x2="482" y2="317" class="arrow"/>
<rect x="280" y="262" width="200" height="110" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<circle cx="306" cy="288" r="15" fill="#1A4F8B"/><text x="306" y="293" text-anchor="middle" class="num">10</text>
<text x="330" y="293" class="label">Verbetering</text>
<text x="298" y="318" class="sub">non-conformiteiten,</text>
<text x="298" y="334" class="sub">continue verbetering</text>
<text x="298" y="350" class="sub">— voedt clausule 4</text>

<!-- return curve to C4 -->
<path d="M280 317 C 150 317, 60 300, 60 260 L 60 232" class="arrow"/>

<rect x="120" y="430" width="720" height="60" rx="8" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>
<text x="480" y="455" text-anchor="middle" class="sub" fill="#8A5A0E" font-weight="700">Een losse maatregel hangt af van wie hem onthoudt.</text>
<text x="480" y="475" text-anchor="middle" class="sub" fill="#8A5A0E">Deze cyclus hangt af van een proces — en processen overleven vakanties en personeelswisselingen.</text>

<text x="480" y="540" text-anchor="middle" class="sub">Bijlage A (93 controls, deel 11-2) valt onder clausule 6 en 8: wát wordt toegepast, en hoe.</text>
</svg>
