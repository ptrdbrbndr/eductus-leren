<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="'DM Sans', Arial, sans-serif" width="960" height="700" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:13px; font-weight:700; fill:#0D1B2A; }
      .sub { font-size:11.5px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .th { font-size:11px; font-weight:700; fill:#F5F4F0; letter-spacing:.04em; }
      .badge-ja { font-size:12px; font-weight:700; fill:#FFFFFF; }
    </style>
</defs>
<rect width="960" height="700" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 11 · INSTRUMENT</text>
<text x="40" y="64" class="title">De Verklaring van Toepasselijkheid — uittreksel</text>
<text x="40" y="94" class="sub">Elke control: wél of niet toegepast, en waarom — geen keuze blijft ongemotiveerd.</text>

<rect x="40" y="118" width="880" height="34" fill="#1A4F8B"/>
<text x="56" y="139" class="th">CONTROL (BIJLAGE A)</text>
<text x="470" y="139" class="th">VAN TOEPASSING</text>
<text x="600" y="139" class="th">ONDERBOUWING</text>

<!-- row 1 -->
<rect x="40" y="152" width="880" height="76" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1"/>
<text x="56" y="176" class="label">A.5.15 Toegangsbeheer</text>
<rect x="470" y="164" width="46" height="24" rx="12" fill="#1A4F8B"/><text x="493" y="180" text-anchor="middle" class="badge-ja">JA</text>
<text x="600" y="176" class="sub">Risicobeoordeling wijst hoog risico onbevoegde</text>
<text x="600" y="192" class="sub">toegang tot de mutatiedatabase aan (deel 12)</text>

<!-- row 2 -->
<rect x="40" y="228" width="880" height="76" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1"/>
<text x="56" y="252" class="label">A.5.19 Informatiebeveiliging in</text>
<text x="56" y="268" class="label">leveranciersrelaties</text>
<rect x="470" y="240" width="46" height="24" rx="12" fill="#1A4F8B"/><text x="493" y="256" text-anchor="middle" class="badge-ja">JA</text>
<text x="600" y="252" class="sub">Documentherkenningsleverancier verwerkt</text>
<text x="600" y="268" class="sub">persoonsgegevens rechtstreeks (deel 18)</text>

<!-- row 3 -->
<rect x="40" y="304" width="880" height="76" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1"/>
<text x="56" y="328" class="label">A.7.4 Fysieke beveiligings-</text>
<text x="56" y="344" class="label">monitoring</text>
<rect x="470" y="316" width="60" height="24" rx="12" fill="#5B6675"/><text x="500" y="332" text-anchor="middle" class="badge-ja">NEE</text>
<text x="600" y="328" class="sub">Geen eigen serverruimte; cloud-leverancier</text>
<text x="600" y="344" class="sub">draagt deze control (gedekt onder A.5.19)</text>

<!-- row 4 -->
<rect x="40" y="380" width="880" height="76" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1"/>
<text x="56" y="404" class="label">A.8.25 Levenscyclus veilige</text>
<text x="56" y="420" class="label">ontwikkeling</text>
<rect x="470" y="392" width="46" height="24" rx="12" fill="#1A4F8B"/><text x="493" y="408" text-anchor="middle" class="badge-ja">JA</text>
<text x="600" y="404" class="sub">Dreigingsmodellering verplicht per nieuwe</text>
<text x="600" y="420" class="sub">functionele module (deel 15)</text>

<!-- row 5 -->
<rect x="40" y="456" width="880" height="76" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1"/>
<text x="56" y="480" class="label">A.6.3 Bewustwording, opleiding</text>
<text x="56" y="496" class="label">en training</text>
<rect x="470" y="468" width="46" height="24" rx="12" fill="#1A4F8B"/><text x="493" y="484" text-anchor="middle" class="badge-ja">JA</text>
<text x="600" y="480" class="sub">Herontworpen trainingsprogramma na de</text>
<text x="600" y="496" class="sub">bevinding uit de casusopening (deel 14)</text>

<rect x="40" y="556" width="880" height="76" rx="8" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>
<text x="56" y="580" class="label" fill="#8A5A0E">HET ONDERBOUWDE "NEE" — het veld dat het verschil maakt</text>
<text x="56" y="602" class="sub">een control als "niet van toepassing" markeren zonder onderbouwing is geen SoA — het is een lijst</text>
<text x="56" y="618" class="sub">wensen. De onderbouwing moet terug te voeren zijn op de risicobeoordeling van deel 12.</text>
</svg>
