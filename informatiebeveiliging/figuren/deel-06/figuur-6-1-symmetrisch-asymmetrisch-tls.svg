<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'DM Sans', Arial, sans-serif" width="960" height="560" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:11.5px; fill:#55606F; }
      .sub-light { font-size:11.5px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .key { fill:#E9A13B; }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563A8"/></marker>
</defs>
<rect width="960" height="560" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 6 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Symmetrisch en asymmetrisch — en het hybride TLS-patroon</text>
<text x="40" y="96" class="sub">In de praktijk vrijwel altijd gecombineerd.</text>

<rect x="40" y="130" width="420" height="180" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="250" y="160" text-anchor="middle" class="label">SYMMETRISCH</text>
<text x="250" y="182" text-anchor="middle" class="sub">dezelfde sleutel om te ver- en ontsleutelen</text>
<circle cx="130" cy="230" r="14" class="key"/><text x="130" y="235" text-anchor="middle" font-size="11" font-weight="700">K</text>
<text x="130" y="260" text-anchor="middle" class="sub" font-size="10">zender</text>
<circle cx="370" cy="230" r="14" class="key"/><text x="370" y="235" text-anchor="middle" font-size="11" font-weight="700">K</text>
<text x="370" y="260" text-anchor="middle" class="sub" font-size="10">ontvanger</text>
<line x1="144" y1="230" x2="356" y2="230" stroke="#55606F" stroke-dasharray="4 3"/>
<text x="250" y="222" text-anchor="middle" class="sub" font-size="10">zelfde sleutel — hoe delen zonder onderschepping?</text>
<text x="250" y="290" text-anchor="middle" class="sub" font-style="italic">snel — geschikt voor grote back-ups</text>

<rect x="500" y="130" width="420" height="180" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="710" y="160" text-anchor="middle" class="label">ASYMMETRISCH</text>
<text x="710" y="182" text-anchor="middle" class="sub">sleutelpaar: publiek + privé</text>
<circle cx="600" cy="230" r="14" fill="#2563A8"/><text x="600" y="235" text-anchor="middle" fill="#FBFAF7" font-size="10" font-weight="700">pub</text>
<circle cx="820" cy="230" r="14" class="key"/><text x="820" y="235" text-anchor="middle" font-size="10" font-weight="700">priv</text>
<line x1="614" y1="230" x2="806" y2="230" stroke="#55606F" dasharray="4 3"/>
<text x="710" y="222" text-anchor="middle" class="sub" font-size="10">publiek vrij deelbaar, privé blijft geheim</text>
<text x="710" y="290" text-anchor="middle" class="sub" font-style="italic">rekenkundig zwaar — niet voor grote data</text>

<path d="M480,220 L500,220" class="arrow" opacity="0"/>

<rect x="150" y="350" width="660" height="170" rx="8" fill="#2563A8"/>
<text x="480" y="382" text-anchor="middle" class="label-light">HYBRIDE PATROON — TLS</text>
<circle cx="230" cy="430" r="16" class="key"/><text x="230" y="435" text-anchor="middle" font-size="10" font-weight="700">asym.</text>
<path d="M260,430 L400,430" class="arrow" stroke="#FBFAF7" marker-end="url(#arrw)"/>
<text x="330" y="420" text-anchor="middle" class="sub-light" font-size="10">wisselt symmetrische sleutel veilig uit</text>
<circle cx="450" cy="430" r="16" class="key"/><text x="450" y="435" text-anchor="middle" font-size="10" font-weight="700">sym.</text>
<path d="M480,430 L620,430" class="arrow" stroke="#FBFAF7" marker-end="url(#arrw)"/>
<text x="550" y="420" text-anchor="middle" class="sub-light" font-size="10">doet daarna het zware werk</text>
<rect x="640" y="410" width="130" height="45" rx="6" fill="#14213D"/>
<text x="705" y="437" text-anchor="middle" class="sub-light" font-size="10">dataverkeer</text>
<text x="480" y="490" text-anchor="middle" class="sub-light">plus authenticiteit via het certificaat — meridiaan.nl bevestigd</text>
<marker id="arrw" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#FBFAF7"/></marker>
</svg>
