<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="'DM Sans', Arial, sans-serif" width="960" height="480" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:11.5px; fill:#5B6675; }
      .sub-light { font-size:11.5px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
    </style>
</defs>
<rect width="960" height="480" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 6 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Pseudonimisering versus anonimisering — de koppeltabel maakt het verschil</text>
<text x="40" y="96" class="sub">Beide vervangen identificerende gegevens — maar slechts één is onomkeerbaar.</text>

<rect x="40" y="140" width="420" height="270" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="250" y="170" text-anchor="middle" class="label">PSEUDONIMISERING</text>
<rect x="70" y="190" width="150" height="45" rx="6" fill="#C5D8F0"/>
<text x="145" y="217" text-anchor="middle" class="sub" font-weight="700">deelnr. 88213</text>
<line x1="220" y1="212" x2="270" y2="212" stroke="#8A5A0E" stroke-width="2.5"/>
<rect x="270" y="190" width="150" height="45" rx="6" fill="#E8A020"/>
<text x="345" y="212" text-anchor="middle" class="sub" font-weight="700" font-size="10">koppeltabel</text>
<text x="345" y="226" text-anchor="middle" class="sub" font-weight="700" font-size="10">(apart beveiligd)</text>
<text x="250" y="260" text-anchor="middle" class="sub">de link naar de persoon bestaat nog —</text>
<text x="250" y="278" text-anchor="middle" class="sub">apart bewaard, niet verwijderd</text>
<rect x="70" y="300" width="350" height="90" rx="6" fill="#F5F4F0" stroke="#E8A020" stroke-width="2"/>
<text x="245" y="325" text-anchor="middle" class="sub" fill="#8A5A0E" font-weight="700">blijft persoonsgegeven</text>
<text x="245" y="345" text-anchor="middle" class="sub">AVG erkent het als passende</text>
<text x="245" y="362" text-anchor="middle" class="sub">maatregel — verlaagt risico,</text>
<text x="245" y="379" text-anchor="middle" class="sub">elimineert de AVG niet</text>

<rect x="500" y="140" width="420" height="270" rx="8" fill="#0D1B2A"/>
<text x="710" y="170" text-anchor="middle" class="label-light">ANONIMISERING</text>
<rect x="530" y="190" width="150" height="45" rx="6" fill="#8AAFD4"/>
<text x="605" y="217" text-anchor="middle" class="sub" font-weight="700">deelnr. 88213</text>
<line x1="680" y1="212" x2="730" y2="212" stroke="#E8A020" stroke-width="2.5"/>
<line x1="705" y1="197" x2="730" y2="227" stroke="#E8A020" stroke-width="2.5"/>
<line x1="730" y1="197" x2="705" y2="227" stroke="#E8A020" stroke-width="2.5"/>
<rect x="730" y="190" width="150" height="45" rx="6" fill="none" stroke="#5B6675" stroke-dasharray="4 3"/>
<text x="805" y="212" text-anchor="middle" class="sub-light" font-size="10">geen koppeltabel</text>
<text x="805" y="226" text-anchor="middle" class="sub-light" font-size="10">— vernietigd</text>
<text x="710" y="260" text-anchor="middle" class="sub-light">geen sleutel, geen enkele redelijke</text>
<text x="710" y="278" text-anchor="middle" class="sub-light">manier om terug te herleiden</text>
<rect x="530" y="300" width="350" height="90" rx="6" fill="#1A4F8B"/>
<text x="705" y="325" text-anchor="middle" class="sub-light" font-weight="700">geen persoonsgegeven meer</text>
<text x="705" y="345" text-anchor="middle" class="sub-light">valt buiten het bereik van de AVG —</text>
<text x="705" y="362" text-anchor="middle" class="sub-light">in de praktijk lastiger te bereiken</text>
<text x="705" y="379" text-anchor="middle" class="sub-light">dan de definitie doet vermoeden</text>

<text x="480" y="440" text-anchor="middle" class="sub" fill="#8A5A0E">De testomgevingen bij Meridiaan: "geanonimiseerd" bleek vaak niet meer dan een naam weggelaten</text>
</svg>
