<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="'DM Sans', Arial, sans-serif" width="960" height="480" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:13px; font-weight:700; fill:#0D1B2A; }
      .sub { font-size:11px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1A4F8B"/></marker>
</defs>
<rect width="960" height="480" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 27 · PROCES</text>
<text x="40" y="64" class="title">Verzoeken van betrokkenen op schaal</text>
<text x="40" y="96" class="sub">Voor honderdduizenden deelnemers geen incident, maar een ingericht operationeel proces.</text>

<rect x="70" y="140" width="190" height="150" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="165" y="168" text-anchor="middle" class="label" font-size="13">1. Intake</text>
<text x="86" y="196" class="sub">gestandaardiseerd:</text>
<text x="86" y="212" class="sub">hoe komt een verzoek</text>
<text x="86" y="228" class="sub">binnen</text>
<line x1="260" y1="215" x2="285" y2="215" class="arrow"/>

<rect x="290" y="140" width="190" height="150" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="385" y="168" text-anchor="middle" class="label" font-size="12">2. Verificatie</text>
<text x="306" y="196" class="sub">streng genoeg tegen</text>
<text x="306" y="212" class="sub">fraude, soepel genoeg</text>
<text x="306" y="228" class="sub">om niet te frustreren</text>
<line x1="480" y1="215" x2="505" y2="215" class="arrow"/>

<rect x="510" y="140" width="190" height="150" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="605" y="168" text-anchor="middle" class="label" font-size="12">3. Doorzoeken</text>
<text x="526" y="196" class="sub">gekoppeld aan het</text>
<text x="526" y="212" class="sub">verwerkingsregister</text>
<text x="526" y="228" class="sub">(deel 8) — alle systemen</text>
<line x1="700" y1="215" x2="725" y2="215" class="arrow"/>

<rect x="730" y="140" width="160" height="150" rx="8" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>
<text x="810" y="168" text-anchor="middle" class="label" font-size="12">4. Afhandeling</text>
<text x="744" y="196" class="sub">binnen de wettelijke</text>
<text x="744" y="212" class="sub">termijn, met vroege</text>
<text x="744" y="228" class="sub">interne signalering</text>

<line x1="70" y1="360" x2="890" y2="360" stroke="#5B6675" stroke-width="1.5"/>
<circle cx="70" cy="360" r="6" fill="#1A4F8B"/>
<text x="70" y="385" text-anchor="middle" class="sub">verzoek ontvangen</text>
<circle cx="480" cy="360" r="6" fill="#E8A020"/>
<text x="480" y="385" text-anchor="middle" class="sub" fill="#8A5A0E" font-weight="700">interne signalering</text>
<text x="480" y="401" text-anchor="middle" class="sub">ruim vóór de deadline</text>
<circle cx="890" cy="360" r="7" fill="#0D1B2A"/>
<text x="850" y="385" text-anchor="middle" class="sub">wettelijke termijn</text>

<text x="480" y="445" text-anchor="middle" class="sub" fill="#8A5A0E">een onvolledig verwerkingsregister betekent een onopgemerkt onvolledig antwoord</text>
</svg>
