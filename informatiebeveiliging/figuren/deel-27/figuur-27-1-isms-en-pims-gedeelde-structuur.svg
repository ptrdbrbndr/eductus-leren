<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="'DM Sans', Arial, sans-serif" width="960" height="600" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:13px; font-weight:700; fill:#14213D; }
      .label-light { font-size:11px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:11px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#2563A8; stroke-width:2; fill:none; }
    </style>
</defs>
<rect width="960" height="600" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 27 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">ISO/IEC 27001 en 27701 — twee systemen, één grammatica</text>
<text x="40" y="96" class="sub">Eén keer de structuur leren, twee keer toepassen: security en privacy als parallelle managementsystemen.</text>

<rect x="110" y="130" width="320" height="230" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="270" y="158" text-anchor="middle" class="label" font-size="13">ISO/IEC 27001 — ISMS</text>
<text x="270" y="176" text-anchor="middle" class="sub">Merel · beveiliging</text>
<rect x="130" y="192" width="280" height="150" rx="6" fill="#FBFAF7"/>
<text x="270" y="216" text-anchor="middle" class="sub" font-weight="700">eigen, specifiek:</text>
<text x="270" y="240" text-anchor="middle" class="sub">beveiligingscontrols</text>
<text x="270" y="256" text-anchor="middle" class="sub">(Bijlage A)</text>
<text x="270" y="280" text-anchor="middle" class="sub">risicobehandelplan</text>
<text x="270" y="296" text-anchor="middle" class="sub">voor beveiligingsrisico's</text>
<text x="270" y="320" text-anchor="middle" class="sub">deel 11</text>

<rect x="530" y="130" width="320" height="230" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="690" y="158" text-anchor="middle" class="label" font-size="13">ISO/IEC 27701 — PIMS</text>
<text x="690" y="176" text-anchor="middle" class="sub">Sanne · privacy</text>
<rect x="550" y="192" width="280" height="150" rx="6" fill="#FBFAF7"/>
<text x="690" y="216" text-anchor="middle" class="sub" font-weight="700">eigen, specifiek:</text>
<text x="690" y="240" text-anchor="middle" class="sub">privacyrisicobeoordeling</text>
<text x="690" y="264" text-anchor="middle" class="sub">verzoeken van betrokkenen</text>
<text x="690" y="280" text-anchor="middle" class="sub">op schaal (figuur 27-2)</text>
<text x="690" y="304" text-anchor="middle" class="sub">zelfstandig certificeerbaar</text>
<text x="690" y="320" text-anchor="middle" class="sub">sinds oktober 2025</text>

<path d="M270 360 L270 400 L480 400" class="arrow"/>
<path d="M690 360 L690 400 L480 400" class="arrow"/>
<line x1="480" y1="400" x2="480" y2="418" class="arrow"/>

<rect x="60" y="424" width="840" height="90" rx="8" fill="#E9A13B"/>
<text x="480" y="446" text-anchor="middle" class="label" font-size="13">GEDEELDE HARMONIZED STRUCTURE — zeven kernclausules</text>
<line x1="180" y1="456" x2="180" y2="504" stroke="#9A5F0D" stroke-width="1"/>
<line x1="300" y1="456" x2="300" y2="504" stroke="#9A5F0D" stroke-width="1"/>
<line x1="420" y1="456" x2="420" y2="504" stroke="#9A5F0D" stroke-width="1"/>
<line x1="540" y1="456" x2="540" y2="504" stroke="#9A5F0D" stroke-width="1"/>
<line x1="660" y1="456" x2="660" y2="504" stroke="#9A5F0D" stroke-width="1"/>
<line x1="780" y1="456" x2="780" y2="504" stroke="#9A5F0D" stroke-width="1"/>
<text x="120" y="486" text-anchor="middle" class="sub" fill="#6B4509" font-size="10">4. Context</text>
<text x="240" y="486" text-anchor="middle" class="sub" fill="#6B4509" font-size="10">5. Leiderschap</text>
<text x="360" y="486" text-anchor="middle" class="sub" fill="#6B4509" font-size="10">6. Planning</text>
<text x="480" y="486" text-anchor="middle" class="sub" fill="#6B4509" font-size="10">7. Ondersteuning</text>
<text x="600" y="486" text-anchor="middle" class="sub" fill="#6B4509" font-size="10">8. Uitvoering</text>
<text x="720" y="486" text-anchor="middle" class="sub" fill="#6B4509" font-size="10">9. Evaluatie</text>
<text x="840" y="486" text-anchor="middle" class="sub" fill="#6B4509" font-size="10">10. Verbetering</text>

<text x="480" y="555" text-anchor="middle" class="sub" fill="#9A5F0D">risicobeoordeling, documentbeheer en interne audit lopen volgens hetzelfde format (deel 12, 21, 26)</text>
</svg>
