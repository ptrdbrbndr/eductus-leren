<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="'DM Sans', Arial, sans-serif" width="960" height="480" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:13px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:13px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow-amber { stroke:#E8A020; stroke-width:2; fill:none; marker-end:url(#arra); }
    </style>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#E8A020"/></marker>
</defs>
<rect width="960" height="480" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 27 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Eén invaren, twee spiegelbeeldige dimensies</text>
<text x="40" y="96" class="sub">Dezelfde datafout raakt tegelijk een DNB-zorg en een AP-zorg.</text>

<rect x="230" y="120" width="500" height="60" rx="8" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>
<text x="480" y="146" text-anchor="middle" class="label" font-size="13">INVAREN</text>
<text x="480" y="166" text-anchor="middle" class="sub">overbrengen van bestaande aanspraken naar het nieuwe stelsel</text>

<path d="M370 180 L270 218" class="arrow-amber"/>
<path d="M590 180 L690 218" class="arrow-amber"/>

<rect x="90" y="224" width="380" height="200" rx="8" fill="#8AAFD4"/>
<text x="280" y="252" text-anchor="middle" class="label-light" font-size="13">DNB-DIMENSIE — datakwaliteit</text>
<text x="115" y="286" class="sub" fill="#0D1B2A">een onjuiste of onvolledige</text>
<text x="115" y="304" class="sub" fill="#0D1B2A">gegevensset raakt de</text>
<text x="115" y="322" class="sub" fill="#0D1B2A">nauwkeurigheid van de</text>
<text x="115" y="340" class="sub" fill="#0D1B2A">herberekening zelf</text>
<rect x="115" y="360" width="330" height="40" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="280" y="384" text-anchor="middle" class="sub" font-weight="700">procesbeheersing — deel 24, 25</text>

<rect x="490" y="224" width="380" height="200" rx="8" fill="#8AAFD4"/>
<text x="680" y="252" text-anchor="middle" class="label-light" font-size="13">AP-DIMENSIE — rechtmatigheid</text>
<text x="515" y="286" class="sub" fill="#0D1B2A">diezelfde datafout raakt</text>
<text x="515" y="304" class="sub" fill="#0D1B2A">het recht van de betrokken</text>
<text x="515" y="322" class="sub" fill="#0D1B2A">deelnemer op correcte</text>
<text x="515" y="340" class="sub" fill="#0D1B2A">verwerking van zijn gegevens</text>
<rect x="515" y="360" width="330" height="40" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="680" y="384" text-anchor="middle" class="sub" font-weight="700">individuele rechtmatigheid — deel 25</text>

<text x="480" y="450" text-anchor="middle" class="sub" fill="#8A5A0E">precies het tweeledige vraagstuk dat deel 25 al beschreef, nu toegepast op één concrete verwerking</text>
</svg>
