<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="'DM Sans', Arial, sans-serif" width="960" height="500" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:13.5px; font-weight:700; fill:#14213D; }
      .label-light { font-size:13.5px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:11.5px; fill:#55606F; }
      .sub-light { font-size:11.5px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563A8"/></marker>
</defs>
<rect width="960" height="500" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 18 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">De keten: gelijkblijvende verplichtingen, hoe lang ook</text>
<text x="40" y="96" class="sub">"Uitbesteed" delegeert de uitvoering — de AVG-verantwoordelijkheid blijft bij Meridiaan.</text>

<rect x="40" y="140" width="220" height="120" rx="8" fill="#2563A8"/>
<text x="150" y="172" text-anchor="middle" class="label-light">Meridiaan</text>
<text x="150" y="192" text-anchor="middle" class="sub-light">verwerkingsverantwoordelijke</text>
<text x="150" y="214" text-anchor="middle" class="sub-light" font-weight="700">blijft eindverantwoordelijk</text>
<text x="150" y="232" text-anchor="middle" class="sub-light">door de hele keten heen</text>

<line x1="260" y1="200" x2="330" y2="200" class="arrow"/>
<text x="295" y="190" text-anchor="middle" class="sub" font-size="10">verwerkersovereenkomst</text>

<rect x="330" y="140" width="220" height="120" rx="8" fill="#6FA3D6"/>
<text x="440" y="172" text-anchor="middle" class="label">Hoofdverwerker</text>
<text x="440" y="192" text-anchor="middle" class="sub">documentherkennings-</text>
<text x="440" y="208" text-anchor="middle" class="sub">leverancier</text>

<line x1="550" y1="200" x2="620" y2="200" class="arrow"/>
<text x="585" y="190" text-anchor="middle" class="sub" font-size="10">zelfde verplichtingen</text>

<rect x="620" y="140" width="220" height="120" rx="8" fill="#CBDCEF"/>
<text x="730" y="172" text-anchor="middle" class="label">Subverwerker</text>
<text x="730" y="192" text-anchor="middle" class="sub">bv. cloud-infrastructuur</text>
<text x="730" y="208" text-anchor="middle" class="sub">van de leverancier</text>

<text x="900" y="200" text-anchor="middle" class="sub" font-size="24" fill="#9A5F0D">…</text>

<rect x="60" y="300" width="840" height="120" rx="8" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
<text x="480" y="330" text-anchor="middle" class="label" fill="#9A5F0D">DE KETEN MAG NIET "VERWATEREN"</text>
<text x="480" y="356" text-anchor="middle" class="sub">Eist Meridiaan dat gegevens binnen de EER blijven, dan geldt die eis onverkort voor elke</text>
<text x="480" y="374" text-anchor="middle" class="sub">subverwerker verderop in de keten — niet alleen voor de partij met wie Meridiaan rechtstreeks</text>
<text x="480" y="392" text-anchor="middle" class="sub">een contract heeft. Voorafgaande toestemming is verplicht vóór elke subverwerker.</text>

<text x="480" y="460" text-anchor="middle" class="sub">"vast wel goed" is geen verificatie — auditrechten, meldingstermijnen en exitbepalingen wel (deel 18-3)</text>
</svg>
