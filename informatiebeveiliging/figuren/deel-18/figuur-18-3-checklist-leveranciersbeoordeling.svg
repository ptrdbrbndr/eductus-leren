<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="'DM Sans', Arial, sans-serif" width="960" height="700" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:13px; font-weight:700; fill:#0D1B2A; }
      .sub { font-size:12px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .check { stroke:#1A4F8B; stroke-width:2.4; fill:none; stroke-linecap:round; }
    </style>
</defs>
<rect width="960" height="700" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 18 · INSTRUMENT</text>
<text x="40" y="64" class="title">Checklist leveranciersbeoordeling</text>
<text x="40" y="94" class="sub">Van "vast wel goed" naar aantoonbaar — classificatie tot exitbepaling.</text>

<!-- item 1 -->
<rect x="40" y="120" width="34" height="34" rx="6" fill="#1A4F8B"/>
<path d="M48 137 l7 7 l14 -16" stroke="#F5F4F0" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="90" y="118" width="830" height="60" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="108" y="142" class="label">1. Classificatie van de leveranciersrelatie</text>
<text x="108" y="162" class="sub">niet elke leverancier vraagt dezelfde diepgang — risicogebaseerd, net als screening (deel 14)</text>

<!-- item 2 -->
<rect x="40" y="192" width="34" height="34" rx="6" fill="#1A4F8B"/>
<path d="M48 209 l7 7 l14 -16" stroke="#F5F4F0" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="90" y="190" width="830" height="60" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="108" y="214" class="label">2. Aantoonbare certificering of eigen beoordeling</text>
<text x="108" y="234" class="sub">actueel ISO 27001-certificaat, of anders een verifieerbare beveiligingsvragenlijst / audit</text>

<!-- item 3 -->
<rect x="40" y="264" width="34" height="34" rx="6" fill="#1A4F8B"/>
<path d="M48 281 l7 7 l14 -16" stroke="#F5F4F0" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="90" y="262" width="830" height="60" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="108" y="286" class="label">3. Beoordeling van subverwerkers</text>
<text x="108" y="306" class="sub">welke partijen schakelt deze leverancier zelf in, en is die keten transparant? (figuur 18-1)</text>

<!-- item 4 -->
<rect x="40" y="336" width="34" height="34" rx="6" fill="#1A4F8B"/>
<path d="M48 353 l7 7 l14 -16" stroke="#F5F4F0" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="90" y="334" width="830" height="60" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="108" y="358" class="label">4. Beoordeling van de locatie van verwerking</text>
<text x="108" y="378" class="sub">binnen de EER, of doorgifte daarbuiten? welke rechtsgrondslag (figuur 18-2)?</text>

<!-- item 5 -->
<rect x="40" y="408" width="34" height="34" rx="6" fill="#E8A020"/>
<path d="M48 425 l7 7 l14 -16" stroke="#5A3A08" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="90" y="406" width="830" height="60" rx="6" fill="#FFFFFF" stroke="#E8A020" stroke-width="2"/>
<text x="108" y="430" class="label" fill="#8A5A0E">5. Auditrechten in de verwerkersovereenkomst</text>
<text x="108" y="450" class="sub">zonder dit recht: een papieren belofte zonder verificatiemogelijkheid</text>

<!-- item 6 -->
<rect x="40" y="480" width="34" height="34" rx="6" fill="#E8A020"/>
<path d="M48 497 l7 7 l14 -16" stroke="#5A3A08" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="90" y="478" width="830" height="60" rx="6" fill="#FFFFFF" stroke="#E8A020" stroke-width="2"/>
<text x="108" y="502" class="label" fill="#8A5A0E">6. Meldingstermijnen bij incidenten</text>
<text x="108" y="522" class="sub">de 72-uursklok (deel 9) moet lopen vanaf ontdekking bij de verwerker zelf</text>

<!-- item 7 -->
<rect x="40" y="552" width="34" height="34" rx="6" fill="#E8A020"/>
<path d="M48 569 l7 7 l14 -16" stroke="#5A3A08" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="90" y="550" width="830" height="60" rx="6" fill="#FFFFFF" stroke="#E8A020" stroke-width="2"/>
<text x="108" y="574" class="label" fill="#8A5A0E">7. Exitbepalingen</text>
<text x="108" y="594" class="sub">teruggave of aantoonbare vernietiging van gegevens bij beëindiging, binnen welke termijn?</text>

<text x="480" y="656" text-anchor="middle" class="sub" fill="#8A5A0E">"vast wel goed" is geen antwoord op deze zeven punten — aantoonbaar wel, dat is het</text>
</svg>
