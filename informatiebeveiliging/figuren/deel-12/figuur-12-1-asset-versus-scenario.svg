<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .sub-light { font-size:12px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1A4F8B"/></marker>
</defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 12 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Twee invalshoeken die samenkomen</text>
<text x="40" y="96" class="sub">Asset-based als basis zodat niets over het hoofd wordt gezien, scenario-based als verdieping.</text>

<rect x="60" y="130" width="360" height="230" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="240" y="160" text-anchor="middle" class="label">ASSET-BASED</text>
<text x="80" y="188" class="sub">→ mutatiedatabase</text>
<text x="80" y="208" class="sub">→ koppeling werkgeversportalen</text>
<text x="80" y="228" class="sub">→ rapportagesysteem (deel 7)</text>
<text x="80" y="248" class="sub">→ … tientallen assets</text>
<text x="80" y="278" class="sub" font-style="italic">grondig, systematisch —</text>
<text x="80" y="296" class="sub" font-style="italic">bij grote scope traag en</text>
<text x="80" y="314" class="sub" font-style="italic">overweldigend</text>

<rect x="540" y="130" width="360" height="230" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="720" y="160" text-anchor="middle" class="label">SCENARIO-BASED</text>
<text x="560" y="188" class="sub">→ "aanvaller in de mutatiedatabase?"</text>
<text x="560" y="208" class="sub">→ "bestand naar verkeerde partij?"</text>
<text x="560" y="228" class="sub">→ … gebeurtenissen, geen assetlijst</text>
<text x="560" y="278" class="sub" font-style="italic">snel, sluit aan bij hoe</text>
<text x="560" y="296" class="sub" font-style="italic">bestuurders denken — risico op</text>
<text x="560" y="314" class="sub" font-style="italic">gemiste, minder voor de hand</text>
<text x="560" y="332" class="sub" font-style="italic">liggende scenario's</text>

<path d="M240 360 L240 400 Q240 420 300 420 L420 420" class="arrow"/>
<path d="M720 360 L720 400 Q720 420 660 420 L540 420" class="arrow"/>

<rect x="200" y="430" width="560" height="120" rx="8" fill="#1A4F8B"/>
<text x="480" y="462" text-anchor="middle" class="label-light">Merels combinatie voor het Mutatieplatform</text>
<text x="480" y="490" text-anchor="middle" class="sub-light">Eerst een volledige assetlijst als vangnet (niets structureel gemist),</text>
<text x="480" y="508" text-anchor="middle" class="sub-light">dan scenario-uitwerking voor de vijf meest kritieke assets</text>
<text x="480" y="526" text-anchor="middle" class="sub-light">(behapbaar, en herkenbaar voor Karin en het bestuur)</text>

<text x="480" y="590" text-anchor="middle" class="sub" fill="#8A5A0E">geen van beide alleen — de combinatie dekt zowel volledigheid als bestuurlijke herkenbaarheid</text>
</svg>
