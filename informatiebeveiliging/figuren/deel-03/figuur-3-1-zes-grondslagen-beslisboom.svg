<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'DM Sans', Arial, sans-serif" width="960" height="560" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:12px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:12px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:10.5px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#1A4F8B; stroke-width:1.5; fill:none; marker-end:url(#arrb); }
      .num { font-size:13px; font-weight:700; fill:#FFFFFF; }
    </style>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1A4F8B"/></marker>
</defs>
<rect width="960" height="560" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 3 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">De zes grondslagen — geen zevende, geen "een beetje"</text>
<text x="40" y="96" class="sub">Elke verwerking moet op precies één van de zes worden teruggevoerd.</text>

<rect x="380" y="120" width="200" height="55" rx="6" fill="#1A4F8B"/>
<text x="480" y="145" text-anchor="middle" class="label-light">Is er een grondslag</text>
<text x="480" y="162" text-anchor="middle" class="label-light">voor deze verwerking?</text>

<path d="M480,175 L480,205" class="arrow"/>
<line x1="90" y1="205" x2="870" y2="205" stroke="#8AAFD4" stroke-width="1.5"/>
<path d="M90,205 L90,235" class="arrow"/>
<path d="M240,205 L240,235" class="arrow"/>
<path d="M390,205 L390,235" class="arrow"/>
<path d="M570,205 L570,235" class="arrow"/>
<path d="M720,205 L720,235" class="arrow"/>
<path d="M870,205 L870,235" class="arrow"/>

<!-- 6 kaarten -->
<g>
<circle cx="90" cy="255" r="15" fill="#1A4F8B"/><text x="90" y="260" text-anchor="middle" class="num">1</text>
<rect x="20" y="278" width="140" height="120" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="90" y="298" text-anchor="middle" class="label" font-size="11">Toestemming</text>
<text x="90" y="318" text-anchor="middle" class="sub">vrij, specifiek,</text>
<text x="90" y="332" text-anchor="middle" class="sub">geïnformeerd,</text>
<text x="90" y="346" text-anchor="middle" class="sub">ondubbelzinnig</text>
<text x="90" y="368" text-anchor="middle" class="sub" font-style="italic">let op: machts-</text>
<text x="90" y="382" text-anchor="middle" class="sub" font-style="italic">verschil ondermijnt</text>
</g>

<g>
<circle cx="240" cy="255" r="15" fill="#1A4F8B"/><text x="240" y="260" text-anchor="middle" class="num">2</text>
<rect x="170" y="278" width="140" height="120" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="240" y="298" text-anchor="middle" class="label" font-size="11">Overeenkomst</text>
<text x="240" y="320" text-anchor="middle" class="sub">nodig voor de</text>
<text x="240" y="334" text-anchor="middle" class="sub">uitvoering ervan</text>
<text x="240" y="368" text-anchor="middle" class="sub" font-style="italic">Meridiaan: de</text>
<text x="240" y="382" text-anchor="middle" class="sub" font-style="italic">pensioenovereenkomst</text>
</g>

<g>
<circle cx="390" cy="255" r="15" fill="#1A4F8B"/><text x="390" y="260" text-anchor="middle" class="num">3</text>
<rect x="320" y="278" width="140" height="120" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="390" y="298" text-anchor="middle" class="label" font-size="10.5">Wettelijke verplichting</text>
<text x="390" y="320" text-anchor="middle" class="sub">verwerken om aan</text>
<text x="390" y="334" text-anchor="middle" class="sub">een wet te voldoen</text>
<text x="390" y="368" text-anchor="middle" class="sub" font-style="italic">Meridiaan: aanlevering</text>
<text x="390" y="382" text-anchor="middle" class="sub" font-style="italic">aan DNB</text>
</g>

<g>
<circle cx="570" cy="255" r="15" fill="#1A4F8B"/><text x="570" y="260" text-anchor="middle" class="num">4</text>
<rect x="500" y="278" width="140" height="120" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="570" y="298" text-anchor="middle" class="label" font-size="11">Vitaal belang</text>
<text x="570" y="320" text-anchor="middle" class="sub">leven of fysieke</text>
<text x="570" y="334" text-anchor="middle" class="sub">integriteit</text>
<text x="570" y="368" text-anchor="middle" class="sub" font-style="italic">zeldzaam bij een</text>
<text x="570" y="382" text-anchor="middle" class="sub" font-style="italic">pensioenuitvoerder</text>
</g>

<g>
<circle cx="720" cy="255" r="15" fill="#1A4F8B"/><text x="720" y="260" text-anchor="middle" class="num">5</text>
<rect x="650" y="278" width="140" height="120" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="720" y="298" text-anchor="middle" class="label" font-size="10">Algemeen belang /</text>
<text x="720" y="312" text-anchor="middle" class="label" font-size="10">openbaar gezag</text>
<text x="720" y="334" text-anchor="middle" class="sub">taak van algemeen</text>
<text x="720" y="348" text-anchor="middle" class="sub">belang</text>
<text x="720" y="368" text-anchor="middle" class="sub" font-style="italic">vooral publieke</text>
<text x="720" y="382" text-anchor="middle" class="sub" font-style="italic">uitvoerders</text>
</g>

<g>
<circle cx="870" cy="255" r="15" fill="#E8A020"/><text x="870" y="260" text-anchor="middle" class="num" fill="#0D1B2A">6</text>
<rect x="800" y="278" width="140" height="120" rx="6" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>
<text x="870" y="298" text-anchor="middle" class="label" font-size="10" fill="#8A5A0E">Gerechtvaardigd</text>
<text x="870" y="311" text-anchor="middle" class="label" font-size="10" fill="#8A5A0E">belang</text>
<text x="870" y="333" text-anchor="middle" class="sub">meest gebruikt én</text>
<text x="870" y="347" text-anchor="middle" class="sub">meest misbruikt</text>
<text x="870" y="368" text-anchor="middle" class="sub" font-style="italic">vereist drietrapstoets:</text>
<text x="870" y="382" text-anchor="middle" class="sub" font-style="italic">doel, noodzaak, balans</text>
</g>

<rect x="150" y="450" width="660" height="80" rx="8" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>
<text x="480" y="478" text-anchor="middle" class="sub" fill="#8A5A0E" font-weight="700">Een grondslag is geen vrijbrief voor alles</text>
<text x="480" y="498" text-anchor="middle" class="sub">— ze rechtvaardigt een verwerking voor een specifiek, vooraf bepaald doel.</text>
<text x="480" y="516" text-anchor="middle" class="sub">Hergebruik voor een ander doel vereist doelbinding én een eigen grondslag.</text>
</svg>
