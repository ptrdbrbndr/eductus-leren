<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="'DM Sans', Arial, sans-serif" width="960" height="480" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563A8"/></marker>
</defs>
<rect width="960" height="480" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 4 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Verwerkingsverantwoordelijke versus verwerker</text>
<text x="40" y="96" class="sub">Wie bepaalt doel en middelen, en wie voert uit volgens instructie.</text>

<rect x="60" y="140" width="380" height="260" rx="8" fill="#2563A8"/>
<text x="250" y="175" text-anchor="middle" class="label-light">MERIDIAAN PENSIOEN</text>
<text x="250" y="196" text-anchor="middle" class="sub-light">verwerkingsverantwoordelijke</text>
<rect x="90" y="220" width="320" height="150" rx="6" fill="#14213D"/>
<text x="250" y="248" text-anchor="middle" class="sub-light">bepaalt wélke gegevens, waaróm,</text>
<text x="250" y="266" text-anchor="middle" class="sub-light">en hoelang bewaard</text>
<text x="250" y="296" text-anchor="middle" class="sub-light" font-style="italic">deelnemersgegevens voor</text>
<text x="250" y="314" text-anchor="middle" class="sub-light" font-style="italic">de pensioenregeling</text>
<text x="250" y="344" text-anchor="middle" class="sub-light" font-weight="700">eindverantwoordelijk voor</text>
<text x="250" y="360" text-anchor="middle" class="sub-light" font-weight="700">rechtmatigheid</text>

<path d="M440,270 L520,270" class="arrow"/>
<text x="480" y="258" text-anchor="middle" class="sub">instrueert</text>

<rect x="520" y="140" width="380" height="260" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="710" y="175" text-anchor="middle" class="label">EXTERNE IT-LEVERANCIER</text>
<text x="710" y="196" text-anchor="middle" class="sub">verwerker</text>
<rect x="550" y="220" width="320" height="150" rx="6" fill="#FBFAF7" stroke="#55606F"/>
<text x="710" y="248" text-anchor="middle" class="sub">verwerkt volgens Meridiaans</text>
<text x="710" y="266" text-anchor="middle" class="sub">instructies, zonder eigen doel</text>
<text x="710" y="296" text-anchor="middle" class="sub" font-style="italic">hosting van de</text>
<text x="710" y="314" text-anchor="middle" class="sub" font-style="italic">deelnemersadministratie</text>
<text x="710" y="344" text-anchor="middle" class="sub" font-weight="700">verplicht: verwerkersovereenkomst,</text>
<text x="710" y="360" text-anchor="middle" class="sub" font-weight="700">geen eigen doel toevoegen</text>

<rect x="150" y="420" width="660" height="45" rx="8" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
<text x="480" y="447" text-anchor="middle" class="sub" fill="#9A5F0D">Bepaalt de verwerker toch mede het doel? Dan wordt hij (mede)verwerkingsverantwoordelijke.</text>
</svg>
