<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="'DM Sans', Arial, sans-serif" width="960" height="480" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:13px; font-weight:700; fill:#0D1B2A; }
      .sub { font-size:11.5px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .num { font-size:15px; font-weight:700; fill:#F5F4F0; }
    </style>
</defs>
<rect width="960" height="480" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 4 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">De vier onafhankelijkheidseisen aan de FG-positie</text>
<text x="40" y="96" class="sub">"Ik moet onafhankelijk van jou kunnen blijven controleren" — Sanne tegen Merel, deel 1.</text>

<rect x="40" y="140" width="420" height="130" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<circle cx="72" cy="172" r="18" fill="#1A4F8B"/><text x="72" y="178" text-anchor="middle" class="num">1</text>
<text x="105" y="178" class="label">Geen instructies over taakuitvoering</text>
<text x="72" y="205" class="sub">de FG bepaalt zelf hoe hij zijn</text>
<text x="72" y="222" class="sub">wettelijke taken invult</text>
<text x="72" y="248" class="sub" font-style="italic">niemand — ook Merel niet —</text>

<rect x="500" y="140" width="420" height="130" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<circle cx="532" cy="172" r="18" fill="#1A4F8B"/><text x="532" y="178" text-anchor="middle" class="num">2</text>
<text x="565" y="178" class="label" font-size="12">Geen ontslag of straf voor het werk</text>
<text x="532" y="205" class="sub">beoordeling en beloning mogen</text>
<text x="532" y="222" class="sub">niet afhangen van FG-oordelen</text>
<text x="532" y="248" class="sub" font-style="italic">bescherming tegen represaille</text>

<rect x="40" y="290" width="420" height="130" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<circle cx="72" cy="322" r="18" fill="#1A4F8B"/><text x="72" y="328" text-anchor="middle" class="num">3</text>
<text x="105" y="328" class="label" font-size="12">Geen belangenverstrengelende taken</text>
<text x="72" y="355" class="sub">met name geen taken waarbij de FG</text>
<text x="72" y="372" class="sub">doel en middelen zelf zou bepalen</text>
<text x="72" y="398" class="sub" font-style="italic">anders controleert de FG zichzelf</text>

<rect x="500" y="290" width="420" height="130" rx="8" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>
<circle cx="532" cy="322" r="18" fill="#E8A020"/><text x="532" y="328" text-anchor="middle" class="num" fill="#0D1B2A">4</text>
<text x="565" y="328" class="label" fill="#8A5A0E">Rapporteert aan het hoogste niveau</text>
<text x="532" y="355" class="sub">niet aan een operationele lijn</text>
<text x="532" y="372" class="sub">die de FG zou moeten controleren</text>
<text x="532" y="398" class="sub" font-style="italic">precies waarom Sanne niet aan Merel rapporteert</text>

</svg>
