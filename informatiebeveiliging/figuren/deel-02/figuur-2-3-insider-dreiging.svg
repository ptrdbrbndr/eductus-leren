<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'DM Sans', Arial, sans-serif" width="960" height="460" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .sub-light { font-size:12px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1A4F8B"/></marker>
</defs>
<rect width="960" height="460" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 2 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Insider-dreiging: schade van binnenuit, twee vormen</text>
<text x="40" y="96" class="sub">Lastiger te detecteren dan externe aanvallen — de toegang is legitiem.</text>

<rect x="330" y="130" width="300" height="70" rx="8" class="blue-dark" fill="#1A4F8B"/>
<text x="480" y="160" text-anchor="middle" class="label-light">INSIDER-DREIGING</text>
<text x="480" y="180" text-anchor="middle" class="sub-light">iemand met legitieme toegang</text>

<path d="M400,200 L280,255" class="arrow"/>
<path d="M560,200 L680,255" class="arrow"/>

<rect x="90" y="255" width="380" height="170" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="280" y="285" text-anchor="middle" class="label">KWAADWILLEND</text>
<text x="280" y="308" text-anchor="middle" class="sub">bewuste fraude, wraak na ontslag</text>
<rect x="115" y="325" width="330" height="80" rx="6" fill="#F5F4F0" stroke="#5B6675"/>
<text x="280" y="350" text-anchor="middle" class="sub" font-style="italic">een medewerker die adres- én</text>
<text x="280" y="368" text-anchor="middle" class="sub" font-style="italic">bankrekeningwijziging tegelijk</text>
<text x="280" y="386" text-anchor="middle" class="sub" font-style="italic">invoert én goedkeurt (deel 5)</text>

<rect x="490" y="255" width="380" height="170" rx="8" fill="#FFFFFF" stroke="#E8A020" stroke-width="2"/>
<text x="680" y="285" text-anchor="middle" class="label" fill="#8A5A0E">ONBEDOELD</text>
<text x="680" y="308" text-anchor="middle" class="sub">minstens zo vaak — een fout, geen opzet</text>
<rect x="515" y="325" width="330" height="80" rx="6" fill="#F5F4F0" stroke="#5B6675"/>
<text x="680" y="350" text-anchor="middle" class="sub" font-style="italic">een medewerker die per ongeluk</text>
<text x="680" y="368" text-anchor="middle" class="sub" font-style="italic">het verkeerde bestand naar het</text>
<text x="680" y="386" text-anchor="middle" class="sub" font-style="italic">verkeerde adres stuurt</text>

</svg>
