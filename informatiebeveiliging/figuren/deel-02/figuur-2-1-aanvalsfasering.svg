<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="'DM Sans', Arial, sans-serif" width="960" height="420" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:13px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:13px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:11px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1A4F8B"/></marker>
</defs>
<rect width="960" height="420" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 2 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Hoe een aanval feitelijk verloopt — vier fasen</text>
<text x="40" y="96" class="sub">Geen enkele deur, maar een reeks momenten waarop je kunt onderbreken.</text>

<circle cx="90" cy="200" r="18" fill="#1A4F8B"/><text x="90" y="206" text-anchor="middle" fill="#F5F4F0" font-weight="700">1</text>
<rect x="130" y="150" width="190" height="100" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="225" y="180" text-anchor="middle" class="label">Verkenning</text>
<text x="225" y="202" text-anchor="middle" class="sub">LinkedIn-profielen,</text>
<text x="225" y="218" text-anchor="middle" class="sub">vacatureteksten,</text>
<text x="225" y="234" text-anchor="middle" class="sub">publieke systemen</text>

<path d="M320,200 L360,200" class="arrow"/>
<circle cx="390" cy="200" r="18" fill="#1A4F8B"/><text x="390" y="206" text-anchor="middle" fill="#F5F4F0" font-weight="700">2</text>
<rect x="430" y="150" width="190" height="100" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="525" y="180" text-anchor="middle" class="label">Eerste toegang</text>
<text x="525" y="202" text-anchor="middle" class="sub">phishing, gestolen</text>
<text x="525" y="218" text-anchor="middle" class="sub">inloggegevens, niet-</text>
<text x="525" y="234" text-anchor="middle" class="sub">gepatcht systeem</text>

<path d="M620,200 L660,200" class="arrow"/>
<circle cx="690" cy="200" r="18" fill="#1A4F8B"/><text x="690" y="206" text-anchor="middle" fill="#F5F4F0" font-weight="700">3</text>
<rect x="730" y="150" width="190" height="100" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="825" y="180" text-anchor="middle" class="label" font-size="12">Interne verkenning</text>
<text x="825" y="202" text-anchor="middle" class="sub">vaste voet, rechten</text>
<text x="825" y="218" text-anchor="middle" class="sub">verhogen, waardevolle</text>
<text x="825" y="234" text-anchor="middle" class="sub">systemen zoeken</text>

<path d="M825,250 L825,280 L225,280 L225,310" class="arrow" fill="none"/>
<circle cx="225" cy="340" r="18" fill="#E8A020"/><text x="225" y="346" text-anchor="middle" fill="#0D1B2A" font-weight="700">4</text>
<rect x="265" y="310" width="430" height="60" rx="8" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>
<text x="480" y="335" text-anchor="middle" class="label" fill="#8A5A0E">Het eigenlijke doel</text>
<text x="480" y="355" text-anchor="middle" class="sub">gegevens stelen, ransomware, fraude, voet aan de grond houden</text>

<text x="825" y="290" class="sub" fill="#8A5A0E" text-anchor="end">een verlopen, nog werkend account</text>
<text x="825" y="305" class="sub" fill="#8A5A0E" text-anchor="end">slaat fase 2 gewoon over</text>
</svg>
