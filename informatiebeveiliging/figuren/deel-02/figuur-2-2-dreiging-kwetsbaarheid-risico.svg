<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'DM Sans', Arial, sans-serif" width="960" height="460" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:11.5px; fill:#5B6675; }
      .sub-light { font-size:11.5px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .op { font-size:30px; font-weight:700; fill:#8A5A0E; }
    </style>
</defs>
<rect width="960" height="460" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 2 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Dreiging × kwetsbaarheid = risico</text>
<text x="40" y="96" class="sub">Geen dreiging zonder kwetsbaarheid levert risico op — en andersom.</text>

<rect x="40" y="150" width="250" height="150" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="165" y="180" text-anchor="middle" class="label">DREIGING</text>
<text x="165" y="205" text-anchor="middle" class="sub">bestaat onafhankelijk van</text>
<text x="165" y="221" text-anchor="middle" class="sub">de organisatie</text>
<rect x="60" y="240" width="210" height="45" rx="6" fill="#F5F4F0" stroke="#5B6675"/>
<text x="165" y="264" text-anchor="middle" class="sub" font-style="italic">iemand van buiten die het</text>
<text x="165" y="278" text-anchor="middle" class="sub" font-style="italic">account in handen krijgt</text>

<text x="308" y="242" text-anchor="middle" class="op">×</text>

<rect x="355" y="150" width="250" height="150" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="480" y="180" text-anchor="middle" class="label">KWETSBAARHEID</text>
<text x="480" y="205" text-anchor="middle" class="sub">een zwakte die de dreiging</text>
<text x="480" y="221" text-anchor="middle" class="sub">kan benutten</text>
<rect x="375" y="240" width="210" height="45" rx="6" fill="#F5F4F0" stroke="#5B6675"/>
<text x="480" y="264" text-anchor="middle" class="sub" font-style="italic">het verlopen account dat</text>
<text x="480" y="278" text-anchor="middle" class="sub" font-style="italic">niemand heeft opgeschoond</text>

<text x="623" y="242" text-anchor="middle" class="op">=</text>

<rect x="670" y="150" width="250" height="150" rx="8" fill="#1A4F8B"/>
<text x="795" y="180" text-anchor="middle" class="label-light">RISICO</text>
<text x="795" y="205" text-anchor="middle" class="sub-light">kans × impact van deze</text>
<text x="795" y="221" text-anchor="middle" class="sub-light">specifieke combinatie</text>
<rect x="690" y="240" width="210" height="45" rx="6" fill="#0D1B2A"/>
<text x="795" y="264" text-anchor="middle" class="sub-light" font-style="italic">wat zou diegene ermee</text>
<text x="795" y="278" text-anchor="middle" class="sub-light" font-style="italic">kunnen, en hoe erg is dat?</text>

<rect x="150" y="330" width="660" height="90" rx="8" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>
<text x="480" y="358" text-anchor="middle" class="sub" fill="#8A5A0E" font-weight="700">"We hebben geen incidenten gehad" zegt niets over kwetsbaarheid</text>
<text x="480" y="378" text-anchor="middle" class="sub">— het zegt alleen dat de dreiging de kwetsbaarheid nog niet heeft gevonden.</text>
<text x="480" y="398" text-anchor="middle" class="sub">Merels vraag aan Ruud test precies dit: wat zou iemand met dit account kunnen?</text>
</svg>
