<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="'DM Sans', Arial, sans-serif" width="960" height="660" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .ex { font-size:12px; font-style:italic; fill:#14213D; }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563A8"/></marker>
</defs>
<rect width="960" height="660" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 26 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Een bevinding die standhoudt: drie controleerbare elementen</text>
<text x="40" y="96" class="sub">Elk element apart controleerbaar — een conclusie zonder criterium en bewijs houdt geen stand.</text>

<rect x="60" y="130" width="840" height="130" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<rect x="60" y="130" width="150" height="130" rx="8" fill="#2563A8"/>
<text x="135" y="188" text-anchor="middle" class="label-light" font-size="13">1. CRITERIUM</text>
<text x="135" y="206" text-anchor="middle" class="sub" fill="#DFDCD3">welke norm of eis?</text>
<text x="230" y="185" class="ex">"control X uit Bijlage A vereist een periodieke</text>
<text x="230" y="205" class="ex">recertificatie van toegangsrechten"</text>

<line x1="480" y1="260" x2="480" y2="298" class="arrow"/>

<rect x="60" y="304" width="840" height="130" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<rect x="60" y="304" width="150" height="130" rx="8" fill="#2563A8"/>
<text x="135" y="362" text-anchor="middle" class="label-light" font-size="13">2. BEWIJS</text>
<text x="135" y="380" text-anchor="middle" class="sub" fill="#DFDCD3">wat is waargenomen?</text>
<text x="230" y="349" class="ex">"een steekproef van tien accounts toont aan dat</text>
<text x="230" y="369" class="ex">vijf ervan niet zijn gerecertificeerd binnen</text>
<text x="230" y="389" class="ex">de gestelde termijn"</text>

<line x1="480" y1="434" x2="480" y2="472" class="arrow"/>

<rect x="60" y="478" width="840" height="130" rx="8" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
<rect x="60" y="478" width="150" height="130" rx="8" fill="#E9A13B"/>
<text x="135" y="536" text-anchor="middle" class="label" font-size="13">3. CONCLUSIE</text>
<text x="135" y="554" text-anchor="middle" class="sub" fill="#6B4509">welke afwijking volgt?</text>
<text x="230" y="530" class="ex">"het recertificatieproces wordt niet consistent</text>
<text x="230" y="550" class="ex">uitgevoerd — non-conformiteit ten opzichte van</text>
<text x="230" y="570" class="ex">het eigen vastgestelde beleid"</text>

<text x="480" y="638" text-anchor="middle" class="sub" fill="#9A5F0D">controleerbaar op elk element — te verifiëren, te betwisten met tegenbewijs, of te accepteren</text>
</svg>
