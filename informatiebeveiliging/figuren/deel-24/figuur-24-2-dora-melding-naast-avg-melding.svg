<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'DM Sans', Arial, sans-serif" width="960" height="560" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:13px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:13px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:11px; fill:#5B6675; }
      .sub-light { font-size:11px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-l { stroke:#8AAFD4; stroke-width:2; fill:none; marker-end:url(#arrl); }
      .arrow-amber { stroke:#E8A020; stroke-width:2; fill:none; marker-end:url(#arra); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1A4F8B"/></marker>
    <marker id="arrl" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#8AAFD4"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#E8A020"/></marker>
</defs>
<rect width="960" height="560" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 24 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">DORA-melding naast AVG-melding</text>
<text x="40" y="96" class="sub">Eén incident, twee aparte processen — met eigen criteria en eigen tijdschema's, parallel te doorlopen.</text>

<rect x="330" y="118" width="300" height="50" rx="8" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>
<text x="480" y="141" text-anchor="middle" class="label" font-size="12">Eén incident</text>
<text x="480" y="158" text-anchor="middle" class="sub">ICT-gerelateerd én persoonsgegevens geraakt</text>

<path d="M420 168 L280 200" class="arrow-amber"/>
<path d="M540 168 L700 200" class="arrow-amber"/>

<rect x="60" y="205" width="840" height="120" rx="8" fill="#C5D8F0"/>
<text x="80" y="228" class="label" font-size="12" fill="#1A4F8B">AVG-MELDING — aan de Autoriteit Persoonsgegevens</text>

<rect x="80" y="240" width="200" height="70" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="180" y="266" text-anchor="middle" class="sub" font-size="11">Triage &amp; classificatie</text>
<text x="180" y="282" text-anchor="middle" class="sub" font-size="10">(deel 9, 19)</text>
<line x1="280" y1="275" x2="330" y2="275" class="arrow"/>
<rect x="335" y="240" width="220" height="70" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="445" y="266" text-anchor="middle" class="sub" font-size="11">Melding aan de AP</text>
<text x="445" y="282" text-anchor="middle" class="sub" font-size="10">binnen 72 uur na kennisname</text>
<line x1="555" y1="275" x2="605" y2="275" class="arrow"/>
<rect x="610" y="240" width="270" height="70" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="745" y="266" text-anchor="middle" class="sub" font-size="11">Vervolgmelding, indien nodig</text>
<text x="745" y="282" text-anchor="middle" class="sub" font-size="10">aanvulling zodra meer bekend is</text>

<rect x="60" y="355" width="840" height="130" rx="8" fill="#0D1B2A"/>
<text x="80" y="378" class="label-light" font-size="12">DORA-MELDING — aan De Nederlandsche Bank</text>

<rect x="80" y="392" width="220" height="70" rx="6" fill="#1A4F8B"/>
<text x="190" y="418" text-anchor="middle" class="sub-light" font-size="11">Classificatie: major?</text>
<text x="190" y="434" text-anchor="middle" class="sub-light" font-size="10">cliënten, duur, spreiding, data</text>
<line x1="300" y1="427" x2="345" y2="427" class="arrow-l"/>
<rect x="350" y="392" width="220" height="70" rx="6" fill="#1A4F8B"/>
<text x="460" y="418" text-anchor="middle" class="sub-light" font-size="11">Initiële melding aan DNB</text>
<text x="460" y="434" text-anchor="middle" class="sub-light" font-size="10">vast tijdschema</text>
<line x1="570" y1="427" x2="615" y2="427" class="arrow-l"/>
<rect x="620" y="392" width="260" height="70" rx="6" fill="#1A4F8B"/>
<text x="750" y="412" text-anchor="middle" class="sub-light" font-size="11">Tussentijdse update</text>
<text x="750" y="428" text-anchor="middle" class="sub-light" font-size="11">+ eindverslag</text>
<text x="750" y="444" text-anchor="middle" class="sub-light" font-size="10">eigen, vast tijdschema</text>

<text x="480" y="335" text-anchor="middle" class="sub" fill="#8A5A0E">beide routes lopen vanaf de triagefase parallel — de een vertraagt de ander niet</text>

<text x="480" y="525" text-anchor="middle" class="sub" fill="#8A5A0E">het datalek uit deel 19 zou vandaag mogelijk beide meldingen tegelijk vereisen</text>
</svg>
