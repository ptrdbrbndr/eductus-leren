<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:12px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:11px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .num { font-size:14px; font-weight:700; fill:#F5F4F0; }
    </style>
</defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 24 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">De vijf pijlers van DORA</text>
<text x="40" y="96" class="sub">Elke pijler bouwt voort op iets dat deze cursus al eerder als goede praktijk introduceerde.</text>

<rect x="60" y="128" width="840" height="60" rx="8" fill="#1A4F8B"/>
<text x="480" y="154" text-anchor="middle" class="label-light" font-size="13">DORA — Digital Operational Resilience Act</text>
<text x="480" y="174" text-anchor="middle" class="sub" fill="#E4E1D8">wettelijk verplicht voor de financiële sector, sinds 17 januari 2025</text>

<line x1="144" y1="188" x2="144" y2="210" stroke="#1A4F8B" stroke-width="2"/>
<line x1="312" y1="188" x2="312" y2="210" stroke="#1A4F8B" stroke-width="2"/>
<line x1="480" y1="188" x2="480" y2="210" stroke="#1A4F8B" stroke-width="2"/>
<line x1="648" y1="188" x2="648" y2="210" stroke="#1A4F8B" stroke-width="2"/>
<line x1="816" y1="188" x2="816" y2="210" stroke="#1A4F8B" stroke-width="2"/>

<!-- pijler 1 -->
<rect x="74" y="210" width="140" height="240" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<circle cx="144" cy="234" r="14" fill="#1A4F8B"/><text x="144" y="239" text-anchor="middle" class="num">1</text>
<text x="144" y="268" text-anchor="middle" class="label">ICT-risico-</text>
<text x="144" y="284" text-anchor="middle" class="label">beheer</text>
<text x="144" y="308" text-anchor="middle" class="sub">vergelijkbaar met</text>
<text x="144" y="322" text-anchor="middle" class="sub">een ISMS, met</text>
<text x="144" y="336" text-anchor="middle" class="sub">wettelijke elementen</text>
<rect x="94" y="400" width="100" height="34" rx="6" fill="#F5F4F0" stroke="#E8A020" stroke-width="2"/>
<text x="144" y="422" text-anchor="middle" class="sub" fill="#8A5A0E" font-weight="700">↔ deel 11</text>

<!-- pijler 2 -->
<rect x="242" y="210" width="140" height="240" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<circle cx="312" cy="234" r="14" fill="#1A4F8B"/><text x="312" y="239" text-anchor="middle" class="num">2</text>
<text x="312" y="262" text-anchor="middle" class="label">Incident-</text>
<text x="312" y="278" text-anchor="middle" class="label">classificatie</text>
<text x="312" y="294" text-anchor="middle" class="label">&amp; -rapportage</text>
<text x="312" y="316" text-anchor="middle" class="sub">gestandaardiseerd,</text>
<text x="312" y="330" text-anchor="middle" class="sub">verplicht meldproces</text>
<rect x="262" y="400" width="100" height="34" rx="6" fill="#F5F4F0" stroke="#E8A020" stroke-width="2"/>
<text x="312" y="422" text-anchor="middle" class="sub" fill="#8A5A0E" font-weight="700">↔ deel 9, 19</text>

<!-- pijler 3 -->
<rect x="410" y="210" width="140" height="240" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<circle cx="480" cy="234" r="14" fill="#1A4F8B"/><text x="480" y="239" text-anchor="middle" class="num">3</text>
<text x="480" y="268" text-anchor="middle" class="label">Weerbaarheids-</text>
<text x="480" y="284" text-anchor="middle" class="label">testen</text>
<text x="480" y="308" text-anchor="middle" class="sub">oplopend tot TLPT</text>
<text x="480" y="322" text-anchor="middle" class="sub">voor de grootste</text>
<text x="480" y="336" text-anchor="middle" class="sub">instellingen</text>
<rect x="430" y="400" width="100" height="34" rx="6" fill="#F5F4F0" stroke="#E8A020" stroke-width="2"/>
<text x="480" y="422" text-anchor="middle" class="sub" fill="#8A5A0E" font-weight="700">↔ deel 21</text>

<!-- pijler 4 -->
<rect x="578" y="210" width="140" height="240" rx="8" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>
<circle cx="648" cy="234" r="14" fill="#E8A020"/><text x="648" y="239" text-anchor="middle" class="num" fill="#0D1B2A">4</text>
<text x="648" y="262" text-anchor="middle" class="label">Beheer ICT-</text>
<text x="648" y="278" text-anchor="middle" class="label">derde partijen</text>
<text x="648" y="302" text-anchor="middle" class="sub">informatieregister +</text>
<text x="648" y="316" text-anchor="middle" class="sub">concentratierisico</text>
<text x="648" y="330" text-anchor="middle" class="sub" fill="#8A5A0E">(figuur 24-3)</text>
<rect x="598" y="400" width="100" height="34" rx="6" fill="#F5F4F0" stroke="#E8A020" stroke-width="2"/>
<text x="648" y="422" text-anchor="middle" class="sub" fill="#8A5A0E" font-weight="700">↔ deel 18</text>

<!-- pijler 5 -->
<rect x="746" y="210" width="140" height="240" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<circle cx="816" cy="234" r="14" fill="#1A4F8B"/><text x="816" y="239" text-anchor="middle" class="num">5</text>
<text x="816" y="262" text-anchor="middle" class="label">Informatie-</text>
<text x="816" y="278" text-anchor="middle" class="label">uitwisseling</text>
<text x="816" y="302" text-anchor="middle" class="sub">vrijwillig delen van</text>
<text x="816" y="316" text-anchor="middle" class="sub">dreigingsinformatie</text>
<text x="816" y="330" text-anchor="middle" class="sub">tussen instellingen</text>
<rect x="766" y="400" width="100" height="34" rx="6" fill="#F5F4F0" stroke="#5B6675" stroke-width="1.5"/>
<text x="816" y="422" text-anchor="middle" class="sub" font-weight="700">nieuw element</text>

<text x="480" y="480" text-anchor="middle" class="sub" fill="#8A5A0E">een volwassen ISMS levert al veel fundament — maar DORA-elementen moeten apart, expliciet worden ingericht</text>
</svg>
