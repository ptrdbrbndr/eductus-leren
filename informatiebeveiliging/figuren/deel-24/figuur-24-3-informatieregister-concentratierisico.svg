<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="'DM Sans', Arial, sans-serif" width="960" height="580" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:13px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:11px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#1A4F8B; stroke-width:1.5; fill:none; marker-end:url(#arrb); }
      .arrow-amber { stroke:#E8A020; stroke-width:2; fill:none; marker-end:url(#arra); }
    </style>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1A4F8B"/></marker>
    <marker id="arra" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E8A020"/></marker>
</defs>
<rect width="960" height="580" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 24 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Het DORA-informatieregister — concentratierisico zichtbaar gemaakt</text>
<text x="40" y="96" class="sub">Vier verschillende contracten, vier verschillende leveranciers — en toch één gedeelde onderliggende afhankelijkheid.</text>

<rect x="380" y="120" width="200" height="50" rx="8" fill="#1A4F8B"/>
<text x="480" y="150" text-anchor="middle" class="label-light" font-size="13">Meridiaan</text>

<line x1="420" y1="170" x2="155" y2="205" class="arrow"/>
<line x1="460" y1="170" x2="365" y2="205" class="arrow"/>
<line x1="500" y1="170" x2="595" y2="205" class="arrow"/>
<line x1="540" y1="170" x2="805" y2="205" class="arrow"/>

<rect x="70" y="210" width="170" height="72" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="155" y="236" text-anchor="middle" class="label" font-size="12">Leverancier A</text>
<text x="155" y="256" text-anchor="middle" class="sub">hosting Mutatie-</text>
<text x="155" y="270" text-anchor="middle" class="sub">platform</text>

<rect x="280" y="210" width="170" height="72" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="365" y="236" text-anchor="middle" class="label" font-size="12">Leverancier B</text>
<text x="365" y="256" text-anchor="middle" class="sub">document-</text>
<text x="365" y="270" text-anchor="middle" class="sub">verwerking</text>

<rect x="510" y="210" width="170" height="72" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="595" y="236" text-anchor="middle" class="label" font-size="12">Leverancier C</text>
<text x="595" y="256" text-anchor="middle" class="sub">identiteits-</text>
<text x="595" y="270" text-anchor="middle" class="sub">controle</text>

<rect x="720" y="210" width="170" height="72" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="805" y="236" text-anchor="middle" class="label" font-size="12">Leverancier D</text>
<text x="805" y="256" text-anchor="middle" class="sub">analysetool</text>
<text x="805" y="270" text-anchor="middle" class="sub">acceptatie</text>

<line x1="155" y1="282" x2="440" y2="380" class="arrow-amber"/>
<line x1="365" y1="282" x2="460" y2="380" class="arrow-amber"/>
<line x1="595" y1="282" x2="500" y2="380" class="arrow-amber"/>
<line x1="805" y1="282" x2="520" y2="380" class="arrow-amber"/>

<text x="480" y="345" text-anchor="middle" class="sub" fill="#8A5A0E" font-weight="700">concentratierisico: vier kritieke functies, één onderliggende afhankelijkheid</text>

<rect x="290" y="388" width="380" height="80" rx="8" fill="#E8A020"/>
<text x="480" y="418" text-anchor="middle" class="label" font-size="13">Onderliggende cloudprovider X</text>
<text x="480" y="438" text-anchor="middle" class="sub" fill="#0D1B2A">waar alle vier functies uiteindelijk op draaien —</text>
<text x="480" y="454" text-anchor="middle" class="sub" fill="#0D1B2A">ook al loopt elk contract via een andere directe partij</text>

<rect x="70" y="495" width="820" height="55" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="480" y="518" text-anchor="middle" class="sub" font-weight="700">de vraag die het register moet kunnen beantwoorden:</text>
<text x="480" y="536" text-anchor="middle" class="sub">wat gebeurt er als provider X uitvalt — voor hoeveel van onze kritieke functies tegelijk?</text>
</svg>
