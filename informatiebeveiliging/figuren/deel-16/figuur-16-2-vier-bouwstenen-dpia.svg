<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="'DM Sans', Arial, sans-serif" width="960" height="500" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:13px; font-weight:700; fill:#14213D; }
      .label-light { font-size:13px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:11.5px; fill:#55606F; }
      .sub-light { font-size:11.5px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563A8"/></marker>
</defs>
<rect width="960" height="500" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 16 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">De vier bouwstenen van een DPIA</text>
<text x="40" y="96" class="sub">Een gestructureerd voorafgaand denkproces — geen formulier dat achteraf een vinkje krijgt.</text>

<rect x="40" y="130" width="200" height="190" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<circle cx="66" cy="156" r="15" fill="#2563A8"/><text x="66" y="161" text-anchor="middle" fill="#FBFAF7" font-weight="700" font-size="13">1</text>
<text x="90" y="161" class="label">Beschrijving</text>
<text x="58" y="188" class="sub">wat gebeurt er, met welke</text>
<text x="58" y="204" class="sub">gegevens, voor welk doel</text>
<text x="58" y="228" class="sub" font-style="italic">bouwt op het verwerkings-</text>
<text x="58" y="244" class="sub" font-style="italic">register (deel 8)</text>

<line x1="240" y1="225" x2="272" y2="225" class="arrow"/>
<rect x="280" y="130" width="200" height="190" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<circle cx="306" cy="156" r="15" fill="#2563A8"/><text x="306" y="161" text-anchor="middle" fill="#FBFAF7" font-weight="700" font-size="13">2</text>
<text x="330" y="161" class="label">Noodzaak en</text>
<text x="330" y="179" class="label">evenredigheid</text>
<text x="298" y="204" class="sub">is dit nodig, en in</text>
<text x="298" y="220" class="sub">verhouding tot het doel?</text>
<text x="298" y="244" class="sub" font-style="italic">zelfde toets als deel 8</text>

<line x1="480" y1="225" x2="512" y2="225" class="arrow"/>
<rect x="520" y="130" width="200" height="190" rx="8" fill="#E9A13B"/>
<circle cx="546" cy="156" r="15" fill="#6B4509"/><text x="546" y="161" text-anchor="middle" fill="#FBFAF7" font-weight="700" font-size="13">3</text>
<text x="570" y="161" fill="#6B4509" font-weight="700" font-size="13">Risico voor de</text>
<text x="570" y="179" fill="#6B4509" font-weight="700" font-size="13">betrokkene</text>
<text x="538" y="204" fill="#6B4509" font-size="11.5">niet "wat kost dit</text>
<text x="538" y="220" fill="#6B4509" font-size="11.5">Meridiaan" — het uniek</text>
<text x="538" y="236" fill="#6B4509" font-size="11.5">makende perspectief</text>
<text x="538" y="256" fill="#6B4509" font-size="11" font-style="italic">zie figuur 16-3</text>

<line x1="720" y1="225" x2="752" y2="225" class="arrow"/>
<rect x="760" y="130" width="160" height="190" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<circle cx="786" cy="156" r="15" fill="#2563A8"/><text x="786" y="161" text-anchor="middle" fill="#FBFAF7" font-weight="700" font-size="13">4</text>
<text x="805" y="161" class="label" font-size="12.5">Maatregelen</text>
<text x="778" y="188" class="sub">encryptie, toegangs-</text>
<text x="778" y="204" class="sub">beheer, pseudonimi-</text>
<text x="778" y="220" class="sub">sering (niveau 1 + 2)</text>

<rect x="140" y="360" width="680" height="80" rx="8" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
<text x="480" y="388" text-anchor="middle" class="sub" fill="#9A5F0D" font-weight="700">Geen eenmalig document</text>
<text x="480" y="410" text-anchor="middle" class="sub">wijzigt de verwerking substantieel — nieuw gegevenstype, nieuw doel, nieuwe</text>
<text x="480" y="428" text-anchor="middle" class="sub">technologie — dan wordt de DPIA herzien, net als de rest van het ISMS (deel 11)</text>
</svg>
