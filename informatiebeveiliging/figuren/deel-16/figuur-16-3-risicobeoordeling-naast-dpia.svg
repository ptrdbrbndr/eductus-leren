<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="'DM Sans', Arial, sans-serif" width="960" height="540" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .sub-light { font-size:12px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
    </style>
</defs>
<rect width="960" height="540" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 16 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Hetzelfde risico, twee verschillende perspectieven</text>
<text x="40" y="96" class="sub">Ze vallen soms samen, maar niet altijd — precies waarom een DPIA een apart instrument is.</text>

<rect x="200" y="130" width="560" height="80" rx="8" fill="#1A4F8B"/>
<text x="480" y="164" text-anchor="middle" class="label-light">Risicobron: profileringsalgoritme voor verzuim</text>
<text x="480" y="186" text-anchor="middle" class="sub-light">systematisch, onbedoeld, benadeelt een bepaalde groep deelnemers</text>

<rect x="60" y="250" width="380" height="220" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="250" y="282" text-anchor="middle" class="label">RISICOBEOORDELING (deel 12)</text>
<text x="250" y="304" text-anchor="middle" class="sub">"wat is het risico voor de organisatie?"</text>
<rect x="90" y="322" width="320" height="110" rx="6" fill="#F0EDE4"/>
<text x="250" y="348" text-anchor="middle" class="sub" font-weight="700">reputatieschade, boetes,</text>
<text x="250" y="366" text-anchor="middle" class="sub" font-weight="700">operationele verstoring</text>
<text x="250" y="392" text-anchor="middle" class="sub" font-style="italic">kan hier laag risico lijken —</text>
<text x="250" y="410" text-anchor="middle" class="sub" font-style="italic">weinig kans op zichtbare schade</text>

<rect x="520" y="250" width="380" height="220" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="710" y="282" text-anchor="middle" class="label">DPIA (deel 16, bouwsteen 3)</text>
<text x="710" y="304" text-anchor="middle" class="sub">"wat is het risico voor de deelnemer?"</text>
<rect x="550" y="322" width="320" height="110" rx="6" fill="#E8A020"/>
<text x="710" y="348" text-anchor="middle" class="sub" fill="#5A3A08" font-weight="700">discriminatie, stigmatisering,</text>
<text x="710" y="366" text-anchor="middle" class="sub" fill="#5A3A08" font-weight="700">verlies van controle</text>
<text x="710" y="392" text-anchor="middle" class="sub" fill="#5A3A08" font-style="italic">aanzienlijk risico — zou de</text>
<text x="710" y="410" text-anchor="middle" class="sub" fill="#5A3A08" font-style="italic">organisatie zelf niet opvallen</text>

<text x="480" y="510" text-anchor="middle" class="sub" fill="#8A5A0E">een DPIA dwingt tot een perspectiefwisseling die een organisatiegerichte risicobeoordeling niet vanzelf maakt</text>
</svg>
