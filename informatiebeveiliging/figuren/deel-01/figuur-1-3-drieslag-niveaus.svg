<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'DM Sans', Arial, sans-serif" width="960" height="560" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:11.5px; fill:#55606F; }
      .sub-light { font-size:11.5px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563A8"/></marker>
</defs>
<rect width="960" height="560" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 1 · CONCEPTDIAGRAM · RODE DRAAD</text>
<text x="40" y="64" class="title">Aanwezig → aantoonbaar → werkend, over drie niveaus</text>
<text x="40" y="96" class="sub">Dezelfde drieslag draagt de hele cursus — hier per niveau ingevuld.</text>

<rect x="40" y="130" width="270" height="380" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="175" y="160" text-anchor="middle" class="label">NIVEAU 1</text>
<text x="175" y="180" text-anchor="middle" class="sub">Zien wat er is en wat ontbreekt</text>
<rect x="60" y="200" width="230" height="80" rx="6" fill="#CBDCEF"/>
<text x="175" y="225" text-anchor="middle" class="sub" font-weight="700">Aanwezig?</text>
<text x="175" y="245" text-anchor="middle" class="sub">verlopen accounts:</text>
<text x="175" y="261" text-anchor="middle" class="sub">geen periodieke controle</text>
<line x1="175" y1="280" x2="175" y2="300" class="arrow"/>
<rect x="60" y="300" width="230" height="80" rx="6" fill="#6FA3D6"/>
<text x="175" y="325" text-anchor="middle" class="sub" font-weight="700">Aantoonbaar?</text>
<text x="175" y="345" text-anchor="middle" class="sub">340 ongelezen berichten —</text>
<text x="175" y="361" text-anchor="middle" class="sub">wie houdt dit bij?</text>
<line x1="175" y1="380" x2="175" y2="400" class="arrow"/>
<rect x="60" y="400" width="230" height="80" rx="6" fill="#2563A8"/>
<text x="175" y="425" text-anchor="middle" class="sub-light" font-weight="700">Werkend?</text>
<text x="175" y="445" text-anchor="middle" class="sub-light">testdata "geanonimiseerd" —</text>
<text x="175" y="461" text-anchor="middle" class="sub-light">op papier, niet in de praktijk</text>

<rect x="345" y="130" width="270" height="380" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="480" y="160" text-anchor="middle" class="label">NIVEAU 2</text>
<text x="480" y="180" text-anchor="middle" class="sub">Een stelsel inrichten en bewijzen</text>
<text x="480" y="200" text-anchor="middle" class="sub">dat het werkt</text>
<rect x="365" y="230" width="230" height="240" rx="6" fill="#F4F2EC" stroke="#55606F" stroke-dasharray="4 3"/>
<text x="480" y="330" text-anchor="middle" class="sub">ISO/IEC 27001-managementsysteem,</text>
<text x="480" y="350" text-anchor="middle" class="sub">DPIA, verwerkersovereenkomsten —</text>
<text x="480" y="370" text-anchor="middle" class="sub">ontworpen én getest</text>

<rect x="650" y="130" width="270" height="380" rx="8" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
<text x="785" y="160" text-anchor="middle" class="label" fill="#9A5F0D">NIVEAU 3</text>
<text x="785" y="180" text-anchor="middle" class="sub">Besturen en verantwoorden</text>
<rect x="670" y="230" width="230" height="240" rx="6" fill="#F4F2EC" stroke="#55606F" stroke-dasharray="4 3"/>
<text x="785" y="320" text-anchor="middle" class="sub">Bestuur, DNB-toezicht,</text>
<text x="785" y="340" text-anchor="middle" class="sub">het lastigste moment: durven</text>
<text x="785" y="360" text-anchor="middle" class="sub">zeggen dat iets niet werkt</text>

<text x="480" y="540" text-anchor="middle" class="sub" fill="#9A5F0D">De drieslag verandert niet — het niveau waarop je hem toepast wel.</text>
</svg>
