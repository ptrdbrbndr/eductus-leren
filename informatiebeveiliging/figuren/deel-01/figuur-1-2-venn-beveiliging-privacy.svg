<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="'DM Sans', Arial, sans-serif" width="960" height="600" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:13px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:11.5px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
    </style>
</defs>
<rect width="960" height="600" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 1 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Beveiliging en privacy — één vak, twee disciplines</text>
<text x="40" y="96" class="sub">Substantiële overlap, maar niet volledig — en juist de randen zijn waar het misgaat.</text>

<circle cx="390" cy="330" r="175" fill="#C5D8F0" fill-opacity="0.55" stroke="#1A4F8B" stroke-width="2"/>
<circle cx="590" cy="330" r="175" fill="#E8A020" fill-opacity="0.30" stroke="#E8A020" stroke-width="2"/>

<text x="270" y="215" text-anchor="middle" class="label">INFORMATIEBEVEILIGING</text>
<text x="270" y="234" text-anchor="middle" class="sub">Merel — CIA-drietal</text>

<text x="710" y="215" text-anchor="middle" class="label" fill="#8A5A0E">PRIVACY</text>
<text x="710" y="234" text-anchor="middle" class="sub">Sanne — rechtmatigheid</text>

<rect x="150" y="330" width="230" height="70" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="265" y="352" text-anchor="middle" class="sub" font-weight="700">Alleen beveiliging</text>
<text x="265" y="370" text-anchor="middle" class="sub">bedrijfsgeheim (rentemodel) lekt —</text>
<text x="265" y="386" text-anchor="middle" class="sub">geen persoonsgegeven</text>

<rect x="380" y="330" width="200" height="80" rx="6" fill="#FFFFFF" stroke="#5B6675" stroke-width="1.5"/>
<text x="480" y="352" text-anchor="middle" class="sub" font-weight="700">Overlap</text>
<text x="480" y="370" text-anchor="middle" class="sub">persoonsgegeven perfect</text>
<text x="480" y="386" text-anchor="middle" class="sub">beveiligd én rechtmatig</text>
<text x="480" y="402" text-anchor="middle" class="sub">verwerkt — het doel</text>

<rect x="600" y="330" width="230" height="70" rx="6" fill="#FFFFFF" stroke="#E8A020" stroke-width="1.5"/>
<text x="715" y="352" text-anchor="middle" class="sub" font-weight="700" fill="#8A5A0E">Alleen privacy</text>
<text x="715" y="370" text-anchor="middle" class="sub">ziekteverzuim feilloos versleuteld,</text>
<text x="715" y="386" text-anchor="middle" class="sub">maar zonder grondslag gedeeld</text>

<text x="480" y="555" text-anchor="middle" class="sub" fill="#8A5A0E">"Meer beveiliging" is niet automatisch "beter voor privacy" — zie de logging-spanning in deel 7.</text>
</svg>
