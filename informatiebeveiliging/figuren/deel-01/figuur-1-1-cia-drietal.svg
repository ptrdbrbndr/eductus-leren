<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .blue-line { stroke:#1A4F8B; }
      .blue-dark { fill:#1A4F8B; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:15px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .sub-light { font-size:11.5px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#8AAFD4; stroke-width:2; fill:none; }
    </style>
</defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 1 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Het CIA-drietal — drie soorten schade, drie voorbeelden bij Meridiaan</text>
<text x="40" y="96" class="sub">Elke maatregel dient minstens één van de drie hoeken. Herken welke.</text>

<line x1="480" y1="340" x2="480" y2="205" class="arrow"/>
<line x1="480" y1="340" x2="255" y2="470" class="arrow"/>
<line x1="480" y1="340" x2="705" y2="470" class="arrow"/>

<circle cx="480" cy="340" r="72" class="blue-dark"/>
<text x="480" y="330" text-anchor="middle" class="label-light">CIA-drietal</text>
<text x="480" y="350" text-anchor="middle" class="sub-light">informatie</text>
<text x="480" y="366" text-anchor="middle" class="sub-light">beschermen</text>

<rect x="290" y="130" width="380" height="90" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="480" y="158" text-anchor="middle" class="label">VERTROUWELIJKHEID</text>
<text x="480" y="178" text-anchor="middle" class="sub">alleen bekend bij wie het mag weten</text>
<text x="480" y="198" text-anchor="middle" class="sub" font-style="italic">Meridiaan: "versleuteld" — maar wie heeft de sleutel?</text>

<rect x="50" y="475" width="380" height="90" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="240" y="503" text-anchor="middle" class="label">INTEGRITEIT</text>
<text x="240" y="523" text-anchor="middle" class="sub">juist en onveranderd, tenzij bevoegd gewijzigd</text>
<text x="240" y="543" text-anchor="middle" class="sub" font-style="italic">Meridiaan: handtekeningcontrole bij een adreswijziging</text>

<rect x="530" y="475" width="380" height="90" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="720" y="503" text-anchor="middle" class="label">BESCHIKBAARHEID</text>
<text x="720" y="523" text-anchor="middle" class="sub">toegankelijk wanneer wie het nodig heeft het nodig heeft</text>
<text x="720" y="543" text-anchor="middle" class="sub" font-style="italic">Meridiaan: back-up na storing of ransomware</text>

<text x="480" y="600" text-anchor="middle" class="sub" fill="#8A5A0E">Elke voorgestelde maatregel dient minstens één hoek — benoem welke.</text>
</svg>
