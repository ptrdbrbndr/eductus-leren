<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="'DM Sans', Arial, sans-serif" width="960" height="480" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    </style>
</defs>
<rect width="960" height="480" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 15 · CONCEPTDIAGRAM · DAGDEEL B</text>
<text x="40" y="64" class="title">Use case naast misuse case</text>
<text x="40" y="96" class="sub">Twee vragen in hetzelfde ontwerpgesprek, niet één toetsing achteraf.</text>

<rect x="60" y="130" width="400" height="270" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="260" y="162" text-anchor="middle" class="label">USE CASE</text>
<text x="260" y="184" text-anchor="middle" class="sub">bedoeld gebruik</text>
<rect x="90" y="204" width="340" height="80" rx="6" fill="#CBDCEF"/>
<text x="260" y="232" text-anchor="middle" class="sub" font-weight="700">"Een deelnemer wijzigt zijn</text>
<text x="260" y="250" text-anchor="middle" class="sub" font-weight="700">adres via het portaal"</text>
<text x="260" y="270" text-anchor="middle" class="sub" font-size="11">normaal, verwacht gedrag</text>
<text x="90" y="320" class="sub">Beschrijft hoe het systeem</text>
<text x="90" y="338" class="sub">bedoeld wordt gebruikt —</text>
<text x="90" y="356" class="sub">het gangbare ontwerpperspectief</text>

<rect x="500" y="130" width="400" height="270" rx="8" fill="#2563A8"/>
<text x="700" y="162" text-anchor="middle" class="label-light">MISUSE CASE</text>
<text x="700" y="184" text-anchor="middle" class="sub-light">misbruik van het systeem</text>
<rect x="530" y="204" width="340" height="80" rx="6" fill="#E9A13B"/>
<text x="700" y="228" text-anchor="middle" class="sub" fill="#6B4509" font-weight="700">"Een aanvaller probeert het adres</text>
<text x="700" y="246" text-anchor="middle" class="sub" fill="#6B4509" font-weight="700">van een andere deelnemer te</text>
<text x="700" y="264" text-anchor="middle" class="sub" fill="#6B4509" font-weight="700">wijzigen via het deelnemersnummer</text>
<text x="700" y="280" text-anchor="middle" class="sub" fill="#6B4509">in de URL"</text>
<text x="530" y="320" class="sub-light">Sluit rechtstreeks aan bij need-</text>
<text x="530" y="338" class="sub-light">to-know (deel 5) en doelbinding</text>
<text x="530" y="356" class="sub-light">(deel 3) — niet alleen wat een</text>
<text x="530" y="374" class="sub-light">gebruiker zou moeten kunnen</text>

<text x="480" y="440" text-anchor="middle" class="sub" fill="#9A5F0D">standaardvraag bij elke nieuwe functionaliteit: "wie zou hier garen bij kunnen spinnen, op een manier die we niet bedoelen?"</text>
</svg>
