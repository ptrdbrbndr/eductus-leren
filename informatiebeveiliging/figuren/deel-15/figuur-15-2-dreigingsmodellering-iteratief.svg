<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .num { font-size:16px; font-weight:700; fill:#FFFFFF; font-family:'Cormorant Garamond', Georgia, serif;}
    </style>
</defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 15 · CONCEPTDIAGRAM · DAGDEEL B</text>
<text x="40" y="64" class="title">De vier dreigingsmodelleringsvragen, als iteratief proces</text>
<text x="40" y="96" class="sub">Tijdens het ontwerp, met de architect en ontwikkelaars aan tafel — niet als los, later traject.</text>

<circle cx="230" cy="290" r="100" fill="#2563A8"/>
<text x="230" y="270" text-anchor="middle" class="num">1</text>
<text x="230" y="292" text-anchor="middle" class="label-light" font-size="13">Waar werken</text>
<text x="230" y="310" text-anchor="middle" class="label-light" font-size="13">we aan?</text>
<text x="230" y="330" text-anchor="middle" class="sub-light" font-size="10">systeem, gegevensstromen,</text>
<text x="230" y="344" text-anchor="middle" class="sub-light" font-size="10">vertrouwensgrenzen</text>

<circle cx="480" cy="180" r="100" fill="#6FA3D6"/>
<text x="480" y="160" text-anchor="middle" class="num" fill="#14213D">2</text>
<text x="480" y="182" text-anchor="middle" class="label" font-size="13">Wat kan er</text>
<text x="480" y="200" text-anchor="middle" class="label" font-size="13">misgaan?</text>
<text x="480" y="220" text-anchor="middle" class="sub" font-size="10">aanvalsfasering (deel 2),</text>
<text x="480" y="234" text-anchor="middle" class="sub" font-size="10">dreigingscategorieën</text>

<circle cx="730" cy="290" r="100" fill="#6FA3D6"/>
<text x="730" y="270" text-anchor="middle" class="num" fill="#14213D">3</text>
<text x="730" y="292" text-anchor="middle" class="label" font-size="13">Wat gaan we</text>
<text x="730" y="310" text-anchor="middle" class="label" font-size="13">eraan doen?</text>
<text x="730" y="330" text-anchor="middle" class="sub" font-size="10">behandeloptie kiezen</text>
<text x="730" y="344" text-anchor="middle" class="sub" font-size="10">(deel 12)</text>

<circle cx="480" cy="400" r="100" fill="#E9A13B"/>
<text x="480" y="380" text-anchor="middle" class="num" fill="#6B4509">4</text>
<text x="480" y="402" text-anchor="middle" class="label" font-size="13" fill="#6B4509">Hebben we goed</text>
<text x="480" y="420" text-anchor="middle" class="label" font-size="13" fill="#6B4509">werk geleverd?</text>
<text x="480" y="440" text-anchor="middle" class="sub" font-size="10" fill="#6B4509">terugblik — compleet</text>
<text x="480" y="454" text-anchor="middle" class="sub" font-size="10" fill="#6B4509">genoeg, waardevol proces?</text>

<path d="M 300 240 A 260 260 0 0 1 410 190" stroke="#55606F" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
<path d="M 550 195 A 260 260 0 0 1 655 245" stroke="#55606F" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
<path d="M 675 355 A 260 260 0 0 1 555 405" stroke="#55606F" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
<path d="M 410 415 A 260 260 0 0 1 285 355" stroke="#55606F" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker></defs>

<rect x="140" y="520" width="680" height="70" rx="8" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
<text x="480" y="548" text-anchor="middle" class="sub" fill="#9A5F0D" font-weight="700">Maximaal een uur, vóórdat de bouw begint —</text>
<text x="480" y="568" text-anchor="middle" class="sub">goedkoper dan het late, spanningsvolle gesprek uit de opening van dit deel</text>
</svg>
