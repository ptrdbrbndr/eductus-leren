<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'DM Sans', Arial, sans-serif" width="960" height="640" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:11.5px; fill:#55606F; }
      .sub-light { font-size:11.5px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .ref { font-size:11px; fill:#9A5F0D; font-weight:700; }
    </style>
</defs>
<rect width="960" height="640" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 15 · CONCEPTDIAGRAM · DAGDEEL A</text>
<text x="40" y="64" class="title">Technologisch en fysiek — geformaliseerd, niet nieuw</text>
<text x="40" y="96" class="sub">Elke control verwijst terug naar een concept en een risico-onderbouwing uit niveau 1.</text>

<rect x="40" y="120" width="880" height="34" fill="#2563A8"/>
<text x="56" y="142" class="label-light" font-size="13">TECHNOLOGISCH — 34 controls, het grootste thema</text>

<rect x="40" y="156" width="170" height="90" fill="#FFFFFF" stroke="#2563A8" stroke-width="1"/>
<text x="56" y="180" class="label" font-size="12.5">Toegangsbeheer</text>
<text x="56" y="200" class="sub">authenticatie, MFA,</text>
<text x="56" y="216" class="sub">autorisatiematrix</text>
<text x="56" y="236" class="ref">→ niveau 1, deel 5</text>

<rect x="212" y="156" width="170" height="90" fill="#FFFFFF" stroke="#2563A8" stroke-width="1"/>
<text x="228" y="180" class="label" font-size="12.5">Cryptografie</text>
<text x="228" y="200" class="sub">beleid + sleutelbeheer</text>
<text x="228" y="236" class="ref">→ niveau 1, deel 6</text>

<rect x="384" y="156" width="170" height="90" fill="#FFFFFF" stroke="#2563A8" stroke-width="1"/>
<text x="400" y="180" class="label" font-size="12.5">Netwerkbeveiliging</text>
<text x="400" y="200" class="sub">zonering, segmentatie,</text>
<text x="400" y="216" class="sub">monitoring</text>
<text x="400" y="236" class="ref">→ niveau 1, deel 7</text>

<rect x="556" y="156" width="170" height="90" fill="#FFFFFF" stroke="#2563A8" stroke-width="1"/>
<text x="572" y="180" class="label" font-size="12.5">Systeemontwikkeling</text>
<text x="572" y="200" class="sub">beveiliging vanaf het</text>
<text x="572" y="216" class="sub">ontwerp</text>
<text x="572" y="236" class="ref">→ dagdeel B</text>

<rect x="728" y="156" width="192" height="90" fill="#FFFFFF" stroke="#2563A8" stroke-width="1"/>
<text x="744" y="180" class="label" font-size="12.5">Logging en monitoring</text>
<text x="744" y="200" class="sub">incl. bewaartermijn —</text>
<text x="744" y="216" class="sub">eigen AVG-afweging</text>
<text x="744" y="236" class="ref">→ niveau 1, deel 7</text>

<rect x="40" y="300" width="880" height="34" fill="#6FA3D6"/>
<text x="56" y="322" class="label" font-size="13">FYSIEK — 14 controls, het snelst vergeten thema</text>

<rect x="40" y="336" width="280" height="100" fill="#FFFFFF" stroke="#2563A8" stroke-width="1"/>
<text x="56" y="362" class="label" font-size="12.5">Gebouw- en ruimtetoegang</text>
<text x="56" y="384" class="sub">serverruimtes, kantoren</text>

<rect x="332" y="336" width="280" height="100" fill="#FFFFFF" stroke="#2563A8" stroke-width="1"/>
<text x="348" y="362" class="label" font-size="12.5">Apparatuurbeveiliging</text>
<text x="348" y="384" class="sub">laptops, servers, netwerk-</text>
<text x="348" y="400" class="sub">apparatuur</text>

<rect x="624" y="336" width="296" height="100" fill="#E9A13B"/>
<text x="640" y="362" class="label" font-size="12.5" fill="#6B4509">Clear desk, clear screen</text>
<text x="640" y="384" class="sub" fill="#6B4509">meest onderschat — een dossier op</text>
<text x="640" y="400" class="sub" fill="#6B4509">een bureau is net zo'n schending als</text>
<text x="640" y="416" class="sub" fill="#6B4509">een digitale inbraak</text>

<rect x="120" y="480" width="720" height="90" rx="8" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
<text x="480" y="508" text-anchor="middle" class="sub" fill="#9A5F0D" font-weight="700">Het punt is niet elke control los te behandelen</text>
<text x="480" y="530" text-anchor="middle" class="sub">— dat vraagt een technische cursus die deze bewust niet is (deel 1) —</text>
<text x="480" y="548" text-anchor="middle" class="sub">maar te laten zien hoe elk terugverwijst naar een eerder concept</text>
</svg>
