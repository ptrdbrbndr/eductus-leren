<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="'DM Sans', Arial, sans-serif" width="960" height="600" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    </style>
</defs>
<rect width="960" height="600" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 14 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Effectieve bewustwording: oud tegenover herzien</text>
<text x="40" y="96" class="sub">Drie maanden na de sessie: "iets met niet op linkjes klikken" — of daadwerkelijk veranderd gedrag?</text>

<rect x="60" y="130" width="380" height="360" rx="8" fill="#F4F2EC" stroke="#55606F" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="250" y="162" text-anchor="middle" class="label">OUDE AANPAK</text>
<text x="250" y="184" text-anchor="middle" class="sub">jaarlijkse, uur durende presentatie</text>
<text x="90" y="230" class="sub">— één lange sessie, eenmalig per jaar</text>
<text x="90" y="260" class="sub">— generieke content voor iedereen,</text>
<text x="90" y="278" class="sub">   relevant voor bijna niemand</text>
<text x="90" y="308" class="sub">— alleen theorie, geen oefening</text>
<text x="90" y="338" class="sub">— geen feedback op het moment zelf</text>
<rect x="90" y="380" width="320" height="80" rx="6" fill="#FFFFFF"/>
<text x="250" y="404" text-anchor="middle" class="sub" font-style="italic">"iets met niet op linkjes klikken" —</text>
<text x="250" y="424" text-anchor="middle" class="sub" font-style="italic">"eerlijk gezegd niet veel, het was een</text>
<text x="250" y="444" text-anchor="middle" class="sub" font-style="italic">lang verhaal met veel dia's"</text>

<rect x="520" y="130" width="380" height="360" rx="8" fill="#2563A8"/>
<text x="710" y="162" text-anchor="middle" class="label-light">HERZIENE AANPAK</text>
<text x="710" y="184" text-anchor="middle" class="sub-light">korte, terugkerende modules</text>
<text x="550" y="230" class="sub-light">— herhaling in kleine porties,</text>
<text x="550" y="246" class="sub-light">   niet één marathonsessie</text>
<text x="550" y="270" class="sub-light">— relevantie voor de eigen rol</text>
<text x="550" y="286" class="sub-light">   (ontwikkelaar ≠ klantenservice)</text>
<text x="550" y="310" class="sub-light">— realistische oefening: phishing-</text>
<text x="550" y="326" class="sub-light">   simulatie, zorgvuldig vormgegeven</text>
<text x="550" y="350" class="sub-light">— directe, niet-bestraffende feedback</text>
<text x="550" y="366" class="sub-light">   op het moment zelf</text>
<rect x="550" y="390" width="320" height="70" rx="6" fill="#E9A13B"/>
<text x="710" y="415" text-anchor="middle" class="sub" fill="#6B4509" font-weight="700">"fout gemeld" leidt nooit tot een</text>
<text x="710" y="435" text-anchor="middle" class="sub" fill="#6B4509" font-weight="700">negatieve beoordeling — verzwijgen wel</text>

<text x="480" y="530" text-anchor="middle" class="sub" fill="#9A5F0D">de mens als ontwerpvariabele (deel 2) — niet als zwakste schakel die zijn eigen geheugen moet trainen</text>
</svg>
