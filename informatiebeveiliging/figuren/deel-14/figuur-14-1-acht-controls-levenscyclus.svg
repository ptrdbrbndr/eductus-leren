<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:11.5px; fill:#5B6675; }
      .sub-light { font-size:11.5px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#5B6675; stroke-width:1.5; fill:none; marker-end:url(#arr); }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5B6675"/></marker>
</defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 14 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">De acht mensgerelateerde controls, langs de levenscyclus</text>
<text x="40" y="96" class="sub">Gespiegeld aan joiner-mover-leaver uit deel 5 — nu toegepast op gedrag en cultuur.</text>

<line x1="60" y1="140" x2="900" y2="140" stroke="#1A4F8B" stroke-width="2"/>
<path d="M880 133 L900 140 L880 147 Z" fill="#1A4F8B"/>

<circle cx="140" cy="140" r="9" fill="#1A4F8B"/>
<circle cx="480" cy="140" r="9" fill="#1A4F8B"/>
<circle cx="820" cy="140" r="9" fill="#1A4F8B"/>

<rect x="50" y="170" width="220" height="230" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="160" y="196" text-anchor="middle" class="label">JOINER</text>
<text x="70" y="222" class="sub" font-weight="700">6.1 Screening</text>
<text x="70" y="238" class="sub">risicogebaseerd, niet uniform</text>
<text x="70" y="266" class="sub" font-weight="700">6.2 Arbeidsvoorwaarden</text>
<text x="70" y="282" class="sub">en verantwoordelijkheden</text>
<text x="70" y="310" class="sub" font-weight="700">6.6 Vertrouwelijkheids-</text>
<text x="70" y="326" class="sub">overeenkomsten</text>
<text x="70" y="368" class="sub" font-style="italic">bij aanvang expliciet</text>
<text x="70" y="384" class="sub" font-style="italic">vastgelegd, geen vage clausule</text>

<rect x="370" y="170" width="220" height="230" rx="8" fill="#1A4F8B"/>
<text x="480" y="196" text-anchor="middle" class="label-light">MOVER</text>
<text x="390" y="222" class="sub-light" font-weight="700">6.3 Bewustwording, opleiding</text>
<text x="390" y="238" class="sub-light">en training — zie deel 14-2</text>
<text x="390" y="266" class="sub-light" font-weight="700">6.4 Disciplinair proces</text>
<text x="390" y="282" class="sub-light">fout ≠ overtreding</text>
<text x="390" y="310" class="sub-light" font-weight="700">6.7 Werken op afstand</text>
<text x="390" y="326" class="sub-light" font-weight="700">6.8 Rapportage van</text>
<text x="390" y="342" class="sub-light">beveiligingsgebeurtenissen</text>
<text x="390" y="378" class="sub-light" font-style="italic">grootste groep — hier gebeurt</text>
<text x="390" y="394" class="sub-light" font-style="italic">het meeste van het dagelijkse werk</text>

<rect x="690" y="170" width="220" height="230" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="800" y="196" text-anchor="middle" class="label">LEAVER</text>
<text x="710" y="222" class="sub" font-weight="700">6.5 Verantwoordelijkheden</text>
<text x="710" y="238" class="sub">na beëindiging dienstverband</text>
<text x="710" y="270" class="sub">welke vertrouwelijkheids-</text>
<text x="710" y="286" class="sub">verplichtingen blijven gelden</text>
<text x="710" y="302" class="sub">na vertrek?</text>
<text x="710" y="368" class="sub" font-style="italic">expliciet bij vertrek onder de</text>
<text x="710" y="384" class="sub" font-style="italic">aandacht, niet impliciet verondersteld</text>

<rect x="140" y="440" width="680" height="70" rx="8" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>
<text x="480" y="466" text-anchor="middle" class="sub" fill="#8A5A0E" font-weight="700">8 controls, 37 organisatorisch — samen het kleinste thema van Bijlage A</text>
<text x="480" y="486" text-anchor="middle" class="sub" fill="#8A5A0E">en toch vaak het grootste praktische verschil (deel 14, opening)</text>
</svg>
