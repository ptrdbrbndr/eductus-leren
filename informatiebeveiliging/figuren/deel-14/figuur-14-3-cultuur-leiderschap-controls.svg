<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'DM Sans', Arial, sans-serif" width="960" height="560" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .sub-light { font-size:12px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1A4F8B"/></marker>
</defs>
<rect width="960" height="560" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 14 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Cultuur, leiderschap en mensgerelateerde controls</text>
<text x="40" y="96" class="sub">Regels werken alleen als ze onderdeel zijn van cultuur — en cultuur wordt niet door een document gecreëerd.</text>

<rect x="380" y="130" width="200" height="80" rx="8" fill="#1A4F8B"/>
<text x="480" y="163" text-anchor="middle" class="label-light">CLAUSULE 5</text>
<text x="480" y="184" text-anchor="middle" class="sub-light">Leiderschap</text>

<path d="M480 210 L480 250" class="arrow"/>

<rect x="330" y="252" width="300" height="90" rx="8" fill="#E8A020"/>
<text x="480" y="284" text-anchor="middle" class="label" fill="#5A3A08">CULTUUR</text>
<text x="480" y="306" text-anchor="middle" class="sub" fill="#5A3A08">melden aangemoedigd, niet bestraft;</text>
<text x="480" y="324" text-anchor="middle" class="sub" fill="#5A3A08">leidinggevenden geven het voorbeeld</text>

<path d="M480 342 L480 380" class="arrow"/>

<rect x="60" y="382" width="230" height="110" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="175" y="410" text-anchor="middle" class="label" font-size="13">Mensgerelateerde</text>
<text x="175" y="428" text-anchor="middle" class="label" font-size="13">controls (deel 14-1)</text>
<text x="80" y="452" class="sub" font-size="11">werken alléén binnen</text>
<text x="80" y="468" class="sub" font-size="11">deze cultuur — niet als</text>
<text x="80" y="484" class="sub" font-size="11">geïsoleerde regels</text>

<rect x="365" y="382" width="230" height="110" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="480" y="410" text-anchor="middle" class="label" font-size="13">Clausule 7</text>
<text x="480" y="428" text-anchor="middle" class="label" font-size="13">Ondersteuning</text>
<text x="385" y="452" class="sub" font-size="11">bewustzijn is expliciet</text>
<text x="385" y="468" class="sub" font-size="11">onderdeel van deze</text>
<text x="385" y="484" class="sub" font-size="11">clausule, niet apart</text>

<rect x="670" y="382" width="230" height="110" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="785" y="410" text-anchor="middle" class="label" font-size="13">Wat het ondermijnt</text>
<text x="690" y="440" class="sub" font-size="11">een leidinggevende die</text>
<text x="690" y="456" class="sub" font-size="11">zelf regels omzeilt</text>
<text x="690" y="472" class="sub" font-size="11">"omdat het sneller is"</text>

<text x="480" y="530" text-anchor="middle" class="sub" fill="#8A5A0E">consistent voorbeeldgedrag ondersteunt een document — een document creëert geen cultuur</text>
</svg>
