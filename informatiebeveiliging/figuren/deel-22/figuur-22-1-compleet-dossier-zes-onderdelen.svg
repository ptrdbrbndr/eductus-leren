<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'DM Sans', Arial, sans-serif" width="960" height="560" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:13.5px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:13.5px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:11.5px; fill:#5B6675; }
      .sub-light { font-size:11.5px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .num { font-size:14px; font-weight:700; fill:#FFFFFF; }
    </style>
</defs>
<rect width="960" height="560" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 22 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Het complete ISMS-dossier</text>
<text x="40" y="96" class="sub">Van Merels losse nulmeting (deel 10) naar een volwaardig, documenteerbaar geheel.</text>

<rect x="40" y="130" width="280" height="120" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<circle cx="66" cy="156" r="15" fill="#1A4F8B"/><text x="66" y="161" text-anchor="middle" class="num">1</text>
<text x="90" y="161" class="label">Scope-verklaring</text>
<text x="58" y="188" class="sub">welke systemen en processen,</text>
<text x="58" y="204" class="sub">met onderbouwing</text>
<text x="58" y="228" class="sub" font-weight="700">→ deel 11</text>

<rect x="340" y="130" width="280" height="120" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<circle cx="366" cy="156" r="15" fill="#1A4F8B"/><text x="366" y="161" text-anchor="middle" class="num">2</text>
<text x="390" y="161" class="label">Risicobeoordeling</text>
<text x="358" y="188" class="sub">minstens 3 risico's: kans,</text>
<text x="358" y="204" class="sub">impact, eigenaar, behandeling</text>
<text x="358" y="228" class="sub" font-weight="700">→ deel 12</text>

<rect x="640" y="130" width="280" height="120" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<circle cx="666" cy="156" r="15" fill="#1A4F8B"/><text x="666" y="161" text-anchor="middle" class="num">3</text>
<text x="690" y="161" class="label" font-size="13">Verklaring van</text>
<text x="690" y="177" class="label" font-size="13">Toepasselijkheid</text>
<text x="658" y="200" class="sub">minstens 5 controls, ja/nee</text>
<text x="658" y="216" class="sub">+ onderbouwing</text>
<text x="658" y="236" class="sub" font-weight="700">→ deel 11</text>

<rect x="40" y="272" width="280" height="120" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<circle cx="66" cy="298" r="15" fill="#1A4F8B"/><text x="66" y="303" text-anchor="middle" class="num">4</text>
<text x="90" y="303" class="label">DPIA-samenvatting</text>
<text x="58" y="330" class="sub">4 bouwstenen + expliciete</text>
<text x="58" y="346" class="sub">grondslagbeoordeling</text>
<text x="58" y="370" class="sub" font-weight="700">→ deel 16, 17</text>

<rect x="340" y="272" width="280" height="120" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<circle cx="366" cy="298" r="15" fill="#1A4F8B"/><text x="366" y="303" text-anchor="middle" class="num">5</text>
<text x="390" y="303" class="label">Incidentnazorg</text>
<text x="358" y="330" class="sub">post-mortem-samenvatting,</text>
<text x="358" y="346" class="sub">vier nazorgonderdelen</text>
<text x="358" y="370" class="sub" font-weight="700">→ deel 19</text>

<rect x="640" y="272" width="280" height="120" rx="8" fill="#1A4F8B" stroke="#E8A020" stroke-width="2.5"/>
<circle cx="666" cy="298" r="15" fill="#F5F4F0"/><text x="666" y="303" text-anchor="middle" class="num" fill="#1A4F8B">6</text>
<text x="690" y="303" class="label-light" font-size="13">Onderbouwd "nee,</text>
<text x="690" y="319" class="label-light" font-size="13">dit niet"</text>
<text x="658" y="342" class="sub-light">control, functionaliteit of</text>
<text x="658" y="358" class="sub-light">geaccepteerd risico</text>
<text x="658" y="380" class="sub-light" font-weight="700">→ overal in het dossier</text>

<rect x="140" y="424" width="680" height="90" rx="8" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>
<text x="480" y="452" text-anchor="middle" class="sub" fill="#8A5A0E" font-weight="700">verdedigd voor vijf rollen — Karin, Tarik, Sanne, Ruud, en de nieuwe toezichtsrol</text>
<text x="480" y="474" text-anchor="middle" class="sub">die specifiek toetst op aantoonbaarheid (deel 20) en systeemdenken (deel 19)</text>
<text x="480" y="494" text-anchor="middle" class="sub">— zie de rubric in figuur 22-2</text>
</svg>
