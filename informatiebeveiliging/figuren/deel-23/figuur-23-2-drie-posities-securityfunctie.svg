<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="'DM Sans', Arial, sans-serif" width="960" height="660" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow-amber { stroke:#E8A020; stroke-width:2; fill:none; stroke-dasharray:5 4; marker-end:url(#arra); }
    </style>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#E8A020"/></marker>
</defs>
<rect width="960" height="660" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 23 · MATRIX</text>
<text x="40" y="64" class="title">Drie posities voor de securityfunctie</text>
<text x="40" y="96" class="sub">Elke positie heeft een reëel voordeel en een reëel nadeel — er is geen foutloze keuze.</text>

<!-- kolom 1 -->
<rect x="60" y="130" width="260" height="50" rx="8" fill="#1A4F8B"/>
<text x="190" y="161" text-anchor="middle" class="label-light" font-size="13">ONDER IT</text>
<rect x="60" y="180" width="260" height="290" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<circle cx="90" cy="215" r="12" fill="#1A4F8B"/>
<text x="90" y="220" text-anchor="middle" fill="#F5F4F0" font-weight="700" font-size="14">+</text>
<text x="112" y="212" class="sub" font-size="12">dicht bij de techniek,</text>
<text x="112" y="228" class="sub" font-size="12">snelle samenwerking</text>
<text x="112" y="244" class="sub" font-size="12">met architectuur/beheer</text>
<circle cx="90" cy="290" r="12" fill="#0D1B2A"/>
<text x="90" y="295" text-anchor="middle" fill="#F5F4F0" font-weight="700" font-size="16">–</text>
<text x="112" y="287" class="sub" font-size="12">belangenconflict:</text>
<text x="112" y="303" class="sub" font-size="12">snelheid (IT's drijfveer)</text>
<text x="112" y="319" class="sub" font-size="12">versus zorgvuldigheid</text>

<!-- kolom 2 -->
<rect x="350" y="130" width="260" height="50" rx="8" fill="#1A4F8B"/>
<text x="480" y="154" text-anchor="middle" class="label-light" font-size="12">ONDER RISICO &amp;</text>
<text x="480" y="170" text-anchor="middle" class="label-light" font-size="12">COMPLIANCE</text>
<rect x="350" y="180" width="260" height="290" rx="8" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>
<circle cx="380" cy="215" r="12" fill="#1A4F8B"/>
<text x="380" y="220" text-anchor="middle" fill="#F5F4F0" font-weight="700" font-size="14">+</text>
<text x="402" y="212" class="sub" font-size="12">onafhankelijker van</text>
<text x="402" y="228" class="sub" font-size="12">de bouwende functies,</text>
<text x="402" y="244" class="sub" font-size="12">aansluiting bij risicokader</text>
<circle cx="380" cy="290" r="12" fill="#0D1B2A"/>
<text x="380" y="295" text-anchor="middle" fill="#F5F4F0" font-weight="700" font-size="16">–</text>
<text x="402" y="287" class="sub" font-size="12">afstand tot de</text>
<text x="402" y="303" class="sub" font-size="12">technische praktijk:</text>
<text x="402" y="319" class="sub" font-size="12">minder concreet advies</text>
<text x="480" y="440" text-anchor="middle" class="sub" fill="#8A5A0E" font-weight="700">MERIDIAAN: hiërarchisch hier</text>

<!-- kolom 3 -->
<rect x="640" y="130" width="260" height="50" rx="8" fill="#1A4F8B"/>
<text x="770" y="154" text-anchor="middle" class="label-light" font-size="12">RECHTSTREEKS AAN</text>
<text x="770" y="170" text-anchor="middle" class="label-light" font-size="12">HET BESTUUR</text>
<rect x="640" y="180" width="260" height="290" rx="8" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>
<circle cx="670" cy="215" r="12" fill="#1A4F8B"/>
<text x="670" y="220" text-anchor="middle" fill="#F5F4F0" font-weight="700" font-size="14">+</text>
<text x="692" y="212" class="sub" font-size="12">sterkste onafhankelijk-</text>
<text x="692" y="228" class="sub" font-size="12">heid, vergelijkbaar met</text>
<text x="692" y="244" class="sub" font-size="12">de FG-positionering</text>
<circle cx="670" cy="290" r="12" fill="#0D1B2A"/>
<text x="670" y="295" text-anchor="middle" fill="#F5F4F0" font-weight="700" font-size="16">–</text>
<text x="692" y="287" class="sub" font-size="12">vraagt een bestuur met</text>
<text x="692" y="303" class="sub" font-size="12">voldoende volwassenheid</text>
<text x="692" y="319" class="sub" font-size="12">om advies te wegen</text>
<text x="770" y="440" text-anchor="middle" class="sub" fill="#8A5A0E" font-weight="700">MERIDIAAN: functioneel hier</text>

<path d="M480 470 L480 500" class="arrow-amber"/>
<path d="M770 470 L770 500 L500 500" class="arrow-amber"/>
<rect x="220" y="502" width="520" height="72" rx="8" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>
<text x="480" y="528" text-anchor="middle" class="label" font-size="12" fill="#8A5A0E">MERIDIAAN'S TUSSENVORM</text>
<text x="480" y="548" text-anchor="middle" class="sub">Merel: functioneel aan het bestuur (mandaat, escalatie),</text>
<text x="480" y="564" text-anchor="middle" class="sub">hiërarchisch onder risico &amp; compliance (dagelijkse aansturing)</text>

<text x="480" y="625" text-anchor="middle" class="sub" fill="#8A5A0E">geen enkele positie is foutloos — de keuze is een afweging, geen wet van Meden en Perzen</text>
</svg>
