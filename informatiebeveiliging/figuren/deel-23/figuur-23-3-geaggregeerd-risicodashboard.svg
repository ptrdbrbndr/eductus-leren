<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:13px; font-weight:700; fill:#0D1B2A; }
      .sub { font-size:11px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
    </style>
</defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 23 · INSTRUMENT</text>
<text x="40" y="64" class="title">Het geaggregeerde risicodashboard</text>
<text x="40" y="96" class="sub">Vijf kernrisico's in plaats van tien losse rapportages — het invaarrisico springt boven de bereidheid uit.</text>

<line x1="686" y1="128" x2="686" y2="445" stroke="#5B6675" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="686" y="120" text-anchor="middle" class="sub" font-weight="700">risicobereidheid = 70</text>

<text x="60" y="167" class="label" font-size="12">Toegangsbeheer IT-systemen</text>
<rect x="280" y="150" width="319" height="40" rx="4" fill="#8AAFD4" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="610" y="175" class="sub" font-weight="700">55</text>

<text x="60" y="227" class="label" font-size="12">Leveranciersketen (DORA)</text>
<rect x="280" y="210" width="278" height="40" rx="4" fill="#8AAFD4" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="570" y="235" class="sub" font-weight="700">48</text>

<text x="60" y="285" class="label" font-size="12" fill="#8A5A0E">Invaren bestaande aanspraken</text>
<text x="60" y="301" class="sub" fill="#8A5A0E">boven risicobereidheid — vraagt bestuursbesluit</text>
<rect x="280" y="270" width="476" height="40" rx="4" fill="#E8A020" stroke="#8A5A0E" stroke-width="2.5"/>
<text x="768" y="295" class="sub" font-weight="700" fill="#8A5A0E">82</text>

<text x="60" y="347" class="label" font-size="12">Continuïteit Mutatieplatform</text>
<rect x="280" y="330" width="232" height="40" rx="4" fill="#8AAFD4" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="524" y="355" class="sub" font-weight="700">40</text>

<text x="60" y="407" class="label" font-size="12">Datalekken en meldingen</text>
<rect x="280" y="390" width="174" height="40" rx="4" fill="#8AAFD4" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="466" y="415" class="sub" font-weight="700">30</text>

<rect x="40" y="475" width="880" height="60" rx="8" fill="#FFFFFF" stroke="#E8A020" stroke-width="2"/>
<text x="480" y="498" text-anchor="middle" class="sub" fill="#8A5A0E" font-weight="700">Selectie, geen volledigheid</text>
<text x="480" y="518" text-anchor="middle" class="sub">het dashboard toont niet alles — het toont wat boven de bereidheid ligt en dus om een besluit vraagt</text>

<text x="480" y="580" text-anchor="middle" class="sub" fill="#8A5A0E">datakwaliteit bij het invaren is de dragende factor achter dit ene rode risico</text>
</svg>
