<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="'DM Sans', Arial, sans-serif" width="960" height="680" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .sub-light { font-size:12px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-amber { stroke:#E8A020; stroke-width:2; fill:none; stroke-dasharray:5 4; marker-end:url(#arra); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1A4F8B"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#E8A020"/></marker>
</defs>
<rect width="960" height="680" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 23 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Three lines of defence — Meridiaan organisatiebreed</text>
<text x="40" y="96" class="sub">De lijnen bestaan niet om het bestuur werk uit handen te nemen, maar om het overzicht mogelijk te maken.</text>

<rect x="300" y="120" width="360" height="58" rx="8" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>
<text x="480" y="145" text-anchor="middle" class="label">BESTUUR — Hugo Prins</text>
<text x="480" y="166" text-anchor="middle" class="sub">één samenhangend beeld, geen tien losse rapportages</text>

<line x1="480" y1="178" x2="480" y2="206" class="arrow"/>

<rect x="60" y="212" width="840" height="130" rx="8" fill="#8AAFD4"/>
<text x="80" y="236" class="label-light" font-size="13">TWEEDE LIJN</text>
<text x="80" y="253" class="sub-light">kaders stellen · adviseren · geaggregeerd rapporteren aan het bestuur</text>
<rect x="80" y="266" width="240" height="60" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="200" y="290" text-anchor="middle" class="label" font-size="12">Merel</text>
<text x="200" y="308" text-anchor="middle" class="sub" font-size="11">security, organisatiebreed</text>
<rect x="340" y="266" width="240" height="60" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="460" y="290" text-anchor="middle" class="label" font-size="12">Sanne</text>
<text x="460" y="308" text-anchor="middle" class="sub" font-size="11">privacy / FG, organisatiebreed</text>
<rect x="600" y="266" width="260" height="60" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="730" y="290" text-anchor="middle" class="label" font-size="12">Risicomanagement</text>
<text x="730" y="308" text-anchor="middle" class="sub" font-size="11">&amp; compliance, breder</text>

<line x1="480" y1="342" x2="480" y2="370" class="arrow"/>

<rect x="60" y="376" width="840" height="160" rx="8" fill="#C5D8F0"/>
<text x="80" y="400" class="label" font-size="13" fill="#0D1B2A">EERSTE LIJN</text>
<text x="80" y="417" class="sub">elke operationele eenheid beheerst haar eigen risico's binnen de kaders van de tweede lijn</text>
<rect x="80" y="430" width="180" height="86" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="170" y="465" text-anchor="middle" class="sub" font-size="12">Mutatieteam</text>
<rect x="280" y="430" width="180" height="86" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="370" y="459" text-anchor="middle" class="sub" font-size="12">Actuariële</text>
<text x="370" y="477" text-anchor="middle" class="sub" font-size="12">afdeling</text>
<rect x="480" y="430" width="180" height="86" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="570" y="465" text-anchor="middle" class="sub" font-size="12">Klantenservice</text>
<rect x="680" y="430" width="180" height="86" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="770" y="459" text-anchor="middle" class="sub" font-size="12">IT-beheer-</text>
<text x="770" y="477" text-anchor="middle" class="sub" font-size="12">teams</text>

<rect x="60" y="558" width="840" height="70" rx="8" fill="#0D1B2A"/>
<text x="80" y="584" class="label-light" font-size="13">DERDE LIJN — interne auditfunctie</text>
<text x="80" y="604" class="sub-light">onafhankelijk: controleert de eerste lijn én beoordeelt of de tweede lijn haar werk goed doet</text>

<path d="M910 593 L930 593 L930 149 L662 149" class="arrow-amber"/>
<text x="934" y="380" text-anchor="middle" class="sub" fill="#8A5A0E" transform="rotate(90 934 380)">rechtstreeks, onafhankelijk van lijn 2</text>

<text x="480" y="655" text-anchor="middle" class="sub" fill="#8A5A0E">de drie lijnen geven Hugo overzicht zonder dat hij zelf operationeel hoeft mee te kijken</text>
</svg>
