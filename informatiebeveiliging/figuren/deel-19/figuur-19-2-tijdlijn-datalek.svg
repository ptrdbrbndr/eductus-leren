<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="'DM Sans', Arial, sans-serif" width="960" height="480" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:13px; font-weight:700; fill:#0D1B2A; }
      .sub { font-size:11.5px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .t { font-size:11px; font-weight:700; fill:#8A5A0E; }
    </style>
</defs>
<rect width="960" height="480" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 19 · TIJDLIJN · DAGDEEL B</text>
<text x="40" y="64" class="title">Het datalek: van detectie tot nazorg</text>
<text x="40" y="96" class="sub">De 72-uursklok loopt door, met of zonder volledige zekerheid.</text>

<line x1="70" y1="240" x2="890" y2="240" stroke="#1A4F8B" stroke-width="3"/>

<!-- detectie -->
<circle cx="100" cy="240" r="9" fill="#1A4F8B"/>
<line x1="100" y1="240" x2="100" y2="180" stroke="#5B6675" stroke-width="1.2"/>
<text x="100" y="168" text-anchor="middle" class="t">DINSDAGMIDDAG</text>
<text x="100" y="152" text-anchor="middle" class="label" font-size="12">Detectie</text>
<text x="40" y="270" text-anchor="middle" class="sub" font-size="10">Ruuds bericht</text>

<!-- containment -->
<circle cx="270" cy="240" r="9" fill="#1A4F8B"/>
<line x1="270" y1="240" x2="270" y2="180" stroke="#5B6675" stroke-width="1.2"/>
<text x="270" y="168" text-anchor="middle" class="t">BINNEN 1 UUR</text>
<text x="270" y="152" text-anchor="middle" class="label" font-size="12">Containment</text>
<text x="270" y="270" text-anchor="middle" class="sub" font-size="10">koppeling uitgeschakeld</text>

<!-- 48u -->
<circle cx="440" cy="240" r="9" fill="#8AAFD4"/>
<line x1="440" y1="240" x2="440" y2="300" stroke="#5B6675" stroke-width="1.2"/>
<text x="440" y="322" text-anchor="middle" class="t">NA 48 UUR</text>
<text x="440" y="338" text-anchor="middle" class="label" font-size="12">Omvang scherper</text>
<text x="440" y="356" text-anchor="middle" class="sub" font-size="10">9 werkgevers, 1.200-1.800</text>
<text x="440" y="372" text-anchor="middle" class="sub" font-size="10">deelnemers — nog onzeker</text>

<!-- 72u -->
<circle cx="620" cy="240" r="11" fill="#E8A020"/>
<line x1="620" y1="240" x2="620" y2="180" stroke="#5B6675" stroke-width="1.2"/>
<text x="620" y="168" text-anchor="middle" class="t">BINNEN 72 UUR</text>
<text x="620" y="152" text-anchor="middle" class="label" font-size="12" fill="#8A5A0E">Melding aan de AP</text>
<text x="620" y="270" text-anchor="middle" class="sub" font-size="10">gefaseerd, met wat</text>
<text x="620" y="284" text-anchor="middle" class="sub" font-size="10">op dat moment bekend is</text>

<!-- informeren -->
<circle cx="760" cy="240" r="9" fill="#1A4F8B"/>
<line x1="760" y1="240" x2="760" y2="300" stroke="#5B6675" stroke-width="1.2"/>
<text x="760" y="322" text-anchor="middle" class="t">GELIJKTIJDIG</text>
<text x="760" y="338" text-anchor="middle" class="label" font-size="12">Betrokkenen informeren</text>
<text x="760" y="356" text-anchor="middle" class="sub" font-size="10">hoog risico door gezondheids-</text>
<text x="760" y="372" text-anchor="middle" class="sub" font-size="10">gerelateerde mutaties</text>

<!-- nazorg -->
<circle cx="860" cy="240" r="9" fill="#1A4F8B"/>
<line x1="860" y1="240" x2="860" y2="180" stroke="#5B6675" stroke-width="1.2"/>
<text x="860" y="168" text-anchor="middle" class="t">DAARNA</text>
<text x="860" y="152" text-anchor="middle" class="label" font-size="12">Nazorg</text>
<text x="860" y="270" text-anchor="middle" class="sub" font-size="10" text-anchor="middle">herstel,</text>
<text x="860" y="284" text-anchor="middle" class="sub" font-size="10">post-mortem</text>

<rect x="140" y="410" width="680" height="60" rx="8" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>
<text x="480" y="436" text-anchor="middle" class="sub" fill="#8A5A0E" font-weight="700">wachten tot volledige zekerheid is geen geldige reden om de eerste melding uit te stellen</text>
<text x="480" y="454" text-anchor="middle" class="sub">het scherpste moment van de hele niveau 2-casus</text>
</svg>
