<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'DM Sans', Arial, sans-serif" width="960" height="640" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:13.5px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:13.5px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .sub-light { font-size:12px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-r { stroke:#B23B3B; stroke-width:2; fill:none; marker-end:url(#arrr); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1A4F8B"/></marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#B23B3B"/></marker>
</defs>
<rect width="960" height="640" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 19 · CONCEPTDIAGRAM · DAGDEEL B</text>
<text x="40" y="64" class="title">De post-mortem-bevinding, herleid naar deel 13</text>
<text x="40" y="96" class="sub">Geen toevallige samenloop — precies het scenario waar deel 13 al voor waarschuwde.</text>

<rect x="60" y="130" width="560" height="60" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="80" y="154" class="label" font-size="13">Deel 13: uitzondering toegekend</text>
<text x="80" y="174" class="sub">tijdelijke integratie met verouderd werkgeversportaal, géén vervaldatum</text>

<line x1="340" y1="190" x2="340" y2="222" class="arrow-r"/>

<rect x="60" y="224" width="560" height="60" rx="8" fill="#FFFFFF" stroke="#B23B3B" stroke-width="1.8"/>
<text x="80" y="248" class="label" font-size="13" fill="#B23B3B">Blijft stilzwijgend bestaan</text>
<text x="80" y="268" class="sub">portaal wordt allang vervangen — de uitzondering wordt niet meer opgemerkt</text>

<line x1="340" y1="284" x2="340" y2="316" class="arrow-r"/>

<rect x="60" y="318" width="560" height="60" rx="8" fill="#FFFFFF" stroke="#B23B3B" stroke-width="1.8"/>
<text x="80" y="342" class="label" font-size="13" fill="#B23B3B">Autorisatiefout ontstaat</text>
<text x="80" y="362" class="sub">de verouderde uitzondering in de toegangsstandaard blijkt de onderliggende oorzaak</text>

<line x1="340" y1="378" x2="340" y2="410" class="arrow-r"/>

<rect x="60" y="412" width="560" height="70" rx="8" fill="#B23B3B" fill-opacity="0.1" stroke="#B23B3B" stroke-width="2"/>
<text x="80" y="438" class="label" font-size="13" fill="#B23B3B">Het incident van dagdeel A/B</text>
<text x="80" y="458" class="sub">mutatiebestanden zichtbaar tussen werkgevers — zes weken lang, negen werkgevers</text>

<rect x="660" y="130" width="240" height="352" rx="8" fill="#1A4F8B"/>
<text x="780" y="162" text-anchor="middle" class="label-light">TER VERGELIJKING</text>
<text x="780" y="184" text-anchor="middle" class="sub-light">Deel 5: verlopen</text>
<text x="780" y="200" text-anchor="middle" class="sub-light">accounts</text>
<text x="680" y="230" class="sub-light">zelfde patroon, andere</text>
<text x="680" y="246" class="sub-light">laag: iets dat "voor nu"</text>
<text x="680" y="262" class="sub-light">is ingesteld, geen</text>
<text x="680" y="278" class="sub-light">vervaldatum krijgt, en</text>
<text x="680" y="294" class="sub-light">daarna vergeten wordt</text>
<rect x="680" y="316" width="200" height="140" rx="6" fill="#E8A020"/>
<text x="780" y="342" text-anchor="middle" class="sub" fill="#5A3A08" font-weight="700">Karins conclusie</text>
<text x="700" y="366" fill="#5A3A08" font-size="11">niet één persoon faalde —</text>
<text x="700" y="382" fill="#5A3A08" font-size="11">het uitzonderingenbeheer</text>
<text x="700" y="398" fill="#5A3A08" font-size="11">miste een sluitende borging</text>
<text x="700" y="422" fill="#5A3A08" font-size="11" font-weight="700">→ geautomatiseerde</text>
<text x="700" y="438" fill="#5A3A08" font-size="11" font-weight="700">escalatie ingevoerd</text>

<text x="480" y="530" text-anchor="middle" class="sub" fill="#8A5A0E">"aanwezig is niet hetzelfde als aantoonbaar" — een uitzondering zonder vervaldatum is beide niet</text>
</svg>
