<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" font-family="'DM Sans', Arial, sans-serif" width="1000" height="440" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .axis { stroke:#1A4F8B; stroke-width:2.5; }
      .tick { stroke:#8AAFD4; stroke-width:1.5; }
      .dot { fill:#1A4F8B; }
      .e-label { font-size:12px; fill:#0D1B2A; text-anchor:middle; font-weight:700; }
      .e-sub { font-size:10.5px; fill:#5B6675; text-anchor:middle; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#0D1B2A; font-weight:600; }
      .arrow { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1A4F8B"/></marker>
</defs>
<rect width="1000" height="440" class="paper"/>
<text x="40" y="42" class="kicker">DEEL 7 · CONCEPTDIAGRAM</text>
<text x="40" y="72" class="title">De levenscyclus van een kwetsbaarheid</text>

<line x1="70" y1="220" x2="620" y2="220" class="axis"/>

<circle cx="110" cy="220" r="8" class="dot"/>
<text x="110" y="185" class="e-label">Ontdekking</text>
<text x="110" y="202" class="e-sub">door leverancier</text>
<text x="110" y="250" class="e-sub">of onderzoeker</text>

<circle cx="360" cy="220" r="8" class="dot"/>
<text x="360" y="185" class="e-label">Patch beschikbaar</text>
<text x="360" y="202" class="e-sub">vanaf nu weet iedereen —</text>
<text x="360" y="250" class="e-sub">ook aanvallers — welk gat het is</text>

<path d="M470,240 Q500,290 400,320" class="arrow"/>
<path d="M470,240 Q520,280 700,300" class="arrow"/>

<rect x="180" y="330" width="280" height="90" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="320" y="358" text-anchor="middle" class="e-label">Toegepast</text>
<text x="320" y="378" text-anchor="middle" class="e-sub">gat gedicht binnen</text>
<text x="320" y="394" text-anchor="middle" class="e-sub">geplande onderhoudscyclus</text>

<rect x="620" y="270" width="300" height="120" rx="8" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>
<text x="770" y="300" text-anchor="middle" class="e-label" fill="#8A5A0E">Niet toegepast</text>
<text x="770" y="320" text-anchor="middle" class="e-sub">publiek bekende zwakte —</text>
<text x="770" y="336" text-anchor="middle" class="e-sub">geautomatiseerd en op grote</text>
<text x="770" y="352" text-anchor="middle" class="e-sub">schaal doorzocht</text>
<text x="770" y="372" text-anchor="middle" class="e-sub" font-weight="700">Ruuds "zou ik moeten uitzoeken"</text>

<text x="490" y="80" class="e-sub" text-anchor="middle">Spanning: direct patchen minimaliseert risico, maar kan zelf storing veroorzaken —</text>
<text x="490" y="98" class="e-sub" text-anchor="middle">daarom risicogebaseerd: kritiek en actief misbruikt gaat met spoed, de rest wordt eerst getest</text>
</svg>
