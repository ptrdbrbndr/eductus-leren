<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="'DM Sans', Arial, sans-serif" width="960" height="500" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:11.5px; fill:#5B6675; }
      .sub-light { font-size:11.5px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .big { font-size:38px; font-weight:700; fill:#1A4F8B; }
    </style>
</defs>
<rect width="960" height="500" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 7 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">De 3-2-1-back-upregel — en waar een plat netwerk hem ondermijnt</text>

<rect x="40" y="120" width="270" height="180" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="175" y="165" text-anchor="middle" class="big">3</text>
<text x="175" y="195" text-anchor="middle" class="label" font-size="12">kopieën totaal</text>
<text x="175" y="218" text-anchor="middle" class="sub">productie + minstens</text>
<text x="175" y="234" text-anchor="middle" class="sub">twee back-ups</text>

<rect x="345" y="120" width="270" height="180" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="480" y="165" text-anchor="middle" class="big">2</text>
<text x="480" y="195" text-anchor="middle" class="label" font-size="12">soorten media</text>
<text x="480" y="218" text-anchor="middle" class="sub">voorkomt dat één storing</text>
<text x="480" y="234" text-anchor="middle" class="sub">alle kopieën raakt</text>

<rect x="650" y="120" width="270" height="180" rx="8" fill="#1A4F8B"/>
<text x="785" y="165" text-anchor="middle" class="big" fill="#F5F4F0">1</text>
<text x="785" y="195" text-anchor="middle" class="label-light" font-size="12">kopie offsite</text>
<text x="785" y="218" text-anchor="middle" class="sub-light">brand, overstroming,</text>
<text x="785" y="234" text-anchor="middle" class="sub-light">of lateraal verspreide ransomware</text>

<rect x="150" y="330" width="660" height="140" rx="8" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>
<text x="480" y="360" text-anchor="middle" class="label" fill="#8A5A0E">De kwetsbaarheid van een niet-gesegmenteerd netwerk</text>
<text x="480" y="385" text-anchor="middle" class="sub">Staat de back-up in hetzelfde, ongesegmenteerde netwerk als productie,</text>
<text x="480" y="403" text-anchor="middle" class="sub">dan kan ransomware die zich lateraal verspreidt (deel 2, deel 7 §1)</text>
<text x="480" y="421" text-anchor="middle" class="sub">ook de back-up zelf versleutelen — precies wat de offsite-eis voorkomt</text>
<text x="480" y="445" text-anchor="middle" class="sub" font-weight="700">én: een back-up beschermt beschikbaarheid/integriteit, niet vertrouwelijkheid</text>
</svg>
