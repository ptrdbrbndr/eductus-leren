<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="'DM Sans', Arial, sans-serif" width="960" height="500" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:13px; font-weight:700; fill:#14213D; }
      .label-light { font-size:13px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:11px; fill:#55606F; }
      .sub-light { font-size:11px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    </style>
</defs>
<rect width="960" height="500" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 7 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Netwerkzonering bij Meridiaan</text>
<text x="40" y="96" class="sub">Least privilege uit deel 5, nu toegepast op systemen in plaats van mensen.</text>

<rect x="40" y="130" width="130" height="320" rx="8" fill="#FBFAF7" stroke="#55606F" stroke-dasharray="4 3" stroke-width="1.5"/>
<text x="105" y="155" text-anchor="middle" class="label" font-size="11">INTERNET</text>

<line x1="170" y1="290" x2="220" y2="290" stroke="#2563A8" stroke-width="2"/>

<rect x="220" y="150" width="200" height="280" rx="8" fill="#CBDCEF" stroke="#2563A8" stroke-width="1.5"/>
<text x="320" y="175" text-anchor="middle" class="label">DMZ</text>
<rect x="245" y="200" width="150" height="60" rx="6" fill="#FFFFFF" stroke="#2563A8"/>
<text x="320" y="225" text-anchor="middle" class="sub" font-weight="700">Deelnemersportaal</text>
<text x="320" y="243" text-anchor="middle" class="sub">bereikbaar vanaf internet</text>
<text x="320" y="400" text-anchor="middle" class="sub" font-style="italic">gecompromitteerd ≠</text>
<text x="320" y="416" text-anchor="middle" class="sub" font-style="italic">automatisch intern binnen</text>

<line x1="420" y1="290" x2="460" y2="290" stroke="#2563A8" stroke-width="2"/>

<rect x="460" y="150" width="260" height="280" rx="8" fill="#6FA3D6" stroke="#2563A8" stroke-width="1.5"/>
<text x="590" y="175" text-anchor="middle" class="label" fill="#14213D">INTERNE SEGMENTEN</text>
<rect x="480" y="195" width="220" height="55" rx="6" fill="#FFFFFF" stroke="#2563A8"/>
<text x="590" y="216" text-anchor="middle" class="sub" font-weight="700">Mutatiesysteem</text>
<text x="590" y="234" text-anchor="middle" class="sub">eigen segment</text>
<rect x="480" y="260" width="220" height="55" rx="6" fill="#FFFFFF" stroke="#2563A8"/>
<text x="590" y="281" text-anchor="middle" class="sub" font-weight="700">Kantoorautomatisering</text>
<text x="590" y="299" text-anchor="middle" class="sub">e-mail, bestandsdeling</text>
<rect x="480" y="325" width="220" height="70" rx="6" fill="#14213D"/>
<text x="590" y="348" text-anchor="middle" class="sub-light" font-weight="700">Gevoeligste gegevens</text>
<text x="590" y="366" text-anchor="middle" class="sub-light">extra beveiligd segment</text>
<text x="590" y="382" text-anchor="middle" class="sub-light" font-size="9">"weet ik niet zeker" — Ruud</text>

<line x1="720" y1="290" x2="760" y2="290" stroke="#2563A8" stroke-width="2"/>

<rect x="760" y="150" width="160" height="280" rx="8" fill="#E9A13B" stroke="#9A5F0D" stroke-width="2.5"/>
<text x="840" y="178" text-anchor="middle" class="label" fill="#14213D" font-size="12">BEHEER-</text>
<text x="840" y="194" text-anchor="middle" class="label" fill="#14213D" font-size="12">SEGMENT</text>
<text x="840" y="230" text-anchor="middle" class="sub" fill="#14213D">wie hier controle</text>
<text x="840" y="246" text-anchor="middle" class="sub" fill="#14213D">over krijgt, krijgt</text>
<text x="840" y="262" text-anchor="middle" class="sub" fill="#14213D">potentieel controle</text>
<text x="840" y="278" text-anchor="middle" class="sub" fill="#14213D">over de rest</text>
<text x="840" y="380" text-anchor="middle" class="sub" fill="#14213D" font-weight="700" font-size="10">gevoeligste segment</text>
<text x="840" y="396" text-anchor="middle" class="sub" fill="#14213D" font-weight="700" font-size="10">van allemaal</text>

<text x="480" y="470" text-anchor="middle" class="sub" fill="#9A5F0D">"Weet ik niet zeker of dit systeem rechtstreeks met internet kan praten" — Ruuds whiteboard</text>
</svg>
