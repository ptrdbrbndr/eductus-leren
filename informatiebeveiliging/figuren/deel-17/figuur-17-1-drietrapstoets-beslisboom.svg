<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="'DM Sans', Arial, sans-serif" width="960" height="680" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:13.5px; font-weight:700; fill:#14213D; }
      .label-light { font-size:13.5px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-r { stroke:#B23B3B; stroke-width:2; fill:none; marker-end:url(#arrr); }
      .tag { font-size:11px; font-weight:700; fill:#55606F; }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arrr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#B23B3B"/></marker>
</defs>
<rect width="960" height="680" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 17 · BESLISBOOM</text>
<text x="40" y="64" class="title">De drietrapstoets, met de risicosignalering als voorbeeld</text>
<text x="40" y="96" class="sub">Elke trap moet afzonderlijk slagen — een sterk doel compenseert geen falende noodzaak.</text>

<rect x="360" y="120" width="240" height="60" rx="8" fill="#2563A8"/>
<text x="480" y="146" text-anchor="middle" class="label-light">Grondslag "overeenkomst"</text>
<text x="480" y="164" text-anchor="middle" class="sub-light">dekt dit niet (deel 17-1)</text>
<line x1="480" y1="180" x2="480" y2="206" class="arrow"/>

<rect x="330" y="208" width="300" height="90" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="480" y="232" text-anchor="middle" class="label">TRAP 1 — Doeltoets</text>
<text x="350" y="254" class="sub">legitiem, concreet belang?</text>
<text x="350" y="272" class="sub">→ ja: proactiever verzuimbeleid</text>
<text x="350" y="288" class="tag">is op zichzelf legitiem</text>

<line x1="480" y1="298" x2="480" y2="324" class="arrow"/>
<rect x="330" y="326" width="300" height="110" rx="8" fill="#E9A13B"/>
<text x="480" y="350" text-anchor="middle" class="label" fill="#6B4509">TRAP 2 — Noodzaaktoets</text>
<text x="350" y="372" fill="#6B4509" font-size="12">minder ingrijpend alternatief?</text>
<text x="350" y="390" fill="#6B4509" font-size="12">→ ja: handmatige herbeoordeling</text>
<text x="350" y="406" fill="#6B4509" font-size="12">na vaste periode verzuim bestaat</text>
<text x="350" y="424" fill="#B23B3B" font-weight="700" font-size="12">FAALT HIER</text>

<line x1="480" y1="436" x2="480" y2="462" class="arrow-r"/>
<rect x="330" y="464" width="300" height="90" rx="8" fill="#F4F2EC" stroke="#55606F" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="480" y="488" text-anchor="middle" class="label" font-size="13">TRAP 3 — Balanstoets</text>
<text x="350" y="510" class="sub">weegt belang zwaarder dan</text>
<text x="350" y="526" class="sub">risico's van de betrokkene?</text>
<text x="350" y="542" class="sub" font-style="italic">niet meer bereikt — trap 2 faalde al</text>

<rect x="700" y="326" width="200" height="228" rx="8" fill="#FFFFFF" stroke="#B23B3B" stroke-width="2"/>
<text x="800" y="352" text-anchor="middle" class="label" fill="#B23B3B">GRONDSLAG NIET</text>
<text x="800" y="370" text-anchor="middle" class="label" fill="#B23B3B">HOUDBAAR</text>
<text x="720" y="398" class="sub">Eén trap laten zakken</text>
<text x="720" y="414" class="sub">is genoeg — trap 1 en</text>
<text x="720" y="430" class="sub">3 winnen dit niet terug</text>
<text x="720" y="460" class="sub" font-weight="700">Karin accepteert</text>
<text x="720" y="476" class="sub">de uitkomst als</text>
<text x="720" y="492" class="sub">risico-eigenaar —</text>
<text x="720" y="508" class="sub">het formele "nee,</text>
<text x="720" y="524" class="sub">dit niet"</text>
<line x1="630" y1="380" x2="692" y2="400" class="arrow-r"/>

<rect x="140" y="600" width="680" height="60" rx="8" fill="#FFFFFF" stroke="#55606F" stroke-width="1.5"/>
<text x="480" y="626" text-anchor="middle" class="sub" font-weight="700">Ter vergelijking: bijzondere persoonsgegevens en BSN zijn optelbare,</text>
<text x="480" y="644" text-anchor="middle" class="sub">aanvullende regimes bovenop deze toets — zie figuur 17-2</text>
</svg>
