<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'DM Sans', Arial, sans-serif" width="960" height="560" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .sub-light { font-size:12px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .plus { font-size:26px; font-weight:700; fill:#8A5A0E; }
      .arrow { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1A4F8B"/></marker>
</defs>
<rect width="960" height="560" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 17 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Twee aparte, optelbare regimes bovenop de grondslagtoets</text>
<text x="40" y="96" class="sub">Beide moeten slagen — een geslaagde gerechtvaardigd-belang-toets neemt de andere horde niet automatisch.</text>

<rect x="60" y="140" width="260" height="140" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="190" y="170" text-anchor="middle" class="label">Basis: grondslagtoets</text>
<text x="80" y="196" class="sub">zes grondslagen (deel 3),</text>
<text x="80" y="212" class="sub">of drietrapstoets bij</text>
<text x="80" y="228" class="sub">gerechtvaardigd belang</text>
<text x="80" y="254" class="sub" font-style="italic">(deel 17, fig. 17-1)</text>

<text x="345" y="220" text-anchor="middle" class="plus">+</text>

<rect x="370" y="140" width="260" height="140" rx="8" fill="#E8A020"/>
<text x="500" y="170" text-anchor="middle" class="label" fill="#5A3A08">Bijzondere categorieën</text>
<text x="390" y="196" fill="#5A3A08" font-size="12">verbod, tenzij specifieke</text>
<text x="390" y="212" fill="#5A3A08" font-size="12">uitzondering — gezondheids-</text>
<text x="390" y="228" fill="#5A3A08" font-size="12">gegevens (deel 3)</text>
<text x="390" y="254" fill="#5A3A08" font-size="11" font-style="italic">geldt bovenop, niet in plaats van</text>

<text x="655" y="220" text-anchor="middle" class="plus">+</text>

<rect x="680" y="140" width="220" height="140" rx="8" fill="#1A4F8B"/>
<text x="790" y="170" text-anchor="middle" class="label-light">BSN</text>
<text x="700" y="196" fill="#E4E1D8" font-size="12">eigen, strenger NL-regime —</text>
<text x="700" y="212" fill="#E4E1D8" font-size="12">alleen waar de wet dit</text>
<text x="700" y="228" fill="#E4E1D8" font-size="12">specifiek voorschrijft</text>
<text x="700" y="254" fill="#E4E1D8" font-size="11" font-style="italic">doelbinding blijft onverkort gelden</text>

<line x1="480" y1="290" x2="480" y2="330" class="arrow"/>

<rect x="180" y="332" width="600" height="120" rx="8" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>
<text x="480" y="360" text-anchor="middle" class="label" fill="#8A5A0E">Alle van toepassing zijnde regimes moeten slagen</text>
<text x="480" y="384" text-anchor="middle" class="sub">Voor de risicosignalering: zelfs áls de drietrapstoets zou slagen, moet nog steeds worden</text>
<text x="480" y="402" text-anchor="middle" class="sub">vastgesteld welke uitzondering op het verwerkingsverbod voor bijzondere categorieën van</text>
<text x="480" y="420" text-anchor="middle" class="sub">toepassing is — een aparte, aanvullende horde</text>

<text x="480" y="500" text-anchor="middle" class="sub">renseignering aan de Belastingdienst rechtvaardigt geen BSN-gebruik voor een ander doel binnen Meridiaan</text>
</svg>
