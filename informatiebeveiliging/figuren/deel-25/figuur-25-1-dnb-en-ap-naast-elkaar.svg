<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 630" font-family="'DM Sans', Arial, sans-serif" width="960" height="630" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:13px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .rowlabel { font-size:12px; font-weight:700; fill:#0D1B2A; letter-spacing:.04em; }
    </style>
</defs>
<rect width="960" height="630" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 25 · MATRIX</text>
<text x="40" y="64" class="title">DNB en AP naast elkaar — over hetzelfde invaarproces</text>
<text x="40" y="96" class="sub">Twee toezichthouders, twee talen — wie zich voorbereidt alsof het één gesprek is, komt bedrogen uit.</text>

<rect x="60" y="140" width="140" height="50" rx="6" fill="#F5F4F0"/>
<rect x="210" y="140" width="335" height="50" rx="6" fill="#1A4F8B"/>
<text x="377" y="171" text-anchor="middle" class="label-light">DNB</text>
<rect x="555" y="140" width="345" height="50" rx="6" fill="#1A4F8B"/>
<text x="727" y="164" text-anchor="middle" class="label-light" font-size="13">AUTORITEIT PERSOONS-</text>
<text x="727" y="180" text-anchor="middle" class="label-light" font-size="13">GEGEVENS (AP)</text>

<!-- rij mandaat -->
<text x="60" y="222" class="rowlabel">MANDAAT</text>
<rect x="210" y="200" width="335" height="90" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="228" y="228" class="sub">prudentieel toezicht:</text>
<text x="228" y="246" class="sub">financiële gezondheid en</text>
<text x="228" y="264" class="sub">operationele beheersing</text>
<rect x="555" y="200" width="345" height="90" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="573" y="228" class="sub">toezicht op naleving AVG:</text>
<text x="573" y="246" class="sub">rechtmatige verwerking,</text>
<text x="573" y="264" class="sub">rechten van betrokkenen</text>

<!-- rij taal -->
<text x="60" y="317" class="rowlabel">TAAL</text>
<rect x="210" y="295" width="335" height="90" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="228" y="335" class="sub" font-weight="700" fill="#1A4F8B">risicobeheersing</text>
<text x="228" y="353" class="sub" font-weight="700" fill="#1A4F8B">en continuïteit</text>
<rect x="555" y="295" width="345" height="90" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="573" y="335" class="sub" font-weight="700" fill="#1A4F8B">rechtmatigheid en</text>
<text x="573" y="353" class="sub" font-weight="700" fill="#1A4F8B">individuele rechten</text>

<!-- rij instrumenten -->
<text x="60" y="412" class="rowlabel">INSTRUMENTEN</text>
<rect x="210" y="390" width="335" height="90" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="228" y="418" class="sub">kaders, processen,</text>
<text x="228" y="436" class="sub">three lines of defence</text>
<text x="228" y="454" class="sub">(deel 23), aantoonbare beheersing</text>
<rect x="555" y="390" width="345" height="90" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="573" y="418" class="sub">grondslagen (deel 3, 17),</text>
<text x="573" y="436" class="sub">DPIA's (deel 16, 17),</text>
<text x="573" y="454" class="sub">positie van de FG (deel 4, 23)</text>

<!-- rij vraag -->
<text x="60" y="537" class="rowlabel">VRAAG OVER</text>
<text x="60" y="553" class="rowlabel">HET INVAREN</text>
<rect x="210" y="485" width="335" height="105" rx="6" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>
<text x="228" y="515" class="sub" font-style="italic">"is het risico van datafouten</text>
<text x="228" y="533" class="sub" font-style="italic">bij het invaren beheerst,</text>
<text x="228" y="551" class="sub" font-style="italic">en kunt u dat aantonen?"</text>
<rect x="555" y="485" width="345" height="105" rx="6" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>
<text x="573" y="515" class="sub" font-style="italic">"was de verwerking van déze</text>
<text x="573" y="533" class="sub" font-style="italic">deelnemer rechtmatig, en zijn</text>
<text x="573" y="551" class="sub" font-style="italic">zijn rechten gerespecteerd?"</text>

<text x="480" y="615" text-anchor="middle" class="sub" fill="#8A5A0E">hetzelfde onderliggende proces, twee vragen die elk een ander soort antwoord vereisen</text>
</svg>
