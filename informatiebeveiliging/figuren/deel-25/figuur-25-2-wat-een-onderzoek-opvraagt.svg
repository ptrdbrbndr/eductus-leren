<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="'DM Sans', Arial, sans-serif" width="960" height="600" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:13px; font-weight:700; fill:#14213D; }
      .sub { font-size:11px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .badge { font-size:12px; font-weight:700; fill:#9A5F0D; }
    </style>
</defs>
<rect width="960" height="600" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 25 · INSTRUMENT</text>
<text x="40" y="64" class="title">Wat een onderzoek feitelijk opvraagt</text>
<text x="40" y="96" class="sub">Zelden nieuwe informatie — vrijwel altijd toegang tot wat er al zou moeten bestaan.</text>

<!-- rij 1 -->
<rect x="60" y="130" width="34" height="44" rx="3" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<line x1="66" y1="142" x2="88" y2="142" stroke="#2563A8" stroke-width="1.2"/>
<line x1="66" y1="150" x2="88" y2="150" stroke="#2563A8" stroke-width="1.2"/>
<line x1="66" y1="158" x2="80" y2="158" stroke="#2563A8" stroke-width="1.2"/>
<text x="112" y="148" class="label">Verwerkingsregister</text>
<text x="112" y="166" class="sub">alle verwerkingen van persoonsgegevens, compleet en actueel</text>
<rect x="750" y="136" width="150" height="32" rx="16" fill="#FBFAF7" stroke="#E9A13B" stroke-width="2"/>
<text x="825" y="157" text-anchor="middle" class="badge">deel 8</text>

<!-- rij 2 -->
<rect x="60" y="198" width="34" height="44" rx="3" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<line x1="66" y1="210" x2="88" y2="210" stroke="#2563A8" stroke-width="1.2"/>
<line x1="66" y1="218" x2="88" y2="218" stroke="#2563A8" stroke-width="1.2"/>
<line x1="66" y1="226" x2="80" y2="226" stroke="#2563A8" stroke-width="1.2"/>
<text x="112" y="216" class="label">Risicobeoordeling</text>
<text x="112" y="234" class="sub">periodiek herzien, niet een momentopname</text>
<rect x="750" y="204" width="150" height="32" rx="16" fill="#FBFAF7" stroke="#E9A13B" stroke-width="2"/>
<text x="825" y="225" text-anchor="middle" class="badge">deel 12</text>

<!-- rij 3 -->
<rect x="60" y="266" width="34" height="44" rx="3" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<line x1="66" y1="278" x2="88" y2="278" stroke="#2563A8" stroke-width="1.2"/>
<line x1="66" y1="286" x2="88" y2="286" stroke="#2563A8" stroke-width="1.2"/>
<line x1="66" y1="294" x2="80" y2="294" stroke="#2563A8" stroke-width="1.2"/>
<text x="112" y="284" class="label">Verklaring van Toepasselijkheid</text>
<text x="112" y="302" class="sub">welke ISO 27001-controls, en waarom (niet) van toepassing</text>
<rect x="750" y="272" width="150" height="32" rx="16" fill="#FBFAF7" stroke="#E9A13B" stroke-width="2"/>
<text x="825" y="293" text-anchor="middle" class="badge">deel 11</text>

<!-- rij 4 -->
<rect x="60" y="334" width="34" height="44" rx="3" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<line x1="66" y1="346" x2="88" y2="346" stroke="#2563A8" stroke-width="1.2"/>
<line x1="66" y1="354" x2="88" y2="354" stroke="#2563A8" stroke-width="1.2"/>
<line x1="66" y1="362" x2="80" y2="362" stroke="#2563A8" stroke-width="1.2"/>
<text x="112" y="352" class="label">DPIA's</text>
<text x="112" y="370" class="sub">drietrapstoets aantoonbaar doorlopen, niet alleen geclaimd</text>
<rect x="750" y="340" width="150" height="32" rx="16" fill="#FBFAF7" stroke="#E9A13B" stroke-width="2"/>
<text x="825" y="361" text-anchor="middle" class="badge">deel 16, 17</text>

<!-- rij 5 -->
<rect x="60" y="402" width="34" height="44" rx="3" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<line x1="66" y1="414" x2="88" y2="414" stroke="#2563A8" stroke-width="1.2"/>
<line x1="66" y1="422" x2="88" y2="422" stroke="#2563A8" stroke-width="1.2"/>
<line x1="66" y1="430" x2="80" y2="430" stroke="#2563A8" stroke-width="1.2"/>
<text x="112" y="420" class="label">Incidentenregister</text>
<text x="112" y="438" class="sub">inclusief triage, classificatie en meldingsafhandeling</text>
<rect x="750" y="408" width="150" height="32" rx="16" fill="#FBFAF7" stroke="#E9A13B" stroke-width="2"/>
<text x="825" y="429" text-anchor="middle" class="badge">deel 9, 19</text>

<!-- rij 6 -->
<rect x="60" y="470" width="34" height="44" rx="3" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<line x1="66" y1="482" x2="88" y2="482" stroke="#2563A8" stroke-width="1.2"/>
<line x1="66" y1="490" x2="88" y2="490" stroke="#2563A8" stroke-width="1.2"/>
<line x1="66" y1="498" x2="80" y2="498" stroke="#2563A8" stroke-width="1.2"/>
<text x="112" y="488" class="label">DORA-informatieregister</text>
<text x="112" y="506" class="sub">ICT-derde partijen inclusief concentratierisico</text>
<rect x="750" y="476" width="150" height="32" rx="16" fill="#FBFAF7" stroke="#E9A13B" stroke-width="2"/>
<text x="825" y="497" text-anchor="middle" class="badge">deel 24</text>

<text x="480" y="565" text-anchor="middle" class="sub" fill="#9A5F0D">wie deze zes al klaar heeft liggen, ervaart een onderzoek als grondig maar behapbaar — niet als crisis</text>
</svg>
