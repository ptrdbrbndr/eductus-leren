<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="'DM Sans', Arial, sans-serif" width="960" height="540" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .sub { font-size:12px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .num { font-size:15px; font-weight:700; fill:#F5F4F0; }
    </style>
</defs>
<rect width="960" height="540" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 25 · INSTRUMENT</text>
<text x="40" y="64" class="title">Vier kenmerken van een dossier dat overtuigt</text>
<text x="40" y="96" class="sub">Voorbereid op het DNB-onderzoek naar het invaarproces — maar bruikbaar voor elk toezichtsdossier.</text>

<rect x="70" y="130" width="405" height="165" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<circle cx="102" cy="162" r="16" fill="#1A4F8B"/><text x="102" y="167" text-anchor="middle" class="num">1</text>
<text x="128" y="167" class="label" font-size="13">Heldere, navolgbare structuur</text>
<text x="94" y="196" class="sub">niet een stapel losse documenten,</text>
<text x="94" y="214" class="sub">maar een lijn van context naar</text>
<text x="94" y="232" class="sub">risicobeoordeling naar maatregelen</text>
<text x="94" y="250" class="sub">naar bewijs van werking</text>

<rect x="485" y="130" width="405" height="165" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<circle cx="517" cy="162" r="16" fill="#1A4F8B"/><text x="517" y="167" text-anchor="middle" class="num">2</text>
<text x="543" y="167" class="label" font-size="13">Concrete meetwaarden, geen claims</text>
<text x="509" y="196" class="sub">niet "we hebben datakwaliteit</text>
<text x="509" y="214" class="sub">geborgd", maar de daadwerkelijke</text>
<text x="509" y="232" class="sub">foutpercentages en trends</text>
<text x="509" y="250" class="sub">over tijd</text>

<rect x="70" y="315" width="405" height="165" rx="8" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>
<circle cx="102" cy="347" r="16" fill="#E8A020"/><text x="102" y="352" text-anchor="middle" class="num" fill="#0D1B2A">3</text>
<text x="128" y="352" class="label" font-size="13">Zichtbare, onderbouwde afwegingen</text>
<text x="94" y="381" class="sub">inclusief plekken waar bewust iets</text>
<text x="94" y="399" class="sub">níet is gedaan, of een risico is</text>
<text x="94" y="417" class="sub">geaccepteerd — het "onderbouwde</text>
<text x="94" y="435" class="sub">nee" als kwaliteitskenmerk</text>

<rect x="485" y="315" width="405" height="165" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<circle cx="517" cy="347" r="16" fill="#1A4F8B"/><text x="517" y="352" text-anchor="middle" class="num">4</text>
<text x="543" y="352" class="label" font-size="13">Bewijs van herhaling</text>
<text x="509" y="381" class="sub">een eenmalige, nooit herziene</text>
<text x="509" y="399" class="sub">risicobeoordeling overtuigt minder</text>
<text x="509" y="417" class="sub">dan een zichtbaar periodiek</text>
<text x="509" y="435" class="sub">bijgewerkte (deel 12, 20)</text>

<text x="480" y="515" text-anchor="middle" class="sub" fill="#8A5A0E">een zelfevaluatie zonder nuance wekt bij een ervaren toezichthouder eerder wantrouwen dan geruststelling</text>
</svg>
