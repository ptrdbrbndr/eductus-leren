<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620">
<defs>
<marker id="arrJ" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#14213D"/>
</marker>
</defs>
<rect width="1400" height="620" fill="#FBFAF7"/>
<text x="700" y="48" font-family="Cormorant Garamond" font-size="26" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">De nulmeting in vijf opleveringen</tspan></text>
<text x="700" y="76" font-family="DM Sans" font-size="13" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">Van kwaliteitsanalyse tot verdediging — elk bouwend op een eerder deel van niveau 1</tspan></text>

<!-- baseline -->
<line x1="90" y1="300" x2="1310" y2="300" stroke="#DFDCD3" stroke-width="2"/>

<!-- 5 nodes -->
<!-- Node 1 -->
<circle cx="170" cy="300" r="16" fill="#14213D"/>
<text x="170" y="305" font-family="DM Sans" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="60" y="150" width="220" height="120" rx="8" fill="#F4F6F9" stroke="#14213D" stroke-width="1.5"/>
<text x="170" y="180" font-family="DM Sans" font-size="14" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="170" dy="0">Kwaliteitsanalyse</tspan></text>
<text x="170" y="202" font-family="DM Sans" font-size="10.5" fill="#55606F" text-anchor="middle"><tspan x="170" dy="0">Profilering plus drie</tspan></text>
<text x="170" y="217" font-family="DM Sans" font-size="10.5" fill="#55606F" text-anchor="middle"><tspan x="170" dy="0">onderbouwde bevindingen</tspan></text>
<line x1="90" y1="235" x2="250" y2="235" stroke="#DFDCD3" stroke-width="1"/>
<text x="170" y="255" font-family="DM Sans" font-size="10.5" fill="#2563A8" text-anchor="middle"><tspan x="170" dy="0">bouwt op deel 4</tspan></text>
<text x="170" y="270" font-family="DM Sans" font-size="10.5" fill="#2563A8" text-anchor="middle"><tspan x="170" dy="0">(keten uit deel 3)</tspan></text>
<line x1="170" y1="316" x2="170" y2="340" stroke="#DFDCD3" stroke-width="1.5"/>

<!-- Node 2 -->
<circle cx="410" cy="300" r="16" fill="#14213D"/>
<text x="410" y="305" font-family="DM Sans" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<rect x="300" y="345" width="220" height="120" rx="8" fill="#F4F6F9" stroke="#14213D" stroke-width="1.5"/>
<text x="410" y="375" font-family="DM Sans" font-size="14" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="410" dy="0">Dashboard</tspan></text>
<text x="410" y="397" font-family="DM Sans" font-size="10.5" fill="#55606F" text-anchor="middle"><tspan x="410" dy="0">Eén scherm met</tspan></text>
<text x="410" y="412" font-family="DM Sans" font-size="10.5" fill="#55606F" text-anchor="middle"><tspan x="410" dy="0">drie KPI's</tspan></text>
<line x1="330" y1="425" x2="490" y2="425" stroke="#DFDCD3" stroke-width="1"/>
<text x="410" y="445" font-family="DM Sans" font-size="10.5" fill="#2563A8" text-anchor="middle"><tspan x="410" dy="0">bouwt op deel 5 en 6</tspan></text>
<line x1="410" y1="284" x2="410" y2="345" stroke="#DFDCD3" stroke-width="1.5"/>

<!-- Node 3 -->
<circle cx="650" cy="300" r="16" fill="#14213D"/>
<text x="650" y="305" font-family="DM Sans" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<rect x="540" y="150" width="220" height="120" rx="8" fill="#F4F6F9" stroke="#14213D" stroke-width="1.5"/>
<text x="650" y="180" font-family="DM Sans" font-size="14" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="650" dy="0">AVG-toets</tspan></text>
<text x="650" y="202" font-family="DM Sans" font-size="10.5" fill="#55606F" text-anchor="middle"><tspan x="650" dy="0">Grondslag, beginselen,</tspan></text>
<text x="650" y="217" font-family="DM Sans" font-size="10.5" fill="#55606F" text-anchor="middle"><tspan x="650" dy="0">ethiek — één A4</tspan></text>
<line x1="570" y1="235" x2="730" y2="235" stroke="#DFDCD3" stroke-width="1"/>
<text x="650" y="255" font-family="DM Sans" font-size="10.5" fill="#2563A8" text-anchor="middle"><tspan x="650" dy="0">bouwt op deel 7</tspan></text>
<line x1="650" y1="316" x2="650" y2="340" stroke="#DFDCD3" stroke-width="1.5"/>

<!-- Node 4 -->
<circle cx="890" cy="300" r="16" fill="#14213D"/>
<text x="890" y="305" font-family="DM Sans" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<rect x="780" y="345" width="220" height="120" rx="8" fill="#F4F6F9" stroke="#14213D" stroke-width="1.5"/>
<text x="890" y="375" font-family="DM Sans" font-size="14" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="890" dy="0">Verantwoording</tspan></text>
<text x="890" y="397" font-family="DM Sans" font-size="10.5" fill="#55606F" text-anchor="middle"><tspan x="890" dy="0">Bron, filters, aannames,</tspan></text>
<text x="890" y="412" font-family="DM Sans" font-size="10.5" fill="#55606F" text-anchor="middle"><tspan x="890" dy="0">wat het niet aantoont</tspan></text>
<line x1="810" y1="425" x2="970" y2="425" stroke="#DFDCD3" stroke-width="1"/>
<text x="890" y="445" font-family="DM Sans" font-size="10.5" fill="#2563A8" text-anchor="middle"><tspan x="890" dy="0">bouwt op deel 5, hfst. 11</tspan></text>
<line x1="890" y1="284" x2="890" y2="345" stroke="#DFDCD3" stroke-width="1.5"/>

<!-- Node 5 -->
<circle cx="1130" cy="300" r="18" fill="#E9A13B"/>
<text x="1130" y="306" font-family="DM Sans" font-size="14" font-weight="bold" fill="#14213D" text-anchor="middle">5</text>
<rect x="1020" y="150" width="220" height="120" rx="8" fill="#FBF4E6" stroke="#E9A13B" stroke-width="2.5"/>
<text x="1130" y="180" font-family="DM Sans" font-size="14" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="1130" dy="0">Verdediging</tspan></text>
<text x="1130" y="202" font-family="DM Sans" font-size="10.5" fill="#55606F" text-anchor="middle"><tspan x="1130" dy="0">Tien minuten plus</tspan></text>
<text x="1130" y="217" font-family="DM Sans" font-size="10.5" fill="#55606F" text-anchor="middle"><tspan x="1130" dy="0">tien minuten vragen</tspan></text>
<line x1="1050" y1="235" x2="1210" y2="235" stroke="#E9A13B" stroke-width="1"/>
<text x="1130" y="255" font-family="DM Sans" font-size="10.5" fill="#14213D" text-anchor="middle"><tspan x="1130" dy="0">bouwt op deel 6, hfst. 9</tspan></text>
<line x1="1130" y1="318" x2="1130" y2="340" stroke="#DFDCD3" stroke-width="1.5"/>

<!-- arrows along baseline -->
<line x1="186" y1="300" x2="394" y2="300" stroke="#14213D" stroke-width="2" marker-end="url(#arrJ)"/>
<line x1="426" y1="300" x2="634" y2="300" stroke="#14213D" stroke-width="2" marker-end="url(#arrJ)"/>
<line x1="666" y1="300" x2="874" y2="300" stroke="#14213D" stroke-width="2" marker-end="url(#arrJ)"/>
<line x1="906" y1="300" x2="1112" y2="300" stroke="#14213D" stroke-width="2" marker-end="url(#arrJ)"/>

<!-- bottom note -->
<rect x="60" y="510" width="1280" height="80" rx="6" fill="#F4F6F9" stroke="#DFDCD3" stroke-width="1"/>
<text x="700" y="540" font-family="DM Sans" font-size="12.5" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">Kiezen — drie bevindingen in plaats van twaalf — en verantwoorden wat je níét hebt onderzocht is zelf een</tspan></text>
<text x="700" y="562" font-family="DM Sans" font-size="12.5" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">beoordeeld onderdeel. Eerlijke onzekerheid ("dat weet ik niet, en zo zou ik het uitzoeken") scoort hoger dan een aanname.</tspan></text>
</svg>
