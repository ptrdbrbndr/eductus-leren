</defs>
<rect width="1400" height="720" fill="#FBFAF7"/>
<text x="700" y="46" font-family="Cormorant Garamond" font-size="25" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">De medallion-architectuur van het lakehouse — toegang en de fout per laag</tspan></text>

<!-- Panel 1: Ruw -->
<rect x="100" y="110" width="350" height="500" rx="8" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2"/>
