<text x="124" y="196" font-family="DM Sans" font-size="11" font-weight="bold" fill="#55606F" letter-spacing="0.5"><tspan x="124" dy="0">INHOUD</tspan></text>
<text x="124" y="218" font-family="DM Sans" font-size="13" fill="#14213D"><tspan x="124" dy="0">Onbewerkte brondata,</tspan><tspan x="124" dy="18">exact zoals aangeleverd</tspan></text>

<line x1="124" y1="252" x2="426" y2="252" stroke="#DFDCD3" stroke-width="1"/>

<text x="124" y="276" font-family="DM Sans" font-size="11" font-weight="bold" fill="#55606F" letter-spacing="0.5"><tspan x="124" dy="0">WIE MAG ERBIJ</tspan></text>
<text x="124" y="298" font-family="DM Sans" font-size="13" fill="#14213D"><tspan x="124" dy="0">Alleen het platformteam</tspan></text>

<line x1="124" y1="330" x2="426" y2="330" stroke="#DFDCD3" stroke-width="1"/>

<rect x="118" y="356" width="314" height="120" rx="6" fill="#FBF4E6" stroke="#E9A13B" stroke-width="1.5"/>
<path d="M 138 378 L 152 402 L 124 402 Z" fill="#E9A13B"/>
<text x="138" y="398" font-family="DM Sans" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="138" dy="0">!</tspan></text>
<text x="164" y="382" font-family="DM Sans" font-size="10.5" font-weight="bold" fill="#E9A13B" letter-spacing="0.5"><tspan x="164" dy="0">VEELGEMAAKTE FOUT</tspan></text>
<text x="138" y="424" font-family="DM Sans" font-size="12.5" fill="#14213D"><tspan x="138" dy="0">Analisten toegang geven</tspan><tspan x="138" dy="17">"voor de snelheid"</tspan></text>

<text x="124" y="588" font-family="DM Sans" font-size="12" fill="#55606F" font-style="italic"><tspan x="124" dy="0">Zonder discipline: een lake</tspan><tspan x="124" dy="16">met extra stappen</tspan></text>

<!-- Arrow 1 -> 2 -->
<line x1="452" y1="360" x2="524" y2="360" stroke="#14213D" stroke-width="2.5" marker-end="url(#arrow232)"/>
<text x="488" y="345" font-family="DM Sans" font-size="10.5" fill="#55606F" text-anchor="middle"><tspan x="488" dy="0">valideren</tspan><tspan x="488" dy="12">+ ontdubbelen</tspan></text>

<!-- Panel 2: Geschoond -->
<rect x="525" y="110" width="350" height="500" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="2"/>
