<text x="549" y="196" font-family="DM Sans" font-size="11" font-weight="bold" fill="#55606F" letter-spacing="0.5"><tspan x="549" dy="0">INHOUD</tspan></text>
<text x="549" y="218" font-family="DM Sans" font-size="13" fill="#14213D"><tspan x="549" dy="0">Gevalideerd, ontdubbeld, met</tspan><tspan x="549" dy="18">kwaliteitsregels toegepast</tspan></text>

<line x1="549" y1="252" x2="851" y2="252" stroke="#DFDCD3" stroke-width="1"/>

<text x="549" y="276" font-family="DM Sans" font-size="11" font-weight="bold" fill="#55606F" letter-spacing="0.5"><tspan x="549" dy="0">WIE MAG ERBIJ</tspan></text>
<text x="549" y="298" font-family="DM Sans" font-size="13" fill="#14213D"><tspan x="549" dy="0">Data-engineers en</tspan><tspan x="549" dy="18">gevorderde analisten</tspan></text>

<line x1="549" y1="330" x2="851" y2="330" stroke="#DFDCD3" stroke-width="1"/>

<rect x="543" y="356" width="314" height="120" rx="6" fill="#FBF4E6" stroke="#E9A13B" stroke-width="1.5"/>
<path d="M 563 378 L 577 402 L 549 402 Z" fill="#E9A13B"/>
<text x="563" y="398" font-family="DM Sans" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="563" dy="0">!</tspan></text>
<text x="589" y="382" font-family="DM Sans" font-size="10.5" font-weight="bold" fill="#E9A13B" letter-spacing="0.5"><tspan x="589" dy="0">VEELGEMAAKTE FOUT</tspan></text>
<text x="563" y="424" font-family="DM Sans" font-size="12.5" fill="#14213D"><tspan x="563" dy="0">Hier al businesslogica</tspan><tspan x="563" dy="17">toevoegen</tspan></text>

<text x="549" y="588" font-family="DM Sans" font-size="12" fill="#55606F" font-style="italic"><tspan x="549" dy="0">Elk getal moet terug te</tspan><tspan x="549" dy="16">redeneren zijn naar de bron</tspan></text>

<!-- Arrow 2 -> 3 -->
<line x1="877" y1="360" x2="949" y2="360" stroke="#14213D" stroke-width="2.5" marker-end="url(#arrow232)"/>
<text x="913" y="345" font-family="DM Sans" font-size="10.5" fill="#55606F" text-anchor="middle"><tspan x="913" dy="0">modelleren</tspan><tspan x="913" dy="12">+ definiëren</tspan></text>

<!-- Panel 3: Gebruiksklaar -->
<rect x="950" y="110" width="350" height="500" rx="8" fill="#FFFFFF" stroke="#14213D" stroke-width="2.5"/>
<rect x="950" y="110" width="350" height="56" rx="8" fill="#14213D"/>
<rect x="950" y="142" width="350" height="24" fill="#14213D"/>
<text x="1125" y="145" font-family="DM Sans" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="1125" dy="0">Gebruiksklaar</tspan></text>

<text x="974" y="196" font-family="DM Sans" font-size="11" font-weight="bold" fill="#55606F" letter-spacing="0.5"><tspan x="974" dy="0">INHOUD</tspan></text>
<text x="974" y="218" font-family="DM Sans" font-size="13" fill="#14213D"><tspan x="974" dy="0">Gemodelleerd voor gebruik,</tspan><tspan x="974" dy="18">met vastgestelde definities</tspan></text>

<line x1="974" y1="252" x2="1276" y2="252" stroke="#DFDCD3" stroke-width="1"/>

<text x="974" y="276" font-family="DM Sans" font-size="11" font-weight="bold" fill="#55606F" letter-spacing="0.5"><tspan x="974" dy="0">WIE MAG ERBIJ</tspan></text>
<text x="974" y="298" font-family="DM Sans" font-size="13" fill="#14213D"><tspan x="974" dy="0">Iedereen met een grond</tspan></text>

<line x1="974" y1="330" x2="1276" y2="330" stroke="#DFDCD3" stroke-width="1"/>

<rect x="968" y="356" width="314" height="120" rx="6" fill="#FBF4E6" stroke="#E9A13B" stroke-width="1.5"/>
<path d="M 988 378 L 1002 402 L 974 402 Z" fill="#E9A13B"/>
<text x="988" y="398" font-family="DM Sans" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="988" dy="0">!</tspan></text>
<text x="1014" y="382" font-family="DM Sans" font-size="10.5" font-weight="bold" fill="#E9A13B" letter-spacing="0.5"><tspan x="1014" dy="0">VEELGEMAAKTE FOUT</tspan></text>
<text x="988" y="424" font-family="DM Sans" font-size="12.5" fill="#14213D"><tspan x="988" dy="0">Per afnemer een eigen</tspan><tspan x="988" dy="17">variant maken</tspan></text>

<text x="974" y="588" font-family="DM Sans" font-size="12" fill="#55606F" font-style="italic"><tspan x="974" dy="0">Na twee jaar: zeven varianten</tspan><tspan x="974" dy="16">van hetzelfde begrip</tspan></text>

