</marker>
</defs>
<rect width="1400" height="720" fill="#FBFAF7"/>
<text x="700" y="46" font-family="Cormorant Garamond" font-size="25" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Data mesh bij de fusie — vier domeinen, één zelfbedieningsplatform, centrale normlaag</tspan></text>

<!-- Governance band -->
<rect x="100" y="80" width="1200" height="76" rx="8" fill="#FBF4E6" stroke="#E9A13B" stroke-width="2.5"/>
<text x="700" y="106" font-family="DM Sans" font-size="15" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">FEDERATED COMPUTATIONAL GOVERNANCE</tspan></text>
<text x="700" y="127" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">Centrale normen, automatisch afgedwongen in het platform — de gedeelde normlaag over alle domeinen</tspan></text>

<!-- 4 domain columns -->
<!-- Deelnemer -->
<rect x="112" y="238" width="270" height="192" rx="6" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1.5"/>
<rect x="112" y="238" width="270" height="42" rx="6" fill="#14213D"/>
<rect x="112" y="266" width="270" height="14" fill="#14213D"/>
