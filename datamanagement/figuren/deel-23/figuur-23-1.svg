<text x="187" y="308" font-family="DM Sans" font-size="10" font-weight="bold" fill="#2563A8" text-anchor="middle"><tspan x="187" dy="0">DATA PRODUCT</tspan></text>
<text x="132" y="336" font-family="DM Sans" font-size="11.5" fill="#55606F"><tspan x="132" dy="0">Eigen kwaliteit, documentatie</tspan><tspan x="132" dy="15">en beschikbaarheid als taak</tspan></text>
<text x="132" y="404" font-family="DM Sans" font-size="11.5" font-weight="bold" fill="#14213D"><tspan x="132" dy="0">Owner: mandaat + capaciteit</tspan></text>

