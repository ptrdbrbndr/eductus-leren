<text x="1002" y="404" font-family="DM Sans" font-size="11.5" font-weight="bold" fill="#14213D"><tspan x="1002" dy="0">Owner: mandaat + capaciteit</tspan></text>

<!-- governance dashed arrows down into each domain -->
<line x1="247" y1="156" x2="247" y2="236" stroke="#E9A13B" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow23a)"/>
<line x1="537" y1="156" x2="537" y2="236" stroke="#E9A13B" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow23a)"/>
<line x1="827" y1="156" x2="827" y2="236" stroke="#E9A13B" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow23a)"/>
<line x1="1117" y1="156" x2="1117" y2="236" stroke="#E9A13B" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow23a)"/>

<!-- domain to platform solid arrows -->
<line x1="247" y1="430" x2="247" y2="486" stroke="#2563A8" stroke-width="2.5" marker-end="url(#arrow23b)"/>
<line x1="537" y1="430" x2="537" y2="486" stroke="#2563A8" stroke-width="2.5" marker-end="url(#arrow23b)"/>
<line x1="827" y1="430" x2="827" y2="486" stroke="#2563A8" stroke-width="2.5" marker-end="url(#arrow23b)"/>
<line x1="1117" y1="430" x2="1117" y2="486" stroke="#2563A8" stroke-width="2.5" marker-end="url(#arrow23b)"/>

<!-- Self-serve platform band -->
<rect x="100" y="490" width="1200" height="76" rx="8" fill="#F4F6F9" stroke="#2563A8" stroke-width="2"/>
<text x="700" y="516" font-family="DM Sans" font-size="15" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">SELF-SERVE PLATFORM</tspan></text>
<text x="700" y="538" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">Domeinen publiceren zelfstandig, zonder centraal ticket — het platformteam bouwt gereedschap, geen opdrachten</tspan></text>

<!-- fusion note -->
<rect x="350" y="600" width="700" height="60" rx="6" fill="#FBFAF7" stroke="#DFDCD3" stroke-width="1.5"/>
<text x="700" y="624" font-family="DM Sans" font-size="12.5" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Bij de fusie: Meridiaan en Nautilus voegen hun domeinen samen tot vier</tspan></text>
<text x="700" y="644" font-family="DM Sans" font-size="12.5" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">gedeelde domeinen — elk met één owner, mandaat en capaciteit vereist</tspan></text>

<!-- Legend -->
<line x1="140" y1="694" x2="180" y2="694" stroke="#E9A13B" stroke-width="2" stroke-dasharray="5 4"/>
<text x="190" y="699" font-family="DM Sans" font-size="12" fill="#55606F"><tspan x="190" dy="0">normstelling en afdwinging (governance)</tspan></text>
<line x1="620" y1="694" x2="660" y2="694" stroke="#2563A8" stroke-width="2.5"/>
<text x="670" y="699" font-family="DM Sans" font-size="12" fill="#55606F"><tspan x="670" dy="0">levering van het data product (uitvoering)</tspan></text>
</svg>
