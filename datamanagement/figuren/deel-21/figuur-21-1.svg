<rect x="60" y="400" width="1250" height="90" rx="8" fill="#F4F6F9" stroke="#DFDCD3" stroke-width="1"/>
<text x="80" y="428" font-family="DM Sans" font-size="12.5" font-weight="bold" fill="#14213D">De drie randvoorwaarden van de opdrachtgever</text>
<text x="80" y="452" font-family="DM Sans" font-size="11" fill="#55606F">Aan DNB te tonen · de definitiediscussie beslecht · het migratieprogramma niet vertraagd.</text>
<text x="80" y="472" font-family="DM Sans" font-size="11" fill="#E9A13B" font-weight="bold">Een voorstel dat aan twee van de drie voldoet, is geen goed voorstel — het is een voorstel dat de opdrachtgever niet kan uitvoeren.</text>

<text x="700" y="520" font-family="DM Sans" font-size="10.5" fill="#55606F" text-anchor="middle">Opdrachtgever: de CFO van Meridiaan Pensioen N.V. · Termijn: drie maanden · Casus: geen nieuwe overlegstructuren</text>
