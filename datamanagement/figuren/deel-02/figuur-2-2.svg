<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
<defs>
<marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#2563A8"/>
</marker>
</defs>
<rect width="1400" height="760" fill="#FBFAF7"/>
<text x="700" y="48" font-family="Cormorant Garamond" font-size="26" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Drie abstractieniveaus, hetzelfde onderwerp</tspan></text>
<text x="700" y="76" font-family="DM Sans" font-size="13" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">Conceptueel, logisch en fysiek model van "Deelnemer" — met per niveau het publiek</tspan></text>

<!-- connecting arrows between panels -->
<line x1="428" y1="380" x2="470" y2="380" stroke="#2563A8" stroke-width="2" marker-end="url(#arrowB)"/>
<line x1="898" y1="380" x2="940" y2="380" stroke="#2563A8" stroke-width="2" marker-end="url(#arrowB)"/>

<!-- CDM panel -->
<rect x="60" y="110" width="368" height="560" rx="6" fill="#FFFFFF" stroke="#14213D" stroke-width="1.5"/>
<rect x="60" y="110" width="368" height="52" rx="6" fill="#14213D"/>
<rect x="60" y="140" width="368" height="22" fill="#14213D"/>
<text x="244" y="142" font-family="DM Sans" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="244" dy="0">Conceptueel (CDM)</tspan></text>
<rect x="80" y="178" width="328" height="36" rx="4" fill="#F4F6F9" stroke="#DFDCD3" stroke-width="1"/>
<text x="244" y="200" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle"><tspan x="244" dy="0">Publiek: business, bestuur, toezichthouder</tspan></text>

<!-- conceptual box: just Deelnemer -->
<rect x="150" y="245" width="188" height="70" rx="6" fill="#FBF4E6" stroke="#E9A13B" stroke-width="2"/>
<text x="244" y="288" font-family="DM Sans" font-size="17" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="244" dy="0">Deelnemer</tspan></text>

<rect x="80" y="345" width="328" height="70" rx="4" fill="#F4F6F9" stroke="#DFDCD3" stroke-width="1"/>
<text x="95" y="368" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D"><tspan x="95" dy="0">Definitie in bedrijfstaal</tspan></text>
<text x="95" y="386" font-family="DM Sans" font-size="11.5" fill="#55606F"><tspan x="95" dy="0">"Een natuurlijk persoon die pensioen</tspan></text>
<text x="95" y="402" font-family="DM Sans" font-size="11.5" fill="#55606F"><tspan x="95" dy="0">opbouwt bij Meridiaan."</tspan></text>

<rect x="80" y="440" width="328" height="150" rx="4" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/>
<text x="95" y="463" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D"><tspan x="95" dy="0">Bevat</tspan></text>
<text x="95" y="483" font-family="DM Sans" font-size="11.5" fill="#55606F"><tspan x="95" dy="0">— Entiteiten en relaties</tspan></text>
<text x="95" y="501" font-family="DM Sans" font-size="11.5" fill="#55606F"><tspan x="95" dy="0">— Definities in bedrijfstaal</tspan></text>
<text x="95" y="528" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D"><tspan x="95" dy="0">Bevat níét</tspan></text>
<text x="95" y="548" font-family="DM Sans" font-size="11.5" fill="#55606F"><tspan x="95" dy="0">— Attributen in detail</tspan></text>
<text x="95" y="566" font-family="DM Sans" font-size="11.5" fill="#55606F"><tspan x="95" dy="0">— Sleutels, techniek</tspan></text>

<rect x="80" y="605" width="328" height="46" rx="4" fill="#F4F6F9" stroke="#DFDCD3" stroke-width="1"/>
<text x="244" y="633" font-family="DM Sans" font-size="11.5" fill="#55606F" text-anchor="middle"><tspan x="244" dy="0">Enige plek waar bestuurder én ontwikkelaar</tspan></text>

<!-- LDM panel -->
<rect x="470" y="110" width="368" height="560" rx="6" fill="#FFFFFF" stroke="#14213D" stroke-width="1.5"/>
<rect x="470" y="110" width="368" height="52" rx="6" fill="#14213D"/>
<rect x="470" y="140" width="368" height="22" fill="#14213D"/>
<text x="654" y="142" font-family="DM Sans" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="654" dy="0">Logisch (LDM)</tspan></text>
<rect x="490" y="178" width="328" height="36" rx="4" fill="#F4F6F9" stroke="#DFDCD3" stroke-width="1"/>
<text x="654" y="200" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle"><tspan x="654" dy="0">Publiek: analisten, architecten, stewards</tspan></text>

<!-- logical box with attributes -->
<rect x="530" y="240" width="248" height="150" rx="6" fill="#FBF4E6" stroke="#E9A13B" stroke-width="2"/>
<rect x="530" y="240" width="248" height="32" rx="6" fill="#E9A13B"/>
<rect x="530" y="256" width="248" height="16" fill="#E9A13B"/>
<text x="654" y="261" font-family="DM Sans" font-size="14" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="654" dy="0">Deelnemer</tspan></text>
<circle cx="550" cy="292" r="4" fill="#14213D"/>
<text x="562" y="296" font-family="DM Sans" font-size="11.5" fill="#14213D"><tspan x="562" dy="0">deelnemer_id (PK)</tspan></text>
<text x="550" y="315" font-family="DM Sans" font-size="11.5" fill="#55606F"><tspan x="550" dy="0">naam, geboortedatum</tspan></text>
<text x="550" y="335" font-family="DM Sans" font-size="11.5" fill="#55606F"><tspan x="550" dy="0">werkgever_id (FK)</tspan></text>
<text x="550" y="355" font-family="DM Sans" font-size="11.5" fill="#55606F"><tspan x="550" dy="0">status (1 : veel naar Deelname)</tspan></text>
<text x="550" y="375" font-family="DM Sans" font-size="11.5" fill="#55606F"><tspan x="550" dy="0">kardinaliteit, optionaliteit</tspan></text>

<rect x="490" y="410" width="328" height="150" rx="4" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/>
<text x="505" y="433" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D"><tspan x="505" dy="0">Bevat</tspan></text>
<text x="505" y="453" font-family="DM Sans" font-size="11.5" fill="#55606F"><tspan x="505" dy="0">— Alle attributen en sleutels</tspan></text>
<text x="505" y="471" font-family="DM Sans" font-size="11.5" fill="#55606F"><tspan x="505" dy="0">— Kardinaliteit, normalisatie</tspan></text>
<text x="505" y="498" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D"><tspan x="505" dy="0">Bevat níét</tspan></text>
<text x="505" y="518" font-family="DM Sans" font-size="11.5" fill="#55606F"><tspan x="505" dy="0">— Technologiekeuzes</tspan></text>
<text x="505" y="536" font-family="DM Sans" font-size="11.5" fill="#55606F"><tspan x="505" dy="0">— Indexen, platformspecifieke types</tspan></text>

<rect x="490" y="605" width="328" height="46" rx="4" fill="#F4F6F9" stroke="#DFDCD3" stroke-width="1"/>
<text x="654" y="625" font-family="DM Sans" font-size="11.5" fill="#55606F" text-anchor="middle"><tspan x="654" dy="0">Platformonafhankelijk — hetzelfde LDM</tspan></text>
<text x="654" y="641" font-family="DM Sans" font-size="11.5" fill="#55606F" text-anchor="middle"><tspan x="654" dy="0">past op elk databasesysteem</tspan></text>

<!-- PDM panel -->
<rect x="940" y="110" width="400" height="560" rx="6" fill="#FFFFFF" stroke="#14213D" stroke-width="1.5"/>
<rect x="940" y="110" width="400" height="52" rx="6" fill="#14213D"/>
<rect x="940" y="140" width="400" height="22" fill="#14213D"/>
<text x="1140" y="142" font-family="DM Sans" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="1140" dy="0">Fysiek (PDM)</tspan></text>
<rect x="960" y="178" width="360" height="36" rx="4" fill="#F4F6F9" stroke="#DFDCD3" stroke-width="1"/>
<text x="1140" y="200" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle"><tspan x="1140" dy="0">Publiek: ontwikkelaars, DBA's</tspan></text>

<!-- physical table -->
<rect x="960" y="235" width="360" height="180" rx="4" fill="#FFFFFF" stroke="#14213D" stroke-width="1.5"/>
<rect x="960" y="235" width="360" height="30" fill="#14213D"/>
<text x="975" y="255" font-family="DM Sans" font-size="12" font-weight="bold" fill="#FFFFFF"><tspan x="975" dy="0">TBL_DEELNEMER</tspan></text>
<text x="975" y="283" font-family="DM Sans" font-size="11" font-weight="bold" fill="#55606F"><tspan x="975" dy="0">kolom</tspan></text>
<text x="1180" y="283" font-family="DM Sans" font-size="11" font-weight="bold" fill="#55606F"><tspan x="1180" dy="0">type</tspan></text>
<line x1="975" y1="291" x2="1305" y2="291" stroke="#DFDCD3" stroke-width="1"/>
<text x="975" y="311" font-family="DM Sans" font-size="11.5" fill="#14213D"><tspan x="975" dy="0">deelnemer_id</tspan></text>
<text x="1180" y="311" font-family="DM Sans" font-size="11.5" fill="#2563A8"><tspan x="1180" dy="0">INT, PK</tspan></text>
<text x="975" y="333" font-family="DM Sans" font-size="11.5" fill="#14213D"><tspan x="975" dy="0">naam</tspan></text>
<text x="1180" y="333" font-family="DM Sans" font-size="11.5" fill="#2563A8"><tspan x="1180" dy="0">VARCHAR(120)</tspan></text>
<text x="975" y="355" font-family="DM Sans" font-size="11.5" fill="#14213D"><tspan x="975" dy="0">geboortedatum</tspan></text>
<text x="1180" y="355" font-family="DM Sans" font-size="11.5" fill="#2563A8"><tspan x="1180" dy="0">DATE</tspan></text>
<text x="975" y="377" font-family="DM Sans" font-size="11.5" fill="#14213D"><tspan x="975" dy="0">werkgever_id</tspan></text>
<text x="1180" y="377" font-family="DM Sans" font-size="11.5" fill="#2563A8"><tspan x="1180" dy="0">INT, FK, IDX</tspan></text>
<text x="975" y="399" font-family="DM Sans" font-size="11.5" fill="#14213D"><tspan x="975" dy="0">status</tspan></text>
<text x="1180" y="399" font-family="DM Sans" font-size="11.5" fill="#2563A8"><tspan x="1180" dy="0">CHAR(1)</tspan></text>

<rect x="960" y="435" width="360" height="150" rx="4" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/>
<text x="975" y="458" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D"><tspan x="975" dy="0">Bevat</tspan></text>
<text x="975" y="478" font-family="DM Sans" font-size="11.5" fill="#55606F"><tspan x="975" dy="0">— Tabellen, kolomtypes</tspan></text>
<text x="975" y="496" font-family="DM Sans" font-size="11.5" fill="#55606F"><tspan x="975" dy="0">— Indexen, partities</tspan></text>
<text x="975" y="523" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D"><tspan x="975" dy="0">Bevat níét</tspan></text>
<text x="975" y="543" font-family="DM Sans" font-size="11.5" fill="#55606F"><tspan x="975" dy="0">— Betekenis — die staat in</tspan></text>
<text x="975" y="561" font-family="DM Sans" font-size="11.5" fill="#55606F"><tspan x="975" dy="0">   de andere twee niveaus</tspan></text>

<rect x="960" y="605" width="360" height="46" rx="4" fill="#F4F6F9" stroke="#DFDCD3" stroke-width="1"/>
<text x="1140" y="625" font-family="DM Sans" font-size="11.5" fill="#55606F" text-anchor="middle"><tspan x="1140" dy="0">Specifiek voor het gekozen</tspan></text>
<text x="1140" y="641" font-family="DM Sans" font-size="11.5" fill="#55606F" text-anchor="middle"><tspan x="1140" dy="0">databaseplatform</tspan></text>

<text x="700" y="700" font-family="Cormorant Garamond" font-size="17" font-style="italic" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Zonder CDM bestaat er geen plek waar de definitie gezaghebbend staat.</tspan></text>
</svg>
