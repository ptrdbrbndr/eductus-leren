<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
<rect width="1400" height="760" fill="#FBFAF7"/>
<text x="700" y="48" font-family="Cormorant Garamond" font-size="26" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">ER-diagram bij Meridiaan</tspan></text>
<text x="700" y="76" font-family="DM Sans" font-size="13" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">De koppelentiteit Deelname draagt haar eigen attributen — een vergeten begrip, geen technisch trucje</tspan></text>

<!-- Werkgever -->
<rect x="70" y="130" width="290" height="150" rx="6" fill="#FFFFFF" stroke="#14213D" stroke-width="1.5"/>
<rect x="70" y="130" width="290" height="38" rx="6" fill="#14213D"/>
<rect x="70" y="150" width="290" height="18" fill="#14213D"/>
<text x="215" y="155" font-family="DM Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="215" dy="0">Werkgever</tspan></text>
<circle cx="95" cy="190" r="5" fill="#E9A13B"/>
<text x="108" y="194" font-family="DM Sans" font-size="12" fill="#14213D"><tspan x="108" dy="0">werkgever_id (PK)</tspan></text>
<text x="95" y="216" font-family="DM Sans" font-size="12" fill="#55606F"><tspan x="95" dy="0">werkgevernaam</tspan></text>
<text x="95" y="238" font-family="DM Sans" font-size="12" fill="#55606F"><tspan x="95" dy="0">adres</tspan></text>
<text x="95" y="260" font-family="DM Sans" font-size="12" fill="#55606F"><tspan x="95" dy="0">kvk-nummer</tspan></text>

<!-- Deelnemer -->
<rect x="555" y="130" width="290" height="150" rx="6" fill="#FFFFFF" stroke="#14213D" stroke-width="1.5"/>
<rect x="555" y="130" width="290" height="38" rx="6" fill="#14213D"/>
<rect x="555" y="150" width="290" height="18" fill="#14213D"/>
<text x="700" y="155" font-family="DM Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="700" dy="0">Deelnemer</tspan></text>
<circle cx="580" cy="190" r="5" fill="#E9A13B"/>
<text x="593" y="194" font-family="DM Sans" font-size="12" fill="#14213D"><tspan x="593" dy="0">deelnemer_id (PK)</tspan></text>
<text x="580" y="216" font-family="DM Sans" font-size="12" fill="#55606F"><tspan x="580" dy="0">naam, geboortedatum</tspan></text>
<text x="580" y="238" font-family="DM Sans" font-size="12" fill="#55606F"><tspan x="580" dy="0">werkgever_id (FK)</tspan></text>
<text x="580" y="260" font-family="DM Sans" font-size="12" fill="#55606F"><tspan x="580" dy="0">status</tspan></text>

<!-- Regeling -->
<rect x="1040" y="130" width="290" height="150" rx="6" fill="#FFFFFF" stroke="#14213D" stroke-width="1.5"/>
<rect x="1040" y="130" width="290" height="38" rx="6" fill="#14213D"/>
<rect x="1040" y="150" width="290" height="18" fill="#14213D"/>
<text x="1185" y="155" font-family="DM Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="1185" dy="0">Regeling</tspan></text>
<circle cx="1065" cy="190" r="5" fill="#E9A13B"/>
<text x="1078" y="194" font-family="DM Sans" font-size="12" fill="#14213D"><tspan x="1078" dy="0">regeling_id (PK)</tspan></text>
<text x="1065" y="216" font-family="DM Sans" font-size="12" fill="#55606F"><tspan x="1065" dy="0">regelingnaam</tspan></text>
<text x="1065" y="238" font-family="DM Sans" font-size="12" fill="#55606F"><tspan x="1065" dy="0">regelingtype</tspan></text>

<!-- Werkgever - Deelnemer line -->
<line x1="360" y1="200" x2="555" y2="200" stroke="#14213D" stroke-width="1.5"/>
<text x="378" y="192" font-family="DM Sans" font-size="12" font-weight="bold" fill="#2563A8">1</text>
<text x="518" y="192" font-family="DM Sans" font-size="12" font-weight="bold" fill="#2563A8">veel</text>
<text x="457" y="222" font-family="DM Sans" font-size="11" fill="#55606F" text-anchor="middle"><tspan x="457" dy="0">heeft in dienst</tspan></text>

<!-- Deelname junction entity -->
<rect x="530" y="470" width="340" height="200" rx="6" fill="#FBF4E6" stroke="#E9A13B" stroke-width="2"/>
<rect x="530" y="470" width="340" height="38" rx="6" fill="#E9A13B"/>
<rect x="530" y="490" width="340" height="18" fill="#E9A13B"/>
<text x="700" y="495" font-family="DM Sans" font-size="15" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Deelname</tspan></text>
<text x="700" y="524" font-family="DM Sans" font-size="11" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">koppelentiteit</tspan></text>
<circle cx="555" cy="548" r="5" fill="#14213D"/>
<text x="568" y="552" font-family="DM Sans" font-size="12" fill="#14213D"><tspan x="568" dy="0">deelnemer_id (FK)</tspan></text>
<circle cx="555" cy="572" r="5" fill="#14213D"/>
<text x="568" y="576" font-family="DM Sans" font-size="12" fill="#14213D"><tspan x="568" dy="0">regeling_id (FK)</tspan></text>
<text x="555" y="600" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D"><tspan x="555" dy="0">ingangsdatum</tspan></text>
<text x="555" y="622" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D"><tspan x="555" dy="0">einddatum</tspan></text>
<text x="555" y="644" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D"><tspan x="555" dy="0">opbouwpercentage</tspan></text>

<!-- Deelnemer - Deelname line -->
<line x1="700" y1="280" x2="700" y2="470" stroke="#14213D" stroke-width="1.5"/>
<text x="712" y="310" font-family="DM Sans" font-size="12" font-weight="bold" fill="#2563A8">1</text>
<text x="712" y="450" font-family="DM Sans" font-size="12" font-weight="bold" fill="#2563A8">veel</text>

<!-- Regeling - Deelname line -->
<path d="M 1185 280 L 1185 400 L 870 465" fill="none" stroke="#14213D" stroke-width="1.5"/>
<text x="1197" y="310" font-family="DM Sans" font-size="12" font-weight="bold" fill="#2563A8">1</text>
<text x="885" y="450" font-family="DM Sans" font-size="12" font-weight="bold" fill="#2563A8">veel</text>

<!-- callout -->
<rect x="70" y="500" width="410" height="170" rx="6" fill="#F4F6F9" stroke="#DFDCD3" stroke-width="1"/>
<text x="95" y="530" font-family="DM Sans" font-size="13" font-weight="bold" fill="#14213D"><tspan x="95" dy="0">Waarom Deelname bestaat</tspan></text>
<text x="95" y="555" font-family="DM Sans" font-size="12" fill="#55606F"><tspan x="95" dy="0">Een deelnemer kan meerdere regelingen</tspan></text>
<text x="95" y="575" font-family="DM Sans" font-size="12" fill="#55606F"><tspan x="95" dy="0">hebben, en een regeling meerdere</tspan></text>
<text x="95" y="595" font-family="DM Sans" font-size="12" fill="#55606F"><tspan x="95" dy="0">deelnemers — veel-op-veel bestaat niet</tspan></text>
<text x="95" y="615" font-family="DM Sans" font-size="12" fill="#55606F"><tspan x="95" dy="0">in een database. De koppelentiteit blijkt</tspan></text>
<text x="95" y="635" font-family="DM Sans" font-size="12" fill="#55606F"><tspan x="95" dy="0">zelf betekenis te hebben: ingangsdatum,</tspan></text>
<text x="95" y="655" font-family="DM Sans" font-size="12" fill="#55606F"><tspan x="95" dy="0">einddatum en opbouwpercentage horen</tspan></text>
<text x="95" y="675" font-family="DM Sans" font-size="12" fill="#55606F"><tspan x="95" dy="0" font-style="italic">bij de relatie zelf, niet bij een van beide kanten.</tspan></text>
</svg>
