<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700">
<rect width="1400" height="700" fill="#FBFAF7"/>
<text x="700" y="40" font-family="Cormorant Garamond" font-size="24" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Dashboardmockup — hiërarchie, context en een expliciete peildatum</tspan></text>

<!-- dashboard frame -->
<rect x="60" y="70" width="1280" height="580" rx="6" fill="#FFFFFF" stroke="#14213D" stroke-width="1.5"/>

