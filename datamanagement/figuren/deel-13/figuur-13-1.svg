<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
<defs>
<marker id="arrowD" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#14213D"/>
</marker>
<marker id="arrowE" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#E9A13B"/>
</marker>
</defs>
<rect width="1400" height="760" fill="#FBFAF7"/>
<text x="700" y="48" font-family="Cormorant Garamond" font-size="26" font-weight="bold" fill="#14213D" text-anchor="middle">Lineage in drie niveaus</text>
<text x="700" y="74" font-family="DM Sans" font-size="13" fill="#55606F" text-anchor="middle">Systeem, tabel en kolom — met oplopende kosten en oplopende waarde</text>

<!-- Panel 1: Systeemniveau -->
<rect x="70" y="110" width="380" height="270" rx="8" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1.5"/>
<rect x="70" y="110" width="380" height="36" rx="8" fill="#F4F6F9"/>
<text x="260" y="133" font-family="DM Sans" font-size="14" font-weight="bold" fill="#14213D" text-anchor="middle">1 · Systeemniveau</text>
<rect x="100" y="180" width="130" height="44" rx="5" fill="#F4F6F9" stroke="#14213D" stroke-width="1.2"/>
<text x="165" y="207" font-family="DM Sans" font-size="11" fill="#14213D" text-anchor="middle">Polisadmin.</text>
<line x1="230" y1="202" x2="290" y2="202" stroke="#14213D" stroke-width="1.6" marker-end="url(#arrowD)"/>
<rect x="290" y="180" width="130" height="44" rx="5" fill="#F4F6F9" stroke="#14213D" stroke-width="1.2"/>
<text x="355" y="207" font-family="DM Sans" font-size="11" fill="#14213D" text-anchor="middle">Datawarehouse</text>
<rect x="195" y="250" width="130" height="44" rx="5" fill="#F4F6F9" stroke="#14213D" stroke-width="1.2"/>
<text x="260" y="277" font-family="DM Sans" font-size="11" fill="#14213D" text-anchor="middle">Rapportage</text>
<line x1="355" y1="224" x2="280" y2="250" stroke="#14213D" stroke-width="1.6" marker-end="url(#arrowD)"/>
<text x="100" y="330" font-family="DM Sans" font-size="10.5" fill="#55606F">Welke systemen leveren aan welke —</text>
<text x="100" y="346" font-family="DM Sans" font-size="10.5" fill="#55606F">handmatig, in een dag te tekenen</text>
<text x="100" y="366" font-family="DM Sans" font-size="10.5" fill="#2563A8" font-weight="bold">Kosten: laag</text>

<!-- Panel 2: Tabelniveau -->
<rect x="510" y="110" width="380" height="270" rx="8" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1.5"/>
<rect x="510" y="110" width="380" height="36" rx="8" fill="#F4F6F9"/>
<text x="700" y="133" font-family="DM Sans" font-size="14" font-weight="bold" fill="#14213D" text-anchor="middle">2 · Tabelniveau</text>
<rect x="535" y="170" width="120" height="34" rx="4" fill="#F4F6F9" stroke="#2563A8" stroke-width="1.2"/>
<text x="595" y="191" font-family="DM Sans" font-size="10" fill="#14213D" text-anchor="middle">TBL_POLIS_RAW</text>
<line x1="655" y1="187" x2="705" y2="187" stroke="#2563A8" stroke-width="1.6" marker-end="url(#arrowD)"/>
<rect x="705" y="170" width="120" height="34" rx="4" fill="#F4F6F9" stroke="#2563A8" stroke-width="1.2"/>
<text x="765" y="191" font-family="DM Sans" font-size="10" fill="#14213D" text-anchor="middle">STG_DEELNEMER</text>
<line x1="765" y1="204" x2="765" y2="230" stroke="#2563A8" stroke-width="1.6" marker-end="url(#arrowD)"/>
<rect x="705" y="230" width="120" height="34" rx="4" fill="#F4F6F9" stroke="#2563A8" stroke-width="1.2"/>
<text x="765" y="251" font-family="DM Sans" font-size="10" fill="#14213D" text-anchor="middle">DIM_DEELNEMER</text>
<line x1="705" y1="247" x2="655" y2="247" stroke="#2563A8" stroke-width="1.6" marker-end="url(#arrowD)"/>
<rect x="535" y="230" width="120" height="34" rx="4" fill="#F4F6F9" stroke="#2563A8" stroke-width="1.2"/>
<text x="595" y="251" font-family="DM Sans" font-size="10" fill="#14213D" text-anchor="middle">RPT_AANSPRAAK</text>
<text x="535" y="330" font-family="DM Sans" font-size="10.5" fill="#55606F">Welke tabellen voeden welke —</text>
<text x="535" y="346" font-family="DM Sans" font-size="10.5" fill="#55606F">parsing van laadscripts of tooling</text>
<text x="535" y="366" font-family="DM Sans" font-size="10.5" fill="#2563A8" font-weight="bold">Kosten: middel</text>

<!-- Panel 3: Kolomniveau -->
<rect x="950" y="110" width="380" height="270" rx="8" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2"/>
<rect x="950" y="110" width="380" height="36" rx="8" fill="#FBF4E6"/>
<text x="1140" y="133" font-family="DM Sans" font-size="14" font-weight="bold" fill="#14213D" text-anchor="middle">3 · Kolomniveau</text>
<rect x="970" y="168" width="150" height="34" rx="4" fill="#FBF4E6" stroke="#E9A13B" stroke-width="1.2"/>
<text x="1045" y="189" font-family="DM Sans" font-size="9.5" fill="#14213D" text-anchor="middle">polis.geb_datum</text>
<line x1="1120" y1="185" x2="1160" y2="185" stroke="#E9A13B" stroke-width="1.6" marker-end="url(#arrowE)"/>
<rect x="1160" y="168" width="150" height="34" rx="4" fill="#FBF4E6" stroke="#E9A13B" stroke-width="1.2"/>
<text x="1235" y="185" font-family="DM Sans" font-size="9" fill="#14213D" text-anchor="middle">dim.geboortedatum</text>
<text x="1235" y="197" font-family="DM Sans" font-size="8" fill="#55606F" text-anchor="middle">1:1, geen transformatie</text>
<rect x="970" y="222" width="150" height="34" rx="4" fill="#FBF4E6" stroke="#E9A13B" stroke-width="1.2"/>
<text x="1045" y="240" font-family="DM Sans" font-size="9.5" fill="#14213D" text-anchor="middle">polis.status_cd</text>
<line x1="1120" y1="239" x2="1160" y2="239" stroke="#E9A13B" stroke-width="1.6" marker-end="url(#arrowE)"/>
<rect x="1160" y="222" width="150" height="34" rx="4" fill="#FBF4E6" stroke="#E9A13B" stroke-width="1.2"/>
<text x="1235" y="238" font-family="DM Sans" font-size="9" fill="#14213D" text-anchor="middle">dim.status_deelname</text>
<text x="1235" y="250" font-family="DM Sans" font-size="8" fill="#55606F" text-anchor="middle">omgezet via codetabel</text>
<text x="970" y="330" font-family="DM Sans" font-size="10.5" fill="#55606F">Welk brondveld voedt welk doelveld,</text>
<text x="970" y="346" font-family="DM Sans" font-size="10.5" fill="#55606F">inclusief transformatie — vrijwel alleen</text>
<text x="970" y="362" font-family="DM Sans" font-size="10.5" fill="#55606F">met tooling haalbaar</text>
<text x="970" y="382" font-family="DM Sans" font-size="10.5" fill="#E9A13B" font-weight="bold">Kosten: hoog</text>

<!-- axis -->
<line x1="120" y1="440" x2="1310" y2="440" stroke="#14213D" stroke-width="2" marker-end="url(#arrowD)"/>
<text x="120" y="466" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D">Systeemniveau</text>
<text x="700" y="466" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D" text-anchor="middle">Tabelniveau</text>
<text x="1230" y="466" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D" text-anchor="end">Kolomniveau</text>
<text x="700" y="490" font-family="DM Sans" font-size="13" fill="#55606F" text-anchor="middle">Oplopende kosten →   Oplopende waarde →</text>

<!-- practical guidance -->
<rect x="120" y="520" width="1190" height="60" rx="6" fill="#F4F6F9" stroke="#DFDCD3" stroke-width="1"/>
<text x="140" y="546" font-family="DM Sans" font-size="11.5" fill="#55606F">Begin bij systeemniveau: het beantwoordt al de meeste vragen en is binnen een dag te maken. Kolomniveau is nodig bij een</text>
<text x="140" y="564" font-family="DM Sans" font-size="11.5" fill="#55606F">toezichtsvraag of een impactanalyse op één specifiek veld — en dan alleen voor de kritieke data-elementen.</text>

<!-- side note: technisch vs business lineage -->
<rect x="120" y="600" width="1190" height="130" rx="8" fill="#FFFFFF" stroke="#14213D" stroke-width="1.5"/>
<text x="140" y="626" font-family="DM Sans" font-size="13" font-weight="bold" fill="#14213D">Technische lineage versus business lineage</text>
<line x1="715" y1="600" x2="715" y2="730" stroke="#DFDCD3" stroke-width="1"/>
<text x="160" y="652" font-family="DM Sans" font-size="11.5" fill="#55606F">Technische lineage</text>
<text x="160" y="670" font-family="DM Sans" font-size="10.5" fill="#55606F">Welke objecten zijn betrokken —</text>
<text x="160" y="686" font-family="DM Sans" font-size="10.5" fill="#55606F">antwoord op "waar komt dit vandaan?"</text>
<text x="735" y="652" font-family="DM Sans" font-size="11.5" fill="#E9A13B" font-weight="bold">Business lineage</text>
<text x="735" y="670" font-family="DM Sans" font-size="10.5" fill="#55606F">Welke betekenisstappen zijn genomen —</text>
<text x="735" y="686" font-family="DM Sans" font-size="10.5" fill="#55606F">antwoord op "waarom wijkt dit getal af?"</text>
<text x="735" y="708" font-family="DM Sans" font-size="10.5" fill="#55606F">Zeldzamer, duurder, en waardevoller.</text>
</svg>
