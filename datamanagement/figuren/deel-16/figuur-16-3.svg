<rect x="100" y="110" width="1230" height="324" fill="none" stroke="#14213D" stroke-width="1.5"/>

<!-- footnote -->
<rect x="100" y="460" width="1230" height="130" rx="6" fill="#F4F6F9" stroke="#DFDCD3" stroke-width="1"/>
<text x="120" y="486" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D">Hit policy: Unique</text>
<text x="120" y="506" font-family="DM Sans" font-size="11" fill="#55606F">Elke combinatie valt onder precies één regel; overlap is een modelleerfout en moet bij validatie zichtbaar worden.</text>
<text x="120" y="526" font-family="DM Sans" font-size="11" fill="#55606F">Kies dit bewust — bij hit policy First verbergt de volgorde de overlap in plaats van hem te melden, wat prettig lijkt</text>
<text x="120" y="544" font-family="DM Sans" font-size="11" fill="#55606F">en het onderhoud sloopt.</text>
<text x="120" y="570" font-family="DM Sans" font-size="11" fill="#E9A13B" font-weight="bold">Regel 5 domineert: zodra het een bijzondere categorie betreft, is de classificatie altijd "Bijzonder" — ongeacht externe deling.</text>
</svg>
