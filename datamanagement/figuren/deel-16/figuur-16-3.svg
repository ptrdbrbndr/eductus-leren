<text x="265" y="329" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D" text-anchor="middle">ja</text>
<text x="475" y="329" font-family="DM Sans" font-size="12" fill="#14213D" text-anchor="middle">nee</text>
