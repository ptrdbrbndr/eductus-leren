<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
<rect width="1400" height="720" fill="#FBFAF7"/>
<text x="700" y="48" font-family="Cormorant Garamond" font-size="26" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Vier soorten analyse als oplopende piramide</tspan></text>
<text x="700" y="76" font-family="DM Sans" font-size="13" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">Elke laag beantwoordt een andere vraag — de meeste vragen zijn beschrijvend gesteld en diagnostisch bedoeld</tspan></text>

<!-- tier 1 bottom: Beschrijvend -->
<polygon points="350,480 1050,480 1140,590 260,590" fill="#14213D" stroke="#FBFAF7" stroke-width="2"/>
<text x="700" y="530" font-family="DM Sans" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="700" dy="0">Beschrijvend</tspan></text>
<text x="700" y="555" font-family="DM Sans" font-size="12.5" fill="#DFDCD3" text-anchor="middle"><tspan x="700" dy="0">"Wat is er gebeurd?"</tspan></text>

<!-- tier 2: Diagnostisch -->
<polygon points="440,370 960,370 1050,480 350,480" fill="#2563A8" stroke="#FBFAF7" stroke-width="2"/>
<text x="700" y="418" font-family="DM Sans" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="700" dy="0">Diagnostisch</tspan></text>
<text x="700" y="442" font-family="DM Sans" font-size="12.5" fill="#EAF1F8" text-anchor="middle"><tspan x="700" dy="0">"Waarom is het gebeurd?"</tspan></text>

<!-- tier 3: Voorspellend -->
<polygon points="530,260 870,260 960,370 440,370" fill="#2563A8" fill-opacity="0.55" stroke="#FBFAF7" stroke-width="2"/>
<text x="700" y="305" font-family="DM Sans" font-size="15" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Voorspellend</tspan></text>
<text x="700" y="328" font-family="DM Sans" font-size="12" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">"Wat gaat er gebeuren?"</tspan></text>

<!-- tier 4 top: Voorschrijvend -->
<polygon points="620,150 780,150 870,260 530,260" fill="#E9A13B" stroke="#FBFAF7" stroke-width="2"/>
<text x="700" y="200" font-family="DM Sans" font-size="13.5" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Voorschrijvend</tspan></text>
<text x="700" y="222" font-family="DM Sans" font-size="11" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">"Wat moeten we doen?"</tspan></text>

<!-- right-side technique/valkuil callouts, connected with leader lines -->
<line x1="1140" y1="535" x2="1180" y2="535" stroke="#DFDCD3" stroke-width="1.5"/>
<rect x="1180" y="500" width="180" height="70" rx="4" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/>
<text x="1195" y="521" font-family="DM Sans" font-size="10.5" fill="#55606F"><tspan x="1195" dy="0">Tellen, sommeren,</tspan></text>
<text x="1195" y="536" font-family="DM Sans" font-size="10.5" fill="#55606F"><tspan x="1195" dy="0">groeperen</tspan></text>
<text x="1195" y="558" font-family="DM Sans" font-size="10" fill="#E9A13B"><tspan x="1195" dy="0">Valkuil: verward met verklaren</tspan></text>

<line x1="1050" y1="425" x2="1180" y2="425" stroke="#DFDCD3" stroke-width="1.5"/>
<rect x="1180" y="390" width="180" height="70" rx="4" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/>
<text x="1195" y="411" font-family="DM Sans" font-size="10.5" fill="#55606F"><tspan x="1195" dy="0">Uitsplitsen, vergelijken,</tspan></text>
<text x="1195" y="426" font-family="DM Sans" font-size="10.5" fill="#55606F"><tspan x="1195" dy="0">correleren</tspan></text>
<text x="1195" y="448" font-family="DM Sans" font-size="10" fill="#E9A13B"><tspan x="1195" dy="0">Valkuil: correlatie voor oorzaak</tspan></text>

<line x1="960" y1="315" x2="1180" y2="315" stroke="#DFDCD3" stroke-width="1.5"/>
<rect x="1180" y="280" width="180" height="70" rx="4" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/>
<text x="1195" y="301" font-family="DM Sans" font-size="10.5" fill="#55606F"><tspan x="1195" dy="0">Trendextrapolatie,</tspan></text>
<text x="1195" y="316" font-family="DM Sans" font-size="10.5" fill="#55606F"><tspan x="1195" dy="0">regressie, classificatie</tspan></text>
<text x="1195" y="338" font-family="DM Sans" font-size="10" fill="#E9A13B"><tspan x="1195" dy="0">Valkuil: verleden herhaalt zich</tspan></text>

<line x1="870" y1="205" x2="1180" y2="205" stroke="#DFDCD3" stroke-width="1.5"/>
<rect x="1180" y="170" width="180" height="70" rx="4" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/>
<text x="1195" y="191" font-family="DM Sans" font-size="10.5" fill="#55606F"><tspan x="1195" dy="0">Optimalisatie,</tspan></text>
<text x="1195" y="206" font-family="DM Sans" font-size="10.5" fill="#55606F"><tspan x="1195" dy="0">simulatie, scenario's</tspan></text>
<text x="1195" y="228" font-family="DM Sans" font-size="10" fill="#E9A13B"><tspan x="1195" dy="0">Valkuil: besluit als rekenuitkomst</tspan></text>

<rect x="60" y="630" width="1280" height="66" rx="6" fill="#F4F6F9" stroke="#DFDCD3" stroke-width="1"/>
<text x="700" y="658" font-family="DM Sans" font-size="12.5" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">"Hoeveel deelnemers zijn er vorig kwartaal uitgestroomd" is beschrijvend — wat de manager wil weten is waarom.</tspan></text>
<text x="700" y="678" font-family="DM Sans" font-size="12.5" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">Maak dat verschil expliciet vóórdat je begint, anders lever je een getal en krijg je een teleurstelling.</tspan></text>
</svg>
