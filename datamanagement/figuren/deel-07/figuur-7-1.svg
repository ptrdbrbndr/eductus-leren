<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
<defs>
<marker id="arrH" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#14213D"/>
</marker>
<marker id="arrHm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#55606F"/>
</marker>
</defs>
<rect width="1400" height="760" fill="#FBFAF7"/>
<text x="700" y="48" font-family="Cormorant Garamond" font-size="26" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Van gegeven naar toegangsregime</tspan></text>
<text x="700" y="76" font-family="DM Sans" font-size="13" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">Vier vragen, in deze volgorde — elke stap bouwt op de vorige</tspan></text>

<!-- Stage 1: decision diamond -->
<polygon points="185,150 340,250 185,350 30,250" fill="#FFFFFF" stroke="#14213D" stroke-width="2"/>
<text x="185" y="240" font-family="DM Sans" font-size="13" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="185" dy="0">Is het een</tspan></text>
<text x="185" y="258" font-family="DM Sans" font-size="13" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="185" dy="0">persoonsgegeven?</tspan></text>

<!-- Nee branch, downward dead end -->
<line x1="185" y1="350" x2="185" y2="440" stroke="#55606F" stroke-width="1.5" marker-end="url(#arrHm)"/>
<text x="198" y="400" font-family="DM Sans" font-size="12" font-weight="bold" fill="#55606F"><tspan x="198" dy="0">nee</tspan></text>
<rect x="60" y="445" width="250" height="60" rx="6" fill="#F4F6F9" stroke="#DFDCD3" stroke-width="1"/>
<text x="185" y="470" font-family="DM Sans" font-size="11.5" fill="#55606F" text-anchor="middle"><tspan x="185" dy="0">Geen AVG-regels van</tspan></text>
<text x="185" y="488" font-family="DM Sans" font-size="11.5" fill="#55606F" text-anchor="middle"><tspan x="185" dy="0">toepassing op dit gegeven</tspan></text>

<!-- ja branch to stage 2 -->
<line x1="340" y1="250" x2="410" y2="250" stroke="#14213D" stroke-width="2" marker-end="url(#arrH)"/>
<text x="345" y="238" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D"><tspan x="345" dy="0">ja</tspan></text>

<!-- Stage 2: grondslag box -->
<rect x="410" y="140" width="290" height="220" rx="8" fill="#F4F6F9" stroke="#14213D" stroke-width="1.5"/>
<rect x="410" y="140" width="290" height="40" rx="8" fill="#14213D"/>
<rect x="410" y="162" width="290" height="18" fill="#14213D"/>
<text x="555" y="165" font-family="DM Sans" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="555" dy="0">2. Welke grondslag?</tspan></text>
<text x="430" y="200" font-family="DM Sans" font-size="11" fill="#55606F"><tspan x="430" dy="0">— Toestemming</tspan></text>
<text x="430" y="220" font-family="DM Sans" font-size="11" fill="#55606F"><tspan x="430" dy="0">— Uitvoering overeenkomst</tspan></text>
<text x="430" y="240" font-family="DM Sans" font-size="11" fill="#55606F"><tspan x="430" dy="0">— Wettelijke verplichting</tspan></text>
<text x="430" y="260" font-family="DM Sans" font-size="11" fill="#55606F"><tspan x="430" dy="0">— Vitaal belang</tspan></text>
<text x="430" y="280" font-family="DM Sans" font-size="11" fill="#55606F"><tspan x="430" dy="0">— Algemeen belang</tspan></text>
<text x="430" y="300" font-family="DM Sans" font-size="11" fill="#55606F"><tspan x="430" dy="0">— Gerechtvaardigd belang</tspan></text>
<text x="430" y="330" font-family="DM Sans" font-size="10.5" font-weight="bold" fill="#2563A8"><tspan x="430" dy="0">Kies er precies één per doel</tspan></text>

<line x1="700" y1="250" x2="770" y2="250" stroke="#14213D" stroke-width="2" marker-end="url(#arrH)"/>

<!-- Stage 3: classificatie box -->
<rect x="770" y="140" width="290" height="220" rx="8" fill="#F4F6F9" stroke="#14213D" stroke-width="1.5"/>
<rect x="770" y="140" width="290" height="40" rx="8" fill="#14213D"/>
<rect x="770" y="162" width="290" height="18" fill="#14213D"/>
<text x="915" y="165" font-family="DM Sans" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="915" dy="0">3. Classificatie</tspan></text>
<text x="790" y="200" font-family="DM Sans" font-size="11.5" fill="#55606F"><tspan x="790" dy="0">CIA-drieluik</tspan></text>
<rect x="790" y="212" width="250" height="34" rx="4" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/>
<text x="805" y="233" font-family="DM Sans" font-size="11" fill="#14213D"><tspan x="805" dy="0">Vertrouwelijkheid — wie mag zien?</tspan></text>
<rect x="790" y="250" width="250" height="34" rx="4" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/>
<text x="805" y="271" font-family="DM Sans" font-size="11" fill="#14213D"><tspan x="805" dy="0">Integriteit — ongemerkt wijzigbaar?</tspan></text>
<rect x="790" y="288" width="250" height="34" rx="4" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/>
<text x="805" y="309" font-family="DM Sans" font-size="11" fill="#14213D"><tspan x="805" dy="0">Beschikbaarheid — wat als het er niet is?</tspan></text>
<text x="790" y="345" font-family="DM Sans" font-size="10.5" font-weight="bold" fill="#2563A8"><tspan x="790" dy="0">Niet alles even zwaar beschermen</tspan></text>

<line x1="1060" y1="250" x2="1130" y2="250" stroke="#14213D" stroke-width="2" marker-end="url(#arrH)"/>

<!-- Stage 4: toegangsregime box -->
<rect x="1130" y="140" width="230" height="220" rx="8" fill="#FBF4E6" stroke="#E9A13B" stroke-width="2.5"/>
<rect x="1130" y="140" width="230" height="40" rx="8" fill="#E9A13B"/>
<rect x="1130" y="162" width="230" height="18" fill="#E9A13B"/>
<text x="1245" y="165" font-family="DM Sans" font-size="14" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="1245" dy="0">4. Toegangsregime</tspan></text>
<text x="1150" y="205" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D"><tspan x="1150" dy="0">Need to know</tspan></text>
<text x="1150" y="228" font-family="DM Sans" font-size="11" fill="#55606F"><tspan x="1150" dy="0">Toegang omdat je het</tspan></text>
<text x="1150" y="245" font-family="DM Sans" font-size="11" fill="#55606F"><tspan x="1150" dy="0">nodig hebt — niet omdat</tspan></text>
<text x="1150" y="262" font-family="DM Sans" font-size="11" fill="#55606F"><tspan x="1150" dy="0">je functie hoog genoeg is</tspan></text>
<text x="1150" y="292" font-family="DM Sans" font-size="10.5" fill="#55606F"><tspan x="1150" dy="0">Jaarlijkse herbeoordeling,</tspan></text>
<text x="1150" y="309" font-family="DM Sans" font-size="10.5" fill="#55606F"><tspan x="1150" dy="0">let op stapeling bij</tspan></text>
<text x="1150" y="326" font-family="DM Sans" font-size="10.5" fill="#55606F"><tspan x="1150" dy="0">functiewijziging</tspan></text>

<!-- example strip along the bottom -->
<rect x="60" y="560" width="1280" height="150" rx="6" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/>
<text x="85" y="590" font-family="DM Sans" font-size="13" font-weight="bold" fill="#14213D"><tspan x="85" dy="0">Bij Meridiaan: arbeidsongeschiktheidsgegevens</tspan></text>
<text x="85" y="615" font-family="DM Sans" font-size="12.5" fill="#55606F"><tspan x="85" dy="0">1. Ja, en zelfs een bijzondere categorie — gezondheidsgegevens.  2. Uitvoering overeenkomst: de kern van de</tspan></text>
<text x="85" y="637" font-family="DM Sans" font-size="12.5" fill="#55606F"><tspan x="85" dy="0">pensioenadministratie.  3. Hoogste classificatie op vertrouwelijkheid — alleen benoemde medewerkers mogen zien.</tspan></text>
<text x="85" y="659" font-family="DM Sans" font-size="12.5" fill="#55606F"><tspan x="85" dy="0">4. Toegang alleen voor wie deze gegevens voor zijn werk daadwerkelijk nodig heeft, niet voor de hele afdeling.</tspan></text>
<text x="85" y="685" font-family="DM Sans" font-size="11.5" fill="#55606F" font-style="italic"><tspan x="85" dy="0">Twijfel bij stap 1 of 2? Betrek de functionaris gegevensbescherming — dat is geen omweg, maar vakmanschap.</tspan></text>
</svg>
