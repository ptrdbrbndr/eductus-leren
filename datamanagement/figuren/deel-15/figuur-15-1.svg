<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000">
<defs>
<marker id="arrowH" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#14213D"/>
</marker>
</defs>
<rect width="1400" height="1000" fill="#FBFAF7"/>
<text x="700" y="48" font-family="Cormorant Garamond" font-size="26" font-weight="bold" fill="#14213D" text-anchor="middle">De kwaliteitscyclus als kring</text>
<text x="700" y="74" font-family="DM Sans" font-size="13" fill="#55606F" text-anchor="middle">Vijf stappen — de twee die organisaties meestal overslaan zijn gemarkeerd</text>

<!-- connecting arrows (drawn first, under nodes) -->
<line x1="748.5" y1="195.3" x2="898.5" y2="304.7" stroke="#14213D" stroke-width="2" marker-end="url(#arrowH)"/>
<line x1="928.5" y1="397.1" x2="871.5" y2="572.9" stroke="#14213D" stroke-width="2" marker-end="url(#arrowH)"/>
<line x1="793" y1="630" x2="607" y2="630" stroke="#14213D" stroke-width="2" marker-end="url(#arrowH)"/>
<line x1="528.5" y1="572.9" x2="471.5" y2="397.1" stroke="#14213D" stroke-width="2" marker-end="url(#arrowH)"/>
<line x1="501.5" y1="304.7" x2="651.5" y2="195.3" stroke="#14213D" stroke-width="2" marker-end="url(#arrowH)"/>

<!-- center -->
<text x="700" y="415" font-family="Cormorant Garamond" font-size="18" font-weight="bold" fill="#14213D" text-anchor="middle">Van incident</text>
<text x="700" y="438" font-family="Cormorant Garamond" font-size="18" font-weight="bold" fill="#14213D" text-anchor="middle">naar proces</text>

<!-- Node 1: Definieren (top) -->
<circle cx="700" cy="160" r="62" fill="#14213D"/>
<text x="700" y="152" font-family="DM Sans" font-size="11" fill="#DFDCD3" text-anchor="middle">1</text>
<text x="700" y="172" font-family="DM Sans" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Definiëren</text>

<!-- Node 2: Meten -->
<circle cx="947" cy="340" r="62" fill="#14213D"/>
<text x="947" y="332" font-family="DM Sans" font-size="11" fill="#DFDCD3" text-anchor="middle">2</text>
<text x="947" y="352" font-family="DM Sans" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Meten</text>

<!-- Node 3: Analyseren -->
<circle cx="853" cy="630" r="62" fill="#14213D"/>
<text x="853" y="622" font-family="DM Sans" font-size="11" fill="#DFDCD3" text-anchor="middle">3</text>
<text x="853" y="642" font-family="DM Sans" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Analyseren</text>

<!-- Node 4: Verbeteren (flagged) -->
<circle cx="547" cy="630" r="66" fill="#FBF4E6" stroke="#E9A13B" stroke-width="3.5"/>
<text x="547" y="618" font-family="DM Sans" font-size="11" fill="#B97A1E" text-anchor="middle">4</text>
<text x="547" y="638" font-family="DM Sans" font-size="14" font-weight="bold" fill="#14213D" text-anchor="middle">Verbeteren</text>
<text x="547" y="655" font-family="DM Sans" font-size="9" fill="#B97A1E" text-anchor="middle">wordt vaak overgeslagen</text>

<!-- Node 5: Borgen (flagged) -->
<circle cx="453" cy="340" r="66" fill="#FBF4E6" stroke="#E9A13B" stroke-width="3.5"/>
<text x="453" y="328" font-family="DM Sans" font-size="11" fill="#B97A1E" text-anchor="middle">5</text>
<text x="453" y="348" font-family="DM Sans" font-size="14" font-weight="bold" fill="#14213D" text-anchor="middle">Borgen</text>
<text x="453" y="365" font-family="DM Sans" font-size="9" fill="#B97A1E" text-anchor="middle">wordt vaak overgeslagen</text>

<!-- callout box -->
<rect x="70" y="710" width="1260" height="44" rx="6" fill="#F4F6F9" stroke="#DFDCD3" stroke-width="1"/>
<text x="700" y="736" font-family="DM Sans" font-size="12" fill="#14213D" text-anchor="middle">De toets voor een proces: draait de meting nog over een jaar zonder handmatige start, en merkt iemand het als hij niet draait?</text>

<!-- table -->
<rect x="70" y="768" width="1260" height="28" fill="#14213D"/>
<text x="90" y="787" font-family="DM Sans" font-size="10.5" font-weight="bold" fill="#FFFFFF">Stap</text>
<text x="290" y="787" font-family="DM Sans" font-size="10.5" font-weight="bold" fill="#FFFFFF">Wat er gebeurt</text>
<text x="760" y="787" font-family="DM Sans" font-size="10.5" font-weight="bold" fill="#FFFFFF">Waar het misgaat</text>

<rect x="70" y="796" width="1260" height="26" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="0.5"/>
<text x="90" y="814" font-family="DM Sans" font-size="10" fill="#14213D">1 Definiëren</text>
<text x="290" y="814" font-family="DM Sans" font-size="10" fill="#55606F">Vaststellen wat goed genoeg is, per element en per gebruik</text>
<text x="760" y="814" font-family="DM Sans" font-size="10" fill="#55606F">Gemeten zonder norm; elke uitkomst is dan een falen</text>

<rect x="70" y="822" width="1260" height="26" fill="#FBFAF7" stroke="#DFDCD3" stroke-width="0.5"/>
<text x="90" y="840" font-family="DM Sans" font-size="10" fill="#14213D">2 Meten</text>
<text x="290" y="840" font-family="DM Sans" font-size="10" fill="#55606F">Regels uitvoeren, herhaalbaar en op vaste momenten</text>
<text x="760" y="840" font-family="DM Sans" font-size="10" fill="#55606F">Eenmalig meten en het een rapportage noemen</text>

<rect x="70" y="848" width="1260" height="26" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="0.5"/>
<text x="90" y="866" font-family="DM Sans" font-size="10" fill="#14213D">3 Analyseren</text>
<text x="290" y="866" font-family="DM Sans" font-size="10" fill="#55606F">Van symptoom naar oorzaakcategorie</text>
<text x="760" y="866" font-family="DM Sans" font-size="10" fill="#55606F">Blijven hangen bij "de data klopt niet"</text>

<rect x="70" y="874" width="1260" height="26" fill="#FBF4E6" stroke="#E9A13B" stroke-width="0.7"/>
<text x="90" y="892" font-family="DM Sans" font-size="10" font-weight="bold" fill="#14213D">4 Verbeteren</text>
<text x="290" y="892" font-family="DM Sans" font-size="10" fill="#55606F">Ingrijpen bij de oorzaak, niet bij het symptoom</text>
<text x="760" y="892" font-family="DM Sans" font-size="10" fill="#55606F">Schoonmaken in het platform; volgende maand staat het er weer</text>

<rect x="70" y="900" width="1260" height="26" fill="#FBF4E6" stroke="#E9A13B" stroke-width="0.7"/>
<text x="90" y="918" font-family="DM Sans" font-size="10" font-weight="bold" fill="#14213D">5 Borgen</text>
<text x="290" y="918" font-family="DM Sans" font-size="10" fill="#55606F">Regel, eigenaar en meting overdragen aan de lijn</text>
<text x="760" y="918" font-family="DM Sans" font-size="10" fill="#55606F">Het programma eindigt en de meting stopt stilzwijgend</text>
</svg>
