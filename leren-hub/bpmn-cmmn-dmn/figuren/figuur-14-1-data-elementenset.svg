<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 660" font-family="'DM Sans', Arial, sans-serif" width="1120" height="660" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .task { fill:#CFE0F2; stroke:#14213D; stroke-width:1.5; }
    .task-label { font-size:11px; fill:#14213D; }
    .evt-start { fill:#FBFAF7; stroke:#14213D; stroke-width:1.6; }
    .evt-end { fill:#FBFAF7; stroke:#14213D; stroke-width:3; }
    .dataobj { fill:#FBF6E9; stroke:#14213D; stroke-width:1.4; }
    .datastore { fill:#FBF6E9; stroke:#14213D; stroke-width:1.4; }
    .dataio { fill:#EEF2F7; stroke:#14213D; stroke-width:1.4; }
    .seq { stroke:#14213D; stroke-width:1.6; fill:none; marker-end:url(#seqarr); }
    .assoc { stroke:#55606F; stroke-width:1.3; stroke-dasharray:3 3; fill:none; marker-end:url(#assocarr); }
    .label { font-size:14px; font-weight:700; fill:#14213D; }
    .sub { font-size:12px; fill:#55606F; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    .caption { font-size:11px; fill:#2563A8; font-weight:700; }
    .bracket { stroke:#2563A8; stroke-width:1.3; fill:none; }
    .transflabel { font-size:10px; fill:#B9433D; font-weight:700; }
    .legend { fill:#FFFFFF; stroke:#E3E0D8; stroke-width:1.4; }
  </style>
  <marker id="seqarr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#14213D"/></marker>
  <marker id="assocarr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#55606F" stroke-width="1.2"/></marker>
</defs>
<rect width="1120" height="660" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 14 · BPMN-PROCESNOTATIE</text>
<text x="40" y="64" class="title">Figuur 14.1 — De volledige data-elementenset</text>
<text x="40" y="86" class="sub">Mutatie doorgeven aan het legacy-koppelvlak: alle databetrokken elementen rond één taak.</text>

<circle cx="90" cy="330" r="15" class="evt-start"/>
<rect x="150" y="300" width="200" height="60" rx="10" class="task"/>
<text x="250" y="326" text-anchor="middle" class="task-label" style="font-weight:700">Mutatie doorgeven</text>
<text x="250" y="342" text-anchor="middle" class="task-label" style="font-weight:700">aan koppelvlak</text>
<rect x="500" y="300" width="200" height="60" rx="10" class="task"/>
<text x="600" y="326" text-anchor="middle" class="task-label" style="font-weight:700">Antwoord</text>
<text x="600" y="342" text-anchor="middle" class="task-label" style="font-weight:700">verwerken</text>
<circle cx="850" cy="330" r="15" class="evt-end"/>
<line x1="105" y1="330" x2="150" y2="330" class="seq"/>
<line x1="350" y1="330" x2="500" y2="330" class="seq"/>
<line x1="700" y1="330" x2="835" y2="330" class="seq"/>

<!-- Data Input -->
<path d="M170,120 h90 v45 l-20,15 h-70 z" class="dataio"/>
<text x="215" y="145" text-anchor="middle" class="task-label" style="font-size:9.5px;font-weight:700">Data Input</text>
<text x="215" y="158" text-anchor="middle" class="task-label" style="font-size:9px">Mutatieverzoek</text>
<text x="215" y="170" text-anchor="middle" class="task-label" style="font-size:9px">[intern formaat]</text>
<path d="M240,180 C240,220 245,250 250,298" class="assoc"/>

<!-- Data Object read -->
<path d="M330,120 h80 v55 h-64 l-16,-16 z M394,120 v16 h16" fill="#FBF6E9" stroke="#14213D" stroke-width="1.4"/>
<text x="370" y="150" text-anchor="middle" class="task-label" style="font-size:9.5px;font-weight:700">Data Object</text>
<text x="370" y="163" text-anchor="middle" class="task-label" style="font-size:9px">Aanvraagdossier</text>
<path d="M370,175 C370,220 320,260 280,298" class="assoc"/>

<!-- Data store -->
<g transform="translate(360,420)">
  <path d="M0,10 a60,14 0 1 1 120,0 v50 a60,14 0 1 1 -120,0 z" class="datastore"/>
  <ellipse cx="60" cy="10" rx="60" ry="14" class="datastore"/>
  <text x="60" y="55" text-anchor="middle" class="task-label" style="font-weight:700">Data Store</text>
  <text x="60" y="70" text-anchor="middle" class="task-label" style="font-size:9.5px">Polisadministratie</text>
</g>
<path d="M300,360 C340,390 380,405 400,420" class="assoc"/>
<path d="M420,420 C420,400 380,375 350,362" class="assoc" marker-end="url(#assocarr)"/>
<text x="300" y="405" class="task-label" style="font-size:9px">wegschrijven / raadplegen</text>

<!-- Data output with transformation -->
<path d="M760,120 h90 v45 l-20,15 h-70 z" class="dataio"/>
<text x="805" y="145" text-anchor="middle" class="task-label" style="font-size:9.5px;font-weight:700">Data Output</text>
<text x="805" y="158" text-anchor="middle" class="task-label" style="font-size:9px">Koppelvlakbericht</text>
<text x="805" y="170" text-anchor="middle" class="task-label" style="font-size:9px">[extern formaat]</text>
<path d="M650,298 C700,250 760,200 795,182" class="assoc"/>
<text x="655" y="245" class="transflabel">transformatie:</text>
<text x="655" y="258" class="transflabel">intern → koppelvlakformaat</text>
<text x="655" y="271" class="transflabel">(§14.7)</text>

<!-- item-aware bracket -->
<path d="M160,105 C160,95 850,95 850,105" class="bracket"/>
<text x="505" y="90" text-anchor="middle" class="caption">item-aware elements — elk draagt een itemDefinition (§14.1)</text>

<!-- legend -->
<rect x="40" y="500" width="1040" height="130" rx="6" class="legend"/>
<text x="60" y="524" class="caption">Legenda</text>
<text x="60" y="546" class="sub">Rechthoek met omgevouwen hoek = data object / data input / data output — draagt precies één gegeven.</text>
<text x="60" y="566" class="sub">Cilindervorm = data store — een persistente bron die blijft bestaan buiten de procesinstantie (hier: het legacy polisadministratiesysteem).</text>
<text x="60" y="586" class="sub">Gestippelde lijn met open pijlpunt = data association; kan een transformatie-expressie dragen waar het interne en externe formaat verschillen.</text>
<text x="60" y="606" class="sub">Data input/output tonen wat een (sub)proces van buitenaf ontvangt of oplevert — relevant zodra je met call activities werkt.</text>

</svg>
