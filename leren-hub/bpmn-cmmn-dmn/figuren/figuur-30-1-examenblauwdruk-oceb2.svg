<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" font-family="'DM Sans', Arial, sans-serif" width="980" height="640" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .navy { fill:#14213D; }
      .blue-dark { fill:#2563A8; }
      .blue-mid { fill:#6FA3D6; }
      .blue-fill { fill:#CFE0F2; }
      .amber-fill { fill:#E9A13B; }
      .amber-light { fill:#FBF6E9; }
      .neutral-light { fill:#EEF2F7; }
      .card-body { fill:#FFFFFF; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:13px; font-weight:700; fill:#14213D; text-anchor:middle; letter-spacing:.04em; }
      .body { font-size:12.5px; fill:#14213D; }
      .bodyb { font-size:12.5px; font-weight:700; fill:#14213D; }
      .sub { font-size:12px; fill:#55606F; }
      .tag { font-size:11px; fill:#55606F; font-style:italic; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .mkicker { font-size:10.5px; fill:#2563A8; font-weight:700; letter-spacing:.08em; }
      .quote { font-size:12px; fill:#14213D; font-style:italic; }
    </style>
</defs>
<rect width="980" height="640" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 30 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Figuur 30.1 — De examenblauwdruk OCEB 2 Business Advanced</text>
<text x="40" y="86" class="sub">Examenonderdelen dekken de stof van deel 23 t/m 29 (§30.1); rechts het zwaartepuntverschil met Business Intermediate.</text>

<!-- ===================== LINKS: DONUT VAN EXAMENDOMEINEN ===================== -->
<g>
  <!-- segment 1: EA-koppeling 20% -->
  <path d="M 260,200 A140,140 0 0 1 393.1,296.7 L 336.1,315.3 A80,80 0 0 0 260,260 Z" class="blue-dark"/>
  <!-- segment 2: Referentiemodellen 15% -->
  <path d="M 393.1,296.7 A140,140 0 0 1 373.3,422.3 L 324.7,387 A80,80 0 0 0 336.1,315.3 Z" class="blue-mid"/>
  <!-- segment 3: Governance & compliance 20% -->
  <path d="M 373.3,422.3 A140,140 0 0 1 216.7,473.1 L 235.3,416.1 A80,80 0 0 0 324.7,387 Z" class="navy"/>
  <!-- segment 4: Beslismanagement op schaal 25% -->
  <path d="M 216.7,473.1 A140,140 0 0 1 126.9,296.7 L 183.9,315.3 A80,80 0 0 0 235.3,416.1 Z" class="amber-fill"/>
  <!-- segment 5: Transformatie 20% -->
  <path d="M 126.9,296.7 A140,140 0 0 1 260,200 L 260,260 A80,80 0 0 0 183.9,315.3 Z" class="blue-fill" stroke="#14213D" stroke-width="1"/>

  <circle cx="260" cy="340" r="79" class="paper"/>
  <text x="260" y="333" class="label" text-anchor="middle">OCEB 2</text>
  <text x="260" y="351" class="sub" text-anchor="middle">Business Advanced</text>

  <!-- legenda -->
  <g>
    <rect x="420" y="190" width="14" height="14" class="blue-dark"/>
    <text x="442" y="201" class="bodyb">Enterprise-architectuur-</text>
    <text x="442" y="217" class="bodyb">koppeling — 20%</text>

    <rect x="420" y="234" width="14" height="14" class="blue-mid"/>
    <text x="442" y="245" class="bodyb">Referentiemodellen — 15%</text>

    <rect x="420" y="278" width="14" height="14" class="navy"/>
    <text x="442" y="289" class="bodyb">Governance &amp; compliance</text>
    <text x="442" y="305" class="bodyb">— 20%</text>

    <rect x="420" y="322" width="14" height="14" class="amber-fill"/>
    <text x="442" y="333" class="bodyb">Beslismanagement op</text>
    <text x="442" y="349" class="bodyb">schaal — 25%</text>

    <rect x="420" y="366" width="14" height="14" class="blue-fill" stroke="#14213D" stroke-width="1"/>
    <text x="442" y="377" class="bodyb">Transformatie — 20%</text>
  </g>

  <text x="40" y="600" class="tag">Illustratieve verdeling over de vijf examendomeinen uit §30.1 — voor de exacte, officiële gewichten: de OMG-blauwdruk (Leeswijzer).</text>
</g>

<!-- ===================== RECHTS: VERSCHIL MET BUSINESS INTERMEDIATE ===================== -->
<g>
  <rect x="600" y="140" width="340" height="440" rx="12" class="card-body" stroke="#CFE0F2" stroke-width="1.5"/>
  <rect x="600" y="140" width="340" height="44" rx="12" class="amber-fill"/>
  <rect x="600" y="162" width="340" height="22" class="amber-fill"/>
  <text x="770" y="167" class="label-light">BUSINESS INTERMEDIATE → BUSINESS ADVANCED</text>
  <text x="620" y="202" class="sub">Zelfde examenstof (deel 23 t/m 29), ander soort vraag (§30.1).</text>

  <!-- rij 1 -->
  <text x="620" y="232" class="bodyb">Herkenning van notatie en terminologie</text>
  <rect x="620" y="242" width="280" height="16" rx="4" class="neutral-light"/>
  <rect x="620" y="242" width="212" height="16" rx="4" class="blue-dark"/>
  <text x="908" y="254" class="sub" text-anchor="end">Intermediate: dominant</text>
  <rect x="620" y="266" width="280" height="16" rx="4" class="neutral-light"/>
  <rect x="620" y="266" width="78" height="16" rx="4" class="amber-fill"/>
  <text x="908" y="278" class="sub" text-anchor="end">Advanced: beperkt</text>

  <!-- rij 2 -->
  <text x="620" y="312" class="bodyb">Oordeelsvorming en scenario-analyse</text>
  <rect x="620" y="322" width="280" height="16" rx="4" class="neutral-light"/>
  <rect x="620" y="322" width="78" height="16" rx="4" class="blue-dark"/>
  <text x="908" y="334" class="sub" text-anchor="end">Intermediate: beperkt</text>
  <rect x="620" y="346" width="280" height="16" rx="4" class="neutral-light"/>
  <rect x="620" y="346" width="230" height="16" rx="4" class="amber-fill"/>
  <text x="908" y="358" class="sub" text-anchor="end">Advanced: dominant</text>

  <!-- quote -->
  <rect x="620" y="388" width="300" height="118" rx="8" class="amber-light" stroke="#E9A13B" stroke-width="1"/>
  <text x="636" y="412" class="quote">„Vragen presenteren een situatie</text>
  <text x="636" y="430" class="quote">met meerdere plausibele antwoorden;</text>
  <text x="636" y="448" class="quote">de juiste keuze hangt af van het</text>
  <text x="636" y="466" class="quote">correct wegen van context.” (§30.1)</text>

  <text x="620" y="530" class="tag">Bouwt voort op Business Intermediate</text>
  <text x="620" y="546" class="tag">— niveau 2, deel 22.</text>

  <rect x="600" y="562" width="340" height="18" class="neutral-light"/>
  <text x="770" y="575" class="sub" text-anchor="middle">Twee proefexamens oefenen dit zwaartepunt (§30.3)</text>
</g>

</svg>
