<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" font-family="'DM Sans', Arial, sans-serif" width="1100" height="760" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    .sub { font-size:12px; fill:#55606F; }
    .axis { stroke:#55606F; stroke-width:1.4; }
    .axistxt { font-size:12px; fill:#55606F; }
    .gridline { stroke:#E3E0D8; stroke-width:1; }
    .point { stroke:#14213D; stroke-width:1.6; }
    .ptxt { font-size:12.5px; font-weight:700; fill:#14213D; }
    .card { fill:#FFFFFF; stroke:#E3E0D8; stroke-width:1.3; }
    .cardtitle { font-size:12.5px; font-weight:700; fill:#14213D; }
    .cardtxt { font-size:10.5px; fill:#55606F; }
  </style>
  <marker id="arrx" markerWidth="9" markerHeight="9" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#55606F"/></marker>
</defs>
<rect width="1100" height="760" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 27 · UITROLSTRATEGIEËN</text>
<text x="40" y="64" class="title">Figuur 27.5 — Vier uitrolstrategieën met kosten en risicoreductie naast elkaar</text>
<text x="40" y="86" class="sub">Elke strategie heeft een prijs; geen enkele scoort hoog op risicoreductie tegen lage kosten (§27.6).</text>

<!-- Scatter plot: x = kosten, y = risicoreductie -->
<g>
  <!-- grid -->
  <line x1="140" y1="140" x2="140" y2="480" class="gridline"/>
  <line x1="290" y1="140" x2="290" y2="480" class="gridline"/>
  <line x1="440" y1="140" x2="440" y2="480" class="gridline"/>
  <line x1="590" y1="140" x2="590" y2="480" class="gridline"/>
  <line x1="140" y1="140" x2="140" y2="480" class="gridline"/>
  <line x1="140" y1="200" x2="640" y2="200" class="gridline"/>
  <line x1="140" y1="280" x2="640" y2="280" class="gridline"/>
  <line x1="140" y1="360" x2="640" y2="360" class="gridline"/>
  <line x1="140" y1="440" x2="640" y2="440" class="gridline"/>

  <!-- axes -->
  <line x1="140" y1="480" x2="660" y2="480" class="axis" marker-end="url(#arrx)"/>
  <line x1="140" y1="480" x2="140" y2="120" class="axis" marker-end="url(#arrx)"/>
  <text x="400" y="515" text-anchor="middle" class="axistxt">Kosten (tijd, geld, complexiteit) →</text>
  <text x="60" y="300" text-anchor="middle" class="axistxt" transform="rotate(-90 60 300)">Risicoreductie →</text>

  <!-- Shadow run: lage kosten, lage/matige risicoreductie -->
  <circle cx="220" cy="400" r="12" class="point" fill="#CFE0F2"/>
  <text x="220" y="380" text-anchor="middle" class="ptxt">Shadow run</text>

  <!-- Parallelle uitvoering: middel kosten, middel-hoge risicoreductie -->
  <circle cx="380" cy="260" r="12" class="point" fill="#6FA3D6"/>
  <text x="380" y="240" text-anchor="middle" class="ptxt">Parallelle uitvoering</text>

  <!-- Gefaseerde overgang: hogere kosten, hoge risicoreductie -->
  <circle cx="520" cy="180" r="12" class="point" fill="#2563A8"/>
  <text x="520" y="160" text-anchor="middle" class="ptxt">Gefaseerde overgang</text>
  <text x="520" y="198" text-anchor="middle" class="cardtxt">per populatie</text>

  <!-- Terugvalscenario: lage kosten als voorbereid, maar losstaand -->
  <circle cx="240" cy="200" r="12" class="point" fill="#E9A13B"/>
  <text x="240" y="182" text-anchor="middle" class="ptxt">Terugvalscenario</text>
</g>

<!-- Explanatory cards -->
<rect x="700" y="130" width="340" height="115" class="card" rx="6"/>
<text x="716" y="152" class="cardtitle">Shadow run (deel 16, §16.5)</text>
<text x="716" y="170" class="cardtxt">Nieuwe regel draait parallel, zonder</text>
<text x="716" y="184" class="cardtxt">bindende uitkomst; uitkomsten vergeleken.</text>
<text x="716" y="202" class="cardtxt" style="font-weight:700; fill:#14213D;">Prijs: tijd, zonder direct voordeel —</text>
<text x="716" y="216" class="cardtxt" style="font-weight:700; fill:#14213D;">oude regel blijft leidend tijdens de test.</text>
<text x="716" y="234" class="cardtxt">Risicoreductie: laag-matig (nog geen bindende uitkomst).</text>

<rect x="700" y="255" width="340" height="115" class="card" rx="6"/>
<text x="716" y="277" class="cardtitle">Parallelle uitvoering</text>
<text x="716" y="295" class="cardtxt">Beide versies tijdelijk bindend, elk voor</text>
<text x="716" y="309" class="cardtxt">een deel van de populatie, met expliciete</text>
<text x="716" y="323" class="cardtxt">overgangsregel.</text>
<text x="716" y="341" class="cardtxt" style="font-weight:700; fill:#14213D;">Prijs: twee regelsets tegelijk beheren.</text>
<text x="716" y="359" class="cardtxt">Risicoreductie: matig-hoog.</text>

<rect x="700" y="380" width="340" height="115" class="card" rx="6"/>
<text x="716" y="402" class="cardtitle">Gefaseerde overgang per populatie</text>
<text x="716" y="420" class="cardtxt">Nieuwe regel eerst voor een beperkte,</text>
<text x="716" y="434" class="cardtxt">goed gemonitorde groep; uitbreiding</text>
<text x="716" y="448" class="cardtxt">naarmate het vertrouwen groeit.</text>
<text x="716" y="466" class="cardtxt" style="font-weight:700; fill:#14213D;">Prijs: extra complexiteit — twee</text>
<text x="716" y="480" class="cardtxt" style="font-weight:700; fill:#14213D;">regelsets tegelijk in productie.</text>

<rect x="700" y="505" width="340" height="115" class="card" rx="6"/>
<text x="716" y="527" class="cardtitle">Terugvalscenario</text>
<text x="716" y="545" class="cardtxt">Uitgewerkt pad terug naar de oude</text>
<text x="716" y="559" class="cardtxt">regel als de nieuwe onverwacht fout</text>
<text x="716" y="573" class="cardtxt">blijkt.</text>
<text x="716" y="591" class="cardtxt" style="font-weight:700; fill:#8A5A12;">Prijs bij ontbreken: de duurste keuze</text>
<text x="716" y="605" class="cardtxt" style="font-weight:700; fill:#8A5A12;">van allemaal zodra hij nodig blijkt.</text>

<rect x="60" y="560" width="620" height="150" class="card" rx="6"/>
<text x="80" y="584" class="cardtitle" style="font-size:13px;">Geen enkele strategie is gratis</text>
<text x="80" y="606" class="cardtxt" style="font-size:11.5px;">De vier posities in de grafiek laten zien dat kosten en risicoreductie</text>
<text x="80" y="624" class="cardtxt" style="font-size:11.5px;">meestal samen oplopen. Bij een stelselovergang met een harde deadline</text>
<text x="80" y="642" class="cardtxt" style="font-size:11.5px;">(1 januari 2028, casusdossier §8) is de vraag niet "welke strategie is</text>
<text x="80" y="660" class="cardtxt" style="font-size:11.5px;">goedkoop", maar welke risicoreductie de organisatie zich kan permitteren</text>
<text x="80" y="678" class="cardtxt" style="font-size:11.5px;">niet te nemen — en welke strategieën te combineren zijn (§27.7).</text>
</svg>
