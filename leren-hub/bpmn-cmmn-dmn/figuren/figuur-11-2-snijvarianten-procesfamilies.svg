<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:13px; font-weight:700; fill:#FBFAF7; text-anchor:middle; }
      .sub { font-size:12px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:22px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .blk { stroke:#14213D; stroke-width:1.5; }
      .lbl-sm { font-size:10px; font-weight:700; fill:#14213D; }
      .lbl-xs { font-size:9.3px; font-weight:700; fill:#14213D; text-anchor:middle; }
      .caption { font-size:12px; font-weight:700; fill:#55606F; }
      .reuse-arrow { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrBlue); }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrBlue" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <pattern id="hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="7" height="7" fill="#FBF6E9"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#6FA3D6" stroke-width="1.6"/>
    </pattern>
</defs>
<rect width="960" height="620" class="paper"/>
