<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 480" font-family="'DM Sans', Arial, sans-serif" width="1180" height="480" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .pool { fill:#FFFFFF; stroke:#14213D; stroke-width:1.5; }
    .pool-name { font-size:12px; font-weight:700; fill:#14213D; }
    .task { fill:#CFE0F2; stroke:#14213D; stroke-width:1.4; }
    .task-label { font-size:11px; fill:#14213D; text-anchor:middle; }
    .seq { stroke:#14213D; stroke-width:1.6; fill:none; marker-end:url(#seqarr); }
    .seq-bad { stroke:#14213D; stroke-width:1.6; fill:none; marker-end:url(#seqarr); }
    .msg { stroke:#55606F; stroke-width:1.3; stroke-dasharray:4 3; fill:none; marker-end:url(#msgarr); marker-start:url(#msgcirc); }
    .icon { stroke:#14213D; stroke-width:1.2; fill:none; stroke-linejoin:round; stroke-linecap:round; }
    .label { font-size:14px; font-weight:700; fill:#14213D; }
    .sub { font-size:11.5px; fill:#55606F; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    .footer { font-size:11.5px; fill:#55606F; }
    .badge-fout { fill:#E9A13B; }
    .badge-goed { fill:#2563A8; }
    .badge-label { font-size:12.5px; font-weight:700; fill:#FBFAF7; text-anchor:middle; }
    .panel-caption { font-size:12px; fill:#14213D; font-weight:700; text-anchor:middle; }
    .warn-zone { fill:#FBF6E9; stroke:#E9A13B; stroke-width:1.4; stroke-dasharray:4 3; }
  </style>
  <marker id="seqarr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#14213D"/></marker>
  <marker id="msgarr" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#55606F" stroke-width="1.3"/></marker>
  <marker id="msgcirc" markerWidth="8" markerHeight="8" refX="3" refY="3" orient="auto"><circle cx="3" cy="3" r="2.6" fill="#FBFAF7" stroke="#55606F" stroke-width="1.1"/></marker>
  <symbol id="ic-send" viewBox="0 0 20 16"><rect x="0.5" y="3.5" width="17" height="11" class="icon"/><polyline points="0.5,3.5 9,10 17.5,3.5" class="icon"/><path d="M12,3 L19,0.5 M19,0.5 L16.5,1 M19,0.5 L18.3,3" class="icon"/></symbol>
  <symbol id="ic-gear" viewBox="0 0 18 18"><circle cx="9" cy="9" r="4" class="icon"/><circle cx="9" cy="9" r="1.5" fill="#14213D"/><g class="icon"><line x1="9" y1="1" x2="9" y2="4"/><line x1="9" y1="14" x2="9" y2="17"/><line x1="1" y1="9" x2="4" y2="9"/><line x1="14" y1="9" x2="17" y2="9"/><line x1="3.2" y1="3.2" x2="5.3" y2="5.3"/><line x1="12.7" y1="12.7" x2="14.8" y2="14.8"/><line x1="14.8" y1="3.2" x2="12.7" y2="5.3"/><line x1="5.3" y1="12.7" x2="3.2" y2="14.8"/></g></symbol>
</defs>
<rect width="1180" height="480" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 03 · BPMN-NOTATIE</text>
<text x="40" y="64" class="title">Figuur 3.2 — Fout versus goed: hetzelfde fragment over de poolgrens</text>
<text x="40" y="84" class="sub">Dezelfde twee taken, twee keer verbonden — één keer fout, één keer correct (reader §3.2, slide 8)</text>

<!-- PANEL FOUT -->
<rect x="30" y="110" width="540" height="330" fill="none" stroke="#E3E0D8" stroke-width="1.5" rx="4"/>
<rect x="50" y="128" width="70" height="26" rx="13" class="badge-fout"/>
<text x="85" y="146" class="badge-label">FOUT</text>

<rect x="70" y="200" width="190" height="100" class="pool" rx="3"/>
<text x="80" y="220" class="pool-name">Deelnemer</text>
<line x1="70" y1="228" x2="260" y2="228" stroke="#14213D" stroke-width="1"/>
<rect x="90" y="245" width="150" height="45" rx="9" class="task"/>
<use href="#ic-send" x="98" y="252" width="18" height="14"/>
<text x="165" y="272" class="task-label">Adreswijziging indienen</text>

<rect x="350" y="200" width="190" height="100" class="pool" rx="3"/>
<text x="360" y="220" class="pool-name">Meridiaan</text>
<line x1="350" y1="228" x2="540" y2="228" stroke="#14213D" stroke-width="1"/>
<rect x="370" y="245" width="150" height="45" rx="9" class="task"/>
<use href="#ic-gear" x="378" y="251" width="18" height="18"/>
<text x="445" y="272" class="task-label">Mutatie registreren</text>

<rect x="255" y="255" width="100" height="30" class="warn-zone" rx="4"/>
<line x1="240" y1="267" x2="370" y2="267" class="seq-bad"/>
<polygon points="305,240 315,258 295,258" fill="#FBFAF7" stroke="#E9A13B" stroke-width="1.6"/>
<text x="305" y="253" text-anchor="middle" font-size="13" font-weight="700" fill="#8a5a12">!</text>
<text x="305" y="330" text-anchor="middle" class="panel-caption">sequence flow over de poolgrens</text>
<text x="305" y="348" text-anchor="middle" class="footer">niet toegestaan — een pool kan een andere pool geen volgorde opleggen</text>

<!-- PANEL GOED -->
<rect x="610" y="110" width="540" height="330" fill="none" stroke="#E3E0D8" stroke-width="1.5" rx="4"/>
<rect x="630" y="128" width="75" height="26" rx="13" class="badge-goed"/>
<text x="667" y="146" class="badge-label">GOED</text>

<rect x="650" y="200" width="190" height="100" class="pool" rx="3"/>
<text x="660" y="220" class="pool-name">Deelnemer</text>
<line x1="650" y1="228" x2="840" y2="228" stroke="#14213D" stroke-width="1"/>
<rect x="670" y="245" width="150" height="45" rx="9" class="task"/>
<use href="#ic-send" x="678" y="252" width="18" height="14"/>
<text x="745" y="272" class="task-label">Adreswijziging indienen</text>

<rect x="930" y="200" width="190" height="100" class="pool" rx="3"/>
<text x="940" y="220" class="pool-name">Meridiaan</text>
<line x1="930" y1="228" x2="1120" y2="228" stroke="#14213D" stroke-width="1"/>
<rect x="950" y="245" width="150" height="45" rx="9" class="task"/>
<use href="#ic-gear" x="958" y="251" width="18" height="18"/>
<text x="1025" y="272" class="task-label">Mutatie registreren</text>

<path d="M820,267 C 860,267 890,267 946,267" class="msg"/>
<text x="885" y="330" text-anchor="middle" class="panel-caption">message flow tussen de pools</text>
<text x="885" y="348" text-anchor="middle" class="footer">correct — gestippeld, geen volgordebetekenis, alleen een bericht</text>

<text x="40" y="420" class="footer">De harde regel (reader §3.2): sequence flow blijft altijd binnen één pool. Tussen pools loopt uitsluitend message flow.</text>
</svg>
