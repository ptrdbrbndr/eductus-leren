<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" font-family="'DM Sans', Arial, sans-serif" width="1120" height="560" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .lane { fill:#FFFFFF; stroke:#14213D; stroke-width:1.4; }
    .task { fill:#CFE0F2; stroke:#14213D; stroke-width:1.4; }
    .task-label { font-size:10.5px; fill:#14213D; }
    .evt-start { fill:#FBFAF7; stroke:#14213D; stroke-width:1.6; }
    .evt-end { fill:#FBFAF7; stroke:#14213D; stroke-width:2.8; }
    .gw { fill:#EEF2F7; stroke:#14213D; stroke-width:1.5; }
    .dataobj { fill:#FBF6E9; stroke:#14213D; stroke-width:1.4; }
    .seq { stroke:#14213D; stroke-width:1.5; fill:none; marker-end:url(#seqarr); }
    .assoc { stroke:#55606F; stroke-width:1.3; stroke-dasharray:3 3; fill:none; }
    .refarrow { stroke:#2563A8; stroke-width:1.8; fill:none; marker-end:url(#refarr); stroke-dasharray:5 3; }
    .label { font-size:14px; font-weight:700; fill:#14213D; }
    .sub { font-size:11.5px; fill:#55606F; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    .annot { stroke:#55606F; stroke-width:1.2; fill:none; }
    .dictbox { fill:#FFFFFF; stroke:#2563A8; stroke-width:1.8; }
    .dicttitle { font-size:12px; font-weight:700; fill:#2563A8; }
    .badbox { fill:#F6DCD9; stroke:#B9433D; stroke-width:1.3; }
  </style>
  <marker id="seqarr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#14213D"/></marker>
  <marker id="refarr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
</defs>
<rect width="1120" height="560" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 14 · BPMN-PROCESNOTATIE</text>
<text x="40" y="64" class="title">Figuur 14.3 — Verwijzen naar het gegevenswoordenboek in plaats van herhalen</text>

<!-- process fragment -->
<rect x="40" y="100" width="560" height="180" class="lane" rx="4"/>
<text x="55" y="122" class="sub" style="font-weight:700">Procesmodel — fragment Deelnemermutaties</text>

<circle cx="75" cy="195" r="13" class="evt-start"/>
<rect x="115" y="175" width="110" height="40" rx="9" class="task"/>
<text x="170" y="199" text-anchor="middle" class="task-label">Mutatie ontvangen</text>
<polygon points="290,175 330,195 290,215 250,195" class="gw"/>
<text x="290" y="199" text-anchor="middle" style="font-size:15px;font-weight:700;fill:#14213D">✕</text>
<text x="290" y="233" text-anchor="middle" class="task-label">Openstaande</text>
<text x="290" y="245" text-anchor="middle" class="task-label">mutatie?</text>
<rect x="410" y="150" width="150" height="34" rx="8" class="task"/>
<text x="485" y="171" text-anchor="middle" class="task-label">Ja — doorzetten</text>
<rect x="410" y="210" width="150" height="34" rx="8" class="task"/>
<text x="485" y="231" text-anchor="middle" class="task-label">Nee — afsluiten</text>

<line x1="88" y1="195" x2="115" y2="195" class="seq"/>
<line x1="225" y1="195" x2="250" y2="195" class="seq"/>
<line x1="330" y1="188" x2="410" y2="167" class="seq"/>
<line x1="330" y1="202" x2="410" y2="227" class="seq"/>

<!-- data object referring to the term, no definition inline -->
<path d="M240,280 h110 v40 h-90 l-20,-16 z" class="dataobj"/>
<text x="295" y="303" text-anchor="middle" class="task-label" style="font-size:9.5px">Openstaande</text>
<text x="295" y="315" text-anchor="middle" class="task-label" style="font-size:9.5px">mutatie</text>
<path d="M290,224 C290,250 293,265 294,278" class="assoc"/>

<!-- reference arrow to dictionary, NOT a definition -->
<path d="M355,300 C480,310 620,320 700,320" class="refarrow"/>
<text x="500" y="345" class="sub" style="font-size:10.5px;fill:#2563A8;font-weight:700">verwijzing — géén definitie herhaald</text>

<!-- dictionary entry -->
<path d="M700,220 h280 v130 h-260 l-20,-20 z M960,220 v20 h20" class="dictbox"/>
<text x="720" y="248" class="dicttitle">Gegevenswoordenboek</text>
<text x="720" y="270" class="sub" style="font-weight:700;fill:#14213D">term: "openstaande mutatie"</text>
<text x="720" y="292" class="sub">definitie: wacht op interne behandeling</text>
<text x="720" y="310" class="sub">óf op reactie van de deelnemer —</text>
<text x="720" y="328" class="sub">zie vastgestelde definitie in het</text>
<text x="720" y="345" class="sub">centrale woordenboek (§14.3)</text>

<text x="40" y="400" class="sub" style="font-weight:700">Waarom dit ertoe doet — het vier-definities-probleem opnieuw</text>
<rect x="40" y="415" width="1040" height="110" rx="6" class="badbox"/>
<text x="60" y="440" class="sub" style="fill:#8f2f28">Zonder verwijzing bouwt elke afdeling haar eigen, impliciete definitie van "openstaande mutatie":</text>
<text x="60" y="460" class="sub" style="fill:#8f2f28">telt een mutatie die op de deelnemer wacht mee, of alleen een mutatie die intern in behandeling is?</text>
<text x="60" y="480" class="sub" style="fill:#8f2f28">Vijf afdelingen met vijf impliciete definities merken dat pas als de rapportages niet meer optellen.</text>
<text x="60" y="504" class="sub" style="fill:#8f2f28">Eén verwijzing naar één vastgestelde term in het gegevenswoordenboek voorkomt dat (§14.3).</text>

</svg>
