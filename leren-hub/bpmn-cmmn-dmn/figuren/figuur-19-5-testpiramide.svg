<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'DM Sans', Arial, sans-serif" width="960" height="640" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    .layer-lbl { font-size:16px; font-weight:700; fill:#FBFAF7; }
    .sub { font-size:10.8px; fill:#55606F; }
    .desc-h { font-size:12.5px; font-weight:700; fill:#14213D; }
    .desc { font-size:11px; fill:#14213D; }
    .conn { stroke:#55606F; stroke-width:1; stroke-dasharray:3 3; }
  </style>
</defs>
<rect width="960" height="640" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 19 · FIGUUR 19.5 · TESTPIRAMIDE</text>
<text x="40" y="64" class="title">De testpiramide voor procesautomatisering</text>

<!-- pyramid: three trapezoids -->
<g transform="translate(90,100)">
  <!-- CASE top -->
  <polygon points="180,0 260,0 300,90 140,90" fill="#E9A13B"/>
  <text x="220" y="52" text-anchor="middle" class="layer-lbl">CASE</text>

  <!-- KETEN middle -->
  <polygon points="140,90 300,90 360,220 80,220" fill="#6FA3D6"/>
  <text x="220" y="162" text-anchor="middle" class="layer-lbl">KETEN</text>

  <!-- UNIT base -->
  <polygon points="80,220 360,220 420,360 20,360" fill="#2563A8"/>
  <text x="220" y="298" text-anchor="middle" class="layer-lbl">UNIT</text>
</g>

<!-- annotation: CASE -->
<line x1="330" y1="130" x2="470" y2="130" class="conn"/>
<rect x="470" y="100" width="410" height="96" rx="8" fill="#FBF6E9" stroke="#E9A13B" stroke-width="1.3"/>
<text x="486" y="122" class="desc-h">Case zonder vast pad — §19.6</text>
<text x="486" y="140" class="desc">Geen "het juiste pad": scenario's per patroon (§17.5) —</text>
<text x="486" y="156" class="desc">vuren sentries correct, zijn discretionary items op tijd</text>
<text x="486" y="172" class="desc">beschikbaar, worden required elementen afgedwongen?</text>
<text x="486" y="188" class="desc" fill="#55606F">Weinig tests, hoge onderhoudslast, meestal handmatig.</text>

<!-- annotation: KETEN -->
<line x1="390" y1="270" x2="470" y2="270" class="conn"/>
<rect x="470" y="240" width="410" height="96" rx="8" fill="#EEF2F7" stroke="#6FA3D6" stroke-width="1.3"/>
<text x="486" y="262" class="desc-h">Keten — het proces end-to-end — §19.6</text>
<text x="486" y="280" class="desc">Inclusief aanroep van beslisservices en, waar van</text>
<text x="486" y="296" class="desc">toepassing, case tasks. Realistische testdata die de</text>
<text x="486" y="312" class="desc">knelpunten uit deel 12 weerspiegelt.</text>
<text x="486" y="328" class="desc" fill="#55606F">Middelgroot aantal, gedeeltelijk automatiseerbaar.</text>

<!-- annotation: UNIT -->
<line x1="450" y1="410" x2="470" y2="410" class="conn"/>
<rect x="470" y="380" width="410" height="96" rx="8" fill="#EEF2F7" stroke="#2563A8" stroke-width="1.3"/>
<text x="486" y="402" class="desc-h">Unit — één decision, één taak — §19.6</text>
<text x="486" y="420" class="desc">Geïsoleerd getest met de testsets uit deel 15, §15.7:</text>
<text x="486" y="436" class="desc">dekkingsgraad onderbouwd, regressie bij elke</text>
<text x="486" y="452" class="desc">regelwijziging (§16.6).</text>
<text x="486" y="468" class="desc" fill="#55606F">Veel tests, snel, volledig automatiseerbaar.</text>

<rect x="90" y="500" width="800" height="90" rx="8" fill="#FFFFFF" stroke="#E3E0D8"/>
<text x="110" y="524" class="desc-h">Waarom deze volgorde</text>
<text x="110" y="544" class="desc">Onderin: veel, snel, goedkoop, volledig automatiseerbaar. Bovenin: weinig, traag, kostbaar —</text>
<text x="110" y="562" class="desc">en bij case-tests fundamenteel anders van aard, omdat er geen enkel "het juiste pad" bestaat</text>
<text x="110" y="580" class="desc">om doorheen te lopen. Een teststrategie kiest bewust hoeveel gewicht elke laag krijgt.</text>
</svg>
