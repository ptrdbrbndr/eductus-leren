  <circle cx="90" cy="150" r="14" class="evt"/>
  <rect x="140" y="118" width="240" height="64" rx="8" class="task"/>
  <circle cx="156" cy="132" r="4.3" fill="none" stroke="#14213D" stroke-width="1.1"/>
  <path d="M149,145 q7,-9 14,0" fill="none" stroke="#14213D" stroke-width="1.1"/>
