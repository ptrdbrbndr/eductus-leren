<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 940" font-family="'DM Sans', Arial, sans-serif" width="1260" height="940" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    .panelhead { fill:#CFE0F2; }
    .panelbox { fill:#FFFFFF; stroke:#14213D; stroke-width:1.3; }
    .panelnum { font-size:13px; font-weight:700; fill:#14213D; }
    .panelsub { font-size:11px; fill:#55606F; }
    .lanebox { fill:#FFFFFF; stroke:#14213D; stroke-width:1.4; }
    .lanediv { stroke:#14213D; stroke-width:1; }
    .lanelabel { font-size:11.5px; font-weight:700; fill:#14213D; }
    .evt { fill:#FBFAF7; stroke:#14213D; stroke-width:1.3; }
    .evtend { fill:#FBFAF7; stroke:#14213D; stroke-width:2.8; }
    .task { fill:#FFFFFF; stroke:#14213D; stroke-width:1.4; }
    .taskdisc { fill:#FFFFFF; stroke:#14213D; stroke-width:1.4; stroke-dasharray:4 3; }
    .tasktxt { font-size:11px; fill:#14213D; }
    .tasktxtsm { font-size:9.5px; fill:#14213D; }
    .tasksub { font-size:9px; fill:#55606F; }
    .gw { fill:#FFFFFF; stroke:#14213D; stroke-width:1.4; }
    .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
    .arrowsm { stroke:#55606F; stroke-width:1.3; fill:none; marker-end:url(#arrsm); }
    .dashedflow { stroke:#55606F; stroke-width:1.1; stroke-dasharray:3 3; fill:none; marker-end:url(#arropen); }
    .annot { font-size:10.5px; fill:#55606F; font-style:italic; }
    .flowlabel { font-size:9.5px; fill:#55606F; }
    .stagetab { fill:#FFFFFF; stroke:#14213D; stroke-width:1.3; }
    .stagebox { fill:#FFFFFF; stroke:#14213D; stroke-width:1.3; }
    .sentry { fill:#FFFFFF; stroke:#14213D; stroke-width:1.3; }
  </style>
  <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
  <marker id="arrsm" markerWidth="8" markerHeight="8" refX="5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="#55606F"/></marker>
  <marker id="arropen" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#55606F" stroke-width="1"/></marker>
</defs>
<rect width="1260" height="940" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 26 · BPMN- EN CMMN-NOTATIE</text>
<text x="40" y="66" class="title">Figuur 26.2 — De vier controlpatronen in BPMN en CMMN naast elkaar</text>

<!-- ============ PANEL 1: VIEROGENPRINCIPE ============ -->
<g transform="translate(30,110)">
  <rect x="0" y="0" width="590" height="380" class="panelbox" rx="8"/>
  <rect x="0" y="0" width="590" height="38" class="panelhead" rx="8"/>
  <rect x="0" y="20" width="590" height="18" fill="#CFE0F2"/>
  <text x="16" y="16" class="panelnum">1 · VIEROGENPRINCIPE (BPMN)</text>
  <text x="16" y="32" class="panelsub">tweede user task, andere performer, keurt de eerste goed</text>

  <rect x="10" y="46" width="572" height="316" class="lanebox" rx="6"/>
  <line x1="10" y1="204" x2="582" y2="204" class="lanediv"/>
  <text x="22" y="66" class="lanelabel">Behandelaar</text>
  <text x="22" y="224" class="lanelabel">Tweede beoordelaar</text>

  <circle cx="110" cy="125" r="14" class="evt"/>
  <rect x="160" y="95" width="210" height="58" rx="8" class="task"/>
  <circle cx="176" cy="107" r="4.3" fill="none" stroke="#14213D" stroke-width="1.1"/>
  <path d="M169,120 q7,-9 14,0" fill="none" stroke="#14213D" stroke-width="1.1"/>
  <text x="194" y="120" class="tasktxt" style="font-weight:700">Aanspraak</text>
  <text x="194" y="136" class="tasktxt">vaststellen</text>
  <path d="M124,125 L160,125" class="arrow"/>

  <rect x="160" y="255" width="230" height="58" rx="8" class="task"/>
  <circle cx="176" cy="267" r="4.3" fill="none" stroke="#14213D" stroke-width="1.1"/>
  <path d="M169,280 q7,-9 14,0" fill="none" stroke="#14213D" stroke-width="1.1"/>
  <text x="194" y="280" class="tasktxt" style="font-weight:700">Aanspraak controleren</text>
  <text x="194" y="296" class="tasktxt">en autoriseren</text>

  <path d="M265,153 L265,204 L275,255" class="arrow"/>
  <circle cx="520" cy="284" r="14" class="evtend"/>
  <path d="M390,284 L506,284" class="arrow"/>
  <text x="160" y="335" class="annot">performer(taak 2) ≠ performer(taak 1)</text>
</g>

<!-- ============ PANEL 2: FUNCTIESCHEIDING ============ -->
<g transform="translate(640,110)">
  <rect x="0" y="0" width="590" height="380" class="panelbox" rx="8"/>
  <rect x="0" y="0" width="590" height="38" class="panelhead" rx="8"/>
  <rect x="0" y="20" width="590" height="18" fill="#CFE0F2"/>
  <text x="16" y="16" class="panelnum">2 · FUNCTIESCHEIDING (BPMN)</text>
  <text x="16" y="32" class="panelsub">wie invoert, keurt niet zelf goed — twee gescheiden lanes</text>

  <rect x="10" y="46" width="572" height="316" class="lanebox" rx="6"/>
  <line x1="10" y1="204" x2="582" y2="204" class="lanediv"/>
