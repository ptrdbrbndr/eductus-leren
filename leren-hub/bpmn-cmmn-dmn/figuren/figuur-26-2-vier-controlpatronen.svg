  <path d="M260,182 L260,236" class="dashedflow"/>
  <ellipse cx="260" cy="246" rx="55" ry="11" fill="#FFFFFF" stroke="#14213D" stroke-width="1.3"/>
  <path d="M205,246 L205,290" stroke="#14213D" stroke-width="1.3"/>
  <path d="M315,246 L315,290" stroke="#14213D" stroke-width="1.3"/>
  <path d="M205,290 A55,11 0 0 0 315,290" fill="none" stroke="#14213D" stroke-width="1.3"/>
  <text x="260" y="270" text-anchor="middle" class="tasktxtsm" style="font-weight:700">Beoordelingslog</text>
  <text x="260" y="316" text-anchor="middle" class="tasksub">(verplicht, niet overslaanbaar)</text>
</g>

