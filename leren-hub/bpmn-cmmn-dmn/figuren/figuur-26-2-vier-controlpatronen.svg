  <text x="194" y="120" class="tasktxt" style="font-weight:700">Mutatie</text>
  <text x="194" y="136" class="tasktxt">invoeren</text>
  <path d="M124,125 L160,125" class="arrow"/>

  <rect x="160" y="255" width="190" height="58" rx="8" class="task"/>
  <circle cx="176" cy="267" r="4.3" fill="none" stroke="#14213D" stroke-width="1.1"/>
  <path d="M169,280 q7,-9 14,0" fill="none" stroke="#14213D" stroke-width="1.1"/>
  <text x="194" y="280" class="tasktxt" style="font-weight:700">Mutatie</text>
  <text x="194" y="296" class="tasktxt">goedkeuren</text>
  <path d="M255,153 L255,204 L255,255" class="arrow"/>

  <path d="M430,260 L406,284 L430,308 L454,284 Z" class="gw"/>
  <path d="M420,274 L440,294 M440,274 L420,294" stroke="#14213D" stroke-width="1.3"/>
  <path d="M350,284 L406,284" class="arrow"/>

  <circle cx="520" cy="255" r="13" class="evtend"/>
  <circle cx="520" cy="315" r="13" class="evtend"/>
  <path d="M454,284 C480,270 500,258 507,255" class="arrow"/>
  <path d="M454,284 C480,298 500,312 507,315" class="arrow"/>
  <text x="460" y="248" class="flowlabel">akkoord</text>
  <text x="456" y="335" class="flowlabel">afwijking</text>

  <text x="160" y="345" class="annot">vastgelegd in modelleerrichtlijn §11.3</text>
</g>

<!-- ============ PANEL 3: VERPLICHTE VASTLEGGING ============ -->
<g transform="translate(30,510)">
  <rect x="0" y="0" width="590" height="380" class="panelbox" rx="8"/>
  <rect x="0" y="0" width="590" height="38" class="panelhead" rx="8"/>
  <rect x="0" y="20" width="590" height="18" fill="#CFE0F2"/>
