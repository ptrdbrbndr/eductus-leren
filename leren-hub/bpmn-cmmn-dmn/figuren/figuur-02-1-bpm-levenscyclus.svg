<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="'DM Sans', Arial, sans-serif" width="960" height="660" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .navy-fill { fill:#14213D; }
      .blue-fill { fill:#CFE0F2; }
      .blue-dark { fill:#2563A8; }
      .amber-fill { fill:#E9A13B; }
      .amber-light { fill:#FBF6E9; }
      .node-stroke { stroke:#14213D; stroke-width:2; }
      .label { font-size:15px; font-weight:700; fill:#14213D; text-anchor:middle; }
      .label-light { font-size:15px; font-weight:700; fill:#FBFAF7; text-anchor:middle; }
      .num { font-size:11px; font-weight:700; fill:#55606F; text-anchor:middle; }
      .num-light { font-size:11px; font-weight:700; fill:#FBF6E9; text-anchor:middle; }
      .sub { font-size:12.5px; fill:#55606F; }
      .sub-bold { font-size:12.5px; fill:#14213D; font-weight:700; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:26px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:2; fill:none; marker-end:url(#arr); }
      .arrow-broken { stroke:#B5432A; stroke-width:2.5; fill:none; stroke-dasharray:6 5; marker-end:url(#arrRed); }
      .leader { stroke:#E9A13B; stroke-width:1.5; fill:none; stroke-dasharray:3 3; }
      .box-text { font-size:12.5px; fill:#5A3B0E; }
      .box-title { font-size:13px; font-weight:700; fill:#5A3B0E; }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#B5432A"/></marker>
</defs>
<rect width="960" height="660" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 02 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">De BPM-levenscyclus: rond, niet lineair</text>

<!-- edges (order: 1 Ontdekken -> 2 Modelleren -> 3 Analyseren -> 4 Ontwerpen -> 5 Uitvoeren -> 6 Monitoren -> 7 Verbeteren -> 1) -->
<path d="M534.1,146.0 L581.9,169.0" class="arrow"/>
<path d="M649.4,253.5 L661.6,306.5" class="arrow"/>
<path d="M637.5,411.9 L604.5,453.1" class="arrow"/>
<path d="M507,500 L453,500" class="arrow"/>
<!-- de zwakke schakel: uitvoeren -> monitoren -->
<path d="M355.5,453.1 L322.5,411.9" class="arrow-broken"/>
<path d="M298.4,306.5 L310.6,253.5" class="arrow"/>
<path d="M378.1,169.0 L425.9,146.0" class="arrow"/>

<!-- nodes -->
<!-- 1 Ontdekken -->
<circle cx="480" cy="120" r="55" class="blue-fill node-stroke"/>
<text x="480" y="112" class="num">1</text>
<text x="480" y="130" class="label">Ontdekken</text>

<!-- 2 Modelleren -->
<circle cx="636" cy="195" r="55" class="blue-fill node-stroke"/>
<text x="636" y="187" class="num">2</text>
<text x="636" y="205" class="label">Modelleren</text>

<!-- 3 Analyseren -->
<circle cx="675" cy="365" r="55" class="blue-fill node-stroke"/>
<text x="675" y="357" class="num">3</text>
<text x="675" y="375" class="label">Analyseren</text>

<!-- 4 Ontwerpen -->
<circle cx="567" cy="500" r="55" class="blue-fill node-stroke"/>
<text x="567" y="492" class="num">4</text>
<text x="567" y="510" class="label">Ontwerpen</text>

<!-- 5 Uitvoeren -->
<circle cx="393" cy="500" r="55" class="blue-fill node-stroke"/>
<text x="393" y="492" class="num">5</text>
<text x="393" y="510" class="label">Uitvoeren</text>

<!-- 6 Monitoren - uitgelicht -->
<circle cx="285" cy="365" r="58" class="amber-fill" stroke="#14213D" stroke-width="3"/>
<text x="285" y="356" class="num-light">6</text>
<text x="285" y="375" class="label-light">Monitoren</text>

<!-- 7 Verbeteren -->
<circle cx="324" cy="195" r="55" class="blue-fill node-stroke"/>
<text x="324" y="187" class="num">7</text>
<text x="324" y="205" class="label">Verbeteren</text>

<!-- waarschuwingsbox Meridiaan, gekoppeld aan Monitoren -->
<path d="M240,405 L150,470" class="leader"/>
<rect x="30" y="470" width="330" height="150" rx="10" class="amber-light" stroke="#E9A13B" stroke-width="1.5"/>
<g transform="translate(50,486)">
  <path d="M10,0 L20,18 L0,18 Z" fill="#E9A13B" stroke="#5A3B0E" stroke-width="1"/>
  <text x="10" y="15" text-anchor="middle" font-size="11" font-weight="700" fill="#5A3B0E">!</text>
</g>
<text x="75" y="500" class="box-title">Casus — Meridiaan Pensioen N.V.</text>
<text x="50" y="522" class="box-text">2019: extern bureau levert een bibliotheek</text>
<text x="50" y="540" class="box-text">van 140 processen in BPMN op.</text>
<text x="50" y="562" class="box-text">2023: DNB-onderzoek — een derde van de</text>
<text x="50" y="580" class="box-text">modellen klopt niet meer met de praktijk.</text>
<text x="50" y="602" class="box-text" font-weight="700" fill="#B5432A">Er is nooit gemonitord: fase 6 ontbrak.</text>

<!-- legenda -->
<rect x="660" y="480" width="270" height="150" rx="10" fill="#EEF2F7" stroke="#CFE0F2" stroke-width="1"/>
<text x="680" y="504" class="box-title" fill="#14213D">Leeswijzer</text>
<circle cx="690" cy="524" r="8" class="amber-fill" stroke="#14213D" stroke-width="1.5"/>
<text x="708" y="529" class="sub">fase waar organisaties het vaakst stoppen</text>
<path d="M680,552 L710,552" class="arrow-broken"/>
<text x="720" y="557" class="sub">de zwakste schakel in de cyclus</text>
<text x="680" y="582" class="sub">De cyclus is rond: modelleren is een</text>
<text x="680" y="600" class="sub">project, monitoren is doorlopend werk —</text>
<text x="680" y="618" class="sub">daarom wordt juist dáár begroot noch gedaan.</text>
</svg>
