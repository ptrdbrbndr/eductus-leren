<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 660" font-family="'DM Sans', Arial, sans-serif" width="1300" height="660" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .panel { fill:#FFFFFF; stroke:#E3E0D8; stroke-width:1.5; }
      .paneltitle { font-size:13px; font-weight:700; fill:#2563A8; }
      .stage { fill:#FBF6E9; stroke:#14213D; stroke-width:1.5; }
      .task { fill:#CFE0F2; stroke:#14213D; stroke-width:1.4; }
      .task-highlight { fill:#CFE0F2; stroke:#E9A13B; stroke-width:2.4; }
      .disc-item { fill:none; stroke:#14213D; stroke-width:1.3; stroke-dasharray:4 3; }
      .milestone { fill:#EEF2F7; stroke:#14213D; stroke-width:1.4; }
      .sentry { fill:#FBFAF7; stroke:#14213D; stroke-width:1.4; }
      .evt-start { fill:#FBFAF7; stroke:#14213D; stroke-width:1.6; }
      .evt-end { fill:#FBFAF7; stroke:#14213D; stroke-width:3; }
      .icon { stroke:#14213D; stroke-width:1.1; fill:none; }
      .seq { stroke:#14213D; stroke-width:1.6; fill:none; marker-end:url(#seqarr); }
      .task-label { font-size:10.5px; fill:#14213D; }
      .label { font-size:12.5px; font-weight:700; fill:#14213D; }
      .sub { font-size:10.5px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .decision { fill:#EEF2F7; stroke:#14213D; stroke-width:1.6; }
      .inputdata { fill:#FBFAF7; stroke:#14213D; stroke-width:1.3; }
      .infoarrow { stroke:#14213D; stroke-width:1.5; fill:none; marker-end:url(#seqarr); }
      .koppel-arrow { stroke:#E9A13B; stroke-width:2; fill:none; stroke-dasharray:6 4; marker-end:url(#amberarr); }
      .badge { fill:#E9A13B; stroke:#14213D; stroke-width:1.2; }
      .num { font-size:12px; font-weight:700; fill:#14213D; }
    </style>
    <marker id="seqarr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#14213D"/></marker>
    <marker id="amberarr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
</defs>
<rect width="1300" height="660" class="paper"/>
<text x="40" y="30" class="kicker">DEEL 08 · MERIDIAAN PENSIOEN N.V.</text>
<text x="40" y="58" class="title">Figuur 8.3 — Van casemodel naar proces naar beslissing: de herberekening</text>

<!-- PANEL 1: CMMN casemodel -->
<rect x="20" y="80" width="380" height="560" class="panel" rx="4"/>
<text x="36" y="106" class="paneltitle">1. CASEMODEL — CMMN</text>
<text x="36" y="122" class="sub">Klachtbehandeling (deel 7)</text>

<path d="M50,145 h150 l14,14 h146 v451 h-310 z" class="stage"/>
<text x="205" y="168" text-anchor="middle" class="label">Klachtbehandeling</text>

<!-- milestone start -->
<rect x="80" y="185" width="180" height="34" rx="17" class="milestone"/>
<text x="170" y="206" text-anchor="middle" class="task-label">Klacht ontvangen</text>

<!-- discretionary item -->
<rect x="80" y="240" width="240" height="46" rx="8" class="disc-item"/>
<text x="200" y="260" text-anchor="middle" class="task-label">Informatie opvragen</text>
<text x="200" y="274" text-anchor="middle" class="sub" style="font-size:9px">discretionary item</text>

<!-- process task highlighted -->
<rect x="80" y="310" width="240" height="60" rx="8" class="task-highlight"/>
<rect x="80" y="310" width="6" height="60" fill="#14213D"/>
<rect x="88" y="310" width="4" height="60" fill="#14213D"/>
<text x="205" y="335" text-anchor="middle" class="task-label" style="font-weight:700">Herberekening</text>
<text x="205" y="349" text-anchor="middle" class="task-label" style="font-weight:700">aanvragen</text>
<text x="205" y="362" text-anchor="middle" class="sub" style="font-size:9px">process task</text>
<polygon points="320,340 332,332 344,340 332,348" class="sentry"/>

<!-- discretionary item 2 -->
<rect x="80" y="390" width="240" height="46" rx="8" class="disc-item"/>
<text x="200" y="410" text-anchor="middle" class="task-label">Klacht afwijzen</text>
<text x="200" y="424" text-anchor="middle" class="sub" style="font-size:9px">discretionary item</text>

<!-- milestone end -->
<rect x="80" y="450" width="180" height="34" rx="17" class="milestone"/>
<text x="170" y="471" text-anchor="middle" class="task-label">Klacht afgehandeld</text>

<text x="50" y="520" class="sub">De behandelaar kiest óf en wanneer</text>
<text x="50" y="535" class="sub">de herberekening wordt gestart —</text>
<text x="50" y="550" class="sub">dat is de discretie van CMMN.</text>

<!-- badge koppelpunt 1 -->
<circle cx="395" cy="340" r="17" class="badge"/>
<text x="395" y="345" text-anchor="middle" class="num">1</text>

<!-- PANEL 2: BPMN process -->
<rect x="440" y="80" width="420" height="560" class="panel" rx="4"/>
<text x="456" y="106" class="paneltitle">2. PROCES — BPMN</text>
<text x="456" y="122" class="sub">Herberekening (aangeroepen door process task)</text>

<rect x="456" y="150" width="388" height="420" class="panel" rx="6" stroke="#14213D" stroke-width="1.3"/>

<circle cx="490" cy="220" r="14" class="evt-start"/>
<text x="490" y="248" text-anchor="middle" class="sub" style="font-size:9px">start</text>

<rect x="530" y="200" width="120" height="44" rx="10" class="task"/>
<path d="M537,208 h20 v14 l-10,8 -10,-8 z" class="icon"/>
<text x="590" y="228" text-anchor="middle" class="task-label">Gegevens ophalen</text>

<line x1="504" y1="220" x2="530" y2="220" class="seq"/>
<path d="M650,222 C670,222 675,300 700,300" class="seq"/>

<!-- business rule task highlighted -->
<rect x="700" y="278" width="130" height="46" rx="10" class="task-highlight"/>
<rect x="706" y="284" width="20" height="14" fill="none" stroke="#14213D" stroke-width="1"/>
<line x1="706" y1="291" x2="726" y2="291" stroke="#14213D" stroke-width="0.8"/>
<line x1="716" y1="284" x2="716" y2="298" stroke="#14213D" stroke-width="0.8"/>
<text x="765" y="298" text-anchor="middle" class="task-label" style="font-weight:700">Herberekenen</text>
<text x="765" y="312" text-anchor="middle" class="sub" style="font-size:9px">business rule task</text>

<path d="M765,278 C765,240 650,240 590,244" class="seq"/>

<path d="M700,301 C670,301 650,340 590,340" class="seq" marker-end="none"/>
<rect x="530" y="318" width="120" height="44" rx="10" class="task"/>
<path d="M537,326 h20 v14 l-10,8 -10,-8 z" class="icon"/>
<text x="590" y="345" text-anchor="middle" class="task-label">Valideren</text>
<path d="M700,301 C660,320 650,330 650,340" class="seq"/>

<rect x="530" y="392" width="120" height="44" rx="10" class="task"/>
<path d="M537,400 h20 v14 l-10,8 -10,-8 z" class="icon"/>
<text x="590" y="419" text-anchor="middle" class="task-label">Vastleggen</text>
<path d="M590,362 C590,375 590,385 590,392" class="seq"/>

<circle cx="795" cy="414" r="15" class="evt-end"/>
<path d="M650,414 C700,414 750,414 780,414" class="seq"/>

<text x="456" y="595" class="sub">Eenmaal gestart volgt het proces</text>
<text x="456" y="610" class="sub">een vaste volgorde — dat is BPMN.</text>

<!-- badge koppelpunt 2 -->
<circle cx="845" cy="301" r="17" class="badge"/>
<text x="845" y="306" text-anchor="middle" class="num">2</text>

<!-- PANEL 3: DMN decision -->
<rect x="900" y="80" width="380" height="560" class="panel" rx="4"/>
<text x="916" y="106" class="paneltitle">3. BESLISSING — DMN</text>
<text x="916" y="122" class="sub">Rekenregels herberekening</text>

<rect x="960" y="180" width="260" height="56" class="decision"/>
<text x="1090" y="212" text-anchor="middle" class="label" style="font-size:12px">Rekenresultaat</text>
<text x="1090" y="228" text-anchor="middle" class="sub" style="font-size:9px">decision</text>

<rect x="960" y="330" width="120" height="40" rx="20" class="inputdata"/>
<text x="1020" y="354" text-anchor="middle" class="task-label" style="font-size:9.5px">Pensioengegevens</text>

<rect x="1100" y="330" width="120" height="40" rx="20" class="inputdata"/>
<text x="1160" y="354" text-anchor="middle" class="task-label" style="font-size:9.5px">Rekenparameters</text>

<line x1="1020" y1="330" x2="1050" y2="236" class="infoarrow"/>
<line x1="1160" y1="330" x2="1120" y2="236" class="infoarrow"/>

<text x="916" y="600" class="sub">Binnen het proces bepaalt een</text>
<text x="916" y="615" class="sub">beslistabel het rekenresultaat.</text>

<!-- Koppelpunt arrows between panels -->
<path d="M415,340 C425,340 435,340 440,340" class="koppel-arrow"/>
<text x="405" y="105" class="label" style="font-size:11px;fill:#E9A13B">koppelpunt 1</text>

<path d="M862,301 C875,301 888,301 900,240" class="koppel-arrow"/>
<text x="862" y="105" class="label" style="font-size:11px;fill:#E9A13B">koppelpunt 2</text>

</svg>
