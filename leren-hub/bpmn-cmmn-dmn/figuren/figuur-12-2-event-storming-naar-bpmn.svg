<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" font-family="'DM Sans', Arial, sans-serif" width="1600" height="760" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .wand { fill:#EEF2F7; stroke:#E3E0D8; stroke-width:1.5; }
    .sticky { fill:#FBF6E9; stroke:#E9A13B; stroke-width:1.8; }
    .pin { fill:#14213D; }
    .sticky-text { font-size:12.5px; font-weight:600; fill:#14213D; }
    .task { fill:#CFE0F2; stroke:#14213D; stroke-width:1.4; }
    .task-label { font-size:11.5px; fill:#14213D; font-weight:600; }
    .evt-start { fill:#FBFAF7; stroke:#14213D; stroke-width:1.6; }
    .evt-end { fill:#FBFAF7; stroke:#14213D; stroke-width:3; }
    .evt-label { font-size:11px; fill:#14213D; font-weight:600; }
    .gateway { fill:#FBFAF7; stroke:#14213D; stroke-width:1.6; }
    .gw-label { font-size:11.5px; fill:#14213D; font-weight:700; }
    .icon { stroke:#14213D; stroke-width:1.15; fill:none; }
    .seq { stroke:#14213D; stroke-width:1.6; fill:none; marker-end:url(#seqarr); }
    .flowtag { font-size:10.5px; font-weight:700; fill:#55606F; }
    .loopnote { font-size:10px; fill:#55606F; font-style:italic; }
    .label { font-size:14px; font-weight:700; fill:#14213D; }
    .sub { font-size:12px; fill:#55606F; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    .paneltitle { font-size:14px; font-weight:700; fill:#2563A8; }
    .panelsub { font-size:11px; fill:#55606F; }
    .arrowshaft { fill:#2563A8; }
    .arrowlabel { font-size:12px; font-weight:700; fill:#14213D; letter-spacing:.05em; }
  </style>
  <marker id="seqarr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#14213D"/></marker>
</defs>
<rect width="1600" height="760" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 12 · BPMN</text>
<text x="40" y="64" class="title">Figuur 12.2 — Van event storming-wand naar BPMN-fragment</text>
<text x="40" y="86" class="sub">Werkgevermutaties: dezelfde vijf domain events, eerst informeel opgehaald, dan formeel vastgelegd.</text>

<!-- LEFT: event storming wall -->
<text x="50" y="118" class="paneltitle">EVENT STORMING-WAND — WERKGEVERMUTATIES</text>
<text x="50" y="134" class="panelsub">losse post-its op tijdlijnvolgorde, opgehaald in de sessie</text>
<rect x="30" y="150" width="540" height="450" rx="4" class="wand"/>

<!-- sticky notes -->
<g transform="rotate(-3 132 209)">
  <rect x="55" y="165" width="155" height="88" rx="3" class="sticky"/>
  <circle cx="132" cy="171" r="4" class="pin"/>
  <text x="132" y="205" text-anchor="middle" class="sticky-text">Werkgeverwijziging</text>
  <text x="132" y="223" text-anchor="middle" class="sticky-text">ontvangen</text>
</g>

<g transform="rotate(2 325 239)">
  <rect x="250" y="195" width="150" height="88" rx="3" class="sticky"/>
  <circle cx="325" cy="201" r="4" class="pin"/>
  <text x="325" y="235" text-anchor="middle" class="sticky-text">Gegevens</text>
  <text x="325" y="253" text-anchor="middle" class="sticky-text">gevalideerd</text>
</g>

<g transform="rotate(-5 185 344)">
  <rect x="110" y="300" width="150" height="88" rx="3" class="sticky"/>
  <circle cx="185" cy="306" r="4" class="pin"/>
  <text x="185" y="340" text-anchor="middle" class="sticky-text">Afwijking</text>
  <text x="185" y="358" text-anchor="middle" class="sticky-text">geconstateerd</text>
</g>

<g transform="rotate(3 387 377)">
  <rect x="300" y="330" width="175" height="95" rx="3" class="sticky"/>
  <circle cx="387" cy="336" r="4" class="pin"/>
  <text x="387" y="373" text-anchor="middle" class="sticky-text">Wijziging verwerkt in</text>
  <text x="387" y="391" text-anchor="middle" class="sticky-text">polisadministratie</text>
</g>

<g transform="rotate(-2 220 504)">
  <rect x="140" y="460" width="160" height="88" rx="3" class="sticky"/>
  <circle cx="220" cy="466" r="4" class="pin"/>
  <text x="220" y="500" text-anchor="middle" class="sticky-text">Werkgever</text>
  <text x="220" y="518" text-anchor="middle" class="sticky-text">geïnformeerd</text>
</g>

<!-- middle arrow -->
<rect x="590" y="352" width="80" height="36" class="arrowshaft"/>
<polygon points="670,332 670,408 705,370" class="arrowshaft"/>
<text x="637" y="322" text-anchor="middle" class="arrowlabel">VERTAALSLAG</text>

<!-- RIGHT: BPMN fragment -->
<text x="730" y="118" class="paneltitle">BPMN-FRAGMENT</text>
<text x="730" y="134" class="panelsub">notatie-correcte vertaling van dezelfde vijf events</text>

<!-- start event -->
<circle cx="760" cy="260" r="16" class="evt-start"/>
<path d="M751,254 H769 V266 H751 Z M751,254 L760,261 L769,254" class="icon"/>
<text x="760" y="300" text-anchor="middle" class="evt-label">Werkgeverwijziging</text>
<text x="760" y="314" text-anchor="middle" class="evt-label">ontvangen</text>
<line x1="776" y1="260" x2="807" y2="260" class="seq"/>

<!-- user task -->
<rect x="810" y="234" width="140" height="52" rx="10" class="task"/>
<circle cx="827" cy="246" r="3.2" class="icon"/>
<path d="M819,258 Q827,249 835,258" class="icon"/>
<text x="885" y="257" text-anchor="middle" class="task-label">Gegevens</text>
<text x="885" y="271" text-anchor="middle" class="task-label">valideren</text>
<line x1="950" y1="260" x2="981" y2="260" class="seq"/>

<!-- gateway -->
<polygon points="1010,234 1036,260 1010,286 984,260" class="gateway"/>
<path d="M1000,250 L1020,270 M1020,250 L1000,270" stroke="#14213D" stroke-width="1.5"/>
<text x="1010" y="220" text-anchor="middle" class="gw-label">Afwijking?</text>
<text x="1012" y="308" class="flowtag">ja</text>
<line x1="1036" y1="260" x2="1067" y2="260" class="seq"/>
<text x="1042" y="250" class="flowtag">nee</text>

<!-- service task -->
<rect x="1090" y="234" width="190" height="52" rx="10" class="task"/>
<g transform="translate(1108,248)">
  <circle r="5.2" class="icon"/>
  <circle r="1.8" class="icon"/>
  <line x1="0" y1="-5.2" x2="0" y2="-7.6" class="icon"/>
  <line x1="4.5" y1="-2.6" x2="6.6" y2="-3.8" class="icon"/>
  <line x1="4.5" y1="2.6" x2="6.6" y2="3.8" class="icon"/>
  <line x1="0" y1="5.2" x2="0" y2="7.6" class="icon"/>
  <line x1="-4.5" y1="2.6" x2="-6.6" y2="3.8" class="icon"/>
  <line x1="-4.5" y1="-2.6" x2="-6.6" y2="-3.8" class="icon"/>
</g>
<text x="1195" y="257" text-anchor="middle" class="task-label">Wijziging verwerken in</text>
<text x="1195" y="271" text-anchor="middle" class="task-label">polisadministratie</text>
<line x1="1280" y1="260" x2="1311" y2="260" class="seq"/>

<!-- send task -->
<rect x="1315" y="234" width="150" height="52" rx="10" class="task"/>
<path d="M1323,240 H1341 V254 H1323 Z M1323,240 L1332,247 L1341,240" class="icon"/>
<path d="M1333,251 L1344,262 M1344,262 L1344,255 M1344,262 L1337,262" class="icon"/>
<text x="1390" y="257" text-anchor="middle" class="task-label">Werkgever</text>
<text x="1390" y="271" text-anchor="middle" class="task-label">informeren</text>
<line x1="1465" y1="260" x2="1497" y2="260" class="seq"/>

<!-- end event -->
<circle cx="1520" cy="260" r="17" class="evt-end"/>

<!-- ja-branch: rework loop -->
<path d="M1010,286 L1010,320 L1015,320 L1015,347" class="seq"/>
<rect x="930" y="350" width="170" height="52" rx="10" class="task"/>
<text x="1015" y="372" text-anchor="middle" class="task-label">Afwijking</text>
<text x="1015" y="386" text-anchor="middle" class="task-label">afhandelen</text>

<path d="M930,376 L800,376 L800,180 L880,180 L880,231" class="seq"/>
<text x="805" y="175" class="loopnote">terug naar Gegevens valideren — herbeoordeling na afhandeling</text>

<text x="800" y="655" text-anchor="middle" class="sub" style="font-style:italic">de vertaling dwingt een keuze af die tijdens de sessie nog open bleef: gaat de afwijking terug naar validatie, of loopt hij gewoon door?</text>

</svg>
