<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 660" font-family="'DM Sans', Arial, sans-serif" width="980" height="660" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .col { fill:#FFFFFF; stroke:#E3E0D8; stroke-width:1.5; }
      .col-warn { fill:#FBF6E9; stroke:#E9A13B; stroke-width:2; }
      .headband { fill:#CFE0F2; }
      .headband-warn { fill:#E9A13B; }
      .headnum { font-size:22px; font-weight:700; fill:#14213D; font-family:'Cormorant Garamond', Georgia, serif; }
      .headnum-light { font-size:22px; font-weight:700; fill:#FBFAF7; font-family:'Cormorant Garamond', Georgia, serif; }
      .heading { font-size:15px; font-weight:700; fill:#14213D; }
      .heading-light { font-size:15px; font-weight:700; fill:#FBFAF7; }
      .body { font-size:12px; fill:#55606F; }
      .exlabel { font-size:11px; font-weight:700; fill:#2563A8; letter-spacing:.06em; }
      .exlabel-warn { font-size:11px; font-weight:700; fill:#8a5a12; letter-spacing:.06em; }
      .exbox { fill:#EEF2F7; stroke:#CFE0F2; stroke-width:1.2; }
      .exbox-warn { fill:#FFFFFF; stroke:#E9A13B; stroke-width:1.4; }
      .extext { font-size:11.5px; fill:#14213D; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .sub { font-size:12px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .badge { font-size:10px; font-weight:700; fill:#FBFAF7; }
    </style>
</defs>
<rect width="980" height="660" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 24 · CONCEPTDIAGRAM</text>
<text x="40" y="62" class="title">Figuur 24.2 — Drie manieren waarop tailoring misgaat</text>
<text x="40" y="82" class="sub">Elke kolom: het mechanisme (§24.5) en een voorbeeld uit het programma Stelselovergang.</text>

<!-- Column 1: Te veel afwijken -->
<rect x="30" y="105" width="290" height="530" class="col" rx="6"/>
<rect x="30" y="105" width="290" height="56" class="headband" rx="6"/>
<rect x="30" y="135" width="290" height="26" fill="#CFE0F2"/>
<text x="52" y="142" class="headnum">1</text>
<text x="90" y="140" class="heading">Te veel afwijken</text>
<text x="52" y="192" class="body">Het referentiemodel wordt zo</text>
<text x="52" y="209" class="body">aangepast dat niemand het meer</text>
<text x="52" y="226" class="body">herkent als variant van de</text>
<text x="52" y="243" class="body">standaard. De gedeelde taal</text>
<text x="52" y="260" class="body">(§24.1) gaat verloren.</text>

<rect x="50" y="290" width="250" height="320" class="exbox" rx="4"/>
<text x="66" y="312" class="exlabel">VOORBEELD</text>
<text x="66" y="336" class="extext">Meridiaan past APQC PCF zo</text>
<text x="66" y="353" class="extext">drastisch aan voor de eigen</text>
<text x="66" y="370" class="extext">waardeoverdrachtketen dat de</text>
<text x="66" y="387" class="extext">procescodes, indeling en</text>
<text x="66" y="404" class="extext">terminologie niet meer op de</text>
<text x="66" y="421" class="extext">PCF-structuur lijken.</text>
<text x="66" y="450" class="extext">Nieuwe medewerkers en</text>
<text x="66" y="467" class="extext">externe auditors herkennen</text>
<text x="66" y="484" class="extext">het niet meer als PCF-variant</text>
<text x="66" y="501" class="extext">— het voordeel van een</text>
<text x="66" y="518" class="extext">gedeelde, herkenbare taal met</text>
<text x="66" y="535" class="extext">andere PCF-gebruikers is weg.</text>

<!-- Column 2: Te weinig afwijken -->
<rect x="345" y="105" width="290" height="530" class="col" rx="6"/>
<rect x="345" y="105" width="290" height="56" class="headband" rx="6"/>
<rect x="345" y="135" width="290" height="26" fill="#CFE0F2"/>
<text x="367" y="142" class="headnum">2</text>
<text x="405" y="140" class="heading">Te weinig afwijken</text>
<text x="367" y="192" class="body">Het referentiemodel wordt star</text>
<text x="367" y="209" class="body">overgenomen ondanks dat de</text>
<text x="367" y="226" class="body">praktijk afwijkt — precies de</text>
<text x="367" y="243" class="body">valkuil uit §24.1: schijnzekerheid</text>
<text x="367" y="260" class="body">die in de praktijk wordt genegeerd.</text>

<rect x="365" y="290" width="250" height="320" class="exbox" rx="4"/>
<text x="381" y="312" class="exlabel">VOORBEELD</text>
<text x="381" y="336" class="extext">Meridiaan neemt BIAN</text>
<text x="381" y="353" class="extext">ongewijzigd over voor</text>
<text x="381" y="370" class="extext">klantcontactprocessen, terwijl</text>
<text x="381" y="387" class="extext">pensioendeelnemers structureel</text>
<text x="381" y="404" class="extext">andere contactmomenten hebben</text>
<text x="381" y="421" class="extext">dan bankklanten (jaarlijks</text>
<text x="381" y="438" class="extext">pensioenoverzicht, geen</text>
<text x="381" y="455" class="extext">transacties).</text>
<text x="381" y="484" class="extext">Het model past niet op de</text>
<text x="381" y="501" class="extext">werkelijke praktijk en wordt op</text>
<text x="381" y="518" class="extext">de werkvloer stilzwijgend</text>
<text x="381" y="535" class="extext">genegeerd.</text>

<!-- Column 3: Ongedocumenteerd afwijken (highlighted, most dangerous) -->
<rect x="660" y="105" width="290" height="530" class="col-warn" rx="6"/>
<rect x="660" y="105" width="290" height="56" class="headband-warn" rx="6"/>
<rect x="660" y="135" width="290" height="26" fill="#E9A13B"/>
<text x="682" y="142" class="headnum-light">3</text>
<text x="720" y="140" class="heading-light">Ongedocumenteerd afwijken</text>
<text x="682" y="192" class="body">De meest voorkomende en de</text>
<text x="682" y="209" class="body">gevaarlijkste: afwijkingen</text>
<text x="682" y="226" class="body">ontstaan geleidelijk, zonder</text>
<text x="682" y="243" class="body">bewuste beslissing en zonder</text>
<text x="682" y="260" class="body">vastlegging.</text>

<rect x="680" y="290" width="250" height="320" class="exbox-warn" rx="4"/>
<text x="696" y="312" class="exlabel-warn">VOORBEELD</text>
<text x="696" y="336" class="extext">Het projectteam wijkt geleidelijk</text>
<text x="696" y="353" class="extext">af van de ketenstandaard voor</text>
<text x="696" y="370" class="extext">waardeoverdracht — telkens een</text>
<text x="696" y="387" class="extext">kleine aanpassing per deelproject,</text>
<text x="696" y="404" class="extext">zonder besluit of vastlegging.</text>
<text x="696" y="433" class="extext">Na twee jaar weet niemand meer</text>
<text x="696" y="450" class="extext">welk deel van het model nog</text>
<text x="696" y="467" class="extext">standaard is en welk deel</text>
<text x="696" y="484" class="extext">Meridiaan-specifiek is geworden</text>
<text x="696" y="501" class="extext">(§24.5) — tot een ketenpartner de</text>
<text x="696" y="518" class="extext">koppeling breekt en niemand kan</text>
<text x="696" y="535" class="extext">verklaren waarom.</text>

<rect x="680" y="570" width="250" height="45" fill="#14213D" rx="4"/>
<text x="805" y="592" text-anchor="middle" class="badge" style="font-size:11px">Tegenmaatregel §24.5:</text>
<text x="805" y="606" text-anchor="middle" class="badge" style="font-size:11px">wat, waarom, wie besliste — vastleggen</text>

</svg>
