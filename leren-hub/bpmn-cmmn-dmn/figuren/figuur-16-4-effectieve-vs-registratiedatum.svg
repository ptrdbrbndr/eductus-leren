<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 480" font-family="'DM Sans', Arial, sans-serif" width="1040" height="480" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .axis { stroke:#14213D; stroke-width:1.6; }
    .tick { stroke:#B9C2CE; stroke-width:1; }
    .monthlabel { font-size:10px; fill:#55606F; text-anchor:middle; }
    .axistitle { font-size:12.5px; font-weight:700; fill:#14213D; }
    .gapband { fill:#FCE9C9; opacity:.7; }
    .markeramber { fill:#E9A13B; stroke:#14213D; stroke-width:1.4; }
    .markerblue { fill:#2563A8; stroke:#14213D; stroke-width:1.4; }
    .markerlabel { font-size:11px; font-weight:700; fill:#14213D; }
    .markersub { font-size:10px; fill:#55606F; }
    .bracket { stroke:#B5761F; stroke-width:1.4; fill:none; }
    .brackettxt { font-size:11.5px; font-weight:700; fill:#B5761F; text-anchor:middle; }
    .label { font-size:14px; font-weight:700; fill:#14213D; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    .sub { font-size:12px; fill:#55606F; }
    .note { font-size:11px; fill:#55606F; }
  </style>
  <marker id="dot" markerWidth="8" markerHeight="8" refX="4" refY="4"><circle cx="4" cy="4" r="3" fill="#14213D"/></marker>
</defs>
<rect width="1040" height="480" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 16 · TIJDLIJN</text>
<text x="40" y="64" class="title">Figuur 16.4 — Effectieve datum versus registratiedatum</text>
<text x="40" y="86" class="sub">Een regelwijziging die met terugwerkende kracht geldt: het moment van gelden wijkt af van het moment van invoeren (§16.3, §16.5).</text>

<!-- Month grid (shared reference, Jan-Dec) -->
<g>
<line x1="120" y1="140" x2="920" y2="140" class="tick"/>
<text x="120" y="130" class="monthlabel">jan</text>
<text x="190" y="130" class="monthlabel">feb</text>
<text x="260" y="130" class="monthlabel">mrt</text>
<text x="330" y="130" class="monthlabel">apr</text>
<text x="400" y="130" class="monthlabel">mei</text>
<text x="470" y="130" class="monthlabel">jun</text>
<text x="540" y="130" class="monthlabel">jul</text>
<text x="610" y="130" class="monthlabel">aug</text>
<text x="680" y="130" class="monthlabel">sep</text>
<text x="750" y="130" class="monthlabel">okt</text>
<text x="820" y="130" class="monthlabel">nov</text>
<text x="890" y="130" class="monthlabel">dec</text>
</g>

<!-- gap band across both axes -->
<rect x="540" y="150" width="140" height="220" class="gapband"/>

<!-- Axis 1: effectieve datum -->
<text x="40" y="200" class="axistitle">Effectieve datum</text>
<text x="40" y="215" class="markersub">(wanneer de regel in de werkelijkheid geldt)</text>
<line x1="120" y1="240" x2="920" y2="240" class="axis" marker-end="url(#dot)"/>
<circle cx="540" cy="240" r="10" class="markeramber"/>
<line x1="540" y1="240" x2="540" y2="190" stroke="#E9A13B" stroke-width="1.4"/>
<text x="540" y="180" class="markerlabel" text-anchor="middle">1 juli</text>
<text x="540" y="264" class="markersub" text-anchor="middle">nieuwe kortingsstaffel</text>
<text x="540" y="278" class="markersub" text-anchor="middle">wordt effectief</text>

<!-- Axis 2: registratiedatum -->
<text x="40" y="330" class="axistitle">Registratiedatum</text>
<text x="40" y="345" class="markersub">(wanneer het systeem de regel kent)</text>
<line x1="120" y1="370" x2="920" y2="370" class="axis" marker-end="url(#dot)"/>
<circle cx="680" cy="370" r="10" class="markerblue"/>
<line x1="680" y1="370" x2="680" y2="410" stroke="#2563A8" stroke-width="1.4"/>
<text x="680" y="428" class="markerlabel" text-anchor="middle">1 september</text>
<text x="680" y="346" class="markersub" text-anchor="middle">regel wordt in de</text>
<text x="680" y="360" class="markersub" text-anchor="middle" style="fill:#2563A8;">repository ingevoerd</text>

<!-- bracket between the two events -->
<path d="M540,150 H680" class="bracket"/>
<path d="M540,150 V160" class="bracket"/>
<path d="M680,150 V160" class="bracket"/>
<text x="610" y="118" class="brackettxt">2 maanden kloof</text>
<text x="610" y="102" class="brackettxt" style="font-size:10.5px">= terugwerkende kracht (§16.5)</text>

<text x="40" y="452" class="note">Tussen 1 juli en 1 september zijn dossiers afgehandeld met de oude staffel — die dossiers gelden nu als</text>
<text x="40" y="468" class="note">"met terugwerkende kracht onjuist" en moeten worden herzien (uitgewerkt in Figuur 16.5).</text>
</svg>
