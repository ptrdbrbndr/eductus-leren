<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 700" font-family="'DM Sans', Arial, sans-serif" width="1160" height="700" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .panel { fill:#FFFFFF; stroke:#E3E0D8; stroke-width:1.4; }
    .tab { fill:#2563A8; }
    .tab-txt { font-size:12px; font-weight:700; fill:#FBFAF7; }
    .dsub { font-size:11px; fill:#55606F; font-style:italic; }
    .code { font-family:'DM Sans', monospace; font-size:12px; fill:#14213D; }
    .codebox { fill:#EEF2F7; stroke:#CFE0F2; stroke-width:1; }
    .th { fill:#CFE0F2; }
    .thtxt { font-size:10.5px; font-weight:700; fill:#14213D; }
    .cell { fill:#FFFFFF; stroke:#E3E0D8; stroke-width:1; }
    .celltxt { font-size:10.5px; fill:#14213D; }
    .note { font-size:10.5px; fill:#55606F; }
    .label { font-size:14px; font-weight:700; fill:#14213D; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    .sub { font-size:12px; fill:#55606F; }
  </style>
</defs>
<rect width="1160" height="700" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 15 · BOXED EXPRESSIONS (NOTATIE-CORRECT)</text>
<text x="40" y="64" class="title">Figuur 15.2 — De zes boxed expressions naast elkaar</text>
<text x="40" y="86" class="sub">Elke vorm met een kort voorbeeld uit de vervroegde-uittredingberekening van Meridiaan (§15.3).</text>

<!-- ============ PANEL 1: Literal expression ============ -->
<rect x="30" y="110" width="350" height="255" class="panel" rx="5"/>
<rect x="30" y="110" width="180" height="26" class="tab" rx="3"/>
<text x="42" y="128" class="tab-txt">Literal expression</text>
<text x="46" y="156" class="dsub">Decision: Kortingspercentage (stap)</text>
<rect x="46" y="172" width="318" height="46" class="codebox" rx="3"/>
<text x="58" y="200" class="code">jaren_vervroeging * 0.03</text>
<text x="46" y="238" class="note">Eén FEEL-expressie, geen tabelstructuur —</text>
<text x="46" y="254" class="note">geschikt voor een directe berekening.</text>
<text x="46" y="278" class="note">Resultaat: fractie korting per jaar</text>
<text x="46" y="294" class="note">vervroeging (input voor §15.1, D1).</text>

<!-- ============ PANEL 2: Context ============ -->
<rect x="410" y="110" width="350" height="255" class="panel" rx="5"/>
<rect x="410" y="110" width="110" height="26" class="tab" rx="3"/>
<text x="422" y="128" class="tab-txt">Context</text>
<text x="426" y="156" class="dsub">Decision: Deelnemerprofiel (samengesteld)</text>
<rect x="426" y="172" width="160" height="26" class="th"/>
<text x="436" y="190" class="thtxt">naam</text>
<rect x="586" y="172" width="158" height="26" class="th"/>
<text x="596" y="190" class="thtxt">waarde</text>
<rect x="426" y="198" width="160" height="26" class="cell"/>
<text x="436" y="216" class="celltxt">kortingspercentage</text>
<rect x="586" y="198" width="158" height="26" class="cell"/>
<text x="596" y="216" class="celltxt">0.15</text>
<rect x="426" y="224" width="160" height="26" class="cell"/>
<text x="436" y="242" class="celltxt">resterende_periode</text>
<rect x="586" y="224" width="158" height="26" class="cell"/>
<text x="596" y="242" class="celltxt" style="font-size:9.5px">duration("P10Y")</text>
<rect x="426" y="250" width="160" height="26" class="cell"/>
<text x="436" y="268" class="celltxt">partnerpensioen</text>
<rect x="586" y="250" width="158" height="26" class="cell"/>
<text x="596" y="268" class="celltxt">true</text>
<text x="426" y="300" class="note">Bouwt een structuur van naam/waarde-paren —</text>
<text x="426" y="316" class="note">nuttig als een decision meerdere samenhangende</text>
<text x="426" y="332" class="note">waarden tegelijk oplevert.</text>

<!-- ============ PANEL 3: Invocation ============ -->
<rect x="790" y="110" width="340" height="255" class="panel" rx="5"/>
<rect x="790" y="110" width="120" height="26" class="tab" rx="3"/>
<text x="802" y="128" class="tab-txt">Invocation</text>
<text x="806" y="156" class="dsub">Decision: Definitief uitkeringspercentage</text>
<rect x="806" y="172" width="308" height="26" class="codebox"/>
<text x="816" y="190" class="code" style="font-size:11px">Bereken korting vervroeging(...)</text>
<rect x="806" y="200" width="150" height="24" class="th"/>
<text x="814" y="217" class="thtxt">parameter</text>
<rect x="956" y="200" width="158" height="24" class="th"/>
<text x="964" y="217" class="thtxt">waarde</text>
<rect x="806" y="224" width="150" height="24" class="cell"/>
<text x="814" y="241" class="celltxt">jaren</text>
<rect x="956" y="224" width="158" height="24" class="cell"/>
<text x="964" y="241" class="celltxt">jaren_vervroeging</text>
<text x="806" y="278" class="note">Roept het BKM "Bereken korting</text>
<text x="806" y="294" class="note">vervroeging" (§15.5) aan met concrete</text>
<text x="806" y="310" class="note">argumenten — hergebruik zichtbaar</text>
<text x="806" y="326" class="note">in de boxed expression zelf.</text>

<!-- ============ PANEL 4: Relation ============ -->
<rect x="30" y="400" width="350" height="255" class="panel" rx="5"/>
<rect x="30" y="400" width="110" height="26" class="tab" rx="3"/>
<text x="42" y="418" class="tab-txt">Relation</text>
<text x="46" y="446" class="dsub">Referentiedata: Geldige productcodes</text>
<rect x="46" y="462" width="150" height="24" class="th"/>
<text x="54" y="479" class="thtxt">productcode</text>
<rect x="196" y="462" width="168" height="24" class="th"/>
<text x="204" y="479" class="thtxt">omschrijving</text>
<rect x="46" y="486" width="150" height="24" class="cell"/>
<text x="54" y="503" class="celltxt">DB-STD</text>
<rect x="196" y="486" width="168" height="24" class="cell"/>
<text x="204" y="503" class="celltxt" style="font-size:9.5px">Standaard db-regeling</text>
<rect x="46" y="510" width="150" height="24" class="cell"/>
<text x="54" y="527" class="celltxt">DB-VVR</text>
<rect x="196" y="510" width="168" height="24" class="cell"/>
<text x="204" y="527" class="celltxt" style="font-size:9.5px">Vervroegde uittreding</text>
<rect x="46" y="534" width="150" height="24" class="cell"/>
<text x="54" y="551" class="celltxt">CB-FLEX</text>
<rect x="196" y="534" width="168" height="24" class="cell"/>
<text x="204" y="551" class="celltxt" style="font-size:9.5px">Flexibel CB-product</text>
<text x="46" y="588" class="note">Een tabel van waarden zónder regellogica —</text>
<text x="46" y="604" class="note">een statische lijst, geen "als...dan".</text>

<!-- ============ PANEL 5: Function ============ -->
<rect x="410" y="400" width="350" height="255" class="panel" rx="5"/>
<rect x="410" y="400" width="110" height="26" class="tab" rx="3"/>
<text x="422" y="418" class="tab-txt">Function</text>
<text x="426" y="446" class="dsub">BKM-body: Bereken korting vervroeging</text>
<rect x="426" y="462" width="308" height="34" class="codebox"/>
<text x="436" y="483" class="code">parameters: (jaren)</text>
<rect x="426" y="500" width="308" height="34" class="codebox"/>
<text x="436" y="521" class="code">body: jaren * 0.03</text>
<text x="426" y="558" class="note">Definitie van herbruikbare logica — dit is</text>
<text x="426" y="574" class="note">wat een business knowledge model (§15.5)</text>
<text x="426" y="590" class="note">intern bevat; aangeroepen via invocation.</text>

<!-- ============ PANEL 6: Iterator ============ -->
<rect x="790" y="400" width="340" height="255" class="panel" rx="5"/>
<rect x="790" y="400" width="230" height="26" class="tab" rx="3"/>
<text x="802" y="418" class="tab-txt">Iterator (for / every / some)</text>
<text x="806" y="446" class="dsub">Decision: Totaal opbouwjaren (§15.4)</text>
<rect x="806" y="462" width="308" height="46" class="codebox"/>
<text x="816" y="482" class="code" style="font-size:10.5px">for d in dienstverbanden</text>
<text x="816" y="498" class="code" style="font-size:10.5px">return d.jaren</text>
<text x="806" y="530" class="note">lijst in: [{jaren:5}, {jaren:12}, {jaren:3}]</text>
<text x="806" y="546" class="note">lijst uit: [5, 12, 3]</text>
<text x="806" y="570" class="note">Getransformeerde lijst — aggregatie (sum)</text>
<text x="806" y="586" class="note">volgt in Figuur 15.3.</text>
</svg>
