<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 560" font-family="'DM Sans', Arial, sans-serif" width="1160" height="560" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .panel { fill:#FFFFFF; stroke:#E3E0D8; stroke-width:1.5; }
    .task { fill:#CFE0F2; stroke:#14213D; stroke-width:1.4; }
    .task-label { font-size:10.5px; fill:#14213D; }
    .evt-start { fill:#FBFAF7; stroke:#14213D; stroke-width:1.5; }
    .evt-end { fill:#FBFAF7; stroke:#14213D; stroke-width:2.6; }
    .dataobj { fill:#FBF6E9; stroke:#14213D; stroke-width:1.3; }
    .dataobj-bad { fill:#F6DCD9; stroke:#B9433D; stroke-width:1.3; }
    .statelabel { font-size:9.5px; fill:#2563A8; font-weight:700; }
    .statelabel-bad { font-size:9.5px; fill:#B9433D; font-weight:700; }
    .seq { stroke:#14213D; stroke-width:1.5; fill:none; marker-end:url(#seqarr); }
    .assoc { stroke:#55606F; stroke-width:1.2; stroke-dasharray:3 3; fill:none; marker-end:url(#assocarr); }
    .label { font-size:14px; font-weight:700; fill:#14213D; }
    .sub { font-size:11.5px; fill:#55606F; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    .paneltitle { font-size:13px; font-weight:700; }
  </style>
  <marker id="seqarr" markerWidth="8" markerHeight="8" refX="5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="#14213D"/></marker>
  <marker id="assocarr" markerWidth="7" markerHeight="7" refX="5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5" fill="none" stroke="#55606F" stroke-width="1"/></marker>
</defs>
<rect width="1160" height="560" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 14 · CONCEPTDIAGRAM + BPMN-FRAGMENT</text>
<text x="40" y="64" class="title">Figuur 14.2 — Data state: waar het verheldert, waar het vervuilt</text>

<!-- LEFT: verheldert -->
<rect x="30" y="90" width="540" height="440" class="panel" rx="4"/>
<text x="50" y="118" class="paneltitle" style="fill:#2563A8">VERHELDERT — de state markeert een echte transitie</text>

<circle cx="70" cy="230" r="12" class="evt-start"/>
<rect x="100" y="210" width="110" height="40" rx="9" class="task"/>
<text x="155" y="234" text-anchor="middle" class="task-label">Aanvraag ontvangen</text>
<rect x="255" y="210" width="110" height="40" rx="9" class="task"/>
<text x="310" y="234" text-anchor="middle" class="task-label">Beoordelen</text>
<rect x="410" y="210" width="110" height="40" rx="9" class="task"/>
<text x="465" y="234" text-anchor="middle" class="task-label">Uitvoeren</text>
<line x1="82" y1="230" x2="100" y2="230" class="seq"/>
<line x1="210" y1="230" x2="255" y2="230" class="seq"/>
<line x1="365" y1="230" x2="410" y2="230" class="seq"/>

<path d="M120,300 h90 v34 h-72 l-18,-14 z" class="dataobj"/>
<text x="165" y="322" text-anchor="middle" class="statelabel" style="font-size:9px">Aanvraag</text>
<text x="165" y="333" text-anchor="middle" class="statelabel" style="font-size:9px">[ontvangen]</text>
<path d="M155,250 C155,270 160,285 163,298" class="assoc"/>

<path d="M275,300 h100 v34 h-82 l-18,-14 z" class="dataobj"/>
<text x="325" y="322" text-anchor="middle" class="statelabel" style="font-size:9px">Aanvraag</text>
<text x="325" y="333" text-anchor="middle" class="statelabel" style="font-size:9px">[goedgekeurd]</text>
<path d="M310,250 C310,270 320,285 323,298" class="assoc"/>

<text x="60" y="390" class="sub">De toestand verandert betekenisvol — van "ontvangen"</text>
<text x="60" y="408" class="sub">naar "goedgekeurd" — en die overgang is precies wat een</text>
<text x="60" y="426" class="sub">lezer van dit model wil weten: op het moment dat de</text>
<text x="60" y="444" class="sub">beoordeling klaar is, verandert de status van het dossier</text>
<text x="60" y="462" class="sub">op een manier die verderop in het proces (en daarbuiten,</text>
<text x="60" y="480" class="sub">bijvoorbeeld in rapportages) relevant is (§14.2).</text>

<!-- RIGHT: vervuilt -->
<rect x="590" y="90" width="540" height="440" class="panel" rx="4"/>
<text x="610" y="118" class="paneltitle" style="fill:#B9433D">VERVUILT — de state herhaalt alleen de activiteit</text>

<circle cx="620" cy="200" r="11" class="evt-start"/>
<rect x="648" y="182" width="105" height="36" rx="8" class="task"/>
<text x="700" y="204" text-anchor="middle" class="task-label" style="font-size:9.5px">Aanvraag ontvangen</text>
<rect x="790" y="182" width="105" height="36" rx="8" class="task"/>
<text x="842" y="204" text-anchor="middle" class="task-label" style="font-size:9.5px">Aanvraag beoordelen</text>
<rect x="930" y="182" width="115" height="36" rx="8" class="task"/>
<text x="987" y="204" text-anchor="middle" class="task-label" style="font-size:9.5px">Aanvraag uitvoeren</text>
<line x1="631" y1="200" x2="648" y2="200" class="seq"/>
<line x1="753" y1="200" x2="790" y2="200" class="seq"/>
<line x1="895" y1="200" x2="930" y2="200" class="seq"/>

<path d="M660,250 h90 v32 h-72 l-18,-14 z" class="dataobj-bad"/>
<text x="705" y="270" text-anchor="middle" class="statelabel-bad" style="font-size:8.5px">Aanvraag</text>
<text x="705" y="280" text-anchor="middle" class="statelabel-bad" style="font-size:8.5px">[ontvangen]</text>
<path d="M700,218 C700,232 703,240 704,248" class="assoc"/>

<path d="M800,250 h90 v32 h-72 l-18,-14 z" class="dataobj-bad"/>
<text x="845" y="270" text-anchor="middle" class="statelabel-bad" style="font-size:8.5px">Aanvraag</text>
<text x="845" y="280" text-anchor="middle" class="statelabel-bad" style="font-size:8.5px">[beoordeeld]</text>
<path d="M842,218 C842,232 844,240 845,248" class="assoc"/>
<text x="960" y="265" class="statelabel-bad" style="font-size:9px">↑ zelfde als de</text>
<text x="960" y="277" class="statelabel-bad" style="font-size:9px">activiteit ernaast</text>

<path d="M945,250 h90 v32 h-72 l-18,-14 z" class="dataobj-bad"/>
<text x="990" y="270" text-anchor="middle" class="statelabel-bad" style="font-size:8.5px">Aanvraag</text>
<text x="990" y="280" text-anchor="middle" class="statelabel-bad" style="font-size:8.5px">[uitgevoerd]</text>
<path d="M987,218 C987,232 989,240 990,248" class="assoc"/>

<circle cx="1075" cy="200" r="11" class="evt-end"/>
<line x1="1045" y1="200" x2="1063" y2="200" class="seq"/>

<text x="610" y="330" class="sub">Elke activiteit krijgt hier zijn eigen data-object-met-state,</text>
<text x="610" y="348" class="sub">maar de state zegt telkens niets meer dan de activiteit</text>
<text x="610" y="366" class="sub">er al naast zegt: "Aanvraag beoordelen" gevolgd door</text>
<text x="610" y="384" class="sub">"Aanvraag [beoordeeld]" voegt geen informatie toe.</text>
<text x="610" y="402" class="sub">Het diagram vult zich met ruis in plaats van betekenis —</text>
<text x="610" y="420" class="sub">de vuistregel uit §14.2: gebruik state alleen waar de</text>
<text x="610" y="438" class="sub">toestand van de data zelf het aandachtspunt is.</text>

</svg>
