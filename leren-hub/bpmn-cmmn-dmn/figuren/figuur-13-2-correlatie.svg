<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 620" font-family="'DM Sans', Arial, sans-serif" width="1080" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .lane { fill:#FFFFFF; stroke:#14213D; stroke-width:1.5; }
    .lane-title { font-size:12px; font-weight:700; fill:#14213D; }
    .lane-sub { font-size:10.5px; fill:#55606F; }
    .task { fill:#CFE0F2; stroke:#14213D; stroke-width:1.4; }
    .task-label { font-size:10.5px; fill:#14213D; }
    .evt-start { fill:#FBFAF7; stroke:#14213D; stroke-width:1.6; }
    .evt-inter { fill:#FBFAF7; stroke:#14213D; stroke-width:1.2; }
    .evt-inter-wait { fill:#FBF6E9; stroke:#E9A13B; stroke-width:2; }
    .evt-end { fill:#FBFAF7; stroke:#14213D; stroke-width:3; }
    .icon { stroke:#14213D; stroke-width:1.1; fill:none; }
    .seq { stroke:#14213D; stroke-width:1.6; fill:none; marker-end:url(#seqarr); }
    .match { stroke:#2563A8; stroke-width:2.4; fill:none; marker-end:url(#matcharr); }
    .nomatch { stroke:#B9433D; stroke-width:1.6; fill:none; stroke-dasharray:5 4; marker-end:url(#noarr); }
    .keybox { fill:#FBF6E9; stroke:#E9A13B; stroke-width:1.6; }
    .label { font-size:14px; font-weight:700; fill:#14213D; }
    .sub { font-size:12px; fill:#55606F; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    .tag { font-size:10px; font-weight:700; fill:#2563A8; }
    .tagbad { font-size:10px; font-weight:700; fill:#B9433D; }
  </style>
  <marker id="seqarr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#14213D"/></marker>
  <marker id="matcharr" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#2563A8"/></marker>
  <marker id="noarr" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#B9433D"/></marker>
</defs>
<rect width="1080" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 13 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Figuur 13.2 — Correlatie: twee procesinstanties, één binnenkomend bericht</text>
<text x="40" y="86" class="sub">De correlatiesleutel (dossiernummer + polisnummer) bepaalt bij welke instantie het bericht terechtkomt.</text>

<!-- instance 1 -->
<rect x="40" y="120" width="560" height="120" rx="4" class="lane"/>
<text x="56" y="140" class="lane-title">Procesinstantie 1 — dossier 88201, polisnr NL0198213</text>
<circle cx="90" cy="195" r="13" class="evt-start"/>
<rect x="130" y="176" width="100" height="38" rx="9" class="task"/>
<text x="180" y="199" text-anchor="middle" class="task-label">Aanvraag WO</text>
<text x="180" y="211" text-anchor="middle" class="task-label">versturen</text>
<circle cx="330" cy="195" r="14" class="evt-inter-wait"/>
<circle cx="330" cy="195" r="10.5" class="evt-inter-wait"/>
<path d="M323,191 h14 v9 l-7,5 -7,-5 z" stroke="#E9A13B" stroke-width="1.2" fill="none"/>
<text x="330" y="228" text-anchor="middle" class="lane-sub">wacht op bevestiging</text>
<circle cx="470" cy="195" r="14" class="evt-end" opacity="0.35"/>
<line x1="103" y1="195" x2="130" y2="195" class="seq"/>
<line x1="230" y1="195" x2="316" y2="195" class="seq"/>

<!-- instance 2 -->
<rect x="40" y="270" width="560" height="120" rx="4" class="lane"/>
<text x="56" y="290" class="lane-title">Procesinstantie 2 — dossier 88213, polisnr NL0234455</text>
<circle cx="90" cy="345" r="13" class="evt-start"/>
<rect x="130" y="326" width="100" height="38" rx="9" class="task"/>
<text x="180" y="349" text-anchor="middle" class="task-label">Aanvraag WO</text>
<text x="180" y="361" text-anchor="middle" class="task-label">versturen</text>
<circle cx="330" cy="345" r="14" class="evt-inter-wait"/>
<circle cx="330" cy="345" r="10.5" class="evt-inter-wait"/>
<path d="M323,341 h14 v9 l-7,5 -7,-5 z" stroke="#E9A13B" stroke-width="1.2" fill="none"/>
<text x="330" y="378" text-anchor="middle" class="lane-sub">wacht op bevestiging</text>
<circle cx="470" cy="345" r="14" class="evt-end"/>
<path d="M464,339 l12,12 M476,339 l-12,12" stroke="#14213D" stroke-width="1.4"/>
<line x1="103" y1="345" x2="130" y2="345" class="seq"/>
<line x1="230" y1="345" x2="316" y2="345" class="seq"/>

<!-- incoming message -->
<rect x="700" y="220" width="330" height="140" rx="6" class="keybox"/>
<text x="716" y="242" class="lane-title">Binnenkomend bericht</text>
<text x="716" y="258" class="lane-sub">Bevestiging waardeoverdracht</text>
<text x="716" y="284" class="tag">correlatiesleutel:</text>
<text x="716" y="300" class="lane-sub">dossiernr = 88213</text>
<text x="716" y="315" class="lane-sub">polisnr   = NL0234455</text>
<text x="716" y="340" class="lane-sub" style="font-style:italic">→ vergeleken met de sleutel</text>
<text x="716" y="353" class="lane-sub" style="font-style:italic">van elke wachtende instantie</text>

<path d="M700,270 C560,270 400,220 330,209" class="nomatch"/>
<text x="480" y="245" class="tagbad">geen match</text>

<path d="M700,320 C560,340 400,355 330,352" class="match"/>
<text x="480" y="380" class="tag">match → hier bezorgd</text>

</svg>
