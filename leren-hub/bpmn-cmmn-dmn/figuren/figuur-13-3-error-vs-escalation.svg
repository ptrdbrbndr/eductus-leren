<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 660" font-family="'DM Sans', Arial, sans-serif" width="1080" height="660" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .root { fill:#14213D; }
    .rootlabel { font-size:13px; font-weight:700; fill:#FBFAF7; }
    .qbox { fill:#EEF2F7; stroke:#14213D; stroke-width:1.4; }
    .qtext { font-size:11.5px; fill:#14213D; }
    .errbox { fill:#F6DCD9; stroke:#B9433D; stroke-width:1.6; }
    .escbox { fill:#CFE0F2; stroke:#2563A8; stroke-width:1.6; }
    .headtext { font-size:13px; font-weight:700; }
    .leaf { fill:#FFFFFF; stroke:#55606F; stroke-width:1.2; }
    .leaftext { font-size:10.5px; fill:#14213D; }
    .branch { stroke:#55606F; stroke-width:1.4; fill:none; marker-end:url(#arr); }
    .yn { font-size:10px; font-weight:700; fill:#55606F; }
    .label { font-size:14px; font-weight:700; fill:#14213D; }
    .sub { font-size:12px; fill:#55606F; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    .evtcircle { fill:#FBFAF7; stroke:#14213D; stroke-width:1.3; }
  </style>
  <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
</defs>
<rect width="1080" height="660" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 13 · BESLISBOOM</text>
<text x="40" y="64" class="title">Figuur 13.3 — Error of escalation? Vijf situaties uit het Mutatieplatform</text>

<rect x="440" y="90" width="200" height="46" rx="6" class="root"/>
<text x="540" y="110" text-anchor="middle" class="rootlabel">Gebeurtenis tijdens het proces</text>
<text x="540" y="126" text-anchor="middle" class="rootlabel" style="font-size:10px;font-weight:400">is dit een fout of een businessuitkomst?</text>

<rect x="290" y="180" width="270" height="56" rx="6" class="qbox"/>
<text x="425" y="200" text-anchor="middle" class="qtext" style="font-weight:700">Breekt dit het normale verloop op een</text>
<text x="425" y="216" text-anchor="middle" class="qtext" style="font-weight:700">manier die het proces niet kan negeren?</text>

<rect x="710" y="180" width="290" height="56" rx="6" class="qbox"/>
<text x="855" y="200" text-anchor="middle" class="qtext" style="font-weight:700">Valt dit binnen het normale verwachtings-</text>
<text x="855" y="216" text-anchor="middle" class="qtext" style="font-weight:700">patroon, ook al is het geen happy path?</text>

<path d="M480,136 C430,150 425,160 425,180" class="branch"/>
<path d="M600,136 C700,150 800,160 830,180" class="branch"/>

<rect x="230" y="270" width="220" height="44" rx="6" class="errbox"/>
<text x="340" y="289" text-anchor="middle" class="headtext" style="fill:#8f2f28">ERROR EVENT</text>
<text x="340" y="305" text-anchor="middle" class="qtext">technische storing</text>

<rect x="760" y="270" width="220" height="44" rx="6" class="escbox"/>
<text x="870" y="289" text-anchor="middle" class="headtext" style="fill:#14213D">ESCALATION EVENT</text>
<text x="870" y="305" text-anchor="middle" class="qtext">geaccepteerd businessscenario</text>

<path d="M400,236 C370,250 350,258 340,270" class="branch"/>
<text x="358" y="256" class="yn">ja</text>
<path d="M900,236 C900,250 890,258 875,270" class="branch"/>
<text x="895" y="256" class="yn">ja</text>

<!-- five scenario leaves -->
<!-- error side: scenarios 1,3,5 -->
<g>
  <rect x="30" y="360" width="230" height="66" rx="6" class="leaf"/>
  <circle cx="55" cy="382" r="10" class="evtcircle"/>
  <path d="M50,378 l4,8 5,-11" stroke="#B9433D" stroke-width="1.6" fill="none"/>
  <text x="72" y="378" class="leaftext" style="font-weight:700">1. Polisadministratie</text>
  <text x="72" y="392" class="leaftext">reageert niet op de</text>
  <text x="72" y="406" class="leaftext">koppelvlak-aanroep</text>
  <path d="M340,314 C300,330 200,345 145,360" class="branch"/>
</g>

<g>
  <rect x="280" y="360" width="230" height="66" rx="6" class="leaf"/>
  <circle cx="305" cy="382" r="10" class="evtcircle"/>
  <path d="M300,378 l4,8 5,-11" stroke="#B9433D" stroke-width="1.6" fill="none"/>
  <text x="322" y="378" class="leaftext" style="font-weight:700">3. BSN-validatie faalt,</text>
  <text x="322" y="392" class="leaftext">geen enkel vervolgpad</text>
  <text x="322" y="406" class="leaftext">is toegestaan</text>
  <path d="M340,314 C350,330 380,345 395,360" class="branch"/>
</g>

<g>
  <rect x="30" y="450" width="230" height="66" rx="6" class="leaf"/>
  <circle cx="55" cy="472" r="10" class="evtcircle"/>
  <path d="M50,468 l4,8 5,-11" stroke="#B9433D" stroke-width="1.6" fill="none"/>
  <text x="72" y="468" class="leaftext" style="font-weight:700">5. Retourbericht van</text>
  <text x="72" y="482" class="leaftext">ketenpartner mist de</text>
  <text x="72" y="496" class="leaftext">correlatiesleutel (§13.3)</text>
  <path d="M145,426 L145,450" class="branch"/>
</g>

<!-- escalation side: scenarios 2,4 -->
<g>
  <rect x="620" y="360" width="230" height="66" rx="6" class="leaf"/>
  <circle cx="645" cy="382" r="10" class="evtcircle"/>
  <path d="M645,390 v-10 M640,385 l5,-8 5,8" stroke="#2563A8" stroke-width="1.6" fill="none"/>
  <text x="662" y="378" class="leaftext" style="font-weight:700">2. Waardeoverdracht</text>
  <text x="662" y="392" class="leaftext">overschrijdt de norm-</text>
  <text x="662" y="406" class="leaftext">doorlooptijd van 20 dagen</text>
  <path d="M870,314 C870,330 800,345 745,360" class="branch"/>
</g>

<g>
  <rect x="870" y="360" width="180" height="66" rx="6" class="leaf"/>
  <circle cx="895" cy="382" r="10" class="evtcircle"/>
  <path d="M895,390 v-10 M890,385 l5,-8 5,8" stroke="#2563A8" stroke-width="1.6" fill="none"/>
  <text x="912" y="378" class="leaftext" style="font-weight:700">4. Klacht niet afgehan-</text>
  <text x="912" y="392" class="leaftext">deld binnen de wette-</text>
  <text x="912" y="406" class="leaftext">lijke reactietermijn</text>
  <path d="M870,314 C900,330 950,345 960,360" class="branch"/>
</g>

<rect x="620" y="450" width="430" height="86" rx="6" class="qbox" style="fill:#FBF6E9;stroke:#E9A13B"/>
<text x="640" y="472" class="qtext" style="font-weight:700">Waarom het onderscheid ertoe doet:</text>
<text x="640" y="490" class="qtext">een error gaat naar het beheerteam, een escalation naar de</text>
<text x="640" y="506" class="qtext">teamleider of proceseigenaar — en wie ze door elkaar telt in</text>
<text x="640" y="522" class="qtext">de rapportage, kan geen conclusie trekken over capaciteit (§13.4).</text>

</svg>
