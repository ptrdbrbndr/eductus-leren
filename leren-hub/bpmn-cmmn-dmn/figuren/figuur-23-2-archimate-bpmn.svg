<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'DM Sans', Arial, sans-serif" width="960" height="640" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:13px; font-weight:700; fill:#14213D; }
      .label-light { font-size:13px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:11.5px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#14213D; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .relarrow { stroke:#55606F; stroke-width:1.5; fill:none; stroke-dasharray:4 3; marker-end:url(#arr-open); }
      .assign { stroke:#55606F; stroke-width:1.5; fill:none; }
    </style>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#14213D"/></marker>
    <marker id="arr-open" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#55606F" stroke-width="1.3"/></marker>
    <marker id="dot" markerWidth="8" markerHeight="8" refX="4" refY="4"><circle cx="4" cy="4" r="3" fill="#55606F"/></marker>
</defs>
<rect width="960" height="640" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 23 · ARCHIMATE / BPMN</text>
<text x="40" y="64" class="title">Adreswijziging verwerken — ArchiMate naast BPMN</text>

<line x1="480" y1="90" x2="480" y2="600" stroke="#E3E0D8" stroke-width="2"/>

<text x="60" y="100" class="kicker">ARCHIMATE — landschapsniveau (dat en waar)</text>
<text x="500" y="100" class="kicker">BPMN — uitvoeringsniveau (hoe precies)</text>

<!-- ===== LEFT: ArchiMate ===== -->
<!-- business role -->
<rect x="90" y="130" width="220" height="54" rx="4" fill="#FBF6E9" stroke="#14213D" stroke-width="1.5"/>
<rect x="284" y="136" width="16" height="16" fill="none" stroke="#14213D" stroke-width="1.2"/>
<circle cx="292" cy="144" r="4" fill="none" stroke="#14213D" stroke-width="1.2"/>
<text x="200" y="162" text-anchor="middle" class="label">Medewerker Deelnemermutaties</text>
<text x="200" y="176" text-anchor="middle" class="sub">business-rol</text>

<line x1="200" y1="184" x2="200" y2="222" class="assign"/>

<!-- business process element, archimate style with amber chevron icon top-right -->
<rect x="90" y="222" width="220" height="70" rx="4" fill="#CFE0F2" stroke="#14213D" stroke-width="1.5"/>
<rect x="278" y="228" width="22" height="16" fill="#E9A13B" stroke="#14213D" stroke-width="1"/>
<path d="M283,232 L289,236 L283,240 M289,232 L295,236 L289,240" fill="none" stroke="#14213D" stroke-width="1.1"/>
<text x="200" y="258" text-anchor="middle" class="label">Adreswijziging verwerken</text>
<text x="200" y="274" text-anchor="middle" class="sub">businessproces-element</text>

<line x1="200" y1="292" x2="200" y2="330" class="relarrow"/>
<text x="212" y="316" class="sub">ondersteund door</text>

<!-- application component, archimate style -->
<rect x="90" y="330" width="220" height="60" rx="4" fill="#EEF2F7" stroke="#2563A8" stroke-width="1.5"/>
<rect x="82" y="340" width="12" height="10" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.2"/>
<rect x="82" y="358" width="12" height="10" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.2"/>
<text x="200" y="362" text-anchor="middle" class="label">Mutatieplatform</text>
<text x="200" y="378" text-anchor="middle" class="sub">applicatiecomponent</text>

<text x="90" y="420" class="sub" font-style="italic">Toont dat het proces bestaat, wie het uitvoert en</text>
<text x="90" y="436" class="sub" font-style="italic">welke applicatie het ondersteunt — niet de interne</text>
<text x="90" y="452" class="sub" font-style="italic">stap-voor-stap-logica.</text>

<!-- ===== RIGHT: BPMN ===== -->
<rect x="500" y="118" width="420" height="470" rx="4" fill="#FFFFFF" stroke="#14213D" stroke-width="1.75"/>
<rect x="500" y="118" width="26" height="470" fill="#EEF2F7" stroke="#14213D" stroke-width="1.75"/>
<text x="513" y="353" text-anchor="middle" class="label" transform="rotate(-90 513 353)">Deelnemermutaties (Mutatieplatform)</text>

<!-- start event: message start -->
<circle cx="580" cy="165" r="14" fill="#FFFFFF" stroke="#14213D" stroke-width="1.5"/>
<rect x="572" y="159" width="16" height="11" fill="none" stroke="#14213D" stroke-width="1"/>
<path d="M572,159 L580,165 L588,159" fill="none" stroke="#14213D" stroke-width="1"/>
<text x="608" y="169" class="sub">Adreswijziging binnengekomen</text>

<line x1="580" y1="179" x2="580" y2="204" class="arrow"/>

<!-- task 1: user task -->
<rect x="545" y="206" width="180" height="44" rx="8" fill="#CFE0F2" stroke="#14213D" stroke-width="1.5"/>
<circle cx="558" cy="217" r="4.5" fill="none" stroke="#14213D" stroke-width="1.1"/>
<path d="M551,227 q7,-8 14,0" fill="none" stroke="#14213D" stroke-width="1.1"/>
<text x="635" y="232" text-anchor="middle" class="label">Mutatie ontvangen</text>

<line x1="635" y1="250" x2="635" y2="276" class="arrow"/>

<!-- exclusive gateway -->
<polygon points="635,276 655,296 635,316 615,296" fill="#FFFFFF" stroke="#14213D" stroke-width="1.5"/>
<path d="M627,288 L643,304 M643,288 L627,304" stroke="#14213D" stroke-width="1.3"/>

<!-- branch geldig -> down -->
<line x1="635" y1="316" x2="635" y2="340" class="arrow"/>
<text x="642" y="334" class="sub">geldig</text>

<rect x="545" y="342" width="180" height="44" rx="8" fill="#CFE0F2" stroke="#14213D" stroke-width="1.5"/>
<circle cx="558" cy="353" r="5.5" fill="none" stroke="#14213D" stroke-width="1.1"/>
<path d="M553,354 h10 M553,357 h10 M553,360 h6" stroke="#14213D" stroke-width="1"/>
<text x="635" y="368" text-anchor="middle" class="label" font-size="11.5">Adres bijwerken in</text>
<text x="635" y="380" text-anchor="middle" class="label" font-size="11.5">Mutatieplatform</text>

<line x1="635" y1="386" x2="635" y2="410" class="arrow"/>
<circle cx="635" cy="424" r="15" fill="#FFFFFF" stroke="#14213D" stroke-width="3"/>
<text x="670" y="429" class="sub">Mutatie verwerkt</text>

<!-- branch ongeldig -> right to reject end -->
<line x1="655" y1="296" x2="850" y2="296" class="arrow"/>
<text x="800" y="290" class="sub">ongeldig</text>
<circle cx="864" cy="296" r="15" fill="#FFFFFF" stroke="#14213D" stroke-width="3"/>
<text x="820" y="322" text-anchor="middle" class="sub">Geweigerd</text>

<text x="530" y="530" class="sub" font-style="italic">Toont exact hoe het proces verloopt — events,</text>
<text x="530" y="546" class="sub" font-style="italic">gateways, taken, sequence flow — maar zwijgt over</text>
<text x="530" y="562" class="sub" font-style="italic">waar dit proces in het bredere landschap staat.</text>
</svg>
