<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="'DM Sans', Arial, sans-serif" width="960" height="660" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .rootbox { fill:#EEF2F7; stroke:#14213D; stroke-width:1.6; }
      .qbox { fill:#FFFFFF; stroke:#2563A8; stroke-width:1.8; }
      .leafamber { fill:#FBF6E9; stroke:#E9A13B; stroke-width:2.2; }
      .leafblue { fill:#CFE0F2; stroke:#2563A8; stroke-width:1.8; }
      .leafgrey { fill:#EEF2F7; stroke:#14213D; stroke-width:1.6; }
      .boxtitle { font-size:13.5px; font-weight:700; fill:#14213D; }
      .boxtext { font-size:12px; fill:#14213D; }
      .leaftitle { font-size:15px; font-weight:800; fill:#14213D; }
      .leaftitleamber { font-size:15px; font-weight:800; fill:#8a5a12; }
      .leaftext { font-size:11.5px; fill:#55606F; }
      .edge { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr4); }
      .edgelabel { font-size:11px; font-weight:700; fill:#14213D; }
      .edgebg { fill:#FBFAF7; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .sub { font-size:12.5px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    </style>
    <marker id="arr4" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
</defs>
<rect width="960" height="660" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 29 · BESLISBOOM</text>
<text x="40" y="64" class="title">Figuur 29.4 — Weerstandsdiagnose: onwil, onmacht, of terecht bezwaar?</text>
<text x="40" y="84" class="sub">Drie oorzaken onder één noemer scharen — en ze allemaal met overtuigen bestrijden — is de duurste fout (§29.4).</text>

<!-- root -->
<rect x="330" y="108" width="300" height="60" rx="8" class="rootbox"/>
<text x="480" y="132" text-anchor="middle" class="boxtitle">SIGNAAL VAN WEERSTAND</text>
<text x="480" y="150" text-anchor="middle" class="boxtext">vertraging, ontwijkend gedrag, tegenwerping</text>

<path d="M480,168 L480,206" class="edge"/>

<!-- Q1 -->
<rect x="330" y="206" width="300" height="70" rx="8" class="qbox"/>
<text x="480" y="230" text-anchor="middle" class="boxtitle">Heeft het plan hier een reëel,</text>
<text x="480" y="248" text-anchor="middle" class="boxtitle">inhoudelijk probleem?</text>
<text x="480" y="264" text-anchor="middle" class="leaftext">(§29.4 — vóór alles uitsluiten)</text>

<!-- edge Q1 -> leaf terecht bezwaar (JA, left) -->
<path d="M400,276 C300,320 220,340 220,376" class="edge"/>
<rect x="180" y="300" width="30" height="18" class="edgebg"/>
<text x="195" y="313" text-anchor="middle" class="edgelabel">JA</text>

<!-- edge Q1 -> Q2 (NEE, right) -->
<path d="M560,276 C660,320 740,340 740,376" class="edge"/>
<rect x="700" y="300" width="40" height="18" class="edgebg"/>
<text x="720" y="313" text-anchor="middle" class="edgelabel">NEE</text>

<!-- leaf: terecht bezwaar -->
<rect x="80" y="376" width="280" height="130" rx="8" class="leafamber"/>
<text x="220" y="404" text-anchor="middle" class="leaftitleamber">TERECHT BEZWAAR</text>
<text x="220" y="426" text-anchor="middle" class="leaftext">de betrokkene heeft gelijk —</text>
<text x="220" y="442" text-anchor="middle" class="leaftext">een reëel probleem, geen</text>
<text x="220" y="458" text-anchor="middle" class="leaftext">emotionele of politieke reactie</text>
<text x="220" y="484" text-anchor="middle" class="boxtitle">Antwoord: pas het plan aan</text>

<!-- Q2 -->
<rect x="600" y="376" width="280" height="70" rx="8" class="qbox"/>
<text x="740" y="400" text-anchor="middle" class="boxtitle">Mist de betrokkene tijd,</text>
<text x="740" y="418" text-anchor="middle" class="boxtitle">vaardigheid of middelen</text>
<text x="740" y="434" text-anchor="middle" class="boxtitle">om mee te bewegen?</text>

<!-- edge Q2 -> onmacht (JA, left) -->
<path d="M660,446 C600,480 560,500 560,526" class="edge"/>
<rect x="530" y="470" width="30" height="18" class="edgebg"/>
<text x="545" y="483" text-anchor="middle" class="edgelabel">JA</text>

<!-- edge Q2 -> onwil (NEE, right) -->
<path d="M820,446 C860,480 880,500 880,526" class="edge"/>
<rect x="850" y="470" width="40" height="18" class="edgebg"/>
<text x="870" y="483" text-anchor="middle" class="edgelabel">NEE</text>

<!-- leaf: onmacht -->
<rect x="420" y="526" width="280" height="118" rx="8" class="leafblue"/>
<text x="560" y="552" text-anchor="middle" class="leaftitle">ONMACHT</text>
<text x="560" y="573" text-anchor="middle" class="leaftext">wil wel, maar mist tijd,</text>
<text x="560" y="588" text-anchor="middle" class="leaftext">vaardigheid of middelen</text>
<text x="560" y="616" text-anchor="middle" class="boxtitle">Antwoord: ondersteun</text>
<text x="560" y="632" text-anchor="middle" class="leaftext">(tijd, training, middelen)</text>

<!-- leaf: onwil -->
<rect x="740" y="526" width="180" height="118" rx="8" class="leafgrey"/>
<text x="830" y="552" text-anchor="middle" class="leaftitle">ONWIL</text>
<text x="830" y="573" text-anchor="middle" class="leaftext">begrijpt de verandering,</text>
<text x="830" y="588" text-anchor="middle" class="leaftext">inhoudelijk oneens</text>
<text x="830" y="616" text-anchor="middle" class="boxtitle">Antwoord: overtuig</text>
<text x="830" y="632" text-anchor="middle" class="boxtitle">of onderhandel</text>

</svg>
