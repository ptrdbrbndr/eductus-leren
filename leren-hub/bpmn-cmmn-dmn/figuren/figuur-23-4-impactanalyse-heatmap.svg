<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:12.5px; font-weight:700; fill:#14213D; }
      .label-light { font-size:12.5px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:11px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .cellhoog { fill:#E9A13B; }
      .cellmid { fill:#6FA3D6; }
      .celllaag { fill:#CFE0F2; }
      .cellonbekend { fill:url(#hatch); }
    </style>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#E3E0D8"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#55606F" stroke-width="2"/>
    </pattern>
</defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 23 · IMPACTANALYSE-HEATMAP</text>
<text x="40" y="64" class="title">Impact bij vervanging van het legacy-polisadministratiesysteem</text>

<!-- column headers -->
<text x="330" y="102" text-anchor="middle" class="label">Directe</text>
<text x="330" y="116" text-anchor="middle" class="label">koppeling</text>
<text x="470" y="102" text-anchor="middle" class="label">Batch-</text>
<text x="470" y="116" text-anchor="middle" class="label">afhankelijkheid</text>
<text x="610" y="102" text-anchor="middle" class="label">Doorlooptijd-</text>
<text x="610" y="116" text-anchor="middle" class="label">risico</text>
<text x="750" y="102" text-anchor="middle" class="label">Betrouwbaarheid</text>
<text x="750" y="116" text-anchor="middle" class="label">traceerketen</text>

<!-- row labels + grid -->
<!-- row geometry: x0=260 col width 140, rows start y=136 height 56 -->
<g font-size="12">
<!-- row 1: Deelnemermutaties -->
<text x="30" y="168" class="label">Deelnemermutaties</text>
<text x="30" y="182" class="sub">(Mutatieplatform, live)</text>
<rect x="260" y="136" width="140" height="56" class="cellmid" stroke="#FBFAF7" stroke-width="2"/>
<rect x="400" y="136" width="140" height="56" class="celllaag" stroke="#FBFAF7" stroke-width="2"/>
<rect x="540" y="136" width="140" height="56" class="celllaag" stroke="#FBFAF7" stroke-width="2"/>
<rect x="680" y="136" width="140" height="56" class="cellhoog" stroke="#FBFAF7" stroke-width="2"/>

<!-- row 2: Werkgevermutaties -->
<text x="30" y="228" class="label">Werkgevermutaties</text>
<text x="30" y="242" class="sub">(Mutatieplatform, live)</text>
<rect x="260" y="196" width="140" height="56" class="cellmid" stroke="#FBFAF7" stroke-width="2"/>
<rect x="400" y="196" width="140" height="56" class="celllaag" stroke="#FBFAF7" stroke-width="2"/>
<rect x="540" y="196" width="140" height="56" class="celllaag" stroke="#FBFAF7" stroke-width="2"/>
<rect x="680" y="196" width="140" height="56" class="cellhoog" stroke="#FBFAF7" stroke-width="2"/>

<!-- row 3: Waardeoverdrachten -->
<text x="30" y="288" class="label">Waardeoverdrachten</text>
<text x="30" y="302" class="sub">(Mutatieplatform, live; invaren-gevoelig)</text>
<rect x="260" y="256" width="140" height="56" class="cellhoog" stroke="#FBFAF7" stroke-width="2"/>
<rect x="400" y="256" width="140" height="56" class="cellhoog" stroke="#FBFAF7" stroke-width="2"/>
<rect x="540" y="256" width="140" height="56" class="cellhoog" stroke="#FBFAF7" stroke-width="2"/>
<rect x="680" y="256" width="140" height="56" class="cellmid" stroke="#FBFAF7" stroke-width="2"/>

<!-- row 4: Klachten & Bezwaren -->
<text x="30" y="348" class="label">Klachten &amp; Bezwaren</text>
<text x="30" y="362" class="sub">(legacy, nog niet gemigreerd)</text>
<rect x="260" y="316" width="140" height="56" class="cellhoog" stroke="#FBFAF7" stroke-width="2"/>
<rect x="400" y="316" width="140" height="56" class="cellhoog" stroke="#FBFAF7" stroke-width="2"/>
<rect x="540" y="316" width="140" height="56" class="cellhoog" stroke="#FBFAF7" stroke-width="2"/>
<rect x="680" y="316" width="140" height="56" class="cellonbekend" stroke="#FBFAF7" stroke-width="2"/>

<!-- row 5: Bijzondere Situaties -->
<text x="30" y="408" class="label">Bijzondere Situaties</text>
<text x="30" y="422" class="sub">(legacy, nog niet gemigreerd)</text>
<rect x="260" y="376" width="140" height="56" class="cellhoog" stroke="#FBFAF7" stroke-width="2"/>
<rect x="400" y="376" width="140" height="56" class="cellhoog" stroke="#FBFAF7" stroke-width="2"/>
<rect x="540" y="376" width="140" height="56" class="cellonbekend" stroke="#FBFAF7" stroke-width="2"/>
<rect x="680" y="376" width="140" height="56" class="cellonbekend" stroke="#FBFAF7" stroke-width="2"/>

<!-- row 6: Rapportage DNB -->
<text x="30" y="468" class="label">Rapportage naar DNB</text>
<text x="30" y="482" class="sub">(dwars door alle afdelingen)</text>
<rect x="260" y="436" width="140" height="56" class="cellhoog" stroke="#FBFAF7" stroke-width="2"/>
<rect x="400" y="436" width="140" height="56" class="cellmid" stroke="#FBFAF7" stroke-width="2"/>
<rect x="540" y="436" width="140" height="56" class="cellmid" stroke="#FBFAF7" stroke-width="2"/>
<rect x="680" y="436" width="140" height="56" class="cellmid" stroke="#FBFAF7" stroke-width="2"/>
</g>

<!-- legend -->
<g>
<rect x="260" y="518" width="20" height="20" class="cellhoog"/>
<text x="286" y="533" class="sub">Hoog</text>
<rect x="350" y="518" width="20" height="20" class="cellmid"/>
<text x="376" y="533" class="sub">Midden</text>
<rect x="450" y="518" width="20" height="20" class="celllaag"/>
<text x="476" y="533" class="sub">Laag</text>
<rect x="540" y="518" width="20" height="20" class="cellonbekend" stroke="#55606F" stroke-width="1"/>
<text x="566" y="533" class="sub">Onbekend — blinde vlek in de keten (§23.5)</text>
</g>

<text x="30" y="570" class="sub" font-style="italic">Klachten &amp; Bezwaren en Bijzondere Situaties zijn dossiergedreven en informeel gegroeid: de traceerbaarheids-</text>
<text x="30" y="586" class="sub" font-style="italic">keten heeft daar gaten, dus is het oordeel over doorlooptijd- en ketenrisico daar minder zeker, niet lager.</text>
</svg>
