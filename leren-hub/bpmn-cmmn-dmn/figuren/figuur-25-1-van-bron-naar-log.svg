<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'DM Sans', Arial, sans-serif" width="960" height="640" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .panel { fill:#FFFFFF; stroke:#E3E0D8; stroke-width:1.5; }
      .box { fill:#EEF2F7; stroke:#14213D; stroke-width:1.5; }
      .box-log { fill:#CFE0F2; stroke:#2563A8; stroke-width:1.5; }
      .box-transform { fill:#FFFFFF; stroke:#2563A8; stroke-width:2; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:13px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:11.5px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.8; fill:none; marker-end:url(#arr); }
      .arrow-thick { stroke:#14213D; stroke-width:2.4; fill:none; marker-end:url(#arrD); }
      .tablecell { font-size:11px; fill:#14213D; }
      .tablehead { font-size:11px; font-weight:700; fill:#14213D; }
      .callout { fill:#FBF6E9; stroke:#E9A13B; stroke-width:1.4; }
      .calltitle { font-size:11.5px; font-weight:700; fill:#8a5a12; }
      .calltext { font-size:10.6px; fill:#55606F; }
      .marker { fill:#E9A13B; stroke:#8a5a12; stroke-width:1; }
      .markernum { font-size:11px; font-weight:700; fill:#14213D; }
      .dashline { stroke:#E9A13B; stroke-width:1.3; stroke-dasharray:3,3; fill:none; }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrD" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#14213D"/></marker>
</defs>
<rect width="960" height="640" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 25 · PIPELINEDIAGRAM</text>
<text x="40" y="64" class="title">Figuur 25.1 — Van brontabellen naar event log</text>
<text x="40" y="84" class="sub">Twee bronnen bij Meridiaan, elk met eigen extractieproblematiek (§25.1)</text>

<!-- source box 1: Mutatieplatform -->
<rect x="40" y="120" width="220" height="90" rx="8" class="box"/>
<text x="60" y="146" class="label">Mutatieplatform</text>
<text x="60" y="164" class="sub">event-driven (Locked Platform)</text>
<text x="60" y="180" class="sub">live voor 3 van de 5 afdelingen</text>
<text x="60" y="198" class="sub">gebeurtenissen al per case gelogd</text>

<!-- source box 2: legacy -->
<rect x="40" y="250" width="220" height="100" rx="8" class="box"/>
<text x="60" y="276" class="label">Legacy-polis-</text>
<text x="60" y="292" class="label">administratiesysteem</text>
<text x="60" y="310" class="sub">35 jaar oud, batchverwerking</text>
<text x="60" y="326" class="sub">beperkte foutrespons (§14.7)</text>
<text x="60" y="342" class="sub">systeemgebeurtenissen, geen cases</text>

<!-- arrows to transform box -->
<path d="M260,165 L370,215" class="arrow"/>
<path d="M260,300 L370,255" class="arrow"/>

<!-- transform box -->
<rect x="370" y="170" width="230" height="180" rx="8" class="box-transform"/>
<text x="485" y="196" text-anchor="middle" class="label">Extractie &amp;</text>
<text x="485" y="214" text-anchor="middle" class="label">transformatie</text>

<!-- marker 1 on batch correction -->
<circle cx="400" cy="250" r="10" class="marker"/>
<text x="400" y="254" text-anchor="middle" class="markernum">1</text>
<text x="418" y="246" class="sub">batchtijdstempel →</text>
<text x="418" y="260" class="sub">case-tijdstip</text>

<!-- marker 2 on system-to-business mapping -->
<circle cx="400" cy="300" r="10" class="marker"/>
<text x="400" y="304" text-anchor="middle" class="markernum">2</text>
<text x="418" y="296" class="sub">systeemgebeurtenis →</text>
<text x="418" y="310" class="sub">businessgebeurtenis</text>

<!-- arrow from transform to log -->
<path d="M600,260 L678,260" class="arrow-thick"/>

<!-- event log table -->
<rect x="680" y="140" width="240" height="230" rx="8" class="box-log"/>
<text x="700" y="164" class="label">Event log</text>
<rect x="700" y="176" width="200" height="24" fill="#FBFAF7" stroke="#2563A8" stroke-width="1"/>
<text x="706" y="192" class="tablehead">Case-ID</text>
<text x="770" y="192" class="tablehead">Activiteit</text>
<text x="856" y="192" class="tablehead">Tijd</text>
<g>
  <rect x="700" y="200" width="200" height="20" fill="#FBFAF7"/>
  <text x="706" y="214" class="tablecell">M-40217</text>
  <text x="770" y="214" class="tablecell">Ontvangst</text>
  <text x="850" y="214" class="tablecell">09:14</text>
  <rect x="700" y="220" width="200" height="20" fill="#FFFFFF"/>
  <text x="706" y="234" class="tablecell">M-40217</text>
  <text x="770" y="234" class="tablecell">Validatie</text>
  <text x="850" y="234" class="tablecell">09:41</text>
  <rect x="700" y="240" width="200" height="20" fill="#FBFAF7"/>
  <text x="706" y="254" class="tablecell">L-88903</text>
  <text x="770" y="254" class="tablecell">Verwerkt</text>
  <text x="850" y="254" class="tablecell">02:00*</text>
  <rect x="700" y="260" width="200" height="20" fill="#FFFFFF"/>
  <text x="706" y="274" class="tablecell">L-88903</text>
  <text x="770" y="274" class="tablecell">Bevestigd</text>
  <text x="850" y="274" class="tablecell">02:00*</text>
</g>
<text x="700" y="298" class="sub" font-style="italic">* legacy-rijen: batchtijd, niet</text>
<text x="700" y="312" class="sub" font-style="italic">de werkelijke gebeurtenistijd</text>
<text x="700" y="332" class="sub">Case-ID · Activiteit · Tijdstip</text>
<text x="700" y="348" class="sub">— het minimum voor mining</text>

<!-- callouts explaining the two markers -->
<rect x="40" y="400" width="420" height="110" rx="6" class="callout"/>
<text x="58" y="424" class="calltitle">1 — Batchtijdstempel → case-tijdstip</text>
<text x="58" y="442" class="calltext">Een nachtelijke batch verwerkt duizend mutaties in twee</text>
<text x="58" y="456" class="calltext">minuten. Zonder correctie krijgen ze allemaal hetzelfde</text>
<text x="58" y="470" class="calltext">tijdstip — de werkelijke doorlooptijd van de individuele</text>
<text x="58" y="484" class="calltext">mutatie verdwijnt uit het log (§25.1).</text>

<rect x="500" y="400" width="420" height="110" rx="6" class="callout"/>
<text x="518" y="424" class="calltitle">2 — Systeemgebeurtenis → businessgebeurtenis</text>
<text x="518" y="442" class="calltext">Welke technische logregel bij welke processtap hoort,</text>
<text x="518" y="456" class="calltext">is een mappingkeuze van de mininganalist, geen gegeven</text>
<text x="518" y="470" class="calltext">feit. Een andere keuze levert een ander event log op —</text>
<text x="518" y="484" class="calltext">en dus een ander procesmodel.</text>

<text x="40" y="550" class="sub" font-style="italic">Elke transformatie hierboven is een keuze, en elke keuze vertekent het beeld enigszins (§25.1).</text>
<text x="40" y="568" class="sub" font-style="italic">Wie de vertekening niet benoemt, presenteert een uitkomst die preciezer oogt dan hij is.</text>
</svg>
