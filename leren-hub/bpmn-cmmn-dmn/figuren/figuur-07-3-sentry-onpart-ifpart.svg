<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="'DM Sans', Arial, sans-serif" width="1000" height="560" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .task-fill { fill:#FFFFFF; stroke:#14213D; stroke-width:1.75; }
      .milestone-fill { fill:#FBF6E9; stroke:#14213D; stroke-width:1.75; }
      .callout-fill { fill:#EEF2F7; stroke:#14213D; stroke-width:1.25; }
      .sentry-fill { fill:#14213D; stroke:#14213D; }
      .label { font-size:15px; font-weight:700; fill:#14213D; }
      .label-light { font-size:13px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:11.5px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .note { font-size:12px; fill:#55606F; }
      .amber { font-size:12px; font-weight:700; fill:#14213D; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-and { stroke:#14213D; stroke-width:2; fill:none; marker-end:url(#arr2); }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#14213D"/></marker>
    <g id="icon-clock">
      <circle cx="8" cy="8" r="7" fill="#FBFAF7" stroke="#14213D" stroke-width="1.2"/>
      <line x1="8" y1="8" x2="8" y2="3.5" stroke="#14213D" stroke-width="1.2"/>
      <line x1="8" y1="8" x2="11" y2="9.5" stroke="#14213D" stroke-width="1.2"/>
    </g>
</defs>
<rect width="1000" height="560" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 07 · CMMN-NOTATIE</text>
<text x="40" y="64" class="title">Een sentry: on-part en if-part samen</text>
<text x="40" y="86" class="note">Casus Meridiaan — de taak komt pas beschikbaar als beide voorwaarden kloppen.</text>

<!-- On-part source: milestone -->
<g transform="translate(40,150)">
  <rect x="0" y="0" width="240" height="60" rx="30" class="milestone-fill"/>
  <text x="120" y="26" text-anchor="middle" class="label">Milestone bereikt</text>
  <text x="120" y="45" text-anchor="middle" class="sub">"Oorzaak vastgesteld"</text>
</g>
<text x="160" y="230" text-anchor="middle" class="amber">ON-PART</text>
<text x="160" y="246" text-anchor="middle" class="sub">reageert op een gebeurtenis</text>

<!-- If-part source: condition -->
<g transform="translate(40,300)">
  <rect x="0" y="0" width="240" height="60" rx="10" class="callout-fill"/>
  <text x="120" y="24" text-anchor="middle" class="label" style="font-size:13px">Voorwaarde (FEEL)</text>
  <text x="120" y="44" text-anchor="middle" class="sub">ernstclassificatie = "hoog"</text>
</g>
<text x="160" y="385" text-anchor="middle" class="amber">IF-PART</text>
<text x="160" y="401" text-anchor="middle" class="sub">aanvullende voorwaarde</text>

<!-- AND join to sentry -->
<path d="M280,180 L 420,265" class="arrow-and"/>
<path d="M280,330 L 420,275" class="arrow-and"/>
<circle cx="400" cy="270" r="16" fill="#FBFAF7" stroke="#14213D" stroke-width="1.5"/>
<text x="400" y="274" text-anchor="middle" style="font-size:12px; font-weight:700; fill:#14213D">EN</text>

<!-- Sentry diamond -->
<path d="M470,270 L500,240 L530,270 L500,300 Z" class="sentry-fill"/>
<text x="500" y="322" text-anchor="middle" class="label" style="font-size:13px">Sentry</text>
<text x="500" y="338" text-anchor="middle" class="sub">entry criterion</text>

<path d="M416,270 L465,270" class="arrow-and"/>
<path d="M535,270 L610,270" class="arrow-and"/>

<!-- Target task with entry sentry marker -->
<g transform="translate(610,190)">
  <rect x="0" y="0" width="320" height="160" rx="14" class="task-fill"/>
  <path d="M-9,70 L9,55 L27,70 L9,85 Z" class="sentry-fill"/>
  <circle cx="24" cy="24" r="7" fill="#14213D"/>
  <path d="M17,34 Q24,27 31,34 Z" fill="#14213D"/>
  <text x="160" y="105" text-anchor="middle" class="label">Juridisch advies inwinnen</text>
  <text x="160" y="128" text-anchor="middle" class="sub">Human task — komt pas beschikbaar</text>
  <text x="160" y="144" text-anchor="middle" class="sub">als de sentry vuurt</text>
</g>

<text x="500" y="440" text-anchor="middle" class="note">Gevuld diamantje = sentry met on-part (event-gebaseerd); hier gecombineerd met een if-part.</text>
<text x="500" y="460" text-anchor="middle" class="note">Zonder de combinatie van beide blijft de taak niet-beschikbaar voor de behandelaar.</text>
</svg>
