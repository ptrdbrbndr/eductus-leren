<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="'DM Sans', Arial, sans-serif" width="960" height="600" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .card { fill:#FFFFFF; stroke:#14213D; stroke-width:1.4; }
      .head { fill:#CFE0F2; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .sub { font-size:11.8px; fill:#55606F; }
      .body { font-size:12px; fill:#14213D; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .tag { font-size:10.5px; font-weight:700; fill:#8a5a12; letter-spacing:.04em; }
    </style>
</defs>
<rect width="960" height="600" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 09 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Figuur 9.3 — Het toollandschap: vier categorieën</text>
<text x="40" y="86" class="sub">Elke categorie met een ander gebruiksdoel voor ogen — §9.3</text>

<!-- 4 cards -->
<!-- card 1 -->
<rect x="40" y="115" width="205" height="430" class="card"/>
<rect x="40" y="115" width="205" height="46" class="head"/>
<text x="142" y="144" text-anchor="middle" class="label" font-size="13">Open source</text>
<text x="142" y="586" text-anchor="middle" class="sub"> </text>
<text x="142" y="  " class="label"></text>
<text x="52" y="144" class="label" font-size="13">Open source</text>
<text x="52" y="128" class="label" font-size="13">toolkits</text>
<text x="52" y="185" class="tag">STERK IN</text>
<text x="52" y="205" class="body">Aanpasbaarheid</text>
<text x="52" y="222" class="body">en kosten</text>
<text x="52" y="255" class="tag">BEPERKING</text>
<text x="52" y="275" class="body">Kant-en-klare</text>
<text x="52" y="292" class="body">functionaliteit zoals</text>
<text x="52" y="309" class="body">workflow-beheer en</text>
<text x="52" y="326" class="body">samenwerking beperkt</text>
<text x="52" y="360" class="tag">VOORBEELD</text>
<text x="52" y="380" class="sub">Bibliotheek/editor die je</text>
<text x="52" y="396" class="sub">in eigen applicatie</text>
<text x="52" y="412" class="sub">integreert (bijv. bpmn.io-</text>
<text x="52" y="428" class="sub">gebaseerd, zoals Conductus)</text>

<!-- card 2 -->
<rect x="255" y="115" width="205" height="430" class="card"/>
<rect x="255" y="115" width="205" height="46" class="head"/>
<text x="267" y="128" class="label" font-size="13">Enterprise-</text>
<text x="267" y="144" class="label" font-size="13">suites</text>
<text x="267" y="185" class="tag">STERK IN</text>
<text x="267" y="205" class="body">Volledigheid en</text>
<text x="267" y="222" class="body">ondersteuning</text>
<text x="267" y="255" class="tag">BEPERKING</text>
<text x="267" y="275" class="body">Prijs, en vaak een</text>
<text x="267" y="292" class="body">sterkere lock-in</text>
<text x="267" y="326" class="tag">OMVAT</text>
<text x="267" y="346" class="sub">Modellering, uitvoering,</text>
<text x="267" y="362" class="sub">monitoring én vaak</text>
<text x="267" y="378" class="sub">procesmining in één</text>
<text x="267" y="394" class="sub">commercieel platform</text>

<!-- card 3 -->
<rect x="470" y="115" width="205" height="430" class="card"/>
<rect x="470" y="115" width="205" height="46" class="head"/>
<text x="482" y="128" class="label" font-size="13">EA-</text>
<text x="482" y="144" class="label" font-size="13">repositories</text>
<text x="482" y="185" class="tag">STERK IN</text>
<text x="482" y="205" class="body">Koppeling met de</text>
<text x="482" y="222" class="body">bredere architectuur</text>
<text x="482" y="238" class="body">(deel 23)</text>
<text x="482" y="272" class="tag">BEPERKING</text>
<text x="482" y="292" class="body">Fijnmazige uitvoerings-</text>
<text x="482" y="309" class="body">details vaak beperkter</text>
<text x="482" y="343" class="tag">KERN</text>
<text x="482" y="363" class="sub">Primair gebouwd voor</text>
<text x="482" y="379" class="sub">enterprise-architectuur</text>
<text x="482" y="395" class="sub">(ArchiMate), BPMN/CMMN/</text>
<text x="482" y="411" class="sub">DMN als aanvulling</text>

<!-- card 4 -->
<rect x="685" y="115" width="235" height="430" class="card"/>
<rect x="685" y="115" width="235" height="46" class="head"/>
<text x="697" y="128" class="label" font-size="13">Low-code</text>
<text x="697" y="144" class="label" font-size="13">platformen</text>
<text x="697" y="185" class="tag">STERK IN</text>
<text x="697" y="205" class="body">Snelle stap van model</text>
<text x="697" y="222" class="body">naar werkende applicatie</text>
<text x="697" y="256" class="tag">BEPERKING</text>
<text x="697" y="276" class="body">Gegenereerde applicatie</text>
<text x="697" y="293" class="body">blijft vaak platform-</text>
<text x="697" y="310" class="body">specifiek</text>
<text x="697" y="344" class="tag">KERN</text>
<text x="697" y="364" class="sub">BPMN/DMN(/CMMN) als</text>
<text x="697" y="380" class="sub">onderliggende taal voor</text>
<text x="697" y="396" class="sub">een bredere app-omgeving</text>

<rect x="40" y="500" width="880" height="76" fill="#EEF2F7" stroke="#E3E0D8" stroke-width="1"/>
<text x="58" y="524" class="sub" font-weight="700" fill="#14213D">Geen categorie is universeel juist</text>
<text x="58" y="546" class="sub">— de vraag is welk gebruiksdoel het zwaarst weegt (deel 1, §1.4): puur communiceren/analyseren, of ook uitvoeren.</text>
</svg>
