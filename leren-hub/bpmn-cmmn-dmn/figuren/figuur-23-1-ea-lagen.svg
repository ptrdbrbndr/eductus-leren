<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" font-family="'DM Sans', Arial, sans-serif" width="960" height="720" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-fill { fill:#CFE0F2; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber-fill { fill:#FBF6E9; }
      .grey-fill { fill:#E3E0D8; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-sm { font-size:12px; font-weight:700; fill:#14213D; }
      .label-light { font-size:13px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-sm { font-size:10.5px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#14213D; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .dash { stroke:#E9A13B; stroke-width:1.75; fill:none; stroke-dasharray:5 4; marker-end:url(#arr-amber); }
      .box { stroke:#14213D; stroke-width:1.5; rx:10; }
      .badge { fill:#E9A13B; stroke:#14213D; stroke-width:1.25; }
    </style>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#14213D"/></marker>
    <marker id="arr-amber" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
</defs>
<rect width="960" height="720" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 23 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">De EA-lagen met procesmodellering gepositioneerd</text>

<!-- layer band backgrounds -->
<rect x="40" y="80" width="880" height="120" class="blue-fill" opacity="0.35" rx="6"/>
<rect x="40" y="220" width="880" height="100" class="amber-fill" rx="6" stroke="#E9A13B" stroke-width="1"/>
<rect x="40" y="340" width="880" height="80" class="grey-fill" rx="6"/>

<text x="52" y="96" class="kicker">BUSINESSLAAG — wat de organisatie doet, voor wie</text>
<text x="52" y="236" class="kicker">APPLICATIELAAG — welke systemen dat ondersteunen</text>
<text x="52" y="356" class="kicker">TECHNOLOGIELAAG — waarop die systemen draaien</text>

<!-- business blocks -->
<g>
  <rect x="46" y="112" width="160" height="80" rx="10" class="blue-fill box" stroke="#E9A13B" stroke-width="2.5"/>
  <text x="126" y="145" text-anchor="middle" class="label-sm">Deelnemer-</text>
  <text x="126" y="161" text-anchor="middle" class="label-sm">mutaties</text>
  <circle cx="192" cy="122" r="11" class="badge"/>
  <text x="192" y="126" text-anchor="middle" class="sub-sm" font-weight="700" fill="#14213D">1</text>
</g>
<g>
  <rect x="219" y="112" width="160" height="80" rx="10" class="blue-fill box"/>
  <text x="299" y="145" text-anchor="middle" class="label-sm">Werkgever-</text>
  <text x="299" y="161" text-anchor="middle" class="label-sm">mutaties</text>
</g>
<g>
  <rect x="392" y="112" width="160" height="80" rx="10" class="blue-fill box"/>
  <text x="472" y="145" text-anchor="middle" class="label-sm">Waarde-</text>
  <text x="472" y="161" text-anchor="middle" class="label-sm">overdrachten</text>
</g>
<g>
  <rect x="565" y="112" width="160" height="80" rx="10" class="blue-fill box"/>
  <text x="645" y="145" text-anchor="middle" class="label-sm">Klachten &amp;</text>
  <text x="645" y="161" text-anchor="middle" class="label-sm">Bezwaren</text>
</g>
<g>
  <rect x="738" y="112" width="160" height="80" rx="10" class="blue-fill box"/>
  <text x="818" y="145" text-anchor="middle" class="label-sm">Bijzondere</text>
  <text x="818" y="161" text-anchor="middle" class="label-sm">Situaties</text>
</g>

<!-- connectors business -> applicatie -->
<line x1="126" y1="192" x2="126" y2="232" class="arrow"/>
<line x1="299" y1="192" x2="299" y2="232" class="arrow"/>
<line x1="472" y1="192" x2="472" y2="232" class="arrow"/>
<line x1="645" y1="192" x2="645" y2="232" class="arrow"/>
<line x1="818" y1="192" x2="818" y2="232" class="arrow"/>

<!-- applicatie blocks -->
<rect x="46" y="232" width="506" height="68" rx="10" class="box" fill="#FBF6E9" stroke="#2563A8"/>
<text x="299" y="260" text-anchor="middle" class="label-sm">Mutatieplatform (Locked Platform)</text>
<text x="299" y="278" text-anchor="middle" class="sub-sm">event-driven, FSM/CQRS</text>

<rect x="565" y="232" width="333" height="68" rx="10" class="box" fill="#FBF6E9" stroke="#2563A8"/>
<text x="731" y="260" text-anchor="middle" class="label-sm">Legacy-polisadministratiesysteem</text>
<text x="731" y="278" text-anchor="middle" class="sub-sm">batchverwerking, 35 jaar oud</text>

<!-- connectors applicatie -> technologie -->
<line x1="299" y1="300" x2="299" y2="352" class="arrow"/>
<line x1="731" y1="300" x2="731" y2="352" class="arrow"/>

<!-- technologie blocks -->
<rect x="46" y="352" width="506" height="58" rx="10" class="box" fill="#E3E0D8" stroke="#14213D"/>
<text x="299" y="386" text-anchor="middle" class="label-sm">Cloud-cluster — event-driven runtime</text>

<rect x="565" y="352" width="333" height="58" rx="10" class="box" fill="#E3E0D8" stroke="#14213D"/>
<text x="731" y="386" text-anchor="middle" class="label-sm">On-premises rekencentrum — batchverwerking</text>

<!-- zoom leader line -->
<path d="M46,150 L26,150 L26,460 L70,460" fill="none" stroke="#E9A13B" stroke-width="1.75" stroke-dasharray="5 4" marker-end="url(#arr-amber)"/>

<!-- inset -->
<rect x="40" y="460" width="880" height="220" rx="12" fill="#FFFFFF" stroke="#14213D" stroke-width="1.5" stroke-dasharray="6 4"/>
<circle cx="66" cy="484" r="11" class="badge"/>
<text x="66" y="488" text-anchor="middle" class="sub-sm" font-weight="700" fill="#14213D">1</text>
<text x="86" y="488" class="kicker">UITVERGROOT — BINNEN DIT BLOK</text>
<text x="86" y="510" class="label">Procesmodellering (BPMN/CMMN/DMN) — deel 1 t/m 22</text>
<text x="86" y="528" class="sub">Eén proces tegelijk, met gateways, events en sequence flow — niet het hele landschap.</text>

<!-- mini bpmn fragment -->
<circle cx="90" cy="605" r="12" fill="#FFFFFF" stroke="#14213D" stroke-width="1.5"/>
<line x1="102" y1="605" x2="126" y2="605" class="arrow"/>
<rect x="128" y="585" width="130" height="40" rx="8" fill="#CFE0F2" stroke="#14213D" stroke-width="1.5"/>
<text x="193" y="609" text-anchor="middle" class="sub-sm" font-weight="700" fill="#14213D">Mutatie ontvangen</text>
<line x1="258" y1="605" x2="286" y2="605" class="arrow"/>
<polygon points="300,589 316,605 300,621 284,605" fill="#FFFFFF" stroke="#14213D" stroke-width="1.5"/>
<line x1="316" y1="605" x2="344" y2="565" class="arrow"/>
<line x1="316" y1="605" x2="344" y2="635" class="arrow"/>
<rect x="346" y="545" width="150" height="36" rx="8" fill="#CFE0F2" stroke="#14213D" stroke-width="1.5"/>
<text x="421" y="567" text-anchor="middle" class="sub-sm" font-weight="700" fill="#14213D">Automatisch verwerken</text>
<rect x="346" y="617" width="150" height="36" rx="8" fill="#CFE0F2" stroke="#14213D" stroke-width="1.5"/>
<text x="421" y="639" text-anchor="middle" class="sub-sm" font-weight="700" fill="#14213D">Handmatig beoordelen</text>
<line x1="496" y1="563" x2="524" y2="600" class="arrow"/>
<line x1="496" y1="635" x2="524" y2="605" class="arrow"/>
<polygon points="538,589 554,605 538,621 522,605" fill="#FFFFFF" stroke="#14213D" stroke-width="1.5"/>
<line x1="554" y1="605" x2="580" y2="605" class="arrow"/>
<circle cx="596" cy="605" r="14" fill="#FFFFFF" stroke="#14213D" stroke-width="3"/>
</svg>
