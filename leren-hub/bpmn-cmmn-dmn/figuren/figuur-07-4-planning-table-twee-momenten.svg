<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 600" font-family="'DM Sans', Arial, sans-serif" width="1150" height="600" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .stage-fill { fill:#EEF2F7; stroke:#14213D; stroke-width:1.75; }
      .tab-fill { fill:#EEF2F7; stroke:#14213D; stroke-width:1.75; }
      .task-fill { fill:#FFFFFF; stroke:#14213D; stroke-width:1.5; }
      .task-dashed { fill:#FFFFFF; stroke:#14213D; stroke-width:1.5; stroke-dasharray:6,4; }
      .table-fill { fill:#FBF6E9; stroke:#14213D; stroke-width:1.25; }
      .label { font-size:13.5px; font-weight:700; fill:#14213D; }
      .sub { font-size:11px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .note { font-size:12px; fill:#55606F; }
      .moment { font-family:'Cormorant Garamond', Georgia, serif; font-size:18px; fill:#14213D; font-weight:600; }
      .arrow { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <g id="icon-checklist">
      <rect x="0" y="0" width="18" height="18" rx="2" fill="#FBF6E9" stroke="#14213D" stroke-width="1.2"/>
      <line x1="4" y1="5" x2="14" y2="5" stroke="#14213D" stroke-width="1.1"/>
      <line x1="4" y1="9" x2="14" y2="9" stroke="#14213D" stroke-width="1.1"/>
      <line x1="4" y1="13" x2="14" y2="13" stroke="#14213D" stroke-width="1.1"/>
    </g>
</defs>
<rect width="1150" height="600" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 07 · CMMN-NOTATIE</text>
<text x="40" y="64" class="title">De planning table — twee momenten</text>
<text x="40" y="86" class="note">Casus Meridiaan: dezelfde stage, vóór en na een keuze van de behandelaar.</text>

<!-- MOMENT 1 -->
<text x="270" y="122" text-anchor="middle" class="moment">Moment 1 — bij opening van de case</text>
<g transform="translate(60,140)">
  <rect x="0" y="-14" width="150" height="20" rx="4" class="tab-fill"/>
  <text x="10" y="0" class="sub" style="font-weight:700">Klachtbehandeling</text>
  <rect x="0" y="6" width="420" height="330" rx="14" class="stage-fill"/>
  <use href="#icon-checklist" x="392" y="16"/>

  <rect x="20" y="40" width="380" height="55" rx="10" class="task-fill"/>
  <text x="210" y="70" text-anchor="middle" class="label">Dossier opvragen bij polisadministratie</text>

  <rect x="20" y="105" width="380" height="45" rx="22" fill="#FBF6E9" stroke="#14213D" stroke-width="1.5"/>
  <text x="210" y="132" text-anchor="middle" class="label" style="font-size:12.5px">Milestone: oorzaak vastgesteld</text>

  <!-- planning table expanded -->
  <rect x="20" y="170" width="380" height="150" rx="10" class="table-fill"/>
  <text x="35" y="190" class="sub" style="font-weight:700">PLANNING TABLE — beschikbaar</text>
  <rect x="35" y="200" width="350" height="34" rx="8" class="task-dashed"/>
  <text x="210" y="221" text-anchor="middle" class="label" style="font-size:12px">Contact opnemen met deelnemer</text>
  <rect x="35" y="242" width="350" height="34" rx="8" class="task-dashed"/>
  <text x="210" y="263" text-anchor="middle" class="label" style="font-size:12px">Juridisch advies inwinnen</text>
  <rect x="35" y="284" width="350" height="34" rx="8" class="task-dashed"/>
  <text x="210" y="305" text-anchor="middle" class="label" style="font-size:12px">Herberekening aanvragen</text>
</g>

<!-- Arrow between panels -->
<path d="M540,300 C 580,300 600,300 630,300" class="arrow"/>
<text x="585" y="285" text-anchor="middle" class="note" style="fill:#2563A8; font-weight:700">behandelaar kiest</text>

<!-- MOMENT 2 -->
<text x="880" y="122" text-anchor="middle" class="moment">Moment 2 — na een keuze van de behandelaar</text>
<g transform="translate(670,140)">
  <rect x="0" y="-14" width="150" height="20" rx="4" class="tab-fill"/>
  <text x="10" y="0" class="sub" style="font-weight:700">Klachtbehandeling</text>
  <rect x="0" y="6" width="420" height="330" rx="14" class="stage-fill"/>
  <use href="#icon-checklist" x="392" y="16"/>

  <rect x="20" y="40" width="380" height="55" rx="10" class="task-fill"/>
  <text x="210" y="70" text-anchor="middle" class="label">Dossier opvragen bij polisadministratie</text>

  <rect x="20" y="105" width="380" height="45" rx="22" fill="#FBF6E9" stroke="#14213D" stroke-width="1.5"/>
  <text x="210" y="132" text-anchor="middle" class="label" style="font-size:12.5px">Milestone: oorzaak vastgesteld</text>

  <!-- newly instantiated task, solid border -->
  <rect x="20" y="164" width="380" height="45" rx="10" fill="#CFE0F2" stroke="#14213D" stroke-width="1.75"/>
  <text x="210" y="192" text-anchor="middle" class="label" style="font-size:12.5px">Juridisch advies inwinnen (toegevoegd)</text>

  <!-- planning table now with 2 remaining -->
  <rect x="20" y="222" width="380" height="98" rx="10" class="table-fill"/>
  <text x="35" y="242" class="sub" style="font-weight:700">PLANNING TABLE — nog beschikbaar</text>
  <rect x="35" y="252" width="350" height="30" rx="8" class="task-dashed"/>
  <text x="210" y="271" text-anchor="middle" class="label" style="font-size:11.5px">Contact opnemen met deelnemer</text>
  <rect x="35" y="288" width="350" height="26" rx="8" class="task-dashed"/>
  <text x="210" y="305" text-anchor="middle" class="label" style="font-size:11.5px">Herberekening aanvragen</text>
</g>

<text x="575" y="560" text-anchor="middle" class="note">Eén model, twee geldige paden: de ervaren behandelaar voegt "Juridisch advies inwinnen" direct toe vanaf de planning table,</text>
<text x="575" y="578" text-anchor="middle" class="note">zonder dat een sentry daartoe dwingt — de minder ervaren behandelaar volgt eerst de gebruikelijke route.</text>
</svg>
