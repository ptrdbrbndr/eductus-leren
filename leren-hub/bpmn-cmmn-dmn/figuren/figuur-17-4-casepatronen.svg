<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'DM Sans', Arial, sans-serif" width="960" height="560" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .panel { fill:#FFFFFF; stroke:#E3E0D8; stroke-width:1.3; }
    .task { fill:#CFE0F2; stroke:#14213D; stroke-width:1.3; }
    .task-disc { fill:#CFE0F2; stroke:#14213D; stroke-width:1.3; stroke-dasharray:4,3; }
    .stage { fill:#EEF2F7; stroke:#14213D; stroke-width:1.4; }
    .milestone { fill:#EEF2F7; stroke:#14213D; stroke-width:1.4; }
    .doc { fill:#FBF6E9; stroke:#14213D; stroke-width:1.2; }
    .ext { fill:#FFFFFF; stroke:#55606F; stroke-width:1.2; stroke-dasharray:3,2; }
    .endc { fill:#EEF2F7; stroke:#14213D; stroke-width:2.4; }
    .patname { font-size:13px; font-weight:700; fill:#14213D; }
    .sub { font-size:9.7px; fill:#55606F; }
    .lbl { font-size:9px; font-weight:700; fill:#14213D; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    .arrow { stroke:#55606F; stroke-width:1.3; fill:none; marker-end:url(#arr); }
    .conn { stroke:#55606F; stroke-width:1.1; fill:none; stroke-dasharray:2,2; }
  </style>
  <marker id="arr" markerWidth="8" markerHeight="8" refX="5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="#55606F"/></marker>
</defs>
<rect width="960" height="560" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 17 · PATRONEN</text>
<text x="40" y="64" class="title">De vijf casepatronen naast elkaar</text>
<text x="40" y="84" class="sub">Elk patroon is een herkenbaar startpunt, geen dwingend sjabloon.</text>

<!-- panel backgrounds -->
<rect x="30" y="100" width="176" height="400" rx="10" class="panel"/>
<rect x="214" y="100" width="176" height="400" rx="10" class="panel"/>
<rect x="398" y="100" width="176" height="400" rx="10" class="panel"/>
<rect x="582" y="100" width="176" height="400" rx="10" class="panel"/>
<rect x="766" y="100" width="176" height="400" rx="10" class="panel"/>

<!-- ===== 1: Aanvraag met uitzonderingen ===== -->
<g transform="translate(30,0)">
  <text x="88" y="122" class="patname" text-anchor="middle">Aanvraag met</text>
  <text x="88" y="137" class="patname" text-anchor="middle">uitzonderingen</text>
  <rect x="14" y="170" width="42" height="30" rx="6" class="task"/>
  <line x1="24" y1="170" x2="24" y2="200" stroke="#14213D" stroke-width="1"/>
  <line x1="20" y1="170" x2="20" y2="200" stroke="#14213D" stroke-width="1"/>
  <line x1="56" y1="185" x2="70" y2="185" class="arrow"/>
  <rect x="70" y="170" width="42" height="30" rx="6" class="task"/>
  <line x1="80" y1="170" x2="80" y2="200" stroke="#14213D" stroke-width="1"/>
  <line x1="76" y1="170" x2="76" y2="200" stroke="#14213D" stroke-width="1"/>
  <line x1="112" y1="185" x2="126" y2="185" class="arrow"/>
  <rect x="126" y="170" width="42" height="30" rx="6" class="task"/>
  <line x1="136" y1="170" x2="136" y2="200" stroke="#14213D" stroke-width="1"/>
  <line x1="132" y1="170" x2="132" y2="200" stroke="#14213D" stroke-width="1"/>
  <text x="24" y="189" class="lbl" text-anchor="middle" font-size="7.5"> </text>
  <line x1="91" y1="200" x2="91" y2="220" class="conn"/>
  <rect x="55" y="220" width="72" height="26" rx="6" class="task-disc"/>
  <text x="91" y="237" class="sub" text-anchor="middle" font-size="8.5">uitzondering</text>
  <text x="91" y="270" class="sub" text-anchor="middle">Grotendeels standaard</text>
  <text x="91" y="283" class="sub" text-anchor="middle">traject (process tasks),</text>
  <text x="91" y="296" class="sub" text-anchor="middle">beperkt aantal</text>
  <text x="91" y="309" class="sub" text-anchor="middle">discretionary items voor</text>
  <text x="91" y="322" class="sub" text-anchor="middle">afwijkende gevallen.</text>
  <text x="91" y="342" class="sub" text-anchor="middle" font-weight="700">Weinig stages, gericht</text>
  <text x="91" y="355" class="sub" text-anchor="middle" font-weight="700">op snelheid.</text>
</g>

<!-- ===== 2: Klachtdossier ===== -->
<g transform="translate(214,0)">
  <text x="88" y="122" class="patname" text-anchor="middle">Klachtdossier</text>
  <path d="M60,168 h30 v-4 l8,8 v26 h-38 z" class="doc"/>
  <text x="88" y="212" class="sub" text-anchor="middle">case file</text>
  <rect x="16" y="230" width="55" height="30" rx="6" class="task-disc"/>
  <text x="43" y="243" class="sub" text-anchor="middle" font-size="8">onderzoeks-</text>
  <text x="43" y="253" class="sub" text-anchor="middle" font-size="8">fase (fragment)</text>
  <rect x="100" y="230" width="60" height="30" rx="6" class="stage"/>
  <text x="130" y="243" class="sub" text-anchor="middle" font-size="8">afhandelings-</text>
  <text x="130" y="253" class="sub" text-anchor="middle" font-size="8">fase (stage)</text>
  <line x1="71" y1="245" x2="100" y2="245" class="conn"/>
  <rect x="20" y="272" width="140" height="20" rx="10" class="milestone"/>
  <text x="90" y="286" class="sub" text-anchor="middle" font-size="8">voortgang aantoonbaar</text>
  <text x="90" y="320" class="sub" text-anchor="middle">Centraal case file met</text>
  <text x="90" y="333" class="sub" text-anchor="middle">onderzoeks- en</text>
  <text x="90" y="346" class="sub" text-anchor="middle">afhandelingsfase.</text>
  <text x="90" y="366" class="sub" text-anchor="middle" font-weight="700">Milestones tonen</text>
  <text x="90" y="379" class="sub" text-anchor="middle" font-weight="700">voortgang aan deelnemer.</text>
</g>

<!-- ===== 3: Letselzaak ===== -->
<g transform="translate(398,0)">
  <text x="88" y="122" class="patname" text-anchor="middle">Letselzaak</text>
  <rect x="55" y="168" width="30" height="12" rx="4" class="stage"/>
  <rect x="35" y="180" width="115" height="55" rx="10" class="stage"/>
  <text x="92" y="212" class="sub" text-anchor="middle">Letseldossier</text>
  <rect x="8" y="195" width="40" height="20" rx="4" class="ext"/>
  <text x="28" y="209" class="sub" text-anchor="middle" font-size="7">extern A</text>
  <line x1="35" y1="205" x2="48" y2="205" class="conn"/>
  <rect x="128" y="195" width="40" height="20" rx="4" class="ext"/>
  <text x="148" y="209" class="sub" text-anchor="middle" font-size="7">extern B</text>
  <line x1="150" y1="205" x2="128" y2="205" class="conn"/>
  <path d="M60,255 h20 v-3 l5,5 v18 h-25 z" class="doc"/>
  <path d="M68,251 h20 v-3 l5,5 v18 h-25 z" class="doc"/>
  <path d="M76,247 h20 v-3 l5,5 v18 h-25 z" class="doc"/>
  <text x="90" y="288" class="sub" text-anchor="middle">documentatie stapelt op</text>
  <line x1="20" y1="305" x2="160" y2="305" stroke="#2563A8" stroke-width="2"/>
  <text x="90" y="320" class="sub" text-anchor="middle">lange looptijd</text>
  <text x="90" y="345" class="sub" text-anchor="middle">Meerdere externe partijen,</text>
  <text x="90" y="358" class="sub" text-anchor="middle" font-weight="700">nadruk op documentatie</text>
  <text x="90" y="371" class="sub" text-anchor="middle" font-weight="700">en traceerbaarheid.</text>
</g>

<!-- ===== 4: Complexe mutatie ===== -->
<g transform="translate(582,0)">
  <text x="88" y="122" class="patname" text-anchor="middle">Complexe mutatie</text>
  <circle cx="20" cy="185" r="8" fill="#FFFFFF" stroke="#14213D" stroke-width="1.3"/>
  <line x1="28" y1="185" x2="44" y2="185" class="arrow"/>
  <rect x="44" y="170" width="36" height="30" rx="6" class="task"/>
  <line x1="86" y1="185" x2="98" y2="185" class="arrow"/>
  <rect x="98" y="172" width="16" height="12" rx="4" class="stage"/>
  <rect x="86" y="184" width="76" height="55" rx="10" class="stage"/>
  <text x="124" y="205" class="sub" text-anchor="middle" font-size="8">stage:</text>
  <text x="124" y="216" class="sub" text-anchor="middle" font-size="8">afwijking</text>
  <rect x="95" y="222" width="60" height="14" rx="4" class="task-disc"/>
  <text x="90" y="260" class="sub" text-anchor="middle">standaard verwerking</text>
  <text x="90" y="273" class="sub" text-anchor="middle">(BPMN-achtig) +</text>
  <text x="90" y="286" class="sub" text-anchor="middle">CMMN-stage voor</text>
  <text x="90" y="299" class="sub" text-anchor="middle">afwijkend deel.</text>
  <text x="90" y="325" class="sub" text-anchor="middle" font-weight="700">Hybride patroon —</text>
  <text x="90" y="338" class="sub" text-anchor="middle" font-weight="700">formeel uitgewerkt in</text>
  <text x="90" y="351" class="sub" text-anchor="middle" font-weight="700">deel 18.</text>
</g>

<!-- ===== 5: Onderzoek met open einde ===== -->
<g transform="translate(766,0)">
  <text x="88" y="122" class="patname" text-anchor="middle">Onderzoek met</text>
  <text x="88" y="137" class="patname" text-anchor="middle">open einde</text>
  <rect x="55" y="168" width="30" height="12" rx="4" class="stage"/>
  <rect x="35" y="180" width="115" height="45" rx="10" class="stage"/>
  <text x="92" y="207" class="sub" text-anchor="middle">Onderzoek</text>
  <rect x="45" y="235" width="90" height="18" rx="9" class="milestone"/>
  <text x="90" y="247" class="sub" text-anchor="middle" font-size="8">tussentijdse bevinding</text>
  <line x1="60" y1="253" x2="35" y2="278" class="conn"/>
  <line x1="90" y1="253" x2="90" y2="278" class="conn"/>
  <line x1="120" y1="253" x2="145" y2="278" class="conn"/>
  <circle cx="35" cy="288" r="9" fill="#EEF2F7" stroke="#14213D" stroke-width="2.2"/>
  <circle cx="90" cy="288" r="9" fill="#EEF2F7" stroke="#14213D" stroke-width="2.2"/>
  <circle cx="145" cy="288" r="9" fill="#EEF2F7" stroke="#14213D" stroke-width="2.2"/>
  <text x="35" y="305" class="sub" text-anchor="middle" font-size="7">uitkomst A</text>
  <text x="90" y="305" class="sub" text-anchor="middle" font-size="7">uitkomst B</text>
  <text x="145" y="305" class="sub" text-anchor="middle" font-size="7">uitkomst C</text>
  <text x="90" y="330" class="sub" text-anchor="middle">Geen vooraf bekende</text>
  <text x="90" y="343" class="sub" text-anchor="middle" font-weight="700">einduitkomst — milestones</text>
  <text x="90" y="356" class="sub" text-anchor="middle" font-weight="700">markeren bevindingen,</text>
  <text x="90" y="369" class="sub" text-anchor="middle" font-weight="700">niet voortgang naar één doel.</text>
</g>

<rect x="30" y="512" width="912" height="34" rx="6" fill="#EEF2F7"/>
<text x="486" y="533" class="sub" text-anchor="middle">Herken het patroon eerst — pas het daarna aan, in plaats van vanaf nul stages en sentries te bedenken.</text>
</svg>
