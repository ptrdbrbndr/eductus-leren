<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .decision { fill:#CFE0F2; stroke:#2563A8; stroke-width:2; }
      .inputdata { fill:#EEF2F7; stroke:#14213D; stroke-width:1.5; }
      .label { font-size:15px; font-weight:700; fill:#14213D; }
      .label-small { font-size:12.5px; font-weight:600; fill:#14213D; }
      .sub { font-size:12px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .shapekicker { font-size:10.5px; fill:#55606F; letter-spacing:.08em; }
      .arrow { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arr); }
      .legendline { stroke:#2563A8; stroke-width:2; }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563A8"/></marker>
</defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 06 · DMN-NOTATIE</text>
<text x="40" y="64" class="title">Figuur 6.1 — DRD: aanvraag waardeoverdracht (WI-114)</text>
<text x="40" y="86" class="sub">Eén decision, drie input data-elementen, drie information requirements — casus Meridiaan Pensioen N.V.</text>

<!-- Decision -->
<rect x="350" y="140" width="260" height="86" class="decision"/>
<text x="480" y="176" text-anchor="middle" class="label">Aanvraag waardeoverdracht</text>
<text x="480" y="196" text-anchor="middle" class="label">beoordelen</text>
<text x="480" y="216" text-anchor="middle" class="sub">Decision · uitkomst: goedkeuren / aanhouden / afwijzen</text>
<text x="350" y="132" class="shapekicker">DECISION — platte rechthoek</text>

<!-- Input data pills -->
<rect x="60" y="420" width="250" height="76" rx="38" class="inputdata"/>
<text x="185" y="452" text-anchor="middle" class="label-small">Actief dienstverband</text>
<text x="185" y="470" text-anchor="middle" class="label-small">op aanvraagdatum</text>
<text x="60" y="412" class="shapekicker">INPUT DATA — pilvorm</text>

<rect x="355" y="420" width="250" height="76" rx="38" class="inputdata"/>
<text x="480" y="452" text-anchor="middle" class="label-small">Overdrachtswaarde t.o.v.</text>
<text x="480" y="470" text-anchor="middle" class="label-small">afkoopgrens</text>

<rect x="650" y="420" width="250" height="76" rx="38" class="inputdata"/>
<text x="775" y="452" text-anchor="middle" class="label-small">Dekkingsgraad beide fondsen</text>
<text x="775" y="470" text-anchor="middle" class="label-small">≥ 100%</text>

<!-- Information requirements (solid arrows, input data -> decision) -->
<path d="M 200 420 C 250 340, 340 280, 400 228" class="arrow"/>
<path d="M 480 420 L 480 228" class="arrow"/>
<path d="M 760 420 C 700 340, 610 280, 555 228" class="arrow"/>

<!-- Legend -->
<rect x="40" y="530" width="880" height="62" fill="#EEF2F7" stroke="#E3E0D8" stroke-width="1"/>
<text x="58" y="550" class="shapekicker">LEGENDA</text>
<rect x="58" y="560" width="26" height="18" class="decision"/>
<text x="94" y="573" class="sub">Decision (platte rechthoek)</text>
<rect x="280" y="560" width="30" height="18" rx="9" class="inputdata"/>
<text x="322" y="573" class="sub">Input data (pilvorm)</text>
<line x1="500" y1="569" x2="560" y2="569" class="legendline" marker-end="url(#arr)"/>
<text x="570" y="573" class="sub">Information requirement (van input data naar decision)</text>
</svg>
