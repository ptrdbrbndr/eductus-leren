<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 700" font-family="'DM Sans', Arial, sans-serif" width="1500" height="700" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .pool { fill:#FFFFFF; stroke:#14213D; stroke-width:1.5; }
    .lanediv { stroke:#14213D; stroke-width:1; }
    .pooldiv { stroke:#14213D; stroke-width:1; }
    .poolname { font-size:12.5px; font-weight:700; fill:#14213D; }
    .lanename { font-size:12px; font-weight:700; fill:#14213D; }
    .task { fill:#CFE0F2; stroke:#14213D; stroke-width:1.4; }
    .task-label { font-size:11.5px; fill:#14213D; font-weight:600; }
    .evt-start { fill:#FBFAF7; stroke:#14213D; stroke-width:1.6; }
    .evt-end { fill:#FBFAF7; stroke:#14213D; stroke-width:3; }
    .gateway { fill:#FBFAF7; stroke:#14213D; stroke-width:1.6; }
    .gw-label { font-size:11.5px; fill:#14213D; font-weight:700; }
    .seq { stroke:#14213D; stroke-width:1.6; fill:none; marker-end:url(#seqarr); }
    .flowtag { font-size:10.5px; font-weight:700; fill:#55606F; }
    .chip { fill:#E9A13B; stroke:#14213D; stroke-width:1.2; }
    .chip-icon { stroke:#FBFAF7; stroke-width:1.2; fill:none; }
    .leader { stroke:#E9A13B; stroke-width:1.3; fill:none; stroke-dasharray:3 3; }
    .chip-title { font-size:12px; font-weight:700; fill:#14213D; }
    .chip-sub { font-size:10.5px; fill:#55606F; }
    .brace { stroke:#E9A13B; stroke-width:2; fill:none; }
    .brace-label { font-size:13px; font-weight:700; fill:#14213D; }
    .label { font-size:14px; font-weight:700; fill:#14213D; }
    .sub { font-size:12px; fill:#55606F; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
  </style>
  <marker id="seqarr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#14213D"/></marker>
</defs>
<rect width="1500" height="700" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 12 · BPMN</text>
<text x="40" y="64" class="title">Figuur 12.3 — Knelpuntanalyse op het procesmodel: vier meetpunten</text>
<text x="40" y="86" class="sub">Doorlooptijd, wachttijd, overdrachten en herbewerking/uitval — dezelfde vier dimensies uit §12.4, op hun plek in het model.</text>

<!-- pool -->
<rect x="60" y="140" width="1380" height="380" class="pool"/>
<line x1="100" y1="140" x2="100" y2="520" class="pooldiv"/>
<line x1="60" y1="280" x2="1440" y2="280" class="lanediv"/>
<text x="80" y="330" class="poolname" text-anchor="middle" transform="rotate(-90 80 330)">Deelnemermutatie verwerken</text>
<text x="115" y="165" class="lanename">Intake</text>
<text x="115" y="300" class="lanename">Specialist</text>

<!-- lane 1: intake -->
<circle cx="170" cy="216" r="15" class="evt-start"/>
<line x1="185" y1="216" x2="217" y2="216" class="seq"/>
<rect x="220" y="190" width="150" height="52" rx="10" class="task"/>
<text x="295" y="213" text-anchor="middle" class="task-label">Mutatie</text>
<text x="295" y="227" text-anchor="middle" class="task-label">ontvangen</text>

<!-- cross-lane transfer -->
<line x1="295" y1="242" x2="295" y2="353" class="seq"/>

<!-- lane 2: specialist -->
<rect x="220" y="356" width="150" height="52" rx="10" class="task"/>
<text x="295" y="379" text-anchor="middle" class="task-label">Mutatie</text>
<text x="295" y="393" text-anchor="middle" class="task-label">beoordelen</text>
<line x1="370" y1="382" x2="441" y2="382" class="seq"/>

<polygon points="470,356 496,382 470,408 444,382" class="gateway"/>
<path d="M460,372 L480,392 M480,372 L460,392" stroke="#14213D" stroke-width="1.5"/>
<text x="470" y="340" text-anchor="middle" class="gw-label">Compleet?</text>

<!-- ja: forward -->
<text x="505" y="372" class="flowtag">ja</text>
<line x1="496" y1="382" x2="717" y2="382" class="seq"/>
<rect x="720" y="356" width="160" height="52" rx="10" class="task"/>
<text x="800" y="379" text-anchor="middle" class="task-label">Mutatie</text>
<text x="800" y="393" text-anchor="middle" class="task-label">verwerken</text>
<line x1="880" y1="382" x2="960" y2="382" class="seq"/>
<circle cx="980" cy="382" r="17" class="evt-end"/>

<!-- nee: rework -->
<text x="475" y="420" class="flowtag">nee</text>
<path d="M470,408 L470,425 L654,425 L654,437" class="seq"/>
<rect x="560" y="440" width="190" height="52" rx="10" class="task"/>
<text x="655" y="463" text-anchor="middle" class="task-label">Aanvullende info</text>
<text x="655" y="477" text-anchor="middle" class="task-label">opvragen</text>

<!-- loop back into re-assessment -->
<path d="M560,466 L295,466 L295,411" class="seq"/>

<!-- amber measurement chips -->
<!-- wachttijd -->
<path d="M388,258 L302,278" class="leader"/>
<circle cx="400" cy="255" r="13" class="chip"/>
<circle cx="400" cy="255" r="4" class="chip-icon"/>
<line x1="400" y1="255" x2="400" y2="251.5" class="chip-icon"/>
<line x1="400" y1="255" x2="402.5" y2="256.5" class="chip-icon"/>
<text x="420" y="251" class="chip-title">Wachttijd</text>
<text x="420" y="265" class="chip-sub">tijd tussen overdracht en oppak</text>

<!-- overdrachten -->
<path d="M388,312 L302,288" class="leader"/>
<circle cx="400" cy="312" r="13" class="chip"/>
<path d="M394,308 H403 M403,308 L400,305 M403,308 L400,311" class="chip-icon"/>
<path d="M406,316 H397 M397,316 L400,319 M397,316 L400,313" class="chip-icon"/>
<text x="420" y="308" class="chip-title">Overdrachten</text>
<text x="420" y="322" class="chip-sub">telpunt: aantal keer van behandelaar wisselen</text>

<!-- herbewerking/uitval -->
<path d="M628,418 L602,427" class="leader"/>
<circle cx="640" cy="416" r="13" class="chip"/>
<path d="M645,410 A6,6 0 1 1 635,410" class="chip-icon"/>
<path d="M634,407 L635,410 L638,410" class="chip-icon"/>
<text x="660" y="412" class="chip-title">Herbewerking / uitval</text>
<text x="660" y="426" class="chip-sub">elke terugval naar &quot;aanvullende info&quot; telt mee</text>

<!-- doorlooptijd brace -->
<path d="M170,538 L170,552 L980,552 L980,538 M575,552 L575,566" class="brace"/>
<circle cx="575" cy="576" r="12" class="chip"/>
<path d="M575,570 V576 L579,579" class="chip-icon"/>
<text x="575" y="602" text-anchor="middle" class="brace-label">Doorlooptijd</text>
<text x="575" y="618" text-anchor="middle" class="chip-sub">volledige spanne van start- tot eindgebeurtenis</text>

</svg>
