<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 690" font-family="'DM Sans', Arial, sans-serif" width="960" height="690" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .task { fill:#CFE0F2; stroke:#14213D; stroke-width:1.4; }
    .decision { fill:#EEF2F7; stroke:#14213D; stroke-width:1.4; }
    .gw { fill:#FFFFFF; stroke:#14213D; stroke-width:1.5; }
    .startev { fill:#FFFFFF; stroke:#14213D; stroke-width:1.4; }
    .spec-box { fill:#FBF6E9; stroke:#E9A13B; stroke-width:1.6; stroke-dasharray:6,4; }
    .spec-stage { fill:#FBF6E9; stroke:#E9A13B; stroke-width:1.6; stroke-dasharray:6,4; }
    .panel { fill:#FFFFFF; stroke:#E3E0D8; stroke-width:1.3; }
    .badge-g { fill:#2563A8; }
    .badge-s { fill:#E9A13B; }
    .label { font-size:11.5px; font-weight:700; fill:#14213D; }
    .sub { font-size:10px; fill:#55606F; }
    .sub-sm { font-size:9.2px; fill:#55606F; }
    .patname { font-size:12px; font-weight:700; fill:#14213D; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    .sectionhead { font-size:13px; font-weight:700; fill:#2563A8; }
    .seq { stroke:#14213D; stroke-width:1.4; fill:none; marker-end:url(#arrS); }
    .assoc { stroke:#55606F; stroke-width:1; fill:none; stroke-dasharray:3,2; }
  </style>
  <marker id="arrS" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#14213D"/></marker>
</defs>
<rect width="960" height="690" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 18 · REFERENTIEMODEL</text>
<text x="40" y="64" class="title">Hybride referentiemodel met de vijf afdelingsvarianten</text>
<text x="40" y="84" class="sub">Eén basispatroon voor het Mutatieplatform: ontvangst en classificatie zijn generiek, de vertakking is per afdeling ingevuld.</text>

<text x="40" y="106" class="sectionhead">Generiek basispatroon (alle vijf afdelingen)</text>

<!-- generic flow -->
<circle cx="55" cy="188" r="15" class="startev"/>
<circle cx="68" cy="176" r="6" class="badge-g"/>
<line x1="70" y1="188" x2="86" y2="188" class="seq"/>

<rect x="86" y="163" width="120" height="50" rx="8" class="task"/>
<circle cx="200" cy="169" r="6" class="badge-g"/>
<text x="146" y="184" class="sub" font-weight="700" text-anchor="middle">Mutatie</text>
<text x="146" y="196" class="sub" font-weight="700" text-anchor="middle">ontvangen</text>

<line x1="206" y1="188" x2="246" y2="188" class="seq"/>
<rect x="246" y="163" width="130" height="50" rx="8" class="task"/>
<circle cx="370" cy="169" r="6" class="badge-g"/>
<rect x="258" y="172" width="16" height="12" fill="none" stroke="#14213D" stroke-width="1"/>
<line x1="258" y1="178" x2="274" y2="178" stroke="#14213D" stroke-width="0.8"/>
<line x1="266" y1="172" x2="266" y2="184" stroke="#14213D" stroke-width="0.8"/>
<text x="311" y="192" class="sub" font-weight="700" text-anchor="middle">Classificeren</text>

<line x1="300" y1="213" x2="300" y2="243" class="assoc"/>
<rect x="255" y="243" width="100" height="30" class="decision"/>
<circle cx="349" cy="248" r="6" class="badge-g"/>
<text x="305" y="262" class="sub" font-weight="700" text-anchor="middle">Route bepalen</text>

<line x1="376" y1="188" x2="404" y2="188" class="seq"/>
<polygon points="424,168 444,188 424,208 404,188" class="gw"/>
<circle cx="440" cy="172" r="6" class="badge-g"/>

<path d="M424,168 L424,150 L520,150" class="seq"/>
<text x="470" y="142" class="sub" font-weight="700">route: hoog-volume</text>
<rect x="520" y="130" width="215" height="55" rx="8" class="spec-box"/>
<circle cx="725" cy="135" r="6" class="badge-s"/>
<text x="627" y="153" class="label" text-anchor="middle">BPMN-vervolgtraject</text>
<text x="627" y="168" class="sub" text-anchor="middle">afdelingsspecifiek —</text>
<text x="627" y="180" class="sub" text-anchor="middle">per afdeling ingevuld</text>

<path d="M424,208 L424,230 L525,230" class="seq"/>
<text x="470" y="222" class="sub" font-weight="700">route: dossiergedreven</text>
<rect x="540" y="222" width="42" height="13" rx="4" class="spec-stage"/>
<rect x="520" y="235" width="215" height="65" rx="12" class="spec-stage"/>
<circle cx="725" cy="240" r="6" class="badge-s"/>
<text x="627" y="262" class="label" text-anchor="middle">CMMN-casetraject</text>
<text x="627" y="277" class="sub" text-anchor="middle">afdelingsspecifiek —</text>
<text x="627" y="289" class="sub" text-anchor="middle">per afdeling ingevuld</text>

<!-- legend -->
<rect x="760" y="130" width="170" height="90" rx="8" fill="#FFFFFF" stroke="#B9C4D0" stroke-width="1"/>
<circle cx="778" cy="150" r="6" class="badge-g"/>
<text x="792" y="154" class="sub">generiek — herbruikbaar</text>
<text x="792" y="166" class="sub">over alle vijf afdelingen</text>
<circle cx="778" cy="188" r="6" class="badge-s"/>
<text x="792" y="192" class="sub">afdelingsspecifiek — per</text>
<text x="792" y="204" class="sub">afdeling anders ingevuld</text>

<line x1="30" y1="318" x2="930" y2="318" stroke="#E3E0D8" stroke-width="1.5"/>
<text x="40" y="340" class="sectionhead">De vijf afdelingsvarianten</text>

<rect x="30" y="355" width="176" height="290" rx="10" class="panel"/>
<rect x="214" y="355" width="176" height="290" rx="10" class="panel"/>
<rect x="398" y="355" width="176" height="290" rx="10" class="panel"/>
<rect x="582" y="355" width="176" height="290" rx="10" class="panel"/>
<rect x="766" y="355" width="176" height="290" rx="10" class="panel"/>

<!-- 1 Deelnemermutaties -->
<g transform="translate(30,0)">
  <text x="88" y="377" class="patname" text-anchor="middle">Deelnemer-</text>
  <text x="88" y="391" class="patname" text-anchor="middle">mutaties</text>
  <rect x="22" y="410" width="34" height="26" rx="5" class="task"/>
  <line x1="56" y1="423" x2="66" y2="423" class="seq"/>
  <rect x="66" y="410" width="34" height="26" rx="5" class="task"/>
  <line x1="100" y1="423" x2="110" y2="423" class="seq"/>
  <rect x="110" y="410" width="34" height="26" rx="5" class="task"/>
  <line x1="144" y1="423" x2="154" y2="423" class="seq"/>
  <circle cx="163" cy="423" r="9" class="startev" stroke-width="2.4"/>
  <text x="90" y="465" class="sub-sm" text-anchor="middle">Vrijwel volledig het</text>
  <text x="90" y="477" class="sub-sm" text-anchor="middle" font-weight="700">generieke BPMN-pad —</text>
  <text x="90" y="489" class="sub-sm" text-anchor="middle" font-weight="700">nauwelijks CMMN nodig.</text>
  <text x="90" y="509" class="sub-sm" text-anchor="middle">Hoog volume, grotendeels</text>
  <text x="90" y="521" class="sub-sm" text-anchor="middle">standaardiseerbaar.</text>
</g>

<!-- 2 Werkgevermutaties -->
<g transform="translate(214,0)">
  <text x="88" y="377" class="patname" text-anchor="middle">Werkgever-</text>
  <text x="88" y="391" class="patname" text-anchor="middle">mutaties</text>
  <rect x="18" y="410" width="30" height="26" rx="5" class="task"/>
  <line x1="48" y1="423" x2="58" y2="423" class="seq"/>
  <rect x="65" y="404" width="18" height="9" rx="3" class="spec-stage"/>
  <rect x="58" y="412" width="60" height="34" rx="8" class="spec-stage"/>
  <line x1="118" y1="429" x2="128" y2="429" class="seq"/>
  <rect x="128" y="416" width="30" height="26" rx="5" class="task"/>
  <text x="90" y="465" class="sub-sm" text-anchor="middle" font-weight="700">BPMN-pad met een</text>
  <text x="90" y="477" class="sub-sm" text-anchor="middle" font-weight="700">CMMN-stage voor</text>
  <text x="90" y="489" class="sub-sm" text-anchor="middle" font-weight="700">samenhangende</text>
  <text x="90" y="501" class="sub-sm" text-anchor="middle" font-weight="700">wijzigingen (§18.2).</text>
</g>

<!-- 3 Waardeoverdrachten -->
<g transform="translate(398,0)">
  <text x="88" y="377" class="patname" text-anchor="middle">Waarde-</text>
  <text x="88" y="391" class="patname" text-anchor="middle">overdrachten</text>
  <rect x="20" y="412" width="30" height="26" rx="5" class="task"/>
  <line x1="50" y1="425" x2="60" y2="425" class="seq"/>
  <rect x="60" y="412" width="30" height="26" rx="5" class="task"/>
  <line x1="90" y1="425" x2="100" y2="425" class="seq"/>
  <circle cx="109" cy="425" r="9" class="startev" stroke-width="2.4"/>
  <rect x="40" y="450" width="90" height="18" rx="4" fill="#FFFFFF" stroke="#55606F" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="85" y="463" class="sub-sm" text-anchor="middle" font-size="8">pool: andere uitvoerder</text>
  <text x="90" y="495" class="sub-sm" text-anchor="middle" font-weight="700">BPMN-pad, uitgebreid</text>
  <text x="90" y="507" class="sub-sm" text-anchor="middle" font-weight="700">met een externe pool</text>
  <text x="90" y="519" class="sub-sm" text-anchor="middle">(ketensamenwerking).</text>
</g>

<!-- 4 Klachten & Bezwaren -->
<g transform="translate(582,0)">
  <text x="88" y="377" class="patname" text-anchor="middle">Klachten &amp;</text>
  <text x="88" y="391" class="patname" text-anchor="middle">Bezwaren</text>
  <rect x="35" y="404" width="30" height="12" rx="4" class="spec-stage"/>
  <rect x="20" y="414" width="140" height="55" rx="10" class="spec-stage"/>
  <text x="90" y="432" class="sub-sm" text-anchor="middle">Stage: Onderzoek</text>
  <rect x="35" y="438" width="70" height="22" rx="5" class="task"/>
  <line x1="41" y1="438" x2="41" y2="460" stroke="#14213D" stroke-width="0.9"/>
  <line x1="45" y1="438" x2="45" y2="460" stroke="#14213D" stroke-width="0.9"/>
  <text x="70" y="452" class="sub-sm" text-anchor="middle" font-size="7.6">process task</text>
  <text x="90" y="495" class="sub-sm" text-anchor="middle" font-weight="700">CMMN-pad met BPMN</text>
  <text x="90" y="507" class="sub-sm" text-anchor="middle" font-weight="700">process tasks voor vaste</text>
  <text x="90" y="519" class="sub-sm" text-anchor="middle" font-weight="700">deelstappen (§18.3).</text>
</g>

<!-- 5 Bijzondere Situaties -->
<g transform="translate(766,0)">
  <text x="88" y="377" class="patname" text-anchor="middle">Bijzondere</text>
  <text x="88" y="391" class="patname" text-anchor="middle">Situaties</text>
  <rect x="35" y="404" width="30" height="12" rx="4" class="spec-stage"/>
  <rect x="20" y="414" width="140" height="60" rx="10" class="spec-stage"/>
  <text x="90" y="432" class="sub-sm" text-anchor="middle">Case</text>
  <rect x="32" y="438" width="55" height="18" rx="4" fill="#CFE0F2" stroke="#14213D" stroke-width="1.1" stroke-dasharray="3,2"/>
  <rect x="95" y="438" width="55" height="18" rx="4" fill="#CFE0F2" stroke="#14213D" stroke-width="1.1" stroke-dasharray="3,2"/>
  <text x="59" y="450" class="sub-sm" text-anchor="middle" font-size="7">discretionary</text>
  <text x="122" y="450" class="sub-sm" text-anchor="middle" font-size="7">discretionary</text>
  <text x="90" y="495" class="sub-sm" text-anchor="middle" font-weight="700">Vrijwel volledig het</text>
  <text x="90" y="507" class="sub-sm" text-anchor="middle" font-weight="700">CMMN-pad — casearchi-</text>
  <text x="90" y="519" class="sub-sm" text-anchor="middle" font-weight="700">tectuur uit deel 17.</text>
</g>

<rect x="30" y="658" width="912" height="26" rx="6" fill="#EEF2F7"/>
<text x="486" y="675" class="sub" text-anchor="middle">De classificatie-decision (DMN) bepaalt de vertakking per afdeling — zelf weer centraal beheerd (deel 16).</text>
</svg>
