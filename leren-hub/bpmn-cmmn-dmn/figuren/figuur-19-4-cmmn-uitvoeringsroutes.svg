<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 660" font-family="'DM Sans', Arial, sans-serif" width="1160" height="660" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    .colhead { font-size:14px; font-weight:700; fill:#14213D; }
    .sub { font-size:10.5px; fill:#55606F; }
    .stage { fill:#FBFAF7; stroke:#14213D; stroke-width:1.6; }
    .tab { fill:#FBFAF7; stroke:#14213D; stroke-width:1.6; }
    .task-solid { fill:#CFE0F2; stroke:#2563A8; stroke-width:1.6; }
    .task-grey { fill:#EEF2F7; stroke:#55606F; stroke-width:1.3; stroke-dasharray:4 3; }
    .task-lbl { font-size:9.5px; fill:#14213D; }
    .consq { font-size:10.8px; fill:#14213D; }
    .colcard { fill:#FFFFFF; stroke:#E3E0D8; stroke-width:1.2; }
    .fit { fill:#E3E0D8; }
    .part { fill:#CFE0F2; }
    .full { fill:#2563A8; }
  </style>
</defs>
<rect width="1160" height="660" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 19 · FIGUUR 19.4 · VERGELIJKING</text>
<text x="40" y="64" class="title">De drie CMMN-uitvoeringsroutes en hun consequenties</text>

<!-- three columns -->
<g transform="translate(40,100)">

  <!-- COLUMN A -->
  <g transform="translate(0,0)">
    <rect x="0" y="0" width="340" height="500" rx="10" class="colcard"/>
    <rect x="0" y="0" width="340" height="8" fill="#E3E0D8"/>
    <text x="20" y="34" class="colhead">(a) Analyse-only</text>
    <text x="20" y="52" class="sub">casemodel = specificatie</text>

    <!-- stage diagram: whole stage greyed, hatched -->
    <path d="M30,78 h50 v10 l-8,8 h-42 z" class="tab"/>
    <rect x="30" y="88" width="280" height="150" rx="6" class="stage"/>
    <g font-size="8.5">
      <rect x="46" y="108" width="90" height="30" rx="5" class="task-grey"/>
      <text x="91" y="127" text-anchor="middle" class="task-lbl">Dossier openen</text>
      <rect x="150" y="108" width="90" height="30" rx="5" class="task-grey"/>
      <text x="195" y="127" text-anchor="middle" class="task-lbl">Onderzoek (vrij)</text>
      <rect x="46" y="150" width="90" height="30" rx="5" class="task-grey"/>
      <text x="91" y="169" text-anchor="middle" class="task-lbl">Advies opstellen</text>
      <rect x="150" y="150" width="90" height="30" rx="5" class="task-grey"/>
      <text x="195" y="169" text-anchor="middle" class="task-lbl">Dossier sluiten</text>
    </g>
    <text x="170" y="222" text-anchor="middle" class="sub" font-style="italic">volledig grijs = niet engine-gedreven</text>

    <text x="20" y="264" class="sub" font-weight="700">↓ daadwerkelijke uitvoering</text>
    <rect x="30" y="272" width="280" height="46" rx="6" fill="#EEF2F7" stroke="#14213D" stroke-width="1.4"/>
    <text x="170" y="292" text-anchor="middle" class="task-lbl" font-weight="700">generieke taken-/dossierapplicatie</text>
    <text x="170" y="306" text-anchor="middle" class="task-lbl">(niet CMMN-native)</text>

    <line x1="20" y1="340" x2="320" y2="340" stroke="#E3E0D8"/>
    <text x="20" y="362" class="consq" font-weight="700">Consequenties</text>
    <text x="20" y="382" class="consq">• model is specificatie- en trainingsdocument</text>
    <text x="20" y="400" class="consq">• geen sentry vuurt daadwerkelijk in het model zelf</text>
    <text x="20" y="418" class="consq">• geen deployment-risico, geen platformafhankelijkheid</text>
    <text x="20" y="436" class="consq">• passend bij: kort-op-korte-termijn realisme, laagste</text>
    <text x="20" y="452" class="consq">  investering</text>
    <text x="20" y="478" class="consq" fill="#55606F" font-style="italic">Meridiaan: huidige koers voor Bijzondere Situaties</text>
  </g>

  <!-- COLUMN B -->
  <g transform="translate(370,0)">
    <rect x="0" y="0" width="340" height="500" rx="10" class="colcard"/>
    <rect x="0" y="0" width="340" height="8" fill="#6FA3D6"/>
    <text x="20" y="34" class="colhead">(b) Gedeeltelijk</text>
    <text x="20" y="52" class="sub">kernstructuur draait, rest handmatig</text>

    <path d="M30,78 h50 v10 l-8,8 h-42 z" class="tab"/>
    <rect x="30" y="88" width="280" height="150" rx="6" class="stage"/>
    <g font-size="8.5">
      <rect x="46" y="108" width="90" height="30" rx="5" class="task-solid"/>
      <text x="91" y="127" text-anchor="middle" class="task-lbl">Dossier openen</text>
      <rect x="150" y="108" width="90" height="30" rx="5" class="task-grey"/>
      <text x="195" y="127" text-anchor="middle" class="task-lbl">Onderzoek (vrij)</text>
      <rect x="46" y="150" width="90" height="30" rx="5" class="task-grey"/>
      <text x="91" y="169" text-anchor="middle" class="task-lbl">Advies opstellen</text>
      <rect x="150" y="150" width="90" height="30" rx="5" class="task-solid"/>
      <text x="195" y="169" text-anchor="middle" class="task-lbl">Dossier sluiten</text>
      <path d="M46,104 l-6,-6 l6,-6 l6,6 z" fill="#FFFFFF" stroke="#14213D" stroke-width="1"/>
      <path d="M150,104 l-6,-6 l6,-6 l6,6 z" fill="#FFFFFF" stroke="#14213D" stroke-width="1"/>
    </g>
    <text x="170" y="222" text-anchor="middle" class="sub" font-style="italic">blauw = required, engine-gedreven · grijs = discretionary, handmatig</text>

    <text x="20" y="264" class="sub" font-weight="700">↓ engine bewaakt milestones, mens vult in</text>
    <rect x="30" y="272" width="280" height="46" rx="6" fill="#CFE0F2" stroke="#2563A8" stroke-width="1.4"/>
    <text x="170" y="292" text-anchor="middle" class="task-lbl" font-weight="700">Conductus CMMN-editor (huidige grens)</text>
    <text x="170" y="306" text-anchor="middle" class="task-lbl">stages + required tasks native</text>

    <line x1="20" y1="340" x2="320" y2="340" stroke="#E3E0D8"/>
    <text x="20" y="362" class="consq" font-weight="700">Consequenties</text>
    <text x="20" y="382" class="consq">• kernstructuur en verplichte taken zijn afdwingbaar</text>
    <text x="20" y="400" class="consq">• fijnmazige discretionary-logica blijft handmatig werk</text>
    <text x="20" y="418" class="consq">• sturing én autonomie tegelijk, maar met een naad</text>
    <text x="20" y="436" class="consq">  ertussen die je moet onderhouden</text>
    <text x="20" y="452" class="consq">• passend bij: gegeven de bekende beperkingen van de</text>
    <text x="20" y="468" class="consq">  Conductus CMMN-editor het meest realistisch</text>
    <text x="20" y="478" class="consq" fill="#55606F" font-style="italic"> </text>
  </g>

  <!-- COLUMN C -->
  <g transform="translate(740,0)">
    <rect x="0" y="0" width="340" height="500" rx="10" class="colcard"/>
    <rect x="0" y="0" width="340" height="8" fill="#2563A8"/>
    <text x="20" y="34" class="colhead">(c) Volledig</text>
    <text x="20" y="52" class="sub">alles engine-native</text>

    <path d="M30,78 h50 v10 l-8,8 h-42 z" class="tab"/>
    <rect x="30" y="88" width="280" height="150" rx="6" class="stage"/>
    <g font-size="8.5">
      <rect x="46" y="108" width="90" height="30" rx="5" class="task-solid"/>
      <text x="91" y="127" text-anchor="middle" class="task-lbl">Dossier openen</text>
      <rect x="150" y="108" width="90" height="30" rx="5" class="task-solid"/>
      <text x="195" y="127" text-anchor="middle" class="task-lbl">Onderzoek (vrij)</text>
      <rect x="46" y="150" width="90" height="30" rx="5" class="task-solid"/>
      <text x="91" y="169" text-anchor="middle" class="task-lbl">Advies opstellen</text>
      <rect x="150" y="150" width="90" height="30" rx="5" class="task-solid"/>
      <text x="195" y="169" text-anchor="middle" class="task-lbl">Dossier sluiten</text>
      <path d="M46,104 l-6,-6 l6,-6 l6,6 z" fill="#FFFFFF" stroke="#14213D" stroke-width="1"/>
      <path d="M150,104 l-6,-6 l6,-6 l6,6 z" fill="#FFFFFF" stroke="#14213D" stroke-width="1"/>
      <path d="M46,146 l-6,-6 l6,-6 l6,6 z" fill="#FFFFFF" stroke="#14213D" stroke-width="1"/>
      <path d="M150,146 l-6,-6 l6,-6 l6,6 z" fill="#FFFFFF" stroke="#14213D" stroke-width="1"/>
    </g>
    <text x="170" y="222" text-anchor="middle" class="sub" font-style="italic">alles blauw = sentries, discretionary items, plan fragments engine-native</text>

    <text x="20" y="264" class="sub" font-weight="700">↓ engine draait het volledige casemodel</text>
    <rect x="30" y="272" width="280" height="46" rx="6" fill="#2563A8" stroke="#14213D" stroke-width="1.4"/>
    <text x="170" y="292" text-anchor="middle" class="task-lbl" fill="#FBFAF7" font-weight="700">volwaardige CMMN-engine</text>
    <text x="170" y="306" text-anchor="middle" class="task-lbl" fill="#FBFAF7">(niet Conductus, op dit moment)</text>

    <line x1="20" y1="340" x2="320" y2="340" stroke="#E3E0D8"/>
    <text x="20" y="362" class="consq" font-weight="700">Consequenties</text>
    <text x="20" y="382" class="consq">• model en uitvoering zijn één en hetzelfde artefact</text>
    <text x="20" y="400" class="consq">• vergt een platform met volledige CMMN 1.1-support</text>
    <text x="20" y="418" class="consq">• hoogste investering, hoogste platformafhankelijkheid</text>
    <text x="20" y="436" class="consq">• voor Bijzondere Situaties en Klachten &amp; Bezwaren op</text>
    <text x="20" y="452" class="consq">  korte termijn niet realistisch gegeven de bekende</text>
    <text x="20" y="468" class="consq">  beperkingen van de Conductus CMMN-editor (§19.4)</text>
    <text x="20" y="478" class="consq" fill="#55606F" font-style="italic"> </text>
  </g>
</g>

<text x="40" y="626" class="sub">Vier vragen uit niveau 1, deel 9 §9.4 bepalen per casemodel welke route van toepassing is — een architectuurkeuze, geen technisch detail.</text>
</svg>
