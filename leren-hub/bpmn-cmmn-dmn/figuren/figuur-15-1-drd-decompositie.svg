<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760" font-family="'DM Sans', Arial, sans-serif" width="1100" height="760" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .decision { fill:#FFFFFF; stroke:#14213D; stroke-width:1.7; }
    .inputdata { fill:#CFE0F2; stroke:#14213D; stroke-width:1.4; }
    .ksource { fill:#EEF2F7; stroke:#14213D; stroke-width:1.3; }
    .dname { font-size:15px; font-weight:700; fill:#14213D; text-anchor:middle; }
    .dsub { font-size:11px; fill:#55606F; text-anchor:middle; }
    .info-req { stroke:#14213D; stroke-width:1.7; fill:none; marker-end:url(#infoarr); }
    .auth-req { stroke:#55606F; stroke-width:1.1; fill:none; stroke-dasharray:1 3.4; marker-end:url(#authdot); }
    .label { font-size:14px; font-weight:700; fill:#14213D; }
    .sub { font-size:12px; fill:#55606F; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    .legend-box { fill:#FFFFFF; stroke:#E3E0D8; stroke-width:1.3; }
    .legend-txt { font-size:11.5px; fill:#14213D; }
    .legend-sub { font-size:10px; fill:#55606F; }
  </style>
  <marker id="infoarr" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#14213D"/></marker>
  <marker id="authdot" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><circle cx="4" cy="4" r="3" fill="#55606F"/></marker>
</defs>
<rect width="1100" height="760" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 15 · DRD (NOTATIE-CORRECT)</text>
<text x="40" y="64" class="title">Figuur 15.1 — Een gedecomponeerde DRD: de vervroegde-uittredingberekening</text>
<text x="40" y="86" class="sub">Drie decisions in plaats van één grote tabel — elk apart leesbaar, testbaar en wijzigbaar (§15.1).</text>

<!-- Knowledge source -->
<path d="M40,300 H320 V356 C 260,378 100,338 40,356 Z" class="ksource"/>
<text x="180" y="325" class="dname" style="font-size:12.5px">Pensioenreglement art. 7.3</text>
<text x="180" y="343" class="dsub">vervroegingsstaffel (bron van de korting)</text>

<!-- Decision 1 -->
<rect x="200" y="470" width="220" height="76" class="decision"/>
<text x="310" y="502" class="dname">Kortingspercentage</text>
<text x="310" y="520" class="dname">vervroeging</text>

<!-- Decision 2 -->
<rect x="440" y="310" width="240" height="76" class="decision"/>
<text x="560" y="342" class="dname">Gecorrigeerd</text>
<text x="560" y="360" class="dname">uitkeringspercentage</text>

<!-- Decision 3 -->
<rect x="680" y="150" width="260" height="76" class="decision"/>
<text x="810" y="182" class="dname">Definitief</text>
<text x="810" y="200" class="dname">uitkeringspercentage</text>

<!-- Input data -->
<rect x="40" y="630" width="200" height="56" rx="28" class="inputdata"/>
<text x="140" y="663" class="dname" style="font-size:13px">Jaren vervroeging</text>

<rect x="460" y="630" width="210" height="56" rx="28" class="inputdata"/>
<text x="565" y="656" class="dname" style="font-size:13px">Partnerpensioen</text>
<text x="565" y="672" class="dname" style="font-size:13px">(ja/nee)</text>

<rect x="800" y="630" width="220" height="56" rx="28" class="inputdata"/>
<text x="910" y="656" class="dname" style="font-size:13px">Eerdere</text>
<text x="910" y="672" class="dname" style="font-size:13px">waardeoverdracht</text>

<!-- Information requirements -->
<line x1="140" y1="630" x2="250" y2="546" class="info-req"/>
<line x1="310" y1="470" x2="500" y2="386" class="info-req"/>
<line x1="565" y1="630" x2="620" y2="386" class="info-req"/>
<line x1="560" y1="310" x2="740" y2="226" class="info-req"/>
<line x1="910" y1="630" x2="880" y2="226" class="info-req"/>

<!-- Authority requirement -->
<line x1="180" y1="356" x2="290" y2="470" class="auth-req"/>

<!-- Legend -->
<rect x="760" y="450" width="300" height="150" class="legend-box" rx="4"/>
<text x="778" y="472" class="legend-txt" style="font-weight:700;">Notatie</text>
<rect x="778" y="482" width="34" height="18" class="decision"/>
<text x="822" y="495" class="legend-txt">Decision</text>
<rect x="778" y="508" width="34" height="16" rx="8" class="inputdata"/>
<text x="822" y="521" class="legend-txt">Input data</text>
<path d="M778,532 H812 V546 C 798,554 786,542 778,546 Z" class="ksource"/>
<text x="822" y="545" class="legend-txt">Knowledge source</text>
<line x1="778" y1="562" x2="812" y2="562" class="info-req"/>
<text x="822" y="566" class="legend-txt" style="font-size:10.5px">Information requirement</text>
<line x1="778" y1="580" x2="812" y2="580" class="auth-req"/>
<text x="822" y="584" class="legend-txt" style="font-size:10.5px">Authority requirement</text>
</svg>
