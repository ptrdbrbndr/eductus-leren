<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="'DM Sans', Arial, sans-serif" width="1000" height="560" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    .hcell-req { fill:#2563A8; }
    .hcell-opt { fill:#EEF2F7; stroke:#55606F; stroke-width:1.2; stroke-dasharray:4 3; }
    .hlbl-req { font-size:12px; fill:#FBFAF7; font-weight:700; }
    .hlbl-opt { font-size:12px; fill:#14213D; font-weight:700; }
    .cell-req { fill:#CFE0F2; stroke:#2563A8; stroke-width:1; }
    .cell-opt { fill:#FBFAF7; stroke:#CFE0F2; stroke-width:1; stroke-dasharray:3 3; }
    .val { font-size:10.6px; fill:#14213D; font-family:'DM Sans', monospace; }
    .tag { font-size:10px; fill:#7A5A16; }
    .sub { font-size:11px; fill:#55606F; }
    .desc-h { font-size:12.5px; font-weight:700; fill:#14213D; }
    .desc { font-size:11px; fill:#14213D; }
  </style>
</defs>
<rect width="1000" height="560" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 20 · FIGUUR 20.2 · TABEL</text>
<text x="40" y="64" class="title">Anatomie van een event log</text>

<g transform="translate(40,100)">
  <!-- header row -->
  <rect x="0" y="0" width="140" height="40" class="hcell-req"/>
  <text x="70" y="25" text-anchor="middle" class="hlbl-req">Case-ID</text>
  <rect x="140" y="0" width="200" height="40" class="hcell-req"/>
  <text x="240" y="25" text-anchor="middle" class="hlbl-req">Activiteit</text>
  <rect x="340" y="0" width="170" height="40" class="hcell-req"/>
  <text x="425" y="25" text-anchor="middle" class="hlbl-req">Tijdstempel</text>

  <rect x="510" y="0" width="130" height="40" class="hcell-opt"/>
  <text x="575" y="25" text-anchor="middle" class="hlbl-opt">Resource</text>
  <rect x="640" y="0" width="110" height="40" class="hcell-opt"/>
  <text x="695" y="25" text-anchor="middle" class="hlbl-opt">Bedrag</text>
  <rect x="750" y="0" width="130" height="40" class="hcell-opt"/>
  <text x="815" y="25" text-anchor="middle" class="hlbl-opt">Kanaal</text>

  <text x="70" y="-8" class="tag" font-weight="700">VERPLICHT</text>
  <text x="575" y="-8" class="tag" font-weight="700">OPTIONEEL</text>

  <!-- data rows -->
  <g font-size="10.6">
    <!-- row 1 -->
    <rect x="0" y="40" width="140" height="34" class="cell-req"/><text x="12" y="61" class="val">MUT-08841</text>
    <rect x="140" y="40" width="200" height="34" class="cell-req"/><text x="152" y="61" class="val">Aanvraag ontvangen</text>
    <rect x="340" y="40" width="170" height="34" class="cell-req"/><text x="352" y="61" class="val">2026-03-02 09:14</text>
    <rect x="510" y="40" width="130" height="34" class="cell-opt"/><text x="522" y="61" class="val">systeem</text>
    <rect x="640" y="40" width="110" height="34" class="cell-opt"/><text x="652" y="61" class="val">—</text>
    <rect x="750" y="40" width="130" height="34" class="cell-opt"/><text x="762" y="61" class="val">portaal</text>

    <!-- row 2 -->
    <rect x="0" y="74" width="140" height="34" fill="#FBFAF7"/><rect x="0" y="74" width="140" height="34" class="cell-req" fill-opacity=".55"/><text x="12" y="95" class="val">MUT-08841</text>
    <rect x="140" y="74" width="200" height="34" class="cell-req" fill-opacity=".55"/><text x="152" y="95" class="val">Volledigheid controleren</text>
    <rect x="340" y="74" width="170" height="34" class="cell-req" fill-opacity=".55"/><text x="352" y="95" class="val">2026-03-02 09:41</text>
    <rect x="510" y="74" width="130" height="34" class="cell-opt"/><text x="522" y="95" class="val">J. Peters</text>
    <rect x="640" y="74" width="110" height="34" class="cell-opt"/><text x="652" y="95" class="val">—</text>
    <rect x="750" y="74" width="130" height="34" class="cell-opt"/><text x="762" y="95" class="val">—</text>

    <!-- row 3 -->
    <rect x="0" y="108" width="140" height="34" class="cell-req" fill-opacity=".55"/><text x="12" y="129" class="val">MUT-08841</text>
    <rect x="140" y="108" width="200" height="34" class="cell-req" fill-opacity=".55"/><text x="152" y="129" class="val">Aanvraag beoordelen</text>
    <rect x="340" y="108" width="170" height="34" class="cell-req" fill-opacity=".55"/><text x="352" y="129" class="val">2026-03-02 11:03</text>
    <rect x="510" y="108" width="130" height="34" class="cell-opt"/><text x="522" y="129" class="val">J. Peters</text>
    <rect x="640" y="108" width="110" height="34" class="cell-opt"/><text x="652" y="129" class="val">€ 1.240</text>
    <rect x="750" y="108" width="130" height="34" class="cell-opt"/><text x="762" y="129" class="val">—</text>

    <!-- row 4 -->
    <rect x="0" y="142" width="140" height="34" class="cell-req" fill-opacity=".55"/><text x="12" y="163" class="val">MUT-08842</text>
    <rect x="140" y="142" width="200" height="34" class="cell-req" fill-opacity=".55"/><text x="152" y="163" class="val">Aanvraag ontvangen</text>
    <rect x="340" y="142" width="170" height="34" class="cell-req" fill-opacity=".55"/><text x="352" y="163" class="val">2026-03-02 10:52</text>
    <rect x="510" y="142" width="130" height="34" class="cell-opt"/><text x="522" y="163" class="val">systeem</text>
    <rect x="640" y="142" width="110" height="34" class="cell-opt"/><text x="652" y="163" class="val">—</text>
    <rect x="750" y="142" width="130" height="34" class="cell-opt"/><text x="762" y="163" class="val">telefoon</text>
  </g>

  <line x1="0" y1="176" x2="880" y2="176" stroke="#CFE0F2"/>
  <text x="880" y="60" class="sub" text-anchor="end" font-style="italic">… meer rijen</text>
</g>

<g transform="translate(40,320)">
  <rect x="0" y="0" width="880" height="200" rx="10" fill="#FFFFFF" stroke="#E3E0D8"/>
  <text x="20" y="30" class="desc-h">Drie verplichte gegevens (§20.2)</text>
  <text x="20" y="52" class="desc">• <tspan font-weight="700">Case-ID</tspan> — welk geval (aanvraag, dossier, mutatie) deze gebeurtenis betreft.</text>
  <text x="20" y="72" class="desc">• <tspan font-weight="700">Activiteit</tspan> — welke stap heeft plaatsgevonden.</text>
  <text x="20" y="92" class="desc">• <tspan font-weight="700">Tijdstempel</tspan> — wanneer.</text>
  <text x="20" y="122" class="desc-h">Optionele attributen, vaak waardevol</text>
  <text x="20" y="144" class="desc">• <tspan font-weight="700">Resource</tspan> — wie de activiteit uitvoerde (link naar het resource-begrip uit BPMN, deel 14).</text>
  <text x="20" y="164" class="desc">• Extra gegevens over het geval: <tspan font-weight="700">bedrag, type, kanaal</tspan>.</text>
  <text x="20" y="186" class="desc" fill="#55606F">Zonder de drie verplichte kolommen is er geen event log — zonder de optionele kolommen wel, maar met minder verklaringskracht.</text>
</g>
</svg>
