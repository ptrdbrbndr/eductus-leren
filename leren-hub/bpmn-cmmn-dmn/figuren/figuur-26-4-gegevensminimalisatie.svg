<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 660" font-family="'DM Sans', Arial, sans-serif" width="1040" height="660" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    .thead { fill:#2563A8; }
    .theadtxt { font-size:12px; font-weight:700; fill:#FBFAF7; }
    .rowa { fill:#FFFFFF; }
    .rowb { fill:#EEF2F7; }
    .gridline { stroke:#CFE0F2; stroke-width:1; }
    .celltxt { font-size:11.5px; fill:#14213D; }
    .cellsub { font-size:10px; fill:#55606F; }
    .pillrisk { fill:#FBF6E9; stroke:#E9A13B; stroke-width:1.4; }
    .pillrisktxt { font-size:10.5px; fill:#8a6a1f; font-weight:700; }
    .pillok { fill:#CFE0F2; stroke:#2563A8; stroke-width:1.4; }
    .pilloktxt { font-size:10.5px; fill:#1c4d84; font-weight:700; }
    .pillneutral { fill:#E3E0D8; stroke:#55606F; stroke-width:1.2; }
    .pillneutraltxt { font-size:10.5px; fill:#14213D; font-weight:700; }
    .legend { font-size:11px; fill:#55606F; }
    .outer { fill:none; stroke:#14213D; stroke-width:1.4; }
  </style>
</defs>
<rect width="1040" height="660" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 26 · GEGEVENSMINIMALISATIE PER PROCESSTAP</text>
<text x="40" y="64" class="title">Figuur 26.4 — Benodigd gegeven versus afgeleide waarde, processtap voor processtap</text>

<circle cx="46" cy="94" r="6" class="pillok"/>
<text x="60" y="98" class="legend">afgeleide waarde volstaat — gegeven geminimaliseerd</text>
<circle cx="380" cy="94" r="6" class="pillrisk"/>
<text x="394" y="98" class="legend">risico — volledig gegeven zichtbaar terwijl afgeleide waarde zou volstaan</text>

<!-- table -->
<rect x="40" y="118" width="1000" height="50" class="thead"/>
<text x="56" y="148" class="theadtxt">Processtap</text>
<text x="316" y="148" class="theadtxt">Gegeven in brondata</text>
<text x="566" y="148" class="theadtxt">Afgeleide waarde die volstaat</text>
<text x="836" y="148" class="theadtxt">Status</text>

<!-- row 1 -->
<rect x="40" y="168" width="1000" height="88" class="rowa"/>
<text x="56" y="196" class="celltxt" style="font-weight:700">Vaststellen recht op</text>
<text x="56" y="212" class="celltxt" style="font-weight:700">compensatie</text>
<text x="56" y="230" class="cellsub">(deel 26, §26.4)</text>
<text x="316" y="196" class="celltxt">Volledige geboortedatum</text>
<text x="316" y="212" class="cellsub">zichtbaar voor behandelaar</text>
<text x="566" y="196" class="celltxt">Leeftijd (in jaren)</text>
<text x="566" y="212" class="cellsub">volstaat voor de rekenstap</text>
<rect x="836" y="192" width="160" height="30" rx="15" class="pillrisk"/>
<text x="916" y="212" text-anchor="middle" class="pillrisktxt">⚠ risico</text>

<!-- row 2 -->
<rect x="40" y="256" width="1000" height="88" class="rowb"/>
<text x="56" y="284" class="celltxt" style="font-weight:700">Berekenen transitie-effect</text>
<text x="56" y="300" class="cellsub">(invaren, prognoseoverzicht)</text>
<text x="316" y="284" class="celltxt">Volledige loonhistorie</text>
<text x="566" y="284" class="celltxt">Laatst vastgestelde</text>
<text x="566" y="300" class="celltxt">pensioengrondslag</text>
<rect x="836" y="280" width="160" height="30" rx="15" class="pillok"/>
<text x="916" y="300" text-anchor="middle" class="pilloktxt">✓ geminimaliseerd</text>

<!-- row 3 -->
<rect x="40" y="344" width="1000" height="88" class="rowa"/>
<text x="56" y="372" class="celltxt" style="font-weight:700">Verzenden transitie-</text>
<text x="56" y="388" class="celltxt" style="font-weight:700">overzicht</text>
<text x="56" y="406" class="cellsub">(casusdossier §7)</text>
<text x="316" y="372" class="celltxt">Volledig BSN</text>
<text x="566" y="372" class="celltxt">Intern deelnemernummer</text>
<rect x="836" y="368" width="160" height="30" rx="15" class="pillok"/>
<text x="916" y="388" text-anchor="middle" class="pilloktxt">✓ geminimaliseerd</text>

<!-- row 4 -->
<rect x="40" y="432" width="1000" height="88" class="rowb"/>
<text x="56" y="460" class="celltxt" style="font-weight:700">Vaststellen partner-</text>
<text x="56" y="476" class="celltxt" style="font-weight:700">pensioen</text>
<text x="316" y="460" class="celltxt">Burgerlijke staat + volledige</text>
<text x="316" y="476" class="celltxt">naam van de partner</text>
<text x="566" y="460" class="celltxt">Indicator "wel / geen</text>
<text x="566" y="476" class="celltxt">partner op peildatum"</text>
<rect x="836" y="456" width="160" height="30" rx="15" class="pillrisk"/>
<text x="916" y="476" text-anchor="middle" class="pillrisktxt">⚠ risico</text>

<!-- row 5 -->
<rect x="40" y="520" width="1000" height="88" class="rowa"/>
<text x="56" y="548" class="celltxt" style="font-weight:700">Beoordelen complex dossier</text>
<text x="56" y="564" class="celltxt" style="font-weight:700">(risicogroep)</text>
<text x="56" y="582" class="cellsub">(§26.2, vierogenprincipe)</text>
<text x="316" y="548" class="celltxt">Volledig dossier, incl.</text>
<text x="316" y="564" class="celltxt">gezinssituatie</text>
<text x="566" y="548" class="celltxt">— (contextueel noodzakelijk,</text>
<text x="566" y="564" class="celltxt">geen minimalisatie mogelijk)</text>
<rect x="836" y="540" width="160" height="30" rx="15" class="pillneutral"/>
<text x="916" y="560" text-anchor="middle" class="pillneutraltxt">bewaartermijn geldt</text>
<text x="836" y="592" class="cellsub">geen overtollig gegeven — wel bewaarplicht (§26.4)</text>

<rect x="40" y="118" width="1000" height="490" class="outer"/>
<line x1="300" y1="118" x2="300" y2="608" class="gridline"/>
<line x1="550" y1="118" x2="550" y2="608" class="gridline"/>
<line x1="820" y1="118" x2="820" y2="608" class="gridline"/>
<line x1="40" y1="256" x2="1040" y2="256" class="gridline"/>
<line x1="40" y1="344" x2="1040" y2="344" class="gridline"/>
<line x1="40" y1="432" x2="1040" y2="432" class="gridline"/>
<line x1="40" y1="520" x2="1040" y2="520" class="gridline"/>

</svg>
