<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 700" font-family="'DM Sans', Arial, sans-serif" width="1300" height="700" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .panel { fill:#FFFFFF; stroke:#E3E0D8; stroke-width:1.5; }
    .panel-title { font-family:'Cormorant Garamond', Georgia, serif; font-size:19px; font-weight:600; fill:#14213D; }
    .panel-sub-warn { font-size:11.5px; font-weight:700; fill:#B9791F; letter-spacing:.04em; }
    .panel-sub-ok { font-size:11.5px; font-weight:700; fill:#2563A8; letter-spacing:.04em; }
    .phase { fill:#E3E0D8; stroke:#55606F; stroke-width:1.4; }
    .phase-label { font-size:13px; font-weight:700; fill:#14213D; }
    .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arrgrey); }
    .arrow-broken { stroke:#B9791F; stroke-width:1.5; fill:none; stroke-dasharray:4 3; }
    .ghost { fill:#FBFAF7; stroke:#B9791F; stroke-width:1.4; stroke-dasharray:5 4; }
    .ghost-label { font-size:13px; font-weight:700; fill:#B9791F; }
    .strike { stroke:#B9791F; stroke-width:1.4; }
    .warn-note { font-size:10.5px; font-style:italic; fill:#B9791F; }
    .callout-warn { fill:#EEF2F7; stroke:#55606F; stroke-width:1.3; }
    .callout-title { font-size:12px; font-weight:700; fill:#14213D; }
    .callout-text { font-size:11px; fill:#55606F; }
    .node { fill:#CFE0F2; stroke:#14213D; stroke-width:1.6; }
    .node-decide { fill:#FBF6E9; stroke:#E9A13B; stroke-width:1.8; }
    .node-label { font-size:13.5px; font-weight:700; fill:#14213D; }
    .node-sub { font-size:10px; fill:#55606F; }
    .arc { stroke:#2563A8; stroke-width:1.8; fill:none; marker-end:url(#arrblue); }
    .badge { fill:#FBFAF7; stroke:#2563A8; stroke-width:1.8; }
    .badge-label { font-size:10.5px; font-weight:700; fill:#2563A8; letter-spacing:.05em; }
    .divider { stroke:#E3E0D8; stroke-width:1.5; stroke-dasharray:3 4; }
    .vs { font-size:12px; font-weight:700; fill:#55606F; }
    .caption { font-size:11px; fill:#55606F; font-style:italic; }
    .label { font-size:14px; font-weight:700; fill:#14213D; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
  </style>
  <marker id="arrgrey" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
  <marker id="arrblue" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
</defs>
<rect width="1300" height="700" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 21 · CONCEPTDIAGRAM</text>
<text x="40" y="62" class="title">Figuur 21.5 — De gesloten verbetercyclus, met de Meridiaan-bibliotheek als waarschuwend contrast</text>

<line x1="660" y1="90" x2="660" y2="650" class="divider"/>
<circle cx="660" cy="370" r="16" fill="#FBFAF7" stroke="#E3E0D8" stroke-width="1.5"/>
<text x="660" y="374" text-anchor="middle" class="vs">vs</text>

<!-- LEFT PANEL: Meridiaan-bibliotheek -->
<rect x="40" y="90" width="580" height="560" rx="4" class="panel"/>
<text x="60" y="116" class="panel-title">Meridiaan-bibliotheek (2019–2023)</text>
<text x="60" y="134" class="panel-sub-warn">DE CYCLUS DIE NIET SLOOT</text>

<rect x="100" y="150" width="460" height="44" rx="5" class="phase"/>
<text x="330" y="177" text-anchor="middle" class="phase-label">Modelleren</text>
<line x1="330" y1="194" x2="330" y2="204" class="arrow"/>

<rect x="100" y="206" width="460" height="44" rx="5" class="phase"/>
<text x="330" y="233" text-anchor="middle" class="phase-label">Analyseren</text>
<line x1="330" y1="250" x2="330" y2="260" class="arrow"/>

<rect x="100" y="262" width="460" height="44" rx="5" class="phase"/>
<text x="330" y="289" text-anchor="middle" class="phase-label">Ontwerpen</text>
<line x1="330" y1="306" x2="330" y2="316" class="arrow"/>

<rect x="100" y="318" width="460" height="44" rx="5" class="phase"/>
<text x="330" y="345" text-anchor="middle" class="phase-label">Uitvoeren</text>

<!-- broken transition -->
<line x1="330" y1="362" x2="330" y2="378" class="arrow-broken"/>
<line x1="323" y1="380" x2="337" y2="392" stroke="#B9791F" stroke-width="1.8"/>
<line x1="337" y1="380" x2="323" y2="392" stroke="#B9791F" stroke-width="1.8"/>
<text x="345" y="390" class="warn-note">cyclus breekt hier — fase ontbreekt</text>
<line x1="330" y1="394" x2="330" y2="404" class="arrow-broken"/>

<rect x="100" y="406" width="460" height="44" rx="5" class="ghost"/>
<line x1="100" y1="406" x2="560" y2="450" class="strike"/>
<text x="330" y="433" text-anchor="middle" class="ghost-label">Monitoren — nooit ingericht</text>

<rect x="100" y="474" width="460" height="150" rx="5" class="callout-warn"/>
<text x="118" y="497" class="callout-title">DNB-bevinding, vier jaar later</text>
<text x="118" y="518" class="callout-text">140 modellen opgeleverd door een extern bureau (2019). Geen</text>
<text x="118" y="535" class="callout-text">procesbeheerder-taak, geen meting, geen besluitmoment — de</text>
<text x="118" y="552" class="callout-text">fase monitoren ontbrak volledig (niveau 1, deel 2, §2.1).</text>
<text x="118" y="574" class="callout-text">Resultaat (2023): een derde van de modellen komt niet meer</text>
<text x="118" y="591" class="callout-text">overeen met de werkelijke werkwijze. Niemand had de taak</text>
<text x="118" y="608" class="callout-text">gekregen om bij te houden of het model nog klopte.</text>

<!-- RIGHT PANEL: Programma Mutatieplatform -->
<rect x="680" y="90" width="580" height="560" rx="4" class="panel"/>
<text x="700" y="116" class="panel-title">Programma Mutatieplatform</text>
<text x="700" y="134" class="panel-sub-ok">DE CYCLUS DIE WÉL SLUIT</text>

<rect x="870" y="145" width="200" height="90" rx="8" class="node"/>
<text x="970" y="182" text-anchor="middle" class="node-label">Meten</text>
<text x="970" y="202" text-anchor="middle" class="node-sub">conformance-run elk kwartaal</text>
<text x="970" y="215" text-anchor="middle" class="node-sub">(deel 20, §21.4)</text>

<rect x="1026" y="405" width="200" height="90" rx="8" class="node-decide"/>
<text x="1126" y="442" text-anchor="middle" class="node-label">Besluit</text>
<text x="1126" y="462" text-anchor="middle" class="node-sub">operating model §21.1: wijziging /</text>
<text x="1126" y="475" text-anchor="middle" class="node-sub">interventie / niets doen</text>

<rect x="714" y="405" width="200" height="90" rx="8" class="node"/>
<text x="814" y="442" text-anchor="middle" class="node-label">Repository-update</text>
<text x="814" y="462" text-anchor="middle" class="node-sub">nieuwe versie + status</text>
<text x="814" y="475" text-anchor="middle" class="node-sub">vastgesteld (§21.2)</text>

<path d="M1060,225 C1150,260 1150,360 1126,403" class="arc"/>
<path d="M1026,450 H916" class="arc"/>
<path d="M814,403 C790,350 790,255 868,228" class="arc"/>

<circle cx="970" cy="360" r="26" class="badge"/>
<path d="M958,360 l8,8 l16,-18" fill="none" stroke="#2563A8" stroke-width="2.4"/>
<text x="970" y="405" text-anchor="middle" class="badge-label">GESLOTEN</text>

<text x="700" y="628" class="caption">Zie niveau 1, deel 2, §2.1 — dit is de concrete invulling van de fasen</text>
<text x="700" y="644" class="caption">monitoren en verbeteren voor het Programma Mutatieplatform.</text>

</svg>
