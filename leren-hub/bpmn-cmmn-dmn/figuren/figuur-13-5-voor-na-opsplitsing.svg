<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="'DM Sans', Arial, sans-serif" width="1200" height="700" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .panel { fill:#FFFFFF; stroke:#E3E0D8; stroke-width:1.5; }
    .lane { fill:#FFFFFF; stroke:#14213D; stroke-width:1.4; }
    .task { fill:#CFE0F2; stroke:#14213D; stroke-width:1.3; }
    .task-label { font-size:9.5px; fill:#14213D; }
    .evt-start { fill:#FBFAF7; stroke:#14213D; stroke-width:1.4; }
    .evt-end { fill:#FBFAF7; stroke:#14213D; stroke-width:2.6; }
    .evt-bound { fill:#F6DCD9; stroke:#B9433D; stroke-width:1.3; stroke-dasharray:2.5 2; }
    .evt-bound-esc { fill:#FBF6E9; stroke:#E9A13B; stroke-width:1.3; stroke-dasharray:2.5 2; }
    .evt-small-end { fill:#FBFAF7; stroke:#55606F; stroke-width:2; }
    .seq { stroke:#14213D; stroke-width:1.3; fill:none; marker-end:url(#seqarr); }
    .seqfaint { stroke:#B9433D; stroke-width:1; fill:none; marker-end:url(#faintarr); opacity:0.75; }
    .callact { fill:#CFE0F2; stroke:#14213D; stroke-width:2.6; }
    .label { font-size:14px; font-weight:700; fill:#14213D; }
    .sub { font-size:11.5px; fill:#55606F; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    .paneltitle { font-size:13px; font-weight:700; }
    .badge { fill:#F6DCD9; }
    .badge2 { fill:#CFE0F2; }
  </style>
  <marker id="seqarr" markerWidth="8" markerHeight="8" refX="5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="#14213D"/></marker>
  <marker id="faintarr" markerWidth="7" markerHeight="7" refX="5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="#B9433D"/></marker>
</defs>
<rect width="1200" height="700" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 13 · VOOR / NA</text>
<text x="40" y="64" class="title">Figuur 13.5 — Van overvol model naar hoofdmodel + apart uitzonderingsmodel</text>

<!-- VOOR panel -->
<rect x="30" y="90" width="520" height="560" class="panel" rx="4"/>
<text x="50" y="116" class="paneltitle" style="fill:#B9433D">VOOR — één model, vijftien uitzonderingspaden</text>

<rect x="50" y="150" width="480" height="150" class="lane" rx="3"/>
<circle cx="75" cy="225" r="11" class="evt-start"/>
<rect x="105" y="207" width="80" height="36" rx="8" class="task"/>
<text x="145" y="228" text-anchor="middle" class="task-label">Aanvraag</text>
<rect x="220" y="207" width="90" height="36" rx="8" class="task"/>
<text x="265" y="228" text-anchor="middle" class="task-label">Beoordelen</text>
<rect x="345" y="207" width="90" height="36" rx="8" class="task"/>
<text x="390" y="228" text-anchor="middle" class="task-label">Uitvoeren</text>
<circle cx="500" cy="225" r="12" class="evt-end"/>
<line x1="86" y1="225" x2="105" y2="225" class="seq"/>
<line x1="185" y1="225" x2="220" y2="225" class="seq"/>
<line x1="310" y1="225" x2="345" y2="225" class="seq"/>
<line x1="435" y1="225" x2="488" y2="225" class="seq"/>

<!-- clutter of boundary events and stray paths -->
<circle cx="255" cy="243" r="8" class="evt-bound"/>
<circle cx="275" cy="243" r="8" class="evt-bound-esc"/>
<circle cx="380" cy="243" r="8" class="evt-bound"/>
<circle cx="400" cy="243" r="8" class="evt-bound-esc"/>
<circle cx="230" cy="207" r="8" class="evt-bound"/>
<circle cx="355" cy="207" r="8" class="evt-bound-esc"/>

<path d="M255,251 C230,290 150,300 110,330" class="seqfaint"/>
<path d="M275,251 C300,300 350,320 320,350" class="seqfaint"/>
<path d="M380,251 C400,300 460,310 440,345" class="seqfaint"/>
<path d="M400,251 C420,290 480,300 495,335" class="seqfaint"/>
<path d="M230,199 C180,170 120,180 100,200" class="seqfaint"/>
<path d="M355,199 C330,175 280,175 260,195" class="seqfaint"/>

<circle cx="105" cy="345" r="11" class="evt-small-end"/>
<circle cx="325" cy="360" r="11" class="evt-small-end"/>
<circle cx="445" cy="358" r="11" class="evt-small-end"/>
<circle cx="500" cy="348" r="11" class="evt-small-end"/>
<circle cx="95" cy="195" r="9" class="evt-small-end"/>
<circle cx="255" cy="185" r="9" class="evt-small-end"/>

<text x="55" y="420" class="sub">Elke uitzondering (fout, escalatie, timer) krijgt een eigen</text>
<text x="55" y="440" class="sub">boundary event en een eigen pad, direct op de happy path</text>
<text x="55" y="460" class="sub">geplakt. Het gevolg: de happy path is niet meer in één</text>
<text x="55" y="480" class="sub">oogopslag te vinden — precies de fout die de discipline</text>
<text x="55" y="500" class="sub">uit niveau 1, deel 5 wil voorkomen (§13.6).</text>

<rect x="55" y="530" width="470" height="90" rx="6" class="panel" style="fill:#F6DCD9;stroke:#B9433D"/>
<text x="70" y="554" class="sub" style="font-weight:700;fill:#B9433D">15 uitzonderingspaden in één plaat</text>
<text x="70" y="574" class="sub">geen onderscheid meer tussen hoofdstroom</text>
<text x="70" y="592" class="sub">en uitzondering — alles heeft evenveel gewicht</text>
<text x="70" y="610" class="sub">op het scherm, dus niets krijgt aandacht.</text>

<!-- NA panel -->
<rect x="590" y="90" width="580" height="560" class="panel" rx="4"/>
<text x="610" y="116" class="paneltitle" style="fill:#2563A8">NA — hoofdmodel, opgeschoond</text>

<rect x="610" y="150" width="540" height="120" class="lane" rx="3"/>
<text x="620" y="168" class="sub" style="font-weight:700">Hoofdmodel — Waardeoverdracht (happy path)</text>
<circle cx="640" cy="225" r="11" class="evt-start"/>
<rect x="670" y="207" width="80" height="36" rx="8" class="task"/>
<text x="710" y="228" text-anchor="middle" class="task-label">Aanvraag</text>
<rect x="785" y="207" width="90" height="36" rx="8" class="task"/>
<text x="830" y="228" text-anchor="middle" class="task-label">Beoordelen</text>
<rect x="910" y="207" width="90" height="36" rx="8" class="task"/>
<text x="955" y="228" text-anchor="middle" class="task-label">Uitvoeren</text>
<circle cx="1060" cy="225" r="12" class="evt-end"/>
<line x1="651" y1="225" x2="670" y2="225" class="seq"/>
<line x1="750" y1="225" x2="785" y2="225" class="seq"/>
<line x1="875" y1="225" x2="910" y2="225" class="seq"/>
<line x1="1000" y1="225" x2="1048" y2="225" class="seq"/>

<circle cx="820" cy="243" r="7" class="evt-bound"/>
<circle cx="945" cy="243" r="7" class="evt-bound-esc"/>

<path d="M820,250 C820,290 800,300 800,320" class="seq" stroke-dasharray="3 2"/>
<path d="M945,250 C945,290 900,300 900,320" class="seq" stroke-dasharray="3 2"/>

<rect x="760" y="320" width="180" height="60" rx="10" class="callact"/>
<rect x="760" y="320" width="180" height="60" rx="10" fill="none" stroke="#14213D" stroke-width="1"/>
<text x="850" y="345" text-anchor="middle" class="task-label" style="font-weight:700">Call activity</text>
<text x="850" y="360" text-anchor="middle" class="task-label">Uitzonderingsmodel</text>
<text x="850" y="373" text-anchor="middle" class="task-label">aanroepen</text>
<rect x="838" y="373" width="12" height="12" fill="none" stroke="#14213D" stroke-width="1.2"/>
<line x1="844" y1="376" x2="844" y2="382" stroke="#14213D" stroke-width="1.2"/>
<line x1="841" y1="379" x2="847" y2="379" stroke="#14213D" stroke-width="1.2"/>

<!-- separate exception model -->
<rect x="610" y="420" width="540" height="200" class="lane" rx="3" style="stroke:#2563A8"/>
<text x="620" y="440" class="sub" style="font-weight:700;fill:#2563A8">Apart model — Uitzonderingen Waardeoverdracht</text>

<rect x="630" y="460" width="100" height="120" rx="6" class="lane" style="stroke:#55606F"/>
<text x="680" y="478" text-anchor="middle" class="task-label" style="font-weight:700">Technisch</text>
<circle cx="680" cy="505" r="9" class="evt-bound"/>
<text x="680" y="530" text-anchor="middle" class="task-label">koppelvlak-</text>
<text x="680" y="542" text-anchor="middle" class="task-label">fout</text>
<circle cx="680" cy="565" r="8" class="evt-small-end"/>

<rect x="750" y="460" width="100" height="120" rx="6" class="lane" style="stroke:#55606F"/>
<text x="800" y="478" text-anchor="middle" class="task-label" style="font-weight:700">Escalatie</text>
<circle cx="800" cy="505" r="9" class="evt-bound-esc"/>
<text x="800" y="530" text-anchor="middle" class="task-label">norm-door-</text>
<text x="800" y="542" text-anchor="middle" class="task-label">looptijd</text>
<circle cx="800" cy="565" r="8" class="evt-small-end"/>

<rect x="870" y="460" width="100" height="120" rx="6" class="lane" style="stroke:#55606F"/>
<text x="920" y="478" text-anchor="middle" class="task-label" style="font-weight:700">Ketenpartner</text>
<circle cx="920" cy="505" r="9" class="evt-bound"/>
<text x="920" y="530" text-anchor="middle" class="task-label">geen match</text>
<text x="920" y="542" text-anchor="middle" class="task-label">(§13.3)</text>
<circle cx="920" cy="565" r="8" class="evt-small-end"/>

<text x="610" y="660" class="sub">Elke uitzonderingscategorie krijgt een eigen sub-lane in het aparte model — het</text>
<text x="610" y="676" class="sub">hoofdmodel toont alleen dát er een call activity naar dat model gaat.</text>

</svg>
