<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'DM Sans', Arial, sans-serif" width="960" height="560" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .track { fill:#EEF2F7; stroke:#E3E0D8; stroke-width:1; }
      .bar-bpmn { fill:#2563A8; }
      .bar-dmn { fill:#6FA3D6; }
      .bar-cmmn { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .sub { font-size:12px; fill:#55606F; }
      .body { font-size:12px; fill:#14213D; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .axistick { font-size:10.5px; fill:#55606F; }
    </style>
</defs>
<rect width="960" height="560" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 09 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Figuur 9.4 — Adoptieniveau van BPMN, DMN en CMMN</text>
<text x="40" y="86" class="sub">Herhaling en verdieping van de indeling uit deel 1, §1.3, nu met tooling-consequenties — §9.4</text>

<!-- axis labels -->
<text x="60" y="130" class="axistick">smal / recent</text>
<text x="880" y="130" text-anchor="end" class="axistick">breed / diep ondersteund</text>
<line x1="60" y1="140" x2="900" y2="140" stroke="#E3E0D8" stroke-width="1"/>

<!-- BPMN bar -->
<text x="60" y="185" class="label">BPMN 2.0.2</text>
<rect x="220" y="165" width="660" height="34" class="track"/>
<rect x="220" y="165" width="620" height="34" class="bar-bpmn"/>
<text x="240" y="188" class="sub" fill="#FBFAF7">breed en diep ondersteund — de facto standaard</text>

<!-- DMN bar -->
<text x="60" y="255" class="label">DMN</text>
<rect x="220" y="235" width="660" height="34" class="track"/>
<rect x="220" y="235" width="460" height="34" class="bar-dmn"/>
<text x="240" y="258" class="sub" fill="#14213D">goed ondersteund; wisselende dekking van geavanceerde FEEL (deel 15)</text>

<!-- CMMN bar -->
<text x="60" y="325" class="label">CMMN 1.1</text>
<rect x="220" y="305" width="660" height="34" class="track"/>
<rect x="220" y="305" width="220" height="34" class="bar-cmmn"/>
<text x="240" y="328" class="sub" fill="#14213D">merkbaar beperkter — enkele leveranciers actief weggelopen</text>

<rect x="40" y="380" width="880" height="150" fill="#EEF2F7" stroke="#E3E0D8" stroke-width="1"/>
<text x="58" y="404" class="sub" font-weight="700" fill="#14213D">Consequentie voor toolkeuze (§9.4) — vier vragen vooraf:</text>
<text x="58" y="426" class="body">1. Moet dit model alleen communiceren/analyseren, of ook daadwerkelijk uitgevoerd worden?</text>
<text x="58" y="446" class="body">2. Geldt uitvoering voor alle drie de talen, of is CMMN hier alleen voor analyse/documentatie?</text>
<text x="58" y="466" class="body">3. Welke specifieke elementen/constructies gebruik je daadwerkelijk?</text>
<text x="58" y="486" class="body">4. Kan de kandidaat-tool die set aantoonbaar importeren, tonen én (indien nodig) uitvoeren?</text>
<text x="58" y="512" class="sub" font-style="italic">Conductus zelf: BPMN- en DMN-kant goed ondersteund, CMMN-kant vraagt aparte aandacht.</text>
</svg>
