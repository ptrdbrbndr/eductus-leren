<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .pool { fill:#FFFFFF; stroke:#14213D; stroke-width:1.6; }
    .lanehead { fill:#14213D; }
    .lanehead-t { font-size:13px; font-weight:700; fill:#FBFAF7; }
    .task { fill:#CFE0F2; stroke:#14213D; stroke-width:1.5; }
    .task-disc { fill:#CFE0F2; stroke:#14213D; stroke-width:1.5; stroke-dasharray:5,3; }
    .stage { fill:#EEF2F7; stroke:#14213D; stroke-width:1.7; }
    .stage-tab { fill:#EEF2F7; stroke:#14213D; stroke-width:1.7; }
    .decision { fill:#FBF6E9; stroke:#14213D; stroke-width:1.5; }
    .milestone { fill:#FFFFFF; stroke:#14213D; stroke-width:1.5; }
    .gw { fill:#FFFFFF; stroke:#14213D; stroke-width:1.6; }
    .startev { fill:#FFFFFF; stroke:#14213D; stroke-width:1.6; }
    .endev { fill:#EEF2F7; stroke:#14213D; stroke-width:3; }
    .label { font-size:11.5px; font-weight:700; fill:#14213D; }
    .sub { font-size:10px; fill:#55606F; }
    .flowlbl { font-size:10px; font-weight:700; fill:#2563A8; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    .seq { stroke:#14213D; stroke-width:1.6; fill:none; marker-end:url(#arrS); }
    .assoc { stroke:#55606F; stroke-width:1.1; fill:none; stroke-dasharray:3,2; }
    .sentry { fill:#FFFFFF; stroke:#14213D; stroke-width:1.4; }
  </style>
  <marker id="arrS" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#14213D"/></marker>
</defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 18 · BPMN + CMMN</text>
<text x="40" y="64" class="title">Gestuurd traject met vrije ruimte — Werkgevermutaties</text>
<text x="40" y="84" class="sub">Een BPMN-skelet met daarin, als één van de paden, een CMMN-stage voor het niet-standaard geval.</text>

<!-- Pool -->
<rect x="20" y="105" width="920" height="470" rx="4" class="pool"/>
<rect x="20" y="105" width="26" height="470" class="lanehead"/>
<text x="33" y="340" class="lanehead-t" text-anchor="middle" transform="rotate(-90 33 340)">Werkgevermutaties</text>

<!-- Start event -->
<circle cx="90" cy="245" r="16" class="startev"/>
<text x="90" y="280" class="sub" text-anchor="middle">Mutatie</text>
<text x="90" y="292" class="sub" text-anchor="middle">binnengekomen</text>

<!-- Task: Mutatie ontvangen -->
<line x1="106" y1="245" x2="128" y2="245" class="seq"/>
<rect x="128" y="220" width="110" height="50" rx="8" class="task"/>
<circle cx="144" cy="232" r="5" fill="none" stroke="#14213D" stroke-width="1.2"/>
<path d="M137,244 q7,-9 14,0 z" fill="none" stroke="#14213D" stroke-width="1.2"/>
<text x="183" y="249" class="sub" font-weight="700" text-anchor="middle">Mutatie</text>
<text x="183" y="261" class="sub" font-weight="700" text-anchor="middle">ontvangen</text>

<!-- Task: Classificeren -->
<line x1="238" y1="245" x2="266" y2="245" class="seq"/>
<rect x="266" y="220" width="110" height="50" rx="8" class="task"/>
<rect x="280" y="230" width="16" height="12" fill="none" stroke="#14213D" stroke-width="1.1"/>
<line x1="280" y1="236" x2="296" y2="236" stroke="#14213D" stroke-width="0.9"/>
<line x1="288" y1="230" x2="288" y2="242" stroke="#14213D" stroke-width="0.9"/>
<text x="326" y="249" class="sub" font-weight="700" text-anchor="middle">Classificeren</text>
<text x="326" y="261" class="sub" font-weight="700" text-anchor="middle">(business rule)</text>

<!-- Decision -->
<line x1="311" y1="270" x2="311" y2="298" class="assoc"/>
<rect x="266" y="298" width="90" height="30" class="decision"/>
<text x="311" y="317" class="sub" text-anchor="middle" font-weight="700">Route bepalen</text>

<!-- Gateway 1 (diverging) -->
<line x1="376" y1="245" x2="392" y2="245" class="seq"/>
<polygon points="412,225 432,245 412,265 392,245" class="gw"/>
<text x="412" y="200" class="sub" text-anchor="middle">Samenhangende</text>
<text x="412" y="212" class="sub" text-anchor="middle">wijziging?</text>

<!-- nee bypass -->
<path d="M412,225 L412,160 L720,160 L720,225" class="seq"/>
<text x="530" y="152" class="flowlbl" text-anchor="middle">nee</text>

<!-- ja to stage -->
<line x1="432" y1="245" x2="470" y2="245" class="seq"/>
<text x="450" y="235" class="flowlbl" text-anchor="middle">ja</text>

<!-- entry sentry on stage -->
<g transform="translate(470,245)"><rect x="-6" y="-6" width="12" height="12" class="sentry" transform="rotate(45 0 0)"/></g>

<!-- Stage -->
<rect x="490" y="157" width="42" height="14" rx="4" class="stage-tab"/>
<rect x="470" y="168" width="250" height="185" rx="14" class="stage"/>
<text x="490" y="190" class="label">Stage: Samenhangende wijzigingen</text>
<text x="490" y="204" class="label">behandelen</text>

<rect x="490" y="215" width="200" height="40" rx="8" class="task"/>
<circle cx="505" cy="228" r="5" fill="none" stroke="#14213D" stroke-width="1.1"/>
<path d="M498,240 q7,-9 14,0 z" fill="none" stroke="#14213D" stroke-width="1.1"/>
<text x="600" y="238" class="sub" font-weight="700" text-anchor="middle">Wijzigingen afstemmen</text>
<text x="600" y="250" class="sub" text-anchor="middle">met werkgever</text>

<rect x="490" y="263" width="200" height="40" rx="8" class="task-disc"/>
<circle cx="505" cy="276" r="5" fill="none" stroke="#14213D" stroke-width="1.1"/>
<path d="M498,288 q7,-9 14,0 z" fill="none" stroke="#14213D" stroke-width="1.1"/>
<text x="600" y="286" class="sub" font-weight="700" text-anchor="middle">Externe check</text>
<text x="600" y="298" class="sub" text-anchor="middle">(discretionary)</text>

<g transform="translate(575,318)"><rect x="-6" y="-6" width="12" height="12" class="sentry" transform="rotate(45 0 0)"/></g>
<rect x="590" y="308" width="130" height="26" rx="13" class="milestone"/>
<text x="655" y="325" class="sub" font-weight="700" text-anchor="middle">Afgestemd met werkgever</text>

<!-- exit sentry -->
<g transform="translate(720,245)"><rect x="-6" y="-6" width="12" height="12" class="sentry" transform="rotate(45 0 0)"/></g>

<!-- Gateway 2 (converging) -->
<line x1="720" y1="245" x2="736" y2="245" class="seq"/>
<polygon points="756,225 776,245 756,265 736,245" class="gw"/>

<!-- Service task -->
<line x1="776" y1="245" x2="800" y2="245" class="seq"/>
<rect x="800" y="220" width="105" height="50" rx="8" class="task"/>
<circle cx="815" cy="233" r="6" fill="none" stroke="#14213D" stroke-width="1.1"/>
<rect x="812" y="230" width="6" height="6" fill="none" stroke="#14213D" stroke-width="0.9"/>
<rect x="809" y="227" width="12" height="2" fill="#14213D"/>
<rect x="809" y="238" width="12" height="2" fill="#14213D"/>
<text x="852" y="249" class="sub" font-weight="700" text-anchor="middle">Mutatie</text>
<text x="852" y="261" class="sub" font-weight="700" text-anchor="middle">doorvoeren</text>

<!-- End event -->
<line x1="905" y1="245" x2="908" y2="245" class="seq"/>
<circle cx="920" cy="245" r="15" class="endev"/>
<text x="920" y="280" class="sub" text-anchor="middle">Mutatie</text>
<text x="920" y="292" class="sub" text-anchor="middle">verwerkt</text>

<rect x="30" y="588" width="900" height="26" rx="6" fill="#EEF2F7"/>
<text x="480" y="605" class="sub" text-anchor="middle">Grens: zodra het ongestructureerde deel een eigen levenscyclus krijgt die langer loopt dan de rest, is het eigenlijk een case (§18.3).</text>
</svg>
