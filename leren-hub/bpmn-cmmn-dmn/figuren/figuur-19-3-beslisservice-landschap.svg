<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" font-family="'DM Sans', Arial, sans-serif" width="1080" height="640" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    .lbl { font-size:12px; fill:#14213D; font-weight:700; }
    .lbl-sm { font-size:11px; fill:#14213D; }
    .sub { font-size:10.5px; fill:#55606F; }
    .box { fill:#EEF2F7; stroke:#14213D; stroke-width:1.4; }
    .dmn { fill:#CFE0F2; stroke:#2563A8; stroke-width:2.2; }
    .legacy { fill:#E3E0D8; stroke:#14213D; stroke-width:1.4; }
    .arrow { stroke:#55606F; stroke-width:1.6; fill:none; marker-end:url(#arr4); }
    .arrow-thin { stroke:#55606F; stroke-width:1.2; stroke-dasharray:3 3; fill:none; marker-end:url(#arr4s); }
    .panel { fill:#FFFFFF; stroke:#CFE0F2; stroke-width:1.4; }
    .row-lbl { font-size:11px; fill:#2563A8; font-weight:700; letter-spacing:.04em; }
    .row-val { font-size:10.8px; fill:#14213D; }
    .row-val-mono { font-size:10.2px; fill:#14213D; font-family:'DM Sans', monospace; }
    .div { stroke:#E3E0D8; stroke-width:1; }
  </style>
  <marker id="arr4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#55606F"/></marker>
  <marker id="arr4s" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#55606F"/></marker>
</defs>
<rect width="1080" height="640" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 19 · FIGUUR 19.3 · TOEPASSINGSLANDSCHAP</text>
<text x="40" y="64" class="title">Een beslisservice in het applicatielandschap van het Mutatieplatform</text>

<!-- ===== landscape (left) ===== -->
<g transform="translate(40,100)">
  <rect x="0" y="0" width="600" height="470" rx="10" fill="#FBFAF7" stroke="#E3E0D8" stroke-dasharray="4 3"/>
  <text x="16" y="24" class="sub" font-weight="700">TOEPASSINGSLANDSCHAP — MUTATIEPLATFORM (CONDUCTUS)</text>

  <!-- consuming processes -->
  <rect x="24" y="50" width="180" height="56" rx="8" class="box"/>
  <text x="114" y="74" text-anchor="middle" class="lbl-sm">Proces: Deelnemer-</text>
  <text x="114" y="90" text-anchor="middle" class="lbl-sm">mutaties verwerken</text>

  <rect x="24" y="130" width="180" height="56" rx="8" class="box"/>
  <text x="114" y="154" text-anchor="middle" class="lbl-sm">Proces: Waarde-</text>
  <text x="114" y="170" text-anchor="middle" class="lbl-sm">overdracht toetsen</text>

  <rect x="24" y="210" width="180" height="56" rx="8" class="box"/>
  <text x="114" y="234" text-anchor="middle" class="lbl-sm">Case: Bijzondere</text>
  <text x="114" y="250" text-anchor="middle" class="lbl-sm">Situaties (deel 17)</text>

  <!-- decision service: DMN-correct flat rectangle -->
  <rect x="300" y="130" width="220" height="70" rx="4" class="dmn"/>
  <text x="410" y="158" text-anchor="middle" class="lbl">Beslisservice</text>
  <text x="410" y="175" text-anchor="middle" class="lbl-sm">Premievrijstelling</text>
  <text x="410" y="190" text-anchor="middle" class="sub">bepalen — v2.3</text>

  <path d="M204,78 L300,150" class="arrow"/>
  <path d="M204,158 L300,164" class="arrow"/>
  <path d="M204,238 L300,190" class="arrow"/>

  <!-- legacy source -->
  <path d="M300,320 a110,18 0 0,0 220,0 l0,-60 a110,18 0 0,0 -220,0 Z" class="legacy"/>
  <ellipse cx="410" cy="260" rx="110" ry="18" class="legacy"/>
  <text x="410" y="296" text-anchor="middle" class="lbl-sm">Polisadministratie</text>
  <text x="410" y="312" text-anchor="middle" class="sub">(legacy, 35 jaar — §14.7)</text>
  <path d="M410,242 L410,200" class="arrow-thin"/>
  <text x="420" y="222" class="sub" font-style="italic">referentiedata</text>

  <!-- logging -->
  <rect x="300" y="360" width="220" height="50" rx="8" class="box"/>
  <text x="410" y="382" text-anchor="middle" class="lbl-sm">Logging &amp; audit</text>
  <text x="410" y="397" text-anchor="middle" class="sub">input, uitkomst, tijdstip</text>
  <path d="M410,200 L410,360" class="arrow"/>

  <text x="24" y="430" class="sub">Elke aanroepende component (proces, case) spreekt de service alleen</text>
  <text x="24" y="444" class="sub">aan via het contract hiernaast — nooit rechtstreeks de tabel (§19.3).</text>
</g>

<!-- ===== contract card (right) ===== -->
<g transform="translate(680,100)">
  <rect x="0" y="0" width="360" height="470" rx="10" class="panel"/>
  <rect x="0" y="0" width="360" height="38" rx="10" fill="#E9A13B"/>
  <rect x="0" y="24" width="360" height="14" fill="#E9A13B"/>
  <text x="18" y="25" fill="#14213D" font-size="12.5" font-weight="700">Aanroepcontract — Premievrijstelling v2.3</text>

  <text x="18" y="62" class="row-lbl">INPUT</text>
  <text x="18" y="80" class="row-val-mono">deelnemerId : string</text>
  <text x="18" y="95" class="row-val-mono">peildatum   : date</text>
  <text x="18" y="110" class="row-val-mono">reden       : enum</text>
  <line x1="18" y1="122" x2="342" y2="122" class="div"/>

  <text x="18" y="144" class="row-lbl">OUTPUT</text>
  <text x="18" y="162" class="row-val-mono">toegekend   : boolean</text>
  <text x="18" y="177" class="row-val-mono">percentage  : number</text>
  <text x="18" y="192" class="row-val-mono">motivering  : string</text>
  <line x1="18" y1="204" x2="342" y2="204" class="div"/>

  <text x="18" y="226" class="row-lbl">VERSIONERING</text>
  <text x="18" y="244" class="row-val">Actief: v2.3. Aanroepers leggen een</text>
  <text x="18" y="259" class="row-val">versie vast of volgen "laatste" — een</text>
  <text x="18" y="274" class="row-val">expliciete keuze per koppelpunt (§19.3).</text>
  <line x1="18" y1="288" x2="342" y2="288" class="div"/>

  <text x="18" y="310" class="row-lbl">FOUTGEDRAG</text>
  <text x="18" y="328" class="row-val">Ongeldige input → HTTP 422 met</text>
  <text x="18" y="343" class="row-val">veldspecifieke foutmelding, geen</text>
  <text x="18" y="358" class="row-val">stille default-uitkomst.</text>
  <line x1="18" y1="372" x2="342" y2="372" class="div"/>

  <text x="18" y="394" class="row-lbl">LOGGING</text>
  <text x="18" y="412" class="row-val">Elke aanroep: input, uitkomst, tijdstip,</text>
  <text x="18" y="427" class="row-val">gekoppeld aan traceerbaarheidsmatrix</text>
  <text x="18" y="442" class="row-val">§16.2 — bewijsmateriaal, niet optioneel.</text>
</g>

<text x="40" y="600" class="sub">Beslisservice = platte rechthoek (DMN-notatie); het contract ernaast is wat §18.6 miste bij de impactanalyse.</text>
</svg>
