<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'DM Sans', Arial, sans-serif" width="960" height="640" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .panel { fill:#FFFFFF; stroke:#CFE0F2; stroke-width:1.2; }
      .panel-good-title { font-size:13px; font-weight:700; fill:#2563A8; letter-spacing:.04em; }
      .panel-bad-title { font-size:13px; font-weight:700; fill:#55606F; letter-spacing:.04em; }
      .task-main { fill:#FFFFFF; stroke:#14213D; stroke-width:2.2; }
      .task-exc { fill:#FBF6E9; stroke:#E9A13B; stroke-width:1.2; }
      .task-eq { fill:#FFFFFF; stroke:#14213D; stroke-width:1.4; }
      .event-start { fill:#FFFFFF; stroke:#14213D; stroke-width:1.4; }
      .event-end-ring { fill:none; stroke:#14213D; stroke-width:3; }
      .gateway-main { fill:#CFE0F2; stroke:#14213D; stroke-width:1.8; }
      .gateway-eq { fill:#FBF6E9; stroke:#E9A13B; stroke-width:1.6; }
      .label { font-size:12.5px; font-weight:700; fill:#14213D; }
      .label-light { font-size:11.5px; font-weight:700; fill:#55606F; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-sm { font-size:10.5px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow-main { stroke:#14213D; stroke-width:2.6; fill:none; marker-end:url(#arrM); }
      .arrow-exc { stroke:#E9A13B; stroke-width:1.4; fill:none; marker-end:url(#arrE); }
      .arrow-eq { stroke:#14213D; stroke-width:1.6; fill:none; marker-end:url(#arrQ); }
      .badge { font-size:10.5px; font-weight:700; fill:#FBFAF7; }
    </style>
    <marker id="arrM" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#14213D"/></marker>
    <marker id="arrE" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
    <marker id="arrQ" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#14213D"/></marker>
</defs>
<rect width="960" height="640" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 05 · HAPPY PATH</text>
<text x="40" y="64" class="title">Figuur 5.2 — Happy path prominent versus gelijk gewicht</text>
<text x="40" y="86" class="sub">Zelfde procesfragment (aanvraag Meridiaan Pensioen), twee tekenwijzen naast elkaar.</text>

<!-- LEFT PANEL: good -->
<rect x="40" y="110" width="420" height="480" rx="8" class="panel"/>
<text x="60" y="136" class="panel-good-title">GOED — happy path springt eruit</text>
<rect x="60" y="150" width="380" height="18" fill="#CFE0F2" rx="3"/>
<text x="250" y="163" text-anchor="middle" class="sub-sm">dikke lijn = hoofdlijn · dunne amberlijn = uitzondering, in de marge</text>

<circle cx="90" cy="330" r="15" class="event-start"/>
<text x="90" y="358" text-anchor="middle" class="sub-sm">Aanvraag</text>
<text x="90" y="370" text-anchor="middle" class="sub-sm">ontvangen</text>

<rect x="140" y="312" width="120" height="36" class="task-main" rx="8"/>
<text x="200" y="334" text-anchor="middle" class="label">Aanvraag beoordelen</text>

<polygon points="300,330 322,312 344,330 322,348" class="gateway-main"/>
<text x="322" y="365" text-anchor="middle" class="sub-sm">Compleet?</text>

<!-- main happy path continues to right edge stub with end marker at bottom of panel -->
<circle cx="440" cy="330" r="14" class="event-end-ring"/>
<circle cx="440" cy="330" r="8" fill="#14213D"/>

<path d="M105,330 L140,330" class="arrow-main"/>
<path d="M260,330 L300,330" class="arrow-main"/>
<path d="M344,330 L426,330" class="arrow-main"/>
<text x="360" y="317" class="sub-sm" fill="#14213D" font-weight="700">ja</text>

<!-- exception path routed to top margin, thin amber -->
<path d="M322,312 L322,220 L200,220 L200,250" class="arrow-exc" fill="none"/>
<text x="200" y="212" text-anchor="middle" class="sub-sm" fill="#55606F">nee</text>
<rect x="150" y="250" width="140" height="34" class="task-exc" rx="7"/>
<text x="220" y="271" text-anchor="middle" class="label-light">Gegevens opvragen</text>
<path d="M220,284 L220,300 L260,312" class="arrow-exc" fill="none"/>

<text x="60" y="420" class="sub">De hoofdlijn (start → beoordelen → compleet? → toekennen) loopt recht</text>
<text x="60" y="438" class="sub">en dik door het midden. De uitzondering "gegevens opvragen" staat</text>
<text x="60" y="456" class="sub">boven in de marge, dunner en lichter — herkenbaar als afwijking.</text>
<text x="60" y="484" class="sub" font-weight="700" fill="#14213D">Een lezer ziet binnen seconden wat het proces normaal doet.</text>

<!-- RIGHT PANEL: bad -->
<rect x="500" y="110" width="420" height="480" rx="8" class="panel"/>
<text x="520" y="136" class="panel-bad-title">MINDER GOED — alle paden gelijk gewicht</text>
<rect x="520" y="150" width="380" height="18" fill="#EEF2F7" rx="3"/>
<text x="710" y="163" text-anchor="middle" class="sub-sm">zelfde dikte, zelfde kleur voor hoofdlijn én uitzondering</text>

<circle cx="550" cy="290" r="15" class="event-start"/>
<text x="550" y="318" text-anchor="middle" class="sub-sm">Aanvraag</text>
<text x="550" y="330" text-anchor="middle" class="sub-sm">ontvangen</text>

<rect x="600" y="272" width="120" height="36" class="task-eq" rx="8"/>
<text x="660" y="294" text-anchor="middle" class="label">Aanvraag beoordelen</text>

<polygon points="760,290 782,272 804,290 782,308" class="gateway-eq"/>
<text x="782" y="325" text-anchor="middle" class="sub-sm">Compleet?</text>

<rect x="620" y="410" width="140" height="34" class="task-eq" rx="7"/>
<text x="690" y="431" text-anchor="middle" class="label">Gegevens opvragen</text>

<circle cx="900" cy="290" r="14" class="event-end-ring"/>
<circle cx="900" cy="290" r="8" fill="#14213D"/>

<path d="M565,290 L600,290" class="arrow-eq"/>
<path d="M720,290 L760,290" class="arrow-eq"/>
<path d="M804,290 L886,290" class="arrow-eq"/>
<text x="820" y="277" class="sub-sm" font-weight="700">ja</text>

<path d="M782,308 L782,390 L690,390 L690,410" class="arrow-eq"/>
<text x="782" y="356" class="sub-sm" font-weight="700">nee</text>
<path d="M690,444 L690,470 L660,470 L660,308" class="arrow-eq"/>

<text x="520" y="500" class="sub">Beide paden hebben dezelfde lijndikte, kleur en centrale plaatsing.</text>
<text x="520" y="518" class="sub">De lezer moet elk pad even zorgvuldig volgen om te ontdekken</text>
<text x="520" y="536" class="sub">wat hier eigenlijk het normale geval is.</text>
<text x="520" y="564" class="sub" font-weight="700" fill="#55606F">Fout #10 uit de checklist van §5.5.</text>
</svg>
