<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="'DM Sans', Arial, sans-serif" width="960" height="500" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .box { fill:#CFE0F2; stroke:#14213D; stroke-width:1.5; }
    .box-amber { fill:#FBF6E9; stroke:#E9A13B; stroke-width:1.5; }
    .box-end { fill:#EEF2F7; stroke:#14213D; stroke-width:1.2; }
    .label { font-size:12.5px; font-weight:700; fill:#14213D; }
    .label-sm { font-size:10.5px; font-weight:700; fill:#14213D; }
    .sub { font-size:10px; fill:#55606F; }
    .sub-amber { font-size:10px; fill:#9c6a1f; font-weight:600; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    .colhead { font-size:14px; font-weight:700; fill:#2563A8; }
    .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
    .arrow-amber { stroke:#E9A13B; stroke-width:2; fill:none; marker-end:url(#arrA); }
    .arrow-dashed { stroke:#55606F; stroke-width:1.3; fill:none; stroke-dasharray:3,3; marker-end:url(#arr); }
    .divider { stroke:#E3E0D8; stroke-width:1.5; }
  </style>
  <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
  <marker id="arrA" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
</defs>
<rect width="960" height="500" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 17 · TOESTANDSDIAGRAM</text>
<text x="40" y="64" class="title">De toestandsmachines van case, stage, task en case file item</text>

<!-- column dividers -->
<line x1="250" y1="88" x2="250" y2="470" class="divider"/>
<line x1="478" y1="88" x2="478" y2="470" class="divider"/>
<line x1="708" y1="88" x2="708" y2="470" class="divider"/>

<!-- ===== COLUMN 1: CASE ===== -->
<text x="135" y="102" class="colhead" text-anchor="middle">Case</text>
<rect x="65" y="120" width="140" height="38" rx="8" class="box"/>
<text x="135" y="144" class="label" text-anchor="middle">Active</text>

<rect x="30" y="188" width="95" height="30" rx="8" class="box"/>
<text x="77" y="207" class="label-sm" text-anchor="middle">Suspended</text>
<path d="M85,158 C60,168 55,180 65,188" class="arrow"/>
<path d="M90,188 C95,175 105,166 120,158" class="arrow-dashed"/>
<text x="10" y="180" class="sub">suspend</text>
<text x="120" y="180" class="sub">resume</text>

<line x1="135" y1="158" x2="135" y2="345" class="arrow"/>
<line x1="20" y1="345" x2="215" y2="345" stroke="#55606F" stroke-width="1.5"/>
<line x1="20" y1="345" x2="20" y2="357" class="arrow"/>
<line x1="135" y1="345" x2="135" y2="357" class="arrow"/>
<line x1="215" y1="345" x2="215" y2="357" class="arrow"/>

<rect x="20" y="357" width="60" height="28" rx="6" class="box-end"/>
<text x="50" y="375" class="label-sm" text-anchor="middle">Completed</text>
<rect x="105" y="357" width="60" height="28" rx="6" class="box-end"/>
<text x="135" y="375" class="label-sm" text-anchor="middle">Terminated</text>
<rect x="185" y="357" width="60" height="28" rx="6" class="box-end"/>
<text x="215" y="375" class="label-sm" text-anchor="middle">Failed</text>

<text x="135" y="415" class="sub" text-anchor="middle">Suspended = tijdelijk gepauzeerd</text>
<text x="135" y="430" class="sub" text-anchor="middle">(bv. wacht op externe info)</text>

<!-- ===== COLUMN 2: STAGE ===== -->
<text x="363" y="102" class="colhead" text-anchor="middle">Stage</text>
<rect x="293" y="120" width="140" height="34" rx="8" class="box"/>
<text x="363" y="142" class="label" text-anchor="middle">Available</text>
<line x1="363" y1="154" x2="363" y2="184" class="arrow"/>
<text x="363" y="172" class="sub" text-anchor="middle">entry criterion vervuld</text>
<rect x="293" y="188" width="140" height="34" rx="8" class="box"/>
<text x="363" y="210" class="label" text-anchor="middle">Enabled</text>
<line x1="363" y1="222" x2="363" y2="252" class="arrow"/>
<text x="363" y="240" class="sub" text-anchor="middle">start</text>
<rect x="293" y="256" width="140" height="34" rx="8" class="box"/>
<text x="363" y="278" class="label" text-anchor="middle">Active</text>

<line x1="363" y1="290" x2="363" y2="345" class="arrow"/>
<line x1="298" y1="345" x2="428" y2="345" stroke="#55606F" stroke-width="1.5"/>
<line x1="298" y1="345" x2="298" y2="357" class="arrow"/>
<line x1="428" y1="345" x2="428" y2="357" class="arrow"/>

<rect x="256" y="357" width="85" height="28" rx="6" class="box-end"/>
<text x="298" y="375" class="label-sm" text-anchor="middle">Completed</text>
<rect x="385" y="357" width="85" height="28" rx="6" class="box-end"/>
<text x="428" y="375" class="label-sm" text-anchor="middle">Terminated</text>

<text x="363" y="415" class="sub" text-anchor="middle">geen Failed op stage-niveau —</text>
<text x="363" y="430" class="sub" text-anchor="middle">falen zit op de taken erin</text>

<!-- ===== COLUMN 3: TASK ===== -->
<text x="593" y="102" class="colhead" text-anchor="middle">Task</text>
<rect x="523" y="120" width="140" height="34" rx="8" class="box"/>
<text x="593" y="142" class="label" text-anchor="middle">Available</text>
<line x1="593" y1="154" x2="593" y2="184" class="arrow"/>
<text x="593" y="172" class="sub" text-anchor="middle">entry criterion vervuld</text>
<rect x="523" y="188" width="140" height="34" rx="8" class="box"/>
<text x="593" y="210" class="label" text-anchor="middle">Enabled</text>
<path d="M665,192 C685,198 685,216 665,220" class="arrow-dashed"/>
<text x="723" y="200" class="sub">manual activation:</text>
<text x="723" y="212" class="sub">blijft hier tot</text>
<text x="723" y="224" class="sub">behandelaar start</text>
<line x1="593" y1="222" x2="593" y2="252" class="arrow"/>
<text x="593" y="240" class="sub" text-anchor="middle">start</text>
<rect x="523" y="256" width="140" height="34" rx="8" class="box"/>
<text x="593" y="278" class="label" text-anchor="middle">Active</text>

<line x1="593" y1="290" x2="593" y2="345" class="arrow"/>
<line x1="538" y1="345" x2="648" y2="345" stroke="#55606F" stroke-width="1.5"/>
<line x1="538" y1="345" x2="538" y2="357" class="arrow"/>
<line x1="593" y1="345" x2="593" y2="357" class="arrow"/>
<line x1="648" y1="345" x2="648" y2="357" class="arrow"/>

<rect x="508" y="357" width="60" height="28" rx="6" class="box-end"/>
<text x="538" y="375" class="label-sm" text-anchor="middle">Completed</text>
<rect x="563" y="357" width="60" height="28" rx="6" class="box-end"/>
<text x="593" y="375" class="label-sm" text-anchor="middle">Terminated</text>
<rect x="618" y="357" width="60" height="28" rx="6" class="box-end"/>
<text x="648" y="375" class="label-sm" text-anchor="middle">Failed</text>

<text x="593" y="415" class="sub" text-anchor="middle">Failed is specifiek voor task,</text>
<text x="593" y="430" class="sub" text-anchor="middle">niet voor stage</text>

<!-- ===== COLUMN 4: CASE FILE ITEM ===== -->
<text x="823" y="102" class="colhead" text-anchor="middle">Case file item</text>
<rect x="753" y="120" width="140" height="34" rx="8" class="box-amber"/>
<text x="823" y="142" class="label" text-anchor="middle">Available</text>
<path d="M893,124 C915,132 915,148 893,152" class="arrow-amber"/>
<text x="920" y="132" class="sub-amber">Create /</text>
<text x="920" y="144" class="sub-amber">Update:</text>
<text x="920" y="156" class="sub-amber">elke wijziging</text>
<text x="920" y="168" class="sub-amber">is een eigen</text>
<text x="920" y="180" class="sub-amber">transitie</text>

<line x1="823" y1="154" x2="823" y2="188" class="arrow-amber"/>
<text x="823" y="174" class="sub-amber" text-anchor="middle">transitie</text>
<rect x="753" y="192" width="140" height="34" rx="8" class="box-amber"/>
<text x="823" y="214" class="label" text-anchor="middle">Gewijzigd</text>

<line x1="823" y1="226" x2="823" y2="357" class="arrow-amber"/>
<rect x="753" y="357" width="140" height="34" rx="8" class="box-end"/>
<text x="823" y="376" class="label-sm" text-anchor="middle">Toestand relevant</text>
<text x="823" y="388" class="sub" text-anchor="middle">voor sentry-verwijzing</text>

<text x="823" y="415" class="sub" text-anchor="middle">elke pijl hierboven is een</text>
<text x="823" y="430" class="sub" text-anchor="middle">transitie waar een sentry op kan reageren</text>

<!-- Bottom callout -->
<rect x="30" y="450" width="900" height="42" rx="6" fill="#FBF6E9" stroke="#E9A13B" stroke-width="1.3"/>
<text x="480" y="468" class="sub-amber" text-anchor="middle" font-size="12">Een sentry reageert op de transitie — de pijl in dit schema — niet op de toestand.</text>
<text x="480" y="483" class="sub-amber" text-anchor="middle" font-size="12">"Milestone bereikt" = de transitie naar Completed, niet "zolang Completed".</text>
</svg>
