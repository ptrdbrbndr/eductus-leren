<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'DM Sans', Arial, sans-serif" width="960" height="640" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .panel { fill:#FFFFFF; stroke:#E3E0D8; stroke-width:1.5; }
      .panel-warn { fill:#FBF6E9; stroke:#E9A13B; stroke-width:2; }
      .node { fill:#CFE0F2; stroke:#14213D; stroke-width:1; r:7; }
      .nodebig { fill:#CFE0F2; stroke:#14213D; stroke-width:1.3; }
      .paneltitle { font-size:13.5px; font-weight:700; fill:#14213D; }
      .panelsub { font-size:10.5px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .sub { font-size:11px; fill:#55606F; }
      .nodetext { font-size:9.5px; font-weight:700; fill:#14213D; }
      .edge-thin { stroke:#6FA3D6; stroke-width:1; fill:none; opacity:.8; }
      .edge-mid { stroke:#2563A8; stroke-width:1.8; fill:none; marker-end:url(#arrB); }
      .edge-thick { stroke:#14213D; stroke-width:3; fill:none; marker-end:url(#arrD); }
      .arrowlabel { font-size:16px; fill:#55606F; }
      .warnbadge { fill:#E9A13B; stroke:#8a5a12; stroke-width:1; }
      .warntext { font-size:11px; font-weight:700; fill:#8a5a12; }
      .callout { fill:#FBF6E9; stroke:#E9A13B; stroke-width:1.4; }
      .calltitle { font-size:12px; font-weight:700; fill:#8a5a12; }
      .calltext { font-size:11px; fill:#55606F; }
    </style>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="#2563A8"/></marker>
    <marker id="arrD" markerWidth="8" markerHeight="8" refX="5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="#14213D"/></marker>
</defs>
<rect width="960" height="640" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 25 · FILTERREEKS</text>
<text x="40" y="64" class="title">Figuur 25.3 — Van spaghettimodel tot te schoon om waar te zijn</text>
<text x="40" y="84" class="sub">Drie filterniveaus op hetzelfde discovery-resultaat (§25.3)</text>

<!-- Panel 1: raw spaghetti -->
<rect x="30" y="110" width="270" height="400" rx="6" class="panel"/>
<text x="165" y="134" text-anchor="middle" class="paneltitle">Ruwe log</text>
<text x="165" y="150" text-anchor="middle" class="panelsub">geen filtering</text>
<g transform="translate(45,165)">
  <!-- scattered nodes -->
  <circle cx="30" cy="20" r="7" class="node"/>
  <circle cx="120" cy="10" r="7" class="node"/>
  <circle cx="200" cy="30" r="7" class="node"/>
  <circle cx="60" cy="80" r="7" class="node"/>
  <circle cx="150" cy="90" r="7" class="node"/>
  <circle cx="220" cy="110" r="7" class="node"/>
  <circle cx="20" cy="150" r="7" class="node"/>
  <circle cx="100" cy="170" r="7" class="node"/>
  <circle cx="190" cy="180" r="7" class="node"/>
  <circle cx="60" cy="230" r="7" class="node"/>
  <circle cx="160" cy="240" r="7" class="node"/>
  <circle cx="115" cy="290" r="7" class="node"/>
  <!-- messy crossing edges -->
  <g class="edge-thin">
    <path d="M30,20 L120,10"/><path d="M120,10 L200,30"/><path d="M30,20 L60,80"/>
    <path d="M120,10 L150,90"/><path d="M200,30 L220,110"/><path d="M60,80 L150,90"/>
    <path d="M150,90 L220,110"/><path d="M60,80 L20,150"/><path d="M150,90 L100,170"/>
    <path d="M220,110 L190,180"/><path d="M20,150 L100,170"/><path d="M100,170 L190,180"/>
    <path d="M20,150 L60,230"/><path d="M100,170 L160,240"/><path d="M190,180 L160,240"/>
    <path d="M60,230 L115,290"/><path d="M160,240 L115,290"/><path d="M30,20 L190,180"/>
    <path d="M200,30 L60,230"/><path d="M120,10 L20,150"/>
  </g>
</g>
<text x="45" y="580" class="sub" font-style="italic">Elk pad dat ooit voorkwam staat erin —</text>
<text x="45" y="593" class="sub" font-style="italic">onleesbaar, maar volledig.</text>

<!-- arrow between panel 1 and 2 -->
<text x="313" y="320" class="arrowlabel">→</text>

<!-- Panel 2: filtered -->
<rect x="345" y="110" width="270" height="400" rx="6" class="panel"/>
<text x="480" y="134" text-anchor="middle" class="paneltitle">Gefilterd</text>
<text x="480" y="150" text-anchor="middle" class="panelsub">ruis eruit, hoofdpatroon zichtbaar</text>
<g transform="translate(400,170)">
  <rect x="60" y="0" width="80" height="30" rx="6" class="nodebig"/><text x="100" y="19" text-anchor="middle" class="nodetext">Ontvangst</text>
  <rect x="60" y="90" width="80" height="30" rx="6" class="nodebig"/><text x="100" y="109" text-anchor="middle" class="nodetext">Validatie</text>
  <rect x="0" y="180" width="80" height="30" rx="6" class="nodebig"/><text x="40" y="199" text-anchor="middle" class="nodetext">Uitzondering</text>
  <rect x="120" y="180" width="80" height="30" rx="6" class="nodebig"/><text x="160" y="199" text-anchor="middle" class="nodetext">Verwerking</text>
  <rect x="60" y="270" width="80" height="30" rx="6" class="nodebig"/><text x="100" y="289" text-anchor="middle" class="nodetext">Bevestiging</text>
  <path d="M100,30 L100,90" class="edge-thick"/>
  <path d="M85,120 L45,180" class="edge-thin" stroke="#6FA3D6" stroke-width="2"/>
  <path d="M115,120 L155,180" class="edge-thick"/>
  <path d="M45,210 L90,270" class="edge-thin" stroke="#6FA3D6" stroke-width="2"/>
  <path d="M155,210 L110,270" class="edge-thick"/>
</g>
<text x="360" y="580" class="sub" font-style="italic">Legitiem: de zeldzame uitzonderingsroute</text>
<text x="360" y="593" class="sub" font-style="italic">blijft zichtbaar, alleen minder nadrukkelijk.</text>

<!-- arrow between panel 2 and 3 -->
<text x="627" y="320" class="arrowlabel">→</text>

<!-- Panel 3: overfiltered -->
<rect x="660" y="110" width="270" height="400" rx="6" class="panel-warn"/>
<rect x="678" y="122" width="120" height="24" rx="4" class="warnbadge"/>
<text x="738" y="139" text-anchor="middle" class="warntext">⚠ waarschuwing</text>
<text x="795" y="160" text-anchor="middle" class="paneltitle">Overgefilterd</text>
<g transform="translate(715,180)">
  <rect x="20" y="0" width="90" height="30" rx="6" class="nodebig"/><text x="65" y="19" text-anchor="middle" class="nodetext">Ontvangst</text>
  <rect x="20" y="80" width="90" height="30" rx="6" class="nodebig"/><text x="65" y="99" text-anchor="middle" class="nodetext">Validatie</text>
  <rect x="20" y="160" width="90" height="30" rx="6" class="nodebig"/><text x="65" y="179" text-anchor="middle" class="nodetext">Verwerking</text>
  <rect x="20" y="240" width="90" height="30" rx="6" class="nodebig"/><text x="65" y="259" text-anchor="middle" class="nodetext">Bevestiging</text>
  <path d="M65,30 L65,80" class="edge-thick"/>
  <path d="M65,110 L65,160" class="edge-thick"/>
  <path d="M65,190 L65,240" class="edge-thick"/>
</g>
<text x="678" y="450" class="calltext" font-weight="700" fill="#8a5a12">"Te schoon om waar te zijn"</text>
<text x="678" y="468" class="calltext">Eén rechte lijn, geen enkele variatie meer —</text>
<text x="678" y="482" class="calltext">geen enkel proces met 380.000 deelnemers</text>
<text x="678" y="496" class="calltext">verloopt zó ordelijk. De filterdrempel ligt</text>
<text x="678" y="510" class="calltext">voorbij wat verdedigbaar is (§25.3).</text>

<rect x="30" y="540" width="900" height="70" rx="6" class="callout"/>
<text x="48" y="562" class="calltitle">De grens tussen verhelderen en verbergen</text>
<text x="48" y="580" class="calltext">Filteren tot ruis weg is: legitiem. Filteren tot het plaatje past bij wat je al dacht: de meest verleidelijke</text>
<text x="48" y="596" class="calltext">vorm van onbedoeld bedrog in dit vak — zelden opzettelijk kwaadaardig, wel een risico bij elke discovery-run.</text>
</svg>
