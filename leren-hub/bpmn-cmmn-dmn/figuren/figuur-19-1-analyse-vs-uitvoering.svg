<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 660" font-family="'DM Sans', Arial, sans-serif" width="1260" height="660" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    .panel-h { font-size:13px; font-weight:700; fill:#14213D; letter-spacing:.06em; }
    .panel-sub { font-size:11px; fill:#55606F; }
    .lbl { font-size:11.5px; fill:#14213D; font-weight:600; }
    .lbl-sm { font-size:10px; fill:#14213D; }
    .sub { font-size:10px; fill:#55606F; }
    .badge-txt { font-size:9.3px; fill:#7A5A16; }
    .flowlbl { font-size:10px; fill:#55606F; font-style:italic; }
    .icon-line { stroke:#14213D; stroke-width:1.3; fill:none; }
    .thin { stroke:#14213D; stroke-width:1.5; fill:#FFFFFF; }
    .double { stroke:#14213D; stroke-width:1.2; fill:none; }
    .thick { stroke:#14213D; stroke-width:3.2; fill:#FFFFFF; }
    .task { stroke:#14213D; stroke-width:1.5; fill:#FFFFFF; }
    .gw { stroke:#14213D; stroke-width:1.5; fill:#FFFFFF; }
    .amber-badge { stroke:#E9A13B; stroke-width:1.4; stroke-dasharray:4 3; fill:#FBF6E9; }
    .leader { stroke:#E9A13B; stroke-width:1.2; stroke-dasharray:2 2; fill:none; }
    .flow { stroke:#14213D; stroke-width:1.6; fill:none; marker-end:url(#arr2); }
    .divider { stroke:#14213D; stroke-width:1; stroke-dasharray:5 4; opacity:.5; }
  </style>
  <marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#14213D"/></marker>
</defs>
<rect width="1260" height="660" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 19 · FIGUUR 19.1 · BPMN-FRAGMENT</text>
<text x="40" y="64" class="title">Deelnemermutatie verwerken — analysemodel naast uitvoeringsmodel</text>

<line x1="630" y1="86" x2="630" y2="628" class="divider"/>

<!-- ================= LEFT PANEL : ANALYSEMODEL ================= -->
<g transform="translate(40,0)">
  <text x="0" y="100" class="panel-h">ANALYSEMODEL</text>
  <text x="0" y="118" class="panel-sub">wat een businesspubliek leest en beoordeelt</text>

  <!-- start event -->
  <circle cx="40" cy="230" r="18" class="thin"/>
  <text x="40" y="272" text-anchor="middle" class="sub">Mutatie</text>
  <text x="40" y="284" text-anchor="middle" class="sub">ontvangen</text>
  <path d="M58,230 L100,230" class="flow"/>

  <!-- service task -->
  <rect x="100" y="200" width="140" height="60" rx="10" class="task"/>
  <g transform="translate(108,168) translate(0,40)">
    <circle r="7" class="icon-line"/><circle r="2.3" fill="#14213D"/>
    <line x1="0" y1="-7" x2="0" y2="-10" class="icon-line"/>
    <line x1="0" y1="7" x2="0" y2="10" class="icon-line"/>
    <line x1="-7" y1="0" x2="-10" y2="0" class="icon-line"/>
    <line x1="7" y1="0" x2="10" y2="0" class="icon-line"/>
    <line x1="-5" y1="-5" x2="-7" y2="-7" class="icon-line"/>
    <line x1="5" y1="5" x2="7" y2="7" class="icon-line"/>
    <line x1="5" y1="-5" x2="7" y2="-7" class="icon-line"/>
    <line x1="-5" y1="5" x2="-7" y2="7" class="icon-line"/>
  </g>
  <text x="170" y="234" text-anchor="middle" class="lbl-sm">Valideer tegen</text>
  <text x="170" y="247" text-anchor="middle" class="lbl-sm">polisadministratie</text>
  <path d="M240,230 L280,230" class="flow"/>

  <!-- gateway -->
  <path d="M312,202 L340,230 L312,258 L284,230 Z" class="gw"/>
  <path d="M304,222 L320,238 M320,222 L304,238" stroke="#14213D" stroke-width="1.4"/>
  <text x="220" y="224" text-anchor="end" class="lbl-sm">Compleet?</text>
  <text x="352" y="222" class="flowlbl">ja</text>
  <path d="M340,230 L370,230" class="flow"/>

  <!-- user task -->
  <rect x="370" y="200" width="140" height="60" rx="10" class="task"/>
  <g transform="translate(378,168) translate(0,40)">
    <circle cx="0" cy="-3" r="3.4" class="icon-line"/>
    <path d="M-5.5,7 Q0,-2.5 5.5,7 Z" class="icon-line"/>
  </g>
  <text x="440" y="234" text-anchor="middle" class="lbl-sm">Aanvraag</text>
  <text x="440" y="247" text-anchor="middle" class="lbl-sm">beoordelen</text>
  <path d="M510,230 L540,230" class="flow"/>

  <!-- end event 1 -->
  <circle cx="556" cy="230" r="20" class="thick"/>
  <text x="556" y="270" text-anchor="middle" class="sub">Verwerkt</text>

  <!-- nee branch -->
  <text x="320" y="284" class="flowlbl">nee</text>
  <path d="M312,258 L312,332" class="flow"/>
  <circle cx="312" cy="352" r="20" class="double"/>
  <circle cx="312" cy="352" r="16" class="double"/>
  <g transform="translate(312,352)">
    <circle r="9" class="icon-line"/>
    <line x1="0" y1="0" x2="0" y2="-6" class="icon-line"/>
    <line x1="0" y1="0" x2="4" y2="2" class="icon-line"/>
  </g>
  <text x="345" y="348" class="sub">wacht op aanvulling</text>
  <text x="345" y="360" class="sub">(ca. 14 dagen)</text>
  <path d="M312,372 L312,412" class="flow"/>
  <circle cx="312" cy="432" r="20" class="thick"/>
  <text x="312" y="472" text-anchor="middle" class="sub">Geweigerd</text>

  <rect x="0" y="520" width="580" height="86" rx="8" fill="#EEF2F7" stroke="#CFE0F2"/>
  <text x="16" y="542" class="lbl-sm" font-weight="700">Wat dit model laat zien</text>
  <text x="16" y="560" class="sub">Bedoeld om te communiceren en te laten vaststellen. "Compleet?" en</text>
  <text x="16" y="574" class="sub">"wacht op aanvulling" zijn menselijke omschrijvingen, geen expressies —</text>
  <text x="16" y="588" class="sub">geen enkel element is hier technisch genoeg om te kunnen draaien.</text>
</g>

<!-- ================= RIGHT PANEL : UITVOERINGSMODEL ================= -->
<g transform="translate(640,0)">
  <text x="0" y="100" class="panel-h">UITVOERINGSMODEL</text>
  <text x="0" y="118" class="panel-sub">wat de engine (Conductus) daadwerkelijk draait</text>

  <!-- start event: message -->
  <circle cx="40" cy="230" r="18" class="thin"/>
  <g transform="translate(40,230)">
    <rect x="-7" y="-5" width="14" height="10" fill="none" stroke="#14213D" stroke-width="1.1"/>
    <path d="M-7,-5 L0,1 L7,-5" fill="none" stroke="#14213D" stroke-width="1.1"/>
  </g>
  <text x="40" y="272" text-anchor="middle" class="sub">Mutatie</text>
  <text x="40" y="284" text-anchor="middle" class="sub">ontvangen</text>
  <path d="M58,230 L100,230" class="flow"/>

  <!-- amber badge: connector -->
  <rect x="86" y="138" width="168" height="40" rx="6" class="amber-badge"/>
  <text x="170" y="153" text-anchor="middle" class="badge-txt" font-weight="700">connector: legacyAdapter</text>
  <text x="170" y="166" text-anchor="middle" class="badge-txt">in: mutatieId → out: status</text>
  <path d="M170,178 L170,200" class="leader"/>

  <!-- service task -->
  <rect x="100" y="200" width="140" height="60" rx="10" class="task"/>
  <g transform="translate(108,208)">
    <circle r="7" class="icon-line"/><circle r="2.3" fill="#14213D"/>
    <line x1="0" y1="-7" x2="0" y2="-10" class="icon-line"/>
    <line x1="0" y1="7" x2="0" y2="10" class="icon-line"/>
    <line x1="-7" y1="0" x2="-10" y2="0" class="icon-line"/>
    <line x1="7" y1="0" x2="10" y2="0" class="icon-line"/>
    <line x1="-5" y1="-5" x2="-7" y2="-7" class="icon-line"/>
    <line x1="5" y1="5" x2="7" y2="7" class="icon-line"/>
    <line x1="5" y1="-5" x2="7" y2="-7" class="icon-line"/>
    <line x1="-5" y1="5" x2="-7" y2="7" class="icon-line"/>
  </g>
  <text x="170" y="234" text-anchor="middle" class="lbl-sm">Valideer tegen</text>
  <text x="170" y="247" text-anchor="middle" class="lbl-sm">polisadministratie</text>
  <path d="M240,230 L280,230" class="flow"/>

  <!-- gateway -->
  <path d="M312,202 L340,230 L312,258 L284,230 Z" class="gw"/>
  <path d="M304,222 L320,238 M320,222 L304,238" stroke="#14213D" stroke-width="1.4"/>
  <text x="220" y="224" text-anchor="end" class="lbl-sm">Compleet?</text>
  <text x="352" y="222" class="flowlbl">ja</text>
  <path d="M340,230 L370,230" class="flow"/>

  <!-- amber badge: FEEL expression -->
  <rect x="252" y="138" width="150" height="30" rx="6" class="amber-badge"/>
  <text x="327" y="157" text-anchor="middle" class="badge-txt" font-weight="700">FEEL: compleet = true</text>
  <path d="M312,168 L312,202" class="leader"/>

  <!-- user task -->
  <rect x="370" y="200" width="140" height="60" rx="10" class="task"/>
  <g transform="translate(378,208)">
    <circle cx="0" cy="-3" r="3.4" class="icon-line"/>
    <path d="M-5.5,7 Q0,-2.5 5.5,7 Z" class="icon-line"/>
  </g>
  <text x="440" y="234" text-anchor="middle" class="lbl-sm">Aanvraag</text>
  <text x="440" y="247" text-anchor="middle" class="lbl-sm">beoordelen</text>
  <path d="M510,230 L540,230" class="flow"/>

  <!-- amber badge: form -->
  <rect x="366" y="138" width="150" height="30" rx="6" class="amber-badge"/>
  <text x="441" y="157" text-anchor="middle" class="badge-txt" font-weight="700">formulier: MUT-003</text>
  <path d="M440,168 L440,200" class="leader"/>

  <!-- end event 1 -->
  <circle cx="556" cy="230" r="20" class="thick"/>
  <text x="556" y="270" text-anchor="middle" class="sub">Verwerkt</text>

  <!-- nee branch -->
  <text x="320" y="284" class="flowlbl">nee</text>
  <path d="M312,258 L312,332" class="flow"/>
  <circle cx="312" cy="352" r="20" class="double"/>
  <circle cx="312" cy="352" r="16" class="double"/>
  <g transform="translate(312,352)">
    <circle r="9" class="icon-line"/>
    <line x1="0" y1="0" x2="0" y2="-6" class="icon-line"/>
    <line x1="0" y1="0" x2="4" y2="2" class="icon-line"/>
  </g>
  <rect x="345" y="336" width="90" height="24" rx="5" class="amber-badge"/>
  <text x="390" y="352" text-anchor="middle" class="badge-txt" font-weight="700">ISO: P14D</text>
  <path d="M332,352 L345,352" class="leader"/>
  <path d="M312,372 L312,412" class="flow"/>
  <circle cx="312" cy="432" r="20" class="thick"/>
  <text x="312" y="472" text-anchor="middle" class="sub">Geweigerd</text>

  <rect x="0" y="520" width="580" height="86" rx="8" fill="#FBF6E9" stroke="#E9A13B" stroke-dasharray="4 3"/>
  <text x="16" y="542" class="lbl-sm" font-weight="700">Wat dit model extra nodig heeft</text>
  <text x="16" y="560" class="sub">Dezelfde vorm, dezelfde stappen — maar elk element is nu volledig</text>
  <text x="16" y="574" class="sub">technisch ingevuld: connector, expressie, formulier, exacte duur. Dit maakt</text>
  <text x="16" y="588" class="sub">het model draaibaar én minder direct leesbaar voor een businesspubliek.</text>
</g>

<text x="40" y="640" class="sub">Amber, gestippeld = technische toevoeging die alleen het uitvoeringsmodel nodig heeft (§19.1 — twee modellen synchroon houden, of één model met lagen).</text>
</svg>
