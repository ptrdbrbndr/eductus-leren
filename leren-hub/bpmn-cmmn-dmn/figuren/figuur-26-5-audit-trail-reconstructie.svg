<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 680" font-family="'DM Sans', Arial, sans-serif" width="1080" height="680" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    .querybox { fill:#FBF6E9; stroke:#E9A13B; stroke-width:1.4; }
    .queryhead { font-size:12.5px; font-weight:700; fill:#8a6a1f; }
    .queryq { font-size:13.5px; font-style:italic; fill:#14213D; }
    .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
    .axis { stroke:#14213D; stroke-width:1.6; fill:none; marker-end:url(#arr); }
    .axislabel { font-size:11px; fill:#55606F; font-style:italic; }
    .dot { fill:#14213D; stroke:#FBFAF7; stroke-width:1.5; }
    .stub { stroke:#55606F; stroke-width:1.2; fill:none; }
    .conv { stroke:#E9A13B; stroke-width:1.4; fill:none; stroke-dasharray:5 3; marker-end:url(#arramber); }
    .datelabel { font-size:10px; font-weight:700; fill:#14213D; }
    .card { fill:#FFFFFF; stroke:#14213D; stroke-width:1.3; }
    .cardfield { font-size:9.5px; fill:#14213D; }
    .cardlabel { font-size:9.5px; font-weight:700; fill:#2563A8; }
    .answerbox { fill:#CFE0F2; stroke:#2563A8; stroke-width:1.6; }
    .answerhead { font-size:13px; font-weight:700; fill:#14213D; }
    .answertxt { font-size:11.5px; fill:#14213D; }
  </style>
  <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
  <marker id="arramber" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
</defs>
<rect width="1080" height="680" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 26 · AUDIT TRAIL · TIJDLIJN</text>
<text x="40" y="64" class="title">Figuur 26.5 — De audit trail als reconstructie van een besluit van drie jaar geleden</text>

<rect x="290" y="84" width="500" height="60" rx="8" class="querybox"/>
<text x="310" y="106" class="queryhead">DEELNEMER, MEDIO 2031</text>
<text x="310" y="128" class="queryq">"Waarom is mijn aanspraak zo berekend?"</text>
<path d="M540,144 L540,166" class="arrow"/>
<text x="556" y="160" class="axislabel">audit trail wordt geraadpleegd</text>
<text x="40" y="182" class="axislabel">Audit trail — dossier 44210, chronologisch gereconstrueerd</text>

<!-- cards above axis: entries 1 and 3 -->
<rect x="80" y="200" width="220" height="88" rx="7" class="card"/>
<text x="94" y="217" class="cardfield" style="font-weight:700">28 dec 2027</text>
<text x="94" y="233" class="cardfield"><tspan class="cardlabel">Wie: </tspan>Risicoanalist R. Jansen</text>
<text x="94" y="247" class="cardfield"><tspan class="cardlabel">Wat: </tspan>Risicoanalyse dossier 44210</text>
<text x="94" y="261" class="cardfield"><tspan class="cardlabel">Basis: </tspan>pensioenregister v12</text>
<text x="94" y="275" class="cardfield"><tspan class="cardlabel">Uitkomst: </tspan>gemarkeerd complex</text>

<rect x="600" y="200" width="220" height="88" rx="7" class="card"/>
<text x="614" y="217" class="cardfield" style="font-weight:700">8 jan 2028</text>
<text x="614" y="233" class="cardfield"><tspan class="cardlabel">Wie: </tspan>Bestuur Meridiaan Pensioen</text>
<text x="614" y="247" class="cardfield"><tspan class="cardlabel">Wat: </tspan>Bestuursbesluit datakwaliteit</text>
<text x="614" y="261" class="cardfield"><tspan class="cardlabel">Basis: </tspan>accountantsverklaring</text>
<text x="614" y="275" class="cardfield"><tspan class="cardlabel">Uitkomst: </tspan>vrijgave voor invaren</text>

<!-- axis -->
<path d="M60,322 L1040,322" class="axis"/>
<circle cx="190" cy="322" r="5" class="dot"/>
<circle cx="450" cy="322" r="5" class="dot"/>
<circle cx="710" cy="322" r="5" class="dot"/>
<circle cx="940" cy="322" r="5" class="dot"/>
<text x="190" y="342" text-anchor="middle" class="datelabel">28-12-2027</text>
<text x="450" y="342" text-anchor="middle" class="datelabel">3-1-2028</text>
<text x="710" y="342" text-anchor="middle" class="datelabel">8-1-2028</text>
<text x="940" y="342" text-anchor="middle" class="datelabel">14-1-2028</text>

<path d="M190,288 L190,317" class="stub"/>
<path d="M710,288 L710,317" class="stub"/>
<path d="M450,327 L450,356" class="stub"/>
<path d="M940,327 L940,356" class="stub"/>

<!-- cards below axis: entries 2 and 4 -->
<rect x="340" y="356" width="220" height="88" rx="7" class="card"/>
<text x="354" y="373" class="cardfield" style="font-weight:700">3 jan 2028</text>
<text x="354" y="389" class="cardfield"><tspan class="cardlabel">Wie: </tspan>Tweede beoordelaar M. de Wit</text>
<text x="354" y="403" class="cardfield"><tspan class="cardlabel">Wat: </tspan>Vierogencontrole uitgevoerd</text>
<text x="354" y="417" class="cardfield"><tspan class="cardlabel">Basis: </tspan>risicoanalyse + herrekening</text>
<text x="354" y="431" class="cardfield"><tspan class="cardlabel">Uitkomst: </tspan>goedgekeurd, met aanpassing</text>

<rect x="830" y="356" width="220" height="88" rx="7" class="card"/>
<text x="844" y="373" class="cardfield" style="font-weight:700">14 jan 2028</text>
<text x="844" y="389" class="cardfield"><tspan class="cardlabel">Wie: </tspan>Mutatieplatform (systeem)</text>
<text x="844" y="403" class="cardfield"><tspan class="cardlabel">Wat: </tspan>Aanspraak herrekend, ingevaren</text>
<text x="844" y="417" class="cardfield"><tspan class="cardlabel">Basis: </tspan>goedgekeurd dossier 44210</text>
<text x="844" y="431" class="cardfield"><tspan class="cardlabel">Uitkomst: </tspan>nieuwe aanspraak vastgesteld</text>

<!-- convergence into reconstructed answer -->
<path d="M190,322 C190,400 220,440 250,486" class="conv"/>
<path d="M710,322 C710,400 720,440 730,486" class="conv"/>
<path d="M450,444 C450,465 440,478 430,486" class="conv"/>
<path d="M940,444 C940,465 900,478 850,486" class="conv"/>

<rect x="60" y="486" width="960" height="130" rx="8" class="answerbox"/>
<text x="80" y="510" class="answerhead">Gereconstrueerd antwoord — medio 2031</text>
<text x="80" y="532" class="answertxt">Dossier 44210 is op 28-12-2027 als complex gemarkeerd, op 3-1-2028 via het</text>
<text x="80" y="550" class="answertxt">vierogenprincipe gecontroleerd en aangepast, op 8-1-2028 door het bestuur</text>
<text x="80" y="568" class="answertxt">vrijgegeven, en op 14-1-2028 door het Mutatieplatform herrekend en ingevaren</text>
<text x="80" y="586" class="answertxt">tot de huidige aanspraak — vier jaar later nog stap voor stap reconstrueerbaar</text>
<text x="80" y="604" class="answertxt">uit de audit trail, zonder dat iemand het zich nog hoeft te herinneren.</text>

</svg>
