<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" font-family="'DM Sans', Arial, sans-serif" width="960" height="760" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .box { fill:#EEF2F7; stroke:#14213D; stroke-width:1.4; }
      .evt { fill:#FBFAF7; stroke:#14213D; stroke-width:1.6; }
      .evt-end { fill:#FBFAF7; stroke:#14213D; stroke-width:3; }
      .task { fill:#CFE0F2; stroke:#14213D; stroke-width:1.6; rx:8; }
      .flow { stroke:#14213D; stroke-width:1.6; fill:none; marker-end:url(#arr); }
      .label { font-size:13px; font-weight:700; fill:#14213D; }
      .sub { font-size:12px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .code { font-family:'Courier New', monospace; font-size:12px; fill:#14213D; }
      .code-model { font-family:'Courier New', monospace; font-size:12px; fill:#123a63; }
      .code-di { font-family:'Courier New', monospace; font-size:12px; fill:#8a5a12; }
      .model-frame { fill:#CFE0F2; opacity:0.35; stroke:#2563A8; stroke-width:1.6; stroke-dasharray:4,3; }
      .di-frame { fill:#FBF6E9; opacity:0.55; stroke:#E9A13B; stroke-width:1.6; stroke-dasharray:4,3; }
      .tag-model { font-size:11px; font-weight:700; fill:#2563A8; letter-spacing:.06em; }
      .tag-di { font-size:11px; font-weight:700; fill:#8a5a12; letter-spacing:.06em; }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#14213D"/></marker>
</defs>
<rect width="960" height="760" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 09 · TOOLING</text>
<text x="40" y="64" class="title">Figuur 9.1 — Eén model: het diagram en de onderliggende XML</text>
<text x="40" y="86" class="sub">Model (betekenis) en Diagram Interchange (positie) staan los van elkaar in dezelfde XML — §9.1</text>

<!-- diagram -->
<rect x="40" y="110" width="880" height="140" class="box"/>
<text x="58" y="132" class="sub" font-weight="700">GETOOND DIAGRAM — proces "Mutatie verwerken"</text>
<circle cx="150" cy="195" r="18" class="evt"/>
<text x="150" y="230" text-anchor="middle" class="sub">Aanvraag ontvangen</text>
<rect x="230" y="165" width="150" height="60" rx="8" class="task"/>
<text x="305" y="200" text-anchor="middle" class="label">Aanvraag</text>
<text x="305" y="216" text-anchor="middle" class="label" font-size="12">beoordelen</text>
<circle cx="470" cy="195" r="19" class="evt-end"/>
<text x="470" y="230" text-anchor="middle" class="sub">Aanvraag verwerkt</text>
<path d="M168,195 L230,195" class="flow"/>
<path d="M380,195 L451,195" class="flow"/>

<!-- Code block -->
<rect x="40" y="270" width="880" height="440" fill="#14213D" rx="8"/>
<text x="58" y="296" class="sub" fill="#B9C4D3" font-weight="700">bpmn.xml (vereenvoudigd)</text>

<!-- model region highlight -->
<rect x="52" y="308" width="856" height="150" rx="6" class="model-frame"/>
<text x="800" y="326" text-anchor="end" class="tag-model">MODEL — betekenis</text>

<text x="66" y="346" class="code" fill="#CFE0F2">&lt;bpmn:process id="Proces_Mutatie"&gt;</text>
<text x="66" y="366" class="code" fill="#CFE0F2">  &lt;bpmn:startEvent id="Start_1" name="Aanvraag ontvangen"/&gt;</text>
<text x="66" y="386" class="code" fill="#CFE0F2">  &lt;bpmn:task id="Task_1" name="Aanvraag beoordelen"/&gt;</text>
<text x="66" y="406" class="code" fill="#CFE0F2">  &lt;bpmn:endEvent id="End_1" name="Aanvraag verwerkt"/&gt;</text>
<text x="66" y="426" class="code" fill="#CFE0F2">  &lt;bpmn:sequenceFlow id="Flow_1" sourceRef="Start_1" targetRef="Task_1"/&gt;</text>
<text x="66" y="446" class="code" fill="#CFE0F2">  &lt;bpmn:sequenceFlow id="Flow_2" sourceRef="Task_1" targetRef="End_1"/&gt;</text>

<text x="66" y="478" class="code" fill="#8a99ad">&lt;/bpmn:process&gt;</text>

<!-- DI region highlight -->
<rect x="52" y="498" width="856" height="192" rx="6" class="di-frame"/>
<text x="880" y="516" text-anchor="end" class="tag-di">DIAGRAM INTERCHANGE (DI) — positie</text>

<text x="66" y="536" class="code" fill="#FBF6E9">&lt;bpmndi:BPMNDiagram id="Diagram_1"&gt;</text>
<text x="66" y="556" class="code" fill="#FBF6E9">  &lt;bpmndi:BPMNPlane bpmnElement="Proces_Mutatie"&gt;</text>
<text x="66" y="576" class="code" fill="#FBF6E9">    &lt;bpmndi:BPMNShape bpmnElement="Start_1"&gt;</text>
<text x="66" y="596" class="code" fill="#FBF6E9">      &lt;dc:Bounds x="132" y="177" width="36" height="36"/&gt;</text>
<text x="66" y="616" class="code" fill="#FBF6E9">    &lt;/bpmndi:BPMNShape&gt;</text>
<text x="66" y="636" class="code" fill="#FBF6E9">    &lt;bpmndi:BPMNShape bpmnElement="Task_1"&gt;</text>
<text x="66" y="656" class="code" fill="#FBF6E9">      &lt;dc:Bounds x="230" y="165" width="150" height="60"/&gt;</text>
<text x="66" y="676" class="code" fill="#FBF6E9">    &lt;/bpmndi:BPMNShape&gt;</text>

<text x="480" y="730" text-anchor="middle" class="sub" font-style="italic">"Het model importeren" garandeert dus niet dat het diagram er ook hetzelfde uitziet — zie figuur 9.2.</text>
</svg>
