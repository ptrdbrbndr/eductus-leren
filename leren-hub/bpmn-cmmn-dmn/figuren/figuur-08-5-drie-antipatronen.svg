<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 820" font-family="'DM Sans', Arial, sans-serif" width="1040" height="820" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .row { fill:#FFFFFF; stroke:#E3E0D8; stroke-width:1.5; }
      .voorlabel { font-size:11px; font-weight:700; fill:#55606F; letter-spacing:.08em; }
      .nalabel { font-size:11px; font-weight:700; fill:#2563A8; letter-spacing:.08em; }
      .task { fill:#CFE0F2; stroke:#14213D; stroke-width:1.3; }
      .gateway { fill:#EEF2F7; stroke:#14213D; stroke-width:1.4; }
      .decision { fill:#EEF2F7; stroke:#2563A8; stroke-width:1.6; }
      .disc-item { fill:none; stroke:#14213D; stroke-width:1.2; stroke-dasharray:4 3; }
      .stage { fill:#FBF6E9; stroke:#14213D; stroke-width:1.4; }
      .sentry { fill:#FBFAF7; stroke:#14213D; stroke-width:1.3; }
      .evt-start { fill:#FBFAF7; stroke:#14213D; stroke-width:1.5; }
      .evt-end { fill:#FBFAF7; stroke:#14213D; stroke-width:2.6; }
      .seq { stroke:#14213D; stroke-width:1.4; fill:none; marker-end:url(#seqarr); }
      .seq-bad { stroke:#14213D; stroke-width:1.3; fill:none; marker-end:url(#seqarr); }
      .task-label { font-size:9.5px; fill:#14213D; }
      .gwlabel { font-size:8px; fill:#14213D; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .sub { font-size:11px; fill:#55606F; }
      .herken { font-size:10.5px; fill:#14213D; font-weight:600; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .flag { fill:none; stroke:#E9A13B; stroke-width:2.2; }
      .flagbg { fill:#FBF6E9; stroke:#E3E0D8; stroke-width:1; }
    </style>
    <marker id="seqarr" markerWidth="8" markerHeight="8" refX="5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="#14213D"/></marker>
</defs>
<rect width="1040" height="820" class="paper"/>
<text x="40" y="30" class="kicker">DEEL 08 · ANTIPATRONEN</text>
<text x="40" y="58" class="title">Figuur 8.5 — Drie antipatronen: voor en na</text>

<!-- ROW 1: beslislogica in gateways -->
<rect x="20" y="80" width="1000" height="220" class="row" rx="4"/>
<text x="40" y="106" class="label">Antipatroon 1 — Beslislogica in gateways</text>

<text x="60" y="132" class="voorlabel">VOOR</text>
<rect x="60" y="145" width="70" height="34" rx="8" class="task"/>
<text x="95" y="166" text-anchor="middle" class="task-label">Aanvraag</text>
<line x1="130" y1="162" x2="150" y2="162" class="seq"/>
<polygon points="150,140 190,162 150,184 110,162" class="gateway" transform="translate(20,0)"/>
<text x="190" y="166" text-anchor="middle" class="gwlabel" style="font-size:8px">leeftijd ≥ 68?</text>
<line x1="210" y1="162" x2="230" y2="140" class="seq"/>
<polygon points="270,120 310,140 270,160 230,140" class="gateway"/>
<text x="270" y="144" text-anchor="middle" class="gwlabel" style="font-size:7.5px">inkomen &gt; grens?</text>
<line x1="210" y1="162" x2="230" y2="185" class="seq"/>
<polygon points="270,165 310,185 270,205 230,185" class="gateway"/>
<text x="270" y="189" text-anchor="middle" class="gwlabel" style="font-size:7.5px">partner ja/nee?</text>
<line x1="310" y1="140" x2="340" y2="150" class="seq"/>
<line x1="310" y1="185" x2="340" y2="175" class="seq"/>
<polygon points="360,150 395,163 360,176 325,163" class="gateway"/>
<text x="360" y="167" text-anchor="middle" class="gwlabel" style="font-size:7">dienstjaren?</text>
<rect x="410" y="145" width="80" height="34" rx="8" class="task"/>
<text x="450" y="166" text-anchor="middle" class="task-label">Toekennen</text>
<line x1="395" y1="163" x2="410" y2="162" class="seq"/>
<circle cx="105" cy="255" r="34" class="flag" fill="none"/>
<text x="105" y="240" class="herken" text-anchor="middle" style="font-size:9px">herkenning:</text>
<text x="105" y="253" class="herken" text-anchor="middle" style="font-size:9px">keten van</text>
<text x="105" y="266" class="herken" text-anchor="middle" style="font-size:9px">4 gateways</text>

<line x1="530" y1="190" x2="600" y2="190" stroke="#55606F" stroke-width="1.5" marker-end="url(#seqarr)"/>
<text x="565" y="180" text-anchor="middle" class="sub" style="font-size:9px">ontkoppelen</text>

<text x="640" y="132" class="nalabel">NA</text>
<polygon points="660,150 690,162 660,174 630,162" class="gateway"/>
<text x="660" y="166" text-anchor="middle" class="gwlabel" style="font-size:7.5px">route?</text>
<rect x="720" y="145" width="90" height="34" rx="8" class="decision"/>
<text x="765" y="163" text-anchor="middle" class="task-label" style="font-weight:700">Toekennings-</text>
<text x="765" y="174" text-anchor="middle" class="task-label" style="font-weight:700">regels (DMN)</text>
<line x1="690" y1="162" x2="720" y2="162" class="seq"/>
<rect x="850" y="145" width="90" height="34" rx="8" class="task"/>
<text x="895" y="166" text-anchor="middle" class="task-label">Toekennen</text>
<line x1="810" y1="162" x2="850" y2="162" class="seq"/>

<text x="640" y="235" class="sub">Eén gateway voor de route; de</text>
<text x="640" y="251" class="sub">inhoudelijke beoordeling zit in een</text>
<text x="640" y="267" class="sub">losgekoppelde DMN-decision.</text>

<text x="40" y="292" class="herken" style="font-size:10.5px">Herkenningspunt: gateway met handelingslabel, of een reeks gateways die samen meer dan 3-4 condities combineert.</text>

<!-- ROW 2: spaghettidiagrammen -->
<rect x="20" y="320" width="1000" height="220" class="row" rx="4"/>
<text x="40" y="346" class="label">Antipatroon 2 — Spaghettidiagrammen</text>

<text x="60" y="372" class="voorlabel">VOOR</text>
<circle cx="70" cy="440" r="12" class="evt-start"/>
<rect x="120" y="460" width="70" height="30" rx="7" class="task"/>
<text x="155" y="479" text-anchor="middle" class="task-label" style="font-size:9px">Taak C</text>
<rect x="230" y="400" width="70" height="30" rx="7" class="task"/>
<text x="265" y="419" text-anchor="middle" class="task-label" style="font-size:9px">Taak A</text>
<rect x="230" y="480" width="70" height="30" rx="7" class="task"/>
<text x="265" y="499" text-anchor="middle" class="task-label" style="font-size:9px">Taak D</text>
<rect x="340" y="430" width="70" height="30" rx="7" class="task"/>
<text x="375" y="449" text-anchor="middle" class="task-label" style="font-size:9px">Taak B</text>
<circle cx="450" cy="405" r="13" class="evt-end"/>
<path d="M82,440 C110,470 100,475 120,477" class="seq-bad"/>
<path d="M190,475 C210,440 210,420 230,417" class="seq-bad"/>
<path d="M300,415 C320,460 320,470 340,455" class="seq-bad"/>
<path d="M300,495 C320,470 330,450 350,447" class="seq-bad"/>
<path d="M410,443 C430,430 435,415 440,408" class="seq-bad"/>
<path d="M300,420 C330,400 340,395 348,432" class="seq-bad"/>

<circle cx="220" cy="450" r="40" class="flag" fill="none"/>
<text x="220" y="530" text-anchor="middle" class="herken" style="font-size:9px">flows kruisen elkaar overal</text>

<line x1="530" y1="450" x2="600" y2="450" stroke="#55606F" stroke-width="1.5" marker-end="url(#seqarr)"/>
<text x="565" y="440" text-anchor="middle" class="sub" style="font-size:9px">herordenen</text>

<text x="640" y="372" class="nalabel">NA</text>
<circle cx="655" cy="450" r="12" class="evt-start"/>
<rect x="690" y="435" width="70" height="30" rx="7" class="task"/>
<text x="725" y="454" text-anchor="middle" class="task-label" style="font-size:9px">Taak A</text>
<line x1="667" y1="450" x2="690" y2="450" class="seq"/>
<rect x="790" y="435" width="70" height="30" rx="7" class="task"/>
<text x="825" y="454" text-anchor="middle" class="task-label" style="font-size:9px">Taak B</text>
<line x1="760" y1="450" x2="790" y2="450" class="seq"/>
<rect x="890" y="435" width="70" height="30" rx="7" class="task"/>
<text x="925" y="454" text-anchor="middle" class="task-label" style="font-size:9px">Taak C</text>
<line x1="860" y1="450" x2="890" y2="450" class="seq"/>
<circle cx="985" cy="450" r="13" class="evt-end"/>
<line x1="960" y1="450" x2="972" y2="450" class="seq"/>
<text x="640" y="500" class="sub">Links naar rechts, boven naar</text>
<text x="640" y="516" class="sub">beneden, happy path direct zichtbaar.</text>

<text x="40" y="532" class="herken" style="font-size:10.5px">Herkenningspunt: sequence flows kruisen overal, elementen niet logisch geordend, happy path valt niet als eerste op.</text>

<!-- ROW 3: CMMN als slordige BPMN -->
<rect x="20" y="560" width="1000" height="230" class="row" rx="4"/>
<text x="40" y="586" class="label">Antipatroon 3 — CMMN gebruiken als slordige BPMN</text>

<text x="60" y="612" class="voorlabel">VOOR</text>
<path d="M60,630 h150 l12,12 h130 v110 h-292 z" class="stage"/>
<rect x="80" y="660" width="110" height="28" rx="6" class="task"/>
<text x="135" y="678" text-anchor="middle" class="task-label" style="font-size:8.5px">Stap 1 (strikt)</text>
<polygon points="196,674 204,668 212,674 204,680" class="sentry"/>
<rect x="220" y="660" width="110" height="28" rx="6" class="task"/>
<text x="275" y="678" text-anchor="middle" class="task-label" style="font-size:8.5px">Stap 2 (strikt)</text>
<line x1="190" y1="674" x2="220" y2="674" class="seq"/>
<text x="80" y="712" class="sub" style="font-size:9px">geen discretionary items —</text>
<text x="80" y="726" class="sub" style="font-size:9px">elke sentry hangt af van de vorige</text>

<circle cx="204" cy="674" r="34" class="flag" fill="none"/>

<line x1="530" y1="690" x2="600" y2="690" stroke="#55606F" stroke-width="1.5" marker-end="url(#seqarr)"/>
<text x="565" y="680" text-anchor="middle" class="sub" style="font-size:9px">erkennen als BPMN</text>

<text x="640" y="612" class="nalabel">NA</text>
<circle cx="655" cy="690" r="11" class="evt-start"/>
<rect x="685" y="674" width="90" height="32" rx="8" class="task"/>
<text x="730" y="694" text-anchor="middle" class="task-label" style="font-size:9px">Stap 1</text>
<line x1="666" y1="690" x2="685" y2="690" class="seq"/>
<rect x="800" y="674" width="90" height="32" rx="8" class="task"/>
<text x="845" y="694" text-anchor="middle" class="task-label" style="font-size:9px">Stap 2</text>
<line x1="775" y1="690" x2="800" y2="690" class="seq"/>
<circle cx="930" cy="690" r="12" class="evt-end"/>
<line x1="890" y1="690" x2="917" y2="690" class="seq"/>
<text x="640" y="735" class="sub">Vast pad zonder discretie → dit</text>
<text x="640" y="751" class="sub">was altijd al gewoon BPMN.</text>

<text x="40" y="770" class="herken" style="font-size:10.5px">Herkenningspunt: casemodel zonder discretionary items, of sentries die elke stap strikt afhankelijk maken van de vorige.</text>

<text x="40" y="800" class="sub" style="font-style:italic">Onderliggende oorzaak van alle drie: onvoldoende toepassing van de keuzeboom (§8.1), of blijven hangen bij de eerste taalkeuze.</text>

</svg>
