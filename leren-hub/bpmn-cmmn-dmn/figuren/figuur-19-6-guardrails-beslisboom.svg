<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 640" font-family="'DM Sans', Arial, sans-serif" width="1080" height="640" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    .q { fill:#EEF2F7; stroke:#14213D; stroke-width:1.5; }
    .q-lbl { font-size:11.5px; fill:#14213D; font-weight:700; }
    .outcome-guard { fill:#FBF6E9; stroke:#E9A13B; stroke-width:2; }
    .outcome-release { fill:#CFE0F2; stroke:#2563A8; stroke-width:2; }
    .out-lbl { font-size:11px; fill:#14213D; font-weight:700; }
    .out-sub { font-size:9.6px; fill:#55606F; }
    .edge { stroke:#55606F; stroke-width:1.4; fill:none; marker-end:url(#arr5); }
    .edgelbl { font-size:10px; fill:#55606F; font-style:italic; }
  </style>
  <marker id="arr5" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#55606F"/></marker>
</defs>
<rect width="1080" height="640" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 19 · FIGUUR 19.6 · BESLISBOOM</text>
<text x="40" y="64" class="title">Guardrails: welke wijziging vergt welk proces</text>

<!-- root -->
<rect x="440" y="96" width="200" height="56" rx="8" class="q"/>
<text x="540" y="118" text-anchor="middle" class="q-lbl">Wat verandert er?</text>
<text x="540" y="136" text-anchor="middle" class="out-sub">(§19.7, aansluitend op §16.4)</text>

<!-- branch left: regelwijziging -->
<path d="M480,152 L260,210" class="edge"/>
<text x="330" y="180" class="edgelbl">een regel/waarde binnen een</text>
<text x="330" y="192" class="edgelbl">reeds gedeployde beslisservice</text>

<rect x="120" y="210" width="280" height="56" rx="8" class="q"/>
<text x="260" y="232" text-anchor="middle" class="q-lbl">Voldoende impact voor</text>
<text x="260" y="248" text-anchor="middle" class="q-lbl">een shadow run (§16.6)?</text>

<path d="M200,266 L140,330" class="edge"/>
<text x="130" y="300" class="edgelbl">nee</text>
<rect x="20" y="330" width="240" height="86" rx="8" class="outcome-guard"/>
<text x="140" y="354" text-anchor="middle" class="out-lbl">Geautomatiseerde toetsing</text>
<text x="140" y="370" text-anchor="middle" class="out-lbl">vóór livegang</text>
<text x="140" y="388" text-anchor="middle" class="out-sub">Zelfbediening vakafdeling —</text>
<text x="140" y="401" text-anchor="middle" class="out-sub">geen ontwikkelaar nodig</text>

<path d="M320,266 L380,330" class="edge"/>
<text x="345" y="300" class="edgelbl">ja</text>
<rect x="280" y="330" width="240" height="86" rx="8" class="outcome-guard"/>
<text x="400" y="350" text-anchor="middle" class="out-lbl">Geautomatiseerde toetsing +</text>
<text x="400" y="366" text-anchor="middle" class="out-lbl">verplichte shadow run</text>
<text x="400" y="384" text-anchor="middle" class="out-sub">Zelfbediening vakafdeling, met</text>
<text x="400" y="397" text-anchor="middle" class="out-sub">bewijs vooraf — geen ontwikkelaar</text>

<!-- branch right: structuurwijziging -->
<path d="M600,152 L820,210" class="edge"/>
<text x="700" y="180" class="edgelbl">een structuur: nieuwe activiteit,</text>
<text x="700" y="192" class="edgelbl">nieuw koppelpunt, proces/casemodel</text>

<rect x="700" y="210" width="280" height="56" rx="8" class="q"/>
<text x="840" y="232" text-anchor="middle" class="q-lbl">Verandert de structuur van het</text>
<text x="840" y="248" text-anchor="middle" class="q-lbl">proces-, DRD- of casemodel zelf?</text>

<path d="M840,266 L840,330" class="edge"/>
<text x="852" y="300" class="edgelbl">altijd</text>
<rect x="700" y="330" width="280" height="86" rx="8" class="outcome-release"/>
<text x="840" y="354" text-anchor="middle" class="out-lbl">Volledig releaseproces</text>
<text x="840" y="372" text-anchor="middle" class="out-sub">Ontwikkelaar, review, gecoördineerde</text>
<text x="840" y="386" text-anchor="middle" class="out-sub">deployment — ongeacht wie de wijziging</text>
<text x="840" y="400" text-anchor="middle" class="out-sub">inhoudelijk heeft bedacht</text>

<rect x="20" y="452" width="1000" height="150" rx="10" fill="#FFFFFF" stroke="#E3E0D8"/>
<text x="40" y="478" class="q-lbl">De grens ligt bij het onderscheid, niet bij het geval</text>
<text x="40" y="500" font-size="11" fill="#14213D">Deze grens wordt vooraf, expliciet vastgelegd — als architectuurbeslissing — en niet per wijziging opnieuw</text>
<text x="40" y="518" font-size="11" fill="#14213D">bediscussieerd. Een enkele regel in een gedeployde beslisservice mag de vakafdeling zelf wijzigen, met</text>
<text x="40" y="536" font-size="11" fill="#14213D">de juiste toetsing ervoor. Zodra de wijziging de structuur raakt — een nieuwe activiteit, een nieuw</text>
<text x="40" y="554" font-size="11" fill="#14213D">koppelpunt — is er geen kortere weg, ook niet als de vakafdeling het "maar een kleine aanpassing" vindt.</text>
<text x="40" y="580" font-size="11" fill="#55606F" font-style="italic">Amber = zelfbediening met guardrails · Blauw = volledig releaseproces</text>
</svg>
