<text x="600" y="439" text-anchor="middle" class="role-label">Modelleur</text>
<text x="600" y="453" text-anchor="middle" class="role-sub">maakt/wijzigt volgens richtlijn</text>
<line x1="600" y1="470" x2="600" y2="497" class="arrow-thin"/>
</g>

