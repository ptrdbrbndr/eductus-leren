</g>

<!-- Business engineer band -->
<rect x="40" y="499" width="1120" height="52" rx="4" class="band-engineer"/>
<text x="60" y="521" class="band-label">BUSINESS ENGINEER</text>
<text x="60" y="539" class="band-sub">bouwt en onderhoudt uitvoerbare modellen; brug tussen analyse en techniek (deel 19)</text>

<!-- Callout: het gat -->
<rect x="40" y="575" width="1120" height="100" rx="5" class="callout"/>
<text x="60" y="598" class="callout-title">Het probleem van de niet-bestaande proceseigenaar (§21.1)</text>
<text x="60" y="618" class="callout-text">Wie is eigenaar van het hybride referentiemodel dat door alle vijf afdelingen wordt gebruikt? Een operating</text>
<text x="60" y="636" class="callout-text">model dat deze vraag niet expliciet beantwoordt, laat een gat waar juist de belangrijkste, meest gedeelde</text>
<text x="60" y="654" class="callout-text">modellen doorheen vallen — zichtbaar hierboven als de gestippelde amberlijnen zonder duidelijk besluitrecht.</text>

<!-- legend -->
<line x1="850" y1="672" x2="880" y2="672" class="arrow"/>
<text x="886" y="676" class="legend-text">besluitrecht/aansturing</text>
<line x1="1020" y1="672" x2="1050" y2="672" class="gap-line"/>
<text x="1056" y="676" class="legend-text">onduidelijk (het gat)</text>
</svg>
