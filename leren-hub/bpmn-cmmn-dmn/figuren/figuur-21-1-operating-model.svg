<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="'DM Sans', Arial, sans-serif" width="1200" height="700" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .band-architect { fill:#14213D; }
    .band-engineer { fill:#2563A8; }
    .band-label { font-size:13px; font-weight:700; fill:#FBFAF7; letter-spacing:.06em; }
    .band-sub { font-size:11.5px; fill:#CFE0F2; }
    .hybride { fill:#FBF6E9; stroke:#E9A13B; stroke-width:2; }
    .hybride-label { font-size:13px; font-weight:700; fill:#14213D; }
    .hybride-sub { font-size:11px; fill:#55606F; }
    .hybride-gap { font-size:12px; font-weight:700; fill:#B9791F; }
    .role-decide { fill:#FBF6E9; stroke:#E9A13B; stroke-width:1.8; }
    .role-coord { fill:#CFE0F2; stroke:#14213D; stroke-width:1.3; }
    .role-exec { fill:#FFFFFF; stroke:#14213D; stroke-width:1.1; }
    .role-label { font-size:11.5px; font-weight:700; fill:#14213D; }
    .role-sub { font-size:9.5px; fill:#55606F; }
    .col-header { font-size:11px; font-weight:700; fill:#14213D; }
    .arrow { stroke:#14213D; stroke-width:1.5; fill:none; marker-end:url(#arr); }
    .arrow-thin { stroke:#55606F; stroke-width:1.2; fill:none; marker-end:url(#arrgrey); }
    .gap-line { stroke:#E9A13B; stroke-width:1.4; stroke-dasharray:4 3; fill:none; marker-end:url(#arramber); }
    .callout { fill:#FBF6E9; stroke:#E9A13B; stroke-width:1.4; }
    .callout-text { font-size:12px; fill:#14213D; }
    .callout-title { font-size:12.5px; font-weight:700; fill:#B9791F; }
    .label { font-size:14px; font-weight:700; fill:#14213D; }
    .sub { font-size:12px; fill:#55606F; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:23px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    .legend-text { font-size:10.5px; fill:#55606F; }
  </style>
  <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#14213D"/></marker>
  <marker id="arrgrey" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
  <marker id="arramber" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
</defs>
<rect width="1200" height="700" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 21 · CONCEPTDIAGRAM</text>
<text x="40" y="62" class="title">Figuur 21.1 — Operating model met rollen en besluitrechten, Programma Mutatieplatform</text>

<!-- Architect band -->
<rect x="40" y="90" width="1120" height="52" rx="4" class="band-architect"/>
<text x="60" y="112" class="band-label">ARCHITECT</text>
<text x="60" y="130" class="band-sub">bewaakt samenhang over processen heen; besluit over structurele wijzigingen die meerdere afdelingen raken (deel 11, deel 18)</text>

<line x1="600" y1="142" x2="600" y2="164" class="arrow"/>

<!-- Hybride referentiemodel -->
<rect x="370" y="166" width="460" height="64" rx="5" class="hybride"/>
<path d="M394,192 l8,-14 l8,14 z" fill="none" stroke="#E9A13B" stroke-width="1.6"/>
<text x="402" y="190" text-anchor="middle" font-size="10" font-weight="700" fill="#E9A13B">!</text>
<text x="440" y="186" class="hybride-label">Hybride referentiemodel (deel 18)</text>
<text x="440" y="203" class="hybride-sub">gebruikt door alle vijf afdelingen —</text>
<text x="440" y="219" class="hybride-gap">eigenaar: ?  (het gat uit §21.1)</text>

<!-- dashed connectors from hybride box to each column -->
<path d="M420,230 C420,250 108,250 118,278" class="gap-line"/>
<path d="M500,230 C500,248 348,248 358,278" class="gap-line"/>
<path d="M600,230 L600,278" class="gap-line"/>
<path d="M700,230 C700,248 848,248 838,278" class="gap-line"/>
<path d="M780,230 C780,250 1088,250 1078,278" class="gap-line"/>

<!-- Five afdelingscolumns -->
<!-- col 1: Deelnemermutaties x=40 -->
<g>
<text x="140" y="262" text-anchor="middle" class="col-header">DEELNEMER-</text>
<text x="140" y="275" text-anchor="middle" class="col-header">MUTATIES</text>
<rect x="40" y="280" width="200" height="50" rx="4" class="role-decide"/>
<text x="140" y="299" text-anchor="middle" class="role-label">Proceseigenaar</text>
<text x="140" y="313" text-anchor="middle" class="role-sub">besluit inhoudelijke wijziging</text>
<line x1="140" y1="330" x2="140" y2="348" class="arrow"/>
<rect x="40" y="350" width="200" height="50" rx="4" class="role-coord"/>
<text x="140" y="369" text-anchor="middle" class="role-label">Procesbeheerder</text>
<text x="140" y="383" text-anchor="middle" class="role-sub">houdt actueel, coördineert review</text>
<line x1="140" y1="400" x2="140" y2="418" class="arrow"/>
<rect x="40" y="420" width="200" height="50" rx="4" class="role-exec"/>
<text x="140" y="439" text-anchor="middle" class="role-label">Modelleur</text>
<text x="140" y="453" text-anchor="middle" class="role-sub">maakt/wijzigt volgens richtlijn</text>
<line x1="140" y1="470" x2="140" y2="497" class="arrow-thin"/>
</g>

