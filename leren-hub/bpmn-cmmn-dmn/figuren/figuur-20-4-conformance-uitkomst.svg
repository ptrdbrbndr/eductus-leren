<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="'DM Sans', Arial, sans-serif" width="1200" height="700" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    .panel-h { font-size:13px; font-weight:700; fill:#14213D; letter-spacing:.05em; }
    .sub { font-size:10.5px; fill:#55606F; }
    .lbl-sm { font-size:10.8px; fill:#14213D; }
    .icon-line { stroke:#14213D; stroke-width:1.3; fill:none; }
    .thin { stroke:#14213D; stroke-width:1.5; fill:#FFFFFF; }
    .thick { stroke:#14213D; stroke-width:3.2; fill:#FFFFFF; }
    .task { stroke:#14213D; stroke-width:1.5; fill:#FFFFFF; }
    .gw { stroke:#14213D; stroke-width:1.5; fill:#FFFFFF; }
    .flow { stroke:#14213D; stroke-width:1.6; fill:none; marker-end:url(#arr7); }
    .flow-amber { stroke:#E9A13B; stroke-width:1.6; stroke-dasharray:5 3; fill:none; marker-end:url(#arr7a); }
    .missing { stroke:#E9A13B; stroke-width:2; stroke-dasharray:4 3; fill:#FBF6E9; }
    .pill { fill:#CFE0F2; stroke:#2563A8; stroke-width:1.4; }
    .pill-amber { fill:#FBF6E9; stroke:#E9A13B; stroke-width:1.8; stroke-dasharray:4 3; }
    .pill-missing { fill:#FBFAF7; stroke:#E9A13B; stroke-width:1.8; stroke-dasharray:3 3; }
    .pill-txt { font-size:9.6px; fill:#14213D; }
    .varlbl { font-size:10.5px; fill:#14213D; font-weight:700; }
    .parrow { stroke:#55606F; stroke-width:1.3; fill:none; marker-end:url(#arr7s); }
    .divider { stroke:#14213D; stroke-width:1; stroke-dasharray:5 4; opacity:.5; }
  </style>
  <marker id="arr7" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#14213D"/></marker>
  <marker id="arr7a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#E9A13B"/></marker>
  <marker id="arr7s" markerWidth="8" markerHeight="8" refX="6" refY="2.5" orient="auto"><path d="M0,0 L6,2.5 L0,5 Z" fill="#55606F"/></marker>
</defs>
<rect width="1200" height="700" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 20 · FIGUUR 20.4 · CONFORMANCE-UITKOMST</text>
<text x="40" y="64" class="title">Model naast de werkelijke paden — fitness, ontbrekende en toegevoegde stappen</text>

<line x1="580" y1="86" x2="580" y2="560" class="divider"/>

<!-- ===== LEFT: model (BPMN-correct) ===== -->
<g transform="translate(40,0)">
  <text x="0" y="100" class="panel-h">TO-BE MODEL</text>
  <text x="0" y="118" class="sub">wat het model verwacht (deel 12)</text>

  <circle cx="40" cy="220" r="16" class="thin"/>
  <g transform="translate(40,220)">
    <rect x="-7" y="-5" width="14" height="10" fill="none" stroke="#14213D" stroke-width="1.1"/>
    <path d="M-7,-5 L0,1 L7,-5" fill="none" stroke="#14213D" stroke-width="1.1"/>
  </g>
  <text x="40" y="258" text-anchor="middle" class="sub">Aanvraag</text>
  <text x="40" y="270" text-anchor="middle" class="sub">ontvangen</text>
  <path d="M56,220 L96,220" class="flow"/>

  <!-- Task B: marked missing -->
  <rect x="96" y="188" width="150" height="64" rx="10" class="missing"/>
  <g transform="translate(104,196)">
    <circle cx="0" cy="-3" r="3.4" class="icon-line"/>
    <path d="M-5.5,7 Q0,-2.5 5.5,7 Z" class="icon-line"/>
  </g>
  <text x="171" y="222" text-anchor="middle" class="lbl-sm">Volledigheid</text>
  <text x="171" y="236" text-anchor="middle" class="lbl-sm">controleren</text>
  <path d="M246,220 L288,220" class="flow"/>
  <text x="171" y="272" text-anchor="middle" font-size="9.5" fill="#7A5A16">ontbrekend in 13% van de cases</text>

  <!-- Gateway -->
  <path d="M318,192 L346,220 L318,248 L290,220 Z" class="gw"/>
  <path d="M310,212 L326,228 M326,212 L310,228" stroke="#14213D" stroke-width="1.4"/>
  <text x="330" y="212" class="sub" font-style="italic">compleet</text>
  <path d="M346,220 L388,220" class="flow"/>

  <!-- Task C -->
  <rect x="388" y="188" width="150" height="64" rx="10" class="task"/>
  <g transform="translate(396,196)">
    <circle cx="0" cy="-3" r="3.4" class="icon-line"/>
    <path d="M-5.5,7 Q0,-2.5 5.5,7 Z" class="icon-line"/>
  </g>
  <text x="463" y="222" text-anchor="middle" class="lbl-sm">Aanvraag</text>
  <text x="463" y="236" text-anchor="middle" class="lbl-sm">beoordelen</text>

  <path d="M463,252 L463,320 L 220,320" class="flow" fill="none"/>
  <circle cx="463" cy="252" r="0" opacity="0"/>

  <!-- end -->
  <path d="M538,220 L 538,220" opacity="0"/>
  <circle cx="540" cy="320" r="18" class="thick"/>
  <path d="M463,252 L463,320 L522,320" class="flow"/>
  <text x="540" y="358" text-anchor="middle" class="sub">Verwerkt</text>

  <!-- amber: toegevoegde stap not in model -->
  <rect x="60" y="330" width="200" height="66" rx="8" class="pill-amber"/>
  <text x="160" y="352" text-anchor="middle" font-size="10.2" fill="#7A5A16" font-weight="700">"Telefonisch contact"</text>
  <text x="160" y="368" text-anchor="middle" font-size="9.6" fill="#7A5A16">komt voor in 19% van de log-</text>
  <text x="160" y="382" text-anchor="middle" font-size="9.6" fill="#7A5A16">cases, staat niet in dit model</text>
  <path d="M40,236 Q40,340 60,360" class="flow-amber"/>

  <rect x="0" y="430" width="540" height="150" rx="10" fill="#FFFFFF" stroke="#CFE0F2"/>
  <text x="18" y="456" class="lbl-sm" font-weight="700">Conformance-samenvatting</text>
  <text x="18" y="480" class="sub">Fitness</text>
  <rect x="80" y="470" width="200" height="14" rx="7" fill="#EEF2F7"/>
  <rect x="80" y="470" width="168" height="14" rx="7" fill="#2563A8"/>
  <text x="290" y="482" class="lbl-sm" font-weight="700">0,84</text>
  <text x="18" y="506" class="sub">Ontbrekende stap</text>
  <text x="130" y="506" class="lbl-sm">Volledigheid controleren (13% van de cases)</text>
  <text x="18" y="528" class="sub">Toegevoegde stap</text>
  <text x="130" y="528" class="lbl-sm">Telefonisch contact (19%, niet in het model)</text>
  <text x="18" y="550" class="sub">Afwijkende volgorde</text>
  <text x="130" y="550" class="lbl-sm">niet waargenomen in deze steekproef</text>
</g>

<!-- ===== RIGHT: werkelijke paden ===== -->
<g transform="translate(620,0)">
  <text x="0" y="100" class="panel-h">WERKELIJKE PADEN (UIT DE LOG)</text>
  <text x="0" y="118" class="sub">drie varianten, geclusterd naar frequentie (§20.4)</text>

  <!-- variant 1 -->
  <text x="0" y="155" class="varlbl">Variant 1 — 68% van de cases</text>
  <g transform="translate(0,166)">
    <rect x="0" y="0" width="110" height="34" rx="17" class="pill"/><text x="55" y="21" text-anchor="middle" class="pill-txt">Aanvraag ontvangen</text>
    <path d="M110,17 L140,17" class="parrow"/>
    <rect x="140" y="0" width="120" height="34" rx="17" class="pill"/><text x="200" y="21" text-anchor="middle" class="pill-txt">Volledigheid ctrl.</text>
    <path d="M260,17 L290,17" class="parrow"/>
    <rect x="290" y="0" width="120" height="34" rx="17" class="pill"/><text x="350" y="21" text-anchor="middle" class="pill-txt">Aanvraag beoord.</text>
    <path d="M410,17 L440,17" class="parrow"/>
    <rect x="440" y="0" width="90" height="34" rx="17" class="pill"/><text x="485" y="21" text-anchor="middle" class="pill-txt">Verwerkt</text>
  </g>
  <text x="0" y="222" class="sub">Volgt het model exact — geen afwijking.</text>

  <!-- variant 2 -->
  <text x="0" y="264" class="varlbl">Variant 2 — 19% van de cases</text>
  <g transform="translate(0,275)">
    <rect x="0" y="0" width="110" height="34" rx="17" class="pill"/><text x="55" y="21" text-anchor="middle" class="pill-txt">Aanvraag ontvangen</text>
    <path d="M110,17 L140,17" class="parrow"/>
    <rect x="140" y="0" width="120" height="34" rx="17" class="pill-amber"/><text x="200" y="21" text-anchor="middle" class="pill-txt" fill="#7A5A16">Telefonisch contact</text>
    <path d="M260,17 L290,17" class="parrow"/>
    <rect x="290" y="0" width="120" height="34" rx="17" class="pill"/><text x="350" y="21" text-anchor="middle" class="pill-txt">Volledigheid ctrl.</text>
    <path d="M410,17 L440,17" class="parrow"/>
    <rect x="440" y="0" width="120" height="34" rx="17" class="pill"/><text x="500" y="21" text-anchor="middle" class="pill-txt">Aanvraag beoord.</text>
  </g>
  <g transform="translate(0,275)">
    <path d="M560,17 L590,17" class="parrow"/>
    <rect x="590" y="0" width="90" height="34" rx="17" class="pill"/><text x="635" y="21" text-anchor="middle" class="pill-txt">Verwerkt</text>
  </g>
  <text x="0" y="331" class="sub">Extra stap die niet in het model voorkomt — toegevoegd.</text>

  <!-- variant 3 -->
  <text x="0" y="373" class="varlbl">Variant 3 — 13% van de cases</text>
  <g transform="translate(0,384)">
    <rect x="0" y="0" width="110" height="34" rx="17" class="pill"/><text x="55" y="21" text-anchor="middle" class="pill-txt">Aanvraag ontvangen</text>
    <path d="M110,17 L140,17" class="parrow"/>
    <rect x="140" y="0" width="120" height="34" rx="17" class="pill-missing"/><text x="200" y="21" text-anchor="middle" class="pill-txt" fill="#7A5A16">( overgeslagen )</text>
    <path d="M260,17 L290,17" class="parrow"/>
    <rect x="290" y="0" width="120" height="34" rx="17" class="pill"/><text x="350" y="21" text-anchor="middle" class="pill-txt">Aanvraag beoord.</text>
    <path d="M410,17 L440,17" class="parrow"/>
    <rect x="440" y="0" width="90" height="34" rx="17" class="pill"/><text x="485" y="21" text-anchor="middle" class="pill-txt">Verwerkt</text>
  </g>
  <text x="0" y="440" class="sub">"Volledigheid controleren" komt hier niet voor — ontbrekend.</text>

  <rect x="0" y="470" width="540" height="110" rx="10" fill="#EEF2F7" stroke="#CFE0F2"/>
  <text x="18" y="494" class="lbl-sm" font-weight="700">Hoe je dit leest zonder erin te verdrinken (§20.4)</text>
  <text x="18" y="516" class="sub">Niet elke individuele afwijking apart bekijken, maar clusteren: een</text>
  <text x="18" y="534" class="sub">patroon dat in 19% of 13% van de cases voorkomt is de moeite van</text>
  <text x="18" y="552" class="sub">onderzoeken waard; een incident bij één case meestal niet.</text>
</g>
</svg>
