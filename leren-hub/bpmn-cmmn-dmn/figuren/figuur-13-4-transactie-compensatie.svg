<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 740" font-family="'DM Sans', Arial, sans-serif" width="1080" height="740" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .transbox { fill:#FFFFFF; stroke:#14213D; stroke-width:1.4; }
    .transbox-inner { fill:none; stroke:#14213D; stroke-width:1.4; }
    .tlabel { font-size:13px; font-weight:700; fill:#14213D; }
    .task { fill:#CFE0F2; stroke:#14213D; stroke-width:1.4; }
    .task-comp { fill:#FBF6E9; stroke:#E9A13B; stroke-width:1.6; }
    .task-label { font-size:10.5px; fill:#14213D; }
    .evt-start { fill:#FBFAF7; stroke:#14213D; stroke-width:1.6; }
    .evt-end { fill:#FBFAF7; stroke:#14213D; stroke-width:3; }
    .evt-cancel { fill:#F6DCD9; stroke:#B9433D; stroke-width:2.4; }
    .evt-bound { fill:#FBF6E9; stroke:#E9A13B; stroke-width:1.6; stroke-dasharray:3 2.5; }
    .seq { stroke:#14213D; stroke-width:1.6; fill:none; marker-end:url(#seqarr); }
    .assoc { stroke:#55606F; stroke-width:1.3; stroke-dasharray:3 3; fill:none; marker-end:url(#assocarr); }
    .label { font-size:14px; font-weight:700; fill:#14213D; }
    .sub { font-size:12px; fill:#55606F; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    .note { fill:#FBF6E9; stroke:#E9A13B; stroke-width:1.4; }
    .notetext { font-size:11px; fill:#14213D; }
  </style>
  <marker id="seqarr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#14213D"/></marker>
  <marker id="assocarr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#55606F" stroke-width="1.2"/></marker>
</defs>
<rect width="1080" height="740" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 13 · BPMN-PROCESNOTATIE</text>
<text x="40" y="64" class="title">Figuur 13.4 — Transactie met compensatiehandlers</text>
<text x="40" y="86" class="sub">Waardeoverdracht als transaction: alles-of-niets, met een compensatiehandler voor de reeds verstuurde brief.</text>

<!-- transaction subprocess: double border -->
<rect x="60" y="120" width="700" height="220" rx="10" class="transbox"/>
<rect x="66" y="126" width="688" height="208" rx="7" class="transbox-inner"/>
<text x="80" y="150" class="tlabel">Transaction — «Waardeoverdracht afhandelen»</text>

<circle cx="110" cy="230" r="14" class="evt-start"/>

<rect x="150" y="205" width="120" height="50" rx="10" class="task"/>
<text x="210" y="226" text-anchor="middle" class="task-label">Mutatie verwerken</text>
<text x="210" y="240" text-anchor="middle" class="task-label">in polisadministratie</text>

<rect x="320" y="205" width="130" height="50" rx="10" class="task"/>
<text x="385" y="226" text-anchor="middle" class="task-label">Bevestigingsbrief</text>
<text x="385" y="240" text-anchor="middle" class="task-label">versturen</text>
<!-- boundary compensation event on this task -->
<circle cx="450" cy="255" r="12" class="evt-bound"/>
<path d="M453,251 l-7,4 7,4 z M446,251 l-7,4 7,4 z" fill="#E9A13B" stroke="none"/>

<rect x="500" y="205" width="120" height="50" rx="10" class="task"/>
<text x="560" y="226" text-anchor="middle" class="task-label">Boeking</text>
<text x="560" y="240" text-anchor="middle" class="task-label">vastleggen</text>

<circle cx="695" cy="230" r="15" class="evt-end"/>

<line x1="124" y1="230" x2="150" y2="230" class="seq"/>
<line x1="270" y1="230" x2="320" y2="230" class="seq"/>
<line x1="450" y1="230" x2="500" y2="230" class="seq"/>
<line x1="620" y1="230" x2="680" y2="230" class="seq"/>

<!-- alternate: boeking fails -> cancel end event -->
<circle cx="560" cy="310" r="15" class="evt-cancel"/>
<path d="M552,302 l16,16 M568,302 l-16,16" stroke="#B9433D" stroke-width="2"/>
<path d="M560,255 C560,280 560,290 560,296" class="seq" stroke-dasharray="4 3"/>
<text x="590" y="300" class="task-label" style="fill:#B9433D">boeking mislukt</text>
<text x="590" y="313" class="task-label" style="fill:#B9433D">→ cancel end event</text>

<!-- boundary cancel event on transaction, catching the abort -->
<circle cx="760" cy="340" r="15" class="evt-bound" style="stroke:#B9433D"/>
<path d="M752,332 l16,16 M768,332 l-16,16" stroke="#B9433D" stroke-width="1.6"/>

<line x1="775" y1="345" x2="850" y2="345" class="seq"/>
<rect x="850" y="315" width="180" height="60" rx="10" class="task"/>
<text x="940" y="340" text-anchor="middle" class="task-label">Klant met correctie-</text>
<text x="940" y="354" text-anchor="middle" class="task-label">brief informeren</text>

<!-- compensation handler task, associated via dotted line from boundary comp event -->
<path d="M450,267 C450,420 385,440 385,460" class="assoc"/>
<rect x="280" y="460" width="210" height="70" rx="10" class="task-comp"/>
<text x="385" y="484" text-anchor="middle" class="task-label" style="font-weight:700">Corrigerende brief</text>
<text x="385" y="498" text-anchor="middle" class="task-label" style="font-weight:700">versturen</text>
<text x="385" y="514" text-anchor="middle" class="task-label" style="font-style:italic">(compensatiehandler)</text>
<path d="M330,522 l-8,4 8,4 z M320,522 l-8,4 8,4 z" fill="#E9A13B" stroke="none"/>

<rect x="560" y="450" width="440" height="130" rx="8" class="note"/>
<text x="580" y="474" class="notetext" style="font-weight:700">Waarom dit geen technische undo is:</text>
<text x="580" y="494" class="notetext">de brief is al bij de deelnemer bezorgd. Compenseren</text>
<text x="580" y="512" class="notetext">betekent niet "brief terugdraaien" (dat kan niet), maar</text>
<text x="580" y="530" class="notetext">een corrigerende brief versturen die het effect van de</text>
<text x="580" y="548" class="notetext">eerste brief zo goed mogelijk rechtzet — een expliciet</text>
<text x="580" y="566" class="notetext">ontworpen businesshandeling, geen automatisme (§13.5).</text>

<text x="80" y="365" class="sub" style="font-size:10.5px">stippellijn = association naar de compensatiehandler ·</text>
<text x="80" y="380" class="sub" style="font-size:10.5px">boundary event met omgekeerde-pijl-icoon = compensation</text>

</svg>
