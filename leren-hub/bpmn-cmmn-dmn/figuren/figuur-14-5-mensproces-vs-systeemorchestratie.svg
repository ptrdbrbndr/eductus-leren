<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 640" font-family="'DM Sans', Arial, sans-serif" width="1160" height="640" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .panel { fill:#FFFFFF; stroke:#E3E0D8; stroke-width:1.5; }
    .task { fill:#CFE0F2; stroke:#14213D; stroke-width:1.4; }
    .task-label { font-size:10.5px; fill:#14213D; }
    .evt-start { fill:#FBFAF7; stroke:#14213D; stroke-width:1.6; }
    .evt-end { fill:#FBFAF7; stroke:#14213D; stroke-width:2.8; }
    .evt-bound { fill:#F6DCD9; stroke:#B9433D; stroke-width:1.4; stroke-dasharray:2.5 2; }
    .seq { stroke:#14213D; stroke-width:1.5; fill:none; marker-end:url(#seqarr); }
    .label { font-size:14px; font-weight:700; fill:#14213D; }
    .sub { font-size:11.5px; fill:#55606F; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    .paneltitle { font-size:13px; font-weight:700; }
    .diffbox { fill:#FBF6E9; stroke:#E9A13B; stroke-width:1.4; }
    .diff { font-size:10px; fill:#8a6415; font-weight:700; }
  </style>
  <marker id="seqarr" markerWidth="8" markerHeight="8" refX="5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="#14213D"/></marker>
</defs>
<rect width="1160" height="640" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 14 · BPMN-PROCESNOTATIE, TWEE STIJLEN</text>
<text x="40" y="64" class="title">Figuur 14.5 — Adreswijziging verwerken: mensproces versus systeemorchestratie</text>

<!-- LEFT: mensproces -->
<rect x="30" y="90" width="530" height="480" class="panel" rx="4"/>
<text x="50" y="118" class="paneltitle" style="fill:#2563A8">MENSPROCES — Klachten &amp; Bezwaren-stijl</text>

<circle cx="80" cy="220" r="13" class="evt-start"/>
<rect x="130" y="190" width="220" height="60" rx="10" class="task"/>
<path d="M142,202 a8,8 0 1,1 0.1,0" fill="none" stroke="#14213D" stroke-width="1.3"/>
<path d="M136,222 a12,10 0 0 1 24,0" fill="none" stroke="#14213D" stroke-width="1.3"/>
<text x="245" y="215" text-anchor="middle" class="task-label" style="font-weight:700">Adreswijziging</text>
<text x="245" y="230" text-anchor="middle" class="task-label" style="font-weight:700">verwerken</text>
<text x="245" y="243" text-anchor="middle" class="task-label" style="font-size:9px">(user task)</text>
<circle cx="440" cy="220" r="14" class="evt-end"/>
<line x1="93" y1="220" x2="130" y2="220" class="seq"/>
<line x1="350" y1="220" x2="426" y2="220" class="seq"/>

<rect x="60" y="330" width="460" height="200" rx="6" class="diffbox"/>
<text x="80" y="356" class="diff">Kenmerken van de mensproces-stijl</text>
<text x="80" y="380" class="sub">Grovere granulariteit — "adreswijziging verwerken" omvat</text>
<text x="80" y="398" class="sub">meerdere kleinere handelingen (adres controleren, dossier</text>
<text x="80" y="416" class="sub">bijwerken, deelnemer informeren) die niet apart getoond</text>
<text x="80" y="434" class="sub">worden. Geen expliciet foutpad: een onduidelijk adres</text>
<text x="80" y="452" class="sub">lost de behandelaar zelf op, buiten het model om — een</text>
<text x="80" y="470" class="sub">mens kan improviseren waar een pad ontbreekt (§14.6).</text>
<text x="80" y="494" class="sub">Het model is geschreven om door een medewerker</text>
<text x="80" y="512" class="sub">gelezen te worden, niet als volledige specificatie.</text>

<!-- RIGHT: systeemorchestratie -->
<rect x="600" y="90" width="530" height="480" class="panel" rx="4"/>
<text x="620" y="118" class="paneltitle" style="fill:#B9433D">SYSTEEMORCHESTRATIE — Deelnemermutaties-stijl</text>

<circle cx="630" cy="180" r="11" class="evt-start"/>
<rect x="660" y="162" width="130" height="38" rx="9" class="task"/>
<path d="M672,172 l4,4 -4,4 4,4 4,-4 4,4 4,-4 -4,-4 4,-4 -4,-4 -4,4z" fill="none" stroke="#14213D" stroke-width="1"/>
<text x="726" y="185" text-anchor="middle" class="task-label" style="font-size:9.5px">Adres valideren</text>
<circle cx="792" cy="186" r="8" class="evt-bound"/>

<rect x="830" y="162" width="140" height="38" rx="9" class="task"/>
<text x="900" y="185" text-anchor="middle" class="task-label" style="font-size:9.5px">Adres wegschrijven</text>
<circle cx="962" cy="186" r="8" class="evt-bound"/>

<rect x="1010" y="162" width="110" height="38" rx="9" class="task"/>
<text x="1065" y="185" text-anchor="middle" class="task-label" style="font-size:9.5px">Bevestiging</text>
<circle cx="1112" cy="186" r="8" class="evt-bound"/>

<line x1="641" y1="181" x2="660" y2="181" class="seq"/>
<line x1="790" y1="181" x2="830" y2="181" class="seq"/>
<line x1="970" y1="181" x2="1010" y2="181" class="seq"/>

<circle cx="1090" cy="260" r="12" class="evt-end"/>
<path d="M1065,200 C1075,220 1085,240 1088,248" class="seq"/>

<circle cx="792" cy="240" r="10" class="evt-end" opacity="0.7"/>
<circle cx="962" cy="240" r="10" class="evt-end" opacity="0.7"/>
<path d="M792,194 C792,215 792,225 792,230" class="seq" opacity="0.7"/>
<path d="M962,194 C962,215 962,225 962,230" class="seq" opacity="0.7"/>
<text x="792" y="262" text-anchor="middle" class="sub" style="font-size:8.5px">fout-end</text>
<text x="962" y="262" text-anchor="middle" class="sub" style="font-size:8.5px">fout-end</text>

<rect x="630" y="330" width="460" height="200" rx="6" class="diffbox"/>
<text x="650" y="356" class="diff">Kenmerken van de systeemorchestratie-stijl</text>
<text x="650" y="380" class="sub">Fijnere granulariteit — elke systeeminteractie (valideren,</text>
<text x="650" y="398" class="sub">wegschrijven, bevestigen) is een aparte service task met</text>
<text x="650" y="416" class="sub">eigen connectorconfiguratie. Strikte foutafhandeling —</text>
<text x="650" y="434" class="sub">elk mogelijk foutscenario heeft een expliciet pad met een</text>
<text x="650" y="452" class="sub">eigen boundary error event: een systeem improviseert</text>
<text x="650" y="470" class="sub">niet (§14.6). Volledige technische precisie in expressies</text>
<text x="650" y="488" class="sub">en connectorconfiguratie, ten koste van leesbaarheid</text>
<text x="650" y="506" class="sub">voor een niet-technische lezer.</text>

</svg>
