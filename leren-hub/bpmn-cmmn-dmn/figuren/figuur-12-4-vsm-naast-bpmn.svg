<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 780" font-family="'DM Sans', Arial, sans-serif" width="1600" height="780" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .paneltitle { font-size:14px; font-weight:700; fill:#2563A8; letter-spacing:.04em; }
    .vraagbox { fill:#FBF6E9; stroke:#E9A13B; stroke-width:2; }
    .vraag-kicker { font-size:10px; font-weight:700; fill:#E9A13B; letter-spacing:.12em; }
    .vraag-text { font-size:14px; font-weight:700; fill:#14213D; }
    .pbox { fill:#CFE0F2; stroke:#14213D; stroke-width:1.4; }
    .pbox-label { font-size:11.5px; font-weight:700; fill:#14213D; }
    .databox { fill:#FBFAF7; stroke:#14213D; stroke-width:1; }
    .databox-label { font-size:10.5px; fill:#55606F; }
    .inv-tri { fill:#FBF6E9; stroke:#E9A13B; stroke-width:1.6; }
    .inv-label { font-size:10.5px; font-weight:700; fill:#14213D; }
    .ladder { stroke:#14213D; stroke-width:2; fill:none; }
    .ladder-legend { font-size:10.5px; fill:#55606F; }
    .stat-normal { font-size:13px; fill:#14213D; }
    .stat-amber { font-size:14px; font-weight:700; fill:#E9A13B; }
    .task { fill:#CFE0F2; stroke:#14213D; stroke-width:1.4; }
    .task-label { font-size:11.5px; fill:#14213D; font-weight:600; }
    .evt-start { fill:#FBFAF7; stroke:#14213D; stroke-width:1.6; }
    .evt-end { fill:#FBFAF7; stroke:#14213D; stroke-width:3; }
    .seq { stroke:#14213D; stroke-width:1.6; fill:none; marker-end:url(#seqarr); }
    .label { font-size:14px; font-weight:700; fill:#14213D; }
    .sub { font-size:12px; fill:#55606F; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
  </style>
  <marker id="seqarr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#14213D"/></marker>
</defs>
<rect width="1600" height="780" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 12 · BPMN</text>
<text x="40" y="64" class="title">Figuur 12.4 — Value stream map naast BPMN: hetzelfde proces, een andere vraag</text>
<text x="40" y="86" class="sub">Werkgevermutatie verwerken, in twee platen naast elkaar — elke plaat beantwoordt een andere vraag (§12.5).</text>

<!-- LEFT: value stream map -->
<text x="60" y="118" class="paneltitle">VALUE STREAM MAP</text>
<rect x="60" y="128" width="690" height="46" rx="6" class="vraagbox"/>
<text x="76" y="144" class="vraag-kicker">VRAAG</text>
<text x="76" y="164" class="vraag-text">waar zit waarde, waar zit verspilling?</text>

<!-- process boxes -->
<rect x="60" y="220" width="120" height="64" rx="4" class="pbox"/>
<text x="120" y="246" text-anchor="middle" class="pbox-label">Mutatie</text>
<text x="120" y="260" text-anchor="middle" class="pbox-label">ontvangen</text>
<rect x="60" y="290" width="120" height="34" class="databox"/>
<text x="120" y="311" text-anchor="middle" class="databox-label">C/T: 5 min</text>

<rect x="250" y="220" width="120" height="64" rx="4" class="pbox"/>
<text x="310" y="246" text-anchor="middle" class="pbox-label">Gegevens</text>
<text x="310" y="260" text-anchor="middle" class="pbox-label">valideren</text>
<rect x="250" y="290" width="120" height="34" class="databox"/>
<text x="310" y="311" text-anchor="middle" class="databox-label">C/T: 15 min</text>

<rect x="440" y="220" width="120" height="64" rx="4" class="pbox"/>
<text x="500" y="246" text-anchor="middle" class="pbox-label">Wijziging</text>
<text x="500" y="260" text-anchor="middle" class="pbox-label">verwerken</text>
<rect x="440" y="290" width="120" height="34" class="databox"/>
<text x="500" y="311" text-anchor="middle" class="databox-label">C/T: 20 min</text>

<rect x="630" y="220" width="120" height="64" rx="4" class="pbox"/>
<text x="690" y="246" text-anchor="middle" class="pbox-label">Werkgever</text>
<text x="690" y="260" text-anchor="middle" class="pbox-label">informeren</text>
<rect x="630" y="290" width="120" height="34" class="databox"/>
<text x="690" y="311" text-anchor="middle" class="databox-label">C/T: 5 min</text>

<!-- inventory / wait triangles -->
<polygon points="215,238 199,264 231,264" class="inv-tri"/>
<text x="215" y="286" text-anchor="middle" class="inv-label">4 uur</text>

<polygon points="405,238 389,264 421,264" class="inv-tri"/>
<text x="405" y="286" text-anchor="middle" class="inv-label">1 dag (8u)</text>

<polygon points="595,238 579,264 611,264" class="inv-tri"/>
<text x="595" y="286" text-anchor="middle" class="inv-label">2 uur</text>

<!-- timeline ladder -->
<path d="M60,385 H180 V340 H250 V385 H370 V340 H440 V385 H560 V340 H630 V385 H750" class="ladder"/>
<text x="60" y="418" class="ladder-legend">▲ wachttijd (verspilling) — ▼ bewerkingstijd (waarde)</text>

<!-- totals -->
<text x="60" y="455" class="stat-normal">Bewerkingstijd totaal: <tspan font-weight="700">45 min</tspan></text>
<text x="60" y="480" class="stat-amber">Doorlooptijd totaal: ± 14 uur 45 min</text>

<!-- RIGHT: BPMN -->
<text x="830" y="118" class="paneltitle">HETZELFDE PROCES IN BPMN</text>
<rect x="830" y="128" width="690" height="46" rx="6" class="vraagbox"/>
<text x="846" y="144" class="vraag-kicker">VRAAG</text>
<text x="846" y="164" class="vraag-text">wat is de correcte volgorde van activiteiten?</text>

<circle cx="870" cy="260" r="15" class="evt-start"/>
<line x1="885" y1="260" x2="917" y2="260" class="seq"/>

<rect x="920" y="234" width="125" height="52" rx="10" class="task"/>
<text x="982" y="257" text-anchor="middle" class="task-label">Mutatie</text>
<text x="982" y="271" text-anchor="middle" class="task-label">ontvangen</text>
<line x1="1045" y1="260" x2="1077" y2="260" class="seq"/>

<rect x="1080" y="234" width="125" height="52" rx="10" class="task"/>
<text x="1142" y="257" text-anchor="middle" class="task-label">Gegevens</text>
<text x="1142" y="271" text-anchor="middle" class="task-label">valideren</text>
<line x1="1205" y1="260" x2="1237" y2="260" class="seq"/>

<rect x="1240" y="234" width="125" height="52" rx="10" class="task"/>
<text x="1302" y="257" text-anchor="middle" class="task-label">Wijziging</text>
<text x="1302" y="271" text-anchor="middle" class="task-label">verwerken</text>
<line x1="1365" y1="260" x2="1397" y2="260" class="seq"/>

<rect x="1400" y="234" width="125" height="52" rx="10" class="task"/>
<text x="1462" y="257" text-anchor="middle" class="task-label">Werkgever</text>
<text x="1462" y="271" text-anchor="middle" class="task-label">informeren</text>
<line x1="1525" y1="260" x2="1557" y2="260" class="seq"/>

<circle cx="1573" cy="260" r="17" class="evt-end"/>

<text x="830" y="330" class="sub" style="font-style:italic">Geen cyclustijden, geen wachttijden — alleen de volgorde telt in deze plaat.</text>

</svg>
