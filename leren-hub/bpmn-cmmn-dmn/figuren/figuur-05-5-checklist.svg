<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="'DM Sans', Arial, sans-serif" width="960" height="700" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .card { fill:#FFFFFF; stroke:#14213D; stroke-width:1.6; }
      .num-badge { fill:#2563A8; }
      .num-text { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .item-title { font-size:13.5px; font-weight:700; fill:#14213D; }
      .item-sub { font-size:11.5px; fill:#55606F; }
      .checkbox { fill:#FFFFFF; stroke:#14213D; stroke-width:1.6; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:26px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .sub { font-size:12px; fill:#55606F; }
      .divider { stroke:#EEF2F7; stroke-width:1.2; }
      .ref { font-size:10.5px; fill:#2563A8; font-weight:700; }
    </style>
</defs>
<rect width="960" height="700" class="paper"/>
<rect x="16" y="16" width="928" height="668" rx="12" class="card"/>

<rect x="16" y="16" width="928" height="70" rx="12" fill="#14213D"/>
<rect x="16" y="60" width="928" height="26" fill="#14213D"/>
<text x="48" y="46" class="kicker" fill="#CFE0F2">DEEL 05 · REVIEWCHECKLIST — PRINTBAAR</text>
<text x="48" y="74" class="title" fill="#FBFAF7">Figuur 5.5 — De tien meest gemaakte modelleerfouten</text>

<!-- two columns of 5 items -->
<!-- Column 1 -->
<g>
  <circle cx="62" cy="128" r="15" class="num-badge"/>
  <text x="62" y="133" text-anchor="middle" class="num-text">1</text>
  <rect x="86" y="115" width="18" height="18" class="checkbox" rx="3"/>
  <text x="116" y="123" class="item-title">Sequence flow over een poolgrens</text>
  <text x="116" y="140" class="item-sub">Moet een message flow zijn (gestippeld, open pijlpunt).</text>

  <line x1="48" y1="160" x2="470" y2="160" class="divider"/>

  <circle cx="62" cy="192" r="15" class="num-badge"/>
  <text x="62" y="197" text-anchor="middle" class="num-text">2</text>
  <rect x="86" y="179" width="18" height="18" class="checkbox" rx="3"/>
  <text x="116" y="187" class="item-title">Gateway met een handelingslabel</text>
  <text x="116" y="204" class="item-sub">Een gateway routeert, hij beoordeelt niet — gebruik een vraagvorm.</text>

  <line x1="48" y1="224" x2="470" y2="224" class="divider"/>

  <circle cx="62" cy="256" r="15" class="num-badge"/>
  <text x="62" y="261" text-anchor="middle" class="num-text">3</text>
  <rect x="86" y="243" width="18" height="18" class="checkbox" rx="3"/>
  <text x="116" y="251" class="item-title">Splitsingstype ≠ samenkomsttype</text>
  <text x="116" y="268" class="item-sub">Parallel split met exclusive join, en omgekeerd.</text>

  <line x1="48" y1="288" x2="470" y2="288" class="divider"/>

  <circle cx="62" cy="320" r="15" class="num-badge"/>
  <text x="62" y="325" text-anchor="middle" class="num-text">4</text>
  <rect x="86" y="307" width="18" height="18" class="checkbox" rx="3"/>
  <text x="116" y="315" class="item-title">Ontbrekende eindtoestanden</text>
  <text x="116" y="332" class="item-sub">Een pad dat "los" eindigt, zonder end event.</text>

  <line x1="48" y1="352" x2="470" y2="352" class="divider"/>

  <circle cx="62" cy="384" r="15" class="num-badge"/>
  <text x="62" y="389" text-anchor="middle" class="num-text">5</text>
  <rect x="86" y="371" width="18" height="18" class="checkbox" rx="3"/>
  <text x="116" y="379" class="item-title">Meerdere startevents zonder reden</text>
  <text x="116" y="396" class="item-sub">Vaak een teken van twee samengevoegde processen.</text>
</g>

<!-- Column 2 -->
<g>
  <circle cx="522" cy="128" r="15" class="num-badge" fill="#E9A13B"/>
  <text x="522" y="133" text-anchor="middle" class="num-text" fill="#14213D">6</text>
  <rect x="546" y="115" width="18" height="18" class="checkbox" rx="3"/>
  <text x="576" y="123" class="item-title">Activiteit als toestand geformuleerd</text>
  <text x="576" y="140" class="item-sub">"Aanvraag beoordeeld" in plaats van "Aanvraag beoordelen".</text>

  <line x1="508" y1="160" x2="930" y2="160" class="divider"/>

  <circle cx="522" cy="192" r="15" class="num-badge" fill="#E9A13B"/>
  <text x="522" y="197" text-anchor="middle" class="num-text" fill="#14213D">7</text>
  <rect x="546" y="179" width="18" height="18" class="checkbox" rx="3"/>
  <text x="576" y="187" class="item-title">Drie modelleerniveaus door elkaar</text>
  <text x="576" y="204" class="item-sub">Landschap, proces en subproces in één diagram (§5.1).</text>

  <line x1="508" y1="224" x2="930" y2="224" class="divider"/>

  <circle cx="522" cy="256" r="15" class="num-badge" fill="#E9A13B"/>
  <text x="522" y="261" text-anchor="middle" class="num-text" fill="#14213D">8</text>
  <rect x="546" y="243" width="18" height="18" class="checkbox" rx="3"/>
  <text x="576" y="251" class="item-title">Geen default flow / onvolledige condities</text>
  <text x="576" y="268" class="item-sub">Het proces kan vastlopen als geen conditie waar is.</text>

  <line x1="508" y1="288" x2="930" y2="288" class="divider"/>

  <circle cx="522" cy="320" r="15" class="num-badge" fill="#E9A13B"/>
  <text x="522" y="325" text-anchor="middle" class="num-text" fill="#14213D">9</text>
  <rect x="546" y="307" width="18" height="18" class="checkbox" rx="3"/>
  <text x="576" y="315" class="item-title">Onnodig complexe gateways</text>
  <text x="576" y="332" class="item-sub">Een verkapte beslissing die eigenlijk in DMN hoort (deel 4, §4.4).</text>

  <line x1="508" y1="352" x2="930" y2="352" class="divider"/>

  <circle cx="522" cy="384" r="15" class="num-badge" fill="#E9A13B"/>
  <text x="522" y="389" text-anchor="middle" class="num-text" fill="#14213D">10</text>
  <rect x="546" y="371" width="18" height="18" class="checkbox" rx="3"/>
  <text x="576" y="379" class="item-title">Uitzonderingspaden even prominent</text>
  <text x="576" y="396" class="item-sub">Leesbaarheid opgeofferd aan volledigheid (§5.2).</text>
</g>

<line x1="490" y1="105" x2="490" y2="410" stroke="#EEF2F7" stroke-width="1.4"/>

<rect x="48" y="430" width="864" height="1" fill="#CFE0F2"/>
<text x="48" y="460" class="sub">Vink af bij elke review. Fouten 1–3, 8 zijn structureel en vaak machinaal te detecteren;</text>
<text x="48" y="478" class="sub">fout 5 is meestal semantisch; fouten 6, 7, 10 zijn stilistisch. Fout 4 en 9 kunnen beide zijn.</text>
<text x="48" y="506" class="ref">Uitgangspunt voor de reviewchecklist uit deel 3 — vanaf nu bij elk modelleerdeel terugkerend.</text>

<rect x="48" y="536" width="864" height="120" rx="8" fill="#FBF6E9" stroke="#E9A13B" stroke-width="1.2"/>
<text x="70" y="562" class="item-title" fill="#14213D">Knip- of printlijn</text>
<text x="70" y="584" class="item-sub">Dit vak is bewust los ontworpen van de rest van de pagina — geschikt om apart</text>
<text x="70" y="602" class="item-sub">te printen en naast een modelleertool te leggen tijdens het reviewen.</text>
<line x1="70" y1="620" x2="890" y2="620" stroke="#E9A13B" stroke-width="1" stroke-dasharray="6 4"/>
</svg>
