<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 660" font-family="'DM Sans', Arial, sans-serif" width="1080" height="660" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .hp { fill:#14213D; }
    .hptxt { font-size:16px; font-weight:700; fill:#FBFAF7; text-anchor:middle; }
    .hin { fill:#CFE0F2; stroke:#14213D; stroke-width:1.3; }
    .hout { fill:#FBF6E9; stroke:#14213D; stroke-width:1.3; }
    .hintxt { font-size:12.5px; font-weight:700; fill:#14213D; text-anchor:middle; }
    .cell { fill:#FFFFFF; stroke:#B9C2CE; stroke-width:1; }
    .cellflag { fill:#FCE9C9; stroke:#E9A13B; stroke-width:1.8; }
    .celltxt { font-size:12.5px; fill:#14213D; text-anchor:middle; }
    .rownum { fill:#EEF2F7; stroke:#B9C2CE; stroke-width:1; }
    .rownumflag { fill:#FCE9C9; stroke:#E9A13B; stroke-width:1.8; }
    .rownumtxt { font-size:12.5px; font-weight:700; fill:#14213D; text-anchor:middle; }
    .outborder { stroke:#14213D; stroke-width:2.4; fill:none; }
    .callout { fill:#FFFFFF; stroke:#E9A13B; stroke-width:1.4; }
    .calltitle { font-size:12.5px; font-weight:700; fill:#B5761F; }
    .calltxt { font-size:11px; fill:#14213D; }
    .leader { stroke:#E9A13B; stroke-width:1.4; fill:none; stroke-dasharray:3 2; }
    .label { font-size:14px; font-weight:700; fill:#14213D; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    .sub { font-size:12px; fill:#55606F; }
    .note { font-size:11px; fill:#55606F; }
  </style>
</defs>
<rect width="1080" height="660" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 15 · TABELANALYSE (NOTATIE-CORRECT)</text>
<text x="40" y="64" class="title">Figuur 15.4 — Tabelanalyse: subsumptie en een onbereikbare regel</text>
<text x="40" y="86" class="sub">Beslistabel "Kortingspercentage vervroeging" · hit policy First (F) · rijvolgorde is betekenisvol (§15.6).</text>

<!-- Header -->
<rect x="60" y="150" width="50" height="42" class="hp"/>
<text x="85" y="177" class="hptxt">F</text>
<rect x="110" y="150" width="230" height="42" class="hin"/>
<text x="225" y="176" class="hintxt">Leeftijd</text>
<rect x="340" y="150" width="210" height="42" class="hin"/>
<text x="445" y="176" class="hintxt">Partnerpensioen</text>
<rect x="550" y="150" width="230" height="42" class="hout"/>
<text x="665" y="176" class="hintxt">Kortingspercentage</text>

<!-- Row 1 -->
<rect x="60" y="192" width="50" height="48" class="rownum"/>
<text x="85" y="221" class="rownumtxt">1</text>
<rect x="110" y="192" width="230" height="48" class="cell"/>
<text x="225" y="221" class="celltxt">&gt; 65</text>
<rect x="340" y="192" width="210" height="48" class="cell"/>
<text x="445" y="221" class="celltxt">–</text>
<rect x="550" y="192" width="230" height="48" class="cell"/>
<text x="665" y="221" class="celltxt">3%</text>

<!-- Row 2 — SUBSUMPTIE -->
<rect x="60" y="240" width="50" height="48" class="rownumflag"/>
<text x="85" y="269" class="rownumtxt">2</text>
<rect x="110" y="240" width="230" height="48" class="cellflag"/>
<text x="225" y="269" class="celltxt">[60..70)</text>
<rect x="340" y="240" width="210" height="48" class="cellflag"/>
<text x="445" y="269" class="celltxt">–</text>
<rect x="550" y="240" width="230" height="48" class="cellflag"/>
<text x="665" y="269" class="celltxt">3%</text>

<!-- Row 3 -->
<rect x="60" y="288" width="50" height="48" class="rownum"/>
<text x="85" y="317" class="rownumtxt">3</text>
<rect x="110" y="288" width="230" height="48" class="cell"/>
<text x="225" y="317" class="celltxt">[50..60)</text>
<rect x="340" y="288" width="210" height="48" class="cell"/>
<text x="445" y="317" class="celltxt">–</text>
<rect x="550" y="288" width="230" height="48" class="cell"/>
<text x="665" y="317" class="celltxt">6%</text>

<!-- Row 4 — ONBEREIKBAAR -->
<rect x="60" y="336" width="50" height="48" class="rownumflag"/>
<text x="85" y="365" class="rownumtxt">4</text>
<rect x="110" y="336" width="230" height="48" class="cellflag"/>
<text x="225" y="365" class="celltxt">&gt; 70</text>
<rect x="340" y="336" width="210" height="48" class="cellflag"/>
<text x="445" y="365" class="celltxt">ja</text>
<rect x="550" y="336" width="230" height="48" class="cellflag"/>
<text x="665" y="365" class="celltxt">2%</text>

<!-- Row 5 -->
<rect x="60" y="384" width="50" height="48" class="rownum"/>
<text x="85" y="413" class="rownumtxt">5</text>
<rect x="110" y="384" width="230" height="48" class="cell"/>
<text x="225" y="413" class="celltxt">&lt;= 50</text>
<rect x="340" y="384" width="210" height="48" class="cell"/>
<text x="445" y="413" class="celltxt">–</text>
<rect x="550" y="384" width="230" height="48" class="cell"/>
<text x="665" y="413" class="celltxt">7%</text>

<!-- outer + output-column border -->
<rect x="60" y="150" width="720" height="282" class="outborder"/>
<line x1="550" y1="150" x2="550" y2="432" class="outborder"/>
<line x1="546" y1="150" x2="546" y2="432" stroke="#14213D" stroke-width="1"/>

<!-- Callouts -->
<rect x="820" y="230" width="220" height="110" class="callout" rx="4"/>
<text x="834" y="252" class="calltitle">Regel 2 — subsumptie</text>
<text x="834" y="270" class="calltxt">Overlapt met regel 1 in het</text>
<text x="834" y="285" class="calltxt">bereik 65–70: pas zichtbaar</text>
<text x="834" y="300" class="calltxt">als je de ranges naast elkaar</text>
<text x="834" y="315" class="calltxt">legt, niet uit de tabel zelf.</text>
<path d="M820,264 H780" class="leader"/>

<rect x="820" y="360" width="220" height="110" class="callout" rx="4"/>
<text x="834" y="382" class="calltitle">Regel 4 — onbereikbaar</text>
<text x="834" y="400" class="calltxt">Regel 1 (leeftijd &gt; 65) vuurt</text>
<text x="834" y="415" class="calltxt">al voor elk geval dat hier</text>
<text x="834" y="430" class="calltxt">geraakt zou worden — door de</text>
<text x="834" y="445" class="calltxt">volgorde komt regel 4 nooit</text>
<text x="834" y="458" class="calltxt" style="font-size:10px">aan de beurt bij hit policy F.</text>
<path d="M820,360 H780" class="leader"/>

<text x="60" y="475" class="note">Onder een Unique-tabel wordt overlap meestal automatisch gedetecteerd. Subsumptie en onbereikbare regels bij een</text>
<text x="60" y="491" class="note">volgorde-afhankelijke hit policy als First zijn subtieler: sommige tools signaleren ze, andere niet (§15.6).</text>
</svg>
