<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 640" font-family="'DM Sans', Arial, sans-serif" width="1360" height="640" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .task { fill:#CFE0F2; stroke:#14213D; stroke-width:1.4; }
    .task-label { font-size:12px; fill:#14213D; text-anchor:middle; }
    .gateway { fill:#FBFAF7; stroke:#14213D; stroke-width:1.7; }
    .gw-mark { stroke:#14213D; stroke-width:2.2; stroke-linecap:round; }
    .evt-end { fill:#FBFAF7; stroke:#14213D; stroke-width:3.4; }
    .evt-label { font-size:11px; fill:#14213D; text-anchor:middle; }
    .icon { stroke:#14213D; stroke-width:1.2; fill:none; stroke-linejoin:round; stroke-linecap:round; }
    .seq { stroke:#14213D; stroke-width:1.6; fill:none; marker-end:url(#seqarr); }
    .cond { font-size:11px; fill:#2563A8; font-weight:700; }
    .default-tick { stroke:#14213D; stroke-width:1.8; }
    .note { font-size:10.5px; fill:#55606F; font-style:italic; }
    .panel-title { font-size:15px; font-weight:700; fill:#14213D; }
    .panel-sub { font-size:11.5px; fill:#55606F; }
    .label { font-size:14px; font-weight:700; fill:#14213D; }
    .sub { font-size:11.5px; fill:#55606F; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    .footer { font-size:11px; fill:#55606F; }
  </style>
  <marker id="seqarr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#14213D"/></marker>
  <symbol id="ic-send" viewBox="0 0 20 16"><rect x="0.5" y="3.5" width="17" height="11" class="icon"/><polyline points="0.5,3.5 9,10 17.5,3.5" class="icon"/><path d="M12,3 L19,0.5 M19,0.5 L16.5,1 M19,0.5 L18.3,3" class="icon"/></symbol>
</defs>
<rect width="1360" height="640" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 03 · BPMN-NOTATIE</text>
<text x="40" y="64" class="title">Figuur 3.5 — Exclusive en parallel gateway: splitsen en samenkomen</text>
<text x="40" y="84" class="sub">Wat je splitst, breng je op dezelfde manier samen (reader §3.5)</text>

<line x1="680" y1="110" x2="680" y2="600" stroke="#E3E0D8" stroke-width="1.5"/>

<!-- PANEL 1: EXCLUSIVE -->
<text x="40" y="122" class="panel-title">Exclusive gateway (XOR)</text>
<text x="40" y="140" class="panel-sub">precies één uitgaand pad wordt gevolgd — elke flow heeft een conditie</text>

<rect x="60" y="270" width="130" height="50" rx="10" class="task"/>
<text x="125" y="299" class="task-label">Formaat controleren</text>
<line x1="190" y1="295" x2="226" y2="295" class="seq"/>

<polygon points="250,273 272,295 250,317 228,295" class="gateway"/>
<line x1="240" y1="285" x2="260" y2="305" class="gw-mark"/>
<line x1="260" y1="285" x2="240" y2="305" class="gw-mark"/>
<text x="250" y="245" text-anchor="middle" class="task-label" style="font-weight:700">Formaat geldig?</text>

<rect x="340" y="180" width="140" height="50" rx="10" class="task"/>
<text x="410" y="209" class="task-label">Adres bijwerken</text>
<line x1="255" y1="278" x2="336" y2="212" class="seq"/>
<text x="272" y="245" class="cond">Ja</text>

<rect x="340" y="380" width="140" height="50" rx="10" class="task"/>
<text x="410" y="402" class="task-label">Mutatie laten</text>
<text x="410" y="416" class="task-label">corrigeren</text>
<line x1="255" y1="312" x2="336" y2="378" class="seq"/>
<line x1="270" y1="322" x2="283" y2="335" class="default-tick"/>
<text x="272" y="352" class="cond">Nee (default)</text>

<polygon points="520,273 542,295 520,317 498,295" class="gateway"/>
<line x1="510" y1="285" x2="530" y2="305" class="gw-mark"/>
<line x1="530" y1="285" x2="510" y2="305" class="gw-mark"/>
<line x1="480" y1="212" x2="516" y2="280" class="seq"/>
<line x1="480" y1="378" x2="516" y2="310" class="seq"/>
<text x="520" y="345" text-anchor="middle" class="note">één pad kwam binnen</text>

<circle cx="590" cy="295" r="15" class="evt-end"/>
<line x1="544" y1="295" x2="574" y2="295" class="seq"/>
<text x="590" y="332" class="evt-label">Mutatie verwerkt</text>

<!-- PANEL 2: PARALLEL -->
<text x="700" y="122" class="panel-title">Parallel gateway (AND)</text>
<text x="700" y="140" class="panel-sub">alle uitgaande paden tegelijk — geen condities</text>

<rect x="720" y="270" width="130" height="50" rx="10" class="task"/>
<text x="785" y="299" class="task-label">Aanvraag goedgekeurd</text>
<line x1="850" y1="295" x2="886" y2="295" class="seq"/>

<polygon points="910,273 932,295 910,317 888,295" class="gateway"/>
<line x1="910" y1="278" x2="910" y2="312" class="gw-mark"/>
<line x1="893" y1="295" x2="927" y2="295" class="gw-mark"/>
<text x="910" y="245" text-anchor="middle" class="task-label" style="font-weight:700">Verwerking starten</text>

<rect x="1000" y="180" width="150" height="50" rx="10" class="task"/>
<text x="1075" y="209" class="task-label">Adres bijwerken</text>
<line x1="915" y1="278" x2="996" y2="212" class="seq"/>

<rect x="1000" y="380" width="150" height="50" rx="10" class="task"/>
<use href="#ic-send" x="1010" y="390" width="18" height="14"/>
<text x="1080" y="410" class="task-label">Bevestiging versturen</text>
<line x1="915" y1="312" x2="996" y2="378" class="seq"/>

<polygon points="1180,273 1202,295 1180,317 1158,295" class="gateway"/>
<line x1="1180" y1="278" x2="1180" y2="312" class="gw-mark"/>
<line x1="1163" y1="295" x2="1197" y2="295" class="gw-mark"/>
<line x1="1150" y1="212" x2="1176" y2="280" class="seq"/>
<line x1="1150" y1="378" x2="1176" y2="310" class="seq"/>
<text x="1180" y="345" text-anchor="middle" class="note">wacht op beide paden</text>

<circle cx="1250" cy="295" r="15" class="evt-end"/>
<line x1="1204" y1="295" x2="1234" y2="295" class="seq"/>
<text x="1250" y="332" class="evt-label">Mutatie afgerond</text>

<line x1="40" y1="565" x2="1320" y2="565" stroke="#E3E0D8" stroke-width="1"/>
<text x="40" y="590" class="footer">Default flow (schuine streep op de flow): het pad dat wordt gevolgd als geen andere conditie waar is — borgt dat het proces nooit vastloopt.</text>
<text x="40" y="608" class="footer">Mengen van splitsingstype en samenkomsttype is een van de meest voorkomende structurele fouten (reader §3.5).</text>
</svg>
