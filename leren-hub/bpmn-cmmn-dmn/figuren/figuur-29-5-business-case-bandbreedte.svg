<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="'DM Sans', Arial, sans-serif" width="960" height="660" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .panel { fill:#FFFFFF; stroke:#E3E0D8; stroke-width:1.5; }
      .panelhead { font-size:14px; font-weight:700; fill:#14213D; }
      .panelsub { font-size:11px; fill:#55606F; }
      .axis { stroke:#14213D; stroke-width:1.4; }
      .gridline { stroke:#E3E0D8; stroke-width:1; }
      .ticklabel { font-size:10.5px; fill:#55606F; }
      .lineconfident { stroke:#2563A8; stroke-width:2.6; fill:none; }
      .lineactual { stroke:#c0392b; stroke-width:2; fill:none; stroke-dasharray:5 3; }
      .band { fill:#FBF6E9; stroke:none; }
      .boundline { stroke:#E9A13B; stroke-width:1.6; fill:none; stroke-dasharray:4 2; }
      .midline { stroke:#14213D; stroke-width:1.8; fill:none; stroke-dasharray:2 3; }
      .marker { fill:#c0392b; stroke:#FBFAF7; stroke-width:1.4; }
      .markerok { fill:#E9A13B; stroke:#14213D; stroke-width:1.2; }
      .anno { font-size:10.5px; fill:#c0392b; font-weight:700; }
      .annook { font-size:10.5px; fill:#8a5a12; font-weight:700; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .sub { font-size:12.5px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .quote { font-size:13px; font-style:italic; fill:#14213D; }
    </style>
</defs>
<rect width="960" height="660" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 29 · FINANCIËLE GRAFIEK</text>
<text x="40" y="62" class="title">Figuur 29.5 — De business case: bandbreedte in plaats van één getal</text>
<text x="40" y="82" class="sub">Overtuigen vandaag versus standhouden bij de eerste tegenvaller — vergelijkbaar met de simulatie-schijnzekerheid uit §25.6.</text>

<!-- LEFT PANEL: overtuigt -->
<rect x="40" y="100" width="420" height="440" class="panel" rx="6"/>
<text x="60" y="126" class="panelhead">"Overtuigt vandaag"</text>
<text x="60" y="142" class="panelsub">één lijn, één getal</text>

<!-- axes left -->
<line x1="90" y1="460" x2="430" y2="460" class="axis"/>
<line x1="90" y1="160" x2="90" y2="460" class="axis"/>
<line x1="203" y1="160" x2="203" y2="460" class="gridline"/>
<line x1="317" y1="160" x2="317" y2="460" class="gridline"/>
<line x1="430" y1="160" x2="430" y2="460" class="gridline"/>
<text x="90" y="476" text-anchor="middle" class="ticklabel">2026</text>
<text x="203" y="476" text-anchor="middle" class="ticklabel">2027</text>
<text x="317" y="476" text-anchor="middle" class="ticklabel">2028</text>
<text x="430" y="476" text-anchor="middle" class="ticklabel">2029</text>

<!-- confident single line -->
<path d="M90,440 L203,380 L317,260 L430,180" class="lineconfident"/>
<text x="365" y="170" class="panelsub" fill="#2563A8" font-weight="700">voorspeld verloop</text>

<!-- actual divergent line -->
<path d="M203,380 L317,430 L430,458" class="lineactual"/>
<circle cx="203" cy="380" r="6" class="marker"/>
<text x="213" y="398" class="anno">eerste tegenvaller (2027)</text>
<text x="330" y="450" class="anno">werkelijk verloop —</text>
<text x="330" y="463" class="anno">verhaal klopt niet meer</text>

<!-- RIGHT PANEL: houdt stand -->
<rect x="500" y="100" width="420" height="440" class="panel" rx="6"/>
<text x="520" y="126" class="panelhead">"Houdt stand"</text>
<text x="520" y="142" class="panelsub">bandbreedte, transparant over onzekerheid</text>

<!-- axes right -->
<line x1="550" y1="460" x2="890" y2="460" class="axis"/>
<line x1="550" y1="160" x2="550" y2="460" class="axis"/>
<line x1="663" y1="160" x2="663" y2="460" class="gridline"/>
<line x1="777" y1="160" x2="777" y2="460" class="gridline"/>
<line x1="890" y1="160" x2="890" y2="460" class="gridline"/>
<text x="550" y="476" text-anchor="middle" class="ticklabel">2026</text>
<text x="663" y="476" text-anchor="middle" class="ticklabel">2027</text>
<text x="777" y="476" text-anchor="middle" class="ticklabel">2028</text>
<text x="890" y="476" text-anchor="middle" class="ticklabel">2029</text>

<!-- uncertainty band polygon: upper then lower reversed -->
<polygon points="550,430 663,340 777,240 890,150 890,300 777,360 663,410 550,450" class="band"/>
<path d="M550,430 L663,340 L777,240 L890,150" class="boundline"/>
<path d="M550,450 L663,410 L777,360 L890,300" class="boundline"/>
<path d="M550,440 L663,375 L777,300 L890,225" class="midline"/>

<!-- tegenvaller within band -->
<circle cx="663" cy="405" r="6" class="markerok"/>
<text x="673" y="400" class="annook">tegenvaller 2027 —</text>
<text x="673" y="413" class="annook">blijft binnen de bandbreedte</text>

<text x="895" y="150" text-anchor="end" class="panelsub" fill="#8a5a12" font-weight="700">optimistisch</text>
<text x="895" y="312" text-anchor="end" class="panelsub" fill="#8a5a12" font-weight="700">pessimistisch</text>

<!-- footer quote -->
<rect x="40" y="558" width="880" height="56" rx="8" fill="#FBF6E9" stroke="#E9A13B" stroke-width="1.2"/>
<text x="480" y="582" text-anchor="middle" class="quote">"Een business case die de onzekerheid verzwijgt om overtuigender te ogen,</text>
<text x="480" y="602" text-anchor="middle" class="quote">wint de presentatie en verliest het vertrouwen zodra de eerste afwijking zich voordoet" — §29.5</text>

</svg>
