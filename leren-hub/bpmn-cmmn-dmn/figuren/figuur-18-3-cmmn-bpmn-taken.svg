<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="'DM Sans', Arial, sans-serif" width="960" height="680" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .case-tab { fill:#EEF2F7; stroke:#14213D; stroke-width:2; }
    .case-box { fill:#FBFAF7; stroke:#14213D; stroke-width:2; }
    .stage-tab { fill:#EEF2F7; stroke:#14213D; stroke-width:1.5; }
    .stage { fill:#EEF2F7; stroke:#14213D; stroke-width:1.5; }
    .task { fill:#CFE0F2; stroke:#14213D; stroke-width:1.4; }
    .task-disc { fill:#CFE0F2; stroke:#14213D; stroke-width:1.4; stroke-dasharray:5,3; }
    .milestone { fill:#FFFFFF; stroke:#14213D; stroke-width:1.4; }
    .sentry { fill:#FFFFFF; stroke:#14213D; stroke-width:1.4; }
    .callout { fill:#FFFFFF; stroke:#2563A8; stroke-width:1.6; stroke-dasharray:6,4; }
    .startev { fill:#FFFFFF; stroke:#14213D; stroke-width:1.4; }
    .endev { fill:#EEF2F7; stroke:#14213D; stroke-width:2.8; }
    .bptask { fill:#CFE0F2; stroke:#14213D; stroke-width:1.3; }
    .label { font-size:11.5px; font-weight:700; fill:#14213D; }
    .sub { font-size:9.8px; fill:#55606F; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    .conn { stroke:#55606F; stroke-width:1.2; fill:none; stroke-dasharray:2,2; }
    .leader { stroke:#2563A8; stroke-width:1.3; fill:none; stroke-dasharray:4,3; }
    .seq { stroke:#14213D; stroke-width:1.4; fill:none; marker-end:url(#arrS); }
  </style>
  <marker id="arrS" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#14213D"/></marker>
</defs>
<rect width="960" height="680" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 18 · CMMN + BPMN</text>
<text x="40" y="64" class="title">Dossier met deelprocessen — Klachten &amp; Bezwaren</text>
<text x="40" y="84" class="sub">Een CMMN-skelet; "Herberekening aanvragen" is zelf een vast BPMN-proces van vier stappen, aangeroepen als process task.</text>

<!-- Case outer -->
<rect x="45" y="102" width="70" height="16" rx="4" class="case-tab"/>
<rect x="20" y="118" width="565" height="470" rx="16" class="case-box"/>
<text x="40" y="142" class="label" font-size="13">Case: Klachtbehandeling</text>

<!-- Stage: Intake -->
<rect x="48" y="160" width="42" height="13" rx="4" class="stage-tab"/>
<rect x="38" y="173" width="175" height="120" rx="12" class="stage"/>
<text x="52" y="192" class="label">Stage: Intake</text>
<rect x="52" y="200" width="150" height="36" rx="7" class="task"/>
<circle cx="66" cy="211" r="5" fill="none" stroke="#14213D" stroke-width="1.1"/>
<path d="M59,222 q7,-9 14,0 z" fill="none" stroke="#14213D" stroke-width="1.1"/>
<text x="127" y="221" class="sub" font-weight="700" text-anchor="middle">Klacht registreren</text>
<rect x="58" y="246" width="140" height="26" rx="13" class="milestone"/>
<text x="128" y="263" class="sub" font-weight="700" text-anchor="middle">Ontvangst bevestigd</text>

<!-- connector Intake -> Onderzoek -->
<line x1="213" y1="233" x2="248" y2="233" class="conn"/>
<g transform="translate(248,233)"><rect x="-6" y="-6" width="12" height="12" class="sentry" transform="rotate(45 0 0)"/></g>

<!-- Stage: Onderzoek -->
<rect x="262" y="160" width="46" height="13" rx="4" class="stage-tab"/>
<rect x="252" y="173" width="315" height="390" rx="12" class="stage"/>
<text x="266" y="192" class="label">Stage: Onderzoek</text>

<rect x="266" y="200" width="150" height="40" rx="8" class="task"/>
<circle cx="280" cy="213" r="5" fill="none" stroke="#14213D" stroke-width="1.1"/>
<path d="M273,225 q7,-9 14,0 z" fill="none" stroke="#14213D" stroke-width="1.1"/>
<text x="341" y="222" class="sub" font-weight="700" text-anchor="middle">Onderzoek</text>
<text x="341" y="234" class="sub" font-weight="700" text-anchor="middle">uitvoeren</text>

<rect x="266" y="252" width="150" height="40" rx="8" class="task-disc"/>
<circle cx="280" cy="265" r="5" fill="none" stroke="#14213D" stroke-width="1.1"/>
<path d="M273,277 q7,-9 14,0 z" fill="none" stroke="#14213D" stroke-width="1.1"/>
<text x="341" y="274" class="sub" font-weight="700" text-anchor="middle">Extern advies</text>
<text x="341" y="286" class="sub" font-weight="700" text-anchor="middle">inwinnen (discretionary)</text>

<!-- process task -->
<rect x="266" y="304" width="150" height="52" rx="8" class="task"/>
<line x1="274" y1="304" x2="274" y2="356" stroke="#14213D" stroke-width="1.1"/>
<line x1="279" y1="304" x2="279" y2="356" stroke="#14213D" stroke-width="1.1"/>
<text x="345" y="327" class="sub" font-weight="700" text-anchor="middle">Herberekening</text>
<text x="345" y="339" class="sub" font-weight="700" text-anchor="middle">aanvragen</text>
<text x="345" y="351" class="sub" text-anchor="middle" font-size="8.3">(process task → zie kader)</text>

<!-- milestone onderzoek afgerond -->
<g transform="translate(341,388)"><rect x="-6" y="-6" width="12" height="12" class="sentry" transform="rotate(45 0 0)"/></g>
<line x1="341" y1="240" x2="341" y2="382" class="conn"/>
<line x1="341" y1="292" x2="341" y2="382" class="conn"/>
<line x1="341" y1="356" x2="341" y2="382" class="conn"/>
<rect x="271" y="394" width="140" height="26" rx="13" class="milestone"/>
<text x="341" y="411" class="sub" font-weight="700" text-anchor="middle">Onderzoek afgerond</text>

<text x="266" y="500" class="sub">Discretionary items maken het</text>
<text x="266" y="512" class="sub">verschil tussen dossierwerk</text>
<text x="266" y="524" class="sub">en een vast pad — de kern</text>
<text x="266" y="536" class="sub">van dit patroon.</text>

<!-- case-level milestone -->
<g transform="translate(341,438)"><rect x="-6" y="-6" width="12" height="12" class="sentry" transform="rotate(45 0 0)"/></g>
<line x1="341" y1="420" x2="341" y2="432" class="conn"/>

<rect x="60" y="558" width="500" height="26" rx="13" class="milestone"/>
<text x="310" y="576" class="sub" font-weight="700" text-anchor="middle">Milestone (case): Klacht afgehandeld</text>
<line x1="341" y1="444" x2="341" y2="558" class="conn"/>

<!-- Leader to callout -->
<line x1="416" y1="330" x2="610" y2="220" class="leader"/>

<!-- Callout panel -->
<rect x="610" y="160" width="325" height="240" rx="12" class="callout"/>
<text x="628" y="184" class="label" fill="#2563A8">Binnen de process task (BPMN)</text>
<text x="628" y="200" class="sub">"Herberekening aanvragen" — vast</text>
<text x="628" y="213" class="sub">administratief proces van vier stappen,</text>
<text x="628" y="226" class="sub">verdient geen eigen casemodel.</text>

<circle cx="648" cy="270" r="12" class="startev"/>
<line x1="660" y1="270" x2="672" y2="270" class="seq"/>
<rect x="672" y="252" width="76" height="36" rx="7" class="bptask"/>
<text x="710" y="273" class="sub" text-anchor="middle" font-size="8.4">Gegevens</text>
<text x="710" y="284" class="sub" text-anchor="middle" font-size="8.4">ophalen</text>
<line x1="748" y1="270" x2="760" y2="270" class="seq"/>
<rect x="760" y="252" width="86" height="36" rx="7" class="bptask"/>
<text x="803" y="273" class="sub" text-anchor="middle" font-size="8.4">Bedrag</text>
<text x="803" y="284" class="sub" text-anchor="middle" font-size="8.4">herberekenen</text>

<path d="M803,288 L803,308 L690,308 L690,326" class="seq"/>

<rect x="650" y="330" width="80" height="36" rx="7" class="bptask"/>
<text x="690" y="349" class="sub" text-anchor="middle" font-size="8.4">Uitkomst</text>
<text x="690" y="360" class="sub" text-anchor="middle" font-size="8.4">vastleggen</text>
<line x1="730" y1="348" x2="742" y2="348" class="seq"/>
<rect x="742" y="330" width="90" height="36" rx="7" class="bptask"/>
<text x="787" y="349" class="sub" text-anchor="middle" font-size="8.4">Deelnemer</text>
<text x="787" y="360" class="sub" text-anchor="middle" font-size="8.4">informeren</text>
<line x1="832" y1="348" x2="848" y2="348" class="seq"/>
<circle cx="862" cy="348" r="12" class="endev"/>
</svg>
