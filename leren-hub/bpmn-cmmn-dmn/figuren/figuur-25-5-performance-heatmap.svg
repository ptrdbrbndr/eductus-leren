<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .panel { fill:#FFFFFF; stroke:#E3E0D8; stroke-width:1.5; }
      .task { fill:#EEF2F7; stroke:#14213D; stroke-width:1.5; }
      .starte { fill:#FBFAF7; stroke:#14213D; stroke-width:1.5; }
      .ende { fill:#FBFAF7; stroke:#14213D; stroke-width:3; }
      .icon { fill:none; stroke:#2563A8; stroke-width:1.3; }
      .tasklabel { font-size:11.5px; font-weight:700; fill:#14213D; }
      .tasksub { font-size:9.5px; fill:#55606F; }
      .flow-hoog { stroke:#E9A13B; stroke-width:8; fill:none; }
      .flow-mid { stroke:#6FA3D6; stroke-width:8; fill:none; }
      .flow-laag { stroke:#CFE0F2; stroke-width:8; fill:none; }
      .flowarrow-hoog { fill:#8a5a12; }
      .flowarrow-mid { fill:#2563A8; }
      .flowarrow-laag { fill:#7fa8c9; }
      .waitlabel { font-size:10.5px; font-weight:700; fill:#14213D; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .sub { font-size:12px; fill:#55606F; }
      .legendtext { font-size:11px; fill:#14213D; }
      .callout { fill:#FBF6E9; stroke:#E9A13B; stroke-width:1.4; }
      .calltitle { font-size:11.5px; font-weight:700; fill:#8a5a12; }
      .calltext { font-size:10.6px; fill:#55606F; }
    </style>
</defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 25 · PERFORMANCE-HEATMAP</text>
<text x="40" y="64" class="title">Figuur 25.5 — Wachttijd per overdracht in Deelnemermutaties</text>
<text x="40" y="84" class="sub">Bewerkingstijd (in de taak) versus wachttijd (op de pijl ertussen) — §25.5</text>

<rect x="30" y="110" width="900" height="300" class="panel" rx="4"/>

<!-- process fragment, sequential -->
<g>
  <!-- start event -->
  <circle cx="80" cy="260" r="20" class="starte"/>
  <text x="80" y="265" text-anchor="middle" font-size="9" fill="#55606F">start</text>

  <!-- flow 1: start -> ontvangen (laag) -->
  <path d="M100,260 L165,260" class="flow-laag"/>
  <polygon points="165,254 178,260 165,266" class="flowarrow-laag"/>
  <text x="130" y="245" text-anchor="middle" class="waitlabel">~10 min</text>

  <!-- task: mutatie ontvangen -->
  <rect x="178" y="215" width="130" height="90" rx="10" class="task"/>
  <circle cx="196" cy="232" r="7" class="icon"/><path d="M189,246 q7,-9 14,0" class="icon"/>
  <text x="243" y="255" text-anchor="middle" class="tasklabel">Mutatie</text>
  <text x="243" y="270" text-anchor="middle" class="tasklabel">ontvangen</text>
  <text x="243" y="288" text-anchor="middle" class="tasksub">(portaal, mens)</text>

  <!-- flow 2: ontvangen -> valideren (hoog) -->
  <path d="M308,260 L373,260" class="flow-hoog"/>
  <polygon points="373,254 386,260 373,266" class="flowarrow-hoog"/>
  <text x="340" y="230" text-anchor="middle" class="waitlabel">gem. 4,2 dagen</text>
  <text x="340" y="245" text-anchor="middle" class="tasksub">mens → legacy-batch</text>

  <!-- task: automatisch valideren -->
  <rect x="386" y="215" width="130" height="90" rx="10" class="task"/>
  <rect x="404" y="228" width="12" height="10" class="icon"/><circle cx="410" cy="224" r="4" class="icon"/>
  <text x="451" y="255" text-anchor="middle" class="tasklabel">Automatisch</text>
  <text x="451" y="270" text-anchor="middle" class="tasklabel">valideren</text>
  <text x="451" y="288" text-anchor="middle" class="tasksub">(legacy-batch)</text>

  <!-- flow 3: valideren -> verwerken (mid) -->
  <path d="M516,260 L581,260" class="flow-mid"/>
  <polygon points="581,254 594,260 581,266" class="flowarrow-mid"/>
  <text x="548" y="230" text-anchor="middle" class="waitlabel">gem. 6 uur</text>
  <text x="548" y="245" text-anchor="middle" class="tasksub">systeem → systeem</text>

  <!-- task: verwerken in polisdossier -->
  <rect x="594" y="215" width="130" height="90" rx="10" class="task"/>
  <rect x="612" y="228" width="12" height="10" class="icon"/><circle cx="618" cy="224" r="4" class="icon"/>
  <text x="659" y="255" text-anchor="middle" class="tasklabel">Verwerken in</text>
  <text x="659" y="270" text-anchor="middle" class="tasklabel">polisdossier</text>
  <text x="659" y="288" text-anchor="middle" class="tasksub">(legacy-batch)</text>

  <!-- flow 4: verwerken -> bevestigen (hoog) -->
  <path d="M724,260 L789,260" class="flow-hoog"/>
  <polygon points="789,254 802,260 789,266" class="flowarrow-hoog"/>
  <text x="756" y="230" text-anchor="middle" class="waitlabel">gem. 2,8 dagen</text>
  <text x="756" y="245" text-anchor="middle" class="tasksub">systeem → mens</text>

  <!-- task: bevestiging versturen -->
  <rect x="802" y="215" width="90" height="90" rx="10" class="task"/>
  <circle cx="820" cy="232" r="7" class="icon"/><path d="M813,246 q7,-9 14,0" class="icon"/>
  <text x="847" y="258" text-anchor="middle" class="tasklabel">Bevestiging</text>
  <text x="847" y="273" text-anchor="middle" class="tasklabel">versturen</text>
</g>

<!-- legend -->
<g>
  <rect x="60" y="370" width="20" height="14" class="flow-laag" stroke="none"/>
  <text x="86" y="382" class="legendtext">laag (&lt; 1 uur)</text>
  <rect x="220" y="370" width="20" height="14" class="flow-mid" stroke="none"/>
  <text x="246" y="382" class="legendtext">midden (uren)</text>
  <rect x="390" y="370" width="20" height="14" class="flow-hoog" stroke="none"/>
  <text x="416" y="382" class="legendtext">hoog (dagen) — wachttijd, geen bewerkingstijd</text>
</g>

<rect x="30" y="430" width="900" height="150" rx="6" class="callout"/>
<text x="50" y="454" class="calltitle">Doorlooptijd = bewerkingstijd + wachttijd (§25.5)</text>
<text x="50" y="474" class="calltext">De twee grootste wachttijden zitten allebei bij een overdracht tussen mens en het legacy-polisadministratie-</text>
<text x="50" y="490" class="calltext">systeem: van "ontvangen" naar "automatisch valideren" (gem. 4,2 dagen — wachten op de eerstvolgende batch-</text>
<text x="50" y="506" class="calltext">run) en van "verwerken" naar "bevestiging versturen" (gem. 2,8 dagen). Binnen elke taak zelf is de bewerkingstijd</text>
<text x="50" y="522" class="calltext">klein; het probleem zit niet in het werk, maar in het wachten ertussen — precies wat interviews vaak missen</text>
<text x="50" y="538" class="calltext">omdat niemand "wachten" als afzonderlijke activiteit ervaart of noemt (vergelijk deel 12, §12.4).</text>
<text x="50" y="558" class="calltext">Mutatieplatform-stappen (event-driven) tonen dit patroon niet — de batchgebonden legacy-schakel is de bottleneck.</text>
</svg>
