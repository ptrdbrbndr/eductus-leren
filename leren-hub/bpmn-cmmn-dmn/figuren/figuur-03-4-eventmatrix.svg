<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" font-family="'DM Sans', Arial, sans-serif" width="1000" height="800" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .evt-start { fill:#FBFAF7; stroke:#14213D; stroke-width:1.6; }
    .evt-inter { fill:#FBFAF7; stroke:#14213D; stroke-width:1.3; }
    .evt-end { fill:#FBFAF7; stroke:#14213D; stroke-width:3.6; }
    .evt-na { fill:#FBFAF7; stroke:#B9C2CE; stroke-width:1.3; stroke-dasharray:4 3; }
    .colhead { font-size:12.5px; font-weight:700; fill:#2563A8; text-anchor:middle; letter-spacing:.06em; }
    .rowhead { font-size:12.5px; font-weight:700; fill:#2563A8; text-anchor:start; letter-spacing:.06em; }
    .celllabel { font-size:10.5px; fill:#55606F; text-anchor:middle; }
    .na-label { font-size:11px; fill:#8a8f97; text-anchor:middle; font-style:italic; }
    .label { font-size:14px; font-weight:700; fill:#14213D; }
    .sub { font-size:11.5px; fill:#55606F; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    .footer { font-size:11px; fill:#55606F; }
    .gridline { stroke:#E3E0D8; stroke-width:1; }
  </style>
  <symbol id="ic-envelope" viewBox="0 0 14 10"><rect x="0.5" y="0.5" width="13" height="9" fill="#FBFAF7" stroke="#14213D" stroke-width="1.2"/><polyline points="0.5,0.5 7,6 13.5,0.5" fill="none" stroke="#14213D" stroke-width="1.2"/></symbol>
  <symbol id="ic-envelope-fill" viewBox="0 0 14 10"><rect x="0.5" y="0.5" width="13" height="9" fill="#14213D" stroke="#14213D" stroke-width="1.2"/><polyline points="0.5,0.5 7,6 13.5,0.5" fill="none" stroke="#FBFAF7" stroke-width="1.1"/></symbol>
  <symbol id="ic-clock" viewBox="0 0 14 14"><circle cx="7" cy="7" r="6.2" fill="#FBFAF7" stroke="#14213D" stroke-width="1.2"/><line x1="7" y1="7" x2="7" y2="3" stroke="#14213D" stroke-width="1.2"/><line x1="7" y1="7" x2="10" y2="8.5" stroke="#14213D" stroke-width="1.2"/></symbol>
</defs>
<rect width="1000" height="800" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 03 · BPMN-NOTATIE</text>
<text x="40" y="64" class="title">Figuur 3.4 — Eventmatrix: positie tegen trigger</text>
<text x="40" y="84" class="sub">Start = dunne rand, intermediate = dubbele dunne rand, end = dikke rand (reader §3.4)</text>

<!-- column headers -->
<text x="380" y="140" class="colhead">NONE</text>
<text x="610" y="140" class="colhead">MESSAGE</text>
<text x="840" y="140" class="colhead">TIMER</text>

<!-- gridlines -->
<line x1="150" y1="160" x2="960" y2="160" class="gridline"/>
<line x1="150" y1="345" x2="960" y2="345" class="gridline"/>
<line x1="150" y1="535" x2="960" y2="535" class="gridline"/>
<line x1="150" y1="720" x2="960" y2="720" class="gridline"/>
<line x1="150" y1="160" x2="150" y2="720" class="gridline"/>
<line x1="495" y1="160" x2="495" y2="720" class="gridline"/>
<line x1="725" y1="160" x2="725" y2="720" class="gridline"/>
<line x1="960" y1="160" x2="960" y2="720" class="gridline"/>

<!-- row headers -->
<text x="60" y="257" class="rowhead">START</text>
<text x="60" y="447" class="rowhead">INTERMEDIATE</text>
<text x="60" y="632" class="rowhead">END</text>

<!-- Row 1: start -->
<circle cx="380" cy="250" r="28" class="evt-start"/>
<text x="380" y="300" class="celllabel">leeg, geen trigger</text>

<circle cx="610" cy="250" r="28" class="evt-start"/>
<use href="#ic-envelope" x="603" y="245" width="14" height="10"/>
<text x="610" y="300" class="celllabel">bericht ontvangen (catching)</text>

<circle cx="840" cy="250" r="28" class="evt-start"/>
<use href="#ic-clock" x="833" y="243" width="14" height="14"/>
<text x="840" y="300" class="celllabel">tijdstip/duur bereikt (catching)</text>

<!-- Row 2: intermediate -->
<circle cx="380" cy="440" r="28" class="evt-inter"/>
<circle cx="380" cy="440" r="22" class="evt-inter"/>
<text x="380" y="490" class="celllabel">leeg, geen trigger</text>

<circle cx="610" cy="440" r="28" class="evt-inter"/>
<circle cx="610" cy="440" r="22" class="evt-inter"/>
<use href="#ic-envelope" x="603" y="435" width="14" height="10"/>
<text x="610" y="490" class="celllabel">bericht ontvangen (catching)</text>

<circle cx="840" cy="440" r="28" class="evt-inter"/>
<circle cx="840" cy="440" r="22" class="evt-inter"/>
<use href="#ic-clock" x="833" y="433" width="14" height="14"/>
<text x="840" y="490" class="celllabel">tijdstip/duur bereikt (catching)</text>

<!-- Row 3: end -->
<circle cx="380" cy="625" r="28" class="evt-end"/>
<text x="380" y="675" class="celllabel">leeg, geen trigger</text>

<circle cx="610" cy="625" r="28" class="evt-end"/>
<use href="#ic-envelope-fill" x="603" y="620" width="14" height="10"/>
<text x="610" y="675" class="celllabel">bericht verstuurd (throwing)</text>

<circle cx="840" cy="625" r="28" class="evt-na"/>
<text x="840" y="629" class="na-label">n.v.t.</text>
<text x="840" y="675" class="celllabel">timer kan niet throwen</text>

<line x1="40" y1="742" x2="960" y2="742" stroke="#E3E0D8" stroke-width="1"/>
<text x="40" y="764" class="footer">Icoon gevuld (navy) = throwing, icoon met witte vulling = catching. End events zijn per definitie throwing — een timer end event bestaat niet in BPMN 2.0.2.</text>
<text x="40" y="782" class="footer">Catching = wacht op iets (binnenkomend bericht, verstrijken van een timer); throwing = veroorzaakt zelf iets (uitgaand bericht) — reader §3.4.</text>
</svg>
