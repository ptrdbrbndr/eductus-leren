<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="'DM Sans', Arial, sans-serif" width="960" height="700" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .diamond { fill:#EEF2F7; stroke:#14213D; stroke-width:1.5; }
      .outcome-dmn { fill:#E9A13B; stroke:#14213D; stroke-width:1.5; }
      .outcome-bpmn { fill:#2563A8; stroke:#14213D; stroke-width:1.5; }
      .outcome-cmmn { fill:#14213D; stroke:#14213D; stroke-width:1.5; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:15px; font-weight:700; fill:#FBFAF7; }
      .qtext { font-size:13px; fill:#14213D; }
      .sub { font-size:11.5px; fill:#55606F; }
      .flowlabel { font-size:11.5px; font-weight:700; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.6; fill:none; marker-end:url(#arr); }
      .arrow-down { stroke:#14213D; stroke-width:1.6; fill:none; marker-end:url(#arr); stroke-dasharray:5 3; }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
</defs>
<rect width="960" height="700" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 08 · KEUZEBOOM</text>
<text x="40" y="64" class="title">Figuur 8.1 — De keuzeboom: drie vragen, in deze volgorde</text>
<text x="40" y="86" class="sub">DMN eerst getoetst — beslislogica zit het vaakst per ongeluk verstopt in de andere twee talen.</text>

<!-- Vraag 1 -->
<polygon points="230,120 430,120 490,175 430,230 230,230 170,175" class="diamond"/>
<text x="330" y="165" text-anchor="middle" class="qtext">Vraag 1 — Kun je de logica</text>
<text x="330" y="183" text-anchor="middle" class="qtext">beschrijven zonder tijd?</text>
<text x="330" y="201" text-anchor="middle" class="qtext" style="font-style:italic">(puur invoer en uitkomst,</text>
<text x="330" y="216" text-anchor="middle" class="qtext" style="font-style:italic">geen "eerst… dan…")</text>

<line x1="490" y1="175" x2="640" y2="175" class="arrow"/>
<text x="530" y="165" class="flowlabel">Ja</text>
<rect x="645" y="140" width="240" height="70" rx="8" class="outcome-dmn"/>
<text x="765" y="182" text-anchor="middle" class="label-light">→ DMN</text>

<line x1="330" y1="230" x2="330" y2="290" class="arrow-down"/>
<text x="340" y="262" class="flowlabel">Zo niet</text>

<!-- Vraag 2 -->
<polygon points="220,290 440,290 500,350 440,410 220,410 160,350" class="diamond"/>
<text x="330" y="330" text-anchor="middle" class="qtext">Vraag 2 — Heeft het werk een</text>
<text x="330" y="348" text-anchor="middle" class="qtext">vaste, voorspelbare volgorde</text>
<text x="330" y="366" text-anchor="middle" class="qtext">die je vooraf kunt</text>
<text x="330" y="384" text-anchor="middle" class="qtext">opschrijven?</text>

<line x1="500" y1="350" x2="640" y2="350" class="arrow"/>
<text x="530" y="340" class="flowlabel">Ja</text>
<rect x="645" y="315" width="240" height="70" rx="8" class="outcome-bpmn"/>
<text x="765" y="357" text-anchor="middle" class="label-light">→ BPMN</text>

<line x1="330" y1="410" x2="330" y2="470" class="arrow-down"/>
<text x="340" y="442" class="flowlabel">Zo niet</text>

<!-- Vraag 3 -->
<polygon points="200,470 460,470 520,545 460,620 200,620 140,545" class="diamond"/>
<text x="330" y="510" text-anchor="middle" class="qtext">Vraag 3 — Bepaalt een behandelaar,</text>
<text x="330" y="528" text-anchor="middle" class="qtext">op grond van wat er in het dossier</text>
<text x="330" y="546" text-anchor="middle" class="qtext">zit, wat er nu moet gebeuren,</text>
<text x="330" y="564" text-anchor="middle" class="qtext">in een volgorde die per geval</text>
<text x="330" y="582" text-anchor="middle" class="qtext">verschilt?</text>

<line x1="520" y1="545" x2="640" y2="545" class="arrow"/>
<text x="530" y="535" class="flowlabel">Ja</text>
<rect x="645" y="510" width="240" height="70" rx="8" class="outcome-cmmn"/>
<text x="765" y="552" text-anchor="middle" class="label-light">→ CMMN</text>

<rect x="645" y="600" width="280" height="60" rx="4" fill="#FBF6E9" stroke="#E3E0D8" stroke-width="1"/>
<text x="660" y="620" class="sub" style="font-size:11px">Vuistregels deel 2: "kan ik de volgorde</text>
<text x="660" y="636" class="sub" style="font-size:11px">opschrijven zonder 'het hangt ervan af'?"</text>
<text x="660" y="652" class="sub" style="font-size:11px">en "is er een dossier dat blijft bestaan?"</text>

</svg>
