<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="'DM Sans', Arial, sans-serif" width="980" height="560" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .party { fill:#FFFFFF; stroke:#14213D; stroke-width:1.8; }
      .partytitle { font-size:15px; font-weight:700; fill:#14213D; }
      .partysub { font-size:11px; fill:#55606F; }
      .koppel { fill:#FBF6E9; stroke:#E9A13B; stroke-width:1.6; }
      .koppellabel { font-size:11.5px; font-weight:700; fill:#8a5a12; }
      .koppelsub { font-size:10px; fill:#55606F; }
      .flow { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arr); }
      .flow-back { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arr); stroke-dasharray:6 4; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .sub { font-size:12px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .callout { fill:#FFFFFF; stroke:#14213D; stroke-width:1.3; }
      .calltitle { font-size:11.5px; font-weight:700; fill:#14213D; }
      .calltext { font-size:10.8px; fill:#55606F; }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
</defs>
<rect width="980" height="560" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 24 · CONCEPTDIAGRAM</text>
<text x="40" y="62" class="title">Figuur 24.3 — Ketenstandaarden in de waardeoverdrachtketen</text>
<text x="40" y="82" class="sub">Standaarden zitten op de koppelvlakken tussen partijen, niet binnen een partij (§24.4).</text>

<!-- Werkgevers party -->
<rect x="40" y="200" width="230" height="140" class="party" rx="8"/>
<text x="155" y="238" text-anchor="middle" class="partytitle">Werkgevers</text>
<text x="155" y="258" text-anchor="middle" class="partysub">leveren deelnemers- en</text>
<text x="155" y="272" text-anchor="middle" class="partysub">premiegegevens aan</text>
<text x="155" y="296" text-anchor="middle" class="partysub">(± 1.200 medewerkers</text>
<text x="155" y="310" text-anchor="middle" class="partysub">verwerken instroom)</text>

<!-- Meridiaan party (center, emphasized) -->
<rect x="375" y="180" width="230" height="180" class="party" rx="8" stroke-width="2.4"/>
<text x="490" y="220" text-anchor="middle" class="partytitle">Meridiaan Pensioen N.V.</text>
<text x="490" y="240" text-anchor="middle" class="partysub">pensioenuitvoerder</text>
<text x="490" y="264" text-anchor="middle" class="partysub">380.000 deelnemers</text>
<text x="490" y="284" text-anchor="middle" class="partysub">programma Stelselovergang:</text>
<text x="490" y="300" text-anchor="middle" class="partysub">invaren naar solidaire</text>
<text x="490" y="316" text-anchor="middle" class="partysub">premieregeling</text>
<text x="490" y="338" text-anchor="middle" class="partysub">uiterlijk 1 jan. 2028</text>

<!-- Andere uitvoerders party -->
<rect x="710" y="200" width="230" height="140" class="party" rx="8"/>
<text x="825" y="238" text-anchor="middle" class="partytitle">Andere pensioen-</text>
<text x="825" y="256" text-anchor="middle" class="partytitle">uitvoerders</text>
<text x="825" y="280" text-anchor="middle" class="partysub">bron of ontvanger van</text>
<text x="825" y="294" text-anchor="middle" class="partysub">waardeoverdracht bij</text>
<text x="825" y="308" text-anchor="middle" class="partysub">baanwisseling deelnemer</text>

<!-- koppelvlak 1: werkgevers - meridiaan -->
<rect x="278" y="230" width="90" height="80" class="koppel" rx="6"/>
<text x="323" y="252" text-anchor="middle" class="koppellabel">aanlevering</text>
<text x="323" y="266" text-anchor="middle" class="koppellabel">deelnemers-</text>
<text x="323" y="280" text-anchor="middle" class="koppellabel">gegevens</text>
<text x="323" y="298" text-anchor="middle" class="koppelsub">generiek/eigen formaat</text>
<line x1="270" y1="255" x2="278" y2="255" class="flow"/>
<line x1="368" y1="255" x2="375" y2="255" class="flow"/>

<!-- koppelvlak 2: meridiaan - andere uitvoerders -->
<rect x="613" y="230" width="90" height="80" class="koppel" rx="6"/>
<text x="658" y="248" text-anchor="middle" class="koppellabel">waarde-</text>
<text x="658" y="262" text-anchor="middle" class="koppellabel">overdracht</text>
<text x="658" y="280" text-anchor="middle" class="koppellabel">pensioenspecifieke</text>
<text x="658" y="294" text-anchor="middle" class="koppelsub">ketenstandaard</text>
<line x1="605" y1="255" x2="613" y2="255" class="flow"/>
<line x1="703" y1="255" x2="710" y2="255" class="flow-back"/>

<!-- callout: wie is leidend -->
<rect x="560" y="400" width="360" height="130" class="callout" rx="6"/>
<text x="580" y="424" class="calltitle">Vaststellen wie leidend is (§24.4)</text>
<text x="580" y="446" class="calltext">Bij dit koppelvlak hanteren Meridiaan en de</text>
<text x="580" y="462" class="calltext">andere uitvoerder mogelijk verschillende</text>
<text x="580" y="478" class="calltext">versies. Niet aannemen dat "onze standaard"</text>
<text x="580" y="494" class="calltext">leidend is — raadpleeg de actuele ketenafspraak,</text>
<text x="580" y="510" class="calltext">controleer de beherende partij, documenteer.</text>

<path d="M658,310 C658,360 658,380 658,398" stroke="#E9A13B" stroke-width="1.6" fill="none" stroke-dasharray="4 3" marker-end="url(#arr2)"/>
<defs>
  <marker id="arr2" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
</defs>

<!-- lower-left note on werkgevers link character -->
<rect x="60" y="400" width="440" height="90" class="callout" rx="6"/>
<text x="80" y="424" class="calltitle">Smaller bereik, dwingender karakter (§24.4)</text>
<text x="80" y="446" class="calltext">Ketenstandaarden regelen specifieke uitwisselingen —</text>
<text x="80" y="462" class="calltext">niet een hele procesarchitectuur zoals APQC PCF of BIAN —</text>
<text x="80" y="478" class="calltext">maar een ketenpartner die niet meedoet, breekt de keten.</text>

</svg>
