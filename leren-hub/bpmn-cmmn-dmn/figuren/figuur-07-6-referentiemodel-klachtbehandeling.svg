<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 980" font-family="'DM Sans', Arial, sans-serif" width="1300" height="980" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .case-fill { fill:#FFFFFF; stroke:#14213D; stroke-width:2; }
      .case-tab { fill:#14213D; }
      .stage-fill { fill:#EEF2F7; stroke:#14213D; stroke-width:1.75; }
      .stage-tab { fill:#EEF2F7; stroke:#14213D; stroke-width:1.75; }
      .task-fill { fill:#FFFFFF; stroke:#14213D; stroke-width:1.5; }
      .task-dashed { fill:#FFFFFF; stroke:#14213D; stroke-width:1.5; stroke-dasharray:6,4; }
      .milestone-fill { fill:#FBF6E9; stroke:#14213D; stroke-width:1.5; }
      .cfi-fill { fill:#CFE0F2; stroke:#14213D; stroke-width:1.25; }
      .chip-fill { fill:#FBFAF7; stroke:#14213D; stroke-width:1.1; }
      .label { font-size:12.5px; font-weight:700; fill:#14213D; }
      .label-light { font-size:12px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:10.5px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:26px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .note { font-size:12px; fill:#55606F; }
      .connector { stroke:#55606F; stroke-width:1.3; fill:none; stroke-dasharray:4,3; }
      .conn-navy { stroke:#14213D; stroke-width:1.6; fill:none; stroke-dasharray:5,3; marker-end:url(#arrn); }
      .conn-amber { stroke:#E9A13B; stroke-width:1.6; fill:none; stroke-dasharray:5,3; marker-end:url(#arra); }
      .navy-line { stroke:#14213D; stroke-width:2; }
      .amber-fill { fill:#E9A13B; }
      .sentry-fill { fill:#14213D; stroke:#14213D; }
      .badge { fill:#FBFAF7; stroke:#14213D; stroke-width:1.1; }
      .legend-hd { font-size:10.5px; font-weight:700; fill:#14213D; letter-spacing:.06em; }
    </style>
    <marker id="arrn" markerWidth="9" markerHeight="9" refX="5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="#14213D"/></marker>
    <marker id="arra" markerWidth="9" markerHeight="9" refX="5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="#E9A13B"/></marker>
    <g id="icon-doc">
      <path d="M0,0 H26 L33,7 V38 H0 Z" fill="#CFE0F2" stroke="#14213D" stroke-width="1.1"/>
      <path d="M26,0 L26,7 L33,7 Z" fill="#FBFAF7" stroke="#14213D" stroke-width="0.9"/>
    </g>
    <g id="icon-person">
      <circle cx="7" cy="4.6" r="3" fill="#14213D"/>
      <path d="M0.5,14 Q7,7 13.5,14 Z" fill="#14213D"/>
    </g>
    <g id="icon-grid">
      <rect x="0" y="0" width="18" height="13" rx="1.3" fill="none" stroke="#14213D" stroke-width="1.1"/>
      <line x1="0" y1="6.5" x2="18" y2="6.5" stroke="#14213D" stroke-width="1"/>
      <line x1="6" y1="0" x2="6" y2="13" stroke="#14213D" stroke-width="1"/>
      <line x1="12" y1="0" x2="12" y2="13" stroke="#14213D" stroke-width="1"/>
    </g>
    <g id="icon-case">
      <rect x="2" y="2" width="8" height="3.5" rx="1" fill="#FBFAF7" stroke="#14213D" stroke-width="1"/>
      <rect x="0" y="5" width="18" height="12" rx="2" fill="#FBFAF7" stroke="#14213D" stroke-width="1.1"/>
    </g>
    <g id="icon-checklist">
      <rect x="0" y="0" width="17" height="17" rx="2" fill="#FBF6E9" stroke="#14213D" stroke-width="1.1"/>
      <line x1="3.5" y1="4.5" x2="13.5" y2="4.5" stroke="#14213D" stroke-width="1"/>
      <line x1="3.5" y1="8.5" x2="13.5" y2="8.5" stroke="#14213D" stroke-width="1"/>
      <line x1="3.5" y1="12.5" x2="13.5" y2="12.5" stroke="#14213D" stroke-width="1"/>
    </g>
    <g id="icon-clock">
      <circle cx="9" cy="9" r="8" fill="#FBFAF7" stroke="#14213D" stroke-width="1.2"/>
      <line x1="9" y1="9" x2="9" y2="4" stroke="#14213D" stroke-width="1.2"/>
      <line x1="9" y1="9" x2="12.5" y2="10.5" stroke="#14213D" stroke-width="1.2"/>
    </g>
</defs>
<rect width="1300" height="980" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 07 · CMMN-NOTATIE</text>
<text x="40" y="64" class="title">Referentiemodel klachtbehandeling — Meridiaan Pensioen N.V.</text>
<text x="40" y="86" class="note">Het volledige model zoals stapsgewijs opgebouwd in het slidedeck: case file, stages, alle vier taaktypen, milestones, sentries, discretionary items en decorators.</text>

<!-- CASE FILE PANEL -->
<text x="40" y="118" class="kicker">CASE FILE</text>
<g>
  <use href="#icon-doc" x="40" y="135"/>
  <rect x="80" y="135" width="150" height="42" rx="6" class="cfi-fill"/>
  <text x="155" y="153" text-anchor="middle" class="label" style="font-size:11px">Klachtdossier</text>
  <text x="155" y="167" text-anchor="middle" class="sub">case file item</text>

  <use href="#icon-doc" x="40" y="200"/>
  <rect x="80" y="200" width="150" height="42" rx="6" class="cfi-fill"/>
  <text x="155" y="218" text-anchor="middle" class="label" style="font-size:11px">Polisgegevens</text>
  <text x="155" y="232" text-anchor="middle" class="sub">case file item</text>

  <use href="#icon-doc" x="40" y="265"/>
  <rect x="80" y="265" width="150" height="42" rx="6" class="cfi-fill"/>
  <text x="155" y="283" text-anchor="middle" class="label" style="font-size:11px">Berekening</text>
  <text x="155" y="297" text-anchor="middle" class="sub">case file item</text>

  <use href="#icon-doc" x="40" y="330"/>
  <rect x="80" y="330" width="150" height="42" rx="6" class="cfi-fill"/>
  <text x="155" y="348" text-anchor="middle" class="label" style="font-size:11px">Juridisch advies</text>
  <text x="155" y="362" text-anchor="middle" class="sub">case file item</text>
</g>
<path d="M230,156 C 250,156 250,215 320,224" class="connector"/>
<path d="M230,286 C 260,286 260,460 320,453" class="connector"/>
<path d="M230,351 C 400,351 900,300 985,290" class="connector"/>

<!-- CASE PLAN MODEL -->
<rect x="280" y="76" width="270" height="22" rx="4" class="case-tab"/>
<text x="292" y="92" class="label-light">CASE: Klachtbehandeling Meridiaan</text>
<rect x="260" y="93" width="1000" height="682" rx="16" class="case-fill"/>

<!-- case start event listener -->
<use href="#icon-clock" x="284" y="112"/>
<text x="288" y="150" class="sub">Case gestart</text>
<path d="M300,150 L300,168" class="conn-navy"/>

<!-- STAGE A -->
<rect x="315" y="127" width="180" height="17" rx="3" class="stage-tab"/>
<text x="323" y="140" class="sub" style="font-weight:700; font-size:10.5px">STAGE: Klacht vaststellen</text>
<rect x="300" y="140" width="390" height="375" rx="14" class="stage-fill"/>
<use href="#icon-checklist" x="655" y="150"/>

<g>
  <rect x="320" y="205" width="350" height="48" rx="10" class="task-fill"/>
  <use href="#icon-person" x="330" y="213"/>
  <circle cx="655" cy="207" r="10" class="amber-fill" stroke="#14213D" stroke-width="1"/>
  <text x="655" y="211" text-anchor="middle" style="font-size:12px; font-weight:800; fill:#14213D">!</text>
  <text x="495" y="233" text-anchor="middle" class="label">Dossier opvragen bij polisadministratie</text>

  <rect x="320" y="263" width="350" height="48" rx="10" class="task-fill"/>
  <use href="#icon-person" x="330" y="271"/>
  <circle cx="655" cy="265" r="10" class="badge"/>
  <path d="M650,260 A5.5,5.5 0 1 1 649,270" fill="none" stroke="#14213D" stroke-width="1.3" marker-end="url(#reparr2)"/>
  <text x="495" y="291" text-anchor="middle" class="label">Documenten opvragen</text>

  <rect x="320" y="321" width="350" height="48" rx="10" class="task-dashed"/>
  <use href="#icon-person" x="330" y="329"/>
  <text x="495" y="349" text-anchor="middle" class="label">Contact opnemen met deelnemer</text>

  <rect x="320" y="379" width="350" height="42" rx="21" class="milestone-fill"/>
  <circle cx="655" cy="379" r="10" class="amber-fill" stroke="#14213D" stroke-width="1"/>
  <text x="655" y="383" text-anchor="middle" style="font-size:12px; font-weight:800; fill:#14213D">!</text>
  <text x="495" y="404" text-anchor="middle" class="label">Milestone: oorzaak vastgesteld</text>

  <rect x="320" y="431" width="350" height="46" rx="10" class="task-fill"/>
  <use href="#icon-grid" x="330" y="440"/>
  <text x="495" y="458" text-anchor="middle" class="label">Ernst classificeren</text>
  <text x="495" y="472" text-anchor="middle" class="sub">decision task</text>
</g>

<!-- SENTRY CLUSTER between stages -->
<g>
  <rect x="698" y="384" width="100" height="34" rx="6" class="chip-fill"/>
  <text x="748" y="397" text-anchor="middle" class="sub" style="font-weight:700">on-part</text>
  <text x="748" y="411" text-anchor="middle" class="sub">milestone bereikt</text>

  <rect x="698" y="426" width="100" height="34" rx="6" class="chip-fill"/>
  <text x="748" y="439" text-anchor="middle" class="sub" style="font-weight:700">if-part</text>
  <text x="748" y="453" text-anchor="middle" class="sub">ernst = "hoog"</text>

  <path d="M670,400 L698,401" class="conn-navy"/>
  <path d="M670,454 L698,443" class="conn-amber"/>

  <circle cx="774" cy="424" r="14" fill="#FBFAF7" stroke="#14213D" stroke-width="1.4"/>
  <text x="774" y="428" text-anchor="middle" style="font-size:11px; font-weight:700; fill:#14213D">EN</text>
  <path d="M798,401 L788,417" class="conn-navy"/>
  <path d="M798,443 L788,431" class="conn-amber"/>

  <path d="M790,424 L800,424" class="conn-navy"/>
  <path d="M785,424 L800,409 L815,424 L800,439 Z" class="sentry-fill"/>
  <text x="800" y="470" text-anchor="middle" class="sub">entry criterion</text>
  <text x="800" y="483" text-anchor="middle" class="sub">stage B</text>
</g>

<!-- STAGE B -->
<rect x="815" y="127" width="190" height="17" rx="3" class="stage-tab"/>
<text x="823" y="140" class="sub" style="font-weight:700; font-size:10.5px">STAGE: Klacht afhandelen</text>
<rect x="800" y="140" width="430" height="375" rx="14" class="stage-fill"/>
<use href="#icon-checklist" x="1188" y="150"/>
<circle cx="1163" cy="158" r="10" class="badge"/>
<path d="M1158,158 L1162,162 L1169,153" fill="none" stroke="#14213D" stroke-width="1.5"/>
<text x="1150" y="180" text-anchor="end" class="sub">auto-complete</text>

<g>
  <rect x="820" y="205" width="390" height="48" rx="10" class="task-fill"/>
  <line x1="828" y1="211" x2="828" y2="247" class="navy-line"/>
  <line x1="833" y1="211" x2="833" y2="247" class="navy-line"/>
  <circle cx="1195" cy="207" r="10" class="badge"/>
  <path d="M1191,201 L1191,213 L1200,207 Z" fill="#14213D"/>
  <text x="1015" y="233" text-anchor="middle" class="label">Herberekening laten uitvoeren</text>

  <rect x="820" y="263" width="185" height="48" rx="10" class="task-dashed"/>
  <use href="#icon-person" x="830" y="271"/>
  <text x="912" y="291" text-anchor="middle" class="label" style="font-size:11px">Juridisch advies inwinnen</text>

  <rect x="1025" y="263" width="185" height="48" rx="10" class="task-dashed"/>
  <use href="#icon-person" x="1035" y="271"/>
  <text x="1117" y="291" text-anchor="middle" class="label" style="font-size:11px">Klacht direct afhandelen</text>

  <rect x="820" y="321" width="390" height="48" rx="10" class="task-dashed"/>
  <line x1="828" y1="327" x2="828" y2="363" class="navy-line"/>
  <line x1="833" y1="327" x2="833" y2="363" class="navy-line"/>
  <use href="#icon-case" x="985" y="331"/>
  <text x="1015" y="349" text-anchor="middle" class="label" style="font-size:11px">Deelklacht behandelen (case task)</text>

  <rect x="820" y="379" width="390" height="42" rx="21" class="milestone-fill"/>
  <circle cx="1195" cy="379" r="10" class="amber-fill" stroke="#14213D" stroke-width="1"/>
  <text x="1195" y="383" text-anchor="middle" style="font-size:12px; font-weight:800; fill:#14213D">!</text>
  <text x="1015" y="404" text-anchor="middle" class="label">Milestone: deelnemer geïnformeerd</text>
</g>

<text x="820" y="450" class="sub">Planning table (rechtsboven): "Juridisch advies inwinnen",</text>
<text x="820" y="464" class="sub">"Klacht direct afhandelen" en "Deelklacht behandelen" — door</text>
<text x="820" y="478" class="sub">de behandelaar zelf toe te voegen (gestippelde rand).</text>

<!-- Case-level milestone with exit sentry -->
<path d="M1015,421 C 1015,540 330,560 300,613" class="conn-navy"/>
<text x="700" y="555" text-anchor="middle" class="sub">on-part: milestone "deelnemer geïnformeerd" bereikt</text>

<path d="M288,625 L300,613 L312,625 L300,637 Z" class="sentry-fill"/>

<rect x="300" y="598" width="930" height="55" rx="27" class="milestone-fill"/>
<circle cx="1200" cy="602" r="11" class="amber-fill" stroke="#14213D" stroke-width="1"/>
<text x="1200" y="606" text-anchor="middle" style="font-size:13px; font-weight:800; fill:#14213D">!</text>
<text x="765" y="630" text-anchor="middle" class="label" style="font-size:15px">Milestone: klacht afgehandeld — case afgesloten</text>

<!-- LEGEND -->
<g transform="translate(40,800)">
  <text x="0" y="0" class="legend-hd">LEGENDA</text>

  <rect x="0" y="12" width="120" height="34" rx="8" class="stage-fill"/>
  <text x="60" y="33" text-anchor="middle" class="sub">Stage</text>

  <rect x="140" y="12" width="120" height="34" rx="8" class="task-fill"/>
  <use href="#icon-person" x="150" y="21"/>
  <text x="200" y="33" text-anchor="middle" class="sub">Human task</text>

  <rect x="280" y="12" width="120" height="34" rx="8" class="task-fill"/>
  <line x1="290" y1="18" x2="290" y2="40" class="navy-line" stroke-width="1.4"/>
  <line x1="294" y1="18" x2="294" y2="40" class="navy-line" stroke-width="1.4"/>
  <text x="345" y="33" text-anchor="middle" class="sub">Process / case task</text>

  <rect x="420" y="12" width="120" height="34" rx="8" class="task-fill"/>
  <use href="#icon-grid" x="430" y="21"/>
  <text x="480" y="33" text-anchor="middle" class="sub">Decision task</text>

  <rect x="560" y="12" width="120" height="34" rx="17" class="milestone-fill"/>
  <text x="620" y="33" text-anchor="middle" class="sub">Milestone</text>

  <rect x="700" y="12" width="120" height="34" rx="8" class="task-dashed"/>
  <text x="760" y="33" text-anchor="middle" class="sub">Discretionary item</text>

  <path d="M853,20 L863,29 L853,38 L843,29 Z" class="sentry-fill"/>
  <text x="900" y="33" text-anchor="middle" class="sub">Sentry (on-part+if-part)</text>

  <use href="#icon-doc" x="985" y="15"/>
  <text x="1030" y="33" text-anchor="middle" class="sub">Case file item</text>

  <use href="#icon-checklist" x="1085" y="15"/>
  <text x="1130" y="33" text-anchor="middle" class="sub">Planning table</text>

  <circle cx="1195" cy="29" r="10" class="amber-fill" stroke="#14213D" stroke-width="1"/>
  <text x="1195" y="33" text-anchor="middle" style="font-size:11px; font-weight:800; fill:#14213D">!</text>
  <text x="1195" y="52" text-anchor="middle" class="sub">Required</text>
</g>
<defs>
  <marker id="reparr2" markerWidth="8" markerHeight="8" refX="4" refY="2" orient="auto"><path d="M0,0 L4,2 L0,4 Z" fill="#14213D"/></marker>
</defs>
</svg>
