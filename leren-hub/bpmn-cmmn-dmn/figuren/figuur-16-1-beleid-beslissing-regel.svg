<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" font-family="'DM Sans', Arial, sans-serif" width="1000" height="700" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .band1 { fill:#FBF6E9; stroke:#14213D; stroke-width:1.6; }
    .band2 { fill:#CFE0F2; stroke:#14213D; stroke-width:1.6; }
    .band3 { fill:#EEF2F7; stroke:#14213D; stroke-width:1.6; }
    .divider { stroke:#14213D; stroke-width:1; stroke-dasharray:3 3; opacity:.5; }
    .layername { font-size:20px; font-weight:700; fill:#14213D; font-family:'Cormorant Garamond', Georgia, serif; }
    .desc { font-size:12px; fill:#14213D; }
    .example { font-size:11.5px; fill:#55606F; font-style:italic; }
    .ownerhead { font-size:10.5px; font-weight:700; fill:#2563A8; letter-spacing:.06em; }
    .ownertxt { font-size:12px; fill:#14213D; font-weight:600; }
    .arrow { stroke:#55606F; stroke-width:1.8; fill:none; marker-end:url(#arr); }
    .arrowlabel { font-size:10.5px; fill:#55606F; font-style:italic; }
    .label { font-size:14px; font-weight:700; fill:#14213D; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    .sub { font-size:12px; fill:#55606F; }
  </style>
  <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
</defs>
<rect width="1000" height="700" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 16 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Figuur 16.1 — Beleid, beslissing en regel: drie lagen, drie soorten eigenaarschap</text>
<text x="40" y="86" class="sub">Het onderscheid uit §16.1 bepaalt wie mag vaststellen, ontwerpen of wijzigen.</text>

<!-- Band 1: Beleid -->
<rect x="60" y="130" width="880" height="120" class="band1" rx="6"/>
<text x="84" y="164" class="layername">Beleid</text>
<text x="84" y="188" class="desc">Intentie op organisatieniveau, niet zelf uitvoerbaar — wel de bron</text>
<text x="84" y="204" class="desc">waaruit beslissingen en regels worden afgeleid.</text>
<text x="84" y="228" class="example">"Meridiaan streeft naar een zorgvuldige, uniforme beoordeling</text>
<text x="84" y="242" class="example">van vervroegde uittreding."</text>
<line x1="640" y1="146" x2="640" y2="234" class="divider"/>
<text x="664" y="164" class="ownerhead">EIGENAARSCHAP</text>
<text x="664" y="186" class="ownertxt">Management /</text>
<text x="664" y="204" class="ownertxt">compliance-functie</text>
<text x="664" y="228" class="example">stelt vast, herziet zelden</text>

<!-- Arrow 1 -->
<line x1="500" y1="250" x2="500" y2="288" class="arrow"/>
<text x="512" y="273" class="arrowlabel">wordt vertaald naar</text>

<!-- Band 2: Beslissing -->
<rect x="60" y="288" width="880" height="120" class="band2" rx="6"/>
<text x="84" y="322" class="layername">Beslissing</text>
<text x="84" y="346" class="desc">Het DMN-concept: een decision met een DRD-positie,</text>
<text x="84" y="362" class="desc">gedefinieerde invoer en uitkomst.</text>
<text x="84" y="386" class="example">"Definitief uitkeringspercentage" — de eindbeslissing uit de</text>
<text x="84" y="400" class="example">gedecomponeerde DRD (Figuur 15.1).</text>
<line x1="640" y1="304" x2="640" y2="392" class="divider"/>
<text x="664" y="322" class="ownerhead">EIGENAARSCHAP</text>
<text x="664" y="344" class="ownertxt">Modelleur, in overleg</text>
<text x="664" y="362" class="ownertxt">met vakinhoudelijk</text>
<text x="664" y="380" class="ownertxt">verantwoordelijke</text>
<text x="664" y="398" class="example">ontwerpkeuze: DRD, inputs, decompositie</text>

<!-- Arrow 2 -->
<line x1="500" y1="408" x2="500" y2="446" class="arrow"/>
<text x="512" y="431" class="arrowlabel">wordt uitgedrukt als</text>

<!-- Band 3: Regel -->
<rect x="60" y="446" width="880" height="120" class="band3" rx="6"/>
<text x="84" y="480" class="layername">Regel</text>
<text x="84" y="504" class="desc">De individuele bouwsteen binnen een beslissing — meestal een rij</text>
<text x="84" y="520" class="desc">in een beslistabel, of één voorwaarde in een FEEL-expressie.</text>
<text x="84" y="544" class="example">"Regel 1: leeftijd &gt; 65 → 3% korting" — een rij uit de tabel</text>
<text x="84" y="558" class="example">van Figuur 15.4.</text>
<line x1="640" y1="462" x2="640" y2="550" class="divider"/>
<text x="664" y="480" class="ownerhead">EIGENAARSCHAP</text>
<text x="664" y="502" class="ownertxt">Vakspecialist, met</text>
<text x="664" y="520" class="ownertxt">guardrails (§16.4)</text>
<text x="664" y="544" class="example">mag zelf wijzigen zonder de</text>
<text x="664" y="558" class="example">decision-structuur te raken</text>

<text x="60" y="610" class="sub" style="font-size:11.5px">Een organisatie die dit onderscheid niet maakt, laat óf de vakafdeling toe tot architectuurbeslissingen,</text>
<text x="60" y="628" class="sub" style="font-size:11.5px">óf blokkeert eenvoudige regelwijzigingen achter een zwaar wijzigingsproces dat daar niet voor bedoeld was (§16.1).</text>
</svg>
