<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'DM Sans', Arial, sans-serif" width="960" height="640" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .box { fill:#CFE0F2; stroke:#14213D; stroke-width:1.5; }
    .box-end { fill:#EEF2F7; stroke:#14213D; stroke-width:1.3; }
    .box-warn { fill:#FBF6E9; stroke:#E9A13B; stroke-width:1.3; stroke-dasharray:4,3; }
    .label { font-size:13px; font-weight:700; fill:#14213D; }
    .sub { font-size:11px; fill:#55606F; }
    .sub-amber { font-size:11px; fill:#9c6a1f; font-weight:600; }
    .lanehead { font-size:12.5px; font-weight:700; fill:#2563A8; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    .axis { stroke:#14213D; stroke-width:1.5; }
    .tick { stroke:#55606F; stroke-width:1.2; }
    .guide { stroke:#B9C4D0; stroke-width:1.3; stroke-dasharray:3,3; }
    .guide-amber { stroke:#E9A13B; stroke-width:1.6; stroke-dasharray:3,3; }
    .arrow { stroke:#55606F; stroke-width:1.6; fill:none; marker-end:url(#arr); }
    .arrow-amber { stroke:#E9A13B; stroke-width:2.2; fill:none; marker-end:url(#arrA); }
    .sentry { fill:#FFFFFF; stroke:#14213D; stroke-width:1.6; }
    .sentry-ghost { fill:#FFFFFF; stroke:#B9C4D0; stroke-width:1.4; }
  </style>
  <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
  <marker id="arrA" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
</defs>
<rect width="960" height="640" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 17 · TIJDLIJN</text>
<text x="40" y="64" class="title">Samengestelde sentry: welke transities vuren wanneer</text>
<text x="40" y="84" class="sub">Sentry S = onPart(Task A.complete) AND onPart(Milestone B.complete) — S vuurt pas bij de láátste van de twee.</text>

<!-- time axis -->
<line x1="80" y1="140" x2="900" y2="140" class="axis"/>
<line x1="900" y1="140" x2="892" y2="136" class="axis"/>
<line x1="900" y1="140" x2="892" y2="144" class="axis"/>
<text x="905" y="144" class="sub">tijd</text>
<line x1="320" y1="135" x2="320" y2="145" class="tick"/>
<text x="320" y="128" class="sub" text-anchor="middle">t2</text>
<line x1="620" y1="135" x2="620" y2="145" class="tick"/>
<text x="620" y="128" class="sub" text-anchor="middle">t4</text>

<!-- guides -->
<line x1="320" y1="150" x2="320" y2="365" class="guide"/>
<line x1="620" y1="150" x2="620" y2="365" class="guide-amber"/>

<!-- Lane: Task A -->
<text x="80" y="168" class="lanehead">Task A</text>
<rect x="140" y="172" width="180" height="30" rx="7" class="box"/>
<text x="230" y="192" class="label" text-anchor="middle">Active</text>
<circle cx="320" cy="187" r="5" fill="#14213D"/>
<text x="332" y="184" class="sub">Complete (t2)</text>

<!-- Lane: Milestone B -->
<text x="80" y="228" class="lanehead">Milestone B</text>
<line x1="140" y1="238" x2="620" y2="238" stroke="#2563A8" stroke-width="2"/>
<rect x="596" y="228" width="48" height="20" rx="10" fill="#CFE0F2" stroke="#14213D" stroke-width="1.4"/>
<text x="620" y="278" class="sub" text-anchor="middle">Complete (t4)</text>

<!-- ghost sentry at t2 -->
<g transform="translate(320,300)">
  <rect x="-8" y="-8" width="16" height="16" class="sentry-ghost" transform="rotate(45 0 0)"/>
</g>
<text x="320" y="325" class="sub" text-anchor="middle">nog niet — B</text>
<text x="320" y="337" class="sub" text-anchor="middle">is nog niet klaar</text>

<!-- Lane: Sentry -->
<text x="80" y="296" class="lanehead">Sentry S</text>
<g transform="translate(620,300)">
  <rect x="-10" y="-10" width="20" height="20" class="sentry" transform="rotate(45 0 0)"/>
</g>
<text x="620" y="326" class="sub-amber" text-anchor="middle">vuurt hier (t4)</text>
<text x="620" y="338" class="sub" text-anchor="middle">niet bij t2</text>

<!-- Lane: gevolg -->
<line x1="620" y1="312" x2="620" y2="358" class="arrow-amber"/>
<rect x="530" y="360" width="180" height="34" rx="7" class="box-end"/>
<text x="620" y="381" class="label" text-anchor="middle">Task C — Enabled</text>

<!-- separator -->
<line x1="30" y1="420" x2="930" y2="420" stroke="#E3E0D8" stroke-width="1.5"/>

<!-- Valkuil illustration -->
<text x="40" y="448" class="lanehead">Valkuil — sentry op "case file item X gewijzigd"</text>
<line x1="80" y1="470" x2="900" y2="470" class="axis"/>

<g transform="translate(220,470)">
  <circle cx="0" cy="0" r="5" fill="#E9A13B"/>
  <line x1="0" y1="0" x2="0" y2="40" class="guide-amber"/>
</g>
<g transform="translate(470,470)">
  <circle cx="0" cy="0" r="5" fill="#E9A13B"/>
  <line x1="0" y1="0" x2="0" y2="40" class="guide-amber"/>
</g>
<g transform="translate(720,470)">
  <circle cx="0" cy="0" r="5" fill="#E9A13B"/>
  <line x1="0" y1="0" x2="0" y2="40" class="guide-amber"/>
</g>
<text x="220" y="462" class="sub" text-anchor="middle">X gewijzigd</text>
<text x="470" y="462" class="sub" text-anchor="middle">X gewijzigd</text>
<text x="720" y="462" class="sub" text-anchor="middle">X gewijzigd</text>

<rect x="150" y="510" width="140" height="26" rx="6" class="box-warn"/>
<text x="220" y="527" class="sub-amber" text-anchor="middle">taak opnieuw beschikbaar</text>
<rect x="400" y="510" width="140" height="26" rx="6" class="box-warn"/>
<text x="470" y="527" class="sub-amber" text-anchor="middle">taak opnieuw beschikbaar</text>
<rect x="650" y="510" width="140" height="26" rx="6" class="box-warn"/>
<text x="720" y="527" class="sub-amber" text-anchor="middle">taak opnieuw beschikbaar</text>

<rect x="60" y="558" width="840" height="46" rx="6" fill="#FBF6E9" stroke="#E9A13B" stroke-width="1.3"/>
<text x="480" y="577" class="sub-amber" text-anchor="middle" font-size="12">Een sentry die reageert op "X gewijzigd" zonder uitsluiting vuurt bij élke wijziging — niet alleen bij de</text>
<text x="480" y="592" class="sub-amber" text-anchor="middle" font-size="12">eerste of de laatste. Een taak die eenmalig bedoeld was, komt dan herhaald beschikbaar.</text>
</svg>
