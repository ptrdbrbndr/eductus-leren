<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 500" font-family="'DM Sans', Arial, sans-serif" width="1080" height="500" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .state { fill:#FFFFFF; stroke:#14213D; stroke-width:1.6; }
    .statename { font-size:14px; font-weight:700; fill:#14213D; text-anchor:middle; }
    .statesub { font-size:10px; fill:#55606F; text-anchor:middle; }
    .startdot { fill:#14213D; }
    .endring { fill:#FBFAF7; stroke:#14213D; stroke-width:2; }
    .enddot { fill:#14213D; }
    .flow { stroke:#14213D; stroke-width:1.7; fill:none; marker-end:url(#arr); }
    .feedback { stroke:#E9A13B; stroke-width:1.6; fill:none; marker-end:url(#arramber); stroke-dasharray:5 3; }
    .flowlabel { font-size:11px; fill:#14213D; text-anchor:middle; }
    .feedbacklabel { font-size:10.5px; fill:#B5761F; text-anchor:middle; }
    .label { font-size:14px; font-weight:700; fill:#14213D; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    .sub { font-size:12px; fill:#55606F; }
    .note { font-size:11px; fill:#55606F; }
  </style>
  <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#14213D"/></marker>
  <marker id="arramber" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="#E9A13B"/></marker>
</defs>
<rect width="1080" height="500" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 16 · TOESTANDSDIAGRAM</text>
<text x="40" y="64" class="title">Figuur 16.3 — De levenscyclus van een regel</text>
<text x="40" y="86" class="sub">Concept, in review, vastgesteld, vervallen — parallel aan het statusmodel voor procesmodellen uit deel 21 (§16.3).</text>

<!-- start -->
<circle cx="60" cy="260" r="9" class="startdot"/>

<!-- Concept -->
<rect x="110" y="220" width="150" height="80" rx="10" class="state"/>
<text x="185" y="256" class="statename">Concept</text>
<text x="185" y="274" class="statesub">voorstel van een regel,</text>
<text x="185" y="288" class="statesub">bron nog te koppelen</text>

<!-- In review -->
<rect x="340" y="220" width="150" height="80" rx="10" class="state"/>
<text x="415" y="256" class="statename">In review</text>
<text x="415" y="274" class="statesub">getoetst op volledigheid</text>
<text x="415" y="288" class="statesub">en consistentie (§15.6)</text>

<!-- Vastgesteld -->
<rect x="570" y="220" width="150" height="80" rx="10" class="state"/>
<text x="645" y="256" class="statename">Vastgesteld</text>
<text x="645" y="274" class="statesub">actief, effectieve datum</text>
<text x="645" y="288" class="statesub">van kracht (§16.3)</text>

<!-- Vervallen -->
<rect x="800" y="220" width="150" height="80" rx="10" class="state"/>
<text x="875" y="256" class="statename">Vervallen</text>
<text x="875" y="274" class="statesub">blijft raadpleegbaar voor</text>
<text x="875" y="288" class="statesub">historische gevallen</text>

<!-- end -->
<circle cx="1010" cy="260" r="13" class="endring"/>
<circle cx="1010" cy="260" r="6" class="enddot"/>

<!-- main flow -->
<line x1="69" y1="260" x2="106" y2="260" class="flow"/>
<line x1="260" y1="260" x2="336" y2="260" class="flow"/>
<text x="298" y="248" class="flowlabel">ingediend</text>
<line x1="490" y1="260" x2="566" y2="260" class="flow"/>
<text x="528" y="248" class="flowlabel">goedgekeurd</text>
<line x1="720" y1="260" x2="796" y2="260" class="flow"/>
<text x="758" y="248" class="flowlabel">vervangen /</text>
<text x="758" y="260" class="flowlabel">ingetrokken</text>
<line x1="950" y1="260" x2="994" y2="260" class="flow"/>

<!-- feedback: in review -> concept (afgekeurd) -->
<path d="M415,300 C 415,360 185,360 185,302" class="feedback"/>
<text x="300" y="378" class="feedbacklabel">afgekeurd — terug voor herziening</text>

<!-- feedback: vastgesteld -> concept (wijziging) -->
<path d="M645,218 C 645,140 185,140 185,218" class="feedback"/>
<text x="415" y="128" class="feedbacklabel">wijziging voorgesteld → nieuwe versie in Concept</text>
<text x="415" y="142" class="feedbacklabel" style="font-size:9.5px">(oude versie blijft Vastgesteld tot de nieuwe effectief wordt)</text>

<text x="40" y="440" class="note">De oude versie van een vastgestelde regel wordt niet overschreven: hij gaat pas naar Vervallen op het</text>
<text x="40" y="456" class="note">moment dat de nieuwe versie effectief wordt — anders kan een historische herberekening niet meer (§16.5).</text>
</svg>
