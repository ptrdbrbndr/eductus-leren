<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="'DM Sans', Arial, sans-serif" width="960" height="660" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .navy { fill:#14213D; }
      .blue-dark { fill:#2563A8; }
      .blue-fill { fill:#CFE0F2; }
      .amber-fill { fill:#E9A13B; }
      .amber-light { fill:#FBF6E9; }
      .neutral-light { fill:#EEF2F7; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .body { font-size:11.5px; fill:#14213D; }
      .sub { font-size:11.5px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:26px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .axislabel { font-size:12px; fill:#14213D; font-weight:700; letter-spacing:.06em; }
      .axistick { font-size:10.5px; fill:#55606F; }
      .axis { stroke:#14213D; stroke-width:1.6; fill:none; marker-end:url(#arrax); }
      .leader { stroke:#55606F; stroke-width:1.2; stroke-dasharray:3,3; fill:none; }
      .dot { stroke:#14213D; stroke-width:1.4; }
    </style>
    <marker id="arrax" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#14213D"/></marker>
</defs>
<rect width="960" height="660" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 01 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Vier gebruiksdoelen tegen twee assen</text>

<!-- assen -->
<line x1="140" y1="590" x2="140" y2="110" class="axis"/>
<line x1="140" y1="590" x2="900" y2="590" class="axis"/>
<text x="60" y="115" class="axislabel" transform="rotate(0)">Detailniveau</text>
<text x="98" y="140" class="axistick">hoog</text>
<text x="90" y="575" class="axistick">laag</text>
<text x="700" y="618" class="axislabel">Publiek</text>
<text x="150" y="618" class="axistick">breed · management</text>
<text x="740" y="618" class="axistick">smal · technisch</text>

<!-- lichte diagonale trend-band -->
<path d="M170,560 C 350,470 600,260 870,140" stroke="#E3E0D8" stroke-width="26" fill="none" opacity="0.5" stroke-linecap="round"/>

<!-- Doel 1: Communiceren -->
<circle cx="230" cy="530" r="8" class="dot" fill="#2563A8"/>
<path d="M230,530 L230,470" class="leader"/>
<rect x="130" y="380" width="220" height="90" rx="8" fill="#CFE0F2" stroke="#14213D" stroke-width="1.2"/>
<text x="146" y="404" class="label">Communiceren</text>
<text x="146" y="424" class="sub">Publiek: management,</text>
<text x="146" y="438" class="sub">nieuwe medewerkers</text>
<text x="146" y="458" class="body">Eis: weinig elementen, één plaat,</text>
<text x="146" y="472" class="body" font-size="11">geen uitzonderingen</text>

<!-- Doel 2: Analyseren -->
<circle cx="420" cy="410" r="8" class="dot" fill="#E9A13B"/>
<path d="M420,410 L420,290" class="leader"/>
<rect x="320" y="150" width="220" height="90" rx="8" fill="#FBF6E9" stroke="#14213D" stroke-width="1.2"/>
<text x="336" y="174" class="label">Analyseren</text>
<text x="336" y="194" class="sub">Publiek: analist, verbeterteam</text>
<text x="336" y="216" class="body">Eis: volledigheid van varianten,</text>
<text x="336" y="230" class="body">meetpunten, knelpunten zichtbaar</text>

<!-- Doel 3: Specificeren -->
<circle cx="610" cy="290" r="8" class="dot" fill="#2563A8"/>
<path d="M610,290 L610,380" class="leader"/>
<rect x="530" y="390" width="220" height="90" rx="8" fill="#CFE0F2" stroke="#14213D" stroke-width="1.2"/>
<text x="546" y="414" class="label">Specificeren</text>
<text x="546" y="434" class="sub">Publiek: bouwteam, leverancier</text>
<text x="546" y="454" class="body">Eis: eenduidig, uitputtend, geen</text>
<text x="546" y="468" class="body">interpretatieruimte</text>

<!-- Doel 4: Uitvoeren -->
<circle cx="820" cy="160" r="8" class="dot" fill="#E9A13B"/>
<path d="M820,160 L820,240" class="leader"/>
<rect x="640" y="240" width="220" height="90" rx="8" fill="#FBF6E9" stroke="#14213D" stroke-width="1.2"/>
<text x="656" y="264" class="label">Uitvoeren</text>
<text x="656" y="284" class="sub">Publiek: een engine</text>
<text x="656" y="304" class="body">Eis: technisch compleet — expressies,</text>
<text x="656" y="318" class="body">koppelingen, foutafhandeling</text>

<text x="480" y="645" class="sub" text-anchor="middle" font-style="italic">Eén notatie, vier doelen die tegenstrijdige eisen stellen — vandaar gelaagde modellen (deel 5).</text>
</svg>
