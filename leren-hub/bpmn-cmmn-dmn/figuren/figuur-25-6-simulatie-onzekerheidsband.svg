<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .panel { fill:#FFFFFF; stroke:#E3E0D8; stroke-width:1.5; }
      .axis { stroke:#14213D; stroke-width:1.5; }
      .gridline { stroke:#E3E0D8; stroke-width:1; }
      .band { fill:#CFE0F2; opacity:.75; }
      .medline { stroke:#2563A8; stroke-width:2.4; fill:none; }
      .meddot { fill:#2563A8; }
      .pointline { stroke:#E9A13B; stroke-width:2.2; fill:none; stroke-dasharray:6,4; }
      .pointdot { fill:#E9A13B; stroke:#8a5a12; stroke-width:1; }
      .axistick { font-size:10.5px; fill:#55606F; }
      .scenariolabel { font-size:11px; font-weight:700; fill:#14213D; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .sub { font-size:12px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .legendtext { font-size:11.5px; fill:#14213D; }
      .callout { fill:#FBF6E9; stroke:#E9A13B; stroke-width:1.4; }
      .calltitle { font-size:11.5px; font-weight:700; fill:#8a5a12; }
      .calltext { font-size:10.6px; fill:#55606F; }
    </style>
</defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 25 · SIMULATIE-UITKOMST</text>
<text x="40" y="64" class="title">Figuur 25.6 — Doorlooptijd bij 20% capaciteitsdaling tijdens de stelselovergang</text>
<text x="40" y="84" class="sub">Bandbreedte versus schijnzekere puntschatting (§25.6)</text>

<rect x="40" y="105" width="880" height="360" class="panel" rx="4"/>

<!-- axes -->
<g>
  <line x1="110" y1="420" x2="880" y2="420" class="axis"/>
  <line x1="110" y1="130" x2="110" y2="420" class="axis"/>
  <line x1="110" y1="130" x2="880" y2="130" class="gridline"/>
  <line x1="110" y1="202" x2="880" y2="202" class="gridline"/>
  <line x1="110" y1="275" x2="880" y2="275" class="gridline"/>
  <line x1="110" y1="347" x2="880" y2="347" class="gridline"/>
  <text x="98" y="424" text-anchor="end" class="axistick">0</text>
  <text x="98" y="351" text-anchor="end" class="axistick">+10d</text>
  <text x="98" y="279" text-anchor="end" class="axistick">+20d</text>
  <text x="98" y="206" text-anchor="end" class="axistick">+30d</text>
  <text x="98" y="134" text-anchor="end" class="axistick">+40d</text>
  <text x="55" y="275" text-anchor="middle" class="axistick" transform="rotate(-90,55,275)">toename doorlooptijd</text>
</g>

<!-- x scenario labels -->
<g>
  <text x="150" y="440" text-anchor="middle" class="scenariolabel">Nu</text>
  <text x="330" y="440" text-anchor="middle" class="scenariolabel">Fase 1</text>
  <text x="510" y="440" text-anchor="middle" class="scenariolabel">Fase 2</text>
  <text x="690" y="440" text-anchor="middle" class="scenariolabel">Fase 3</text>
  <text x="840" y="440" text-anchor="middle" class="scenariolabel">Stabilisatie</text>
  <text x="690" y="454" text-anchor="middle" class="sub" font-size="9.5">(capaciteit −20%)</text>
</g>

<!-- uncertainty band: low and high path -->
<path d="M150,420 L330,395 L510,300 L690,175 L840,230 L840,300 L690,270 L510,355 L330,410 L150,420 Z" class="band"/>

<!-- median line -->
<path d="M150,420 L330,403 L510,328 L690,222 L840,265" class="medline"/>
<circle cx="150" cy="420" r="4" class="meddot"/>
<circle cx="330" cy="403" r="4" class="meddot"/>
<circle cx="510" cy="328" r="4" class="meddot"/>
<circle cx="690" cy="222" r="4" class="meddot"/>
<circle cx="840" cy="265" r="4" class="meddot"/>

<!-- single-point "precise" estimate line: +14% at fase 3, looks precise but sits outside band edge -->
<path d="M150,420 L330,400 L510,340 L690,197 L840,197" class="pointline"/>
<circle cx="690" cy="197" r="5" class="pointdot"/>
<text x="700" y="192" class="calltitle" font-size="10.5">"+14%" — precieze puntschatting</text>

<!-- legend -->
<g>
  <rect x="620" y="140" width="18" height="14" class="band" stroke="none"/>
  <text x="644" y="151" class="legendtext">onzekerheidsmarge (basisscenario)</text>
</g>
<g>
  <line x1="620" y1="168" x2="638" y2="168" class="medline"/>
  <text x="644" y="172" class="legendtext">mediaanschatting</text>
</g>
<g>
  <line x1="620" y1="186" x2="638" y2="186" class="pointline"/>
  <text x="644" y="190" class="legendtext">"precieze" puntschatting — schijnzekerheid</text>
</g>

<rect x="40" y="480" width="880" height="120" rx="6" class="callout"/>
<text x="58" y="502" class="calltitle">Schijnzekerheid (§25.6, vergelijk §23.3)</text>
<text x="58" y="520" class="calltext">"Doorlooptijd stijgt met 14%" oogt gezaghebbender dan een bandbreedte van +18 tot +34 dagen — maar berust</text>
<text x="58" y="536" class="calltext">op precies dezelfde onzekere aannames (aankomsttijden, capaciteit per rol, prioriteringsregels). De precisie van</text>
<text x="58" y="552" class="calltext">het getal zegt niets over de betrouwbaarheid ervan. Bij Fase 3 valt de "precieze" schatting zelfs buiten de rand</text>
<text x="58" y="568" class="calltext">van de bandbreedte — een teken dat de onderliggende aannames niet dezelfde zijn, ook al wordt dat niet gezegd.</text>
</svg>
