<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="'DM Sans', Arial, sans-serif" width="960" height="700" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .navy { fill:#14213D; }
      .blue-dark { fill:#2563A8; }
      .blue-fill { fill:#CFE0F2; }
      .amber-fill { fill:#E9A13B; }
      .amber-light { fill:#FBF6E9; }
      .neutral-light { fill:#EEF2F7; }
      .card-body { fill:#FFFFFF; }
      .label { font-size:15px; font-weight:700; fill:#14213D; }
      .label-light { font-size:15px; font-weight:700; fill:#FBFAF7; text-anchor:middle; }
      .body { font-size:12.5px; fill:#14213D; }
      .sub { font-size:12px; fill:#55606F; }
      .tag { font-size:11px; fill:#55606F; font-style:italic; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:26px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .mkicker { font-size:10.5px; fill:#2563A8; font-weight:700; letter-spacing:.08em; }
      .arrow { stroke:#55606F; stroke-width:1.6; fill:none; marker-end:url(#arr); }
      .arrow2 { stroke:#14213D; stroke-width:1.4; fill:none; marker-end:url(#arrnavy); }
      .thin { stroke:#14213D; stroke-width:1.3; fill:none; }
      .stroke-navy { stroke:#14213D; stroke-width:1.5; }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrnavy" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#14213D"/></marker>
</defs>
<rect width="960" height="700" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 01 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Drie soorten werk — en hoe je ze herkent</text>

<!-- ===================== KOLOM 1: ROUTINEWERK ===================== -->
<g>
  <rect x="40" y="100" width="280" height="520" rx="12" class="card-body" stroke="#CFE0F2" stroke-width="1.5"/>
  <rect x="40" y="100" width="280" height="46" rx="12" class="blue-dark"/>
  <rect x="40" y="122" width="280" height="24" class="blue-dark"/>
  <text x="180" y="129" class="label-light">Routinewerk</text>

  <!-- icoon: lineaire keten -->
  <g transform="translate(180,205)">
    <rect x="-96" y="-14" width="28" height="28" rx="5" class="blue-fill" stroke="#14213D" stroke-width="1.2"/>
    <rect x="-38" y="-14" width="28" height="28" rx="5" class="blue-fill" stroke="#14213D" stroke-width="1.2"/>
    <rect x="20" y="-14" width="28" height="28" rx="5" class="blue-fill" stroke="#14213D" stroke-width="1.2"/>
    <rect x="78" y="-14" width="28" height="28" rx="5" class="blue-fill" stroke="#14213D" stroke-width="1.2"/>
    <path d="M-68,0 L-40,0" class="arrow"/>
    <path d="M-10,0 L18,0" class="arrow"/>
    <path d="M48,0 L76,0" class="arrow"/>
  </g>
  <text x="180" y="248" class="sub" text-anchor="middle">eerst dit, dan dat — vaste volgorde</text>

  <text x="60" y="282" class="body">Vaste volgorde. De stappen liggen</text>
  <text x="60" y="300" class="body">vast, de uitkomst is voorspelbaar.</text>
  <text x="60" y="318" class="body">Afwijkingen zijn uitzonderingen die</text>
  <text x="60" y="336" class="body">je apart benoemt.</text>

  <rect x="60" y="480" width="240" height="118" rx="8" class="neutral-light" stroke="#14213D" stroke-width="1"/>
  <text x="76" y="502" class="mkicker">MERIDIAAN PENSIOEN</text>
  <text x="76" y="524" class="body" font-weight="700">E-mailadreswijziging</text>
  <text x="76" y="542" class="body" font-weight="700">verwerken</text>
  <text x="76" y="564" class="tag">hoog volume</text>
  <text x="76" y="580" class="tag">hoge automatiseringsgraad</text>
</g>

<!-- ===================== KOLOM 2: DOSSIERWERK ===================== -->
<g>
  <rect x="340" y="100" width="280" height="520" rx="12" class="card-body" stroke="#14213D" stroke-width="1.5"/>
  <rect x="340" y="100" width="280" height="46" rx="12" class="navy"/>
  <rect x="340" y="122" width="280" height="24" class="navy"/>
  <text x="480" y="129" class="label-light">Dossierwerk</text>

  <!-- icoon: dossier met niet-lineaire routes -->
  <g transform="translate(480,205)">
    <rect x="-16" y="-18" width="32" height="36" rx="4" class="neutral-light" stroke="#14213D" stroke-width="1.2"/>
    <path d="M-14,-10 h24 M-14,-2 h24 M-14,6 h16" stroke="#14213D" stroke-width="1.1" fill="none"/>
    <circle cx="-70" cy="-24" r="9" class="blue-fill" stroke="#14213D" stroke-width="1"/>
    <circle cx="70" cy="-24" r="9" class="blue-fill" stroke="#14213D" stroke-width="1"/>
    <circle cx="-70" cy="26" r="9" class="blue-fill" stroke="#14213D" stroke-width="1"/>
    <circle cx="70" cy="26" r="9" class="blue-fill" stroke="#14213D" stroke-width="1"/>
    <path d="M-62,-22 L-18,-12" class="arrow2"/>
    <path d="M-16,-6 L-62,22" class="arrow2"/>
    <path d="M18,-12 L62,-22" class="arrow2"/>
    <path d="M62,22 L16,-4" class="arrow2"/>
  </g>
  <text x="480" y="248" class="sub" text-anchor="middle">behandelaar bepaalt: wat nu?</text>

  <text x="360" y="282" class="body">Geen vaste volgorde. Er is een</text>
  <text x="360" y="300" class="body">dossier en dingen die kunnen</text>
  <text x="360" y="318" class="body">gebeuren — een behandelaar</text>
  <text x="360" y="336" class="body">bepaalt wat er nu moet.</text>

  <rect x="360" y="480" width="240" height="118" rx="8" class="neutral-light" stroke="#14213D" stroke-width="1"/>
  <text x="376" y="502" class="mkicker">MERIDIAAN PENSIOEN</text>
  <text x="376" y="524" class="body" font-weight="700">Klacht over een</text>
  <text x="376" y="542" class="body" font-weight="700">pensioenberekening</text>
  <text x="376" y="564" class="tag">laag volume</text>
  <text x="376" y="580" class="tag">hoge complexiteit</text>
</g>

<!-- ===================== KOLOM 3: OORDEELSWERK ===================== -->
<g>
  <rect x="640" y="100" width="280" height="520" rx="12" class="card-body" stroke="#E9A13B" stroke-width="1.5"/>
  <rect x="640" y="100" width="280" height="46" rx="12" class="amber-fill"/>
  <rect x="640" y="122" width="280" height="24" class="amber-fill"/>
  <text x="780" y="129" class="label-light" fill="#14213D">Oordeelswerk</text>

  <!-- icoon: trechter naar tabel -->
  <g transform="translate(780,205)">
    <path d="M-70,-22 L-14,-4 M-70,0 L-14,-2 M-70,22 L-14,0" stroke="#14213D" stroke-width="1.3" fill="none"/>
    <rect x="-14" y="-16" width="34" height="32" rx="3" class="amber-light" stroke="#14213D" stroke-width="1.2"/>
    <path d="M-14,-4 h34 M3,-16 v32" stroke="#14213D" stroke-width="1"/>
    <path d="M20,0 L60,0" class="arrow2"/>
    <circle cx="72" cy="0" r="9" class="amber-fill" stroke="#14213D" stroke-width="1"/>
  </g>
  <text x="780" y="248" class="sub" text-anchor="middle">invoer → regels → conclusie</text>

  <text x="660" y="282" class="body">Geen werk in de tijd, maar een</text>
  <text x="660" y="300" class="body">conclusie uit gegevens. Er is</text>
  <text x="660" y="318" class="body">invoer en uitkomst; de regels</text>
  <text x="660" y="336" class="body">komen uit wetgeving of beleid.</text>

  <rect x="660" y="480" width="240" height="118" rx="8" class="neutral-light" stroke="#14213D" stroke-width="1"/>
  <text x="676" y="502" class="mkicker">MERIDIAAN PENSIOEN</text>
  <text x="676" y="524" class="body" font-weight="700">Is deze mutatie risicovol</text>
  <text x="676" y="542" class="body" font-weight="700">genoeg voor handmatige</text>
  <text x="676" y="560" class="body" font-weight="700">controle?</text>
  <text x="676" y="580" class="tag">bijv. bij een waardeoverdracht</text>
</g>

<!-- Voetnoot: waardeoverdracht overlapt routine en dossier -->
<path d="M320,660 C 380,680 420,680 480,660" fill="none" stroke="#55606F" stroke-width="1.2" stroke-dasharray="3,3"/>
<text x="400" y="678" class="tag" text-anchor="middle" font-size="11.5">waardeoverdracht: deels routine, deels dossier</text>

<text x="40" y="665" class="sub">Alle drie zitten in de praktijk door elkaar — precies daarom zijn er drie talen nodig.</text>
</svg>
