<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" font-family="'DM Sans', Arial, sans-serif" width="1400" height="800" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .pool { fill:#FFFFFF; stroke:#14213D; stroke-width:1.5; }
    .pool-band { fill:#CFE0F2; stroke:#14213D; stroke-width:1.5; }
    .lane-band { fill:#EEF2F7; }
    .pool-name { font-size:12px; font-weight:700; fill:#14213D; }
    .lane-name { font-size:10.5px; font-weight:700; fill:#14213D; }
    .task { fill:#CFE0F2; stroke:#14213D; stroke-width:1.4; }
    .task-label { font-size:11px; fill:#14213D; text-anchor:middle; }
    .evt-start { fill:#FBFAF7; stroke:#14213D; stroke-width:1.6; }
    .evt-end { fill:#FBFAF7; stroke:#14213D; stroke-width:3.2; }
    .evt-label { font-size:10.5px; fill:#14213D; text-anchor:middle; }
    .gateway { fill:#FBFAF7; stroke:#14213D; stroke-width:1.7; }
    .gw-mark { stroke:#14213D; stroke-width:2.2; stroke-linecap:round; }
    .gw-label { font-size:11px; font-weight:700; fill:#14213D; text-anchor:middle; }
    .icon { stroke:#14213D; stroke-width:1.2; fill:none; stroke-linejoin:round; stroke-linecap:round; }
    .seq { stroke:#14213D; stroke-width:1.6; fill:none; marker-end:url(#seqarr); }
    .msg { stroke:#55606F; stroke-width:1.3; stroke-dasharray:4 3; fill:none; marker-end:url(#msgarr); marker-start:url(#msgcirc); }
    .assoc { stroke:#55606F; stroke-width:1.1; stroke-dasharray:2.5 2.5; fill:none; marker-end:url(#assocarr); }
    .dataobj { fill:#FFFFFF; stroke:#14213D; stroke-width:1.3; }
    .cond { font-size:10.5px; fill:#2563A8; font-weight:700; }
    .default-tick { stroke:#14213D; stroke-width:1.8; }
    .label { font-size:14px; font-weight:700; fill:#14213D; }
    .sub { font-size:11.5px; fill:#55606F; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    .footer { font-size:11px; fill:#55606F; }
    .legend-text { font-size:10.5px; fill:#55606F; }
  </style>
  <marker id="seqarr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#14213D"/></marker>
  <marker id="msgarr" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#55606F" stroke-width="1.3"/></marker>
  <marker id="msgcirc" markerWidth="8" markerHeight="8" refX="3" refY="3" orient="auto"><circle cx="3" cy="3" r="2.6" fill="#FBFAF7" stroke="#55606F" stroke-width="1.1"/></marker>
  <marker id="assocarr" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0,0 L5,3 L0,6" fill="none" stroke="#55606F" stroke-width="1"/></marker>
  <symbol id="ic-envelope-sm" viewBox="0 0 14 10"><rect x="0.5" y="0.5" width="13" height="9" class="icon"/><polyline points="0.5,0.5 7,6 13.5,0.5" class="icon"/></symbol>
  <symbol id="ic-send" viewBox="0 0 20 16"><rect x="0.5" y="3.5" width="17" height="11" class="icon"/><polyline points="0.5,3.5 9,10 17.5,3.5" class="icon"/><path d="M12,3 L19,0.5 M19,0.5 L16.5,1 M19,0.5 L18.3,3" class="icon"/></symbol>
  <symbol id="ic-person" viewBox="0 0 16 16"><circle cx="8" cy="4.2" r="3" class="icon"/><path d="M2,15.5 C2,10.5 5,8.3 8,8.3 C11,8.3 14,10.5 14,15.5" class="icon"/></symbol>
  <symbol id="ic-gear" viewBox="0 0 18 18"><circle cx="9" cy="9" r="4" class="icon"/><circle cx="9" cy="9" r="1.5" fill="#14213D"/><g class="icon"><line x1="9" y1="1" x2="9" y2="4"/><line x1="9" y1="14" x2="9" y2="17"/><line x1="1" y1="9" x2="4" y2="9"/><line x1="14" y1="9" x2="17" y2="9"/><line x1="3.2" y1="3.2" x2="5.3" y2="5.3"/><line x1="12.7" y1="12.7" x2="14.8" y2="14.8"/><line x1="14.8" y1="3.2" x2="12.7" y2="5.3"/><line x1="5.3" y1="12.7" x2="3.2" y2="14.8"/></g></symbol>
</defs>
<rect width="1400" height="800" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 03 · BPMN-NOTATIE</text>
<text x="40" y="64" class="title">Figuur 3.6 — Referentiemodel e-mailadreswijziging (compleet)</text>
<text x="40" y="84" class="sub">Stapsgewijs opgebouwd in het slidedeck (slides 7–24) — casus Meridiaan Pensioen N.V.</text>

<!-- Pool Deelnemer -->
<rect x="40" y="170" width="260" height="140" class="pool" rx="3"/>
<text x="52" y="192" class="pool-name">Deelnemer</text>
<line x1="40" y1="200" x2="300" y2="200" stroke="#14213D" stroke-width="1"/>
<circle cx="85" cy="255" r="12" class="evt-start"/>
<rect x="120" y="228" width="110" height="54" rx="10" class="task"/>
<use href="#ic-send" x="128" y="234" width="18" height="14"/>
<text x="175" y="256" class="task-label">Adreswijziging</text>
<text x="175" y="269" class="task-label">indienen</text>
<circle cx="272" cy="255" r="13" class="evt-end"/>
<line x1="97" y1="255" x2="120" y2="255" class="seq"/>
<line x1="230" y1="255" x2="258" y2="255" class="seq"/>
<text x="272" y="335" class="footer" text-anchor="middle">Aanvraag verstuurd</text>

<!-- Pool Meridiaan -->
<rect x="380" y="100" width="980" height="580" class="pool" rx="3"/>
<rect x="380" y="100" width="24" height="580" class="pool-band"/>
<text class="pool-name" transform="rotate(-90 392 390)" x="392" y="390" text-anchor="middle">Meridiaan Pensioen N.V.</text>
<rect x="404" y="100" width="20" height="580" class="lane-band"/>
<line x1="404" y1="390" x2="1360" y2="390" stroke="#14213D" stroke-width="1"/>
<line x1="424" y1="100" x2="424" y2="680" stroke="#14213D" stroke-width="1"/>
<text class="lane-name" transform="rotate(-90 414 245)" x="414" y="245" text-anchor="middle">Portaal</text>
<text class="lane-name" transform="rotate(-90 414 535)" x="414" y="535" text-anchor="middle" style="font-size:9.5px">Medewerker Klantcontact</text>

<!-- Portaal lane: message start event -->
<circle cx="470" cy="240" r="12" class="evt-start"/>
<use href="#ic-envelope-sm" x="463" y="235" width="14" height="10"/>
<line x1="482" y1="240" x2="520" y2="240" class="seq"/>

<!-- Formaat controleren -->
<rect x="520" y="213" width="150" height="54" rx="10" class="task"/>
<use href="#ic-gear" x="528" y="220" width="18" height="18"/>
<text x="595" y="240" class="task-label">Formaat</text>
<text x="595" y="253" class="task-label">controleren</text>
<line x1="670" y1="240" x2="712" y2="240" class="seq"/>

<!-- Gateway: Formaat geldig? -->
<polygon points="738,218 760,240 738,262 716,240" class="gateway"/>
<line x1="728" y1="230" x2="748" y2="250" class="gw-mark"/>
<line x1="748" y1="230" x2="728" y2="250" class="gw-mark"/>
<text x="738" y="203" class="gw-label">Formaat geldig?</text>

<!-- Ja: Adres bijwerken -->
<line x1="760" y1="240" x2="798" y2="240" class="seq"/>
<text x="775" y="228" class="cond">Ja</text>
<rect x="800" y="213" width="150" height="54" rx="10" class="task"/>
<use href="#ic-gear" x="808" y="220" width="18" height="18"/>
<text x="875" y="240" class="task-label">Adres</text>
<text x="875" y="253" class="task-label">bijwerken</text>
<line x1="950" y1="240" x2="983" y2="240" class="seq"/>
<circle cx="1008" cy="240" r="14" class="evt-end"/>
<text x="1008" y="280" class="evt-label">Adres bijgewerkt</text>

<!-- Data object between the two Portaal-activiteiten -->
<path d="M710,110 L710,174 L766,174 L766,120 L756,110 Z" class="dataobj"/>
<path d="M756,110 L756,120 L766,120" fill="none" stroke="#14213D" stroke-width="1.1"/>
<text x="738" y="192" class="footer" text-anchor="middle">Adresmutatie</text>
<path d="M600,213 C 640,180 690,175 718,172" class="assoc"/>
<path d="M756,172 C 800,172 850,190 875,213" class="assoc"/>

<!-- Nee (default): naar Medewerker Klantcontact -->
<line x1="738" y1="262" x2="738" y2="458" class="seq"/>
<line x1="731" y1="275" x2="745" y2="289" class="default-tick"/>
<text x="748" y="335" class="cond">Nee (default)</text>

<!-- Medewerker Klantcontact lane -->
<rect x="663" y="460" width="150" height="54" rx="10" class="task"/>
<use href="#ic-person" x="671" y="467" width="18" height="18"/>
<text x="738" y="486" class="task-label">Mutatie handmatig</text>
<text x="738" y="499" class="task-label">controleren</text>
<line x1="813" y1="487" x2="936" y2="487" class="seq"/>
<circle cx="960" cy="487" r="14" class="evt-end"/>
<text x="960" y="527" class="evt-label">Mutatie handmatig verwerkt</text>

<!-- Message flow Deelnemer -> Portaal -->
<path d="M175,228 C 175,150 400,150 458,235" class="msg"/>

<!-- Legend -->
<line x1="424" y1="708" x2="464" y2="708" class="seq"/>
<text x="472" y="712" class="legend-text">sequence flow</text>
<line x1="424" y1="726" x2="464" y2="726" class="msg"/>
<text x="472" y="730" class="legend-text">message flow</text>
<line x1="424" y1="744" x2="464" y2="744" class="assoc"/>
<text x="472" y="748" class="legend-text">data association</text>
<line x1="620" y1="700" x2="632" y2="712" class="default-tick"/>
<text x="640" y="712" class="legend-text">default flow marker</text>

<text x="40" y="762" class="footer">Opbouw (slidedeck): pool Meridiaan (slide 7) → lanes Portaal/Medewerker (slide 9) → activiteiten (slide 14) → start-/eindevents (slide 18) → gateway (slide 23) → data object (slide 24).</text>
<text x="40" y="780" class="footer">Aanname: de pool Deelnemer en het bijbehorende message flow zijn toegevoegd uit reader §3.2 om het model tot een volledig referentiemodel te maken.</text>
</svg>
