<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="'DM Sans', Arial, sans-serif" width="960" height="700" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .card { fill:#FFFFFF; stroke:#CFE0F2; stroke-width:1.25; }
      .card-title { font-size:13.5px; font-weight:700; fill:#14213D; }
      .card-doc-label { font-size:10.5px; fill:#55606F; font-style:italic; }
      .card-doc-text { font-size:11px; fill:#8A93A0; }
      .card-gedrag-label { font-size:10.5px; fill:#2563A8; font-weight:700; }
      .card-gedrag-text { font-size:11px; fill:#14213D; }
      .leader { stroke:#CFE0F2; stroke-width:1.5; }
      .step { fill:#2563A8; stroke:#14213D; stroke-width:1.5; }
      .step-highlight { fill:#E9A13B; stroke:#14213D; stroke-width:2; }
      .step-num { font-size:22px; font-weight:700; fill:#FBFAF7; text-anchor:middle; }
      .step-name { font-size:13px; font-weight:700; fill:#FBFAF7; text-anchor:middle; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:26px; fill:#14213D; font-weight:600; }
      .note { font-size:12px; fill:#55606F; }
      .baseline { stroke:#14213D; stroke-width:2; }
      .warn { font-size:12.5px; fill:#5A3B0E; }
      .warn-title { font-size:13px; font-weight:700; fill:#5A3B0E; }
    </style>
</defs>
<rect width="960" height="700" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 02 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Procesvolwassenheid: gedrag, niet documentatie</text>
<text x="40" y="86" class="note">BPMM — vergelijkbaar met CMMI, specifiek gericht op procesmanagement.</text>

<!-- kaarten met documentatie (grijs) vs gedrag (blauw, nadruk) -->
<!-- niveau 1 -->
<rect x="55" y="112" width="150" height="130" rx="8" class="card"/>
<text x="70" y="134" class="card-title">Niveau 1 — Initial</text>
<text x="70" y="156" class="card-doc-label">documentatie:</text>
<text x="70" y="171" class="card-doc-text">geen vaste procesbeschrijving</text>
<text x="70" y="192" class="card-gedrag-label">gedrag:</text>
<text x="70" y="207" class="card-gedrag-text">werk is ad-hoc en</text>
<text x="70" y="220" class="card-gedrag-text">persoonsafhankelijk</text>
<line x1="130" y1="242" x2="130" y2="284" class="leader"/>

<!-- niveau 2 -->
<rect x="215" y="112" width="150" height="130" rx="8" class="card"/>
<text x="230" y="134" class="card-title">Niveau 2 — Managed</text>
<text x="230" y="156" class="card-doc-label">documentatie:</text>
<text x="230" y="171" class="card-doc-text">afspraken per project</text>
<text x="230" y="184" class="card-doc-text">of team</text>
<text x="230" y="203" class="card-gedrag-label">gedrag:</text>
<text x="230" y="218" class="card-gedrag-text">planning en bewaking per</text>
<text x="230" y="231" class="card-gedrag-text">team, nog niet organisatiebreed</text>
<line x1="290" y1="242" x2="290" y2="354" class="leader"/>

<!-- niveau 3 -->
<rect x="375" y="112" width="150" height="130" rx="8" class="card"/>
<text x="390" y="134" class="card-title">Niveau 3 — Standardized</text>
<text x="390" y="156" class="card-doc-label">documentatie:</text>
<text x="390" y="171" class="card-doc-text">organisatiebrede</text>
<text x="390" y="184" class="card-doc-text">processtandaard</text>
<text x="390" y="203" class="card-gedrag-label">gedrag:</text>
<text x="390" y="218" class="card-gedrag-text">iedereen volgt dezelfde</text>
<text x="390" y="231" class="card-gedrag-text">werkwijze, afwijkingen gemeld</text>
<line x1="450" y1="242" x2="450" y2="424" class="leader"/>

<!-- niveau 4 -->
<rect x="535" y="112" width="150" height="130" rx="8" class="card" stroke="#E9A13B" stroke-width="2"/>
<text x="550" y="134" class="card-title">Niveau 4 — Predictable</text>
<text x="550" y="156" class="card-doc-label">documentatie:</text>
<text x="550" y="171" class="card-doc-text">prestatienormen</text>
<text x="550" y="184" class="card-doc-text">vastgelegd</text>
<text x="550" y="203" class="card-gedrag-label">gedrag:</text>
<text x="550" y="218" class="card-gedrag-text">structureel gemeten,</text>
<text x="550" y="231" class="card-gedrag-text">bijsturen op basis van data</text>
<line x1="610" y1="242" x2="610" y2="494" class="leader"/>

<!-- niveau 5 -->
<rect x="695" y="112" width="150" height="130" rx="8" class="card"/>
<text x="710" y="134" class="card-title">Niveau 5 — Innovating</text>
<text x="710" y="156" class="card-doc-label">documentatie:</text>
<text x="710" y="171" class="card-doc-text">verbeterproces</text>
<text x="710" y="184" class="card-doc-text">beschreven</text>
<text x="710" y="203" class="card-gedrag-label">gedrag:</text>
<text x="710" y="218" class="card-gedrag-text">verbeteringen geborgd,</text>
<text x="710" y="231" class="card-gedrag-text">processen proactief aangepast</text>
<line x1="770" y1="242" x2="770" y2="564" class="leader"/>

<!-- trapopbouw -->
<line x1="40" y1="640" x2="900" y2="640" class="baseline"/>

<!-- stap 1 h=60 -->
<rect x="60" y="580" width="140" height="60" class="step"/>
<text x="130" y="605" class="step-num">1</text>
<text x="130" y="626" class="step-name">Initial</text>

<!-- stap 2 h=130 -->
<rect x="220" y="510" width="140" height="130" class="step"/>
<text x="290" y="560" class="step-num">2</text>
<text x="290" y="581" class="step-name">Managed</text>

<!-- stap 3 h=200 -->
<rect x="380" y="440" width="140" height="200" class="step"/>
<text x="450" y="510" class="step-num">3</text>
<text x="450" y="531" class="step-name">Standardized</text>

<!-- stap 4 h=270 -->
<rect x="540" y="370" width="140" height="270" class="step-highlight"/>
<text x="610" y="440" class="step-num">4</text>
<text x="610" y="461" class="step-name">Predictable</text>

<!-- stap 5 h=340 -->
<rect x="700" y="300" width="140" height="340" class="step"/>
<text x="770" y="370" class="step-num">5</text>
<text x="770" y="391" class="step-name">Innovating</text>

<!-- waarschuwing bij niveau 4 -->
<rect x="540" y="655" width="360" height="42" rx="8" fill="#FBF6E9" stroke="#E9A13B" stroke-width="1.5"/>
<text x="558" y="672" class="warn-title">Niveau ≠ kwaliteit van het model</text>
<text x="558" y="688" class="warn">een niveau-4-organisatie kan uitstekend beheerste, verouderde processen hebben</text>

<!-- kernboodschap links -->
<rect x="40" y="655" width="480" height="42" rx="8" fill="#EEF2F7" stroke="#CFE0F2" stroke-width="1"/>
<text x="58" y="672" class="note" font-weight="700" fill="#14213D">Een assessment toetst gedrag, geen documentatie:</text>
<text x="58" y="688" class="note">worden afwijkingen vastgelegd, wordt gemeten, wordt verbetering geborgd?</text>
</svg>
