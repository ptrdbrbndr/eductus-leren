<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 740" font-family="'DM Sans', Arial, sans-serif" width="960" height="740" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .col-head-ends { fill:#2563A8; }
      .col-head-means { fill:#14213D; }
      .head-text { font-size:16px; font-weight:700; fill:#FBFAF7; text-anchor:middle; }
      .box { fill:#CFE0F2; stroke:#2563A8; stroke-width:1.5; }
      .box-means { fill:#EEF2F7; stroke:#14213D; stroke-width:1.5; }
      .box-muted { fill:#FFFFFF; stroke:#55606F; stroke-width:1.25; stroke-dasharray:5 4; }
      .box-title { font-size:14px; font-weight:700; fill:#14213D; }
      .box-title-muted { font-size:14px; font-weight:700; fill:#55606F; }
      .box-def { font-size:11px; fill:#55606F; font-style:italic; }
      .box-text { font-size:12.5px; fill:#14213D; }
      .step { fill:#E9A13B; stroke:#14213D; stroke-width:1.5; }
      .step-text { font-size:13px; font-weight:700; fill:#14213D; text-anchor:middle; }
      .col-arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .chain-arrow { stroke:#E9A13B; stroke-width:3; fill:none; marker-end:url(#arrChain); }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:26px; fill:#14213D; font-weight:600; }
      .note { font-size:12px; fill:#55606F; }
      .quote { font-size:13px; fill:#5A3B0E; font-style:italic; }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrChain" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
</defs>
<rect width="960" height="740" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 02 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Business Motivation Model: ends en means</text>
<text x="40" y="86" class="note">De Meridiaan-keten: van visie tot tactiek — elke stap volgt aantoonbaar uit de vorige.</text>

<!-- kolomkoppen -->
<rect x="70" y="110" width="380" height="44" rx="8" class="col-head-ends"/>
<text x="260" y="138" class="head-text">ENDS — waar de organisatie naartoe wil</text>
<rect x="510" y="110" width="380" height="44" rx="8" class="col-head-means"/>
<text x="700" y="138" class="head-text">MEANS — hoe de organisatie daar komt</text>

<!-- kolompijlen (verfijning binnen elke kolom) -->
<path d="M260,238 L260,270" class="col-arrow"/>
<path d="M260,380 L260,412" class="col-arrow"/>
<path d="M700,238 L700,270" class="col-arrow"/>
<path d="M700,380 L700,412" class="col-arrow"/>

<!-- rij 1: Visie / Missie -->
<rect x="70" y="174" width="380" height="64" rx="8" class="box"/>
<text x="88" y="196" class="box-title">Visie</text>
<text x="88" y="212" class="box-def">gewenst toekomstbeeld, abstract, niet meetbaar</text>
<text x="88" y="228" class="box-text">"Meridiaan is de meest betrouwbare pensioenuitvoerder van Nederland."</text>

<rect x="510" y="174" width="380" height="64" rx="8" class="box-muted"/>
<text x="528" y="196" class="box-title-muted">Missie</text>
<text x="528" y="212" class="box-def">wat de organisatie doet om de visie te bereiken</text>
<text x="528" y="228" class="box-def">(niet expliciet ingevuld in dit casusfragment)</text>

<!-- rij 2: Doel / Strategie -->
<rect x="70" y="270" width="380" height="64" rx="8" class="box"/>
<text x="88" y="292" class="box-title">Doel</text>
<text x="88" y="308" class="box-def">afgeleide van de visie, nog kwalitatief</text>
<text x="88" y="324" class="box-text">"Deelnemers kunnen te allen tijde vertrouwen op een correcte</text>
<text x="88" y="330" class="box-text" dy="8">en actuele administratie."</text>

<rect x="510" y="270" width="380" height="64" rx="8" class="box-means"/>
<text x="528" y="292" class="box-title">Strategie</text>
<text x="528" y="308" class="box-def">structurele, richtinggevende keuze om een doel te bereiken</text>
<text x="528" y="324" class="box-text">"Mutatieverwerking wordt waar mogelijk gestandaardiseerd</text>
<text x="528" y="330" class="box-text" dy="8">en geautomatiseerd."</text>

<!-- rij 3: Doelstelling / Tactiek -->
<rect x="70" y="412" width="380" height="70" rx="8" class="box"/>
<text x="88" y="434" class="box-title">Doelstelling</text>
<text x="88" y="450" class="box-def">specifiek, meetbaar, tijdgebonden</text>
<text x="88" y="466" class="box-text">"95% van alle mutaties is binnen 5 werkdagen correct</text>
<text x="88" y="480" class="box-text">verwerkt, gemeten per kwartaal."</text>

<rect x="510" y="412" width="380" height="70" rx="8" class="box-means"/>
<text x="528" y="434" class="box-title">Tactiek</text>
<text x="528" y="450" class="box-def">concrete, uitvoerbare actie die een strategie invult</text>
<text x="528" y="466" class="box-text">"Het proces e-mailadreswijziging wordt in 2026 volledig</text>
<text x="528" y="480" class="box-text">geautomatiseerd, zonder handmatige tussenstap."</text>

<!-- doelstelling -> strategie/tactiek koppeling en genummerde keten -->
<path d="M450,447 C470,447 490,447 505,447" class="chain-arrow"/>

<!-- genummerde stapbadges op de keten: visie(1) doel(2) doelstelling(3) strategie(4) tactiek(5) -->
<circle cx="45" cy="206" r="16" class="step"/>
<text x="45" y="211" class="step-text">1</text>
<circle cx="45" cy="302" r="16" class="step"/>
<text x="45" y="307" class="step-text">2</text>
<circle cx="45" cy="447" r="16" class="step"/>
<text x="45" y="452" class="step-text">3</text>
<circle cx="915" cy="302" r="16" class="step"/>
<text x="915" y="307" class="step-text">4</text>
<circle cx="915" cy="447" r="16" class="step"/>
<text x="915" y="452" class="step-text">5</text>

<!-- influencers/assessment voetnoot -->
<rect x="70" y="512" width="820" height="48" rx="8" fill="#EEF2F7" stroke="#CFE0F2" stroke-width="1"/>
<text x="88" y="532" class="note">Rondom deze kern staan <tspan font-weight="700" fill="#14213D">influencers</tspan> (wetgeving, concurrentie, technologie) en de <tspan font-weight="700" fill="#14213D">assessment</tspan> daarvan</text>
<text x="88" y="550" class="note">(sterktes, zwaktes, kansen, bedreigingen) — buiten deze figuur verder uitgewerkt.</text>

<rect x="70" y="580" width="820" height="70" rx="8" fill="#FBF6E9" stroke="#E9A13B" stroke-width="1.5"/>
<text x="88" y="606" class="quote">"De keten is compleet als je van de tactiek terug kunt redeneren naar de visie."</text>
<text x="88" y="628" class="note" fill="#5A3B0E">Breekt de keten ergens — een tactiek zonder strategie, een proces zonder doelstelling —</text>
<text x="88" y="644" class="note" fill="#5A3B0E">dan is dat een signaal, geen formaliteit: het proces bestaat dan zonder aantoonbare reden.</text>
</svg>
