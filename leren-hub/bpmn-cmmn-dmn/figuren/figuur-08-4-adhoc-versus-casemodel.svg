<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 660" font-family="'DM Sans', Arial, sans-serif" width="1240" height="660" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .panel { fill:#FFFFFF; stroke:#E3E0D8; stroke-width:1.5; }
      .paneltitle { font-size:13px; font-weight:700; fill:#2563A8; }
      .task { fill:#CFE0F2; stroke:#14213D; stroke-width:1.4; }
      .adhoc { fill:#FBF6E9; stroke:#14213D; stroke-width:1.6; }
      .adhoc-item { fill:#CFE0F2; stroke:#14213D; stroke-width:1.2; stroke-dasharray:3 2; }
      .stage { fill:#FBF6E9; stroke:#14213D; stroke-width:1.5; }
      .disc-item { fill:none; stroke:#14213D; stroke-width:1.3; stroke-dasharray:4 3; }
      .milestone { fill:#EEF2F7; stroke:#14213D; stroke-width:1.4; }
      .sentry { fill:#FBFAF7; stroke:#14213D; stroke-width:1.4; }
      .evt-start { fill:#FBFAF7; stroke:#14213D; stroke-width:1.6; }
      .evt-end { fill:#FBFAF7; stroke:#14213D; stroke-width:3; }
      .icon { stroke:#14213D; stroke-width:1.1; fill:none; }
      .seq { stroke:#14213D; stroke-width:1.6; fill:none; marker-end:url(#seqarr); }
      .seq-dashed { stroke:#55606F; stroke-width:1.2; fill:none; stroke-dasharray:3 3; marker-end:url(#greyarr); }
      .task-label { font-size:10px; fill:#14213D; }
      .label { font-size:13px; font-weight:700; fill:#14213D; }
      .sub { font-size:11px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:23px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .contextbox { fill:#FBF6E9; stroke:#E3E0D8; stroke-width:1; }
    </style>
    <marker id="seqarr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#14213D"/></marker>
    <marker id="greyarr" markerWidth="8" markerHeight="8" refX="5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="#55606F"/></marker>
</defs>
<rect width="1240" height="660" class="paper"/>
<text x="40" y="30" class="kicker">DEEL 08 · DE SCHERPSTE GRENSVRAAG</text>
<text x="40" y="58" class="title">Figuur 8.4 — Ad-hoc subprocess versus echt casemodel: hetzelfde werk, ander omhulsel</text>

<!-- PANEL 1: BPMN with ad-hoc subprocess -->
<rect x="20" y="80" width="590" height="550" class="panel" rx="4"/>
<text x="36" y="106" class="paneltitle">1. AD-HOC SUBPROCESS — BPMN</text>
<text x="36" y="122" class="sub">"Aanvullende informatie verzamelen" als eiland in een vast proces</text>

<circle cx="54" cy="200" r="13" class="evt-start"/>

<rect x="82" y="180" width="90" height="42" rx="10" class="task"/>
<path d="M89,188 h18 v12 l-9,7 -9,-7 z" class="icon"/>
<text x="127" y="207" text-anchor="middle" class="task-label">Aanvraag intake</text>
<line x1="67" y1="200" x2="82" y2="200" class="seq"/>
<line x1="172" y1="201" x2="200" y2="201" class="seq"/>

<!-- ad hoc subprocess -->
<rect x="200" y="150" width="230" height="180" rx="12" class="adhoc"/>
<text x="315" y="172" text-anchor="middle" class="label" style="font-size:11px">Aanvullende informatie</text>
<text x="315" y="186" text-anchor="middle" class="sub" style="font-size:9px">ad-hoc subprocess — geen vaste volgorde</text>

<rect x="216" y="200" width="90" height="34" rx="8" class="adhoc-item"/>
<text x="261" y="221" text-anchor="middle" class="task-label" style="font-size:9px">Bewijsstuk opvragen</text>

<rect x="316" y="200" width="98" height="34" rx="8" class="adhoc-item"/>
<text x="365" y="221" text-anchor="middle" class="task-label" style="font-size:9px">Deskundige raadplegen</text>

<rect x="265" y="255" width="100" height="34" rx="8" class="adhoc-item"/>
<text x="315" y="276" text-anchor="middle" class="task-label" style="font-size:9px">Klant terugbellen</text>

<path d="M300,217 C310,230 310,245 305,255" class="seq-dashed"/>
<path d="M355,234 C345,245 340,250 335,255" class="seq-dashed"/>
<path d="M261,234 C270,245 280,250 285,255" class="seq-dashed"/>

<!-- tilde marker bottom center -->
<circle cx="315" cy="313" r="10" fill="#FBFAF7" stroke="#14213D" stroke-width="1.3"/>
<path d="M309,313 q3,-5 6,0 q3,5 6,0" stroke="#14213D" stroke-width="1.3" fill="none"/>

<line x1="430" y1="220" x2="460" y2="201" class="seq"/>

<rect x="460" y="180" width="90" height="42" rx="10" class="task"/>
<path d="M467,188 h18 v12 l-9,7 -9,-7 z" class="icon"/>
<text x="505" y="207" text-anchor="middle" class="task-label">Afronden</text>

<circle cx="580" cy="201" r="14" class="evt-end"/>
<line x1="550" y1="201" x2="565" y2="201" class="seq"/>

<rect x="46" y="380" width="540" height="220" class="contextbox" rx="6"/>
<text x="62" y="404" class="label" style="font-size:12px">Wat het omhulsel bepaalt</text>
<text x="62" y="426" class="sub">Het omringende BPMN-proces bepaalt nog steeds wanneer</text>
<text x="62" y="443" class="sub">je bij het ad-hoc blok aankomt en wat er na afloop gebeurt.</text>
<text x="62" y="460" class="sub">Er is geen dossier dat over de tijd groeit met eigen sturing —</text>
<text x="62" y="477" class="sub">alleen een lokale vrijheid in volgorde.</text>
<text x="62" y="502" class="label" style="font-size:12px">Vuistregel (§8.3)</text>
<text x="62" y="524" class="sub">Ongestructureerd deel klein en tijdelijk, ingebed in een</text>
<text x="62" y="541" class="sub">proces met vast begin en eind → gebruik een</text>
<text x="62" y="558" class="sub">ad-hoc subprocess.</text>

<!-- PANEL 2: CMMN casemodel -->
<rect x="630" y="80" width="590" height="550" class="panel" rx="4"/>
<text x="646" y="106" class="paneltitle">2. CASEMODEL — CMMN</text>
<text x="646" y="122" class="sub">"Klachtbehandeling" als eigen dossier met eigen levenscyclus</text>

<path d="M660,150 h150 l14,14 h146 v340 h-310 z" class="stage"/>
<text x="815" y="173" text-anchor="middle" class="label" style="font-size:12px">Klachtbehandeling</text>

<rect x="690" y="190" width="170" height="32" rx="16" class="milestone"/>
<text x="775" y="210" text-anchor="middle" class="task-label">Klacht ontvangen</text>

<rect x="690" y="240" width="230" height="42" rx="8" class="disc-item"/>
<text x="805" y="260" text-anchor="middle" class="task-label">Informatie opvragen</text>
<text x="805" y="273" text-anchor="middle" class="sub" style="font-size:8.5px">discretionary item</text>
<polygon points="920,258 930,251 940,258 930,265" class="sentry"/>

<rect x="690" y="292" width="230" height="42" rx="8" class="disc-item"/>
<text x="805" y="312" text-anchor="middle" class="task-label">Deskundige raadplegen</text>
<text x="805" y="325" text-anchor="middle" class="sub" style="font-size:8.5px">discretionary item</text>
<polygon points="920,310 930,303 940,310 930,317" class="sentry"/>

<rect x="690" y="344" width="230" height="42" rx="8" class="disc-item"/>
<text x="805" y="364" text-anchor="middle" class="task-label">Klant terugbellen</text>
<text x="805" y="377" text-anchor="middle" class="sub" style="font-size:8.5px">discretionary item</text>
<polygon points="920,362 930,355 940,362 930,369" class="sentry"/>

<rect x="690" y="410" width="170" height="32" rx="16" class="milestone"/>
<text x="775" y="430" text-anchor="middle" class="task-label">Klacht afgehandeld</text>

<rect x="656" y="470" width="540" height="130" class="contextbox" rx="6"/>
<text x="672" y="493" class="label" style="font-size:12px">Wat het omhulsel bepaalt</text>
<text x="672" y="514" class="sub">Eigen levenscyclus, een case file dat sentries stuurt,</text>
<text x="672" y="531" class="sub">milestones onafhankelijk van een omringend proces, en</text>
<text x="672" y="548" class="sub">discretionary items die de behandelaar zelf inzet.</text>
<text x="672" y="573" class="sub">Ongestructureerd deel is het hele punt van het model,</text>
<text x="672" y="590" class="sub">dossier bestaat langer dan één sessie → gebruik CMMN.</text>

</svg>
