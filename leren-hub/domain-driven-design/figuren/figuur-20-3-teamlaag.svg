<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" font-family="'DM Sans', Arial, sans-serif" width="960" height="340" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:21px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-a { stroke:#E9A13B; stroke-width:2; fill:none; marker-end:url(#arra); }
    </style>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
    </defs>
<rect width="960" height="340" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 20 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Vijf systemen, tweede laag: team</text>
<text x="40" y="96" class="sub" text-anchor="start">Bij elk systeem teamgrootte, teamleeftijd en één zin over hoe dat de contextgrens beïnvloedt.</text>
<rect x="40" y="150" width="210" height="90" rx="8" fill="#CBDCEF" stroke="#2563A8" stroke-width="1.5"/>
<text x="145.0" y="189.0" text-anchor="middle" class="label">KERN</text>
<text x="145.0" y="207.0" text-anchor="middle" class="sub">groot · 14+ jaar</text>
<text x="48" y="265" class="sub" text-anchor="start">'te toegankelijk, kan niet</text>
<text x="48" y="282" class="sub" text-anchor="start">nee zeggen'</text><rect x="270" y="150" width="210" height="90" rx="8" fill="#CBDCEF" stroke="#2563A8" stroke-width="1.5"/>
<text x="375.0" y="189.0" text-anchor="middle" class="label">Werkgeversportaal</text>
<text x="375.0" y="207.0" text-anchor="middle" class="sub">klein · na WGP 2.0</text>
<text x="278" y="265" class="sub" text-anchor="start">'nooit heroverwogen na</text>
<text x="278" y="282" class="sub" text-anchor="start">stopzetting'</text><rect x="500" y="150" width="210" height="90" rx="8" fill="#CBDCEF" stroke="#2563A8" stroke-width="1.5"/>
<text x="605.0" y="189.0" text-anchor="middle" class="label">Mutatieplatform</text>
<text x="605.0" y="207.0" text-anchor="middle" class="sub">klein · nieuw</text>
<text x="508" y="265" class="sub" text-anchor="start">'meeste koppelvlakken,</text>
<text x="508" y="282" class="sub" text-anchor="start">minste historie'</text><rect x="730" y="150" width="210" height="90" rx="8" fill="#CBDCEF" stroke="#2563A8" stroke-width="1.5"/>
<text x="835.0" y="189.0" text-anchor="middle" class="label">Wegwijzer</text>
<text x="835.0" y="207.0" text-anchor="middle" class="sub">klein · nieuw</text>
<text x="738" y="265" class="sub" text-anchor="start">'conformist door</text>
<text x="738" y="282" class="sub" text-anchor="start">teamverschil, niet domein'</text></svg>