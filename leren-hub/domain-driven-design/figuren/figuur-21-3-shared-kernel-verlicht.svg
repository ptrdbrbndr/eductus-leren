<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:21px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-a { stroke:#E9A13B; stroke-width:2; fill:none; marker-end:url(#arra); }
    </style>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
    </defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 21 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">De shared kernel, verlicht door een event</text>
<text x="40" y="96" class="sub" text-anchor="start">De shared kernel zelf wordt smaller — alleen de betekenis, niet de dagelijkse feiten, die via het</text>
<text x="40" y="113" class="sub" text-anchor="start">integratie-event lopen.</text>
<rect x="360" y="140" width="240" height="90" rx="8" fill="#E9A13B" stroke="#9A5F0D" stroke-width="1"/>
<text x="480.0" y="179.0" text-anchor="middle" class="label">shared kernel</text>
<text x="480.0" y="197.0" text-anchor="middle" class="sub">smaller: alleen de betekenis</text>
<rect x="60" y="280" width="300" height="90" rx="8" fill="#CBDCEF" stroke="#2563A8" stroke-width="1.5"/>
<text x="210.0" y="329.0" text-anchor="middle" class="label">KERN</text>
<rect x="600" y="280" width="300" height="90" rx="8" fill="#CBDCEF" stroke="#2563A8" stroke-width="1.5"/>
<text x="750.0" y="329.0" text-anchor="middle" class="label">Mutatieplatform</text>
<path d="M360 325 L120 325" class="arrow-b"/>
<path d="M600 325 L660 325" class="arrow-b"/>
<path d="M360 190 L750 280" stroke="#E9A13B" stroke-width="3" marker-end="url(#arra)"/>
<text x="600" y="240" text-anchor="middle" class="kicker">integratie-event: dienstverband gewijzigd</text>
<text x="600" y="258" text-anchor="middle" class="kicker">neemt de dagelijkse stroom over</text>
</svg>