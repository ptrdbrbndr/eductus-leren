<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    </defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 3 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Core, supporting, generic</text>
<rect x="60" y="130" width="260" height="380" rx="10" fill="#2563A8" stroke="#2563A8" stroke-width="1.5"/>
<text x="190" y="170" text-anchor="middle" font-size="14" font-weight="700" fill="#FBFAF7">CORE DOMAIN</text>
<rect x="80" y="200" width="220" height="100" rx="6" fill="#FFFFFF"/>
<text x="190" y="235" text-anchor="middle" class="sub" font-weight="700">Vaststellen recht op</text>
<text x="190" y="255" text-anchor="middle" class="sub" font-weight="700">partner- en wezenpensioen</text>
<text x="190" y="460" text-anchor="middle" font-size="12" fill="#FBFAF7" font-style="italic">waar Meridiaan zich mee</text>
<text x="190" y="478" text-anchor="middle" font-size="12" fill="#FBFAF7" font-style="italic">onderscheidt</text>
<rect x="340" y="130" width="260" height="380" rx="10" fill="#6FA3D6" stroke="#2563A8" stroke-width="1.5"/>
<text x="470" y="170" text-anchor="middle" font-size="14" font-weight="700" fill="#14213D">SUPPORTING SUBDOMAIN</text>
<rect x="360" y="200" width="220" height="100" rx="6" fill="#FFFFFF"/>
<text x="470" y="235" text-anchor="middle" class="sub" font-weight="700">Adresverificatie volgens</text>
<text x="470" y="255" text-anchor="middle" class="sub" font-weight="700">Meridiaans eigen eisen</text>
<text x="470" y="460" text-anchor="middle" font-size="12" fill="#14213D" font-style="italic">nodig, specifiek — niet</text>
<text x="470" y="478" text-anchor="middle" font-size="12" fill="#14213D" font-style="italic">onderscheidend</text>
<rect x="620" y="130" width="260" height="380" rx="10" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="750" y="170" text-anchor="middle" font-size="14" font-weight="700" fill="#14213D">GENERIC SUBDOMAIN</text>
<rect x="640" y="200" width="220" height="100" rx="6" fill="#F4F2EC"/>
<text x="750" y="235" text-anchor="middle" class="sub" font-weight="700">Authenticatie van</text>
<text x="750" y="255" text-anchor="middle" class="sub" font-weight="700">medewerkers</text>
<text x="750" y="460" text-anchor="middle" font-size="12" fill="#14213D" font-style="italic">elders al opgelost,</text>
<text x="750" y="478" text-anchor="middle" font-size="12" fill="#14213D" font-style="italic">inkoopbaar</text>
</svg>