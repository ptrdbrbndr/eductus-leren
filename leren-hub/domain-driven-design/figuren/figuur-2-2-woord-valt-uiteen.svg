<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    </defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 2 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Eén woord valt uiteen in twee begrippen</text>
<rect x="330" y="120" width="300" height="70" rx="8" class="blue-dark" fill="#2563A8"/>
<text x="480" y="162" text-anchor="middle" class="label-light" font-size="20">"dossier"</text>
<path d="M420 190 L320 260" class="arrow-b"/>
<path d="M540 190 L640 260" class="arrow-b"/>
<text x="480" y="225" text-anchor="middle" class="sub" font-style="italic">na doorvragen…</text>
<rect x="140" y="270" width="360" height="100" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="320" y="300" text-anchor="middle" class="label">melding</text>
<text x="320" y="322" text-anchor="middle" class="sub">vanaf het eerste signaal,</text>
<text x="320" y="340" text-anchor="middle" class="sub">nog niet gecontroleerd</text>
<rect x="460" y="270" width="360" height="100" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="640" y="300" text-anchor="middle" class="label">dossier</text>
<text x="640" y="322" text-anchor="middle" class="sub">vanaf het moment dat de</text>
<text x="640" y="340" text-anchor="middle" class="sub">compliance-check is doorlopen</text>
<path d="M480 380 L480 440" class="arrow"/>
<rect x="280" y="450" width="400" height="60" rx="8" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
<text x="480" y="475" text-anchor="middle" class="label" fill="#9A5F0D" font-size="13">mogelijk een grens</text>
<text x="480" y="495" text-anchor="middle" class="sub">structureel verschil, geen toevallige woordkeuze</text>
</svg>