<text x="299.0" y="229.0" text-anchor="middle" class="label">WGP</text>
<rect x="412" y="190" width="146" height="70" rx="8" fill="#CBDCEF" stroke="#2563A8" stroke-width="1.5"/>
<text x="485.0" y="229.0" text-anchor="middle" class="label">MP</text>
<rect x="598" y="190" width="146" height="70" rx="8" fill="#CBDCEF" stroke="#2563A8" stroke-width="1.5"/>
<text x="671.0" y="229.0" text-anchor="middle" class="label">NBL</text>
