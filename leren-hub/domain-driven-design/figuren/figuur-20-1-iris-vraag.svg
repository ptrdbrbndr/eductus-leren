<text x="857.0" y="229.0" text-anchor="middle" class="label">WGZ</text>
<rect x="40" y="300" width="146" height="90" rx="8" fill="#FFFFFF" stroke="#55606F" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="113.0" y="349.0" text-anchor="middle" class="label">team?</text>
<rect x="226" y="300" width="146" height="90" rx="8" fill="#FFFFFF" stroke="#55606F" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="299.0" y="349.0" text-anchor="middle" class="label">team?</text>
<rect x="412" y="300" width="146" height="90" rx="8" fill="#FFFFFF" stroke="#55606F" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="485.0" y="349.0" text-anchor="middle" class="label">team?</text>
<rect x="598" y="300" width="146" height="90" rx="8" fill="#FFFFFF" stroke="#55606F" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="671.0" y="349.0" text-anchor="middle" class="label">team?</text>
<rect x="784" y="300" width="146" height="90" rx="8" fill="#FFFFFF" stroke="#55606F" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="857.0" y="349.0" text-anchor="middle" class="label">team?</text>
<text x="480" y="410" text-anchor="middle" class="kicker">de teams die ze bouwen — passen die bij de kaart?</text>
</svg>