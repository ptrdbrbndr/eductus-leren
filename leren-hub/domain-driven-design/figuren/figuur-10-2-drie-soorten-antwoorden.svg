<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    </defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 10 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Drie soorten antwoorden bij een verdediging</text>
<rect x="60" y="120" width="260" height="380" rx="10" fill="#FFFFFF" stroke="#2563A8" stroke-width="2"/>
<text x="190" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="#14213D">Het oppervlakkige ja</text>
<rect x="80" y="180" width="220" height="90" rx="6" fill="#F4F2EC" fill-opacity="0.6"/>
<text x="190" y="210" text-anchor="middle" font-size="12" font-style="italic" fill="#14213D">"Dat hebben we in deel 6</text>
<text x="190" y="230" text-anchor="middle" font-size="12" font-style="italic" fill="#14213D">zo besloten."</text>
<text x="190" y="320" text-anchor="middle" font-size="12" fill="#14213D">verwijst naar autoriteit,</text>
<text x="190" y="338" text-anchor="middle" font-size="12" fill="#14213D">laat de afweging niet zien</text>
<rect x="350" y="120" width="260" height="380" rx="10" fill="#2563A8" stroke="#2563A8" stroke-width="2"/>
<text x="480" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="#FBFAF7">Het onderbouwde nee</text>
<rect x="370" y="180" width="220" height="90" rx="6" fill="#14213D" fill-opacity="0.3"/>
<text x="480" y="210" text-anchor="middle" font-size="12" font-style="italic" fill="#FBFAF7">"Dat alternatief werkt hier</text>
<text x="480" y="230" text-anchor="middle" font-size="12" font-style="italic" fill="#FBFAF7">niet, omdat…"</text>
<text x="480" y="320" text-anchor="middle" font-size="12" fill="#FBFAF7">concrete reden, teruggrijpend</text>
<text x="480" y="338" text-anchor="middle" font-size="12" fill="#FBFAF7">op wat op het spel staat</text>
<rect x="640" y="120" width="260" height="380" rx="10" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2"/>
<text x="770" y="155" text-anchor="middle" font-size="14" font-weight="700" fill="#9A5F0D">De eerlijke onzekerheid</text>
<rect x="660" y="180" width="220" height="90" rx="6" fill="#F4F2EC" fill-opacity="0.6"/>
<text x="770" y="210" text-anchor="middle" font-size="12" font-style="italic" fill="#9A5F0D">"Dat weten we nog niet zeker —</text>
<text x="770" y="230" text-anchor="middle" font-size="12" font-style="italic" fill="#9A5F0D">en hier is de vervolgstap."</text>
<text x="770" y="320" text-anchor="middle" font-size="12" fill="#9A5F0D">sterker dan een gehaast</text>
<text x="770" y="338" text-anchor="middle" font-size="12" fill="#9A5F0D">verzonnen antwoord</text>
</svg>