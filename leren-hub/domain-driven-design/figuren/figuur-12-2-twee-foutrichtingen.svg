<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:21px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-a { stroke:#E9A13B; stroke-width:2; fill:none; marker-end:url(#arra); }
    </style>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
    </defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 12 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Twee foutrichtingen, ontmoeten elkaar in het midden</text>
<text x="40" y="96" class="sub" text-anchor="start">Onderinvesteren in het kerndomein en overinvesteren in generiek zijn twee kanten van dezelfde onderliggende</text>
<text x="40" y="113" class="sub" text-anchor="start">fout.</text>
<rect x="80" y="220" width="340" height="110" rx="8" fill="#FFFFFF" stroke="#55606F" stroke-width="1.5"/>
<text x="250.0" y="269.0" text-anchor="middle" class="label">te veel aandacht naar generiek</text>
<text x="250.0" y="287.0" text-anchor="middle" class="sub">vijf keer een eigen authenticatie gebouwd, nooit</text>
<text x="250.0" y="302.0" text-anchor="middle" class="sub">centraal belegd</text>
<rect x="540" y="220" width="340" height="110" rx="8" fill="#FFFFFF" stroke="#55606F" stroke-width="1.5"/>
<text x="710.0" y="269.0" text-anchor="middle" class="label">te weinig aandacht naar kerndomein</text>
<text x="710.0" y="287.0" text-anchor="middle" class="sub">rechtvaststellingslogica krijgt niet de beste mensen</text>
<path d="M420 275 L540 275" class="arrow-a"/>
<path d="M540 295 L420 295" class="arrow-a"/>
<rect x="410" y="340" width="140" height="70" rx="8" fill="#E9A13B" stroke="#9A5F0D" stroke-width="1.5"/>
<text x="480.0" y="379.0" text-anchor="middle" class="label">HIER</text>
</svg>