<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    </defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 9 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Eén woord, twee betekenissen aan weerszijden van een grens</text>
<rect x="220" y="180" width="300" height="220" rx="10" class="blue-fill" fill="#CBDCEF" stroke="#2563A8" stroke-width="3"/>
<text x="370" y="260" text-anchor="middle" class="label" font-size="20">"dossier"</text>
<text x="370" y="290" text-anchor="middle" class="sub">Nabestaandenloket:</text>
<text x="370" y="310" text-anchor="middle" class="sub">één rechtvaststellingsproces,</text>
<text x="370" y="328" text-anchor="middle" class="sub">begin en eind</text>
<rect x="580" y="180" width="300" height="220" rx="10" fill="#FFFFFF" stroke="#55606F" stroke-dasharray="4 3"/>
<text x="730" y="260" text-anchor="middle" class="label" font-size="20">"dossier"</text>
<text x="730" y="290" text-anchor="middle" class="sub">Polisadministratie:</text>
<text x="730" y="310" text-anchor="middle" class="sub">complete deelnemersgeschiedenis,</text>
<text x="730" y="328" text-anchor="middle" class="sub">geen vast begin of eind</text>
<line x1="530" y1="150" x2="530" y2="440" stroke="#14213D" stroke-width="2" stroke-dasharray="2 4"/>
<text x="480" y="460" text-anchor="middle" class="sub" fill="#9A5F0D">geen fout die opgelost moet worden — een realiteit die erkend moet worden</text>
</svg>