<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:21px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-a { stroke:#E9A13B; stroke-width:2; fill:none; marker-end:url(#arra); }
    </style>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
    </defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 13 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Drie relatieparen, drie machtsverhoudingen</text>
<text x="40" y="96" class="sub" text-anchor="start">Twee gelijke pijlen voor partnership, een gedeeld middenstuk voor shared kernel, een grote en een kleine</text>
<text x="40" y="113" class="sub" text-anchor="start">pijl voor customer/supplier.</text>
<rect x="40" y="160" width="268" height="110" rx="8" fill="#CBDCEF" stroke="#2563A8" stroke-width="1.5"/>
<text x="174.0" y="209.0" text-anchor="middle" class="label">PARTNERSHIP</text>
<text x="174.0" y="227.0" text-anchor="middle" class="sub">Werkgeversportaal ↔ Mutatieplatform</text>
<path d="M90 300 L220 300" class="arrow-b"/>
<path d="M220 315 L90 315" class="arrow-b"/>
<rect x="346" y="160" width="268" height="110" rx="8" fill="#CBDCEF" stroke="#2563A8" stroke-width="1.5"/>
<text x="480.0" y="209.0" text-anchor="middle" class="label">SHARED KERNEL</text>
<text x="480.0" y="227.0" text-anchor="middle" class="sub">KERN ↔ Mutatieplatform</text>
<rect x="440" y="295" width="80" height="30" rx="6" fill="#E9A13B"/>
<text x="480" y="315" text-anchor="middle" class="sub" font-size="10" fill="#14213D">gedeeld</text>
<rect x="652" y="160" width="268" height="110" rx="8" fill="#CBDCEF" stroke="#2563A8" stroke-width="1.5"/>
<text x="786.0" y="209.0" text-anchor="middle" class="label">CUSTOMER/SUPPLIER</text>
<text x="786.0" y="227.0" text-anchor="middle" class="sub">Mutatieplatform ↔ Nabestaandenloket</text>
<path d="M760 300 L860 300" class="arrow-b"/>
<path d="M860 315 L770 315" class="arrow" stroke-width="1"/>
</svg>