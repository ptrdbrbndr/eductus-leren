<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    </defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 8 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">De domain service — los, stateless, tussen aggregates</text>
<rect x="80" y="220" width="220" height="120" rx="8" class="blue-fill" fill="#CBDCEF" stroke="#2563A8" stroke-width="1.5"/>
<text x="190" y="270" text-anchor="middle" class="label">Dossier</text>
<text x="190" y="292" text-anchor="middle" class="sub">vastgestelde uitkering</text>
<rect x="660" y="220" width="220" height="120" rx="8" fill="#FFFFFF" stroke="#55606F" stroke-dasharray="4 3"/>
<text x="770" y="270" text-anchor="middle" class="label">UWV (extern)</text>
<text x="770" y="292" text-anchor="middle" class="sub">Anw-/WIA-bedrag</text>
<rect x="360" y="240" width="240" height="90" rx="10" class="blue-dark" fill="#2563A8"/>
<text x="480" y="275" text-anchor="middle" class="label-light">Samenloopberekening</text>
<text x="480" y="298" text-anchor="middle" class="sub-light" font-size="11">stateless — rekent, levert uitkomst, bestaat verder niet</text>
<path d="M300 280 L358 280" class="arrow-b"/>
<path d="M660 280 L602 280" class="arrow-b"/>
<path d="M480 332 L480 420" class="arrow-b"/>
<rect x="360" y="420" width="240" height="60" rx="6" class="amber-fill" fill="#E9A13B"/>
<text x="480" y="455" text-anchor="middle" class="label" fill="#14213D">netto-uitkering</text>
<text x="480" y="540" text-anchor="middle" class="sub" fill="#9A5F0D">geen eigen identiteit, geen levensloop, geen consistentiegrens om te bewaken</text>
</svg>