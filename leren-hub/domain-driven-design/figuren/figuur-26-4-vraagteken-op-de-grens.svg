<rect width="960" height="460" class="paper"/>
<text x="40" y="34" text-anchor="start" class="kicker" >DEEL 26 · CONCEPTDIAGRAM</text>
<text x="40" y="64" text-anchor="start" class="title" >Eén woord, een vraagteken op de grens</text>
<text x="40" y="90" text-anchor="start" class="sub" >Een bounded-context-grens met aan beide zijden hetzelfde woord — betekent het aan beide kanten</text>
<text x="40" y="107" text-anchor="start" class="sub" >hetzelfde?</text>
<rect x="80" y="160" width="350" height="200" rx="6" fill="#CBDCEF" stroke="#2563A8" stroke-width="1.5" />
<text x="255.0" y="250.0" text-anchor="middle" class="label" >MERIDIAAN</text>
<text x="255.0" y="269.0" text-anchor="middle" class="sub" >“partner”</text>
<rect x="530" y="160" width="350" height="200" rx="6" fill="#FDF3E3" stroke="#E9A13B" stroke-width="1.5" />
<text x="705.0" y="250.0" text-anchor="middle" class="label" >KUSTVEER</text>
<text x="705.0" y="269.0" text-anchor="middle" class="sub" >“partner”</text>
<path d="M480 160 L480 360" class="arrow"/>
<circle cx="480" cy="260" r="22" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
<text x="480" y="268" text-anchor="middle" class="title-sm" >?</text>
