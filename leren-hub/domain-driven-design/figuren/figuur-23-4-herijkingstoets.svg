<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 528" font-family="'DM Sans', Arial, sans-serif" width="960" height="528" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .red-fill { fill:#DFDCD3; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:21px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .field-num { font-size:12px; font-weight:700; fill:#FFFFFF; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-a { stroke:#E9A13B; stroke-width:2; fill:none; marker-end:url(#arra); }
</style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
    </defs>
<rect width="960" height="528" class="paper"/>
<text x="40" y="34" text-anchor="start" class="kicker" >DEEL 23 · INSTRUMENT</text>
<text x="40" y="64" text-anchor="start" class="title" >De herijkingstoets</text>
<text x="40" y="90" text-anchor="start" class="sub" >Een bestaande kerndomeinclassificatie heroverwegen onder externe druk, in drie stappen.</text>
<circle cx="58" cy="164" r="14" fill="#2563A8" stroke="none" stroke-width="0"/>
<text x="58" y="169" text-anchor="middle" class="field-num" >1</text>
<rect x="40" y="184" width="880" height="62" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5" />
<text x="56" y="206" text-anchor="start" class="label" >STAP 1 — WAT VRAAGT DE NIEUWE DRUK DAADWERKELIJK</text>
<text x="56" y="226" text-anchor="start" class="sub" >los van welk systeem dat raakt — valkuil: meteen redeneren vanuit bekende systeemnamen</text>
<circle cx="58" cy="276" r="14" fill="#2563A8" stroke="none" stroke-width="0"/>
<text x="58" y="281" text-anchor="middle" class="field-num" >2</text>
<rect x="40" y="296" width="880" height="62" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5" />
<text x="56" y="318" text-anchor="start" class="label" >STAP 2 — WAAR ZIT DE MEESTE ONOPGELOSTE COMPLEXITEIT</text>
<text x="56" y="338" text-anchor="start" class="sub" >gemeten aan stap 1, niet aan de kerndomeinkeuze van niveau 2 — valkuil: oud risicobeeld herhalen</text>
<circle cx="58" cy="388" r="15" fill="#E9A13B" stroke="none" stroke-width="0"/>
<path d="M52 388 l4 4 l8 -9" stroke="#14213D" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="407" width="880" height="60" rx="6" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5" />
<text x="56" y="429" text-anchor="start" class="label" fill="#9A5F0D">STAP 3 — WAT VERANDERT ER, WAT BLIJFT GELIJK, EN WAAROM</text>
<text x="56" y="449" text-anchor="start" class="sub" >een scherp antwoord i.p.v. “ja nog steeds” of “nee alles anders” — valkuil: oppervlakkige herbevestiging</text>
</svg>