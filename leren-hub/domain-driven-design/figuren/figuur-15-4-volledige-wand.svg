<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:21px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-a { stroke:#E9A13B; stroke-width:2; fill:none; marker-end:url(#arra); }
    </style>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
    </defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 15 · DAGDEEL A · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">De volledige wand aan het eind van dagdeel A</text>
<text x="40" y="96" class="sub" text-anchor="start">Tijdlijn, actoren, externe systemen, zes hotspots gemarkeerd — nog ongeanalyseerd.</text>
<rect x="40" y="110" width="880" height="140" rx="4" fill="#CBDCEF" stroke="#2563A8" stroke-width="1"/>
<text x="480.0" y="174.0" text-anchor="middle" class="label">TIJDLIJN — ruim 120 events, geordend</text>
<text x="480.0" y="192.0" text-anchor="middle" class="sub">actoren en externe systemen als kleine memo's ertussen</text>
<circle cx="110" cy="280" r="9" fill="#E9A13B"/>
<text x="55" y="300" class="sub" text-anchor="start">deeltijd: 1 of</text>
<text x="55" y="317" class="sub" text-anchor="start">2 events?</text><circle cx="270" cy="280" r="9" fill="#E9A13B"/>
<text x="215" y="300" class="sub" text-anchor="start">aankomstroute</text>
<text x="215" y="317" class="sub" text-anchor="start">onbekend</text><circle cx="430" cy="280" r="9" fill="#E9A13B"/>
<text x="375" y="300" class="sub" text-anchor="start">'actieve</text>
<text x="375" y="317" class="sub" text-anchor="start">deelnemer'</text>
<text x="375" y="334" class="sub" text-anchor="start">dubbel</text><circle cx="590" cy="280" r="9" fill="#E9A13B"/>
<text x="535" y="300" class="sub" text-anchor="start">event bestaat</text>
<text x="535" y="317" class="sub" text-anchor="start">nergens</text><circle cx="750" cy="280" r="9" fill="#E9A13B"/>
<text x="695" y="300" class="sub" text-anchor="start">scheidingsketen</text>
<text x="695" y="317" class="sub" text-anchor="start">wisselt</text><circle cx="880" cy="280" r="9" fill="#E9A13B"/>
<text x="825" y="300" class="sub" text-anchor="start">6e hotspot</text></svg>