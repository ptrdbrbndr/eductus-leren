<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    </defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 1 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">DDD als gereedschapskist — selectief per onderdeel</text>
<text x="40" y="96" class="sub">Niet elk onderdeel van het Nabestaandenloket verdient dezelfde aanpak.</text>
<rect x="60" y="130" width="840" height="90" rx="8" class="blue-mid" fill="#6FA3D6"/>
<text x="480" y="165" text-anchor="middle" class="label-light">Gereedschapskist Domain-Driven Design</text>
<text x="480" y="190" text-anchor="middle" class="sub-light">taal · subdomeinen · model versus implementatie · tactische bouwstenen · bounded context</text>
<rect x="60" y="280" width="190" height="120" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>

<text x="155" y="320" text-anchor="middle" class="label" font-size="13">Adreswijziging</text>
<text x="155" y="338" text-anchor="middle" class="label" font-size="13">verwerken</text>
<text x="155" y="370" text-anchor="middle" class="sub" font-size="11">eenvoudig, laag op alle assen</text>
<path d="M155 220 L155 278" class="arrow"/>
<rect x="260" y="280" width="190" height="120" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>

<text x="355" y="320" text-anchor="middle" class="label" font-size="13">Document uploaden</text>
<text x="355" y="352" text-anchor="middle" class="sub" font-size="11">generic, ingekochte oplossing</text>
<path d="M355 220 L355 278" class="arrow"/>
<rect x="460" y="280" width="190" height="120" rx="8" fill="#2563A8" stroke="#E9A13B" stroke-width="3"/>
<text x="555" y="230" text-anchor="middle" class="sub">↑ wel zwaar gereedschap</text>
<text x="555" y="320" text-anchor="middle" class="label-light" font-size="13">Recht op</text>
<text x="555" y="338" text-anchor="middle" class="label-light" font-size="13">partnerpensioen</text>
<text x="555" y="356" text-anchor="middle" class="label-light" font-size="13">vaststellen</text>
<text x="555" y="388" text-anchor="middle" class="sub-light" font-size="11">core, hoog op alle assen</text>
<path d="M555 220 L555 278" class="arrow"/>
<rect x="720" y="280" width="190" height="120" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>

<text x="815" y="320" text-anchor="middle" class="label" font-size="13">Authenticatie</text>
<text x="815" y="338" text-anchor="middle" class="label" font-size="13">medewerkers</text>
<text x="815" y="370" text-anchor="middle" class="sub" font-size="11">generic, elders al opgelost</text>
<path d="M815 220 L815 278" class="arrow"/>
<text x="480" y="450" text-anchor="middle" class="sub" fill="#9A5F0D">Alleen waar de complexiteitstoets het aanwijst, wordt het zware gereedschap ingezet — daarbuiten volstaat eenvoud.</text>
</svg>