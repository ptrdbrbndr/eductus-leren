<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" font-family="'DM Sans', Arial, sans-serif" width="960" height="490" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:21px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-a { stroke:#E9A13B; stroke-width:2; fill:none; marker-end:url(#arra); }
    </style>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
    </defs>
<rect width="960" height="490" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 16 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Drie genummerde verhaallijnen</text>
<text x="40" y="96" class="sub" text-anchor="start">Elk met eigen actor- en werkobject-pictogrammen — die op hetzelfde eindpunt uitkomen via drie verschillende</text>
<text x="40" y="113" class="sub" text-anchor="start">routes.</text>
<rect x="40" y="150" width="268" height="220" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="174.0" y="254.0" text-anchor="middle" class="label">Verhaal 1 — Karsten</text>
<text x="174.0" y="272.0" text-anchor="middle" class="sub">deelnemer meldt adres-</text>
<text x="174.0" y="287.0" text-anchor="middle" class="sub">wijziging → medewerker</text>
<text x="174.0" y="302.0" text-anchor="middle" class="sub">herkent scheiding →</text>
<text x="174.0" y="317.0" text-anchor="middle" class="sub">apart geregistreerd →</text>
<text x="174.0" y="332.0" text-anchor="middle" class="sub">gemeld</text>
<rect x="346" y="150" width="268" height="220" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="480.0" y="254.0" text-anchor="middle" class="label">Verhaal 2 — Willemijn</text>
<text x="480.0" y="272.0" text-anchor="middle" class="sub">extern signaal → dossier</text>
<text x="480.0" y="287.0" text-anchor="middle" class="sub">'te onderzoeken' → be-</text>
<text x="480.0" y="302.0" text-anchor="middle" class="sub">vestigd na navraag → ge-</text>
<text x="480.0" y="317.0" text-anchor="middle" class="sub">meld aan Mutatieplatform</text>
<rect x="652" y="150" width="268" height="220" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="786.0" y="254.0" text-anchor="middle" class="label">Verhaal 3 — Daan</text>
<text x="786.0" y="272.0" text-anchor="middle" class="sub">adreswijziging partner</text>
<text x="786.0" y="287.0" text-anchor="middle" class="sub">in ander formulier →</text>
<text x="786.0" y="302.0" text-anchor="middle" class="sub">niet herkend → pas</text>
<text x="786.0" y="317.0" text-anchor="middle" class="sub">maanden later alsnog</text>
<text x="786.0" y="332.0" text-anchor="middle" class="sub">vastgesteld</text>
<rect x="40" y="410" width="880" height="50" rx="6" fill="#DFDCD3" stroke="#55606F" stroke-width="1"/>
<text x="480" y="440" text-anchor="middle" class="kicker">drie routes, hetzelfde eindpunt</text>
</svg>