<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'DM Sans', Arial, sans-serif" width="960" height="640" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .red-fill { fill:#DFDCD3; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:21px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .field-num { font-size:12px; font-weight:700; fill:#FFFFFF; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-a { stroke:#E9A13B; stroke-width:2; fill:none; marker-end:url(#arra); }
</style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
    </defs>
<rect width="960" height="640" class="paper"/>
<text x="40" y="34" text-anchor="start" class="kicker" >DEEL 25 · INSTRUMENT</text>
<text x="40" y="64" text-anchor="start" class="title" >De garantiekaart</text>
<text x="40" y="90" text-anchor="start" class="sub" >Voor een keten van stappen over meerdere systemen: welke consistentiegarantie geldt, en houdt</text>
<text x="40" y="107" text-anchor="start" class="sub" >die stand voor de deelnemer.</text>
<circle cx="58" cy="164" r="14" fill="#2563A8" stroke="none" stroke-width="0"/>
<text x="58" y="169" text-anchor="middle" class="field-num" >1</text>
<rect x="40" y="184" width="880" height="62" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5" />
<text x="56" y="206" text-anchor="start" class="label" >VELD 1 — WELKE GARANTIE GELDT HIER: STRIKT, OF EVENTUEEL</text>
<text x="56" y="226" text-anchor="start" class="sub" >per stap zelf strikt, tussen stappen doorgaans eventual consistency</text>
<circle cx="58" cy="276" r="14" fill="#2563A8" stroke="none" stroke-width="0"/>
<text x="58" y="281" text-anchor="middle" class="field-num" >2</text>
<rect x="40" y="296" width="880" height="62" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5" />
<text x="56" y="318" text-anchor="start" class="label" >VELD 2 — HOE LANG MAG DE TUSSENTIJD DUREN, AANTOONBAAR</text>
<text x="56" y="338" text-anchor="start" class="sub" >een bekende, begrensde tijd — geen vage belofte als “snel”</text>
<circle cx="58" cy="388" r="14" fill="#2563A8" stroke="none" stroke-width="0"/>
<text x="58" y="393" text-anchor="middle" class="field-num" >3</text>
<rect x="40" y="408" width="880" height="62" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5" />
<text x="56" y="430" text-anchor="start" class="label" >VELD 3 — WAT GEBEURT ER ALS EEN STAP IN DIE TUSSENTIJD MISLUKT</text>
<text x="56" y="450" text-anchor="start" class="sub" >compenserende stap nodig? tegen welke prijs, wie ziet dat hij plaatsvond</text>
<circle cx="58" cy="500" r="15" fill="#E9A13B" stroke="none" stroke-width="0"/>
<path d="M52 500 l4 4 l8 -9" stroke="#14213D" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="519" width="880" height="60" rx="6" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5" />
<text x="56" y="541" text-anchor="start" class="label" fill="#9A5F0D">VELD 4 — HET VELD DAT HET VERSCHIL MAAKT: ONZICHTBAAR OF MERKBAAR-SCHADELIJK</text>
<text x="56" y="561" text-anchor="start" class="sub" >bepaalt of een technisch haalbare garantie ook verdedigbaar is voor de deelnemer</text>
</svg>