<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="'DM Sans', Arial, sans-serif" width="960" height="470" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:21px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-a { stroke:#E9A13B; stroke-width:2; fill:none; marker-end:url(#arra); }
    </style>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
    </defs>
<rect width="960" height="470" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 17 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">De vier kaarttypen in kleur</text>
<text x="40" y="96" class="sub" text-anchor="start">Geel bovenaan, blauw ernaast, groen eronder in een rij, rood los ertussen.</text>
<rect x="370" y="110" width="220" height="70" rx="8" fill="#E9A13B" stroke="#9A5F0D" stroke-width="1"/>
<text x="480.0" y="149.0" text-anchor="middle" class="label">GEEL — de regel</text>
<rect x="680" y="110" width="220" height="70" rx="8" fill="#6FA3D6" stroke="#2563A8" stroke-width="1"/>
<text x="790.0" y="149.0" text-anchor="middle" class="label">BLAUW — randvoorwaarde</text>
<rect x="60" y="300" width="300" height="80" rx="8" fill="#CBDCEF" stroke="#2563A8" stroke-width="1"/>
<text x="210.0" y="344.0" text-anchor="middle" class="label">GROEN — voorbeeld</text>
<rect x="390" y="300" width="300" height="80" rx="8" fill="#CBDCEF" stroke="#2563A8" stroke-width="1"/>
<text x="540.0" y="344.0" text-anchor="middle" class="label">GROEN — voorbeeld</text>
<rect x="720" y="300" width="180" height="80" rx="8" fill="#DFDCD3" stroke="#B33A3A" stroke-width="1.5"/>
<text x="810.0" y="344.0" text-anchor="middle" class="label">ROOD — vraag</text>
<path d="M480 180 L210 298" class="arrow"/>
<path d="M480 180 L540 298" class="arrow"/>
<path d="M210 298 L600 180" class="arrow-a"/>
<text x="60" y="420" text-anchor="start" class="kicker">een groen voorbeeld kan tot een nieuwe blauwe of rode kaart leiden</text>
</svg>