<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="'DM Sans', Arial, sans-serif" width="960" height="500" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .red-fill { fill:#DFDCD3; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:21px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .field-num { font-size:12px; font-weight:700; fill:#FFFFFF; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-a { stroke:#E9A13B; stroke-width:2; fill:none; marker-end:url(#arra); }
</style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
    </defs>
<rect width="960" height="500" class="paper"/>
<text x="40" y="34" text-anchor="start" class="kicker" >DEEL 26 · CONCEPTDIAGRAM</text>
<text x="40" y="64" text-anchor="start" class="title" >Een cyclus, geen eenmalige stap</text>
<text x="40" y="90" text-anchor="start" class="sub" >Eigenaarschap, periodieke reconciliatie, vastgelegd besluit — herhaalt zich in plaats van eenmalig</text>
<text x="40" y="107" text-anchor="start" class="sub" >doorlopen te worden.</text>
<rect x="370.0" y="110.5" width="220" height="90" rx="6" fill="#CBDCEF" stroke="#2563A8" stroke-width="1.5" />
<text x="480.0" y="145.5" text-anchor="middle" class="label" >eigenaarschap</text>
<text x="480.0" y="164.5" text-anchor="middle" class="sub" >per begrip</text>
<rect x="495.14067084685144" y="327.25" width="220" height="90" rx="6" fill="#CBDCEF" stroke="#2563A8" stroke-width="1.5" />
<text x="605.1406708468514" y="362.25" text-anchor="middle" class="label" >periodieke</text>
<text x="605.1406708468514" y="381.25" text-anchor="middle" class="sub" >reconciliatie</text>
<rect x="244.85932915314862" y="327.25" width="220" height="90" rx="6" fill="#CBDCEF" stroke="#2563A8" stroke-width="1.5" />
<text x="354.8593291531486" y="362.25" text-anchor="middle" class="label" >vastgelegd,</text>
<text x="354.8593291531486" y="381.25" text-anchor="middle" class="sub" >gedateerd besluit</text>
<circle cx="480" cy="300" r="170" fill="none" stroke="#E9A13B" stroke-width="2" stroke-dasharray="3 5"/>
</svg>