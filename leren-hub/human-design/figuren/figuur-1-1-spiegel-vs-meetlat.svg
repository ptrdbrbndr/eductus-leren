<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
<style>
.label{font-size:15px;font-weight:700;fill:#14213D;}
.sub{font-size:13px;fill:#55606F;}
.title{font-family:'Cormorant Garamond', Georgia, serif;font-size:25px;fill:#14213D;font-weight:600;}
.kicker{font-size:11px;fill:#55606F;letter-spacing:.12em;}
</style>
</defs>
<rect width="960" height="620" fill="#FBFAF7"/>
<text x="40" y="34" class="kicker">DEEL 1 · POSITIONERING</text>
<text x="40" y="64" class="title">Spiegel, geen meetinstrument</text>
<text x="40" y="92" class="sub">Human Design levert in deze cursus geen metingen op, maar een taal om jezelf in te herkennen.</text>

<!-- Left panel: meetlat met kruis -->
<rect x="70" y="150" width="370" height="380" rx="14" fill="#FFFFFF" stroke="#8a3324" stroke-width="1.5"/>
<text x="255" y="190" text-anchor="middle" class="label" fill="#8a3324">Geen meetinstrument</text>
<!-- meetlat -->
<rect x="150" y="260" width="220" height="34" rx="4" fill="#CBDCEF" stroke="#2563A8" stroke-width="2"/>
<g stroke="#2563A8" stroke-width="1.5">
<line x1="172" y1="260" x2="172" y2="294"/>
<line x1="194" y1="260" x2="194" y2="286"/>
<line x1="216" y1="260" x2="216" y2="294"/>
<line x1="238" y1="260" x2="238" y2="286"/>
<line x1="260" y1="260" x2="260" y2="294"/>
<line x1="282" y1="260" x2="282" y2="286"/>
<line x1="304" y1="260" x2="304" y2="294"/>
<line x1="326" y1="260" x2="326" y2="286"/>
<line x1="348" y1="260" x2="348" y2="294"/>
</g>
<!-- kruis eroverheen -->
<g stroke="#8a3324" stroke-width="8" stroke-linecap="round">
<line x1="160" y1="230" x2="360" y2="330"/>
<line x1="360" y1="230" x2="160" y2="330"/>
</g>
<text x="255" y="380" text-anchor="middle" class="sub">Geen bewezen werking</text>
<text x="255" y="400" text-anchor="middle" class="sub">Geen precisie-claim</text>
<text x="255" y="420" text-anchor="middle" class="sub">Geen diagnose</text>
<text x="255" y="480" text-anchor="middle" font-size="13" fill="#8a3324" font-weight="600">"Bewijs het" — dat kan dit systeem niet</text>

<!-- Right panel: spiegel met vinkje -->
<rect x="520" y="150" width="370" height="380" rx="14" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="705" y="190" text-anchor="middle" class="label" fill="#2563A8">Wel een spiegel</text>
<!-- spiegel -->
<ellipse cx="705" cy="290" rx="90" ry="110" fill="#CBDCEF" stroke="#2563A8" stroke-width="4"/>
<ellipse cx="705" cy="290" rx="72" ry="92" fill="#FBFAF7" stroke="#6FA3D6" stroke-width="1.5"/>
<rect x="695" y="392" width="20" height="46" rx="4" fill="#2563A8"/>
<!-- vinkje -->
<g stroke="#E9A13B" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
<path d="M665 292 L695 322 L748 258"/>
</g>
<text x="705" y="480" text-anchor="middle" font-size="13" fill="#2563A8" font-weight="600">"Herken je dit?" — dat kan wél worden gevraagd</text>

<text x="480" y="580" text-anchor="middle" class="sub" fill="#55606F">Deze cursus positioneert Human Design consequent als zelfreflectie-instrument, niet als meetinstrument.</text>
</svg>
