<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
<style>
.label{font-size:14px;font-weight:700;fill:#14213D;}
.label-light{font-size:14px;font-weight:700;fill:#FBFAF7;}
.sub{font-size:12px;fill:#55606F;}
.sub-light{font-size:11.5px;fill:#DFDCD3;}
.title{font-family:'Cormorant Garamond', Georgia, serif;font-size:25px;fill:#14213D;font-weight:600;}
.kicker{font-size:11px;fill:#55606F;letter-spacing:.12em;}
</style>
<marker id="arr23" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
</defs>
<rect width="960" height="620" fill="#FBFAF7"/>
<text x="40" y="34" class="kicker">DEEL 23 · VIER RONDES</text>
<text x="40" y="64" class="title">De readingmarathon — van bekend naar zelfstandig</text>
<text x="40" y="92" class="sub">Elke ronde ±20 minuten: vijftien minuten reading, vijf minuten peer-feedback.</text>

<!-- 4 circles in a row with arrows -->
<circle cx="150" cy="300" r="95" fill="#CBDCEF" stroke="#2563A8" stroke-width="2.5"/>
<text x="150" y="280" text-anchor="middle" class="label">Ronde 1</text>
<text x="150" y="302" text-anchor="middle" class="sub" font-size="11">Bekend terrein</text>
<text x="150" y="322" text-anchor="middle" class="sub" font-size="11">hoofdpersoon,</text>
<text x="150" y="338" text-anchor="middle" class="sub" font-size="11">bekende vraag</text>

<path d="M250 300 L340 300" stroke="#55606F" stroke-width="2" marker-end="url(#arr23)"/>

<circle cx="390" cy="300" r="95" fill="#6FA3D6" stroke="#2563A8" stroke-width="2.5"/>
<text x="390" y="280" text-anchor="middle" class="label-light">Ronde 2</text>
<text x="390" y="302" text-anchor="middle" class="sub-light">Nieuw terrein</text>
<text x="390" y="322" text-anchor="middle" class="sub-light">mini-casus,</text>
<text x="390" y="338" text-anchor="middle" class="sub-light">nieuwe vraag</text>

<path d="M490 300 L580 300" stroke="#55606F" stroke-width="2" marker-end="url(#arr23)"/>

<circle cx="630" cy="300" r="95" fill="#8a3324" stroke="#14213D" stroke-width="2.5"/>
<text x="630" y="280" text-anchor="middle" class="label-light">Ronde 3</text>
<text x="630" y="302" text-anchor="middle" class="sub-light">Het grensgeval</text>
<text x="630" y="322" text-anchor="middle" class="sub-light">grens herkennen</text>
<text x="630" y="338" text-anchor="middle" class="sub-light">en bewaken</text>

<path d="M730 300 L820 300" stroke="#55606F" stroke-width="2" marker-end="url(#arr23)"/>

<circle cx="870" cy="300" r="95" fill="#E9A13B" stroke="#14213D" stroke-width="2.5"/>
<text x="870" y="280" text-anchor="middle" class="label-light">Ronde 4</text>
<text x="870" y="302" text-anchor="middle" class="sub-light">Vrije keuze</text>
<text x="870" y="322" text-anchor="middle" class="sub-light">volledig</text>
<text x="870" y="338" text-anchor="middle" class="sub-light">zelfstandig</text>

<text x="480" y="470" text-anchor="middle" class="sub" fill="#55606F">Na elke ronde: twee zinnen zelfevaluatie. De meetlat is het verschil tussen ronde 1 en ronde 4 — nooit de vergelijking met een andere deelnemer.</text>
</svg>
