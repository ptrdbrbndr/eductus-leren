<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label-light { font-size:13px; font-weight:700; fill:#FBFAF7; }
      .kw { font-size:12.5px; font-weight:700; fill:#14213D; }
      .sub { font-size:11.5px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    </style>
</defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 9 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">De zes lijnarchetypes</text>
<text x="40" y="90" class="sub">Elke lijn draagt een kernthema — als basislijn (van binnenuit) én als projectielijn (van buitenaf).</text>

<!-- hexagon connective ring -->
<polygon points="330,160 477,245 477,415 330,500 183,415 183,245" fill="none" stroke="#E9A13B" stroke-width="1.5" stroke-dasharray="4 5"/>
<circle cx="330" cy="330" r="46" fill="#CBDCEF"/>
<text x="330" y="322" text-anchor="middle" class="kw" font-size="12">Profiel =</text>
<text x="330" y="340" text-anchor="middle" class="kw" font-size="12">2 lijnen</text>

<!-- Line 1 -->
<circle cx="330" cy="160" r="46" fill="#2563A8"/>
<text x="330" y="153" text-anchor="middle" class="label-light" font-size="20">1</text>
<text x="330" y="172" text-anchor="middle" class="label-light" font-size="10.5">Onderzoeker</text>
<text x="330" y="118" text-anchor="middle" class="kw">Fundament</text>
<text x="330" y="134" text-anchor="middle" class="sub">veiligheid door kennis</text>

<!-- Line 2 -->
<circle cx="477" cy="245" r="46" fill="#2563A8"/>
<text x="477" y="238" text-anchor="middle" class="label-light" font-size="20">2</text>
<text x="477" y="257" text-anchor="middle" class="label-light" font-size="10.5">Kluizenaar</text>
<text x="595" y="205" text-anchor="middle" class="kw">Aangeboren talent</text>
<text x="595" y="221" text-anchor="middle" class="sub">bloeit in afzondering</text>

<!-- Line 3 -->
<circle cx="477" cy="415" r="46" fill="#2563A8"/>
<text x="477" y="408" text-anchor="middle" class="label-light" font-size="20">3</text>
<text x="477" y="427" text-anchor="middle" class="label-light" font-size="10.5">Beproever</text>
<text x="600" y="450" text-anchor="middle" class="kw">Vallen en opstaan</text>
<text x="600" y="466" text-anchor="middle" class="sub">leren via ervaring</text>

<!-- Line 4 -->
<circle cx="330" cy="500" r="46" fill="#2563A8"/>
<text x="330" y="493" text-anchor="middle" class="label-light" font-size="20">4</text>
<text x="330" y="512" text-anchor="middle" class="label-light" font-size="10.5">Netwerker</text>
<text x="330" y="555" text-anchor="middle" class="kw">Kansen via netwerk</text>
<text x="330" y="571" text-anchor="middle" class="sub">invloed via vertrouwde band</text>

<!-- Line 5 -->
<circle cx="183" cy="415" r="46" fill="#2563A8"/>
<text x="183" y="408" text-anchor="middle" class="label-light" font-size="20">5</text>
<text x="183" y="427" text-anchor="middle" class="label-light" font-size="10.5">Ketter</text>
<text x="70" y="450" text-anchor="middle" class="kw">Projectieveld</text>
<text x="70" y="466" text-anchor="middle" class="sub">praktische oplosser, op afstand</text>

<!-- Line 6 (highlighted with amber ring, connects to phase timeline) -->
<circle cx="183" cy="245" r="49" fill="#E9A13B"/>
<circle cx="183" cy="245" r="46" fill="#2563A8" stroke="#E9A13B" stroke-width="3"/>
<text x="183" y="238" text-anchor="middle" class="label-light" font-size="20">6</text>
<text x="183" y="257" text-anchor="middle" class="label-light" font-size="10.5">Rolmodel</text>
<text x="70" y="205" text-anchor="middle" class="kw">Drie levensfasen</text>
<text x="70" y="221" text-anchor="middle" class="sub">zie tijdlijn rechts</text>

<!-- connector to timeline box -->
<path d="M229 220 L 610 130" stroke="#E9A13B" stroke-width="1.5" fill="none" stroke-dasharray="3 4"/>

<!-- Lijn 6 timeline box -->
<rect x="610" y="95" width="310" height="150" rx="12" fill="#CBDCEF" stroke="#2563A8" stroke-width="1.5"/>
<text x="765" y="120" text-anchor="middle" class="kw" font-size="12.5">Lijn 6 — drie fasen (canoniek)</text>
<line x1="635" y1="175" x2="895" y2="175" stroke="#14213D" stroke-width="2"/>
<circle cx="635" cy="175" r="4" fill="#14213D"/>
<circle cx="750" cy="175" r="4" fill="#14213D"/>
<circle cx="895" cy="175" r="4" fill="#14213D"/>
<text x="635" y="196" text-anchor="middle" class="sub" font-size="10.5">geboorte</text>
<text x="750" y="196" text-anchor="middle" class="sub" font-size="10.5">± 30 jr</text>
<text x="895" y="196" text-anchor="middle" class="sub" font-size="10.5">± 50 jr</text>
<text x="690" y="215" text-anchor="middle" class="sub" font-size="10.5">fase 1: leeft als 3e lijn</text>
<text x="822" y="215" text-anchor="middle" class="sub" font-size="10.5">fase 2: "het dak op"</text>
<text x="895" y="233" text-anchor="middle" class="sub" font-size="10.5">fase 3: rolmodel</text>

<text x="480" y="608" text-anchor="middle" class="sub">De eerste lijn van een profiel is de basislijn, de tweede de projectielijn (zie §3).</text>
</svg>
