<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
<style>
.label{font-size:12.5px;font-weight:700;fill:#14213D;}
.sub{font-size:11px;fill:#55606F;}
.title{font-family:'Cormorant Garamond', Georgia, serif;font-size:25px;fill:#14213D;font-weight:600;}
.kicker{font-size:11px;fill:#55606F;letter-spacing:.12em;}
.arrow{stroke:#55606F;stroke-width:1.8;fill:none;marker-end:url(#arr);}
.q{font-size:12px;font-weight:700;fill:#FBFAF7;}
</style>
<marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="2.5" orient="auto"><path d="M0,0 L5,2.5 L0,5 Z" fill="#55606F"/></marker>
</defs>
<rect width="960" height="620" fill="#FBFAF7"/>
<text x="40" y="34" class="kicker">DEEL 3 · BESLISBOOM</text>
<text x="40" y="64" class="title">Het type aflezen: twee vragen over de kaart</text>
<text x="40" y="92" class="sub" fill="#55606F">Links de stroomlogica, rechts een mini-bodygraph met de vier motoren gemarkeerd.</text>

<!-- stroomdiagram -->
<rect x="40" y="130" width="190" height="55" rx="10" fill="#14213D"/>
<text x="135" y="163" text-anchor="middle" class="q">Definitie aanwezig?</text>
<path class="arrow" d="M135 185 L135 215"/>
<text x="150" y="205" font-size="10.5" fill="#55606F">nee</text>
<rect x="40" y="215" width="190" height="50" rx="10" fill="#8a3324"/>
<text x="135" y="245" text-anchor="middle" class="q">Reflector</text>

<path class="arrow" d="M230 155 L280 155"/>
<text x="240" y="145" font-size="10.5" fill="#55606F">ja</text>
<rect x="280" y="130" width="200" height="55" rx="10" fill="#14213D"/>
<text x="380" y="163" text-anchor="middle" class="q">Sacraal gedefinieerd?</text>

<path class="arrow" d="M380 185 L380 240"/>
<text x="390" y="215" font-size="10.5" fill="#55606F">ja</text>
<rect x="280" y="240" width="200" height="50" rx="10" fill="#14213D"/>
<text x="380" y="270" text-anchor="middle" class="q">Motor → keel verbonden?</text>
<path class="arrow" d="M300 290 L300 330"/>
<text x="230" y="315" font-size="10.5" fill="#55606F">nee</text>
<rect x="200" y="330" width="150" height="45" rx="10" fill="#2563A8"/>
<text x="275" y="358" text-anchor="middle" class="q">Generator</text>
<path class="arrow" d="M440 290 L440 330"/>
<text x="450" y="315" font-size="10.5" fill="#55606F">ja</text>
<rect x="365" y="330" width="170" height="45" rx="10" fill="#6FA3D6"/>
<text x="450" y="358" text-anchor="middle" class="q">Manifesting Generator</text>

<path class="arrow" d="M480 155 L560 155"/>
<text x="500" y="145" font-size="10.5" fill="#55606F">sacraal open</text>
<rect x="560" y="130" width="220" height="55" rx="10" fill="#14213D"/>
<text x="670" y="163" text-anchor="middle" class="q">Motor → keel verbonden?</text>
<path class="arrow" d="M670 185 L610 215"/>
<text x="590" y="210" font-size="10.5" fill="#55606F">ja</text>
<rect x="540" y="215" width="150" height="45" rx="10" fill="#E9A13B"/>
<text x="615" y="243" text-anchor="middle" class="q" fill="#14213D">Manifestor</text>
<path class="arrow" d="M670 185 L730 215"/>
<text x="710" y="210" font-size="10.5" fill="#55606F">nee</text>
<rect x="700" y="215" width="150" height="45" rx="10" fill="#CBDCEF"/>
<text x="775" y="243" text-anchor="middle" class="q" fill="#14213D">Projector</text>

<!-- mini bodygraph met vier motoren gemarkeerd -->
<g transform="translate(560,300) scale(0.42)">
  <g id="bodygraph-basis">
    <g stroke="#c7c2b6" stroke-width="4" fill="none">
      <line x1="250" y1="95"  x2="250" y2="110"/>
      <line x1="250" y1="180" x2="250" y2="195"/>
      <line x1="250" y1="275" x2="250" y2="295"/>
      <line x1="215" y1="255" x2="150" y2="450"/>
      <line x1="285" y1="255" x2="345" y2="375"/>
      <line x1="250" y1="275" x2="250" y2="430"/>
      <line x1="285" y1="260" x2="365" y2="450"/>
      <line x1="220" y1="365" x2="160" y2="460"/>
      <line x1="280" y1="365" x2="345" y2="385"/>
      <line x1="250" y1="405" x2="250" y2="430"/>
      <line x1="180" y1="470" x2="205" y2="470"/>
      <line x1="160" y1="500" x2="215" y2="580"/>
      <line x1="250" y1="510" x2="250" y2="565"/>
      <line x1="295" y1="470" x2="345" y2="470"/>
      <line x1="365" y1="500" x2="285" y2="580"/>
      <line x1="345" y1="400" x2="200" y2="465"/>
      <line x1="345" y1="400" x2="360" y2="450"/>
    </g>
    <polygon points="250,30 210,95 290,95" fill="#FFFFFF" stroke="#14213D" stroke-width="3"/>
    <polygon points="210,110 290,110 250,180" fill="#FFFFFF" stroke="#14213D" stroke-width="3"/>
    <rect x="205" y="195" width="90" height="80" fill="#FFFFFF" stroke="#14213D" stroke-width="3"/>
    <polygon points="250,295 320,350 250,405 180,350" fill="#FFFFFF" stroke="#14213D" stroke-width="3"/>
    <polygon points="400,360 340,385 400,410" fill="#E9A13B" stroke="#14213D" stroke-width="3"/>
    <polygon points="60,440 60,500 160,470" fill="#FFFFFF" stroke="#14213D" stroke-width="3"/>
    <rect x="205" y="430" width="90" height="80" fill="#E9A13B" stroke="#14213D" stroke-width="3"/>
    <polygon points="390,440 390,500 295,470" fill="#E9A13B" stroke="#14213D" stroke-width="3"/>
    <rect x="200" y="565" width="100" height="70" fill="#E9A13B" stroke="#14213D" stroke-width="3"/>
    <g font-family="'DM Sans', Arial, sans-serif" font-size="26" fill="#14213D" font-weight="700" text-anchor="middle">
      <text x="415" y="380">Hart</text>
      <text x="250" y="475" dy="8">Sacraal</text>
      <text x="405" y="475">S.Plexus</text>
      <text x="250" y="655">Wortel</text>
    </g>
  </g>
</g>
<text x="700" y="470" text-anchor="middle" font-size="12" fill="#14213D" font-weight="600">De vier motoren (amber): sacraal, hart/ego, solar plexus, wortel</text>
<text x="700" y="490" text-anchor="middle" class="sub">"Motor → keel" = ononderbroken route van complete kanalen, direct of via tussenstations.</text>
</svg>
