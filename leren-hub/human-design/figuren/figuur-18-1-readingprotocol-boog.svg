<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper{fill:#FBFAF7;}
    .label{font-size:13.5px;font-weight:700;fill:#14213D;}
    .label-light{font-size:13px;font-weight:700;fill:#FBFAF7;}
    .sub{font-size:11.5px;fill:#55606F;}
    .title{font-family:'Cormorant Garamond', Georgia, serif;font-size:25px;fill:#14213D;font-weight:600;}
    .kicker{font-size:11px;fill:#55606F;letter-spacing:.12em;}
  </style>
</defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 18 · HET READINGPROTOCOL</text>
<text x="40" y="64" class="title">De gespreksboog — zes fasen, van intake tot afsluiting</text>
<text x="40" y="90" class="sub">Kaartkennis verandert niet; wat verandert, is de context — er is nu een echte gesprekspartner.</text>

<polyline points="110,470 258,317 406,223 554,223 702,317 850,470" fill="none" stroke="#6FA3D6" stroke-width="4"/>

<!-- Fase 1 -->
<circle cx="110" cy="470" r="30" fill="#2563A8" stroke="#14213D" stroke-width="2"/>
<text x="110" y="476" text-anchor="middle" class="label-light" font-size="16">1</text>
<text x="110" y="520" text-anchor="middle" class="label">Intake</text>
<text x="110" y="538" text-anchor="middle" class="sub">verwachtingen,</text>
<text x="110" y="552" text-anchor="middle" class="sub">gegevens, grenzen</text>

<!-- Fase 2 -->
<circle cx="258" cy="317" r="30" fill="#2563A8" stroke="#14213D" stroke-width="2"/>
<text x="258" y="323" text-anchor="middle" class="label-light" font-size="16">2</text>
<text x="258" y="278" text-anchor="middle" class="label">Beschrijven</text>
<text x="258" y="262" text-anchor="middle" class="sub">stil, in jezelf</text>
<rect x="188" y="360" width="140" height="42" rx="8" fill="#CBDCEF" stroke="#6FA3D6"/>
<text x="258" y="377" text-anchor="middle" class="sub" font-weight="700" fill="#14213D">zes-stappenformulier</text>
<text x="258" y="393" text-anchor="middle" class="sub">(deel 2)</text>

<!-- Fase 3 -->
<circle cx="406" cy="223" r="30" fill="#2563A8" stroke="#14213D" stroke-width="2"/>
<text x="406" y="229" text-anchor="middle" class="label-light" font-size="16">3</text>
<text x="406" y="184" text-anchor="middle" class="label">Luisteren</text>
<text x="406" y="168" text-anchor="middle" class="sub">vóór duiden</text>

<!-- Fase 4 -->
<circle cx="554" cy="223" r="30" fill="#2563A8" stroke="#E9A13B" stroke-width="3"/>
<text x="554" y="229" text-anchor="middle" class="label-light" font-size="16">4</text>
<text x="554" y="184" text-anchor="middle" class="label">Dialoog</text>
<text x="554" y="168" text-anchor="middle" class="sub">gestapelde duiding</text>
<rect x="484" y="266" width="140" height="42" rx="8" fill="#CBDCEF" stroke="#6FA3D6"/>
<text x="554" y="283" text-anchor="middle" class="sub" font-weight="700" fill="#14213D">veertien-lagen-trap</text>
<text x="554" y="299" text-anchor="middle" class="sub">(deel 17), selectief</text>

<!-- Fase 5 -->
<circle cx="702" cy="317" r="30" fill="#2563A8" stroke="#14213D" stroke-width="2"/>
<text x="702" y="323" text-anchor="middle" class="label-light" font-size="16">5</text>
<text x="702" y="278" text-anchor="middle" class="label">Weerklank</text>
<text x="702" y="262" text-anchor="middle" class="sub">wat klopt er niet?</text>

<!-- Fase 6 -->
<circle cx="850" cy="470" r="30" fill="#2563A8" stroke="#14213D" stroke-width="2"/>
<text x="850" y="476" text-anchor="middle" class="label-light" font-size="16">6</text>
<text x="850" y="520" text-anchor="middle" class="label">Afsluiting</text>
<text x="850" y="538" text-anchor="middle" class="sub">samenvatten,</text>
<text x="850" y="552" text-anchor="middle" class="sub">evt. experiment</text>

<text x="480" y="595" text-anchor="middle" class="sub" fill="#9A5F0D">De cliënt is aan het woord — nooit een monoloog. Geen enkele fase levert een antwoord, wél een toetsvraag.</text>
</svg>
