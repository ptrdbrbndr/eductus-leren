<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
<style>
.label{font-size:13px;font-weight:700;fill:#FBFAF7;}
.title{font-family:'Cormorant Garamond', Georgia, serif;font-size:25px;fill:#14213D;font-weight:600;}
.kicker{font-size:11px;fill:#55606F;letter-spacing:.12em;}
.sub{font-size:12.5px;fill:#55606F;}
.arrow{stroke:#55606F;stroke-width:2;fill:none;marker-end:url(#arr);}
</style>
<marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
</defs>
<rect width="960" height="620" fill="#FBFAF7"/>
<text x="40" y="34" class="kicker">DEEL 1 · REDENEERKETEN</text>
<text x="40" y="64" class="title">Van geboortedata naar type, strategie en autoriteit</text>
<text x="40" y="92" class="sub">Alles wat Human Design over een persoon zegt, hangt aan deze keten van vijf schakels.</text>

<!-- zes stages, vijf pijlen -->
<g>
<rect x="30" y="220" width="150" height="150" rx="10" fill="#2563A8"/>
<text x="105" y="285" text-anchor="middle" class="label">Geboorte-</text>
<text x="105" y="303" text-anchor="middle" class="label">data</text>
<text x="105" y="330" text-anchor="middle" font-size="11" fill="#DFDCD3">datum, tijd, plaats</text>
</g>
<path class="arrow" d="M185 295 L215 295"/>

<g>
<rect x="220" y="220" width="150" height="150" rx="10" fill="#6FA3D6"/>
<text x="295" y="285" text-anchor="middle" class="label">Twee</text>
<text x="295" y="303" text-anchor="middle" class="label">berekeningen</text>
<text x="295" y="330" text-anchor="middle" font-size="11" fill="#DFDCD3">persoonlijkheid + design</text>
</g>
<path class="arrow" d="M375 295 L405 295"/>

<g>
<rect x="410" y="220" width="150" height="150" rx="10" fill="#2563A8"/>
<text x="485" y="285" text-anchor="middle" class="label">Geactiveerde</text>
<text x="485" y="303" text-anchor="middle" class="label">poorten</text>
<text x="485" y="330" text-anchor="middle" font-size="11" fill="#DFDCD3">rood, zwart, gestreept</text>
</g>
<path class="arrow" d="M565 295 L595 295"/>

<g>
<rect x="600" y="220" width="150" height="150" rx="10" fill="#6FA3D6"/>
<text x="675" y="285" text-anchor="middle" class="label">Complete</text>
<text x="675" y="303" text-anchor="middle" class="label">kanalen</text>
<text x="675" y="330" text-anchor="middle" font-size="11" fill="#DFDCD3">beide poorten actief</text>
</g>
<path class="arrow" d="M755 295 L785 295"/>

<g>
<rect x="790" y="220" width="150" height="150" rx="10" fill="#E9A13B"/>
<text x="865" y="278" text-anchor="middle" class="label" fill="#14213D">Gedefinieerde</text>
<text x="865" y="296" text-anchor="middle" class="label" fill="#14213D">centra</text>
<text x="865" y="323" text-anchor="middle" font-size="11" fill="#14213D">→ type, strategie,</text>
<text x="865" y="338" text-anchor="middle" font-size="11" fill="#14213D">autoriteit</text>
</g>

<text x="480" y="450" text-anchor="middle" font-size="13" fill="#14213D" font-weight="600">Elke schakel volgt mechanisch uit de vorige — geen enkele stap is een interpretatie.</text>
<text x="480" y="475" text-anchor="middle" class="sub">Niveau 1 leert je deze keten in grote lijnen volgen; niveau 2 leert je hem zelf berekenen.</text>
</svg>
