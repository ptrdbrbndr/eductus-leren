<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:12px; font-weight:700; fill:#14213D; }
      .label-light { font-size:12px; font-weight:700; fill:#FBFAF7; }
      .tag { font-size:10.5px; font-weight:600; fill:#9A5F0D; font-family:'DM Sans', Arial, sans-serif; letter-spacing:.02em; }
      .tag-light { font-size:10.5px; font-weight:600; fill:#FBE7C4; font-family:'DM Sans', Arial, sans-serif; letter-spacing:.02em; }
      .num { font-size:20px; font-weight:700; fill:#2563A8; font-family:'Cormorant Garamond', Georgia, serif; }
      .num-light { font-size:20px; font-weight:700; fill:#FBFAF7; font-family:'Cormorant Garamond', Georgia, serif; }
      .sub { font-size:12px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    </style>
    <marker id="arr8" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
</defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 8 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Zeven stappen naar een volledige chart-analyse</text>
<text x="40" y="92" class="sub">Elke trede is een laag uit een eerder deel — vandaag zet je de zeven tredes samen tot één verhaal.</text>

<!-- grondlijn -->
<line x1="45" y1="560" x2="915" y2="560" stroke="#c7c2b6" stroke-width="2"/>

<!-- Trede 1: Basisgegevens (deel 2) -->
<rect x="60" y="505" width="100" height="55" fill="#FFFFFF" stroke="#2563A8" stroke-width="2"/>
<text x="110" y="481" text-anchor="middle" class="label">Basisgegevens</text>
<text x="110" y="497" text-anchor="middle" class="tag">deel 2</text>
<text x="110" y="543" text-anchor="middle" class="num">1</text>

<!-- Trede 2: Centra-inventarisatie (deel 2) -->
<rect x="180" y="453" width="100" height="107" fill="#FFFFFF" stroke="#2563A8" stroke-width="2"/>
<text x="230" y="415" text-anchor="middle" class="label" font-size="11">Centra-</text>
<text x="230" y="429" text-anchor="middle" class="label" font-size="11">inventarisatie</text>
<text x="230" y="445" text-anchor="middle" class="tag">deel 2</text>
<text x="230" y="543" text-anchor="middle" class="num">2</text>

<!-- Trede 3: Type en strategie (deel 3) -->
<rect x="300" y="401" width="100" height="159" fill="#FFFFFF" stroke="#2563A8" stroke-width="2"/>
<text x="350" y="363" text-anchor="middle" class="label">Type en</text>
<text x="350" y="377" text-anchor="middle" class="label">strategie</text>
<text x="350" y="393" text-anchor="middle" class="tag">deel 3</text>
<text x="350" y="543" text-anchor="middle" class="num">3</text>

<!-- Trede 4: Autoriteit (deel 4) -->
<rect x="420" y="349" width="100" height="211" fill="#FFFFFF" stroke="#2563A8" stroke-width="2"/>
<text x="470" y="325" text-anchor="middle" class="label">Autoriteit</text>
<text x="470" y="341" text-anchor="middle" class="tag">deel 4</text>
<text x="470" y="543" text-anchor="middle" class="num">4</text>

<!-- Trede 5: Gedefinieerde centra (deel 5) -->
<rect x="540" y="297" width="100" height="263" fill="#FFFFFF" stroke="#2563A8" stroke-width="2"/>
<text x="590" y="259" text-anchor="middle" class="label" font-size="11">Gedefinieerde</text>
<text x="590" y="273" text-anchor="middle" class="label" font-size="11">centra</text>
<text x="590" y="289" text-anchor="middle" class="tag">deel 5</text>
<text x="590" y="543" text-anchor="middle" class="num">5</text>

<!-- Trede 6: Open centra (deel 6) -->
<rect x="660" y="245" width="100" height="315" fill="#FFFFFF" stroke="#2563A8" stroke-width="2"/>
<text x="710" y="221" text-anchor="middle" class="label">Open centra</text>
<text x="710" y="237" text-anchor="middle" class="tag">deel 6</text>
<text x="710" y="543" text-anchor="middle" class="num">6</text>

<!-- Trede 7: Toetsstatus (deel 7) -->
<rect x="780" y="193" width="100" height="367" fill="#2563A8" stroke="#E9A13B" stroke-width="3"/>
<text x="830" y="169" text-anchor="middle" class="label-light">Toetsstatus</text>
<text x="830" y="185" text-anchor="middle" class="tag-light">deel 7</text>
<text x="830" y="543" text-anchor="middle" class="num-light">7</text>

<!-- vandaag-annotatie -->
<path d="M865 145 C 845 150, 835 165, 830 190" stroke="#E9A13B" stroke-width="1.5" fill="none" marker-end="url(#arr8)"/>
<text x="870" y="142" text-anchor="start" class="tag">vandaag: deel 8</text>
<text x="870" y="156" text-anchor="start" class="tag">(synthese, geen nieuwe trede)</text>

<text x="480" y="596" text-anchor="middle" class="sub" fill="#9A5F0D">Elke trede levert een bouwsteen; deel 8 voegt geen achtste trede toe, maar zet de zeven samen tot één analyse.</text>
</svg>
