<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:13px; font-weight:700; fill:#14213D; }
      .label-light { font-size:13px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:11.5px; fill:#55606F; }
      .sub-light { font-size:11.5px; fill:#EAF1FA; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .rowlabel { font-size:13px; font-weight:700; fill:#14213D; }
      .tick { font-size:11px; fill:#55606F; }
    </style>
    </defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 7 · TIJDLIJN</text>
<text x="40" y="64" class="title">Het zeven-jaren-experiment: ontconditionering per type</text>
<text x="40" y="94" class="sub">Canonieke duur, niet onderzocht in getal — het onderliggende punt is herhaalde toetsing over tijd (zie §2).</text>

<!-- Row 1: Manifestor -->
<text x="40" y="176" class="rowlabel">Manifestor</text>
<rect x="230" y="150" width="650" height="42" rx="8" class="blue-dark"/>
<text x="555" y="176" text-anchor="middle" class="label-light">Informeren oefenen tot het geen inspanning meer kost</text>
<circle cx="276" cy="150" r="7" class="amber-fill"/>
<text x="276" y="138" text-anchor="middle" class="sub">start: bewust informeren</text>
<circle cx="834" cy="192" r="7" class="amber-fill"/>
<text x="834" y="212" text-anchor="middle" class="sub">±7 jr: gaat vanzelf</text>

<!-- Row 2: Generator / Manifesting Generator -->
<text x="40" y="266" class="rowlabel">Generator /</text>
<text x="40" y="281" class="rowlabel">Manifesting Gen.</text>
<rect x="230" y="240" width="650" height="42" rx="8" class="blue-mid"/>
<text x="555" y="266" text-anchor="middle" class="label" fill="#14213D">Sacrale respons herkennen tot het de standaardreflex wordt</text>
<circle cx="276" cy="240" r="7" class="amber-fill"/>
<text x="276" y="228" text-anchor="middle" class="sub">start: respons leren voelen</text>
<circle cx="834" cy="282" r="7" class="amber-fill"/>
<text x="834" y="302" text-anchor="middle" class="sub">±7 jr: standaardreflex</text>

<!-- Row 3: Projector -->
<text x="40" y="356" class="rowlabel">Projector</text>
<rect x="230" y="330" width="650" height="42" rx="8" class="blue-fill"/>
<text x="555" y="356" text-anchor="middle" class="label" fill="#14213D">Wachten op uitnodiging + succes leren herkennen</text>
<circle cx="322" cy="330" r="7" class="amber-fill"/>
<text x="322" y="318" text-anchor="middle" class="sub">kortere herkenningsfase</text>
<circle cx="834" cy="372" r="7" class="amber-fill"/>
<text x="834" y="392" text-anchor="middle" class="sub">±7 jr: succes herkennen</text>

<!-- Row 4: Reflector -->
<text x="40" y="446" class="rowlabel">Reflector</text>
<rect x="230" y="420" width="650" height="42" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="2" stroke-dasharray="2 4"/>
<text x="555" y="446" text-anchor="middle" class="label" fill="#14213D">Omgeving en maancyclus leren vertrouwen als instrument</text>
<circle cx="322" cy="441" r="4" fill="#FFFFFF" stroke="#2563A8" stroke-width="2"/>
<circle cx="415" cy="441" r="4" fill="#FFFFFF" stroke="#2563A8" stroke-width="2"/>
<circle cx="508" cy="441" r="4" fill="#FFFFFF" stroke="#2563A8" stroke-width="2"/>
<circle cx="601" cy="441" r="4" fill="#FFFFFF" stroke="#2563A8" stroke-width="2"/>
<circle cx="694" cy="441" r="4" fill="#FFFFFF" stroke="#2563A8" stroke-width="2"/>
<circle cx="787" cy="441" r="4" fill="#FFFFFF" stroke="#2563A8" stroke-width="2"/>
<text x="834" y="412" text-anchor="middle" class="sub">±7 jr voor het geheel</text>
<text x="555" y="478" text-anchor="middle" class="sub">elk rondje ≈ één maancyclus per beslissing</text>

<!-- Axis -->
<line x1="230" y1="500" x2="880" y2="500" stroke="#55606F" stroke-width="1.5"/>
<g class="tick">
  <line x1="230" y1="496" x2="230" y2="504" stroke="#55606F"/><text x="230" y="518" text-anchor="middle">0</text>
  <line x1="323" y1="496" x2="323" y2="504" stroke="#55606F"/><text x="323" y="518" text-anchor="middle">1</text>
  <line x1="416" y1="496" x2="416" y2="504" stroke="#55606F"/><text x="416" y="518" text-anchor="middle">2</text>
  <line x1="509" y1="496" x2="509" y2="504" stroke="#55606F"/><text x="509" y="518" text-anchor="middle">3</text>
  <line x1="601" y1="496" x2="601" y2="504" stroke="#55606F"/><text x="601" y="518" text-anchor="middle">4</text>
  <line x1="694" y1="496" x2="694" y2="504" stroke="#55606F"/><text x="694" y="518" text-anchor="middle">5</text>
  <line x1="787" y1="496" x2="787" y2="504" stroke="#55606F"/><text x="787" y="518" text-anchor="middle">6</text>
  <line x1="880" y1="496" x2="880" y2="504" stroke="#55606F"/><text x="880" y="518" text-anchor="middle">7 jaar</text>
</g>
<text x="480" y="556" text-anchor="middle" class="sub" fill="#9A5F0D">Canonwaarde uit de leer van Ra Uru Hu — geen onderzoek onderbouwt de precieze duur; zie de kanttekening in §2 van de reader.</text>
</svg>
