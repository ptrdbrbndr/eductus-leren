<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
<style>
.label{font-size:13px;font-weight:700;fill:#14213D;}
.labelw{font-size:13px;font-weight:700;fill:#FBFAF7;}
.sub{font-size:11px;fill:#55606F;}
.subw{font-size:11px;fill:#DFDCD3;}
.title{font-family:'Cormorant Garamond', Georgia, serif;font-size:25px;fill:#14213D;font-weight:600;}
.kicker{font-size:11px;fill:#55606F;letter-spacing:.12em;}
</style>
</defs>
<rect width="960" height="620" fill="#FBFAF7"/>
<text x="40" y="34" class="kicker">DEEL 3 · OVERZICHTSPOSTER</text>
<text x="40" y="64" class="title">Vijf types, vijf strategieën, vijf personen</text>
<text x="40" y="92" class="sub">Dezelfde tabel uit de reader, nu als poster om in één oogopslag te overzien.</text>

<!-- 5 kolommen -->
<g>
<!-- Generator -->
<rect x="40" y="130" width="170" height="420" rx="10" fill="#2563A8"/>
<text x="125" y="165" text-anchor="middle" class="labelw">Generator</text>
<text x="125" y="195" text-anchor="middle" class="subw">Strategie</text>
<text x="125" y="212" text-anchor="middle" font-size="11.5" fill="#FBFAF7">Wachten om te reageren</text>
<text x="125" y="245" text-anchor="middle" class="subw">Niet-zelf</text>
<text x="125" y="262" text-anchor="middle" font-size="11.5" fill="#FBFAF7">Frustratie</text>
<text x="125" y="295" text-anchor="middle" class="subw">Signatuur</text>
<text x="125" y="312" text-anchor="middle" font-size="11.5" fill="#FBFAF7">Bevrediging</text>
<circle cx="125" cy="460" r="34" fill="#FBFAF7"/>
<text x="125" y="467" text-anchor="middle" font-size="15" fill="#2563A8" font-weight="700">Emma</text>
<text x="125" y="520" text-anchor="middle" font-size="10.5" fill="#FBFAF7">zorgcoördinator</text>
</g>

<g>
<!-- MG -->
<rect x="222" y="130" width="170" height="420" rx="10" fill="#6FA3D6"/>
<text x="307" y="165" text-anchor="middle" class="labelw">Manifesting</text>
<text x="307" y="182" text-anchor="middle" class="labelw">Generator</text>
<text x="307" y="212" text-anchor="middle" class="subw">Strategie</text>
<text x="307" y="229" text-anchor="middle" font-size="11" fill="#FBFAF7">Reageren, dan informeren</text>
<text x="307" y="260" text-anchor="middle" class="subw">Niet-zelf</text>
<text x="307" y="277" text-anchor="middle" font-size="11.5" fill="#FBFAF7">Frustratie/woede</text>
<text x="307" y="310" text-anchor="middle" class="subw">Signatuur</text>
<text x="307" y="327" text-anchor="middle" font-size="11.5" fill="#FBFAF7">Bevrediging/vrede</text>
<circle cx="307" cy="460" r="34" fill="#FBFAF7"/>
<text x="307" y="467" text-anchor="middle" font-size="15" fill="#2563A8" font-weight="700">Sofie</text>
<text x="307" y="520" text-anchor="middle" font-size="10.5" fill="#FBFAF7">ondernemer</text>
</g>

<g>
<!-- Projector -->
<rect x="404" y="130" width="170" height="420" rx="10" fill="#CBDCEF"/>
<text x="489" y="165" text-anchor="middle" class="label">Projector</text>
<text x="489" y="195" text-anchor="middle" font-size="11" fill="#14213D" font-weight="700">Strategie</text>
<text x="489" y="212" text-anchor="middle" font-size="11.5" fill="#14213D">Wachten op de uitnodiging</text>
<text x="489" y="245" text-anchor="middle" font-size="11" fill="#14213D" font-weight="700">Niet-zelf</text>
<text x="489" y="262" text-anchor="middle" font-size="11.5" fill="#14213D">Bitterheid</text>
<text x="489" y="295" text-anchor="middle" font-size="11" fill="#14213D" font-weight="700">Signatuur</text>
<text x="489" y="312" text-anchor="middle" font-size="11.5" fill="#14213D">Succes</text>
<circle cx="489" cy="460" r="34" fill="#FBFAF7" stroke="#2563A8" stroke-width="2"/>
<text x="489" y="467" text-anchor="middle" font-size="15" fill="#2563A8" font-weight="700">Jasper</text>
<text x="489" y="520" text-anchor="middle" font-size="10.5" fill="#14213D">IT-consultant</text>
</g>

<g>
<!-- Manifestor -->
<rect x="586" y="130" width="170" height="420" rx="10" fill="#E9A13B"/>
<text x="671" y="165" text-anchor="middle" class="label">Manifestor</text>
<text x="671" y="195" text-anchor="middle" font-size="11" fill="#14213D" font-weight="700">Strategie</text>
<text x="671" y="212" text-anchor="middle" font-size="11.5" fill="#14213D">Informeren voor het handelen</text>
<text x="671" y="245" text-anchor="middle" font-size="11" fill="#14213D" font-weight="700">Niet-zelf</text>
<text x="671" y="262" text-anchor="middle" font-size="11.5" fill="#14213D">Woede</text>
<text x="671" y="295" text-anchor="middle" font-size="11" fill="#14213D" font-weight="700">Signatuur</text>
<text x="671" y="312" text-anchor="middle" font-size="11.5" fill="#14213D">Vrede</text>
<circle cx="671" cy="460" r="34" fill="#FBFAF7"/>
