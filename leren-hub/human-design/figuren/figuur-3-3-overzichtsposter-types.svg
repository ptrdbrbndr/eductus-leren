<text x="671" y="520" text-anchor="middle" font-size="10.5" fill="#14213D">schoolleider</text>
</g>

<g>
<!-- Reflector -->
<rect x="768" y="130" width="152" height="420" rx="10" fill="#8a3324"/>
<text x="844" y="165" text-anchor="middle" class="labelw">Reflector</text>
<text x="844" y="195" text-anchor="middle" class="subw">Strategie</text>
<text x="844" y="212" text-anchor="middle" font-size="10.5" fill="#FBFAF7">Maancyclus wachten</text>
<text x="844" y="245" text-anchor="middle" class="subw">Niet-zelf</text>
<text x="844" y="262" text-anchor="middle" font-size="11.5" fill="#FBFAF7">Teleurstelling</text>
<text x="844" y="295" text-anchor="middle" class="subw">Signatuur</text>
<text x="844" y="312" text-anchor="middle" font-size="11" fill="#FBFAF7">Verrassing</text>
<circle cx="844" cy="460" r="34" fill="#FBFAF7"/>
<text x="844" y="467" text-anchor="middle" font-size="15" fill="#8a3324" font-weight="700">Lena</text>
<text x="844" y="520" text-anchor="middle" font-size="10.5" fill="#FBFAF7">HR-adviseur</text>
