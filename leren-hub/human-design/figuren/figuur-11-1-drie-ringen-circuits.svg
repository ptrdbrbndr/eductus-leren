<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12.5px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFE7F2; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .chan-line { stroke:#14213D; stroke-width:2; }
      .chan-node { fill:#FBFAF7; stroke:#14213D; stroke-width:1.5; }
      .chan-node-light { fill:#2563A8; stroke:#FBFAF7; stroke-width:1.5; }
    </style>
</defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 11 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Drie circuits als concentrische ringen</text>
<text x="40" y="92" class="sub">Elk kanaal werkt canoniek vóór een van deze drie kringen — van eigen pad tot hele mensheid.</text>

<!-- Outer ring: collectief -->
<circle cx="330" cy="380" r="210" fill="#CBDCEF" stroke="#2563A8" stroke-width="2"/>
<!-- Middle ring: stam -->
<circle cx="330" cy="380" r="140" fill="#6FA3D6" stroke="#2563A8" stroke-width="2"/>
<!-- Inner circle: individueel -->
<circle cx="330" cy="380" r="70" fill="#2563A8" stroke="#14213D" stroke-width="2.5"/>

<!-- Inner label -->
<text x="330" y="374" text-anchor="middle" class="label-light">Individueel</text>
<text x="330" y="392" text-anchor="middle" class="sub-light" font-size="11">eigen pad</text>

<!-- Individueel channel icon (two nodes + line), placed inside inner circle lower half -->
<g>
  <line x1="308" y1="415" x2="352" y2="415" class="chan-line" stroke="#FBFAF7"/>
  <circle cx="308" cy="415" r="5" fill="#FBFAF7" stroke="#14213D" stroke-width="1.2"/>
  <circle cx="352" cy="415" r="5" fill="#FBFAF7" stroke="#14213D" stroke-width="1.2"/>
</g>

<!-- Stam ring label + icon, upper band of middle ring -->
<text x="330" y="258" text-anchor="middle" class="label">Stam</text>
<text x="330" y="276" text-anchor="middle" class="sub" font-size="11">naaste kring</text>
<g>
  <line x1="300" y1="296" x2="360" y2="296" class="chan-line"/>
  <circle cx="300" cy="296" r="5" class="chan-node"/>
  <circle cx="360" cy="296" r="5" class="chan-node"/>
</g>

<!-- Collectief ring label + icon, upper band of outer ring -->
<text x="330" y="128" text-anchor="middle" class="label">Collectief</text>
<text x="330" y="146" text-anchor="middle" class="sub" font-size="11">hele mensheid</text>
<g>
  <line x1="295" y1="166" x2="365" y2="166" class="chan-line"/>
  <circle cx="295" cy="166" r="5" class="chan-node"/>
  <circle cx="365" cy="166" r="5" class="chan-node"/>
</g>

<!-- Legend panel right side -->
<rect x="600" y="150" width="320" height="330" rx="10" fill="#FFFFFF" stroke="#CBDCEF" stroke-width="1.5"/>
<text x="622" y="182" class="sub" font-size="11" letter-spacing=".08em" fill="#55606F">LEGENDA · KANAAL-ICOON</text>
<line x1="622" y1="200" x2="662" y2="200" class="chan-line"/>
<circle cx="622" cy="200" r="5" class="chan-node"/>
<circle cx="662" cy="200" r="5" class="chan-node"/>
<text x="678" y="205" class="sub" font-size="12.5">twee poorten, verbonden tot kanaal</text>

<text x="622" y="240" class="label" font-size="13">Individueel — voorbeelden</text>
<text x="622" y="260" class="sub" font-size="12.5">Jasper 43-23 · Emma 34-57 · 53-42</text>
<text x="622" y="278" class="sub" font-size="12.5">Sofie 20-34</text>

<text x="622" y="312" class="label" font-size="13">Stam — voorbeeld</text>
<text x="622" y="332" class="sub" font-size="12.5">Ruben 21-45</text>

<text x="622" y="366" class="label" font-size="13">Collectief</text>
<text x="622" y="386" class="sub" font-size="12.5">voelen/ervaring · logica/analyse</text>
<text x="622" y="404" class="sub" font-size="12.5">— geen casuskanaal in dit dossier</text>

<line x1="622" y1="430" x2="898" y2="430" stroke="#CBDCEF" stroke-width="1.5"/>
<text x="622" y="454" class="sub" font-size="12.5" fill="#9A5F0D">Hoe verder van het midden, hoe breder de</text>
<text x="622" y="472" class="sub" font-size="12.5" fill="#9A5F0D">groep die het kanaal canoniek dient.</text>

</svg>
