<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
<style>
.label{font-size:12.5px;font-weight:700;fill:#14213D;}
.sub{font-size:10.5px;fill:#55606F;}
.title{font-family:'Cormorant Garamond', Georgia, serif;font-size:24px;fill:#14213D;font-weight:600;}
.kicker{font-size:11px;fill:#55606F;letter-spacing:.12em;}
.rank{font-size:16px;font-weight:700;fill:#FBFAF7;}
</style>
</defs>
<rect width="960" height="620" fill="#FBFAF7"/>
<text x="40" y="30" class="kicker">DEEL 4 · RANGORDE</text>
<text x="40" y="58" class="title">De autoriteit — hoe hoger de trede, hoe dichter bij het lichaam</text>
<text x="40" y="80" class="sub">Elke trede toont welk centrum gedefinieerd moet zijn — de rest van de kaart is generiek, geen casuspersoon.</text>

<!-- 7 treden, aflopend van hoog (links) naar laag (rechts), elk met mini-bodygraph -->
<!-- helper: mini bodygraph function inlined per trede -->

<!-- trede 1: emotioneel -->
<g transform="translate(50,110)">
<rect x="0" y="330" width="110" height="60" fill="#2563A8"/>
<text x="55" y="365" text-anchor="middle" class="rank">1</text>
<g transform="scale(0.16)">
<polygon points="250,30 210,95 290,95" fill="#FFFFFF" stroke="#14213D" stroke-width="6"/>
<polygon points="210,110 290,110 250,180" fill="#FFFFFF" stroke="#14213D" stroke-width="6"/>
<rect x="205" y="195" width="90" height="80" fill="#FFFFFF" stroke="#14213D" stroke-width="6"/>
<polygon points="250,295 320,350 250,405 180,350" fill="#FFFFFF" stroke="#14213D" stroke-width="6"/>
<polygon points="400,360 340,385 400,410" fill="#FFFFFF" stroke="#14213D" stroke-width="6"/>
<polygon points="60,440 60,500 160,470" fill="#FFFFFF" stroke="#14213D" stroke-width="6"/>
<rect x="205" y="430" width="90" height="80" fill="#FFFFFF" stroke="#14213D" stroke-width="6"/>
<polygon points="390,440 390,500 295,470" fill="#2563A8" stroke="#14213D" stroke-width="6"/>
<rect x="200" y="565" width="100" height="70" fill="#FFFFFF" stroke="#14213D" stroke-width="6"/>
</g>
<text x="55" y="60" text-anchor="middle" class="label">Emotioneel</text>
<text x="55" y="78" text-anchor="middle" class="sub">Solar plexus</text>
<text x="55" y="93" text-anchor="middle" class="sub">gedefinieerd</text>
</g>

