<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
<style>
.label{font-size:14px;font-weight:700;fill:#14213D;}
.label-light{font-size:13px;font-weight:700;fill:#FBFAF7;}
.sub{font-size:12px;fill:#55606F;}
.title{font-family:'Cormorant Garamond', Georgia, serif;font-size:25px;fill:#14213D;font-weight:600;}
.kicker{font-size:11px;fill:#55606F;letter-spacing:.12em;}
</style>
</defs>
<rect width="960" height="620" fill="#FBFAF7"/>
<text x="40" y="34" class="kicker">DEEL 19 · TIJDLIJN</text>
<text x="40" y="64" class="title">Drie universele kantelpunten, 0 tot 80+ jaar</text>
<text x="40" y="92" class="sub">Saturnus, Uranus en Chiron keren op vaste momenten terug naar (of tegenover) hun geboortepositie.</text>

<!-- baseline -->
<line x1="60" y1="330" x2="900" y2="330" stroke="#c7c2b6" stroke-width="3"/>
<!-- age ticks 0,10,...,80 -->
<g stroke="#c7c2b6" stroke-width="1.5">
<line x1="60" y1="322" x2="60" y2="338"/>
<line x1="165" y1="322" x2="165" y2="338"/>
<line x1="270" y1="322" x2="270" y2="338"/>
<line x1="375" y1="322" x2="375" y2="338"/>
<line x1="480" y1="322" x2="480" y2="338"/>
<line x1="585" y1="322" x2="585" y2="338"/>
<line x1="690" y1="322" x2="690" y2="338"/>
<line x1="795" y1="322" x2="795" y2="338"/>
<line x1="900" y1="322" x2="900" y2="338"/>
</g>
<g class="sub" text-anchor="middle">
<text x="60" y="358">0</text>
<text x="165" y="358">10</text>
<text x="270" y="358">20</text>
<text x="375" y="358">30</text>
<text x="480" y="358">40</text>
<text x="585" y="358">50</text>
<text x="690" y="358">60</text>
<text x="795" y="358">70</text>
<text x="900" y="358">80+</text>
</g>

<!-- Saturnus return ~29-30 -> x approx 60+29.5*10.5=369.75 -->
<line x1="368" y1="220" x2="368" y2="330" stroke="#2563A8" stroke-width="4"/>
<circle cx="368" cy="220" r="9" fill="#2563A8"/>
<rect x="255" y="150" width="230" height="62" rx="10" fill="#CBDCEF" stroke="#2563A8" stroke-width="1.5"/>
<text x="370" y="172" text-anchor="middle" class="label">Saturnus-return · ±29-30 jr</text>
<text x="370" y="192" text-anchor="middle" class="sub">Volwassen worden naar eigen ontwerp</text>

<!-- Uranus opposition ~40-42 -> x approx 60+41*10.5=490.5 -->
<line x1="490" y1="220" x2="490" y2="330" stroke="#6FA3D6" stroke-width="4"/>
<circle cx="490" cy="220" r="9" fill="#6FA3D6"/>
<rect x="490" y="150" width="230" height="62" rx="10" fill="#e2ece8" stroke="#6FA3D6" stroke-width="1.5"/>
<text x="605" y="172" text-anchor="middle" class="label">Uranus-oppositie · ±40-42 jr</text>
<text x="605" y="192" text-anchor="middle" class="sub">Individuatie, doorbreken van conventie</text>

<!-- Chiron return ~50 -> x approx 60+50*10.5=585 -->
<line x1="585" y1="410" x2="585" y2="330" stroke="#E9A13B" stroke-width="4"/>
<circle cx="585" cy="410" r="9" fill="#E9A13B"/>
<rect x="470" y="410" width="230" height="62" rx="10" fill="#f3e7cf" stroke="#E9A13B" stroke-width="1.5"/>
<text x="585" y="434" text-anchor="middle" class="label">Chiron-return · ±50 jr</text>
<text x="585" y="454" text-anchor="middle" class="sub">Kernkwetsbaarheid integreren</text>

<!-- lijn 6 fase markers below -->
<text x="60" y="500" class="sub" font-weight="700" fill="#14213D">Lijn 6 (deel 9):</text>
<rect x="60" y="512" width="308" height="30" rx="6" fill="#FFFFFF" stroke="#c7c2b6" stroke-width="1.5"/>
<text x="214" y="532" text-anchor="middle" class="sub">Fase 1 — beproever</text>
<rect x="368" y="512" width="217" height="30" rx="6" fill="#FFFFFF" stroke="#c7c2b6" stroke-width="1.5"/>
<text x="476" y="532" text-anchor="middle" class="sub">Fase 2 — het dak op</text>
<rect x="585" y="512" width="315" height="30" rx="6" fill="#FFFFFF" stroke="#c7c2b6" stroke-width="1.5"/>
<text x="742" y="532" text-anchor="middle" class="sub">Fase 3 — rolmodel</text>

<text x="480" y="580" text-anchor="middle" class="sub" fill="#9A5F0D">Universeel: iedereen doorloopt deze kantelpunten rond dezelfde leeftijd — de persoonlijke kaart kleurt in hoe dat eruitziet.</text>
</svg>
