<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
<style>
.label{font-size:14px;font-weight:700;fill:#14213D;}
.sub{font-size:12.5px;fill:#55606F;}
.title{font-family:'Cormorant Garamond', Georgia, serif;font-size:25px;fill:#14213D;font-weight:600;}
.kicker{font-size:11px;fill:#55606F;letter-spacing:.12em;}
.portnum{font-size:12px;font-weight:700;fill:#14213D;}
</style>
</defs>
<rect width="960" height="620" fill="#FBFAF7"/>
<text x="40" y="34" class="kicker">DEEL 2 · UITSNEDE</text>
<text x="40" y="64" class="title">Compleet kanaal, hangende poort en gestreepte activatie</text>
<text x="40" y="92" class="sub">Drie situaties die je bij elke chart uit elkaar moet houden — nog zonder te duiden wat ze betekenen.</text>

<!-- Panel 1: compleet kanaal -->
<rect x="50" y="140" width="270" height="400" rx="12" fill="#FFFFFF" stroke="#d8cbb4" stroke-width="1.5"/>
<text x="185" y="170" text-anchor="middle" class="label" fill="#2563A8">Compleet kanaal</text>
<rect x="130" y="220" width="110" height="90" fill="#2563A8" stroke="#14213D" stroke-width="2"/>
<text x="185" y="270" text-anchor="middle" font-size="13" fill="#FBFAF7" font-weight="700">Sacraal</text>
<polygon points="185,420 145,470 185,520 225,470" fill="#2563A8" stroke="#14213D" stroke-width="2"/>
<text x="185" y="475" text-anchor="middle" font-size="12" fill="#FBFAF7" font-weight="700">Milt</text>
<line x1="185" y1="310" x2="185" y2="420" stroke="#2563A8" stroke-width="6"/>
<circle cx="185" cy="330" r="14" fill="#FBFAF7" stroke="#2563A8" stroke-width="2"/><text x="185" y="334" class="portnum" text-anchor="middle">34</text>
<circle cx="185" cy="400" r="14" fill="#FBFAF7" stroke="#2563A8" stroke-width="2"/><text x="185" y="404" class="portnum" text-anchor="middle">57</text>
<text x="185" y="562" text-anchor="middle" class="sub">beide poorten geactiveerd —</text>
<text x="185" y="578" text-anchor="middle" class="sub">kanaal definieert beide centra</text>

<!-- Panel 2: hangende poort -->
<rect x="345" y="140" width="270" height="400" rx="12" fill="#FFFFFF" stroke="#d8cbb4" stroke-width="1.5"/>
<text x="480" y="170" text-anchor="middle" class="label" fill="#E9A13B">Hangende poort</text>
<rect x="425" y="220" width="110" height="90" fill="#FFFFFF" stroke="#14213D" stroke-width="2"/>
<text x="480" y="270" text-anchor="middle" font-size="13" fill="#14213D" font-weight="700">Solar plexus</text>
<polygon points="480,420 440,470 480,520 520,470" fill="#FFFFFF" stroke="#14213D" stroke-width="2"/>
<text x="480" y="475" text-anchor="middle" font-size="12" fill="#14213D" font-weight="700">Wortel</text>
<line x1="480" y1="310" x2="480" y2="365" stroke="#E9A13B" stroke-width="6"/>
<circle cx="480" cy="330" r="14" fill="#E9A13B" stroke="#14213D" stroke-width="2"/><text x="480" y="334" class="portnum" text-anchor="middle" fill="#14213D">37</text>
<text x="480" y="562" text-anchor="middle" class="sub">poort 37 geactiveerd, poort 40</text>
<text x="480" y="578" text-anchor="middle" class="sub">(overkant) niet — half kanaal</text>

<!-- Panel 3: gestreepte activatie -->
<rect x="640" y="140" width="270" height="400" rx="12" fill="#FFFFFF" stroke="#d8cbb4" stroke-width="1.5"/>
<text x="775" y="170" text-anchor="middle" class="label" fill="#8a3324">Gestreepte activatie</text>
<rect x="720" y="220" width="110" height="90" fill="#2563A8" stroke="#14213D" stroke-width="2"/>
<text x="775" y="270" text-anchor="middle" font-size="13" fill="#FBFAF7" font-weight="700">Keel</text>
<polygon points="775,420 735,470 775,520 815,470" fill="#2563A8" stroke="#14213D" stroke-width="2"/>
<text x="775" y="475" text-anchor="middle" font-size="12" fill="#FBFAF7" font-weight="700">Sacraal</text>
<line x1="775" y1="310" x2="775" y2="420" stroke="#8a3324" stroke-width="6" stroke-dasharray="10 6"/>
<circle cx="775" cy="330" r="14" fill="#8a3324" stroke="#14213D" stroke-width="2"/><text x="775" y="334" class="portnum" text-anchor="middle" fill="#FBFAF7">20</text>
<circle cx="775" cy="400" r="14" fill="#8a3324" stroke="#14213D" stroke-width="2"/><text x="775" y="404" class="portnum" text-anchor="middle" fill="#FBFAF7">34</text>
<text x="775" y="562" text-anchor="middle" class="sub">rood-zwart gestreept: beide</text>
<text x="775" y="578" text-anchor="middle" class="sub">berekeningen activeren dezelfde poort</text>
</svg>
