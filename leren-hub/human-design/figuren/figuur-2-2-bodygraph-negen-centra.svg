<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
<style>
.label{font-size:13.5px;font-weight:700;fill:#14213D;}
.sub{font-size:11.5px;fill:#55606F;}
.title{font-family:'Cormorant Garamond', Georgia, serif;font-size:25px;fill:#14213D;font-weight:600;}
.kicker{font-size:11px;fill:#55606F;letter-spacing:.12em;}
.badge{fill:#2563A8;stroke:#FBFAF7;stroke-width:1.5;}
.badgetxt{font-size:12px;font-weight:700;fill:#FBFAF7;text-anchor:middle;}
</style>
</defs>
<rect width="960" height="620" fill="#FBFAF7"/>
<text x="40" y="34" class="kicker">DEEL 2 · REFERENTIEFIGUUR</text>
<text x="40" y="64" class="title">De bodygraph — negen centra, genummerd en gelabeld</text>
<text x="40" y="92" class="sub">Alle centra hier open (wit): dit is de kale kaart, nog zonder een specifieke persoon.</text>

<g transform="translate(50,150) scale(0.65)">
  <g id="bodygraph-basis">
    <g stroke="#c7c2b6" stroke-width="3" fill="none">
      <line x1="250" y1="95"  x2="250" y2="110"/>
      <line x1="250" y1="180" x2="250" y2="195"/>
      <line x1="250" y1="275" x2="250" y2="295"/>
      <line x1="215" y1="255" x2="150" y2="450"/>
      <line x1="285" y1="255" x2="345" y2="375"/>
      <line x1="250" y1="275" x2="250" y2="430"/>
      <line x1="285" y1="260" x2="365" y2="450"/>
      <line x1="220" y1="365" x2="160" y2="460"/>
      <line x1="280" y1="365" x2="345" y2="385"/>
      <line x1="250" y1="405" x2="250" y2="430"/>
      <line x1="180" y1="470" x2="205" y2="470"/>
      <line x1="160" y1="500" x2="215" y2="580"/>
      <line x1="250" y1="510" x2="250" y2="565"/>
      <line x1="295" y1="470" x2="345" y2="470"/>
      <line x1="365" y1="500" x2="285" y2="580"/>
      <line x1="345" y1="400" x2="200" y2="465"/>
      <line x1="345" y1="400" x2="360" y2="450"/>
    </g>
    <polygon id="c-hoofd" points="250,30 210,95 290,95" fill="#FFFFFF" stroke="#14213D" stroke-width="2.5"/>
    <polygon id="c-ajna" points="210,110 290,110 250,180" fill="#FFFFFF" stroke="#14213D" stroke-width="2.5"/>
    <rect id="c-keel" x="205" y="195" width="90" height="80" fill="#FFFFFF" stroke="#14213D" stroke-width="2.5"/>
    <polygon id="c-g" points="250,295 320,350 250,405 180,350" fill="#FFFFFF" stroke="#14213D" stroke-width="2.5"/>
    <polygon id="c-hart" points="400,360 340,385 400,410" fill="#FFFFFF" stroke="#14213D" stroke-width="2.5"/>
    <polygon id="c-milt" points="60,440 60,500 160,470" fill="#FFFFFF" stroke="#14213D" stroke-width="2.5"/>
    <rect id="c-sacraal" x="205" y="430" width="90" height="80" fill="#FFFFFF" stroke="#14213D" stroke-width="2.5"/>
    <polygon id="c-solarplexus" points="390,440 390,500 295,470" fill="#FFFFFF" stroke="#14213D" stroke-width="2.5"/>
    <rect id="c-wortel" x="200" y="565" width="100" height="70" fill="#FFFFFF" stroke="#14213D" stroke-width="2.5"/>
    <g font-family="'DM Sans', Arial, sans-serif" font-size="13" fill="#55606F" text-anchor="middle">
      <text x="250" y="20">Hoofd</text>
      <text x="250" y="200" text-anchor="middle" dy="-4"></text>
      <text x="335" y="105">Ajna</text>
      <text x="315" y="240">Keel</text>
      <text x="250" y="360" dy="4" fill="#FBFAF7" font-weight="700">G</text>
      <text x="415" y="378">Hart</text>
      <text x="45" y="475">Milt</text>
      <text x="250" y="475" dy="4">Sacraal</text>
      <text x="405" y="475">Sol.Plexus</text>
      <text x="250" y="655">Wortel</text>
    </g>
  </g>
  <!-- nummerbadges -->
  <g>
    <circle class="badge" cx="250" cy="6" r="15"/><text class="badgetxt" x="250" y="10">1</text>
    <circle class="badge" cx="300" cy="82" r="15"/><text class="badgetxt" x="300" y="86">2</text>
    <circle class="badge" cx="312" cy="192" r="15"/><text class="badgetxt" x="312" y="196">3</text>
    <circle class="badge" cx="250" cy="278" r="15"/><text class="badgetxt" x="250" y="282">4</text>
    <circle class="badge" cx="405" cy="352" r="15"/><text class="badgetxt" x="405" y="356">5</text>
    <circle class="badge" cx="300" cy="418" r="15"/><text class="badgetxt" x="300" y="422">6</text>
    <circle class="badge" cx="52" cy="428" r="15"/><text class="badgetxt" x="52" y="432">7</text>
    <circle class="badge" cx="398" cy="428" r="15"/><text class="badgetxt" x="398" y="432">8</text>
    <circle class="badge" cx="300" cy="552" r="15"/><text class="badgetxt" x="300" y="556">9</text>
  </g>
</g>

<!-- legenda -->
<g font-size="13.5">
  <text x="590" y="165" class="label" fill="#2563A8">1</text><text x="615" y="165" class="label">Hoofd</text><text x="700" y="165" class="sub">driehoek omhoog, bovenaan</text>
  <text x="590" y="195" class="label" fill="#2563A8">2</text><text x="615" y="195" class="label">Ajna</text><text x="700" y="195" class="sub">driehoek omlaag, daaronder</text>
  <text x="590" y="225" class="label" fill="#2563A8">3</text><text x="615" y="225" class="label">Keel</text><text x="700" y="225" class="sub">vierkant, midden-boven</text>
  <text x="590" y="255" class="label" fill="#2563A8">4</text><text x="615" y="255" class="label">G</text><text x="700" y="255" class="sub">ruit, hart van de kaart</text>
  <text x="590" y="285" class="label" fill="#2563A8">5</text><text x="615" y="285" class="label">Hart/Ego</text><text x="700" y="285" class="sub">klein driehoekje, rechts van G</text>
  <text x="590" y="315" class="label" fill="#2563A8">6</text><text x="615" y="315" class="label">Sacraal</text><text x="700" y="315" class="sub">vierkant, onder G</text>
  <text x="590" y="345" class="label" fill="#2563A8">7</text><text x="615" y="345" class="label">Milt</text><text x="700" y="345" class="sub">driehoek links, punt naar binnen</text>
  <text x="590" y="375" class="label" fill="#2563A8">8</text><text x="615" y="375" class="label">Solar plexus</text><text x="700" y="375" class="sub">driehoek rechts, punt naar binnen</text>
  <text x="590" y="405" class="label" fill="#2563A8">9</text><text x="615" y="405" class="label">Wortel</text><text x="700" y="405" class="sub">vierkant, onderaan</text>
</g>
<rect x="585" y="440" width="330" height="90" rx="8" fill="#CBDCEF"/>
<text x="600" y="465" font-size="12" fill="#14213D" font-weight="700">Gedefinieerd (ingekleurd) of open (wit)</text>
<text x="600" y="486" font-size="11.5" fill="#55606F">Gedefinieerd: minstens één compleet kanaal</text>
<text x="600" y="502" font-size="11.5" fill="#55606F">sluit aan. Alle centra hier staan open (wit).</text>
</svg>
