<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
<style>
.label{font-size:15px;font-weight:700;fill:#14213D;}
.sub{font-size:12.5px;fill:#55606F;}
.title{font-family:'Cormorant Garamond', Georgia, serif;font-size:25px;fill:#14213D;font-weight:600;}
.kicker{font-size:11px;fill:#55606F;letter-spacing:.12em;}
</style>
</defs>
<rect width="960" height="620" fill="#FBFAF7"/>
<text x="40" y="34" class="kicker">DEEL 5 · CONSISTENTIE-CLAIM</text>
<text x="40" y="64" class="title">Wat "gedefinieerd" volgens de leer betekent</text>
<text x="40" y="92" class="sub">Drie canonieke kenmerken — een claim over functioneren, nooit over kwaliteit.</text>

<!-- icoon 1: vanzelfsprekend -->
<rect x="60" y="150" width="255" height="330" rx="14" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<circle cx="188" cy="235" r="46" fill="#CBDCEF"/>
<path d="M165 235 l16 16 l34 -34" stroke="#2563A8" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="188" y="320" text-anchor="middle" class="label">Vanzelfsprekend</text>
<text x="188" y="350" text-anchor="middle" class="sub">"zo is iedereen</text>
<text x="188" y="368" text-anchor="middle" class="sub">toch?"</text>
<text x="188" y="440" text-anchor="middle" class="sub">Het voelt niet als</text>
<text x="188" y="456" text-anchor="middle" class="sub">bijzonder gedrag</text>

<!-- icoon 2: niet uit te zetten -->
<rect x="352" y="150" width="255" height="330" rx="14" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<circle cx="480" cy="235" r="46" fill="#CBDCEF"/>
<circle cx="480" cy="235" r="22" fill="none" stroke="#2563A8" stroke-width="6"/>
<line x1="440" y1="195" x2="520" y2="275" stroke="#8a3324" stroke-width="0" />
<path d="M462 213 a30 30 0 1 1 0 44" stroke="#2563A8" stroke-width="6" fill="none"/>
<text x="480" y="320" text-anchor="middle" class="label">Niet uit te zetten</text>
<text x="480" y="350" text-anchor="middle" class="sub">altijd aan, ongeacht</text>
<text x="480" y="368" text-anchor="middle" class="sub">de situatie</text>
<text x="480" y="440" text-anchor="middle" class="sub">Geen knop om het</text>
<text x="480" y="456" text-anchor="middle" class="sub">uit te schakelen</text>

<!-- icoon 3: betrouwbaar voor anderen -->
<rect x="644" y="150" width="255" height="330" rx="14" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<circle cx="772" cy="235" r="46" fill="#CBDCEF"/>
<circle cx="755" cy="225" r="12" fill="#2563A8"/>
<circle cx="789" cy="225" r="12" fill="#2563A8"/>
<path d="M745 255 q27 -18 54 0" stroke="#2563A8" stroke-width="5" fill="none" stroke-linecap="round"/>
<text x="772" y="320" text-anchor="middle" class="label">Betrouwbaar</text>
<text x="772" y="340" text-anchor="middle" class="label">voor anderen</text>
<text x="772" y="368" text-anchor="middle" class="sub">omgeving rekent erop</text>
<text x="772" y="440" text-anchor="middle" class="sub">Anderen ervaren het</text>
<text x="772" y="456" text-anchor="middle" class="sub">als constant aanwezig</text>

<text x="480" y="555" text-anchor="middle" font-size="13" fill="#9A5F0D">Definitie is geen kwaliteit: een gedefinieerde keel maakt niemand welsprekend.</text>
</svg>
