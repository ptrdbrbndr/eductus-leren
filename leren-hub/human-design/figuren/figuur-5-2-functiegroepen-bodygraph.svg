<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
<style>
.label{font-size:13px;font-weight:700;fill:#14213D;}
.sub{font-size:11.5px;fill:#55606F;}
.title{font-family:'Cormorant Garamond', Georgia, serif;font-size:25px;fill:#14213D;font-weight:600;}
.kicker{font-size:11px;fill:#55606F;letter-spacing:.12em;}
</style>
</defs>
<rect width="960" height="620" fill="#FBFAF7"/>
<text x="40" y="34" class="kicker">DEEL 5 · ORDENING</text>
<text x="40" y="64" class="title">De negen centra in functiegroepen</text>
<text x="40" y="92" class="sub">Solar plexus en wortel zijn dubbelrollen — ze horen bij twee groepen tegelijk (gestreepte rand).</text>

<g transform="translate(50,150) scale(0.65)">
  <g id="bodygraph-basis">
    <g stroke="#c7c2b6" stroke-width="3" fill="none">
      <line x1="250" y1="95"  x2="250" y2="110"/>
      <line x1="250" y1="180" x2="250" y2="195"/>
      <line x1="250" y1="275" x2="250" y2="295"/>
      <line x1="215" y1="255" x2="150" y2="450"/>
      <line x1="285" y1="255" x2="345" y2="375"/>
      <line x1="250" y1="275" x2="250" y2="430"/>
      <line x1="285" y1="260" x2="365" y2="450"/>
      <line x1="220" y1="365" x2="160" y2="460"/>
      <line x1="280" y1="365" x2="345" y2="385"/>
      <line x1="250" y1="405" x2="250" y2="430"/>
      <line x1="180" y1="470" x2="205" y2="470"/>
      <line x1="160" y1="500" x2="215" y2="580"/>
      <line x1="250" y1="510" x2="250" y2="565"/>
      <line x1="295" y1="470" x2="345" y2="470"/>
      <line x1="365" y1="500" x2="285" y2="580"/>
      <line x1="345" y1="400" x2="200" y2="465"/>
      <line x1="345" y1="400" x2="360" y2="450"/>
    </g>
    <!-- drukcentra: hoofd, wortel = amber -->
    <polygon points="250,30 210,95 290,95" fill="#E9A13B" stroke="#14213D" stroke-width="2.5"/>
    <!-- bewustzijnscentra: ajna, milt, solarplexus = blauw mid -->
    <polygon points="210,110 290,110 250,180" fill="#6FA3D6" stroke="#14213D" stroke-width="2.5"/>
    <!-- keel: eigen rol, lichtblauw -->
    <rect x="205" y="195" width="90" height="80" fill="#CBDCEF" stroke="#14213D" stroke-width="2.5"/>
    <!-- G: eigen rol -->
    <polygon points="250,295 320,350 250,405 180,350" fill="#CBDCEF" stroke="#14213D" stroke-width="2.5"/>
    <!-- hart: motor = ductus blue -->
    <polygon points="400,360 340,385 400,410" fill="#2563A8" stroke="#14213D" stroke-width="2.5"/>
    <!-- milt: bewustzijn -->
    <polygon points="60,440 60,500 160,470" fill="#6FA3D6" stroke="#14213D" stroke-width="2.5"/>
    <!-- sacraal: motor -->
    <rect x="205" y="430" width="90" height="80" fill="#2563A8" stroke="#14213D" stroke-width="2.5"/>
    <!-- solar plexus: dubbelrol bewustzijn+motor, gestreepte rand amber -->
    <polygon points="390,440 390,500 295,470" fill="#6FA3D6" stroke="#E9A13B" stroke-width="6" stroke-dasharray="10 6"/>
    <!-- wortel: dubbelrol druk+motor -->
    <rect x="200" y="565" width="100" height="70" fill="#E9A13B" stroke="#E9A13B" stroke-width="6" stroke-dasharray="10 6"/>
    <g font-family="'DM Sans', Arial, sans-serif" font-size="13" fill="#14213D" font-weight="700" text-anchor="middle">
      <text x="250" y="20" fill="#55606F" font-weight="400">Hoofd</text>
      <text x="335" y="105" fill="#55606F" font-weight="400">Ajna</text>
      <text x="315" y="240" fill="#55606F" font-weight="400">Keel</text>
      <text x="250" y="360" dy="4" fill="#14213D">G</text>
      <text x="415" y="378" fill="#55606F" font-weight="400">Hart</text>
      <text x="45" y="475" fill="#55606F" font-weight="400">Milt</text>
      <text x="250" y="475" dy="4" fill="#FBFAF7">Sacraal</text>
      <text x="405" y="475" fill="#55606F" font-weight="400">Sol.Plexus</text>
      <text x="250" y="655" fill="#55606F" font-weight="400">Wortel</text>
    </g>
  </g>
</g>

<!-- legenda -->
<g font-size="13">
<rect x="600" y="150" width="20" height="20" fill="#E9A13B"/><text x="630" y="166" class="label">Drukcentra</text><text x="630" y="184" class="sub">hoofd, wortel*</text>
<rect x="600" y="205" width="20" height="20" fill="#6FA3D6"/><text x="630" y="221" class="label">Bewustzijnscentra</text><text x="630" y="239" class="sub">ajna, milt, solar plexus*</text>
<rect x="600" y="260" width="20" height="20" fill="#2563A8"/><text x="630" y="276" class="label">Motoren</text><text x="630" y="294" class="sub">sacraal, hart, solar plexus*, wortel*</text>
<rect x="600" y="315" width="20" height="20" fill="#CBDCEF"/><text x="630" y="331" class="label">Eigen rol</text><text x="630" y="349" class="sub">keel (manifestatie), G (identiteit)</text>
<rect x="600" y="370" width="20" height="20" fill="none" stroke="#E9A13B" stroke-width="3" stroke-dasharray="5 3"/><text x="630" y="386" class="label">* Dubbelrol</text><text x="630" y="404" class="sub">solar plexus + wortel horen bij twee groepen</text>
</g>
</svg>
