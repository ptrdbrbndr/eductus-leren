<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'DM Sans', Arial, sans-serif" width="960" height="640" preserveAspectRatio="xMidYMid meet">
<defs>
<style>
.label{font-size:11px;font-weight:700;fill:#14213D;}
.label-light{font-size:11px;font-weight:700;fill:#FBFAF7;}
.sub{font-size:12px;fill:#55606F;}
.title{font-family:'Cormorant Garamond', Georgia, serif;font-size:24px;fill:#14213D;font-weight:600;}
.kicker{font-size:11px;fill:#55606F;letter-spacing:.12em;}
</style>
</defs>
<rect width="960" height="640" fill="#FBFAF7"/>
<text x="40" y="34" class="kicker">DEEL 24 · SLOTBEELD VAN DE HELE CURSUS</text>
<text x="40" y="62" class="title">Vierentwintig delen, één trap</text>
<text x="40" y="86" class="sub">Drieëntwintig treden bouwen op — deel 24 is de laatste, gouden trede.</text>

<!-- staircase 24 steps ascending left to right -->
<!-- base x=50, step width=36, step height increment=21, base y=560 -->
<g>
<!-- niveau 1 steps 1-8 blue-light -->
<rect x="50" y="539" width="34" height="21" fill="#CBDCEF" stroke="#2563A8" stroke-width="1"/>
<rect x="86" y="518" width="34" height="42" fill="#CBDCEF" stroke="#2563A8" stroke-width="1"/>
<rect x="122" y="497" width="34" height="63" fill="#CBDCEF" stroke="#2563A8" stroke-width="1"/>
<rect x="158" y="476" width="34" height="84" fill="#CBDCEF" stroke="#2563A8" stroke-width="1"/>
<rect x="194" y="455" width="34" height="105" fill="#CBDCEF" stroke="#2563A8" stroke-width="1"/>
<rect x="230" y="434" width="34" height="126" fill="#CBDCEF" stroke="#2563A8" stroke-width="1"/>
<rect x="266" y="413" width="34" height="147" fill="#CBDCEF" stroke="#2563A8" stroke-width="1"/>
<rect x="302" y="392" width="34" height="168" fill="#CBDCEF" stroke="#2563A8" stroke-width="1"/>

<!-- niveau 2 steps 9-17 mid blue -->
<rect x="338" y="371" width="34" height="189" fill="#6FA3D6" stroke="#2563A8" stroke-width="1"/>
<rect x="374" y="350" width="34" height="210" fill="#6FA3D6" stroke="#2563A8" stroke-width="1"/>
<rect x="410" y="329" width="34" height="231" fill="#6FA3D6" stroke="#2563A8" stroke-width="1"/>
<rect x="446" y="308" width="34" height="252" fill="#6FA3D6" stroke="#2563A8" stroke-width="1"/>
<rect x="482" y="287" width="34" height="273" fill="#6FA3D6" stroke="#2563A8" stroke-width="1"/>
<rect x="518" y="266" width="34" height="294" fill="#6FA3D6" stroke="#2563A8" stroke-width="1"/>
<rect x="554" y="245" width="34" height="315" fill="#6FA3D6" stroke="#2563A8" stroke-width="1"/>
<rect x="590" y="224" width="34" height="336" fill="#6FA3D6" stroke="#2563A8" stroke-width="1"/>
<rect x="626" y="203" width="34" height="357" fill="#6FA3D6" stroke="#2563A8" stroke-width="1"/>

<!-- niveau 3 steps 18-23 deep blue -->
<rect x="662" y="182" width="34" height="378" fill="#2563A8" stroke="#14213D" stroke-width="1"/>
<rect x="698" y="161" width="34" height="399" fill="#2563A8" stroke="#14213D" stroke-width="1"/>
<rect x="734" y="140" width="34" height="420" fill="#2563A8" stroke="#14213D" stroke-width="1"/>
<rect x="770" y="119" width="34" height="441" fill="#2563A8" stroke="#14213D" stroke-width="1"/>
<rect x="806" y="98" width="34" height="462" fill="#2563A8" stroke="#14213D" stroke-width="1"/>
<rect x="842" y="77" width="34" height="483" fill="#2563A8" stroke="#14213D" stroke-width="1"/>

<!-- deel 24 golden final step -->
<rect x="878" y="56" width="36" height="504" fill="#E9A13B" stroke="#14213D" stroke-width="2.5"/>
</g>

<!-- labels -->
<text x="200" y="595" text-anchor="middle" class="sub" font-weight="700" fill="#2563A8">Niveau 1 — het geraamte (deel 1-8)</text>
<text x="500" y="595" text-anchor="middle" class="sub" font-weight="700" fill="#2563A8">Niveau 2 — de invulling (deel 9-17)</text>
<text x="790" y="595" text-anchor="middle" class="sub" font-weight="700" fill="#14213D">Niveau 3 — de praktijk (deel 18-23)</text>
<text x="896" y="50" text-anchor="middle" class="sub" font-weight="700" fill="#9A5F0D">Deel 24</text>

<text x="896" y="590" text-anchor="middle" class="label" font-size="12" fill="#14213D" transform="rotate(0)">24</text>
<text x="480" y="615" text-anchor="middle" class="sub" fill="#55606F">Elke trede bouwt op de vorige — de gouden trede is geen breuk met het geraamte en de invulling, maar de afronding ervan.</text>
</svg>
