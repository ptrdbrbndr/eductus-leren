<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
<style>
.label{font-size:13.5px;font-weight:700;fill:#14213D;}
.sub{font-size:10.5px;fill:#55606F;}
.title{font-family:'Cormorant Garamond', Georgia, serif;font-size:24px;fill:#14213D;font-weight:600;}
.kicker{font-size:11px;fill:#55606F;letter-spacing:.12em;}
</style>
</defs>
<rect width="960" height="620" fill="#FBFAF7"/>
<text x="40" y="30" class="kicker">DEEL 4 · ICONENPOSTER</text>
<text x="40" y="58" class="title">Zeven autoriteiten, zeven beslispraktijken</text>
<text x="40" y="80" class="sub">Elke autoriteit is een procedure, geen karaktertrek.</text>

<!-- 7 tegels in 4+3 grid -->
<g>
<!-- 1 emotioneel: golf -->
<rect x="40" y="110" width="205" height="150" rx="10" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<path d="M60 190 Q80 160 100 190 T140 190 T180 190 T220 190" stroke="#2563A8" stroke-width="3" fill="none"/>
<text x="142" y="230" text-anchor="middle" class="label">Emotioneel</text>
<text x="142" y="246" text-anchor="middle" class="sub">golf uitwachten (Jasper)</text>
</g>
<g>
<!-- 2 sacraal: klok/nu -->
<rect x="260" y="110" width="205" height="150" rx="10" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<circle cx="362" cy="185" r="26" fill="none" stroke="#2563A8" stroke-width="3"/>
<line x1="362" y1="185" x2="362" y2="168" stroke="#2563A8" stroke-width="3"/>
<line x1="362" y1="185" x2="375" y2="190" stroke="#2563A8" stroke-width="3"/>
<text x="362" y="230" text-anchor="middle" class="label">Sacraal</text>
<text x="362" y="246" text-anchor="middle" class="sub">respons nu (Emma, Sofie)</text>
</g>
<g>
<!-- 3 milt: fluister/oor -->
<rect x="480" y="110" width="205" height="150" rx="10" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<path d="M570 165 q22 0 22 22 q0 20 -18 22" stroke="#2563A8" stroke-width="3" fill="none"/>
<path d="M578 178 q10 0 10 9 q0 8 -8 10" stroke="#2563A8" stroke-width="2.5" fill="none"/>
<text x="582" y="230" text-anchor="middle" class="label">Milt</text>
<text x="582" y="246" text-anchor="middle" class="sub">stille eenmalige fluistering</text>
</g>
<g>
<!-- 4 ego: hart met vraagteken -->
<rect x="700" y="110" width="220" height="150" rx="10" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<path d="M810 165 c-14 -14 -38 -2 -38 15 c0 18 24 30 38 42 c14 -12 38 -24 38 -42 c0 -17 -24 -29 -38 -15 Z" fill="#E9A13B"/>
<text x="810" y="230" text-anchor="middle" class="label">Ego</text>
<text x="810" y="246" text-anchor="middle" class="sub">wil ík dit? (Ruben)</text>
</g>
<g>
<!-- 5 zelfgeprojecteerd: spraakbel -->
<rect x="40" y="290" width="205" height="150" rx="10" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<path d="M100 340 h84 a14 14 0 0 1 14 14 v20 a14 14 0 0 1 -14 14 h-54 l-20 18 v-18 h-10 a14 14 0 0 1 -14 -14 v-20 a14 14 0 0 1 14 -14 Z" fill="#6FA3D6"/>
<text x="142" y="410" text-anchor="middle" class="label">Zelfgeprojecteerd</text>
<text x="142" y="426" text-anchor="middle" class="sub">jezelf horen praten</text>
</g>
<g>
<!-- 6 mentaal/omgeving: mensen in cirkel -->
<rect x="260" y="290" width="205" height="150" rx="10" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<circle cx="335" cy="365" r="12" fill="#CBDCEF" stroke="#2563A8" stroke-width="2"/>
<circle cx="390" cy="365" r="12" fill="#CBDCEF" stroke="#2563A8" stroke-width="2"/>
<circle cx="362" cy="395" r="12" fill="#2563A8"/>
<text x="362" y="410" text-anchor="middle" class="label" fill="#14213D">Mentaal/omgeving</text>
<text x="362" y="426" text-anchor="middle" class="sub">doorpraten, geen innerlijke beslisser</text>
</g>
<g>
<!-- 7 lunair: maan -->
<rect x="480" y="290" width="205" height="150" rx="10" fill="#FFFFFF" stroke="#8a3324" stroke-width="1.5"/>
<path d="M600 350 a28 28 0 1 0 0 56 a22 22 0 1 1 0 -56 Z" fill="#8a3324"/>
<text x="582" y="410" text-anchor="middle" class="label">Lunair</text>
<text x="582" y="426" text-anchor="middle" class="sub">maancyclus (Lena)</text>
</g>
<!-- samenvattend blok -->
<rect x="700" y="290" width="220" height="150" rx="10" fill="#CBDCEF"/>
<text x="810" y="330" text-anchor="middle" font-size="12.5" fill="#14213D" font-weight="700">Zelfde patroon overal</text>
<text x="810" y="355" text-anchor="middle" class="sub">Elke autoriteit wordt populair</text>
<text x="810" y="371" text-anchor="middle" class="sub">verward met een karaktertrek —</text>
<text x="810" y="387" text-anchor="middle" class="sub">de systematiek claimt telkens</text>
<text x="810" y="403" text-anchor="middle" class="sub">een procedure, geen eigenschap.</text>
</g>
</svg>
