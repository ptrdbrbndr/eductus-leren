<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 900" font-family="'DM Sans', Arial, sans-serif" width="960" height="900" preserveAspectRatio="xMidYMid meet">
<defs>
<style>
.label{font-size:13px;font-weight:700;fill:#14213D;}
.sub{font-size:12.5px;fill:#55606F;}
.title{font-family:'Cormorant Garamond', Georgia, serif;font-size:26px;fill:#14213D;font-weight:600;}
.kicker{font-size:11px;fill:#55606F;letter-spacing:.12em;}
.num{font-family:'Cormorant Garamond', Georgia, serif;font-size:22px;font-weight:700;fill:#FBFAF7;}
</style>
</defs>
<rect width="960" height="900" fill="#FBFAF7"/>
<text x="40" y="34" class="kicker">DEEL 22 · GRONDWET VAN NEGEN GRENZEN</text>
<text x="40" y="66" class="title">Alle negen grenzen van de cursus, op een rij</text>
<text x="40" y="92" class="sub">Elke grens is in een eerder deel opgebouwd; samen vormen ze één beroepshouding.</text>

<!-- 9 rows -->
<!-- row template y start 130, height 80, gap 6 -->
<g>
  <!-- Row 1 -->
  <rect x="40" y="120" width="880" height="76" rx="10" fill="#FFFFFF" stroke="#d8cbb4" stroke-width="1.5"/>
  <circle cx="80" cy="158" r="22" fill="#2563A8"/><text x="80" y="164" text-anchor="middle" class="num">1</text>
  <text x="118" y="150" class="label">Positioneer altijd als zelfreflectie-instrument</text>
  <text x="118" y="170" class="sub">nooit als wetenschap of vaststaand feit</text>

  <!-- Row 2 -->
  <rect x="40" y="204" width="880" height="76" rx="10" fill="#FFFFFF" stroke="#d8cbb4" stroke-width="1.5"/>
  <circle cx="80" cy="242" r="22" fill="#2563A8"/><text x="80" y="248" text-anchor="middle" class="num">3</text>
  <text x="118" y="234" class="label">Nooit van gedrag naar kaart redeneren</text>
  <text x="118" y="254" class="sub">geen omgekeerde diagnose</text>

  <!-- Row 3 -->
  <rect x="40" y="288" width="880" height="76" rx="10" fill="#FFFFFF" stroke="#d8cbb4" stroke-width="1.5"/>
  <circle cx="80" cy="326" r="22" fill="#2563A8"/><text x="80" y="332" text-anchor="middle" class="num">5</text>
  <text x="118" y="318" class="label">Geen kwaliteits- of gezondheidsclaims</text>
  <text x="118" y="338" class="sub">ook niet impliciet</text>

  <!-- Row 4 -->
  <rect x="40" y="372" width="880" height="76" rx="10" fill="#FFFFFF" stroke="#d8cbb4" stroke-width="1.5"/>
  <circle cx="80" cy="410" r="22" fill="#2563A8"/><text x="80" y="416" text-anchor="middle" class="num">6</text>
  <text x="118" y="402" class="label">Geen medische of psychische duiding</text>
  <text x="118" y="422" class="sub">grens markeren en doorverwijzen</text>

  <!-- Row 5 -->
  <rect x="40" y="456" width="880" height="76" rx="10" fill="#FFFFFF" stroke="#d8cbb4" stroke-width="1.5"/>
  <circle cx="80" cy="494" r="22" fill="#2563A8"/><text x="80" y="500" text-anchor="middle" class="num">14</text>
  <text x="118" y="486" class="label">Geen compatibiliteitsvoorspellingen</text>
  <text x="118" y="506" class="sub">geen analyse van afwezige derden zonder toestemming</text>

  <!-- Row 6 -->
  <rect x="40" y="540" width="880" height="76" rx="10" fill="#FFFFFF" stroke="#d8cbb4" stroke-width="1.5"/>
  <circle cx="80" cy="578" r="22" fill="#2563A8"/><text x="80" y="584" text-anchor="middle" class="num">15</text>
  <text x="118" y="570" class="label">Geen concrete levensbeslissingsadviezen</text>
  <text x="118" y="590" class="sub">op basis van het incarnatiekruis</text>

  <!-- Row 7 -->
  <rect x="40" y="624" width="880" height="76" rx="10" fill="#FFFFFF" stroke="#d8cbb4" stroke-width="1.5"/>
  <circle cx="80" cy="662" r="22" fill="#2563A8"/><text x="80" y="668" text-anchor="middle" class="num">16</text>
  <text x="118" y="654" class="label">Elke duiding eindigt in een toetsvraag</text>
  <text x="118" y="674" class="sub">nooit in een vonnis</text>

  <!-- Row 8 -->
  <rect x="40" y="708" width="880" height="76" rx="10" fill="#f4e2dd" stroke="#8a3324" stroke-width="1.5"/>
  <circle cx="80" cy="746" r="22" fill="#8a3324"/><text x="80" y="752" text-anchor="middle" class="num">20</text>
  <text x="118" y="738" class="label">Bij kinderen: nooit determinerend, nooit vroegtijdig etiket</text>
  <text x="118" y="758" class="sub">nooit isolerend van andere volwassenen</text>

  <!-- Row 9 -->
  <rect x="40" y="792" width="880" height="76" rx="10" fill="#f4e2dd" stroke="#8a3324" stroke-width="1.5"/>
  <circle cx="80" cy="830" r="22" fill="#8a3324"/><text x="80" y="836" text-anchor="middle" class="num">21</text>
  <text x="118" y="822" class="label">Nooit voor werving, selectie of promotie</text>
  <text x="118" y="842" class="sub">geen personeelsbeslissingen op basis van een kaart</text>
</g>

<text x="480" y="880" text-anchor="middle" class="sub" fill="#9A5F0D">Samen: het systeem biedt taal en vragen, nooit feiten, oordelen of garanties over een ander mens.</text>
</svg>
