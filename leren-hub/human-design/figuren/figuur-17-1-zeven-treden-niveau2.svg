<text class="steplbl" x="762" y="145" text-anchor="middle">Incarnatie-</text>
<text class="steplbl" x="762" y="161" text-anchor="middle">kruis</text>
<text class="sub" x="762" y="105" text-anchor="middle" fill="#9A5F0D">deel 15</text>

<text x="480" y="595" text-anchor="middle" class="sub" fill="#9A5F0D">Geen nieuwe kaartkennis in deel 17 — de laatste trede sluit niveau 2 met de striktste toetsvraag-discipline.</text>
