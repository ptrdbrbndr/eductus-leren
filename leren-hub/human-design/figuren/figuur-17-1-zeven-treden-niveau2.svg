<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper{fill:#FBFAF7;}
    .label{font-size:14px;font-weight:700;fill:#14213D;}
    .label-light{font-size:14px;font-weight:700;fill:#FBFAF7;}
    .sub{font-size:12px;fill:#55606F;}
    .title{font-family:'Cormorant Garamond', Georgia, serif;font-size:25px;fill:#14213D;font-weight:600;}
    .kicker{font-size:11px;fill:#55606F;letter-spacing:.12em;}
    .steplbl{font-size:12px;fill:#FBFAF7;font-weight:700;}
  </style>
</defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 17 · ZEVEN NIEUWE TREDEN</text>
<text x="40" y="64" class="title">Niveau 2 bovenop het niveau-1-geraamte</text>
<text x="40" y="90" class="sub">Dezelfde trapvorm als deel 8 — nu met zeven extra treden die niveau 2 heeft toegevoegd.</text>

<!-- platform: niveau 1 geraamte -->
<rect x="60" y="430" width="840" height="90" fill="#CBDCEF" stroke="#14213D" stroke-width="1.5"/>
<text x="480" y="465" text-anchor="middle" class="label">Niveau 1 — het geraamte</text>
<text x="480" y="486" text-anchor="middle" class="sub">type, strategie, autoriteit, gedefinieerde &amp; open centra (deel 1-8)</text>

<!-- zeven treden niveau 2 -->
<rect x="90" y="390" width="96" height="40" fill="#2563A8" stroke="#14213D" stroke-width="1.5"/>
<rect x="194" y="345" width="96" height="85" fill="#2563A8" stroke="#14213D" stroke-width="1.5"/>
<rect x="298" y="300" width="96" height="130" fill="#2563A8" stroke="#14213D" stroke-width="1.5"/>
<rect x="402" y="255" width="96" height="175" fill="#2563A8" stroke="#14213D" stroke-width="1.5"/>
<rect x="506" y="210" width="96" height="220" fill="#2563A8" stroke="#14213D" stroke-width="1.5"/>
<rect x="610" y="165" width="96" height="265" fill="#2563A8" stroke="#14213D" stroke-width="1.5"/>
<rect x="714" y="120" width="96" height="310" fill="#2563A8" stroke="#E9A13B" stroke-width="3"/>

<text class="steplbl" x="138" y="415" text-anchor="middle">Profiel</text>
<text class="sub" x="138" y="345" text-anchor="middle" fill="#14213D">deel 9</text>

<text class="steplbl" x="242" y="370" text-anchor="middle">Kanalen</text>
<text class="sub" x="242" y="330" text-anchor="middle" fill="#14213D">deel 10</text>

<text class="steplbl" x="346" y="325" text-anchor="middle">Circuit</text>
<text class="sub" x="346" y="285" text-anchor="middle" fill="#14213D">deel 11</text>

<text class="steplbl" x="450" y="280" text-anchor="middle">Definitie-</text>
<text class="steplbl" x="450" y="296" text-anchor="middle">type</text>
<text class="sub" x="450" y="240" text-anchor="middle" fill="#14213D">deel 12</text>

<text class="steplbl" x="554" y="235" text-anchor="middle">Transits</text>
<text class="sub" x="554" y="195" text-anchor="middle" fill="#14213D">deel 13</text>

<text class="steplbl" x="658" y="190" text-anchor="middle">Relatie-</text>
