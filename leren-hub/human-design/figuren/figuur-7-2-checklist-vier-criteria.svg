<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:18px; font-weight:700; fill:#14213D; }
      .sub { font-size:13.5px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    </style>
    </defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 7 · CHECKLIST</text>
<text x="40" y="64" class="title">Vier criteria voor een goed experiment</text>
<text x="40" y="94" class="sub">Zonder deze vier is het geen experiment maar een indruk.</text>

<rect x="140" y="115" width="680" height="475" rx="16" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>

<!-- Row 1: Klein -->
<rect x="180" y="150" width="36" height="36" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="2.5"/>
<path d="M188 168 L198 178 L210 156" fill="none" stroke="#E9A13B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="240" y="166" class="label">1. Klein</text>
<text x="240" y="189" class="sub">Eén element, niet je hele leven.</text>
<text x="240" y="207" class="sub">Bijv. twee weken je sacrale respons bij werkverzoeken —</text>
<text x="240" y="224" class="sub">niet "ik ga nu leven als Generator".</text>
<line x1="180" y1="248" x2="780" y2="248" stroke="#CBDCEF" stroke-width="1.5"/>

<!-- Row 2: Toetsbaar -->
<rect x="180" y="265" width="36" height="36" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="2.5"/>
<path d="M188 283 L198 293 L210 271" fill="none" stroke="#E9A13B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="240" y="281" class="label">2. Toetsbaar</text>
<text x="240" y="304" class="sub">Vooraf beschreven gedrag — niet een gewenste uitkomst.</text>
<text x="240" y="322" class="sub">"Ik noteer wat mijn lijf doet vóór ik antwoord" is toetsbaar;</text>
<text x="240" y="339" class="sub">"ik voel me daarna beter" stuurt al op een uitkomst.</text>
<line x1="180" y1="363" x2="780" y2="363" stroke="#CBDCEF" stroke-width="1.5"/>

<!-- Row 3: Tijdgebonden -->
<rect x="180" y="380" width="36" height="36" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="2.5"/>
<path d="M188 398 L198 408 L210 386" fill="none" stroke="#E9A13B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="240" y="396" class="label">3. Tijdgebonden</text>
<text x="240" y="419" class="sub">Vooraf afgesproken periode met een vast evaluatiemoment.</text>
<text x="240" y="437" class="sub">Geen open einde dat eindigt zodra het toevallig goed uitkomt.</text>
<line x1="180" y1="461" x2="780" y2="461" stroke="#CBDCEF" stroke-width="1.5"/>

<!-- Row 4: Gelogd -->
<rect x="180" y="478" width="36" height="36" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="2.5"/>
<path d="M188 496 L198 506 L210 484" fill="none" stroke="#E9A13B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="240" y="494" class="label">4. Gelogd</text>
<text x="240" y="517" class="sub">Geschreven, op het moment zelf of zo dicht mogelijk erna —</text>
<text x="240" y="535" class="sub">nooit achteraf gereconstrueerd uit het geheugen.</text>

<text x="480" y="608" text-anchor="middle" class="sub" fill="#9A5F0D">Dezelfde discipline als het zes-stappenformulier van deel 2 — eerst waarnemen, dan pas duiden.</text>
</svg>
