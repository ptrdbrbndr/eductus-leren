<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
<style>
.label{font-size:13px;font-weight:700;fill:#14213D;}
.sub{font-size:11.5px;fill:#55606F;}
.title{font-family:'Cormorant Garamond', Georgia, serif;font-size:25px;fill:#14213D;font-weight:600;}
.kicker{font-size:11px;fill:#55606F;letter-spacing:.12em;}
.zonelbl{font-size:12px;font-weight:700;fill:#2563A8;letter-spacing:.06em;}
</style>
</defs>
<rect width="960" height="620" fill="#FBFAF7"/>
<text x="40" y="34" class="kicker">DEEL 2 · CHARTOVERZICHT</text>
<text x="40" y="64" class="title">Drie zones van een chartweergave</text>
<text x="40" y="92" class="sub">Bodygraph, planetentabellen en gegevenspaneel — elk etiket in het paneel komt uit de andere twee.</text>

<!-- zone 2: planetentabellen links -->
<rect x="40" y="130" width="160" height="330" rx="10" fill="none" stroke="#2563A8" stroke-width="2" stroke-dasharray="6 4"/>
<text x="120" y="120" text-anchor="middle" class="zonelbl">2 · PLANETENTABELLEN</text>
<g font-size="10.5" fill="#8a3324">
<text x="60" y="155">☉ 34.6</text><text x="60" y="172">☽ 20.3</text><text x="60" y="189">☊ 41.5</text><text x="60" y="206">☿ 57.1</text>
<text x="60" y="223">♀ 12.4</text><text x="60" y="240">♂ 6.2</text><text x="60" y="257">♃ 45.3</text><text x="60" y="274">♄ 21.6</text>
</g>
<text x="120" y="300" text-anchor="middle" font-size="10" fill="#8a3324" font-weight="700">rood = design (−88 dagen)</text>
<g font-size="10.5" fill="#14213D">
<text x="150" y="155">☉ 43.2</text><text x="150" y="172">☽ 23.5</text><text x="150" y="189">☊ 3.1</text><text x="150" y="206">☿ 60.4</text>
<text x="150" y="223">♀ 8.6</text><text x="150" y="240">♂ 30.2</text><text x="150" y="257">♃ 15.3</text><text x="150" y="274">♄ 55.1</text>
</g>
<text x="150" y="330" text-anchor="middle" font-size="10" fill="#14213D" font-weight="700">zwart = persoonlijkheid</text>
<text x="120" y="410" text-anchor="middle" class="sub">13 activatieposities per</text>
<text x="120" y="426" text-anchor="middle" class="sub">berekening (zon t/m Pluto)</text>

<!-- zone 1: bodygraph midden -->
<rect x="235" y="130" width="300" height="410" rx="10" fill="none" stroke="#2563A8" stroke-width="2" stroke-dasharray="6 4"/>
<text x="385" y="120" text-anchor="middle" class="zonelbl">1 · BODYGRAPH</text>
<polygon points="385,155 355,205 415,205" fill="#FFFFFF" stroke="#14213D" stroke-width="2"/>
<polygon points="360,215 410,215 385,260" fill="#FFFFFF" stroke="#14213D" stroke-width="2"/>
<rect x="355" y="270" width="60" height="55" fill="#2563A8" stroke="#14213D" stroke-width="2"/>
<polygon points="385,335 425,370 385,405 345,370" fill="#FFFFFF" stroke="#14213D" stroke-width="2"/>
<rect x="355" y="415" width="60" height="55" fill="#2563A8" stroke="#14213D" stroke-width="2"/>
<rect x="358" y="480" width="55" height="45" fill="#FFFFFF" stroke="#14213D" stroke-width="2"/>
<text x="385" y="555" text-anchor="middle" class="sub">negen centra, verbonden door kanalen met poortnummers</text>

<!-- zone 3: gegevenspaneel rechts -->
<rect x="580" y="130" width="340" height="330" rx="10" fill="none" stroke="#2563A8" stroke-width="2" stroke-dasharray="6 4"/>
<text x="750" y="120" text-anchor="middle" class="zonelbl">3 · GEGEVENSPANEEL</text>
<g font-size="12.5">
<text x="600" y="165" class="label">Type</text><text x="750" y="165" fill="#55606F">Generator</text>
<line x1="600" y1="175" x2="900" y2="175" stroke="#d8cbb4"/>
<text x="600" y="200" class="label">Strategie</text><text x="750" y="200" fill="#55606F">Wachten om te reageren</text>
<line x1="600" y1="210" x2="900" y2="210" stroke="#d8cbb4"/>
<text x="600" y="235" class="label">Autoriteit</text><text x="750" y="235" fill="#55606F">Sacraal</text>
<line x1="600" y1="245" x2="900" y2="245" stroke="#d8cbb4"/>
<text x="600" y="270" class="label">Profiel</text><text x="750" y="270" fill="#55606F">3/5</text>
<line x1="600" y1="280" x2="900" y2="280" stroke="#d8cbb4"/>
<text x="600" y="305" class="label">Definitie</text><text x="750" y="305" fill="#55606F">Single</text>
<line x1="600" y1="315" x2="900" y2="315" stroke="#d8cbb4"/>
<text x="600" y="340" class="label">Niet-zelf</text><text x="750" y="340" fill="#55606F">Frustratie</text>
<line x1="600" y1="350" x2="900" y2="350" stroke="#d8cbb4"/>
<text x="600" y="375" class="label">Kruis</text><text x="750" y="375" fill="#55606F">(uit 4 zon/aarde-poorten)</text>
</g>
<text x="750" y="420" text-anchor="middle" class="sub">alles hier is afgeleid uit zone 1 + 2</text>
<text x="750" y="436" text-anchor="middle" class="sub">— geen aparte meting</text>

<text x="480" y="590" text-anchor="middle" font-size="13" fill="#9A5F0D">Voorbeeldwaarden ter illustratie van de paneelstructuur, niet van een casuspersoon.</text>
</svg>
