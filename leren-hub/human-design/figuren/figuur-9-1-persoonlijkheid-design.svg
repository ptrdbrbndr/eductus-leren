<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .sub-dark { font-size:12px; fill:#14213D; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:2; fill:none; marker-end:url(#arr); }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
</defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 9 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Twee zonlijnen, één profiel</text>
<text x="40" y="90" class="sub">Persoonlijkheid (zwart) en design (rood) leveren elk één cijfer — samen vormen ze het profiel.</text>

<!-- Persoonlijkheid column -->
<rect x="90" y="130" width="330" height="330" rx="12" fill="#14213D"/>
<text x="255" y="168" text-anchor="middle" class="label-light" font-size="13" letter-spacing="1.5">PERSOONLIJKHEID</text>
<text x="255" y="188" text-anchor="middle" class="sub-light">geboortemoment</text>
<!-- sun icon -->
<circle cx="255" cy="250" r="26" fill="#FBFAF7"/>
<g stroke="#FBFAF7" stroke-width="3">
  <line x1="255" y1="205" x2="255" y2="216"/>
  <line x1="255" y1="284" x2="255" y2="295"/>
  <line x1="210" y1="250" x2="221" y2="250"/>
  <line x1="289" y1="250" x2="300" y2="250"/>
  <line x1="223" y1="218" x2="230" y2="225"/>
  <line x1="280" y1="275" x2="287" y2="282"/>
  <line x1="287" y1="218" x2="280" y2="225"/>
  <line x1="230" y1="275" x2="223" y2="282"/>
</g>
<circle cx="255" cy="250" r="14" fill="#14213D" stroke="#FBFAF7" stroke-width="2"/>
<text x="255" y="335" text-anchor="middle" font-size="30" font-weight="700" fill="#FBFAF7" font-family="'Cormorant Garamond', Georgia, serif">Zonlijn 3</text>
<text x="255" y="360" text-anchor="middle" class="sub-light">poort met I Tjing-lijn 3</text>
<text x="255" y="378" text-anchor="middle" class="sub-light">→ archetype Beproever</text>
<rect x="130" y="410" width="250" height="34" rx="8" fill="none" stroke="#6FA3D6" stroke-width="1.5"/>
<text x="255" y="432" text-anchor="middle" class="sub-light">eerste cijfer van het profiel</text>

<!-- Design column -->
<rect x="540" y="130" width="330" height="330" rx="12" fill="#E9A13B"/>
<text x="705" y="168" text-anchor="middle" class="label" font-size="13" letter-spacing="1.5" fill="#14213D">DESIGN</text>
<text x="705" y="188" text-anchor="middle" class="sub-dark">±88 dagen vóór geboorte</text>
<circle cx="705" cy="250" r="26" fill="#FBFAF7"/>
<g stroke="#14213D" stroke-width="3">
  <line x1="705" y1="205" x2="705" y2="216"/>
  <line x1="705" y1="284" x2="705" y2="295"/>
  <line x1="660" y1="250" x2="671" y2="250"/>
  <line x1="739" y1="250" x2="750" y2="250"/>
  <line x1="673" y1="218" x2="680" y2="225"/>
  <line x1="730" y1="275" x2="737" y2="282"/>
  <line x1="737" y1="218" x2="730" y2="225"/>
  <line x1="680" y1="275" x2="673" y2="282"/>
</g>
<circle cx="705" cy="250" r="14" fill="#E9A13B" stroke="#14213D" stroke-width="2"/>
<text x="705" y="335" text-anchor="middle" font-size="30" font-weight="700" fill="#14213D" font-family="'Cormorant Garamond', Georgia, serif">Zonlijn 5</text>
<text x="705" y="360" text-anchor="middle" class="sub-dark">poort met I Tjing-lijn 5</text>
<text x="705" y="378" text-anchor="middle" class="sub-dark">→ archetype Ketter</text>
<rect x="580" y="410" width="250" height="34" rx="8" fill="none" stroke="#14213D" stroke-width="1.5"/>
<text x="705" y="432" text-anchor="middle" class="sub-dark">tweede cijfer van het profiel</text>

<!-- arrows converging -->
<path d="M255 464 L400 520" class="arrow"/>
<path d="M705 464 L560 520" class="arrow"/>

<!-- profile result -->
<rect x="395" y="520" width="170" height="66" rx="12" fill="#2563A8"/>
<text x="480" y="548" text-anchor="middle" class="label-light" font-size="13" letter-spacing="1">PROFIEL</text>
<text x="480" y="575" text-anchor="middle" font-size="24" font-weight="700" fill="#FBFAF7" font-family="'Cormorant Garamond', Georgia, serif">3/5</text>

<text x="480" y="608" text-anchor="middle" class="sub">Voorbeeld: Emma van Dijk — profiel 3/5 (Beproever-basis / Ketter-projectie).</text>
</svg>
