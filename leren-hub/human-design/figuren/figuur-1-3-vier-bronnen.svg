<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
<style>
.label{font-size:15px;font-weight:700;fill:#FBFAF7;}
.sub{font-size:12.5px;fill:#DFDCD3;}
.title{font-family:'Cormorant Garamond', Georgia, serif;font-size:25px;fill:#14213D;font-weight:600;}
.kicker{font-size:11px;fill:#55606F;letter-spacing:.12em;}
.arrow{stroke:#2563A8;stroke-width:2.5;fill:none;marker-end:url(#arrb);}
</style>
<marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
</defs>
<rect width="960" height="620" fill="#FBFAF7"/>
<text x="40" y="34" class="kicker">DEEL 1 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Vier bronnen, één bodygraph</text>
<text x="40" y="92" class="sub" fill="#55606F">Elk onderdeel van de kaart is te herleiden tot precies één traditie.</text>

<!-- vier kwadranten -->
<rect x="70" y="130" width="380" height="150" rx="10" fill="#2563A8"/>
<text x="260" y="170" text-anchor="middle" class="label">I Tjing</text>
<text x="260" y="195" text-anchor="middle" class="sub">64 hexagrammen, zes lijnen</text>
<text x="260" y="245" text-anchor="middle" font-size="13" fill="#FBFAF7" font-weight="700">→ de 64 poorten en hun zes lijnen</text>

<rect x="510" y="130" width="380" height="150" rx="10" fill="#6FA3D6"/>
<text x="700" y="170" text-anchor="middle" class="label">Westerse astrologie</text>
<text x="700" y="195" text-anchor="middle" class="sub">efemeriden op geboortemoment + 88 dagen ervoor</text>
<text x="700" y="245" text-anchor="middle" font-size="13" fill="#FBFAF7" font-weight="700">→ de berekening (persoonlijkheid/design)</text>

<rect x="70" y="330" width="380" height="150" rx="10" fill="#2563A8"/>
<text x="260" y="370" text-anchor="middle" class="label">Chakrasysteem</text>
<text x="260" y="395" text-anchor="middle" class="sub">zeven chakra's, getransformeerd</text>
<text x="260" y="445" text-anchor="middle" font-size="13" fill="#FBFAF7" font-weight="700">→ de negen centra</text>

<rect x="510" y="330" width="380" height="150" rx="10" fill="#6FA3D6"/>
<text x="700" y="370" text-anchor="middle" class="label">Kabbala</text>
<text x="700" y="395" text-anchor="middle" class="sub">Boom des Levens, sefirot en paden</text>
<text x="700" y="445" text-anchor="middle" font-size="13" fill="#FBFAF7" font-weight="700">→ de 36 kanalen</text>

<!-- centrale bodygraph-icoon -->
<circle cx="480" cy="305" r="42" fill="#E9A13B"/>
<text x="480" y="300" text-anchor="middle" font-size="12" fill="#14213D" font-weight="700">de</text>
<text x="480" y="316" text-anchor="middle" font-size="12" fill="#14213D" font-weight="700">bodygraph</text>

<path class="arrow" d="M420 250 L455 285"/>
<path class="arrow" d="M540 250 L505 285"/>
<path class="arrow" d="M420 360 L455 325"/>
<path class="arrow" d="M540 360 L505 325"/>

<text x="480" y="570" text-anchor="middle" font-size="13" fill="#9A5F0D">De 64/genetica-parallel (§4) is een numerieke overeenkomst, geen aangetoond verband.</text>
</svg>
