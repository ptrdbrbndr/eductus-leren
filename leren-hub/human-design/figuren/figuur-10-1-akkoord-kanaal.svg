<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .panel-h { font-family:'Cormorant Garamond', Georgia, serif; font-size:18px; fill:#14213D; font-weight:600; }
      .note { font-size:34px; fill:#2563A8; }
      .note-chord { font-size:40px; fill:#FBFAF7; }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
</defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 10 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Poort als losse noot, kanaal als akkoord</text>
<text x="40" y="94" class="sub">Kanaal 34-57 (sacraal ↔ milt): pas als beide poorten klinken, ontstaat het samengestelde thema.</text>

<!-- verticale scheidingslijn -->
<line x1="486" y1="120" x2="486" y2="580" stroke="#d8cbb4" stroke-width="1.5" stroke-dasharray="2 6"/>

<!-- LINKS: akkoord-metafoor -->
<text x="70" y="140" class="panel-h">Twee losse noten …</text>

<rect x="70" y="160" width="150" height="120" rx="10" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="145" y="212" text-anchor="middle" class="note">♪</text>
<text x="145" y="240" text-anchor="middle" class="label" font-size="13">Poort 34</text>
<text x="145" y="258" text-anchor="middle" class="sub" font-size="11">Sacraal · deelthema</text>
<text x="145" y="272" text-anchor="middle" class="sub" font-size="11">rauwe, ongerichte kracht</text>

<rect x="250" y="160" width="150" height="120" rx="10" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="325" y="212" text-anchor="middle" class="note">♪</text>
<text x="325" y="240" text-anchor="middle" class="label" font-size="13">Poort 57</text>
<text x="325" y="258" text-anchor="middle" class="sub" font-size="11">Milt · deelthema</text>
<text x="325" y="272" text-anchor="middle" class="sub" font-size="11">helder, direct aanvoelen</text>

<path d="M145 282 L145 305 L235 305" class="arrow"/>
<path d="M325 282 L325 305 L235 305" class="arrow"/>
<path d="M235 305 L235 328" class="arrow"/>

<text x="235" y="140" text-anchor="middle" class="panel-h" font-size="11" fill="#55606F"> </text>

<!-- akkoord-box -->
<rect x="120" y="335" width="230" height="130" rx="10" class="blue-dark" stroke="#E9A13B" stroke-width="3"/>
<text x="235" y="378" text-anchor="middle" class="note-chord">♫</text>
<text x="235" y="404" text-anchor="middle" class="label-light" font-size="13">Kanaal 34-57</text>
<text x="235" y="422" text-anchor="middle" class="sub-light" font-size="11">kracht die door intuïtie</text>
<text x="235" y="436" text-anchor="middle" class="sub-light" font-size="11">wordt gericht</text>
<text x="235" y="450" text-anchor="middle" class="sub-light" font-size="10">— samengesteld, geen optelsom —</text>

<text x="235" y="500" text-anchor="middle" class="sub" font-size="11" fill="#9A5F0D">… vormen pas een akkoord wanneer ze samen klinken.</text>

<!-- RECHTS: schematisch kanaal -->
<text x="520" y="140" class="panel-h">… naast een compleet kanaal</text>

<text x="560" y="230" text-anchor="middle" class="sub" font-size="11">Sacraal</text>
<rect x="530" y="240" width="60" height="60" rx="8" fill="#FFFFFF" stroke="#14213D" stroke-width="2"/>
<circle cx="560" cy="270" r="17" class="blue-dark" stroke="#14213D" stroke-width="1.5"/>
<text x="560" y="275" text-anchor="middle" class="label-light" font-size="13">34</text>

<line x1="590" y1="270" x2="810" y2="270" class="blue-line" stroke-width="6"/>
<rect x="670" y="285" width="100" height="24" rx="6" fill="#FBFAF7" stroke="#E9A13B" stroke-width="1.5"/>
<text x="720" y="301" text-anchor="middle" class="sub" font-size="10" fill="#9A5F0D">compleet kanaal</text>

<text x="840" y="230" text-anchor="middle" class="sub" font-size="11">Milt</text>
<polygon points="810,240 870,240 870,300 810,300" fill="#FFFFFF" stroke="#14213D" stroke-width="2" opacity="0"/>
<polygon points="800,270 840,240 880,270 840,300" fill="#FFFFFF" stroke="#14213D" stroke-width="2"/>
<circle cx="840" cy="270" r="17" class="blue-dark" stroke="#14213D" stroke-width="1.5"/>
<text x="840" y="275" text-anchor="middle" class="label-light" font-size="13">57</text>

<rect x="520" y="340" width="370" height="90" rx="10" fill="#CBDCEF" stroke="#2563A8" stroke-width="1.5"/>
<text x="705" y="368" text-anchor="middle" class="label" font-size="13">Samengesteld kanaalthema</text>
<text x="705" y="390" text-anchor="middle" class="sub" font-size="12">"Kracht die door intuïtie wordt gericht" —</text>
<text x="705" y="408" text-anchor="middle" class="sub" font-size="12">het lijf als kompas voor rauwe sacrale energie</text>

<text x="705" y="460" text-anchor="middle" class="sub" font-size="11">Gestapeld op Emma: haar sacrale werkkracht krijgt hier een navigatiesysteem.</text>

<text x="480" y="600" text-anchor="middle" class="sub" font-size="11" fill="#55606F">Bron: reader deel 10, §1 en §3.1 — kanaal 34-57 uit het casusdossier (Emma van Dijk).</text>
</svg>
