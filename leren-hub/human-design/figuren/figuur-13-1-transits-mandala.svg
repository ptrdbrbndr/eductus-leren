<text x="40" y="34" class="kicker">DEEL 13 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Transits — de mandala staat nooit stil</text>
<text x="40" y="90" class="sub">Dezelfde 64 poorten als bij de geboortekaart, nu doorlopend geactiveerd door de actuele planeetstand.</text>

