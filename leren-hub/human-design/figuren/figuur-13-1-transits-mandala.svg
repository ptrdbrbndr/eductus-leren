<!-- timeline below -->
<text x="40" y="470" class="kicker">TIJDLIJN · TRANSIT-DUUR PER PLANEET</text>
<rect x="40" y="484" width="270" height="46" rx="8" fill="#6FA3D6"/>
<text x="175" y="504" text-anchor="middle" class="label-light" font-size="13">Maan</text>
<text x="175" y="521" text-anchor="middle" class="sub-light" font-size="11" fill="#EFF4FA">± 28,5 dagen — hele mandala</text>
<rect x="330" y="484" width="270" height="46" rx="8" fill="#2563A8"/>
<text x="465" y="504" text-anchor="middle" class="label-light" font-size="13">Zon</text>
<text x="465" y="521" text-anchor="middle" class="sub-light" font-size="11" fill="#DCE8F5">± 1 jaar — hele mandala</text>
<rect x="620" y="484" width="300" height="46" rx="8" fill="#14213D"/>
<text x="770" y="504" text-anchor="middle" class="label-light" font-size="13">Trage planeten</text>
<text x="770" y="521" text-anchor="middle" class="sub-light" font-size="11" fill="#C9D2E0">jaren tot decennia — hele mandala</text>

<text x="480" y="565" text-anchor="middle" class="sub">Hoe langzamer de planeet, hoe langduriger — en potentieel dieper voelbaar — de tijdelijke activatie van een poort.</text>
<text x="480" y="588" text-anchor="middle" class="sub" fill="#9A5F0D">Precies hierom duurt de Reflector-strategie een volledige maancyclus (§4).</text>
