<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 14 · RELATIECHART OP CENTRUMNIVEAU</text>
<text x="40" y="64" class="title">Emma en Jasper — volledige complementariteit</text>
<text x="40" y="90" class="sub">Geen enkele overlap in gedefinieerde centra: samen dekken zij zeven van de negen centra.</text>

<text x="155" y="118" text-anchor="middle" class="colname">Emma</text>
<text x="460" y="118" text-anchor="middle" class="colname">Jasper</text>
<text x="765" y="118" text-anchor="middle" class="colname">Samen (unie)</text>

