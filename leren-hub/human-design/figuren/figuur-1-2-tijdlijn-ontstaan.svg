<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
<style>
.label{font-size:14px;font-weight:700;fill:#14213D;}
.sub{font-size:12px;fill:#55606F;}
.title{font-family:'Cormorant Garamond', Georgia, serif;font-size:25px;fill:#14213D;font-weight:600;}
.kicker{font-size:11px;fill:#55606F;letter-spacing:.12em;}
</style>
</defs>
<rect width="960" height="620" fill="#FBFAF7"/>
<text x="40" y="34" class="kicker">DEEL 1 · TIJDLIJN</text>
<text x="40" y="64" class="title">Van Robert Krakower tot Jovian Archive</text>
<text x="40" y="92" class="sub">Het ontstaansverhaal als tijdlijn — te vertellen met respect én met afstand.</text>

<line x1="80" y1="330" x2="900" y2="330" stroke="#2563A8" stroke-width="3"/>

<!-- 1948 -->
<circle cx="120" cy="330" r="10" fill="#2563A8"/>
<text x="120" y="290" text-anchor="middle" class="label">1948</text>
<text x="120" y="310" text-anchor="middle" class="sub">Geboorte</text>
<text x="120" y="365" text-anchor="middle" class="sub">Robert Allan</text>
<text x="120" y="380" text-anchor="middle" class="sub">Krakower</text>

<!-- 1987 -->
<circle cx="330" cy="330" r="12" fill="#E9A13B"/>
<text x="330" y="280" text-anchor="middle" class="label">Januari 1987</text>
<text x="330" y="298" text-anchor="middle" class="sub">Ibiza — de acht dagen</text>
<text x="330" y="316" text-anchor="middle" class="sub">"de Stem" dicteert het systeem</text>
<text x="330" y="365" text-anchor="middle" class="sub">Neemt de naam</text>
<text x="330" y="380" text-anchor="middle" class="sub">Ra Uru Hu aan</text>

<!-- 1992 -->
<circle cx="530" cy="330" r="10" fill="#2563A8"/>
<text x="530" y="290" text-anchor="middle" class="label">Begin jaren 90</text>
<text x="530" y="310" text-anchor="middle" class="sub">Eerste lesmateriaal,</text>
<text x="530" y="365" text-anchor="middle" class="sub">later The Definitive</text>
<text x="530" y="380" text-anchor="middle" class="sub">Book of Human Design</text>

<!-- 2011 -->
<circle cx="730" cy="330" r="10" fill="#2563A8"/>
<text x="730" y="290" text-anchor="middle" class="label">2011</text>
<text x="730" y="310" text-anchor="middle" class="sub">Overlijden Ra Uru Hu</text>

<!-- heden -->
<circle cx="880" cy="330" r="12" fill="#6FA3D6"/>
<text x="880" y="280" text-anchor="middle" class="label">Heden</text>
<text x="880" y="298" text-anchor="middle" class="sub">Jovian Archive</text>
<text x="880" y="316" text-anchor="middle" class="sub">(rechtenbeheer) en</text>
<text x="880" y="365" text-anchor="middle" class="sub">IHDS (officiële</text>
<text x="880" y="380" text-anchor="middle" class="sub">opleidingslijn)</text>

<rect x="120" y="450" width="720" height="90" rx="10" fill="#CBDCEF"/>
<text x="480" y="480" text-anchor="middle" font-size="13" fill="#14213D" font-weight="600">Twee dingen om vast te houden</text>
<text x="480" y="504" text-anchor="middle" class="sub">Ra Uru Hu presenteerde zich niet als goeroe — "je hoeft mij niet te geloven"</text>
<text x="480" y="522" text-anchor="middle" class="sub">Een openbaringsverhaal is geen bewijsvoering</text>
</svg>
