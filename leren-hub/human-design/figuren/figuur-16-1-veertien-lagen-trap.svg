<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper{fill:#FBFAF7;}
    .label{font-size:14px;font-weight:700;fill:#14213D;}
    .sub{font-size:12px;fill:#55606F;}
    .title{font-family:'Cormorant Garamond', Georgia, serif;font-size:25px;fill:#14213D;font-weight:600;}
    .kicker{font-size:11px;fill:#55606F;letter-spacing:.12em;}
    .steplbl{font-size:11px;fill:#14213D;}
    .steplbl-light{font-size:11px;fill:#FBFAF7;}
  </style>
</defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 16 · VAN KLEIN NAAR GROOT</text>
<text x="40" y="64" class="title">De opbouwende trap — alle lagen op een rij</text>
<text x="40" y="90" class="sub">Elke laag stapelt op de vorige — van basisgegevens tot het incarnatiekruis. Vergelijkbaar in vormtaal met de trap uit deel 8.</text>

<line x1="40" y1="520" x2="900" y2="520" stroke="#55606F" stroke-width="1.5"/>

<!-- niveau 1 lagen (lichtblauw) -->
<rect x="55" y="484" width="58" height="36" fill="#CBDCEF" stroke="#14213D" stroke-width="1.5"/>
<rect x="119" y="451" width="58" height="69" fill="#CBDCEF" stroke="#14213D" stroke-width="1.5"/>
<rect x="183" y="418" width="58" height="102" fill="#CBDCEF" stroke="#14213D" stroke-width="1.5"/>
<rect x="247" y="386" width="58" height="134" fill="#CBDCEF" stroke="#14213D" stroke-width="1.5"/>
<rect x="311" y="353" width="58" height="167" fill="#CBDCEF" stroke="#14213D" stroke-width="1.5"/>
<rect x="375" y="320" width="58" height="200" fill="#CBDCEF" stroke="#14213D" stroke-width="1.5"/>
<!-- niveau 2 lagen (ductus blue), laatste trede amber-omrand -->
<rect x="439" y="287" width="58" height="233" fill="#2563A8" stroke="#14213D" stroke-width="1.5"/>
<rect x="503" y="254" width="58" height="266" fill="#2563A8" stroke="#14213D" stroke-width="1.5"/>
<rect x="567" y="221" width="58" height="299" fill="#2563A8" stroke="#14213D" stroke-width="1.5"/>
<rect x="631" y="188" width="58" height="332" fill="#2563A8" stroke="#14213D" stroke-width="1.5"/>
<rect x="695" y="156" width="58" height="364" fill="#2563A8" stroke="#14213D" stroke-width="1.5"/>
<rect x="759" y="123" width="58" height="397" fill="#2563A8" stroke="#14213D" stroke-width="1.5"/>
<rect x="823" y="90" width="58" height="430" fill="#2563A8" stroke="#E9A13B" stroke-width="3"/>

<!-- labels, rotated, above elke trede -->
<g>
<text class="steplbl" x="84" y="478" text-anchor="start" transform="rotate(-55 84 478)">1 Basisgegevens</text>
<text class="steplbl" x="148" y="445" text-anchor="start" transform="rotate(-55 148 445)">2 Type &amp; strategie</text>
<text class="steplbl" x="212" y="412" text-anchor="start" transform="rotate(-55 212 412)">3 Autoriteit</text>
<text class="steplbl" x="276" y="380" text-anchor="start" transform="rotate(-55 276 380)">4 Gedef. centra</text>
<text class="steplbl" x="340" y="347" text-anchor="start" transform="rotate(-55 340 347)">5 Open centra</text>
<text class="steplbl" x="404" y="314" text-anchor="start" transform="rotate(-55 404 314)">6 Toetsstatus</text>
<text class="steplbl-light" x="468" y="281" text-anchor="start" transform="rotate(-55 468 281)">7 Profiel</text>
<text class="steplbl-light" x="532" y="248" text-anchor="start" transform="rotate(-55 532 248)">8 Kanalen</text>
<text class="steplbl-light" x="596" y="215" text-anchor="start" transform="rotate(-55 596 215)">9 Circuit</text>
<text class="steplbl-light" x="660" y="182" text-anchor="start" transform="rotate(-55 660 182)">10 Definitietype</text>
<text class="steplbl-light" x="724" y="150" text-anchor="start" transform="rotate(-55 724 150)">11 Conditionering</text>
<text class="steplbl-light" x="788" y="117" text-anchor="start" transform="rotate(-55 788 117)">12 Relatiepatroon</text>
<text class="steplbl-light" x="852" y="84" text-anchor="start" transform="rotate(-55 852 84)">13 Incarnatiekruis</text>
</g>

<rect x="55" y="545" width="16" height="16" fill="#CBDCEF" stroke="#14213D"/>
<text x="77" y="558" class="sub">Niveau 1 — geraamte (deel 2-8)</text>
<rect x="330" y="545" width="16" height="16" fill="#2563A8" stroke="#14213D"/>
<text x="352" y="558" class="sub">Niveau 2 — verdieping (deel 9-15)</text>
<rect x="640" y="545" width="16" height="16" fill="#2563A8" stroke="#E9A13B" stroke-width="2"/>
<text x="662" y="558" class="sub">Meest samengesteld — grootste zorgvuldigheid</text>

<text x="480" y="595" text-anchor="middle" class="sub" fill="#9A5F0D">Geen checklist om af te vinken — een volgorde van klein naar groot, precies zoals aangeleerd.</text>
</svg>
