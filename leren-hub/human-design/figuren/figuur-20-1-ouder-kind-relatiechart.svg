<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
<style>
.label{font-size:14px;font-weight:700;fill:#14213D;}
.sub{font-size:12px;fill:#55606F;}
.title{font-family:'Cormorant Garamond', Georgia, serif;font-size:25px;fill:#14213D;font-weight:600;}
.kicker{font-size:11px;fill:#55606F;letter-spacing:.12em;}
</style>
<marker id="arrO" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
<marker id="arrK" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
</defs>
<rect width="960" height="620" fill="#FBFAF7"/>
<text x="40" y="34" class="kicker">DEEL 20 · RELATIECHART</text>
<text x="40" y="64" class="title">Ouder-kind-relatiechart — een generiek voorbeeld</text>
<text x="40" y="92" class="sub">Bij jonge kinderen is deze chart zelden in balans: veel pijlen van ouder naar kind, weinig terug.</text>

<!-- Ouder mini-bodygraph (fully defined, blue) -->
<g transform="translate(80,150) scale(0.34)">
  <g stroke="#c7c2b6" stroke-width="6" fill="none">
    <line x1="250" y1="95"  x2="250" y2="110"/>
    <line x1="250" y1="180" x2="250" y2="195"/>
    <line x1="250" y1="275" x2="250" y2="295"/>
    <line x1="215" y1="255" x2="150" y2="450"/>
    <line x1="285" y1="255" x2="345" y2="375"/>
    <line x1="250" y1="275" x2="250" y2="430"/>
    <line x1="285" y1="260" x2="365" y2="450"/>
    <line x1="220" y1="365" x2="160" y2="460"/>
    <line x1="280" y1="365" x2="345" y2="385"/>
    <line x1="250" y1="405" x2="250" y2="430"/>
    <line x1="180" y1="470" x2="205" y2="470"/>
    <line x1="160" y1="500" x2="215" y2="580"/>
    <line x1="250" y1="510" x2="250" y2="565"/>
    <line x1="295" y1="470" x2="345" y2="470"/>
    <line x1="365" y1="500" x2="285" y2="580"/>
    <line x1="345" y1="400" x2="200" y2="465"/>
    <line x1="345" y1="400" x2="360" y2="450"/>
  </g>
  <polygon points="250,30 210,95 290,95" fill="#2563A8" stroke="#14213D" stroke-width="4"/>
  <polygon points="210,110 290,110 250,180" fill="#2563A8" stroke="#14213D" stroke-width="4"/>
  <rect x="205" y="195" width="90" height="80" fill="#2563A8" stroke="#14213D" stroke-width="4"/>
  <polygon points="250,295 320,350 250,405 180,350" fill="#2563A8" stroke="#14213D" stroke-width="4"/>
  <polygon points="400,360 340,385 400,410" fill="#2563A8" stroke="#14213D" stroke-width="4"/>
  <polygon points="60,440 60,500 160,470" fill="#2563A8" stroke="#14213D" stroke-width="4"/>
  <rect x="205" y="430" width="90" height="80" fill="#2563A8" stroke="#14213D" stroke-width="4"/>
  <polygon points="390,440 390,500 295,470" fill="#2563A8" stroke="#14213D" stroke-width="4"/>
  <rect x="200" y="565" width="100" height="70" fill="#2563A8" stroke="#14213D" stroke-width="4"/>
</g>
<text x="215" y="450" text-anchor="middle" class="label" fill="#2563A8">Ouder</text>
<text x="215" y="470" text-anchor="middle" class="sub">veel gedefinieerde centra</text>

<!-- Kind mini-bodygraph (mostly open, white) -->
<g transform="translate(620,150) scale(0.34)">
  <g stroke="#c7c2b6" stroke-width="6" fill="none">
    <line x1="250" y1="95"  x2="250" y2="110"/>
    <line x1="250" y1="180" x2="250" y2="195"/>
    <line x1="250" y1="275" x2="250" y2="295"/>
    <line x1="215" y1="255" x2="150" y2="450"/>
    <line x1="285" y1="255" x2="345" y2="375"/>
    <line x1="250" y1="275" x2="250" y2="430"/>
    <line x1="285" y1="260" x2="365" y2="450"/>
    <line x1="220" y1="365" x2="160" y2="460"/>
    <line x1="280" y1="365" x2="345" y2="385"/>
    <line x1="250" y1="405" x2="250" y2="430"/>
    <line x1="180" y1="470" x2="205" y2="470"/>
    <line x1="160" y1="500" x2="215" y2="580"/>
    <line x1="250" y1="510" x2="250" y2="565"/>
    <line x1="295" y1="470" x2="345" y2="470"/>
    <line x1="365" y1="500" x2="285" y2="580"/>
    <line x1="345" y1="400" x2="200" y2="465"/>
    <line x1="345" y1="400" x2="360" y2="450"/>
  </g>
  <polygon points="250,30 210,95 290,95" fill="#FFFFFF" stroke="#14213D" stroke-width="4"/>
  <polygon points="210,110 290,110 250,180" fill="#FFFFFF" stroke="#14213D" stroke-width="4"/>
  <rect x="205" y="195" width="90" height="80" fill="#FFFFFF" stroke="#14213D" stroke-width="4"/>
  <polygon points="250,295 320,350 250,405 180,350" fill="#FFFFFF" stroke="#14213D" stroke-width="4"/>
  <polygon points="400,360 340,385 400,410" fill="#FFFFFF" stroke="#14213D" stroke-width="4"/>
  <polygon points="60,440 60,500 160,470" fill="#FFFFFF" stroke="#14213D" stroke-width="4"/>
  <rect x="205" y="430" width="90" height="80" fill="#FFFFFF" stroke="#14213D" stroke-width="4"/>
  <polygon points="390,440 390,500 295,470" fill="#FFFFFF" stroke="#14213D" stroke-width="4"/>
  <rect x="200" y="565" width="100" height="70" fill="#FFFFFF" stroke="#14213D" stroke-width="4"/>
</g>
<text x="755" y="450" text-anchor="middle" class="label" fill="#14213D">Kind</text>
<text x="755" y="470" text-anchor="middle" class="sub">grotendeels open centra</text>

<!-- many arrows ouder -> kind -->
<path d="M330 220 C 420 200, 480 200, 585 210" stroke="#2563A8" stroke-width="3" fill="none" marker-end="url(#arrO)"/>
<path d="M330 260 C 420 250, 480 260, 585 260" stroke="#2563A8" stroke-width="3" fill="none" marker-end="url(#arrO)"/>
<path d="M330 300 C 420 300, 480 310, 585 310" stroke="#2563A8" stroke-width="3" fill="none" marker-end="url(#arrO)"/>
<path d="M330 340 C 420 350, 480 350, 585 350" stroke="#2563A8" stroke-width="3" fill="none" marker-end="url(#arrO)"/>
<path d="M330 380 C 420 390, 480 390, 585 390" stroke="#2563A8" stroke-width="3" fill="none" marker-end="url(#arrO)"/>
<!-- one thin arrow kind -> ouder -->
<path d="M585 430 C 480 440, 420 440, 330 430" stroke="#E9A13B" stroke-width="2.5" fill="none" marker-end="url(#arrK)"/>

<text x="480" y="230" text-anchor="middle" class="sub" fill="#2563A8">meerdere kanalen "hitchhiken" naar het kind</text>
<text x="480" y="450" text-anchor="middle" class="sub" fill="#9A5F0D">één dunne lijn terug — het kind heeft weinig eigen definitie om tegenover te zetten</text>

<text x="480" y="565" text-anchor="middle" class="sub" fill="#55606F">Generiek voorbeeld — geen van de vaste casuspersonen; toegepast op elke ouder-kindrelatie met een dominante volwassene.</text>
</svg>
