<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .blue-line { stroke:#2563A8; }
    .blue-fill { fill:#CBDCEF; }
    .blue-mid { fill:#6FA3D6; }
    .blue-dark { fill:#2563A8; }
    .navy { fill:#14213D; }
    .amber { stroke:#E9A13B; }
    .amber-fill { fill:#E9A13B; }
    .label { font-size:14px; font-weight:700; fill:#14213D; }
    .label-light { font-size:13px; font-weight:700; fill:#FBFAF7; }
    .sub { font-size:12px; fill:#55606F; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
    .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    .legend { font-size:12px; fill:#55606F; }
  </style>
</defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 12 · CONCEPTBEELD</text>
<text x="40" y="64" class="title">Eén landschap, of losse eilanden?</text>
<text x="40" y="93" class="sub">Gedefinieerde centra als eilanden · complete kanalen als bruggen · open centra als water ertussen</text>

<!-- water panel -->
<rect x="50" y="118" width="860" height="360" rx="20" class="blue-fill" stroke="#6FA3D6" stroke-width="1.5"/>

<!-- decorative wave texture -->
<g stroke="#FBFAF7" stroke-width="2" fill="none" opacity=".55">
  <path d="M80 150 q20 -10 40 0 t40 0 t40 0 t40 0"/>
  <path d="M700 150 q20 -10 40 0 t40 0 t40 0"/>
  <path d="M80 460 q20 -10 40 0 t40 0 t40 0 t40 0 t40 0 t40 0"/>
  <path d="M560 460 q20 -10 40 0 t40 0 t40 0 t40 0 t40 0"/>
</g>

<!-- open centra: pale, dashed, half-submerged -->
<g class="blue-fill" stroke="#6FA3D6" stroke-width="1.5" stroke-dasharray="4 4" opacity=".85">
  <circle cx="250" cy="390" r="30"/>
  <circle cx="400" cy="185" r="26"/>
  <circle cx="560" cy="395" r="27"/>
</g>
<g class="sub" text-anchor="middle">
  <text x="250" y="394">open</text>
  <text x="400" y="189">open</text>
  <text x="560" y="399">open</text>
</g>

<!-- bridges (complete channels) connecting a chain of four islands -->
<g class="blue-line" stroke-width="9" stroke-linecap="round">
  <line x1="185" y1="235" x2="325" y2="278"/>
  <line x1="335" y1="278" x2="465" y2="232"/>
  <line x1="475" y1="235" x2="605" y2="298"/>
</g>

<!-- four connected islands -->
<g stroke="#14213D" stroke-width="2">
  <ellipse cx="170" cy="228" rx="58" ry="40" class="blue-dark"/>
  <ellipse cx="330" cy="282" rx="52" ry="36" class="blue-dark"/>
  <ellipse cx="470" cy="226" rx="52" ry="36" class="blue-dark"/>
  <ellipse cx="615" cy="302" rx="58" ry="40" class="blue-dark"/>
</g>
<g class="label-light" text-anchor="middle">
  <text x="170" y="224">Centrum</text>
  <text x="170" y="240">(gedefinieerd)</text>
  <text x="330" y="286">Centrum</text>
  <text x="470" y="230">Centrum</text>
  <text x="615" y="298">Centrum</text>
  <text x="615" y="314">(gedefinieerd)</text>
</g>
<g class="sub" text-anchor="middle" fill="#eef3fb">
  <text x="330" y="345" fill="#55606F">↑ bruggen = complete kanalen</text>
</g>

<!-- isolated island, no bridge -->
<ellipse cx="790" cy="255" rx="48" ry="34" class="blue-dark" stroke="#14213D" stroke-width="2"/>
<text x="790" y="251" class="label-light" text-anchor="middle">Los</text>
<text x="790" y="267" class="label-light" text-anchor="middle">eiland</text>

<!-- gap marker between the chain and the isolated island -->
<g stroke="#E9A13B" stroke-width="2.5" stroke-dasharray="3 5">
  <line x1="668" y1="295" x2="742" y2="265"/>
</g>
<text x="705" y="240" class="sub" text-anchor="middle" fill="#9A5F0D">geen brug</text>
<text x="705" y="415" class="sub" text-anchor="middle" fill="#55606F">→ meer dan één groep eilanden: dat heet een split (§2)</text>

<!-- legend -->
<g transform="translate(60,505)">
  <circle cx="10" cy="0" r="9" class="blue-dark" stroke="#14213D" stroke-width="1.5"/>
  <text x="28" y="4" class="legend">Gedefinieerd centrum (eiland)</text>
  <line x1="270" y1="0" x2="310" y2="0" class="blue-line" stroke-width="7" stroke-linecap="round"/>
  <text x="322" y="4" class="legend">Compleet kanaal (brug)</text>
  <circle cx="565" cy="0" r="9" class="blue-fill" stroke="#6FA3D6" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="583" y="4" class="legend">Open centrum (water)</text>
</g>
<text x="480" y="565" text-anchor="middle" class="sub">Zoveel aparte eilandgroepen als er zijn, zoveel groepen gedefinieerde centra telt de kaart — dat aantal is het definitietype.</text>
</svg>
