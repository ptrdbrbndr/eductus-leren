<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label-light { font-size:12.5px; font-weight:700; fill:#FBFAF7; }
      .label-dark { font-size:12.5px; font-weight:700; fill:#14213D; }
      .sub { font-size:11.5px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .name { font-size:12px; font-weight:700; fill:#14213D; }
    </style>
</defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 9 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">De twaalf geldige profielen</text>
<text x="40" y="90" class="sub">Van 36 denkbare combinaties staat de mandala er twaalf toe. De vijf casuspersonen op hun plek.</text>

<!-- ring -->
<circle cx="330" cy="330" r="200" fill="none" stroke="#CBDCEF" stroke-width="26"/>

<!-- 1/3 - Jasper (highlighted) -->
<circle cx="330" cy="130" r="45" fill="#E9A13B"/>
<circle cx="330" cy="130" r="40" fill="#2563A8" stroke="#14213D" stroke-width="2"/>
<text x="330" y="135" text-anchor="middle" class="label-light" font-size="15">1/3</text>
<text x="330" y="90" text-anchor="middle" class="name">Jasper</text>

<!-- 1/4 -->
<circle cx="430" cy="157" r="38" fill="#6FA3D6"/>
<text x="430" y="162" text-anchor="middle" class="label-light" font-size="13">1/4</text>

<!-- 2/4 -->
<circle cx="503" cy="230" r="38" fill="#6FA3D6"/>
<text x="503" y="235" text-anchor="middle" class="label-light" font-size="13">2/4</text>

<!-- 2/5 -->
<circle cx="530" cy="330" r="38" fill="#6FA3D6"/>
<text x="530" y="335" text-anchor="middle" class="label-light" font-size="13">2/5</text>

<!-- 3/5 - Emma (highlighted) -->
<circle cx="503" cy="430" r="45" fill="#E9A13B"/>
<circle cx="503" cy="430" r="40" fill="#2563A8" stroke="#14213D" stroke-width="2"/>
<text x="503" y="435" text-anchor="middle" class="label-light" font-size="15">3/5</text>
<text x="503" y="490" text-anchor="middle" class="name">Emma</text>

<!-- 3/6 -->
<circle cx="430" cy="503" r="38" fill="#6FA3D6"/>
<text x="430" y="508" text-anchor="middle" class="label-light" font-size="13">3/6</text>

<!-- 4/6 - Lena (highlighted) -->
<circle cx="330" cy="530" r="45" fill="#E9A13B"/>
<circle cx="330" cy="530" r="40" fill="#2563A8" stroke="#14213D" stroke-width="2"/>
<text x="330" y="535" text-anchor="middle" class="label-light" font-size="15">4/6</text>
<text x="330" y="592" text-anchor="middle" class="name">Lena</text>

<!-- 4/1 -->
<circle cx="230" cy="503" r="38" fill="#6FA3D6"/>
<text x="230" y="508" text-anchor="middle" class="label-light" font-size="13">4/1</text>

<!-- 5/1 - Sofie (highlighted) -->
<circle cx="157" cy="430" r="45" fill="#E9A13B"/>
<circle cx="157" cy="430" r="40" fill="#2563A8" stroke="#14213D" stroke-width="2"/>
<text x="157" y="435" text-anchor="middle" class="label-light" font-size="15">5/1</text>
<text x="157" y="490" text-anchor="middle" class="name">Sofie</text>

<!-- 5/2 -->
<circle cx="130" cy="330" r="38" fill="#6FA3D6"/>
<text x="130" y="335" text-anchor="middle" class="label-light" font-size="13">5/2</text>

<!-- 6/2 - Ruben (highlighted) -->
<circle cx="157" cy="230" r="45" fill="#E9A13B"/>
<circle cx="157" cy="230" r="40" fill="#2563A8" stroke="#14213D" stroke-width="2"/>
<text x="157" y="235" text-anchor="middle" class="label-light" font-size="15">6/2</text>
<text x="157" y="176" text-anchor="middle" class="name">Ruben</text>

<!-- 6/3 -->
<circle cx="230" cy="157" r="38" fill="#6FA3D6"/>
<text x="230" y="162" text-anchor="middle" class="label-light" font-size="13">6/3</text>

<!-- center label -->
<circle cx="330" cy="330" r="70" fill="#FBFAF7" stroke="#14213D" stroke-width="1.5"/>
<text x="330" y="322" text-anchor="middle" class="label-dark" font-size="13">12 geldige</text>
<text x="330" y="340" text-anchor="middle" class="label-dark" font-size="13">profielen</text>

<!-- legend -->
<rect x="650" y="130" width="270" height="200" rx="12" fill="#CBDCEF" stroke="#2563A8" stroke-width="1.5"/>
<text x="670" y="158" class="label-dark" font-size="13">Vijf casuspersonen</text>
<text x="670" y="186" class="sub">Emma van Dijk — <tspan font-weight="700" fill="#14213D">3/5</tspan></text>
<text x="670" y="208" class="sub">Jasper de Boer — <tspan font-weight="700" fill="#14213D">1/3</tspan></text>
<text x="670" y="230" class="sub">Sofie Janssen — <tspan font-weight="700" fill="#14213D">5/1</tspan></text>
<text x="670" y="252" class="sub">Ruben Vermeulen — <tspan font-weight="700" fill="#14213D">6/2</tspan></text>
<text x="670" y="274" class="sub">Lena Kovač — <tspan font-weight="700" fill="#14213D">4/6</tspan></text>
<text x="670" y="304" class="sub" font-style="italic">amber ring = casuspersoon op de wieg</text>

<text x="480" y="608" text-anchor="middle" class="sub">Blauwe knopen: de overige zeven geldige profielen. Nooit een 13e combinatie verzinnen.</text>
</svg>
