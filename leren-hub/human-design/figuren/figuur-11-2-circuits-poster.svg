<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="'DM Sans', Arial, sans-serif" width="960" height="700" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:13px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12.5px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFE7F2; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .colhead { font-size:11px; font-weight:700; fill:#FBFAF7; letter-spacing:.06em; }
    </style>
</defs>
<rect width="960" height="700" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 11 · OVERZICHTSPOSTER</text>
<text x="40" y="64" class="title">Drie circuits — sociaal doel, subcircuits en valkuil</text>
<text x="40" y="92" class="sub">Elk circuit heeft een eigen sociaal doel (canon); de valkuil is steeds de schaduwzijde van diezelfde kracht.</text>

<!-- Table grid geometry -->
<!-- columns: label x=40 w=140 | doel x=180 w=260 | subcircuits x=440 w=230 | valkuil x=670 w=250 -->
<!-- header row y=120 h=40 ; rows start y=160, each row h=160 -->

<g>
  <rect x="40" y="120" width="140" height="40" fill="#14213D"/>
  <rect x="180" y="120" width="260" height="40" fill="#14213D"/>
  <rect x="440" y="120" width="230" height="40" fill="#14213D"/>
  <rect x="670" y="120" width="250" height="40" fill="#14213D"/>
  <text x="60" y="145" class="colhead">CIRCUIT</text>
  <text x="200" y="145" class="colhead">SOCIAAL DOEL</text>
  <text x="460" y="145" class="colhead">SUBCIRCUITS</text>
  <text x="690" y="145" class="colhead">VALKUIL</text>
</g>

<!-- Row 1: Individueel -->
<g>
  <rect x="40" y="160" width="140" height="170" fill="#2563A8" stroke="#14213D" stroke-width="1"/>
  <rect x="180" y="160" width="260" height="170" fill="#FFFFFF" stroke="#CBDCEF" stroke-width="1"/>
  <rect x="440" y="160" width="230" height="170" fill="#FFFFFF" stroke="#CBDCEF" stroke-width="1"/>
  <rect x="670" y="160" width="250" height="170" fill="#FFFFFF" stroke="#CBDCEF" stroke-width="1"/>
  <text x="60" y="200" class="label-light" font-size="15">Individueel</text>
  <text x="60" y="220" class="sub-light" font-size="11">eigen pad</text>

  <text x="198" y="188" class="sub" font-size="12.5">
    <tspan x="198" dy="0">Doorbreken van bestaande</tspan>
    <tspan x="198" dy="18">patronen — niet direct voor de</tspan>
    <tspan x="198" dy="18">groep, maar (vaak pas achteraf)</tspan>
    <tspan x="198" dy="18">voor de mensheid als geheel.</tspan>
  </text>

  <text x="458" y="188" class="sub" font-size="12.5">
    <tspan x="458" dy="0">Kennen — plotseling inzicht</tspan>
    <tspan x="458" dy="18">(bijv. Jasper 43-23)</tspan>
    <tspan x="458" dy="36">Centreren/kracht — lijfelijke</tspan>
    <tspan x="458" dy="18">daadkracht (Emma 34-57,</tspan>
    <tspan x="458" dy="18">Sofie 20-34)</tspan>
  </text>

  <text x="688" y="188" class="sub" font-size="12.5">
    <tspan x="688" dy="0">Vervreemding of eenzaamheid;</tspan>
    <tspan x="688" dy="18">de omgeving leest afwijkend</tspan>
    <tspan x="688" dy="18">gedrag als egoïstisch of</tspan>
    <tspan x="688" dy="18">onbetrouwbaar.</tspan>
  </text>
</g>

<!-- Row 2: Stam -->
<g>
  <rect x="40" y="330" width="140" height="170" fill="#6FA3D6" stroke="#14213D" stroke-width="1"/>
  <rect x="180" y="330" width="260" height="170" fill="#FFFFFF" stroke="#CBDCEF" stroke-width="1"/>
  <rect x="440" y="330" width="230" height="170" fill="#FFFFFF" stroke="#CBDCEF" stroke-width="1"/>
  <rect x="670" y="330" width="250" height="170" fill="#FFFFFF" stroke="#CBDCEF" stroke-width="1"/>
  <text x="60" y="370" class="label-light" font-size="15">Stam</text>
  <text x="60" y="390" class="sub-light" font-size="11">naaste kring</text>

  <text x="198" y="358" class="sub" font-size="12.5">
    <tspan x="198" dy="0">Functioneren en overleven van</tspan>
    <tspan x="198" dy="18">de directe, vertrouwde</tspan>
    <tspan x="198" dy="18">gemeenschap: onderhandelen,</tspan>
    <tspan x="198" dy="18">wederkerigheid, bescherming,</tspan>
    <tspan x="198" dy="18">materiële zorg (Ruben 21-45).</tspan>
  </text>

  <text x="458" y="358" class="sub" font-size="12.5">
    <tspan x="458" dy="0">— geen subcircuits genoemd</tspan>
    <tspan x="458" dy="18">voor het stamcircuit; het</tspan>
    <tspan x="458" dy="18">circuit werkt als geheel op</tspan>
    <tspan x="458" dy="18">wederkerigheid en zorg.</tspan>
  </text>

  <text x="688" y="358" class="sub" font-size="12.5">
    <tspan x="688" dy="0">Bekrompen loyaliteit — wij</tspan>
    <tspan x="688" dy="18">tegen zij; individuele</tspan>
    <tspan x="688" dy="18">behoeften opofferen aan de</tspan>
    <tspan x="688" dy="18">groep zonder wederkerigheid</tspan>
    <tspan x="688" dy="18">terug.</tspan>
  </text>
</g>

<!-- Row 3: Collectief -->
<g>
  <rect x="40" y="500" width="140" height="170" fill="#CBDCEF" stroke="#14213D" stroke-width="1"/>
  <rect x="180" y="500" width="260" height="170" fill="#FFFFFF" stroke="#CBDCEF" stroke-width="1"/>
  <rect x="440" y="500" width="230" height="170" fill="#FFFFFF" stroke="#CBDCEF" stroke-width="1"/>
  <rect x="670" y="500" width="250" height="170" fill="#FFFFFF" stroke="#CBDCEF" stroke-width="1"/>
  <text x="60" y="540" class="label" font-size="15">Collectief</text>
  <text x="60" y="560" class="sub" font-size="11">hele mensheid</text>

  <text x="198" y="528" class="sub" font-size="12.5">
    <tspan x="198" dy="0">Ervaring of logica zo delen</tspan>
    <tspan x="198" dy="18">dat de mensheid als geheel —</tspan>
    <tspan x="198" dy="18">voorbij familie en eigen</tspan>
    <tspan x="198" dy="18">groep — er iets aan heeft.</tspan>
  </text>

  <text x="458" y="528" class="sub" font-size="12.5">
    <tspan x="458" dy="0">Voelen/ervaring —</tspan>
    <tspan x="458" dy="18">"gevoelscircuit": verhaal,</tspan>
    <tspan x="458" dy="18">gedeelde ervaring</tspan>
    <tspan x="458" dy="36">Logica — "denkcircuit":</tspan>
    <tspan x="458" dy="18">analyse, herhaalbaarheid</tspan>
  </text>

  <text x="688" y="528" class="sub" font-size="12.5">
    <tspan x="688" dy="0">Abstractie die niemand meer</tspan>
    <tspan x="688" dy="18">concreet raakt; bij voelen</tspan>
    <tspan x="688" dy="18">eindeloos verhaal zonder</tspan>
    <tspan x="688" dy="18">voortgang, bij logica eindeloos</tspan>
    <tspan x="688" dy="18">analyse zonder toepassing.</tspan>
  </text>
</g>

<text x="480" y="692" text-anchor="middle" class="sub" font-size="12" fill="#9A5F0D">Vier van de vijf casuskanalen vallen individueel, één stam — een artefact van het lesdossier, geen uitspraak over de bevolking.</text>

</svg>
