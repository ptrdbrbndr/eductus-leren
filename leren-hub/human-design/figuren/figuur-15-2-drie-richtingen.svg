<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper{fill:#FBFAF7;}
    .label{font-size:15px;font-weight:700;fill:#14213D;}
    .label-light{font-size:14px;font-weight:700;fill:#FBFAF7;}
    .sub{font-size:12.5px;fill:#55606F;}
    .sub-light{font-size:12.5px;fill:#DFDCD3;}
    .title{font-family:'Cormorant Garamond', Georgia, serif;font-size:25px;fill:#14213D;font-weight:600;}
    .kicker{font-size:11px;fill:#55606F;letter-spacing:.12em;}
  </style>
  <marker id="arr1" markerWidth="12" markerHeight="12" refX="7" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8 Z" fill="#2563A8"/></marker>
  <marker id="arr2" markerWidth="12" markerHeight="12" refX="7" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8 Z" fill="#E9A13B"/></marker>
  <marker id="arr3" markerWidth="12" markerHeight="12" refX="7" refY="4" orient="auto"><path d="M0,0 L7,4 L0,8 Z" fill="#14213D"/></marker>
</defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 15 · DRIE HOOFDRICHTINGEN</text>
<text x="40" y="64" class="title">Right Angle, Left Angle, Juxtaposition</text>
<text x="40" y="90" class="sub">Drie richtingen van het levensthema — niet wat je doet, maar waar je leven omheen draait.</text>

<!-- RAC: met de stroom mee -->
<rect x="60" y="140" width="260" height="400" rx="12" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<rect x="60" y="140" width="260" height="50" rx="12" fill="#2563A8"/>
<rect x="60" y="166" width="260" height="24" fill="#2563A8"/>
<text x="190" y="172" text-anchor="middle" class="label-light">Right Angle Cross</text>
<path d="M100 260 L100 260 L260 260" stroke="#2563A8" stroke-width="4" marker-end="url(#arr1)"/>
<text x="190" y="240" text-anchor="middle" class="sub" font-weight="700" fill="#2563A8">met de stroom mee</text>
<text x="90" y="310" class="sub">Meest voorkomend.</text>
<text x="90" y="330" class="sub">Persoonlijke expressie</text>
<text x="90" y="350" class="sub">bínnen het leven zoals</text>
<text x="90" y="370" class="sub">het zich aandient — niet</text>
<text x="90" y="390" class="sub">actief tegen de stroom in,</text>
<text x="90" y="410" class="sub">niet actief de wereld</text>
<text x="90" y="430" class="sub">willen veranderen.</text>
<text x="90" y="470" class="sub">Eigen thema uitleven</text>
<text x="90" y="490" class="sub">middenin de eigen tijd</text>
<text x="90" y="510" class="sub">en omstandigheden.</text>

<!-- LAC: tegen de stroom in -->
<rect x="350" y="140" width="260" height="400" rx="12" fill="#FFFFFF" stroke="#E9A13B" stroke-width="1.5"/>
<rect x="350" y="140" width="260" height="50" rx="12" fill="#E9A13B"/>
<rect x="350" y="166" width="260" height="24" fill="#E9A13B"/>
<text x="480" y="172" text-anchor="middle" class="label" fill="#14213D">Left Angle Cross</text>
<path d="M550 260 L550 260 L390 260" stroke="#E9A13B" stroke-width="4" marker-end="url(#arr2)"/>
<text x="480" y="240" text-anchor="middle" class="sub" font-weight="700" fill="#9A5F0D">tegen de stroom in</text>
<text x="380" y="310" class="sub">Gericht op transformatie —</text>
<text x="380" y="330" class="sub">vaak tegen de gangbare</text>
<text x="380" y="350" class="sub">stroom in, thema van</text>
<text x="380" y="370" class="sub">verandering brengen.</text>
<text x="380" y="410" class="sub">Soms pas laat in het</text>
<text x="380" y="430" class="sub">leven zichtbaar, soms</text>
<text x="380" y="450" class="sub">met een gevoel van</text>
<text x="380" y="470" class="sub">"niet passen" dat achteraf</text>
<text x="380" y="490" class="sub">functioneel blijkt.</text>

<!-- Juxtaposition: naar binnen -->
<rect x="640" y="140" width="260" height="400" rx="12" fill="#FFFFFF" stroke="#14213D" stroke-width="1.5"/>
<rect x="640" y="140" width="260" height="50" rx="12" fill="#14213D"/>
<rect x="640" y="166" width="260" height="24" fill="#14213D"/>
<text x="770" y="172" text-anchor="middle" class="label-light">Juxtaposition Cross</text>
<path d="M770 230 L770 300" stroke="#14213D" stroke-width="4" marker-end="url(#arr3)"/>
<text x="850" y="270" text-anchor="middle" class="sub" font-weight="700" fill="#14213D">naar binnen</text>
<text x="670" y="330" class="sub">Zeldzaamste soort.</text>
<text x="670" y="350" class="sub">Sterk naar binnen gericht</text>
<text x="670" y="370" class="sub">levensthema, minder</text>
<text x="670" y="390" class="sub">gericht op interactie met</text>
<text x="670" y="410" class="sub">of erkenning door de</text>
<text x="670" y="430" class="sub">buitenwereld.</text>
<text x="670" y="470" class="sub">Eigen, individuele weg</text>
<text x="670" y="490" class="sub">die weinig uitlegbaar</text>
<text x="670" y="510" class="sub">is aan anderen.</text>

<text x="480" y="595" text-anchor="middle" class="sub" fill="#9A5F0D">De precieze technische regel (lijnnummers, deel 9) staat in het naslagwerk — hier tellen alleen de drie betekenissen.</text>
</svg>
