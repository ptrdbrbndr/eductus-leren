<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper{fill:#FBFAF7;}
    .label{font-size:14px;font-weight:700;fill:#14213D;}
    .sub{font-size:12px;fill:#55606F;}
    .title{font-family:'Cormorant Garamond', Georgia, serif;font-size:25px;fill:#14213D;font-weight:600;}
    .kicker{font-size:11px;fill:#55606F;letter-spacing:.12em;}
  </style>
</defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 15 · VIER POORTEN, TWEE ASSEN</text>
<text x="40" y="64" class="title">Het incarnatiekruis — zon en aarde, twee keer</text>
<text x="40" y="90" class="sub">Aarde staat altijd exact tegenover zon in de mandala. Persoonlijkheid en design geven elk zo'n as.</text>

<circle cx="480" cy="330" r="190" fill="#CBDCEF" opacity="0.4"/>
<circle cx="480" cy="330" r="190" fill="none" stroke="#6FA3D6" stroke-width="1.5"/>

<!-- persoonlijkheid-as (zwart) -->
<line x1="688.5" y1="265.0" x2="271.5" y2="395.0" stroke="#14213D" stroke-width="2.5"/>
<!-- design-as (rood/amber) -->
<line x1="543.0" y1="517.1" x2="417.0" y2="142.9" stroke="#E9A13B" stroke-width="2.5"/>

<circle cx="688.5" cy="265.0" r="9" fill="#14213D"/>
<circle cx="271.5" cy="395.0" r="9" fill="#14213D" fill-opacity="0.15" stroke="#14213D" stroke-width="2"/>
<circle cx="543.0" cy="517.1" r="9" fill="#E9A13B"/>
<circle cx="417.0" cy="142.9" r="9" fill="#E9A13B" fill-opacity="0.15" stroke="#E9A13B" stroke-width="2"/>

<text x="750" y="255" class="label" fill="#14213D">Zon-persoonlijkheid</text>
<text x="750" y="273" class="sub">zwart</text>
<text x="150" y="400" text-anchor="middle" class="label" fill="#14213D">Aarde-persoonlijkheid</text>
<text x="150" y="418" text-anchor="middle" class="sub">zwart</text>
<text x="600" y="548" class="label" fill="#9A5F0D">Zon-design</text>
<text x="600" y="566" class="sub">rood</text>
<text x="330" y="120" text-anchor="middle" class="label" fill="#9A5F0D">Aarde-design</text>
<text x="330" y="138" text-anchor="middle" class="sub">rood</text>

<text x="480" y="335" text-anchor="middle" class="label" font-size="15">4 poorten</text>
<text x="480" y="353" text-anchor="middle" class="sub">= 1 incarnatiekruis</text>

<text x="480" y="595" text-anchor="middle" class="sub" fill="#9A5F0D">Canoniek levensthema: waar het hele leven — bewust of onbewust — omheen zou draaien.</text>
</svg>
