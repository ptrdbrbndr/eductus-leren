<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
<style>
.label{font-size:15px;font-weight:700;fill:#14213D;}
.sub{font-size:12px;fill:#55606F;}
.title{font-family:'Cormorant Garamond', Georgia, serif;font-size:25px;fill:#14213D;font-weight:600;}
.kicker{font-size:11px;fill:#55606F;letter-spacing:.12em;}
</style>
<marker id="arrin" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
</defs>
<rect width="960" height="620" fill="#FBFAF7"/>
<text x="40" y="34" class="kicker">DEEL 6 · MECHANISME</text>
<text x="40" y="64" class="title">Eigen zender versus ontvanger-versterker</text>
<text x="40" y="92" class="sub">Gedefinieerd zendt een eigen, gesloten golflengte uit; open ontvangt en versterkt wat de omgeving aanbiedt.</text>

<!-- links: gedefinieerd = eigen zender -->
<text x="235" y="130" text-anchor="middle" class="label" fill="#2563A8">Gedefinieerd — eigen zender</text>
<g transform="translate(60,150) scale(0.34)">
  <g id="bodygraph-basis">
    <g stroke="#c7c2b6" stroke-width="4" fill="none">
      <line x1="250" y1="95"  x2="250" y2="110"/>
      <line x1="250" y1="180" x2="250" y2="195"/>
      <line x1="250" y1="275" x2="250" y2="295"/>
      <line x1="215" y1="255" x2="150" y2="450"/>
      <line x1="285" y1="255" x2="345" y2="375"/>
      <line x1="250" y1="275" x2="250" y2="430"/>
      <line x1="285" y1="260" x2="365" y2="450"/>
      <line x1="220" y1="365" x2="160" y2="460"/>
      <line x1="280" y1="365" x2="345" y2="385"/>
      <line x1="250" y1="405" x2="250" y2="430"/>
      <line x1="180" y1="470" x2="205" y2="470"/>
      <line x1="160" y1="500" x2="215" y2="580"/>
      <line x1="250" y1="510" x2="250" y2="565"/>
      <line x1="295" y1="470" x2="345" y2="470"/>
      <line x1="365" y1="500" x2="285" y2="580"/>
      <line x1="345" y1="400" x2="200" y2="465"/>
      <line x1="345" y1="400" x2="360" y2="450"/>
    </g>
    <polygon points="250,30 210,95 290,95" fill="#FFFFFF" stroke="#14213D" stroke-width="4"/>
    <polygon points="210,110 290,110 250,180" fill="#FFFFFF" stroke="#14213D" stroke-width="4"/>
    <rect x="205" y="195" width="90" height="80" fill="#FFFFFF" stroke="#14213D" stroke-width="4"/>
    <polygon points="250,295 320,350 250,405 180,350" fill="#FFFFFF" stroke="#14213D" stroke-width="4"/>
    <polygon points="400,360 340,385 400,410" fill="#FFFFFF" stroke="#14213D" stroke-width="4"/>
    <polygon points="60,440 60,500 160,470" fill="#FFFFFF" stroke="#14213D" stroke-width="4"/>
    <rect id="c-sacraal" x="205" y="430" width="90" height="80" fill="#2563A8" stroke="#14213D" stroke-width="4"/>
    <polygon points="390,440 390,500 295,470" fill="#FFFFFF" stroke="#14213D" stroke-width="4"/>
    <rect x="200" y="565" width="100" height="70" fill="#FFFFFF" stroke="#14213D" stroke-width="4"/>
  </g>
</g>
<!-- uitgaande golven vanuit sacraal -->
<g stroke="#2563A8" stroke-width="2.5" fill="none">
<path d="M330 400 q30 -10 60 0"/>
<path d="M320 420 q40 -15 80 0"/>
<path d="M310 440 q50 -18 100 0"/>
</g>
<text x="235" y="560" text-anchor="middle" class="sub">Consistent, van jou — een eigen, gesloten golflengte</text>

<!-- rechts: open = ontvanger-versterker -->
<text x="725" y="130" text-anchor="middle" class="label" fill="#E9A13B">Open — ontvanger-versterker</text>
<g transform="translate(550,150) scale(0.34)">
  <g id="bodygraph-basis2">
    <g stroke="#c7c2b6" stroke-width="4" fill="none">
      <line x1="250" y1="95"  x2="250" y2="110"/>
      <line x1="250" y1="180" x2="250" y2="195"/>
      <line x1="250" y1="275" x2="250" y2="295"/>
      <line x1="215" y1="255" x2="150" y2="450"/>
      <line x1="285" y1="255" x2="345" y2="375"/>
      <line x1="250" y1="275" x2="250" y2="430"/>
      <line x1="285" y1="260" x2="365" y2="450"/>
      <line x1="220" y1="365" x2="160" y2="460"/>
      <line x1="280" y1="365" x2="345" y2="385"/>
      <line x1="250" y1="405" x2="250" y2="430"/>
      <line x1="180" y1="470" x2="205" y2="470"/>
      <line x1="160" y1="500" x2="215" y2="580"/>
      <line x1="250" y1="510" x2="250" y2="565"/>
      <line x1="295" y1="470" x2="345" y2="470"/>
      <line x1="365" y1="500" x2="285" y2="580"/>
      <line x1="345" y1="400" x2="200" y2="465"/>
      <line x1="345" y1="400" x2="360" y2="450"/>
    </g>
    <polygon points="250,30 210,95 290,95" fill="#FFFFFF" stroke="#14213D" stroke-width="4"/>
    <polygon points="210,110 290,110 250,180" fill="#FFFFFF" stroke="#14213D" stroke-width="4"/>
    <rect x="205" y="195" width="90" height="80" fill="#FFFFFF" stroke="#14213D" stroke-width="4"/>
    <polygon points="250,295 320,350 250,405 180,350" fill="#FFFFFF" stroke="#14213D" stroke-width="4"/>
    <polygon points="400,360 340,385 400,410" fill="#FFFFFF" stroke="#14213D" stroke-width="4"/>
    <polygon points="60,440 60,500 160,470" fill="#FFFFFF" stroke="#14213D" stroke-width="4"/>
    <rect x="205" y="430" width="90" height="80" fill="#FFFFFF" stroke="#E9A13B" stroke-width="8" stroke-dasharray="12 8"/>
    <polygon points="390,440 390,500 295,470" fill="#FFFFFF" stroke="#14213D" stroke-width="4"/>
    <rect x="200" y="565" width="100" height="70" fill="#FFFFFF" stroke="#14213D" stroke-width="4"/>
  </g>
</g>
<!-- inkomende pijlen vanuit de omgeving naar het open sacraal -->
<g stroke="#E9A13B" stroke-width="3" fill="none">
<path d="M700 550 L790 470" marker-end="url(#arrin)"/>
<path d="M770 560 L820 465" marker-end="url(#arrin)"/>
<path d="M840 555 L850 460" marker-end="url(#arrin)"/>
</g>
<text x="770" y="580" text-anchor="middle" font-size="11" fill="#9A5F0D">energie uit de omgeving</text>
<text x="725" y="605" text-anchor="middle" class="sub">Variabel — neemt op, versterkt, geeft weer af (conditionering én wijsheid)</text>
</svg>
