<!-- legend -->
<g transform="translate(40,440)">
  <line x1="0" y1="0" x2="34" y2="0" stroke="#2563A8" stroke-width="6"/>
  <text x="42" y="4" class="sub">gekleurde lijn = compleet kanaal, verbindt één groep</text>
  <circle cx="490" cy="0" r="8" fill="none" stroke="#E9A13B" stroke-width="3" stroke-dasharray="4 4"/>
  <text x="508" y="4" class="sub">= plek waar een brug zou kunnen liggen, maar ontbreekt</text>
</g>
<text x="700" y="480" text-anchor="middle" class="sub">Grijze lijn = geen kanaal tussen die twee groepen op deze schematische kaart. Kleur van een centrum = welke groep het bij hoort; wit = open centrum.</text>
<text x="700" y="504" text-anchor="middle" class="sub">Schematisch, generiek voorbeeld — niet gekoppeld aan één specifieke casuspersoon uit het dossier.</text>
