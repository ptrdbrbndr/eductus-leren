<rect width="1400" height="640" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 12 · SCHEMATISCH OVERZICHT</text>
<text x="40" y="64" class="title">Vier definitietypes, naast elkaar</text>
<text x="40" y="90" class="sub">Dezelfde bodygraph-topologie, telkens anders gegroepeerd — kleur = eigen groep, grijze lijn = geen brug tussen groepen</text>

