<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 640" font-family="'DM Sans', Arial, sans-serif" width="1400" height="640" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper { fill:#FBFAF7; }
    .label { font-size:14px; font-weight:700; fill:#14213D; }
    .sub { font-size:12px; fill:#55606F; }
    .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
