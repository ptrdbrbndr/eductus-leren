<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
  <style>
    .paper{fill:#FBFAF7;}
    .label{font-size:14px;font-weight:700;fill:#14213D;}
    .label-light{font-size:15px;font-weight:700;fill:#FBFAF7;}
    .sub{font-size:12.5px;fill:#55606F;}
    .sub-light{font-size:12.5px;fill:#DFDCD3;}
    .title{font-family:'Cormorant Garamond', Georgia, serif;font-size:25px;fill:#14213D;font-weight:600;}
    .kicker{font-size:11px;fill:#55606F;letter-spacing:.12em;}
  </style>
</defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 14 · DRIE INTERACTIEPATRONEN OP CENTRUMNIVEAU</text>
<text x="40" y="64" class="title">Dominantie, compagnonschap, complementariteit</text>
<text x="40" y="90" class="sub">Wat het patroon betekent — en de schaduwzijde die de canon erbij noemt.</text>

<!-- Dominantie -->
<rect x="40" y="120" width="270" height="440" rx="10" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<rect x="40" y="120" width="270" height="56" rx="10" fill="#2563A8"/>
<rect x="40" y="150" width="270" height="26" fill="#2563A8"/>
<text x="175" y="154" text-anchor="middle" class="label-light" font-size="16">Dominantie</text>
<text x="60" y="200" class="label" font-size="13">Definitie</text>
<text x="60" y="222" class="sub">Centrum bij A gedefinieerd,</text>
<text x="60" y="238" class="sub">bij B open.</text>
<text x="60" y="264" class="sub">A brengt het thema</text>
<text x="60" y="280" class="sub">consistent in de relatie in —</text>
<text x="60" y="296" class="sub">B ervaart en versterkt het.</text>
<text x="60" y="330" class="label" font-size="13">Schaduwzijde</text>
<text x="60" y="352" class="sub">Geen overheersing — maar A</text>
<text x="60" y="368" class="sub">kan zijn bijdrage als</text>
<text x="60" y="384" class="sub">vanzelfsprekend gaan zien.</text>
<text x="60" y="420" class="label" font-size="13">Voorbeeld</text>
<text x="60" y="442" class="sub">Emma → Jasper (sacraal)</text>
<text x="60" y="458" class="sub">Jasper → Emma (ajna)</text>

<!-- Compagnonschap -->
<rect x="345" y="120" width="270" height="440" rx="10" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<rect x="345" y="120" width="270" height="56" rx="10" fill="#14213D"/>
<rect x="345" y="150" width="270" height="26" fill="#14213D"/>
<text x="480" y="154" text-anchor="middle" class="label-light" font-size="16">Compagnonschap</text>
<text x="365" y="200" class="label" font-size="13">Definitie</text>
<text x="365" y="222" class="sub">Centrum bij beiden</text>
<text x="365" y="238" class="sub">gedefinieerd.</text>
<text x="365" y="264" class="sub">Gedeelde, stabiele grond —</text>
<text x="365" y="280" class="sub">beiden brengen hetzelfde</text>
<text x="365" y="296" class="sub">thema consistent in.</text>
<text x="365" y="330" class="label" font-size="13">Schaduwzijde</text>
<text x="365" y="352" class="sub">Twee "vaste" stemmen op</text>
<text x="365" y="368" class="sub">hetzelfde vlak geven elkaar</text>
<text x="365" y="384" class="sub">soms minder ruimte.</text>
<text x="365" y="420" class="label" font-size="13">Voorbeeld</text>
<text x="365" y="442" class="sub">Sofie ↔ Ruben</text>
<text x="365" y="458" class="sub">(keel, G)</text>

<!-- Complementariteit -->
<rect x="650" y="120" width="270" height="440" rx="10" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<rect x="650" y="120" width="270" height="56" rx="10" fill="#E9A13B"/>
<rect x="650" y="150" width="270" height="26" fill="#E9A13B"/>
<text x="785" y="154" text-anchor="middle" class="label" font-size="16" fill="#14213D">Complementariteit</text>
<text x="670" y="200" class="label" font-size="13">Definitie</text>
<text x="670" y="222" class="sub">Centrum bij beiden open,</text>
<text x="670" y="238" class="sub">blijft open in de relatie.</text>
<text x="670" y="264" class="sub">Samen dekken A en B vaak</text>
<text x="670" y="280" class="sub">meer centra dan ieder</text>
<text x="670" y="296" class="sub">afzonderlijk.</text>
<text x="670" y="330" class="label" font-size="13">Schaduwzijde</text>
<text x="670" y="352" class="sub">Genoemd waar relevant —</text>
<text x="670" y="368" class="sub">bij volledige complemen-</text>
<text x="670" y="384" class="sub">tariteit niet apart benoemd.</text>
<text x="670" y="420" class="label" font-size="13">Voorbeeld</text>
<text x="670" y="442" class="sub">Emma + Jasper dekken</text>
<text x="670" y="458" class="sub">7 van de 9 centra</text>

<text x="480" y="595" text-anchor="middle" class="sub" fill="#9A5F0D">Bron: Reader deel 14, §2 — drie interactiepatronen op centrumniveau.</text>
</svg>
