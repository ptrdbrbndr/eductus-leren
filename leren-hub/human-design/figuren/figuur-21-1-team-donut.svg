<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
<style>
.label{font-size:14px;font-weight:700;fill:#14213D;}
.sub{font-size:12px;fill:#55606F;}
.title{font-family:'Cormorant Garamond', Georgia, serif;font-size:25px;fill:#14213D;font-weight:600;}
.kicker{font-size:11px;fill:#55606F;letter-spacing:.12em;}
</style>
</defs>
<rect width="960" height="620" fill="#FBFAF7"/>
<text x="40" y="34" class="kicker">DEEL 21 · TEAM-DIAGRAM</text>
<text x="40" y="64" class="title">Typeverdeling van het team Emma-Jasper-Sofie-Ruben-Lena</text>
<text x="40" y="92" class="sub">Vier typeaandelen, elk met de bijbehorende teamrol.</text>

<!-- donut: 5 people -> Generator/MG 2 (Emma+Sofie), Projector 1 (Jasper), Manifestor 1 (Ruben), Reflector 1 (Lena) -->
<!-- circle center 330,340 r=150, stroke-width 60 -->
<g transform="translate(330,340)">
  <circle r="150" fill="none" stroke="#e2ece8" stroke-width="60"/>
  <!-- segment Generator/MG: 2/5 = 144deg, from -90 -->
  <circle r="150" fill="none" stroke="#2563A8" stroke-width="60"
    stroke-dasharray="188.5 754" stroke-dashoffset="0" transform="rotate(-90)"/>
  <!-- segment Projector: 1/5 = 72deg -->
  <circle r="150" fill="none" stroke="#6FA3D6" stroke-width="60"
    stroke-dasharray="94.2 754" stroke-dashoffset="-188.5" transform="rotate(-90)"/>
  <!-- segment Manifestor: 1/5 = 72deg -->
  <circle r="150" fill="none" stroke="#E9A13B" stroke-width="60"
    stroke-dasharray="94.2 754" stroke-dashoffset="-282.7" transform="rotate(-90)"/>
  <!-- segment Reflector: 1/5 = 72deg -->
  <circle r="150" fill="none" stroke="#14213D" stroke-width="60"
    stroke-dasharray="94.2 754" stroke-dashoffset="-376.9" transform="rotate(-90)"/>
  <text x="0" y="-4" text-anchor="middle" class="label" font-size="15">Vijf</text>
  <text x="0" y="16" text-anchor="middle" class="label" font-size="15">personen</text>
</g>

<!-- legend / roles -->
<g transform="translate(560,150)">
  <rect x="0" y="0" width="26" height="26" rx="5" fill="#2563A8"/>
  <text x="36" y="19" class="label">Generator / MG — motor</text>
  <text x="36" y="38" class="sub">Emma, Sofie (2 van de 5)</text>

  <rect x="0" y="72" width="26" height="26" rx="5" fill="#6FA3D6"/>
  <text x="36" y="91" class="label">Projector — stuur</text>
  <text x="36" y="110" class="sub">Jasper (1 van de 5)</text>

  <rect x="0" y="144" width="26" height="26" rx="5" fill="#E9A13B"/>
  <text x="36" y="163" class="label">Manifestor — initiator</text>
  <text x="36" y="182" class="sub">Ruben (1 van de 5)</text>

  <rect x="0" y="216" width="26" height="26" rx="5" fill="#14213D"/>
  <text x="36" y="235" class="label">Reflector — spiegel</text>
  <text x="36" y="254" class="sub">Lena (1 van de 5)</text>
</g>

<text x="480" y="560" text-anchor="middle" class="sub" fill="#55606F">Voldoende motor, precies één stuur en één initiator — mits Jasper wordt uitgenodigd en Ruben consequent informeert.</text>
</svg>
