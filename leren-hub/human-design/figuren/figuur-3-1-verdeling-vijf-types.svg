<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
<style>
.label{font-size:13px;font-weight:700;fill:#14213D;}
.sub{font-size:11.5px;fill:#55606F;}
.title{font-family:'Cormorant Garamond', Georgia, serif;font-size:25px;fill:#14213D;font-weight:600;}
.kicker{font-size:11px;fill:#55606F;letter-spacing:.12em;}
</style>
</defs>
<rect width="960" height="620" fill="#FBFAF7"/>
<text x="40" y="34" class="kicker">DEEL 3 · CANONVERDELING</text>
<text x="40" y="64" class="title">De vijf types in de populatie (canonwaarden)</text>
<text x="40" y="92" class="sub">Onthoud deze cijfers als canonwaarden uit de leer, niet als onderzoeksresultaat.</text>

<!-- taartdiagram, opgebouwd uit sectoren rond middelpunt 280,340 r=170 -->
<g transform="translate(280,340)">
<!-- Generator 37% start 0deg -->
<path d="M0,0 L0,-170 A170,170 0 0,1 155,-70 Z" fill="#2563A8"/>
<!-- MG 33% -->
<path d="M0,0 L155,-70 A170,170 0 0,1 -5,170 Z" fill="#6FA3D6"/>
<!-- Projector 20% -->
<path d="M0,0 L-5,170 A170,170 0 0,1 -166,-40 Z" fill="#CBDCEF"/>
<!-- Manifestor 9% -->
<path d="M0,0 L-166,-40 A170,170 0 0,1 -83,-148 Z" fill="#E9A13B"/>
<!-- Reflector 1% -->
<path d="M0,0 L-83,-148 A170,170 0 0,1 0,-170 Z" fill="#8a3324"/>
</g>

<g font-size="13">
<circle cx="590" cy="170" r="9" fill="#2563A8"/><text x="608" y="175" class="label">Generator</text><text x="740" y="175" class="sub">± 37%</text>
<circle cx="590" cy="205" r="9" fill="#6FA3D6"/><text x="608" y="210" class="label">Manifesting Generator</text><text x="740" y="210" class="sub">± 33%</text>
<circle cx="590" cy="240" r="9" fill="#CBDCEF"/><text x="608" y="245" class="label">Projector</text><text x="740" y="245" class="sub">± 20%</text>
<circle cx="590" cy="275" r="9" fill="#E9A13B"/><text x="608" y="280" class="label">Manifestor</text><text x="740" y="280" class="sub">± 9%</text>
<circle cx="590" cy="310" r="9" fill="#8a3324"/><text x="608" y="315" class="label">Reflector</text><text x="740" y="315" class="sub">± 1%</text>
</g>

<!-- vijf poppetjes bij hun segment -->
<g font-size="11" text-anchor="middle">
<circle cx="380" cy="270" r="16" fill="#FBFAF7" stroke="#2563A8" stroke-width="2"/><text x="380" y="274" fill="#14213D" font-weight="700">E</text><text x="380" y="298" fill="#55606F">Emma</text>
<circle cx="330" cy="440" r="16" fill="#FBFAF7" stroke="#6FA3D6" stroke-width="2"/><text x="330" y="444" fill="#14213D" font-weight="700">S</text><text x="330" y="468" fill="#55606F">Sofie</text>
<circle cx="170" cy="400" r="16" fill="#FBFAF7" stroke="#CBDCEF" stroke-width="2"/><text x="170" y="404" fill="#14213D" font-weight="700">J</text><text x="170" y="428" fill="#55606F">Jasper</text>
<circle cx="150" cy="230" r="16" fill="#FBFAF7" stroke="#E9A13B" stroke-width="2"/><text x="150" y="234" fill="#14213D" font-weight="700">R</text><text x="150" y="258" fill="#55606F">Ruben</text>
<circle cx="255" cy="185" r="16" fill="#FBFAF7" stroke="#8a3324" stroke-width="2"/><text x="255" y="189" fill="#14213D" font-weight="700">L</text><text x="255" y="213" fill="#55606F">Lena</text>
</g>

<text x="700" y="380" font-size="12" fill="#9A5F0D">Vijf mechanieken, één</text>
<text x="700" y="398" font-size="12" fill="#9A5F0D">cursuspersoon per type —</text>
<text x="700" y="416" font-size="12" fill="#9A5F0D">Lena's segment is bewust</text>
<text x="700" y="434" font-size="12" fill="#9A5F0D">het smalst getekend.</text>
</svg>
