<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:13.5px; font-weight:700; fill:#14213D; }
      .label-light { font-size:13.5px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:11.5px; fill:#55606F; }
      .sub-light { font-size:11.5px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563A8"/></marker>
</defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 19 · CONCEPTDIAGRAM · DAGDEEL A</text>
<text x="40" y="64" class="title">Van detectie tot containment</text>
<text x="40" y="96" class="sub">Eerst stoppen, dan pas volledig doorgronden — met het Mutatieplatform-incident als voorbeeld.</text>

<rect x="40" y="130" width="260" height="180" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="170" y="158" text-anchor="middle" class="label">1. DETECTIE</text>
<text x="60" y="184" class="sub">monitoring, oplettende</text>
<text x="60" y="200" class="sub">medewerker, externe melding</text>
<text x="60" y="228" class="sub" font-weight="700">Ruud: "iets vreemds in de</text>
<text x="60" y="244" class="sub" font-weight="700">logs" — dinsdagmiddag</text>
<text x="60" y="270" class="sub" font-style="italic">investering in logging (deel 7)</text>
<text x="60" y="286" class="sub" font-style="italic">betaalt zich hier terug</text>

<line x1="300" y1="220" x2="332" y2="220" class="arrow"/>
<rect x="340" y="130" width="260" height="180" rx="8" fill="#6FA3D6"/>
<text x="470" y="158" text-anchor="middle" class="label">2. TRIAGE — eerste uur</text>
<text x="360" y="184" class="sub">incident/datalek/allebei?</text>
<text x="360" y="200" class="sub">actief of afgerond?</text>
<text x="360" y="216" class="sub">welke systemen/gegevens?</text>
<text x="360" y="232" class="sub">wie moet direct aansluiten?</text>
<text x="360" y="260" class="sub" font-weight="700">binnen het uur: actief, raakt</text>
<text x="360" y="276" class="sub" font-weight="700">persoonsgegevens, Sanne</text>
<text x="360" y="292" class="sub" font-weight="700">moet aansluiten</text>

<line x1="600" y1="220" x2="632" y2="220" class="arrow"/>
<rect x="640" y="130" width="280" height="180" rx="8" fill="#2563A8"/>
<text x="780" y="158" text-anchor="middle" class="label-light">3. CONTAINMENT</text>
<text x="660" y="184" class="sub-light">stop de lopende schade,</text>
<text x="660" y="200" class="sub-light">vóórdat de oorzaak volledig</text>
<text x="660" y="216" class="sub-light">bekend is</text>
<text x="660" y="244" class="sub-light" font-weight="700">koppeling met werkgevers-</text>
<text x="660" y="260" class="sub-light" font-weight="700">portalen wordt onmiddellijk</text>
<text x="660" y="276" class="sub-light" font-weight="700">tijdelijk uitgeschakeld</text>

<rect x="60" y="340" width="840" height="100" rx="8" fill="#E9A13B"/>
<text x="480" y="368" text-anchor="middle" class="label" fill="#6B4509">SPANNING: containment versus bewijsvoering</text>
<text x="480" y="392" text-anchor="middle" class="sub" fill="#6B4509">overhaast "opruimen" wist sporen die nodig zijn om de omvang correct in te schatten —</text>
<text x="480" y="410" text-anchor="middle" class="sub" fill="#6B4509">waar mogelijk: bewijsmateriaal vastleggen vóór containmentmaatregelen</text>

<text x="480" y="480" text-anchor="middle" class="sub">een risico-eigenaar met voldoende gezag maakt deze afweging, snel — dagdeel B: de tijdlijn van het datalek</text>
</svg>
