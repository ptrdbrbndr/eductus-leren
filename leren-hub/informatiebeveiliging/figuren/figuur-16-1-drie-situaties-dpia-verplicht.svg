<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="'DM Sans', Arial, sans-serif" width="960" height="480" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .sub { font-size:12px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    </style>
</defs>
<rect width="960" height="480" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 16 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Drie situaties waarin een DPIA bijna altijd verplicht is</text>
<text x="40" y="96" class="sub">Bij twijfel: liever een DPIA te veel dan te weinig.</text>

<rect x="50" y="140" width="270" height="230" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<circle cx="90" cy="180" r="16" fill="#2563A8"/><text x="90" y="185" text-anchor="middle" fill="#FBFAF7" font-weight="700" font-size="14">1</text>
<text x="115" y="185" class="label" font-size="13">Profilering met</text>
<text x="115" y="203" class="label" font-size="13">rechtsgevolgen</text>
<text x="70" y="230" class="sub">systematische, uitgebreide</text>
<text x="70" y="248" class="sub">beoordeling van persoonlijke</text>
<text x="70" y="266" class="sub">aspecten, met gevolgen voor</text>
<text x="70" y="284" class="sub">de betrokkene</text>

<rect x="345" y="140" width="270" height="230" rx="8" fill="#2563A8"/>
<circle cx="385" cy="180" r="16" fill="#E9A13B"/><text x="385" y="185" text-anchor="middle" fill="#6B4509" font-weight="700" font-size="14">2</text>
<text x="410" y="185" fill="#FBFAF7" font-weight="700" font-size="13">Grootschalige bijzondere</text>
<text x="410" y="203" fill="#FBFAF7" font-weight="700" font-size="13">categorieën</text>
<text x="365" y="230" fill="#DFDCD3" font-size="12">gezondheidsgegevens in</text>
<text x="365" y="248" fill="#DFDCD3" font-size="12">arbeidsongeschiktheids-</text>
<text x="365" y="266" fill="#DFDCD3" font-size="12">dossiers — direct relevant</text>
<text x="365" y="284" fill="#DFDCD3" font-size="12">voor Meridiaan</text>

<rect x="640" y="140" width="270" height="230" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<circle cx="680" cy="180" r="16" fill="#2563A8"/><text x="680" y="185" text-anchor="middle" fill="#FBFAF7" font-weight="700" font-size="14">3</text>
<text x="705" y="185" class="label" font-size="13">Stelselmatige, groot-</text>
<text x="705" y="203" class="label" font-size="13">schalige monitoring</text>
<text x="660" y="230" class="sub">van een publiek</text>
<text x="660" y="248" class="sub">toegankelijke ruimte,</text>
<text x="660" y="266" class="sub">fysiek of digitaal</text>

<text x="480" y="430" text-anchor="middle" class="sub" fill="#9A5F0D">bij het Mutatieplatform: situatie 2 alleen al maakt een DPIA verplicht voor het arbeidsongeschiktheidsdossier</text>
</svg>
