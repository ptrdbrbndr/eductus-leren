<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'DM Sans', Arial, sans-serif" width="960" height="560" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:11.5px; fill:#55606F; }
      .sub-light { font-size:11.5px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    </style>
</defs>
<rect width="960" height="560" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 4 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Three lines of defence — Meridiaan-rollen per lijn</text>
<text x="40" y="96" class="sub">Wie uitvoert, controleert niet zichzelf.</text>

<rect x="230" y="120" width="500" height="60" rx="8" fill="#14213D"/>
<text x="480" y="145" text-anchor="middle" class="label-light">BESTUUR</text>
<text x="480" y="163" text-anchor="middle" class="sub-light">eindverantwoordelijk, kan delegeren maar niet afschuiven</text>

<rect x="40" y="210" width="880" height="90" rx="8" fill="#2563A8"/>
<text x="70" y="238" class="label-light">EERSTE LIJN — dagelijkse uitvoering</text>
<text x="70" y="260" class="sub-light">Karin en haar team: bouwen en beheren het Mutatieplatform,</text>
<text x="70" y="278" class="sub-light">dragen de dagelijkse verantwoordelijkheid voor eigen risico's</text>

<rect x="40" y="320" width="880" height="90" rx="8" fill="#6FA3D6"/>
<text x="70" y="348" class="label">TWEEDE LIJN — kaders, advies, toezicht</text>
<text x="70" y="370" class="sub">Merel (security) en Sanne (FG): leveren beleid en expertise,</text>
<text x="70" y="388" class="sub">houden overzicht — dragen niet de operationele uitvoering</text>

<rect x="40" y="430" width="880" height="90" rx="8" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
<text x="70" y="458" class="label" fill="#9A5F0D">DERDE LIJN — onafhankelijke audit</text>
<text x="70" y="480" class="sub">beoordeelt periodiek of het geheel — inclusief lijn 1 én 2 zelf —</text>
<text x="70" y="498" class="sub">aantoonbaar werkt (deel 26, niveau 3)</text>

</svg>
