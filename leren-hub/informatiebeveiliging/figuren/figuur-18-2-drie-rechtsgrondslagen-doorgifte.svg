<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="'DM Sans', Arial, sans-serif" width="960" height="500" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    </style>
</defs>
<rect width="960" height="500" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 18 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Drie rechtsgrondslagen voor doorgifte buiten de EER</text>
<text x="40" y="96" class="sub">Een getekend contract is niet automatisch voldoende — het beschermingsniveau moet feitelijk gelijkwaardig zijn.</text>

<rect x="60" y="140" width="260" height="220" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="190" y="172" text-anchor="middle" class="label">Adequaatheidsbesluit</text>
<text x="80" y="200" class="sub">Europese Commissie erkent</text>
<text x="80" y="216" class="sub">een land als gelijkwaardig</text>
<text x="80" y="232" class="sub">beschermend</text>
<text x="80" y="260" class="sub" font-style="italic">geen extra stappen nodig</text>
<text x="80" y="276" class="sub" font-style="italic">voor dat specifieke land</text>

<rect x="350" y="140" width="260" height="220" rx="8" fill="#6FA3D6"/>
<text x="480" y="172" text-anchor="middle" class="label">Modelcontract-</text>
<text x="480" y="190" text-anchor="middle" class="label">bepalingen</text>
<text x="370" y="216" class="sub">gestandaardiseerde</text>
<text x="370" y="232" class="sub">contractuele waarborgen</text>
<text x="370" y="260" class="sub" font-weight="700">vereist óók een feitelijke</text>
<text x="370" y="276" class="sub" font-weight="700">beoordeling van het</text>
<text x="370" y="292" class="sub" font-weight="700">beschermingsniveau</text>

<rect x="640" y="140" width="260" height="220" rx="8" fill="#E9A13B"/>
<text x="770" y="172" text-anchor="middle" class="label" fill="#6B4509">Andere passende</text>
<text x="770" y="190" text-anchor="middle" class="label" fill="#6B4509">waarborgen</text>
<text x="660" y="216" fill="#6B4509" font-size="12">specifieke gevallen,</text>
<text x="660" y="232" fill="#6B4509" font-size="12">aanvullende technische</text>
<text x="660" y="248" fill="#6B4509" font-size="12">maatregelen zoals sterke</text>
<text x="660" y="264" fill="#6B4509" font-size="12">versleuteling met sleutel-</text>
<text x="660" y="280" fill="#6B4509" font-size="12">beheer buiten het derde land</text>
<text x="660" y="304" fill="#6B4509" font-size="11" font-style="italic">(deel 6)</text>

<rect x="140" y="392" width="680" height="80" rx="8" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
<text x="480" y="418" text-anchor="middle" class="sub" fill="#9A5F0D" font-weight="700">bij de documentherkenningsleverancier: cloud in de EER, maar</text>
<text x="480" y="438" text-anchor="middle" class="sub">techn. supportfunctie deels vanuit een derde land — vraagt een aparte,</text>
<text x="480" y="456" text-anchor="middle" class="sub">expliciete beoordeling, niet automatisch onaanvaardbaar</text>
</svg>
