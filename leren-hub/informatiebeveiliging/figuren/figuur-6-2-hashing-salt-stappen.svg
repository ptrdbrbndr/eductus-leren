<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="'DM Sans', Arial, sans-serif" width="960" height="480" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:12.5px; font-weight:700; fill:#14213D; }
      .label-light { font-size:12.5px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:11px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563A8"/></marker>
</defs>
<rect width="960" height="480" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 6 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Wachtwoordopslag met salt — stap voor stap</text>
<text x="40" y="96" class="sub">Twee gebruikers, hetzelfde wachtwoord, nooit dezelfde hashwaarde.</text>

<rect x="40" y="140" width="180" height="80" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="130" y="168" text-anchor="middle" class="label">Wachtwoord</text>
<text x="130" y="188" text-anchor="middle" class="sub">"Zomer2026!"</text>
<text x="130" y="205" text-anchor="middle" class="sub" font-size="9">nooit zelf opgeslagen</text>

<path d="M220,180 L270,180" class="arrow"/>
<rect x="270" y="140" width="180" height="80" rx="6" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
<text x="360" y="168" text-anchor="middle" class="label" fill="#9A5F0D">+ salt</text>
<text x="360" y="188" text-anchor="middle" class="sub">willekeurige, unieke</text>
<text x="360" y="203" text-anchor="middle" class="sub">extra data per gebruiker</text>

<path d="M450,180 L500,180" class="arrow"/>
<rect x="500" y="140" width="180" height="80" rx="6" fill="#2563A8"/>
<text x="590" y="168" text-anchor="middle" class="label-light">Trage hashfunctie</text>
<text x="590" y="188" text-anchor="middle" class="sub" fill="#DFDCD3">doelbewust langzaam —</text>
<text x="590" y="203" text-anchor="middle" class="sub" fill="#DFDCD3">gokken kost tijd</text>

<path d="M680,180 L730,180" class="arrow"/>
<rect x="730" y="140" width="190" height="80" rx="6" fill="#14213D"/>
<text x="825" y="168" text-anchor="middle" class="label-light">Hashwaarde + salt</text>
<text x="825" y="188" text-anchor="middle" class="sub" fill="#DFDCD3">opgeslagen —</text>
<text x="825" y="203" text-anchor="middle" class="sub" fill="#DFDCD3">niet omkeerbaar</text>

<line x1="825" y1="220" x2="825" y2="260" class="arrow"/>
<rect x="600" y="260" width="330" height="90" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="765" y="288" text-anchor="middle" class="label" font-size="11">Bij inloggen</text>
<text x="765" y="308" text-anchor="middle" class="sub">ingevoerd wachtwoord + opgeslagen salt</text>
<text x="765" y="325" text-anchor="middle" class="sub">opnieuw hashen, vergelijken met opgeslagen hash</text>

<rect x="150" y="390" width="660" height="70" rx="8" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
<text x="480" y="418" text-anchor="middle" class="sub" fill="#9A5F0D">Zonder salt: vooraf berekende opzoektabellen (rainbow tables)</text>
<text x="480" y="438" text-anchor="middle" class="sub" fill="#9A5F0D">maken een gelekte hashdatabase in één klap bruikbaar</text>
</svg>
