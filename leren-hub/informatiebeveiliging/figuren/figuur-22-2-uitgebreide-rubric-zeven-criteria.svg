<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="'DM Sans', Arial, sans-serif" width="960" height="700" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:12.5px; font-weight:700; fill:#14213D; }
      .sub { font-size:11.5px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .num { font-size:12px; font-weight:700; fill:#FFFFFF; }
      .tag { font-size:10px; font-weight:700; fill:#FFFFFF; letter-spacing:.04em; }
    </style>
</defs>
<rect width="960" height="700" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 22 · INSTRUMENT</text>
<text x="40" y="64" class="title">De rubric — zeven criteria</text>
<text x="40" y="94" class="sub">Vijf criteria ongewijzigd uit deel 10, twee nieuw voor niveau 2.</text>

<rect x="40" y="116" width="880" height="52" fill="#FFFFFF" stroke="#2563A8" stroke-width="1"/>
<circle cx="66" cy="142" r="14" fill="#2563A8"/><text x="66" y="147" text-anchor="middle" class="num">1</text>
<text x="90" y="138" class="label">Volledigheid van de diagnose</text>
<text x="90" y="156" class="sub">ongewijzigd uit deel 10</text>
<rect x="760" y="128" width="140" height="26" rx="13" fill="#55606F"/><text x="830" y="146" text-anchor="middle" class="tag">ONGEWIJZIGD</text>

<rect x="40" y="172" width="880" height="52" fill="#F4F2EC"/>
<circle cx="66" cy="198" r="14" fill="#2563A8"/><text x="66" y="203" text-anchor="middle" class="num">2</text>
<text x="90" y="194" class="label">Kwaliteit van de prioritering</text>
<text x="90" y="212" class="sub">ongewijzigd</text>
<rect x="760" y="184" width="140" height="26" rx="13" fill="#55606F"/><text x="830" y="202" text-anchor="middle" class="tag">ONGEWIJZIGD</text>

<rect x="40" y="228" width="880" height="52" fill="#FFFFFF" stroke="#2563A8" stroke-width="1"/>
<circle cx="66" cy="254" r="14" fill="#2563A8"/><text x="66" y="259" text-anchor="middle" class="num">3</text>
<text x="90" y="250" class="label">Bruikbaarheid van de drieslag symptoom/wortel/structureel</text>
<text x="90" y="268" class="sub">ongewijzigd</text>
<rect x="760" y="240" width="140" height="26" rx="13" fill="#55606F"/><text x="830" y="258" text-anchor="middle" class="tag">ONGEWIJZIGD</text>

<rect x="40" y="284" width="880" height="52" fill="#F4F2EC"/>
<circle cx="66" cy="310" r="14" fill="#2563A8"/><text x="66" y="315" text-anchor="middle" class="num">4</text>
<text x="90" y="306" class="label">Het onderbouwde "nee, dit niet"</text>
<text x="90" y="324" class="sub">nu ook in risicobehandeling, SoA en grondslagbeoordeling</text>
<rect x="760" y="296" width="140" height="26" rx="13" fill="#55606F"/><text x="830" y="314" text-anchor="middle" class="tag">ONGEWIJZIGD</text>

<rect x="40" y="340" width="880" height="52" fill="#FFFFFF" stroke="#2563A8" stroke-width="1"/>
<circle cx="66" cy="366" r="14" fill="#2563A8"/><text x="66" y="371" text-anchor="middle" class="num">5</text>
<text x="90" y="362" class="label">Standvastigheid onder tegenspraak</text>
<text x="90" y="380" class="sub">ongewijzigd</text>
<rect x="760" y="352" width="140" height="26" rx="13" fill="#55606F"/><text x="830" y="370" text-anchor="middle" class="tag">ONGEWIJZIGD</text>

<rect x="40" y="396" width="880" height="66" fill="#E9A13B"/>
<circle cx="66" cy="428" r="14" fill="#6B4509"/><text x="66" y="433" text-anchor="middle" class="num">6</text>
<text x="90" y="420" class="label" fill="#6B4509">Aantoonbaarheid — NIEUW</text>
<text x="90" y="438" fill="#6B4509" font-size="11.5">kan de verdediger tonen hóe iets aantoonbaar is (opzet/bestaan/werking, deel 20)?</text>
<text x="90" y="454" fill="#6B4509" font-size="11.5">niet alleen beweren dat het zo is</text>
<rect x="760" y="410" width="140" height="26" rx="13" fill="#6B4509"/><text x="830" y="428" text-anchor="middle" class="tag">NIEUW N2</text>

<rect x="40" y="466" width="880" height="66" fill="#E9A13B"/>
<circle cx="66" cy="498" r="14" fill="#6B4509"/><text x="66" y="503" text-anchor="middle" class="num">7</text>
<text x="90" y="490" class="label" fill="#6B4509">Systeemdenken — NIEUW</text>
<text x="90" y="508" fill="#6B4509" font-size="11.5">herkent de verdediger de onderliggende procesoorzaak, zoals Karin bij het</text>
<text x="90" y="524" fill="#6B4509" font-size="11.5">incident (deel 19) — niet alleen het directe symptoom</text>
<rect x="760" y="480" width="140" height="26" rx="13" fill="#6B4509"/><text x="830" y="498" text-anchor="middle" class="tag">NIEUW N2</text>

<text x="480" y="580" text-anchor="middle" class="sub" fill="#9A5F0D">de toezichtsrol test specifiek op criterium 6 en 7 — "kunt u dit aantonen, niet alleen beweren?"</text>
</svg>
