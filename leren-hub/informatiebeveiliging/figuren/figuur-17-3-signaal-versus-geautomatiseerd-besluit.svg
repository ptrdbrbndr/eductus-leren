<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="'DM Sans', Arial, sans-serif" width="960" height="500" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563A8"/></marker>
</defs>
<rect width="960" height="500" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 17 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Profilering: signaal met mens versus geautomatiseerd besluit</text>
<text x="40" y="96" class="sub">De ontwerpkeuze "mens in de lus of niet" hoort thuis in het dreigingsmodelleringsritueel van deel 15.</text>

<rect x="380" y="130" width="200" height="60" rx="8" fill="#6FA3D6"/>
<text x="480" y="156" text-anchor="middle" class="label">Risicosignalering</text>
<text x="480" y="176" text-anchor="middle" class="sub">verzuimvoorspelling</text>

<line x1="440" y1="190" x2="290" y2="230" class="arrow"/>
<line x1="520" y1="190" x2="670" y2="230" class="arrow"/>

<rect x="80" y="232" width="360" height="220" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="260" y="262" text-anchor="middle" class="label">Signaal + menselijke tussenkomst</text>
<text x="100" y="292" class="sub">Een medewerker beoordeelt het</text>
<text x="100" y="308" class="sub">signaal en beslist zelf wat ermee</text>
<text x="100" y="324" class="sub">gebeurt bij de deelnemer</text>
<rect x="100" y="344" width="320" height="86" rx="6" fill="#CBDCEF"/>
<text x="260" y="368" text-anchor="middle" class="sub" font-weight="700">valt mogelijk buiten het</text>
<text x="260" y="386" text-anchor="middle" class="sub" font-weight="700">strengste regime</text>
<text x="260" y="406" text-anchor="middle" class="sub" font-size="11">— trapstoets en bijzondere</text>
<text x="260" y="422" text-anchor="middle" class="sub" font-size="11">categorieën blijven wel gelden</text>

<rect x="520" y="232" width="360" height="220" rx="8" fill="#2563A8"/>
<text x="700" y="262" text-anchor="middle" class="label-light">Uitsluitend geautomatiseerd besluit</text>
<text x="540" y="292" fill="#DFDCD3" font-size="12">rechtsgevolgen of treft de</text>
<text x="540" y="308" fill="#DFDCD3" font-size="12">betrokkene op vergelijkbare</text>
<text x="540" y="324" fill="#DFDCD3" font-size="12">wijze in aanmerkelijke mate</text>
<rect x="540" y="344" width="320" height="86" rx="6" fill="#E9A13B"/>
<text x="700" y="368" text-anchor="middle" class="sub" fill="#6B4509" font-weight="700">in beginsel verboden</text>
<text x="700" y="386" text-anchor="middle" class="sub" fill="#6B4509" font-size="11">tenzij specifieke uitzondering +</text>
<text x="700" y="402" text-anchor="middle" class="sub" fill="#6B4509" font-size="11">recht op menselijke tussenkomst</text>
<text x="700" y="422" text-anchor="middle" class="sub" fill="#6B4509" font-size="11">als aanvullende waarborg</text>

<text x="480" y="480" text-anchor="middle" class="sub" fill="#9A5F0D">de eerste, ontlastende vraag: leidt dit tot een besluit, of tot een signaal dat een mens nog beoordeelt?</text>
</svg>
