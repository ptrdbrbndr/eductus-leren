<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="'DM Sans', Arial, sans-serif" width="960" height="420" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:13px; font-weight:700; fill:#14213D; }
      .sub { font-size:11.5px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    </style>
</defs>
<rect width="960" height="420" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 8 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Drie factoren die een bewaartermijn bepalen</text>
<text x="40" y="96" class="sub">Een termijn die alleen op papier staat, is geen aantoonbare praktijk.</text>

<rect x="50" y="140" width="270" height="200" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<circle cx="185" cy="180" r="20" fill="#2563A8"/><text x="185" y="187" text-anchor="middle" fill="#FBFAF7" font-weight="700" font-size="15">1</text>
<text x="185" y="222" text-anchor="middle" class="label">Het doel zelf</text>
<text x="185" y="248" text-anchor="middle" class="sub">zodra bereikt of niet</text>
<text x="185" y="264" text-anchor="middle" class="sub">langer relevant, vervalt</text>
<text x="185" y="280" text-anchor="middle" class="sub">de grondslag om te bewaren</text>
<text x="185" y="312" text-anchor="middle" class="sub" font-style="italic">testdata na afronding</text>
<text x="185" y="328" text-anchor="middle" class="sub" font-style="italic">van de release</text>

<rect x="345" y="140" width="270" height="200" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<circle cx="480" cy="180" r="20" fill="#2563A8"/><text x="480" y="187" text-anchor="middle" fill="#FBFAF7" font-weight="700" font-size="15">2</text>
<text x="480" y="222" text-anchor="middle" class="label" font-size="12">Wettelijke bewaarplicht</text>
<text x="480" y="248" text-anchor="middle" class="sub">soms juist decennialang —</text>
<text x="480" y="264" text-anchor="middle" class="sub">pensioenaanspraken komen</text>
<text x="480" y="280" text-anchor="middle" class="sub">pas tientallen jaren later tot</text>
<text x="480" y="296" text-anchor="middle" class="sub">uitkering</text>

<rect x="640" y="140" width="270" height="200" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<circle cx="775" cy="180" r="20" fill="#2563A8"/><text x="775" y="187" text-anchor="middle" fill="#FBFAF7" font-weight="700" font-size="15">3</text>
<text x="775" y="222" text-anchor="middle" class="label" font-size="12">Verjaring / bewijspositie</text>
<text x="775" y="248" text-anchor="middle" class="sub">civielrechtelijke reden om</text>
<text x="775" y="264" text-anchor="middle" class="sub">langer te bewaren dan het</text>
<text x="775" y="280" text-anchor="middle" class="sub">oorspronkelijke doel</text>
<text x="775" y="312" text-anchor="middle" class="sub" font-style="italic">een geschil kunnen</text>
<text x="775" y="328" text-anchor="middle" class="sub" font-style="italic">onderbouwen</text>

<rect x="150" y="365" width="660" height="45" rx="8" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
<text x="480" y="392" text-anchor="middle" class="sub" fill="#9A5F0D">Geen van drie is vastgesteld voor de testomgevingen — de data staat er al jaren</text>
</svg>
