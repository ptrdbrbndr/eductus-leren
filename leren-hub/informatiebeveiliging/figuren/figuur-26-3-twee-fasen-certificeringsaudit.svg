<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="'DM Sans', Arial, sans-serif" width="960" height="540" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:13px; font-weight:700; fill:#14213D; }
      .label-light { font-size:13px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:11px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-amber { stroke:#E9A13B; stroke-width:2; fill:none; stroke-dasharray:5 4; marker-end:url(#arra); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#E9A13B"/></marker>
</defs>
<rect width="960" height="540" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 26 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">De certificeringsaudit in twee fasen</text>
<text x="40" y="96" class="sub">Fase 1 zonder een sterke fase 2 is precies het risico dat deel 20 al waarschuwde: mooi op papier, niet gevolgd.</text>

<rect x="80" y="130" width="350" height="200" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<rect x="80" y="130" width="350" height="46" rx="8" fill="#2563A8"/>
<text x="255" y="159" text-anchor="middle" class="label-light">FASE 1 — documentatiebeoordeling</text>
<text x="100" y="200" class="sub">bestaat het ISMS op papier?</text>
<text x="100" y="218" class="sub">is de scope duidelijk?</text>
<text x="100" y="236" class="sub">is de Verklaring van Toepasselijkheid</text>
<text x="100" y="252" class="sub">compleet en beargumenteerd?</text>
<rect x="100" y="272" width="310" height="40" rx="6" fill="#FBFAF7" stroke="#55606F" stroke-width="1.5"/>
<text x="255" y="297" text-anchor="middle" class="sub" font-weight="700">toetst: OPZET (deel 20)</text>

<line x1="430" y1="230" x2="510" y2="230" class="arrow"/>

<rect x="530" y="130" width="350" height="200" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<rect x="530" y="130" width="350" height="46" rx="8" fill="#2563A8"/>
<text x="705" y="159" text-anchor="middle" class="label-light">FASE 2 — implementatiebeoordeling</text>
<text x="550" y="200" class="sub">wordt het ISMS daadwerkelijk</text>
<text x="550" y="218" class="sub">gevolgd, met bewijs uit de</text>
<text x="550" y="236" class="sub">praktijk: logs, interviews,</text>
<text x="550" y="252" class="sub">steekproeven?</text>
<rect x="550" y="272" width="310" height="40" rx="6" fill="#FBFAF7" stroke="#E9A13B" stroke-width="2"/>
<text x="705" y="297" text-anchor="middle" class="sub" fill="#9A5F0D" font-weight="700">toetst: BESTAAN EN WERKING (deel 20)</text>

<line x1="480" y1="330" x2="480" y2="345" stroke="#2563A8" stroke-width="2"/>
<line x1="480" y1="345" x2="705" y2="345" stroke="#2563A8" stroke-width="2"/>
<line x1="705" y1="345" x2="705" y2="362" class="arrow"/>

<rect x="555" y="368" width="300" height="55" rx="8" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
<text x="705" y="401" text-anchor="middle" class="label" font-size="12" fill="#9A5F0D">CERTIFICERING verleend</text>

<path d="M855 395 L900 395 L900 240 L882 240" class="arrow-amber"/>
<text x="905" y="330" text-anchor="middle" class="sub" fill="#9A5F0D" transform="rotate(-90 905 330)" font-size="10">surveillance jaarlijks · hercert. 3 jaar</text>

<text x="480" y="480" text-anchor="middle" class="sub" fill="#9A5F0D">periodieke surveillance-audits voorkomen precies het terugglijden dat deel 20 al beschreef</text>
</svg>
