<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" font-family="'DM Sans', Arial, sans-serif" width="960" height="760" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:13px; font-weight:700; fill:#14213D; letter-spacing:.02em; }
      .sub { font-size:12px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .field-num { font-size:12px; font-weight:700; fill:#FFFFFF; }
    </style>
</defs>
<rect width="960" height="760" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 12 · INSTRUMENT</text>
<text x="40" y="64" class="title">Een risico, volledig uitgewerkt</text>
<text x="40" y="94" class="sub">Van asset tot behandelbesluit — elke stap onderbouwd, niet alleen ingevuld.</text>

<circle cx="58" cy="130" r="14" fill="#2563A8"/><text x="58" y="135" text-anchor="middle" class="field-num">1</text>
<rect x="40" y="150" width="880" height="56" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="56" y="172" class="label">ASSET</text>
<text x="56" y="192" class="sub">De koppeling met de werkgeversportalen, waarmee mutatiebestanden worden uitgewisseld</text>

<circle cx="58" cy="230" r="14" fill="#2563A8"/><text x="58" y="235" text-anchor="middle" class="field-num">2</text>
<rect x="40" y="250" width="880" height="56" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="56" y="272" class="label">DREIGING / KWETSBAARHEID</text>
<text x="56" y="292" class="sub">Fout in de autorisatielogica maakt mutatiebestanden van de ene werkgever zichtbaar voor een andere</text>

<circle cx="58" cy="330" r="14" fill="#2563A8"/><text x="58" y="335" text-anchor="middle" class="field-num">3</text>
<rect x="40" y="350" width="880" height="70" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="56" y="372" class="label">KANS: 3 (op 5)</text>
<text x="56" y="392" class="sub">Onderbouwing: complexe, meermaals gewijzigde autorisatielogica; vergelijkbare koppelingen kenden</text>
<text x="56" y="408" class="sub">eerder kleinere afwijkingen — niet incidenteel, wel nog niet structureel misgegaan</text>

<circle cx="58" cy="446" r="14" fill="#2563A8"/><text x="58" y="451" text-anchor="middle" class="field-num">4</text>
<rect x="40" y="466" width="880" height="70" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="56" y="488" class="label">IMPACT: 4 (op 5)</text>
<text x="56" y="508" class="sub">Onderbouwing: mutatiebestanden bevatten soms premievrijstellingsdossiers — bijzondere persoons-</text>
<text x="56" y="524" class="sub">gegevens (gezondheid); blootstelling raakt meerdere werkgevers en deelnemers tegelijk</text>

<circle cx="58" cy="562" r="14" fill="#2563A8"/><text x="58" y="567" text-anchor="middle" class="field-num">5</text>
<rect x="40" y="582" width="880" height="56" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="56" y="604" class="label">RISICO-EIGENAAR</text>
<text x="56" y="624" class="sub">Karin — architectuurkeuzes binnen het Mutatieplatform-programma vallen onder haar mandaat</text>

<circle cx="58" cy="662" r="15" fill="#E9A13B"/>
<path d="M52 662 l4 4 l8 -9" stroke="#14213D" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="682" width="880" height="60" rx="6" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
<text x="56" y="704" class="label" fill="#9A5F0D">BEHANDELBESLUIT — getoetst aan risicobereidheid</text>
<text x="56" y="724" class="sub">Verminderen: aanvullende autorisatietests en verscherpte monitoring op deze specifieke koppeling</text>
</svg>
