<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="'DM Sans', Arial, sans-serif" width="960" height="500" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:13px; font-weight:700; fill:#14213D; }
      .sub { font-size:11px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .num { font-size:14px; font-weight:700; fill:#FBFAF7; }
    </style>
</defs>
<rect width="960" height="500" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 26 · INSTRUMENT</text>
<text x="40" y="64" class="title">De zes auditprincipes (ISO 19011)</text>
<text x="40" y="96" class="sub">De basis waarop elke goede audit rust — intern of extern.</text>

<rect x="60" y="130" width="270" height="150" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<circle cx="92" cy="162" r="15" fill="#2563A8"/><text x="92" y="167" text-anchor="middle" class="num">1</text>
<text x="118" y="167" class="label">Integriteit</text>
<text x="82" y="196" class="sub">eerlijk en zorgvuldig</text>
<text x="82" y="212" class="sub">handelen, ook bij</text>
<text x="82" y="228" class="sub">ongemakkelijke bevindingen</text>

<rect x="345" y="130" width="270" height="150" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<circle cx="377" cy="162" r="15" fill="#2563A8"/><text x="377" y="167" text-anchor="middle" class="num">2</text>
<text x="403" y="167" class="label" font-size="12">Eerlijke presentatie</text>
<text x="367" y="196" class="sub">waarheidsgetrouw</text>
<text x="367" y="212" class="sub">rapporteren, niet afgezwakt</text>
<text x="367" y="228" class="sub">om de relatie te sparen</text>

<rect x="630" y="130" width="270" height="150" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<circle cx="662" cy="162" r="15" fill="#2563A8"/><text x="662" y="167" text-anchor="middle" class="num">3</text>
<text x="688" y="167" class="label" font-size="12">Passende zorgvuldigheid</text>
<text x="652" y="196" class="sub">oordeelsvorming op bewijs,</text>
<text x="652" y="212" class="sub">niet op aannames of</text>
<text x="652" y="228" class="sub">sympathie</text>

<rect x="60" y="300" width="270" height="150" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<circle cx="92" cy="332" r="15" fill="#2563A8"/><text x="92" y="337" text-anchor="middle" class="num">4</text>
<text x="118" y="337" class="label">Vertrouwelijkheid</text>
<text x="82" y="366" class="sub">informatie verkregen</text>
<text x="82" y="382" class="sub">tijdens de audit zorgvuldig</text>
<text x="82" y="398" class="sub">behandelen</text>

<rect x="345" y="300" width="270" height="150" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<circle cx="377" cy="332" r="15" fill="#2563A8"/><text x="377" y="337" text-anchor="middle" class="num">5</text>
<text x="403" y="337" class="label" font-size="12">Onafhankelijkheid</text>
<text x="367" y="366" class="sub">basis voor onpartijdigheid —</text>
<text x="367" y="382" class="sub">dezelfde logica als bij de FG</text>
<text x="367" y="398" class="sub">(deel 4, 23) en interne audit (21)</text>

<rect x="630" y="300" width="270" height="150" rx="8" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
<circle cx="662" cy="332" r="15" fill="#E9A13B"/><text x="662" y="337" text-anchor="middle" class="num" fill="#14213D">6</text>
<text x="688" y="337" class="label" font-size="12" fill="#9A5F0D">Op bewijs gebaseerd</text>
<text x="652" y="366" class="sub">conclusies op verifieerbaar</text>
<text x="652" y="382" class="sub">bewijs, niet op wat</text>
<text x="652" y="398" class="sub">plausibel klinkt</text>

<text x="480" y="480" text-anchor="middle" class="sub" fill="#9A5F0D">principe 6 is de professionele versie van de rode draad die door de hele cursus loopt</text>
</svg>
