<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'DM Sans', Arial, sans-serif" width="960" height="640" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:13px; font-weight:700; fill:#14213D; }
      .sub { font-size:11.5px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .tag { font-size:10px; font-weight:700; fill:#9A5F0D; }
    </style>
</defs>
<rect width="960" height="640" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 3 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">De zeven beginselen van artikel 5</text>
<text x="40" y="96" class="sub">Twee ervan vallen bijna samen met een hoek van het CIA-drietal (deel 1) — de brug tussen de disciplines.</text>

<g>
<rect x="40" y="130" width="880" height="56" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="60" y="152" class="label">1 · Rechtmatigheid, behoorlijkheid, transparantie</text>
<text x="60" y="172" class="sub">grondslag aanwezig, eerlijk tegenover de betrokkene, begrijpelijk</text>
</g>
<g>
<rect x="40" y="192" width="880" height="56" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="60" y="214" class="label">2 · Doelbinding</text>
<text x="60" y="234" class="sub">welbepaald doel, geen onverenigbaar hergebruik — het cross-sell-voorbeeld schendt dit</text>
</g>
<g>
<rect x="40" y="254" width="880" height="56" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="60" y="276" class="label">3 · Minimale gegevensverwerking</text>
<text x="60" y="296" class="sub">niet meer verzamelen dan nodig voor het doel</text>
</g>
<g>
<rect x="40" y="316" width="880" height="56" rx="6" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
<text x="60" y="338" class="label">4 · Juistheid</text>
<text x="60" y="358" class="sub">correct en waar nodig geactualiseerd</text>
<text x="850" y="348" text-anchor="end" class="tag">≈ INTEGRITEIT (CIA)</text>
</g>
<g>
<rect x="40" y="378" width="880" height="56" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="60" y="400" class="label">5 · Opslagbeperking</text>
<text x="60" y="420" class="sub">niet langer bewaren dan nodig — geschonden door de medische gegevens, 20 jaar te lang</text>
</g>
<g>
<rect x="40" y="440" width="880" height="56" rx="6" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
<text x="60" y="462" class="label">6 · Integriteit en vertrouwelijkheid</text>
<text x="60" y="482" class="sub">passende technische en organisatorische maatregelen — de expliciete brug naar beveiliging</text>
<text x="850" y="472" text-anchor="end" class="tag">≈ VERTROUWELIJKHEID (CIA)</text>
</g>
<g>
<rect x="40" y="502" width="880" height="56" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="60" y="524" class="label">7 · Verantwoordingsplicht (accountability)</text>
<text x="60" y="544" class="sub">niet alleen voldoen, ook kunnen aantonen — de AVG-formulering van de rode draad uit deel 1</text>
</g>

<text x="480" y="600" text-anchor="middle" class="sub" fill="#9A5F0D">Een verwerking met een geldige grondslag kan alsnog onrechtmatig zijn als ze een beginsel schendt.</text>
</svg>
