<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'DM Sans', Arial, sans-serif" width="960" height="640" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:13px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:11.5px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#2563A8; stroke-width:1.8; fill:none; marker-end:url(#arrb); }
    </style>
    <marker id="arrb" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
</defs>
<rect width="960" height="640" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 12 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Vier behandelopties, getoetst aan risicobereidheid</text>
<text x="40" y="96" class="sub">"Verminderen" is niet automatisch de juiste keuze — elke optie is legitiem, mits onderbouwd.</text>

<rect x="380" y="120" width="200" height="60" rx="8" fill="#2563A8"/>
<text x="480" y="146" text-anchor="middle" class="label-light">Risico geïdentificeerd,</text>
<text x="480" y="164" text-anchor="middle" class="label-light">eigenaar toegewezen</text>

<path d="M480 180 L480 210" class="arrow" marker-end="none" stroke-dasharray="0"/>
<line x1="480" y1="180" x2="480" y2="205" stroke="#2563A8" stroke-width="1.8"/>
<line x1="140" y1="205" x2="820" y2="205" stroke="#2563A8" stroke-width="1.8"/>
<line x1="140" y1="205" x2="140" y2="230" class="arrow"/>
<line x1="373" y1="205" x2="373" y2="230" class="arrow"/>
<line x1="586" y1="205" x2="586" y2="230" class="arrow"/>
<line x1="820" y1="205" x2="820" y2="230" class="arrow"/>

<rect x="40" y="232" width="200" height="150" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="140" y="258" text-anchor="middle" class="label">Vermijden</text>
<text x="58" y="282" class="sub">activiteit die het risico</text>
<text x="58" y="298" class="sub">veroorzaakt, niet doen</text>
<text x="58" y="322" class="sub" font-style="italic">bv. koppeling met</text>
<text x="58" y="338" class="sub" font-style="italic">externe partij niet</text>
<text x="58" y="354" class="sub" font-style="italic">bouwen</text>

<rect x="273" y="232" width="200" height="150" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="373" y="258" text-anchor="middle" class="label">Verminderen</text>
<text x="291" y="282" class="sub">maatregel die kans of</text>
<text x="291" y="298" class="sub">impact verkleint</text>
<text x="291" y="322" class="sub" font-style="italic">bv. MFA, zonering,</text>
<text x="291" y="338" class="sub" font-style="italic">patchmanagement</text>
<text x="291" y="354" class="sub" font-style="italic">(niveau 1)</text>

<rect x="486" y="232" width="200" height="150" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="586" y="258" text-anchor="middle" class="label">Overdragen</text>
<text x="504" y="282" class="sub">last bij andere partij</text>
<text x="504" y="298" class="sub">beleggen</text>
<text x="504" y="322" class="sub" font-style="italic">let op: AVG-verant-</text>
<text x="504" y="338" class="sub" font-style="italic">woordelijkheid blijft</text>
<text x="504" y="354" class="sub" font-style="italic">bij Meridiaan</text>

<rect x="720" y="232" width="200" height="150" rx="8" fill="#2563A8" stroke="#E9A13B" stroke-width="2.5"/>
<text x="820" y="258" text-anchor="middle" class="label-light">Accepteren</text>
<text x="738" y="282" class="sub-light">bewust laten zoals het is</text>
<text x="738" y="322" class="sub-light" font-style="italic">het formele "onderbouwde</text>
<text x="738" y="338" class="sub-light" font-style="italic">nee, dit niet" — mits</text>
<text x="738" y="354" class="sub-light" font-style="italic">gedocumenteerd</text>

<rect x="140" y="410" width="680" height="90" rx="8" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
<text x="480" y="438" text-anchor="middle" class="label" fill="#9A5F0D">TOETSSTEEN: risicobereidheid, vastgesteld door het bestuur (clausule 5)</text>
<text x="480" y="460" text-anchor="middle" class="sub">Elke optie wordt afgezet tegen de door het bestuur vastgestelde grens —</text>
<text x="480" y="478" text-anchor="middle" class="sub">niet tegen de impliciete maatstaf van de individuele risico-eigenaar</text>

<text x="480" y="540" text-anchor="middle" class="sub">Doel is geen nul risico — dat bestaat niet — maar een bewuste, verantwoorde restrisico-positie.</text>
</svg>
