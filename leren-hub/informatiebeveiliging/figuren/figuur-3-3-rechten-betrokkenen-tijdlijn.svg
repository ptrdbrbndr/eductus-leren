<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 480" font-family="'DM Sans', Arial, sans-serif" width="1040" height="480" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .axis { stroke:#2563A8; stroke-width:2.5; }
      .tick { stroke:#6FA3D6; stroke-width:1.5; }
      .dot { fill:#2563A8; }
      .e-label { font-size:12px; fill:#14213D; text-anchor:middle; font-weight:700; }
      .e-sub { font-size:10.5px; fill:#55606F; text-anchor:middle; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
    </style>
</defs>
<rect width="1040" height="480" class="paper"/>
<text x="40" y="42" class="kicker">DEEL 3 · CONCEPTDIAGRAM</text>
<text x="40" y="72" class="title">De rechten van betrokkenen — van vóór tot ná de verwerking</text>

<line x1="70" y1="240" x2="970" y2="240" class="axis"/>
<text x="70" y="268" font-size="11" fill="#55606F">VOOR</text>
<text x="970" y="268" font-size="11" fill="#55606F" text-anchor="end">NA / LOPEND</text>

<g>
<line x1="120" y1="232" x2="120" y2="248" class="tick"/><circle cx="120" cy="240" r="7" class="dot"/>
<text x="120" y="200" class="e-label">Informatie</text>
<text x="120" y="216" class="e-sub">privacyverklaring</text>

<line x1="255" y1="232" x2="255" y2="248" class="tick"/><circle cx="255" cy="240" r="7" class="dot"/>
<text x="255" y="200" class="e-label">Inzage</text>
<text x="255" y="216" class="e-sub">kopie opvragen</text>

<line x1="390" y1="232" x2="390" y2="248" class="tick"/><circle cx="390" cy="240" r="7" class="dot"/>
<text x="390" y="200" class="e-label">Rectificatie</text>
<text x="390" y="216" class="e-sub">onjuistheid corrigeren</text>

<line x1="525" y1="232" x2="525" y2="248" class="tick"/><circle cx="525" cy="240" r="7" class="dot"/>
<text x="525" y="200" class="e-label">Beperking</text>
<text x="525" y="216" class="e-sub">tijdelijk bevriezen</text>

<line x1="660" y1="232" x2="660" y2="248" class="tick"/><circle cx="660" cy="240" r="7" class="dot"/>
<text x="660" y="200" class="e-label">Bezwaar</text>
<text x="660" y="216" class="e-sub">tegen gerechtvaardigd belang</text>

<line x1="795" y1="232" x2="795" y2="248" class="tick"/><circle cx="795" cy="240" r="7" class="dot"/>
<text x="795" y="200" class="e-label">Overdraagbaarheid</text>
<text x="795" y="216" class="e-sub">gestructureerd formaat</text>

<line x1="930" y1="232" x2="930" y2="248" class="tick" stroke="#E9A13B" stroke-width="2.5"/>
<circle cx="930" cy="240" r="9" fill="#E9A13B"/>
<text x="930" y="200" class="e-label" fill="#9A5F0D">Vergetelheid</text>
<text x="930" y="216" class="e-sub">wissen, met uitzonderingen</text>
</g>

<rect x="180" y="300" width="680" height="130" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="520" y="328" text-anchor="middle" class="e-label">Rechten rond geautomatiseerde besluitvorming</text>
<text x="520" y="352" text-anchor="middle" class="e-sub">niet onderworpen aan een uitsluitend geautomatiseerd besluit met</text>
<text x="520" y="370" text-anchor="middle" class="e-sub">rechtsgevolgen, zonder menselijke tussenkomst — geldt doorlopend,</text>
<text x="520" y="388" text-anchor="middle" class="e-sub">niet gebonden aan één moment op deze tijdlijn</text>

<text x="520" y="460" text-anchor="middle" class="e-sub" fill="#9A5F0D">Recht op verwijdering kent uitzonderingen — Meridiaan bewaart sommige gegevens juist decennialang</text>
</svg>
