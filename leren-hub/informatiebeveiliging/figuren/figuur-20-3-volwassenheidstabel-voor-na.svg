<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="'DM Sans', Arial, sans-serif" width="960" height="480" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .cell { font-size:12px; fill:#14213D; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .th { font-size:11px; font-weight:700; fill:#FBFAF7; }
    </style>
</defs>
<rect width="960" height="480" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 20 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">De volwassenheidstabel — vóór en ná het incident</text>
<text x="40" y="96" class="sub">Vijf onderwerpen, elk apart beoordeeld — geen enkele organisatie staat overal gelijk voor.</text>

<rect x="40" y="120" width="880" height="34" fill="#2563A8"/>
<text x="56" y="141" class="th">ONDERWERP</text>
<text x="470" y="141" class="th">NIVEAU VÓÓR</text>
<text x="700" y="141" class="th">NIVEAU NÁ</text>

<rect x="40" y="154" width="880" height="52" fill="#FFFFFF" stroke="#2563A8" stroke-width="0.75"/>
<text x="56" y="184" class="cell" font-weight="700">Uitzonderingenbeheer (deel 13)</text>
<text x="470" y="184" class="cell">2 — informeel, geen borging</text>
<text x="700" y="184" class="cell" font-weight="700" fill="#2563A8">3 — geautomatiseerde escalatie</text>

<rect x="40" y="206" width="880" height="52" fill="#F4F2EC"/>
<text x="56" y="236" class="cell" font-weight="700">Toegangsbeheer (deel 5)</text>
<text x="470" y="236" class="cell">3</text>
<text x="700" y="236" class="cell">3 — ongewijzigd, al goed geborgd</text>

<rect x="40" y="258" width="880" height="52" fill="#FFFFFF" stroke="#2563A8" stroke-width="0.75"/>
<text x="56" y="288" class="cell" font-weight="700">Incidentproces (deel 19)</text>
<text x="470" y="288" class="cell">2 — nog niet echt getest</text>
<text x="700" y="288" class="cell" font-weight="700" fill="#2563A8">3 — het incident was de test</text>

<rect x="40" y="310" width="880" height="52" fill="#F4F2EC"/>
<text x="56" y="340" class="cell" font-weight="700">Leveranciersbeoordeling (deel 18)</text>
<text x="470" y="340" class="cell">1 — ad hoc, "vast wel goed"</text>
<text x="700" y="340" class="cell">2 — proces opgezet, herhaling ontbreekt</text>

<rect x="40" y="362" width="880" height="52" fill="#FFFFFF" stroke="#2563A8" stroke-width="0.75"/>
<text x="56" y="392" class="cell" font-weight="700">Bewustwording (deel 14)</text>
<text x="470" y="392" class="cell">1 — oude jaarlijkse sessie</text>
<text x="700" y="392" class="cell">2 — herontwerp, werking nog niet bewezen</text>

<rect x="140" y="430" width="680" height="0"/>
<text x="480" y="450" text-anchor="middle" class="sub" fill="#9A5F0D">volwassenheid is geen vast eindpunt — ongelijk, soms met tegenslag, nooit definitief afgerond</text>
</svg>
