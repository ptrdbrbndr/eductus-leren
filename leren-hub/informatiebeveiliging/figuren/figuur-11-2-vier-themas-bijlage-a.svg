<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:15px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .count { font-size:26px; font-weight:700; fill:#2563A8; font-family:'Cormorant Garamond', Georgia, serif;}
    </style>
</defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 11 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Bijlage A: 93 controls in vier thema's</text>
<text x="40" y="96" class="sub">Geen verplichte checklist — welke controls van toepassing zijn, volgt uit de risicobeoordeling (deel 12).</text>

<line x1="80" y1="480" x2="880" y2="480" stroke="#55606F" stroke-width="1"/>

<text x="160" y="200" text-anchor="middle" class="count">37</text>
<rect x="80" y="220" width="160" height="260" rx="4" class="" fill="#2563A8"/>
<text x="160" y="510" text-anchor="middle" class="label">Organisatorisch</text>
<text x="160" y="530" text-anchor="middle" class="sub">beleid, rollen, leveran-</text>
<text x="160" y="546" text-anchor="middle" class="sub">ciers, incidentproces</text>
<text x="160" y="566" text-anchor="middle" class="sub" fill="#9A5F0D">grotendeels deel 13, 18, 19</text>

<text x="380" y="219" text-anchor="middle" class="count">34</text>
<rect x="300" y="241" width="160" height="239" rx="4" fill="#6FA3D6"/>
<text x="380" y="510" text-anchor="middle" class="label">Technologisch</text>
<text x="380" y="530" text-anchor="middle" class="sub">toegang, cryptografie,</text>
<text x="380" y="546" text-anchor="middle" class="sub">netwerk, logging</text>
<text x="380" y="566" text-anchor="middle" class="sub" fill="#9A5F0D">grootste thema — deel 15</text>

<text x="600" y="360" text-anchor="middle" class="count">14</text>
<rect x="520" y="382" width="160" height="98" rx="4" fill="#6FA3D6"/>
<text x="600" y="510" text-anchor="middle" class="label">Fysiek</text>
<text x="600" y="530" text-anchor="middle" class="sub">gebouwtoegang, clear</text>
<text x="600" y="546" text-anchor="middle" class="sub">desk, apparatuur</text>
<text x="600" y="566" text-anchor="middle" class="sub" fill="#9A5F0D">deel 15</text>

<text x="820" y="402" text-anchor="middle" class="count">8</text>
<rect x="740" y="424" width="160" height="56" rx="4" fill="#E9A13B"/>
<text x="820" y="510" text-anchor="middle" class="label">Mensgerelateerd</text>
<text x="820" y="530" text-anchor="middle" class="sub">screening, bewust-</text>
<text x="820" y="546" text-anchor="middle" class="sub">wording, disciplinair</text>
<text x="820" y="566" text-anchor="middle" class="sub" fill="#9A5F0D">kleinste aantal, deel 14</text>

<rect x="140" y="592" width="680" height="0" rx="0" fill="none"/>
</svg>
