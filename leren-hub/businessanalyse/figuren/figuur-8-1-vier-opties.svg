<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="'DM Sans', Arial, sans-serif" width="900" height="460" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#FBFAF7; }
      .baseline { fill:#DFDCD3; stroke:#6FA3D6; stroke-width:1.5; stroke-dasharray:6 4; }
      .opt { fill:#CBDCEF; stroke:#2563A8; stroke-width:1.5; }
      .head { font-size:14px; font-weight:700; fill:#14213D; text-anchor:middle; }
      .head-muted { font-size:14px; font-weight:700; fill:#55606F; text-anchor:middle; }
      .sub { font-size:11px; fill:#55606F; text-anchor:middle; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
    </style>
  </defs>

  <rect width="900" height="460" class="paper"/>
  <text x="40" y="42" class="kicker">DEEL 8 · VERGELIJKINGSBASIS EERST</text>
  <text x="40" y="72" class="title">Vier opties, met "niets doen" als basis</text>

  <g>
    <rect x="40" y="110" width="180" height="240" rx="10" class="baseline"/>
    <text x="130" y="140" class="head-muted">Niets doen</text>
    <text x="130" y="160" class="sub">vergelijkingsbasis</text>
    <text x="130" y="200" class="sub">(altijd meegenomen,</text>
    <text x="130" y="216" class="sub">zelden gekozen)</text>
  </g>
  <g>
    <rect x="240" y="110" width="180" height="240" rx="10" class="opt"/>
    <text x="330" y="140" class="head">Optie 1</text>
  </g>
  <g>
    <rect x="440" y="110" width="180" height="240" rx="10" class="opt"/>
    <text x="530" y="140" class="head">Optie 2</text>
  </g>
  <g>
    <rect x="640" y="110" width="180" height="240" rx="10" class="opt"/>
    <text x="730" y="140" class="head">Optie 3</text>
  </g>

  <text x="450" y="400" text-anchor="middle" font-size="12" fill="#6FA3D6">Elke optie wordt getoetst tegen wat "niets doen" al oplevert — niet tegen een ideaalbeeld</text>
</svg>
