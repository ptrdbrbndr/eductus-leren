<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#FBFAF7; }
      .field { fill:#FFFFFF; stroke:#2563A8; stroke-width:1.3; }
      .head { fill:#CBDCEF; }
      .label { font-size:12.5px; font-weight:700; fill:#14213D; }
      .sub { font-size:10.5px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:26px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    </style>
  </defs>

  <rect width="960" height="620" class="paper"/>
  <text x="40" y="34" class="kicker">DEEL 8 · INSTRUMENT</text>
  <text x="40" y="64" class="title">Het optieblad</text>

  <rect x="40" y="106" width="880" height="46" rx="6" class="field"/>
  <text x="56" y="134" class="label">DE BEHOEFTE WAAR DIT OPTIEBLAD OP REAGEERT — één zin, uit het behoefteblad van deel 6</text>

  <!-- matrix: rijen niets doen/opt1/opt2/opt3, kolommen 4 dimensies -->
  <rect x="40" y="168" width="880" height="34" class="head"/>
  <text x="150" y="191" class="label" text-anchor="middle">OPTIE</text>
  <text x="360" y="191" class="label" text-anchor="middle">TECHNISCH</text>
  <text x="510" y="191" class="label" text-anchor="middle">OPERATIONEEL</text>
  <text x="670" y="191" class="label" text-anchor="middle">FINANCIEEL</text>
  <text x="820" y="191" class="label" text-anchor="middle">TIJDGEBONDEN</text>

  <g>
    <rect x="40" y="202" width="880" height="42" class="field"/>
    <text x="56" y="228" class="sub">Niets doen</text>
  </g>
  <g>
    <rect x="40" y="244" width="880" height="42" class="field"/>
    <text x="56" y="270" class="sub">Optie 1</text>
  </g>
  <g>
    <rect x="40" y="286" width="880" height="42" class="field"/>
    <text x="56" y="312" class="sub">Optie 2</text>
  </g>
  <g>
    <rect x="40" y="328" width="880" height="42" class="field"/>
    <text x="56" y="354" class="sub">Optie 3</text>
  </g>

  <rect x="40" y="386" width="880" height="60" rx="6" class="field"/>
  <text x="56" y="410" class="label">AANBEVELING</text>
  <text x="56" y="430" class="sub">welke optie, en waarom — verwijzend naar de haalbaarheidsdimensies</text>

  <!-- afsluitend -->
  <g>
    <circle cx="58" cy="480" r="15" fill="#E9A13B"/>
    <path d="M52 480 l4 4 l8 -9" stroke="#14213D" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="40" y="502" width="880" height="60" rx="6" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
    <text x="56" y="528" class="label" fill="#9A5F0D">DE AFGEVALLEN OPTIE DIE HET MEEST OVERTUIGEND KLONK</text>
    <text x="56" y="548" class="sub">en waarom die het toch niet werd</text>
  </g>
</svg>
