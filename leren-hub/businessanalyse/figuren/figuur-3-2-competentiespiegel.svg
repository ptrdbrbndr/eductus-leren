<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 760" font-family="'DM Sans', Arial, sans-serif" width="960" height="760" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#FBFAF7; }
      .field { fill:#FFFFFF; stroke:#2563A8; stroke-width:1.3; }
      .label { font-size:12.5px; font-weight:700; fill:#14213D; }
      .sub { font-size:10.5px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:26px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    </style>
  </defs>

  <rect width="960" height="760" class="paper"/>
  <text x="40" y="34" class="kicker">DEEL 3 · INSTRUMENT</text>
  <text x="40" y="64" class="title">De competentiespiegel</text>

  <!-- 6 categorieën, elk met 2 mini-velden -->
  <g id="rows">
    <!-- gegenereerd stramien, 6 rijen -->
  </g>

  <!-- rij 1 -->
  <rect x="40" y="106" width="880" height="86" rx="6" class="field"/>
  <text x="56" y="128" class="label">ANALYTISCH EN PROBLEEMOPLOSSEND VERMOGEN</text>
  <text x="56" y="148" class="sub">Een moment waarop dit sterk aanwezig was —</text>
  <text x="56" y="164" class="sub">Een moment waarop dit ontbrak, en jij het opmerkte —</text>

  <!-- rij 2 -->
  <rect x="40" y="200" width="880" height="86" rx="6" class="field"/>
  <text x="56" y="222" class="label">GEDRAGSKENMERKEN</text>
  <text x="56" y="242" class="sub">Een moment waarop dit sterk aanwezig was —</text>
  <text x="56" y="258" class="sub">Een moment waarop dit ontbrak, en jij het opmerkte —</text>

  <!-- rij 3 -->
  <rect x="40" y="294" width="880" height="86" rx="6" class="field"/>
  <text x="56" y="316" class="label">VAKKENNIS</text>
  <text x="56" y="336" class="sub">Een moment waarop dit sterk aanwezig was —</text>
  <text x="56" y="352" class="sub">Een moment waarop dit ontbrak, en jij het opmerkte —</text>

  <!-- rij 4 -->
  <rect x="40" y="388" width="880" height="86" rx="6" class="field"/>
  <text x="56" y="410" class="label">COMMUNICATIEVE VAARDIGHEDEN</text>
  <text x="56" y="430" class="sub">Een moment waarop dit sterk aanwezig was —</text>
  <text x="56" y="446" class="sub">Een moment waarop dit ontbrak, en jij het opmerkte —</text>

  <!-- rij 5 -->
  <rect x="40" y="482" width="880" height="86" rx="6" class="field"/>
  <text x="56" y="504" class="label">INTERACTIEVAARDIGHEDEN</text>
  <text x="56" y="524" class="sub">Een moment waarop dit sterk aanwezig was —</text>
  <text x="56" y="540" class="sub">Een moment waarop dit ontbrak, en jij het opmerkte —</text>

  <!-- rij 6 -->
  <rect x="40" y="576" width="880" height="86" rx="6" class="field"/>
  <text x="56" y="598" class="label">HULPMIDDELEN EN TECHNOLOGIE</text>
  <text x="56" y="618" class="sub">Een moment waarop dit sterk aanwezig was —</text>
  <text x="56" y="634" class="sub">Een moment waarop dit ontbrak, en jij het opmerkte —</text>

  <!-- afsluitend, verbindend veld -->
  <g>
    <circle cx="58" cy="686" r="15" fill="#E9A13B"/>
    <path d="M52 686 l4 4 l8 -9" stroke="#14213D" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="40" y="708" width="880" height="42" rx="6" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
    <text x="56" y="734" class="label" fill="#9A5F0D">DE ONGESTELDE VRAAG — welke vraag stelde je niet, en wat hield je tegen?</text>
  </g>
</svg>
