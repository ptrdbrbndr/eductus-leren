<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'DM Sans', Arial, sans-serif" width="960" height="560" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#FBFAF7; }
      .field { fill:#FFFFFF; stroke:#2563A8; stroke-width:1.3; }
      .head { fill:#CBDCEF; }
      .label { font-size:12px; font-weight:700; fill:#14213D; }
      .sub { font-size:10.5px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:26px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.1em; }
    </style>
  </defs>

  <rect width="960" height="560" class="paper"/>
  <text x="40" y="34" class="kicker">DEEL 25 · INSTRUMENT</text>
  <text x="40" y="64" class="title">De requirementslandkaart</text>

  <rect x="40" y="106" width="880" height="36" class="head"/>
  <text x="56" y="129" class="label">REQUIREMENT</text>
  <text x="380" y="129" class="label">CLUSTER</text>
  <text x="560" y="129" class="label">GEDEELD MET</text>
  <text x="760" y="129" class="label">PARAMETER (indien van toepassing)</text>

  <rect x="40" y="142" width="880" height="48" class="field"/>
  <text x="380" y="170" class="sub">generiek</text>
  <rect x="40" y="190" width="880" height="48" class="field"/>
  <text x="380" y="218" class="sub">fonds-specifiek</text>
  <rect x="40" y="238" width="880" height="48" class="field"/>
  <text x="380" y="266" class="sub">generiek-met-parameter</text>

  <!-- afsluitend -->
  <g>
    <circle cx="58" cy="322" r="15" fill="#E9A13B"/>
    <path d="M52 322 l4 4 l8 -9" stroke="#14213D" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="40" y="344" width="880" height="80" rx="6" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
    <text x="56" y="370" class="label" fill="#9A5F0D">DE DUBBELE CHECK — afsluitend veld</text>
    <text x="56" y="390" class="sub">is dit echt generiek, of lijkt het generiek omdat er nog maar één fonds</text>
    <text x="56" y="406" class="sub">is getoetst? en andersom: is dit echt fonds-specifiek, of toevallig zo geformuleerd?</text>
  </g>
</svg>
