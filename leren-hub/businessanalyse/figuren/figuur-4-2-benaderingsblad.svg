<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="'DM Sans', Arial, sans-serif" width="960" height="700" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#FBFAF7; }
      .field { fill:#FFFFFF; stroke:#2563A8; stroke-width:1.5; }
      .label { font-size:13.5px; font-weight:700; fill:#14213D; }
      .sub { font-size:11.5px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:26px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .part { font-size:11px; fill:#2563A8; font-weight:700; letter-spacing:.08em; }
    </style>
  </defs>

  <rect width="960" height="700" class="paper"/>
  <text x="40" y="34" class="kicker">DEEL 4 · INSTRUMENT</text>
  <text x="40" y="64" class="title">Het benaderingsblad</text>

  <!-- deel A -->
  <text x="40" y="120" class="part">DEEL A — DE AANPAK KIEZEN</text>
  <rect x="40" y="130" width="880" height="120" rx="6" class="field"/>
  <text x="56" y="154" class="label">Score de vijf situationele factoren</text>
  <text x="56" y="176" class="sub">bekendheid behoefte · stabiliteit context · kosten bijsturen ·</text>
  <text x="56" y="194" class="sub">beschikbaarheid belanghebbenden · gebruikelijk in de organisatie</text>
  <text x="56" y="216" class="sub">→ gemotiveerde positie op de schaal voorspellend ↔ adaptief</text>
  <text x="56" y="236" class="sub">(niet noodzakelijk een van de twee uitersten)</text>

  <!-- afsluitend veld, tussen A en B -->
  <g>
    <circle cx="58" cy="288" r="15" fill="#E9A13B"/>
    <path d="M52 288 l4 4 l8 -9" stroke="#14213D" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="40" y="310" width="880" height="60" rx="6" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
    <text x="56" y="334" class="label" fill="#9A5F0D">Welke factor is nooit expliciet afgewogen — gewoon verondersteld?</text>
    <text x="56" y="354" class="sub">het veld dat het verschil maakt, tussen deel A en deel B</text>
  </g>

  <!-- deel B -->
  <text x="40" y="410" class="part">DEEL B — DE LAAGTOETS</text>
  <rect x="40" y="420" width="880" height="230" rx="6" class="field"/>
  <text x="56" y="444" class="label">Per voorgestelde eis: blijft dit waar als de oplossing morgen verandert?</text>

  <!-- mini tabel requirement/ontwerp -->
  <line x1="480" y1="460" x2="480" y2="632" stroke="#CBDCEF" stroke-width="1.5"/>
  <text x="260" y="480" class="label" text-anchor="middle" fill="#2563A8">REQUIREMENT</text>
  <text x="700" y="480" class="label" text-anchor="middle" fill="#55606F">ONTWERP</text>
  <text x="260" y="504" class="sub" text-anchor="middle">blijft waar, ongeacht de oplossing</text>
  <text x="700" y="504" class="sub" text-anchor="middle">specifiek voor deze oplossing</text>
  <line x1="60" y1="540" x2="900" y2="540" stroke="#DFDCD3" stroke-width="1"/>
  <line x1="60" y1="576" x2="900" y2="576" stroke="#DFDCD3" stroke-width="1"/>
  <line x1="60" y1="612" x2="900" y2="612" stroke="#DFDCD3" stroke-width="1"/>
  <text x="56" y="644" class="sub" font-style="italic">voorlopig ontwerp mag apart genoteerd — niet vermengd met wat werkelijk nodig is</text>
</svg>
