<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="'DM Sans', Arial, sans-serif" width="960" height="500" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#FBFAF7; }
      .field { fill:#FFFFFF; stroke:#2563A8; stroke-width:1.4; }
      .label { font-size:13px; font-weight:700; fill:#14213D; }
      .sub { font-size:11px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:26px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.1em; }
    </style>
  </defs>

  <rect width="960" height="500" class="paper"/>
  <text x="40" y="34" class="kicker">DEEL 16 · INSTRUMENT</text>
  <text x="40" y="64" class="title">De traceerlijn</text>

  <rect x="40" y="112" width="420" height="140" rx="6" class="field"/>
  <text x="56" y="136" class="label">ACHTERWAARTS</text>
  <text x="56" y="160" class="sub">Behoefte —</text>
  <text x="56" y="180" class="sub">Belanghebbende —</text>
  <text x="56" y="200" class="sub">Besluit (indien van toepassing) —</text>

  <rect x="500" y="112" width="420" height="140" rx="6" class="field"/>
  <text x="516" y="136" class="label">VOORWAARTS</text>
  <text x="516" y="160" class="sub">Ontwerpelement —</text>
  <text x="516" y="180" class="sub">Testcase —</text>
  <text x="516" y="200" class="sub">Uitkomstmaatstaf —</text>

  <!-- afsluitend -->
  <g>
    <circle cx="58" cy="280" r="15" fill="#E9A13B"/>
    <path d="M52 280 l4 4 l8 -9" stroke="#14213D" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="40" y="302" width="880" height="80" rx="6" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
    <text x="56" y="328" class="label" fill="#9A5F0D">DE "WIE ZOU HET MERKEN"-TOETS — afsluitend veld</text>
    <text x="56" y="348" class="sub">als dit requirement wijzigt, wie in de achterwaartse én voorwaartse keten</text>
    <text x="56" y="364" class="sub">zou dat als eerste moeten weten — en gebeurt dat ook automatisch?</text>
  </g>
</svg>
