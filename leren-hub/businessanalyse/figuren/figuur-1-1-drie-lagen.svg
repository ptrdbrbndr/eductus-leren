<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="'DM Sans', Arial, sans-serif" width="900" height="560" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#FBFAF7; }
      .band1 { fill:#6FA3D6; }
      .band2 { fill:#3F7AB8; }
      .band3 { fill:#2563A8; }
      .band-text { font-size:17px; font-weight:700; fill:#14213D; text-anchor:middle; }
      .band-text-light { font-size:17px; font-weight:700; fill:#FBFAF7; text-anchor:middle; }
      .q { font-size:13px; fill:#55606F; text-anchor:middle; font-style:italic; }
      .q-onblue { font-size:14px; font-weight:600; fill:#FFFFFF; text-anchor:middle; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/>
    </marker>
  </defs>

  <rect width="900" height="560" class="paper"/>
  <text x="40" y="42" class="kicker">DEEL 1 · ONDER DE GEVRAAGDE OPLOSSING</text>
  <text x="40" y="72" class="title">Van oplossing naar onderliggend probleem</text>

  <!-- laag 1: gevraagde oplossing -->
  <rect x="120" y="110" width="660" height="90" rx="8" class="band1"/>
  <text x="450" y="148" class="band-text">Laag 1 — de gevraagde oplossing</text>
  <text x="450" y="172" class="q" fill="#14213D">"vervang het werkgeversportaal"</text>

  <path d="M450 200 L450 240" class="arrow"/>
  <text x="620" y="225" class="q">"Wat gebeurt er nu dat we niet willen?"</text>

  <!-- laag 2: zichtbaar probleem -->
  <rect x="160" y="250" width="580" height="90" rx="8" class="band2"/>
  <text x="450" y="288" class="band-text-light">Laag 2 — het zichtbare probleem</text>
  <text x="450" y="312" class="q-onblue">werkgevers bellen en mailen in plaats van het portaal te gebruiken</text>

  <path d="M450 340 L450 380" class="arrow"/>
  <text x="620" y="365" class="q">"Wie heeft daar last van, en hoe vaak?"</text>

  <!-- laag 3: onderliggende behoefte, amber-omrand -->
  <rect x="200" y="390" width="500" height="100" rx="8" class="band3" stroke="#E9A13B" stroke-width="3"/>
  <text x="450" y="428" class="band-text-light">Laag 3 — de onderliggende behoefte</text>
  <text x="450" y="452" class="q-onblue">kleine werkgevers kunnen 's avonds, buiten kantoortijd, zelf</text>
  <text x="450" y="470" class="q-onblue">hun correcties niet afhandelen</text>

  <text x="450" y="530" class="q" fill="#9A5F0D">"Wat zou er anders zijn als dit was opgelost?" — de vraag die het diepst gaat</text>
</svg>
