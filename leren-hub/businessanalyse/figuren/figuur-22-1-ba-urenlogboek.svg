<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="'DM Sans', Arial, sans-serif" width="960" height="600" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#FBFAF7; }
      .field { fill:#FFFFFF; stroke:#2563A8; stroke-width:1.3; }
      .head { fill:#CBDCEF; }
      .label { font-size:12px; font-weight:700; fill:#14213D; }
      .sub { font-size:10.5px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:26px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.1em; }
      .bar { fill:#6FA3D6; }
      .bar-low { fill:#F5D9A8; }
    </style>
  </defs>

  <rect width="960" height="600" class="paper"/>
  <text x="40" y="34" class="kicker">DEEL 22 · INSTRUMENT</text>
  <text x="40" y="64" class="title">Het BA-urenlogboek</text>

  <rect x="40" y="106" width="880" height="34" class="head"/>
  <text x="56" y="129" class="label">KENNISGEBIED</text>
  <text x="640" y="129" class="label">UREN, OPGEBOUWD</text>

  <!-- 6 kennisgebieden als staafjes, ongelijk (realistische scheve verdeling) -->
  <g>
    <rect x="40" y="146" width="880" height="40" class="field"/>
    <text x="56" y="171" class="sub">Business Analysis Planning &amp; Monitoring</text>
    <rect x="640" y="152" width="180" height="18" class="bar"/>
  </g>
  <g>
    <rect x="40" y="190" width="880" height="40" class="field"/>
    <text x="56" y="215" class="sub">Elicitation &amp; Collaboration</text>
    <rect x="640" y="196" width="260" height="18" class="bar"/>
  </g>
  <g>
    <rect x="40" y="234" width="880" height="40" class="field"/>
    <text x="56" y="259" class="sub">Requirements Life Cycle Management</text>
    <rect x="640" y="240" width="220" height="18" class="bar"/>
  </g>
  <g>
    <rect x="40" y="278" width="880" height="40" class="field"/>
    <text x="56" y="303" class="sub">Requirements Analysis &amp; Design Definition</text>
    <rect x="640" y="284" width="270" height="18" class="bar"/>
  </g>
  <g>
    <rect x="40" y="322" width="880" height="40" class="field"/>
    <text x="56" y="347" class="sub">Strategy Analysis</text>
    <rect x="640" y="328" width="60" height="18" class="bar-low"/>
  </g>
  <g>
    <rect x="40" y="366" width="880" height="40" class="field"/>
    <text x="56" y="391" class="sub">Solution Evaluation</text>
    <rect x="640" y="372" width="40" height="18" class="bar-low"/>
  </g>

  <!-- afsluitend, vooruitkijkend -->
  <g>
    <circle cx="58" cy="440" r="15" fill="#E9A13B"/>
    <path d="M52 440 l4 4 l8 -9" stroke="#14213D" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="40" y="462" width="880" height="80" rx="6" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
    <text x="56" y="488" class="label" fill="#9A5F0D">HET GATVELD — vooruitkijkend, afsluitend onderdeel</text>
    <text x="56" y="508" class="sub">welk kennisgebied heeft de minste uren — en welk soort werk zou dat gat</text>
    <text x="56" y="524" class="sub">het snelst vullen?</text>
  </g>
</svg>
