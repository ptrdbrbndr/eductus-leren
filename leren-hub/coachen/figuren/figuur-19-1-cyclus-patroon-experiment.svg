<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 820" font-family="'DM Sans', Arial, sans-serif" width="900" height="820" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#FBFAF7; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
      .lbl-light { font-size:16px; font-weight:700; fill:#FBFAF7; text-anchor:middle; }
      .sub-light { font-size:11.5px; fill:#EAF0F8; text-anchor:middle; }
      .num-light { font-size:13px; font-weight:700; fill:#FBFAF7; text-anchor:middle; }
      .center-lbl { font-family:'Cormorant Garamond', Georgia, serif; font-size:23px; font-weight:700; fill:#FBFAF7; text-anchor:middle; }
      .center-sub { font-size:11.5px; fill:#EAF0F8; text-anchor:middle; }
      .arrow { stroke:#55606F; stroke-width:2; fill:none; marker-end:url(#arr3); }
      .sub { font-size:13px; fill:#55606F; text-anchor:middle; font-style:italic; }
    </style>
    <marker id="arr3" markerWidth="9" markerHeight="9" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/>
    </marker>
  </defs>

  <rect width="900" height="820" class="paper"/>
  <text x="40" y="42" class="kicker">DEEL 19 · PATRONEN EN BELEMMERENDE OVERTUIGINGEN</text>
  <text x="40" y="72" class="title">De cyclus van een patroonexperiment</text>

  <!-- cyclic connecting arcs between 5 nodes around a circle, centered at 450,455, radius ~230 -->
  <!-- node angles: 1:-90(top) herkennen, 2:-18 toetsen, 3:54 experiment, 4:126 observeren, 5:198 herzien -->
  <path d="M545,150 A230,230 0 0,1 655,340" class="arrow"/>
  <path d="M660,470 A230,230 0 0,1 590,610" class="arrow"/>
  <path d="M440,655 A230,230 0 0,1 280,610" class="arrow"/>
  <path d="M225,480 A230,230 0 0,1 265,330" class="arrow"/>
  <path d="M330,175 A230,230 0 0,1 470,148" class="arrow"/>

  <!-- 1 Herkennen: top -->
  <rect x="330" y="90" width="220" height="90" rx="14" fill="#14213D"/>
  <text x="440" y="122" class="num-light">1</text>
  <text x="440" y="146" class="lbl-light">Herkennen</text>
  <text x="440" y="166" class="sub-light">herhaling over situaties heen</text>

  <!-- 2 Toetsen: upper right -->
  <rect x="600" y="300" width="220" height="90" rx="14" fill="#2563A8"/>
  <text x="710" y="332" class="num-light">2</text>
  <text x="710" y="356" class="lbl-light">Toetsen</text>
  <text x="710" y="376" class="sub-light">is het patroon (nog) waar?</text>

  <!-- 3 Experiment: lower right -->
  <rect x="530" y="570" width="220" height="90" rx="14" fill="#3F7AB8"/>
  <text x="640" y="602" class="num-light">3</text>
  <text x="640" y="626" class="lbl-light">Experimenteren</text>
  <text x="640" y="646" class="sub-light">klein, concreet, ander gedrag</text>

  <!-- 4 Observeren: lower left -->
  <rect x="150" y="570" width="220" height="90" rx="14" fill="#6FA3D6"/>
  <text x="260" y="602" class="num-light" fill="#14213D">4</text>
  <text x="260" y="626" class="lbl-light" fill="#14213D">Observeren</text>
  <text x="260" y="646" class="sub-light" fill="#22303F">wat gebeurde er, met wie</text>

  <!-- 5 Herzien: upper left -->
  <rect x="80" y="300" width="220" height="90" rx="14" fill="#E9A13B"/>
  <text x="190" y="332" class="num-light" fill="#14213D">5</text>
  <text x="190" y="356" class="lbl-light" fill="#14213D">Herzien</text>
  <text x="190" y="376" class="sub-light" fill="#3A3229">vasthouden, aanpassen, loslaten</text>

  <!-- center -->
  <circle cx="450" cy="455" r="95" fill="#8A3324"/>
  <text x="450" y="446" class="center-lbl">Het patroon</text>
  <text x="450" y="470" class="center-sub">een terugkerende, belemmerende</text>
  <text x="450" y="486" class="center-sub">manier van denken, voelen of reageren</text>

  <text x="450" y="760" class="sub">Niet lineair-eenmalig: na "herzien" begint de cyclus opnieuw bij een volgend, scherper geobserveerd patroon.</text>
  <text x="450" y="790" class="sub">Bij Marit: vier eerdere invalshoeken (§19.5) komen hier samen in één herkenbaar patroon.</text>
</svg>
