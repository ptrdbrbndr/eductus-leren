<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 780" font-family="'DM Sans', Arial, sans-serif" width="900" height="780" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#FBFAF7; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
      .lbl-light { font-size:17px; font-weight:700; fill:#FBFAF7; text-anchor:middle; }
      .sub-light { font-size:12px; fill:#EAF0F8; text-anchor:middle; }
      .center-lbl { font-family:'Cormorant Garamond', Georgia, serif; font-size:26px; font-weight:700; fill:#FBFAF7; text-anchor:middle; }
      .center-sub { font-size:11.5px; fill:#EAF0F8; text-anchor:middle; }
      .arrow { stroke:#55606F; stroke-width:2; fill:none; marker-end:url(#arr); }
      .sub { font-size:13px; fill:#55606F; text-anchor:middle; font-style:italic; }
    </style>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/>
    </marker>
  </defs>

  <rect width="900" height="780" class="paper"/>
  <text x="40" y="42" class="kicker">DEEL 6 · DOEL EN FOCUS</text>
  <text x="40" y="72" class="title">GROW — hulpstructuur, geen script</text>

  <!-- cyclic arrows around the center -->
  <path d="M524,271 A175,175 0 0,1 609,356" class="arrow"/>
  <path d="M609,504 A175,175 0 0,1 524,589" class="arrow"/>
  <path d="M376,589 A175,175 0 0,1 291,504" class="arrow"/>
  <path d="M291,356 A175,175 0 0,1 376,271" class="arrow"/>

  <!-- Goal: top -->
  <rect x="350" y="125" width="200" height="90" rx="14" fill="#2563A8"/>
  <text x="450" y="160" class="lbl-light">G — Goal</text>
  <text x="450" y="181" class="sub-light">"wat wil je bereiken,</text>
  <text x="450" y="196" class="sub-light">in deze sessie of dit traject?"</text>

  <!-- Reality: right -->
  <rect x="610" y="385" width="200" height="90" rx="14" fill="#3F7AB8"/>
  <text x="710" y="420" class="lbl-light">R — Reality</text>
  <text x="710" y="441" class="sub-light">"wat is de huidige situatie,</text>
  <text x="710" y="456" class="sub-light">feitelijk en zonder oordeel?"</text>

  <!-- Options: bottom -->
  <rect x="350" y="645" width="200" height="90" rx="14" fill="#6FA3D6"/>
  <text x="450" y="680" class="lbl-light">O — Options</text>
  <text x="450" y="701" class="sub-light">"welke mogelijkheden zijn er,</text>
  <text x="450" y="716" class="sub-light">nog zonder te beoordelen?"</text>

  <!-- Will: left -->
  <rect x="90" y="385" width="200" height="90" rx="14" fill="#E9A13B"/>
  <text x="190" y="420" class="lbl-light" fill="#14213D">W — Will</text>
  <text x="190" y="441" class="sub-light" fill="#3A3229">"welke stap kies je —</text>
  <text x="190" y="456" class="sub-light" fill="#3A3229">wat ga je concreet doen?"</text>

  <!-- center -->
  <circle cx="450" cy="430" r="85" fill="#14213D"/>
  <text x="450" y="422" class="center-lbl">GROW</text>
  <text x="450" y="444" class="center-sub">hulpstructuur voor de coach —</text>
  <text x="450" y="460" class="center-sub">geen dwingend script</text>

  <text x="450" y="762" class="sub">In de praktijk vaak niet lineair — coachees springen tussen Reality en Options, en dat is normaal (§6.5)</text>
</svg>
