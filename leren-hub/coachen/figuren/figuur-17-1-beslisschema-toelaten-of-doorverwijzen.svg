<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="'DM Sans', Arial, sans-serif" width="900" height="700" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#FBFAF7; }
      .box { fill:#FFFFFF; stroke:#2563A8; stroke-width:1.5; }
      .box-end { fill:#3F7AB8; }
      .box-warn { fill:#FFFFFF; stroke:#E9A13B; stroke-width:3; }
      .box-route { fill:#8A3324; }
      .lbl { font-size:14.5px; font-weight:700; fill:#14213D; text-anchor:middle; }
      .lbl-light { font-size:14.5px; font-weight:700; fill:#FBFAF7; text-anchor:middle; }
      .sub { font-size:12px; fill:#55606F; text-anchor:middle; }
      .sub-light { font-size:12px; fill:#EAF0F8; text-anchor:middle; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
      .arrow { stroke:#55606F; stroke-width:1.6; fill:none; marker-end:url(#arr); }
      .yn { font-size:12.5px; font-weight:700; fill:#3F7AB8; }
      .yn-warn { font-size:12.5px; font-weight:700; fill:#9A5F0D; }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/>
    </marker>
  </defs>

  <rect width="900" height="700" class="paper"/>
  <text x="40" y="42" class="kicker">DEEL 17 · WERKEN MET EMOTIES</text>
  <text x="40" y="72" class="title">Toelaten en reguleren — of een signaal voor doorverwijzing?</text>

  <!-- start box -->
  <rect x="300" y="100" width="300" height="66" rx="10" class="box"/>
  <text x="450" y="128" class="lbl">Emotie wordt zichtbaar</text>
  <text x="450" y="148" class="lbl">in de sessie</text>

  <path d="M450 166 L450 200" class="arrow"/>

  <!-- toets box -->
  <rect x="255" y="205" width="390" height="86" rx="10" class="box"/>
  <text x="450" y="232" class="lbl">Reageert de emotie op vertragen,</text>
  <text x="450" y="252" class="lbl">benoemen of terug-naar-het-lichaam?</text>
  <text x="450" y="272" class="sub">(§17.3 — de drie regulerende technieken)</text>

  <!-- ja: links naar toelaten/reguleren -->
  <path d="M255 248 L110 248 L110 340" class="arrow"/>
  <text x="150" y="240" class="yn">ja, werkbaar ↓</text>
  <rect x="20" y="340" width="220" height="80" rx="10" class="box-end"/>
  <text x="130" y="370" class="lbl-light">Toelaten en reguleren —</text>
  <text x="130" y="392" class="lbl-light">ga verder als coach</text>
  <text x="130" y="440" class="sub">terug naar de sessie, met</text>
  <text x="130" y="456" class="sub">aandacht voor het gevoel (§17.2-17.3)</text>

  <!-- nee: rechtdoor naar signalen -->
  <path d="M450 291 L450 325" class="arrow"/>
  <text x="472" y="313" class="yn-warn">nee, of twijfel ↓</text>

  <!-- signalenbox warn -->
  <rect x="255" y="330" width="390" height="118" rx="10" class="box-warn"/>
  <text x="450" y="358" class="lbl" fill="#9A5F0D">Signalen voor de therapiegrens (§17.4)</text>
  <text x="450" y="382" class="sub" fill="#3A3229">disproportioneel t.o.v. de aanleiding, herhaaldelijk</text>
  <text x="450" y="400" class="sub" fill="#3A3229">materiaal dat wijst op trauma of onbesproken</text>
  <text x="450" y="418" class="sub" fill="#3A3229">problematiek, of herhaaldelijk niet te reguleren</text>
  <text x="450" y="436" class="sub" fill="#3A3229">binnen de sessie, ook niet met §17.3</text>

  <path d="M450 448 L450 480" class="arrow"/>

  <!-- doorverwijsroute -->
  <rect x="300" y="486" width="300" height="90" rx="12" class="box-route"/>
  <text x="450" y="518" class="lbl-light" font-size="15">Doorverwijsprocedure</text>
  <text x="450" y="540" class="sub-light">deel 9, met de twee kernzinnen —</text>
  <text x="450" y="556" class="sub-light">niet doorvragen op de inhoud zelf</text>

  <text x="450" y="620" class="sub" font-style="italic">Geen falen van de sessie: hetzelfde onderscheidingsvermogen als deel 1 en deel 9,</text>
  <text x="450" y="640" class="sub" font-style="italic">nu specifiek toegepast op emotie.</text>
  <text x="450" y="672" class="sub" fill="#9A5F0D">Bij twijfel: een te voorzichtige doorverwijzing is een kleinere fout dan een gemiste (§17, docentenhandleiding).</text>
</svg>
