<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="'DM Sans', Arial, sans-serif" width="900" height="520" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#FBFAF7; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
      .tick { font-size:14px; font-weight:700; fill:#14213D; text-anchor:middle; }
      .lbl-light { font-size:14px; font-weight:700; fill:#FBFAF7; text-anchor:middle; }
      .box { fill:#FFFFFF; }
      .footsub { font-size:12.5px; fill:#55606F; text-anchor:middle; font-style:italic; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/>
    </marker>
    <linearGradient id="scale" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8A3324"/>
      <stop offset="45%" stop-color="#E9A13B"/>
      <stop offset="100%" stop-color="#14213D"/>
    </linearGradient>
  </defs>

  <rect width="900" height="520" class="paper"/>
  <text x="40" y="42" class="kicker">DEEL 13 · OPLOSSINGSGERICHT COACHEN</text>
  <text x="40" y="72" class="title">De schaalvraag — 0 tot 10</text>

  <rect x="80" y="180" width="740" height="34" rx="17" fill="url(#scale)"/>
  <!-- ticks 0-10 -->
  <g>
    <circle cx="80" cy="197" r="4" fill="#FBFAF7"/><text x="80" y="240" class="tick">0</text>
    <circle cx="154" cy="197" r="4" fill="#FBFAF7"/><text x="154" y="240" class="tick">1</text>
    <circle cx="228" cy="197" r="4" fill="#FBFAF7"/><text x="228" y="240" class="tick">2</text>
    <circle cx="302" cy="197" r="4" fill="#FBFAF7"/><text x="302" y="240" class="tick">3</text>
    <circle cx="376" cy="197" r="9" fill="#14213D" stroke="#FBFAF7" stroke-width="2"/><text x="376" y="240" class="tick">4</text>
    <circle cx="450" cy="197" r="4" fill="#FBFAF7"/><text x="450" y="240" class="tick">5</text>
    <circle cx="524" cy="197" r="4" fill="#FBFAF7"/><text x="524" y="240" class="tick">6</text>
    <circle cx="598" cy="197" r="4" fill="#FBFAF7"/><text x="598" y="240" class="tick">7</text>
    <circle cx="672" cy="197" r="4" fill="#FBFAF7"/><text x="672" y="240" class="tick">8</text>
    <circle cx="746" cy="197" r="4" fill="#FBFAF7"/><text x="746" y="240" class="tick">9</text>
    <circle cx="820" cy="197" r="4" fill="#FBFAF7"/><text x="820" y="240" class="tick">10 — gewenste situatie</text>
  </g>

  <!-- huidige positie label -->
  <text x="376" y="150" class="tick" fill="#14213D">huidige positie</text>

  <!-- vraag terug (wat werkt al) -->
  <path d="M340,290 C300,320 260,320 220,300" class="arrow"/>
  <rect x="70" y="300" width="330" height="90" rx="12" class="box" stroke="#8A3324" stroke-width="2"/>
  <text x="235" y="326" class="tick" fill="#8A3324">↙ Terugvragen — wat werkt al</text>
  <text x="235" y="350" class="lbl-light" fill="#3A3229" font-weight="500">"wat maakt dat het al een 4 is,</text>
  <text x="235" y="368" class="lbl-light" fill="#3A3229" font-weight="500">en geen 2?"</text>

  <!-- vraag vooruit (kleine stap) -->
  <path d="M412,290 C452,320 492,320 532,300" class="arrow"/>
  <rect x="500" y="300" width="330" height="90" rx="12" class="box" stroke="#2563A8" stroke-width="2"/>
  <text x="665" y="326" class="tick" fill="#2563A8">↗ Vooruitvragen — haalbare stap</text>
  <text x="665" y="350" class="lbl-light" fill="#3A3229" font-weight="500">"wat zou nodig zijn om naar</text>
  <text x="665" y="368" class="lbl-light" fill="#3A3229" font-weight="500">een 5 te gaan?" — niet naar de 10</text>

  <text x="450" y="440" class="footsub">De kracht zit niet in het cijfer zelf, maar in de vervolgvragen — nooit rechtstreeks doorvragen naar de 10 (§13.2)</text>
</svg>
