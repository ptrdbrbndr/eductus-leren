<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 760" font-family="'DM Sans', Arial, sans-serif" width="980" height="760" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#FBFAF7; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
      .num { font-size:15px; font-weight:700; fill:#FBFAF7; text-anchor:middle; }
      .crit { font-size:14.5px; font-weight:700; fill:#14213D; }
      .crit-warn { font-size:14.5px; font-weight:700; fill:#8A3324; }
      .expl { font-size:12.5px; fill:#55606F; }
      .badge { fill:#2563A8; }
      .badge-warn { fill:#8A3324; }
      .row { fill:#FFFFFF; stroke:#D8CBB4; stroke-width:1.5; }
      .row-warn { fill:#FBF1EC; stroke:#8A3324; stroke-width:2.5; }
      .tag { font-size:10.5px; font-weight:700; fill:#FBFAF7; text-anchor:middle; letter-spacing:.06em; }
      .sub { font-size:12.5px; fill:#3A3229; text-anchor:middle; }
    </style>
  </defs>

  <rect width="980" height="760" class="paper"/>
  <text x="40" y="42" class="kicker">DEEL 30 · BEOORDELING TEGEN BEIDE FRAMEWORKS</text>
  <text x="40" y="72" class="title">Rubric — zes criteria, met dezelfde niet-compenseerbare regel</text>

  <!-- rij 1 -->
  <rect x="40" y="105" width="900" height="88" rx="12" class="row"/>
  <circle cx="80" cy="149" r="20" class="badge"/><text x="80" y="155" class="num">1</text>
  <text x="115" y="140" class="crit">Grondhouding</text>
  <text x="115" y="160" class="expl">Aanwezigheid, oordeelloosheid binnen de grenzen van het vak — deel 2</text>
  <text x="115" y="178" class="expl" font-style="italic">Toelichtingsruimte: ______________________________________________</text>

  <!-- rij 2 -->
  <rect x="40" y="203" width="900" height="88" rx="12" class="row"/>
  <circle cx="80" cy="247" r="20" class="badge"/><text x="80" y="253" class="num">2</text>
  <text x="115" y="238" class="crit">Contractering en kader</text>
  <text x="115" y="258" class="expl">Heldere afspraken, ook bij een derde partij — deel 3, 11</text>
  <text x="115" y="276" class="expl" font-style="italic">Toelichtingsruimte: ______________________________________________</text>

  <!-- rij 3 -->
  <rect x="40" y="301" width="900" height="88" rx="12" class="row"/>
  <circle cx="80" cy="345" r="20" class="badge"/><text x="80" y="351" class="num">3</text>
  <text x="115" y="336" class="crit">Methodische breedte</text>
  <text x="115" y="356" class="expl">Meerdere invalshoeken herkend en verantwoord toegepast, incl. drieluik — deel 13-21</text>
  <text x="115" y="374" class="expl" font-style="italic">Toelichtingsruimte: ______________________________________________</text>

  <!-- rij 4 - niet-compenseerbaar -->
  <rect x="40" y="399" width="900" height="96" rx="12" class="row-warn"/>
  <circle cx="80" cy="447" r="20" class="badge-warn"/><text x="80" y="453" class="num">4</text>
  <text x="115" y="434" class="crit-warn">Ethiek en grenzen</text>
  <text x="115" y="454" class="expl">Herkent en handelt naar de grenzen van coaching, ook bij dilemma's en acute signalen — deel 9, 16, 23-24</text>
  <text x="115" y="472" class="expl" font-style="italic">Toelichtingsruimte: ______________________________________________</text>
  <rect x="700" y="418" width="220" height="26" rx="13" fill="#8A3324"/>
  <text x="810" y="436" class="tag">NIET-COMPENSEERBAAR</text>

  <!-- rij 5 -->
  <rect x="40" y="505" width="900" height="88" rx="12" class="row"/>
  <circle cx="80" cy="549" r="20" class="badge"/><text x="80" y="555" class="num">5</text>
  <text x="115" y="540" class="crit">Professionele ontwikkeling</text>
  <text x="115" y="560" class="expl">Reflectievermogen, portfolio-bewustzijn, praktijkvoering — deel 28-29</text>
  <text x="115" y="578" class="expl" font-style="italic">Toelichtingsruimte: ______________________________________________</text>

  <!-- rij 6 -->
  <rect x="40" y="603" width="900" height="88" rx="12" class="row"/>
  <circle cx="80" cy="647" r="20" class="badge"/><text x="80" y="653" class="num">6</text>
  <text x="115" y="638" class="crit">Coherentie van de sessie</text>
  <text x="115" y="658" class="expl">Herkenbare, verantwoorde opbouw van begin tot eind — deel 8, §30.2</text>
  <text x="115" y="676" class="expl" font-style="italic">Toelichtingsruimte: ______________________________________________</text>

  <text x="490" y="725" class="sub" fill="#9A5F0D" font-weight="700">Een grensoverschrijding op criterium 4 weegt zwaarder dan de andere vijf criteria samen — dezelfde regel als deel 10 en deel 22</text>
</svg>
