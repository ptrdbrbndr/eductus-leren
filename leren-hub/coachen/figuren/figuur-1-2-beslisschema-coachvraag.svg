<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="'DM Sans', Arial, sans-serif" width="900" height="560" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#FBFAF7; }
      .box { fill:#FFFFFF; stroke:#2563A8; stroke-width:1.5; }
      .box-end { fill:#3F7AB8; }
      .box-warn { fill:#FFFFFF; stroke:#E9A13B; stroke-width:3; }
      .lbl { font-size:14px; font-weight:700; fill:#14213D; text-anchor:middle; }
      .lbl-light { font-size:14px; font-weight:700; fill:#FBFAF7; text-anchor:middle; }
      .sub { font-size:12px; fill:#55606F; text-anchor:middle; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .yn { font-size:12px; font-weight:700; fill:#3F7AB8; }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/>
    </marker>
  </defs>

  <rect width="900" height="560" class="paper"/>
  <text x="40" y="42" class="kicker">DEEL 1 · VEREENVOUDIGD — VOLLEDIGE VERSIE IN DEEL 9</text>
  <text x="40" y="72" class="title">Coachvraag of niet?</text>

  <!-- vraag 1 -->
  <rect x="300" y="100" width="300" height="60" rx="8" class="box"/>
  <text x="450" y="126" class="lbl">Gaat het over het heden/</text>
  <text x="450" y="144" class="lbl">de toekomst, met keuzevrijheid?</text>

  <path d="M450 160 L450 195" class="arrow"/>
  <text x="472" y="182" class="yn">ja ↓</text>
  <path d="M300 130 L150 130 L150 480" class="arrow"/>
  <text x="230" y="122" class="yn">nee →</text>

  <!-- vraag 2 -->
  <rect x="300" y="200" width="300" height="60" rx="8" class="box"/>
  <text x="450" y="226" class="lbl">Functioneert de cliënt</text>
  <text x="450" y="244" class="lbl">op dit vlak in grote lijnen?</text>

  <path d="M450 260 L450 295" class="arrow"/>
  <text x="472" y="282" class="yn">ja ↓</text>
  <path d="M300 230 L200 230 L200 480" class="arrow"/>
  <text x="235" y="222" class="yn">nee →</text>

  <!-- vraag 3 -->
  <rect x="300" y="300" width="300" height="60" rx="8" class="box"/>
  <text x="450" y="326" class="lbl">Vraagt de cliënt om eigen</text>
  <text x="450" y="344" class="lbl">denken/gedrag te onderzoeken?</text>

  <path d="M450 360 L450 395" class="arrow"/>
  <text x="472" y="382" class="yn">ja ↓</text>
  <path d="M300 330 L250 330 L250 480" class="arrow"/>
  <text x="270" y="322" class="yn">nee →</text>

  <!-- eindpunt coaching -->
  <rect x="330" y="400" width="240" height="70" rx="10" class="box-end"/>
  <text x="450" y="430" class="lbl-light">Coachvraag —</text>
  <text x="450" y="450" class="lbl-light">ga verder als coach</text>

  <!-- eindpunt: alert/doorverwijzen -->
  <rect x="60" y="450" width="220" height="70" rx="10" class="box-warn"/>
  <text x="170" y="478" class="lbl" fill="#9A5F0D">Wees extra alert —</text>
  <text x="170" y="498" class="lbl" fill="#9A5F0D">volledig model in deel 9</text>

  <text x="450" y="540" class="sub" font-style="italic">Femke: elke nieuwe route in dit schema leidt bij haar terug naar hetzelfde antwoord — geen coachvraag.</text>
</svg>
