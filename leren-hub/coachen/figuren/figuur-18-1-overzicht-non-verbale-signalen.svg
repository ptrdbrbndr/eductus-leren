<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 640" font-family="'DM Sans', Arial, sans-serif" width="940" height="640" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#FBFAF7; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
      .head { font-size:10.5px; fill:#FBFAF7; letter-spacing:.1em; font-weight:700; }
      .cat { font-size:14.5px; font-weight:700; fill:#FBFAF7; }
      .txt { font-size:12.5px; fill:#3A3229; }
      .txt-i { font-size:12.5px; fill:#14213D; font-style:italic; }
      .row-even { fill:#FFFFFF; stroke:#D9D2C4; stroke-width:1; }
      .row-odd { fill:#F1EDE3; stroke:#D9D2C4; stroke-width:1; }
      .badge { fill:#2563A8; }
      .sub { font-size:12px; fill:#55606F; text-anchor:middle; }
      .arrow { stroke:#9A5F0D; stroke-width:1.4; fill:none; marker-end:url(#arr2); }
    </style>
    <marker id="arr2" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#9A5F0D"/>
    </marker>
  </defs>

  <rect width="940" height="640" class="paper"/>
  <text x="40" y="42" class="kicker">DEEL 18 · LICHAAM EN NON-VERBAAL</text>
  <text x="40" y="72" class="title">Wat je waarneemt — en hoe je het toetsend benoemt</text>

  <!-- header row -->
  <rect x="40" y="95" width="120" height="34" fill="#14213D"/>
  <text x="100" y="116" class="head" text-anchor="middle">SIGNAAL</text>
  <rect x="160" y="95" width="330" height="34" fill="#14213D"/>
  <text x="325" y="116" class="head" text-anchor="middle">VOORBEELD VAN WAT JE ZIET</text>
  <rect x="490" y="95" width="410" height="34" fill="#14213D"/>
  <text x="695" y="116" class="head" text-anchor="middle">NEUTRALE, TOETSENDE FORMULERING</text>

  <!-- row 1: Houding -->
  <rect x="40" y="129" width="860" height="88" class="row-odd"/>
  <rect x="40" y="129" width="120" height="88" class="badge"/>
  <text x="100" y="178" class="cat" text-anchor="middle">Houding</text>
  <text x="175" y="158" class="txt">Open of gesloten, naar voren</text>
  <text x="175" y="176" class="txt">of achteren geleund, gespannen</text>
  <text x="175" y="194" class="txt">of ontspannen schouders</text>
  <text x="505" y="158" class="txt-i">"Ik zie dat je armen over elkaar zijn —</text>
  <text x="505" y="176" class="txt-i">ik weet niet wat dat betekent, maar ik</text>
  <text x="505" y="194" class="txt-i">was benieuwd of er iets is."</text>

  <!-- row 2: Adem -->
  <rect x="40" y="217" width="860" height="88" class="row-even"/>
  <rect x="40" y="217" width="120" height="88" class="badge"/>
  <text x="100" y="266" class="cat" text-anchor="middle">Adem</text>
  <text x="175" y="246" class="txt">Hoog en snel, of laag en</text>
  <text x="175" y="264" class="txt">rustig; een merkbare</text>
  <text x="175" y="282" class="txt">verandering tijdens het gesprek</text>
  <text x="505" y="246" class="txt-i">"Ik merk dat je adem net wat</text>
  <text x="505" y="264" class="txt-i">hoger lijkt te gaan — herken je</text>
  <text x="505" y="282" class="txt-i">dat, en is er iets dat meespeelt?"</text>

  <!-- row 3: Stem -->
  <rect x="40" y="305" width="860" height="88" class="row-odd"/>
  <rect x="40" y="305" width="120" height="88" class="badge"/>
  <text x="100" y="354" class="cat" text-anchor="middle">Stem</text>
  <text x="175" y="334" class="txt">Tempo, volume, toonhoogte,</text>
  <text x="175" y="352" class="txt">en veranderingen daarin</text>
  <text x="505" y="334" class="txt-i">"Ik hoor dat je stem trilt —</text>
  <text x="505" y="352" class="txt-i">is er iets dat nu meespeelt?"</text>

  <!-- row 4: Micro-bewegingen -->
  <rect x="40" y="393" width="860" height="88" class="row-even"/>
  <rect x="40" y="393" width="120" height="88" class="badge"/>
  <text x="100" y="432" class="cat" text-anchor="middle">Micro-</text>
  <text x="100" y="450" class="cat" text-anchor="middle">bewegingen</text>
  <text x="175" y="422" class="txt">Een frons, het dichtknijpen</text>
  <text x="175" y="440" class="txt">van een hand, wegkijken op</text>
  <text x="175" y="458" class="txt">een specifiek moment</text>
  <text x="505" y="422" class="txt-i">"Ik zag net iets in je gezicht</text>
  <text x="505" y="440" class="txt-i">veranderen toen we het hierover</text>
  <text x="505" y="458" class="txt-i">hadden — wat gebeurde er?"</text>

  <rect x="40" y="481" width="860" height="1" fill="#D9D2C4"/>

  <text x="470" y="530" class="sub" font-weight="700" fill="#8A3324">De belangrijkste regel: een signaal is een aanleiding voor een vraag, nooit een uitspraak over wat het betekent.</text>
  <text x="470" y="552" class="sub">Verkeerd: "je zit met je armen over elkaar, dus je staat hier niet voor open." (§18.3)</text>
  <text x="470" y="576" class="sub">Het gaat niet om een uitputtende checklist, maar om wat opvalt — vooral een verandering ten opzichte</text>
  <text x="470" y="596" class="sub">van het patroon dat je eerder bij déze coachee al waarnam.</text>
</svg>
