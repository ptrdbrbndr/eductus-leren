<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="'DM Sans', Arial, sans-serif" width="900" height="580" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#FBFAF7; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
      .lbl { font-size:15px; font-weight:700; fill:#14213D; text-anchor:middle; }
      .lbl-light { font-size:15px; font-weight:700; fill:#FBFAF7; text-anchor:middle; }
      .sub { font-size:12px; fill:#3A3229; text-anchor:middle; }
      .sub-light { font-size:11.5px; fill:#EAF0F8; text-anchor:middle; }
      .item { font-size:12.5px; fill:#55606F; }
      .beam { stroke:#14213D; stroke-width:4; }
      .hang { stroke:#55606F; stroke-width:1.5; }
    </style>
  </defs>

  <rect width="900" height="580" class="paper"/>
  <text x="40" y="42" class="kicker">DEEL 2 · AANWEZIGHEID</text>
  <text x="40" y="72" class="title">Waar is uw aandacht — en waar hoort die te zijn?</text>

  <!-- fulcrum -->
  <path d="M450 300 L425 345 L475 345 Z" fill="#14213D"/>
  <rect x="410" y="345" width="80" height="10" rx="3" fill="#14213D"/>

  <!-- tilted beam: left (mijzelf) hoger, rechts (coachee) lager = gewenste balans tijdens een sessie -->
  <line x1="160" y1="255" x2="740" y2="345" class="beam"/>

  <!-- links: aandacht bij mijzelf -->
  <line x1="160" y1="255" x2="160" y2="210" class="hang"/>
  <circle cx="160" cy="150" r="95" fill="#8A3324" opacity="0.88"/>
  <text x="160" y="130" class="lbl-light">Aandacht bij</text>
  <text x="160" y="150" class="lbl-light">mijzelf</text>
  <text x="160" y="185" class="sub-light" font-size="11">niveau 1 · intern luisteren</text>

  <!-- rechts: aandacht bij de coachee -->
  <line x1="740" y1="345" x2="740" y2="290" class="hang"/>
  <circle cx="740" cy="230" r="95" fill="#2563A8"/>
  <text x="740" y="210" class="lbl-light">Aandacht bij</text>
  <text x="740" y="230" class="lbl-light">de coachee</text>
  <text x="740" y="265" class="sub-light" font-size="11">niveau 2 · gericht luisteren</text>

  <!-- pijl die de gewenste kant aangeeft -->
  <path d="M450 400 L620 380" stroke="#E9A13B" stroke-width="3" fill="none" marker-end="url(#arr2)"/>
  <defs>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/>
    </marker>
  </defs>
  <text x="530" y="418" class="sub" fill="#9A5F0D" font-weight="700">gewenste balans tijdens een sessie</text>

  <!-- drie signalen dat de balans naar mijzelf doorslaat -->
  <rect x="60" y="450" width="780" height="105" rx="12" fill="#FFFFFF" stroke="#8A3324" stroke-width="1.5"/>
  <text x="90" y="478" class="item" font-weight="700" fill="#8A3324">Drie signalen dat de aandacht naar uzelf terugvalt</text>
  <text x="90" y="500" class="item">— u formuleert tijdens het luisteren al het vervolg</text>
  <text x="90" y="520" class="item">— u herkent een patroon en reageert daarop, niet op wat er nú gezegd wordt</text>
  <text x="90" y="540" class="item">— u bent gespannen op het resultaat van de sessie — voor uzelf, niet voor de coachee</text>
</svg>
