<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 760" font-family="'DM Sans', Arial, sans-serif" width="980" height="760" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#FBFAF7; }
      .box { fill:#FFFFFF; stroke:#2563A8; stroke-width:1.5; }
      .box-end { fill:#3F7AB8; }
      .box-warn { fill:#FFFFFF; stroke:#E9A13B; stroke-width:3; }
      .box-route { fill:#8A3324; }
      .lbl { font-size:14px; font-weight:700; fill:#14213D; text-anchor:middle; }
      .lbl-light { font-size:14px; font-weight:700; fill:#FBFAF7; text-anchor:middle; }
      .step { font-size:13px; fill:#FBFAF7; text-anchor:start; }
      .stepnum { font-size:13px; font-weight:700; fill:#E9A13B; text-anchor:start; }
      .sub { font-size:12px; fill:#55606F; text-anchor:middle; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .yn { font-size:12px; font-weight:700; fill:#3F7AB8; }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/>
    </marker>
  </defs>

  <rect width="980" height="760" class="paper"/>
  <text x="40" y="42" class="kicker">DEEL 9 · VOLLEDIGE VERSIE VAN HET SCHEMA UIT DEEL 1</text>
  <text x="40" y="72" class="title">Signalen, beslispunten en de vaste doorverwijsroute</text>

  <!-- signalen intake -->
  <rect x="330" y="100" width="320" height="80" rx="10" class="box"/>
  <text x="490" y="128" class="lbl">Signalen op patroonniveau</text>
  <text x="490" y="148" class="lbl">aanwezig? (duur · disfunctioneren ·</text>
  <text x="490" y="166" class="lbl">acute nood · vraagt om behandeling)</text>

  <path d="M490 180 L490 215" class="arrow"/>
  <text x="512" y="202" class="yn">ja ↓</text>
  <path d="M330 140 L120 140 L120 640" class="arrow"/>
  <text x="150" y="132" class="yn">nee →</text>

  <!-- eindpunt coachvraag (nee-route) -->
  <rect x="20" y="640" width="200" height="70" rx="10" class="box-end"/>
  <text x="120" y="670" class="lbl-light">Coachvraag —</text>
  <text x="120" y="690" class="lbl-light">ga verder als coach</text>

  <!-- twijfel -->
  <rect x="330" y="220" width="320" height="70" rx="10" class="box-warn"/>
  <text x="490" y="248" class="lbl" fill="#9A5F0D">Bij twijfel: extra vragen,</text>
  <text x="490" y="268" class="lbl" fill="#9A5F0D">geen snel oordeel (zie twijfelgeval §9.4)</text>

  <path d="M490 290 L490 320" class="arrow"/>

  <!-- doorverwijsroute -->
  <rect x="290" y="325" width="400" height="360" rx="14" class="box-route"/>
  <text x="490" y="358" class="lbl-light" font-size="15">Vaste doorverwijsroute</text>

  <text x="320" y="392" class="stepnum">1</text>
  <text x="345" y="392" class="step">Benoem wat u waarneemt,</text>
  <text x="345" y="410" class="step">concreet, zonder diagnose</text>

  <text x="320" y="446" class="stepnum">2</text>
  <text x="345" y="446" class="step">Leg uit waarom dit buiten</text>
  <text x="345" y="464" class="step">coaching valt — kernzin 1</text>

  <text x="320" y="500" class="stepnum">3</text>
  <text x="345" y="500" class="step">Bied een concreet vervolg —</text>
  <text x="345" y="518" class="step">kernzin 2, huisarts als eerste stap</text>

  <text x="320" y="554" class="stepnum">4</text>
  <text x="345" y="554" class="step">Laat de deur op een kier,</text>
  <text x="345" y="572" class="step">zonder valse beloften</text>

  <rect x="320" y="600" width="340" height="60" rx="8" fill="#FBFAF7" opacity=".12"/>
  <text x="490" y="626" class="lbl-light" font-size="13">Toon: duidelijk en warm,</text>
  <text x="490" y="646" class="lbl-light" font-size="13">niet overmatig verontschuldigend</text>

  <text x="490" y="730" class="sub" font-style="italic">Femke: dit schema leidt bij elke methodiek die u later leert terug naar dezelfde uitkomst — geen coachvraag, wél de doorverwijsroute (§9.6).</text>
</svg>
