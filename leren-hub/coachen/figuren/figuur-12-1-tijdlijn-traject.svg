<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 480" font-family="'DM Sans', Arial, sans-serif" width="980" height="480" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#FBFAF7; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
      .lbl { font-size:13px; font-weight:700; fill:#14213D; text-anchor:middle; }
      .lbl-light { font-size:12.5px; font-weight:700; fill:#FBFAF7; text-anchor:middle; }
      .sub { font-size:11.5px; fill:#55606F; text-anchor:middle; }
      .footsub { font-size:12.5px; fill:#55606F; text-anchor:middle; font-style:italic; }
      .line { stroke:#55606F; stroke-width:2.5; }
    </style>
  </defs>

  <rect width="980" height="480" class="paper"/>
  <text x="40" y="42" class="kicker">DEEL 12 · TRAJECT ONTWERPEN</text>
  <text x="40" y="72" class="title">Een traject in de tijd — sessies, tussenevaluatie, verlenging</text>

  <line x1="90" y1="230" x2="890" y2="230" class="line"/>

  <!-- sessies 1-4 -->
  <circle cx="150" cy="230" r="12" fill="#2563A8"/>
  <text x="150" y="200" class="lbl">Sessie 1</text>
  <text x="150" y="264" class="sub">intake &amp;</text>
  <text x="150" y="278" class="sub">contract</text>

  <circle cx="330" cy="230" r="12" fill="#2563A8"/>
  <text x="330" y="200" class="lbl">Sessie 2</text>

  <!-- tussenevaluatie -->
  <circle cx="450" cy="230" r="18" fill="#E9A13B"/>
  <rect x="360" y="290" width="180" height="86" rx="10" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
  <text x="450" y="264" class="lbl" fill="#9A5F0D">Tussenevaluatie</text>
  <text x="450" y="312" class="sub">na ⅓ à ½ traject</text>
  <text x="450" y="330" class="sub">· doel checken</text>
  <text x="450" y="346" class="sub">· procesrapportage</text>
  <text x="450" y="362" class="sub">· reflectie als interventie</text>

  <circle cx="570" cy="230" r="12" fill="#2563A8"/>
  <text x="570" y="200" class="lbl">Sessie 4</text>

  <circle cx="690" cy="230" r="12" fill="#2563A8"/>
  <text x="690" y="200" class="lbl">Sessie 5</text>

  <!-- verlengingsmoment -->
  <circle cx="820" cy="230" r="18" fill="#3F7AB8"/>
  <rect x="730" y="290" width="180" height="70" rx="10" fill="#FFFFFF" stroke="#3F7AB8" stroke-width="2.5"/>
  <text x="820" y="200" class="lbl">Sessie 6</text>
  <text x="820" y="264" class="lbl" fill="#2563A8">Verlengings-</text>
  <text x="820" y="282" class="lbl" fill="#2563A8">moment</text>
  <text x="820" y="326" class="sub">expliciet ingebouwd,</text>
  <text x="820" y="342" class="sub">geen automatisme (§12.4)</text>

  <text x="490" y="440" class="footsub">Begin met een beperkt, concreet aantal sessies met een expliciet verlengingsmoment — in plaats van vooraf een lang traject vast te leggen (§12.2)</text>
</svg>
