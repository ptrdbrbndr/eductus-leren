<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" font-family="'DM Sans', Arial, sans-serif" width="900" height="660" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#FBFAF7; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
      .lbl-light { font-size:18px; font-weight:700; fill:#FBFAF7; text-anchor:middle; }
      .tag { font-size:11px; letter-spacing:.08em; font-weight:700; text-anchor:middle; }
      .item { font-size:13px; fill:#3A3229; }
      .item-h { font-size:12.5px; font-weight:700; fill:#14213D; }
      .status-h { font-size:11px; font-weight:700; letter-spacing:.06em; }
      .status { font-size:12px; }
      .sub { font-size:12.5px; fill:#55606F; text-anchor:middle; font-style:italic; }
      .panel1 { fill:#EAF0F8; stroke:#2563A8; stroke-width:1.5; }
      .panel2 { fill:#FBF0DC; stroke:#E9A13B; stroke-width:1.5; }
    </style>
  </defs>

  <rect width="900" height="660" class="paper"/>
  <text x="40" y="42" class="kicker">DEEL 21 · INSTRUMENTEN VERANTWOORD INZETTEN</text>
  <text x="40" y="72" class="title">Twee categorieën instrumenten — geen ranglijst, wel een oriëntatie</text>

  <!-- panel 1 -->
  <rect x="40" y="100" width="380" height="430" rx="18" class="panel1"/>
  <rect x="40" y="100" width="380" height="64" rx="18" fill="#2563A8"/>
  <rect x="40" y="140" width="380" height="24" fill="#2563A8"/>
  <text x="230" y="138" class="lbl-light">Categorie 1 — gevalideerd</text>

  <text x="70" y="200" class="item-h">Voorbeelden</text>
  <text x="70" y="222" class="item">— Big Five-gebaseerde persoonlijkheids-</text>
  <text x="82" y="240" class="item">vragenlijsten</text>
  <text x="70" y="262" class="item">— modellen met een onderzoekstraditie,</text>
  <text x="82" y="280" class="item">soms met een licentie-eis voor gebruik</text>

  <text x="70" y="330" class="status-h" fill="#1E4E82">STATUS</text>
  <text x="70" y="354" class="item">Reële, zij het uiteenlopende, mate</text>
  <text x="70" y="372" class="item">van wetenschappelijke onderbouwing</text>

  <text x="70" y="422" class="status-h" fill="#1E4E82">WAARDE</text>
  <text x="70" y="446" class="item">Bruikbaar met een relatief steviger</text>
  <text x="70" y="464" class="item">basis — nog altijd geen vaststaand</text>
  <text x="70" y="482" class="item">feit over wie iemand is</text>

  <!-- panel 2 -->
  <rect x="480" y="100" width="380" height="430" rx="18" class="panel2"/>
  <rect x="480" y="100" width="380" height="64" rx="18" fill="#E9A13B"/>
  <rect x="480" y="140" width="380" height="24" fill="#E9A13B"/>
  <text x="670" y="138" class="lbl-light" fill="#3A2A0E">Categorie 2 — populair</text>

  <text x="510" y="200" class="item-h">Voorbeelden</text>
  <text x="510" y="222" class="item">— veelgebruikte typologie-</text>
  <text x="522" y="240" class="item">instrumenten in teamworkshops</text>
  <text x="510" y="262" class="item">— laagdrempelige modellen, populair</text>
  <text x="522" y="280" class="item">vanwege herkenbaarheid en gemak</text>

  <text x="510" y="330" class="status-h" fill="#9A5F0D">STATUS</text>
  <text x="510" y="354" class="item">Aanzienlijk zwakkere of omstreden</text>
  <text x="510" y="372" class="item">wetenschappelijke status dan categorie 1</text>

  <text x="510" y="422" class="status-h" fill="#9A5F0D">WAARDE</text>
  <text x="510" y="446" class="item">Bruikbaar als gespreksopener of</text>
  <text x="510" y="464" class="item">reflectie-instrument — nooit als</text>
  <text x="510" y="482" class="item">objectief bewezen feit gepresenteerd</text>

  <text x="450" y="575" class="sub">Het onderscheid is zelf al een toepassing van het drieluik claim → status → waarde (§21.3):</text>
  <text x="450" y="598" class="sub">de "status"-stap verschilt sterk per instrument, ook al voelen ze voor een coachee soms gelijkwaardig aan.</text>
  <text x="450" y="630" class="sub" fill="#9A5F0D">Een instrument uit categorie 2 is niet per definitie onbruikbaar — mits transparant gecommuniceerd (§21.4).</text>
</svg>
