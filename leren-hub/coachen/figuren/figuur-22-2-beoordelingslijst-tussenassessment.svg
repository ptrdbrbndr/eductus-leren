<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 660" font-family="'DM Sans', Arial, sans-serif" width="940" height="660" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#FBFAF7; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
      .head { font-size:10.5px; fill:#FBFAF7; letter-spacing:.1em; font-weight:700; }
      .cat { font-size:13.5px; font-weight:700; fill:#FBFAF7; text-anchor:middle; }
      .txt { font-size:12.5px; fill:#3A3229; }
      .row-even { fill:#FFFFFF; stroke:#D9D2C4; stroke-width:1; }
      .row-odd { fill:#F1EDE3; stroke:#D9D2C4; stroke-width:1; }
      .badge { fill:#2563A8; }
      .sub { font-size:12px; fill:#55606F; text-anchor:middle; }
      .warn-row { fill:#F4E2DD; stroke:#8A3324; stroke-width:1.6; }
    </style>
  </defs>

  <rect width="940" height="660" class="paper"/>
  <text x="40" y="42" class="kicker">DEEL 22 · TUSSENASSESSMENT NIVEAU 2</text>
  <text x="40" y="72" class="title">Beoordelingslijst — vijf markers, in beginsel gelijkwaardig</text>

  <!-- header row -->
  <rect x="40" y="95" width="180" height="34" fill="#14213D"/>
  <text x="130" y="116" class="head" text-anchor="middle">MARKER</text>
  <rect x="220" y="95" width="680" height="34" fill="#14213D"/>
  <text x="560" y="116" class="head" text-anchor="middle">TOELICHTING (RUIMTE VOOR EIGEN INVULLING)</text>

  <!-- row 1 -->
  <rect x="40" y="129" width="860" height="70" class="row-odd"/>
  <rect x="40" y="129" width="180" height="70" class="badge"/>
  <text x="130" y="158" class="cat">13-16</text>
  <text x="130" y="178" class="cat" font-size="11.5">Methodiek</text>
  <text x="240" y="158" class="txt">Minstens twee van de vier invalshoeken (oplossingsgericht,</text>
  <text x="240" y="176" class="txt">cognitief, TA, systemisch) herkend en toegepast?</text>

  <!-- row 2 -->
  <rect x="40" y="199" width="860" height="70" class="row-even"/>
  <rect x="40" y="199" width="180" height="70" class="badge"/>
  <text x="130" y="228" class="cat">17-18</text>
  <text x="130" y="248" class="cat" font-size="11.5">Emotie en lichaam</text>
  <text x="240" y="228" class="txt">Merkbare aandacht voor toelaten/reguleren en non-verbale</text>
  <text x="240" y="246" class="txt">waarneming, zonder te interpreteren als feit?</text>

  <!-- row 3 -->
  <rect x="40" y="269" width="860" height="70" class="row-odd"/>
  <rect x="40" y="269" width="180" height="70" class="badge"/>
  <text x="130" y="298" class="cat">19-20</text>
  <text x="130" y="318" class="cat" font-size="11.5">Patronen en weerstand</text>
  <text x="240" y="298" class="txt">Een patroon benoemd, en — indien relevant — weerstand</text>
  <text x="240" y="316" class="txt">of stagnatie herkend?</text>

  <!-- row 4 -->
  <rect x="40" y="339" width="860" height="70" class="row-even"/>
  <rect x="40" y="339" width="180" height="70" class="badge"/>
  <text x="130" y="368" class="cat">21</text>
  <text x="130" y="388" class="cat" font-size="11.5">Instrumenten</text>
  <text x="240" y="368" class="txt">Het drieluik claim → status → waarde correct toegepast op</text>
  <text x="240" y="386" class="txt">minstens één instrument of model uit de casuïstiek?</text>

  <!-- row 5 -->
  <rect x="40" y="409" width="860" height="70" class="row-odd"/>
  <rect x="40" y="409" width="180" height="70" class="badge"/>
  <text x="130" y="438" class="cat">11-12</text>
  <text x="130" y="458" class="cat" font-size="11.5">Contract en traject</text>
  <text x="240" y="438" class="txt">Is het onderliggende contract (basis of driehoek) en</text>
  <text x="240" y="456" class="txt">trajectontwerp helder te herleiden?</text>

  <rect x="40" y="479" width="860" height="1" fill="#D9D2C4"/>

  <!-- niet-compenseerbare uitzondering -->
  <rect x="40" y="500" width="860" height="110" rx="10" class="warn-row"/>
  <text x="470" y="528" class="sub" font-weight="700" fill="#8A3324" text-anchor="middle">Niet-compenseerbare uitzondering (§22.5)</text>
  <text x="470" y="552" class="sub" text-anchor="middle">De vijf markers hierboven zijn in beginsel gelijkwaardig gewogen — behalve wanneer in de</text>
  <text x="470" y="572" class="sub" text-anchor="middle">casuïstiek een grens uit deel 9, 16 of 21 zichtbaar wordt overschreden. Dan geldt dezelfde regel</text>
  <text x="470" y="592" class="sub" text-anchor="middle">als bij Kader in deel 10: dat weegt zwaarder dan alle vijf markers samen.</text>
</svg>
