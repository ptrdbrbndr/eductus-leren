<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" font-family="'DM Sans', Arial, sans-serif" width="900" height="900" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#FBFAF7; }
      .box { fill:#FFFFFF; stroke:#2563A8; stroke-width:1.5; }
      .box-warn { fill:#FFFFFF; stroke:#E9A13B; stroke-width:3; }
      .lbl { font-size:15px; font-weight:700; fill:#14213D; text-anchor:start; }
      .sub { font-size:12px; fill:#55606F; text-anchor:start; }
      .num { font-size:15px; font-weight:700; fill:#FBFAF7; text-anchor:middle; }
      .party { font-size:10.5px; fill:#3F7AB8; text-anchor:start; font-weight:700; letter-spacing:.04em; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .footsub { font-size:12.5px; fill:#55606F; text-anchor:middle; font-style:italic; }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/>
    </marker>
  </defs>

  <rect width="900" height="900" class="paper"/>
  <text x="40" y="42" class="kicker">DEEL 11 · INTAKE EN DRIEHOEKSCONTRACT</text>
  <text x="40" y="72" class="title">Het zesdelig intakemodel</text>

  <!-- step 1 -->
  <circle cx="150" cy="130" r="20" fill="#2563A8"/><text x="150" y="136" class="num">1</text>
  <rect x="230" y="100" width="560" height="62" rx="10" class="box"/>
  <text x="250" y="125" class="lbl">Aanleiding vanuit de opdrachtgever</text>
  <text x="250" y="145" class="sub">wat is de concrete reden om te starten, en vanuit wie?</text>
  <text x="700" y="145" class="party">OPDRACHTGEVER</text>
  <path d="M150 150 L150 200 L230 200" class="arrow"/>

  <!-- step 2 -->
  <circle cx="150" cy="230" r="20" fill="#2563A8"/><text x="150" y="236" class="num">2</text>
  <rect x="230" y="200" width="560" height="62" rx="10" class="box"/>
  <text x="250" y="225" class="lbl">Aanleiding vanuit de coachee</text>
  <text x="250" y="245" class="sub">hoe ervaart de coachee de situatie — is dat hetzelfde beeld?</text>
  <text x="720" y="245" class="party">COACHEE</text>
  <path d="M150 250 L150 300 L230 300" class="arrow"/>

  <!-- step 3 -->
  <circle cx="150" cy="330" r="20" fill="#2563A8"/><text x="150" y="336" class="num">3</text>
  <rect x="230" y="300" width="560" height="62" rx="10" class="box"/>
  <text x="250" y="325" class="lbl">Doel afstemmen tussen alle drie partijen</text>
  <text x="250" y="345" class="sub">expliciet benoemen waar overeenstemming is, en waar (nog) niet</text>
  <text x="655" y="345" class="party">ALLE DRIE</text>
  <path d="M150 350 L150 400 L230 400" class="arrow"/>

  <!-- step 4 -->
  <circle cx="150" cy="430" r="20" fill="#2563A8"/><text x="150" y="436" class="num">4</text>
  <rect x="230" y="400" width="560" height="62" rx="10" class="box"/>
  <text x="250" y="425" class="lbl">Rapportageafspraken</text>
  <text x="250" y="445" class="sub">wat wordt teruggekoppeld — proces wél, inhoud nooit (§11.5)</text>
  <text x="700" y="445" class="party">OPDRACHTGEVER</text>
  <path d="M150 450 L150 500 L230 500" class="arrow"/>

  <!-- step 5 -->
  <circle cx="150" cy="530" r="20" fill="#2563A8"/><text x="150" y="536" class="num">5</text>
  <rect x="230" y="500" width="560" height="62" rx="10" class="box"/>
  <text x="250" y="525" class="lbl">Duur, frequentie, evaluatiemomenten</text>
  <text x="250" y="545" class="sub">inclusief een vooraf afgesproken tussenevaluatie (zie deel 12)</text>
  <text x="655" y="545" class="party">ALLE DRIE</text>
  <path d="M150 550 L150 610 L230 610" class="arrow"/>

  <!-- step 6 -->
  <circle cx="150" cy="640" r="20" fill="#E9A13B"/><text x="150" y="646" class="num" fill="#14213D">6</text>
  <rect x="230" y="610" width="560" height="76" rx="10" class="box-warn"/>
  <text x="250" y="638" class="lbl" fill="#9A5F0D">Afspraak bij verschil van inzicht</text>
  <text x="250" y="658" class="sub">vooraf regelen hoe een verschil tussen coachee en opdrachtgever</text>
  <text x="250" y="674" class="sub">wordt opgelost — niet pas ter plekke bedenken</text>
  <text x="655" y="638" class="party">ALLE DRIE</text>

  <text x="450" y="750" class="footsub">Element 6 wordt door beginnende coaches het vaakst overgeslagen — juist het element dat bij een lastige coachee als Ronald het meest voorkomt (§11.6)</text>
</svg>
