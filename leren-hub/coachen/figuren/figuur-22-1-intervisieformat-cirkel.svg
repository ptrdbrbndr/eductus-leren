<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 780" font-family="'DM Sans', Arial, sans-serif" width="900" height="780" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#FBFAF7; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
      .lbl-light { font-size:17px; font-weight:700; fill:#FBFAF7; text-anchor:middle; }
      .sub-light { font-size:12px; fill:#EAF0F8; text-anchor:middle; }
      .center-lbl { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; font-weight:700; fill:#FBFAF7; text-anchor:middle; }
      .center-sub { font-size:11.5px; fill:#EAF0F8; text-anchor:middle; }
      .arrow { stroke:#55606F; stroke-width:2; fill:none; marker-end:url(#arr5); }
      .sub { font-size:13px; fill:#55606F; text-anchor:middle; font-style:italic; }
      .num { font-size:13px; font-weight:700; fill:#FBFAF7; text-anchor:middle; }
    </style>
    <marker id="arr5" markerWidth="9" markerHeight="9" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/>
    </marker>
  </defs>

  <rect width="900" height="780" class="paper"/>
  <text x="40" y="42" class="kicker">DEEL 22 · INTERVISIE, OPNAMES EN TUSSENASSESSMENT</text>
  <text x="40" y="72" class="title">Het intervisieformat — vier stappen, geen hiërarchie</text>

  <!-- cyclic arrows around the center -->
  <path d="M524,271 A175,175 0 0,1 609,356" class="arrow"/>
  <path d="M609,504 A175,175 0 0,1 524,589" class="arrow"/>
  <path d="M376,589 A175,175 0 0,1 291,504" class="arrow"/>
  <path d="M291,356 A175,175 0 0,1 376,271" class="arrow"/>

  <!-- 1 Casusinbreng: top -->
  <rect x="350" y="125" width="200" height="90" rx="14" fill="#14213D"/>
  <text x="450" y="155" class="num">1</text>
  <text x="450" y="176" class="lbl-light" font-size="15">Casusinbreng</text>
  <text x="450" y="196" class="sub-light">korte situatie + concrete vraag</text>

  <!-- 2 Verhelderingsvragen: right -->
  <rect x="610" y="385" width="200" height="90" rx="14" fill="#2563A8"/>
  <text x="710" y="415" class="num">2</text>
  <text x="710" y="436" class="lbl-light" font-size="14">Verhelderings-</text>
  <text x="710" y="456" class="lbl-light" font-size="14">vragen — geen mening</text>

  <!-- 3 Reflectie: bottom -->
  <rect x="350" y="645" width="200" height="90" rx="14" fill="#3F7AB8"/>
  <text x="450" y="675" class="num">3</text>
  <text x="450" y="696" class="lbl-light" font-size="15">Reflectie door de groep</text>
  <text x="450" y="716" class="sub-light">waarneming delen, geen discussie</text>

  <!-- 4 Terugkoppeling: left -->
  <rect x="90" y="385" width="200" height="90" rx="14" fill="#E9A13B"/>
  <text x="190" y="415" class="num" fill="#14213D">4</text>
  <text x="190" y="436" class="lbl-light" fill="#14213D" font-size="14">Terugkoppeling</text>
  <text x="190" y="456" class="sub-light" fill="#3A3229">wat neemt de inbrenger mee</text>

  <!-- center -->
  <circle cx="450" cy="430" r="88" fill="#8A3324"/>
  <text x="450" y="420" class="center-lbl">Intervisie</text>
  <text x="450" y="443" class="center-sub">collegiale reflectie —</text>
  <text x="450" y="459" class="center-sub">geen advies, geen expert</text>

  <text x="450" y="762" class="sub">Dezelfde coachende grondhouding uit deel 2 (luisteren, vragen, geen advies), nu gericht op de coach zelf als "coachee" van de groep.</text>
</svg>
