<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 840" font-family="'DM Sans', Arial, sans-serif" width="980" height="840" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#FBFAF7; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
      .lbl { font-size:13.5px; font-weight:700; fill:#FBFAF7; text-anchor:start; }
      .num { font-size:13px; font-weight:700; fill:#E9A13B; text-anchor:middle; }
      .sub { font-size:12px; fill:#55606F; text-anchor:middle; font-style:italic; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .lbl-dark { font-size:14px; font-weight:700; fill:#14213D; text-anchor:middle; }
      .sub-dark { font-size:12px; fill:#3A3229; text-anchor:middle; }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/>
    </marker>
  </defs>

  <rect width="980" height="840" class="paper"/>
  <text x="40" y="42" class="kicker">DEEL 25 · TEAMCOACHING</text>
  <text x="40" y="72" class="title">Team-intake — het zesdelig model plus draagvlakcontrole</text>
  <text x="40" y="98" class="sub" text-anchor="start">Uitbreiding op het zesdelig intakemodel uit deel 11 (figuur 11-2)</text>

  <!-- zesdelig model: 6 stacked boxes left column -->
  <g>
    <circle cx="70" cy="150" r="20" fill="#2563A8"/><text x="70" y="155" class="num">1</text>
    <rect x="110" y="130" width="360" height="42" rx="8" fill="#2563A8"/>
    <text x="128" y="156" class="lbl">Aanleiding vanuit de opdrachtgever</text>
  </g>
  <g>
    <circle cx="70" cy="204" r="20" fill="#2563A8"/><text x="70" y="209" class="num">2</text>
    <rect x="110" y="184" width="360" height="42" rx="8" fill="#2563A8"/>
    <text x="128" y="210" class="lbl">Aanleiding vanuit de coachee(s)</text>
  </g>
  <g>
    <circle cx="70" cy="258" r="20" fill="#3F7AB8"/><text x="70" y="263" class="num">3</text>
    <rect x="110" y="238" width="360" height="42" rx="8" fill="#3F7AB8"/>
    <text x="128" y="264" class="lbl">Doel afstemmen tussen alle partijen</text>
  </g>
  <g>
    <circle cx="70" cy="312" r="20" fill="#3F7AB8"/><text x="70" y="317" class="num">4</text>
    <rect x="110" y="292" width="360" height="42" rx="8" fill="#3F7AB8"/>
    <text x="128" y="318" class="lbl">Rapportageafspraken (proces vs. inhoud)</text>
  </g>
  <g>
    <circle cx="70" cy="366" r="20" fill="#6FA3D6"/><text x="70" y="371" class="num">5</text>
    <rect x="110" y="346" width="360" height="42" rx="8" fill="#6FA3D6"/>
    <text x="128" y="372" class="lbl" fill="#14213D">Duur, frequentie, evaluatiemomenten</text>
  </g>
  <g>
    <circle cx="70" cy="420" r="20" fill="#6FA3D6"/><text x="70" y="425" class="num">6</text>
    <rect x="110" y="400" width="360" height="42" rx="8" fill="#6FA3D6"/>
    <text x="128" y="426" class="lbl" fill="#14213D">Aanpak bij verschil van inzicht</text>
  </g>
  <text x="290" y="465" class="sub">zesdelig model — deel 11, figuur 11-2</text>

  <!-- arrow to extra box -->
  <path d="M470 300 L560 300" class="arrow"/>
  <text x="515" y="290" class="sub" font-size="11">bij een team →</text>

  <!-- extra draagvlakcontrole box -->
  <rect x="560" y="180" width="380" height="150" rx="16" fill="#FFFFFF" stroke="#E9A13B" stroke-width="3.5"/>
  <text x="750" y="216" class="lbl-dark">Extra bij een team: draagvlakcontrole</text>
  <text x="750" y="242" class="sub-dark">Is er voldoende collectief eigenaarschap</text>
  <text x="750" y="260" class="sub-dark">van de vraag om als team-traject te starten —</text>
  <text x="750" y="278" class="sub-dark">of is dit eigenlijk een individueel vraagstuk</text>
  <text x="750" y="296" class="sub-dark">van de leidinggevende? (§25.2)</text>
  <text x="750" y="316" class="sub-dark" font-weight="700" fill="#9A5F0D">wie spreekt namens het team bij de intake?</text>

  <path d="M750 330 L750 365" class="arrow"/>
  <path d="M660 330 L560 400" class="arrow"/>
  <text x="600" y="360" class="sub" font-size="11" fill="#8A3324">nee ↙</text>
  <text x="790" y="355" class="sub" font-size="11" fill="#0E5A51">ja ↓</text>

  <!-- ja outcome -->
  <rect x="600" y="365" width="300" height="70" rx="10" fill="#14213D"/>
  <text x="750" y="394" class="lbl">Start teamtraject —</text>
  <text x="750" y="414" class="lbl">team is de "coachee" (§25.1)</text>

  <!-- nee outcome -->
  <rect x="340" y="400" width="260" height="80" rx="10" fill="#8A3324"/>
  <text x="470" y="428" class="lbl">Heroverweeg: individueel</text>
  <text x="470" y="446" class="lbl">vraagstuk van de</text>
  <text x="470" y="464" class="lbl">leidinggevende alleen?</text>

  <!-- vertrouwelijkheidslaag note -->
  <rect x="60" y="540" width="860" height="150" rx="14" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
  <text x="490" y="574" class="title" font-size="17" text-anchor="middle">Extra vertrouwelijkheidslaag binnen het team (§25.3)</text>
  <text x="490" y="604" class="sub" font-style="normal">Wat één teamlid in een sessie deelt, is niet automatisch vrij te delen met de rest —</text>
  <text x="490" y="626" class="sub" font-style="normal">ook al zijn alle teamleden allemaal coachee.</text>
  <text x="490" y="654" class="sub" font-style="normal" font-weight="700">Carla en Bram: wat je weet uit een individueel traject, gebruik je niet — ook</text>
  <text x="490" y="674" class="sub" font-style="normal" font-weight="700">niet impliciet — binnen het teamtraject, tenzij expliciet afgesproken (§25.5).</text>

  <text x="490" y="800" class="sub">De proces/inhoud-regel richting de opdrachtgever (deel 11, §11.5) blijft daarnaast onverkort gelden</text>
</svg>
