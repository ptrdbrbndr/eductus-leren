<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="'DM Sans', Arial, sans-serif" width="900" height="500" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#FBFAF7; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
      .lbl-light { font-size:16px; font-weight:700; fill:#FBFAF7; text-anchor:middle; }
      .sub-light { font-size:11.5px; fill:#EAF0F8; text-anchor:middle; }
      .marit { font-size:12px; font-weight:700; fill:#8A3324; text-anchor:middle; }
      .deel { font-size:10.5px; fill:#55606F; text-anchor:middle; font-style:italic; }
      .sub { font-size:12px; fill:#3A3229; text-anchor:middle; }
    </style>
    <linearGradient id="contgrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6FA3D6"/>
      <stop offset="1" stop-color="#14213D"/>
    </linearGradient>
  </defs>

  <rect width="900" height="500" class="paper"/>
  <text x="40" y="42" class="kicker">DEEL 27 · LEIDERSCHAPSCOACHING</text>
  <text x="40" y="72" class="title">Van vaardigheid naar identiteit — een continuüm</text>

  <!-- linker eindbox: vaardigheid -->
  <rect x="60" y="130" width="220" height="110" rx="16" fill="#6FA3D6"/>
  <text x="170" y="175" class="lbl-light">Leiderschaps-</text>
  <text x="170" y="196" class="lbl-light">vaardigheid</text>
  <text x="170" y="220" class="sub-light">technisch · kortlopend</text>

  <!-- verbindende gradient-balk -->
  <rect x="280" y="167" width="340" height="36" fill="url(#contgrad)"/>

  <!-- rechter eindbox: identiteit -->
  <rect x="620" y="130" width="220" height="110" rx="16" fill="#14213D"/>
  <text x="730" y="175" class="lbl-light">Leiderschaps-</text>
  <text x="730" y="196" class="lbl-light">identiteit</text>
  <text x="730" y="220" class="sub-light">diepgaand · langere adem</text>

  <!-- as-onderschriften -->
  <text x="170" y="270" class="sub">bijv. feedback geven, vergaderen leiden</text>
  <text x="170" y="288" class="sub">generieke technieken (niveau 1-2) volstaan</text>
  <text x="730" y="270" class="sub">raakt kernovertuigingen (deel 14)</text>
  <text x="730" y="288" class="sub">en systemische context (deel 16, 26)</text>

  <!-- Marit's traject als gestippelde lijn -->
  <path d="M180,330 L450,330 L700,330" stroke="#8A3324" stroke-width="2" stroke-dasharray="4 5" fill="none"/>
  <circle cx="180" cy="330" r="7" fill="#FBFAF7" stroke="#8A3324" stroke-width="2.5"/>
  <circle cx="450" cy="330" r="7" fill="#FBFAF7" stroke="#8A3324" stroke-width="2.5"/>
  <circle cx="700" cy="330" r="9" fill="#8A3324"/>

  <text x="180" y="360" class="marit">Marit — deel 5-6</text>
  <text x="180" y="376" class="deel">"hoe word ik zelfverzekerder"</text>

  <text x="450" y="360" class="marit">Marit — deel 15 · 19</text>
  <text x="450" y="376" class="deel">patroon van instemmen</text>

  <text x="700" y="360" class="marit">Marit — deel 27 (hier)</text>
  <text x="700" y="376" class="deel">past dit bij wie ik wil zijn?</text>

  <text x="450" y="450" class="sub" fill="#9A5F0D" font-weight="700">Geen tweedeling maar een glijdende schaal — de grens die wél blijft gelden is coaching versus advisering (§27.5)</text>
</svg>
