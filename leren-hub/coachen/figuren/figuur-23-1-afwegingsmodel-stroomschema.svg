<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" font-family="'DM Sans', Arial, sans-serif" width="900" height="900" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#FBFAF7; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
      .stepnum { font-family:'Cormorant Garamond', Georgia, serif; font-size:26px; font-weight:700; fill:#FBFAF7; text-anchor:middle; }
      .lbl-light { font-size:16px; font-weight:700; fill:#FBFAF7; text-anchor:start; }
      .sub-light { font-size:13px; fill:#EAF0F8; text-anchor:start; }
      .arrow { stroke:#55606F; stroke-width:2; fill:none; marker-end:url(#arr); }
      .sub { font-size:12.5px; fill:#55606F; text-anchor:middle; font-style:italic; }
      .badge { font-size:11px; fill:#9A5F0D; text-anchor:start; letter-spacing:.06em; }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/>
    </marker>
  </defs>

  <rect width="900" height="900" class="paper"/>
  <text x="40" y="42" class="kicker">DEEL 23 · ETHIEK GEVORDERD</text>
  <text x="40" y="72" class="title">Het afwegingsmodel voor ethische dilemma's</text>

  <!-- step 1 -->
  <circle cx="90" cy="150" r="34" fill="#2563A8"/>
  <text x="90" y="160" class="stepnum">1</text>
  <rect x="150" y="112" width="680" height="76" rx="14" fill="#2563A8"/>
  <text x="176" y="145" class="lbl-light">Benoem alle betrokken partijen en hun belang</text>
  <text x="176" y="168" class="sub-light">expliciet — ook het ongemakkelijke eigen belang van de coach</text>
  <path d="M90 202 L90 232" class="arrow"/>
  <path d="M490 188 L490 210" class="arrow"/>

  <!-- step 2 -->
  <circle cx="90" cy="290" r="34" fill="#3F7AB8"/>
  <text x="90" y="300" class="stepnum">2</text>
  <rect x="150" y="252" width="680" height="76" rx="14" fill="#3F7AB8"/>
  <text x="176" y="285" class="lbl-light">Onderzoek waar de belangen conflicteren — en waar niet</text>
  <text x="176" y="308" class="sub-light">vaak blijkt een deel van het vermeende conflict geen echt conflict</text>
  <path d="M90 342 L90 372" class="arrow"/>
  <path d="M490 328 L490 350" class="arrow"/>

  <!-- step 3 -->
  <circle cx="90" cy="430" r="34" fill="#6FA3D6"/>
  <text x="90" y="440" class="stepnum">3</text>
  <rect x="150" y="392" width="680" height="76" rx="14" fill="#6FA3D6"/>
  <text x="176" y="425" class="lbl-light" fill="#14213D">Toets aan de gedragscode én aan de contractuele afspraken</text>
  <text x="176" y="448" class="sub-light" fill="#3A3229">wat is al vastgelegd (deel 3, deel 11), en wat niet?</text>
  <path d="M90 482 L90 512" class="arrow"/>
  <path d="M490 468 L490 490" class="arrow"/>

  <!-- step 4 -->
  <circle cx="90" cy="570" r="34" fill="#14213D"/>
  <text x="90" y="580" class="stepnum">4</text>
  <rect x="150" y="530" width="680" height="90" rx="14" fill="#14213D" stroke="#E9A13B" stroke-width="3"/>
  <text x="176" y="566" class="lbl-light">Kies, en wees transparant over de afweging</text>
  <text x="176" y="589" class="sub-light">niet elke partij hoeft het eens te zijn — iedereen moet de afweging kunnen begrijpen</text>

  <!-- ronald toepassing box -->
  <rect x="90" y="670" width="740" height="140" rx="14" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
  <text x="460" y="702" class="title" font-size="17" text-anchor="middle">Toepassing — Ronald, opnieuw</text>
  <text x="460" y="730" class="sub" font-style="normal">Belangen: Ronald's vertrouwen in de coach vs. de opdrachtgever se investering in het traject.</text>
  <text x="460" y="752" class="sub" font-style="normal">Conflict: reëel — geen manier om de opdrachtgever gerust te stellen zonder vertrouwelijkheid te schenden.</text>
  <text x="460" y="774" class="sub" font-style="normal">Contract (deel 11): proces wel, inhoud nooit — de keuze volgt daaruit direct.</text>
  <text x="460" y="796" class="sub" font-weight="700" font-style="normal">Het dilemma zit niet in de uitkomst, maar in de druk om er toch van af te wijken (§23.4).</text>

  <text x="450" y="850" class="sub">Voor een dilemma is er zelden één juist antwoord — dit is een afwegingsproces, geen opzoektabel (§23.3)</text>
</svg>
