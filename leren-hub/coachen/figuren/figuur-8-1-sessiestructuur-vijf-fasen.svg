<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'DM Sans', Arial, sans-serif" width="960" height="460" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#FBFAF7; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
      .lbl-light { font-size:15px; font-weight:700; fill:#FBFAF7; text-anchor:middle; }
      .num-light { font-size:20px; font-weight:700; fill:#FBFAF7; text-anchor:middle; opacity:.85; }
      .sub { font-size:12px; fill:#3A3229; text-anchor:middle; }
      .deel { font-size:11px; fill:#55606F; text-anchor:middle; font-style:italic; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
    </style>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/>
    </marker>
  </defs>

  <rect width="960" height="460" class="paper"/>
  <text x="40" y="42" class="kicker">DEEL 8 · SESSIEOPBOUW</text>
  <text x="40" y="72" class="title">Vijf fasen — ruggengraat, geen script</text>

  <!-- vijf segmenten -->
  <!-- 1 opening -->
  <rect x="40" y="120" width="160" height="90" rx="10" fill="#6FA3D6"/>
  <text x="120" y="150" class="num-light">1</text>
  <text x="120" y="178" class="lbl-light">Opening</text>
  <text x="120" y="198" class="lbl-light" font-size="11">landen · sessiedoel</text>

  <path d="M204 165 L228 165" class="arrow"/>

  <!-- 2 verkennen -->
  <rect x="232" y="120" width="160" height="90" rx="10" fill="#3F7AB8"/>
  <text x="312" y="150" class="num-light">2</text>
  <text x="312" y="178" class="lbl-light">Verkennen</text>
  <text x="312" y="198" class="lbl-light" font-size="11">luisteren · doorvragen</text>

  <path d="M396 165 L420 165" class="arrow"/>

  <!-- 3 verdiepen -->
  <rect x="424" y="120" width="160" height="90" rx="10" fill="#2563A8"/>
  <text x="504" y="150" class="num-light">3</text>
  <text x="504" y="178" class="lbl-light">Verdiepen</text>
  <text x="504" y="198" class="lbl-light" font-size="11">GROW · spiegelen</text>

  <path d="M588 165 L612 165" class="arrow"/>

  <!-- 4 experimenteren -->
  <rect x="616" y="120" width="160" height="90" rx="10" fill="#3F7AB8"/>
  <text x="696" y="150" class="num-light">4</text>
  <text x="696" y="178" class="lbl-light">Experimenteren</text>
  <text x="696" y="198" class="lbl-light" font-size="11">klein · concreet</text>

  <path d="M780 165 L804 165" class="arrow"/>

  <!-- 5 afronden -->
  <rect x="808" y="120" width="112" height="90" rx="10" fill="#14213D"/>
  <text x="864" y="150" class="num-light">5</text>
  <text x="864" y="178" class="lbl-light">Afronden</text>
  <text x="864" y="198" class="lbl-light" font-size="11">samenvatten</text>

  <!-- deel-referenties onder de balk -->
  <text x="120" y="248" class="deel">deel 6</text>
  <text x="312" y="248" class="deel">deel 4 · 5</text>
  <text x="504" y="248" class="deel">deel 6 · 7</text>
  <text x="696" y="248" class="deel">niet verplicht — §8.4</text>
  <text x="864" y="248" class="deel">samenvatten · checken · evalueren</text>

  <rect x="40" y="290" width="880" height="2" fill="#D8CBB4"/>
  <text x="480" y="330" class="sub" font-weight="700">Een intern kompas, geen agenda die u aan de coachee voorlegt — vergelijk GROW in deel 6.</text>
  <text x="480" y="360" class="sub" fill="#9A5F0D" font-style="italic">Fase 4 (experimenteren) is de meest voorkomende afsluiting, maar niet verplicht — zie Joost, §8.4.</text>
</svg>
