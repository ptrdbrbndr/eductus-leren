<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="'DM Sans', Arial, sans-serif" width="900" height="560" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#FBFAF7; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
      .lbl-light { font-size:19px; font-weight:700; fill:#FBFAF7; text-anchor:middle; }
      .sub-light { font-size:11.5px; fill:#EAF0F8; text-anchor:middle; }
      .row-lbl { font-size:12px; font-weight:700; fill:#E9A13B; }
      .row-txt { font-size:12.5px; fill:#FBFAF7; }
      .sub { font-size:12.5px; fill:#3A3229; text-anchor:middle; }
    </style>
  </defs>

  <rect width="900" height="560" class="paper"/>
  <text x="40" y="42" class="kicker">DEEL 28 · SUPERVISIE EN EIGEN ONTWIKKELING</text>
  <text x="40" y="72" class="title">Intervisie naast supervisie — verschil in rol, hiërarchie, doel</text>

  <!-- linker kolom: Intervisie -->
  <rect x="60" y="115" width="360" height="330" rx="18" fill="#3F7AB8"/>
  <text x="240" y="155" class="lbl-light">Intervisie</text>
  <text x="240" y="176" class="sub-light">deel 22</text>

  <text x="95" y="220" class="row-lbl">ROL</text>
  <text x="95" y="242" class="row-txt">Collega-coach, vergelijkbare</text>
  <text x="95" y="260" class="row-txt">ervaring</text>

  <text x="95" y="298" class="row-lbl">HIËRARCHIE</text>
  <text x="95" y="320" class="row-txt">Geen — volledig</text>
  <text x="95" y="338" class="row-txt">gelijkwaardig</text>

  <text x="95" y="376" class="row-lbl">DOEL</text>
  <text x="95" y="398" class="row-txt">Collegiale spiegel,</text>
  <text x="95" y="416" class="row-txt">gedeeld leren</text>

  <!-- rechter kolom: Supervisie -->
  <rect x="480" y="115" width="360" height="330" rx="18" fill="#14213D"/>
  <text x="660" y="155" class="lbl-light">Supervisie</text>
  <text x="660" y="176" class="sub-light">deel 28</text>

  <text x="515" y="220" class="row-lbl">ROL</text>
  <text x="515" y="242" class="row-txt">Ervaren coach of specifiek</text>
  <text x="515" y="260" class="row-txt">opgeleide begeleider</text>

  <text x="515" y="298" class="row-lbl">HIËRARCHIE</text>
  <text x="515" y="320" class="row-txt">Begeleidend, soms</text>
  <text x="515" y="338" class="row-txt">toetsend — niet gelijk</text>

  <text x="515" y="376" class="row-lbl">DOEL</text>
  <text x="515" y="398" class="row-txt">Blik met meer ervaring,</text>
  <text x="515" y="416" class="row-txt">waar nodig meer autoriteit</text>

  <!-- verbindend plusteken -->
  <circle cx="450" cy="280" r="26" fill="#E9A13B"/>
  <text x="450" y="289" font-size="26" font-weight="700" fill="#14213D" text-anchor="middle">+</text>

  <text x="450" y="500" class="sub" font-weight="700">Beide vormen zijn waardevol en vullen elkaar aan — geen van beide vervangt de ander (§28.2)</text>
</svg>
