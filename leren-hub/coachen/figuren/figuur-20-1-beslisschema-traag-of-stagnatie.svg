<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="'DM Sans', Arial, sans-serif" width="900" height="700" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#FBFAF7; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
      .box { fill:#FFFFFF; stroke:#2563A8; stroke-width:1.5; }
      .lbl { font-size:14.5px; font-weight:700; fill:#14213D; text-anchor:middle; }
      .lbl-light { font-size:17px; font-weight:700; fill:#FBFAF7; text-anchor:middle; }
      .item-light { font-size:12.5px; fill:#EAF0F8; }
      .item-light2 { font-size:12.5px; fill:#F7E4DA; }
      .arrow { stroke:#55606F; stroke-width:1.6; fill:none; marker-end:url(#arr4); }
      .yn { font-size:12.5px; font-weight:700; fill:#3F7AB8; }
      .yn-warn { font-size:12.5px; font-weight:700; fill:#9A5F0D; }
      .sub { font-size:12.5px; fill:#55606F; text-anchor:middle; font-style:italic; }
      .bullet { fill:#E9A13B; }
      .bullet2 { fill:#F0C68A; }
    </style>
    <marker id="arr4" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/>
    </marker>
  </defs>

  <rect width="900" height="700" class="paper"/>
  <text x="40" y="42" class="kicker">DEEL 20 · WEERSTAND, STAGNATIE EN HET STOPGESPREK</text>
  <text x="40" y="72" class="title">Traag maar levend — of stagnatie?</text>

  <rect x="270" y="98" width="360" height="70" rx="10" class="box"/>
  <text x="450" y="128" class="lbl">Geen snelle, zichtbare</text>
  <text x="450" y="148" class="lbl">vooruitgang in de sessie</text>

  <path d="M370 168 L230 168 L230 210" class="arrow"/>
  <text x="270" y="160" class="yn">verschuift er iets? ↙</text>
  <path d="M530 168 L670 168 L670 210" class="arrow"/>
  <text x="640" y="160" class="yn-warn">niets, sessie na sessie ↘</text>

  <!-- links: traag maar levend -->
  <rect x="60" y="210" width="340" height="290" rx="16" fill="#3F7AB8"/>
  <text x="230" y="248" class="lbl-light">Traag maar levend</text>

  <circle cx="95" cy="285" r="4" class="bullet"/>
  <text x="112" y="290" class="item-light">Een nieuw inzicht, ook al klein</text>
  <circle cx="95" cy="315" r="4" class="bullet"/>
  <text x="112" y="320" class="item-light">Een iets scherper geformuleerde vraag</text>
  <circle cx="95" cy="345" r="4" class="bullet"/>
  <text x="112" y="350" class="item-light">Een net iets andere formulering</text>
  <text x="112" y="368" class="item-light">van hetzelfde probleem</text>
  <circle cx="95" cy="398" r="4" class="bullet"/>
  <text x="112" y="403" class="item-light">Een concrete verandering buiten</text>
  <text x="112" y="421" class="item-light">de sessie, ook als de coachee</text>
  <text x="112" y="439" class="item-light">het zelf niet als vooruitgang framet</text>
  <text x="230" y="475" class="item-light" font-weight="700">→ gewoon doorgaan, geen ingreep nodig</text>

  <!-- rechts: stagnatie -->
  <rect x="500" y="210" width="340" height="290" rx="16" fill="#8A3324"/>
  <text x="670" y="248" class="lbl-light">Stagnatie</text>

  <circle cx="535" cy="285" r="4" class="bullet2"/>
  <text x="552" y="290" class="item-light2">Dezelfde klacht, letterlijk dezelfde</text>
  <text x="552" y="308" class="item-light2">woorden, sessie na sessie</text>
  <circle cx="535" cy="335" r="4" class="bullet2"/>
  <text x="552" y="340" class="item-light2">Geen enkele verschuiving, ook niet</text>
  <text x="552" y="358" class="item-light2">op het niveau van inzicht</text>
  <circle cx="535" cy="385" r="4" class="bullet2"/>
  <text x="552" y="390" class="item-light2">Herhaalde weerstand die niet</text>
  <text x="552" y="408" class="item-light2">meebeweegt, ook niet na §20.2</text>
  <text x="670" y="460" class="item-light2" font-weight="700">→ overweeg het stopgesprek (§20.5)</text>

  <text x="450" y="545" class="sub">Joost is de casus waarmee dit onderscheid het scherpst wordt geoefend (§20.4) —</text>
  <text x="450" y="567" class="sub">niet elk traject zonder snel resultaat is een probleem.</text>
  <text x="450" y="600" class="sub" fill="#9A5F0D">Stoppen is geen falen: hetzelfde onderscheidingsvermogen als bij het doorverwijsgesprek uit deel 9 (§20.5).</text>
</svg>
