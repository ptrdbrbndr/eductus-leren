<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" font-family="'DM Sans', Arial, sans-serif" width="980" height="640" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#FBFAF7; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
      .lbl-light { font-size:15.5px; font-weight:700; fill:#FBFAF7; text-anchor:middle; }
      .sub-light { font-size:11.5px; fill:#EAF0F8; text-anchor:middle; }
      .center-lbl { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; font-weight:700; fill:#FBFAF7; text-anchor:middle; }
      .center-sub { font-size:12px; fill:#EAF0F8; text-anchor:middle; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .sub { font-size:12.5px; fill:#3A3229; text-anchor:middle; }
    </style>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/>
    </marker>
  </defs>

  <rect width="980" height="640" class="paper"/>
  <text x="40" y="42" class="kicker">DEEL 30 · CAPSTONE</text>
  <text x="40" y="72" class="title">De hele cursusboog — drie niveaus, één integratiepunt</text>

  <!-- niveau 1 -->
  <rect x="40" y="120" width="280" height="140" rx="14" fill="#6FA3D6"/>
  <text x="180" y="155" class="lbl-light">Niveau 1 — Fundament</text>
  <text x="180" y="180" class="sub-light">deel 1-10</text>
  <text x="180" y="202" class="sub-light">houding · kader ·</text>
  <text x="180" y="220" class="sub-light">vaardigheden · structuur</text>
  <text x="180" y="242" class="sub-light">EIA Foundation · ICF Level 1</text>

  <!-- niveau 2 -->
  <rect x="350" y="120" width="280" height="140" rx="14" fill="#3F7AB8"/>
  <text x="490" y="155" class="lbl-light">Niveau 2 — Methodiek</text>
  <text x="490" y="180" class="sub-light">deel 11-22</text>
  <text x="490" y="202" class="sub-light">GROW · TA · systemisch ·</text>
  <text x="490" y="220" class="sub-light">emotie · patronen</text>
  <text x="490" y="242" class="sub-light">EIA Practitioner · ICF Level 2</text>

  <!-- niveau 3 -->
  <rect x="660" y="120" width="280" height="140" rx="14" fill="#2563A8"/>
  <text x="800" y="155" class="lbl-light">Niveau 3 — Professioneel</text>
  <text x="800" y="180" class="sub-light">deel 23-29</text>
  <text x="800" y="202" class="sub-light">ethiek gevorderd · team ·</text>
  <text x="800" y="220" class="sub-light">organisatie · leiderschap · praktijk</text>
  <text x="800" y="242" class="sub-light">EIA Senior Practitioner · ICF PCC/MCC</text>

  <!-- convergerende pijlen -->
  <path d="M180,260 L400,400" class="arrow"/>
  <path d="M490,260 L490,400" class="arrow"/>
  <path d="M800,260 L580,400" class="arrow"/>

  <!-- capstone-cirkel -->
  <circle cx="490" cy="490" r="120" fill="#14213D"/>
  <text x="490" y="478" class="center-lbl">Capstone</text>
  <text x="490" y="502" class="center-sub">de opgenomen sessie — deel 30</text>
  <text x="490" y="522" class="center-sub">contractering · methodiek ·</text>
  <text x="490" y="540" class="center-sub">emotie/lichaam · ethiek — samen</text>

  <text x="490" y="625" class="sub" font-style="italic">30-40 minuten, met de volledige breedte van niveau 1-3 tot uw beschikking (§30.2)</text>
</svg>
