<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" font-family="'DM Sans', Arial, sans-serif" width="900" height="660" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#FBFAF7; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
      .hcell { font-size:12px; font-weight:700; fill:#FBFAF7; letter-spacing:.04em; }
      .tcell { font-size:14px; font-weight:700; }
      .vcell { font-size:13.5px; fill:#14213D; font-style:italic; }
      .ecell { font-size:13.5px; fill:#55606F; }
    </style>
  </defs>

  <rect width="900" height="660" class="paper"/>
  <text x="40" y="42" class="kicker">DEEL 5 · VRAGEN STELLEN</text>
  <text x="40" y="72" class="title">Overzicht vraagtypen — voorbeeld en typisch effect</text>

  <!-- header -->
  <rect x="40" y="110" width="820" height="50" fill="#14213D"/>
  <text x="54" y="141" class="hcell">VRAAGTYPE</text>
  <text x="194" y="141" class="hcell">VOORBEELDVRAAG</text>
  <text x="544" y="141" class="hcell">TYPISCH EFFECT</text>

  <!-- rows -->
  <rect x="40" y="160" width="820" height="76" fill="#FBFAF7"/>
  <rect x="40" y="236" width="820" height="76" fill="#F1EEE6"/>
  <rect x="40" y="312" width="820" height="76" fill="#FBFAF7"/>
  <rect x="40" y="388" width="820" height="76" fill="#F1EEE6"/>
  <rect x="40" y="464" width="820" height="76" fill="#FBFAF7"/>
  <rect x="40" y="540" width="820" height="76" fill="#F1EEE6"/>

  <!-- column separators + row lines -->
  <g stroke="#55606F" stroke-opacity="0.18" stroke-width="1">
    <line x1="180" y1="110" x2="180" y2="616"/>
    <line x1="530" y1="110" x2="530" y2="616"/>
    <line x1="40" y1="236" x2="860" y2="236"/>
    <line x1="40" y1="312" x2="860" y2="312"/>
    <line x1="40" y1="388" x2="860" y2="388"/>
    <line x1="40" y1="464" x2="860" y2="464"/>
    <line x1="40" y1="540" x2="860" y2="540"/>
  </g>
  <rect x="40" y="110" width="820" height="506" fill="none" stroke="#14213D" stroke-width="1.5"/>

  <!-- row 1: Open -->
  <text x="54" y="204" class="tcell" fill="#2563A8">Open</text>
  <text x="194" y="204" class="vcell">"Wat heb je al geprobeerd?"</text>
  <text x="544" y="204" class="ecell">Nodigt uit tot exploratie</text>

  <!-- row 2: Gesloten -->
  <text x="54" y="280" class="tcell" fill="#55606F">Gesloten</text>
  <text x="194" y="280" class="vcell">"Heb je dat al geprobeerd?"</text>
  <text x="544" y="280" class="ecell">Sluit af tot een ja/nee-antwoord</text>

  <!-- row 3: Waarom -->
  <text x="54" y="356" class="tcell" fill="#8A3324">Waarom</text>
  <text x="194" y="350" class="vcell">"Waarom deed je dat?"</text>
  <text x="544" y="344" class="ecell">Wekt verdediging,</text>
  <text x="544" y="362" class="ecell">nodigt uit tot rationaliseren</text>

  <!-- row 4: Wat (i.p.v. waarom) -->
  <text x="54" y="418" class="tcell" fill="#2563A8">Wat</text>
  <text x="54" y="438" class="tcell" fill="#2563A8" font-size="11.5">(i.p.v. waarom)</text>
  <text x="194" y="428" class="vcell">"Wat maakte dat je dat deed?"</text>
  <text x="544" y="422" class="ecell">Zelfde informatie,</text>
  <text x="544" y="440" class="ecell">geen verdedigingsreflex</text>

  <!-- row 5: Feiten -->
  <text x="54" y="508" class="tcell" fill="#3F7AB8">Feiten</text>
  <text x="194" y="508" class="vcell">"Wat is er gebeurd?"</text>
  <text x="544" y="508" class="ecell">Haalt het gebeurde boven tafel</text>

  <!-- row 6: Betekenis -->
  <text x="54" y="584" class="tcell" fill="#3F7AB8">Betekenis</text>
  <text x="194" y="584" class="vcell">"Wat betekende dat voor jou?"</text>
  <text x="544" y="584" class="ecell">Haalt de interpretatie boven tafel</text>

  <text x="450" y="644" class="ecell" text-anchor="middle" font-style="italic">Coaching werkt overwegend met open vragen — niet uitsluitend, en met terughoudendheid bij "waarom" (§5.2)</text>
</svg>
