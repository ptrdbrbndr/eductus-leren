<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="'DM Sans', Arial, sans-serif" width="900" height="460" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#FBFAF7; }
      .box { fill:#FFFFFF; stroke:#2563A8; stroke-width:1.5; }
      .box-end { fill:#3F7AB8; }
      .lbl { font-size:16px; font-weight:700; fill:#14213D; text-anchor:middle; }
      .lbl-light { font-size:15px; font-weight:700; fill:#FBFAF7; text-anchor:middle; }
      .sub { font-size:12px; fill:#55606F; text-anchor:middle; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr3); }
      .step { font-size:12px; font-weight:700; fill:#FBFAF7; text-anchor:middle; }
    </style>
    <marker id="arr3" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/>
    </marker>
  </defs>

  <rect width="900" height="460" class="paper"/>
  <text x="40" y="42" class="kicker">DEEL 2 · EIGEN REACTIVITEIT KENNEN</text>
  <text x="40" y="72" class="title">Eigen reactie opmerken</text>

  <!-- stap 1 -->
  <circle cx="180" cy="150" r="18" fill="#14213D"/>
  <text x="180" y="155" class="step">1</text>
  <rect x="80" y="185" width="200" height="110" rx="10" class="box"/>
  <text x="180" y="215" class="lbl">Benoemen</text>
  <text x="180" y="240" class="sub">"ik merk irritatie,</text>
  <text x="180" y="256" class="sub">onzekerheid, de neiging</text>
  <text x="180" y="272" class="sub">om te overtuigen" — bij</text>
  <text x="180" y="288" class="sub">uzelf, niet hardop</text>

  <path d="M280 240 L360 240" class="arrow"/>

  <!-- stap 2 -->
  <circle cx="450" cy="150" r="18" fill="#14213D"/>
  <text x="450" y="155" class="step">2</text>
  <rect x="350" y="185" width="200" height="110" rx="10" class="box"/>
  <text x="450" y="215" class="lbl">Onderscheiden</text>
  <text x="450" y="240" class="sub">informatie over de</text>
  <text x="450" y="256" class="sub">coachee, of over mij</text>
  <text x="450" y="272" class="sub">als coach? — vaak</text>
  <text x="450" y="288" class="sub">allebei tegelijk</text>

  <path d="M550 240 L630 240" class="arrow"/>

  <!-- stap 3 -->
  <circle cx="720" cy="150" r="18" fill="#14213D"/>
  <text x="720" y="155" class="step">3</text>
  <rect x="620" y="185" width="200" height="110" rx="10" class="box-end"/>
  <text x="720" y="215" class="lbl-light">Kiezen</text>
  <text x="720" y="240" class="sub-light" fill="#EAF0F8">wat doe ik ermee, zo</text>
  <text x="720" y="256" class="sub-light" fill="#EAF0F8">dat het niet ongemerkt</text>
  <text x="720" y="272" class="sub-light" fill="#EAF0F8">de sessie stuurt</text>

  <text x="450" y="360" class="sub" font-style="italic">Toegepast op Ronald (§2.4): niet de irritatie is het probleem, maar de irritatie die ongemerkt de vraag stuurt.</text>
  <text x="450" y="390" class="sub" fill="#9A5F0D" font-weight="700">Concrete technieken hiervoor volgen in deel 17 en deel 20.</text>
</svg>
