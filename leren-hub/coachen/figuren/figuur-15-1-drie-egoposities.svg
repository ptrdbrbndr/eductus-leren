<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 780" font-family="'DM Sans', Arial, sans-serif" width="900" height="780" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#FBFAF7; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
      .lbl-light { font-size:19px; font-weight:700; fill:#FBFAF7; text-anchor:middle; }
      .sub-light { font-size:13px; fill:#EAF0F8; text-anchor:middle; font-style:italic; }
      .tag { font-size:11px; fill:#EAF0F8; text-anchor:middle; letter-spacing:.08em; }
      .footsub { font-size:12.5px; fill:#55606F; text-anchor:middle; font-style:italic; }
    </style>
  </defs>

  <rect width="900" height="780" class="paper"/>
  <text x="40" y="42" class="kicker">DEEL 15 · TRANSACTIONELE ANALYSE</text>
  <text x="40" y="72" class="title">Drie egoposities</text>

  <!-- Ouder: top -->
  <ellipse cx="450" cy="230" rx="230" ry="105" fill="#3F7AB8"/>
  <text x="450" y="205" class="tag">NORMATIEF · BEOORDELEND OF VERZORGEND</text>
  <text x="450" y="235" class="lbl-light">Ouder</text>
  <text x="450" y="262" class="sub-light">"dit hoort zo" · "laat mij het maar doen"</text>

  <!-- Volwassene: middle -->
  <ellipse cx="450" cy="400" rx="230" ry="105" fill="#14213D"/>
  <text x="450" y="375" class="tag">FEITELIJK · HIER-EN-NU · AFWEGEND</text>
  <text x="450" y="405" class="lbl-light">Volwassene</text>
  <text x="450" y="432" class="sub-light">de positie van waaruit coaching idealiter plaatsvindt</text>

  <!-- Kind: bottom -->
  <ellipse cx="450" cy="570" rx="230" ry="105" fill="#6FA3D6"/>
  <text x="450" y="545" class="tag">SPONTAAN · EMOTIONEEL OF AANGEPAST</text>
  <text x="450" y="575" class="lbl-light">Kind</text>
  <text x="450" y="602" class="sub-light">"oké, ik doe het wel, het maakt toch niet uit"</text>

  <text x="450" y="710" class="footsub">Geen enkele positie is fout — elke positie heeft een functie. Het probleem is een positie die herhaaldelijk niet bij de situatie past (§15.2)</text>
  <text x="450" y="735" class="footsub">Bij Marit: vaak instemmen vanuit Aangepast Kind — "wat zou de Volwassene hier hebben gezegd?" (§15.5)</text>
</svg>
