<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" font-family="'DM Sans', Arial, sans-serif" width="900" height="660" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#FBFAF7; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
      .lbl-light { font-size:16px; font-weight:700; fill:#FBFAF7; text-anchor:middle; }
      .sub { font-size:12.5px; fill:#55606F; text-anchor:middle; }
      .quote { font-size:12px; fill:#3A3229; text-anchor:middle; font-style:italic; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .axislbl { font-size:12px; fill:#55606F; letter-spacing:.04em; text-anchor:middle; }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/>
    </marker>
  </defs>

  <rect width="900" height="660" class="paper"/>
  <text x="40" y="42" class="kicker">DEEL 7 · REFLECTEREN EN SPIEGELEN</text>
  <text x="40" y="72" class="title">Drie niveaus — toenemende eigen inbreng van de coach</text>

  <!-- baseline -->
  <line x1="70" y1="500" x2="830" y2="500" stroke="#14213D" stroke-width="1.5"/>

  <!-- bar 1: spiegelen -->
  <rect x="100" y="380" width="180" height="120" fill="#6FA3D6"/>
  <text x="190" y="425" class="lbl-light">Spiegelen</text>
  <text x="190" y="448" class="lbl-light" font-size="12" font-weight="500">beschrijven,</text>
  <text x="190" y="465" class="lbl-light" font-size="12" font-weight="500">geen oordeel</text>

  <!-- bar 2: feedback -->
  <rect x="360" y="290" width="180" height="210" fill="#3F7AB8"/>
  <text x="450" y="335" class="lbl-light">Feedback</text>
  <text x="450" y="358" class="lbl-light" font-size="12" font-weight="500">waarneming +</text>
  <text x="450" y="375" class="lbl-light" font-size="12" font-weight="500">eigen effect</text>

  <!-- bar 3: confronteren -->
  <rect x="620" y="200" width="180" height="300" fill="#8A3324" stroke="#E9A13B" stroke-width="3"/>
  <text x="710" y="245" class="lbl-light">Confronteren</text>
  <text x="710" y="268" class="lbl-light" font-size="12" font-weight="500">patroon expliciet,</text>
  <text x="710" y="285" class="lbl-light" font-size="12" font-weight="500">toetsend gebracht</text>

  <!-- example quotes below baseline -->
  <text x="190" y="525" class="quote">"ik merk dat je twee keer …"</text>
  <text x="190" y="541" class="sub">vrijwel altijd inzetbaar</text>

  <text x="450" y="525" class="quote">"toen je dat zei, merkte ik …"</text>
  <text x="450" y="541" class="sub">vraagt enig vertrouwen</text>

  <text x="710" y="525" class="quote">"je zegt X, en tegelijk Y —</text>
  <text x="710" y="539" class="quote">wat zie je daarin?"</text>
  <text x="710" y="557" class="sub">vraagt het meeste vertrouwen en timing</text>

  <!-- axis arrow -->
  <path d="M110,590 L790,590" class="arrow"/>
  <text x="450" y="616" class="axislbl">TOENEMENDE EIGEN INBRENG VAN DE COACH</text>

  <text x="450" y="646" class="sub" font-style="italic">Bij twijfel of de relatie het kan dragen: kies de mildere vorm (§7.3)</text>
</svg>
