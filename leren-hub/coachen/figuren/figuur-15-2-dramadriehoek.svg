<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 760" font-family="'DM Sans', Arial, sans-serif" width="900" height="760" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#FBFAF7; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
      .lbl-light { font-size:17px; font-weight:700; fill:#FBFAF7; text-anchor:middle; }
      .sub-light { font-size:12px; fill:#EAF0F8; text-anchor:middle; }
      .arrow { stroke:#8A3324; stroke-width:2; fill:none; marker-end:url(#arrR); stroke-dasharray:6 4; }
      .arrlbl { font-size:11px; fill:#8A3324; text-anchor:middle; font-style:italic; }
      .footsub { font-size:12.5px; fill:#55606F; text-anchor:middle; font-style:italic; }
    </style>
    <marker id="arrR" markerWidth="9" markerHeight="9" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#8A3324"/>
    </marker>
  </defs>

  <rect width="900" height="760" class="paper"/>
  <text x="40" y="42" class="kicker">DEEL 15 · TRANSACTIONELE ANALYSE</text>
  <text x="40" y="72" class="title">De dramadriehoek (Karpman)</text>

  <!-- Redder: top -->
  <circle cx="450" cy="200" r="110" fill="#3F7AB8"/>
  <text x="450" y="192" class="lbl-light">Redder</text>
  <text x="450" y="215" class="sub-light">springt ongevraagd in,</text>
  <text x="450" y="230" class="sub-light">raakt overbelast</text>

  <!-- Slachtoffer: bottom-left -->
  <circle cx="230" cy="560" r="110" fill="#6FA3D6"/>
  <text x="230" y="552" class="lbl-light">Slachtoffer</text>
  <text x="230" y="575" class="sub-light">voelt zich hulpeloos,</text>
  <text x="230" y="590" class="sub-light">nodigt een Redder uit</text>

  <!-- Aanklager: bottom-right -->
  <circle cx="670" cy="560" r="110" fill="#14213D"/>
  <text x="670" y="552" class="lbl-light">Aanklager</text>
  <text x="670" y="575" class="sub-light">beschuldigt, veroordeelt —</text>
  <text x="670" y="590" class="sub-light">vanuit Kritische Ouder</text>

  <!-- curved transition arrows -->
  <path d="M370,270 C300,360 260,440 235,450" class="arrow"/>
  <text x="270" y="380" class="arrlbl">wordt niet gewaardeerd →</text>

  <path d="M340,560 C450,610 560,600 590,565" class="arrow"/>
  <text x="450" y="640" class="arrlbl">voelt zich uitgebuit →</text>

  <path d="M600,480 C540,380 500,300 520,270" class="arrow"/>
  <text x="600" y="380" class="arrlbl">keert zich tegen de Redder →</text>

  <text x="450" y="700" class="footsub">Mensen wisselen vaak onbewust van rol — het inzicht dat je in één rol zit is vaak al de eerste stap richting de Volwassen-positie (§15.3)</text>
</svg>
