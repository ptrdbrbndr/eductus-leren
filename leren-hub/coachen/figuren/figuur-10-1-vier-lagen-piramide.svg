<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="'DM Sans', Arial, sans-serif" width="900" height="640" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#FBFAF7; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
      .lbl-light { font-size:16px; font-weight:700; fill:#FBFAF7; text-anchor:middle; }
      .sub-light { font-size:12px; fill:#EAF0F8; text-anchor:middle; }
      .deel { font-size:11.5px; fill:#55606F; text-anchor:start; font-style:italic; }
      .sub { font-size:12.5px; fill:#3A3229; text-anchor:middle; }
    </style>
  </defs>

  <rect width="900" height="640" class="paper"/>
  <text x="40" y="42" class="kicker">DEEL 10 · SYNTHESE NIVEAU 1</text>
  <text x="40" y="72" class="title">Vier lagen — elk steunt op de vorige</text>

  <!-- laag 4: structuur (top, smalste) -->
  <polygon points="360,110 540,110 505,190 395,190" fill="#6FA3D6"/>
  <text x="450" y="140" class="lbl-light">Laag 4 — Structuur</text>
  <text x="450" y="162" class="sub-light">doel en focus · sessieopbouw</text>

  <!-- laag 3: vaardigheden -->
  <polygon points="300,200 600,200 555,320 345,320" fill="#3F7AB8"/>
  <text x="450" y="245" class="lbl-light">Laag 3 — Vaardigheden</text>
  <text x="450" y="268" class="sub-light">luisteren · vragen · reflecteren</text>

  <!-- laag 2: kader -->
  <polygon points="235,330 665,330 610,450 290,450" fill="#2563A8"/>
  <text x="450" y="375" class="lbl-light">Laag 2 — Kader</text>
  <text x="450" y="398" class="sub-light">afbakening · contract · ethische grenzen</text>

  <!-- laag 1: houding (fundament, breedste) -->
  <polygon points="160,460 740,460 700,560 200,560" fill="#14213D"/>
  <text x="450" y="500" class="lbl-light" font-size="18">Laag 1 — Houding</text>
  <text x="450" y="524" class="sub-light">aanwezigheid · oordeelloosheid · reactiviteit · stilte</text>

  <!-- deel-referenties links -->
  <text x="40" y="150" class="deel">deel 6 · 8</text>
  <text x="40" y="260" class="deel">deel 4 · 5 · 7</text>
  <text x="40" y="390" class="deel">deel 1 · 3 · 9</text>
  <text x="40" y="510" class="deel">deel 2</text>

  <text x="450" y="600" class="sub" font-weight="700">Zonder houding werkt geen vaardigheid goed; zonder kader is elke vaardigheid vrijblijvend; zonder structuur blijft het bij losse momenten.</text>
</svg>
