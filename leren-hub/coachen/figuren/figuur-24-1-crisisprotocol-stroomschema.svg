<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 820" font-family="'DM Sans', Arial, sans-serif" width="980" height="820" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#FBFAF7; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
      .lbl { font-size:14px; font-weight:700; fill:#14213D; text-anchor:middle; }
      .lbl-light { font-size:14px; font-weight:700; fill:#FBFAF7; text-anchor:middle; }
      .step { font-size:13px; fill:#FBFAF7; text-anchor:start; }
      .stepnum { font-size:13px; font-weight:700; fill:#E9A13B; text-anchor:start; }
      .sub { font-size:12px; fill:#55606F; text-anchor:middle; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .branch { font-size:12px; font-weight:700; text-anchor:middle; letter-spacing:.05em; }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/>
    </marker>
  </defs>

  <rect width="980" height="820" class="paper"/>
  <text x="40" y="42" class="kicker">DEEL 24 · GRENZEN EN DOORVERWIJZING GEVORDERD</text>
  <text x="40" y="72" class="title">Crisisprotocol — acuut versus regulier signaal</text>

  <!-- signaal top -->
  <rect x="340" y="100" width="300" height="72" rx="10" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
  <text x="490" y="132" class="lbl">Signaal tijdens de intake</text>
  <text x="490" y="152" class="lbl">of tijdens een lopend traject</text>

  <path d="M420 172 L230 220" class="arrow"/>
  <path d="M560 172 L750 220" class="arrow"/>
  <text x="280" y="200" class="branch" fill="#3F7AB8">regulier ↙</text>
  <text x="700" y="200" class="branch" fill="#8A3324">acuut ↘</text>

  <!-- regulier branch -->
  <rect x="80" y="225" width="300" height="90" rx="12" fill="#3F7AB8"/>
  <text x="230" y="256" class="lbl-light">Regulier signaal</text>
  <text x="230" y="278" class="lbl-light" font-size="12">geen tijdsdruk — rustig gesprek,</text>
  <text x="230" y="296" class="lbl-light" font-size="12">eigen tempo van de coachee</text>

  <path d="M230 315 L230 345" class="arrow"/>
  <rect x="80" y="350" width="300" height="80" rx="12" fill="#FFFFFF" stroke="#3F7AB8" stroke-width="1.5"/>
  <text x="230" y="378" class="lbl">Doorverwijsgesprek</text>
  <text x="230" y="398" class="lbl">(deel 9) — vier elementen,</text>
  <text x="230" y="416" class="lbl">kernzin 1 + kernzin 2</text>

  <text x="230" y="460" class="sub" font-style="italic">Voorbeeld: Femke — geen acuut gevaar, wél buiten coaching</text>

  <!-- acuut branch -->
  <rect x="600" y="225" width="300" height="90" rx="12" fill="#8A3324" stroke="#E9A13B" stroke-width="3"/>
  <text x="750" y="256" class="lbl-light">Acuut signaal</text>
  <text x="750" y="278" class="lbl-light" font-size="12">mogelijk direct gevaar voor</text>
  <text x="750" y="296" class="lbl-light" font-size="12">de veiligheid van de coachee</text>

  <path d="M750 315 L750 345" class="arrow"/>

  <!-- protocol box -->
  <rect x="600" y="350" width="300" height="380" rx="14" fill="#14213D"/>
  <text x="750" y="382" class="lbl-light" font-size="15">Crisisprotocol — vier stappen</text>

  <text x="622" y="418" class="stepnum">1</text>
  <text x="645" y="418" class="step">Blijf aanwezig en kalm —</text>
  <text x="645" y="436" class="step">je rust helpt meer dan analyse</text>

  <text x="622" y="474" class="stepnum">2</text>
  <text x="645" y="474" class="step">Onderneem geen behandeling</text>
  <text x="645" y="492" class="step">of diepgaande bevraging</text>

  <text x="622" y="530" class="stepnum">3</text>
  <text x="645" y="530" class="step">Verwijs direct en actief door —</text>
  <text x="645" y="548" class="step">huisarts(post), 113, bij</text>
  <text x="645" y="566" class="step">levensgevaar 112</text>

  <text x="622" y="602" class="stepnum">4</text>
  <text x="645" y="602" class="step">Documenteer feitelijk en</text>
  <text x="645" y="620" class="step">zoek zelf steun (deel 28)</text>

  <rect x="622" y="650" width="256" height="60" rx="8" fill="#FBFAF7" opacity=".12"/>
  <text x="750" y="676" class="lbl-light" font-size="12.5">Veiligheid gaat voor</text>
  <text x="750" y="696" class="lbl-light" font-size="12.5">volledigheid — directer dan §9.4</text>

  <text x="750" y="795" class="sub" font-style="italic" fill="#8A3324">Een coach beoordeelt zelf niet of iets "ernstig genoeg" is — bij twijfel wordt de stap gezet</text>
</svg>
