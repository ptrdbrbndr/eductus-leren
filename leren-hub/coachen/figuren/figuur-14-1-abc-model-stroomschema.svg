<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="'DM Sans', Arial, sans-serif" width="980" height="560" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#FBFAF7; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
      .box { fill:#FFFFFF; stroke:#2563A8; stroke-width:1.5; }
      .box-c { fill:#8A3324; }
      .box-e { fill:#3F7AB8; }
      .letter { font-family:'Cormorant Garamond', Georgia, serif; font-size:30px; font-weight:700; fill:#14213D; text-anchor:middle; }
      .letter-light { font-family:'Cormorant Garamond', Georgia, serif; font-size:30px; font-weight:700; fill:#FBFAF7; text-anchor:middle; }
      .lbl { font-size:13px; font-weight:700; fill:#14213D; text-anchor:middle; }
      .lbl-light { font-size:13px; font-weight:700; fill:#FBFAF7; text-anchor:middle; }
      .ex { font-size:11.5px; fill:#55606F; text-anchor:middle; }
      .ex-light { font-size:11.5px; fill:#EAF0F8; text-anchor:middle; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .footsub { font-size:12.5px; fill:#55606F; text-anchor:middle; font-style:italic; }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/>
    </marker>
  </defs>

  <rect width="980" height="560" class="paper"/>
  <text x="40" y="42" class="kicker">DEEL 14 · COGNITIEVE INVALSHOEK</text>
  <text x="40" y="72" class="title">Het ABC-model — met Aisha als voorbeeld</text>

  <!-- A -->
  <rect x="40" y="140" width="190" height="150" rx="12" class="box"/>
  <text x="135" y="180" class="letter">A</text>
  <text x="135" y="202" class="lbl">Activating event</text>
  <text x="135" y="228" class="ex">gewone taak</text>
  <text x="135" y="244" class="ex">op het werk</text>

  <path d="M230 215 L275 215" class="arrow"/>

  <!-- B -->
  <rect x="280" y="140" width="220" height="150" rx="12" class="box"/>
  <text x="390" y="180" class="letter">B</text>
  <text x="390" y="202" class="lbl">Belief</text>
  <text x="390" y="228" class="ex">"ik moet dit perfect doen,</text>
  <text x="390" y="244" class="ex">anders ben ik incompetent"</text>

  <path d="M500 215 L545 215" class="arrow"/>

  <!-- C -->
  <rect x="550" y="140" width="200" height="150" rx="12" class="box-c"/>
  <text x="650" y="180" class="letter-light">C</text>
  <text x="650" y="202" class="lbl-light">Consequence</text>
  <text x="650" y="228" class="ex-light">uitputting,</text>
  <text x="650" y="244" class="ex-light">overwerken</text>

  <!-- D branching down from B -->
  <path d="M390 290 L390 340 L390 360" class="arrow"/>
  <rect x="280" y="360" width="220" height="130" rx="12" class="box"/>
  <text x="390" y="398" class="letter">D</text>
  <text x="390" y="420" class="lbl">Dispute</text>
  <text x="390" y="444" class="ex">"is het waar dat één</text>
  <text x="390" y="460" class="ex">onvolkomenheid gelijkstaat</text>
  <text x="390" y="476" class="ex">aan incompetentie?"</text>

  <!-- E from D -->
  <path d="M500 425 L545 425" class="arrow"/>
  <rect x="550" y="360" width="200" height="130" rx="12" class="box-e"/>
  <text x="650" y="398" class="letter-light">E</text>
  <text x="650" y="420" class="lbl-light">Effect</text>
  <text x="650" y="444" class="ex-light">ruimte, zonder het</text>
  <text x="650" y="460" class="ex-light">gevoel te ontkennen</text>

  <text x="490" y="530" class="footsub">Niet de gebeurtenis (A), maar de gedachte ertussen (B) bepaalt het gevoel (C) — D bevraagt B via vragen, nooit via tegenspraak (§14.4)</text>
</svg>
