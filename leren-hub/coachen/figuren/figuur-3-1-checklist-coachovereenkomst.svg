<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="'DM Sans', Arial, sans-serif" width="900" height="560" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#FBFAF7; }
      .card { fill:#FFFFFF; stroke:#B9C4D4; stroke-width:1.2; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
      .lbl { font-size:15px; font-weight:700; fill:#14213D; }
      .sub { font-size:12px; fill:#55606F; }
      .num { font-size:12px; font-weight:700; fill:#FBFAF7; text-anchor:middle; }
    </style>
  </defs>

  <rect width="900" height="560" class="paper"/>
  <text x="40" y="42" class="kicker">DEEL 3 · CONTRACTEREN</text>
  <text x="40" y="72" class="title">De coachovereenkomst — zes elementen</text>

  <!-- rij 1 -->
  <g>
    <rect x="40" y="100" width="390" height="115" rx="12" class="card"/>
    <circle cx="70" cy="128" r="14" fill="#2563A8"/><text x="70" y="132" class="num">1</text>
    <path d="M62,128 l6,7 l12,-14" stroke="#FBFAF7" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="95" y="133" class="lbl">Doel en aanleiding</text>
    <text x="65" y="158" class="sub">Waarom nu, waarom coaching —</text>
    <text x="65" y="175" class="sub">en niet advies, therapie of training.</text>
  </g>
  <g>
    <rect x="470" y="100" width="390" height="115" rx="12" class="card"/>
    <circle cx="500" cy="128" r="14" fill="#2563A8"/><text x="500" y="132" class="num">2</text>
    <path d="M492,128 l6,7 l12,-14" stroke="#FBFAF7" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="525" y="133" class="lbl">Duur en frequentie</text>
    <text x="495" y="158" class="sub">Aantal sessies, tussenpauzes,</text>
    <text x="495" y="175" class="sub">een vooraf afgesproken evaluatiemoment.</text>
  </g>

  <!-- rij 2 -->
  <g>
    <rect x="40" y="230" width="390" height="115" rx="12" class="card"/>
    <circle cx="70" cy="258" r="14" fill="#2563A8"/><text x="70" y="262" class="num">3</text>
    <path d="M62,258 l6,7 l12,-14" stroke="#FBFAF7" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="95" y="263" class="lbl">Logistiek</text>
    <text x="65" y="288" class="sub">Locatie, vorm (fysiek/online),</text>
    <text x="65" y="305" class="sub">tarief, annuleringsbeleid.</text>
  </g>
  <g>
    <rect x="470" y="230" width="390" height="115" rx="12" fill="#EAF0F8" stroke="#2563A8" stroke-width="2"/>
    <circle cx="500" cy="258" r="14" fill="#8A3324"/><text x="500" y="262" class="num">4</text>
    <path d="M492,258 l6,7 l12,-14" stroke="#FBFAF7" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="525" y="263" class="lbl">Vertrouwelijkheid</text>
    <text x="495" y="288" class="sub">Wat blijft binnen de sessie — het</text>
    <text x="495" y="305" class="sub">fundament, zie §3.3.</text>
  </g>

  <!-- rij 3 -->
  <g>
    <rect x="40" y="360" width="390" height="115" rx="12" class="card"/>
    <circle cx="70" cy="388" r="14" fill="#2563A8"/><text x="70" y="392" class="num">5</text>
    <path d="M62,388 l6,7 l12,-14" stroke="#FBFAF7" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="95" y="393" class="lbl">Rollen en verantwoordelijkheden</text>
    <text x="65" y="418" class="sub">Wat de coach wel/niet doet, wat er</text>
    <text x="65" y="435" class="sub">tussen sessies van de coachee wordt verwacht.</text>
  </g>
  <g>
    <rect x="470" y="360" width="390" height="115" rx="12" class="card"/>
    <circle cx="500" cy="388" r="14" fill="#2563A8"/><text x="500" y="392" class="num">6</text>
    <path d="M492,388 l6,7 l12,-14" stroke="#FBFAF7" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="525" y="393" class="lbl">Afspraak bij stagnatie</text>
    <text x="495" y="418" class="sub">Hoe stuur je bij of beëindig je —</text>
    <text x="495" y="435" class="sub">vooraf afgesproken, niet pas als het ongemakkelijk wordt.</text>
  </g>

  <text x="450" y="515" class="sub" text-anchor="middle" fill="#9A5F0D" font-weight="700">Element 4 (vertrouwelijkheid) is het fundament waaronder een coachee zich durft uit te spreken — §3.3.</text>
</svg>
