<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" font-family="'DM Sans', Arial, sans-serif" width="900" height="720" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#FBFAF7; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
      .lbl-light { font-size:17px; font-weight:700; fill:#FBFAF7; text-anchor:middle; }
      .sub-light { font-size:12px; fill:#EAF0F8; text-anchor:middle; }
      .edge { font-size:12px; fill:#3A3229; text-anchor:middle; }
      .edge-warn { font-size:12px; fill:#8A3324; text-anchor:middle; font-weight:700; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .sub { font-size:12.5px; fill:#55606F; text-anchor:middle; font-style:italic; }
    </style>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/>
    </marker>
  </defs>

  <rect width="900" height="720" class="paper"/>
  <text x="40" y="42" class="kicker">DEEL 11 · INTAKE EN DRIEHOEKSCONTRACT</text>
  <text x="40" y="72" class="title">De driehoek: coachee, opdrachtgever, coach</text>

  <!-- Opdrachtgever: top -->
  <circle cx="450" cy="175" r="100" fill="#3F7AB8"/>
  <text x="450" y="168" class="lbl-light">Opdrachtgever</text>
  <text x="450" y="190" class="sub-light">betaalt (mede),</text>
  <text x="450" y="206" class="sub-light">bepaalt mee het doel</text>

  <!-- Coachee: bottom-left -->
  <circle cx="220" cy="560" r="100" fill="#6FA3D6"/>
  <text x="220" y="553" class="lbl-light">Coachee</text>
  <text x="220" y="575" class="sub-light">wil zich ontwikkelen,</text>
  <text x="220" y="591" class="sub-light">niet altijd uit vrije wil</text>

  <!-- Coach: bottom-right -->
  <circle cx="680" cy="560" r="100" fill="#14213D"/>
  <text x="680" y="553" class="lbl-light">Coach</text>
  <text x="680" y="575" class="sub-light">bewaakt proces</text>
  <text x="680" y="591" class="sub-light">en grenzen</text>

  <!-- Opdrachtgever - Coachee edge -->
  <path d="M395,255 L265,470" class="arrow"/>
  <path d="M275,468 L405,257" class="arrow"/>
  <rect x="245" y="330" width="230" height="56" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.2"/>
  <text x="360" y="352" class="edge">↓ aanleiding, klachten,</text>
  <text x="360" y="368" class="edge">gewenst resultaat</text>
  <text x="360" y="380" class="edge" font-size="10.5">↑ eigen beeld (niet altijd gelijk)</text>

  <!-- Opdrachtgever - Coach edge -->
  <path d="M505,255 L635,470" class="arrow"/>
  <path d="M625,468 L495,257" class="arrow"/>
  <rect x="425" y="330" width="230" height="56" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.2"/>
  <text x="540" y="352" class="edge">↓ opdracht, verwachtingen</text>
  <text x="540" y="368" class="edge-warn">↑ procesrapportage —</text>
  <text x="540" y="380" class="edge-warn" font-size="10.5">nooit inhoud (§11.5)</text>

  <!-- Coachee - Coach edge -->
  <path d="M320,560 L580,560" class="arrow"/>
  <path d="M578,578 L322,578" class="arrow"/>
  <rect x="335" y="600" width="230" height="52" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.2"/>
  <text x="450" y="620" class="edge">→ vraag, vertrouwen</text>
  <text x="450" y="638" class="edge">← vertrouwelijkheid, ruimte om te spreken</text>

  <text x="450" y="695" class="sub">De coach navigeert tussen de belangen van coachee en opdrachtgever, zonder een van beide klakkeloos te volgen — zie Ronald, §11.6</text>
</svg>
