<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 860" font-family="'DM Sans', Arial, sans-serif" width="900" height="860" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#FBFAF7; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
      .lbl-light { font-size:16px; font-weight:700; fill:#FBFAF7; text-anchor:middle; }
      .sub-light { font-size:12px; fill:#EAF0F8; text-anchor:middle; }
      .lbl-dark { font-size:15px; font-weight:700; fill:#14213D; text-anchor:middle; }
      .sub-dark { font-size:12px; fill:#3A3229; text-anchor:middle; }
      .sub { font-size:12.5px; fill:#55606F; text-anchor:middle; font-style:italic; }
      .ring-lbl { font-size:12px; font-weight:700; letter-spacing:.08em; text-anchor:start; }
    </style>
  </defs>

  <rect width="900" height="860" class="paper"/>
  <text x="40" y="42" class="kicker">DEEL 26 · COACHEN IN ORGANISATIES</text>
  <text x="40" y="72" class="title">Organisatie als grootste systeemlaag</text>
  <text x="40" y="98" class="sub" text-anchor="start">Aansluitend op het systeemschema uit deel 16 (figuur 16-1)</text>

  <!-- concentric circles: organisatie (outer) > team (mid) > individu (inner) -->
  <circle cx="450" cy="420" r="290" fill="#6FA3D6" opacity="0.85" stroke="#E9A13B" stroke-width="3.5"/>
  <text x="450" y="165" class="ring-lbl" fill="#14213D" text-anchor="middle" font-size="15">ORGANISATIE — cultuur, ongeschreven regels</text>

  <circle cx="450" cy="420" r="195" fill="#3F7AB8" opacity="0.9"/>
  <text x="450" y="258" class="ring-lbl" fill="#FBFAF7" text-anchor="middle" font-size="14">TEAM — context en loyaliteit (deel 25)</text>

  <circle cx="450" cy="420" r="105" fill="#14213D"/>
  <text x="450" y="405" class="lbl-light" font-size="17">Individu</text>
  <text x="450" y="428" class="sub-light">coachee binnen</text>
  <text x="450" y="444" class="sub-light">team en organisatie</text>

  <!-- systemische vraag callout, connected by pointer to outer ring -->
  <rect x="60" y="620" width="780" height="150" rx="14" fill="#FFFFFF" stroke="#8A3324" stroke-width="1.5"/>
  <text x="450" y="652" class="lbl-dark">De systemische sleutelvraag geldt ook op organisatieniveau</text>
  <text x="450" y="680" class="sub-dark">"Wie zou het merken, en wat zou diegene ervan vinden, als je dit</text>
  <text x="450" y="700" class="sub-dark">morgen anders zou doen?" (deel 16) — consequent toegepast, ook</text>
  <text x="450" y="720" class="sub-dark">bij ongemakkelijke uitkomsten, en zonder de coachvraag zelf</text>
  <text x="450" y="740" class="sub-dark" font-weight="700" fill="#8A3324">aan te passen aan de heersende cultuur (§26.4).</text>

  <text x="450" y="815" class="sub">Geen reden om de coachvraag aan te passen aan de cultuur — wél reden om de vraag te blijven stellen</text>
</svg>
