<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="'DM Sans', Arial, sans-serif" width="900" height="600" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#FBFAF7; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
      .lbl { font-size:14px; font-weight:700; fill:#14213D; text-anchor:middle; }
      .lbl-light { font-size:14px; font-weight:700; fill:#FBFAF7; text-anchor:middle; }
      .sub { font-size:11.5px; fill:#3A3229; text-anchor:middle; }
      .sub-light { font-size:11px; fill:#EAF0F8; text-anchor:middle; }
    </style>
  </defs>

  <rect width="900" height="600" class="paper"/>
  <text x="40" y="42" class="kicker">DEEL 4 · LUISTEREN</text>
  <text x="40" y="72" class="title">Drie concentrische niveaus van luisteren</text>

  <!-- buitenste ring: niveau 3, omgeving, amber rand -->
  <circle cx="450" cy="330" r="230" fill="#6FA3D6" opacity="0.55" stroke="#E9A13B" stroke-width="3.5"/>
  <text x="450" y="128" class="lbl">Niveau 3 — Omgevingsluisteren</text>
  <text x="450" y="150" class="sub">toon, tempo, houding, energie in de ruimte</text>
  <text x="450" y="168" class="sub">— verder uitgediept in deel 18</text>

  <!-- middelste ring: niveau 2, gericht -->
  <circle cx="450" cy="330" r="150" fill="#2563A8"/>
  <text x="450" y="220" class="lbl-light">Niveau 2 — Gericht luisteren</text>
  <text x="450" y="240" class="sub-light">volledige aandacht bij de ander —</text>
  <text x="450" y="256" class="sub-light">waar een coach het grootst deel</text>
  <text x="450" y="272" class="sub-light">van de sessie wil functioneren</text>

  <!-- binnenste cirkel: niveau 1, intern -->
  <circle cx="450" cy="380" r="70" fill="#8A3324"/>
  <text x="450" y="372" class="lbl-light">Niveau 1</text>
  <text x="450" y="392" class="lbl-light">Intern</text>
  <text x="450" y="412" class="sub-light">standaardmodus,</text>
  <text x="450" y="426" class="sub-light">niet "fout"</text>

  <text x="450" y="585" class="sub" font-style="italic">Het leerdoel is niet permanent op niveau 2/3 blijven, maar merken op welk niveau u zit — en terugbewegen naar niveau 2.</text>
</svg>
