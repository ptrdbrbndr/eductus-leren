<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="'DM Sans', Arial, sans-serif" width="900" height="620" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#FBFAF7; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
      .lbl { font-size:15px; font-weight:700; fill:#14213D; text-anchor:middle; }
      .lbl-light { font-size:15px; font-weight:700; fill:#FBFAF7; text-anchor:middle; }
      .sub { font-size:11.5px; fill:#3A3229; text-anchor:middle; }
      .sub-light { font-size:11.5px; fill:#EAF0F8; text-anchor:middle; }
      .center { font-size:13px; font-weight:700; fill:#FBFAF7; text-anchor:middle; }
    </style>
  </defs>

  <rect width="900" height="620" class="paper"/>
  <text x="40" y="42" class="kicker">DEEL 1 · AFBAKENING</text>
  <text x="40" y="72" class="title">Coaching tussen vier buurdisciplines</text>

  <!-- vier hoekcirkels rond een centrum, elk met eigen kenmerk -->
  <!-- advisering: linksboven -->
  <circle cx="280" cy="210" r="130" fill="#6FA3D6" opacity="0.85"/>
  <text x="220" y="150" class="lbl-light">Advisering</text>
  <text x="220" y="172" class="sub-light">inhoudelijke oplossing</text>
  <text x="220" y="188" class="sub-light">wordt aangedragen</text>

  <!-- mentoring: rechtsboven -->
  <circle cx="620" cy="210" r="130" fill="#3F7AB8" opacity="0.85"/>
  <text x="680" y="150" class="lbl-light">Mentoring</text>
  <text x="680" y="172" class="sub-light">eigen ervaring wordt</text>
  <text x="680" y="188" class="sub-light">gedeeld als voorbeeld</text>

  <!-- training: linksonder -->
  <circle cx="280" cy="440" r="130" fill="#3F7AB8" opacity="0.85"/>
  <text x="220" y="500" class="lbl-light">Training</text>
  <text x="220" y="522" class="sub-light">vooraf vastgesteld</text>
  <text x="220" y="538" class="sub-light">programma</text>

  <!-- therapie: rechtsonder, amber-omrand = de grens die telt -->
  <circle cx="620" cy="440" r="130" fill="#8A3324" opacity="0.9" stroke="#E9A13B" stroke-width="3.5"/>
  <text x="680" y="500" class="lbl-light">Therapie</text>
  <text x="680" y="522" class="sub-light">psychisch lijden, trauma,</text>
  <text x="680" y="538" class="sub-light">niet volledig functioneren</text>

  <!-- centrum: coaching -->
  <circle cx="450" cy="325" r="105" fill="#14213D"/>
  <text x="450" y="308" class="center" font-size="18">Coaching</text>
  <text x="450" y="330" class="sub-light" font-size="12">procesbegeleiding —</text>
  <text x="450" y="346" class="sub-light" font-size="12">coach eigenaar van proces,</text>
  <text x="450" y="362" class="sub-light" font-size="12">coachee van inhoud en uitkomst</text>

  <text x="450" y="600" class="sub" fill="#9A5F0D" font-weight="700">De grens met therapie is de enige zonder ruimte voor interpretatie — zie Femke, §1.3</text>
</svg>
