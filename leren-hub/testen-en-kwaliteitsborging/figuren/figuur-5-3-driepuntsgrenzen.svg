<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'DM Sans', Arial, sans-serif" width="960" height="460" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .mono { font-family: 'Courier New', monospace; }
</style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arramb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#9A5F0D"/></marker>
    </defs>
<rect width="960" height="460" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 5 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">De grenzen uitvergroot</text>
<text x="40" y="90" class="sub">Driepuntswaarden op de ondergrens (0,1) en de bovengrens (1,0) van het fte-percentage.</text>
<text x="280" y="125" class="label" text-anchor="middle" font-size="14">Ondergrens 0,1</text>
<rect x="95" y="155" width="110" height="60" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="150" y="191" class="label" text-anchor="middle" font-size="15">0,0</text>
<rect x="225" y="155" width="110" height="60" rx="6" fill="#2563A8" stroke="#E9A13B" stroke-width="2.5"/>
<text x="280" y="191" class="label-light" text-anchor="middle" font-size="15">0,1</text>
<rect x="355" y="155" width="110" height="60" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="410" y="191" class="label" text-anchor="middle" font-size="15">0,2</text>
<line x1="150" y1="245" x2="410" y2="245" stroke="#55606F" stroke-width="1"/>
<text x="680" y="125" class="label" text-anchor="middle" font-size="14">Bovengrens 1,0</text>
<rect x="495" y="155" width="110" height="60" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="550" y="191" class="label" text-anchor="middle" font-size="15">0,9</text>
<rect x="625" y="155" width="110" height="60" rx="6" fill="#2563A8" stroke="#E9A13B" stroke-width="2.5"/>
<text x="680" y="191" class="label-light" text-anchor="middle" font-size="15">1,0</text>
<rect x="755" y="155" width="110" height="60" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="810" y="191" class="label" text-anchor="middle" font-size="15">1,1</text>
<line x1="550" y1="245" x2="810" y2="245" stroke="#55606F" stroke-width="1"/>
<text x="480" y="340" text-anchor="middle" class="sub" fill="#9A5F0D">Waar een regel een getal noemt, ligt een grens — en die verdient minstens drie testgevallen.</text>

</svg>