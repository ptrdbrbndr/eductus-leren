<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'DM Sans', Arial, sans-serif" width="960" height="640" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .label { font-size:12px; font-weight:700; fill:#14213D; }
      .sub { font-size:10.5px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:26px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    </style>
</defs>
<rect width="960" height="640" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 15 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Het omgevingenlandschap als opeenvolgende ringen</text>
<text x="40" y="92" class="sub">Van geïsoleerd (ontwikkelomgeving) naar productiegelijkend (ketentest- en performanceomgeving).</text>

<circle cx="330" cy="380" r="215" fill="#FFFFFF" stroke="#CBDCEF" stroke-width="2"/>
<circle cx="330" cy="380" r="170" fill="#FBFAF7" stroke="#6FA3D6" stroke-width="2"/>
<circle cx="330" cy="380" r="125" fill="#FFFFFF" stroke="#3F7AB8" stroke-width="2"/>
<circle cx="330" cy="380" r="80" fill="#CBDCEF" stroke="#2563A8" stroke-width="2"/>
<circle cx="330" cy="380" r="38" fill="#2563A8"/>

<text x="330" y="376" text-anchor="middle" fill="#FBFAF7" font-size="10.5" font-weight="700">KETENTEST /</text>
<text x="330" y="390" text-anchor="middle" fill="#FBFAF7" font-size="10.5" font-weight="700">PERFORMANCE</text>

<text x="330" y="315" text-anchor="middle" class="sub" font-weight="700">acceptatie</text>
<text x="330" y="248" text-anchor="middle" class="sub" font-weight="700">integratie</text>
<text x="330" y="178" text-anchor="middle" class="sub" font-weight="700">ontwikkeling (per team)</text>

<!-- legend / table on the right -->
<g>
<rect x="600" y="130" width="320" height="46" fill="#2563A8"/>
<text x="620" y="158" fill="#FBFAF7" font-size="10.5" font-weight="700">OMGEVING</text>
<text x="800" y="158" fill="#FBFAF7" font-size="10.5" font-weight="700">REPRESENTATIVITEIT</text>

<rect x="600" y="176" width="320" height="40" fill="#FFFFFF" stroke="#D9D5C8"/>
<text x="620" y="200" class="sub">Ontwikkelomgeving</text><text x="800" y="200" class="sub">laag</text>

<rect x="600" y="216" width="320" height="40" fill="#F4F2EC" stroke="#D9D5C8"/>
<text x="620" y="240" class="sub">Integratieomgeving</text><text x="800" y="240" class="sub">gemiddeld–hoog</text>

<rect x="600" y="256" width="320" height="40" fill="#FFFFFF" stroke="#D9D5C8"/>
<text x="620" y="280" class="sub">Ketentestomgeving (+ Vestara)</text><text x="800" y="280" class="sub">hoog</text>

<rect x="600" y="296" width="320" height="40" fill="#F4F2EC" stroke="#D9D5C8"/>
<text x="620" y="320" class="sub">Acceptatieomgeving</text><text x="800" y="320" class="sub">hoog (UX)</text>

<rect x="600" y="336" width="320" height="40" fill="#FFFFFF" stroke="#D9D5C8"/>
<text x="620" y="360" class="sub">Performanceomgeving</text><text x="800" y="360" class="sub">hoog (volume)</text>
</g>

<rect x="130" y="580" width="700" height="46" rx="8" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
<text x="480" y="608" text-anchor="middle" class="sub" fill="#9A5F0D">Eén omgeving die te veel doelen tegelijk probeert te zijn, is de nieuwe T5</text>
</svg>
