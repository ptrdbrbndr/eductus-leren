<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="'DM Sans', Arial, sans-serif" width="960" height="680" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-dark { fill:#2563A8; }
      .label { font-size:11.5px; font-weight:700; fill:#14213D; }
      .label-light { font-size:12px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:10.5px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:26px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .connect { stroke:#55606F; stroke-width:1.3; stroke-dasharray:4 3; fill:none; }
    </style>
</defs>
<rect width="960" height="680" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 15 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Eén gedeelde, geversioneerde bronset</text>
<text x="40" y="92" class="sub">Vijf teamspecifieke aanvullingen eromheen, elk herleidbaar naar de bronversie.</text>

<circle cx="480" cy="360" r="100" class="blue-dark"/>
<text x="480" y="350" text-anchor="middle" fill="#FBFAF7" font-size="14" font-weight="700">BRONSET</text>
<text x="480" y="370" text-anchor="middle" fill="#DFDCD3" font-size="10.5">v2.4 — met</text>
<text x="480" y="384" text-anchor="middle" fill="#DFDCD3" font-size="10.5">versiebeheer</text>

<!-- five satellites -->
<g>
<path d="M410 300 L280 210" class="connect"/>
<rect x="140" y="160" width="200" height="60" rx="8" fill="#FFFFFF" class="blue-line" stroke-width="1.3"/>
<text x="240" y="184" text-anchor="middle" class="label" font-size="10.5">PORTAALTEAM</text>
<text x="240" y="202" text-anchor="middle" class="sub">+ scherm-scenario's</text>
</g>
<g>
<path d="M560 285 L680 175" class="connect"/>
<rect x="620" y="130" width="200" height="60" rx="8" fill="#FFFFFF" class="blue-line" stroke-width="1.3"/>
<text x="720" y="154" text-anchor="middle" class="label" font-size="10.5">SALARISVERWERKER</text>
<text x="720" y="172" text-anchor="middle" class="sub">+ koppelvlakscenario's</text>
</g>
<g>
<path d="M580 380 L780 400" class="connect"/>
<rect x="740" y="370" width="200" height="60" rx="8" fill="#FFFFFF" class="blue-line" stroke-width="1.3"/>
<text x="840" y="394" text-anchor="middle" class="label" font-size="10.5">BESTANDSAANLEVERING</text>
<text x="840" y="412" text-anchor="middle" class="sub">+ batchscenario's</text>
</g>
<g>
<path d="M500 455 L410 540" class="connect"/>
<rect x="290" y="530" width="220" height="60" rx="8" fill="#FFFFFF" class="blue-line" stroke-width="1.3"/>
<text x="400" y="554" text-anchor="middle" class="label" font-size="10.5">TELEFONISCHE MUTATIE</text>
<text x="400" y="572" text-anchor="middle" class="sub">+ handmatige-invoerscenario's</text>
</g>
<g>
<path d="M400 320 L180 380" class="connect"/>
<rect x="30" y="350" width="200" height="60" rx="8" fill="#FFFFFF" class="blue-line" stroke-width="1.3"/>
<text x="130" y="374" text-anchor="middle" class="label" font-size="10.5">KERNINTEGRATIE</text>
<text x="130" y="392" text-anchor="middle" class="sub">+ dekkingsscenario's</text>
</g>

<rect x="130" y="615" width="700" height="46" rx="8" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
<text x="480" y="643" text-anchor="middle" class="sub" fill="#9A5F0D">Zonder coördinatie: vijf incompatibele datasets, een ketentest onmogelijk</text>
</svg>
