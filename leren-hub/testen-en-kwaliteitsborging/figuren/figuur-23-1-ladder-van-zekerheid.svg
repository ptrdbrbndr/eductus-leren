<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="'DM Sans', Arial, sans-serif" width="960" height="660" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
</defs>
<rect width="960" height="660" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 23 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">De ladder van zekerheid — vier treden</text>
<text x="40" y="96" class="sub">Elke bewering in een testrapport hoort op een van deze vier treden geplaatst te worden, expliciet.</text>

<path d="M700 130 L860 130" class="arrow"/>
<text x="780" y="122" text-anchor="middle" class="sub">toenemende zekerheid</text>

<!-- step 1: aangenomen -->
<rect x="90" y="460" width="190" height="120" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="106" y="486" class="label" font-size="13">1 · AANGENOMEN</text>
<text x="106" y="510" class="sub" font-size="11">veronderstelling, nog</text>
<text x="106" y="526" class="sub" font-size="11">niet getoetst, mede</text>
<text x="106" y="542" class="sub" font-size="11">bepalend voor de</text>
<text x="106" y="558" class="sub" font-size="11">berekening</text>

<!-- step 2: aannemelijk -->
<rect x="280" y="380" width="190" height="200" fill="#CBDCEF" stroke="#2563A8" stroke-width="1.5"/>
<text x="296" y="406" class="label" font-size="13">2 · AANNEMELIJK</text>
<text x="296" y="430" class="sub" font-size="11">deelwaarneming,</text>
<text x="296" y="446" class="sub" font-size="11">deskundig oordeel —</text>
<text x="296" y="462" class="sub" font-size="11">geen volledige</text>
<text x="296" y="478" class="sub" font-size="11">verificatie</text>

<!-- step 3: herhaalbaar vastgesteld -->
<rect x="470" y="280" width="200" height="300" fill="#6FA3D6" stroke="#2563A8" stroke-width="1.5"/>
<text x="486" y="306" class="label-light" font-size="13">3 · HERHAALBAAR</text>
<text x="486" y="324" class="label-light" font-size="13">VASTGESTELD</text>
<text x="486" y="350" class="sub-light" font-size="11">meerdere testruns,</text>
<text x="486" y="366" class="sub-light" font-size="11">consistente uitkomst,</text>
<text x="486" y="382" class="sub-light" font-size="11">geen volledig</text>
<text x="486" y="398" class="sub-light" font-size="11">onafhankelijke</text>
<text x="486" y="414" class="sub-light" font-size="11">tweede verificatie</text>

<!-- step 4: aangetoond -->
<rect x="670" y="170" width="220" height="410" fill="#2563A8" stroke="#E9A13B" stroke-width="3"/>
<text x="686" y="200" class="label-light" font-size="13">4 · AANGETOOND</text>
<text x="686" y="228" class="sub-light" font-size="11">onafhankelijk</text>
<text x="686" y="244" class="sub-light" font-size="11">geverifieerd,</text>
<text x="686" y="260" class="sub-light" font-size="11">reproduceerbaar —</text>
<text x="686" y="276" class="sub-light" font-size="11">bijv. via een tweede,</text>
<text x="686" y="292" class="sub-light" font-size="11">onafhankelijke</text>
<text x="686" y="308" class="sub-light" font-size="11">parallelberekening</text>

<text x="480" y="628" text-anchor="middle" class="sub" fill="#9A5F0D">"Getest" zonder trede is, op dit niveau, geen informatie — het is een nieuwe vorm van T8.</text>
</svg>
