<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="'DM Sans', Arial, sans-serif" width="960" height="520" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .mono { font-family: 'Courier New', monospace; }
</style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arramb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#9A5F0D"/></marker>
    </defs>
<rect width="960" height="520" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 2 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Zonder testbasis geen linkercirkel</text>
<text x="40" y="90" class="sub">Wat het systeem doet, en wat er getest is — de sikkel ertussen is pas zichtbaar mét een testbasis.</text>
<circle cx="400" cy="300" r="140" fill="#6FA3D6" opacity="0.75"/>
<circle cx="560" cy="300" r="140" fill="#2563A8" opacity="0.75"/>
<text x="340" y="220" class="label" text-anchor="middle" font-size="13">Wat het systeem doet</text>
<text x="620" y="220" class="label-light" text-anchor="middle" font-size="13">Wat er getest is</text>
<text x="480" y="305" class="label-light" text-anchor="middle" font-size="13">gedekt</text>
<rect x="330" y="380" width="300" height="60" rx="8" fill="#FBFAF7" stroke="#E9A13B" stroke-width="2" stroke-dasharray="5 3"/>
<text x="480" y="405" class="sub" text-anchor="middle" font-size="11" fill="#9A5F0D">zonder testbasis: deze cirkel is</text>
<text x="480" y="422" class="sub" text-anchor="middle" font-size="11" fill="#9A5F0D">niet te tekenen — dus ook de sikkel niet</text>
<text x="480" y="470" text-anchor="middle" class="sub" fill="#9A5F0D">Met testbasis weet je wat je niet hebt getest — alleen dát is bruikbaar voor een besluit.</text>

</svg>