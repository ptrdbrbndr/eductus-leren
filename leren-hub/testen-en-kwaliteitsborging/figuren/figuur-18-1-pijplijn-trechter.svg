<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="'DM Sans', Arial, sans-serif" width="960" height="520" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .label { font-size:12.5px; font-weight:700; fill:#14213D; }
      .label-light { font-size:12.5px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:10.5px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:26px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#55606F"/></marker>
</defs>
<rect width="960" height="520" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 18 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">De pijplijn als trechter</text>
<text x="40" y="92" class="sub">Snel en smal bij elke commit, breder en trager naarmate het risico van een gemiste afwijking toeneemt.</text>

<polygon points="100,150 240,150 300,320 40,320" fill="#CBDCEF" stroke="#2563A8" stroke-width="1.3"/>
<text x="170" y="180" text-anchor="middle" class="label" font-size="11">COMMIT-FASE</text>
<text x="170" y="200" text-anchor="middle" class="sub">bij elke wijziging</text>
<text x="170" y="290" text-anchor="middle" class="sub">componenttests,</text>
<text x="170" y="304" text-anchor="middle" class="sub">statische analyse</text>

<path d="M300 235 L340 235" class="arrow"/>

<polygon points="340,150 470,150 550,340 260,340" fill="#6FA3D6" stroke="#2563A8" stroke-width="1.3" transform="translate(20,0)"/>
<text x="425" y="180" text-anchor="middle" class="label" font-size="11">INTEGRATIEFASE</text>
<text x="425" y="200" text-anchor="middle" class="sub">bij samenvoeging</text>
<text x="425" y="305" text-anchor="middle" class="sub">integratie- en</text>
<text x="425" y="319" text-anchor="middle" class="sub">contracttests</text>

<path d="M570 250 L610 250" class="arrow"/>

<polygon points="580,150 730,150 830,370 480,370" fill="#3F7AB8" stroke="#2563A8" stroke-width="1.3" transform="translate(40,0)"/>
<text x="695" y="180" text-anchor="middle" class="label-light" font-size="11">KETENFASE</text>
<text x="695" y="200" text-anchor="middle" fill="#DFDCD3" font-size="10.5">vóór een release</text>
<text x="695" y="335" text-anchor="middle" fill="#DFDCD3" font-size="10.5">volledige ketentest,</text>
<text x="695" y="349" text-anchor="middle" fill="#DFDCD3" font-size="10.5">incl. Vestara</text>

<path d="M860 270 L900 270" class="arrow"/>

<polygon points="860,150 1040,150 1160,400 740,400" fill="#14213D" transform="translate(-160,0)"/>
<text x="870" y="180" text-anchor="middle" class="label-light" font-size="11">PRODUCTIEFASE</text>
<text x="870" y="200" text-anchor="middle" fill="#DFDCD3" font-size="10.5">na deploy</text>
<text x="870" y="365" text-anchor="middle" fill="#DFDCD3" font-size="10.5">monitoring,</text>
<text x="870" y="379" text-anchor="middle" fill="#DFDCD3" font-size="10.5">canary-analyse</text>

<rect x="130" y="440" width="700" height="50" rx="8" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
<text x="480" y="460" text-anchor="middle" class="sub" fill="#9A5F0D">Groen licht is een uitspraak over de tests die erin zitten —</text>
<text x="480" y="478" text-anchor="middle" class="sub" fill="#9A5F0D">niet over de kwaliteit van het systeem</text>
</svg>
