<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .mono { font-family: 'Courier New', monospace; }
</style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arramb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#9A5F0D"/></marker>
    </defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 1 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Het rapport waar niemand op tegen was</text>
<text x="40" y="90" class="sub">Elk cijfer in dit testrapport klopt — en toch is het het duurste document van het jaar.</text>
<rect x="280" y="115" width="400" height="420" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<rect x="280" y="115" width="400" height="46" rx="8" fill="#2563A8"/>
<rect x="280" y="140" width="400" height="21" fill="#2563A8"/>
<text x="480" y="143" class="label-light" text-anchor="middle" font-size="13">Acceptatietestrapport WGP 2.0</text>
<text x="480" y="178" class="sub" text-anchor="middle">samenvatting — pagina 2 van 14</text>
<line x1="305" y1="228" x2="655" y2="228" stroke="#DFDCD3" stroke-width="1"/>
<text x="305" y="210" class="sub" font-size="13">Uitgevoerde testgevallen</text>
<text x="655" y="210" class="label" text-anchor="end" font-size="13">312</text>
<line x1="305" y1="262" x2="655" y2="262" stroke="#DFDCD3" stroke-width="1"/>
<text x="305" y="244" class="sub" font-size="13">Geslaagd</text>
<text x="655" y="244" class="label" text-anchor="end" font-size="13">306 (98,1%)</text>
<line x1="305" y1="296" x2="655" y2="296" stroke="#DFDCD3" stroke-width="1"/>
<text x="305" y="278" class="sub" font-size="13">Gefaald</text>
<text x="655" y="278" class="label" text-anchor="end" font-size="13">0</text>
<line x1="305" y1="330" x2="655" y2="330" stroke="#DFDCD3" stroke-width="1"/>
<text x="305" y="312" class="sub" font-size="13">Niet uitgevoerd</text>
<text x="655" y="312" class="label" text-anchor="end" font-size="13">6 (geen testdata)</text>
<line x1="305" y1="364" x2="655" y2="364" stroke="#DFDCD3" stroke-width="1"/>
<text x="305" y="346" class="sub" font-size="13">Open bevindingen</text>
<text x="655" y="346" class="label" text-anchor="end" font-size="13">6, alle prioriteit laag</text>
<rect x="305" y="386" width="350" height="46" rx="8" fill="#FBFAF7" stroke="#E9A13B" stroke-width="2.5"/>
<text x="480" y="414" class="label" text-anchor="middle" font-size="14" fill="#9A5F0D">Advies: gereed voor productie</text>
<text x="480" y="585" text-anchor="middle" class="sub" fill="#9A5F0D">Zes weken later: 31 uur live, toen teruggedraaid. Geen van deze cijfers zag het aankomen.</text>

</svg>