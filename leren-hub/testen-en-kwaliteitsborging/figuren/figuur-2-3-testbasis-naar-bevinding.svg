<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" font-family="'DM Sans', Arial, sans-serif" width="1000" height="480" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .mono { font-family: 'Courier New', monospace; }
</style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arramb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#9A5F0D"/></marker>
    </defs>
<rect width="1000" height="480" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 2 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Van testbasis naar bevinding</text>
<text x="40" y="90" class="sub">Welk werkproduct uit welke activiteit ontstaat, en welke verwijzingen ertussen lopen.</text>
<rect x="45" y="200" width="165" height="100" rx="8" fill="#2563A8" stroke="#2563A8" stroke-width="1.5"/>
<text x="127.5" y="238" class="label-light" text-anchor="middle" font-size="13">Testbasis</text>
<text x="127.5" y="260" class="sub-light" text-anchor="middle" font-size="10.5">eisen, regels, wetgeving</text>
<path d="M210 250 L234 250" class="arrow-b"/>
<rect x="240" y="200" width="165" height="100" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="322.5" y="238" class="label" text-anchor="middle" font-size="13">Testconditie</text>
<text x="322.5" y="260" class="sub" text-anchor="middle" font-size="10.5">analyse</text>
<path d="M405 250 L429 250" class="arrow-b"/>
<rect x="435" y="200" width="165" height="100" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="517.5" y="238" class="label" text-anchor="middle" font-size="13">Testgeval</text>
<text x="517.5" y="260" class="sub" text-anchor="middle" font-size="10.5">ontwerp</text>
<path d="M600 250 L624 250" class="arrow-b"/>
<rect x="630" y="200" width="165" height="100" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="712.5" y="238" class="label" text-anchor="middle" font-size="13">Testuitvoering</text>
<text x="712.5" y="260" class="sub" text-anchor="middle" font-size="10.5">implementatie + uitvoering</text>
<path d="M795 250 L819 250" class="arrow-b"/>
<rect x="825" y="200" width="165" height="100" rx="8" fill="#2563A8" stroke="#2563A8" stroke-width="1.5"/>
<text x="907.5" y="238" class="label-light" text-anchor="middle" font-size="13">Bevinding</text>
<text x="907.5" y="260" class="sub-light" text-anchor="middle" font-size="10.5">afwijking vastgelegd</text>
<text x="500" y="150" class="sub" text-anchor="middle" font-size="11">voorwaartse traceerbaarheid — welke eis leidt tot welke bevinding?</text>
<path d="M900 250 C 950 300, 950 350, 500 400 C 200 440, 100 350, 100 300" stroke="#55606F" stroke-width="1.2" fill="none" stroke-dasharray="3 3" marker-end="url(#arr)"/>
<text x="500" y="425" class="sub" text-anchor="middle" font-size="11">achterwaarts: waarom bestaat dit testgeval nog?</text>
<text x="500" y="460" text-anchor="middle" class="sub" fill="#9A5F0D">Elk werkproduct heeft een andere lezer — dat bepaalt de vorm, niet de gewoonte.</text>

</svg>