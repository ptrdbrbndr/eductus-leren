<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="'DM Sans', Arial, sans-serif" width="960" height="480" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .mono { font-family: 'Courier New', monospace; }
</style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arramb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#9A5F0D"/></marker>
    </defs>
<rect width="960" height="480" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 9 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Twee rapporten, dezelfde feiten</text>
<text x="40" y="90" class="sub">Het originele WGP 2.0-rapport naast een besluitvormende variant.</text>
<rect x="90" y="130" width="360" height="300" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="270" y="162" class="label" text-anchor="middle" font-size="14">Origineel</text>
<text x="270" y="194" class="sub" text-anchor="middle" font-size="11.5">312 testgevallen, 306 geslaagd</text>
<text x="270" y="216" class="sub" text-anchor="middle" font-size="11.5">98,1% — advies: gereed</text>
<text x="270" y="238" class="sub" text-anchor="middle" font-size="11.5">(geen risico's genoemd,</text>
<text x="270" y="260" class="sub" text-anchor="middle" font-size="11.5">geen onzekerheid uitgeschreven)</text>
<rect x="510" y="130" width="360" height="300" rx="8" fill="#2563A8" stroke="#2563A8" stroke-width="1.5"/>
<text x="690" y="162" class="label-light" text-anchor="middle" font-size="14">Besluitvormend</text>
<text x="690" y="194" class="sub-light" text-anchor="middle" font-size="11">wat is vastgesteld, per risiconiveau</text>
<text x="690" y="216" class="sub-light" text-anchor="middle" font-size="11">wat niet is onderzocht, en waarom</text>
<text x="690" y="238" class="sub-light" text-anchor="middle" font-size="11">resterende onzekerheid, uitgeschreven</text>
<text x="690" y="260" class="sub-light" text-anchor="middle" font-size="11">advies zonder het besluit te nemen</text>
<text x="480" y="460" text-anchor="middle" class="sub" fill="#9A5F0D">Dezelfde feiten — radicaal verschillend leesbaar voor wie moet besluiten.</text>

</svg>