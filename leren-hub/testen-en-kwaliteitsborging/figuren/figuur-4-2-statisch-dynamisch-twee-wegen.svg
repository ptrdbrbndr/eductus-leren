<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="'DM Sans', Arial, sans-serif" width="960" height="480" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .mono { font-family: 'Courier New', monospace; }
</style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arramb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#9A5F0D"/></marker>
    </defs>
<rect width="960" height="480" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 4 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Twee wegen naar dezelfde afwijking</text>
<text x="40" y="90" class="sub">Statisch en dynamisch testen zijn complementair — verschillend van kostprijs, niet van doel.</text>
<text x="480" y="130" class="label" text-anchor="middle" font-size="14">De tegenstrijdigheid hoofdstuk 4 / bijlage B</text>
<rect x="120" y="180" width="320" height="140" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="280" y="210" class="label" text-anchor="middle" font-size="14">Statisch testen</text>
<text x="280" y="236" class="sub" text-anchor="middle" font-size="11">document lezen, geen uitvoering</text>
<text x="280" y="254" class="sub" text-anchor="middle" font-size="11">vindt: tegenstrijdigheid direct</text>
<rect x="190" y="278" width="180" height="30" rx="8" fill="#FBFAF7" stroke="#E9A13B" stroke-width="2"/>
<text x="280" y="298" class="sub" text-anchor="middle" font-size="11" fill="#9A5F0D">kosten: 1 uur</text>
<rect x="520" y="180" width="320" height="140" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="680" y="210" class="label" text-anchor="middle" font-size="14">Dynamisch testen</text>
<text x="680" y="236" class="sub" text-anchor="middle" font-size="11">systeem draaien, gedrag waarnemen</text>
<text x="680" y="254" class="sub" text-anchor="middle" font-size="11">vindt: pas bij livegang, als het misgaat</text>
<rect x="590" y="278" width="180" height="30" rx="8" fill="#2563A8" stroke="#E9A13B" stroke-width="2"/>
<text x="680" y="298" class="sub-light" text-anchor="middle" font-size="11">kosten: 6 weken</text>
<path d="M280 180 L400 145" class="arrow-b"/>
<path d="M680 180 L560 145" class="arrow-b"/>
<text x="480" y="420" text-anchor="middle" class="sub" fill="#9A5F0D">De goedkoopste plek om een fout te vinden is de plek waar zij nog geen naam heeft.</text>

</svg>