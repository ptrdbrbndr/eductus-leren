<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="'DM Sans', Arial, sans-serif" width="960" height="500" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .mono { font-family: 'Courier New', monospace; }
</style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arramb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#9A5F0D"/></marker>
    </defs>
<rect width="960" height="500" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 3 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Shift-left en shift-right</text>
<text x="40" y="90" class="sub">Twee bewegingen rond hetzelfde middelpunt: de livegang.</text>
<line x1="140" y1="300" x2="820" y2="300" stroke="#55606F" stroke-width="1.5"/>
<circle cx="480" cy="300" r="10" fill="#E9A13B"/>
<text x="480" y="334" class="label" text-anchor="middle" font-size="13" fill="#9A5F0D">Livegang</text>
<path d="M440 300 L170 300" class="arrow-b"/>
<path d="M520 300 L790 300" class="arrow-b"/>
<rect x="150" y="150" width="260" height="100" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="280" y="182" class="label" text-anchor="middle" font-size="14">Shift-left</text>
<text x="280" y="204" class="sub" text-anchor="middle" font-size="10.5">meelezen bij acceptatiecriteria,</text>
<text x="280" y="220" class="sub" text-anchor="middle" font-size="10.5">testontwerp naast de bouw,</text>
<text x="280" y="236" class="sub" text-anchor="middle" font-size="10.5">statisch testen vooraf</text>
<rect x="550" y="150" width="260" height="100" rx="8" fill="#2563A8" stroke="#2563A8" stroke-width="1.5"/>
<text x="680" y="182" class="label-light" text-anchor="middle" font-size="14">Shift-right</text>
<text x="680" y="204" class="sub-light" text-anchor="middle" font-size="10.5">monitoring, foutregistratie,</text>
<text x="680" y="220" class="sub-light" text-anchor="middle" font-size="10.5">gebruikersgedrag na livegang</text>
<text x="680" y="236" class="sub-light" text-anchor="middle" font-size="10.5">als bron van testkennis</text>
<text x="480" y="440" text-anchor="middle" class="sub" fill="#9A5F0D">Shift-right vervangt vooraf testen niet — het erkent wat pas onder echte belasting blijkt.</text>

</svg>