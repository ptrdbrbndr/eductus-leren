<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" font-family="'DM Sans', Arial, sans-serif" width="960" height="700" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .label { font-size:15px; font-weight:700; fill:#14213D; }
      .label-light { font-size:15px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:11.5px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:26px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563A8"/></marker>
</defs>
<rect width="960" height="700" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 11 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Het VOICE-model als cirkel</text>
<text x="40" y="92" class="sub">Waarde stuurt doelstellingen, doelstellingen sturen indicatoren — en de cirkel sluit zichzelf via evaluatie terug naar waarde.</text>

<circle cx="480" cy="400" r="215" fill="none" stroke="#D9D5C8" stroke-width="1.5" stroke-dasharray="3 5"/>

<path d="M480 205 A215 215 0 0 1 670 342" class="arrow"/>
<path d="M670 342 A215 215 0 0 1 598 566" class="arrow"/>
<path d="M598 566 A215 215 0 0 1 363 566" class="arrow"/>
<path d="M363 566 A215 215 0 0 1 290 342" class="arrow"/>
<path d="M290 342 A215 215 0 0 1 458 208" class="arrow"/>

<g>
  <rect x="390" y="150" width="180" height="66" rx="8" class="blue-dark"/>
  <text x="480" y="177" text-anchor="middle" class="label-light">WAARDE</text>
  <text x="480" y="197" text-anchor="middle" class="sub" fill="#DFDCD3" font-size="10.5">value — de bedrijfswaarde</text>
</g>
<g>
  <rect x="595" y="300" width="200" height="66" rx="8" fill="#FFFFFF" class="blue-line" stroke-width="1.5"/>
  <text x="695" y="327" text-anchor="middle" class="label">DOELSTELLINGEN</text>
  <text x="695" y="347" text-anchor="middle" class="sub" font-size="10.5">objectives — meetbare vertaling</text>
</g>
<g>
  <rect x="518" y="500" width="200" height="66" rx="8" fill="#FFFFFF" class="blue-line" stroke-width="1.5"/>
  <text x="618" y="527" text-anchor="middle" class="label">INDICATOREN</text>
  <text x="618" y="547" text-anchor="middle" class="sub" font-size="10.5">indicators — nooit één, in isolatie</text>
</g>
<g>
  <rect x="242" y="500" width="200" height="66" rx="8" fill="#FFFFFF" class="blue-line" stroke-width="1.5"/>
  <text x="342" y="527" text-anchor="middle" class="label">VERANDERING</text>
  <text x="342" y="547" text-anchor="middle" class="sub" font-size="10.5">change — bijsturen bij afwijking</text>
</g>
<g>
  <rect x="165" y="300" width="200" height="66" rx="8" fill="#FFFFFF" class="blue-line" stroke-width="1.5"/>
  <text x="265" y="327" text-anchor="middle" class="label">EVALUATIE</text>
  <text x="265" y="347" text-anchor="middle" class="sub" font-size="10.5">evaluation — periodiek herijken</text>
</g>

<text x="480" y="405" text-anchor="middle" class="sub" font-style="italic">terug naar waarde</text>

<rect x="140" y="628" width="680" height="46" rx="8" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
<text x="480" y="656" text-anchor="middle" class="sub" fill="#9A5F0D">Frank Duikers "een percentage" is één indicator uit een cirkel — nooit het hele verhaal</text>
</svg>
