<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="'DM Sans', Arial, sans-serif" width="960" height="600" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-dark { fill:#2563A8; }
      .label { font-size:13.5px; font-weight:700; fill:#14213D; }
      .label-light { font-size:13.5px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:11.5px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:26px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .connect { stroke:#55606F; stroke-width:1.3; stroke-dasharray:4 3; }
    </style>
</defs>
<rect width="960" height="600" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 11 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Teststages naast ISTQB-testniveaus</text>
<text x="40" y="92" class="sub">Overlap in wát wordt getest — verschil in wíe het draagt.</text>

<text x="255" y="130" text-anchor="middle" class="sub" font-weight="700" fill="#2563A8">TMAP-TESTSTAGE</text>
<text x="705" y="130" text-anchor="middle" class="sub" font-weight="700" fill="#55606F">ISTQB-TESTNIVEAU (NIVEAU 1)</text>

<rect x="80" y="150" width="350" height="80" rx="8" class="blue-dark"/>
<text x="255" y="182" text-anchor="middle" class="label-light">TEAMTEST</text>
<text x="255" y="204" text-anchor="middle" class="sub" fill="#DFDCD3" font-size="10.5">het team test wat het zelf bouwt,</text>
<text x="255" y="218" text-anchor="middle" class="sub" fill="#DFDCD3" font-size="10.5">incl. samenwerking van componenten</text>

<rect x="530" y="150" width="350" height="80" rx="8" fill="#FFFFFF" class="blue-line" stroke-width="1.5"/>
<text x="705" y="182" text-anchor="middle" class="label">COMPONENT- EN INTEGRATIETEST</text>
<line x1="430" y1="190" x2="530" y2="190" stroke="#55606F" stroke-width="1.3" stroke-dasharray="4 3"/>

<rect x="80" y="255" width="350" height="80" rx="8" class="blue-dark"/>
<text x="255" y="287" text-anchor="middle" class="label-light">BUSINESSTEST</text>
<text x="255" y="309" text-anchor="middle" class="sub" fill="#DFDCD3" font-size="10.5">representanten beoordelen of</text>
<text x="255" y="323" text-anchor="middle" class="sub" fill="#DFDCD3" font-size="10.5">de waarde wordt geleverd</text>

<rect x="530" y="255" width="350" height="80" rx="8" fill="#FFFFFF" class="blue-line" stroke-width="1.5"/>
<text x="705" y="287" text-anchor="middle" class="label">SYSTEEM- EN ACCEPTATIETEST</text>
<line x1="430" y1="295" x2="530" y2="295" stroke="#55606F" stroke-width="1.3" stroke-dasharray="4 3"/>

<rect x="80" y="360" width="350" height="80" rx="8" class="blue-dark"/>
<text x="255" y="392" text-anchor="middle" class="label-light">DEPLOY-FOR-BUSINESSTEST</text>
<text x="255" y="414" text-anchor="middle" class="sub" fill="#DFDCD3" font-size="10.5">kan de organisatie het in gebruik</text>
<text x="255" y="428" text-anchor="middle" class="sub" fill="#DFDCD3" font-size="10.5">nemen en draaiend houden?</text>

<rect x="530" y="360" width="350" height="80" rx="8" fill="#FFFFFF" class="blue-line" stroke-width="1.5"/>
<text x="705" y="400" text-anchor="middle" class="label">OPERATIONELE ACCEPTATIETEST</text>
<line x1="430" y1="400" x2="530" y2="400" stroke="#55606F" stroke-width="1.3" stroke-dasharray="4 3"/>

<rect x="130" y="475" width="700" height="46" rx="8" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
<text x="480" y="503" text-anchor="middle" class="sub" fill="#9A5F0D">Het accent verschuift van "welk niveau" naar "wie draagt de verantwoordelijkheid"</text>
</svg>
