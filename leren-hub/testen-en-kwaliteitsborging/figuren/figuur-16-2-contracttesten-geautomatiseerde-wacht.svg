<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'DM Sans', Arial, sans-serif" width="960" height="560" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-dark { fill:#2563A8; }
      .label { font-size:12.5px; font-weight:700; fill:#14213D; }
      .label-light { font-size:12.5px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:11px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:26px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563A8"/></marker>
</defs>
<rect width="960" height="560" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 16 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Contracttesten als geautomatiseerde wacht</text>
<text x="40" y="92" class="sub">Elke wijziging aan weerszijden wordt tegen hetzelfde gedeelde contract getoetst.</text>

<rect x="60" y="150" width="230" height="90" rx="8" fill="#FFFFFF" class="blue-line" stroke-width="1.5"/>
<text x="175" y="180" text-anchor="middle" class="label">PORTAALTEAM</text>
<text x="175" y="200" text-anchor="middle" class="sub">wijzigt een bericht</text>
<text x="175" y="216" text-anchor="middle" class="sub">(de aanbieder/afnemer)</text>

<path d="M290 195 L365 195" class="arrow"/>

<!-- gate -->
<rect x="375" y="140" width="210" height="200" rx="10" fill="#14213D"/>
<text x="480" y="170" text-anchor="middle" fill="#E9A13B" font-size="12" font-weight="700">CONTRACTTEST</text>
<text x="480" y="192" text-anchor="middle" fill="#DFDCD3" font-size="10.5">gedeeld, machineleesbaar</text>
<text x="480" y="207" text-anchor="middle" fill="#DFDCD3" font-size="10.5">contract</text>
<line x1="405" y1="225" x2="555" y2="225" stroke="#E9A13B" stroke-width="1.5"/>
<text x="480" y="255" text-anchor="middle" fill="#FBFAF7" font-size="10.5">breekt het contract?</text>
<text x="480" y="278" text-anchor="middle" fill="#6FA3D6" font-size="10.5">ja → test faalt direct,</text>
<text x="480" y="295" text-anchor="middle" fill="#6FA3D6" font-size="10.5">vóór het Vestara bereikt</text>
<text x="480" y="317" text-anchor="middle" fill="#6FA3D6" font-size="10.5">nee → doorgang</text>

<path d="M595 195 L670 195" class="arrow"/>

<rect x="670" y="150" width="230" height="90" rx="8" fill="#FFFFFF" class="blue-line" stroke-width="1.5"/>
<text x="785" y="180" text-anchor="middle" class="label">VESTARA</text>
<text x="785" y="200" text-anchor="middle" class="sub">ontvangt alleen berichten</text>
<text x="785" y="216" text-anchor="middle" class="sub">die het contract volgen</text>

<!-- reverse arrow: Vestara wijzigt ook -->
<path d="M785 240 L785 380 Q785 400 765 400 L610 400" class="arrow"/>
<text x="785" y="365" text-anchor="middle" class="sub" font-size="10">Vestara kan evenzeer wijzigen —</text>
<text x="785" y="380" text-anchor="middle" class="sub" font-size="10">test loopt aan beide kanten</text>

<rect x="130" y="440" width="700" height="60" rx="8" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
<text x="480" y="464" text-anchor="middle" class="sub" fill="#9A5F0D">Een contracttest bewijst dat beide kanten zich aan het contract houden —</text>
<text x="480" y="482" text-anchor="middle" class="sub" fill="#9A5F0D">niet dat het contract zelf compleet of correct is</text>
</svg>
