<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'DM Sans', Arial, sans-serif" width="960" height="560" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .mono { font-family: 'Courier New', monospace; }
</style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arramb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#9A5F0D"/></marker>
    </defs>
<rect width="960" height="560" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 9 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Zes categorieën testgereedschap</text>
<text x="40" y="90" class="sub">Bij elk stuk gereedschap: wat doet dit niet?</text>
<rect x="90" y="150" width="250" height="160" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="215" y="190" class="label" text-anchor="middle" font-size="13.5">Testmanagement</text>
<line x1="120" y1="208" x2="310" y2="208" stroke="#DFDCD3" stroke-width="1"/>
<text x="215" y="240" class="sub" text-anchor="middle" font-size="10.5" fill="#9A5F0D">niet: zelf beslissen wat</text>
<text x="215" y="256" class="sub" text-anchor="middle" font-size="10.5" fill="#9A5F0D">getest moet worden</text>
<rect x="370" y="150" width="250" height="160" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="495" y="190" class="label" text-anchor="middle" font-size="13.5">Bevindingenbeheer</text>
<line x1="400" y1="208" x2="590" y2="208" stroke="#DFDCD3" stroke-width="1"/>
<text x="495" y="240" class="sub" text-anchor="middle" font-size="10.5" fill="#9A5F0D">niet: de kwaliteit van een</text>
<text x="495" y="256" class="sub" text-anchor="middle" font-size="10.5" fill="#9A5F0D">bevinding garanderen</text>
<rect x="650" y="150" width="250" height="160" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="775" y="190" class="label" text-anchor="middle" font-size="13.5">Testautomatisering</text>
<line x1="680" y1="208" x2="870" y2="208" stroke="#DFDCD3" stroke-width="1"/>
<text x="775" y="240" class="sub" text-anchor="middle" font-size="10.5" fill="#9A5F0D">niet: testontwerp</text>
<text x="775" y="256" class="sub" text-anchor="middle" font-size="10.5" fill="#9A5F0D">vervangen</text>
<rect x="90" y="340" width="250" height="160" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="215" y="380" class="label" text-anchor="middle" font-size="13.5">Statische analyse</text>
<line x1="120" y1="398" x2="310" y2="398" stroke="#DFDCD3" stroke-width="1"/>
<text x="215" y="430" class="sub" text-anchor="middle" font-size="10.5" fill="#9A5F0D">niet: betekenisproblemen</text>
<text x="215" y="446" class="sub" text-anchor="middle" font-size="10.5" fill="#9A5F0D">vinden</text>
<rect x="370" y="340" width="250" height="160" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="495" y="380" class="label" text-anchor="middle" font-size="13.5">Prestatiegereedschap</text>
<line x1="400" y1="398" x2="590" y2="398" stroke="#DFDCD3" stroke-width="1"/>
<text x="495" y="430" class="sub" text-anchor="middle" font-size="10.5" fill="#9A5F0D">niet: interpreteren wat</text>
<text x="495" y="446" class="sub" text-anchor="middle" font-size="10.5" fill="#9A5F0D">het betekent voor risico</text>
<rect x="650" y="340" width="250" height="160" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="775" y="380" class="label" text-anchor="middle" font-size="13.5">Testdatabeheer</text>
<line x1="680" y1="398" x2="870" y2="398" stroke="#DFDCD3" stroke-width="1"/>
<text x="775" y="430" class="sub" text-anchor="middle" font-size="10.5" fill="#9A5F0D">niet: bepalen welke</text>
<text x="775" y="446" class="sub" text-anchor="middle" font-size="10.5" fill="#9A5F0D">variatie nodig is</text>
<text x="480" y="530" text-anchor="middle" class="sub" fill="#9A5F0D">Gereedschap versnelt wat al goed doordacht is — het compenseert nooit wat slecht doordacht is.</text>

</svg>