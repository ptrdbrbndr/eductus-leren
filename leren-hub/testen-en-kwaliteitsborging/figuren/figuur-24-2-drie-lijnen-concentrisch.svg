<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:13px; font-weight:700; fill:#14213D; }
      .label-light { font-size:13px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:11.5px; fill:#55606F; }
      .sub-light { font-size:11.5px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    </style>
</defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 24 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Three lines of defence — toegepast op de testfunctie</text>
<text x="40" y="96" class="sub">De testfunctie zit primair in de eerste lijn, met raakvlakken naar de tweede.</text>

<circle cx="480" cy="360" r="220" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<circle cx="480" cy="360" r="150" fill="#CBDCEF" stroke="#2563A8" stroke-width="1.5"/>
<circle cx="480" cy="360" r="80" fill="#2563A8" stroke="#E9A13B" stroke-width="3"/>

<text x="480" y="356" text-anchor="middle" class="label-light" font-size="13">EERSTE LIJN</text>
<text x="480" y="374" text-anchor="middle" class="sub-light" font-size="10.5">bouwt en test</text>

<text x="480" y="234" text-anchor="middle" class="label" font-size="13">TWEEDE LIJN</text>
<text x="480" y="252" text-anchor="middle" class="sub" font-size="10.5">risicobeheer en compliance —</text>
<text x="480" y="266" text-anchor="middle" class="sub" font-size="10.5">beoordeelt opzet en werking</text>

<text x="480" y="164" text-anchor="middle" class="label" font-size="13">DERDE LIJN</text>
<text x="480" y="182" text-anchor="middle" class="sub" font-size="10.5">interne audit — stelt onafhankelijk vast</text>
<text x="480" y="196" text-anchor="middle" class="sub" font-size="10.5">of lijn 1 en 2 doen wat zij beweren</text>

<line x1="480" y1="360" x2="620" y2="290" stroke="#55606F" stroke-width="1.2" stroke-dasharray="3,3"/>
<rect x="622" y="264" width="290" height="56" rx="6" fill="#FBFAF7" stroke="#E9A13B" stroke-width="2"/>
<text x="638" y="286" class="sub" fill="#9A5F0D" font-size="11">Hakim Osei (3e lijn) kijkt niet naar</text>
<text x="638" y="302" class="sub" fill="#9A5F0D" font-size="11">testresultaten, maar naar het testproces</text>

<text x="480" y="590" text-anchor="middle" class="sub" fill="#9A5F0D">De aanvullende, onafhankelijke toets bij een overgang van dit gewicht is de organisatorische vorm van "onafhankelijk vastgesteld".</text>
</svg>
