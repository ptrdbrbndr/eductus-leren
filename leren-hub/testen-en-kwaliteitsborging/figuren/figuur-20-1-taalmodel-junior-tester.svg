<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'DM Sans', Arial, sans-serif" width="960" height="560" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-dark { fill:#2563A8; }
      .label { font-size:13px; font-weight:700; fill:#14213D; }
      .label-light { font-size:13px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:11px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:26px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563A8"/></marker>
</defs>
<rect width="960" height="560" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 20 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Een taalmodel als enthousiaste, snelle junior tester</text>
<text x="40" y="92" class="sub">Veel output, hoog tempo, maar zonder besef van wat het niet weet — elke suggestie vereist een senior blik.</text>

<!-- junior figure -->
<circle cx="230" cy="240" r="55" fill="#CBDCEF" stroke="#2563A8" stroke-width="1.5"/>
<text x="230" y="235" text-anchor="middle" class="label" font-size="12">TAALMODEL</text>
<text x="230" y="253" text-anchor="middle" class="sub">"junior tester"</text>
<text x="230" y="320" text-anchor="middle" class="sub" font-weight="700">30 testgevallen</text>
<text x="230" y="336" text-anchor="middle" class="sub">in enkele seconden</text>

<path d="M290 240 L420 240" class="arrow"/>

<!-- distribution of output quality -->
<g>
  <rect x="430" y="150" width="150" height="80" rx="8" class="blue-dark"/>
  <text x="505" y="185" text-anchor="middle" class="label-light" font-size="20">12</text>
  <text x="505" y="205" text-anchor="middle" fill="#DFDCD3" font-size="9.5">bruikbaar zonder</text>
  <text x="505" y="218" text-anchor="middle" fill="#DFDCD3" font-size="9.5">wijziging</text>
</g>
<g>
  <rect x="600" y="150" width="150" height="80" rx="8" fill="#6FA3D6"/>
  <text x="675" y="185" text-anchor="middle" class="label" font-size="20" fill="#14213D">8</text>
  <text x="675" y="205" text-anchor="middle" class="sub" fill="#14213D" font-size="9.5">bruikbaar na</text>
  <text x="675" y="218" text-anchor="middle" class="sub" fill="#14213D" font-size="9.5">correctie</text>
</g>
<g>
  <rect x="770" y="150" width="150" height="80" rx="8" fill="#F4F2EC" stroke="#55606F" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="845" y="185" text-anchor="middle" class="sub" font-size="20" font-weight="700" fill="#9A5F0D">10</text>
  <text x="845" y="205" text-anchor="middle" class="sub" font-size="9.5">testen iets dat niet</text>
  <text x="845" y="218" text-anchor="middle" class="sub" font-size="9.5">in de testbasis stond</text>
</g>

<!-- senior review gate -->
<rect x="430" y="280" width="490" height="90" rx="8" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2"/>
<text x="675" y="310" text-anchor="middle" class="label" fill="#9A5F0D">SENIOR BLIK — MENSELIJKE VERIFICATIE</text>
<text x="675" y="332" text-anchor="middle" class="sub">tegen de testbasis, elke suggestie is hypothese totdat</text>
<text x="675" y="348" text-anchor="middle" class="sub">geverifieerd — pas dan wordt zij een testgeval</text>

<path d="M505 230 L505 280" class="arrow"/>
<path d="M675 230 L675 280" class="arrow"/>
<path d="M845 230 L845 280" class="arrow"/>

<rect x="130" y="420" width="700" height="50" rx="8" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
<text x="480" y="440" text-anchor="middle" class="sub" fill="#9A5F0D">Een taalmodel genereert wat plausibel klinkt, niet wat waar is</text>
<text x="480" y="458" text-anchor="middle" class="sub" fill="#9A5F0D">over het systeem</text>
</svg>
