<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ordertypes-title ordertypes-desc">
      <title id="ordertypes-title">Vergelijking van ordertypes op uitvoering en controle</title>
      <desc id="ordertypes-desc">Kwadrant met uitvoeringszekerheid op de verticale as en prijscontrole op de horizontale as, waarin market order, limit order, stop-market en stop-limit worden gepositioneerd; stop-market bij trigger is gemarkeerd als de aanbevolen keuze voor een stop-loss.</desc>
      <defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="axis-tip" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto"><polygon points="0 0, 8 0, 4 8" fill="#2d3142"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Axis cross -->
      <line x1="500" y1="500" x2="500" y2="92" stroke="#2d3142" stroke-width="1" marker-end="url(#axis-tip)"/>
      <line x1="140" y1="300" x2="860" y2="300" stroke="#2d3142" stroke-width="1" marker-end="url(#axis-tip)"/>

      <!-- Axis labels: Jobs-minimal, one word per tip -->
      <text x="500" y="72" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em" text-transform="uppercase" text-anchor="middle">ZEKERHEID</text>
      <text x="880" y="304" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.18em" text-anchor="start" dominant-baseline="middle">CONTROLE</text>

      <!-- Quadrant boundary (subtle, for reading only) -->
      <rect x="140" y="92" width="720" height="408" fill="none" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>

      <!-- Item: MARKET ORDER — top-left: hoge zekerheid, lage controle -->
      <circle cx="280" cy="152" r="4" fill="#2d3142"/>
      <text x="292" y="148" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Market order</text>
      <text x="292" y="164" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">directe uitvoering, geen prijsgrens</text>

      <!-- Item: STOP-MARKET (bij trigger) — top-left, focal (accent) -->
      <circle cx="360" cy="212" r="5" fill="#eb6c36" stroke="#2d3142" stroke-width="1"/>
      <text x="372" y="208" fill="#eb6c36" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Stop-market</text>
      <text x="372" y="224" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">bij trigger → market, aanbevolen stop-loss</text>

      <!-- Item: STOP-LIMIT (bij trigger) — bottom-right cluster -->
      <circle cx="660" cy="388" r="4" fill="#2d3142"/>
      <text x="672" y="384" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Stop-limit</text>
      <text x="672" y="400" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">bij trigger → limit, kan onuitgevoerd blijven</text>

      <!-- Item: LIMIT ORDER — bottom-right: lage zekerheid, hoge controle -->
      <circle cx="740" cy="440" r="4" fill="#2d3142"/>
      <text x="752" y="436" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Limit order</text>
      <text x="752" y="452" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">vaste prijs of beter, geen garantie</text>

      <!-- Legend -->
      <line x1="30" y1="536" x2="970" y2="536" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="30" y="552" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <circle cx="160" cy="548" r="4" fill="#2d3142"/>
      <text x="172" y="551" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">ORDERTYPE</text>

      <circle cx="360" cy="548" r="5" fill="#eb6c36" stroke="#2d3142" stroke-width="1"/>
      <text x="374" y="551" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">AANBEVOLEN VOOR STOP-LOSS</text>

    </svg>