<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="candle-anatomy-title candle-anatomy-desc">
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style></defs>

      <title id="candle-anatomy-title">Anatomie van één candlestick</title>
      <desc id="candle-anatomy-desc">Eén bullish candlestick met open, close, high, low, lichaam en lonten aangewezen via labels, en onderaan het verschil in vulling tussen een bullish en een bearish candle.</desc>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Wick (drawn before the body) -->
      <line x1="500" y1="120" x2="500" y2="440" stroke="#2d3142" stroke-width="1.5"/>

      <!-- Body: bullish (close > open) — hollow/paper fill, ink stroke -->
      <rect x="460" y="200" width="80" height="140" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.5"/>

      <!-- Leader lines (thin, ink, plain — structural labeling, not editorial callouts) -->
      <line x1="500" y1="120" x2="700" y2="120" stroke="rgba(45,49,66,0.35)" stroke-width="0.8"/>
      <line x1="500" y1="160" x2="700" y2="160" stroke="rgba(45,49,66,0.35)" stroke-width="0.8"/>
      <line x1="540" y1="270" x2="700" y2="270" stroke="rgba(45,49,66,0.35)" stroke-width="0.8"/>
      <line x1="500" y1="390" x2="700" y2="390" stroke="rgba(45,49,66,0.35)" stroke-width="0.8"/>
      <line x1="500" y1="440" x2="700" y2="440" stroke="rgba(45,49,66,0.35)" stroke-width="0.8"/>
      <line x1="460" y1="204" x2="300" y2="204" stroke="rgba(45,49,66,0.35)" stroke-width="0.8"/>
      <line x1="460" y1="336" x2="300" y2="336" stroke="rgba(45,49,66,0.35)" stroke-width="0.8"/>

      <!-- Landing dots -->
      <circle cx="500" cy="120" r="2" fill="#2d3142"/>
      <circle cx="500" cy="160" r="2" fill="#2d3142"/>
      <circle cx="540" cy="270" r="2" fill="#2d3142"/>
      <circle cx="500" cy="390" r="2" fill="#2d3142"/>
      <circle cx="500" cy="440" r="2" fill="#2d3142"/>
      <circle cx="460" cy="204" r="2" fill="#2d3142"/>
      <circle cx="460" cy="336" r="2" fill="#2d3142"/>

      <!-- Right-side labels -->
      <text x="708" y="112" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">High</text>
      <text x="708" y="128" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">hoogste prijs in de periode</text>

      <text x="708" y="152" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Lont (boven)</text>
      <text x="708" y="168" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">uitschieter boven het lichaam</text>

      <text x="708" y="262" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Lichaam</text>
      <text x="708" y="278" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">netto verplaatsing open → close</text>

      <text x="708" y="382" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Lont (onder)</text>
      <text x="708" y="398" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">uitschieter onder het lichaam</text>

      <text x="708" y="432" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Low</text>
      <text x="708" y="448" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">laagste prijs in de periode</text>

      <!-- Left-side labels -->
      <text x="292" y="200" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="end">Close</text>
      <text x="292" y="216" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">slotprijs van de periode</text>

      <text x="292" y="332" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="end">Open</text>
      <text x="292" y="348" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">startprijs van de periode</text>

      <!-- Legend: bullish vs bearish -->
      <line x1="30" y1="480" x2="970" y2="480" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="30" y="496" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND — RICHTING VAN HET LICHAAM</text>

      <line x1="200" y1="512" x2="200" y2="548" stroke="#2d3142" stroke-width="1.2"/>
      <rect x="188" y="520" width="24" height="20" fill="#f5f5f5" stroke="#2d3142" stroke-width="1.2"/>
      <text x="224" y="527" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Bullish</text>
      <text x="224" y="543" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">sluit hoger dan open — hol lichaam</text>

      <line x1="480" y1="512" x2="480" y2="548" stroke="#2d3142" stroke-width="1.2"/>
      <rect x="468" y="520" width="24" height="20" fill="#2d3142" stroke="#2d3142" stroke-width="1.2"/>
      <text x="504" y="527" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif">Bearish</text>
      <text x="504" y="543" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace">sluit lager dan open — gevuld lichaam</text>

    </svg>