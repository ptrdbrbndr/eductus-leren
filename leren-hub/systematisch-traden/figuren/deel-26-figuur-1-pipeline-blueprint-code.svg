<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 720 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="deel26-pipeline-title deel26-pipeline-desc">
      <title id="deel26-pipeline-title">Pipeline: blueprint naar code naar paper trading</title>
      <desc id="deel26-pipeline-desc">Fenna's gevalideerde strategy blueprint wordt vertaald naar twee codeversies — Pine Script voor live signalering en Python voor backtesten — die beide nog moeten worden getoetst in paper trading, de nog te bouwen volgende stap.</desc>
      <defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#55606F"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#E9A13B"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#FBFAF7"/>

      <!-- Zone: CODE -->
      <rect x="248" y="48" width="200" height="256" rx="8" fill="rgba(20,33,61,0.02)" stroke="rgba(20,33,61,0.10)" stroke-width="0.8"/>
      <rect x="256" y="52" width="52" height="12" rx="2" fill="#FBFAF7"/>
      <text x="282" y="61" fill="rgba(20,33,61,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CODE</text>

      <!-- Arrows (drawn before nodes) -->
      <!-- Blueprint -> Pine Script (solid, vertaald) -->
      <path d="M208,165 H232 Q240,165 240,157 V132 Q240,124 248,124 H272"
            fill="none" stroke="#55606F" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- Blueprint -> Python (solid, vertaald) -->
      <path d="M208,203 H232 Q240,203 240,211 V236 Q240,244 248,244 H272"
            fill="none" stroke="#55606F" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- Pine Script -> Paper trading (dashed, nog te valideren) -->
      <path d="M424,124 H448 Q456,124 456,132 V157 Q456,165 464,165 H488"
            fill="none" stroke="#55606F" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- Python -> Paper trading (dashed, nog te valideren) -->
      <path d="M424,244 H448 Q456,244 456,236 V211 Q456,203 464,203 H488"
            fill="none" stroke="#55606F" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- Node: Blueprint (focal) -->
      <rect x="40" y="128" width="168" height="112" rx="6" fill="#FBFAF7"/>
      <rect x="40" y="128" width="168" height="112" rx="6" fill="rgba(233,161,59,0.08)" stroke="#E9A13B" stroke-width="1.2"/>
      <rect x="48" y="136" width="44" height="12" rx="2" fill="transparent" stroke="rgba(233,161,59,0.60)" stroke-width="0.8"/>
      <text x="70" y="145" fill="#E9A13B" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BRON</text>
      <text x="124" y="186" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Fenna's blueprint</text>
      <text x="124" y="202" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">deel 12</text>
      <text x="124" y="214" fill="#7C8794" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">gevalideerd niveau 2</text>

      <!-- Node: Pine Script -->
      <rect x="272" y="80" width="152" height="88" rx="6" fill="#FBFAF7"/>
      <rect x="272" y="80" width="152" height="88" rx="6" fill="#FFFFFF" stroke="#14213D" stroke-width="1"/>
      <rect x="280" y="88" width="44" height="12" rx="2" fill="transparent" stroke="rgba(20,33,61,0.40)" stroke-width="0.8"/>
      <text x="302" y="97" fill="rgba(20,33,61,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CODE</text>
      <text x="348" y="122" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pine Script</text>
      <text x="348" y="138" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">TradingView</text>
      <text x="348" y="150" fill="#7C8794" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">live signalering</text>

      <!-- Node: Python -->
      <rect x="272" y="200" width="152" height="88" rx="6" fill="#FBFAF7"/>
      <rect x="272" y="200" width="152" height="88" rx="6" fill="#FFFFFF" stroke="#14213D" stroke-width="1"/>
      <rect x="280" y="208" width="44" height="12" rx="2" fill="transparent" stroke="rgba(20,33,61,0.40)" stroke-width="0.8"/>
      <text x="302" y="217" fill="rgba(20,33,61,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CODE</text>
      <text x="348" y="242" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Python-backtest</text>
      <text x="348" y="258" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pandas</text>
      <text x="348" y="270" fill="#7C8794" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">grondige validatie</text>

      <!-- Node: Paper trading (optional / not yet built) -->
      <rect x="488" y="128" width="168" height="112" rx="6" fill="#FBFAF7"/>
      <rect x="488" y="128" width="168" height="112" rx="6" fill="rgba(20,33,61,0.02)" stroke="rgba(20,33,61,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="496" y="136" width="60" height="12" rx="2" fill="transparent" stroke="rgba(20,33,61,0.40)" stroke-width="0.8"/>
      <text x="526" y="145" fill="rgba(20,33,61,0.70)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">VALIDATIE</text>
      <text x="572" y="186" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Paper trading</text>
      <text x="572" y="202" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">deel 27</text>
      <text x="572" y="214" fill="#7C8794" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">nog te bouwen</text>

      <!-- Legend -->
      <line x1="30" y1="322" x2="690" y2="322" stroke="rgba(20,33,61,0.10)" stroke-width="0.8"/>
      <text x="30" y="338" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGENDA</text>

      <rect x="140" y="330" width="14" height="10" rx="2" fill="rgba(233,161,59,0.08)" stroke="#E9A13B" stroke-width="1.2"/>
      <text x="160" y="339" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace">Bron — blueprint</text>

      <rect x="300" y="330" width="14" height="10" rx="2" fill="#FFFFFF" stroke="#14213D" stroke-width="1"/>
      <text x="320" y="339" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace">Code — vertaling</text>

      <rect x="460" y="330" width="14" height="10" rx="2" fill="rgba(20,33,61,0.02)" stroke="rgba(20,33,61,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="480" y="339" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace">Nog te bouwen</text>

      <line x1="140" y1="354" x2="168" y2="354" stroke="#55606F" stroke-width="1" marker-end="url(#arrow)"/>
      <text x="176" y="357" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace">Vertaald</text>

      <line x1="300" y1="354" x2="328" y2="354" stroke="#55606F" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="336" y="357" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace">Nog te valideren</text>
    </svg>