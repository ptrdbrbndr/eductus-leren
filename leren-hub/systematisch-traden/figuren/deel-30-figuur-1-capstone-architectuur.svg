<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 888 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="deel30-capstone-title deel30-capstone-desc">
      <title id="deel30-capstone-title">Capstone-architectuur van Fenna's systematische strategie</title>
      <desc id="deel30-capstone-desc">Het geheel van blueprint, code, paper trading en signaalflow, bewaakt door monitoring en een kill switch op systeemniveau, met de menselijke beoordeling en orderuitvoering als laatste, nooit geautomatiseerde stap.</desc>
      <defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#55606F"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#E9A13B"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#FBFAF7"/>

      <!-- Zone: systeembewaking -->
      <rect x="516" y="204" width="332" height="140" rx="8" fill="rgba(20,33,61,0.02)" stroke="rgba(20,33,61,0.10)" stroke-width="0.8"/>
      <rect x="524" y="208" width="128" height="12" rx="2" fill="#FBFAF7"/>
      <text x="588" y="217" fill="rgba(20,33,61,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SYSTEEMBEWAKING</text>

      <!-- Arrows (before nodes) -->
      <!-- main pipeline, same cy=104, straight lines -->
      <line x1="176" y1="104" x2="204" y2="104" stroke="#55606F" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="340" y1="104" x2="368" y2="104" stroke="#55606F" stroke-width="1" marker-end="url(#arrow)"/>
      <line x1="504" y1="104" x2="532" y2="104" stroke="#55606F" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- focal: signaalflow -> mens -->
      <line x1="668" y1="104" x2="696" y2="104" stroke="#E9A13B" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

      <!-- signaalflow -> monitoring (dashed, observatie) -->
      <path d="M600,148 V236" fill="none" stroke="#55606F" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- monitoring -> kill switch (solid, voedt beoordeling) -->
      <line x1="668" y1="272" x2="692" y2="272" stroke="#55606F" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- kill switch -> signaalflow (dashed, terugkoppeling / stopt bij afwijking) -->
      <path d="M760,236 V200 Q760,192 752,192 H640 Q632,192 632,184 V148"
            fill="none" stroke="#55606F" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- Node: Blueprint -->
      <rect x="40" y="60" width="136" height="88" rx="6" fill="#FBFAF7"/>
      <rect x="40" y="60" width="136" height="88" rx="6" fill="#FFFFFF" stroke="#14213D" stroke-width="1"/>
      <rect x="48" y="68" width="44" height="12" rx="2" fill="transparent" stroke="rgba(20,33,61,0.40)" stroke-width="0.8"/>
      <text x="70" y="77" fill="rgba(20,33,61,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BRON</text>
      <text x="108" y="104" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Blueprint</text>
      <text x="108" y="120" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">strategie</text>
      <text x="108" y="132" fill="#7C8794" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">vastgelegd niveau 2</text>

      <!-- Node: Code -->
      <rect x="204" y="60" width="136" height="88" rx="6" fill="#FBFAF7"/>
      <rect x="204" y="60" width="136" height="88" rx="6" fill="#FFFFFF" stroke="#14213D" stroke-width="1"/>
      <rect x="212" y="68" width="52" height="12" rx="2" fill="transparent" stroke="rgba(20,33,61,0.40)" stroke-width="0.8"/>
      <text x="238" y="77" fill="rgba(20,33,61,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VERTAALD</text>
      <text x="272" y="104" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Code</text>
      <text x="272" y="120" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Pine Script</text>
      <text x="272" y="132" fill="#7C8794" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">+ Python-backtest</text>

      <!-- Node: Paper trading -->
      <rect x="368" y="60" width="136" height="88" rx="6" fill="#FBFAF7"/>
      <rect x="368" y="60" width="136" height="88" rx="6" fill="#FFFFFF" stroke="#14213D" stroke-width="1"/>
      <rect x="376" y="68" width="56" height="12" rx="2" fill="transparent" stroke="rgba(20,33,61,0.40)" stroke-width="0.8"/>
      <text x="404" y="77" fill="rgba(20,33,61,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VALIDATIE</text>
      <text x="436" y="104" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Paper trading</text>
      <text x="436" y="120" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">6 weken · 29 trades</text>
      <text x="436" y="132" fill="#7C8794" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">uitvoeringsfout gecorrigeerd</text>

      <!-- Node: Signaalflow -->
      <rect x="532" y="60" width="136" height="88" rx="6" fill="#FBFAF7"/>
      <rect x="532" y="60" width="136" height="88" rx="6" fill="#FFFFFF" stroke="#14213D" stroke-width="1"/>
      <rect x="540" y="68" width="48" height="12" rx="2" fill="transparent" stroke="rgba(20,33,61,0.40)" stroke-width="0.8"/>
      <text x="564" y="77" fill="rgba(20,33,61,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SIGNAAL</text>
      <text x="600" y="104" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Signaalflow</text>
      <text x="600" y="120" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">setup herkend</text>
      <text x="600" y="132" fill="#7C8794" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">→ webhook</text>

      <!-- Node: Mens (focal) -->
      <rect x="696" y="60" width="136" height="88" rx="6" fill="#FBFAF7"/>
      <rect x="696" y="60" width="136" height="88" rx="6" fill="rgba(233,161,59,0.08)" stroke="#E9A13B" stroke-width="1.2"/>
      <rect x="704" y="68" width="60" height="12" rx="2" fill="transparent" stroke="rgba(233,161,59,0.60)" stroke-width="0.8"/>
      <text x="734" y="77" fill="#E9A13B" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BESLISSING</text>
      <text x="764" y="104" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Mens</text>
      <text x="764" y="120" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">beoordeelt signaal</text>
      <text x="764" y="132" fill="#7C8794" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">voert order zelf uit</text>

      <!-- Node: Monitoring -->
      <rect x="532" y="236" width="136" height="72" rx="6" fill="#FBFAF7"/>
      <rect x="532" y="236" width="136" height="72" rx="6" fill="rgba(20,33,61,0.05)" stroke="#55606F" stroke-width="1"/>
      <rect x="540" y="244" width="60" height="12" rx="2" fill="transparent" stroke="rgba(20,33,61,0.40)" stroke-width="0.8"/>
      <text x="570" y="253" fill="rgba(20,33,61,0.70)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BEWAKING</text>
      <text x="600" y="278" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Monitoring</text>
      <text x="600" y="294" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">correlatie-check</text>

      <!-- Node: Kill switch -->
      <rect x="692" y="236" width="136" height="72" rx="6" fill="#FBFAF7"/>
      <rect x="692" y="236" width="136" height="72" rx="6" fill="rgba(20,33,61,0.05)" stroke="#55606F" stroke-width="1"/>
      <rect x="700" y="244" width="60" height="12" rx="2" fill="transparent" stroke="rgba(20,33,61,0.40)" stroke-width="0.8"/>
      <text x="730" y="253" fill="rgba(20,33,61,0.70)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BEWAKING</text>
      <text x="760" y="278" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Kill switch</text>
      <text x="760" y="294" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">high-watermark</text>

      <!-- Legend -->
      <line x1="30" y1="368" x2="858" y2="368" stroke="rgba(20,33,61,0.10)" stroke-width="0.8"/>
      <text x="30" y="384" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGENDA</text>

      <rect x="140" y="376" width="14" height="10" rx="2" fill="#FFFFFF" stroke="#14213D" stroke-width="1"/>
      <text x="160" y="385" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace">Blueprint · code · validatie · signaal</text>

      <rect x="420" y="376" width="14" height="10" rx="2" fill="rgba(233,161,59,0.08)" stroke="#E9A13B" stroke-width="1.2"/>
      <text x="440" y="385" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace">Mens — laatste, bewuste stap</text>

      <rect x="660" y="376" width="14" height="10" rx="2" fill="rgba(20,33,61,0.05)" stroke="#55606F" stroke-width="1"/>
      <text x="680" y="385" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace">Bewaking op systeemniveau</text>

      <line x1="140" y1="404" x2="168" y2="404" stroke="#55606F" stroke-width="1" marker-end="url(#arrow)"/>
      <text x="176" y="407" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace">Hoofdroute</text>

      <line x1="300" y1="404" x2="328" y2="404" stroke="#E9A13B" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <text x="336" y="407" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace">Naar menselijke beoordeling</text>

      <line x1="560" y1="404" x2="588" y2="404" stroke="#55606F" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="596" y="407" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace">Observatie / terugkoppeling</text>
    </svg>