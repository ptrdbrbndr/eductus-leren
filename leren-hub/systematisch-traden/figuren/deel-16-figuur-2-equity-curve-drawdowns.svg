<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 528" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="deel16-fig2-title deel16-fig2-desc">
      <title id="deel16-fig2-title">Equity curve met gemarkeerde drawdown-periode</title>
      <desc id="deel16-fig2-desc">Lijngrafiek van Fenna's fictieve equity curve over tien trades vanaf €10.000 startkapitaal, met de drawdown-periode tussen de piek van €10.400 en het herstel naar een nieuwe piek gemarkeerd, en het diepste punt van 3,37% aangeduid.</desc>
      <defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#55606F"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#FBFAF7"/>

      <!-- Y gridlines -->
      <g>
        <line x1="80" y1="440" x2="960" y2="440" stroke="rgba(20,33,61,0.14)" stroke-width="0.8"/>
        <line x1="80" y1="340" x2="960" y2="340" stroke="rgba(20,33,61,0.08)" stroke-width="0.8"/>
        <line x1="80" y1="240" x2="960" y2="240" stroke="rgba(20,33,61,0.08)" stroke-width="0.8"/>
        <line x1="80" y1="140" x2="960" y2="140" stroke="rgba(20,33,61,0.08)" stroke-width="0.8"/>
        <line x1="80" y1="40"  x2="960" y2="40"  stroke="rgba(20,33,61,0.08)" stroke-width="0.8"/>
      </g>

      <!-- Y axis labels -->
      <g font-family="'Geist Mono', monospace" font-size="8" fill="#55606F" text-anchor="end">
        <text x="72" y="443">€9.900</text>
        <text x="72" y="343">€10.050</text>
        <text x="72" y="243">€10.200</text>
        <text x="72" y="143">€10.350</text>
        <text x="72" y="43">€10.500</text>
      </g>

      <!-- Rotated axis caption -->
      <text transform="rotate(-90 24 240)" x="24" y="240" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="7" letter-spacing="0.14em" fill="#7C8794">EQUITY (FICTIEF)</text>

      <!-- Drawdown-periode shaded region: piek (t2) tot herstel (t10) -->
      <rect x="256" y="40" width="704" height="400" fill="rgba(233,161,59,0.06)"/>
      <rect x="264" y="48" width="150" height="14" rx="3" fill="#FBFAF7"/>
      <text x="269" y="58" font-family="'Geist Mono', monospace" font-size="7.5" letter-spacing="0.1em" fill="#55606F">DRAWDOWN-PERIODE</text>

      <!-- Vorige piek / high-watermark referentie (muted dashed) -->
      <line x1="256" y1="106.7" x2="960" y2="106.7" stroke="#55606F" stroke-width="1" stroke-dasharray="5,4"/>

      <!-- Equity curve (focal, accent solid) -->
      <polyline points="80,373.3 168,253.3 256,106.7 344,166.7 432,266.7 520,340 608,246.7 696,286.7 784,223.3 872,270 960,96.7"
                fill="none" stroke="#E9A13B" stroke-width="1.8" stroke-linejoin="round"/>
      <g fill="#E9A13B">
        <circle cx="80"  cy="373.3" r="4"/>
        <circle cx="168" cy="253.3" r="4"/>
        <circle cx="256" cy="106.7" r="4"/>
        <circle cx="344" cy="166.7" r="4"/>
        <circle cx="432" cy="266.7" r="4"/>
        <circle cx="608" cy="246.7" r="4"/>
        <circle cx="696" cy="286.7" r="4"/>
        <circle cx="784" cy="223.3" r="4"/>
        <circle cx="872" cy="270"   r="4"/>
        <circle cx="960" cy="96.7"  r="4"/>
      </g>

      <!-- Trough highlight (t5, max drawdown) -->
      <circle cx="520" cy="340" r="7" fill="none" stroke="#14213D" stroke-width="1.2"/>
      <circle cx="520" cy="340" r="4" fill="#E9A13B"/>
      <rect x="536" y="352" width="168" height="28" rx="4" fill="#FBFAF7"/>
      <text x="540" y="364" font-family="'Geist', sans-serif" font-size="9" font-weight="600" fill="#14213D">Max drawdown: 3,37%</text>
      <text x="540" y="376" font-family="'Geist Mono', monospace" font-size="7.5" fill="#55606F">€10.400 → €10.050 (t5)</text>

      <!-- X axis labels (trade index) -->
      <g font-family="'Geist Mono', monospace" font-size="8" fill="#55606F" text-anchor="middle">
        <text x="80"  y="452">start</text>
        <text x="168" y="452">t1</text>
        <text x="256" y="452">t2</text>
        <text x="344" y="452">t3</text>
        <text x="432" y="452">t4</text>
        <text x="520" y="452">t5</text>
        <text x="608" y="452">t6</text>
        <text x="696" y="452">t7</text>
        <text x="784" y="452">t8</text>
        <text x="872" y="452">t9</text>
        <text x="960" y="452">t10</text>
      </g>

      <!-- Legend -->
      <line x1="30" y1="464" x2="970" y2="464" stroke="rgba(20,33,61,0.12)" stroke-width="0.8"/>
      <text x="30" y="480" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.14em" fill="#55606F">LEGEND</text>

      <rect x="30" y="486" width="16" height="8" fill="#E9A13B"/>
      <text x="52" y="493" font-family="'Geist Mono', monospace" font-size="8" fill="#14213D">EQUITY (FICTIEF)</text>

      <line x1="290" y1="490" x2="306" y2="490" stroke="#55606F" stroke-width="1" stroke-dasharray="5,4"/>
      <text x="312" y="493" font-family="'Geist Mono', monospace" font-size="8" fill="#14213D">VORIGE PIEK (HIGH-WATERMARK)</text>

      <rect x="630" y="486" width="16" height="8" fill="rgba(233,161,59,0.20)"/>
      <text x="652" y="493" font-family="'Geist Mono', monospace" font-size="8" fill="#14213D">DRAWDOWN-PERIODE</text>
    </svg>