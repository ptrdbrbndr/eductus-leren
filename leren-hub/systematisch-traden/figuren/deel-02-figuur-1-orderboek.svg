<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="orderboek-title orderboek-desc">
      <title id="orderboek-title">Orderboek met bied- en laatzijde</title>
      <desc id="orderboek-desc">Diagram van een orderboek: een prijsladder met vier laatniveaus boven de spread en vier biedniveaus eronder, elk met het volume dat op dat niveau klaarstaat, en de spread tussen de beste bied- en laatprijs.</desc>
      <defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Column headers -->
      <text x="240" y="52" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em" text-anchor="middle">VOLUME (BIED)</text>
      <text x="500" y="52" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em" text-anchor="middle">PRIJS</text>
      <text x="760" y="52" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em" text-anchor="middle">VOLUME (LAAT)</text>
      <line x1="60" y1="64" x2="940" y2="64" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

      <!-- Center price axis -->
      <line x1="500" y1="76" x2="500" y2="424" stroke="rgba(45,49,66,0.20)" stroke-width="1"/>

      <!-- ================= ASK ROWS (bars extend right of center) ================= -->
      <!-- Row: €50,08 vol 740 -->
      <rect x="500" y="80" width="440" height="24" fill="#f5f5f5"/>
      <rect x="500" y="80" width="252" height="24" fill="rgba(79,93,117,0.10)" stroke="#4f5d75" stroke-width="1"/>
      <text x="764" y="96" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">740</text>
      <rect x="452" y="84" width="96" height="16" fill="#f5f5f5"/>
      <text x="500" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">€ 50,08</text>

      <!-- Row: €50,06 vol 300 -->
      <rect x="500" y="112" width="440" height="24" fill="#f5f5f5"/>
      <rect x="500" y="112" width="104" height="24" fill="rgba(79,93,117,0.10)" stroke="#4f5d75" stroke-width="1"/>
      <text x="616" y="128" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">300</text>
      <rect x="452" y="116" width="96" height="16" fill="#f5f5f5"/>
      <text x="500" y="128" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">€ 50,06</text>

      <!-- Row: €50,04 vol 560 -->
      <rect x="500" y="144" width="440" height="24" fill="#f5f5f5"/>
      <rect x="500" y="144" width="184" height="24" fill="rgba(79,93,117,0.10)" stroke="#4f5d75" stroke-width="1"/>
      <text x="696" y="160" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">560</text>
      <rect x="452" y="148" width="96" height="16" fill="#f5f5f5"/>
      <text x="500" y="160" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">€ 50,04</text>

      <!-- Row: €50,02 vol 390 — best ask, focal -->
      <rect x="500" y="176" width="440" height="24" fill="#f5f5f5"/>
      <rect x="500" y="176" width="136" height="24" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="648" y="192" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace">390</text>
      <rect x="452" y="180" width="96" height="16" fill="#f5f5f5"/>
      <text x="500" y="192" fill="#eb6c36" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">€ 50,02</text>

      <!-- Spread band (muted — accent is reserved for the two top-of-book rows) -->
      <line x1="380" y1="208" x2="380" y2="224" stroke="#4f5d75" stroke-width="1"/>
      <line x1="620" y1="208" x2="620" y2="224" stroke="#4f5d75" stroke-width="1"/>
      <line x1="380" y1="216" x2="620" y2="216" stroke="#4f5d75" stroke-width="1"/>
      <rect x="452" y="196" width="96" height="16" rx="2" fill="#f5f5f5"/>
      <text x="500" y="208" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em" text-anchor="middle">SPREAD € 0,04</text>

      <!-- Row: €49,98 vol 420 — best bid, focal -->
      <rect x="60" y="232" width="440" height="24" fill="#f5f5f5"/>
      <rect x="356" y="232" width="144" height="24" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="348" y="248" fill="#eb6c36" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">420</text>
      <rect x="452" y="236" width="96" height="16" fill="#f5f5f5"/>
      <text x="500" y="248" fill="#eb6c36" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">€ 49,98</text>

      <!-- Row: €49,96 vol 680 -->
      <rect x="60" y="264" width="440" height="24" fill="#f5f5f5"/>
      <rect x="304" y="264" width="196" height="24" fill="rgba(79,93,117,0.10)" stroke="#4f5d75" stroke-width="1"/>
      <text x="296" y="280" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">680</text>
      <rect x="452" y="268" width="96" height="16" fill="#f5f5f5"/>
      <text x="500" y="280" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">€ 49,96</text>

      <!-- Row: €49,94 vol 350 -->
      <rect x="60" y="296" width="440" height="24" fill="#f5f5f5"/>
      <rect x="382" y="296" width="118" height="24" fill="rgba(79,93,117,0.10)" stroke="#4f5d75" stroke-width="1"/>
      <text x="374" y="312" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">350</text>
      <rect x="452" y="300" width="96" height="16" fill="#f5f5f5"/>
      <text x="500" y="312" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">€ 49,94</text>

      <!-- Row: €49,92 vol 910 -->
      <rect x="60" y="328" width="440" height="24" fill="#f5f5f5"/>
      <rect x="192" y="328" width="308" height="24" fill="rgba(79,93,117,0.10)" stroke="#4f5d75" stroke-width="1"/>
      <text x="184" y="344" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">910</text>
      <rect x="452" y="332" width="96" height="16" fill="#f5f5f5"/>
      <text x="500" y="344" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">€ 49,92</text>

      <!-- Depth explainer -->
      <line x1="60" y1="376" x2="940" y2="376" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
      <text x="500" y="404" fill="#4f5d75" font-size="11" font-family="'Geist', sans-serif" text-anchor="middle" font-weight="600">Marktdiepte</text>
      <text x="500" y="424" fill="#7a8399" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">meer volume op meerdere niveaus = hogere liquiditeit</text>

      <!-- Legend -->
      <line x1="30" y1="456" x2="970" y2="456" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="30" y="472" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="150" y="464" width="16" height="8" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="174" y="471" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">BESTE BIED / BESTE LAAT</text>

      <rect x="420" y="464" width="16" height="8" fill="rgba(79,93,117,0.10)" stroke="#4f5d75" stroke-width="1"/>
      <text x="444" y="471" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">OVERIGE PRIJSNIVEAUS</text>

      <line x1="690" y1="468" x2="714" y2="468" stroke="#4f5d75" stroke-width="1"/>
      <text x="722" y="471" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">SPREAD</text>

    </svg>