<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="trend-sr-title trend-sr-desc">
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style></defs>

      <title id="trend-sr-title">Candlestick-chart met supportzone en resistancezone</title>
      <desc id="trend-sr-desc">Generiek voorbeeld van aandeel X in een zijwaartse markt: dertien candles die tweemaal terugkaatsen op een supportzone rond €49–€51 en eenmaal worden afgewezen bij een resistancezone rond €57–€59, geen echte koersdata of voorspelling.</desc>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Y-axis gridlines + labels -->
      <line x1="80" y1="80" x2="920" y2="80" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <text x="72" y="83" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">€ 60</text>
      <line x1="80" y1="193" x2="920" y2="193" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <text x="72" y="196" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">€ 56</text>
      <line x1="80" y1="306" x2="920" y2="306" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <text x="72" y="309" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">€ 52</text>
      <line x1="80" y1="420" x2="920" y2="420" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
      <text x="72" y="423" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">€ 48</text>
      <line x1="80" y1="80" x2="80" y2="420" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>

      <!-- Resistance zone € 57–59 -->
      <rect x="80" y="108" width="840" height="57" fill="rgba(45,49,66,0.05)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,4"/>
      <rect x="84" y="112" width="112" height="16" fill="#f5f5f5"/>
      <text x="88" y="124" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.06em">RESISTANCE € 57–59</text>

      <!-- Support zone € 49–51 -->
      <rect x="80" y="335" width="840" height="57" fill="rgba(45,49,66,0.05)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,4"/>
      <rect x="84" y="339" width="96" height="16" fill="#f5f5f5"/>
      <text x="88" y="351" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" letter-spacing="0.06em">SUPPORT € 49–51</text>

      <!-- ===== Candles (drawn after zones, before annotations) ===== -->
      <!-- c1 bullish -->
      <line x1="160" y1="233" x2="160" y2="290" stroke="#2d3142" stroke-width="1"/>
      <rect x="150" y="244" width="20" height="34" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
      <!-- c2 bearish -->
      <line x1="216" y1="227" x2="216" y2="295" stroke="#2d3142" stroke-width="1"/>
      <rect x="206" y="244" width="20" height="34" fill="#2d3142" stroke="#2d3142" stroke-width="1"/>
      <!-- c3 bearish -->
      <line x1="272" y1="267" x2="272" y2="335" stroke="#2d3142" stroke-width="1"/>
      <rect x="262" y="278" width="20" height="46" fill="#2d3142" stroke="#2d3142" stroke-width="1"/>
      <!-- c4 bearish, touches support -->
      <line x1="328" y1="318" x2="328" y2="369" stroke="#2d3142" stroke-width="1"/>
      <rect x="318" y="324" width="20" height="34" fill="#2d3142" stroke="#2d3142" stroke-width="1"/>
      <!-- c5 bullish, bounces off support -->
      <line x1="384" y1="312" x2="384" y2="366" stroke="#2d3142" stroke-width="1"/>
      <rect x="374" y="318" width="20" height="40" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
      <!-- c6 bullish -->
      <line x1="440" y1="250" x2="440" y2="324" stroke="#2d3142" stroke-width="1"/>
      <rect x="430" y="256" width="20" height="62" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
      <!-- c7 bullish -->
      <line x1="496" y1="196" x2="496" y2="261" stroke="#2d3142" stroke-width="1"/>
      <rect x="486" y="205" width="20" height="51" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
      <!-- c8 bullish, approaches resistance -->
      <line x1="552" y1="125" x2="552" y2="210" stroke="#2d3142" stroke-width="1"/>
      <rect x="542" y="148" width="20" height="57" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
      <!-- c9 bearish, rejected at resistance -->
      <line x1="608" y1="120" x2="608" y2="199" stroke="#2d3142" stroke-width="1"/>
      <rect x="598" y="148" width="20" height="45" fill="#2d3142" stroke="#2d3142" stroke-width="1"/>
      <!-- c10 bearish -->
      <line x1="664" y1="188" x2="664" y2="250" stroke="#2d3142" stroke-width="1"/>
      <rect x="654" y="193" width="20" height="46" fill="#2d3142" stroke="#2d3142" stroke-width="1"/>
      <!-- c11 bearish -->
      <line x1="720" y1="233" x2="720" y2="341" stroke="#2d3142" stroke-width="1"/>
      <rect x="710" y="239" width="20" height="90" fill="#2d3142" stroke="#2d3142" stroke-width="1"/>
      <!-- c12 bearish, touches support again -->
      <line x1="776" y1="324" x2="776" y2="372" stroke="#2d3142" stroke-width="1"/>
      <rect x="766" y="329" width="20" height="32" fill="#2d3142" stroke="#2d3142" stroke-width="1"/>
      <!-- c13 bullish, bounces off support -->
      <line x1="832" y1="278" x2="832" y2="366" stroke="#2d3142" stroke-width="1"/>
      <rect x="822" y="284" width="20" height="77" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>

      <!-- X-axis time labels -->
      <text x="160" y="440" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">D1</text>
      <text x="328" y="440" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">D4</text>
      <text x="496" y="440" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">D7</text>
      <text x="664" y="440" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">D10</text>
      <text x="832" y="440" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">D13</text>
      <text x="500" y="460" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.12em" text-anchor="middle">TIMEFRAME: DAGGRAFIEK (GENERIEK, DAG 1–13)</text>

      <!-- Editorial callouts (max 2) -->
      <text x="944" y="120" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">zone, geen exacte lijn</text>
      <path d="M 900 128 Q 860 150 800 158" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="800" cy="158" r="2" fill="#2d3142"/>

      <text x="944" y="480" fill="#2d3142" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">tweemaal eerder getest</text>
      <path d="M 900 472 Q 870 440 800 380" fill="none" stroke="rgba(45,49,66,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="800" cy="380" r="2" fill="#2d3142"/>

      <!-- Legend -->
      <line x1="30" y1="500" x2="970" y2="500" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="30" y="516" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="150" y="508" width="14" height="12" fill="#f5f5f5" stroke="#2d3142" stroke-width="1"/>
      <text x="172" y="518" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">BULLISH CANDLE</text>

      <rect x="360" y="508" width="14" height="12" fill="#2d3142" stroke="#2d3142" stroke-width="1"/>
      <text x="382" y="518" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">BEARISH CANDLE</text>

      <rect x="570" y="508" width="16" height="10" fill="rgba(45,49,66,0.05)" stroke="rgba(45,49,66,0.30)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="594" y="518" fill="#2d3142" font-size="9" font-family="'Geist Mono', monospace">SUPPORT / RESISTANCE ZONE</text>

    </svg>