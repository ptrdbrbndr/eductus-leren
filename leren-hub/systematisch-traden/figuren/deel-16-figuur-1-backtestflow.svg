<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="deel16-fig1-title deel16-fig1-desc">
      <title id="deel16-fig1-title">Backtestflow van blueprint naar metrics en equity curve</title>
      <desc id="deel16-fig1-desc">Flowchart die toont hoe blueprintregels op historische data worden toegepast, wat een lijst trades oplevert die vertakt naar de kernmetrics en naar de equity curve.</desc>
      <defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#55606F"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#FBFAF7"/>

      <!-- Arrows drawn before nodes -->
      <!-- 1 -> 2 straight vertical -->
      <line x1="350" y1="104" x2="350" y2="152" stroke="#55606F" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- 2 -> 3 straight vertical -->
      <line x1="350" y1="216" x2="350" y2="264" stroke="#55606F" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- 3 -> 4 elbow (fan-out left) -->
      <path d="M316,328 L316,352 Q316,360 308,360 L238,360 Q230,360 230,368 L230,376" fill="none" stroke="#55606F" stroke-width="1" marker-end="url(#arrow)"/>
      <!-- 3 -> 5 elbow (fan-out right) -->
      <path d="M384,328 L384,352 Q384,360 392,360 L462,360 Q470,360 470,368 L470,376" fill="none" stroke="#55606F" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- Node 1: start oval -->
      <rect x="250" y="40" width="200" height="64" rx="32" fill="#FFFFFF" stroke="#14213D" stroke-width="1"/>
      <text x="350" y="66" text-anchor="middle" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#14213D">Blueprintregels</text>
      <text x="350" y="82" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" fill="#55606F">entry · exit · risk mgmt</text>

      <!-- Node 2: process step -->
      <rect x="250" y="152" width="200" height="64" rx="6" fill="#FFFFFF" stroke="#14213D" stroke-width="1"/>
      <text x="350" y="178" text-anchor="middle" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#14213D">Backtest toepassen</text>
      <text x="350" y="194" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" fill="#55606F">op historische koersdata</text>

      <!-- Node 3: process step -->
      <rect x="250" y="264" width="200" height="64" rx="6" fill="#FFFFFF" stroke="#14213D" stroke-width="1"/>
      <text x="350" y="290" text-anchor="middle" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#14213D">Lijst trades</text>
      <text x="350" y="306" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" fill="#55606F">entry · exit · resultaat (€)</text>

      <!-- Node 4: focal step (Metrics) -->
      <rect x="130" y="376" width="200" height="64" rx="6" fill="rgba(233,161,59,0.08)" stroke="#E9A13B" stroke-width="1.2"/>
      <text x="230" y="402" text-anchor="middle" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#14213D">Metrics</text>
      <text x="230" y="418" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#55606F">winrate · profit factor</text>
      <text x="230" y="430" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="8" fill="#55606F">expectancy · drawdown · Sharpe</text>

      <!-- Node 5: end oval -->
      <rect x="370" y="376" width="200" height="64" rx="32" fill="#FFFFFF" stroke="#14213D" stroke-width="1"/>
      <text x="470" y="404" text-anchor="middle" font-family="'Geist', sans-serif" font-size="12" font-weight="600" fill="#14213D">Equity curve</text>
      <text x="470" y="420" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="9" fill="#55606F">accountverloop trade na trade</text>

      <!-- Legend -->
      <line x1="30" y1="464" x2="670" y2="464" stroke="rgba(20,33,61,0.12)" stroke-width="0.8"/>
      <text x="30" y="480" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.14em" fill="#55606F">LEGEND</text>

      <rect x="30" y="486" width="18" height="18" rx="9" fill="#FFFFFF" stroke="#14213D" stroke-width="1"/>
      <text x="56" y="498" font-family="'Geist Mono', monospace" font-size="8" fill="#14213D">START/EIND</text>

      <rect x="200" y="488" width="18" height="14" rx="4" fill="#FFFFFF" stroke="#14213D" stroke-width="1"/>
      <text x="226" y="498" font-family="'Geist Mono', monospace" font-size="8" fill="#14213D">VERWERKINGSSTAP</text>

      <rect x="420" y="488" width="18" height="14" rx="4" fill="rgba(233,161,59,0.08)" stroke="#E9A13B" stroke-width="1.2"/>
      <text x="446" y="498" font-family="'Geist Mono', monospace" font-size="8" fill="#14213D">FOCUS VAN DIT DEEL</text>
    </svg>