<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="deel14-sizing-title deel14-sizing-desc">
      <title id="deel14-sizing-title">Vergelijking van drie sizing-methodes op dezelfde trade</title>
      <desc id="deel14-sizing-desc">Kolomdiagram dat de positiegrootte vergelijkt die fixed fractional, half-Kelly en ATR-based sizing opleveren voor dezelfde voorbeeldtrade van 20.000 euro account op een aandeel van 50 euro, met half-Kelly uitgelicht als uitschieter.</desc>
      <defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style></defs>

      <rect width="100%" height="100%" fill="#FBFAF7"/>

      <!-- ===== Axes ===== -->
      <!-- Gridlines -->
      <line x1="80" y1="420" x2="960" y2="420" stroke="rgba(20,33,61,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="344" x2="960" y2="344" stroke="rgba(20,33,61,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="268" x2="960" y2="268" stroke="rgba(20,33,61,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="192" x2="960" y2="192" stroke="rgba(20,33,61,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="116" x2="960" y2="116" stroke="rgba(20,33,61,0.08)" stroke-width="0.8"/>
      <line x1="80" y1="40"  x2="960" y2="40"  stroke="rgba(20,33,61,0.08)" stroke-width="0.8"/>

      <!-- Y-axis labels -->
      <text x="72" y="424" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">0</text>
      <text x="72" y="348" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">140</text>
      <text x="72" y="272" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">280</text>
      <text x="72" y="196" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">420</text>
      <text x="72" y="120" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">560</text>
      <text x="72" y="44"  fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">700</text>

      <!-- Axis title (rotated) -->
      <text x="24" y="230" fill="#55606F" font-size="7" font-family="'Geist Mono', monospace" letter-spacing="0.14em" text-anchor="middle" transform="rotate(-90 24 230)">POSITIEGROOTTE (AANDELEN)</text>

      <!-- Y-axis line + X-axis baseline -->
      <line x1="80" y1="40" x2="80" y2="420" stroke="rgba(20,33,61,0.25)" stroke-width="1"/>
      <line x1="80" y1="420" x2="960" y2="420" stroke="rgba(20,33,61,0.25)" stroke-width="1"/>

      <!-- ===== Bars ===== -->

      <!-- Bar 1: Fixed fractional (1%) — 66 aandelen -->
      <rect x="140" y="384" width="160" height="36" fill="#FBFAF7"/>
      <rect x="140" y="384" width="160" height="36" fill="rgba(85,96,111,0.15)" stroke="#55606F" stroke-width="1"/>
      <text x="220" y="376" fill="#55606F" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">66</text>

      <!-- Bar 2: Half-Kelly — 666 aandelen (focal) -->
      <rect x="420" y="58" width="160" height="362" fill="#FBFAF7"/>
      <rect x="420" y="58" width="160" height="362" fill="rgba(233,161,59,0.12)" stroke="#E9A13B" stroke-width="1.2"/>
      <text x="500" y="50" fill="#E9A13B" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">666</text>

      <!-- Bar 3: ATR-based (1%, x2) — 50 aandelen -->
      <rect x="700" y="393" width="160" height="27" fill="#FBFAF7"/>
      <rect x="700" y="393" width="160" height="27" fill="rgba(85,96,111,0.15)" stroke="#55606F" stroke-width="1"/>
      <text x="780" y="385" fill="#55606F" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">50</text>

      <!-- ===== Category labels (3-line blocks below x-axis) ===== -->

      <text x="220" y="452" fill="#14213D" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">FIXED FRACTIONAL</text>
      <text x="220" y="468" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">1% risico · stop €3</text>
      <text x="220" y="484" fill="#7C8794" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">notional €3.300</text>

      <text x="500" y="452" fill="#14213D" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">HALF-KELLY</text>
      <text x="500" y="468" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">win rate 45% · ratio 2,2</text>
      <text x="500" y="484" fill="#7C8794" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">notional €33.300</text>

      <text x="780" y="452" fill="#14213D" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ATR-BASED</text>
      <text x="780" y="468" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">1% risico · stop €4 (2×ATR)</text>
      <text x="780" y="484" fill="#7C8794" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">notional €2.500</text>

      <!-- ===== Legend ===== -->
      <line x1="80" y1="508" x2="960" y2="508" stroke="rgba(20,33,61,0.12)" stroke-width="0.8"/>
      <text x="80" y="524" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGENDA</text>

      <rect x="220" y="516" width="14" height="14" rx="3" fill="rgba(233,161,59,0.12)" stroke="#E9A13B" stroke-width="1.2"/>
      <text x="242" y="526" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace">HALF-KELLY — KRUISCONTROLE, GEEN HOOFDMETHODE (GROOTSTE UITSCHIETER)</text>

      <rect x="220" y="536" width="14" height="14" rx="3" fill="rgba(85,96,111,0.15)" stroke="#55606F" stroke-width="1"/>
      <text x="242" y="546" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace">FIXED FRACTIONAL / ATR-BASED — GEHANTEERD RISICOPLAFOND (1% RISICO)</text>
    </svg>