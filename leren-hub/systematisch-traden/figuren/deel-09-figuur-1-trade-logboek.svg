<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 900 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="deel09-logboek-title deel09-logboek-desc">
      <title id="deel09-logboek-title">Trade-logboekstructuur: intentie, uitvoering, evaluatie</title>
      <desc id="deel09-logboek-desc">Flowchart dat toont hoe een trade wordt vastgelegd in drie fasen — intentie vooraf, uitvoering tijdens of direct na, en evaluatie achteraf — met een terugkoppeling naar de intentie van de volgende trade.</desc>
      <defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#55606F"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#E9A13B"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#FBFAF7"/>

      <!-- ===== Connectors (drawn before nodes) ===== -->

      <!-- Arrow 1: Intentie -> Uitvoering (straight, shared x) -->
      <line x1="380" y1="276" x2="380" y2="372" stroke="#55606F" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="388" y="316" width="112" height="16" rx="2" fill="#FBFAF7"/>
      <text x="444" y="327" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TRADE GEOPEND</text>

      <!-- Arrow 2: Uitvoering -> Evaluatie (straight, shared x) -->
      <line x1="380" y1="548" x2="380" y2="644" stroke="#55606F" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="388" y="588" width="112" height="16" rx="2" fill="#FBFAF7"/>
      <text x="444" y="599" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TRADE GESLOTEN</text>

      <!-- Feedback loop: Evaluatie -> Intentie (dashed, via right channel, clears all boxes) -->
      <path d="M620,732 H692 Q700,732 700,724 V176 Q700,168 692,168 H620"
            fill="none" stroke="#7C8794" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="708" y="440" width="112" height="16" rx="2" fill="#FBFAF7"/>
      <text x="764" y="451" fill="#7C8794" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VOLGENDE TRADE</text>

      <!-- ===== Node 1: INTENTIE (vooraf) ===== -->
      <rect x="140" y="60" width="480" height="216" rx="8" fill="#FFFFFF" stroke="#14213D" stroke-width="1"/>
      <circle cx="172" cy="92" r="16" fill="rgba(20,33,61,0.05)" stroke="#55606F" stroke-width="1"/>
      <text x="172" y="97" fill="#14213D" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">1</text>
      <text x="204" y="88" fill="#14213D" font-size="14" font-weight="600" font-family="'Geist', sans-serif">INTENTIE</text>
      <text x="204" y="104" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.12em">VOORAF</text>
      <line x1="160" y1="124" x2="600" y2="124" stroke="rgba(20,33,61,0.12)" stroke-width="0.8"/>
      <text x="168" y="144" fill="#14213D" font-size="10" font-family="'Geist', sans-serif">– Instrument &amp; richting</text>
      <text x="168" y="164" fill="#14213D" font-size="10" font-family="'Geist', sans-serif">– Setup / reden</text>
      <text x="168" y="184" fill="#14213D" font-size="10" font-family="'Geist', sans-serif">– Entry-niveau</text>
      <text x="168" y="204" fill="#14213D" font-size="10" font-family="'Geist', sans-serif">– Stop-loss-niveau</text>
      <text x="168" y="224" fill="#14213D" font-size="10" font-family="'Geist', sans-serif">– Doel- / exit-niveau</text>
      <text x="168" y="244" fill="#14213D" font-size="10" font-family="'Geist', sans-serif">– Positiegrootte &amp; risico</text>

      <!-- ===== Node 2: UITVOERING (tijdens / direct na) ===== -->
      <rect x="140" y="372" width="480" height="176" rx="8" fill="#FFFFFF" stroke="#14213D" stroke-width="1"/>
      <circle cx="172" cy="404" r="16" fill="rgba(20,33,61,0.05)" stroke="#55606F" stroke-width="1"/>
      <text x="172" y="409" fill="#14213D" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">2</text>
      <text x="204" y="400" fill="#14213D" font-size="14" font-weight="600" font-family="'Geist', sans-serif">UITVOERING</text>
      <text x="204" y="416" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.12em">TIJDENS / DIRECT NA</text>
      <line x1="160" y1="436" x2="600" y2="436" stroke="rgba(20,33,61,0.12)" stroke-width="0.8"/>
      <text x="168" y="456" fill="#14213D" font-size="10" font-family="'Geist', sans-serif">– Werkelijke entry-prijs</text>
      <text x="168" y="476" fill="#14213D" font-size="10" font-family="'Geist', sans-serif">– Moment van instappen</text>
      <text x="168" y="496" fill="#14213D" font-size="10" font-family="'Geist', sans-serif">– Aanpassingen onderweg</text>
      <text x="168" y="516" fill="#14213D" font-size="10" font-family="'Geist', sans-serif">– Werkelijke exit-prijs &amp; moment</text>

      <!-- ===== Node 3: EVALUATIE (achteraf) — focal ===== -->
      <rect x="140" y="644" width="480" height="176" rx="8" fill="rgba(233,161,59,0.08)" stroke="#E9A13B" stroke-width="1.2"/>
      <circle cx="172" cy="676" r="16" fill="rgba(233,161,59,0.08)" stroke="#E9A13B" stroke-width="1"/>
      <text x="172" y="681" fill="#E9A13B" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">3</text>
      <text x="204" y="672" fill="#14213D" font-size="14" font-weight="600" font-family="'Geist', sans-serif">EVALUATIE</text>
      <text x="204" y="688" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.12em">ACHTERAF</text>
      <line x1="160" y1="708" x2="600" y2="708" stroke="rgba(20,33,61,0.12)" stroke-width="0.8"/>
      <text x="168" y="728" fill="#14213D" font-size="10" font-family="'Geist', sans-serif">– Hield u zich aan het plan?</text>
      <text x="168" y="748" fill="#14213D" font-size="10" font-family="'Geist', sans-serif">– Afwijking gerechtvaardigd of impulsief?</text>
      <text x="168" y="768" fill="#14213D" font-size="10" font-family="'Geist', sans-serif">– Proces vs. resultaat (niet enkel uitkomst)</text>
      <text x="168" y="788" fill="#14213D" font-size="10" font-family="'Geist', sans-serif">– Wat volgende keer anders?</text>

      <!-- ===== Legend ===== -->
      <line x1="140" y1="860" x2="820" y2="860" stroke="rgba(20,33,61,0.12)" stroke-width="0.8"/>
      <text x="140" y="876" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGENDA</text>

      <line x1="280" y1="872" x2="316" y2="872" stroke="#55606F" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="324" y="876" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace">PER TRADE</text>

      <line x1="480" y1="872" x2="516" y2="872" stroke="#7C8794" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="524" y="876" fill="#7C8794" font-size="9" font-family="'Geist Mono', monospace">VOLGENDE TRADE (LEERCYCLUS)</text>
    </svg>