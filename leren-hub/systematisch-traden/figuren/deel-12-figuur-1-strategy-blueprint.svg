<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1040 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="deel12-blueprint-title deel12-blueprint-desc">
      <title id="deel12-blueprint-title">Strategy blueprint: de negen secties</title>
      <desc id="deel12-blueprint-desc">Tree-diagram dat toont hoe de negen vaste secties van een strategy blueprint zijn gegroepeerd in vijf categorieën rond het centrale blueprint-document.</desc>
      <defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style></defs>

      <rect width="100%" height="100%" fill="#FBFAF7"/>

      <!-- ===== Connectors (drawn before nodes) ===== -->
      <!-- Root drop -->
      <line x1="520" y1="104" x2="520" y2="128" stroke="#55606F" stroke-width="1"/>
      <!-- Horizontal bus -->
      <line x1="120" y1="128" x2="920" y2="128" stroke="#55606F" stroke-width="1"/>
      <!-- Child drops -->
      <line x1="120" y1="128" x2="120" y2="152" stroke="#55606F" stroke-width="1"/>
      <line x1="320" y1="128" x2="320" y2="152" stroke="#55606F" stroke-width="1"/>
      <line x1="520" y1="128" x2="520" y2="152" stroke="#55606F" stroke-width="1"/>
      <line x1="720" y1="128" x2="720" y2="152" stroke="#55606F" stroke-width="1"/>
      <line x1="920" y1="128" x2="920" y2="152" stroke="#55606F" stroke-width="1"/>

      <!-- ===== Root: STRATEGY BLUEPRINT (focal) ===== -->
      <rect x="420" y="40" width="200" height="64" rx="8" fill="rgba(233,161,59,0.08)" stroke="#E9A13B" stroke-width="1.2"/>
      <text x="520" y="68" fill="#14213D" font-size="13" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">STRATEGY BLUEPRINT</text>
      <text x="520" y="86" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">9 SECTIES · VASTE VOLGORDE</text>

      <!-- ===== Child 1: CONTEXT ===== -->
      <rect x="32" y="152" width="176" height="88" rx="6" fill="#FFFFFF" stroke="#14213D" stroke-width="1"/>
      <text x="120" y="172" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CONTEXT</text>
      <line x1="48" y1="184" x2="192" y2="184" stroke="rgba(20,33,61,0.12)" stroke-width="0.8"/>
      <text x="48" y="200" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace">1. Markt &amp; instrument</text>
      <text x="48" y="216" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace">2. Timeframe &amp; stijl</text>

      <!-- ===== Child 2: REGELS ===== -->
      <rect x="232" y="152" width="176" height="88" rx="6" fill="#FFFFFF" stroke="#14213D" stroke-width="1"/>
      <text x="320" y="172" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">REGELS</text>
      <line x1="248" y1="184" x2="392" y2="184" stroke="rgba(20,33,61,0.12)" stroke-width="0.8"/>
      <text x="248" y="200" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace">3. Entry-regels</text>
      <text x="248" y="216" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace">4. Exit-regels</text>

      <!-- ===== Child 3: RISICO ===== -->
      <rect x="432" y="152" width="176" height="88" rx="6" fill="#FFFFFF" stroke="#14213D" stroke-width="1"/>
      <text x="520" y="172" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">RISICO</text>
      <line x1="448" y1="184" x2="592" y2="184" stroke="rgba(20,33,61,0.12)" stroke-width="0.8"/>
      <text x="448" y="200" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace">5. Risk management</text>
      <text x="448" y="216" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace">6. Positiegrootte-methode</text>

      <!-- ===== Child 4: RANDVOORWAARDEN ===== -->
      <rect x="632" y="152" width="176" height="88" rx="6" fill="#FFFFFF" stroke="#14213D" stroke-width="1"/>
      <text x="720" y="172" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">RANDVOORWAARDEN</text>
      <line x1="648" y1="184" x2="792" y2="184" stroke="rgba(20,33,61,0.12)" stroke-width="0.8"/>
      <text x="648" y="200" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace">7. Marktfilters</text>
      <text x="648" y="216" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace">8. Edge-hypothese</text>

      <!-- ===== Child 5: BORGING ===== -->
      <rect x="832" y="152" width="176" height="88" rx="6" fill="#FFFFFF" stroke="#14213D" stroke-width="1"/>
      <text x="920" y="172" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">BORGING</text>
      <line x1="848" y1="184" x2="992" y2="184" stroke="rgba(20,33,61,0.12)" stroke-width="0.8"/>
      <text x="848" y="208" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace">9. Review- en evaluatieritme</text>

      <!-- ===== Legend ===== -->
      <line x1="32" y1="280" x2="1008" y2="280" stroke="rgba(20,33,61,0.12)" stroke-width="0.8"/>
      <text x="32" y="296" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGENDA</text>

      <rect x="180" y="288" width="14" height="14" rx="3" fill="rgba(233,161,59,0.08)" stroke="#E9A13B" stroke-width="1.2"/>
      <text x="202" y="298" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace">KERNARTEFACT (BLUEPRINT)</text>

      <rect x="480" y="288" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#14213D" stroke-width="1"/>
      <text x="502" y="298" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace">SECTIEGROEP (BEVAT GENUMMERDE SECTIES)</text>
    </svg>