<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 528" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="deel15-fig1-title deel15-fig1-desc">
      <title id="deel15-fig1-title">High-watermark en drawdown met kill switch-drempel</title>
      <desc id="deel15-fig1-desc">Lijngrafiek van een fictieve accountwaarde over tien weken, met het meebewegende high-watermark en een kill switch-drempel op 15% onder dat high-watermark; in week 8 raakt de accountwaarde precies de drempel.</desc>
      <defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#55606F"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#E9A13B"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#FBFAF7"/>

      <!-- Y gridlines -->
      <g>
        <line x1="80" y1="440" x2="944" y2="440" stroke="rgba(20,33,61,0.14)" stroke-width="0.8"/>
        <line x1="80" y1="351.1" x2="944" y2="351.1" stroke="rgba(20,33,61,0.08)" stroke-width="0.8"/>
        <line x1="80" y1="262.2" x2="944" y2="262.2" stroke="rgba(20,33,61,0.08)" stroke-width="0.8"/>
        <line x1="80" y1="173.3" x2="944" y2="173.3" stroke="rgba(20,33,61,0.08)" stroke-width="0.8"/>
        <line x1="80" y1="84.4" x2="944" y2="84.4" stroke="rgba(20,33,61,0.08)" stroke-width="0.8"/>
      </g>

      <!-- Y axis labels -->
      <g font-family="'Geist Mono', monospace" font-size="8" fill="#55606F" text-anchor="end">
        <text x="72" y="443">€8.000</text>
        <text x="72" y="354.1">€9.000</text>
        <text x="72" y="265.2">€10.000</text>
        <text x="72" y="176.3">€11.000</text>
        <text x="72" y="87.4">€12.000</text>
      </g>

      <!-- Rotated axis caption -->
      <text transform="rotate(-90 24 240)" x="24" y="240" text-anchor="middle" font-family="'Geist Mono', monospace" font-size="7" letter-spacing="0.14em" fill="#7C8794">ACCOUNTWAARDE (FICTIEF)</text>

      <!-- Kill switch drempel (accent, dashed) -->
      <polyline points="80,395.6 176,335.1 272,282.2 368,229.3 464,229.3 560,229.3 656,229.3 752,229.3 848,229.3 944,229.3"
                fill="none" stroke="#E9A13B" stroke-width="1.2" stroke-dasharray="5,4" stroke-linejoin="round"/>

      <!-- High-watermark (muted, solid thin) -->
      <polyline points="80,262.2 176,191.1 272,128.9 368,66.7 464,66.7 560,66.7 656,66.7 752,66.7 848,66.7 944,66.7"
                fill="none" stroke="#55606F" stroke-width="1.2" stroke-linejoin="round"/>

      <!-- Accountwaarde (focal, accent solid) -->
      <polyline points="80,262.2 176,191.1 272,128.9 368,66.7 464,106.7 560,164.4 656,217.8 752,229.3 848,208.9 944,155.6"
                fill="none" stroke="#E9A13B" stroke-width="1.8" stroke-linejoin="round"/>
      <g fill="#E9A13B">
        <circle cx="80" cy="262.2" r="4"/>
        <circle cx="176" cy="191.1" r="4"/>
        <circle cx="272" cy="128.9" r="4"/>
        <circle cx="368" cy="66.7" r="4"/>
        <circle cx="464" cy="106.7" r="4"/>
        <circle cx="560" cy="164.4" r="4"/>
        <circle cx="656" cy="217.8" r="4"/>
        <circle cx="848" cy="208.9" r="4"/>
        <circle cx="944" cy="155.6" r="4"/>
      </g>

      <!-- Kill switch trigger point (week 8) -->
      <circle cx="752" cy="229.3" r="7" fill="none" stroke="#14213D" stroke-width="1.2"/>
      <circle cx="752" cy="229.3" r="4" fill="#E9A13B"/>
      <rect x="616" y="132" width="176" height="28" rx="4" fill="#FBFAF7"/>
      <text x="792" y="144" text-anchor="end" font-family="'Geist', sans-serif" font-size="9" font-weight="600" fill="#14213D">Kill switch geactiveerd</text>
      <text x="792" y="156" text-anchor="end" font-family="'Geist Mono', monospace" font-size="7.5" fill="#55606F">week 8 · drawdown = -15,0%</text>

      <!-- X axis labels -->
      <g font-family="'Geist Mono', monospace" font-size="8" fill="#55606F" text-anchor="middle">
        <text x="80" y="452">wk 1</text>
        <text x="176" y="452">wk 2</text>
        <text x="272" y="452">wk 3</text>
        <text x="368" y="452">wk 4</text>
        <text x="464" y="452">wk 5</text>
        <text x="560" y="452">wk 6</text>
        <text x="656" y="452">wk 7</text>
        <text x="752" y="452">wk 8</text>
        <text x="848" y="452">wk 9</text>
        <text x="944" y="452">wk 10</text>
      </g>

      <!-- Legend -->
      <line x1="30" y1="464" x2="970" y2="464" stroke="rgba(20,33,61,0.12)" stroke-width="0.8"/>
      <text x="30" y="480" font-family="'Geist Mono', monospace" font-size="8" letter-spacing="0.14em" fill="#55606F">LEGEND</text>

      <rect x="30" y="486" width="16" height="8" fill="#E9A13B"/>
      <text x="52" y="493" font-family="'Geist Mono', monospace" font-size="8" fill="#14213D">ACCOUNTWAARDE (FICTIEF)</text>

      <rect x="330" y="486" width="16" height="8" fill="#55606F"/>
      <text x="352" y="493" font-family="'Geist Mono', monospace" font-size="8" fill="#14213D">HIGH-WATERMARK</text>

      <rect x="620" y="486" width="16" height="4" fill="none"/>
      <line x1="620" y1="490" x2="636" y2="490" stroke="#E9A13B" stroke-width="1.2" stroke-dasharray="5,4"/>
      <text x="642" y="493" font-family="'Geist Mono', monospace" font-size="8" fill="#14213D">KILL SWITCH-DREMPEL (-15%)</text>
    </svg>