<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d15f1-title d15f1-desc">
      <title id="d15f1-title">SSH-handshake met key-authenticatie</title>
      <desc id="d15f1-desc">Sequentiediagram tussen client en server: de server stuurt een challenge, de client ondertekent die lokaal met de privésleutel zonder deze te verzenden, de client stuurt de handtekening terug, de server verifieert lokaal met de publieke sleutel, en verleent daarna toegang.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#55606F"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#E9A13B"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2563A8"/></marker>
      </defs>

      <rect width="760" height="440" fill="#FBFAF7"/>

      <!-- Actor boxes -->
      <rect x="128" y="24" width="144" height="32" rx="6" fill="#FFFFFF" stroke="#14213D" stroke-width="1"/>
      <text x="200" y="40" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">CLIENT</text>
      <text x="200" y="52" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">privésleutel lokaal</text>

      <rect x="488" y="24" width="144" height="32" rx="6" fill="#FFFFFF" stroke="#14213D" stroke-width="1"/>
      <text x="560" y="40" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SERVER</text>
      <text x="560" y="52" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10.20.4.11</text>

      <!-- Lifelines -->
      <line x1="200" y1="56" x2="200" y2="380" stroke="rgba(20,33,61,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="560" y1="56" x2="560" y2="380" stroke="rgba(20,33,61,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- Activation bars -->
      <rect x="196" y="100" width="8" height="120" fill="rgba(20,33,61,0.06)" stroke="#55606F" stroke-width="0.8"/>
      <rect x="556" y="220" width="8" height="120" fill="rgba(20,33,61,0.06)" stroke="#55606F" stroke-width="0.8"/>

      <!-- Message 1: challenge, server -> client -->
      <line x1="560" y1="100" x2="200" y2="100" stroke="#55606F" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="348" y="80" width="64" height="12" rx="2" fill="#FBFAF7"/>
      <text x="380" y="89" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CHALLENGE</text>

      <!-- Self-message: client signs locally -->
      <path d="M204,150 H236 V170 H204" fill="none" stroke="#55606F" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="244" y="152" width="88" height="12" rx="2" fill="#FBFAF7"/>
      <text x="248" y="161" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.06em">TEKENT LOKAAL</text>

      <!-- Message 2: handtekening, client -> server -->
      <line x1="200" y1="220" x2="560" y2="220" stroke="#55606F" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="320" y="200" width="120" height="12" rx="2" fill="#FBFAF7"/>
      <text x="380" y="209" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HANDTEKENING</text>

      <!-- Self-message: server verifies -->
      <path d="M556,260 H524 V280 H556" fill="none" stroke="#55606F" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="424" y="264" width="92" height="12" rx="2" fill="#FBFAF7"/>
      <text x="512" y="273" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">VERIFIEERT</text>

      <!-- Message 3: access granted, server -> client (headline success) -->
      <line x1="560" y1="340" x2="200" y2="340" stroke="#E9A13B" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="344" y="320" width="72" height="12" rx="2" fill="#FBFAF7"/>
      <text x="380" y="329" fill="#E9A13B" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TOEGANG OK</text>

      <!-- Legend -->
      <line x1="24" y1="396" x2="736" y2="396" stroke="rgba(20,33,61,0.12)" stroke-width="0.8"/>
      <text x="24" y="416" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGENDA</text>

      <line x1="140" y1="416" x2="172" y2="416" stroke="#55606F" stroke-width="1" marker-end="url(#arrow)"/>
      <text x="180" y="419" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.02em">OVER DE VERBINDING</text>

      <path d="M400,408 H420 V424 H400" fill="none" stroke="#55606F" stroke-width="1" marker-end="url(#arrow)"/>
      <text x="428" y="419" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.02em">LOKAAL — NOOIT VERZONDEN</text>

      <line x1="628" y1="416" x2="660" y2="416" stroke="#E9A13B" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <text x="668" y="419" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.02em">RESULTAAT</text>
    </svg>