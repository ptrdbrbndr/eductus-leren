<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="vm-vs-container-title vm-vs-container-desc">
      <title id="vm-vs-container-title">VM versus container</title>
      <desc id="vm-vs-container-desc">Links een hypervisor waarbij elke virtuele machine een eigen gastkernel en gastbesturingssysteem draait op gedeelde hosthardware; rechts de Docker-engine op één hostkernel met daarboven meerdere geïsoleerde containers die diezelfde kernel delen, zonder eigen gastkernel per container.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#55606F"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#E9A13B"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2563A8"/></marker>
      </defs>

      <rect width="960" height="600" fill="#FBFAF7"/>

      <!-- ===== Zones (drawn before nodes) ===== -->
      <rect x="40" y="64" width="400" height="336" rx="8" fill="rgba(20,33,61,0.02)" stroke="rgba(20,33,61,0.10)" stroke-width="0.8"/>
      <rect x="520" y="64" width="400" height="336" rx="8" fill="rgba(20,33,61,0.02)" stroke="rgba(20,33,61,0.10)" stroke-width="0.8"/>

      <!-- Vertical divider between the two panels -->
      <line x1="480" y1="64" x2="480" y2="400" stroke="rgba(20,33,61,0.14)" stroke-width="1"/>

      <!-- Zone labels -->
      <rect x="56" y="68" width="120" height="16" rx="2" fill="#FBFAF7"/>
      <text x="116" y="80" fill="rgba(20,33,61,0.45)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">HYPERVISOR</text>

      <rect x="536" y="68" width="168" height="16" rx="2" fill="#FBFAF7"/>
      <text x="620" y="80" fill="rgba(20,33,61,0.45)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CONTAINER-ENGINE</text>

      <!-- ===== LEFT PANEL: hypervisor + 2 VM's ===== -->

      <!-- VM 1 -->
      <rect x="64" y="96" width="160" height="144" rx="6" fill="#ffffff" stroke="#14213D" stroke-width="1"/>
      <text x="144" y="116" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">VM 1</text>
      <rect x="72" y="124" width="144" height="48" rx="4" fill="rgba(85,96,111,0.10)" stroke="#7C8794" stroke-width="0.8"/>
      <text x="144" y="152" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">gastbesturingssysteem</text>
      <rect x="72" y="180" width="144" height="48" rx="4" fill="rgba(20,33,61,0.05)" stroke="#55606F" stroke-width="0.8"/>
      <text x="144" y="208" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">gastkernel</text>

      <!-- VM 2 -->
      <rect x="256" y="96" width="160" height="144" rx="6" fill="#ffffff" stroke="#14213D" stroke-width="1"/>
      <text x="336" y="116" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">VM 2</text>
      <rect x="264" y="124" width="144" height="48" rx="4" fill="rgba(85,96,111,0.10)" stroke="#7C8794" stroke-width="0.8"/>
      <text x="336" y="152" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">gastbesturingssysteem</text>
      <rect x="264" y="180" width="144" height="48" rx="4" fill="rgba(20,33,61,0.05)" stroke="#55606F" stroke-width="0.8"/>
      <text x="336" y="208" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">gastkernel</text>

      <!-- Hypervisor -->
      <rect x="64" y="264" width="352" height="48" rx="6" fill="#ffffff" stroke="#14213D" stroke-width="1"/>
      <text x="240" y="284" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hypervisor</text>
      <text x="240" y="298" fill="#7C8794" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">virtualiseert hardware</text>

      <!-- Host hardware -->
      <rect x="64" y="336" width="352" height="40" rx="6" fill="rgba(20,33,61,0.03)" stroke="rgba(20,33,61,0.30)" stroke-width="1"/>
      <text x="240" y="360" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hosthardware</text>

      <!-- ===== RIGHT PANEL: docker-engine + 3 containers ===== -->

      <!-- Container 1 -->
      <rect x="544" y="96" width="96" height="144" rx="6" fill="#ffffff" stroke="#14213D" stroke-width="1"/>
      <text x="592" y="116" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Container 1</text>
      <rect x="552" y="168" width="80" height="48" rx="4" fill="rgba(85,96,111,0.10)" stroke="#7C8794" stroke-width="0.8"/>
      <text x="592" y="196" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">proces</text>

      <!-- Container 2 -->
      <rect x="672" y="96" width="96" height="144" rx="6" fill="#ffffff" stroke="#14213D" stroke-width="1"/>
      <text x="720" y="116" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Container 2</text>
      <rect x="680" y="168" width="80" height="48" rx="4" fill="rgba(85,96,111,0.10)" stroke="#7C8794" stroke-width="0.8"/>
      <text x="720" y="196" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">proces</text>

      <!-- Container 3 -->
      <rect x="800" y="96" width="96" height="144" rx="6" fill="#ffffff" stroke="#14213D" stroke-width="1"/>
      <text x="848" y="116" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Container 3</text>
      <rect x="808" y="168" width="80" height="48" rx="4" fill="rgba(85,96,111,0.10)" stroke="#7C8794" stroke-width="0.8"/>
      <text x="848" y="196" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">proces</text>

      <!-- Docker-engine -->
      <rect x="544" y="264" width="352" height="48" rx="6" fill="#ffffff" stroke="#14213D" stroke-width="1"/>
      <text x="720" y="284" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Docker-engine</text>
      <text x="720" y="298" fill="#7C8794" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">beheert namespaces + cgroups</text>

      <!-- Hostkernel (gedeeld) — focal -->
      <rect x="544" y="336" width="352" height="40" rx="6" fill="rgba(233,161,59,0.08)" stroke="#E9A13B" stroke-width="1.2"/>
      <text x="720" y="360" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hostkernel (gedeeld)</text>

      <!-- ===== Captions (2 editorial callouts, one per panel) ===== -->
      <text x="64" y="432" fill="#14213D" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">Elke VM krijgt een eigen gastkernel</text>
      <text x="64" y="452" fill="#14213D" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">en gastbesturingssysteem.</text>

      <text x="544" y="432" fill="#14213D" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">Containers delen één hostkernel —</text>
      <text x="544" y="452" fill="#14213D" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">geen gastkernel per container.</text>

      <!-- ===== Legend ===== -->
      <line x1="40" y1="528" x2="920" y2="528" stroke="rgba(20,33,61,0.10)" stroke-width="0.8"/>
      <text x="40" y="544" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGENDA</text>

      <rect x="180" y="536" width="12" height="12" rx="2" fill="#ffffff" stroke="#14213D" stroke-width="1"/>
      <text x="200" y="546" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace">hypervisor / engine</text>

      <rect x="380" y="536" width="12" height="12" rx="2" fill="rgba(20,33,61,0.05)" stroke="#55606F" stroke-width="0.8"/>
      <text x="400" y="546" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace">gastkernel (per VM)</text>

      <rect x="600" y="536" width="12" height="12" rx="2" fill="rgba(233,161,59,0.08)" stroke="#E9A13B" stroke-width="1.2"/>
      <text x="620" y="546" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace">hostkernel (gedeeld)</text>
    </svg>