<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fhs-boom-title fhs-boom-desc">
      <title id="fhs-boom-title">De FHS-boom: root met vijf functiecategorieën van topmappen</title>
      <desc id="fhs-boom-desc">Boomdiagram met root (/) bovenaan en vijf categorieën eronder — programma's, configuratie, gebruikersdata, variabele/tijdelijke data, en apparaten/opslag/opstart — elk met de bijbehorende FHS-topmappen als technisch sublabel.</desc>
      <defs>
        <pattern id="fhs-dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(20,33,61,0.10)"/>
        </pattern>
      </defs>

      <rect width="100%" height="100%" fill="#FBFAF7"/>

      <!-- Tier tags (left margin) -->
      <text x="40" y="108" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.16em">ROOT</text>
      <text x="40" y="212" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.16em">FUNCTIE-CATEGORIE</text>

      <!-- Connectors drawn first (behind nodes) -->
      <path d="M 480 128 L 480 168 L 120 168 L 120 220" fill="none" stroke="#55606F" stroke-width="1"/>
      <path d="M 480 168 L 300 168 L 300 220" fill="none" stroke="#55606F" stroke-width="1"/>
      <path d="M 480 168 L 480 220" fill="none" stroke="#55606F" stroke-width="1"/>
      <path d="M 480 168 L 660 168 L 660 220" fill="none" stroke="#55606F" stroke-width="1"/>
      <path d="M 480 168 L 840 168 L 840 220" fill="none" stroke="#55606F" stroke-width="1"/>

      <!-- Root node: / (focal) -->
      <rect x="400" y="80" width="160" height="48" rx="6" fill="rgba(233,161,59,0.08)" stroke="#E9A13B" stroke-width="1"/>
      <rect x="408" y="88" width="32" height="12" rx="2" fill="transparent" stroke="rgba(233,161,59,0.50)" stroke-width="0.8"/>
      <text x="424" y="97" fill="#B9781F" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ROOT</text>
      <text x="480" y="118" fill="#14213D" font-size="14" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">/</text>

      <!-- Category 1: Programma's -->
      <rect x="40" y="220" width="160" height="80" rx="6" fill="#ffffff" stroke="#14213D" stroke-width="1"/>
      <text x="120" y="244" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Programma's</text>
      <text x="120" y="262" fill="#55606F" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">/bin /sbin /usr</text>
      <text x="120" y="274" fill="#55606F" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">/opt</text>
      <text x="120" y="290" fill="#7C8794" font-size="8" font-family="'Geist', sans-serif" font-style="italic" text-anchor="middle">commando's &amp; software</text>

      <!-- Category 2: Configuratie -->
      <rect x="220" y="220" width="160" height="80" rx="6" fill="#ffffff" stroke="#14213D" stroke-width="1"/>
      <text x="300" y="244" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Configuratie</text>
      <text x="300" y="266" fill="#55606F" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">/etc</text>
      <text x="300" y="290" fill="#7C8794" font-size="8" font-family="'Geist', sans-serif" font-style="italic" text-anchor="middle">instellingen systeem &amp; software</text>

      <!-- Category 3: Gebruikersdata -->
      <rect x="400" y="220" width="160" height="80" rx="6" fill="#ffffff" stroke="#14213D" stroke-width="1"/>
      <text x="480" y="244" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Gebruikersdata</text>
      <text x="480" y="266" fill="#55606F" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">/home /root</text>
      <text x="480" y="290" fill="#7C8794" font-size="8" font-family="'Geist', sans-serif" font-style="italic" text-anchor="middle">persoonlijke mappen</text>

      <!-- Category 4: Variabel & tijdelijk -->
      <rect x="580" y="220" width="160" height="80" rx="6" fill="#ffffff" stroke="#14213D" stroke-width="1"/>
      <text x="660" y="244" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Variabel &amp; tijdelijk</text>
      <text x="660" y="266" fill="#55606F" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">/var /tmp</text>
      <text x="660" y="290" fill="#7C8794" font-size="8" font-family="'Geist', sans-serif" font-style="italic" text-anchor="middle">logs, spool, cache</text>

      <!-- Category 5: Apparaten & opstart -->
      <rect x="760" y="220" width="160" height="80" rx="6" fill="#ffffff" stroke="#14213D" stroke-width="1"/>
      <text x="840" y="240" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Apparaten &amp; opstart</text>
      <text x="840" y="260" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">/dev /proc /mnt</text>
      <text x="840" y="271" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">/media /boot /srv</text>
      <text x="840" y="290" fill="#7C8794" font-size="8" font-family="'Geist', sans-serif" font-style="italic" text-anchor="middle">apparaten, koppelpunten, opstart</text>

      <!-- Legend strip -->
      <line x1="40" y1="332" x2="920" y2="332" stroke="rgba(20,33,61,0.10)" stroke-width="0.8"/>
      <text x="40" y="348" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGENDA</text>

      <rect x="40" y="364" width="14" height="10" rx="2" fill="rgba(233,161,59,0.08)" stroke="#E9A13B" stroke-width="1"/>
      <text x="60" y="372" fill="#55606F" font-size="8.5" font-family="'Geist', sans-serif">Root — startpunt van de ene boom</text>

      <rect x="320" y="364" width="14" height="10" rx="2" fill="#ffffff" stroke="#14213D" stroke-width="1"/>
      <text x="340" y="372" fill="#55606F" font-size="8.5" font-family="'Geist', sans-serif">Functiecategorie met bijhorende topmappen</text>

      <text x="40" y="398" fill="#55606F" font-size="8.5" font-family="'Geist', sans-serif" font-style="italic">Subset van de FHS, gegroepeerd per functie. /etc en /var/log zijn in de praktijk het vaakst relevant. /lib, /run en overige topmappen: zie de volledige tabel in de reader.</text>
    </svg>