<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="netwerklagen-title netwerklagen-desc">
      <title id="netwerklagen-title">Netwerklagen van een Linux-systeem</title>
      <desc id="netwerklagen-desc">Layer stack van vijf netwerklagen van fysiek naar logisch — netwerkkaart, linklaag, IP-laag, transportlaag en applicatie — met de IP-laag gemarkeerd als de plek waar ufw en firewalld via netfilter ingrijpen.</desc>

      <rect width="100%" height="100%" fill="#FBFAF7"/>

      <!-- Direction column (left margin) -->
      <text x="40" y="112" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">ABSTRACTIE</text>
      <line x1="80" y1="124" x2="80" y2="436" stroke="rgba(20,33,61,0.30)" stroke-width="1"/>
      <polygon points="76,124 84,124 80,116" fill="#55606F"/>
      <text x="40" y="452" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">SIGNAAL</text>

      <!-- Stack container hairlines -->
      <line x1="140" y1="120" x2="740" y2="120" stroke="rgba(20,33,61,0.12)" stroke-width="1"/>
      <line x1="140" y1="440" x2="740" y2="440" stroke="rgba(20,33,61,0.12)" stroke-width="1"/>

      <!-- L5 — Applicatie (top, meest abstract) -->
      <rect x="140" y="120" width="600" height="64" fill="#FFFFFF"/>
      <line x1="140" y1="184" x2="740" y2="184" stroke="rgba(20,33,61,0.12)" stroke-width="1"/>
      <text x="160" y="156" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">05</text>
      <text x="280" y="158" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Applicatie</text>
      <text x="720" y="158" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">sshd:22 · grafana:3000</text>

      <!-- L4 — Transportlaag (TCP/UDP, poort) -->
      <rect x="140" y="184" width="600" height="64" fill="#FBFAF7"/>
      <text x="160" y="220" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">04</text>
      <text x="280" y="222" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Transportlaag (TCP/UDP)</text>
      <text x="720" y="222" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">koppeling aan poort</text>

      <!-- L3 — IP-laag met netfilter/firewallhaak (FOCAL) -->
      <rect x="140" y="248" width="600" height="64" fill="rgba(233,161,59,0.08)"/>
      <rect x="140" y="248" width="600" height="64" fill="none" stroke="#E9A13B" stroke-width="1"/>
      <text x="160" y="284" fill="#E9A13B" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" letter-spacing="0.14em">03</text>
      <text x="280" y="286" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif">IP-laag · netfilter</text>
      <text x="720" y="286" fill="#E9A13B" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">routering + firewallhaak</text>

      <!-- L2 — Linklaag (ethernet-frames) -->
      <rect x="140" y="312" width="600" height="64" fill="#FFFFFF"/>
      <line x1="140" y1="376" x2="740" y2="376" stroke="rgba(20,33,61,0.12)" stroke-width="1"/>
      <text x="160" y="348" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">02</text>
      <text x="280" y="350" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Linklaag</text>
      <text x="720" y="350" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">ethernet-frames</text>

      <!-- L1 — NIC (bottom, meest fysiek) -->
      <rect x="140" y="376" width="600" height="64" fill="#FBFAF7"/>
      <text x="160" y="412" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">01</text>
      <text x="280" y="414" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Netwerkkaart (NIC)</text>
      <text x="720" y="414" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.06em">signalen → frames</text>

      <!-- Annotation callout — where ufw/firewalld intervene -->
      <text x="900" y="76" fill="#E9A13B" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">hier grijpen ufw / firewalld in</text>
      <path d="M 700 84 Q 780 160 740 280" fill="none" stroke="rgba(233,161,59,0.50)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="740" cy="280" r="2" fill="#E9A13B"/>

      <!-- Caption -->
      <text x="140" y="476" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">FOCAL LAYER</text>
      <text x="260" y="476" fill="#55606F" font-size="8.5" font-family="'Geist', sans-serif" font-style="italic">Op de IP-laag grijpt netfilter in — het kernel-raamwerk waarop ufw en firewalld zijn gebouwd.</text>
    </svg>