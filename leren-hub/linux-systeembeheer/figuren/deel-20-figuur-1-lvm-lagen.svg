<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lvm-lagen-title lvm-lagen-desc">
      <title id="lvm-lagen-title">De gelaagde structuur van LVM, van fysieke partitie tot mountpoint</title>
      <desc id="lvm-lagen-desc">Gelaagd diagram dat toont hoe partities Physical Volumes worden, hoe één of meerdere Physical Volumes samenkomen in één Volume Group, hoe die Volume Group uitwaaiert naar meerdere Logical Volumes, en hoe één Logical Volume via een filesystem op een mountpoint terechtkomt.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#55606F"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#E9A13B"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2563A8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#FBFAF7"/>

      <!-- Direction column (left margin) -->
      <text x="24" y="80" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">MOUNT</text>
      <line x1="44" y1="96" x2="44" y2="552" stroke="rgba(20,33,61,0.30)" stroke-width="1"/>
      <polygon points="40,96 48,96 44,88" fill="#55606F"/>
      <text x="24" y="568" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">FYSIEK</text>

      <!-- ===== Connectors (drawn before boxes) ===== -->

      <!-- L1 Physical 1 -> L2 PV 1 (straight, shared x=180) -->
      <line x1="180" y1="500" x2="180" y2="476" stroke="#55606F" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- L1 Physical 2 -> L2 PV 2 (straight, shared x=620) -->
      <line x1="620" y1="500" x2="620" y2="476" stroke="#55606F" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- L2 PV 1 -> L3 VG (elbow, fan-in attach point x=452 on VG bottom edge) -->
      <path d="M 180,420 V 416 Q 180,408 188,408 H 444 Q 452,408 452,400 V 396" fill="none" stroke="#55606F" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- L2 PV 2 -> L3 VG (elbow, fan-in attach point x=508 on VG bottom edge) -->
      <path d="M 620,420 V 416 Q 620,408 612,408 H 516 Q 508,408 508,400 V 396" fill="none" stroke="#55606F" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- L3 VG -> L4 LV 1 (elbow, fan-out attach x=452 on VG top edge — concrete path, accent) -->
      <path d="M 452,340 V 336 Q 452,328 444,328 H 188 Q 180,328 180,320 V 316" fill="none" stroke="#E9A13B" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- L3 VG -> L4 LV 2 (elbow, fan-out attach x=508 on VG top edge — generiek) -->
      <path d="M 508,340 V 336 Q 508,328 516,328 H 612 Q 620,328 620,320 V 316" fill="none" stroke="#55606F" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- L4 LV 1 -> L5 Filesystem (straight, shared x=180) -->
      <line x1="180" y1="260" x2="180" y2="236" stroke="#55606F" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- L5 Filesystem -> L6 Mountpoint (straight, shared x=180) -->
      <line x1="180" y1="180" x2="180" y2="156" stroke="#55606F" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- ===== Nodes (bottom to top: toenemende abstractie) ===== -->

      <!-- L1 — Physical 1 (concreet, uit de reader) -->
      <rect x="100" y="500" width="160" height="56" rx="6" fill="#ffffff" stroke="#14213D" stroke-width="1"/>
      <rect x="108" y="506" width="48" height="12" rx="2" fill="transparent" stroke="rgba(20,33,61,0.40)" stroke-width="0.8"/>
      <text x="132" y="515" fill="#14213D" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">L1</text>
      <text x="180" y="530" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Partitie</text>
      <text x="180" y="546" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/dev/sdb1</text>

      <!-- L1 — Physical 2 (generiek, illustreert "een of meerdere") -->
      <rect x="540" y="500" width="160" height="56" rx="6" fill="rgba(20,33,61,0.02)" stroke="rgba(20,33,61,0.20)" stroke-width="0.8" stroke-dasharray="4,3"/>
      <rect x="548" y="506" width="48" height="12" rx="2" fill="transparent" stroke="rgba(20,33,61,0.40)" stroke-width="0.8"/>
      <text x="572" y="515" fill="#14213D" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">L1</text>
      <text x="620" y="534" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Partitie / schijf</text>

      <!-- L2 — PV 1 (concreet) -->
      <rect x="100" y="420" width="160" height="56" rx="6" fill="#ffffff" stroke="#14213D" stroke-width="1"/>
      <rect x="108" y="426" width="48" height="12" rx="2" fill="transparent" stroke="rgba(20,33,61,0.40)" stroke-width="0.8"/>
      <text x="132" y="435" fill="#14213D" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">L2</text>
      <text x="180" y="450" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Physical Volume</text>
      <text x="180" y="466" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">PV</text>

      <!-- L2 — PV 2 (generiek) -->
      <rect x="540" y="420" width="160" height="56" rx="6" fill="rgba(20,33,61,0.02)" stroke="rgba(20,33,61,0.20)" stroke-width="0.8" stroke-dasharray="4,3"/>
      <rect x="548" y="426" width="48" height="12" rx="2" fill="transparent" stroke="rgba(20,33,61,0.40)" stroke-width="0.8"/>
      <text x="572" y="435" fill="#14213D" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">L2</text>
      <text x="620" y="450" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Physical Volume</text>
      <text x="620" y="466" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">PV</text>

      <!-- L3 — VG (focal: waar PV's samenkomen en waaruit LV's ontstaan) -->
      <rect x="400" y="340" width="160" height="56" rx="6" fill="rgba(233,161,59,0.08)" stroke="#E9A13B" stroke-width="1"/>
      <rect x="408" y="346" width="48" height="12" rx="2" fill="transparent" stroke="rgba(233,161,59,0.50)" stroke-width="0.8"/>
      <text x="432" y="355" fill="#E9A13B" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">L3</text>
      <text x="480" y="370" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Volume Group</text>
      <text x="480" y="386" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">vg_rapportage</text>

      <!-- L4 — LV 1 (concreet, vervolgt naar filesystem) -->
      <rect x="100" y="260" width="160" height="56" rx="6" fill="#ffffff" stroke="#14213D" stroke-width="1"/>
      <rect x="108" y="266" width="48" height="12" rx="2" fill="transparent" stroke="rgba(20,33,61,0.40)" stroke-width="0.8"/>
      <text x="132" y="275" fill="#14213D" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">L4</text>
      <text x="180" y="290" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Logical Volume</text>
      <text x="180" y="306" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">lv_batchdata</text>

      <!-- L4 — LV 2 (generiek, illustreert "uitgesneden in Logical Volumes") -->
      <rect x="540" y="260" width="160" height="56" rx="6" fill="rgba(20,33,61,0.02)" stroke="rgba(20,33,61,0.20)" stroke-width="0.8" stroke-dasharray="4,3"/>
      <rect x="548" y="266" width="48" height="12" rx="2" fill="transparent" stroke="rgba(20,33,61,0.40)" stroke-width="0.8"/>
      <text x="572" y="275" fill="#14213D" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">L4</text>
      <text x="620" y="290" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Logical Volume</text>
      <text x="620" y="306" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">LV</text>

      <!-- L5 — Filesystem -->
      <rect x="100" y="180" width="160" height="56" rx="6" fill="#ffffff" stroke="#14213D" stroke-width="1"/>
      <rect x="108" y="186" width="48" height="12" rx="2" fill="transparent" stroke="rgba(20,33,61,0.40)" stroke-width="0.8"/>
      <text x="132" y="195" fill="#14213D" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">L5</text>
      <text x="180" y="210" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Filesystem</text>
      <text x="180" y="226" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ext4</text>

      <!-- L6 — Mountpoint -->
      <rect x="100" y="100" width="160" height="56" rx="6" fill="#ffffff" stroke="#14213D" stroke-width="1"/>
      <rect x="108" y="106" width="48" height="12" rx="2" fill="transparent" stroke="rgba(20,33,61,0.40)" stroke-width="0.8"/>
      <text x="132" y="115" fill="#14213D" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">L6</text>
      <text x="180" y="130" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Mountpoint</text>
      <text x="180" y="146" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/mnt/batchdata</text>

      <!-- ===== Legend ===== -->
      <line x1="40" y1="580" x2="920" y2="580" stroke="rgba(20,33,61,0.12)" stroke-width="0.8"/>
      <text x="40" y="596" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="608" width="24" height="12" rx="2" fill="#ffffff" stroke="#14213D" stroke-width="1"/>
      <text x="72" y="618" fill="#55606F" font-size="8.5" font-family="'Geist', sans-serif">Voorbeeld uit de reader</text>

      <rect x="248" y="608" width="24" height="12" rx="2" fill="rgba(20,33,61,0.02)" stroke="rgba(20,33,61,0.20)" stroke-width="0.8" stroke-dasharray="4,3"/>
      <text x="280" y="618" fill="#55606F" font-size="8.5" font-family="'Geist', sans-serif">Generiek — illustreert "een of meer"</text>

      <rect x="536" y="608" width="24" height="12" rx="2" fill="rgba(233,161,59,0.08)" stroke="#E9A13B" stroke-width="1"/>
      <text x="568" y="618" fill="#55606F" font-size="8.5" font-family="'Geist', sans-serif">Volume Group — waar PV's samenkomen en LV's ontstaan</text>
    </svg>