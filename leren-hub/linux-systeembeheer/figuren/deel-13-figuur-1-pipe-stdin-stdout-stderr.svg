<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 920 396" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d13f1-title d13f1-desc">
      <title id="d13f1-title">Pipe-diagram: stdin, stdout en stderr</title>
      <desc id="d13f1-desc">Toont links een commando met zijn drie standaardkanalen stdin (0) in, stdout (1) en stderr (2) uit, en rechts twee commando's die via een pipe zijn gekoppeld, waarbij stdout van het linker commando naar stdin van het rechter commando stroomt.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#55606F"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#E9A13B"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2563A8"/></marker>
      </defs>

      <rect width="920" height="396" fill="#FBFAF7"/>

      <!-- Zone A -->
      <rect x="24" y="64" width="400" height="280" rx="8" fill="rgba(20,33,61,0.02)" stroke="rgba(20,33,61,0.10)" stroke-width="0.8"/>
      <rect x="40" y="68" width="200" height="12" rx="2" fill="#FBFAF7"/>
      <text x="140" y="77" fill="rgba(20,33,61,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">A · ÉÉN COMMANDO — DRIE KANALEN</text>

      <!-- Zone B -->
      <rect x="456" y="64" width="440" height="280" rx="8" fill="rgba(20,33,61,0.02)" stroke="rgba(20,33,61,0.10)" stroke-width="0.8"/>
      <rect x="472" y="68" width="248" height="12" rx="2" fill="#FBFAF7"/>
      <text x="596" y="77" fill="rgba(20,33,61,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">B · PIPE TUSSEN TWEE COMMANDO'S</text>

      <!-- Panel A arrows (drawn before boxes) -->
      <line x1="64" y1="204" x2="152" y2="204" stroke="#55606F" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="76" y="184" width="64" height="12" rx="2" fill="#FBFAF7"/>
      <text x="108" y="193" fill="#7C8794" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">0 · STDIN</text>

      <line x1="224" y1="172" x2="224" y2="92" stroke="#55606F" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="232" y="128" width="88" height="12" rx="2" fill="#FBFAF7"/>
      <text x="236" y="137" fill="#7C8794" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.06em">1 · STDOUT</text>

      <line x1="224" y1="236" x2="224" y2="316" stroke="#55606F" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="232" y="272" width="88" height="12" rx="2" fill="#FBFAF7"/>
      <text x="236" y="281" fill="#7C8794" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.06em">2 · STDERR</text>

      <!-- Panel B pipe arrow -->
      <line x1="644" y1="204" x2="708" y2="204" stroke="#E9A13B" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="660" y="184" width="32" height="12" rx="2" fill="#FBFAF7"/>
      <text x="676" y="193" fill="#E9A13B" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PIPE</text>

      <!-- Panel A node -->
      <rect x="152" y="172" width="144" height="64" rx="6" fill="#FFFFFF" stroke="#14213D" stroke-width="1"/>
      <text x="224" y="200" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">COMMANDO</text>
      <text x="224" y="216" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">fd 0 · 1 · 2</text>

      <!-- Panel B nodes -->
      <rect x="524" y="172" width="120" height="64" rx="6" fill="#FFFFFF" stroke="#14213D" stroke-width="1"/>
      <text x="584" y="200" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">COMMANDO</text>
      <text x="584" y="216" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">fd 0 · 1 · 2</text>

      <rect x="708" y="172" width="120" height="64" rx="6" fill="#FFFFFF" stroke="#14213D" stroke-width="1"/>
      <text x="768" y="200" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">COMMANDO</text>
      <text x="768" y="216" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">fd 0 · 1 · 2</text>

      <!-- Legend -->
      <line x1="24" y1="352" x2="896" y2="352" stroke="rgba(20,33,61,0.12)" stroke-width="0.8"/>
      <text x="24" y="372" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGENDA</text>

      <line x1="140" y1="372" x2="172" y2="372" stroke="#55606F" stroke-width="1" marker-end="url(#arrow)"/>
      <text x="180" y="375" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.02em">KANAAL (FD 0/1/2)</text>

      <line x1="420" y1="372" x2="452" y2="372" stroke="#E9A13B" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <text x="460" y="375" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.02em">PIPE: STDOUT → STDIN</text>
    </svg>