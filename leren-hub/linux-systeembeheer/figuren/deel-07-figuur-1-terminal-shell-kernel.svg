<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="terminal-shell-kernel-title terminal-shell-kernel-desc">
      <title id="terminal-shell-kernel-title">Het pad van een commando: terminal, shell, kernel en hardware</title>
      <desc id="terminal-shell-kernel-desc">Vier gestapelde lagen — terminal, shell, kernel en hardware — met links een pijl die toont hoe een getypt commando van terminal naar hardware zakt, en rechts een pijl die toont hoe het resultaat dezelfde weg omhoog teruggaat; de shell is als focale laag gemarkeerd.</desc>
      <defs>
        <pattern id="tsk-dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(20,33,61,0.10)"/>
        </pattern>
      </defs>

      <rect width="100%" height="100%" fill="#FBFAF7"/>

      <!-- Left margin: downward path — commando -->
      <text x="60" y="108" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.16em">COMMANDO</text>
      <line x1="80" y1="120" x2="80" y2="368" stroke="rgba(20,33,61,0.30)" stroke-width="1"/>
      <polygon points="76,368 84,368 80,376" fill="#55606F"/>
      <text x="60" y="392" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.10em">naar hardware</text>

      <!-- Right margin: upward path — resultaat -->
      <text x="900" y="108" fill="#2563A8" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.16em" text-anchor="end">RESULTAAT</text>
      <line x1="880" y1="120" x2="880" y2="368" stroke="rgba(37,99,168,0.35)" stroke-width="1"/>
      <polygon points="876,120 884,120 880,112" fill="#2563A8"/>
      <text x="900" y="392" fill="#2563A8" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em" text-anchor="end">terug naar scherm</text>

      <!-- Stack container hairlines -->
      <line x1="160" y1="120" x2="800" y2="120" stroke="rgba(20,33,61,0.12)" stroke-width="1"/>
      <line x1="160" y1="368" x2="800" y2="368" stroke="rgba(20,33,61,0.12)" stroke-width="1"/>

      <!-- L1 — Terminal (top) -->
      <rect x="160" y="120" width="640" height="62" fill="#ffffff"/>
      <line x1="160" y1="182" x2="800" y2="182" stroke="rgba(20,33,61,0.12)" stroke-width="1"/>
      <text x="180" y="146" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.12em">L1</text>
      <text x="300" y="149" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Terminal</text>
      <text x="780" y="149" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">GNOME Terminal · iTerm2 · console</text>
      <text x="300" y="166" fill="#55606F" font-size="9" font-family="'Geist', sans-serif" font-style="italic">tekstvenster: stuurt toetsaanslagen door, tekent uitvoer</text>

      <!-- L2 — Shell (FOCAL) -->
      <rect x="160" y="182" width="640" height="62" fill="rgba(233,161,59,0.08)"/>
      <rect x="160" y="182" width="640" height="62" fill="none" stroke="#E9A13B" stroke-width="1"/>
      <text x="180" y="208" fill="#B9781F" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.12em" font-weight="600">L2</text>
      <text x="300" y="211" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Shell</text>
      <text x="780" y="211" fill="#B9781F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">bash</text>
      <text x="300" y="228" fill="#B9781F" font-size="9" font-family="'Geist', sans-serif" font-style="italic">parseert de regel, zoekt het programma, roept systeemaanroepen aan</text>

      <!-- L3 — Kernel -->
      <rect x="160" y="244" width="640" height="62" fill="#f2f1ec"/>
      <line x1="160" y1="306" x2="800" y2="306" stroke="rgba(20,33,61,0.12)" stroke-width="1"/>
      <text x="180" y="270" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.12em">L3</text>
      <text x="300" y="273" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Kernel</text>
      <text x="780" y="273" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">systeemaanroepen</text>
      <text x="300" y="290" fill="#55606F" font-size="9" font-family="'Geist', sans-serif" font-style="italic">voert uit, spreekt de hardware aan</text>

      <!-- L4 — Hardware (bottom) -->
      <rect x="160" y="306" width="640" height="62" fill="#f2f1ec"/>
      <text x="180" y="332" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.12em">L4</text>
      <text x="300" y="335" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif">Hardware</text>
      <text x="780" y="335" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">CPU · schijf · netwerkkaart</text>
      <text x="300" y="352" fill="#55606F" font-size="9" font-family="'Geist', sans-serif" font-style="italic">waar het uiteindelijk gebeurt</text>

      <!-- Legend -->
      <line x1="60" y1="420" x2="900" y2="420" stroke="rgba(20,33,61,0.12)" stroke-width="0.8"/>
      <text x="60" y="436" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGENDA</text>

      <rect x="60" y="450" width="14" height="10" rx="2" fill="rgba(233,161,59,0.08)" stroke="#E9A13B" stroke-width="1"/>
      <text x="80" y="458" fill="#55606F" font-size="8.5" font-family="'Geist', sans-serif">Focale laag — onderwerp van dit deel</text>

      <line x1="360" y1="455" x2="380" y2="455" stroke="#55606F" stroke-width="1"/>
      <text x="386" y="458" fill="#55606F" font-size="8.5" font-family="'Geist', sans-serif">Pad van het commando (heen)</text>

      <line x1="640" y1="455" x2="660" y2="455" stroke="#2563A8" stroke-width="1"/>
      <text x="666" y="458" fill="#55606F" font-size="8.5" font-family="'Geist', sans-serif">Pad van het resultaat (terug)</text>
    </svg>