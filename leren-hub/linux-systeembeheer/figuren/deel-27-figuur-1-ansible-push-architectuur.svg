<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ansible-push-title ansible-push-desc">
      <title id="ansible-push-title">Ansible push-architectuur</title>
      <desc id="ansible-push-desc">Eén controlenode verbindt via SSH met drie managed nodes — rapportage-01, rapportage-02 en rapportage-03 — en voert daar playbook-taken uit; er draait geen achtergrondagent op de managed nodes.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#55606F"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#E9A13B"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2563A8"/></marker>
      </defs>

      <rect width="960" height="600" fill="#FBFAF7"/>

      <!-- ===== Arrows (drawn before nodes) ===== -->
      <!-- fan-out attach points on controlenode bottom edge (y=176, edge x380-580, 3 pts @ 200*k/4): 430, 480, 530 -->

      <!-- Left arrow: attach 430,176 -> rapportage-01 top-center 240,320 (down-left elbow, mid y=248) -->
      <path d="M430,176 V240 Q430,248 422,248 H248 Q240,248 240,256 V320"
            fill="none" stroke="#55606F" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Center arrow: attach 480,176 -> rapportage-02 top-center 480,320 (straight, shared x) -->
      <line x1="480" y1="176" x2="480" y2="320" stroke="#55606F" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Right arrow: attach 530,176 -> rapportage-03 top-center 720,320 (down-right elbow, mid y=248) -->
      <path d="M530,176 V240 Q530,248 538,248 H712 Q720,248 720,256 V320"
            fill="none" stroke="#55606F" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- SSH label on the center (straight) arrow, masked, 8px gap above stroke -->
      <rect x="462" y="236" width="36" height="12" rx="2" fill="#FBFAF7"/>
      <text x="480" y="245" fill="#7C8794" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SSH</text>

      <!-- ===== Controlenode (focal) ===== -->
      <rect x="380" y="88" width="200" height="88" rx="6" fill="rgba(233,161,59,0.08)" stroke="#E9A13B" stroke-width="1.2"/>
      <text x="480" y="124" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Controlenode</text>
      <text x="480" y="142" fill="#7C8794" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Milans beheerlaptop /</text>
      <text x="480" y="154" fill="#7C8794" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">beheer-VM</text>

      <!-- ===== Managed nodes ===== -->
      <rect x="144" y="320" width="192" height="88" rx="6" fill="#ffffff" stroke="#14213D" stroke-width="1"/>
      <text x="240" y="356" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">rapportage-01</text>
      <text x="240" y="374" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10.20.1.11</text>

      <rect x="384" y="320" width="192" height="88" rx="6" fill="#ffffff" stroke="#14213D" stroke-width="1"/>
      <text x="480" y="356" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">rapportage-02</text>
      <text x="480" y="374" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10.20.1.12</text>

      <rect x="624" y="320" width="192" height="88" rx="6" fill="#ffffff" stroke="#14213D" stroke-width="1"/>
      <text x="720" y="356" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">rapportage-03</text>
      <text x="720" y="374" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">10.20.1.13</text>

      <!-- ===== Caption (1 shared annotation replacing 3x identical arrow label) ===== -->
      <text x="480" y="460" fill="#14213D" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle">Elke verbinding: playbook-uitvoering via SSH — geen achtergrondagent op de managed node.</text>

      <!-- ===== Legend ===== -->
      <line x1="40" y1="528" x2="920" y2="528" stroke="rgba(20,33,61,0.10)" stroke-width="0.8"/>
      <text x="40" y="544" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGENDA</text>

      <rect x="180" y="536" width="12" height="12" rx="2" fill="rgba(233,161,59,0.08)" stroke="#E9A13B" stroke-width="1.2"/>
      <text x="200" y="546" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace">controlenode</text>

      <rect x="380" y="536" width="12" height="12" rx="2" fill="#ffffff" stroke="#14213D" stroke-width="1"/>
      <text x="400" y="546" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace">managed node</text>

      <line x1="600" y1="542" x2="624" y2="542" stroke="#55606F" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="636" y="546" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace">SSH-verbinding</text>
    </svg>