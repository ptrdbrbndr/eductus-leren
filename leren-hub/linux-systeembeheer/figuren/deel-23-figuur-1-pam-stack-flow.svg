<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 800" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pam-flow-title pam-flow-desc">
      <title id="pam-flow-title">PAM-stack-flow bij inloggen via SSH</title>
      <desc id="pam-flow-desc">Flowchart van de vier PAM-managementgroepen die een SSH-inlogpoging doorloopt — auth (pam_unix.so, pam_sss.so), account (pam_access.so) en password/session — met de control-vlaggen requisite en required die bepalen of de stack stopt of doorgaat, eindigend in toegang verleend of geweigerd.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#55606F"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#E9A13B"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#FBFAF7"/>

      <!-- ============ ARROWS (drawn before nodes) ============ -->

      <!-- a: start -> auth rect -->
      <line x1="480" y1="88" x2="480" y2="120" stroke="#55606F" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- b: auth rect -> auth diamond -->
      <line x1="480" y1="176" x2="480" y2="200" stroke="#55606F" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- c: auth diamond NEE -> geweigerd (elbow right+down) -->
      <path d="M 580,248 H 664 Q 672,248 672,256 V 336 Q 672,344 680,344 H 760"
            fill="none" stroke="#55606F" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- d: auth diamond JA -> account rect -->
      <line x1="480" y1="296" x2="480" y2="328" stroke="#55606F" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- e: account rect -> account diamond -->
      <line x1="480" y1="384" x2="480" y2="408" stroke="#55606F" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- f: account diamond NEE -> geweigerd (elbow right+up) -->
      <path d="M 580,456 H 664 Q 672,456 672,448 V 368 Q 672,360 680,360 H 760"
            fill="none" stroke="#55606F" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- g: account diamond JA -> password/session rect -->
      <line x1="480" y1="504" x2="480" y2="536" stroke="#55606F" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- h: password/session -> toegang verleend (happy path, accent) -->
      <line x1="480" y1="592" x2="480" y2="624" stroke="#E9A13B" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- ============ ARROW LABELS ============ -->

      <!-- c label: REQUISITE -->
      <rect x="584" y="228" width="80" height="12" rx="2" fill="#FBFAF7"/>
      <text x="624" y="237" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REQUISITE</text>

      <!-- d label: REQUIRED (on vertical segment, centered like reference YES-pattern) -->
      <rect x="452" y="306" width="56" height="12" rx="2" fill="#FBFAF7"/>
      <text x="480" y="315" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REQUIRED</text>

      <!-- f label: REQUIRED -->
      <rect x="586" y="436" width="76" height="12" rx="2" fill="#FBFAF7"/>
      <text x="624" y="445" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REQUIRED</text>

      <!-- g label: JA -->
      <rect x="468" y="514" width="24" height="12" rx="2" fill="#FBFAF7"/>
      <text x="480" y="523" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">JA</text>

      <!-- ============ NODES ============ -->

      <!-- 1: Start oval -->
      <rect x="400" y="40" width="160" height="48" rx="24" fill="rgba(20,33,61,0.03)" stroke="rgba(20,33,61,0.30)" stroke-width="1"/>
      <text x="480" y="60" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SSH-inlogpoging</text>
      <text x="480" y="76" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">gebruiker → sshd</text>

      <!-- 2: AUTH rect -->
      <rect x="400" y="120" width="160" height="56" rx="6" fill="#ffffff" stroke="#14213D" stroke-width="1"/>
      <text x="480" y="146" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">AUTH</text>
      <text x="480" y="164" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pam_unix.so → pam_sss.so</text>

      <!-- 3: AUTH diamond -->
      <polygon points="480,200 580,248 480,296 380,248" fill="#ffffff" stroke="#14213D" stroke-width="1"/>
      <text x="480" y="244" fill="#14213D" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">AUTH</text>
      <text x="480" y="258" fill="#14213D" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">geslaagd?</text>

      <!-- 4: ACCOUNT rect -->
      <rect x="400" y="328" width="160" height="56" rx="6" fill="#ffffff" stroke="#14213D" stroke-width="1"/>
      <text x="480" y="354" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">ACCOUNT</text>
      <text x="480" y="372" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pam_access.so</text>

      <!-- 5: ACCOUNT diamond -->
      <polygon points="480,408 580,456 480,504 380,456" fill="#ffffff" stroke="#14213D" stroke-width="1"/>
      <text x="480" y="452" fill="#14213D" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Toegestaan</text>
      <text x="480" y="466" fill="#14213D" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">(access.conf)?</text>

      <!-- 6: PASSWORD/SESSION rect -->
      <rect x="400" y="536" width="160" height="56" rx="6" fill="#ffffff" stroke="#14213D" stroke-width="1"/>
      <text x="480" y="562" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PASSWORD / SESSION</text>
      <text x="480" y="580" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">wachtwoord · sessie</text>

      <!-- 7: Toegang verleend (focal end oval) -->
      <rect x="400" y="624" width="160" height="56" rx="28" fill="rgba(233,161,59,0.08)" stroke="#E9A13B" stroke-width="1"/>
      <text x="480" y="650" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Toegang verleend</text>
      <text x="480" y="666" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sessie gestart</text>

      <!-- 8: Geweigerd (end oval) -->
      <rect x="760" y="328" width="160" height="48" rx="24" fill="rgba(20,33,61,0.03)" stroke="rgba(20,33,61,0.30)" stroke-width="1"/>
      <text x="840" y="348" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Geweigerd</text>
      <text x="840" y="364" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">geen toegang</text>

      <!-- ============ LEGEND ============ -->
      <line x1="40" y1="716" x2="920" y2="716" stroke="rgba(20,33,61,0.12)" stroke-width="0.8"/>
      <text x="40" y="732" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGENDA</text>

      <rect x="40" y="748" width="24" height="12" rx="6" fill="rgba(20,33,61,0.03)" stroke="rgba(20,33,61,0.30)" stroke-width="1"/>
      <text x="72" y="758" fill="#55606F" font-size="8.5" font-family="'Geist', sans-serif">Start / eind</text>

      <rect x="220" y="748" width="24" height="12" rx="2" fill="#ffffff" stroke="#14213D" stroke-width="1"/>
      <text x="252" y="758" fill="#55606F" font-size="8.5" font-family="'Geist', sans-serif">Managementgroep</text>

      <polygon points="452,754 464,748 476,754 464,760" fill="#ffffff" stroke="#14213D" stroke-width="1"/>
      <text x="488" y="758" fill="#55606F" font-size="8.5" font-family="'Geist', sans-serif">Control-vlag beslist</text>

      <text x="668" y="758" fill="#55606F" font-size="8.5" font-family="'Geist Mono', monospace">REQUISITE = stopt direct</text>
      <text x="668" y="776" fill="#55606F" font-size="8.5" font-family="'Geist Mono', monospace">REQUIRED = stack gaat door, weigering bij falen</text>
    </svg>