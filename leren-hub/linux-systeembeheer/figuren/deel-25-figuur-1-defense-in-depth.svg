<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="defense-depth-title defense-depth-desc">
      <title id="defense-depth-title">Verdedigingslagen rond het Rapportagecluster</title>
      <desc id="defense-depth-desc">Genest schema van vijf verdedigingslagen rond het Rapportagecluster, van buiten naar binnen: netwerkfirewall, SSH-hardening met fail2ban, mandatory access control via AppArmor of SELinux, Unix-permissies met sudo, en de applicatielogica zelf — met de boodschap dat geen enkele laag op zichzelf voldoende is.</desc>
      <defs></defs>

      <rect width="100%" height="100%" fill="#FBFAF7"/>

      <!-- Level 1: netwerkfirewall (deel 18) — outermost -->
      <rect x="40" y="60" width="920" height="380" rx="8" fill="rgba(20,33,61,0.015)" stroke="rgba(20,33,61,0.30)" stroke-width="1"/>
      <!-- Level 2: SSH-hardening + fail2ban (toegangslaag, dit deel) -->
      <rect x="72" y="96" width="856" height="308" rx="8" fill="rgba(20,33,61,0.02)" stroke="rgba(20,33,61,0.35)" stroke-width="1"/>
      <!-- Level 3: MAC — AppArmor/SELinux (procesniveau, dit deel) -->
      <rect x="104" y="132" width="792" height="236" rx="8" fill="rgba(20,33,61,0.025)" stroke="rgba(20,33,61,0.45)" stroke-width="1"/>
      <!-- Level 4: Unix-permissies + sudo (deel 11) -->
      <rect x="136" y="168" width="728" height="164" rx="8" fill="rgba(20,33,61,0.03)" stroke="#55606F" stroke-width="1"/>
      <!-- Level 5: applicatielogica — Rapportagecluster — innermost, focal -->
      <rect x="168" y="204" width="664" height="92" rx="8" fill="rgba(233,161,59,0.08)" stroke="#E9A13B" stroke-width="1"/>

      <!-- Level labels on paper-colored masks over each ring's top border -->
      <rect x="56" y="52" width="196" height="16" fill="#FBFAF7"/>
      <text x="64" y="64" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.10em">NETWERKFIREWALL (DEEL 18)</text>

      <rect x="88" y="88" width="248" height="16" fill="#FBFAF7"/>
      <text x="96" y="100" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.10em">SSH-HARDENING + FAIL2BAN (TOEGANG)</text>

      <rect x="120" y="124" width="216" height="16" fill="#FBFAF7"/>
      <text x="128" y="136" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.10em">MAC · APPARMOR/SELINUX (PROCES)</text>

      <rect x="152" y="160" width="216" height="16" fill="#FBFAF7"/>
      <text x="160" y="172" fill="#14213D" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.10em">UNIX-PERMISSIES + SUDO (DEEL 11)</text>

      <rect x="184" y="196" width="152" height="16" fill="#FBFAF7"/>
      <text x="192" y="208" fill="#E9A13B" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.10em" font-weight="600">APPLICATIELOGICA</text>

      <!-- Innermost label — human readable -->
      <text x="500" y="248" fill="#14213D" font-size="16" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Rapportagecluster</text>
      <text x="500" y="272" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">draait áchter alle vier lagen</text>

      <!-- Annotation top-right: italic callout — the core message -->
      <text x="912" y="32" fill="#14213D" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">geen enkele laag is op zichzelf voldoende</text>
      <path d="M 828 40 Q 700 84 520 216" fill="none" stroke="rgba(20,33,61,0.40)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="520" cy="216" r="2" fill="#14213D"/>

      <!-- Annotation bottom-left: Fenna's toets, italic callout -->
      <text x="40" y="464" fill="#55606F" font-size="14" font-style="italic" font-family="'Instrument Serif', serif">"als deze ene maatregel faalt, wat houdt de aanvaller dan nog tegen?"</text>
      <text x="40" y="484" fill="#7C8794" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.10em">— FENNA'S TOETS BIJ PRODUCTIERIJP-VERKLARING</text>
    </svg>