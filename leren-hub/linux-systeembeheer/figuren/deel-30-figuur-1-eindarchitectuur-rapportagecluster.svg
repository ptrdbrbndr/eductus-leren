<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 680" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="capstone-title capstone-desc">
      <title id="capstone-title">Eindarchitectuur van het Rapportagecluster</title>
      <desc id="capstone-desc">Eén controlenode richt via Ansible het Rapportagecluster in — drie identieke, geharde Ubuntu Server-machines met Docker-containers voor de rapportage-API, cache en een dataworkflow — met een metricspad naar de bestaande Prometheus/Grafana-stack en twee restic-back-uppaden naar een lokale server en een offsite-locatie, met een maandelijkse restore-oefening als controlepunt.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#55606F"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#E9A13B"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2563A8"/></marker>
      </defs>

      <rect width="960" height="680" fill="#FBFAF7"/>

      <!-- ===== Arrows (drawn before nodes) ===== -->

      <!-- Ansible: controlenode bottom (480,160) -> cluster top (480,220), shared x, plain line -->
      <line x1="480" y1="160" x2="480" y2="220" stroke="#55606F" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="492" y="182" width="64" height="12" rx="2" fill="#FBFAF7"/>
      <text x="524" y="191" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ANSIBLE</text>

      <!-- Metrics: cluster right edge (660,264) -> monitoring left edge (740,264), shared y, plain line -->
      <line x1="660" y1="264" x2="740" y2="264" stroke="#2563A8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="672" y="242" width="56" height="12" rx="2" fill="#FBFAF7"/>
      <text x="700" y="251" fill="#2563A8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">METRICS</text>

      <!-- Restic to local back-up: cluster bottom attach (420,420) -> local top-center (385,480), elbow, dashed -->
      <path d="M420,420 V442 Q420,450 412,450 H393 Q385,450 385,458 V480"
            fill="none" stroke="#55606F" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="428" y="424" width="48" height="12" rx="2" fill="#FBFAF7"/>
      <text x="452" y="433" fill="#7C8794" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RESTIC</text>

      <!-- Restic to offsite: cluster bottom attach (540,420) -> offsite top-center (575,480), elbow, dashed -->
      <path d="M540,420 V442 Q540,450 548,450 H567 Q575,450 575,458 V480"
            fill="none" stroke="#55606F" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="548" y="424" width="48" height="12" rx="2" fill="#FBFAF7"/>
      <text x="572" y="433" fill="#7C8794" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RESTIC</text>

      <!-- ===== Controlenode ===== -->
      <rect x="380" y="88" width="200" height="72" rx="6" fill="#ffffff" stroke="#14213D" stroke-width="1"/>
      <text x="480" y="122" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Controlenode</text>
      <text x="480" y="140" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">beheer-VM · Ansible-rollen</text>

      <!-- ===== Cluster (FOCAL — one representative machine, ×3) ===== -->
      <rect x="300" y="220" width="360" height="200" rx="6" fill="rgba(233,161,59,0.08)" stroke="#E9A13B" stroke-width="1.2"/>

      <!-- header -->
      <text x="480" y="234" fill="#55606F" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">UBUNTU SERVER LTS</text>
      <text x="480" y="250" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">rapportage-01 … 03</text>
      <rect x="612" y="230" width="32" height="16" rx="2" fill="transparent" stroke="rgba(233,161,59,0.50)" stroke-width="0.8"/>
      <text x="628" y="242" fill="#E9A13B" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">×3</text>

      <!-- row dividers -->
      <line x1="300" y1="264" x2="660" y2="264" stroke="rgba(20,33,61,0.12)" stroke-width="0.8"/>
      <line x1="300" y1="316" x2="660" y2="316" stroke="rgba(20,33,61,0.12)" stroke-width="0.8"/>
      <line x1="300" y1="368" x2="660" y2="368" stroke="rgba(20,33,61,0.12)" stroke-width="0.8"/>

      <!-- row A: hardened base -->
      <text x="480" y="286" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Basis (gehard)</text>
      <text x="480" y="302" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SSH-keys · fail2ban · AppArmor</text>

      <!-- row B: docker containers -->
      <text x="480" y="338" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Containers (Docker)</text>
      <text x="480" y="354" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">rapportage-API · cache</text>

      <!-- row C: volume -->
      <text x="480" y="390" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Volume</text>
      <text x="480" y="406" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">persistente data</text>

      <!-- ===== Monitoring (external) ===== -->
      <rect x="740" y="220" width="180" height="88" rx="6" fill="rgba(20,33,61,0.03)" stroke="rgba(20,33,61,0.30)" stroke-width="1"/>
      <text x="830" y="258" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Prometheus / Grafana</text>
      <text x="830" y="276" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">bestaande stack</text>
      <text x="830" y="290" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">(Meridiaan-breed)</text>

      <!-- ===== Back-up destinations ===== -->
      <rect x="300" y="480" width="170" height="72" rx="6" fill="rgba(20,33,61,0.05)" stroke="#55606F" stroke-width="1"/>
      <text x="385" y="512" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lokale back-upserver</text>
      <text x="385" y="530" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">restic-repo</text>

      <rect x="490" y="480" width="170" height="72" rx="6" fill="rgba(20,33,61,0.05)" stroke="#55606F" stroke-width="1"/>
      <text x="575" y="512" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Offsite-locatie</text>
      <text x="575" y="530" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">restic-repo · extern</text>

      <!-- ===== Annotation callout — restore-oefening as recurring control point ===== -->
      <text x="920" y="458" fill="#E9A13B" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">maandelijkse restore-oefening als controlepunt</text>
      <path d="M 760,470 Q 620,512 480,486" fill="none" stroke="rgba(233,161,59,0.50)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="480" cy="486" r="2" fill="#E9A13B"/>

      <!-- ===== Legend ===== -->
      <line x1="40" y1="600" x2="920" y2="600" stroke="rgba(20,33,61,0.10)" stroke-width="0.8"/>
      <text x="40" y="616" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGENDA</text>

      <rect x="40" y="624" width="12" height="12" rx="2" fill="#ffffff" stroke="#14213D" stroke-width="1"/>
      <text x="60" y="634" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace">controlenode</text>

      <rect x="192" y="624" width="12" height="12" rx="2" fill="rgba(233,161,59,0.08)" stroke="#E9A13B" stroke-width="1.2"/>
      <text x="212" y="634" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace">rapportagecluster ×3</text>

      <rect x="392" y="624" width="12" height="12" rx="2" fill="rgba(20,33,61,0.03)" stroke="rgba(20,33,61,0.30)" stroke-width="1"/>
      <text x="412" y="634" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace">monitoring (extern)</text>

      <rect x="576" y="624" width="12" height="12" rx="2" fill="rgba(20,33,61,0.05)" stroke="#55606F" stroke-width="1"/>
      <text x="596" y="634" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace">back-upserver</text>

      <line x1="736" y1="630" x2="760" y2="630" stroke="#55606F" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="772" y="634" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace">ansible</text>

      <line x1="840" y1="630" x2="864" y2="630" stroke="#55606F" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="876" y="634" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace">restic</text>
    </svg>