<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="vm-hardware-cloud-title vm-hardware-cloud-desc">
      <title id="vm-hardware-cloud-title">Fysieke hardware, VM op laptop en cloud-instance vergeleken in lagen</title>
      <desc id="vm-hardware-cloud-desc">Drie kolommen naast elkaar tonen dezelfde gelaagde opbouw: fysieke hardware onderaan, een hypervisorlaag die ontbreekt bij directe hardware maar gedeeld wordt door de VM- en cloud-kolom, en bovenaan één gedeelde laag met de Linux-shell en toepassingen die in alle drie identiek werkt.</desc>
      <defs>
        <pattern id="vm-dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(20,33,61,0.10)"/>
        </pattern>
      </defs>

      <rect width="100%" height="100%" fill="#FBFAF7"/>

      <!-- Shared roof layer: Linux-omgeving (focal, accent) -->
      <rect x="100" y="100" width="760" height="64" rx="6" fill="rgba(233,161,59,0.08)" stroke="#E9A13B" stroke-width="1"/>
      <text x="480" y="126" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Linux-omgeving — shell &amp; toepassingen</text>
      <text x="480" y="144" fill="#B9781F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">dezelfde commando's, ongeacht de laag hieronder</text>

      <!-- Row label column (left margin) -->
      <text x="40" y="136" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">TOEPASSING</text>
      <text x="40" y="228" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">OS / KERNEL</text>
      <text x="40" y="292" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">HYPERVISOR</text>
      <text x="40" y="356" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">HARDWARE</text>

      <!-- Column headers -->
      <text x="216" y="180" fill="#14213D" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">FYSIEKE HARDWARE</text>
      <text x="480" y="180" fill="#14213D" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">VM OP EIGEN LAPTOP</text>
      <text x="744" y="180" fill="#14213D" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.10em">CLOUD-INSTANCE</text>

      <!-- COLUMN 1 — Fysieke hardware -->
      <!-- Row: OS/kernel -->
      <rect x="100" y="192" width="232" height="64" rx="6" fill="#ffffff" stroke="#14213D" stroke-width="1"/>
      <text x="216" y="218" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Besturingssysteem / kernel</text>
      <text x="216" y="236" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Ubuntu Server — direct op hardware</text>

      <!-- Row: hypervisor — afwezig, geen box, dashed absence marker -->
      <line x1="140" y1="288" x2="292" y2="288" stroke="#7C8794" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="216" y="278" fill="#7C8794" font-size="8.5" font-family="'Instrument Serif', serif" font-style="italic" text-anchor="middle">geen hypervisor</text>
      <text x="216" y="302" fill="#7C8794" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">kernel spreekt hardware rechtstreeks aan</text>

      <!-- Row: hardware -->
      <rect x="100" y="320" width="232" height="64" rx="6" fill="rgba(20,33,61,0.05)" stroke="#55606F" stroke-width="0.8"/>
      <text x="216" y="346" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Fysieke hardware</text>
      <text x="216" y="364" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Raspberry Pi</text>

      <!-- COLUMN 2 — VM op eigen laptop -->
      <rect x="364" y="192" width="232" height="64" rx="6" fill="#ffffff" stroke="#14213D" stroke-width="1"/>
      <text x="480" y="218" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Gastbesturingssysteem / kernel</text>
      <text x="480" y="236" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Ubuntu Server (VM)</text>

      <rect x="364" y="256" width="232" height="64" rx="6" fill="#ffffff" stroke="#14213D" stroke-width="1"/>
      <text x="480" y="278" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hypervisor</text>
      <text x="480" y="294" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">UTM / Hyper-V</text>
      <text x="480" y="306" fill="#7C8794" font-size="8" font-family="'Geist', sans-serif" font-style="italic" text-anchor="middle">gedeelde laag — door u beheerd</text>

      <rect x="364" y="320" width="232" height="64" rx="6" fill="rgba(20,33,61,0.05)" stroke="#55606F" stroke-width="0.8"/>
      <text x="480" y="346" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Fysieke hardware</text>
      <text x="480" y="364" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">uw laptop</text>

      <!-- COLUMN 3 — Cloud-instance -->
      <rect x="628" y="192" width="232" height="64" rx="6" fill="#ffffff" stroke="#14213D" stroke-width="1"/>
      <text x="744" y="218" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Gastbesturingssysteem / kernel</text>
      <text x="744" y="236" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Ubuntu Server (VM)</text>

      <rect x="628" y="256" width="232" height="64" rx="6" fill="#ffffff" stroke="#14213D" stroke-width="1"/>
      <text x="744" y="278" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hypervisor</text>
      <text x="744" y="294" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">AWS / Azure / GCP</text>
      <text x="744" y="306" fill="#7C8794" font-size="8" font-family="'Geist', sans-serif" font-style="italic" text-anchor="middle">gedeelde laag — door aanbieder beheerd</text>

      <rect x="628" y="320" width="232" height="64" rx="6" fill="rgba(20,33,61,0.05)" stroke="#55606F" stroke-width="0.8"/>
      <text x="744" y="346" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Fysieke hardware</text>
      <text x="744" y="364" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">hardware cloudaanbieder</text>

      <!-- Legend -->
      <line x1="40" y1="420" x2="920" y2="420" stroke="rgba(20,33,61,0.12)" stroke-width="0.8"/>
      <text x="40" y="436" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGENDA</text>

      <rect x="40" y="452" width="14" height="10" rx="2" fill="rgba(233,161,59,0.08)" stroke="#E9A13B" stroke-width="1"/>
      <text x="60" y="460" fill="#55606F" font-size="8.5" font-family="'Geist', sans-serif">Gedeelde laag — identiek in alle drie</text>

      <rect x="300" y="452" width="14" height="10" rx="2" fill="#ffffff" stroke="#14213D" stroke-width="1"/>
      <text x="320" y="460" fill="#55606F" font-size="8.5" font-family="'Geist', sans-serif">Software-laag (OS of hypervisor)</text>

      <rect x="580" y="452" width="14" height="10" rx="2" fill="rgba(20,33,61,0.05)" stroke="#55606F" stroke-width="0.8"/>
      <text x="600" y="460" fill="#55606F" font-size="8.5" font-family="'Geist', sans-serif">Fysieke laag</text>

      <line x1="720" y1="457" x2="734" y2="457" stroke="#7C8794" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="740" y="460" fill="#55606F" font-size="8.5" font-family="'Geist', sans-serif">Laag afwezig</text>

      <text x="40" y="486" fill="#55606F" font-size="8.5" font-family="'Geist', sans-serif" font-style="italic">Het verschil tussen VM en cloud-instance zit niet in de techniek maar in wie de hypervisor beheert en betaalt.</text>
    </svg>