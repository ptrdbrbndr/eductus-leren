<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="systemd-boot-flow-title systemd-boot-flow-desc">
      <title id="systemd-boot-flow-title">Opstartvolgorde van systemd, van kernel tot afhankelijke units</title>
      <desc id="systemd-boot-flow-desc">Flowchart dat toont hoe de kernel systemd als PID 1 start, systemd het multi-user.target activeert, dat target parallel de units netwerk, lokale bestandssystemen en basisdiensten start, en hoe een harde Requires-afhankelijkheid van netwerk naar netwerk-online.target het opstarten kan laten wachten.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#55606F"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#E9A13B"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2563A8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#FBFAF7"/>

      <!-- ===== Connectors (drawn before boxes) ===== -->

      <!-- Kernel -> systemd -->
      <line x1="480" y1="88" x2="480" y2="120" stroke="#55606F" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- systemd -> multi-user.target -->
      <line x1="480" y1="168" x2="480" y2="200" stroke="#55606F" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- multi-user.target -> Netwerk (elbow, left attach point x=420) -->
      <path d="M 420,248 V 268 Q 420,276 412,276 H 188 Q 180,276 180,284 V 300" fill="none" stroke="#55606F" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- multi-user.target -> Lokale bestandssystemen (straight, shared x=480) -->
      <line x1="480" y1="248" x2="480" y2="300" stroke="#55606F" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="496" y="268" width="64" height="12" rx="2" fill="#FBFAF7"/>
      <text x="528" y="277" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">PARALLEL</text>

      <!-- multi-user.target -> Basisdiensten (elbow, right attach point x=540) -->
      <path d="M 540,248 V 268 Q 540,276 548,276 H 772 Q 780,276 780,284 V 300" fill="none" stroke="#55606F" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- Netwerk -> netwerk-online.target (straight, shared x=180, accent = harde afhankelijkheid) -->
      <line x1="180" y1="348" x2="180" y2="420" stroke="#E9A13B" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <rect x="188" y="376" width="72" height="12" rx="2" fill="#FBFAF7"/>
      <text x="224" y="385" fill="#E9A13B" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REQUIRES=</text>

      <!-- ===== Nodes ===== -->

      <!-- Kernel (start oval) -->
      <rect x="400" y="40" width="160" height="48" rx="24" fill="rgba(20,33,61,0.03)" stroke="rgba(20,33,61,0.30)" stroke-width="1"/>
      <text x="480" y="68" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Kernel</text>

      <!-- systemd (PID 1) -->
      <rect x="380" y="120" width="200" height="48" rx="6" fill="#ffffff" stroke="#14213D" stroke-width="1"/>
      <text x="480" y="140" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">systemd</text>
      <text x="480" y="156" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">PID 1</text>

      <!-- multi-user.target -->
      <rect x="380" y="200" width="200" height="48" rx="6" fill="#ffffff" stroke="#14213D" stroke-width="1"/>
      <rect x="388" y="206" width="52" height="12" rx="2" fill="transparent" stroke="rgba(20,33,61,0.40)" stroke-width="0.8"/>
      <text x="414" y="215" fill="#14213D" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TARGET</text>
      <text x="480" y="230" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Multi-user target</text>
      <text x="480" y="244" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">multi-user.target</text>

      <!-- Netwerk -->
      <rect x="80" y="300" width="200" height="48" rx="6" fill="#ffffff" stroke="#14213D" stroke-width="1"/>
      <text x="180" y="328" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Netwerk</text>

      <!-- Lokale bestandssystemen -->
      <rect x="380" y="300" width="200" height="48" rx="6" fill="#ffffff" stroke="#14213D" stroke-width="1"/>
      <text x="480" y="320" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Lokale</text>
      <text x="480" y="336" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">bestandssystemen</text>

      <!-- Basisdiensten -->
      <rect x="680" y="300" width="200" height="48" rx="6" fill="#ffffff" stroke="#14213D" stroke-width="1"/>
      <text x="780" y="328" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Basisdiensten</text>

      <!-- netwerk-online.target (focal — de harde afhankelijkheid uit de casus) -->
      <rect x="80" y="420" width="200" height="48" rx="6" fill="rgba(233,161,59,0.08)" stroke="#E9A13B" stroke-width="1"/>
      <rect x="88" y="426" width="52" height="12" rx="2" fill="transparent" stroke="rgba(233,161,59,0.50)" stroke-width="0.8"/>
      <text x="114" y="435" fill="#E9A13B" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">TARGET</text>
      <text x="180" y="450" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Netwerk online</text>
      <text x="180" y="464" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">netwerk-online.target</text>

      <!-- ===== Legend ===== -->
      <line x1="40" y1="536" x2="920" y2="536" stroke="rgba(20,33,61,0.12)" stroke-width="0.8"/>
      <text x="40" y="552" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="568" width="24" height="12" rx="6" fill="rgba(20,33,61,0.03)" stroke="rgba(20,33,61,0.30)" stroke-width="1"/>
      <text x="72" y="578" fill="#55606F" font-size="8.5" font-family="'Geist', sans-serif">Start (oval)</text>

      <rect x="188" y="568" width="24" height="12" rx="2" fill="#ffffff" stroke="#14213D" stroke-width="1"/>
      <text x="220" y="578" fill="#55606F" font-size="8.5" font-family="'Geist', sans-serif">Unit / target</text>

      <line x1="352" y1="574" x2="380" y2="574" stroke="#55606F" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="388" y="578" fill="#55606F" font-size="8.5" font-family="'Geist', sans-serif">Activeert (After/Wants)</text>

      <line x1="600" y1="574" x2="628" y2="574" stroke="#E9A13B" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="636" y="578" fill="#55606F" font-size="8.5" font-family="'Geist', sans-serif">Harde afhankelijkheid (Requires)</text>

      <text x="40" y="602" fill="#55606F" font-size="8.5" font-family="'Geist', sans-serif" font-style="italic">Casus: een unit die op netwerk-online.target wacht kan het opstarten laten hangen.</text>
    </svg>