<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 920 536" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d11f1-title d11f1-desc">
      <title id="d11f1-title">Permissiebits van ls -l uitgelegd: type, owner, group, other</title>
      <desc id="d11f1-desc">Vier kaarten naast elkaar tonen hoe de tien posities van een ls -l regel zijn opgebouwd: het bestandstype, en drie blokken van elk rwx voor owner, group en other, met per recht de octale waarde en de opgetelde octale score; onderaan het volledige voorbeeld -rw-r----- met octale waarde 640.</desc>
<defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style></defs>

      <rect width="920" height="536" fill="#FBFAF7"/>

      <!-- TYPE card -->
      <rect x="56" y="88" width="140" height="280" rx="8" fill="#FFFFFF" stroke="#14213D" stroke-width="1"/>
      <rect x="108" y="100" width="32" height="32" rx="4" fill="rgba(20,33,61,0.05)" stroke="#55606F" stroke-width="0.8"/>
      <text x="124" y="122" fill="#14213D" font-size="16" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">-</text>
      <text x="126" y="152" fill="#55606F" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">TYPE</text>
      <text x="126" y="166" fill="#7C8794" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">positie 1</text>
      <line x1="72" y1="180" x2="180" y2="180" stroke="rgba(20,33,61,0.12)" stroke-width="0.8"/>
      <text x="126" y="204" fill="#14213D" font-size="12" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle">Los van de</text>
      <text x="126" y="222" fill="#14213D" font-size="12" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle">rwx-rechten:</text>
      <text x="126" y="250" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">- regulier bestand</text>
      <text x="126" y="264" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">d map</text>
      <text x="126" y="278" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">l symbolische link</text>

      <!-- OWNER card -->
      <rect x="220" y="88" width="200" height="280" rx="8" fill="#FFFFFF" stroke="#14213D" stroke-width="1"/>
      <rect x="268" y="100" width="32" height="32" rx="4" fill="rgba(20,33,61,0.05)" stroke="#55606F" stroke-width="0.8"/>
      <text x="284" y="122" fill="#14213D" font-size="16" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">r</text>
      <rect x="304" y="100" width="32" height="32" rx="4" fill="rgba(20,33,61,0.05)" stroke="#55606F" stroke-width="0.8"/>
      <text x="320" y="122" fill="#14213D" font-size="16" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">w</text>
      <rect x="340" y="100" width="32" height="32" rx="4" fill="rgba(20,33,61,0.05)" stroke="#55606F" stroke-width="0.8"/>
      <text x="356" y="122" fill="#7C8794" font-size="16" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">-</text>
      <text x="320" y="152" fill="#55606F" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">OWNER</text>
      <text x="320" y="166" fill="#7C8794" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">posities 2–4</text>
      <line x1="236" y1="180" x2="404" y2="180" stroke="rgba(20,33,61,0.12)" stroke-width="0.8"/>
      <text x="240" y="204" fill="#14213D" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">r · lezen</text>
      <text x="400" y="204" fill="#14213D" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">✓ 4</text>
      <text x="240" y="236" fill="#14213D" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">w · schrijven</text>
      <text x="400" y="236" fill="#14213D" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">✓ 2</text>
      <text x="240" y="268" fill="#7C8794" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">x · uitvoeren</text>
      <text x="400" y="268" fill="#7C8794" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">– 0</text>
      <line x1="236" y1="288" x2="404" y2="288" stroke="rgba(20,33,61,0.12)" stroke-width="0.8"/>
      <text x="320" y="308" fill="#55606F" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">OCTAAL</text>
      <text x="320" y="340" fill="#14213D" font-size="24" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">6</text>

      <!-- GROUP card -->
      <rect x="444" y="88" width="200" height="280" rx="8" fill="#FFFFFF" stroke="#14213D" stroke-width="1"/>
      <rect x="492" y="100" width="32" height="32" rx="4" fill="rgba(20,33,61,0.05)" stroke="#55606F" stroke-width="0.8"/>
      <text x="508" y="122" fill="#14213D" font-size="16" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">r</text>
      <rect x="528" y="100" width="32" height="32" rx="4" fill="rgba(20,33,61,0.05)" stroke="#55606F" stroke-width="0.8"/>
      <text x="544" y="122" fill="#7C8794" font-size="16" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">-</text>
      <rect x="564" y="100" width="32" height="32" rx="4" fill="rgba(20,33,61,0.05)" stroke="#55606F" stroke-width="0.8"/>
      <text x="580" y="122" fill="#7C8794" font-size="16" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">-</text>
      <text x="544" y="152" fill="#55606F" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">GROUP</text>
      <text x="544" y="166" fill="#7C8794" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">posities 5–7</text>
      <line x1="460" y1="180" x2="628" y2="180" stroke="rgba(20,33,61,0.12)" stroke-width="0.8"/>
      <text x="464" y="204" fill="#14213D" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">r · lezen</text>
      <text x="624" y="204" fill="#14213D" font-size="9" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">✓ 4</text>
      <text x="464" y="236" fill="#7C8794" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">w · schrijven</text>
      <text x="624" y="236" fill="#7C8794" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">– 0</text>
      <text x="464" y="268" fill="#7C8794" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">x · uitvoeren</text>
      <text x="624" y="268" fill="#7C8794" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">– 0</text>
      <line x1="460" y1="288" x2="628" y2="288" stroke="rgba(20,33,61,0.12)" stroke-width="0.8"/>
      <text x="544" y="308" fill="#55606F" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">OCTAAL</text>
      <text x="544" y="340" fill="#14213D" font-size="24" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">4</text>

      <!-- OTHER card -->
      <rect x="668" y="88" width="200" height="280" rx="8" fill="#FFFFFF" stroke="#14213D" stroke-width="1"/>
      <rect x="716" y="100" width="32" height="32" rx="4" fill="rgba(20,33,61,0.05)" stroke="#55606F" stroke-width="0.8"/>
      <text x="732" y="122" fill="#7C8794" font-size="16" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">-</text>
      <rect x="752" y="100" width="32" height="32" rx="4" fill="rgba(20,33,61,0.05)" stroke="#55606F" stroke-width="0.8"/>
      <text x="768" y="122" fill="#7C8794" font-size="16" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">-</text>
      <rect x="788" y="100" width="32" height="32" rx="4" fill="rgba(20,33,61,0.05)" stroke="#55606F" stroke-width="0.8"/>
      <text x="804" y="122" fill="#7C8794" font-size="16" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">-</text>
      <text x="768" y="152" fill="#55606F" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">OTHER</text>
      <text x="768" y="166" fill="#7C8794" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">posities 8–10</text>
      <line x1="684" y1="180" x2="852" y2="180" stroke="rgba(20,33,61,0.12)" stroke-width="0.8"/>
      <text x="688" y="204" fill="#7C8794" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">r · lezen</text>
      <text x="848" y="204" fill="#7C8794" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">– 0</text>
      <text x="688" y="236" fill="#7C8794" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">w · schrijven</text>
      <text x="848" y="236" fill="#7C8794" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">– 0</text>
      <text x="688" y="268" fill="#7C8794" font-size="9" font-family="'Geist Mono', monospace" text-anchor="start">x · uitvoeren</text>
      <text x="848" y="268" fill="#7C8794" font-size="9" font-family="'Geist Mono', monospace" text-anchor="end">– 0</text>
      <line x1="684" y1="288" x2="852" y2="288" stroke="rgba(20,33,61,0.12)" stroke-width="0.8"/>
      <text x="768" y="308" fill="#55606F" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">OCTAAL</text>
      <text x="768" y="340" fill="#14213D" font-size="24" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">0</text>

      <!-- Summary -->
      <text x="460" y="414" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">VOORBEELD · /etc/ssh/sshd_config</text>
      <text x="440" y="456" fill="#14213D" font-size="28" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="end">-rw-r-----</text>
      <text x="460" y="454" fill="#55606F" font-size="20" font-family="'Geist Mono', monospace" text-anchor="middle">→</text>
      <text x="480" y="458" fill="#E9A13B" font-size="32" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="start">640</text>

      <!-- Legend -->
      <line x1="56" y1="488" x2="868" y2="488" stroke="rgba(20,33,61,0.12)" stroke-width="0.8"/>
      <text x="56" y="505" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGENDA</text>
      <text x="160" y="505" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.02em">R=4 · W=2 · X=1</text>
      <text x="420" y="505" fill="#14213D" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.02em">✓ VET/INK = AANWEZIG</text>
      <text x="640" y="505" fill="#7C8794" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.02em">– GRIJS = AFWEZIG</text>
    </svg>
