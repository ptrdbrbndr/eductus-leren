<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="firewallpad-title firewallpad-desc">
      <title id="firewallpad-title">Firewallpad van een binnenkomend pakket</title>
      <desc id="firewallpad-desc">Flowchart van een binnenkomend pakket dat op de NIC arriveert, wordt getoetst aan de ufw/firewalld-regels op de netfilter-haak, en bij toestaan wordt doorgestuurd naar de transportlaag en de luisterende dienst op de poort, of bij weigeren wordt gedropt.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#55606F"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#E9A13B"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#FBFAF7"/>

      <!-- Arrows (drawn first, behind nodes) -->
      <!-- Start -> Step -->
      <line x1="480" y1="88" x2="480" y2="116" stroke="#55606F" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Step -> Diamond -->
      <line x1="480" y1="180" x2="480" y2="204" stroke="#55606F" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Diamond "NEE" right -->
      <line x1="580" y1="252" x2="680" y2="252" stroke="#55606F" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Diamond "JA" down -->
      <line x1="480" y1="300" x2="480" y2="332" stroke="#55606F" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- Doorgestuurd -> Dienst (happy path, accent) -->
      <line x1="480" y1="396" x2="480" y2="420" stroke="#E9A13B" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

      <!-- Arrow labels -->
      <rect x="614" y="234" width="32" height="12" rx="2" fill="#FBFAF7"/>
      <text x="630" y="243" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">NEE</text>

      <rect x="440" y="310" width="32" height="12" rx="2" fill="#FBFAF7"/>
      <text x="456" y="319" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.12em">JA</text>

      <!-- Start oval: pakket arriveert -->
      <rect x="400" y="40" width="160" height="48" rx="24" fill="rgba(20,33,61,0.03)" stroke="rgba(20,33,61,0.30)" stroke-width="1"/>
      <text x="480" y="62" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Pakket arriveert</text>
      <text x="480" y="76" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">op NIC</text>

      <!-- Step rectangle: toetsing aan firewallregels -->
      <rect x="400" y="116" width="160" height="64" rx="6" fill="#FFFFFF" stroke="#14213D" stroke-width="1"/>
      <text x="480" y="140" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Getoetst aan</text>
      <text x="480" y="154" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">firewallregels</text>
      <text x="480" y="174" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">netfilter-haak</text>

      <!-- Diamond: toegestaan? -->
      <polygon points="480,204 580,252 480,300 380,252" fill="#FFFFFF" stroke="#14213D" stroke-width="1"/>
      <text x="480" y="256" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Toegestaan?</text>

      <!-- End oval: gedropt / geweigerd -->
      <rect x="680" y="228" width="160" height="48" rx="24" fill="rgba(20,33,61,0.03)" stroke="rgba(20,33,61,0.30)" stroke-width="1"/>
      <text x="760" y="250" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Gedropt / geweigerd</text>
      <text x="760" y="264" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">geen antwoord</text>

      <!-- Rectangle: doorgestuurd naar transportlaag -->
      <rect x="400" y="332" width="160" height="64" rx="6" fill="#FFFFFF" stroke="#14213D" stroke-width="1"/>
      <text x="480" y="356" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Doorgestuurd naar</text>
      <text x="480" y="370" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">transportlaag</text>
      <text x="480" y="390" fill="#55606F" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">poort-koppeling</text>

      <!-- End oval: luisterende dienst (focal, accent) -->
      <rect x="400" y="420" width="160" height="64" rx="32" fill="rgba(233,161,59,0.08)" stroke="#E9A13B" stroke-width="1"/>
      <text x="480" y="446" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Luisterende dienst</text>
      <text x="480" y="460" fill="#14213D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">op de poort</text>
      <text x="480" y="478" fill="#E9A13B" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">bv. sshd:22</text>

      <!-- Legend -->
      <line x1="40" y1="524" x2="920" y2="524" stroke="rgba(20,33,61,0.10)" stroke-width="0.8"/>
      <text x="40" y="540" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND · VORM DRAAGT BETEKENIS</text>

      <rect x="40" y="556" width="24" height="12" rx="6" fill="rgba(20,33,61,0.03)" stroke="rgba(20,33,61,0.30)" stroke-width="1"/>
      <text x="72" y="566" fill="#55606F" font-size="8.5" font-family="'Geist', sans-serif">Start / eind (ovaal)</text>

      <rect x="220" y="556" width="24" height="12" rx="2" fill="#FFFFFF" stroke="#14213D" stroke-width="1"/>
      <text x="252" y="566" fill="#55606F" font-size="8.5" font-family="'Geist', sans-serif">Stap (rechthoek)</text>

      <polygon points="412,562 424,556 436,562 424,568" fill="#FFFFFF" stroke="#14213D" stroke-width="1"/>
      <text x="448" y="566" fill="#55606F" font-size="8.5" font-family="'Geist', sans-serif">Beslissing (ruit)</text>

      <line x1="604" y1="564" x2="632" y2="564" stroke="#E9A13B" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="640" y="566" fill="#55606F" font-size="8.5" font-family="'Geist', sans-serif">Pad bij toestaan</text>

      <line x1="768" y1="564" x2="796" y2="564" stroke="#55606F" stroke-width="1.2" marker-end="url(#arrow)"/>
      <text x="804" y="566" fill="#55606F" font-size="8.5" font-family="'Geist', sans-serif">Tak</text>
    </svg>