<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 920 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="d14f1-title d14f1-desc">
      <title id="d14f1-title">Toestandsdiagram van processtatussen R, S, D, T en Z</title>
      <desc id="d14f1-desc">Toestandsdiagram met running (R) als centrale hub die overgaat naar sleeping (S), uninterruptible sleep (D) en stopped (T) en weer terug, en dat via exit() overgaat naar de zombie-toestand (Z), waarna het ouderproces met wait() het proces pas echt uit de procestabel verwijdert.</desc>

      <defs>
<style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#55606F"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#E9A13B"/></marker>
      </defs>

      <rect width="920" height="560" fill="#FBFAF7"/>

      <!-- Start dot -->
      <circle cx="100" cy="240" r="6" fill="#14213D"/>

      <!-- Arrows drawn before boxes -->
      <!-- start -> R -->
      <line x1="106" y1="240" x2="184" y2="240" stroke="#55606F" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="120" y="222" width="52" height="12" rx="2" fill="#FBFAF7"/>
      <text x="146" y="231" fill="#7C8794" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">FORK/EXEC</text>

      <!-- R <-> S (straight vertical, offset x) -->
      <line x1="220" y1="210" x2="220" y2="126" stroke="#55606F" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="120" y="159" width="94" height="12" rx="2" fill="#FBFAF7"/>
      <text x="212" y="168" fill="#7C8794" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.02em">WACHT OP EVENT</text>

      <line x1="300" y1="126" x2="300" y2="210" stroke="#55606F" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="308" y="159" width="100" height="12" rx="2" fill="#FBFAF7"/>
      <text x="308" y="168" fill="#7C8794" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.02em">EVENT / CPU VRIJ</text>

      <!-- R <-> D (straight vertical, offset x) -->
      <line x1="220" y1="270" x2="220" y2="354" stroke="#55606F" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="106" y="306" width="108" height="12" rx="2" fill="#FBFAF7"/>
      <text x="212" y="315" fill="#7C8794" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end" letter-spacing="0.02em">I/O-WACHT (DISK)</text>

      <line x1="300" y1="354" x2="300" y2="270" stroke="#55606F" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="308" y="306" width="72" height="12" rx="2" fill="#FBFAF7"/>
      <text x="308" y="315" fill="#7C8794" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.02em">I/O KLAAR</text>

      <!-- R <-> T (curved, off-axis) -->
      <path d="M 312,210 C 312,150 400,140 490,150" fill="none" stroke="#55606F" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="322" y="152" width="112" height="12" rx="2" fill="#FBFAF7"/>
      <text x="378" y="161" fill="#7C8794" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">CTRL+Z / SIGSTOP</text>

      <path d="M 520,150 C 520,172 420,192 326,210" fill="none" stroke="#55606F" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="368" y="188" width="108" height="12" rx="2" fill="#FBFAF7"/>
      <text x="422" y="197" fill="#7C8794" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.02em">SIGCONT / FG</text>

      <!-- R -> Z (straight horizontal, accent / focal transition) -->
      <line x1="330" y1="240" x2="576" y2="240" stroke="#E9A13B" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="422" y="222" width="64" height="12" rx="2" fill="#FBFAF7"/>
      <text x="454" y="231" fill="#E9A13B" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">EXIT()</text>

      <!-- Z -> end dot -->
      <line x1="740" y1="240" x2="792" y2="240" stroke="#55606F" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- End dot (ringed) -->
      <circle cx="800" cy="240" r="8" fill="none" stroke="#14213D" stroke-width="1.2"/>
      <circle cx="800" cy="240" r="5" fill="#14213D"/>
      <text x="800" y="270" fill="#7C8794" font-size="8" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="middle">verwijderd na wait()</text>

      <!-- S box -->
      <rect x="190" y="60" width="140" height="60" rx="8" fill="#FFFFFF" stroke="#14213D" stroke-width="1"/>
      <text x="260" y="86" fill="#14213D" font-size="20" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">S</text>
      <text x="260" y="104" fill="#55606F" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">SLEEPING (SLAAPT)</text>

      <!-- R box (hub) -->
      <rect x="190" y="210" width="140" height="60" rx="8" fill="#FFFFFF" stroke="#14213D" stroke-width="1"/>
      <text x="260" y="236" fill="#14213D" font-size="20" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">R</text>
      <text x="260" y="254" fill="#55606F" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">RUNNING (DRAAIT)</text>

      <!-- D box -->
      <rect x="190" y="360" width="140" height="60" rx="8" fill="#FFFFFF" stroke="#14213D" stroke-width="1"/>
      <text x="260" y="386" fill="#14213D" font-size="20" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">D</text>
      <text x="260" y="404" fill="#55606F" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">UNINT. SLEEP (I/O)</text>

      <!-- T box -->
      <rect x="460" y="90" width="140" height="60" rx="8" fill="#FFFFFF" stroke="#14213D" stroke-width="1"/>
      <text x="530" y="116" fill="#14213D" font-size="20" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">T</text>
      <text x="530" y="134" fill="#55606F" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">STOPPED (GEPAUZEERD)</text>

      <!-- Z box (focal / accent) -->
      <rect x="576" y="210" width="164" height="60" rx="8" fill="rgba(233,161,59,0.08)" stroke="#E9A13B" stroke-width="1"/>
      <text x="658" y="236" fill="#14213D" font-size="20" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle">Z</text>
      <text x="658" y="254" fill="#55606F" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.04em">ZOMBIE (WACHT OP OUDER)</text>

      <!-- Legend -->
      <line x1="60" y1="480" x2="860" y2="480" stroke="rgba(20,33,61,0.12)" stroke-width="0.8"/>
      <text x="60" y="497" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGENDA</text>

      <circle cx="180" cy="493" r="5" fill="#14213D"/>
      <text x="192" y="497" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.02em">GEVULDE STIP = START (FORK/EXEC)</text>

      <circle cx="440" cy="493" r="6" fill="none" stroke="#14213D" stroke-width="1"/>
      <circle cx="440" cy="493" r="3.5" fill="#14213D"/>
      <text x="454" y="497" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.02em">GERINGDE STIP = UIT PROCESTABEL VERWIJDERD</text>

      <rect x="700" y="489" width="24" height="8" rx="2" fill="rgba(233,161,59,0.08)" stroke="#E9A13B" stroke-width="1"/>
      <text x="732" y="497" fill="#55606F" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start" letter-spacing="0.02em">ACCENT = ZOMBIE</text>
    </svg>
