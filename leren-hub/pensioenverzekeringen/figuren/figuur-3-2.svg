<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
<rect width="1400" height="720" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563A8"/></marker></defs>
<text x="700" y="46" font-family="Cormorant Garamond" font-size="25" font-weight="bold" font-style="normal" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Beslisboom: toegestane regelingsvormen na de transitie, per type uitvoerder</tspan></text>
<rect x="500" y="90" width="400" height="70" rx="10" fill="#14213D" stroke="#E3E0D8" stroke-width="1"/>
<text x="700" y="118" font-family="DM Sans" font-size="14" font-weight="bold" font-style="normal" fill="#FFFFFF" text-anchor="middle"><tspan x="700" dy="0">Premieovereenkomst met</tspan></text>
<text x="700" y="138" font-family="DM Sans" font-size="13" font-weight="normal" font-style="normal" fill="#CFE0F2" text-anchor="middle"><tspan x="700" dy="0">vlakke premie (verplicht na transitie)</tspan></text>
<line x1="700" y1="160" x2="220" y2="260" stroke="#DFDCD3" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="45" y="260" width="350" height="100" rx="8" fill="#FFFFFF" stroke="#E3E0D8" stroke-width="1"/>
<rect x="45" y="260" width="8" height="100" rx="0" fill="#2563A8" stroke="none" stroke-width="1"/>
<text x="220" y="292" font-family="Cormorant Garamond" font-size="14.5" font-weight="bold" font-style="normal" fill="#14213D" text-anchor="middle"><tspan x="220" dy="0">Solidaire premieregeling</tspan></text>
<text x="220" y="320" font-family="DM Sans" font-size="12" font-weight="normal" font-style="normal" fill="#55606F" text-anchor="middle"><tspan x="220" dy="0">Fonds, PPI, APF</tspan></text>
<line x1="700" y1="160" x2="700" y2="260" stroke="#DFDCD3" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="525" y="260" width="350" height="100" rx="8" fill="#FFFFFF" stroke="#E3E0D8" stroke-width="1"/>
<rect x="525" y="260" width="8" height="100" rx="0" fill="#E9A13B" stroke="none" stroke-width="1"/>
<text x="700" y="292" font-family="Cormorant Garamond" font-size="14.5" font-weight="bold" font-style="normal" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Flexibele premieregeling</tspan></text>
<text x="700" y="320" font-family="DM Sans" font-size="12" font-weight="normal" font-style="normal" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">Fonds, PPI, APF</tspan></text>
<line x1="700" y1="160" x2="1180" y2="260" stroke="#DFDCD3" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="1005" y="260" width="350" height="100" rx="8" fill="#FFFFFF" stroke="#E3E0D8" stroke-width="1"/>
<rect x="1005" y="260" width="8" height="100" rx="0" fill="#2563A8" stroke="none" stroke-width="1"/>
<text x="1180" y="292" font-family="Cormorant Garamond" font-size="14.5" font-weight="bold" font-style="normal" fill="#14213D" text-anchor="middle"><tspan x="1180" dy="0">Premie-uitkerings-</tspan><tspan x="1180" dy="18">overeenkomst</tspan></text>
<text x="1180" y="338" font-family="DM Sans" font-size="12" font-weight="normal" font-style="normal" fill="#55606F" text-anchor="middle"><tspan x="1180" dy="0">Alleen verzekeraar</tspan></text>
<text x="700" y="430" font-family="DM Sans" font-size="13" font-weight="normal" font-style="italic" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">De uitkeringsovereenkomst en de kapitaalovereenkomst dragen geen nieuwe opbouw meer</tspan></text>
</svg>