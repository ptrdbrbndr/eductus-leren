<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
<rect width="1400" height="720" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563A8"/></marker></defs>
<text x="700" y="46" font-family="Cormorant Garamond" font-size="25" font-weight="bold" font-style="normal" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">De opbouw van een transitieplan: vijf onderdelen, elk met zijn eigen vraag</tspan></text>
<rect x="160" y="88" width="1080" height="94" rx="8" fill="#FFFFFF" stroke="#E3E0D8" stroke-width="1"/>
<circle cx="200" cy="135" r="20" fill="#14213D" stroke="#14213D" stroke-width="1.5"/>
<text x="200" y="141" font-family="Cormorant Garamond" font-size="16" font-weight="bold" font-style="normal" fill="#FFFFFF" text-anchor="middle"><tspan x="200" dy="0">1</tspan></text>
<text x="250" y="120" font-family="Cormorant Garamond" font-size="15.5" font-weight="bold" font-style="normal" fill="#14213D" text-anchor="start"><tspan x="250" dy="0">De gemaakte keuzes</tspan></text>
<text x="250" y="143" font-family="DM Sans" font-size="12.5" font-weight="normal" font-style="normal" fill="#55606F" text-anchor="start"><tspan x="250" dy="0">Welke regelingsvorm, welk premieniveau, wel of geen eerbiedigende werking — en waarom?</tspan></text>
<rect x="160" y="196" width="1080" height="94" rx="8" fill="#FFFFFF" stroke="#E3E0D8" stroke-width="1"/>
<circle cx="200" cy="243" r="20" fill="#14213D" stroke="#14213D" stroke-width="1.5"/>
<text x="200" y="249" font-family="Cormorant Garamond" font-size="16" font-weight="bold" font-style="normal" fill="#FFFFFF" text-anchor="middle"><tspan x="200" dy="0">2</tspan></text>
<text x="250" y="228" font-family="Cormorant Garamond" font-size="15.5" font-weight="bold" font-style="normal" fill="#14213D" text-anchor="start"><tspan x="250" dy="0">De overwegingen</tspan></text>
<text x="250" y="251" font-family="DM Sans" font-size="12.5" font-weight="normal" font-style="normal" fill="#55606F" text-anchor="start"><tspan x="250" dy="0">Welke varianten zijn beoordeeld en op welke gronden is gekozen?</tspan></text>
<rect x="160" y="304" width="1080" height="94" rx="8" fill="#FFFFFF" stroke="#E3E0D8" stroke-width="1"/>
<circle cx="200" cy="351" r="20" fill="#14213D" stroke="#14213D" stroke-width="1.5"/>
<text x="200" y="357" font-family="Cormorant Garamond" font-size="16" font-weight="bold" font-style="normal" fill="#FFFFFF" text-anchor="middle"><tspan x="200" dy="0">3</tspan></text>
<text x="250" y="336" font-family="Cormorant Garamond" font-size="15.5" font-weight="bold" font-style="normal" fill="#14213D" text-anchor="start"><tspan x="250" dy="0">De effecten</tspan></text>
<text x="250" y="359" font-family="DM Sans" font-size="12.5" font-weight="normal" font-style="normal" fill="#55606F" text-anchor="start"><tspan x="250" dy="0">Wat betekent de overgang per groep deelnemers, in vergelijkende berekeningen?</tspan></text>
<rect x="160" y="412" width="1080" height="94" rx="8" fill="#FFFFFF" stroke="#E3E0D8" stroke-width="1"/>
<circle cx="200" cy="459" r="20" fill="#14213D" stroke="#14213D" stroke-width="1.5"/>
<text x="200" y="465" font-family="Cormorant Garamond" font-size="16" font-weight="bold" font-style="normal" fill="#FFFFFF" text-anchor="middle"><tspan x="200" dy="0">4</tspan></text>
<text x="250" y="444" font-family="Cormorant Garamond" font-size="15.5" font-weight="bold" font-style="normal" fill="#14213D" text-anchor="start"><tspan x="250" dy="0">De compensatie</tspan></text>
<text x="250" y="467" font-family="DM Sans" font-size="12.5" font-weight="normal" font-style="normal" fill="#55606F" text-anchor="start"><tspan x="250" dy="0">Of er wordt gecompenseerd: voor wie, hoe hoog, hoe lang, hoe gefinancierd?</tspan></text>
<rect x="160" y="520" width="1080" height="94" rx="8" fill="#FFFFFF" stroke="#E3E0D8" stroke-width="1"/>
<circle cx="200" cy="567" r="20" fill="#14213D" stroke="#14213D" stroke-width="1.5"/>
<text x="200" y="573" font-family="Cormorant Garamond" font-size="16" font-weight="bold" font-style="normal" fill="#FFFFFF" text-anchor="middle"><tspan x="200" dy="0">5</tspan></text>
<text x="250" y="552" font-family="Cormorant Garamond" font-size="15.5" font-weight="bold" font-style="normal" fill="#14213D" text-anchor="start"><tspan x="250" dy="0">De onderbouwing van evenwichtigheid</tspan></text>
<text x="250" y="575" font-family="DM Sans" font-size="12.5" font-weight="normal" font-style="normal" fill="#55606F" text-anchor="start"><tspan x="250" dy="0">Waarom is dit geheel verdedigbaar tegenover alle groepen?</tspan></text>
</svg>