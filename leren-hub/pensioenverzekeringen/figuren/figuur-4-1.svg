<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
<rect width="1400" height="720" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563A8"/></marker></defs>
<text x="700" y="46" font-family="Cormorant Garamond" font-size="25" font-weight="bold" font-style="normal" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Beslisschema werkingssfeer: van bedrijfsactiviteit naar verplichte aansluiting</tspan></text>
<rect x="500" y="90" width="400" height="76" rx="10" fill="#14213D" stroke="#E3E0D8" stroke-width="1"/>
<text x="700" y="122" font-family="DM Sans" font-size="14" font-weight="normal" font-style="normal" fill="#CFE0F2" text-anchor="middle"><tspan x="700" dy="0">Bedrijfsactiviteit van de</tspan></text>
<text x="700" y="144" font-family="DM Sans" font-size="13" font-weight="bold" font-style="normal" fill="#FFFFFF" text-anchor="middle"><tspan x="700" dy="0">onderneming (feitelijk, niet statutair)</tspan></text>
<rect x="500" y="210" width="400" height="60" rx="8" fill="#FFFFFF" stroke="#E3E0D8" stroke-width="1"/>
<text x="700" y="236" font-family="DM Sans" font-size="13" font-weight="normal" font-style="normal" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Valt dit onder de tekst van het</tspan></text>
<text x="700" y="254" font-family="DM Sans" font-size="13" font-weight="bold" font-style="normal" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">verplichtstellingsbesluit?</tspan></text>
<line x1="700" y1="166" x2="700" y2="210" stroke="#DFDCD3" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="700" y1="270" x2="230" y2="380" stroke="#DFDCD3" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="80" y="380" width="300" height="90" rx="8" fill="#FFFFFF" stroke="#E3E0D8" stroke-width="1"/>
<rect x="80" y="380" width="300" height="6" rx="0" fill="#2563A8" stroke="none" stroke-width="1"/>
<text x="230" y="414" font-family="Cormorant Garamond" font-size="17" font-weight="bold" font-style="normal" fill="#14213D" text-anchor="middle"><tspan x="230" dy="0">Wel</tspan></text>
<text x="230" y="438" font-family="DM Sans" font-size="12" font-weight="normal" font-style="normal" fill="#55606F" text-anchor="middle"><tspan x="230" dy="0">Verplichte aansluiting</tspan><tspan x="230" dy="15">bij het bpf</tspan></text>
<line x1="700" y1="270" x2="700" y2="380" stroke="#DFDCD3" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="550" y="380" width="300" height="90" rx="8" fill="#FFFFFF" stroke="#E3E0D8" stroke-width="1"/>
<rect x="550" y="380" width="300" height="6" rx="0" fill="#E9A13B" stroke="none" stroke-width="1"/>
<text x="700" y="414" font-family="Cormorant Garamond" font-size="17" font-weight="bold" font-style="normal" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Onduidelijk</tspan></text>
<text x="700" y="438" font-family="DM Sans" font-size="12" font-weight="normal" font-style="normal" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">Nader onderzoek /</tspan><tspan x="700" dy="15">uitspraak vragen</tspan></text>
<line x1="700" y1="270" x2="1170" y2="380" stroke="#DFDCD3" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="1020" y="380" width="300" height="90" rx="8" fill="#FFFFFF" stroke="#E3E0D8" stroke-width="1"/>
<rect x="1020" y="380" width="300" height="6" rx="0" fill="#2563A8" stroke="none" stroke-width="1"/>
<text x="1170" y="414" font-family="Cormorant Garamond" font-size="17" font-weight="bold" font-style="normal" fill="#14213D" text-anchor="middle"><tspan x="1170" dy="0">Niet</tspan></text>
<text x="1170" y="438" font-family="DM Sans" font-size="12" font-weight="normal" font-style="normal" fill="#55606F" text-anchor="middle"><tspan x="1170" dy="0">Geen verplichting;</tspan><tspan x="1170" dy="15">vrij te kiezen</tspan></text>
</svg>