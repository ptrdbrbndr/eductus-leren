<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
<rect width="1400" height="720" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563A8"/></marker></defs>
<text x="700" y="46" font-family="Cormorant Garamond" font-size="25" font-weight="bold" font-style="normal" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Tijdlijn van inventarisatie tot ingangsdatum, met het kritieke pad</tspan></text>
<rect x="150" y="130" width="210" height="44" rx="6" fill="#14213D" stroke="#14213D" stroke-width="1"/>
<text x="255" y="148" font-family="DM Sans" font-size="11" font-weight="bold" font-style="normal" fill="#FFFFFF" text-anchor="middle"><tspan x="255" dy="0">Inventarisatie en</tspan><tspan x="255" dy="13">doelstellingen</tspan></text>
<text x="255" y="170" font-family="DM Sans" font-size="9.5" font-weight="normal" font-style="normal" fill="#CFE0F2" text-anchor="middle"><tspan x="255" dy="0">4–6 weken</tspan></text>
<rect x="366" y="130" width="294" height="44" rx="6" fill="#14213D" stroke="#14213D" stroke-width="1"/>
<text x="513" y="148" font-family="DM Sans" font-size="11" font-weight="bold" font-style="normal" fill="#FFFFFF" text-anchor="middle"><tspan x="513" dy="0">Offerteaanvraag en</tspan><tspan x="513" dy="13">-vergelijking</tspan></text>
<text x="513" y="170" font-family="DM Sans" font-size="9.5" font-weight="normal" font-style="normal" fill="#CFE0F2" text-anchor="middle"><tspan x="513" dy="0">6–8 weken</tspan></text>
<rect x="528" y="62" width="420" height="44" rx="6" fill="#FBF6E9" stroke="#E9A13B" stroke-width="1"/>
<text x="738" y="80" font-family="DM Sans" font-size="11" font-weight="bold" font-style="normal" fill="#14213D" text-anchor="middle"><tspan x="738" dy="0">Arbeidsvoorwaardelijk</tspan><tspan x="738" dy="13">traject (incl. OR)</tspan></text>
<text x="738" y="102" font-family="DM Sans" font-size="9.5" font-weight="normal" font-style="normal" fill="#55606F" text-anchor="middle"><tspan x="738" dy="0">8–12, parallel weken</tspan></text>
<rect x="666" y="130" width="210" height="44" rx="6" fill="#14213D" stroke="#14213D" stroke-width="1"/>
<text x="771" y="148" font-family="DM Sans" font-size="11" font-weight="bold" font-style="normal" fill="#FFFFFF" text-anchor="middle"><tspan x="771" dy="0">Definitieve</tspan><tspan x="771" dy="13">contractering</tspan></text>
<text x="771" y="170" font-family="DM Sans" font-size="9.5" font-weight="normal" font-style="normal" fill="#CFE0F2" text-anchor="middle"><tspan x="771" dy="0">4–6 weken</tspan></text>
<rect x="882" y="130" width="420" height="44" rx="6" fill="#14213D" stroke="#14213D" stroke-width="1"/>
<text x="1092" y="148" font-family="DM Sans" font-size="11" font-weight="bold" font-style="normal" fill="#FFFFFF" text-anchor="middle"><tspan x="1092" dy="0">Implementatie bij</tspan><tspan x="1092" dy="13">de uitvoerder</tspan></text>
<text x="1092" y="170" font-family="DM Sans" font-size="9.5" font-weight="normal" font-style="normal" fill="#CFE0F2" text-anchor="middle"><tspan x="1092" dy="0">8–12 weken</tspan></text>
<line x1="150" y1="220" x2="312" y2="220" stroke="#DFDCD3" stroke-width="1.5"/>
<circle cx="150" cy="220" r="8" fill="#2563A8" stroke="#14213D" stroke-width="1.5"/>
<text x="150" y="242" font-family="DM Sans" font-size="11" font-weight="normal" font-style="normal" fill="#55606F" text-anchor="middle"><tspan x="150" dy="0">start</tspan></text>
<circle cx="1308" cy="220" r="10" fill="#E9A13B" stroke="#14213D" stroke-width="1.5"/>
<text x="1308" y="242" font-family="DM Sans" font-size="12" font-weight="bold" font-style="normal" fill="#14213D" text-anchor="middle"><tspan x="1308" dy="0">ingangsdatum</tspan></text>
<text x="700" y="420" font-family="DM Sans" font-size="14" font-weight="normal" font-style="italic" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">Totale doorlooptijd: zes tot negen maanden bij een voorspoedig traject</tspan></text>
<text x="700" y="448" font-family="DM Sans" font-size="12" font-weight="normal" font-style="italic" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">(reken altijd terug vanaf de gewenste ingangsdatum)</tspan></text>
