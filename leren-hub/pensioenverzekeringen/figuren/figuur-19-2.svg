<circle cx="946" cy="198" r="16" fill="#14213D" stroke="#14213D" stroke-width="1.5"/>
<text x="946" y="203" font-family="DM Sans" font-size="13" font-weight="bold" font-style="normal" fill="#FFFFFF" text-anchor="middle"><tspan x="946" dy="0">4</tspan></text>
<text x="946" y="254" font-family="Cormorant Garamond" font-size="14.5" font-weight="bold" font-style="normal" fill="#14213D" text-anchor="middle"><tspan x="946" dy="0">Pensioenuitvoerder</tspan></text>
<text x="946" y="280" font-family="DM Sans" font-size="11" font-weight="normal" font-style="normal" fill="#55606F" text-anchor="middle"><tspan x="946" dy="0">doorgifte: koppeling,</tspan><tspan x="946" dy="15">handmatig of combinatie</tspan></text>
<line x1="1056" y1="285" x2="1082" y2="285" stroke="#2563A8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="1082" y="220" width="220" height="130" rx="8" fill="#FFFFFF" stroke="#E3E0D8" stroke-width="1"/>
<circle cx="1192" cy="198" r="16" fill="#14213D" stroke="#14213D" stroke-width="1.5"/>
<text x="1192" y="203" font-family="DM Sans" font-size="13" font-weight="bold" font-style="normal" fill="#FFFFFF" text-anchor="middle"><tspan x="1192" dy="0">5</tspan></text>
<text x="1192" y="254" font-family="Cormorant Garamond" font-size="14.5" font-weight="bold" font-style="normal" fill="#14213D" text-anchor="middle"><tspan x="1192" dy="0">Verwerking</tspan></text>
<text x="1192" y="280" font-family="DM Sans" font-size="11" font-weight="normal" font-style="normal" fill="#55606F" text-anchor="middle"><tspan x="1192" dy="0">validatie, opname in</tspan><tspan x="1192" dy="15">administratie, doorwerking</tspan></text>
<text x="700" y="420" font-family="DM Sans" font-size="14" font-weight="normal" font-style="italic" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">Elke schakel is een potentiële plek voor verlies of vervorming van informatie</tspan></text>
