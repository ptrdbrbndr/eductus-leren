<circle cx="454" cy="198" r="16" fill="#14213D" stroke="#14213D" stroke-width="1.5"/>
<text x="454" y="203" font-family="DM Sans" font-size="13" font-weight="bold" font-style="normal" fill="#FFFFFF" text-anchor="middle"><tspan x="454" dy="0">2</tspan></text>
<text x="454" y="254" font-family="Cormorant Garamond" font-size="14.5" font-weight="bold" font-style="normal" fill="#14213D" text-anchor="middle"><tspan x="454" dy="0">Werkgever</tspan></text>
<text x="454" y="280" font-family="DM Sans" font-size="11" font-weight="normal" font-style="normal" fill="#55606F" text-anchor="middle"><tspan x="454" dy="0">vastlegging in salaris- of</tspan><tspan x="454" dy="15">HR-administratie</tspan></text>
<line x1="564" y1="285" x2="590" y2="285" stroke="#2563A8" stroke-width="2" marker-end="url(#arrow)"/>
