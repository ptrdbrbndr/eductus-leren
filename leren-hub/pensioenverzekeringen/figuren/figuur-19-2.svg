<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
<rect width="1400" height="720" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563A8"/></marker></defs>
<text x="700" y="46" font-family="Cormorant Garamond" font-size="25" font-weight="bold" font-style="normal" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">De mutatieketen: van gebeurtenis tot verwerkte aanspraak</tspan></text>
<rect x="98" y="220" width="220" height="130" rx="8" fill="#FFFFFF" stroke="#E3E0D8" stroke-width="1"/>
<circle cx="208" cy="198" r="16" fill="#14213D" stroke="#14213D" stroke-width="1.5"/>
<text x="208" y="203" font-family="DM Sans" font-size="13" font-weight="bold" font-style="normal" fill="#FFFFFF" text-anchor="middle"><tspan x="208" dy="0">1</tspan></text>
<text x="208" y="254" font-family="Cormorant Garamond" font-size="14.5" font-weight="bold" font-style="normal" fill="#14213D" text-anchor="middle"><tspan x="208" dy="0">De gebeurtenis</tspan></text>
<text x="208" y="280" font-family="DM Sans" font-size="11" font-weight="normal" font-style="normal" fill="#55606F" text-anchor="middle"><tspan x="208" dy="0">salariswijziging, geboorte,</tspan><tspan x="208" dy="15">scheiding, indiensttreding</tspan></text>
<line x1="318" y1="285" x2="344" y2="285" stroke="#2563A8" stroke-width="2" marker-end="url(#arrow)"/>
