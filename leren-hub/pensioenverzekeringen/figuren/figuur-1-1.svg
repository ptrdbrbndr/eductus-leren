<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
<rect width="1400" height="720" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563A8"/></marker></defs>
<text x="700" y="46" font-family="Cormorant Garamond" font-size="25" font-weight="bold" font-style="normal" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">De drie pijlers van het Nederlandse pensioenstelsel</tspan></text>
<rect x="60" y="90" width="400" height="300" rx="8" fill="#FFFFFF" stroke="#E3E0D8" stroke-width="1"/>
<path d="M60,98 a8,8 0 0 1 8,-8 h384 a8,8 0 0 1 8,8 v32 h-400 z" fill="#14213D"/>
<text x="260" y="116" font-family="Cormorant Garamond" font-size="15" font-weight="bold" font-style="normal" fill="#FFFFFF" text-anchor="middle"><tspan x="260" dy="0">Eerste pijler — AOW</tspan></text>
<rect x="60" y="130" width="400" height="4" rx="0" fill="#2563A8" stroke="none" stroke-width="1"/>
<text x="74" y="156" font-family="DM Sans" font-size="11" font-weight="bold" font-style="normal" fill="#14213D" text-anchor="start"><tspan x="74" dy="0">Bron</tspan></text>
<text x="74" y="171" font-family="DM Sans" font-size="12.5" font-weight="normal" font-style="normal" fill="#55606F" text-anchor="start"><tspan x="74" dy="0">Overheid, volksverzekering</tspan></text>
<text x="74" y="199.875" font-family="DM Sans" font-size="11" font-weight="bold" font-style="normal" fill="#14213D" text-anchor="start"><tspan x="74" dy="0">Verplichting</tspan></text>
<text x="74" y="214.875" font-family="DM Sans" font-size="12.5" font-weight="normal" font-style="normal" fill="#55606F" text-anchor="start"><tspan x="74" dy="0">Omslagstelsel: premies</tspan><tspan x="74" dy="16.875">van vandaag betalen</tspan><tspan x="74" dy="16.875">uitkeringen van vandaag</tspan></text>
<text x="74" y="277.5" font-family="DM Sans" font-size="11" font-weight="bold" font-style="normal" fill="#14213D" text-anchor="start"><tspan x="74" dy="0">Uitvoerder</tspan></text>
<text x="74" y="292.5" font-family="DM Sans" font-size="12.5" font-weight="normal" font-style="normal" fill="#55606F" text-anchor="start"><tspan x="74" dy="0">Sociale Verzekeringsbank (SVB)</tspan></text>
<rect x="500" y="90" width="400" height="300" rx="8" fill="#FFFFFF" stroke="#E3E0D8" stroke-width="1"/>
<path d="M500,98 a8,8 0 0 1 8,-8 h384 a8,8 0 0 1 8,8 v32 h-400 z" fill="#14213D"/>
<text x="700" y="116" font-family="Cormorant Garamond" font-size="15" font-weight="bold" font-style="normal" fill="#FFFFFF" text-anchor="middle"><tspan x="700" dy="0">Tweede pijler — werknemerspensioen</tspan></text>
<rect x="500" y="130" width="400" height="4" rx="0" fill="#E9A13B" stroke="none" stroke-width="1"/>
<text x="514" y="156" font-family="DM Sans" font-size="11" font-weight="bold" font-style="normal" fill="#14213D" text-anchor="start"><tspan x="514" dy="0">Bron</tspan></text>
<text x="514" y="171" font-family="DM Sans" font-size="12.5" font-weight="normal" font-style="normal" fill="#55606F" text-anchor="start"><tspan x="514" dy="0">Arbeidsvoorwaarde: cao-tafel</tspan><tspan x="514" dy="16.875">of arbeidscontract</tspan></text>
<text x="514" y="216.75" font-family="DM Sans" font-size="11" font-weight="bold" font-style="normal" fill="#14213D" text-anchor="start"><tspan x="514" dy="0">Verplichting</tspan></text>
<text x="514" y="231.75" font-family="DM Sans" font-size="12.5" font-weight="normal" font-style="normal" fill="#55606F" text-anchor="start"><tspan x="514" dy="0">Kapitaaldekking: opbouw voor eigen uitkering</tspan></text>
<text x="514" y="260.625" font-family="DM Sans" font-size="11" font-weight="bold" font-style="normal" fill="#14213D" text-anchor="start"><tspan x="514" dy="0">Uitvoerder</tspan></text>
<text x="514" y="275.625" font-family="DM Sans" font-size="12.5" font-weight="normal" font-style="normal" fill="#55606F" text-anchor="start"><tspan x="514" dy="0">Fonds, verzekeraar, PPI of APF</tspan></text>
<rect x="940" y="90" width="400" height="300" rx="8" fill="#FFFFFF" stroke="#E3E0D8" stroke-width="1"/>
<path d="M940,98 a8,8 0 0 1 8,-8 h384 a8,8 0 0 1 8,8 v32 h-400 z" fill="#14213D"/>
<text x="1140" y="116" font-family="Cormorant Garamond" font-size="15" font-weight="bold" font-style="normal" fill="#FFFFFF" text-anchor="middle"><tspan x="1140" dy="0">Derde pijler — individueel</tspan></text>
<rect x="940" y="130" width="400" height="4" rx="0" fill="#2563A8" stroke="none" stroke-width="1"/>
<text x="954" y="156" font-family="DM Sans" font-size="11" font-weight="bold" font-style="normal" fill="#14213D" text-anchor="start"><tspan x="954" dy="0">Bron</tspan></text>
<text x="954" y="171" font-family="DM Sans" font-size="12.5" font-weight="normal" font-style="normal" fill="#55606F" text-anchor="start"><tspan x="954" dy="0">Vrijwillig initiatief</tspan></text>
<text x="954" y="199.875" font-family="DM Sans" font-size="11" font-weight="bold" font-style="normal" fill="#14213D" text-anchor="start"><tspan x="954" dy="0">Verplichting</tspan></text>
<text x="954" y="214.875" font-family="DM Sans" font-size="12.5" font-weight="normal" font-style="normal" fill="#55606F" text-anchor="start"><tspan x="954" dy="0">Fiscaal gefaciliteerd</tspan><tspan x="954" dy="16.875">binnen de jaarruimte</tspan></text>
<text x="954" y="260.625" font-family="DM Sans" font-size="11" font-weight="bold" font-style="normal" fill="#14213D" text-anchor="start"><tspan x="954" dy="0">Uitvoerder</tspan></text>
<text x="954" y="275.625" font-family="DM Sans" font-size="12.5" font-weight="normal" font-style="normal" fill="#55606F" text-anchor="start"><tspan x="954" dy="0">Lijfrenteverzekeraar of bank</tspan></text>
<text x="700" y="440" font-family="DM Sans" font-size="13" font-weight="normal" font-style="italic" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">De tweede pijler bouwt bovenop de AOW via de franchise — het salarisdeel waarover geen pensioen wordt opgebouwd</tspan></text>
</svg>