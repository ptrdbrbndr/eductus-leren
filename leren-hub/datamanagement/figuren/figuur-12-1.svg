<text x="970" y="310" font-family="DM Sans" font-size="10.5" fill="#14213D">status_deelname_cd</text>
<text x="1220" y="310" font-family="DM Sans" font-size="10" fill="#55606F">CHAR(2)</text>
<rect x="970" y="326" width="300" height="80" rx="4" fill="#F4F6F9"/>
<text x="980" y="344" font-family="DM Sans" font-size="10" fill="#55606F">LDM-verwijzing: entiteit "Deelnemer"</text>
<text x="980" y="360" font-family="DM Sans" font-size="10" fill="#55606F">Platformkeuze: gecodeerd (status_deelname_cd)</text>
<text x="980" y="376" font-family="DM Sans" font-size="10" fill="#55606F">i.p.v. tekst — technische afwijking t.o.v.</text>
<text x="980" y="392" font-family="DM Sans" font-size="10" fill="#55606F">het logische attribuut, met dezelfde betekenis</text>

<!-- traceability arrows -->
<line x1="450" y1="235" x2="518" y2="235" stroke="#2563A8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowB)"/>
<text x="484" y="225" font-family="DM Sans" font-size="10" fill="#2563A8" text-anchor="middle">traceert</text>
<line x1="880" y1="230" x2="948" y2="230" stroke="#2563A8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowB)"/>
<text x="914" y="220" font-family="DM Sans" font-size="10" fill="#2563A8" text-anchor="middle">traceert</text>

<!-- callout: two minute test -->
<rect x="90" y="440" width="1220" height="50" rx="6" fill="#FBF4E6" stroke="#E9A13B" stroke-width="1.5"/>
<text x="700" y="470" font-family="DM Sans" font-size="12" fill="#14213D" text-anchor="middle">De toets voor traceerbaarheid: volg een willekeurige kolom uit het PDM terug tot de definitie in het CDM — lukt dat niet binnen twee minuten, dan werkt de keten niet in de praktijk.</text>

