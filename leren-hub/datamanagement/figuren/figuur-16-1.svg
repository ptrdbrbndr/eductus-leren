<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
<defs>
<marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#14213D"/>
</marker>
<marker id="arrowRed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#B03A2E"/>
</marker>
<marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#2563A8"/>
</marker>
</defs>
<rect width="1400" height="900" fill="#FBFAF7"/>
<text x="700" y="40" font-family="Cormorant Garamond" font-size="24" font-weight="bold" fill="#14213D" text-anchor="middle">BPMN — het begripswijzigingsproces</text>
<text x="700" y="63" font-family="DM Sans" font-size="12.5" fill="#55606F" text-anchor="middle">Van aanvraag via impactanalyse en domeinraadbesluit naar publicatie, communicatie en terugkoppeling — met de afwijzingsroute</text>

<!-- pool outer border -->
<rect x="28" y="82" width="1352" height="700" fill="none" stroke="#14213D" stroke-width="1.5"/>
<text x="46" y="432" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D" text-anchor="middle" transform="rotate(-90 46 432)">BEGRIPSWIJZIGINGSPROCES</text>

<!-- lane header column -->
<line x1="86" y1="82" x2="86" y2="782" stroke="#14213D" stroke-width="1.2"/>

<!-- Lane backgrounds -->
<rect x="86" y="82"  width="1294" height="140" fill="#FBFAF7"/>
<rect x="86" y="222" width="1294" height="140" fill="#F4F6F9"/>
<rect x="86" y="362" width="1294" height="140" fill="#FBFAF7"/>
<rect x="86" y="502" width="1294" height="140" fill="#F4F6F9"/>
<rect x="86" y="642" width="1294" height="140" fill="#FBFAF7"/>
<!-- lane divider lines -->
<line x1="28" y1="222" x2="1380" y2="222" stroke="#DFDCD3" stroke-width="1"/>
<line x1="28" y1="362" x2="1380" y2="362" stroke="#DFDCD3" stroke-width="1"/>
<line x1="28" y1="502" x2="1380" y2="502" stroke="#DFDCD3" stroke-width="1"/>
<line x1="28" y1="642" x2="1380" y2="642" stroke="#DFDCD3" stroke-width="1"/>

<!-- lane labels -->
<text x="56" y="156" font-family="DM Sans" font-size="11" font-weight="bold" fill="#14213D" text-anchor="middle" transform="rotate(-90 56 156)">AANVRAGER</text>
<text x="56" y="296" font-family="DM Sans" font-size="11" font-weight="bold" fill="#14213D" text-anchor="middle" transform="rotate(-90 56 296)">BUSINESS STEWARD</text>
<text x="56" y="436" font-family="DM Sans" font-size="11" font-weight="bold" fill="#14213D" text-anchor="middle" transform="rotate(-90 56 436)">TECHNICAL STEWARD</text>
<text x="56" y="576" font-family="DM Sans" font-size="11" font-weight="bold" fill="#14213D" text-anchor="middle" transform="rotate(-90 56 576)">DOMEINRAAD</text>
<text x="56" y="716" font-family="DM Sans" font-size="11" font-weight="bold" fill="#14213D" text-anchor="middle" transform="rotate(-90 56 716)">CATALOGUSBEHEER</text>

<!-- ============ FLOW ============ -->

<!-- Start event (Aanvrager) -->
<circle cx="312" cy="152" r="20" fill="#FFFFFF" stroke="#14213D" stroke-width="2"/>
<text x="312" y="185" font-family="DM Sans" font-size="10" fill="#14213D" text-anchor="middle">Aanvraag</text>
<text x="312" y="198" font-family="DM Sans" font-size="10" fill="#14213D" text-anchor="middle">ingediend</text>

<!-- flow: start -> Impactanalyse -->
<path d="M312,172 L312,292 L406,292" fill="none" stroke="#14213D" stroke-width="1.8" marker-end="url(#arrowR)"/>

<!-- Task: Impactanalyse (Business steward) -->
<rect x="406" y="262" width="140" height="60" rx="10" fill="#FFFFFF" stroke="#14213D" stroke-width="1.5"/>
<text x="476" y="286" font-family="DM Sans" font-size="10.5" font-weight="bold" fill="#14213D" text-anchor="middle">Impactanalyse</text>
<text x="476" y="300" font-family="DM Sans" font-size="8.5" fill="#55606F" text-anchor="middle">uitvoeren</text>
<text x="476" y="312" font-family="DM Sans" font-size="7.5" fill="#55606F" text-anchor="middle">rapportages, koppelvlakken, modellen</text>

<!-- flow: Impactanalyse -> Technische beoordeling -->
<path d="M546,292 L640,292 L640,432" fill="none" stroke="#14213D" stroke-width="1.8" marker-end="url(#arrowR)"/>

<!-- Task: Technische beoordeling (Technical steward) -->
<rect x="570" y="432" width="140" height="60" rx="10" fill="#FFFFFF" stroke="#14213D" stroke-width="1.5"/>
<text x="640" y="456" font-family="DM Sans" font-size="10.5" font-weight="bold" fill="#14213D" text-anchor="middle">Technische</text>
<text x="640" y="470" font-family="DM Sans" font-size="10.5" font-weight="bold" fill="#14213D" text-anchor="middle">beoordeling</text>
<text x="640" y="484" font-family="DM Sans" font-size="7.5" fill="#55606F" text-anchor="middle">technische gevolgen in kaart</text>

<!-- flow: Technische beoordeling -> gateway -->
<path d="M710,462 L805,462 L805,572" fill="none" stroke="#14213D" stroke-width="1.8" marker-end="url(#arrowR)"/>

<!-- Gateway: Akkoord? (Domeinraad) -->
<polygon points="805,572 840,607 805,642 770,607" fill="#F4F6F9" stroke="#2563A8" stroke-width="2"/>
<text x="805" y="602" font-family="DM Sans" font-size="10" font-weight="bold" fill="#14213D" text-anchor="middle">Domeinraad</text>
<text x="805" y="615" font-family="DM Sans" font-size="10" font-weight="bold" fill="#14213D" text-anchor="middle">akkoord?</text>

<!-- Nee branch: gateway -> Terugkoppelen (afwijzing), Business steward -->
<path d="M805,572 L805,322" fill="none" stroke="#B03A2E" stroke-width="1.8" marker-end="url(#arrowRed)"/>
<text x="820" y="480" font-family="DM Sans" font-size="10" font-weight="bold" fill="#B03A2E">nee</text>
<rect x="735" y="262" width="140" height="60" rx="10" fill="#FDF0EE" stroke="#B03A2E" stroke-width="1.5"/>
<text x="805" y="286" font-family="DM Sans" font-size="10" font-weight="bold" fill="#14213D" text-anchor="middle">Terugkoppelen</text>
<text x="805" y="300" font-family="DM Sans" font-size="8.5" fill="#55606F" text-anchor="middle">aan aanvrager</text>
<text x="805" y="312" font-family="DM Sans" font-size="7.5" fill="#B03A2E" text-anchor="middle">met reden van afwijzing</text>

<!-- Nee: Terugkoppelen -> End: afgewezen -->
<path d="M805,262 L805,172" fill="none" stroke="#B03A2E" stroke-width="1.8" marker-end="url(#arrowRed)"/>
<circle cx="805" cy="152" r="20" fill="#FDF0EE" stroke="#B03A2E" stroke-width="3"/>
<text x="805" y="182" font-family="DM Sans" font-size="10" font-weight="bold" fill="#B03A2E" text-anchor="middle">Einde: afgewezen</text>

<!-- Ja branch: gateway -> Publiceren in catalogus (Catalogusbeheer) -->
<path d="M840,607 L969,607 L969,712" fill="none" stroke="#2563A8" stroke-width="1.8" marker-end="url(#arrowGreen)"/>
<text x="880" y="597" font-family="DM Sans" font-size="10" font-weight="bold" fill="#2563A8">ja</text>

<rect x="899" y="712" width="140" height="60" rx="10" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="969" y="736" font-family="DM Sans" font-size="10" font-weight="bold" fill="#14213D" text-anchor="middle">Publiceren in</text>
<text x="969" y="750" font-family="DM Sans" font-size="10" font-weight="bold" fill="#14213D" text-anchor="middle">catalogus</text>
<text x="969" y="762" font-family="DM Sans" font-size="7.5" fill="#55606F" text-anchor="middle">definitie zichtbaar in het geheugen</text>

<!-- flow: Publiceren -> Communiceren -->
<path d="M1039,742 L1133,742" fill="none" stroke="#2563A8" stroke-width="1.8" marker-end="url(#arrowGreen)"/>
<rect x="1063" y="712" width="140" height="60" rx="10" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="1133" y="736" font-family="DM Sans" font-size="10" font-weight="bold" fill="#14213D" text-anchor="middle">Communiceren</text>
<text x="1133" y="750" font-family="DM Sans" font-size="10" font-weight="bold" fill="#14213D" text-anchor="middle">aan afnemers</text>
<text x="1133" y="762" font-family="DM Sans" font-size="7.5" fill="#55606F" text-anchor="middle">bekende afnemers geïnformeerd</text>

<!-- flow: Communiceren -> Versie vastleggen -->
<path d="M1203,742 L1298,742" fill="none" stroke="#2563A8" stroke-width="1.8" marker-end="url(#arrowGreen)"/>
<rect x="1228" y="712" width="140" height="60" rx="10" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="1298" y="732" font-family="DM Sans" font-size="9.5" font-weight="bold" fill="#14213D" text-anchor="middle">Versie &amp;</text>
<text x="1298" y="746" font-family="DM Sans" font-size="9.5" font-weight="bold" fill="#14213D" text-anchor="middle">ingangsdatum</text>
<text x="1298" y="760" font-family="DM Sans" font-size="9.5" font-weight="bold" fill="#14213D" text-anchor="middle">vastleggen</text>

<!-- flow: Versie vastleggen -> Terugkoppelen (akkoord), Business steward -->
<path d="M1298,712 L1298,322" fill="none" stroke="#2563A8" stroke-width="1.8" marker-end="url(#arrowGreen)"/>
<rect x="1228" y="262" width="140" height="60" rx="10" fill="#EAF1FA" stroke="#2563A8" stroke-width="1.5"/>
<text x="1298" y="286" font-family="DM Sans" font-size="10" font-weight="bold" fill="#14213D" text-anchor="middle">Terugkoppelen</text>
<text x="1298" y="300" font-family="DM Sans" font-size="8.5" fill="#55606F" text-anchor="middle">aan aanvrager</text>
<text x="1298" y="312" font-family="DM Sans" font-size="7.5" fill="#2563A8" text-anchor="middle">met versie en ingangsdatum</text>

<!-- flow: Terugkoppelen akkoord -> End: succes -->
<path d="M1298,262 L1298,172" fill="none" stroke="#2563A8" stroke-width="1.8" marker-end="url(#arrowGreen)"/>
<circle cx="1298" cy="152" r="20" fill="#EAF1FA" stroke="#2563A8" stroke-width="3"/>
<text x="1298" y="182" font-family="DM Sans" font-size="10" font-weight="bold" fill="#2563A8" text-anchor="middle">Einde: gepubliceerd</text>

<!-- legend -->
<rect x="86" y="800" width="1294" height="76" rx="6" fill="#F4F6F9" stroke="#DFDCD3" stroke-width="1"/>
<circle cx="112" cy="826" r="9" fill="#FFFFFF" stroke="#14213D" stroke-width="1.5"/>
<text x="130" y="830" font-family="DM Sans" font-size="10.5" fill="#55606F">start-/eindgebeurtenis</text>
<rect x="330" y="817" width="26" height="18" rx="5" fill="#FFFFFF" stroke="#14213D" stroke-width="1.5"/>
<text x="366" y="830" font-family="DM Sans" font-size="10.5" fill="#55606F">taak</text>
<polygon points="470,817 486,826 470,835 454,826" fill="#F4F6F9" stroke="#2563A8" stroke-width="1.5"/>
<text x="498" y="830" font-family="DM Sans" font-size="10.5" fill="#55606F">exclusieve gateway</text>
<text x="700" y="830" font-family="DM Sans" font-size="10.5" fill="#55606F">Publicatie in de catalogus is een processtap, geen bijzaak — zonder die stap valt het besluit buiten het geheugen van de organisatie.</text>
<text x="112" y="858" font-family="DM Sans" font-size="10.5" fill="#B03A2E">Terugkoppeling naar de aanvrager staat in béide routes — dat bepaalt het vertrouwen in de inrichting, ook bij afwijzing.</text>
</svg>
