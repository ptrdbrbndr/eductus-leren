<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
<defs>
<marker id="arrow22a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#14213D"/>
</marker>
</defs>
<rect width="1400" height="820" fill="#FBFAF7"/>
<text x="700" y="48" font-family="Cormorant Garamond" font-size="25" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Capability-gedreven ontwerp — van capability naar bron, met de gaten zichtbaar</tspan></text>

<!-- Row 1: Capabilities benoemen -->
<rect x="140" y="100" width="1120" height="104" rx="6" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1.5"/>
<circle cx="182" cy="152" r="24" fill="#14213D"/>
<text x="182" y="159" font-family="DM Sans" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="182" dy="0">1</tspan></text>
<text x="228" y="138" font-family="DM Sans" font-size="17" font-weight="bold" fill="#14213D"><tspan x="228" dy="0">Capabilities benoemen</tspan></text>
<text x="228" y="160" font-family="DM Sans" font-size="12.5" fill="#55606F"><tspan x="228" dy="0">Wat moet de gefuseerde organisatie kunnen?</tspan></text>
<line x1="758" y1="118" x2="758" y2="186" stroke="#DFDCD3" stroke-width="1.5"/>
<text x="784" y="132" font-family="DM Sans" font-size="10.5" font-weight="bold" fill="#2563A8" letter-spacing="0.5"><tspan x="784" dy="0">BIJ DE FUSIE</tspan></text>
<text x="784" y="153" font-family="DM Sans" font-size="13" fill="#14213D"><tspan x="784" dy="0">Deelnemer bedienen · premie innen ·</tspan><tspan x="784" dy="18">vermogen beheren · verantwoorden</tspan></text>

<line x1="700" y1="204" x2="700" y2="228" stroke="#14213D" stroke-width="2" marker-end="url(#arrow22a)"/>

<!-- Row 2: Informatiebehoefte afleiden -->
<rect x="140" y="232" width="1120" height="104" rx="6" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1.5"/>
<circle cx="182" cy="284" r="24" fill="#14213D"/>
<text x="182" y="291" font-family="DM Sans" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="182" dy="0">2</tspan></text>
<text x="228" y="270" font-family="DM Sans" font-size="17" font-weight="bold" fill="#14213D"><tspan x="228" dy="0">Informatiebehoefte afleiden</tspan></text>
<text x="228" y="292" font-family="DM Sans" font-size="12.5" fill="#55606F"><tspan x="228" dy="0">Welke informatie heeft die capability nodig?</tspan></text>
<line x1="758" y1="250" x2="758" y2="318" stroke="#DFDCD3" stroke-width="1.5"/>
<text x="784" y="264" font-family="DM Sans" font-size="10.5" font-weight="bold" fill="#2563A8" letter-spacing="0.5"><tspan x="784" dy="0">BIJ DE FUSIE</tspan></text>
<text x="784" y="288" font-family="DM Sans" font-size="13" fill="#14213D"><tspan x="784" dy="0">Eén deelnemersbeeld over beide portefeuilles</tspan></text>

<line x1="700" y1="336" x2="700" y2="360" stroke="#14213D" stroke-width="2" marker-end="url(#arrow22a)"/>

<!-- Row 3: Datadomeinen bepalen -->
<rect x="140" y="364" width="1120" height="104" rx="6" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1.5"/>
<circle cx="182" cy="416" r="24" fill="#14213D"/>
<text x="182" y="423" font-family="DM Sans" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="182" dy="0">3</tspan></text>
<text x="228" y="402" font-family="DM Sans" font-size="17" font-weight="bold" fill="#14213D"><tspan x="228" dy="0">Datadomeinen bepalen</tspan></text>
<text x="228" y="424" font-family="DM Sans" font-size="12.5" fill="#55606F"><tspan x="228" dy="0">Welke samenhangende gebieden volgen daaruit?</tspan></text>
<line x1="758" y1="382" x2="758" y2="450" stroke="#DFDCD3" stroke-width="1.5"/>
<text x="784" y="396" font-family="DM Sans" font-size="10.5" font-weight="bold" fill="#2563A8" letter-spacing="0.5"><tspan x="784" dy="0">BIJ DE FUSIE</tspan></text>
<text x="784" y="417" font-family="DM Sans" font-size="13" fill="#14213D"><tspan x="784" dy="0">Deelnemer, Werkgever, Regeling,</tspan><tspan x="784" dy="18">Belegging, Financieel</tspan></text>

<line x1="700" y1="468" x2="700" y2="492" stroke="#14213D" stroke-width="2" marker-end="url(#arrow22a)"/>

<!-- Row 4: Bron aanwijzen — CONFLICT -->
<rect x="140" y="496" width="1120" height="104" rx="6" fill="#FBF4E6" stroke="#E9A13B" stroke-width="2"/>
<circle cx="182" cy="548" r="24" fill="#14213D"/>
<text x="182" y="555" font-family="DM Sans" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="182" dy="0">4</tspan></text>
<text x="228" y="534" font-family="DM Sans" font-size="17" font-weight="bold" fill="#14213D"><tspan x="228" dy="0">Bron aanwijzen</tspan></text>
<text x="228" y="556" font-family="DM Sans" font-size="12.5" fill="#55606F"><tspan x="228" dy="0">Welk systeem levert dit gegeven gezaghebbend?</tspan></text>
<line x1="758" y1="514" x2="758" y2="582" stroke="#E9A13B" stroke-width="1.5"/>
<text x="784" y="528" font-family="DM Sans" font-size="10.5" font-weight="bold" fill="#E9A13B" letter-spacing="0.5"><tspan x="784" dy="0">BIJ DE FUSIE</tspan></text>
<text x="784" y="551" font-family="DM Sans" font-size="13" fill="#14213D"><tspan x="784" dy="0">Het conflict: twee kandidaten</tspan><tspan x="784" dy="18">per domein</tspan></text>
<!-- conflict icon: two overlapping circles M / N -->
<circle cx="1178" cy="536" r="21" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2"/>
<text x="1178" y="542" font-family="DM Sans" font-size="13" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="1178" dy="0">M</tspan></text>
<circle cx="1210" cy="560" r="21" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2"/>
<text x="1210" y="566" font-family="DM Sans" font-size="13" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="1210" dy="0">N</tspan></text>
<text x="1194" y="586" font-family="DM Sans" font-size="9.5" font-weight="bold" fill="#E9A13B" text-anchor="middle"><tspan x="1194" dy="0">CONFLICT</tspan></text>

<line x1="700" y1="600" x2="700" y2="624" stroke="#14213D" stroke-width="2" marker-end="url(#arrow22a)"/>

<!-- Row 5: Gaten benoemen — GAP -->
<rect x="140" y="628" width="1120" height="104" rx="6" fill="#F4F6F9" stroke="#E9A13B" stroke-width="2" stroke-dasharray="7 5"/>
<circle cx="182" cy="680" r="24" fill="#14213D"/>
<text x="182" y="687" font-family="DM Sans" font-size="19" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="182" dy="0">5</tspan></text>
<text x="228" y="666" font-family="DM Sans" font-size="17" font-weight="bold" fill="#14213D"><tspan x="228" dy="0">Gaten benoemen</tspan></text>
<text x="228" y="688" font-family="DM Sans" font-size="12.5" fill="#55606F"><tspan x="228" dy="0">Welke capability heeft geen bron?</tspan></text>
<line x1="758" y1="646" x2="758" y2="714" stroke="#E9A13B" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="784" y="660" font-family="DM Sans" font-size="10.5" font-weight="bold" fill="#E9A13B" letter-spacing="0.5"><tspan x="784" dy="0">BIJ DE FUSIE</tspan></text>
<text x="784" y="683" font-family="DM Sans" font-size="13" fill="#14213D"><tspan x="784" dy="0">Verantwoording over de</tspan><tspan x="784" dy="18">gecombineerde portefeuille</tspan></text>
<!-- gap icon: warning triangle -->
<path d="M 1178 660 L 1200 700 L 1156 700 Z" fill="#E9A13B"/>
<text x="1178" y="695" font-family="DM Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="1178" dy="0">!</tspan></text>
<text x="1178" y="717" font-family="DM Sans" font-size="9.5" font-weight="bold" fill="#E9A13B" text-anchor="middle"><tspan x="1178" dy="0">GEEN BRON</tspan></text>

<!-- Legend -->
<rect x="140" y="758" width="18" height="18" rx="3" fill="#FBF4E6" stroke="#E9A13B" stroke-width="2"/>
<text x="166" y="772" font-family="DM Sans" font-size="12.5" fill="#55606F"><tspan x="166" dy="0">solide amber — conflict: twee kandidaten voor de bron van waarheid</tspan></text>
<rect x="740" y="758" width="18" height="18" rx="3" fill="#F4F6F9" stroke="#E9A13B" stroke-width="2" stroke-dasharray="4 3"/>
<text x="766" y="772" font-family="DM Sans" font-size="12.5" fill="#55606F"><tspan x="766" dy="0">gestippeld amber — gat: geen bron aanwijsbaar</tspan></text>
</svg>
