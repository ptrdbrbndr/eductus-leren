<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
<defs>
<marker id="arrowNavy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#14213D"/>
</marker>
</defs>
<rect width="1400" height="720" fill="#FBFAF7"/>
<text x="700" y="48" font-family="Cormorant Garamond" font-size="26" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">De datawaardeketen — van data naar besluit</tspan></text>
<text x="700" y="76" font-family="DM Sans" font-size="13" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">Vier schakels, vier soorten werk — en op elke overgang een voorspelbaar verliespunt</tspan></text>

<!-- four stage boxes -->
<!-- Data -->
<rect x="80" y="160" width="270" height="150" rx="6" fill="#F4F6F9" stroke="#14213D" stroke-width="1.5"/>
<rect x="80" y="160" width="270" height="40" rx="6" fill="#14213D"/>
<rect x="80" y="182" width="270" height="18" fill="#14213D"/>
<text x="215" y="186" font-family="DM Sans" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="215" dy="0">1. Data</tspan></text>
<text x="100" y="225" font-family="DM Sans" font-size="11.5" fill="#55606F"><tspan x="100" dy="0">Waarneming zonder</tspan><tspan x="100" dy="16">context</tspan></text>
<text x="100" y="270" font-family="DM Sans" font-size="11.5" font-weight="bold" fill="#14213D"><tspan x="100" dy="0">Bij Meridiaan</tspan></text>
<text x="100" y="290" font-family="DM Sans" font-size="11.5" fill="#2563A8"><tspan x="100" dy="0">"Een datum in een veld"</tspan></text>

<!-- Informatie -->
<rect x="410" y="160" width="270" height="150" rx="6" fill="#F4F6F9" stroke="#14213D" stroke-width="1.5"/>
<rect x="410" y="160" width="270" height="40" rx="6" fill="#14213D"/>
<rect x="410" y="182" width="270" height="18" fill="#14213D"/>
<text x="545" y="186" font-family="DM Sans" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="545" dy="0">2. Informatie</tspan></text>
<text x="430" y="225" font-family="DM Sans" font-size="11.5" fill="#55606F"><tspan x="430" dy="0">Data met context</tspan><tspan x="430" dy="16">en betekenis</tspan></text>
<text x="430" y="270" font-family="DM Sans" font-size="11.5" font-weight="bold" fill="#14213D"><tspan x="430" dy="0">Bij Meridiaan</tspan></text>
<text x="430" y="290" font-family="DM Sans" font-size="11" fill="#2563A8"><tspan x="430" dy="0">"Deze deelnemer is 63 en</tspan><tspan x="430" dy="15">bouwt nog op"</tspan></text>

<!-- Kennis -->
<rect x="740" y="160" width="270" height="150" rx="6" fill="#F4F6F9" stroke="#14213D" stroke-width="1.5"/>
<rect x="740" y="160" width="270" height="40" rx="6" fill="#14213D"/>
<rect x="740" y="182" width="270" height="18" fill="#14213D"/>
<text x="875" y="186" font-family="DM Sans" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="875" dy="0">3. Kennis</tspan></text>
<text x="760" y="225" font-family="DM Sans" font-size="11.5" fill="#55606F"><tspan x="760" dy="0">Informatie in patroon</tspan><tspan x="760" dy="16">en ervaring</tspan></text>
<text x="760" y="270" font-family="DM Sans" font-size="11.5" font-weight="bold" fill="#14213D"><tspan x="760" dy="0">Bij Meridiaan</tspan></text>
<text x="760" y="290" font-family="DM Sans" font-size="11" fill="#2563A8"><tspan x="760" dy="0">"Deze groep belt vaker</tspan><tspan x="760" dy="15">over waardeoverdracht"</tspan></text>

<!-- Besluit -->
<rect x="1070" y="160" width="250" height="150" rx="6" fill="#FBF4E6" stroke="#E9A13B" stroke-width="2"/>
<rect x="1070" y="160" width="250" height="40" rx="6" fill="#E9A13B"/>
<rect x="1070" y="182" width="250" height="18" fill="#E9A13B"/>
<text x="1195" y="186" font-family="DM Sans" font-size="16" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="1195" dy="0">4. Besluit</tspan></text>
<text x="1090" y="225" font-family="DM Sans" font-size="11.5" fill="#55606F"><tspan x="1090" dy="0">Handeling op grond</tspan><tspan x="1090" dy="16">van kennis</tspan></text>
<text x="1090" y="270" font-family="DM Sans" font-size="11.5" font-weight="bold" fill="#14213D"><tspan x="1090" dy="0">Bij Meridiaan</tspan></text>
<text x="1090" y="290" font-family="DM Sans" font-size="11" fill="#14213D"><tspan x="1090" dy="0">"Wij benaderen ze</tspan><tspan x="1090" dy="15">proactief in Q2"</tspan></text>

<!-- arrows between boxes -->
<line x1="350" y1="235" x2="410" y2="235" stroke="#14213D" stroke-width="2" marker-end="url(#arrowNavy)"/>
<line x1="680" y1="235" x2="740" y2="235" stroke="#14213D" stroke-width="2" marker-end="url(#arrowNavy)"/>
<line x1="1010" y1="235" x2="1070" y2="235" stroke="#14213D" stroke-width="2" marker-end="url(#arrowNavy)"/>

<!-- failure points below, aligned under the arrows -->
<line x1="380" y1="330" x2="380" y2="260" stroke="#DFDCD3" stroke-width="1.5" stroke-dasharray="3 3"/>
<line x1="710" y1="330" x2="710" y2="260" stroke="#DFDCD3" stroke-width="1.5" stroke-dasharray="3 3"/>
<line x1="1040" y1="330" x2="1040" y2="260" stroke="#DFDCD3" stroke-width="1.5" stroke-dasharray="3 3"/>

<rect x="255" y="335" width="250" height="70" rx="20" fill="#FFFFFF" stroke="#E9A13B" stroke-width="1.5"/>
<text x="380" y="362" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="380" dy="0">Verliespunt 1</tspan></text>
<text x="380" y="382" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle"><tspan x="380" dy="0">Definitie ontbreekt</tspan></text>

<rect x="585" y="335" width="250" height="70" rx="20" fill="#FFFFFF" stroke="#E9A13B" stroke-width="1.5"/>
<text x="710" y="362" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="710" dy="0">Verliespunt 2</tspan></text>
<text x="710" y="382" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle"><tspan x="710" dy="0">Aannames blijven impliciet</tspan></text>

<rect x="915" y="335" width="250" height="70" rx="20" fill="#FFFFFF" stroke="#E9A13B" stroke-width="1.5"/>
<text x="1040" y="362" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="1040" dy="0">Verliespunt 3</tspan></text>
<text x="1040" y="382" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle"><tspan x="1040" dy="0">Uitkomst bereikt niemand</tspan></text>

<!-- bottom explanatory note -->
<rect x="80" y="460" width="1240" height="150" rx="6" fill="#F4F6F9" stroke="#DFDCD3" stroke-width="1"/>
<text x="110" y="495" font-family="DM Sans" font-size="13" font-weight="bold" fill="#14213D"><tspan x="110" dy="0">Waar jij naar kijkt</tspan></text>
<text x="110" y="520" font-family="DM Sans" font-size="12.5" fill="#55606F"><tspan x="110" dy="0">Bij een vraag over "datakwaliteit": loop eerst deze vier schakels langs. Tussen data en informatie gaat het mis als</tspan></text>
<text x="110" y="542" font-family="DM Sans" font-size="12.5" fill="#55606F"><tspan x="110" dy="0">de definitie ontbreekt. Tussen informatie en kennis gaat het mis als de analyse haar eigen aannames niet expliciet</tspan></text>
<text x="110" y="564" font-family="DM Sans" font-size="12.5" fill="#55606F"><tspan x="110" dy="0">maakt. Tussen kennis en besluit gaat het mis als de uitkomst niemand bereikt die iets mag beslissen. In ongeveer de</tspan></text>
<text x="110" y="586" font-family="DM Sans" font-size="12.5" fill="#55606F"><tspan x="110" dy="0">helft van de gevallen zit het probleem niet in de data, maar in een van deze drie overgangen.</tspan></text>
</svg>
