<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
<rect width="1400" height="760" fill="#FBFAF7"/>
<text x="700" y="42" font-family="Cormorant Garamond" font-size="25" font-weight="bold" fill="#14213D" text-anchor="middle">Simpson's paradox bij de digitale uitvraag</text>
<text x="700" y="65" font-family="DM Sans" font-size="12.5" fill="#55606F" text-anchor="middle">Lager totaalpercentage voor digitaal — terwijl digitaal binnen élke grootteklasse beter scoort dan papier</text>

<!-- legend -->
<rect x="1080" y="18" width="16" height="16" fill="#55606F"/>
<text x="1102" y="31" font-family="DM Sans" font-size="11" fill="#55606F">Papier</text>
<rect x="1170" y="18" width="16" height="16" fill="#2563A8"/>
<text x="1192" y="31" font-family="DM Sans" font-size="11" fill="#55606F">Digitaal</text>

<!-- LEFT PANEL: Totaal -->
<rect x="60" y="100" width="420" height="470" rx="8" fill="#FFFFFF" stroke="#B03A2E" stroke-width="2"/>
<text x="270" y="130" font-family="DM Sans" font-size="14" font-weight="bold" fill="#14213D" text-anchor="middle">Totaal — alle werkgevers</text>
<text x="270" y="148" font-family="DM Sans" font-size="10.5" fill="#B03A2E" text-anchor="middle">het misleidende totaalbeeld</text>

<!-- axis -->
<line x1="130" y1="500" x2="420" y2="500" stroke="#14213D" stroke-width="1.5"/>
<line x1="130" y1="200" x2="130" y2="500" stroke="#DFDCD3" stroke-width="1"/>
<text x="118" y="204" font-family="DM Sans" font-size="9" fill="#55606F" text-anchor="end">100%</text>
<text x="118" y="354" font-family="DM Sans" font-size="9" fill="#55606F" text-anchor="end">50%</text>
<line x1="130" y1="350" x2="420" y2="350" stroke="#EFEBE0" stroke-width="1" stroke-dasharray="3 3"/>

<!-- bars: Papier 60%, Digitaal 52% -->
<rect x="190" y="320" width="80" height="180" fill="#55606F"/>
<text x="230" y="310" font-family="DM Sans" font-size="13" font-weight="bold" fill="#14213D" text-anchor="middle">60%</text>
<text x="230" y="518" font-family="DM Sans" font-size="10.5" fill="#55606F" text-anchor="middle">Papier</text>

<rect x="300" y="344" width="80" height="156" fill="#2563A8"/>
<text x="340" y="334" font-family="DM Sans" font-size="13" font-weight="bold" fill="#14213D" text-anchor="middle">52%</text>
<text x="340" y="518" font-family="DM Sans" font-size="10.5" fill="#55606F" text-anchor="middle">Digitaal</text>

<rect x="90" y="536" width="360" height="18" fill="#FDF0EE"/>
<text x="270" y="550" font-family="DM Sans" font-size="10.5" fill="#B03A2E" font-weight="bold" text-anchor="middle">Digitaal lijkt slechter</text>

<!-- reversal arrow between panels -->
<path d="M 495 330 C 530 300, 500 380, 535 350" fill="none" stroke="#E9A13B" stroke-width="3" marker-end="url(#arrRev)"/>
<defs>
<marker id="arrRev" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#E9A13B"/>
</marker>
</defs>
<text x="515" y="270" font-family="DM Sans" font-size="10" font-weight="bold" fill="#B97A1E" text-anchor="middle">splits uit</text>
<text x="515" y="284" font-family="DM Sans" font-size="10" font-weight="bold" fill="#B97A1E" text-anchor="middle">naar grootte</text>

<!-- RIGHT PANEL: uitgesplitst -->
<rect x="560" y="100" width="780" height="470" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="2"/>
<text x="950" y="130" font-family="DM Sans" font-size="14" font-weight="bold" fill="#14213D" text-anchor="middle">Uitgesplitst naar bedrijfsgrootte</text>
<text x="950" y="148" font-family="DM Sans" font-size="10.5" fill="#2563A8" text-anchor="middle">binnen élke groep scoort digitaal beter</text>

<line x1="620" y1="500" x2="1290" y2="500" stroke="#14213D" stroke-width="1.5"/>
<line x1="620" y1="200" x2="620" y2="500" stroke="#DFDCD3" stroke-width="1"/>
<text x="608" y="204" font-family="DM Sans" font-size="9" fill="#55606F" text-anchor="end">100%</text>
<text x="608" y="354" font-family="DM Sans" font-size="9" fill="#55606F" text-anchor="end">50%</text>
<line x1="620" y1="350" x2="1290" y2="350" stroke="#EFEBE0" stroke-width="1" stroke-dasharray="3 3"/>

<!-- Klein group: Papier 65%, Digitaal 72% -->
<rect x="670" y="305" width="60" height="195" fill="#55606F"/>
<text x="700" y="296" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D" text-anchor="middle">65%</text>
<rect x="740" y="284" width="60" height="216" fill="#2563A8"/>
<text x="770" y="275" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D" text-anchor="middle">72%</text>
<text x="735" y="518" font-family="DM Sans" font-size="11" font-weight="bold" fill="#14213D" text-anchor="middle">Klein</text>
<text x="700" y="533" font-family="DM Sans" font-size="8.5" fill="#55606F" text-anchor="middle">n=1000</text>
<text x="770" y="533" font-family="DM Sans" font-size="8.5" fill="#55606F" text-anchor="middle">n=100</text>

<!-- Middel group: Papier 55%, Digitaal 62% -->
<rect x="920" y="335" width="60" height="165" fill="#55606F"/>
<text x="950" y="326" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D" text-anchor="middle">55%</text>
<rect x="990" y="314" width="60" height="186" fill="#2563A8"/>
<text x="1020" y="305" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D" text-anchor="middle">62%</text>
<text x="985" y="518" font-family="DM Sans" font-size="11" font-weight="bold" fill="#14213D" text-anchor="middle">Middel</text>
<text x="950" y="533" font-family="DM Sans" font-size="8.5" fill="#55606F" text-anchor="middle">n=500</text>
<text x="1020" y="533" font-family="DM Sans" font-size="8.5" fill="#55606F" text-anchor="middle">n=400</text>

<!-- Groot group: Papier 40%, Digitaal 48% -->
<rect x="1170" y="380" width="60" height="120" fill="#55606F"/>
<text x="1200" y="371" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D" text-anchor="middle">40%</text>
<rect x="1240" y="356" width="60" height="144" fill="#2563A8"/>
<text x="1270" y="347" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D" text-anchor="middle">48%</text>
<text x="1235" y="518" font-family="DM Sans" font-size="11" font-weight="bold" fill="#14213D" text-anchor="middle">Groot</text>
<text x="1200" y="533" font-family="DM Sans" font-size="8.5" fill="#B97A1E" font-weight="bold" text-anchor="middle">n=100</text>
<text x="1270" y="533" font-family="DM Sans" font-size="8.5" fill="#B97A1E" font-weight="bold" text-anchor="middle">n=1500</text>

<rect x="640" y="546" width="670" height="18" fill="#EAF1FA"/>
<text x="975" y="560" font-family="DM Sans" font-size="10.5" fill="#2563A8" font-weight="bold" text-anchor="middle">Digitaal wint in elke groottecategorie</text>

<!-- explanation -->
<rect x="60" y="590" width="1280" height="130" rx="8" fill="#F4F6F9" stroke="#DFDCD3" stroke-width="1"/>
<text x="80" y="616" font-family="DM Sans" font-size="12.5" font-weight="bold" fill="#14213D">De verklaring is de samenstelling, niet de methode</text>
<text x="80" y="638" font-family="DM Sans" font-size="11" fill="#55606F">De digitale variant is vooral ingezet bij grote werkgevers (n=1500), en grote werkgevers hebben structureel een lagere</text>
<text x="80" y="656" font-family="DM Sans" font-size="11" fill="#55606F">respons — ongeacht het kanaal. Omdat digitaal zwaar leunt op die groep en papier zwaar leunt op kleine werkgevers</text>
<text x="80" y="674" font-family="DM Sans" font-size="11" fill="#55606F">(n=1000), trekt de samenstelling het digitale totaal omlaag — ook al wint digitaal in elke afzonderlijke groep.</text>
<text x="80" y="698" font-family="DM Sans" font-size="11" fill="#E9A13B" font-weight="bold">Grootteklasse is hier de confounder: haar verdeling verschilt sterk tussen de kanalen én ze beïnvloedt de respons.</text>
</svg>
