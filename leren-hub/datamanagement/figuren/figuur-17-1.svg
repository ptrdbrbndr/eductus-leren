<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700">
<defs>
<marker id="arrowS" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#14213D"/>
</marker>
<marker id="arrowRed2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#B03A2E"/>
</marker>
</defs>
<rect width="1400" height="700" fill="#FBFAF7"/>
<text x="700" y="42" font-family="Cormorant Garamond" font-size="25" font-weight="bold" fill="#14213D" text-anchor="middle">Het DPIA-proces</text>
<text x="700" y="65" font-family="DM Sans" font-size="12.5" fill="#55606F" text-anchor="middle">Van triage via beschrijving, noodzaak en risico's voor de betrokkene, naar advies van de FG en besluit van de verwerkingsverantwoordelijke</text>

<!-- Gateway: DPIA nodig? -->
<polygon points="170,120 228,178 170,236 112,178" fill="#F4F6F9" stroke="#2563A8" stroke-width="2"/>
<text x="170" y="172" font-family="DM Sans" font-size="10" font-weight="bold" fill="#14213D" text-anchor="middle">DPIA</text>
<text x="170" y="186" font-family="DM Sans" font-size="10" font-weight="bold" fill="#14213D" text-anchor="middle">nodig?</text>

<!-- Nee branch -->
<line x1="170" y1="236" x2="170" y2="300" stroke="#B03A2E" stroke-width="2" marker-end="url(#arrowRed2)"/>
<text x="184" y="270" font-family="DM Sans" font-size="10" font-weight="bold" fill="#B03A2E">nee</text>
<rect x="60" y="300" width="220" height="72" rx="8" fill="#FDF0EE" stroke="#B03A2E" stroke-width="1.5"/>
<text x="170" y="326" font-family="DM Sans" font-size="11" font-weight="bold" fill="#14213D" text-anchor="middle">Geen DPIA</text>
<text x="170" y="344" font-family="DM Sans" font-size="9.5" fill="#55606F" text-anchor="middle">Afweging om hem niet te doen</text>
<text x="170" y="358" font-family="DM Sans" font-size="9.5" fill="#55606F" text-anchor="middle">wordt zelf vastgelegd</text>

<!-- ja arrow -->
<line x1="228" y1="178" x2="266" y2="178" stroke="#14213D" stroke-width="2" marker-end="url(#arrowS)"/>
<text x="247" y="166" font-family="DM Sans" font-size="10" font-weight="bold" fill="#14213D" text-anchor="middle">ja</text>

<!-- Task 1: Beschrijving -->
<rect x="270" y="128" width="150" height="100" rx="9" fill="#FFFFFF" stroke="#14213D" stroke-width="1.5"/>
<circle cx="285" cy="143" r="11" fill="#14213D"/>
<text x="285" y="147" font-family="DM Sans" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="345" y="163" font-family="DM Sans" font-size="10.5" font-weight="bold" fill="#14213D" text-anchor="middle">Beschrijving</text>
<text x="345" y="177" font-family="DM Sans" font-size="10.5" font-weight="bold" fill="#14213D" text-anchor="middle">van de verwerking</text>
<text x="345" y="197" font-family="DM Sans" font-size="8.5" fill="#55606F" text-anchor="middle">doel, grondslag,</text>
<text x="345" y="210" font-family="DM Sans" font-size="8.5" fill="#55606F" text-anchor="middle">gegevensstroom</text>

<line x1="420" y1="178" x2="446" y2="178" stroke="#14213D" stroke-width="2" marker-end="url(#arrowS)"/>

<!-- Task 2: Noodzaak & evenredigheid -->
<rect x="450" y="128" width="150" height="100" rx="9" fill="#FFFFFF" stroke="#14213D" stroke-width="1.5"/>
<circle cx="465" cy="143" r="11" fill="#14213D"/>
<text x="465" y="147" font-family="DM Sans" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="525" y="163" font-family="DM Sans" font-size="10.5" font-weight="bold" fill="#14213D" text-anchor="middle">Noodzaak &amp;</text>
<text x="525" y="177" font-family="DM Sans" font-size="10.5" font-weight="bold" fill="#14213D" text-anchor="middle">evenredigheid</text>
<text x="525" y="197" font-family="DM Sans" font-size="8.5" fill="#55606F" text-anchor="middle">kan het met minder</text>
<text x="525" y="210" font-family="DM Sans" font-size="8.5" fill="#55606F" text-anchor="middle">gegevens of ingrijp?</text>

<line x1="600" y1="178" x2="626" y2="178" stroke="#14213D" stroke-width="2" marker-end="url(#arrowS)"/>

<!-- Task 3: Risico's voor de betrokkene (highlighted) -->
<rect x="630" y="122" width="160" height="112" rx="9" fill="#FBF4E6" stroke="#E9A13B" stroke-width="2.5"/>
<circle cx="646" cy="139" r="11" fill="#E9A13B"/>
<text x="646" y="143" font-family="DM Sans" font-size="10" font-weight="bold" fill="#14213D" text-anchor="middle">3</text>
<text x="712" y="160" font-family="DM Sans" font-size="10.5" font-weight="bold" fill="#14213D" text-anchor="middle">Risico's voor</text>
<text x="712" y="174" font-family="DM Sans" font-size="10.5" font-weight="bold" fill="#14213D" text-anchor="middle">de betrokkene</text>
<text x="712" y="194" font-family="DM Sans" font-size="8.5" fill="#B97A1E" font-weight="bold" text-anchor="middle">niet voor de</text>
<text x="712" y="207" font-family="DM Sans" font-size="8.5" fill="#B97A1E" font-weight="bold" text-anchor="middle">organisatie</text>
<text x="712" y="222" font-family="DM Sans" font-size="7.5" fill="#55606F" text-anchor="middle">+ maatregelen &amp; restrisico</text>

<line x1="790" y1="178" x2="816" y2="178" stroke="#14213D" stroke-width="2" marker-end="url(#arrowS)"/>

<!-- Task 4: Maatregelen -->
<rect x="820" y="128" width="150" height="100" rx="9" fill="#FFFFFF" stroke="#14213D" stroke-width="1.5"/>
<circle cx="835" cy="143" r="11" fill="#14213D"/>
<text x="835" y="147" font-family="DM Sans" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="895" y="163" font-family="DM Sans" font-size="10.5" font-weight="bold" fill="#14213D" text-anchor="middle">Maatregelen</text>
<text x="895" y="183" font-family="DM Sans" font-size="8.5" fill="#55606F" text-anchor="middle">die de risico's</text>
<text x="895" y="196" font-family="DM Sans" font-size="8.5" fill="#55606F" text-anchor="middle">beperken en het</text>
<text x="895" y="209" font-family="DM Sans" font-size="8.5" fill="#55606F" text-anchor="middle">restrisico</text>

<line x1="970" y1="178" x2="996" y2="178" stroke="#14213D" stroke-width="2" marker-end="url(#arrowS)"/>

<!-- Task 5: Advies FG -->
<rect x="1000" y="128" width="150" height="100" rx="9" fill="#FFFFFF" stroke="#14213D" stroke-width="1.5"/>
<circle cx="1015" cy="143" r="11" fill="#14213D"/>
<text x="1015" y="147" font-family="DM Sans" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle">5</text>
<text x="1075" y="163" font-family="DM Sans" font-size="10.5" font-weight="bold" fill="#14213D" text-anchor="middle">Advies FG</text>
<text x="1075" y="183" font-family="DM Sans" font-size="8.5" fill="#55606F" text-anchor="middle">functionaris</text>
<text x="1075" y="196" font-family="DM Sans" font-size="8.5" fill="#55606F" text-anchor="middle">gegevensbescherming</text>
<text x="1075" y="209" font-family="DM Sans" font-size="8.5" fill="#55606F" text-anchor="middle">— geen mede-auteur</text>

<line x1="1150" y1="178" x2="1176" y2="178" stroke="#14213D" stroke-width="2" marker-end="url(#arrowS)"/>

<!-- Task 6: Besluit verwerkingsverantwoordelijke (end) -->
<rect x="1180" y="122" width="165" height="112" rx="9" fill="#FBF4E6" stroke="#E9A13B" stroke-width="2.5"/>
<circle cx="1197" cy="139" r="11" fill="#E9A13B"/>
<text x="1197" y="143" font-family="DM Sans" font-size="10" font-weight="bold" fill="#14213D" text-anchor="middle">6</text>
<text x="1262" y="158" font-family="DM Sans" font-size="10" font-weight="bold" fill="#14213D" text-anchor="middle">Besluit verwerkings-</text>
<text x="1262" y="172" font-family="DM Sans" font-size="10" font-weight="bold" fill="#14213D" text-anchor="middle">verantwoordelijke</text>
<text x="1262" y="192" font-family="DM Sans" font-size="8.5" fill="#55606F" text-anchor="middle">met datum</text>
<text x="1262" y="210" font-family="DM Sans" font-size="8.5" fill="#55606F" text-anchor="middle">vastgelegd</text>

<!-- wie je erbij haalt -->
<rect x="70" y="410" width="1275" height="110" rx="8" fill="#F4F6F9" stroke="#DFDCD3" stroke-width="1"/>
<text x="90" y="436" font-family="DM Sans" font-size="12.5" font-weight="bold" fill="#14213D">Wie je erbij haalt</text>
<text x="90" y="462" font-family="DM Sans" font-size="10.5" fill="#55606F">Proceseigenaar — kent het doel, beslist over noodzaak</text>
<text x="90" y="480" font-family="DM Sans" font-size="10.5" fill="#55606F">Data owner — betekenis en bewaartermijn</text>
<text x="90" y="498" font-family="DM Sans" font-size="10.5" fill="#55606F">Security — de maatregelen</text>
<text x="720" y="462" font-family="DM Sans" font-size="10.5" fill="#55606F">Functionaris gegevensbescherming — het advies, onafhankelijk</text>
<text x="720" y="480" font-family="DM Sans" font-size="10.5" fill="#55606F">Vertegenwoordiging van de betrokkenen, waar mogelijk —</text>
<text x="720" y="498" font-family="DM Sans" font-size="10.5" fill="#55606F">gebeurt zelden en levert opvallend veel op</text>

<!-- callout -->
<rect x="70" y="536" width="1275" height="68" rx="8" fill="#FBF4E6" stroke="#E9A13B" stroke-width="1.5"/>
<text x="90" y="562" font-family="DM Sans" font-size="11.5" fill="#14213D" font-weight="bold">Stap 3 is waar de meeste DPIA's misgaan</text>
<text x="90" y="582" font-family="DM Sans" font-size="11" fill="#55606F">Een risicoparagraaf over boetes en reputatieschade beschrijft de risico's van de organisatie. De DPIA vraagt naar de</text>
<text x="90" y="597" font-family="DM Sans" font-size="11" fill="#55606F">risico's van de deelnemer: onterechte uitsluiting, ongewenste bekendheid, verlies van controle over eigen gegevens.</text>
</svg>
