<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
<defs>
<marker id="arrowN" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#14213D"/>
</marker>
<marker id="arrowA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#E9A13B"/>
</marker>
</defs>
<rect width="1400" height="720" fill="#FBFAF7"/>
<text x="700" y="48" font-family="Cormorant Garamond" font-size="26" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">De keten van bron tot rapportage bij Meridiaan</tspan></text>
<text x="700" y="76" font-family="DM Sans" font-size="13" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">Vier lagen — de drie afwijkende deelnemersaantallen ontstaan in laag 4, met een oorzaak in laag 2</tspan></text>

<!-- four layer boxes -->
<!-- 1 Bronsystemen -->
<rect x="60" y="140" width="290" height="200" rx="6" fill="#F4F6F9" stroke="#14213D" stroke-width="1.5"/>
<rect x="60" y="140" width="290" height="40" rx="6" fill="#14213D"/>
<rect x="60" y="162" width="290" height="18" fill="#14213D"/>
<text x="205" y="166" font-family="DM Sans" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="205" dy="0">1. Bronsystemen</tspan></text>
<text x="80" y="205" font-family="DM Sans" font-size="11.5" fill="#55606F"><tspan x="80" dy="0">Data ontstaat en wordt</tspan></text>
<text x="80" y="222" font-family="DM Sans" font-size="11.5" fill="#55606F"><tspan x="80" dy="0">operationeel beheerd</tspan></text>
<text x="80" y="255" font-family="DM Sans" font-size="11" font-weight="bold" fill="#14213D"><tspan x="80" dy="0">Risico</tspan></text>
<text x="80" y="275" font-family="DM Sans" font-size="11" fill="#55606F"><tspan x="80" dy="0">Invoerfouten; wijzigingen</tspan></text>
<text x="80" y="291" font-family="DM Sans" font-size="11" fill="#55606F"><tspan x="80" dy="0">stroomafwaarts onbekend</tspan></text>
<text x="80" y="320" font-family="DM Sans" font-size="10.5" fill="#2563A8"><tspan x="80" dy="0">Polisadministratie</tspan></text>

<!-- 2 Integratielaag (marked as cause) -->
<rect x="410" y="140" width="290" height="200" rx="6" fill="#FBF4E6" stroke="#E9A13B" stroke-width="2.5"/>
<rect x="410" y="140" width="290" height="40" rx="6" fill="#E9A13B"/>
<rect x="410" y="162" width="290" height="18" fill="#E9A13B"/>
<text x="555" y="166" font-family="DM Sans" font-size="14" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="555" dy="0">2. Integratielaag</tspan></text>
<text x="430" y="205" font-family="DM Sans" font-size="11.5" fill="#55606F"><tspan x="430" dy="0">Data wordt opgehaald,</tspan></text>
<text x="430" y="222" font-family="DM Sans" font-size="11.5" fill="#55606F"><tspan x="430" dy="0">gecombineerd, omgezet</tspan></text>
<text x="430" y="255" font-family="DM Sans" font-size="11" font-weight="bold" fill="#14213D"><tspan x="430" dy="0">Risico</tspan></text>
<text x="430" y="275" font-family="DM Sans" font-size="11" fill="#55606F"><tspan x="430" dy="0">Transformaties die betekenis</tspan></text>
<text x="430" y="291" font-family="DM Sans" font-size="11" fill="#55606F"><tspan x="430" dy="0">veranderen, ongemerkt</tspan></text>
<text x="430" y="320" font-family="DM Sans" font-size="10.5" font-weight="bold" fill="#14213D"><tspan x="430" dy="0">⚠ vermoedelijke oorzaak</tspan></text>

<!-- 3 Opslag voor analyse -->
<rect x="760" y="140" width="290" height="200" rx="6" fill="#F4F6F9" stroke="#14213D" stroke-width="1.5"/>
<rect x="760" y="140" width="290" height="40" rx="6" fill="#14213D"/>
<rect x="760" y="162" width="290" height="18" fill="#14213D"/>
<text x="905" y="166" font-family="DM Sans" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="905" dy="0">3. Opslag voor analyse</tspan></text>
<text x="780" y="205" font-family="DM Sans" font-size="11.5" fill="#55606F"><tspan x="780" dy="0">Bewaard in een vorm</tspan></text>
<text x="780" y="222" font-family="DM Sans" font-size="11.5" fill="#55606F"><tspan x="780" dy="0">geschikt om te bevragen</tspan></text>
<text x="780" y="255" font-family="DM Sans" font-size="11" font-weight="bold" fill="#14213D"><tspan x="780" dy="0">Risico</tspan></text>
<text x="780" y="275" font-family="DM Sans" font-size="11" fill="#55606F"><tspan x="780" dy="0">Meerdere versies van</tspan></text>
<text x="780" y="291" font-family="DM Sans" font-size="11" fill="#55606F"><tspan x="780" dy="0">dezelfde waarheid naast elkaar</tspan></text>
<text x="780" y="320" font-family="DM Sans" font-size="10.5" fill="#2563A8"><tspan x="780" dy="0">Cloud-dataplatform</tspan></text>

<!-- 4 Consumptie (marked where numbers arise) -->
<rect x="1110" y="140" width="230" height="200" rx="6" fill="#FBF4E6" stroke="#E9A13B" stroke-width="2.5"/>
<rect x="1110" y="140" width="230" height="40" rx="6" fill="#E9A13B"/>
<rect x="1110" y="162" width="230" height="18" fill="#E9A13B"/>
<text x="1225" y="166" font-family="DM Sans" font-size="14" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="1225" dy="0">4. Consumptie</tspan></text>
<text x="1130" y="205" font-family="DM Sans" font-size="11.5" fill="#55606F"><tspan x="1130" dy="0">Rapportages, dashboards,</tspan></text>
<text x="1130" y="222" font-family="DM Sans" font-size="11.5" fill="#55606F"><tspan x="1130" dy="0">uitlevering aan derden</tspan></text>
<text x="1130" y="255" font-family="DM Sans" font-size="11" font-weight="bold" fill="#14213D"><tspan x="1130" dy="0">Risico</tspan></text>
<text x="1130" y="275" font-family="DM Sans" font-size="11" fill="#55606F"><tspan x="1130" dy="0">Ieder bouwt zijn eigen</tspan></text>
<text x="1130" y="291" font-family="DM Sans" font-size="11" fill="#55606F"><tspan x="1130" dy="0">berekening, eigen aannames</tspan></text>
<text x="1130" y="320" font-family="DM Sans" font-size="10.5" font-weight="bold" fill="#14213D"><tspan x="1130" dy="0">⚠ hier ontstaan de 3 aantallen</tspan></text>

<!-- arrows -->
<line x1="350" y1="240" x2="410" y2="240" stroke="#14213D" stroke-width="2" marker-end="url(#arrowN)"/>
<line x1="700" y1="240" x2="760" y2="240" stroke="#14213D" stroke-width="2" marker-end="url(#arrowN)"/>
<line x1="1050" y1="240" x2="1110" y2="240" stroke="#14213D" stroke-width="2" marker-end="url(#arrowN)"/>

<!-- causal arc from layer 2 (cause) to layer 4 (symptom) -->
<path d="M 555 340 C 555 460, 1225 460, 1225 340" fill="none" stroke="#E9A13B" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrowA)"/>
<rect x="740" y="440" width="430" height="46" rx="20" fill="#FFFFFF" stroke="#E9A13B" stroke-width="1.5"/>
<text x="955" y="468" font-family="DM Sans" font-size="12.5" fill="#14213D" text-anchor="middle"><tspan x="955" dy="0">Oorzaak in de transformatie, zichtbaar bij de rapportage</tspan></text>

<!-- the three numbers -->
<rect x="1000" y="520" width="340" height="150" rx="6" fill="#F4F6F9" stroke="#DFDCD3" stroke-width="1"/>
<text x="1020" y="546" font-family="DM Sans" font-size="12.5" font-weight="bold" fill="#14213D"><tspan x="1020" dy="0">Drie afdelingen, drie aantallen</tspan></text>
<text x="1020" y="572" font-family="DM Sans" font-size="12" fill="#55606F"><tspan x="1020" dy="0">Afdeling A</tspan></text>
<text x="1300" y="572" font-family="DM Sans" font-size="12" font-weight="bold" fill="#E9A13B" text-anchor="end"><tspan x="1300" dy="0">341.200</tspan></text>
<text x="1020" y="596" font-family="DM Sans" font-size="12" fill="#55606F"><tspan x="1020" dy="0">Afdeling B</tspan></text>
<text x="1300" y="596" font-family="DM Sans" font-size="12" font-weight="bold" fill="#E9A13B" text-anchor="end"><tspan x="1300" dy="0">338.905</tspan></text>
<text x="1020" y="620" font-family="DM Sans" font-size="12" fill="#55606F"><tspan x="1020" dy="0">Afdeling C</tspan></text>
<text x="1300" y="620" font-family="DM Sans" font-size="12" font-weight="bold" fill="#E9A13B" text-anchor="end"><tspan x="1300" dy="0">352.480</tspan></text>
<text x="1020" y="650" font-family="DM Sans" font-size="10.5" fill="#55606F"><tspan x="1020" dy="0">Elk een eigen filter op "actief" — niemand telt verkeerd.</tspan></text>

<!-- bottom explanatory note -->
<rect x="60" y="520" width="900" height="150" rx="6" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/>
<text x="85" y="550" font-family="DM Sans" font-size="13" font-weight="bold" fill="#14213D"><tspan x="85" dy="0">Keten- en definitieprobleem, geen rekenfout</tspan></text>
<text x="85" y="575" font-family="DM Sans" font-size="12.5" fill="#55606F"><tspan x="85" dy="0">De drie afwijkende deelnemersaantallen bij Meridiaan zijn vrijwel zeker in de vierde laag ontstaan,</tspan></text>
<text x="85" y="597" font-family="DM Sans" font-size="12.5" fill="#55606F"><tspan x="85" dy="0">met een oorzaak in de tweede. Drie rapportagebouwers hebben elk hun eigen filter toegepast op</tspan></text>
<text x="85" y="619" font-family="DM Sans" font-size="12.5" fill="#55606F"><tspan x="85" dy="0">wat "actief" betekent, en niemand heeft die filters ooit naast elkaar gelegd. Een nieuwe query lost</tspan></text>
<text x="85" y="641" font-family="DM Sans" font-size="12.5" fill="#55606F"><tspan x="85" dy="0">dit niet op zolang de definitie zelf niet is vastgesteld.</tspan></text>
</svg>
