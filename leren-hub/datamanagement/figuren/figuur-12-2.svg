<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
<defs>
<marker id="arrowC" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#14213D"/>
</marker>
</defs>
<rect width="1400" height="800" fill="#FBFAF7"/>
<text x="700" y="48" font-family="Cormorant Garamond" font-size="26" font-weight="bold" fill="#14213D" text-anchor="middle">Data Vault 2.0 bij Meridiaan</text>
<text x="700" y="74" font-family="DM Sans" font-size="13" fill="#55606F" text-anchor="middle">Drie hubs, één link, en een satellite met de adresgegevens en hun geldigheidsperiode</text>

<!-- Hub Deelnemer -->
<rect x="80" y="150" width="280" height="100" rx="6" fill="#14213D"/>
<text x="220" y="180" font-family="DM Sans" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">HUB Deelnemer</text>
<text x="220" y="200" font-family="DM Sans" font-size="10" fill="#DFDCD3" text-anchor="middle">Bedrijfssleutel: deelnemernummer</text>
<text x="220" y="216" font-family="DM Sans" font-size="10" fill="#DFDCD3" text-anchor="middle">Hub_Deelnemer_Key (PK)</text>
<text x="220" y="232" font-family="DM Sans" font-size="10" fill="#DFDCD3" text-anchor="middle">Laaddatum · Recordbron</text>

<!-- Hub Regeling -->
<rect x="1040" y="150" width="280" height="100" rx="6" fill="#14213D"/>
<text x="1180" y="180" font-family="DM Sans" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">HUB Regeling</text>
<text x="1180" y="200" font-family="DM Sans" font-size="10" fill="#DFDCD3" text-anchor="middle">Bedrijfssleutel: regelingcode</text>
<text x="1180" y="216" font-family="DM Sans" font-size="10" fill="#DFDCD3" text-anchor="middle">Hub_Regeling_Key (PK)</text>
<text x="1180" y="232" font-family="DM Sans" font-size="10" fill="#DFDCD3" text-anchor="middle">Laaddatum · Recordbron</text>

<!-- Hub Werkgever -->
<rect x="560" y="580" width="280" height="100" rx="6" fill="#14213D"/>
<text x="700" y="610" font-family="DM Sans" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">HUB Werkgever</text>
<text x="700" y="630" font-family="DM Sans" font-size="10" fill="#DFDCD3" text-anchor="middle">Bedrijfssleutel: werkgevernummer</text>
<text x="700" y="646" font-family="DM Sans" font-size="10" fill="#DFDCD3" text-anchor="middle">Hub_Werkgever_Key (PK)</text>
<text x="700" y="662" font-family="DM Sans" font-size="10" fill="#DFDCD3" text-anchor="middle">Laaddatum · Recordbron</text>

<!-- Link Deelname (central) -->
<rect x="560" y="340" width="280" height="120" rx="6" fill="#2563A8"/>
<text x="700" y="368" font-family="DM Sans" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">LINK Deelname</text>
<text x="700" y="388" font-family="DM Sans" font-size="10" fill="#EAF1FA" text-anchor="middle">Verbindt Deelnemer, Regeling</text>
<text x="700" y="402" font-family="DM Sans" font-size="10" fill="#EAF1FA" text-anchor="middle">en Werkgever</text>
<text x="700" y="422" font-family="DM Sans" font-size="10" fill="#EAF1FA" text-anchor="middle">Link_Deelname_Key (PK)</text>
<text x="700" y="440" font-family="DM Sans" font-size="10" fill="#EAF1FA" text-anchor="middle">Laaddatum · Recordbron</text>

<!-- connecting lines: hubs -> link -->
<line x1="300" y1="250" x2="590" y2="380" stroke="#14213D" stroke-width="2"/>
<line x1="1100" y1="250" x2="810" y2="380" stroke="#14213D" stroke-width="2"/>
<line x1="700" y1="580" x2="700" y2="460" stroke="#14213D" stroke-width="2"/>

<!-- Satellite attached to Hub Deelnemer -->
<line x1="150" y1="250" x2="150" y2="430" stroke="#E9A13B" stroke-width="2"/>
<rect x="20" y="430" width="320" height="270" rx="6" fill="#FBF4E6" stroke="#E9A13B" stroke-width="2"/>
<text x="180" y="458" font-family="DM Sans" font-size="14" font-weight="bold" fill="#14213D" text-anchor="middle">SATELLITE Adres</text>
<text x="180" y="476" font-family="DM Sans" font-size="10" fill="#55606F" text-anchor="middle">bij HUB Deelnemer</text>
<line x1="40" y1="488" x2="320" y2="488" stroke="#DFDCD3" stroke-width="1"/>
<text x="40" y="510" font-family="DM Sans" font-size="10.5" fill="#14213D">Hub_Deelnemer_Key</text>
<text x="270" y="510" font-family="DM Sans" font-size="9" fill="#55606F">FK</text>
<text x="40" y="530" font-family="DM Sans" font-size="10.5" fill="#14213D">Straat, huisnummer</text>
<text x="40" y="550" font-family="DM Sans" font-size="10.5" fill="#14213D">Postcode, plaats</text>
<rect x="40" y="562" width="280" height="46" rx="4" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/>
<text x="50" y="580" font-family="DM Sans" font-size="10" font-weight="bold" fill="#14213D">Geldig_vanaf · Geldig_tot</text>
<text x="50" y="597" font-family="DM Sans" font-size="9.5" fill="#55606F">geldigheidsperiode van dit adres</text>
<text x="40" y="628" font-family="DM Sans" font-size="10.5" fill="#14213D">Bron</text>
<text x="270" y="628" font-family="DM Sans" font-size="9" fill="#55606F">polisadmin.</text>
<text x="40" y="648" font-family="DM Sans" font-size="10.5" fill="#14213D">Laaddatum</text>
<text x="40" y="672" font-family="DM Sans" font-size="9.5" fill="#55606F">Hashdiff (wijzigingsdetectie)</text>

<!-- legend -->
<rect x="920" y="500" width="410" height="230" rx="6" fill="#F4F6F9" stroke="#DFDCD3" stroke-width="1"/>
<text x="940" y="526" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D">Onderdelen</text>
<rect x="940" y="540" width="18" height="18" fill="#14213D"/>
<text x="966" y="554" font-family="DM Sans" font-size="11" fill="#55606F">Hub — de bedrijfssleutel van een kernobject, meer niet</text>
<rect x="940" y="566" width="18" height="18" fill="#2563A8"/>
<text x="966" y="580" font-family="DM Sans" font-size="11" fill="#55606F">Link — de relatie tussen hubs</text>
<rect x="940" y="592" width="18" height="18" fill="#FBF4E6" stroke="#E9A13B" stroke-width="1.5"/>
<text x="966" y="606" font-family="DM Sans" font-size="11" fill="#55606F">Satellite — beschrijvende attributen, geldigheidsperiode en bron</text>
<line x1="940" y1="626" x2="1310" y2="626" stroke="#DFDCD3" stroke-width="1"/>
<text x="940" y="648" font-family="DM Sans" font-size="10.5" fill="#55606F">Loont bij veel wisselende bronnen en een harde eis om</text>
<text x="940" y="665" font-family="DM Sans" font-size="10.5" fill="#55606F">herkomst en laadmoment per gegeven aan te tonen —</text>
<text x="940" y="682" font-family="DM Sans" font-size="10.5" fill="#55606F">bij Meridiaan relevant vanwege de DNB-bevinding over</text>
<text x="940" y="699" font-family="DM Sans" font-size="10.5" fill="#55606F">aantoonbaarheid naast de 35 jaar oude polisadministratie.</text>
<text x="940" y="719" font-family="DM Sans" font-size="10.5" fill="#E9A13B" font-weight="bold">Data Vault is een opslagpatroon — geen presentatielaag.</text>
</svg>
