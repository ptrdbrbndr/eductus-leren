<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
<rect width="1400" height="820" fill="#FBFAF7"/>
<text x="700" y="48" font-family="Cormorant Garamond" font-size="26" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">De zes dimensies van datakwaliteit</tspan></text>
<text x="700" y="76" font-family="DM Sans" font-size="13" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">Zes vragen rond het gedeelde begrip: geschiktheid voor gebruik</tspan></text>

<!-- connecting lines to hub -->
<line x1="700" y1="220" x2="700" y2="335" stroke="#2563A8" stroke-width="2"/>
<line x1="895" y1="325" x2="640" y2="390" stroke="#2563A8" stroke-width="2"/>
<line x1="895" y1="555" x2="640" y2="450" stroke="#2563A8" stroke-width="2"/>
<line x1="700" y1="650" x2="700" y2="500" stroke="#2563A8" stroke-width="2"/>
<line x1="505" y1="555" x2="760" y2="450" stroke="#2563A8" stroke-width="2"/>
<line x1="505" y1="325" x2="760" y2="390" stroke="#2563A8" stroke-width="2"/>

<!-- hub -->
<circle cx="700" cy="420" r="105" fill="#14213D"/>
<text x="700" y="410" font-family="DM Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="700" dy="0">Geschiktheid</tspan></text>
<text x="700" y="432" font-family="DM Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="700" dy="0">voor gebruik</tspan></text>
<text x="700" y="453" font-family="DM Sans" font-size="10.5" fill="#DFDCD3" text-anchor="middle"><tspan x="700" dy="0">geen absolute maat</tspan></text>

<!-- 1 Volledigheid - top -->
<rect x="540" y="120" width="320" height="100" rx="8" fill="#FFFFFF" stroke="#14213D" stroke-width="1.5"/>
<text x="700" y="148" font-family="DM Sans" font-size="15" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Volledigheid</tspan></text>
<text x="700" y="168" font-family="DM Sans" font-size="11" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">Is alles ingevuld wat moet?</tspan></text>
<text x="700" y="192" font-family="DM Sans" font-size="11" fill="#2563A8" text-anchor="middle"><tspan x="700" dy="0">4,2% van de deelnemers heeft</tspan></text>
<text x="700" y="208" font-family="DM Sans" font-size="11" fill="#2563A8" text-anchor="middle"><tspan x="700" dy="0">geen e-mailadres</tspan></text>

<!-- 2 Juistheid - upper right -->
<rect x="895" y="255" width="320" height="100" rx="8" fill="#FFFFFF" stroke="#14213D" stroke-width="1.5"/>
<text x="1055" y="283" font-family="DM Sans" font-size="15" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="1055" dy="0">Juistheid</tspan></text>
<text x="1055" y="303" font-family="DM Sans" font-size="11" fill="#55606F" text-anchor="middle"><tspan x="1055" dy="0">Klopt het met de werkelijkheid?</tspan></text>
<text x="1055" y="327" font-family="DM Sans" font-size="11" fill="#2563A8" text-anchor="middle"><tspan x="1055" dy="0">Adres niet bijgewerkt</tspan></text>
<text x="1055" y="343" font-family="DM Sans" font-size="11" fill="#2563A8" text-anchor="middle"><tspan x="1055" dy="0">na verhuizing</tspan></text>

<!-- 3 Consistentie - lower right -->
<rect x="895" y="505" width="320" height="100" rx="8" fill="#FFFFFF" stroke="#14213D" stroke-width="1.5"/>
<text x="1055" y="533" font-family="DM Sans" font-size="15" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="1055" dy="0">Consistentie</tspan></text>
<text x="1055" y="553" font-family="DM Sans" font-size="11" fill="#55606F" text-anchor="middle"><tspan x="1055" dy="0">Komt het overal overeen?</tspan></text>
<text x="1055" y="577" font-family="DM Sans" font-size="11" fill="#2563A8" text-anchor="middle"><tspan x="1055" dy="0">Werkgever met drie</tspan></text>
<text x="1055" y="593" font-family="DM Sans" font-size="11" fill="#2563A8" text-anchor="middle"><tspan x="1055" dy="0">verschillende adressen</tspan></text>

<!-- 4 Tijdigheid - bottom -->
<rect x="540" y="640" width="320" height="100" rx="8" fill="#FFFFFF" stroke="#14213D" stroke-width="1.5"/>
<text x="700" y="668" font-family="DM Sans" font-size="15" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Tijdigheid</tspan></text>
<text x="700" y="688" font-family="DM Sans" font-size="11" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">Is het actueel genoeg?</tspan></text>
<text x="700" y="712" font-family="DM Sans" font-size="11" fill="#2563A8" text-anchor="middle"><tspan x="700" dy="0">Premiegegevens lopen</tspan></text>
<text x="700" y="728" font-family="DM Sans" font-size="11" fill="#2563A8" text-anchor="middle"><tspan x="700" dy="0">drie dagen achter</tspan></text>

<!-- 5 Uniciteit - lower left -->
<rect x="185" y="505" width="320" height="100" rx="8" fill="#FFFFFF" stroke="#14213D" stroke-width="1.5"/>
<text x="345" y="533" font-family="DM Sans" font-size="15" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="345" dy="0">Uniciteit</tspan></text>
<text x="345" y="553" font-family="DM Sans" font-size="11" fill="#55606F" text-anchor="middle"><tspan x="345" dy="0">Komt elk object één keer voor?</tspan></text>
<text x="345" y="577" font-family="DM Sans" font-size="11" fill="#2563A8" text-anchor="middle"><tspan x="345" dy="0">Dezelfde deelnemer</tspan></text>
<text x="345" y="593" font-family="DM Sans" font-size="11" fill="#2563A8" text-anchor="middle"><tspan x="345" dy="0">twee keer in het systeem</tspan></text>

<!-- 6 Validiteit - upper left -->
<rect x="185" y="255" width="320" height="100" rx="8" fill="#FFFFFF" stroke="#14213D" stroke-width="1.5"/>
<text x="345" y="283" font-family="DM Sans" font-size="15" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="345" dy="0">Validiteit</tspan></text>
<text x="345" y="303" font-family="DM Sans" font-size="11" fill="#55606F" text-anchor="middle"><tspan x="345" dy="0">Voldoet het aan de vormregels?</tspan></text>
<text x="345" y="327" font-family="DM Sans" font-size="11" fill="#2563A8" text-anchor="middle"><tspan x="345" dy="0">E-mailadres zonder</tspan></text>
<text x="345" y="343" font-family="DM Sans" font-size="11" fill="#2563A8" text-anchor="middle"><tspan x="345" dy="0">apenstaartje</tspan></text>

<rect x="440" y="775" width="520" height="34" rx="17" fill="#FBF4E6" stroke="#E9A13B" stroke-width="1.5"/>
<text x="700" y="797" font-family="DM Sans" font-size="12" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Validiteit versus juistheid — het paar dat op het examen het vaakst verward wordt</tspan></text>
</svg>
