<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
<defs>
<marker id="arrowA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#14213D"/>
</marker>
</defs>
<rect width="1400" height="760" fill="#FBFAF7"/>
<text x="700" y="48" font-family="Cormorant Garamond" font-size="26" font-weight="bold" fill="#14213D" text-anchor="middle">Van nulmeting naar ambitie</text>
<text x="700" y="74" font-family="DM Sans" font-size="13" fill="#55606F" text-anchor="middle">Vier stappen van het volwassenheidsassessment — van scope tot een gevraagd besluit</text>

<!-- stage boxes -->
<!-- Stage 1 -->
<rect x="70" y="140" width="290" height="120" rx="8" fill="#FFFFFF" stroke="#14213D" stroke-width="1.5"/>
<circle cx="110" cy="170" r="16" fill="#14213D"/>
<text x="110" y="175" font-family="DM Sans" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="136" y="175" font-family="DM Sans" font-size="15" font-weight="bold" fill="#14213D">Scope &amp; interviews</text>
<line x1="90" y1="192" x2="340" y2="192" stroke="#DFDCD3" stroke-width="1"/>
<text x="90" y="212" font-family="DM Sans" font-size="11" fill="#55606F">Gebied en periode afbakenen,</text>
<text x="90" y="230" font-family="DM Sans" font-size="11" fill="#55606F">respondenten selecteren en</text>
<text x="90" y="248" font-family="DM Sans" font-size="11" fill="#55606F">interviews inplannen</text>

<!-- arrow 1->2 -->
<line x1="360" y1="200" x2="418" y2="200" stroke="#14213D" stroke-width="2" marker-end="url(#arrowA)"/>

<!-- Stage 2 -->
<rect x="420" y="140" width="290" height="120" rx="8" fill="#FFFFFF" stroke="#14213D" stroke-width="1.5"/>
<circle cx="460" cy="170" r="16" fill="#14213D"/>
<text x="460" y="175" font-family="DM Sans" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="486" y="175" font-family="DM Sans" font-size="15" font-weight="bold" fill="#14213D">Scoren op bewijs</text>
<line x1="440" y1="192" x2="690" y2="192" stroke="#DFDCD3" stroke-width="1"/>
<text x="440" y="210" font-family="DM Sans" font-size="11" fill="#55606F">Uitspraak — licht</text>
<text x="440" y="227" font-family="DM Sans" font-size="11" fill="#55606F">Document — middel</text>
<text x="440" y="244" font-family="DM Sans" font-size="11" fill="#E9A13B" font-weight="bold">Waarneming — zwaar</text>

<!-- arrow 2->3 -->
<line x1="710" y1="200" x2="768" y2="200" stroke="#14213D" stroke-width="2" marker-end="url(#arrowA)"/>

<!-- Stage 3 -->
<rect x="770" y="140" width="290" height="120" rx="8" fill="#FFFFFF" stroke="#14213D" stroke-width="1.5"/>
<circle cx="810" cy="170" r="16" fill="#14213D"/>
<text x="810" y="175" font-family="DM Sans" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="836" y="175" font-family="DM Sans" font-size="15" font-weight="bold" fill="#14213D">Kalibreren</text>
<line x1="790" y1="192" x2="1040" y2="192" stroke="#DFDCD3" stroke-width="1"/>
<text x="790" y="210" font-family="DM Sans" font-size="11" fill="#55606F">Onafhankelijk scoren,</text>
<text x="790" y="227" font-family="DM Sans" font-size="11" fill="#55606F">dan vergelijken in het team</text>
<text x="790" y="244" font-family="DM Sans" font-size="11" fill="#55606F">Verschil ≥ 2 niveaus bespreken</text>

<!-- arrow 3->4 -->
<line x1="1060" y1="200" x2="1118" y2="200" stroke="#14213D" stroke-width="2" marker-end="url(#arrowA)"/>

<!-- Stage 4 -->
<rect x="1120" y="140" width="210" height="120" rx="8" fill="#FBF4E6" stroke="#E9A13B" stroke-width="2"/>
<circle cx="1160" cy="170" r="16" fill="#E9A13B"/>
<text x="1160" y="175" font-family="DM Sans" font-size="14" font-weight="bold" fill="#14213D" text-anchor="middle">4</text>
<text x="1186" y="175" font-family="DM Sans" font-size="15" font-weight="bold" fill="#14213D">Drie scenario's</text>
<line x1="1140" y1="192" x2="1310" y2="192" stroke="#DFDCD3" stroke-width="1"/>
<text x="1140" y="210" font-family="DM Sans" font-size="11" fill="#55606F">Minimaal</text>
<text x="1140" y="227" font-family="DM Sans" font-size="11" fill="#55606F">Gericht</text>
<text x="1140" y="244" font-family="DM Sans" font-size="11" fill="#55606F">Volledig</text>

<!-- scenario cards under stage 4, extending to opdrachtgever -->
<line x1="1225" y1="260" x2="1225" y2="330" stroke="#14213D" stroke-width="2" marker-end="url(#arrowA)"/>
<rect x="990" y="336" width="470" height="140" rx="8" fill="#F4F6F9" stroke="#DFDCD3" stroke-width="1"/>
<text x="1225" y="362" font-family="DM Sans" font-size="13" font-weight="bold" fill="#14213D" text-anchor="middle">Voorgelegd aan de opdrachtgever</text>

<rect x="1006" y="378" width="138" height="82" rx="6" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/>
<text x="1075" y="398" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D" text-anchor="middle">Minimaal</text>
<text x="1075" y="416" font-family="DM Sans" font-size="10" fill="#55606F" text-anchor="middle">laagste kosten,</text>
<text x="1075" y="431" font-family="DM Sans" font-size="10" fill="#55606F" text-anchor="middle">kortste doorlooptijd</text>
<text x="1075" y="449" font-family="DM Sans" font-size="10" fill="#55606F" text-anchor="middle">alleen kritieke gebieden</text>

<rect x="1156" y="378" width="138" height="82" rx="6" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/>
<text x="1225" y="398" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D" text-anchor="middle">Gericht</text>
<text x="1225" y="416" font-family="DM Sans" font-size="10" fill="#55606F" text-anchor="middle">niveau 3 op kritieke</text>
<text x="1225" y="431" font-family="DM Sans" font-size="10" fill="#55606F" text-anchor="middle">gebieden, niveau 2</text>
<text x="1225" y="449" font-family="DM Sans" font-size="10" fill="#55606F" text-anchor="middle">op de rest</text>

<rect x="1306" y="378" width="138" height="82" rx="6" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/>
<text x="1375" y="398" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D" text-anchor="middle">Volledig</text>
<text x="1375" y="416" font-family="DM Sans" font-size="10" fill="#55606F" text-anchor="middle">hoogste kosten,</text>
<text x="1375" y="431" font-family="DM Sans" font-size="10" fill="#55606F" text-anchor="middle">langste doorlooptijd</text>
<text x="1375" y="449" font-family="DM Sans" font-size="10" fill="#55606F" text-anchor="middle">zelden nodig of gehaald</text>

<!-- footnote -->
<rect x="70" y="540" width="1260" height="140" rx="6" fill="#F4F6F9" stroke="#DFDCD3" stroke-width="1"/>
<text x="90" y="566" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D">"Kunt u me dat laten zien?"</text>
<text x="90" y="588" font-family="DM Sans" font-size="12" fill="#55606F">Die ene vraag verplaatst het gesprek van meningen naar bewijs — verplicht in stap 2, en de reden dat stap 3</text>
<text x="90" y="606" font-family="DM Sans" font-size="12" fill="#55606F">nodig is: twee assessoren scoren zelden gelijk, en het verschil is pas bruikbaar na kalibratie.</text>
<text x="90" y="632" font-family="DM Sans" font-size="12" fill="#55606F">De opdrachtgever kiest het scenario en legt de keuze vast — inclusief wat er bewust niet gebeurt.</text>
<text x="90" y="654" font-family="DM Sans" font-size="12" fill="#E9A13B" font-weight="bold">Valkuil: ambitie op niveau 5 voor alle gebieden — duur, zelden nodig, vrijwel nooit gehaald.</text>
</svg>
