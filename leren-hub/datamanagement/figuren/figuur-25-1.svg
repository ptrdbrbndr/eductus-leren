<text x="770" y="356" font-family="DM Sans" font-size="12.5"><tspan font-weight="bold" fill="#14213D">Norm: </tspan><tspan fill="#55606F">centraal orgaan, met domeinen aan tafel</tspan></text>
<text x="770" y="384" font-family="DM Sans" font-size="12.5"><tspan font-weight="bold" fill="#14213D">Uitvoering: </tspan><tspan fill="#55606F">de domeinen, zelfstandig</tspan></text>
<text x="770" y="412" font-family="DM Sans" font-size="12.5"><tspan font-weight="bold" fill="#14213D">Overtreding gemerkt door: </tspan><tspan fill="#55606F">het systeem, direct — of niemand</tspan></text>
