<text x="110" y="602" font-family="DM Sans" font-size="11.5" fill="#55606F"><tspan x="110" dy="0">Domeinen weten nog niet wat er van hen wordt</tspan><tspan x="110" dy="17">verwacht en hebben de capaciteit niet. Begin</tspan><tspan x="110" dy="17">centraal op de gedeelde normen.</tspan></text>

