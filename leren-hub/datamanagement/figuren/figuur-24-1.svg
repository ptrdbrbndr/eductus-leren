<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560">
<defs>
<marker id="arrow241" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#14213D"/>
</marker>
</defs>
<rect width="1400" height="560" fill="#FBFAF7"/>
<text x="700" y="46" font-family="Cormorant Garamond" font-size="25" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Het assessmenttraject als tijdlijn — zes fasen, tien tot vijftien weken</tspan></text>

<!-- Phase boxes -->
<!-- 1 Scope en opzet -->
<rect x="45" y="120" width="200" height="150" rx="6" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1.5"/>
<rect x="45" y="120" width="200" height="8" fill="#14213D"/>
<text x="65" y="150" font-family="DM Sans" font-size="14.5" font-weight="bold" fill="#14213D"><tspan x="65" dy="0">Scope en</tspan><tspan x="65" dy="18">opzet</tspan></text>
<text x="65" y="196" font-family="DM Sans" font-size="11" fill="#55606F"><tspan x="65" dy="0">Componenten, domeinen,</tspan><tspan x="65" dy="14">diepgang, assessoren</tspan></text>
<rect x="65" y="228" width="160" height="26" rx="13" fill="#FBF4E6" stroke="#E9A13B" stroke-width="1.2"/>
<text x="145" y="245" font-family="DM Sans" font-size="11" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="145" dy="0">1 tot 2 weken</tspan></text>

<line x1="245" y1="195" x2="277" y2="195" stroke="#14213D" stroke-width="2" marker-end="url(#arrow241)"/>

<!-- 2 Voorbereiding -->
<rect x="280" y="120" width="200" height="150" rx="6" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1.5"/>
<rect x="280" y="120" width="200" height="8" fill="#14213D"/>
<text x="300" y="150" font-family="DM Sans" font-size="14.5" font-weight="bold" fill="#14213D"><tspan x="300" dy="0">Voorbereiding</tspan></text>
<text x="300" y="178" font-family="DM Sans" font-size="11" fill="#55606F"><tspan x="300" dy="0">Respondentenplan,</tspan><tspan x="300" dy="14">documentaanvraag,</tspan><tspan x="300" dy="14">planning</tspan></text>
<rect x="300" y="228" width="160" height="26" rx="13" fill="#FBF4E6" stroke="#E9A13B" stroke-width="1.2"/>
<text x="380" y="245" font-family="DM Sans" font-size="11" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="380" dy="0">2 weken</tspan></text>

<line x1="480" y1="195" x2="512" y2="195" stroke="#14213D" stroke-width="2" marker-end="url(#arrow241)"/>

<!-- 3 Dataverzameling -->
<rect x="515" y="120" width="200" height="150" rx="6" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1.5"/>
<rect x="515" y="120" width="200" height="8" fill="#14213D"/>
<text x="535" y="150" font-family="DM Sans" font-size="14.5" font-weight="bold" fill="#14213D"><tspan x="535" dy="0">Data-</tspan><tspan x="535" dy="18">verzameling</tspan></text>
<text x="535" y="196" font-family="DM Sans" font-size="11" fill="#55606F"><tspan x="535" dy="0">Interviews, documenten,</tspan><tspan x="535" dy="14">waarnemingen in systemen</tspan></text>
<rect x="535" y="228" width="160" height="26" rx="13" fill="#FBF4E6" stroke="#E9A13B" stroke-width="1.2"/>
<text x="615" y="245" font-family="DM Sans" font-size="11" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="615" dy="0">3 tot 6 weken</tspan></text>

<line x1="715" y1="195" x2="747" y2="195" stroke="#14213D" stroke-width="2" marker-end="url(#arrow241)"/>

<!-- 4 Scoren -->
<rect x="750" y="120" width="200" height="150" rx="6" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1.5"/>
<rect x="750" y="120" width="200" height="8" fill="#14213D"/>
<text x="770" y="150" font-family="DM Sans" font-size="14.5" font-weight="bold" fill="#14213D"><tspan x="770" dy="0">Scoren</tspan></text>
<text x="770" y="178" font-family="DM Sans" font-size="11" fill="#55606F"><tspan x="770" dy="0">Onafhankelijk, per</tspan><tspan x="770" dy="14">assessor, op sub-</tspan><tspan x="770" dy="14">capabilityniveau</tspan></text>
<rect x="770" y="228" width="160" height="26" rx="13" fill="#FBF4E6" stroke="#E9A13B" stroke-width="1.2"/>
<text x="850" y="245" font-family="DM Sans" font-size="11" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="850" dy="0">1 tot 2 weken</tspan></text>

<line x1="950" y1="195" x2="982" y2="195" stroke="#14213D" stroke-width="2" marker-end="url(#arrow241)"/>

<!-- 5 Kalibratie -->
<rect x="985" y="120" width="200" height="150" rx="6" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1.5"/>
<rect x="985" y="120" width="200" height="8" fill="#14213D"/>
<text x="1005" y="150" font-family="DM Sans" font-size="14.5" font-weight="bold" fill="#14213D"><tspan x="1005" dy="0">Kalibratie</tspan></text>
<text x="1005" y="178" font-family="DM Sans" font-size="11" fill="#55606F"><tspan x="1005" dy="0">Verschillen herleiden,</tspan><tspan x="1005" dy="14">gezamenlijke score</tspan><tspan x="1005" dy="14">vaststellen</tspan></text>
<rect x="1005" y="228" width="160" height="26" rx="13" fill="#FBF4E6" stroke="#E9A13B" stroke-width="1.2"/>
<text x="1085" y="245" font-family="DM Sans" font-size="11" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="1085" dy="0">3 tot 5 dagen</tspan></text>

<line x1="1185" y1="195" x2="1217" y2="195" stroke="#14213D" stroke-width="2" marker-end="url(#arrow241)"/>

<!-- 6 Rapportage -->
<rect x="1220" y="120" width="200" height="150" rx="6" fill="#F4F6F9" stroke="#2563A8" stroke-width="2"/>
<rect x="1220" y="120" width="200" height="8" fill="#2563A8"/>
<text x="1240" y="150" font-family="DM Sans" font-size="14.5" font-weight="bold" fill="#14213D"><tspan x="1240" dy="0">Rapportage en</tspan><tspan x="1240" dy="18">terugkoppeling</tspan></text>
<text x="1240" y="196" font-family="DM Sans" font-size="11" fill="#55606F"><tspan x="1240" dy="0">Rapport, validatiesessie,</tspan><tspan x="1240" dy="14">oplevering</tspan></text>
<rect x="1240" y="228" width="160" height="26" rx="13" fill="#FBF4E6" stroke="#E9A13B" stroke-width="1.2"/>
<text x="1320" y="245" font-family="DM Sans" font-size="11" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="1320" dy="0">2 weken</tspan></text>

<!-- Validatie-sessie callout pointing at box 6 -->
<line x1="1320" y1="270" x2="1320" y2="308" stroke="#2563A8" stroke-width="1.5" stroke-dasharray="4 3"/>
<rect x="1120" y="312" width="280" height="70" rx="6" fill="#F4F6F9" stroke="#2563A8" stroke-width="1.5"/>
<text x="1260" y="334" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="1260" dy="0">incl. validatiesessie</tspan></text>
<text x="1260" y="352" font-family="DM Sans" font-size="10.5" fill="#55606F" text-anchor="middle"><tspan x="1260" dy="0">wordt het vaakst overgeslagen —</tspan><tspan x="1260" dy="14">bepaalt of de uitkomst wordt geaccepteerd</tspan></text>

<!-- Total brace -->
<line x1="45" y1="450" x2="1420" y2="450" stroke="#DFDCD3" stroke-width="1.5"/>
<rect x="560" y="466" width="280" height="44" rx="22" fill="#14213D"/>
<text x="700" y="493" font-family="DM Sans" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="700" dy="0">TOTAAL: 10 TOT 15 WEKEN</tspan></text>

<text x="700" y="538" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle" font-style="italic"><tspan x="700" dy="0">"Kan het in drie weken?" is geen tempo-vraag maar een scopevraag</tspan></text>
</svg>
