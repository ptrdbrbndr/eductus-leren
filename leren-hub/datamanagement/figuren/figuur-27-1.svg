<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620">
<defs>
<marker id="arrow271" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#14213D"/>
</marker>
</defs>
<rect width="1400" height="620" fill="#FBFAF7"/>
<text x="700" y="42" font-family="Cormorant Garamond" font-size="24" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">De levensloop van een model met drie gates — tot aan de zelden bereikte uitfasering</tspan></text>

<!-- Gate 1: before Data verzamelen (between box0 and box1), x center ~224 -->
<path d="M 224 130 L 254 160 L 224 190 L 194 160 Z" fill="#FBF4E6" stroke="#E9A13B" stroke-width="2"/>
<text x="224" y="165" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="224" dy="0">1</tspan></text>
<text x="224" y="112" font-family="DM Sans" font-size="11" font-weight="bold" fill="#E9A13B" text-anchor="middle"><tspan x="224" dy="0">POORT 1 — MAG DIT</tspan></text>
<line x1="224" y1="190" x2="224" y2="252" stroke="#E9A13B" stroke-width="1.8" stroke-dasharray="4 3"/>

<!-- Gate 2: before Accepteren (between box3 Valideren and box4 Accepteren), x center ~794 -->
<path d="M 794 130 L 824 160 L 794 190 L 764 160 Z" fill="#FBF4E6" stroke="#E9A13B" stroke-width="2"/>
<text x="794" y="165" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="794" dy="0">2</tspan></text>
<text x="794" y="112" font-family="DM Sans" font-size="11" font-weight="bold" fill="#E9A13B" text-anchor="middle"><tspan x="794" dy="0">POORT 2 — DEUGT DIT</tspan></text>
<line x1="794" y1="190" x2="794" y2="252" stroke="#E9A13B" stroke-width="1.8" stroke-dasharray="4 3"/>

<!-- Gate 3: on Monitoren (box5), x center ~1079, looping icon -->
<circle cx="1079" cy="160" r="30" fill="#FBF4E6" stroke="#E9A13B" stroke-width="2"/>
<path d="M 1069 148 A 14 14 0 1 1 1069 172" fill="none" stroke="#14213D" stroke-width="2.2"/>
<path d="M 1063 168 L 1069 172 L 1075 165" fill="none" stroke="#14213D" stroke-width="2.2"/>
<text x="1079" y="112" font-family="DM Sans" font-size="11" font-weight="bold" fill="#E9A13B" text-anchor="middle"><tspan x="1079" dy="0">POORT 3 — PERIODIEK</tspan></text>
<line x1="1079" y1="190" x2="1079" y2="252" stroke="#E9A13B" stroke-width="1.8" stroke-dasharray="4 3"/>

<!-- Phase boxes -->
<!-- 0 Probleemstelling -->
<rect x="40" y="256" width="178" height="90" rx="6" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1.5"/>
<text x="129" y="284" font-family="DM Sans" font-size="13" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="129" dy="0">Probleem-</tspan><tspan x="129" dy="16">stelling</tspan></text>
<text x="129" y="326" font-family="DM Sans" font-size="10" fill="#55606F" text-anchor="middle"><tspan x="129" dy="0">Proceseigenaar</tspan></text>
<line x1="218" y1="301" x2="248" y2="301" stroke="#14213D" stroke-width="2" marker-end="url(#arrow271)"/>

<!-- 1 Data verzamelen -->
<rect x="230" y="256" width="178" height="90" rx="6" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1.5"/>
<text x="319" y="284" font-family="DM Sans" font-size="13" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="319" dy="0">Data</tspan><tspan x="319" dy="16">verzamelen</tspan></text>
<text x="319" y="326" font-family="DM Sans" font-size="10" fill="#55606F" text-anchor="middle"><tspan x="319" dy="0">Data owner en FG</tspan></text>
<line x1="408" y1="301" x2="438" y2="301" stroke="#14213D" stroke-width="2" marker-end="url(#arrow271)"/>

<!-- 2 Trainen -->
<rect x="420" y="256" width="178" height="90" rx="6" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1.5"/>
<text x="509" y="292" font-family="DM Sans" font-size="13" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="509" dy="0">Trainen</tspan></text>
<text x="509" y="326" font-family="DM Sans" font-size="10" fill="#55606F" text-anchor="middle"><tspan x="509" dy="0">Ontwikkelaar + toetsing</tspan></text>
<line x1="598" y1="301" x2="628" y2="301" stroke="#14213D" stroke-width="2" marker-end="url(#arrow271)"/>

<!-- 3 Valideren -->
<rect x="610" y="256" width="178" height="90" rx="6" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1.5"/>
<text x="699" y="292" font-family="DM Sans" font-size="13" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="699" dy="0">Valideren</tspan></text>
<text x="699" y="326" font-family="DM Sans" font-size="10" fill="#55606F" text-anchor="middle"><tspan x="699" dy="0">Onafhankelijke validator</tspan></text>
<line x1="788" y1="301" x2="818" y2="301" stroke="#14213D" stroke-width="2" marker-end="url(#arrow271)"/>

<!-- 4 Accepteren -->
<rect x="800" y="256" width="178" height="90" rx="6" fill="#F4F6F9" stroke="#2563A8" stroke-width="2"/>
<text x="889" y="292" font-family="DM Sans" font-size="13" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="889" dy="0">Accepteren</tspan></text>
<text x="889" y="326" font-family="DM Sans" font-size="10" fill="#55606F" text-anchor="middle"><tspan x="889" dy="0">Verwerkingsverantwoordelijke</tspan></text>
<line x1="978" y1="301" x2="1008" y2="301" stroke="#14213D" stroke-width="2" marker-end="url(#arrow271)"/>

<!-- 5 Monitoren -->
<rect x="990" y="256" width="178" height="90" rx="6" fill="#F4F6F9" stroke="#2563A8" stroke-width="2"/>
<text x="1079" y="292" font-family="DM Sans" font-size="13" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="1079" dy="0">Monitoren</tspan></text>
<text x="1079" y="326" font-family="DM Sans" font-size="10" fill="#55606F" text-anchor="middle"><tspan x="1079" dy="0">Modeleigenaar</tspan></text>
<line x1="1168" y1="301" x2="1198" y2="301" stroke="#14213D" stroke-width="2" marker-end="url(#arrow271)"/>

<!-- 6 Uitfaseren — dashed, faded, zelden bereikt -->
<rect x="1180" y="256" width="178" height="90" rx="6" fill="#F4F6F9" stroke="#55606F" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.75"/>
<text x="1269" y="292" font-family="DM Sans" font-size="13" font-weight="bold" fill="#55606F" text-anchor="middle"><tspan x="1269" dy="0">Uitfaseren</tspan></text>
<text x="1269" y="326" font-family="DM Sans" font-size="10" fill="#55606F" text-anchor="middle"><tspan x="1269" dy="0">Modeleigenaar — in de</tspan></text>

<text x="1269" y="376" font-family="DM Sans" font-size="12" font-weight="bold" fill="#E9A13B" text-anchor="middle" font-style="italic"><tspan x="1269" dy="0">"zelden bereikt"</tspan></text>
<text x="1269" y="394" font-family="DM Sans" font-size="10.5" fill="#55606F" text-anchor="middle"><tspan x="1269" dy="0">in de praktijk: niemand</tspan></text>

<!-- Legend -->
<rect x="40" y="440" width="1320" height="150" rx="8" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1.5"/>
<path d="M 76 470 L 96 490 L 76 510 L 56 490 Z" fill="#FBF4E6" stroke="#E9A13B" stroke-width="2"/>
<text x="76" y="494" font-family="DM Sans" font-size="10.5" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="76" dy="0">1/2</tspan></text>
<text x="112" y="480" font-family="DM Sans" font-size="12.5" font-weight="bold" fill="#14213D"><tspan x="112" dy="0">Poort 1 en 2 — eenmalig, in het pad naar productie</tspan></text>
<text x="112" y="500" font-family="DM Sans" font-size="11.5" fill="#55606F"><tspan x="112" dy="0">Poort 1 vóór dataverzameling (grondslag, classificatie), poort 2 vóór acceptatie (validatie, bias, uitlegbaarheid)</tspan></text>

<circle cx="76" cy="546" r="18" fill="#FBF4E6" stroke="#E9A13B" stroke-width="2"/>
<path d="M 70 538 A 8 8 0 1 1 70 554" fill="none" stroke="#14213D" stroke-width="1.6"/>
<text x="112" y="536" font-family="DM Sans" font-size="12.5" font-weight="bold" fill="#14213D"><tspan x="112" dy="0">Poort 3 — periodiek, minimaal jaarlijks tijdens monitoren</tspan></text>
<text x="112" y="556" font-family="DM Sans" font-size="11.5" fill="#55606F"><tspan x="112" dy="0">Dwingt zichzelf niet af — zonder agendapunt met eigenaar wordt hij na het eerste jaar niet meer gehaald</tspan></text>

<text x="700" y="546" font-family="DM Sans" font-size="12.5" font-weight="bold" fill="#55606F"><tspan x="700" dy="0">Gestippelde, vervaagde box: modellen worden zelden uitgefaseerd — ze blijven</tspan></text>
<text x="700" y="566" font-family="DM Sans" font-size="12.5" fill="#55606F"><tspan x="700" dy="0">draaien tot iemand toevallig merkt dat de uitkomsten niet meer kloppen</tspan></text>
</svg>
