<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="680" viewBox="0 0 1400 680">
<rect width="1400" height="680" fill="#FBFAF7"/>
<text x="700" y="46" font-family="Cormorant Garamond" font-size="25" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Vier waarderingsmethoden naast elkaar — sterk en zwak per benadering</tspan></text>

<!-- Panel 1: Kostenbenadering -->
<rect x="85" y="100" width="300" height="530" rx="8" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1.5"/>
<rect x="85" y="100" width="300" height="56" rx="8" fill="#14213D"/>
<rect x="85" y="132" width="300" height="24" fill="#14213D"/>
<text x="235" y="134" font-family="DM Sans" font-size="15.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="235" dy="0">Kostenbenadering</tspan></text>

<text x="109" y="184" font-family="DM Sans" font-size="12" fill="#55606F"><tspan x="109" dy="0">Wat heeft het gekost om deze</tspan><tspan x="109" dy="16">data op te bouwen en te</tspan><tspan x="109" dy="16">onderhouden?</tspan></text>

<line x1="109" y1="242" x2="361" y2="242" stroke="#DFDCD3" stroke-width="1"/>

<rect x="103" y="258" width="18" height="18" rx="4" fill="#F4F6F9" stroke="#2563A8" stroke-width="1.8"/>
<path d="M 107 267 L 111 271 L 118 261" stroke="#2563A8" stroke-width="2" fill="none"/>
<text x="128" y="272" font-family="DM Sans" font-size="11" font-weight="bold" fill="#2563A8" letter-spacing="0.3"><tspan x="128" dy="0">STERK BIJ</tspan></text>
<text x="109" y="296" font-family="DM Sans" font-size="12" fill="#14213D"><tspan x="109" dy="0">Interne verantwoording,</tspan><tspan x="109" dy="16">verzekering, boekhouding</tspan></text>

<rect x="97" y="342" width="276" height="120" rx="6" fill="#FBF4E6" stroke="#E9A13B" stroke-width="1.5"/>
<path d="M 117 364 L 131 388 L 103 388 Z" fill="#E9A13B"/>
<text x="117" y="384" font-family="DM Sans" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="117" dy="0">!</tspan></text>
<text x="143" y="368" font-family="DM Sans" font-size="11" font-weight="bold" fill="#E9A13B" letter-spacing="0.3"><tspan x="143" dy="0">ZWAK BIJ</tspan></text>
<text x="117" y="410" font-family="DM Sans" font-size="12" fill="#14213D"><tspan x="117" dy="0">Zegt niets over waarde:</tspan><tspan x="117" dy="17">dure data kan waardeloos</tspan><tspan x="117" dy="17">zijn</tspan></text>

<text x="109" y="600" font-family="DM Sans" font-size="11.5" fill="#55606F" font-style="italic"><tspan x="109" dy="0">Meest gebruikt, minst</tspan><tspan x="109" dy="15">informatief</tspan></text>

<!-- Panel 2: Marktbenadering -->
<rect x="405" y="100" width="300" height="530" rx="8" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1.5"/>
<rect x="405" y="100" width="300" height="56" rx="8" fill="#14213D"/>
<rect x="405" y="132" width="300" height="24" fill="#14213D"/>
<text x="555" y="134" font-family="DM Sans" font-size="15.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="555" dy="0">Marktbenadering</tspan></text>

<text x="429" y="184" font-family="DM Sans" font-size="12" fill="#55606F"><tspan x="429" dy="0">Wat betalen anderen voor</tspan><tspan x="429" dy="16">vergelijkbare data?</tspan></text>

<line x1="429" y1="226" x2="681" y2="226" stroke="#DFDCD3" stroke-width="1"/>

<rect x="423" y="242" width="18" height="18" rx="4" fill="#F4F6F9" stroke="#2563A8" stroke-width="1.8"/>
<path d="M 427 251 L 431 255 L 438 245" stroke="#2563A8" stroke-width="2" fill="none"/>
<text x="448" y="256" font-family="DM Sans" font-size="11" font-weight="bold" fill="#2563A8" letter-spacing="0.3"><tspan x="448" dy="0">STERK BIJ</tspan></text>
<text x="429" y="280" font-family="DM Sans" font-size="12" fill="#14213D"><tspan x="429" dy="0">Datasets met een echte markt,</tspan><tspan x="429" dy="16">zoals adres- of</tspan><tspan x="429" dy="16">bedrijfsgegevens</tspan></text>

<rect x="417" y="342" width="276" height="120" rx="6" fill="#FBF4E6" stroke="#E9A13B" stroke-width="1.5"/>
<path d="M 437 364 L 451 388 L 423 388 Z" fill="#E9A13B"/>
<text x="437" y="384" font-family="DM Sans" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="437" dy="0">!</tspan></text>
<text x="463" y="368" font-family="DM Sans" font-size="11" font-weight="bold" fill="#E9A13B" letter-spacing="0.3"><tspan x="463" dy="0">ZWAK BIJ</tspan></text>
<text x="437" y="410" font-family="DM Sans" font-size="12" fill="#14213D"><tspan x="437" dy="0">Voor unieke of gereguleerde</tspan><tspan x="437" dy="17">data bestaat geen markt</tspan></text>

<text x="429" y="600" font-family="DM Sans" font-size="11.5" fill="#55606F" font-style="italic"><tspan x="429" dy="0">Faalt bij deelnemersgegevens</tspan></text>

<!-- Panel 3: Opbrengstbenadering -->
<rect x="725" y="100" width="300" height="530" rx="8" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1.5"/>
<rect x="725" y="100" width="300" height="56" rx="8" fill="#14213D"/>
<rect x="725" y="132" width="300" height="24" fill="#14213D"/>
<text x="875" y="134" font-family="DM Sans" font-size="15.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="875" dy="0">Opbrengstbenadering</tspan></text>

<text x="749" y="184" font-family="DM Sans" font-size="12" fill="#55606F"><tspan x="749" dy="0">Welke opbrengst of besparing</tspan><tspan x="749" dy="16">is aan deze data toe te</tspan><tspan x="749" dy="16">schrijven?</tspan></text>

<line x1="749" y1="242" x2="1001" y2="242" stroke="#DFDCD3" stroke-width="1"/>

<rect x="743" y="258" width="18" height="18" rx="4" fill="#F4F6F9" stroke="#2563A8" stroke-width="1.8"/>
<path d="M 747 267 L 751 271 L 758 261" stroke="#2563A8" stroke-width="2" fill="none"/>
<text x="768" y="272" font-family="DM Sans" font-size="11" font-weight="bold" fill="#2563A8" letter-spacing="0.3"><tspan x="768" dy="0">STERK BIJ</tspan></text>
<text x="749" y="296" font-family="DM Sans" font-size="12" fill="#14213D"><tspan x="749" dy="0">Data die aantoonbaar aan</tspan><tspan x="749" dy="16">een proces of product</tspan><tspan x="749" dy="16">bijdraagt</tspan></text>

<rect x="737" y="358" width="276" height="120" rx="6" fill="#FBF4E6" stroke="#E9A13B" stroke-width="1.5"/>
<path d="M 757 380 L 771 404 L 743 404 Z" fill="#E9A13B"/>
<text x="757" y="400" font-family="DM Sans" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="757" dy="0">!</tspan></text>
<text x="783" y="384" font-family="DM Sans" font-size="11" font-weight="bold" fill="#E9A13B" letter-spacing="0.3"><tspan x="783" dy="0">ZWAK BIJ</tspan></text>
<text x="757" y="426" font-family="DM Sans" font-size="12" fill="#14213D"><tspan x="757" dy="0">Toerekening is arbitrair</tspan><tspan x="757" dy="17">zodra meerdere bronnen</tspan><tspan x="757" dy="17">bijdragen</tspan></text>

<text x="749" y="600" font-family="DM Sans" font-size="11.5" fill="#55606F" font-style="italic"><tspan x="749" dy="0">Past bij de investeringsvraag</tspan></text>

<!-- Panel 4: Scenario-/optiebenadering -->
<rect x="1045" y="100" width="300" height="530" rx="8" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2"/>
<rect x="1045" y="100" width="300" height="56" rx="8" fill="#E9A13B"/>
<rect x="1045" y="132" width="300" height="24" fill="#E9A13B"/>
<text x="1195" y="134" font-family="DM Sans" font-size="15.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="1195" dy="0">Scenario-/optiebenadering</tspan></text>

<text x="1069" y="184" font-family="DM Sans" font-size="12" fill="#55606F"><tspan x="1069" dy="0">Welke mogelijkheden opent</tspan><tspan x="1069" dy="16">deze data, en wat is de</tspan><tspan x="1069" dy="16">kans daarop?</tspan></text>

<line x1="1069" y1="242" x2="1321" y2="242" stroke="#DFDCD3" stroke-width="1"/>

<rect x="1063" y="258" width="18" height="18" rx="4" fill="#F4F6F9" stroke="#2563A8" stroke-width="1.8"/>
<path d="M 1067 267 L 1071 271 L 1078 261" stroke="#2563A8" stroke-width="2" fill="none"/>
<text x="1088" y="272" font-family="DM Sans" font-size="11" font-weight="bold" fill="#2563A8" letter-spacing="0.3"><tspan x="1088" dy="0">STERK BIJ</tspan></text>
<text x="1069" y="296" font-family="DM Sans" font-size="12" fill="#14213D"><tspan x="1069" dy="0">Strategische vragen: een</tspan><tspan x="1069" dy="16">fusie, een nieuwe dienst</tspan></text>

<rect x="1057" y="342" width="276" height="120" rx="6" fill="#FBF4E6" stroke="#E9A13B" stroke-width="2"/>
<path d="M 1077 364 L 1091 388 L 1063 388 Z" fill="#E9A13B"/>
<text x="1077" y="384" font-family="DM Sans" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="1077" dy="0">!</tspan></text>
<text x="1103" y="368" font-family="DM Sans" font-size="11" font-weight="bold" fill="#E9A13B" letter-spacing="0.3"><tspan x="1103" dy="0">ZWAK BIJ</tspan></text>
<text x="1077" y="410" font-family="DM Sans" font-size="12" fill="#14213D"><tspan x="1077" dy="0">Zeer gevoelig voor</tspan><tspan x="1077" dy="17">aannames; makkelijk te</tspan><tspan x="1077" dy="17">manipuleren</tspan></text>

<text x="1069" y="600" font-family="DM Sans" font-size="11.5" fill="#14213D" font-weight="bold" font-style="italic"><tspan x="1069" dy="0">Gebruikt bij de fusiewaardering</tspan></text>

</svg>
