<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
<defs>
<marker id="arrowP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#2563A8"/>
</marker>
<marker id="arrowQ" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#E9A13B"/>
</marker>
</defs>
<rect width="1400" height="820" fill="#FBFAF7"/>
<text x="700" y="48" font-family="Cormorant Garamond" font-size="26" font-weight="bold" fill="#14213D" text-anchor="middle">De organenstructuur als piramide</text>
<text x="700" y="74" font-family="DM Sans" font-size="13" fill="#55606F" text-anchor="middle">Van community of practice zonder besluitrecht tot de governance board — escalatie omhoog, delegatie omlaag</text>

<!-- escalatie arrow (right) -->
<line x1="1265" y1="600" x2="1265" y2="155" stroke="#2563A8" stroke-width="2.5" marker-end="url(#arrowP)"/>
<text x="1290" y="380" font-family="DM Sans" font-size="12" font-weight="bold" fill="#2563A8" text-anchor="middle" transform="rotate(-90 1290 380)">ESCALATIE</text>

<!-- delegatie arrow (left) -->
<line x1="135" y1="155" x2="135" y2="600" stroke="#E9A13B" stroke-width="2.5" marker-end="url(#arrowQ)"/>
<text x="110" y="380" font-family="DM Sans" font-size="12" font-weight="bold" fill="#B97A1E" text-anchor="middle" transform="rotate(-90 110 380)">DELEGATIE</text>

<!-- Band 4: Governance board (top) -->
<rect x="500" y="150" width="400" height="90" rx="6" fill="#14213D"/>
<text x="700" y="178" font-family="DM Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Data governance board</text>
<text x="700" y="196" font-family="DM Sans" font-size="10" fill="#DFDCD3" text-anchor="middle">Strategisch, vaststellend · Directie, CDO, domeineigenaren</text>
<text x="700" y="212" font-family="DM Sans" font-size="10" fill="#DFDCD3" text-anchor="middle">Per kwartaal · Beleid, budget, escalaties, waivers hoog risico</text>

<!-- Band 3: Domeinraad -->
<rect x="400" y="270" width="600" height="90" rx="6" fill="#20335A"/>
<text x="700" y="298" font-family="DM Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Domeinraad</text>
<text x="700" y="316" font-family="DM Sans" font-size="10" fill="#DFDCD3" text-anchor="middle">Tactisch, beslissend binnen domein · Data owner, stewards, architect</text>
<text x="700" y="332" font-family="DM Sans" font-size="10" fill="#DFDCD3" text-anchor="middle">Per maand · Definities, kwaliteitsnormen, toegang, prioritering</text>

<!-- Band 2: Stewardship-overleg -->
<rect x="300" y="390" width="800" height="90" rx="6" fill="#2C4A7C"/>
<text x="700" y="418" font-family="DM Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Stewardship-overleg</text>
<text x="700" y="436" font-family="DM Sans" font-size="10" fill="#E9EEF6" text-anchor="middle">Operationeel, uitvoerend · Business- en technical stewards</text>
<text x="700" y="452" font-family="DM Sans" font-size="10" fill="#E9EEF6" text-anchor="middle">Tweewekelijks · Uitzonderingen, incidenten, regelwijzigingen</text>

<!-- Band 1: Community of practice (bottom) -->
<rect x="200" y="510" width="1000" height="90" rx="6" fill="#F4F6F9" stroke="#DFDCD3" stroke-width="1.5"/>
<text x="700" y="538" font-family="DM Sans" font-size="15" font-weight="bold" fill="#14213D" text-anchor="middle">Community of practice</text>
<text x="700" y="556" font-family="DM Sans" font-size="10" fill="#55606F" text-anchor="middle">Geen besluitrecht · Iedereen die wil</text>
<text x="700" y="572" font-family="DM Sans" font-size="10" fill="#55606F" text-anchor="middle">Per twee maanden · Kennisdeling, signalering</text>

<!-- callout -->
<rect x="200" y="630" width="1000" height="70" rx="6" fill="#FBF4E6" stroke="#E9A13B" stroke-width="1.5"/>
<text x="700" y="656" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D" text-anchor="middle">De vergadertoets</text>
<text x="700" y="676" font-family="DM Sans" font-size="11" fill="#55606F" text-anchor="middle">Als niemand het merkt wanneer een orgaan een half jaar niet bijeenkomt, had dat orgaan geen besluitrechten.</text>
<text x="700" y="693" font-family="DM Sans" font-size="11" fill="#55606F" text-anchor="middle">Elk orgaan heeft een vaste agendabron, een escalatiepad omhoog en een delegatiepad omlaag.</text>

<rect x="200" y="716" width="1000" height="36" rx="6" fill="#F4F6F9" stroke="#DFDCD3" stroke-width="1"/>
<text x="700" y="739" font-family="DM Sans" font-size="10.5" fill="#55606F" text-anchor="middle">Nooit meer organen dan besluittypen — twee organen die over hetzelfde beslissen leiden tot forumshoppen.</text>
</svg>
