<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="640" viewBox="0 0 1400 640">
<defs>
<marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#14213D"/>
</marker>
</defs>
<rect width="1400" height="640" fill="#FBFAF7"/>
<text x="700" y="48" font-family="Cormorant Garamond" font-size="26" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">ETL versus ELT — dezelfde drie stappen, andere volgorde</tspan></text>
<text x="700" y="76" font-family="DM Sans" font-size="13" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">Ophalen, omzetten en wegschrijven — de volgorde bepaalt wat er bewaard blijft</tspan></text>

<!-- ETL row label -->
<rect x="60" y="120" width="130" height="220" rx="6" fill="#14213D"/>
<text x="125" y="225" font-family="DM Sans" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle" transform="rotate(-90 125 225)"><tspan x="125" dy="0">ETL</tspan></text>

<!-- ETL steps -->
<rect x="220" y="140" width="240" height="90" rx="8" fill="#EAF1F8" stroke="#2563A8" stroke-width="2"/>
<text x="340" y="178" font-family="DM Sans" font-size="15" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="340" dy="0">1. Ophalen</tspan></text>
<text x="340" y="200" font-family="DM Sans" font-size="11" fill="#55606F" text-anchor="middle"><tspan x="340" dy="0">uit het bronsysteem</tspan></text>

<line x1="460" y1="185" x2="510" y2="185" stroke="#14213D" stroke-width="2" marker-end="url(#arrowG)"/>

<rect x="510" y="140" width="240" height="90" rx="8" fill="#FBF4E6" stroke="#E9A13B" stroke-width="2"/>
<text x="630" y="178" font-family="DM Sans" font-size="15" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="630" dy="0">2. Omzetten</tspan></text>
<text x="630" y="200" font-family="DM Sans" font-size="11" fill="#55606F" text-anchor="middle"><tspan x="630" dy="0">onderweg, in het platform</tspan></text>

<line x1="750" y1="185" x2="800" y2="185" stroke="#14213D" stroke-width="2" marker-end="url(#arrowG)"/>

<rect x="800" y="140" width="240" height="90" rx="8" fill="#F4F6F9" stroke="#14213D" stroke-width="2"/>
<text x="920" y="178" font-family="DM Sans" font-size="15" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="920" dy="0">3. Wegschrijven</tspan></text>
<text x="920" y="200" font-family="DM Sans" font-size="11" fill="#55606F" text-anchor="middle"><tspan x="920" dy="0">alleen het bewerkte resultaat</tspan></text>

<rect x="1070" y="140" width="270" height="90" rx="6" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/>
<text x="1090" y="165" font-family="DM Sans" font-size="11.5" font-weight="bold" fill="#14213D"><tspan x="1090" dy="0">Gevolg</tspan></text>
<text x="1090" y="185" font-family="DM Sans" font-size="11" fill="#55606F"><tspan x="1090" dy="0">Wat onderweg is weggegooid,</tspan></text>
<text x="1090" y="201" font-family="DM Sans" font-size="11" fill="#55606F"><tspan x="1090" dy="0">is weg. Alleen wat nodig is</tspan></text>
<text x="1090" y="217" font-family="DM Sans" font-size="11" fill="#55606F"><tspan x="1090" dy="0">wordt bewaard.</tspan></text>

<!-- divider -->
<line x1="60" y1="360" x2="1340" y2="360" stroke="#DFDCD3" stroke-width="1" stroke-dasharray="4 4"/>

<!-- ELT row label -->
<rect x="60" y="380" width="130" height="220" rx="6" fill="#2563A8"/>
<text x="125" y="485" font-family="DM Sans" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle" transform="rotate(-90 125 485)"><tspan x="125" dy="0">ELT</tspan></text>

<!-- ELT steps: same shapes, reordered -->
<rect x="220" y="400" width="240" height="90" rx="8" fill="#EAF1F8" stroke="#2563A8" stroke-width="2"/>
<text x="340" y="438" font-family="DM Sans" font-size="15" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="340" dy="0">1. Ophalen</tspan></text>
<text x="340" y="460" font-family="DM Sans" font-size="11" fill="#55606F" text-anchor="middle"><tspan x="340" dy="0">uit het bronsysteem</tspan></text>

<line x1="460" y1="445" x2="510" y2="445" stroke="#14213D" stroke-width="2" marker-end="url(#arrowG)"/>

<rect x="510" y="400" width="240" height="90" rx="8" fill="#F4F6F9" stroke="#14213D" stroke-width="2"/>
<text x="630" y="438" font-family="DM Sans" font-size="15" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="630" dy="0">2. Wegschrijven</tspan></text>
<text x="630" y="460" font-family="DM Sans" font-size="11" fill="#55606F" text-anchor="middle"><tspan x="630" dy="0">de ruwe data, ongewijzigd</tspan></text>

<line x1="750" y1="445" x2="800" y2="445" stroke="#14213D" stroke-width="2" marker-end="url(#arrowG)"/>

<rect x="800" y="400" width="240" height="90" rx="8" fill="#FBF4E6" stroke="#E9A13B" stroke-width="2"/>
<text x="920" y="438" font-family="DM Sans" font-size="15" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="920" dy="0">3. Omzetten</tspan></text>
<text x="920" y="460" font-family="DM Sans" font-size="11" fill="#55606F" text-anchor="middle"><tspan x="920" dy="0">pas in de doelomgeving</tspan></text>

<rect x="1070" y="400" width="270" height="90" rx="6" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/>
<text x="1090" y="425" font-family="DM Sans" font-size="11.5" font-weight="bold" fill="#14213D"><tspan x="1090" dy="0">Gevolg</tspan></text>
<text x="1090" y="445" font-family="DM Sans" font-size="11" fill="#55606F"><tspan x="1090" dy="0">De ruwe data blijft beschikbaar</tspan></text>
<text x="1090" y="461" font-family="DM Sans" font-size="11" fill="#55606F"><tspan x="1090" dy="0">voor later — herkomst beter</tspan></text>
<text x="1090" y="477" font-family="DM Sans" font-size="11" fill="#55606F"><tspan x="1090" dy="0">te volgen, meer opslag nodig.</tspan></text>

<rect x="60" y="530" width="1280" height="80" rx="6" fill="#F4F6F9" stroke="#DFDCD3" stroke-width="1"/>
<text x="700" y="565" font-family="DM Sans" font-size="13" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">Bij ELT staat de ruwe data er nog, wat aantoonbaarheid richting een toezichthouder aanzienlijk</tspan></text>
<text x="700" y="587" font-family="DM Sans" font-size="13" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">makkelijker maakt — relevant bij de DNB-bevinding over de rapportageketen van Meridiaan.</tspan></text>
</svg>
