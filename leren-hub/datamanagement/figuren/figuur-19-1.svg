<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
<defs>
<marker id="arrowAx" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#14213D"/>
</marker>
</defs>
<rect width="1400" height="800" fill="#FBFAF7"/>
<text x="700" y="42" font-family="Cormorant Garamond" font-size="25" font-weight="bold" fill="#14213D" text-anchor="middle">Stakeholdergrid op invloed en belang</text>
<text x="700" y="65" font-family="DM Sans" font-size="12.5" fill="#55606F" text-anchor="middle">De vier Meridiaan-stakeholders in hun kwadrant — hoge invloed met laag belang is waar een voorstel meestal spaak loopt</text>

<!-- grid -->
<rect x="280" y="110" width="700" height="500" fill="#FFFFFF" stroke="#14213D" stroke-width="1.5"/>
<!-- quadrant fills -->
<rect x="280" y="110" width="350" height="250" fill="#F4F6F9"/>
<rect x="630" y="110" width="350" height="250" fill="#EAF1FA"/>
<rect x="280" y="360" width="350" height="250" fill="#FBFAF7"/>
<rect x="630" y="360" width="350" height="250" fill="#FBF4E6"/>
<!-- divider lines -->
<line x1="630" y1="110" x2="630" y2="610" stroke="#14213D" stroke-width="1.5"/>
<line x1="280" y1="360" x2="980" y2="360" stroke="#14213D" stroke-width="1.5"/>

<!-- axes -->
<line x1="280" y1="650" x2="1000" y2="650" stroke="#14213D" stroke-width="2" marker-end="url(#arrowAx)"/>
<text x="640" y="678" font-family="DM Sans" font-size="13" font-weight="bold" fill="#14213D" text-anchor="middle">Invloed →</text>
<line x1="240" y1="610" x2="240" y2="90" stroke="#14213D" stroke-width="2" marker-end="url(#arrowAx)"/>
<text x="215" y="350" font-family="DM Sans" font-size="13" font-weight="bold" fill="#14213D" text-anchor="middle" transform="rotate(-90 215 350)">Belang →</text>

<!-- quadrant action labels -->
<text x="455" y="132" font-family="DM Sans" font-size="10.5" font-weight="bold" fill="#55606F" text-anchor="middle">Informeren en betrekken</text>
<text x="805" y="132" font-family="DM Sans" font-size="10.5" font-weight="bold" fill="#2563A8" text-anchor="middle">Meebouwen</text>
<text x="455" y="382" font-family="DM Sans" font-size="10.5" font-weight="bold" fill="#55606F" text-anchor="middle">Op de hoogte houden</text>
<text x="805" y="382" font-family="DM Sans" font-size="10.5" font-weight="bold" fill="#B97A1E" text-anchor="middle">Vroeg betrekken — risico wegnemen</text>

<!-- stakeholder markers -->
<!-- Hoog invloed / hoog belang: CFO -->
<circle cx="850" cy="200" r="26" fill="#2563A8"/>
<text x="850" y="206" font-family="DM Sans" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle">CFO</text>
<rect x="770" y="235" width="160" height="42" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.2"/>
<text x="850" y="252" font-family="DM Sans" font-size="9.5" fill="#14213D" text-anchor="middle" font-weight="bold">De CFO</text>
<text x="850" y="266" font-family="DM Sans" font-size="8.5" fill="#55606F" text-anchor="middle">met de DNB-bevinding</text>

<!-- Laag invloed / hoog belang: stewards + klantcontact -->
<circle cx="410" cy="200" r="26" fill="#55606F"/>
<text x="410" y="203" font-family="DM Sans" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Stewards</text>
<text x="410" y="214" font-family="DM Sans" font-size="7.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle">+ klantcontact</text>
<rect x="330" y="235" width="160" height="42" rx="6" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1.2"/>
<text x="410" y="252" font-family="DM Sans" font-size="9.5" fill="#14213D" text-anchor="middle" font-weight="bold">Stewards &amp; klantcontact</text>
<text x="410" y="266" font-family="DM Sans" font-size="8.5" fill="#55606F" text-anchor="middle">zij leveren het bewijs</text>

<!-- Laag invloed / laag belang: ondersteunende afdelingen -->
<circle cx="410" cy="460" r="26" fill="#DFDCD3"/>
<text x="410" y="465" font-family="DM Sans" font-size="8" font-weight="bold" fill="#14213D" text-anchor="middle">Onder-</text>
<text x="410" y="475" font-family="DM Sans" font-size="7" font-weight="bold" fill="#14213D" text-anchor="middle">steunend</text>
<rect x="330" y="495" width="160" height="42" rx="6" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1.2"/>
<text x="410" y="512" font-family="DM Sans" font-size="9.5" fill="#14213D" text-anchor="middle" font-weight="bold">Ondersteunende afdelingen</text>
<text x="410" y="526" font-family="DM Sans" font-size="8.5" fill="#55606F" text-anchor="middle">verder niet investeren</text>

<!-- Hoog invloed / laag belang: directeur Beleggingen (danger) -->
<circle cx="850" cy="460" r="30" fill="#E9A13B" stroke="#B97A1E" stroke-width="2"/>
<text x="850" y="458" font-family="DM Sans" font-size="8.5" font-weight="bold" fill="#14213D" text-anchor="middle">Directeur</text>
<text x="850" y="470" font-family="DM Sans" font-size="8.5" font-weight="bold" fill="#14213D" text-anchor="middle">Beleggingen</text>
<rect x="760" y="500" width="180" height="46" rx="6" fill="#FBF4E6" stroke="#E9A13B" stroke-width="2"/>
<text x="850" y="519" font-family="DM Sans" font-size="9.5" fill="#14213D" text-anchor="middle" font-weight="bold">Directeur Beleggingen</text>
<text x="850" y="534" font-family="DM Sans" font-size="8.5" fill="#B97A1E" text-anchor="middle" font-weight="bold">wint er niets bij — kans op blokkade</text>

<!-- danger zone flag -->
<rect x="990" y="440" width="270" height="60" rx="6" fill="#FDF0EE" stroke="#B03A2E" stroke-width="1.5"/>
<text x="1125" y="462" font-family="DM Sans" font-size="10.5" font-weight="bold" fill="#B03A2E" text-anchor="middle">Waar een voorstel spaak loopt</text>
<text x="1125" y="478" font-family="DM Sans" font-size="9.5" fill="#55606F" text-anchor="middle">Hoge invloed, laag belang — kan</text>
<text x="1125" y="492" font-family="DM Sans" font-size="9.5" fill="#55606F" text-anchor="middle">tegenhouden zonder er iets bij te winnen</text>
<path d="M990,470 L940,464" fill="none" stroke="#B03A2E" stroke-width="1.5" marker-end="url(#arrowAx)"/>

<!-- axis end labels -->
<text x="990" y="630" font-family="DM Sans" font-size="10" fill="#55606F" text-anchor="middle">hoog</text>
<text x="290" y="630" font-family="DM Sans" font-size="10" fill="#55606F" text-anchor="middle">laag</text>
<text x="255" y="120" font-family="DM Sans" font-size="10" fill="#55606F" text-anchor="middle">hoog</text>
<text x="255" y="605" font-family="DM Sans" font-size="10" fill="#55606F" text-anchor="middle">laag</text>

<!-- bottom note -->
<rect x="280" y="700" width="700" height="70" rx="6" fill="#F4F6F9" stroke="#DFDCD3" stroke-width="1"/>
<text x="630" y="726" font-family="DM Sans" font-size="11" fill="#55606F" text-anchor="middle">Drie vormen van weerstand zijn signalen, geen obstakels: "dit hebben wij al", "dit vertraagt ons",</text>
<text x="630" y="744" font-family="DM Sans" font-size="11" fill="#55606F" text-anchor="middle">"hier gaat IT over" — onuitgesproken weerstand is het echte probleem.</text>
</svg>
