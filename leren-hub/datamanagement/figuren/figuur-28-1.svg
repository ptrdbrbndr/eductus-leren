<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780">
<defs>
<marker id="arrowBlue28" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#2563A8"/>
</marker>
<marker id="arrowNavy28" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#14213D"/>
</marker>
<marker id="arrowAmber28" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#E9A13B"/>
</marker>
</defs>
<rect width="1400" height="780" fill="#FBFAF7"/>
<text x="700" y="46" font-family="Cormorant Garamond" font-size="25" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Causaal diagram bij de portaalvraag — waarop je wél en niet corrigeert</tspan></text>

<!-- Confounder node: Leeftijd/inkomen -->
<rect x="580" y="108" width="240" height="88" rx="8" fill="#F4F6F9" stroke="#2563A8" stroke-width="2.5"/>
<rect x="580" y="90" width="140" height="24" rx="12" fill="#2563A8"/>
<text x="650" y="106" font-family="DM Sans" font-size="10.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="650" dy="0">CONFOUNDER</tspan></text>
<text x="700" y="146" font-family="DM Sans" font-size="16" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Leeftijd / inkomen</tspan></text>
<text x="700" y="170" font-family="DM Sans" font-size="11.5" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">gemeenschappelijke oorzaak</tspan></text>

<!-- Portaalgebruik node -->
<rect x="130" y="330" width="240" height="88" rx="8" fill="#FFFFFF" stroke="#14213D" stroke-width="2.5"/>
<text x="250" y="368" font-family="DM Sans" font-size="16" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="250" dy="0">Portaalgebruik</tspan></text>
<text x="250" y="392" font-family="DM Sans" font-size="11.5" fill="#55606F" text-anchor="middle"><tspan x="250" dy="0">onderzochte variabele</tspan></text>

<!-- Bijstorting node -->
<rect x="1030" y="330" width="240" height="88" rx="8" fill="#FFFFFF" stroke="#14213D" stroke-width="2.5"/>
<text x="1150" y="368" font-family="DM Sans" font-size="16" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="1150" dy="0">Bijstorting</tspan></text>
<text x="1150" y="392" font-family="DM Sans" font-size="11.5" fill="#55606F" text-anchor="middle"><tspan x="1150" dy="0">onderzochte variabele</tspan></text>

<!-- Collider node: Aantal ontvangen brieven -->
<rect x="560" y="580" width="280" height="88" rx="8" fill="#FBF4E6" stroke="#E9A13B" stroke-width="2.5"/>
<rect x="560" y="562" width="110" height="24" rx="12" fill="#E9A13B"/>
<text x="615" y="578" font-family="DM Sans" font-size="10.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="615" dy="0">COLLIDER</tspan></text>
<path d="M 800 566 L 812 578 M 812 566 L 800 578" stroke="#E9A13B" stroke-width="2.5" stroke-linecap="round"/>
<text x="700" y="618" font-family="DM Sans" font-size="15.5" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Aantal ontvangen brieven</tspan></text>
<text x="700" y="642" font-family="DM Sans" font-size="11.5" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">gemeenschappelijk gevolg</tspan></text>

<!-- Arrows: confounder -> portaalgebruik and -> bijstorting (blue, wél corrigeren) -->
<line x1="618" y1="196" x2="304" y2="330" stroke="#2563A8" stroke-width="2.8" marker-end="url(#arrowBlue28)"/>
<line x1="782" y1="196" x2="1096" y2="330" stroke="#2563A8" stroke-width="2.8" marker-end="url(#arrowBlue28)"/>

<!-- Arrow: portaalgebruik -> bijstorting (navy, onderzochte relatie) -->
<line x1="370" y1="374" x2="1022" y2="374" stroke="#14213D" stroke-width="3" marker-end="url(#arrowNavy28)"/>
<text x="700" y="360" font-family="DM Sans" font-size="12.5" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">onderzochte relatie</tspan></text>

<!-- Arrows: portaalgebruik -> collider, bijstorting -> collider (amber, niet corrigeren) -->
<line x1="290" y1="418" x2="606" y2="580" stroke="#E9A13B" stroke-width="2.8" marker-end="url(#arrowAmber28)"/>
<line x1="1110" y1="418" x2="794" y2="580" stroke="#E9A13B" stroke-width="2.8" marker-end="url(#arrowAmber28)"/>

<!-- Legend -->
<rect x="70" y="700" width="1260" height="64" rx="8" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1.5"/>
<line x1="98" y1="718" x2="138" y2="718" stroke="#2563A8" stroke-width="3"/>
<text x="148" y="723" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D"><tspan x="148" dy="0">Confounder-pad</tspan></text>
<text x="148" y="742" font-family="DM Sans" font-size="11" fill="#55606F"><tspan x="148" dy="0">wél corrigeren</tspan></text>

<line x1="500" y1="718" x2="540" y2="718" stroke="#14213D" stroke-width="3"/>
<text x="550" y="723" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D"><tspan x="550" dy="0">Onderzochte relatie</tspan></text>
<text x="550" y="742" font-family="DM Sans" font-size="11" fill="#55606F"><tspan x="550" dy="0">geen correctie op toepassen</tspan></text>

<line x1="920" y1="718" x2="960" y2="718" stroke="#E9A13B" stroke-width="3"/>
<text x="970" y="723" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D"><tspan x="970" dy="0">Collider-pad</tspan></text>
<text x="970" y="742" font-family="DM Sans" font-size="11" fill="#55606F"><tspan x="970" dy="0">NIET corrigeren — creëert een schijnverband</tspan></text>
</svg>
