<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
<defs>
<marker id="arrowF" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#14213D"/>
</marker>
<marker id="arrowG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#E9A13B"/>
</marker>
</defs>
<rect width="1400" height="760" fill="#FBFAF7"/>
<text x="700" y="48" font-family="Cormorant Garamond" font-size="26" font-weight="bold" fill="#14213D" text-anchor="middle">De MDM-pijplijn</text>
<text x="700" y="74" font-family="DM Sans" font-size="13" fill="#55606F" text-anchor="middle">Van bronrecords via matchen en survivorship-regels naar één golden record</text>

<!-- Bronrecords cluster -->
<text x="70" y="130" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D">Bronrecords</text>
<rect x="70" y="142" width="230" height="46" rx="5" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1.2"/>
<text x="82" y="161" font-family="DM Sans" font-size="10" fill="#14213D">Polisadministratie</text>
<text x="82" y="177" font-family="DM Sans" font-size="9.5" fill="#55606F">"Jan de Vries", 14-03-1968</text>
<rect x="70" y="198" width="230" height="46" rx="5" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1.2"/>
<text x="82" y="217" font-family="DM Sans" font-size="10" fill="#14213D">Werkgeverportaal</text>
<text x="82" y="233" font-family="DM Sans" font-size="9.5" fill="#55606F">"J. de Vries", Rembrandtlaan 12</text>
<rect x="70" y="254" width="230" height="46" rx="5" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1.2"/>
<text x="82" y="273" font-family="DM Sans" font-size="10" fill="#14213D">CRM klantcontact</text>
<text x="82" y="289" font-family="DM Sans" font-size="9.5" fill="#55606F">"Jan d. Vries", tel. 06-xxxxxxx</text>

<!-- arrow to Matchen -->
<line x1="300" y1="220" x2="358" y2="220" stroke="#14213D" stroke-width="2" marker-end="url(#arrowF)"/>

<!-- Matchen box -->
<rect x="360" y="150" width="220" height="140" rx="8" fill="#F4F6F9" stroke="#2563A8" stroke-width="2"/>
<text x="470" y="178" font-family="DM Sans" font-size="14" font-weight="bold" fill="#14213D" text-anchor="middle">Matchen</text>
<text x="470" y="196" font-family="DM Sans" font-size="9.5" fill="#55606F" text-anchor="middle">deterministisch + probabilistisch</text>
<line x1="380" y1="206" x2="560" y2="206" stroke="#DFDCD3" stroke-width="1"/>
<text x="380" y="224" font-family="DM Sans" font-size="9.5" fill="#14213D">Boven bovendrempel</text>
<text x="380" y="238" font-family="DM Sans" font-size="9" fill="#55606F">→ automatisch samenvoegen</text>
<text x="380" y="256" font-family="DM Sans" font-size="9.5" fill="#E9A13B" font-weight="bold">Tussenzone</text>
<text x="380" y="270" font-family="DM Sans" font-size="9" fill="#55606F">→ naar steward-queue</text>

<!-- arrow Matchen -> Survivorship (automatic path) -->
<line x1="580" y1="200" x2="638" y2="200" stroke="#14213D" stroke-width="2" marker-end="url(#arrowF)"/>
<text x="609" y="190" font-family="DM Sans" font-size="9" fill="#55606F" text-anchor="middle">automatisch</text>

<!-- Survivorship box -->
<rect x="640" y="150" width="240" height="140" rx="8" fill="#FFFFFF" stroke="#14213D" stroke-width="1.5"/>
<text x="760" y="178" font-family="DM Sans" font-size="14" font-weight="bold" fill="#14213D" text-anchor="middle">Survivorship-regels</text>
<line x1="660" y1="196" x2="860" y2="196" stroke="#DFDCD3" stroke-width="1"/>
<text x="660" y="216" font-family="DM Sans" font-size="10" fill="#55606F">Bronprioriteit — IBAN</text>
<text x="660" y="234" font-family="DM Sans" font-size="10" fill="#55606F">Recentheid — adres, e-mail</text>
<text x="660" y="252" font-family="DM Sans" font-size="10" fill="#55606F">Volledigheid — leegste velden</text>
<text x="660" y="270" font-family="DM Sans" font-size="10" fill="#55606F">Per veld een eigen regel</text>

<!-- arrow Survivorship -> Golden record -->
<line x1="880" y1="200" x2="938" y2="200" stroke="#14213D" stroke-width="2" marker-end="url(#arrowF)"/>

<!-- Golden record box -->
<rect x="940" y="150" width="250" height="140" rx="8" fill="#FBF4E6" stroke="#E9A13B" stroke-width="2.5"/>
<text x="1065" y="180" font-family="DM Sans" font-size="15" font-weight="bold" fill="#14213D" text-anchor="middle">Golden record</text>
<text x="1065" y="198" font-family="DM Sans" font-size="9.5" fill="#55606F" text-anchor="middle">één samengestelde waarheid</text>
<line x1="960" y1="208" x2="1270" y2="208" stroke="#DFDCD3" stroke-width="1"/>
<text x="960" y="228" font-family="DM Sans" font-size="9.5" fill="#55606F">Bestaat nergens als zodanig</text>
<text x="960" y="244" font-family="DM Sans" font-size="9.5" fill="#55606F">in een bronsysteem</text>
<text x="960" y="264" font-family="DM Sans" font-size="9.5" fill="#55606F">Onderscheiden van het</text>
<text x="960" y="278" font-family="DM Sans" font-size="9.5" fill="#55606F">system of record per gegeven</text>

<!-- Fork: Matchen -> Queue -->
<line x1="450" y1="290" x2="450" y2="330" stroke="#E9A13B" stroke-width="2" marker-end="url(#arrowG)"/>
<text x="460" y="315" font-family="DM Sans" font-size="9.5" fill="#E9A13B" font-weight="bold">tussenzone</text>

<!-- Queue box -->
<rect x="330" y="336" width="290" height="120" rx="8" fill="#FBF4E6" stroke="#E9A13B" stroke-width="2" stroke-dasharray="7 4"/>
<text x="475" y="364" font-family="DM Sans" font-size="14" font-weight="bold" fill="#14213D" text-anchor="middle">Queue</text>
<text x="475" y="382" font-family="DM Sans" font-size="10" fill="#55606F" text-anchor="middle">wacht op de steward</text>
<line x1="350" y1="392" x2="600" y2="392" stroke="#DFDCD3" stroke-width="1"/>
<text x="350" y="412" font-family="DM Sans" font-size="9.5" fill="#55606F">Meridiaan: enkele tientallen/maand</text>
<text x="350" y="428" font-family="DM Sans" font-size="9.5" fill="#55606F">Termijn: 5 werkdagen, dan escalatie</text>
<text x="350" y="444" font-family="DM Sans" font-size="9.5" fill="#55606F">Steward beslist handmatig</text>

<!-- Queue -> Survivorship join -->
<line x1="620" y1="396" x2="760" y2="396" stroke="#E9A13B" stroke-width="2" stroke-dasharray="7 4"/>
<line x1="760" y1="396" x2="760" y2="292" stroke="#E9A13B" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#arrowG)"/>
<text x="770" y="350" font-family="DM Sans" font-size="9.5" fill="#E9A13B" font-weight="bold">steward beslist</text>

<!-- Feedback loop to source -->
<path d="M 1065 290 L 1065 500 L 200 500 L 200 300" fill="none" stroke="#2563A8" stroke-width="2" stroke-dasharray="4 4" marker-end="url(#arrowF)"/>
<text x="632" y="516" font-family="DM Sans" font-size="10.5" fill="#2563A8" font-weight="bold" text-anchor="middle">terugkoppeling naar de bron — de duurste en enige houdbare keuze</text>

<!-- bottom callout -->
<rect x="70" y="560" width="1220" height="150" rx="8" fill="#F4F6F9" stroke="#DFDCD3" stroke-width="1"/>
<text x="90" y="588" font-family="DM Sans" font-size="12.5" font-weight="bold" fill="#14213D">Blocking, niet alles-met-alles</text>
<text x="90" y="608" font-family="DM Sans" font-size="11" fill="#55606F">Bij 380.000 deelnemers is elk record met elk ander vergelijken zeventig miljard vergelijkingen. Blocking beperkt de</text>
<text x="90" y="624" font-family="DM Sans" font-size="11" fill="#55606F">vergelijking tot records die op één kenmerk overeenkomen, bijvoorbeeld geboortejaar of de eerste vier cijfers postcode.</text>
<text x="90" y="654" font-family="DM Sans" font-size="12.5" font-weight="bold" fill="#14213D">Asymmetrische schade</text>
<text x="90" y="674" font-family="DM Sans" font-size="11" fill="#55606F">Een onterechte match (twee mensen samengevoegd) is de duurste fout; een gemiste match (een dubbele blijft bestaan) is</text>
<text x="90" y="690" font-family="DM Sans" font-size="11" fill="#55606F">kleiner en onzichtbaar. De drempelwaarden hoger boven staan daarom bewust ver uit elkaar.</text>
</svg>
