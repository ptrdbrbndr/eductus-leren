<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="'DM Sans', Arial, sans-serif" width="960" height="480" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:12px; font-weight:700; fill:#14213D; }
      .label-light { font-size:12px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:11px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-d { stroke:#E9A13B; stroke-width:2; stroke-dasharray:4 3; fill:none; marker-end:url(#arra); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#E9A13B"/></marker>
</defs>
<rect width="960" height="480" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 13 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">De content enricher</text>
<text x="40" y="96" class="sub">Verrijking als expliciete stap, met een uitkomst voor als het misgaat.</text>

<rect x="50" y="200" width="150" height="60" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="125" y="235" text-anchor="middle" class="label" font-size="11">bron</text>
<line x1="200" y1="230" x2="290" y2="230" class="arrow"/>

<rect x="300" y="190" width="180" height="80" rx="8" fill="#2563A8"/>
<text x="390" y="220" text-anchor="middle" class="label-light">content enricher</text>
<line x1="390" y1="270" x2="390" y2="330" class="arrow"/>
<rect x="310" y="330" width="160" height="50" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="390" y="360" text-anchor="middle" class="sub" font-size="10.5">personeelssysteem</text>

<polygon points="560,230 610,255 560,280 510,255" fill="#6FA3D6" stroke="#2563A8" stroke-width="1.5"/>
<text x="560" y="260" text-anchor="middle" class="label" font-size="9">gelukt?</text>
<line x1="480" y1="230" x2="510" y2="248" class="arrow"/>

<line x1="610" y1="245" x2="700" y2="180" class="arrow"/>
<rect x="710" y="150" width="200" height="60" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="810" y="176" text-anchor="middle" class="sub" font-size="10.5">bestemming</text>
<text x="810" y="196" text-anchor="middle" class="sub" font-size="10.5">compleet bericht</text>

<line x1="610" y1="265" x2="700" y2="330" class="arrow-d"/>
<rect x="710" y="300" width="200" height="60" rx="8" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
<text x="810" y="326" text-anchor="middle" class="sub" fill="#9A5F0D" font-size="10">verrijkingOnvolledig: true</text>
<text x="810" y="346" text-anchor="middle" class="sub" fill="#9A5F0D" font-size="10">→ dead letter channel</text>

<text x="480" y="440" text-anchor="middle" class="sub" fill="#9A5F0D">het bericht gaat altijd door — mislukte verrijking is zichtbaar gemarkeerd, niet stilzwijgend</text>
</svg>
