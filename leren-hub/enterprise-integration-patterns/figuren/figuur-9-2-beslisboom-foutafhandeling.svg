<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="'DM Sans', Arial, sans-serif" width="960" height="500" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:12px; font-weight:700; fill:#14213D; }
      .sub { font-size:11px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#2563A8; stroke-width:1.5; fill:none; marker-end:url(#arrb); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563A8"/></marker>
</defs>
<rect width="960" height="500" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 9 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Beslisboom: bericht mislukt</text>
<text x="40" y="96" class="sub">Structureel ongeldig gaat één kant op, een tijdelijk falen de andere.</text>

<rect x="380" y="120" width="200" height="45" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="480" y="147" text-anchor="middle" class="label" font-size="11">bericht mislukt</text>

<line x1="480" y1="165" x2="480" y2="195" class="arrow"/>
<rect x="360" y="195" width="240" height="45" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="480" y="222" text-anchor="middle" class="label" font-size="11">structureel ongeldig?</text>

<line x1="420" y1="240" x2="250" y2="290" class="arrow"/>
<text x="320" y="265" class="sub">ja</text>
<rect x="120" y="290" width="260" height="55" rx="6" fill="#FBFAF7" stroke="#E9A13B" stroke-width="2"/>
<text x="250" y="313" text-anchor="middle" class="sub" fill="#9A5F0D" font-size="11">invalid message channel</text>
<text x="250" y="331" text-anchor="middle" class="sub" fill="#9A5F0D" font-size="10">bron corrigeren</text>

<line x1="540" y1="240" x2="700" y2="290" class="arrow"/>
<text x="650" y="265" class="sub">nee</text>
<rect x="580" y="290" width="240" height="45" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="700" y="317" text-anchor="middle" class="label" font-size="11">retry met backoff</text>

<line x1="700" y1="335" x2="700" y2="365" class="arrow"/>
<rect x="580" y="365" width="240" height="45" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="700" y="392" text-anchor="middle" class="label" font-size="11">na X pogingen nog mislukt?</text>

<line x1="700" y1="410" x2="700" y2="440" class="arrow"/>
<rect x="560" y="440" width="280" height="50" rx="6" fill="#14213D"/>
<text x="700" y="463" text-anchor="middle" class="sub" fill="#FBFAF7" font-size="11">dead letter channel</text>
<text x="700" y="480" text-anchor="middle" class="sub" fill="#DFDCD3" font-size="10">monitoren, oorzaak verhelpen, dan replay</text>
</svg>
