<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'DM Sans', Arial, sans-serif" width="960" height="460" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:12px; font-weight:700; fill:#14213D; }
      .sub { font-size:11px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    </style>
</defs>
<rect width="960" height="460" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 14 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Drie endpoints, drie graden van vermenging</text>
<text x="40" y="96" class="sub">Dezelfde scheiding tussen messaging en applicatielogica — maar niet even scherp getrokken.</text>

<rect x="60" y="150" width="240" height="220" rx="10" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="180" y="178" text-anchor="middle" class="label" font-size="12">KERN</text>
<rect x="80" y="195" width="200" height="65" fill="#FBFAF7" stroke="none"/>
<text x="180" y="230" text-anchor="middle" class="sub" font-size="10">messaginglogica</text>
<line x1="80" y1="263" x2="280" y2="263" stroke="#2563A8" stroke-width="1.5"/>
<rect x="80" y="266" width="200" height="90" fill="#FBFAF7" stroke="none"/>
<text x="180" y="315" text-anchor="middle" class="sub" font-size="10">applicatielogica</text>
<text x="180" y="400" text-anchor="middle" class="sub" fill="#9A5F0D" font-size="10.5">dunne, scherpe scheidslijn</text>

<rect x="360" y="150" width="240" height="220" rx="10" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="480" y="178" text-anchor="middle" class="label" font-size="12">Nabestaandenloket</text>
<rect x="380" y="195" width="200" height="55" fill="#FBFAF7" stroke="none"/>
<text x="480" y="225" text-anchor="middle" class="sub" font-size="10">messaginglogica</text>
<rect x="380" y="253" width="200" height="18" fill="#2563A8"/>
<text x="480" y="266" text-anchor="middle" class="sub" fill="#FBFAF7" font-size="8.5">messaging mapper</text>
<rect x="380" y="274" width="200" height="82" fill="#FBFAF7" stroke="none"/>
<text x="480" y="320" text-anchor="middle" class="sub" font-size="10">applicatielogica</text>
<text x="480" y="400" text-anchor="middle" class="sub" fill="#9A5F0D" font-size="10.5">dikker, met expliciete vertaallaag</text>

<rect x="660" y="150" width="240" height="220" rx="10" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="780" y="178" text-anchor="middle" class="label" font-size="12">Wegwijzer</text>
<rect x="680" y="195" width="200" height="150" fill="url(#blur)" stroke="none"/>
<defs><linearGradient id="blur" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#FBFAF7"/><stop offset="0.5" stop-color="#D9D5C8"/><stop offset="1" stop-color="#FBFAF7"/>
</linearGradient></defs>
<text x="780" y="255" text-anchor="middle" class="sub" font-size="9.5">messaging- en applicatielogica</text>
<text x="780" y="270" text-anchor="middle" class="sub" font-size="9.5">door elkaar heen verweven</text>
<text x="780" y="400" text-anchor="middle" class="sub" fill="#9A5F0D" font-size="10.5">vervaagd — geen scheiding meer te zien</text>
</svg>
