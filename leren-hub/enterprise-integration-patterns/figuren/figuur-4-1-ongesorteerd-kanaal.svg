<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="'DM Sans', Arial, sans-serif" width="960" height="420" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:13px; font-weight:700; fill:#14213D; }
      .sub { font-size:12px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563A8"/></marker>
</defs>
<rect width="960" height="420" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 4 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Eén kanaal, drie berichttypen, geen onderscheid</text>
<text x="40" y="96" class="sub">Alles stroomt ongefilterd naar KERN — ook wat een extra validatiestap mist.</text>

<rect x="60" y="160" width="160" height="45" rx="6" fill="#CBDCEF"/><text x="140" y="188" text-anchor="middle" class="sub" font-size="11">adreswijziging</text>
<rect x="60" y="215" width="160" height="45" rx="6" fill="#CBDCEF"/><text x="140" y="243" text-anchor="middle" class="sub" font-size="11">dienstverbandmutatie</text>
<rect x="60" y="270" width="160" height="45" rx="6" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/><text x="140" y="298" text-anchor="middle" class="sub" fill="#9A5F0D" font-size="11">salariscorrectie</text>

<line x1="220" y1="182" x2="700" y2="220" class="arrow"/>
<line x1="220" y1="237" x2="700" y2="222" class="arrow"/>
<line x1="220" y1="292" x2="700" y2="225" class="arrow" stroke="#E9A13B"/>
<circle cx="500" cy="221" r="7" fill="#E9A13B"/>
<text x="500" y="250" text-anchor="middle" class="sub" fill="#9A5F0D" font-size="10">ontbrekende validatiestap</text>

<rect x="710" y="185" width="190" height="70" rx="8" fill="#2563A8"/>
<text x="805" y="225" text-anchor="middle" fill="#FBFAF7" font-weight="700" font-size="14">KERN</text>

<text x="480" y="360" text-anchor="middle" class="sub" fill="#9A5F0D">een salariscorrectie vraagt om een andere behandeling dan een adreswijziging</text>
</svg>
