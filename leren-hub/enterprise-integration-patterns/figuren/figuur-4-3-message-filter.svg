<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="'DM Sans', Arial, sans-serif" width="960" height="420" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:13px; font-weight:700; fill:#14213D; }
      .sub { font-size:12px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563A8"/></marker>
</defs>
<rect width="960" height="420" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 4 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">De message filter als trechter</text>
<text x="40" y="96" class="sub">Onder de €5.000 stroomt door; erboven wacht het op goedkeuring.</text>

<rect x="60" y="150" width="140" height="40" rx="6" fill="#CBDCEF"/><text x="130" y="175" text-anchor="middle" class="sub" font-size="10">€1.200</text>
<rect x="60" y="200" width="140" height="40" rx="6" fill="#CBDCEF"/><text x="130" y="225" text-anchor="middle" class="sub" font-size="10">€3.800</text>
<rect x="60" y="250" width="140" height="40" rx="6" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/><text x="130" y="275" text-anchor="middle" class="sub" fill="#9A5F0D" font-size="10">€8.500</text>

<polygon points="240,140 480,140 400,240 320,240" fill="#6FA3D6" stroke="#2563A8" stroke-width="1.5"/>
<text x="360" y="200" text-anchor="middle" class="label" font-size="11" fill="#14213D">filter</text>
<text x="360" y="218" text-anchor="middle" class="sub" font-size="9">grens: €5.000</text>

<line x1="360" y1="240" x2="360" y2="290" class="arrow"/>
<rect x="270" y="290" width="180" height="45" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="360" y="318" text-anchor="middle" class="sub" font-size="11">stroomt door naar KERN</text>

<line x1="420" y1="150" x2="600" y2="150" class="arrow" stroke="#E9A13B"/>
<rect x="610" y="125" width="230" height="50" rx="6" fill="#FBFAF7" stroke="#E9A13B" stroke-width="2"/>
<text x="725" y="155" text-anchor="middle" class="sub" fill="#9A5F0D" font-size="11">wachtpunt: "wacht op goedkeuring"</text>

<text x="480" y="380" text-anchor="middle" class="sub" fill="#9A5F0D">bedrag boven de grens houdt het proces expliciet vast, in plaats van door te laten</text>
</svg>
