<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="'DM Sans', Arial, sans-serif" width="960" height="440" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:13px; font-weight:700; fill:#14213D; }
      .sub { font-size:11px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    </style>
</defs>
<rect width="960" height="440" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 7 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Drie balansen, drie manieren van doorslaan</text>
<text x="40" y="96" class="sub">Exactly-once staat in balans — tegen een prijs.</text>

<line x1="130" y1="250" x2="230" y2="150" stroke="#2563A8" stroke-width="2"/>
<line x1="70" y1="150" x2="190" y2="150" stroke="#2563A8" stroke-width="2"/>
<line x1="70" y1="230" x2="70" y2="150" stroke="#2563A8" stroke-width="1"/>
<line x1="190" y1="150" x2="190" y2="230" stroke="#2563A8" stroke-width="1"/>
<rect x="45" y="230" width="50" height="12" fill="#E9A13B"/>
<rect x="165" y="245" width="50" height="8" fill="#6FA3D6"/>
<text x="130" y="280" text-anchor="middle" class="label" font-size="12">at-most-once</text>
<text x="130" y="298" text-anchor="middle" class="sub" fill="#9A5F0D">weegt door: berichtverlies</text>

<line x1="430" y1="250" x2="530" y2="150" stroke="#2563A8" stroke-width="2"/>
<line x1="370" y1="150" x2="490" y2="150" stroke="#2563A8" stroke-width="2"/>
<line x1="370" y1="150" x2="370" y2="245" stroke="#2563A8" stroke-width="1"/>
<line x1="490" y1="150" x2="490" y2="225" stroke="#2563A8" stroke-width="1"/>
<rect x="345" y="245" width="50" height="10" fill="#6FA3D6"/>
<rect x="465" y="225" width="50" height="12" fill="#E9A13B"/>
<text x="430" y="280" text-anchor="middle" class="label" font-size="12">at-least-once</text>
<text x="430" y="298" text-anchor="middle" class="sub" fill="#9A5F0D">weegt door: dubbele aflevering</text>

<line x1="730" y1="250" x2="830" y2="150" stroke="#2563A8" stroke-width="2"/>
<line x1="670" y1="150" x2="790" y2="150" stroke="#2563A8" stroke-width="2"/>
<line x1="670" y1="150" x2="670" y2="230" stroke="#2563A8" stroke-width="1"/>
<line x1="790" y1="150" x2="790" y2="230" stroke="#2563A8" stroke-width="1"/>
<rect x="645" y="230" width="50" height="10" fill="#6FA3D6"/>
<rect x="765" y="230" width="50" height="10" fill="#6FA3D6"/>
<rect x="700" y="120" width="60" height="20" fill="#14213D"/>
<text x="730" y="110" text-anchor="middle" class="sub" font-size="10">coördinatiekosten</text>
<text x="730" y="280" text-anchor="middle" class="label" font-size="12">exactly-once</text>
<text x="730" y="298" text-anchor="middle" class="sub">in balans — tegen een zwaar gewicht</text>

<text x="480" y="380" text-anchor="middle" class="sub" fill="#9A5F0D">geen van de drie is gratis; de keuze is welke prijs past bij de mutatie</text>
</svg>
