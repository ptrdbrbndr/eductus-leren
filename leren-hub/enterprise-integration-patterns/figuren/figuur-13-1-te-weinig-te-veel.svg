<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="'DM Sans', Arial, sans-serif" width="960" height="420" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:13px; font-weight:700; fill:#14213D; }
      .sub { font-size:12px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    </style>
</defs>
<rect width="960" height="420" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 13 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Te weinig, of te veel</text>
<text x="40" y="96" class="sub">Transformatie mislukt zelden luid — meestal ontbreekt of overvloeit iets stil.</text>

<rect x="90" y="150" width="330" height="180" rx="10" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="255" y="180" text-anchor="middle" class="label" font-size="12">bericht — te weinig</text>
<text x="120" y="215" class="sub" font-size="11">deelnemerId: "48213"</text>
<text x="120" y="240" class="sub" font-size="11">bedrag: 1240.00</text>
<text x="120" y="265" class="sub" font-size="11">ingangsdatum: —</text>
<circle cx="360" cy="260" r="16" fill="#FBFAF7" stroke="#E9A13B" stroke-width="2.5"/>
<text x="360" y="266" text-anchor="middle" fill="#9A5F0D" font-weight="700" font-size="16">?</text>
<text x="255" y="305" text-anchor="middle" class="sub" fill="#9A5F0D" font-size="10.5">verplicht veld ontbreekt</text>

<rect x="540" y="150" width="330" height="180" rx="10" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="705" y="180" text-anchor="middle" class="label" font-size="12">bericht — te veel</text>
<rect x="640" y="200" width="130" height="90" rx="6" fill="#FBFAF7" stroke="#E9A13B" stroke-width="2.5"/>
<line x1="680" y1="200" x2="680" y2="190" stroke="#E9A13B" stroke-width="4"/>
<line x1="700" y1="200" x2="700" y2="190" stroke="#E9A13B" stroke-width="4"/>
<text x="705" y="250" text-anchor="middle" fill="#9A5F0D" font-size="10">interne velden,</text>
<text x="705" y="265" text-anchor="middle" fill="#9A5F0D" font-size="10">debug-info,</text>
<text x="705" y="280" text-anchor="middle" fill="#9A5F0D" font-size="10">systeemmetadata…</text>
<text x="705" y="305" text-anchor="middle" class="sub" fill="#9A5F0D" font-size="10.5">koffer puilt uit — ontvanger krijgt meer dan nodig</text>

<text x="480" y="380" text-anchor="middle" class="sub" fill="#9A5F0D">beide vormen breken de aanname dat "compleet" en "gepast" hetzelfde zijn</text>
