<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="'DM Sans', Arial, sans-serif" width="1000" height="520" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:11px; font-weight:700; fill:#14213D; }
      .sub { font-size:10.5px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563A8"/></marker>
</defs>
<rect width="1000" height="520" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 26 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Eén giftig dossier blokkeert de hele wachtrij</text>
<text x="40" y="96" class="sub">De rekenkern loopt vast in een lus; negen gezonde dossiers wachten erachter.</text>

<rect x="60" y="150" width="60" height="50" rx="6" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
<text x="90" y="180" text-anchor="middle" class="label" font-size="10" fill="#9A5F0D">poison</text>
<g>
<rect x="130" y="155" width="50" height="40" rx="5" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.2"/>
<rect x="190" y="155" width="50" height="40" rx="5" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.2"/>
<rect x="250" y="155" width="50" height="40" rx="5" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.2"/>
<rect x="310" y="155" width="50" height="40" rx="5" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.2"/>
<rect x="370" y="155" width="50" height="40" rx="5" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.2"/>
<rect x="430" y="155" width="50" height="40" rx="5" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.2"/>
<rect x="490" y="155" width="50" height="40" rx="5" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.2"/>
<rect x="550" y="155" width="50" height="40" rx="5" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.2"/>
<rect x="610" y="155" width="50" height="40" rx="5" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.2"/>
</g>
<text x="365" y="220" text-anchor="middle" class="sub">negen gezonde dossiers wachten in de rij</text>

<line x1="90" y1="200" x2="90" y2="250" class="arrow"/>
<circle cx="90" cy="290" r="40" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
<text x="90" y="285" text-anchor="middle" class="sub" fill="#9A5F0D" font-size="9">rekenkern</text>
<text x="90" y="298" text-anchor="middle" class="sub" fill="#9A5F0D" font-size="9">lus / crash</text>
<path d="M 60,320 A 35 35 0 1 0 55,290" fill="none" stroke="#E9A13B" stroke-width="2" marker-end="url(#arrb)"/>

<line x1="90" y1="340" x2="900" y2="340" stroke="#55606F" stroke-width="1" stroke-dasharray="2 3"/>
<text x="900" y="335" text-anchor="end" class="sub" font-size="9">tijd →</text>
<rect x="90" y="360" width="20" height="18" fill="#2563A8"/><text x="120" y="374" class="sub" font-size="9">t0 — poison arriveert</text>
<rect x="240" y="360" width="80" height="18" fill="#E9A13B" fill-opacity="0.4"/><text x="330" y="374" class="sub" font-size="9">vertraging loopt op</text>
<rect x="480" y="360" width="200" height="18" fill="#E9A13B" fill-opacity="0.6"/><text x="690" y="374" class="sub" font-size="9">volledige stilstand</text>

<text x="500" y="440" text-anchor="middle" class="sub" fill="#9A5F0D">zonder isolatie van de poison message stopt de hele keten, niet alleen dat ene dossier</text>
</svg>
