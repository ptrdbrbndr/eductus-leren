<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="'DM Sans', Arial, sans-serif" width="960" height="440" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:12px; font-weight:700; fill:#14213D; }
      .label-light { font-size:12px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:11px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-d { stroke:#E9A13B; stroke-width:2; stroke-dasharray:4 3; fill:none; marker-end:url(#arra); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#E9A13B"/></marker>
</defs>
<rect width="960" height="440" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 15 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">De smart proxy als bewakende tussenlaag</text>
<text x="40" y="96" class="sub">Uitgaand geregistreerd, inkomend gekoppeld, termijnoverschrijding automatisch gemeld.</text>

<rect x="60" y="180" width="170" height="60" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="145" y="215" text-anchor="middle" class="label" font-size="11">Meridiaan (KERN)</text>

<line x1="230" y1="200" x2="370" y2="200" class="arrow"/>
<text x="300" y="190" text-anchor="middle" class="sub" font-size="9.5">uitgaand, tijdstempel t0</text>

<rect x="380" y="150" width="220" height="140" rx="8" fill="#2563A8"/>
<text x="490" y="180" text-anchor="middle" class="label-light">smart proxy</text>
<text x="490" y="205" text-anchor="middle" class="sub" fill="#DFDCD3" font-size="9.5">registreert verzendtijd</text>
<text x="490" y="222" text-anchor="middle" class="sub" fill="#DFDCD3" font-size="9.5">koppelt antwoord via correlatie-ID</text>
<text x="490" y="239" text-anchor="middle" class="sub" fill="#DFDCD3" font-size="9.5">bewaakt de termijn</text>

<line x1="600" y1="220" x2="740" y2="220" class="arrow"/>
<text x="670" y="210" text-anchor="middle" class="sub" font-size="9.5">inkomend antwoord</text>
<rect x="750" y="180" width="170" height="60" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="835" y="207" text-anchor="middle" class="label" font-size="10">externe</text>
<text x="835" y="223" text-anchor="middle" class="label" font-size="10">administrateur</text>

<line x1="490" y1="290" x2="490" y2="350" class="arrow-d"/>
<rect x="370" y="350" width="240" height="50" rx="6" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2"/>
<text x="490" y="378" text-anchor="middle" class="sub" fill="#9A5F0D" font-size="10.5">signalering naar control bus (15.1) bij termijnoverschrijding</text>
</svg>
