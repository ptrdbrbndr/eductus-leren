<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="'DM Sans', Arial, sans-serif" width="960" height="420" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:12px; font-weight:700; fill:#14213D; }
      .label-light { font-size:12px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:11px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563A8"/></marker>
</defs>
<rect width="960" height="420" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 16 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Eén kanaal, twee onafhankelijke leesposities</text>
<text x="40" y="96" class="sub">Consumer groups lezen los van elkaar — binnen een groep verdelen instanties het werk.</text>

<rect x="60" y="180" width="250" height="60" rx="8" fill="#2563A8"/>
<text x="185" y="215" text-anchor="middle" class="label-light">kanaal: mutaties</text>

<line x1="310" y1="200" x2="420" y2="150" class="arrow"/>
<line x1="310" y1="220" x2="420" y2="290" class="arrow"/>

<rect x="430" y="110" width="260" height="110" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="560" y="135" text-anchor="middle" class="label" font-size="11">consumer group: Nabestaandenloket</text>
<text x="560" y="155" text-anchor="middle" class="sub" font-size="9.5">eigen leespositie</text>
<rect x="450" y="170" width="100" height="35" rx="6" fill="#FBFAF7" stroke="#2563A8" stroke-width="1.2"/><text x="500" y="192" text-anchor="middle" class="sub" font-size="9">instantie 1</text>
<rect x="560" y="170" width="100" height="35" rx="6" fill="#FBFAF7" stroke="#2563A8" stroke-width="1.2"/><text x="610" y="192" text-anchor="middle" class="sub" font-size="9">instantie 2</text>
<text x="560" y="215" text-anchor="middle" class="sub" fill="#9A5F0D" font-size="9">verdelen de belasting onderling</text>

<rect x="430" y="260" width="260" height="70" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="560" y="290" text-anchor="middle" class="label" font-size="11">consumer group: audit-trail</text>
<text x="560" y="310" text-anchor="middle" class="sub" font-size="9.5">eigen, onafhankelijke leespositie</text>

<text x="480" y="380" text-anchor="middle" class="sub" fill="#9A5F0D">beide groepen lezen dezelfde stroom, elk op hun eigen tempo</text>
</svg>
