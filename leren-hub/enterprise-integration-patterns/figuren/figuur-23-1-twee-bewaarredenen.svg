<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'DM Sans', Arial, sans-serif" width="960" height="460" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:12px; font-weight:700; fill:#14213D; }
      .sub { font-size:11px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    </style>
</defs>
<rect width="960" height="460" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 23 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Twee bewaarredenen, twee tijdshorizonnen</text>
<text x="40" y="96" class="sub">Operationeel gemak vervalt; wettelijke verantwoording moet reconstrueerbaar blijven.</text>

<rect x="80" y="150" width="360" height="230" rx="10" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="260" y="185" text-anchor="middle" class="label" font-size="13">operationeel gemak</text>
<text x="260" y="210" text-anchor="middle" class="sub">niveau 2 — praktische termijn</text>
<line x1="120" y1="230" x2="400" y2="230" stroke="#2563A8" stroke-width="1"/>
<text x="260" y="260" text-anchor="middle" class="sub">retentie: weken tot maanden</text>
<text x="260" y="282" text-anchor="middle" class="sub">doel: debuggen, herstellen, monitoren</text>
<text x="260" y="304" text-anchor="middle" class="sub" fill="#9A5F0D">kan vervallen zodra het doel vervalt</text>

<rect x="520" y="150" width="360" height="230" rx="10" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2"/>
<text x="700" y="185" text-anchor="middle" class="label" font-size="13">wettelijke verantwoording</text>
<text x="700" y="210" text-anchor="middle" class="sub">niveau 3 — potentieel permanent</text>
<line x1="560" y1="230" x2="840" y2="230" stroke="#E9A13B" stroke-width="1"/>
<text x="700" y="260" text-anchor="middle" class="sub">retentie: jaren, soms onbeperkt</text>
<text x="700" y="282" text-anchor="middle" class="sub">doel: reconstrueren wat is gebeurd, en waarom</text>
<text x="700" y="304" text-anchor="middle" class="sub" fill="#9A5F0D">moet bewijsbaar blijven, ook na jaren</text>

<text x="480" y="430" text-anchor="middle" class="sub" fill="#9A5F0D">dezelfde events, twee heel verschillende bewaarplichten</text>
</svg>
