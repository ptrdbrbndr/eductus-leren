<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="'DM Sans', Arial, sans-serif" width="960" height="400" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:11px; font-weight:700; fill:#14213D; }
      .sub { font-size:11px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563A8"/></marker>
</defs>
<rect width="960" height="400" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 18 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Geen technisch "terug" over systeemgrenzen</text>
<text x="40" y="96" class="sub">Vijf lokale databases, vijf eigen commits — een rollback bestaat hier niet.</text>

<g font-size="9.5">
<rect x="60" y="200" width="140" height="60" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/><text x="130" y="225" text-anchor="middle" class="label" font-size="10">1. Portaal</text><text x="130" y="242" text-anchor="middle" class="sub" font-size="8.5">eigen db</text>
<rect x="240" y="200" width="140" height="60" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/><text x="310" y="225" text-anchor="middle" class="label" font-size="10">2. KERN</text><text x="310" y="242" text-anchor="middle" class="sub" font-size="8.5">eigen db</text>
<rect x="420" y="200" width="140" height="60" rx="6" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/><text x="490" y="225" text-anchor="middle" class="label" font-size="10" fill="#9A5F0D">3. Fraudecontrole</text><text x="490" y="242" text-anchor="middle" class="sub" font-size="8.5" fill="#9A5F0D">faalt hier</text>
<rect x="600" y="200" width="140" height="60" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/><text x="670" y="225" text-anchor="middle" class="label" font-size="10">4. Administrateur</text><text x="670" y="242" text-anchor="middle" class="sub" font-size="8.5">eigen db</text>
<rect x="780" y="200" width="140" height="60" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/><text x="850" y="225" text-anchor="middle" class="label" font-size="10">5. Deelnemer</text><text x="850" y="242" text-anchor="middle" class="sub" font-size="8.5">eigen db</text>
</g>
<line x1="200" y1="230" x2="240" y2="230" class="arrow"/>
<line x1="380" y1="230" x2="420" y2="230" class="arrow"/>
<line x1="560" y1="230" x2="600" y2="230" class="arrow"/>
<line x1="740" y1="230" x2="780" y2="230" class="arrow"/>

<path d="M420,180 C350,150 280,150 205,178" stroke="#E9A13B" stroke-width="2" fill="none"/>
<line x1="420" y1="175" x2="435" y2="182" stroke="#E9A13B" stroke-width="2"/><line x1="435" y1="175" x2="420" y2="182" stroke="#E9A13B" stroke-width="2"/>
<path d="M420,190 C395,165 340,163 315,178" stroke="#E9A13B" stroke-width="2" fill="none"/>
<line x1="420" y1="185" x2="432" y2="192" stroke="#E9A13B" stroke-width="2"/><line x1="432" y1="185" x2="420" y2="192" stroke="#E9A13B" stroke-width="2"/>

<text x="480" y="330" text-anchor="middle" class="sub" fill="#9A5F0D">de doorgestreepte pijlen bestaan niet — stap 1 en 2 hebben al gecommit in hun eigen database</text>
</svg>
