    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arrm" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
  </defs>
<rect width="960" height="640" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 26 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Voorbeeldvraag, herformulering, antwoord</text>
<text x="40" y="96" class="sub">Een voorbeeldvraag naast de technisch precieze herformulering en het antwoord.</text>
<rect x="50" y="240" width="269.3333333333333" height="100" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/><text x="184.66666666666666" y="295" text-anchor="middle" class="label">Vraag van het board</text><line x1="319.3333333333333" y1="290" x2="345.3333333333333" y2="290" class="arrow"/><rect x="345.3333333333333" y="240" width="269.3333333333333" height="100" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/><text x="480" y="295" text-anchor="middle" class="label">Technisch precieze herformulering</text><line x1="614.6666666666666" y1="290" x2="640.6666666666666" y2="290" class="arrow"/><rect x="640.6666666666666" y="240" width="269.3333333333333" height="100" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/><text x="775.3333333333333" y="295" text-anchor="middle" class="label">Antwoord</text>
<rect x="40" y="560" width="880" height="60" rx="8" fill="#14213D"/>
      <text x="480" y="586" text-anchor="middle" class="label-light">De board-vraag en het technische antwoord raken elkaar pas na een herformulering.</text>
      
