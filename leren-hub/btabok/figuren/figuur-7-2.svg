<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'DM Sans', Arial, sans-serif" width="960" height="640" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:19px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.10em; }
      .arrow { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-muted { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arrm); }
      .arrow-amber { stroke:#E9A13B; stroke-width:2; fill:none; marker-end:url(#arra); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arrm" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
  </defs>
<rect width="960" height="640" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 7 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Drie views van hetzelfde besluit</text>
<text x="40" y="96" class="sub">Bestuurlijk, functioneel, technisch — met per view wat wél en niet is opgenomen.</text>
<rect x="210" y="175" width="345" height="34" rx="4" fill="#14213D" stroke="#14213D" stroke-width="1.5"/><text x="382.5" y="196" text-anchor="middle" class="label-light">Wat erin staat</text><rect x="555" y="175" width="345" height="34" rx="4" fill="#14213D" stroke="#14213D" stroke-width="1.5"/><text x="727.5" y="196" text-anchor="middle" class="label-light">Wat niet</text><rect x="60" y="209" width="150" height="48" rx="4" fill="#F4F2EC" stroke="#DFDCD3" stroke-width="1"/><text x="135" y="237" text-anchor="middle" class="label">Bestuurlijk</text><rect x="210" y="209" width="345" height="48" rx="4" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/><text x="382.5" y="237" text-anchor="middle" class="sub">Besluit,</text>
<text x="382.5" y="249" text-anchor="middle" class="sub">kosten, risico</text>
<text x="382.5" y="261" text-anchor="middle" class="sub">bij</text>
<text x="382.5" y="273" text-anchor="middle" class="sub">niet-besluiten</text><rect x="555" y="209" width="345" height="48" rx="4" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/><text x="727.5" y="237" text-anchor="middle" class="sub">Technische</text>
<text x="727.5" y="249" text-anchor="middle" class="sub">termen,</text>
<text x="727.5" y="261" text-anchor="middle" class="sub">broncode,</text>
<text x="727.5" y="273" text-anchor="middle" class="sub">notatie</text><rect x="60" y="257" width="150" height="48" rx="4" fill="#F4F2EC" stroke="#DFDCD3" stroke-width="1"/><text x="135" y="285" text-anchor="middle" class="label">Functioneel</text><rect x="210" y="257" width="345" height="48" rx="4" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/><text x="382.5" y="285" text-anchor="middle" class="sub">Wat verandert</text>
<text x="382.5" y="297" text-anchor="middle" class="sub">in het</text>
<text x="382.5" y="309" text-anchor="middle" class="sub">systeemgedrag,</text>
<text x="382.5" y="321" text-anchor="middle" class="sub">voor wie</text><rect x="555" y="257" width="345" height="48" rx="4" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/><text x="727.5" y="285" text-anchor="middle" class="sub">Implementatiedetails</text><rect x="60" y="305" width="150" height="48" rx="4" fill="#F4F2EC" stroke="#DFDCD3" stroke-width="1"/><text x="135" y="333" text-anchor="middle" class="label">Technisch</text><rect x="210" y="305" width="345" height="48" rx="4" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/><text x="382.5" y="333" text-anchor="middle" class="sub">Opzet,</text>
<text x="382.5" y="345" text-anchor="middle" class="sub">interfaces,</text>
<text x="382.5" y="357" text-anchor="middle" class="sub">afhankelijkheden</text><rect x="555" y="305" width="345" height="48" rx="4" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/><text x="727.5" y="333" text-anchor="middle" class="sub">Bestuurlijke</text>
<text x="727.5" y="345" text-anchor="middle" class="sub">overwegingen</text>
<rect x="40" y="560" width="880" height="60" rx="8" fill="#14213D"/>
      <text x="480" y="586" text-anchor="middle" class="label-light">Geen enkele view bevat alle drie de vragen — samen wel.</text>
      
</svg>