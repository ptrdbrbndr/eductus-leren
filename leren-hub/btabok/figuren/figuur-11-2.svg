<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'DM Sans', Arial, sans-serif" width="960" height="640" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:19px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.10em; }
      .arrow { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-muted { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arrm); }
      .arrow-amber { stroke:#E9A13B; stroke-width:2; fill:none; marker-end:url(#arra); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arrm" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
  </defs>
<rect width="960" height="640" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 11 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Van vier verzoeken naar drie diensten</text>
<text x="40" y="96" class="sub">De vier losse verzoeken hergroepeerd tot drie diensten — architectuurreview, ontwerpbegeleiding, technische</text>
<text x="40" y="114" class="sub">escalatie — met het aanwezigheidsverzoek dat vervalt.</text>
<rect x="110" y="192" width="200" height="36" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/><text x="210" y="215" text-anchor="middle" class="label">"Review deze API"</text><rect x="110" y="272" width="200" height="36" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/><text x="210" y="295" text-anchor="middle" class="label">"Ontwerp het datamodel"</text><rect x="110" y="352" width="200" height="36" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/><text x="210" y="375" text-anchor="middle" class="label">"Beslecht dit conflict"</text><rect x="110" y="432" width="200" height="36" rx="6" fill="#F4F2EC" stroke="#DFDCD3" stroke-width="1.5" stroke-dasharray="5,4"/><text x="210" y="455" text-anchor="middle" class="sub">"Wees er gewoon bij"</text><rect x="710" y="228" width="220" height="44" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="2"/><text x="820" y="255" text-anchor="middle" class="label">Architectuurreview — 2</text>
<text x="820" y="268" text-anchor="middle" class="label">werkdagen</text><rect x="710" y="328" width="220" height="44" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="2"/><text x="820" y="355" text-anchor="middle" class="label">Ontwerpbegeleiding — apart</text>
<text x="820" y="368" text-anchor="middle" class="label">traject</text><rect x="710" y="428" width="220" height="44" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="2"/><text x="820" y="455" text-anchor="middle" class="label">Technische escalatie —</text>
<text x="820" y="468" text-anchor="middle" class="label">vastgelegd besluit</text><path d="M310,210 C390,210 630,250 710,250" class="arrow-muted"/><path d="M310,290 C390,290 630,250 710,250" class="arrow-muted"/><path d="M310,370 C390,370 630,350 710,350" class="arrow-muted"/>
<rect x="40" y="560" width="880" height="60" rx="8" fill="#14213D"/>
      <text x="480" y="586" text-anchor="middle" class="label-light">Drie heldere diensten in plaats van vier losse verzoeken — en één die simpelweg vervalt.</text>
      
</svg>