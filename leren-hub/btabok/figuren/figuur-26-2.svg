<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'DM Sans', Arial, sans-serif" width="960" height="640" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:19px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.10em; }
      .arrow { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-muted { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arrm); }
      .arrow-amber { stroke:#E9A13B; stroke-width:2; fill:none; marker-end:url(#arra); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arrm" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
  </defs>
<rect width="960" height="640" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 26 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">De structuur van een boardpresentatie</text>
<text x="40" y="96" class="sub">Eén boodschap bovenaan, drie onderbouwingen eronder, elk met één cijfer.</text>
<rect x="350" y="190" width="260" height="54" rx="8" fill="#14213D" stroke="#14213D" stroke-width="1.5"/><text x="480" y="223" text-anchor="middle" class="label-light">Eén boodschap</text><line x1="480" y1="244" x2="218.66666666666669" y2="340" stroke="#DFDCD3" stroke-width="1.5"/><rect x="100" y="340" width="237.33333333333334" height="60" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/><text x="218.66666666666669" y="374" text-anchor="middle" class="label">Voortgang — 1</text>
<text x="218.66666666666669" y="388" text-anchor="middle" class="label">cijfer</text><line x1="480" y1="244" x2="480.00000000000006" y2="340" stroke="#DFDCD3" stroke-width="1.5"/><rect x="361.33333333333337" y="340" width="237.33333333333334" height="60" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/><text x="480.00000000000006" y="374" text-anchor="middle" class="label">Risico —</text>
<text x="480.00000000000006" y="388" text-anchor="middle" class="label">dekkingsgraad</text><line x1="480" y1="244" x2="741.3333333333334" y2="340" stroke="#DFDCD3" stroke-width="1.5"/><rect x="622.6666666666667" y="340" width="237.33333333333334" height="60" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/><text x="741.3333333333334" y="374" text-anchor="middle" class="label">Wat de raad moet</text>
<text x="741.3333333333334" y="388" text-anchor="middle" class="label">weten</text>
<rect x="40" y="560" width="880" height="60" rx="8" fill="#14213D"/>
      <text x="480" y="586" text-anchor="middle" class="label-light">Eén boodschap, drie cijfers — de rest is achtergrond die het board niet nodig heeft.</text>
      
</svg>