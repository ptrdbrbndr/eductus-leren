      <text x="480" y="586" text-anchor="middle" class="label-light">Alles binnen de lijn is scope, alles erbuiten is een geraakte partij.</text>
      <text x="480" y="606" text-anchor="middle" class="sub-light">Expliciet buiten scope: fiscaal advies, externe pensioenpotten, persoonlijk financieel advies.</text>
