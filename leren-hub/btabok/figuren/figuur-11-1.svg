<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'DM Sans', Arial, sans-serif" width="960" height="640" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:19px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.10em; }
      .arrow { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-muted { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arrm); }
      .arrow-amber { stroke:#E9A13B; stroke-width:2; fill:none; marker-end:url(#arra); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arrm" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
  </defs>
<rect width="960" height="640" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 11 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Twee weken, vier losse verzoeken</text>
<text x="40" y="96" class="sub">Binnen twee weken vragen drie teams en de programmadirecteur Claudette vier totaal verschillende dingen —</text>
<text x="40" y="114" class="sub">van 'review deze API' tot 'ontwerp het hele datamodel opnieuw'.</text>
<rect x="64" y="184" width="95" height="36" rx="5" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/><text x="112.5" y="203" text-anchor="middle" class="sub">"Review</text>
<text x="112.5" y="214" text-anchor="middle" class="sub">deze API"</text><rect x="169" y="184" width="95" height="36" rx="5" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/><text x="217.5" y="203" text-anchor="middle" class="sub">"Ontwerp</text>
<text x="217.5" y="214" text-anchor="middle" class="sub">het</text>
<text x="217.5" y="225" text-anchor="middle" class="sub">datamodel"</text><rect x="274" y="184" width="95" height="36" rx="5" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/><text x="322.5" y="203" text-anchor="middle" class="sub">"Beslecht</text>
<text x="322.5" y="214" text-anchor="middle" class="sub">dit</text>
<text x="322.5" y="225" text-anchor="middle" class="sub">conflict"</text><rect x="379" y="184" width="95" height="36" rx="5" fill="#FDECC8" stroke="#E9A13B" stroke-width="1.5"/><text x="427.5" y="203" text-anchor="middle" class="sub">"Wees er</text>
<text x="427.5" y="214" text-anchor="middle" class="sub">gewoon</text>
<text x="427.5" y="225" text-anchor="middle" class="sub">bij"</text>
<rect x="40" y="560" width="880" height="60" rx="8" fill="#14213D"/>
      <text x="480" y="586" text-anchor="middle" class="label-light">Vier verzoeken zonder patroon voelen als vier keer opnieuw beginnen.</text>
      
</svg>