<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'DM Sans', Arial, sans-serif" width="960" height="640" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:19px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.10em; }
      .arrow { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-muted { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arrm); }
      .arrow-amber { stroke:#E9A13B; stroke-width:2; fill:none; marker-end:url(#arra); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arrm" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
  </defs>
<rect width="960" height="640" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 10 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">De dossierstructuur</text>
<text x="40" y="96" class="sub">Zeven observaties, elk met dezelfde driedeling, plus een korte inleiding en afsluiting die de rode draad</text>
<text x="40" y="114" class="sub">benoemt.</text>
<rect x="210" y="175" width="230" height="34" rx="4" fill="#14213D" stroke="#14213D" stroke-width="1.5"/><text x="325" y="196" text-anchor="middle" class="label-light">Wat misging</text><rect x="440" y="175" width="230" height="34" rx="4" fill="#14213D" stroke="#14213D" stroke-width="1.5"/><text x="555" y="196" text-anchor="middle" class="label-light">Instrument</text><rect x="670" y="175" width="230" height="34" rx="4" fill="#14213D" stroke="#14213D" stroke-width="1.5"/><text x="785" y="196" text-anchor="middle" class="label-light">Nu structureel</text><rect x="60" y="209" width="150" height="44.42857142857143" rx="4" fill="#F4F2EC" stroke="#DFDCD3" stroke-width="1"/><text x="135" y="235.21428571428572" text-anchor="middle" class="label">O1</text><rect x="210" y="209" width="230" height="44.42857142857143" rx="4" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/><text x="325" y="235.21428571428572" text-anchor="middle" class="sub">Niemand kon in</text>
<text x="325" y="247.21428571428572" text-anchor="middle" class="sub">1 zin zeggen</text>
<text x="325" y="259.2142857142857" text-anchor="middle" class="sub">waarvoor ze</text>
<text x="325" y="271.2142857142857" text-anchor="middle" class="sub">zat</text><rect x="440" y="209" width="230" height="44.42857142857143" rx="4" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/><text x="555" y="235.21428571428572" text-anchor="middle" class="sub">De ene zin</text><rect x="670" y="209" width="230" height="44.42857142857143" rx="4" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/><text x="785" y="235.21428571428572" text-anchor="middle" class="sub">Profiel via de</text>
<text x="785" y="247.21428571428572" text-anchor="middle" class="sub">5 pijlers</text><rect x="60" y="253.42857142857144" width="150" height="44.42857142857143" rx="4" fill="#F4F2EC" stroke="#DFDCD3" stroke-width="1"/><text x="135" y="279.64285714285717" text-anchor="middle" class="label">O2</text><rect x="210" y="253.42857142857144" width="230" height="44.42857142857143" rx="4" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/><text x="325" y="279.64285714285717" text-anchor="middle" class="sub">Kende het</text>
<text x="325" y="291.64285714285717" text-anchor="middle" class="sub">verdienmodel</text>
<text x="325" y="303.64285714285717" text-anchor="middle" class="sub">niet</text><rect x="440" y="253.42857142857144" width="230" height="44.42857142857143" rx="4" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/><text x="555" y="279.64285714285717" text-anchor="middle" class="sub">Verdienmodelblad</text><rect x="670" y="253.42857142857144" width="230" height="44.42857142857143" rx="4" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/><text x="785" y="279.64285714285717" text-anchor="middle" class="sub">Vaste eenheid</text>
<text x="785" y="291.64285714285717" text-anchor="middle" class="sub">van waarde</text><rect x="60" y="297.8571428571429" width="150" height="44.42857142857143" rx="4" fill="#F4F2EC" stroke="#DFDCD3" stroke-width="1"/><text x="135" y="324.0714285714286" text-anchor="middle" class="label">O3</text><rect x="210" y="297.8571428571429" width="230" height="44.42857142857143" rx="4" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/><text x="325" y="324.0714285714286" text-anchor="middle" class="sub">Voorstellen</text>
<text x="325" y="336.0714285714286" text-anchor="middle" class="sub">strandden op</text>
<text x="325" y="348.0714285714286" text-anchor="middle" class="sub">kosten/baten</text><rect x="440" y="297.8571428571429" width="230" height="44.42857142857143" rx="4" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/><text x="555" y="324.0714285714286" text-anchor="middle" class="sub">Waarderingsblad</text><rect x="670" y="297.8571428571429" width="230" height="44.42857142857143" rx="4" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/><text x="785" y="324.0714285714286" text-anchor="middle" class="sub">Bandbreedte</text>
<text x="785" y="336.0714285714286" text-anchor="middle" class="sub">i.p.v. giswerk</text><rect x="60" y="342.2857142857143" width="150" height="44.42857142857143" rx="4" fill="#F4F2EC" stroke="#DFDCD3" stroke-width="1"/><text x="135" y="368.5" text-anchor="middle" class="label">O4</text><rect x="210" y="342.2857142857143" width="230" height="44.42857142857143" rx="4" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/><text x="325" y="368.5" text-anchor="middle" class="sub">Te laat</text>
<text x="325" y="380.5" text-anchor="middle" class="sub">betrokken, dan</text>
<text x="325" y="392.5" text-anchor="middle" class="sub">als toetser</text><rect x="440" y="342.2857142857143" width="230" height="44.42857142857143" rx="4" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/><text x="555" y="368.5" text-anchor="middle" class="sub">Stakeholderkaart</text><rect x="670" y="342.2857142857143" width="230" height="44.42857142857143" rx="4" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/><text x="785" y="368.5" text-anchor="middle" class="sub">Invloed ×</text>
<text x="785" y="380.5" text-anchor="middle" class="sub">betrokkenheid</text>
<text x="785" y="392.5" text-anchor="middle" class="sub">vooraf</text><rect x="60" y="386.7142857142857" width="150" height="44.42857142857143" rx="4" fill="#F4F2EC" stroke="#DFDCD3" stroke-width="1"/><text x="135" y="412.92857142857144" text-anchor="middle" class="label">O5</text><rect x="210" y="386.7142857142857" width="230" height="44.42857142857143" rx="4" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/><text x="325" y="412.92857142857144" text-anchor="middle" class="sub">Documenten</text>
<text x="325" y="424.92857142857144" text-anchor="middle" class="sub">kwamen niet</text>
<text x="325" y="436.92857142857144" text-anchor="middle" class="sub">aan</text><rect x="440" y="386.7142857142857" width="230" height="44.42857142857143" rx="4" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/><text x="555" y="412.92857142857144" text-anchor="middle" class="sub">Omgekeerde</text>
<text x="555" y="424.92857142857144" text-anchor="middle" class="sub">piramide</text><rect x="670" y="386.7142857142857" width="230" height="44.42857142857143" rx="4" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/><text x="785" y="412.92857142857144" text-anchor="middle" class="sub">Conclusie</text>
<text x="785" y="424.92857142857144" text-anchor="middle" class="sub">eerst, altijd</text><rect x="60" y="431.14285714285717" width="150" height="44.42857142857143" rx="4" fill="#F4F2EC" stroke="#DFDCD3" stroke-width="1"/><text x="135" y="457.3571428571429" text-anchor="middle" class="label">O6</text><rect x="210" y="431.14285714285717" width="230" height="44.42857142857143" rx="4" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/><text x="325" y="457.3571428571429" text-anchor="middle" class="sub">Geen besluit</text>
<text x="325" y="469.3571428571429" text-anchor="middle" class="sub">was vastgelegd</text><rect x="440" y="431.14285714285717" width="230" height="44.42857142857143" rx="4" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/><text x="555" y="457.3571428571429" text-anchor="middle" class="sub">Besluitenlogboek</text><rect x="670" y="431.14285714285717" width="230" height="44.42857142857143" rx="4" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/><text x="785" y="457.3571428571429" text-anchor="middle" class="sub">5 velden op</text>
<text x="785" y="469.3571428571429" text-anchor="middle" class="sub">moment van</text>
<text x="785" y="481.3571428571429" text-anchor="middle" class="sub">besluiten</text><rect x="60" y="475.57142857142856" width="150" height="44.42857142857143" rx="4" fill="#F4F2EC" stroke="#DFDCD3" stroke-width="1"/><text x="135" y="501.7857142857143" text-anchor="middle" class="label">O7</text><rect x="210" y="475.57142857142856" width="230" height="44.42857142857143" rx="4" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/><text x="325" y="501.7857142857143" text-anchor="middle" class="sub">Kwaliteitseisen</text>
<text x="325" y="513.7857142857142" text-anchor="middle" class="sub">pas in</text>
<text x="325" y="525.7857142857142" text-anchor="middle" class="sub">productie</text><rect x="440" y="475.57142857142856" width="230" height="44.42857142857143" rx="4" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/><text x="555" y="501.7857142857143" text-anchor="middle" class="sub">Kwaliteitsprofiel</text><rect x="670" y="475.57142857142856" width="230" height="44.42857142857143" rx="4" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/><text x="785" y="501.7857142857143" text-anchor="middle" class="sub">Getal vóór de</text>
<text x="785" y="513.7857142857142" text-anchor="middle" class="sub">bouw</text>
<rect x="40" y="560" width="880" height="60" rx="8" fill="#14213D"/>
      <text x="480" y="586" text-anchor="middle" class="label-light">Dezelfde driedeling per observatie maakt het dossier voor de beoordelaars herkenbaar.</text>
      
</svg>