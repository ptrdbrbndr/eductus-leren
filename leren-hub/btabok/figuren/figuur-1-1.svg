<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'DM Sans', Arial, sans-serif" width="960" height="640" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:19px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.10em; }
      .arrow { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-muted { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arrm); }
      .arrow-amber { stroke:#E9A13B; stroke-width:2; fill:none; marker-end:url(#arra); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arrm" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
  </defs>
<rect width="960" height="640" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 1 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Vier maanden naar het assessmentgesprek</text>
<text x="40" y="96" class="sub">Tijdlijn van Claudette's eerste vier maanden bij Meridiaan, met de vier gebeurtenissen uit 1.2 en het</text>
<text x="40" y="114" class="sub">assessmentgesprek als eindpunt.</text>
<line x1="80" y1="330" x2="880" y2="330" stroke="#DFDCD3" stroke-width="3"/><circle cx="80" cy="330" r="9" fill="#2563A8"/><text x="80" y="304" text-anchor="middle" class="label">Start als Solution</text>
<text x="80" y="319" text-anchor="middle" class="label">Architect</text><line x1="80" y1="318" x2="80" y2="308" stroke="#DFDCD3" stroke-width="1"/><circle cx="240" cy="330" r="9" fill="#2563A8"/><text x="240" y="368" text-anchor="middle" class="label">Portefeuilleraad:</text>
<text x="240" y="383" text-anchor="middle" class="label">bezwaar niet</text>
<text x="240" y="398" text-anchor="middle" class="label">genotuleerd</text><line x1="240" y1="342" x2="240" y2="352" stroke="#DFDCD3" stroke-width="1"/><circle cx="400" cy="330" r="9" fill="#2563A8"/><text x="400" y="304" text-anchor="middle" class="label">21 pagina's — 3</text>
<text x="400" y="319" text-anchor="middle" class="label">reacties, alle van</text>
<text x="400" y="334" text-anchor="middle" class="label">ontwikkelaars</text><line x1="400" y1="318" x2="400" y2="308" stroke="#DFDCD3" stroke-width="1"/><circle cx="560" cy="330" r="9" fill="#2563A8"/><text x="560" y="368" text-anchor="middle" class="label">"De rem" — manager</text>
<text x="560" y="383" text-anchor="middle" class="label">Klantbediening</text><line x1="560" y1="342" x2="560" y2="352" stroke="#DFDCD3" stroke-width="1"/><circle cx="720" cy="330" r="9" fill="#2563A8"/><text x="720" y="304" text-anchor="middle" class="label">Budget koppelvlak</text>
<text x="720" y="319" text-anchor="middle" class="label">afgewezen: "wat</text>
<text x="720" y="334" text-anchor="middle" class="label">levert dat op?"</text><line x1="720" y1="318" x2="720" y2="308" stroke="#DFDCD3" stroke-width="1"/><circle cx="880" cy="330" r="9" fill="#E9A13B"/><text x="880" y="368" text-anchor="middle" class="label">Assessmentgesprek</text>
<text x="880" y="383" text-anchor="middle" class="label">— Bart Hoekstra</text><line x1="880" y1="342" x2="880" y2="352" stroke="#DFDCD3" stroke-width="1"/>
<rect x="40" y="560" width="880" height="60" rx="8" fill="#14213D"/>
      <text x="480" y="586" text-anchor="middle" class="label-light">Vier op zichzelf kleine incidenten stapelen zich op tot één vertrouwensvraag.</text>
      
</svg>