<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'DM Sans', Arial, sans-serif" width="960" height="640" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:19px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.10em; }
      .arrow { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-muted { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arrm); }
      .arrow-amber { stroke:#E9A13B; stroke-width:2; fill:none; marker-end:url(#arra); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arrm" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
  </defs>
<rect width="960" height="640" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 17 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">De stakeholderkaart, twee versies</text>
<text x="40" y="96" class="sub">Dezelfde stakeholderkaart als deel 4, met een tweede versie zes maanden later erin gemarkeerd — twee</text>
<text x="40" y="114" class="sub">stakeholders zijn van kwadrant veranderd.</text>
<rect x="330" y="180" width="300" height="300" rx="4" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1.5"/><line x1="480" y1="180" x2="480" y2="480" stroke="#DFDCD3" stroke-width="1.5"/><line x1="330" y1="330" x2="630" y2="330" stroke="#DFDCD3" stroke-width="1.5"/><line x1="330" y1="490" x2="630" y2="490" class="arrow"/><text x="480" y="510" text-anchor="middle" class="sub">betrokkenheid</text><line x1="320" y1="480" x2="320" y2="180" class="arrow"/><text x="306" y="330" text-anchor="middle" class="sub" transform="rotate(-90 306 330)">invloed</text><text x="405" y="255" text-anchor="middle" class="label">Nauw betrekken</text><text x="555" y="255" text-anchor="middle" class="label">Tevreden houden</text><text x="405" y="405" text-anchor="middle" class="label">Informeren</text><text x="555" y="405" text-anchor="middle" class="label">Monitoren</text><circle cx="375" cy="294" r="7" fill="#2563A8"/><text x="375" y="282" text-anchor="middle" class="sub">A — start</text><circle cx="576" cy="435" r="7" fill="#E9A13B"/><text x="576" y="423" text-anchor="middle" class="sub">A — 6 mnd later</text><circle cx="384" cy="435" r="7" fill="#2563A8"/><text x="384" y="423" text-anchor="middle" class="sub">B — start</text><circle cx="435" cy="225" r="7" fill="#E9A13B"/><text x="435" y="213" text-anchor="middle" class="sub">B — 6 mnd later</text>
<rect x="40" y="560" width="880" height="60" rx="8" fill="#14213D"/>
      <text x="480" y="586" text-anchor="middle" class="label-light">Een stakeholderkaart is een momentopname — zes maanden later kloppen twee posities al niet meer.</text>
      
</svg>