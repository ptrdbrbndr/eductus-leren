<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'DM Sans', Arial, sans-serif" width="960" height="640" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:19px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.10em; }
      .arrow { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-muted { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arrm); }
      .arrow-amber { stroke:#E9A13B; stroke-width:2; fill:none; marker-end:url(#arra); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arrm" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
  </defs>
<rect width="960" height="640" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 12 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Binnen kaders versus buiten kaders</text>
<text x="40" y="96" class="sub">Team Portaal dat de laadtijd van de simulatie verbetert, naast een team dat voorstelt de hele intake anders</text>
<text x="40" y="114" class="sub">in te richten — met gevolgen voor alle vijf teams.</text>
<rect x="60" y="180" width="380" height="280" rx="8" fill="#F4F2EC" stroke="#2563A8" stroke-width="1.5"/><text x="250" y="210" text-anchor="middle" class="label">Binnen kaders</text><text x="250" y="248" text-anchor="middle" class="sub">• Team Portaal verbetert de laadtijd van</text>
<text x="250" y="262" text-anchor="middle" class="sub">de simulatie</text><text x="250" y="278" text-anchor="middle" class="sub">• Beslist: het team zelf</text><rect x="520" y="180" width="380" height="280" rx="8" fill="#F4F2EC" stroke="#2563A8" stroke-width="1.5"/><text x="710" y="210" text-anchor="middle" class="label">Buiten kaders</text><text x="710" y="248" text-anchor="middle" class="sub">• Team stelt voor de hele intake anders</text>
<text x="710" y="262" text-anchor="middle" class="sub">in te richten</text><text x="710" y="278" text-anchor="middle" class="sub">• Beslist: het programma als geheel, met</text>
<text x="710" y="292" text-anchor="middle" class="sub">de klantreiskaart</text><circle cx="480" cy="320" r="24" fill="#E9A13B"/><text x="480" y="325" text-anchor="middle" class="label">vs</text><text x="480" y="494" text-anchor="middle" class="sub">Zonder afstemming verandert een team de klantreis zonder dat de andere vier het weten.</text>
<rect x="40" y="560" width="880" height="60" rx="8" fill="#14213D"/>
      <text x="480" y="586" text-anchor="middle" class="label-light">Beide zijn innovatie — maar vragen een heel ander soort besluitvorming.</text>
      
</svg>