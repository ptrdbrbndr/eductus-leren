<text x="480" y="208" text-anchor="middle" class="label">(vooraf)</text><circle cx="620" cy="330" r="42" fill="#FFFFFF" stroke="#2563A8" stroke-width="2"/><text x="620" y="334" text-anchor="middle" class="label">Uitvoeren</text><circle cx="480" cy="470" r="42" fill="#FFFFFF" stroke="#2563A8" stroke-width="2"/><text x="480" y="474" text-anchor="middle" class="label">Meten</text><circle cx="340" cy="330" r="42" fill="#FFFFFF" stroke="#2563A8" stroke-width="2"/><text x="340" y="334" text-anchor="middle" class="label">Terugkoppelen</text>
<rect x="40" y="560" width="880" height="60" rx="8" fill="#14213D"/>
      <text x="480" y="586" text-anchor="middle" class="label-light">Geleerde lessen maken de volgende waardering scherper — de cirkel sluit zichzelf.</text>
      
</svg>