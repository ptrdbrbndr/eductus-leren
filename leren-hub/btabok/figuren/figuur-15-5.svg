<rect width="960" height="640" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 15 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">De Architect Value-benadering als cirkel</text>
<text x="40" y="96" class="sub">Waarderen vooraf → uitvoeren → batenrealisatie meten → terug naar waarderen bij het volgende besluit.</text>
