<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'DM Sans', Arial, sans-serif" width="960" height="640" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:19px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.10em; }
      .arrow { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-muted { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arrm); }
      .arrow-amber { stroke:#E9A13B; stroke-width:2; fill:none; marker-end:url(#arra); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arrm" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
  </defs>
<rect width="960" height="640" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 11 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Het opdrachtblad, ingevuld</text>
<text x="40" y="96" class="sub">Zeven velden, ingevuld voor Claudette's rol binnen Mutatieplatform.</text>
<rect x="90" y="170" width="780" height="44" rx="8" fill="#14213D" stroke="#14213D" stroke-width="1.5"/><text x="480" y="198" text-anchor="middle" class="label-light">Opdrachtblad</text><rect x="90" y="214" width="780" height="37.142857142857146" rx="6" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/><text x="114" y="236.57142857142858" text-anchor="start" class="label">Opdrachtgever</text><rect x="90" y="259.14285714285717" width="780" height="37.142857142857146" rx="6" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/><text x="114" y="281.7142857142857" text-anchor="start" class="label">Type dienst</text><rect x="90" y="304.2857142857143" width="780" height="37.142857142857146" rx="6" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/><text x="114" y="326.85714285714283" text-anchor="start" class="label">Scope en doorlooptijd</text><rect x="90" y="349.42857142857144" width="780" height="37.142857142857146" rx="6" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/><text x="114" y="372" text-anchor="start" class="label">Wat "goed" betekent</text><rect x="90" y="394.57142857142856" width="780" height="37.142857142857146" rx="6" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/><text x="114" y="417.1428571428571" text-anchor="start" class="label">Wat ze wel mag beslissen</text><rect x="90" y="439.7142857142857" width="780" height="37.142857142857146" rx="6" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/><text x="114" y="462.2857142857143" text-anchor="start" class="label">Wat ze niet mag beslissen</text><rect x="90" y="484.8571428571429" width="780" height="37.142857142857146" rx="6" fill="#FDECC8" stroke="#E9A13B" stroke-width="2"/><text x="114" y="507.42857142857144" text-anchor="start" class="label">Exitcriteria</text><text x="846" y="507.42857142857144" text-anchor="end" class="sub">het verschil maakt</text>
<rect x="40" y="560" width="880" height="60" rx="8" fill="#14213D"/>
      <text x="480" y="586" text-anchor="middle" class="label-light">Het laatste veld — exitcriteria — voorkomt dat de opdracht stilzwijgend permanent wordt.</text>
      
</svg>