<text x="920" y="200" font-family="DM Sans" font-size="13.5" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="920" dy="0">WGP 2.0-landschap</tspan></text>
<text x="920" y="218" font-family="DM Sans" font-size="10" fill="#55606F" text-anchor="middle"><tspan x="920" dy="0">ODC naast veertien O11-satellieten</tspan></text>
