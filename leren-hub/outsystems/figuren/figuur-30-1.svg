<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700">
<defs>
<marker id="arrow301" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#14213D"/>
</marker>
</defs>
<rect width="1400" height="700" fill="#FFFFFF"/>
<text x="700" y="34" font-family="Cormorant Garamond" font-size="26" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Cursusboog — dertig delen, drie niveaus, één verhaal</tspan></text>
<text x="700" y="56" font-family="DM Sans" font-size="12.5" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">Van de eerste regel logica (deel 1) tot de boardsimulatie (deel 30)</tspan></text>

<!-- Wave / arc across the whole course -->
<path d="M120,500 C260,500 380,360 480,360 C570,360 630,440 700,440 C790,440 860,280 920,280 C1000,280 1050,400 1120,400 C1180,400 1240,210 1280,210" fill="none" stroke="#14213D" stroke-width="3"/>

<!-- Baseline (niveau segments) -->
<line x1="120" y1="500" x2="500" y2="500" stroke="#2563A8" stroke-width="5"/>
<line x1="500" y1="500" x2="940" y2="500" stroke="#14213D" stroke-width="5"/>
<line x1="940" y1="500" x2="1280" y2="500" stroke="#2563A8" stroke-width="5"/>

<!-- Start marker: deel 1 -->
<circle cx="120" cy="500" r="7" fill="#14213D"/>
<text x="120" y="486" font-family="DM Sans" font-size="10.5" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="120" dy="0">DEEL 1</tspan></text>

