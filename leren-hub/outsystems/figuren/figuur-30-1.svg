<line x1="1280" y1="192" x2="1280" y2="500" stroke="#2563A8" stroke-width="1.5" stroke-dasharray="4 3"/>
<circle cx="1280" cy="210" r="24" fill="none" stroke="#E9A13B" stroke-width="2" stroke-dasharray="4 3"/>
