<text x="480" y="298" font-family="DM Sans" font-size="10" fill="#55606F" text-anchor="middle"><tspan x="480" dy="0">twee sporen, één applicatie</tspan></text>
<rect x="400" y="308" width="160" height="20" rx="10" fill="#FBF4E6" stroke="#E9A13B" stroke-width="1.3"/>
