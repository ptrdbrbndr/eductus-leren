<text x="1265" y="144" font-family="DM Sans" font-size="9.5" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="1265" dy="0">CAPSTONE — DEEL 30</tspan></text>
<text x="1265" y="164" font-family="DM Sans" font-size="9.5" font-weight="bold" fill="#E9A13B" text-anchor="middle"><tspan x="1265" dy="0">EINDE VAN DE CURSUS</tspan></text>

<!-- Niveau bands below baseline -->
<rect x="120" y="516" width="380" height="22" rx="4" fill="#14213D"/>
<text x="310" y="531" font-family="DM Sans" font-size="10.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="310" dy="0">NIVEAU 1 · DEEL 1–10</tspan></text>
<text x="310" y="554" font-family="DM Sans" font-size="10.5" fill="#55606F" text-anchor="middle"><tspan x="310" dy="0">Verzuimmeldingen — tweemaal gebouwd, twee sporen</tspan></text>

<rect x="500" y="516" width="440" height="22" rx="4" fill="#14213D"/>
<text x="720" y="531" font-family="DM Sans" font-size="10.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="720" dy="0">NIVEAU 2 · DEEL 11–21</tspan></text>
<text x="720" y="554" font-family="DM Sans" font-size="10.5" fill="#55606F" text-anchor="middle"><tspan x="720" dy="0">WGP 2.0 in ODC naast veertien O11-satellieten</tspan></text>

<rect x="940" y="516" width="340" height="22" rx="4" fill="#14213D"/>
<text x="1110" y="531" font-family="DM Sans" font-size="10.5" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="1110" dy="0">NIVEAU 3 · DEEL 22–30</tspan></text>
<text x="1110" y="554" font-family="DM Sans" font-size="10.5" fill="#55606F" text-anchor="middle"><tspan x="1110" dy="0">Portfoliobesluiten — tech lead onder druk</tspan></text>

<text x="700" y="600" font-family="DM Sans" font-size="12" font-style="italic" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">Bouwvaardigheid → landschapsontwerp → tech lead-gedrag onder druk</tspan></text>

<text x="700" y="644" font-family="Cormorant Garamond" font-size="20" font-style="italic" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Low-code verschuift complexiteit — het elimineert haar niet.</tspan></text>
