<text x="1050" y="435" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle"><tspan x="1050" dy="0">Gekoppeld aan: platform-</tspan></text>
<text x="1050" y="452" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle"><tspan x="1050" dy="0">verbruik binnen abonnement</tspan></text>

<!-- Note bar -->
<rect x="100" y="490" width="1200" height="120" rx="5" fill="#F4F6F9" stroke="#DFDCD3" stroke-width="1"/>
<text x="700" y="518" font-family="DM Sans" font-size="13" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Licentiekosten schalen met toepassingsomvang &#233;n platformcapaciteit</tspan></text>
<text x="700" y="542" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">O11: extra capaciteit raakt twee kostenlagen &#8212; licentie &#233;n infrastructuur</tspan></text>
<text x="700" y="562" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">ODC: extra capaciteit raakt &#233;&#233;n laag &#8212; platformverbruik binnen het abonnement (25.2)</tspan></text>
