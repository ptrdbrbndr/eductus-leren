<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
<defs>
<marker id="arrow141" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#14213D"/>
</marker>
<marker id="arrow141w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#E9A13B"/>
</marker>
</defs>
<rect width="1400" height="720" fill="#FFFFFF"/>
<text x="700" y="48" font-family="Cormorant Garamond" font-size="26" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Het N+1-probleem &#8212; lus met losse queries versus &#233;&#233;n geaggregeerde query</tspan></text>

<line x1="700" y1="90" x2="700" y2="600" stroke="#DFDCD3" stroke-width="1"/>

<!-- LEFT: fout patroon -->
<text x="350" y="100" font-family="DM Sans" font-size="16" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="350" dy="0">Fout patroon &#8212; For Each-lus</tspan></text>
<circle cx="590" cy="97" r="14" fill="#FBF4E6" stroke="#E9A13B" stroke-width="2"/>
<text x="590" y="102" font-family="DM Sans" font-size="14" font-weight="bold" fill="#E9A13B" text-anchor="middle"><tspan x="590" dy="0">!</tspan></text>

<rect x="150" y="140" width="400" height="56" rx="6" fill="#F4F6F9" stroke="#2563A8" stroke-width="1.5"/>
<text x="350" y="173" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="350" dy="0">Aggregate: lijst van 100 werkgevers</tspan></text>

<line x1="350" y1="196" x2="350" y2="222" stroke="#14213D" stroke-width="2" marker-end="url(#arrow141)"/>

<rect x="150" y="228" width="400" height="290" rx="6" fill="#FFFFFF" stroke="#14213D" stroke-width="2" stroke-dasharray="8 5"/>
<text x="350" y="252" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="350" dy="0">For Each werkgever</tspan></text>

<rect x="180" y="266" width="340" height="40" rx="4" fill="#FBF4E6" stroke="#E9A13B" stroke-width="1.5"/>
<text x="350" y="290" font-family="DM Sans" font-size="11" fill="#14213D" text-anchor="middle"><tspan x="350" dy="0">query: tel actieve meldingen &#8212; werkgever 1</tspan></text>
<rect x="180" y="314" width="340" height="40" rx="4" fill="#FBF4E6" stroke="#E9A13B" stroke-width="1.5"/>
<text x="350" y="338" font-family="DM Sans" font-size="11" fill="#14213D" text-anchor="middle"><tspan x="350" dy="0">query: tel actieve meldingen &#8212; werkgever 2</tspan></text>
<rect x="180" y="362" width="340" height="40" rx="4" fill="#FBF4E6" stroke="#E9A13B" stroke-width="1.5"/>
<text x="350" y="386" font-family="DM Sans" font-size="11" fill="#14213D" text-anchor="middle"><tspan x="350" dy="0">query: tel actieve meldingen &#8212; werkgever 3</tspan></text>
<text x="350" y="425" font-family="DM Sans" font-size="16" font-weight="bold" fill="#55606F" text-anchor="middle"><tspan x="350" dy="0">&#8942;</tspan></text>
<rect x="180" y="440" width="340" height="40" rx="4" fill="#FBF4E6" stroke="#E9A13B" stroke-width="1.5"/>
<text x="350" y="464" font-family="DM Sans" font-size="11" fill="#14213D" text-anchor="middle"><tspan x="350" dy="0">query: tel actieve meldingen &#8212; werkgever 100</tspan></text>

<rect x="150" y="540" width="400" height="60" rx="6" fill="#FBF4E6" stroke="#E9A13B" stroke-width="2.5"/>
<text x="350" y="565" font-family="DM Sans" font-size="15" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="350" dy="0">1 + 100 = 101 queries</tspan></text>
<text x="350" y="584" font-family="DM Sans" font-size="11" fill="#E9A13B" text-anchor="middle"><tspan x="350" dy="0">honderd extra queries voor honderd werkgevers</tspan></text>

<!-- RIGHT: juiste patroon -->
<text x="1050" y="100" font-family="DM Sans" font-size="16" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="1050" dy="0">Juist patroon &#8212; aggregatie in de Aggregate</tspan></text>
<circle cx="820" cy="97" r="14" fill="#F4F6F9" stroke="#2563A8" stroke-width="2"/>
<text x="820" y="102" font-family="DM Sans" font-size="14" font-weight="bold" fill="#2563A8" text-anchor="middle"><tspan x="820" dy="0">&#10003;</tspan></text>

<rect x="850" y="140" width="400" height="56" rx="6" fill="#F4F6F9" stroke="#2563A8" stroke-width="1.5"/>
<text x="1050" y="173" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="1050" dy="0">Aggregate: lijst van 100 werkgevers</tspan></text>

<line x1="1050" y1="196" x2="1050" y2="222" stroke="#14213D" stroke-width="2" marker-end="url(#arrow141)"/>

<rect x="850" y="228" width="400" height="290" rx="6" fill="#F4F6F9" stroke="#2563A8" stroke-width="2.5"/>
<text x="1050" y="270" font-family="DM Sans" font-size="14" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="1050" dy="0">&#233;&#233;n Aggregate</tspan></text>
<text x="1050" y="294" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle"><tspan x="1050" dy="0">Werkgever LEFT JOIN Melding</tspan></text>
<text x="1050" y="316" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle"><tspan x="1050" dy="0">GROUP BY Werkgever.Id</tspan></text>
<text x="1050" y="338" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle"><tspan x="1050" dy="0">Count(Melding.Id) als AantalActief</tspan></text>
<rect x="900" y="370" width="300" height="90" rx="6" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/>
<text x="1050" y="396" font-family="DM Sans" font-size="11" fill="#14213D" text-anchor="middle"><tspan x="1050" dy="0">databasemotor voert join en telling</tspan></text>
<text x="1050" y="414" font-family="DM Sans" font-size="11" fill="#14213D" text-anchor="middle"><tspan x="1050" dy="0">in &#233;&#233;n uitvoeringsplan uit,</tspan></text>
<text x="1050" y="432" font-family="DM Sans" font-size="11" fill="#14213D" text-anchor="middle"><tspan x="1050" dy="0">voor alle honderd werkgevers tegelijk</tspan></text>

<rect x="850" y="540" width="400" height="60" rx="6" fill="#F4F6F9" stroke="#2563A8" stroke-width="2.5"/>
<text x="1050" y="565" font-family="DM Sans" font-size="15" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="1050" dy="0">1 query</tspan></text>
<text x="1050" y="584" font-family="DM Sans" font-size="11" fill="#2563A8" text-anchor="middle"><tspan x="1050" dy="0">alle honderd werkgevers in &#233;&#233;n keer</tspan></text>

<text x="700" y="650" font-family="DM Sans" font-size="13" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">Zelfde resultaat, honderd keer minder databasebelasting &#8212; aggregeer in de Aggregate zelf, nooit in een lus.</tspan></text>
</svg>
