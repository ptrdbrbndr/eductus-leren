<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
<defs>
<marker id="arrow161" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#14213D"/>
</marker>
</defs>
<rect width="1400" height="720" fill="#FFFFFF"/>
<text x="700" y="48" font-family="Cormorant Garamond" font-size="26" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Integration Studio-flow: van legacy-systeem naar Service Studio-actie</tspan></text>

<!-- O11 badge -->
<rect x="80" y="88" width="60" height="26" rx="13" fill="#14213D"/>
<text x="110" y="106" font-family="DM Sans" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="110" dy="0">O11</tspan></text>
<text x="160" y="106" font-family="DM Sans" font-size="13" fill="#55606F" text-anchor="start"><tspan x="160" dy="0">Integration Studio is een apart hulpmiddel binnen de O11-toolset — geen ODC-equivalent</tspan></text>

<!-- Box 1: legacy system -->
<rect x="90" y="290" width="330" height="140" rx="7" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1.5"/>
<text x="255" y="330" font-family="DM Sans" font-size="17" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="255" dy="0">Legacy-systeem</tspan></text>
<text x="255" y="354" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle"><tspan x="255" dy="0">.NET-component / stored procedure / SOAP</tspan></text>
<text x="255" y="374" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle"><tspan x="255" dy="0">on-premise, geen REST-interface</tspan></text>
<rect x="145" y="390" width="220" height="26" rx="13" fill="#F4F6F9" stroke="#2563A8" stroke-width="1.2"/>
<text x="255" y="408" font-family="DM Sans" font-size="11" font-weight="bold" fill="#2563A8" text-anchor="middle"><tspan x="255" dy="0">hét scheidingspunt</tspan></text>

<!-- Arrow 1 -->
<line x1="420" y1="360" x2="516" y2="360" stroke="#14213D" stroke-width="2" marker-end="url(#arrow161)"/>
<rect x="358" y="316" width="220" height="34" rx="17" fill="#FBF4E6" stroke="#E9A13B" stroke-width="2"/>
<text x="468" y="338" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="468" dy="0">Integration Studio</tspan></text>

<!-- Box 2: extension -->
<rect x="520" y="280" width="330" height="160" rx="7" fill="#FBF4E6" stroke="#E9A13B" stroke-width="2.5"/>
<text x="685" y="322" font-family="DM Sans" font-size="17" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="685" dy="0">Extension</tspan></text>
<text x="685" y="346" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle"><tspan x="685" dy="0">gegenereerd door Integration Studio</tspan></text>
<text x="685" y="366" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle"><tspan x="685" dy="0">herbruikbare component,</tspan></text>
<text x="685" y="384" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle"><tspan x="685" dy="0">connector naar het legacy-systeem</tspan></text>
<text x="685" y="418" font-family="DM Sans" font-size="11" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="685" dy="0">gegenereerd artefact</tspan></text>

<!-- Arrow 2 -->
<line x1="850" y1="360" x2="946" y2="360" stroke="#14213D" stroke-width="2" marker-end="url(#arrow161)"/>
<rect x="788" y="316" width="220" height="34" rx="17" fill="#F4F6F9" stroke="#2563A8" stroke-width="1.5"/>
<text x="898" y="338" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="898" dy="0">publiceren</tspan></text>

<!-- Box 3: Service Studio action -->
<rect x="950" y="290" width="360" height="140" rx="7" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1.5"/>
<text x="1130" y="330" font-family="DM Sans" font-size="17" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="1130" dy="0">Service Studio-actie</tspan></text>
<text x="1130" y="354" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle"><tspan x="1130" dy="0">aanroepbaar als gewone platformactie</tspan></text>
<text x="1130" y="374" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle"><tspan x="1130" dy="0">binnen elke O11-module die de extension referenceert</tspan></text>
<rect x="1020" y="390" width="220" height="26" rx="13" fill="#F4F6F9" stroke="#2563A8" stroke-width="1.2"/>
<text x="1130" y="408" font-family="DM Sans" font-size="11" font-weight="bold" fill="#2563A8" text-anchor="middle"><tspan x="1130" dy="0">gewone actie voor de developer</tspan></text>

<!-- Bottom caption -->
<rect x="290" y="510" width="820" height="66" rx="6" fill="#F4F6F9" stroke="#2563A8" stroke-width="1.5"/>
<text x="700" y="538" font-family="DM Sans" font-size="14" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Eén keer ontsloten via Integration Studio, daarna herbruikbaar</tspan></text>
<text x="700" y="560" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">de complexiteit van het legacy-systeem blijft verborgen achter de extension</tspan></text>

<text x="700" y="660" font-family="Cormorant Garamond" font-size="19" font-style="italic" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Legacy ontsluiten is eenmalig werk — gebruiken is dagelijkse routine.</tspan></text>
</svg>
