<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
<defs>
<marker id="arrow282" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#14213D"/>
</marker>
</defs>
<rect width="1400" height="720" fill="#FFFFFF"/>
<text x="700" y="42" font-family="Cormorant Garamond" font-size="26" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Incidentflow — vier stappen van signaal naar oplossing</tspan></text>
<text x="700" y="66" font-family="DM Sans" font-size="12.5" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">In een gemengd O11/ODC-landschap bepaalt de triage ook welk platform geraakt is en wie kan handelen</tspan></text>

<!-- Step 1: Detecteren -->
<rect x="60" y="170" width="280" height="150" rx="7" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1.5"/>
<circle cx="96" cy="196" r="15" fill="#14213D"/>
<text x="96" y="201" font-family="DM Sans" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="96" dy="0">1</tspan></text>
<text x="200" y="201" font-family="DM Sans" font-size="15" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="200" dy="0">Detecteren</tspan></text>
<line x1="80" y1="222" x2="320" y2="222" stroke="#DFDCD3" stroke-width="1"/>
<text x="200" y="246" font-family="DM Sans" font-size="11" fill="#55606F" text-anchor="middle"><tspan x="200" dy="0">het landschapsbrede dashboard</tspan></text>
<text x="200" y="264" font-family="DM Sans" font-size="11" fill="#55606F" text-anchor="middle"><tspan x="200" dy="0">of een alert signaleert een</tspan></text>
<text x="200" y="282" font-family="DM Sans" font-size="11" fill="#55606F" text-anchor="middle"><tspan x="200" dy="0">afwijking (deel 28.2)</tspan></text>

<line x1="340" y1="245" x2="372" y2="245" stroke="#14213D" stroke-width="2.2" marker-end="url(#arrow282)"/>

<!-- Step 2: Triage -->
<rect x="376" y="170" width="280" height="150" rx="7" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1.5"/>
<circle cx="412" cy="196" r="15" fill="#14213D"/>
<text x="412" y="201" font-family="DM Sans" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="412" dy="0">2</tspan></text>
<text x="516" y="201" font-family="DM Sans" font-size="15" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="516" dy="0">Triage</tspan></text>
<line x1="396" y1="222" x2="636" y2="222" stroke="#DFDCD3" stroke-width="1"/>
<text x="516" y="243" font-family="DM Sans" font-size="11" fill="#55606F" text-anchor="middle"><tspan x="516" dy="0">hoe ernstig, welke modules</tspan></text>
<text x="516" y="261" font-family="DM Sans" font-size="11" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="516" dy="0">welk platform (O11/ODC)</tspan></text>
<text x="516" y="279" font-family="DM Sans" font-size="11" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="516" dy="0">en wie kan handelen</tspan></text>
<text x="516" y="297" font-family="DM Sans" font-size="10" font-style="italic" fill="#55606F" text-anchor="middle"><tspan x="516" dy="0">O11: LifeTime · ODC: Portal</tspan></text>

<line x1="656" y1="245" x2="688" y2="245" stroke="#14213D" stroke-width="2.2" marker-end="url(#arrow282)"/>

<!-- Step 3: Mitigeren (highlighted — caution) -->
<rect x="692" y="170" width="280" height="150" rx="7" fill="#FBF4E6" stroke="#E9A13B" stroke-width="2.5"/>
<circle cx="728" cy="196" r="15" fill="#14213D"/>
<text x="728" y="201" font-family="DM Sans" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="728" dy="0">3</tspan></text>
<text x="832" y="201" font-family="DM Sans" font-size="15" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="832" dy="0">Mitigeren</tspan></text>
<line x1="712" y1="222" x2="952" y2="222" stroke="#DFDCD3" stroke-width="1"/>
<text x="832" y="246" font-family="DM Sans" font-size="11" fill="#55606F" text-anchor="middle"><tspan x="832" dy="0">tijdelijke workaround —</tspan></text>
<text x="832" y="264" font-family="DM Sans" font-size="11" fill="#55606F" text-anchor="middle"><tspan x="832" dy="0">bijvoorbeeld een rollback</tspan></text>
<text x="832" y="282" font-family="DM Sans" font-size="11" fill="#55606F" text-anchor="middle"><tspan x="832" dy="0">(deel 19)</tspan></text>
<text x="832" y="302" font-family="DM Sans" font-size="10.5" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="832" dy="0">stopt het symptoom</tspan></text>

<line x1="972" y1="245" x2="1004" y2="245" stroke="#14213D" stroke-width="2.2" marker-end="url(#arrow282)"/>

<!-- Step 4: Oplossen -->
<rect x="1008" y="170" width="280" height="150" rx="7" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1.5"/>
<circle cx="1044" cy="196" r="15" fill="#14213D"/>
<text x="1044" y="201" font-family="DM Sans" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="1044" dy="0">4</tspan></text>
<text x="1148" y="201" font-family="DM Sans" font-size="15" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="1148" dy="0">Oplossen</tspan></text>
<line x1="1028" y1="222" x2="1268" y2="222" stroke="#DFDCD3" stroke-width="1"/>
<text x="1148" y="246" font-family="DM Sans" font-size="11" fill="#55606F" text-anchor="middle"><tspan x="1148" dy="0">de daadwerkelijke oorzaak</tspan></text>
<text x="1148" y="264" font-family="DM Sans" font-size="11" fill="#55606F" text-anchor="middle"><tspan x="1148" dy="0">wordt weggenomen</tspan></text>
<text x="1148" y="288" font-family="DM Sans" font-size="10.5" font-weight="bold" fill="#2563A8" text-anchor="middle"><tspan x="1148" dy="0">incident gesloten</tspan></text>

<!-- Caution callout: mitigeren ≠ oplossen -->
<path d="M 832 320 L 832 360" fill="none" stroke="#E9A13B" stroke-width="2" stroke-dasharray="6 4"/>
<rect x="632" y="368" width="400" height="70" rx="6" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2"/>
<text x="832" y="396" font-family="DM Sans" font-size="13" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="832" dy="0">Mitigeren is niet oplossen.</tspan></text>
<text x="832" y="418" font-family="DM Sans" font-size="11.5" fill="#55606F" text-anchor="middle"><tspan x="832" dy="0">Een rollback stopt het symptoom, niet de oorzaak.</tspan></text>

<!-- O11 vs ODC note -->
<rect x="330" y="480" width="740" height="90" rx="6" fill="#F4F6F9" stroke="#2563A8" stroke-width="1.3"/>
<text x="700" y="506" font-family="DM Sans" font-size="12.5" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Gemengd landschap — triage bepaalt ook het platform</tspan></text>
<text x="700" y="528" font-family="DM Sans" font-size="11" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">O11: directe toegang tot Environment + LifeTime, platform-onafhankelijke inspectie mogelijk</tspan></text>
<text x="700" y="548" font-family="DM Sans" font-size="11" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">ODC: geïntegreerd via de Portal — dieper geïntegreerd, maar minder eigen inspectiediepte</tspan></text>

<text x="700" y="646" font-family="Cormorant Garamond" font-size="19" font-style="italic" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Detecteren, triage, mitigeren, oplossen — nooit verwarren welke stap je zet.</tspan></text>
</svg>
