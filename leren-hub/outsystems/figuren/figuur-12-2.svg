<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
<defs>
<marker id="arrow122" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#14213D"/>
</marker>
<marker id="arrow122w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#E9A13B"/>
</marker>
</defs>
<rect width="1400" height="720" fill="#FFFFFF"/>
<text x="700" y="48" font-family="Cormorant Garamond" font-size="26" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Geen cyclus versus w&#233;l een cyclus</tspan></text>

<!-- Divider -->
<line x1="700" y1="90" x2="700" y2="650" stroke="#DFDCD3" stroke-width="1"/>

<!-- LEFT: no cycle -->
<text x="350" y="100" font-family="DM Sans" font-size="16" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="350" dy="0">Geen cyclus</tspan></text>
<circle cx="240" cy="97" r="14" fill="#F4F6F9" stroke="#2563A8" stroke-width="2"/>
<text x="240" y="102" font-family="DM Sans" font-size="14" font-weight="bold" fill="#2563A8" text-anchor="middle"><tspan x="240" dy="0">&#10003;</tspan></text>

<rect x="150" y="150" width="200" height="70" rx="6" fill="#FFFFFF" stroke="#14213D" stroke-width="2"/>
<text x="250" y="180" font-family="DM Sans" font-size="14" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="250" dy="0">WGP 2.0</tspan></text>
<text x="250" y="199" font-family="DM Sans" font-size="10" fill="#55606F" text-anchor="middle"><tspan x="250" dy="0">module A</tspan></text>

<rect x="400" y="150" width="220" height="70" rx="6" fill="#FFFFFF" stroke="#14213D" stroke-width="2"/>
<text x="510" y="180" font-family="DM Sans" font-size="14" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="510" dy="0">Verzuimmeldingen</tspan></text>
<text x="510" y="199" font-family="DM Sans" font-size="10" fill="#55606F" text-anchor="middle"><tspan x="510" dy="0">module B</tspan></text>

<line x1="250" y1="220" x2="250" y2="300" stroke="#14213D" stroke-width="2"/>
<line x1="250" y1="300" x2="330" y2="300" stroke="#14213D" stroke-width="2"/>
<line x1="510" y1="220" x2="510" y2="300" stroke="#14213D" stroke-width="2"/>
<line x1="510" y1="300" x2="430" y2="300" stroke="#14213D" stroke-width="2"/>
<line x1="380" y1="300" x2="380" y2="345" stroke="#14213D" stroke-width="2" marker-end="url(#arrow122)"/>

<rect x="260" y="350" width="240" height="70" rx="6" fill="#F4F6F9" stroke="#2563A8" stroke-width="2.5"/>
<text x="380" y="380" font-family="DM Sans" font-size="14" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="380" dy="0">MeridiaanMutatiesCore</tspan></text>
<text x="380" y="399" font-family="DM Sans" font-size="10" fill="#55606F" text-anchor="middle"><tspan x="380" dy="0">gedeelde Core-library</tspan></text>

<rect x="150" y="460" width="470" height="130" rx="6" fill="#F4F6F9" stroke="#DFDCD3" stroke-width="1"/>
<text x="170" y="486" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D"><tspan x="170" dy="0">Waarom dit geen cyclus is</tspan></text>
<text x="170" y="508" font-family="DM Sans" font-size="11" fill="#55606F"><tspan x="170" dy="0">A en B zijn allebei afhankelijk van C.</tspan></text>
<text x="170" y="527" font-family="DM Sans" font-size="11" fill="#55606F"><tspan x="170" dy="0">C is niet afhankelijk van A of B terug.</tspan></text>
<text x="170" y="546" font-family="DM Sans" font-size="11" fill="#55606F"><tspan x="170" dy="0">Alle pijlen lopen &#233;&#233;n kant op: naar beneden.</tspan></text>
<text x="170" y="568" font-family="DM Sans" font-size="11" font-weight="bold" fill="#2563A8"><tspan x="170" dy="0">Volgt de vierlagenregel &#8212; toegestaan</tspan></text>

<!-- RIGHT: cycle -->
<text x="1050" y="100" font-family="DM Sans" font-size="16" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="1050" dy="0">W&#233;l een cyclus</tspan></text>
<circle cx="930" cy="97" r="14" fill="#FBF4E6" stroke="#E9A13B" stroke-width="2"/>
<text x="930" y="102" font-family="DM Sans" font-size="14" font-weight="bold" fill="#E9A13B" text-anchor="middle"><tspan x="930" dy="0">!</tspan></text>

<rect x="830" y="180" width="180" height="70" rx="6" fill="#FFFFFF" stroke="#14213D" stroke-width="2"/>
<text x="920" y="210" font-family="DM Sans" font-size="14" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="920" dy="0">Module A</tspan></text>
<text x="920" y="229" font-family="DM Sans" font-size="10" fill="#55606F" text-anchor="middle"><tspan x="920" dy="0">bv. WGP 2.0</tspan></text>

<rect x="1140" y="180" width="180" height="70" rx="6" fill="#FFFFFF" stroke="#14213D" stroke-width="2"/>
<text x="1230" y="210" font-family="DM Sans" font-size="14" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="1230" dy="0">Module B</tspan></text>
<text x="1230" y="229" font-family="DM Sans" font-size="10" fill="#55606F" text-anchor="middle"><tspan x="1230" dy="0">bv. MeridiaanMutatiesCore</tspan></text>

<line x1="1010" y1="200" x2="1140" y2="200" stroke="#14213D" stroke-width="2.5" marker-end="url(#arrow122)"/>
<text x="1075" y="188" font-family="DM Sans" font-size="11" font-weight="bold" fill="#55606F" text-anchor="middle"><tspan x="1075" dy="0">gebruikt</tspan></text>

<line x1="1140" y1="235" x2="1010" y2="235" stroke="#E9A13B" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrow122w)"/>
<text x="1075" y="253" font-family="DM Sans" font-size="11" font-weight="bold" fill="#E9A13B" text-anchor="middle"><tspan x="1075" dy="0">gebruikt terug &#8212; cyclus!</tspan></text>

<rect x="830" y="330" width="490" height="150" rx="6" fill="#FBF4E6" stroke="#E9A13B" stroke-width="1.5"/>
<text x="850" y="356" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D"><tspan x="850" dy="0">Waarom dit wel een cyclus is</tspan></text>
<text x="850" y="378" font-family="DM Sans" font-size="11" fill="#55606F"><tspan x="850" dy="0">A &#8594; B &#8594; A: B is afhankelijk van A,</tspan></text>
<text x="850" y="397" font-family="DM Sans" font-size="11" fill="#55606F"><tspan x="850" dy="0">terwijl A al afhankelijk was van B.</tspan></text>
<text x="850" y="419" font-family="DM Sans" font-size="11" fill="#55606F"><tspan x="850" dy="0">Geen enkele module kan meer los</tspan></text>
<text x="850" y="438" font-family="DM Sans" font-size="11" fill="#55606F"><tspan x="850" dy="0">gepubliceerd of getest worden.</tspan></text>
<text x="850" y="463" font-family="DM Sans" font-size="11" font-weight="bold" fill="#E9A13B"><tspan x="850" dy="0">Geen bug &#8212; een architectuursignaal om de</tspan></text>
<text x="850" y="480" font-family="DM Sans" font-size="11" font-weight="bold" fill="#E9A13B"><tspan x="850" dy="0">laagindeling te herzien</tspan></text>

<text x="700" y="670" font-family="DM Sans" font-size="13" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">Een cyclische afhankelijkheid is geen bug. Het is een architectuursignaal.</tspan></text>
</svg>
