<text x="895" y="450" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle"><tspan x="895" dy="0">1 (Verzuimmeldingen) + 2 benoemd + 11 overige = veertien O11-satellieten, allemaal ongewijzigd in productie</tspan></text>

