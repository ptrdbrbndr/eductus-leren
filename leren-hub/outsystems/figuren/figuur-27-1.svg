<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
<defs>
<marker id="arrow271" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#14213D"/>
</marker>
<marker id="arrow271b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#2563A8"/>
</marker>
<marker id="arrow271r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#B5533C"/>
</marker>
</defs>
<rect width="1400" height="720" fill="#FFFFFF"/>
<text x="700" y="42" font-family="Cormorant Garamond" font-size="26" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">AI-suggestie-flow — bevestigingsstap door de medewerker</tspan></text>
<text x="700" y="66" font-family="DM Sans" font-size="12.5" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">Categorisering van een vrije-tekst verzuimreden — de AI levert een suggestie, nooit een beslissing</tspan></text>

<!-- Stage 1: input -->
<rect x="80" y="300" width="200" height="110" rx="7" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1.5"/>
<text x="180" y="340" font-family="DM Sans" font-size="14.5" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="180" dy="0">Vrije tekst</tspan></text>
<text x="180" y="360" font-family="DM Sans" font-size="10.5" fill="#55606F" text-anchor="middle"><tspan x="180" dy="0">verzuimreden, ingevoerd</tspan></text>
<text x="180" y="376" font-family="DM Sans" font-size="10.5" fill="#55606F" text-anchor="middle"><tspan x="180" dy="0">door HR-medewerker (deel 3)</tspan></text>

<line x1="280" y1="355" x2="312" y2="355" stroke="#14213D" stroke-width="2" marker-end="url(#arrow271)"/>

<!-- Stage 2: AI component -->
<rect x="316" y="300" width="200" height="110" rx="7" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1.5"/>
<text x="416" y="332" font-family="DM Sans" font-size="14.5" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="416" dy="0">AI-component</tspan></text>
<text x="416" y="352" font-family="DM Sans" font-size="10.5" fill="#55606F" text-anchor="middle"><tspan x="416" dy="0">patroonherkenning</tspan></text>
<text x="416" y="368" font-family="DM Sans" font-size="10.5" fill="#55606F" text-anchor="middle"><tspan x="416" dy="0">Core-laag, REST binnen</tspan></text>
<text x="416" y="384" font-family="DM Sans" font-size="10.5" fill="#55606F" text-anchor="middle"><tspan x="416" dy="0">Exception Handler (deel 4, 9, 16)</tspan></text>

<line x1="516" y1="355" x2="548" y2="355" stroke="#14213D" stroke-width="2" marker-end="url(#arrow271)"/>

<!-- Stage 3: suggestion -->
<rect x="552" y="300" width="200" height="110" rx="7" fill="#FBF4E6" stroke="#E9A13B" stroke-width="2.5"/>
<text x="652" y="332" font-family="DM Sans" font-size="14.5" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="652" dy="0">Suggestie</tspan></text>
<text x="652" y="352" font-family="DM Sans" font-size="10.5" fill="#55606F" text-anchor="middle"><tspan x="652" dy="0">voorgestelde categorie</tspan></text>
<text x="652" y="368" font-family="DM Sans" font-size="10.5" fill="#55606F" text-anchor="middle"><tspan x="652" dy="0">getoond aan de medewerker</tspan></text>
<text x="652" y="384" font-family="DM Sans" font-size="10.5" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="652" dy="0">nog niet opgeslagen</tspan></text>

<line x1="752" y1="355" x2="784" y2="355" stroke="#14213D" stroke-width="2" marker-end="url(#arrow271)"/>

<!-- Stage 4: confirmation checkpoint (human-in-the-loop) -->
<rect x="788" y="270" width="270" height="170" rx="24" fill="#FBF4E6" stroke="#E9A13B" stroke-width="2.5" stroke-dasharray="7 4"/>
<circle cx="825" cy="308" r="13" fill="none" stroke="#14213D" stroke-width="1.6"/>
<circle cx="825" cy="302" r="5" fill="none" stroke="#14213D" stroke-width="1.6"/>
<path d="M814,318 a11,9 0 0 1 22,0" fill="none" stroke="#14213D" stroke-width="1.6"/>
<text x="923" y="303" font-family="DM Sans" font-size="13.5" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="923" dy="0">Bevestigingsstap</tspan></text>
<text x="923" y="322" font-family="DM Sans" font-size="10.5" fill="#55606F" text-anchor="middle"><tspan x="923" dy="0">HR-medewerker bevestigt</tspan></text>
<text x="923" y="337" font-family="DM Sans" font-size="10.5" fill="#55606F" text-anchor="middle"><tspan x="923" dy="0">of corrigeert de suggestie</tspan></text>

<rect x="808" y="350" width="130" height="24" rx="12" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.3"/>
<text x="873" y="366" font-family="DM Sans" font-size="10.5" font-weight="bold" fill="#2563A8" text-anchor="middle"><tspan x="873" dy="0">✓ Bevestigen</tspan></text>
<rect x="948" y="350" width="120" height="24" rx="12" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.3"/>
<text x="1008" y="366" font-family="DM Sans" font-size="10.5" font-weight="bold" fill="#2563A8" text-anchor="middle"><tspan x="1008" dy="0">✎ Corrigeren</tspan></text>

<line x1="873" y1="374" x2="873" y2="392" stroke="#2563A8" stroke-width="1.8" marker-end="url(#arrow271b)"/>
<line x1="1008" y1="374" x2="1008" y2="392" stroke="#2563A8" stroke-width="1.8" marker-end="url(#arrow271b)"/>
<path d="M873,392 L873,420 L1150,420 L1150,410" fill="none" stroke="#2563A8" stroke-width="1.8" marker-end="url(#arrow271b)"/>
<path d="M1008,392 L1008,420" fill="none" stroke="#2563A8" stroke-width="1.8"/>

<!-- Endpoint: database -->
<rect x="1080" y="300" width="220" height="110" rx="7" fill="#FFFFFF" stroke="#14213D" stroke-width="2"/>
<text x="1190" y="335" font-family="DM Sans" font-size="14.5" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="1190" dy="0">Database</tspan></text>
<text x="1190" y="355" font-family="DM Sans" font-size="10.5" fill="#55606F" text-anchor="middle"><tspan x="1190" dy="0">alleen na bevestiging</tspan></text>
<text x="1190" y="371" font-family="DM Sans" font-size="10.5" fill="#55606F" text-anchor="middle"><tspan x="1190" dy="0">of correctie door de mens</tspan></text>

<!-- Forbidden direct path -->
<path d="M416,410 C 416,560 1190,560 1190,412" fill="none" stroke="#B5533C" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow271r)"/>
<circle cx="803" cy="562" r="16" fill="#FFFFFF" stroke="#B5533C" stroke-width="2.4"/>
<line x1="792" y1="573" x2="814" y2="551" stroke="#B5533C" stroke-width="2.4"/>
<text x="803" y="592" font-family="DM Sans" font-size="11.5" font-weight="bold" fill="#B5533C" text-anchor="middle"><tspan x="803" dy="0">nooit direct</tspan></text>
<text x="803" y="607" font-family="DM Sans" font-size="10" fill="#55606F" text-anchor="middle"><tspan x="803" dy="0">AI-uitvoer schrijft nooit ongecontroleerd weg</tspan></text>

<!-- Legend -->
<rect x="170" y="646" width="18" height="18" rx="3" fill="#FFFFFF" stroke="#B5533C" stroke-width="2" stroke-dasharray="4 3"/>
<text x="196" y="659" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="start"><tspan x="196" dy="0">verboden pad — nooit gebruikt</tspan></text>
<rect x="470" y="646" width="18" height="18" rx="9" fill="#FBF4E6" stroke="#E9A13B" stroke-width="2" stroke-dasharray="4 3"/>
<text x="496" y="659" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="start"><tspan x="496" dy="0">mens-in-de-lus — het controlepunt</tspan></text>
<rect x="850" y="646" width="18" height="18" rx="3" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="876" y="659" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="start"><tspan x="876" dy="0">toegestaan pad — na bevestiging of correctie</tspan></text>

<text x="700" y="700" font-family="Cormorant Garamond" font-size="19" font-style="italic" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">De AI-uitvoer schrijft nooit rechtstreeks naar de database — de medewerker blijft het controlepunt.</tspan></text>
</svg>
