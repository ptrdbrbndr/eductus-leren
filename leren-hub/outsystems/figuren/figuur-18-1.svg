<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
<defs>
<marker id="arrow181" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#14213D"/>
</marker>
<marker id="arrow181d" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#E9A13B"/>
</marker>
</defs>
<rect width="1400" height="720" fill="#FFFFFF"/>
<text x="700" y="46" font-family="Cormorant Garamond" font-size="26" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">BPT-flow: indienen → beoordeling → goedkeuring, met wachttoestanden</tspan></text>

<rect x="80" y="82" width="60" height="26" rx="13" fill="#14213D"/>
<text x="110" y="100" font-family="DM Sans" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="110" dy="0">O11</tspan></text>
<text x="160" y="100" font-family="DM Sans" font-size="13" fill="#55606F" text-anchor="start"><tspan x="160" dy="0">Business Process Technology — langlopend, mensen-in-de-lus</tspan></text>

<!-- Stage 1 -->
<rect x="80" y="300" width="220" height="120" rx="7" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1.5"/>
<text x="190" y="352" font-family="DM Sans" font-size="16" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="190" dy="0">Indienen</tspan></text>
<text x="190" y="374" font-family="DM Sans" font-size="11" fill="#55606F" text-anchor="middle"><tspan x="190" dy="0">werkgever dient mutatie in</tspan></text>
<text x="190" y="390" font-family="DM Sans" font-size="11" fill="#55606F" text-anchor="middle"><tspan x="190" dy="0">proces start</tspan></text>

<line x1="300" y1="360" x2="322" y2="360" stroke="#14213D" stroke-width="2" marker-end="url(#arrow181)"/>

<!-- Wait 1 -->
<rect x="326" y="320" width="200" height="80" rx="40" fill="#FBF4E6" stroke="#E9A13B" stroke-width="2.5" stroke-dasharray="7 4"/>
<circle cx="360" cy="352" r="10" fill="none" stroke="#14213D" stroke-width="1.5"/>
<line x1="360" y1="352" x2="360" y2="345" stroke="#14213D" stroke-width="1.5"/>
<line x1="360" y1="352" x2="365" y2="356" stroke="#14213D" stroke-width="1.5"/>
<text x="440" y="352" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="440" dy="0">Wachttoestand</tspan></text>
<text x="440" y="370" font-family="DM Sans" font-size="10" fill="#55606F" text-anchor="middle"><tspan x="440" dy="0">taak toegewezen</tspan></text>
<text x="440" y="384" font-family="DM Sans" font-size="10" fill="#55606F" text-anchor="middle"><tspan x="440" dy="0">aan behandelaar</tspan></text>

<line x1="526" y1="360" x2="548" y2="360" stroke="#14213D" stroke-width="2" marker-end="url(#arrow181)"/>

<!-- Stage 2 -->
<rect x="552" y="300" width="220" height="120" rx="7" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1.5"/>
<text x="662" y="352" font-family="DM Sans" font-size="16" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="662" dy="0">Beoordeling</tspan></text>
<text x="662" y="374" font-family="DM Sans" font-size="11" fill="#55606F" text-anchor="middle"><tspan x="662" dy="0">behandelaar controleert</tspan></text>
<text x="662" y="390" font-family="DM Sans" font-size="11" fill="#55606F" text-anchor="middle"><tspan x="662" dy="0">de mutatie inhoudelijk</tspan></text>

<line x1="772" y1="360" x2="794" y2="360" stroke="#14213D" stroke-width="2" marker-end="url(#arrow181)"/>

<!-- Wait 2 -->
<rect x="798" y="320" width="200" height="80" rx="40" fill="#FBF4E6" stroke="#E9A13B" stroke-width="2.5" stroke-dasharray="7 4"/>
<circle cx="832" cy="352" r="10" fill="none" stroke="#14213D" stroke-width="1.5"/>
<line x1="832" y1="352" x2="832" y2="345" stroke="#14213D" stroke-width="1.5"/>
<line x1="832" y1="352" x2="837" y2="356" stroke="#14213D" stroke-width="1.5"/>
<text x="912" y="352" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="912" dy="0">Wachttoestand</tspan></text>
<text x="912" y="370" font-family="DM Sans" font-size="10" fill="#55606F" text-anchor="middle"><tspan x="912" dy="0">wacht op</tspan></text>
<text x="912" y="384" font-family="DM Sans" font-size="10" fill="#55606F" text-anchor="middle"><tspan x="912" dy="0">goedkeurder</tspan></text>

<line x1="998" y1="360" x2="1020" y2="360" stroke="#14213D" stroke-width="2" marker-end="url(#arrow181)"/>

<!-- Stage 3 -->
<rect x="1024" y="300" width="220" height="120" rx="7" fill="#FBF4E6" stroke="#E9A13B" stroke-width="2.5"/>
<text x="1134" y="352" font-family="DM Sans" font-size="16" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="1134" dy="0">Goedkeuring</tspan></text>
<text x="1134" y="374" font-family="DM Sans" font-size="11" fill="#55606F" text-anchor="middle"><tspan x="1134" dy="0">goedkeurder bevestigt,</tspan></text>
<text x="1134" y="390" font-family="DM Sans" font-size="11" fill="#55606F" text-anchor="middle"><tspan x="1134" dy="0">proces afgerond</tspan></text>

<!-- Escalation branch -->
<line x1="898" y1="400" x2="898" y2="460" stroke="#E9A13B" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow181d)"/>
<rect x="748" y="464" width="300" height="72" rx="6" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2" stroke-dasharray="5 4"/>
<text x="898" y="492" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="898" dy="0">Escalatie na termijnoverschrijding</tspan></text>
<text x="898" y="512" font-family="DM Sans" font-size="10" fill="#55606F" text-anchor="middle"><tspan x="898" dy="0">automatisch, taak herverdeeld — proces blijft actief</tspan></text>
<path d="M 748 500 L 662 500 L 662 420" fill="none" stroke="#E9A13B" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow181d)"/>

<!-- Legend -->
<rect x="380" y="620" width="18" height="18" rx="9" fill="#FBF4E6" stroke="#E9A13B" stroke-width="2.5" stroke-dasharray="4 3"/>
<text x="406" y="633" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="start"><tspan x="406" dy="0">wachttoestand — mensen-in-de-lus, geen vast tijdstip</tspan></text>
<rect x="800" y="620" width="18" height="18" rx="3" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1.5"/>
<text x="826" y="633" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="start"><tspan x="826" dy="0">proces-stap — actieve verwerking</tspan></text>

<text x="700" y="682" font-family="Cormorant Garamond" font-size="19" font-style="italic" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Taaktoewijzing, wachttoestanden en escalaties — ingebouwd in BPT.</tspan></text>
</svg>
