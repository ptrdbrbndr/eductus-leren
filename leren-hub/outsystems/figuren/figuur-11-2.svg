<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860">
<defs>
<marker id="arrow112" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#14213D"/>
</marker>
<marker id="arrow112f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#E9A13B"/>
</marker>
</defs>
<rect width="1400" height="860" fill="#FFFFFF"/>
<text x="700" y="48" font-family="Cormorant Garamond" font-size="26" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">De vierlagenregel — afhankelijkheden lopen altijd naar beneden</tspan></text>

<!-- Layer 1: End-User -->
<rect x="330" y="90" width="740" height="110" rx="6" fill="#F4F6F9" stroke="#14213D" stroke-width="2"/>
<text x="700" y="122" font-family="DM Sans" font-size="18" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">1. End-User Layer</tspan></text>
<text x="700" y="146" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">Schermen voor eindgebruikers</tspan></text>
<text x="700" y="168" font-family="DM Sans" font-size="11" fill="#2563A8" text-anchor="middle"><tspan x="700" dy="0">WGP 2.0 · Verzuimmeldingen · overige satellieten</tspan></text>

<line x1="700" y1="200" x2="700" y2="238" stroke="#14213D" stroke-width="2.5" marker-end="url(#arrow112)"/>

<!-- Layer 2: Core -->
<rect x="330" y="243" width="740" height="110" rx="6" fill="#F4F6F9" stroke="#14213D" stroke-width="2"/>
<text x="700" y="275" font-family="DM Sans" font-size="18" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">2. Core Layer</tspan></text>
<text x="700" y="299" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">Gedeelde bedrijfslogica</tspan></text>
<text x="700" y="321" font-family="DM Sans" font-size="11" fill="#2563A8" text-anchor="middle"><tspan x="700" dy="0">mutatielogica, entities als Werkgever</tspan></text>

<line x1="700" y1="353" x2="700" y2="391" stroke="#14213D" stroke-width="2.5" marker-end="url(#arrow112)"/>

<!-- Layer 3: Foundation -->
<rect x="330" y="396" width="740" height="110" rx="6" fill="#F4F6F9" stroke="#14213D" stroke-width="2"/>
<text x="700" y="428" font-family="DM Sans" font-size="18" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">3. Foundation Layer</tspan></text>
<text x="700" y="452" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">Generieke bouwstenen</tspan></text>
<text x="700" y="474" font-family="DM Sans" font-size="11" fill="#2563A8" text-anchor="middle"><tspan x="700" dy="0">design system, technische hulpmodules</tspan></text>

<line x1="700" y1="506" x2="700" y2="544" stroke="#14213D" stroke-width="2.5" marker-end="url(#arrow112)"/>

<!-- Layer 4: Widest Reach -->
<rect x="330" y="549" width="740" height="110" rx="6" fill="#F4F6F9" stroke="#14213D" stroke-width="2"/>
<text x="700" y="581" font-family="DM Sans" font-size="18" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">4. Widest Reach Layer</tspan></text>
<text x="700" y="605" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">Breed herbruikbaar, organisatiebreed</tspan></text>
<text x="700" y="627" font-family="DM Sans" font-size="11" fill="#2563A8" text-anchor="middle"><tspan x="700" dy="0">bruikbaar buiten het Meridiaan-landschap alleen</tspan></text>

<text x="700" y="700" font-family="DM Sans" font-size="14" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Afhankelijkheden lopen altijd naar beneden. Nooit naar boven.</tspan></text>

<!-- forbidden upward path, right side -->
<line x1="1130" y1="640" x2="1130" y2="145" stroke="#E9A13B" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow112f)"/>
<circle cx="1130" cy="392" r="22" fill="#FBF4E6" stroke="#E9A13B" stroke-width="2.5"/>
<text x="1130" y="399" font-family="DM Sans" font-size="20" font-weight="bold" fill="#E9A13B" text-anchor="middle"><tspan x="1130" dy="0">&#215;</tspan></text>
<text x="1200" y="380" font-family="DM Sans" font-size="12" font-weight="bold" fill="#E9A13B" text-anchor="middle" transform="rotate(-90 1200 380)"><tspan x="1200" dy="0">nooit toegestaan</tspan></text>

<!-- allowed downward label, left side -->
<line x1="270" y1="145" x2="270" y2="640" stroke="#14213D" stroke-width="2" marker-end="url(#arrow112)"/>
<text x="200" y="392" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D" text-anchor="middle" transform="rotate(-90 200 392)"><tspan x="200" dy="0">toegestane richting</tspan></text>

<!-- legend -->
<rect x="330" y="740" width="740" height="90" rx="6" fill="#FBFAF7" stroke="#DFDCD3" stroke-width="1"/>
<line x1="352" y1="762" x2="390" y2="762" stroke="#14213D" stroke-width="2.5" marker-end="url(#arrow112)"/>
<text x="400" y="767" font-family="DM Sans" font-size="12" fill="#55606F"><tspan x="400" dy="0">Toegestaan: een hogere laag mag afhankelijk zijn van een lagere laag</tspan></text>
<line x1="352" y1="795" x2="390" y2="795" stroke="#E9A13B" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow112f)"/>
<text x="400" y="800" font-family="DM Sans" font-size="12" fill="#55606F"><tspan x="400" dy="0">Verboden: een Foundation-module mag nooit afhankelijk zijn van een End-User-module</tspan></text>
</svg>
