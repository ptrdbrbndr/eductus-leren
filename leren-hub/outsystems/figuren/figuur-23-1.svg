<text x="700" y="180" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">hoog? (deel 20)</tspan></text>

<!-- root JA -> herbouwen -->
<line x1="800" y1="170" x2="1020" y2="170" stroke="#14213D" stroke-width="2" marker-end="url(#arrow231)"/>
