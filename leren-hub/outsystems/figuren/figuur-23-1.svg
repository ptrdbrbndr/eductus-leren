<text x="554" y="681" font-family="DM Sans" font-size="12" fill="#55606F"><tspan x="554" dy="0">Herbouwen</tspan></text>
<text x="700" y="720" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">Schuld domineert: bij hoge technische schuld wint herbouwen, ongeacht BPT of afhankelijkheden (23.3)</tspan></text>
<text x="700" y="742" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">Migratie is pas gerechtvaardigd bij actieve doorontwikkeling, nadere infra-einde-levensduur, of bewuste platformkeuze (23.2)</tspan></text>
