<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
<defs>
<marker id="arrow4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#14213D"/>
</marker>
<marker id="arrow4e" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#E9A13B"/>
</marker>
</defs>
<rect width="1400" height="800" fill="#FFFFFF"/>
<text x="700" y="46" font-family="Cormorant Garamond" font-size="26" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Flow AanmaakMelding — conditie, create-tak en exception-tak</tspan></text>

<!-- Start -->
<rect x="620" y="70" width="160" height="46" rx="23" fill="#14213D"/>
<text x="700" y="98" font-family="DM Sans" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="700" dy="0">Start: AanmaakMelding</tspan></text>

<line x1="700" y1="116" x2="700" y2="150" stroke="#14213D" stroke-width="2" marker-end="url(#arrow4)"/>

<!-- If diamond -->
<polygon points="700,150 830,222 700,294 570,222" fill="#F4F6F9" stroke="#2563A8" stroke-width="2"/>
<text x="700" y="216" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">If: StartDatum</tspan></text>
<text x="700" y="232" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">geldig?</tspan></text>

<!-- Nee branch -->
<line x1="570" y1="222" x2="330" y2="222" stroke="#14213D" stroke-width="2"/>
<line x1="330" y1="222" x2="330" y2="290" stroke="#14213D" stroke-width="2" marker-end="url(#arrow4)"/>
<text x="450" y="212" font-family="DM Sans" font-size="12" font-weight="bold" fill="#55606F" text-anchor="middle"><tspan x="450" dy="0">nee</tspan></text>

<rect x="200" y="296" width="260" height="64" rx="6" fill="#FFFFFF" stroke="#14213D" stroke-width="1.5"/>
<text x="330" y="322" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="330" dy="0">Assign: foutmelding</tspan></text>
<text x="330" y="342" font-family="DM Sans" font-size="11" fill="#55606F" text-anchor="middle"><tspan x="330" dy="0">"Ongeldige startdatum"</tspan></text>

<line x1="330" y1="360" x2="330" y2="410" stroke="#14213D" stroke-width="2"/>
<line x1="330" y1="410" x2="560" y2="410" stroke="#14213D" stroke-width="2" marker-end="url(#arrow4)"/>

<!-- Ja branch -->
<line x1="830" y1="222" x2="1050" y2="222" stroke="#14213D" stroke-width="2"/>
<line x1="1050" y1="222" x2="1050" y2="290" stroke="#14213D" stroke-width="2" marker-end="url(#arrow4)"/>
<text x="945" y="212" font-family="DM Sans" font-size="12" font-weight="bold" fill="#55606F" text-anchor="middle"><tspan x="945" dy="0">ja</tspan></text>

<rect x="920" y="296" width="260" height="64" rx="6" fill="#F4F6F9" stroke="#2563A8" stroke-width="2"/>
<text x="1050" y="322" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="1050" dy="0">Create Melding</tspan></text>
<text x="1050" y="342" font-family="DM Sans" font-size="11" fill="#55606F" text-anchor="middle"><tspan x="1050" dy="0">Status = Nieuw</tspan></text>

<!-- Create -> success -->
<line x1="1050" y1="360" x2="1050" y2="404" stroke="#14213D" stroke-width="2" marker-end="url(#arrow4)"/>
<text x="1060" y="386" font-family="DM Sans" font-size="11" fill="#55606F"><tspan x="1060" dy="0">gelukt</tspan></text>

<!-- Create -> exception (amber, dashed) -->
<line x1="920" y1="330" x2="790" y2="410" stroke="#E9A13B" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow4e)"/>
<text x="820" y="380" font-family="DM Sans" font-size="11" font-weight="bold" fill="#E9A13B"><tspan x="820" dy="0">exception</tspan></text>
<text x="820" y="394" font-family="DM Sans" font-size="10" fill="#55606F"><tspan x="820" dy="0">(databaseconflict)</tspan></text>

<!-- Exception handler node -->
<rect x="650" y="410" width="270" height="64" rx="6" fill="#FBF4E6" stroke="#E9A13B" stroke-width="2"/>
<text x="785" y="436" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="785" dy="0">Exception Handler</tspan></text>
<text x="785" y="456" font-family="DM Sans" font-size="11" fill="#55606F" text-anchor="middle"><tspan x="785" dy="0">vangt de fout gestructureerd op</tspan></text>

<!-- merge assign-foutmelding + exception handler -> common fout end -->
<line x1="560" y1="410" x2="560" y2="410" stroke="#14213D" stroke-width="2"/>
<rect x="330" y="410" width="230" height="0" fill="none"/>
<line x1="560" y1="410" x2="620" y2="410" stroke="#14213D" stroke-width="0" opacity="0"/>

<line x1="560" y1="410" x2="560" y2="530" stroke="#14213D" stroke-width="2"/>
<line x1="785" y1="474" x2="785" y2="500" stroke="#E9A13B" stroke-width="2"/>
<line x1="785" y1="500" x2="560" y2="500" stroke="#E9A13B" stroke-width="2"/>
<line x1="560" y1="500" x2="560" y2="530" stroke="#14213D" stroke-width="2" marker-end="url(#arrow4)"/>

<rect x="440" y="536" width="260" height="70" rx="6" fill="#FFFFFF" stroke="#14213D" stroke-width="1.5"/>
<text x="570" y="562" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="570" dy="0">Gebruikersboodschap</tspan></text>
<text x="570" y="580" font-family="DM Sans" font-size="11" fill="#55606F" text-anchor="middle"><tspan x="570" dy="0">"De melding kon niet worden</tspan></text>
<text x="570" y="595" font-family="DM Sans" font-size="11" fill="#55606F" text-anchor="middle"><tspan x="570" dy="0">opgeslagen, probeer het opnieuw"</tspan></text>

<line x1="570" y1="606" x2="570" y2="650" stroke="#14213D" stroke-width="2" marker-end="url(#arrow4)"/>

<rect x="450" y="656" width="240" height="46" rx="23" fill="#55606F"/>
<text x="570" y="684" font-family="DM Sans" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="570" dy="0">Einde: fout</tspan></text>

<!-- success rect and end -->
<rect x="920" y="404" width="260" height="64" rx="6" fill="#FFFFFF" stroke="#14213D" stroke-width="1.5"/>
<text x="1050" y="430" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="1050" dy="0">Melding opgeslagen</tspan></text>
<text x="1050" y="450" font-family="DM Sans" font-size="11" fill="#55606F" text-anchor="middle"><tspan x="1050" dy="0">Status: Nieuw</tspan></text>

<line x1="1050" y1="468" x2="1050" y2="656" stroke="#14213D" stroke-width="2" marker-end="url(#arrow4)"/>

<rect x="930" y="656" width="240" height="46" rx="23" fill="#2563A8"/>
<text x="1050" y="684" font-family="DM Sans" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="1050" dy="0">Einde: succes</tspan></text>

<!-- legend -->
<rect x="100" y="730" width="1200" height="46" rx="5" fill="#F4F6F9" stroke="#DFDCD3" stroke-width="1"/>
<line x1="122" y1="753" x2="150" y2="753" stroke="#14213D" stroke-width="2"/>
<text x="158" y="757" font-family="DM Sans" font-size="11" fill="#55606F"><tspan x="158" dy="0">reguliere flow</tspan></text>
<line x1="330" y1="753" x2="358" y2="753" stroke="#E9A13B" stroke-width="2" stroke-dasharray="6 4"/>
<text x="366" y="757" font-family="DM Sans" font-size="11" fill="#55606F"><tspan x="366" dy="0">exception-tak</tspan></text>
<text x="620" y="757" font-family="DM Sans" font-size="11" fill="#55606F"><tspan x="620" dy="0">Beperkt aantal bouwstenen (Aggregate, Create/Update/Delete, If, For Each, expressie) houdt de flow leesbaar</tspan></text>
</svg>
