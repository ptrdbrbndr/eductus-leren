<rect width="1400" height="720" fill="#FFFFFF"/>
<text x="700" y="48" font-family="Cormorant Garamond" font-size="26" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Werkgever in de Core &#8212; &#233;&#233;n eigenaar, meerdere lezers</tspan></text>

<!-- Core zone -->
