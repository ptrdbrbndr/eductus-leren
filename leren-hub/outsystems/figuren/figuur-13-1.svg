<text x="560" y="220" font-family="DM Sans" font-size="11" fill="#55606F"><tspan x="560" dy="0">Naam</tspan></text>
<text x="560" y="240" font-family="DM Sans" font-size="11" fill="#55606F"><tspan x="560" dy="0">KvK-nummer</tspan></text>
<text x="560" y="260" font-family="DM Sans" font-size="11" fill="#55606F"><tspan x="560" dy="0">Loonheffingennummer</tspan></text>
<text x="560" y="280" font-family="DM Sans" font-size="11" fill="#55606F"><tspan x="560" dy="0">Status</tspan></text>
<rect x="558" y="298" width="244" height="26" rx="13" fill="#FBF4E6" stroke="#E9A13B" stroke-width="1.5"/>
<text x="680" y="315" font-family="DM Sans" font-size="10" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="680" dy="0">schrijven: alleen deze module</tspan></text>

<!-- WGP 2.0 -->
<rect x="120" y="470" width="330" height="100" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="2"/>
<text x="285" y="505" font-family="DM Sans" font-size="16" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="285" dy="0">WGP 2.0</tspan></text>
<text x="285" y="528" font-family="DM Sans" font-size="11" fill="#55606F" text-anchor="middle"><tspan x="285" dy="0">applicatie &#8212; ODC</tspan></text>
<text x="285" y="548" font-family="DM Sans" font-size="11" fill="#2563A8" text-anchor="middle"><tspan x="285" dy="0">leest Werkgever via relatie</tspan></text>

<!-- Verzuimmeldingen -->
<rect x="950" y="470" width="330" height="100" rx="6" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2"/>
<text x="1115" y="505" font-family="DM Sans" font-size="16" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="1115" dy="0">Verzuimmeldingen</tspan></text>
<text x="1115" y="528" font-family="DM Sans" font-size="11" fill="#55606F" text-anchor="middle"><tspan x="1115" dy="0">applicatie &#8212; O11 (casus niveau 1)</tspan></text>
<text x="1115" y="548" font-family="DM Sans" font-size="11" fill="#2563A8" text-anchor="middle"><tspan x="1115" dy="0">leest Werkgever via relatie</tspan></text>

<!-- read arrows, from Werkgever to apps, dashed, labeled leest -->
<path d="M540,300 C 380,300 300,380 285,470" fill="none" stroke="#2563A8" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#arrow131)"/>
<text x="330" y="400" font-family="DM Sans" font-size="12" font-weight="bold" fill="#2563A8"><tspan x="330" dy="0">leest (read-only)</tspan></text>

<path d="M860,300 C 1020,300 1100,380 1115,470" fill="none" stroke="#2563A8" stroke-width="2.5" stroke-dasharray="7 4" marker-end="url(#arrow131)"/>
<text x="980" y="400" font-family="DM Sans" font-size="12" font-weight="bold" fill="#2563A8"><tspan x="980" dy="0">leest (read-only)</tspan></text>

<!-- writes arrow, solid, from Core module label down into entity already implied - add small write badge on entity -->

<rect x="140" y="610" width="1120" height="70" rx="6" fill="#FBFAF7" stroke="#DFDCD3" stroke-width="1"/>
<text x="700" y="636" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">E&#233;n module schrijft, beheert en bewaakt de levenscyclus van Werkgever. Andere modules mogen lezen en verwijzen,</tspan></text>
<text x="700" y="656" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">maar horen niet buiten de eigenaar om te schrijven &#8212; een architectuurdiscipline, geen technische afdwinging.</tspan></text>
</svg>
