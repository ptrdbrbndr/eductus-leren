<!-- Werkgever entity card -->
<rect x="540" y="140" width="320" height="200" rx="6" fill="#FFFFFF" stroke="#14213D" stroke-width="2"/>
<rect x="540" y="140" width="320" height="38" rx="6" fill="#14213D"/>
<rect x="540" y="164" width="320" height="14" fill="#14213D"/>
<text x="700" y="165" font-family="DM Sans" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="700" dy="0">Werkgever</tspan></text>
