<text x="1180" y="238" font-family="DM Sans" font-size="15" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="1180" dy="0">Directe databasetoegang</tspan></text>
<text x="1180" y="256" font-family="DM Sans" font-size="11" fill="#2563A8" text-anchor="middle"><tspan x="1180" dy="0">(deel 3, 13)</tspan></text>
<text x="1180" y="280" font-family="DM Sans" font-size="11.5" fill="#55606F" text-anchor="middle"><tspan x="1180" dy="0">Queries buiten het platform</tspan></text>
<text x="1180" y="298" font-family="DM Sans" font-size="11.5" fill="#55606F" text-anchor="middle"><tspan x="1180" dy="0">om herzien naar de entity-</tspan></text>
<text x="1180" y="316" font-family="DM Sans" font-size="11.5" fill="#55606F" text-anchor="middle"><tspan x="1180" dy="0">laag of een API-koppelvlak</tspan></text>
