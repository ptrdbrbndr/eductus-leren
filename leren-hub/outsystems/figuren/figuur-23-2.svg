<text x="540" y="280" font-family="DM Sans" font-size="11.5" fill="#55606F" text-anchor="middle"><tspan x="540" dy="0">Geen automatische conversie.</tspan></text>
<text x="540" y="298" font-family="DM Sans" font-size="11.5" fill="#55606F" text-anchor="middle"><tspan x="540" dy="0">Elk proces vraagt herontwerp</tspan></text>
<text x="540" y="316" font-family="DM Sans" font-size="11.5" fill="#55606F" text-anchor="middle"><tspan x="540" dy="0">als expliciete statusmachine</tspan></text>
<line x1="420" y1="335" x2="660" y2="335" stroke="#DFDCD3" stroke-width="1"/>
<circle cx="516" cy="360" r="7" fill="#E9A13B" stroke="#E9A13B" stroke-width="1.5"/>
<circle cx="540" cy="360" r="7" fill="#E9A13B" stroke="#E9A13B" stroke-width="1.5"/>
<circle cx="564" cy="360" r="7" fill="#E9A13B" stroke="#E9A13B" stroke-width="1.5"/>
<text x="540" y="386" font-family="DM Sans" font-size="12" font-weight="bold" fill="#E9A13B" text-anchor="middle"><tspan x="540" dy="0">Impact: hoog</tspan></text>

