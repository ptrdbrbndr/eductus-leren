<circle cx="1156" cy="360" r="7" fill="#E9A13B" stroke="#E9A13B" stroke-width="1.5"/>
<circle cx="1180" cy="360" r="7" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1.5"/>
<circle cx="1204" cy="360" r="7" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1.5"/>
<text x="1180" y="386" font-family="DM Sans" font-size="12" font-weight="bold" fill="#55606F" text-anchor="middle"><tspan x="1180" dy="0">Impact: laag</tspan></text>

<!-- Note bar -->
<rect x="80" y="460" width="1240" height="90" rx="5" fill="#F4F6F9" stroke="#DFDCD3" stroke-width="1"/>
<text x="700" y="495" font-family="DM Sans" font-size="13" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Vier obstakels vormen een optelsom, geen gemiddelde</tspan></text>
<text x="700" y="518" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">Elk obstakel telt afzonderlijk mee in de migratie-inschatting per module &#8212; BPT-processen wegen het zwaarst</tspan></text>
