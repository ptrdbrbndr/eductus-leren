<path d="M0,0 L10,5 L0,10 z" fill="#2563A8"/>
</marker>
</defs>
<rect width="1400" height="620" fill="#FFFFFF"/>
<text x="700" y="42" font-family="Cormorant Garamond" font-size="26" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Vier obstakels &#8212; wat je bewust niet meeneemt</tspan></text>

<!-- Card 1: Gebruikersbeheer -->
<rect x="80" y="130" width="280" height="300" rx="8" fill="#FFFFFF" stroke="#14213D" stroke-width="1.5"/>
