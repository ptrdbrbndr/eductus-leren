<circle cx="836" cy="360" r="7" fill="#E9A13B" stroke="#E9A13B" stroke-width="1.5"/>
<circle cx="860" cy="360" r="7" fill="#E9A13B" stroke="#E9A13B" stroke-width="1.5"/>
<circle cx="884" cy="360" r="7" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1.5"/>
<text x="860" y="386" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="860" dy="0">Impact: gemiddeld</tspan></text>

<!-- Card 4: Directe databasetoegang -->
<rect x="1040" y="130" width="280" height="300" rx="8" fill="#FFFFFF" stroke="#14213D" stroke-width="1.5"/>
