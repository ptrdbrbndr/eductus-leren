<line x1="246" y1="178" x2="256" y2="178" stroke="#2563A8" stroke-width="2" marker-end="url(#arrow232)"/>
<rect x="258" y="167" width="36" height="22" rx="4" fill="#2563A8"/>
<text x="276" y="182" font-family="DM Sans" font-size="9" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="276" dy="0">IAM</tspan></text>
<text x="220" y="238" font-family="DM Sans" font-size="15" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="220" dy="0">Gebruikersbeheer</tspan></text>
<text x="220" y="256" font-family="DM Sans" font-size="11" fill="#2563A8" text-anchor="middle"><tspan x="220" dy="0">(deel 8)</tspan></text>
<text x="220" y="280" font-family="DM Sans" font-size="11.5" fill="#55606F" text-anchor="middle"><tspan x="220" dy="0">IT Users migreren niet</tspan></text>
<text x="220" y="298" font-family="DM Sans" font-size="11.5" fill="#55606F" text-anchor="middle"><tspan x="220" dy="0">automatisch naar IAM &#8212; elke</tspan></text>
<text x="220" y="316" font-family="DM Sans" font-size="11.5" fill="#55606F" text-anchor="middle"><tspan x="220" dy="0">gebruiker en rol bewust overzetten</tspan></text>
<line x1="100" y1="335" x2="340" y2="335" stroke="#DFDCD3" stroke-width="1"/>
<circle cx="196" cy="360" r="7" fill="#E9A13B" stroke="#E9A13B" stroke-width="1.5"/>
<circle cx="220" cy="360" r="7" fill="#E9A13B" stroke="#E9A13B" stroke-width="1.5"/>
<circle cx="244" cy="360" r="7" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1.5"/>
<text x="220" y="386" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="220" dy="0">Impact: gemiddeld</tspan></text>

<!-- Card 2: BPT-processen -->
<rect x="400" y="130" width="280" height="300" rx="8" fill="#FFFFFF" stroke="#14213D" stroke-width="1.5"/>
