<text x="122" y="182" font-family="DM Sans" font-size="12" font-weight="bold" fill="#55606F"><tspan x="122" dy="0">FLOW: AanmaakMelding</tspan></text>

<rect x="290" y="200" width="150" height="42" rx="21" fill="#14213D"/>
<text x="365" y="226" font-family="DM Sans" font-size="11" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="365" dy="0">Start</tspan></text>
<line x1="365" y1="242" x2="365" y2="272" stroke="#55606F" stroke-width="1.5" marker-end="url(#arrow5)"/>

<polygon points="365,272 420,308 365,344 310,308" fill="#F4F6F9" stroke="#DFDCD3" stroke-width="1.5"/>
<text x="365" y="304" font-family="DM Sans" font-size="9" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="365" dy="0">If: Startdatum</tspan></text>
<text x="365" y="316" font-family="DM Sans" font-size="9" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="365" dy="0">geldig?</tspan></text>
<line x1="365" y1="344" x2="365" y2="374" stroke="#55606F" stroke-width="1.5" marker-end="url(#arrow5)"/>
<text x="378" y="365" font-family="DM Sans" font-size="9" fill="#55606F"><tspan x="378" dy="0">ja</tspan></text>

