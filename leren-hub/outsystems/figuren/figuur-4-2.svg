<text x="380" y="139" font-family="DM Sans" font-size="10" font-weight="bold" fill="#2563A8" text-anchor="middle"><tspan x="380" dy="0">Continue</tspan></text>
<rect x="438" y="122" width="120" height="24" rx="4" fill="#FBF4E6" stroke="#E9A13B" stroke-width="1.5"/>
