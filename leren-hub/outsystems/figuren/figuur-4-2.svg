<text x="365" y="406" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="365" dy="0">Create Melding</tspan></text>
<text x="365" y="424" font-family="DM Sans" font-size="10" fill="#55606F" text-anchor="middle"><tspan x="365" dy="0">Status = Nieuw</tspan></text>
<!-- execution pointer -->
<polygon points="490,410 512,400 512,420" fill="#2563A8"/>
<text x="522" y="415" font-family="DM Sans" font-size="10" font-weight="bold" fill="#2563A8"><tspan x="522" dy="0">huidige stap</tspan></text>

<line x1="365" y1="440" x2="365" y2="470" stroke="#DFDCD3" stroke-width="1.5" marker-end="url(#arrow5)"/>
<rect x="290" y="476" width="150" height="42" rx="21" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1.5"/>
<text x="365" y="502" font-family="DM Sans" font-size="11" fill="#55606F" text-anchor="middle"><tspan x="365" dy="0">Einde</tspan></text>

<text x="122" y="580" font-family="DM Sans" font-size="11" fill="#55606F"><tspan x="122" dy="0">Breakpoint gezet op "Create Melding" — uitvoering pauzeert hier,</tspan></text>
<text x="122" y="598" font-family="DM Sans" font-size="11" fill="#55606F"><tspan x="122" dy="0">precies vóór de schrijfactie naar de database.</tspan></text>

<!-- right panel: variables -->
<rect x="740" y="154" width="540" height="482" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/>
<text x="762" y="182" font-family="DM Sans" font-size="12" font-weight="bold" fill="#55606F"><tspan x="762" dy="0">VARIABELEN OP DIT PUNT</tspan></text>

<rect x="760" y="198" width="500" height="32" fill="#14213D"/>
<text x="778" y="219" font-family="DM Sans" font-size="11" font-weight="bold" fill="#FFFFFF"><tspan x="778" dy="0">Naam</tspan></text>
<text x="1010" y="219" font-family="DM Sans" font-size="11" font-weight="bold" fill="#FFFFFF"><tspan x="1010" dy="0">Waarde</tspan></text>

<rect x="760" y="230" width="500" height="38" fill="#F4F6F9" stroke="#DFDCD3" stroke-width="1"/>
