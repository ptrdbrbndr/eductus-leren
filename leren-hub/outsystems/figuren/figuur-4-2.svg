<rect x="760" y="306" width="500" height="38" fill="#F4F6F9" stroke="#DFDCD3" stroke-width="1"/>
<text x="778" y="329" font-family="DM Sans" font-size="12" fill="#14213D"><tspan x="778" dy="0">Melding.StartDatum</tspan></text>
<text x="1010" y="329" font-family="DM Sans" font-size="12" fill="#2563A8"><tspan x="1010" dy="0">2026-08-10</tspan></text>

<rect x="760" y="344" width="500" height="38" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/>
<text x="778" y="367" font-family="DM Sans" font-size="12" fill="#14213D"><tspan x="778" dy="0">Melding.MeldingStatusId</tspan></text>
<text x="1010" y="367" font-family="DM Sans" font-size="12" fill="#2563A8"><tspan x="1010" dy="0">Nieuw</tspan></text>

<rect x="760" y="382" width="500" height="38" fill="#F4F6F9" stroke="#DFDCD3" stroke-width="1"/>
<text x="778" y="405" font-family="DM Sans" font-size="12" fill="#14213D"><tspan x="778" dy="0">IsGeldig</tspan></text>
<text x="1010" y="405" font-family="DM Sans" font-size="12" fill="#2563A8"><tspan x="1010" dy="0">True</tspan></text>

<rect x="760" y="420" width="500" height="38" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/>
<text x="778" y="443" font-family="DM Sans" font-size="12" fill="#14213D"><tspan x="778" dy="0">GetWerkgever.Werkgever.Naam</tspan></text>
<text x="1010" y="443" font-family="DM Sans" font-size="12" fill="#2563A8"><tspan x="1010" dy="0">"Bouwbedrijf Van Es"</tspan></text>

<rect x="760" y="474" width="500" height="140" rx="5" fill="#F4F6F9" stroke="#DFDCD3" stroke-width="1"/>
<text x="778" y="498" font-family="DM Sans" font-size="11" font-weight="bold" fill="#14213D"><tspan x="778" dy="0">O11 ↔ ODC</tspan></text>
<text x="778" y="520" font-family="DM Sans" font-size="11" fill="#55606F"><tspan x="778" dy="0">Conceptueel gelijk: stap voor stap door de flow,</tspan></text>
<text x="778" y="538" font-family="DM Sans" font-size="11" fill="#55606F"><tspan x="778" dy="0">variabelen inspecteren, breakpoints zetten.</tspan></text>
<text x="778" y="562" font-family="DM Sans" font-size="11" fill="#55606F"><tspan x="778" dy="0">O11: debug-sessie tegen specifieke Environment.</tspan></text>
<text x="778" y="580" font-family="DM Sans" font-size="11" fill="#55606F"><tspan x="778" dy="0">ODC: geïntegreerd in de cloud-workspace,</tspan></text>
<text x="778" y="598" font-family="DM Sans" font-size="11" fill="#55606F"><tspan x="778" dy="0">minder configuratie nodig.</tspan></text>
