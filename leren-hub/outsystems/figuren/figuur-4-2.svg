<text x="700" y="100" font-family="DM Sans" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="700" dy="0">Debug — AanmaakMelding — Environment: Test</tspan></text>

<!-- toolbar -->
<rect x="100" y="114" width="1200" height="40" fill="#F4F6F9" stroke="#DFDCD3" stroke-width="1"/>
