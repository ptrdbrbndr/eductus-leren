<path d="M0,0 L10,5 L0,10 z" fill="#55606F"/>
</marker>
</defs>
<rect width="1400" height="720" fill="#FFFFFF"/>
<text x="700" y="46" font-family="Cormorant Garamond" font-size="26" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Debugger-scherm met breakpoint en variabele-inspectie</tspan></text>

<!-- window frame -->
<rect x="100" y="76" width="1200" height="560" rx="6" fill="#FFFFFF" stroke="#14213D" stroke-width="1.5"/>
