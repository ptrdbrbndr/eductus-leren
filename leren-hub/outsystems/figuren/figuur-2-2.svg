<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
<defs>
<marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#55606F"/>
</marker>
<marker id="arrow3a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#E9A13B"/>
</marker>
</defs>
<rect width="1400" height="720" fill="#FFFFFF"/>
<text x="700" y="48" font-family="Cormorant Garamond" font-size="26" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">TrueChange: kleine wijziging versus veel afhankelijkheden</tspan></text>

<!-- Left panel -->
<rect x="55" y="80" width="620" height="580" rx="8" fill="#FBFAF7" stroke="#DFDCD3" stroke-width="1.5"/>
<text x="365" y="115" font-family="DM Sans" font-size="17" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="365" dy="0">Label-tekst aanpassen</tspan></text>
<text x="365" y="136" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle"><tspan x="365" dy="0">Eén element gewijzigd, geen afhankelijkheden</tspan></text>

<circle cx="365" cy="205" r="30" fill="#FBF4E6" stroke="#E9A13B" stroke-width="2.5"/>
<text x="365" y="201" font-family="DM Sans" font-size="10" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="365" dy="0">Label</tspan></text>
<text x="365" y="213" font-family="DM Sans" font-size="9" fill="#14213D" text-anchor="middle"><tspan x="365" dy="0">"Startdatum"</tspan></text>

<line x1="365" y1="235" x2="365" y2="275" stroke="#E9A13B" stroke-width="2.5" marker-end="url(#arrow3a)"/>

<rect x="275" y="280" width="180" height="52" rx="5" fill="#FBF4E6" stroke="#E9A13B" stroke-width="2"/>
<text x="365" y="302" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="365" dy="0">Scherm: Nieuwe melding</tspan></text>
<text x="365" y="320" font-family="DM Sans" font-size="10" fill="#14213D" text-anchor="middle"><tspan x="365" dy="0">wordt gerecompileerd</tspan></text>

<!-- untouched neighbours -->
<rect x="90" y="290" width="140" height="40" rx="5" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/>
<text x="160" y="314" font-family="DM Sans" font-size="10" fill="#55606F" text-anchor="middle"><tspan x="160" dy="0">Scherm: Overzicht</tspan></text>
<rect x="510" y="290" width="140" height="40" rx="5" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/>
<text x="580" y="314" font-family="DM Sans" font-size="10" fill="#55606F" text-anchor="middle"><tspan x="580" dy="0">AanmaakMelding</tspan></text>
<rect x="90" y="350" width="140" height="40" rx="5" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/>
<text x="160" y="374" font-family="DM Sans" font-size="10" fill="#55606F" text-anchor="middle"><tspan x="160" dy="0">Entity: Melding</tspan></text>
<rect x="510" y="350" width="140" height="40" rx="5" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/>
<text x="580" y="374" font-family="DM Sans" font-size="10" fill="#55606F" text-anchor="middle"><tspan x="580" dy="0">Entity: Werkgever</tspan></text>
<text x="365" y="415" font-family="DM Sans" font-size="11" font-style="italic" fill="#55606F" text-anchor="middle"><tspan x="365" dy="0">— overige elementen: ongewijzigd, niet geraakt —</tspan></text>

<text x="90" y="470" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D"><tspan x="90" dy="0">Publicatietijd</tspan></text>
<rect x="90" y="480" width="500" height="22" rx="4" fill="#F4F6F9" stroke="#DFDCD3" stroke-width="1"/>
<rect x="90" y="480" width="80" height="22" rx="4" fill="#2563A8"/>
<text x="365" y="525" font-family="DM Sans" font-size="13" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="365" dy="0">Seconden — TrueChange raakt slechts één afhankelijkheid</tspan></text>

<rect x="90" y="565" width="500" height="70" rx="5" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="365" y="590" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle"><tspan x="365" dy="0">TrueChange hercompileert alleen het gewijzigde</tspan></text>
<text x="365" y="608" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle"><tspan x="365" dy="0">element en zijn (hier: enige) afhankelijkheid</tspan></text>

<!-- Right panel -->
<rect x="725" y="80" width="620" height="580" rx="8" fill="#FBFAF7" stroke="#DFDCD3" stroke-width="1.5"/>
<text x="1035" y="115" font-family="DM Sans" font-size="17" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="1035" dy="0">Entity-attribuut wijzigen</tspan></text>
<text x="1035" y="136" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle"><tspan x="1035" dy="0">Eén element, tien schermen hangen ervan af</tspan></text>

<circle cx="1035" cy="215" r="34" fill="#FBF4E6" stroke="#E9A13B" stroke-width="2.5"/>
<text x="1035" y="210" font-family="DM Sans" font-size="9" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="1035" dy="0">Melding</tspan></text>
<text x="1035" y="222" font-family="DM Sans" font-size="9" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="1035" dy="0">.StartDatum</tspan></text>

<!-- radiating dependents -->
<line x1="915" y1="235" x2="835" y2="290" stroke="#E9A13B" stroke-width="2" marker-end="url(#arrow3a)"/>
<line x1="965" y1="248" x2="920" y2="300" stroke="#E9A13B" stroke-width="2" marker-end="url(#arrow3a)"/>
<line x1="1035" y1="249" x2="1035" y2="300" stroke="#E9A13B" stroke-width="2" marker-end="url(#arrow3a)"/>
<line x1="1105" y1="248" x2="1150" y2="300" stroke="#E9A13B" stroke-width="2" marker-end="url(#arrow3a)"/>
<line x1="1155" y1="235" x2="1235" y2="290" stroke="#E9A13B" stroke-width="2" marker-end="url(#arrow3a)"/>

<rect x="770" y="305" width="130" height="36" rx="4" fill="#FBF4E6" stroke="#E9A13B" stroke-width="1.5"/>
<text x="835" y="328" font-family="DM Sans" font-size="10" fill="#14213D" text-anchor="middle"><tspan x="835" dy="0">Scherm: Nieuwe melding</tspan></text>
<rect x="855" y="305" width="130" height="36" rx="4" fill="#FBF4E6" stroke="#E9A13B" stroke-width="1.5"/>
<text x="920" y="328" font-family="DM Sans" font-size="10" fill="#14213D" text-anchor="middle"><tspan x="920" dy="0">Scherm: Overzicht</tspan></text>
<rect x="970" y="305" width="130" height="36" rx="4" fill="#FBF4E6" stroke="#E9A13B" stroke-width="1.5"/>
<text x="1035" y="328" font-family="DM Sans" font-size="10" fill="#14213D" text-anchor="middle"><tspan x="1035" dy="0">AanmaakMelding</tspan></text>
<rect x="1085" y="305" width="130" height="36" rx="4" fill="#FBF4E6" stroke="#E9A13B" stroke-width="1.5"/>
<text x="1150" y="328" font-family="DM Sans" font-size="10" fill="#14213D" text-anchor="middle"><tspan x="1150" dy="0">Scherm: Detail</tspan></text>
<rect x="1170" y="305" width="130" height="36" rx="4" fill="#FBF4E6" stroke="#E9A13B" stroke-width="1.5"/>
<text x="1235" y="328" font-family="DM Sans" font-size="10" fill="#14213D" text-anchor="middle"><tspan x="1235" dy="0">+ 6 andere schermen</tspan></text>

<text x="1035" y="415" font-family="DM Sans" font-size="11" font-style="italic" fill="#55606F" text-anchor="middle"><tspan x="1035" dy="0">— tien afhankelijke elementen, allemaal opnieuw gecompileerd —</tspan></text>

<text x="760" y="470" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D"><tspan x="760" dy="0">Publicatietijd</tspan></text>
<rect x="760" y="480" width="500" height="22" rx="4" fill="#F4F6F9" stroke="#DFDCD3" stroke-width="1"/>
<rect x="760" y="480" width="480" height="22" rx="4" fill="#14213D"/>
<text x="1035" y="525" font-family="DM Sans" font-size="13" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="1035" dy="0">Trager — de hele afhankelijkheidsketen wordt doorgerekend</tspan></text>

<rect x="760" y="565" width="500" height="70" rx="5" fill="#FFFFFF" stroke="#14213D" stroke-width="1.5"/>
<text x="1035" y="590" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle"><tspan x="1035" dy="0">Zelfde mechanisme als links — maar met veel</tspan></text>
<text x="1035" y="608" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle"><tspan x="1035" dy="0">afhankelijkheden loopt de publicatietijd op</tspan></text>
</svg>
