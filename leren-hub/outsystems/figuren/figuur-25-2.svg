<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
<defs>
<marker id="arrow252" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#14213D"/>
</marker>
<marker id="arrow252w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#E9A13B"/>
</marker>
</defs>
<rect width="1400" height="760" fill="#FFFFFF"/>
<text x="700" y="42" font-family="Cormorant Garamond" font-size="26" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Beslisdiagram &#8212; bouwen, kopen of configureren</tspan></text>

<!-- Root diamond -->
<polygon points="700,115 810,170 700,225 590,170" fill="#F4F6F9" stroke="#2563A8" stroke-width="2"/>
<text x="700" y="164" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Onderscheidend &amp;</tspan></text>
<text x="700" y="180" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">bedrijfsspecifiek?</tspan></text>

<!-- root JA -> BOUWEN -->
<line x1="810" y1="170" x2="1000" y2="170" stroke="#14213D" stroke-width="2" marker-end="url(#arrow252)"/>
<text x="900" y="160" font-family="DM Sans" font-size="12" font-weight="bold" fill="#55606F" text-anchor="middle"><tspan x="900" dy="0">ja</tspan></text>

<rect x="1000" y="138" width="260" height="64" rx="6" fill="#F4F6F9" stroke="#2563A8" stroke-width="2.5"/>
<text x="1130" y="163" font-family="DM Sans" font-size="14" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="1130" dy="0">BOUWEN</tspan></text>
<text x="1130" y="183" font-family="DM Sans" font-size="10.5" fill="#55606F" text-anchor="middle"><tspan x="1130" dy="0">zelf ontwikkelen &#8212; kerncompetentie</tspan></text>

<!-- root NEE -> diamond2 -->
<line x1="700" y1="225" x2="700" y2="285" stroke="#14213D" stroke-width="2" marker-end="url(#arrow252)"/>
<text x="712" y="258" font-family="DM Sans" font-size="12" font-weight="bold" fill="#55606F"><tspan x="712" dy="0">nee</tspan></text>

<!-- Diamond 2 -->
<polygon points="700,285 830,340 700,395 570,340" fill="#F4F6F9" stroke="#2563A8" stroke-width="2"/>
<text x="700" y="334" font-family="DM Sans" font-size="11.5" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Beschikbaar als Forge-/</tspan></text>
<text x="700" y="350" font-family="DM Sans" font-size="11.5" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">marktplaats-component?</tspan></text>

<!-- diamond2 JA -> CONFIGUREREN -->
<line x1="570" y1="340" x2="420" y2="340" stroke="#14213D" stroke-width="2"/>
<line x1="420" y1="340" x2="420" y2="420" stroke="#14213D" stroke-width="2" marker-end="url(#arrow252)"/>
<text x="480" y="330" font-family="DM Sans" font-size="12" font-weight="bold" fill="#55606F" text-anchor="middle"><tspan x="480" dy="0">ja</tspan></text>

<rect x="300" y="420" width="240" height="90" rx="6" fill="#F4F6F9" stroke="#2563A8" stroke-width="2.5"/>
<text x="420" y="453" font-family="DM Sans" font-size="13.5" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="420" dy="0">CONFIGUREREN</tspan></text>
<text x="420" y="474" font-family="DM Sans" font-size="10.5" fill="#55606F" text-anchor="middle"><tspan x="420" dy="0">generieke Forge-/marktplaats-</tspan></text>
<text x="420" y="491" font-family="DM Sans" font-size="10.5" fill="#55606F" text-anchor="middle"><tspan x="420" dy="0">component (25.3)</tspan></text>

<!-- diamond2 NEE -> KOPEN -->
<line x1="830" y1="340" x2="980" y2="340" stroke="#14213D" stroke-width="2"/>
<line x1="980" y1="340" x2="980" y2="420" stroke="#14213D" stroke-width="2" marker-end="url(#arrow252)"/>
<text x="915" y="330" font-family="DM Sans" font-size="12" font-weight="bold" fill="#55606F" text-anchor="middle"><tspan x="915" dy="0">nee</tspan></text>

<rect x="860" y="420" width="240" height="90" rx="6" fill="#F4F6F9" stroke="#2563A8" stroke-width="2.5"/>
<text x="980" y="453" font-family="DM Sans" font-size="14" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="980" dy="0">KOPEN</tspan></text>
<text x="980" y="474" font-family="DM Sans" font-size="10.5" fill="#55606F" text-anchor="middle"><tspan x="980" dy="0">kant-en-klaar extern product</tspan></text>
<text x="980" y="491" font-family="DM Sans" font-size="10.5" fill="#55606F" text-anchor="middle"><tspan x="980" dy="0">(bv. SaaS voor documentbeheer)</tspan></text>

<!-- Warning connector -->
<line x1="700" y1="395" x2="700" y2="560" stroke="#E9A13B" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow252w)"/>
<text x="715" y="465" font-family="DM Sans" font-size="11" font-weight="bold" fill="#E9A13B"><tspan x="715" dy="0">als je dit toch</tspan></text>
<text x="715" y="481" font-family="DM Sans" font-size="11" font-weight="bold" fill="#E9A13B"><tspan x="715" dy="0">zelf bouwt &#8594;</tspan></text>

<!-- Warning box -->
<rect x="470" y="560" width="460" height="100" rx="6" fill="#FBF4E6" stroke="#E9A13B" stroke-width="2"/>
<text x="700" y="588" font-family="DM Sans" font-size="13" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Valkuil: generiek zelf bouwen</tspan></text>
<text x="700" y="608" font-family="DM Sans" font-size="11.5" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">Kostbaar onderhoud van zelfgebouwde, niet-onderscheidende</tspan></text>
<text x="700" y="626" font-family="DM Sans" font-size="11.5" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">functionaliteit &#8212; zonder concurrentievoordeel</tspan></text>
<text x="700" y="646" font-family="DM Sans" font-size="11.5" font-weight="bold" fill="#E9A13B" text-anchor="middle"><tspan x="700" dy="0">Een veelvoorkomende, kostbare valkuil (25.3)</tspan></text>

<!-- Caption -->
<rect x="100" y="690" width="1200" height="60" rx="5" fill="#F4F6F9" stroke="#DFDCD3" stroke-width="1"/>
<text x="700" y="715" font-family="DM Sans" font-size="13" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">De vuistregel</tspan></text>
<text x="700" y="736" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">Onderscheidend, bedrijfsspecifiek &#8594; bouwen. Generiek, elders goed opgelost &#8594; kopen of configureren (25.3)</tspan></text>
