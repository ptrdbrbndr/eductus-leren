<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
<defs>
<marker id="arrow7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#E9A13B"/>
</marker>
<marker id="arrow7b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#2563A8"/>
</marker>
</defs>
<rect width="1400" height="720" fill="#FFFFFF"/>
<text x="700" y="42" font-family="Cormorant Garamond" font-size="26" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">MeldingInvoer — velden en validatiekader</tspan></text>

<!-- Top-left intro box -->
<rect x="60" y="90" width="340" height="90" rx="6" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/>
<text x="76" y="114" font-family="DM Sans" font-size="11" font-weight="bold" fill="#14213D" text-anchor="start"><tspan x="76" dy="0">GETYPEERDE STRUCTUUR</tspan></text>
<text x="76" y="136" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="start"><tspan x="76" dy="0">Elk veld gekoppeld aan een record</tspan><tspan x="76" dy="17">met bekend type — eerste, grotendeels</tspan><tspan x="76" dy="17">gratis validatielaag.</tspan></text>

<!-- Notification toast top-right -->
<rect x="1000" y="90" width="340" height="90" rx="6" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/>
<text x="1016" y="114" font-family="DM Sans" font-size="11" font-weight="bold" fill="#2563A8" text-anchor="start"><tspan x="1016" dy="0">NOTIFICATION</tspan></text>
<circle cx="1024" cy="140" r="11" fill="#14213D"/>
<path d="M1018,140 L1022,144 L1030,135" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1042" y="137" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D" text-anchor="start"><tspan x="1042" dy="0">Melding succesvol opgeslagen</tspan></text>
<text x="1042" y="156" font-family="DM Sans" font-size="11" fill="#55606F" text-anchor="start"><tspan x="1042" dy="0">getoond ná bevestiging door de server</tspan></text>

<!-- Left callout: client validation -->
<rect x="60" y="250" width="340" height="112" rx="6" fill="#FBF4E6" stroke="#E9A13B" stroke-width="1.5"/>
<text x="76" y="274" font-family="DM Sans" font-size="11" font-weight="bold" fill="#14213D" text-anchor="start"><tspan x="76" dy="0">CLIENT-VALIDATIE</tspan></text>
<text x="76" y="296" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="start"><tspan x="76" dy="0">Directe feedback: startdatum moet</tspan><tspan x="76" dy="17">ingevuld zijn en niet in de toekomst</tspan><tspan x="76" dy="17">liggen — nooit voldoende op zichzelf.</tspan></text>
<line x1="400" y1="290" x2="466" y2="257" stroke="#E9A13B" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow7)"/>

<!-- Right callout: server validation -->
<rect x="1000" y="250" width="340" height="112" rx="6" fill="#F4F6F9" stroke="#2563A8" stroke-width="1.5"/>
<text x="1016" y="274" font-family="DM Sans" font-size="11" font-weight="bold" fill="#14213D" text-anchor="start"><tspan x="1016" dy="0">SERVER-VALIDATIE</tspan></text>
<text x="1016" y="296" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="start"><tspan x="1016" dy="0">AanmaakMelding controleert nogmaals,</tspan><tspan x="1016" dy="17">vlak vóór het wegschrijven — de enige</tspan><tspan x="1016" dy="17">laag die daadwerkelijk garandeert.</tspan></text>
<polyline points="1000,306 964,306 964,582 934,582" fill="none" stroke="#2563A8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow7b)"/>

<!-- Form panel -->
<rect x="440" y="95" width="520" height="565" rx="6" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1.5"/>
<rect x="440" y="95" width="520" height="42" rx="6" fill="#14213D"/>
<rect x="440" y="117" width="520" height="20" fill="#14213D"/>
<text x="700" y="122" font-family="DM Sans" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="700" dy="0">MeldingInvoer</tspan></text>
<rect x="880" y="104" width="60" height="22" rx="11" fill="#2563A8"/>
<text x="910" y="119" font-family="DM Sans" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="910" dy="0">FORM</tspan></text>

<text x="470" y="163" font-family="DM Sans" font-size="11" font-weight="bold" fill="#55606F" text-anchor="start"><tspan x="470" dy="0">WERKNEMER</tspan></text>
<rect x="470" y="171" width="460" height="36" rx="4" fill="#FBFAF7" stroke="#DFDCD3" stroke-width="1"/>
<text x="484" y="194" font-family="DM Sans" font-size="13" fill="#55606F" text-anchor="start"><tspan x="484" dy="0">Selecteer werknemer</tspan></text>
<text x="912" y="195" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle"><tspan x="912" dy="0">&#9662;</tspan></text>

<text x="470" y="233" font-family="DM Sans" font-size="11" font-weight="bold" fill="#14213D" text-anchor="start"><tspan x="470" dy="0">STARTDATUM </tspan><tspan fill="#E9A13B">*</tspan></text>
<rect x="470" y="241" width="460" height="36" rx="4" fill="#FBF4E6" stroke="#E9A13B" stroke-width="2.5"/>
<text x="484" y="264" font-family="DM Sans" font-size="13" fill="#55606F" text-anchor="start"><tspan x="484" dy="0">— nog leeg —</tspan></text>
<circle cx="910" cy="259" r="10" fill="#E9A13B" stroke="#14213D" stroke-width="1"/>
<text x="910" y="263" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="910" dy="0">!</tspan></text>
<text x="470" y="295" font-family="DM Sans" font-size="11" font-weight="bold" fill="#14213D" text-anchor="start"><tspan x="470" dy="0">Startdatum is verplicht</tspan></text>

<text x="470" y="325" font-family="DM Sans" font-size="11" font-weight="bold" fill="#55606F" text-anchor="start"><tspan x="470" dy="0">VERWACHTE EINDDATUM</tspan></text>
<rect x="470" y="333" width="460" height="36" rx="4" fill="#FBFAF7" stroke="#DFDCD3" stroke-width="1"/>
<text x="484" y="356" font-family="DM Sans" font-size="13" fill="#14213D" text-anchor="start"><tspan x="484" dy="0">02-02-2026</tspan></text>

<text x="470" y="393" font-family="DM Sans" font-size="11" font-weight="bold" fill="#55606F" text-anchor="start"><tspan x="470" dy="0">OPMERKING</tspan></text>
<rect x="470" y="401" width="460" height="90" rx="4" fill="#FBFAF7" stroke="#DFDCD3" stroke-width="1"/>
<text x="484" y="424" font-family="DM Sans" font-size="13" fill="#14213D" text-anchor="start"><tspan x="484" dy="0">Griep, verwacht enkele dagen afwezig.</tspan></text>

<rect x="470" y="560" width="460" height="44" rx="4" fill="#14213D"/>
<text x="700" y="587" font-family="DM Sans" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="700" dy="0">Melding indienen</tspan></text>

<!-- Legend -->
<rect x="1000" y="614" width="16" height="16" rx="3" fill="#FBF4E6" stroke="#E9A13B" stroke-width="2"/>
<text x="1024" y="627" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="start"><tspan x="1024" dy="0">Validatiekader: foutmelding direct bij het veld, nooit een losse banner</tspan></text>
</svg>
