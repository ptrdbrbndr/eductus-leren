<text x="750" y="55" font-family="Cormorant Garamond" font-size="26" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="750" dy="0">Drie modellen, van abstract naar concreet</tspan></text><defs><marker id="chArr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L8,3 L0,6 Z" fill="#2563A8"/>
  </marker></defs><rect x="90" y="200" width="420" height="130" rx="10" fill="#14213D"/><text x="300" y="261" font-family="DM Sans" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="300" dy="0">Doelmodel</tspan></text><text x="300" y="358" font-family="DM Sans" font-size="12" font-weight="normal" fill="#55606F" text-anchor="middle"><tspan x="300" dy="0">Waarom bestaat dit</tspan><tspan x="300" dy="14">systeem?</tspan></text><line x1="514" y1="265" x2="536" y2="265" stroke="#2563A8" stroke-width="3" marker-end="url(#chArr)"/><rect x="540" y="200" width="420" height="130" rx="10" fill="#1B4A80"/><text x="750" y="261" font-family="DM Sans" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="750" dy="0">Gebruiksmodel</tspan></text><text x="750" y="358" font-family="DM Sans" font-size="12" font-weight="normal" fill="#55606F" text-anchor="middle"><tspan x="750" dy="0">Wie doet wat, en</tspan><tspan x="750" dy="14">waarom?</tspan></text><line x1="964" y1="265" x2="986" y2="265" stroke="#2563A8" stroke-width="3" marker-end="url(#chArr)"/><rect x="990" y="200" width="420" height="130" rx="10" fill="#14213D"/><text x="1200" y="261" font-family="DM Sans" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="1200" dy="0">Gedragsmodel</tspan></text><text x="1200" y="358" font-family="DM Sans" font-size="12" font-weight="normal" fill="#55606F" text-anchor="middle"><tspan x="1200" dy="0">Hoe reageert het</tspan><tspan x="1200" dy="14">systeem, stap voor</tspan><tspan x="1200" dy="14">stap?</tspan></text>
