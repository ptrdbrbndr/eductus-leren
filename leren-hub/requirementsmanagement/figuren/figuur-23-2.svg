<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="700" viewBox="0 0 1500 700">
<rect width="1500" height="700" fill="#FFFFFF"/>
<text x="750" y="55" font-family="Cormorant Garamond" font-size="26" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="750" dy="0">Gewone belanghebbende versus toezichthouder — de vraag verschuift</tspan></text><rect x="80" y="140" width="650" height="440" rx="10" fill="#F4F2EC" stroke="#1B4A80" stroke-width="2"/><rect x="80" y="140" width="650" height="50" rx="10" fill="#1B4A80"/><rect x="80" y="165" width="650" height="25" fill="#1B4A80"/><text x="405" y="173" font-family="DM Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="405" dy="0">Gewone</tspan><tspan x="405" dy="19.5">belanghebbende</tspan></text><text x="405" y="230" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="405" dy="0">“Wat wilt u dat</tspan></text><text x="405" y="274" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="405" dy="0">het systeem doet?”</tspan></text><text x="405" y="318" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"></text><text x="405" y="362" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="405" dy="0">Antwoord: een</tspan></text><text x="405" y="406" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="405" dy="0">functionele wens</tspan></text><rect x="770" y="140" width="650" height="440" rx="10" fill="#F4F2EC" stroke="#1B4A80" stroke-width="2"/><rect x="770" y="140" width="650" height="50" rx="10" fill="#1B4A80"/><rect x="770" y="165" width="650" height="25" fill="#1B4A80"/><text x="1095" y="173" font-family="DM Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="1095" dy="0">Toezichthouder</tspan></text><text x="1095" y="230" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1095" dy="0">“Wat zou u willen</tspan></text><text x="1095" y="274" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1095" dy="0">kunnen zien om</tspan></text><text x="1095" y="318" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1095" dy="0">overtuigd te zijn?”</tspan></text><text x="1095" y="362" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"></text><text x="1095" y="406" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1095" dy="0">Antwoord: een eis aan</tspan></text><text x="1095" y="450" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1095" dy="0">bewijsvoering</tspan></text>
</svg>