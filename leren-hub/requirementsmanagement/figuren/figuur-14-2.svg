t</tspan></text><text x="1085" y="351" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1085" dy="0">Is onduidelijk wíé hier</tspan><tspan x="1085" dy="15">zeggenschap over heeft,</tspan><tspan x="1085" dy="15">los van de inhoud?</tspan></text>
