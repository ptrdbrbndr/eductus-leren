<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620">
<rect width="1400" height="620" fill="#FFFFFF"/>
<text x="700" y="55" font-family="Cormorant Garamond" font-size="26" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Drie soorten requirements — voorbeelden uit het Nabestaandenloket</tspan></text><rect x="60" y="130" width="400" height="400" rx="12" fill="#F4F2EC" stroke="#2563A8" stroke-width="2.5"/><rect x="60" y="130" width="400" height="64" rx="12" fill="#2563A8"/><rect x="60" y="162" width="400" height="32" fill="#2563A8"/><text x="260" y="172" font-family="Cormorant Garamond" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="260" dy="0">Functioneel</tspan></text><text x="260" y="240" font-family="DM Sans" font-size="15" font-weight="bold" fill="#55606F" text-anchor="middle"><tspan x="260" dy="0">Wat doet het?</tspan></text><line x1="100" y1="280" x2="420" y2="280" stroke="#2563A8" stroke-width="1"/><text x="260" y="340" font-family="DM Sans" font-size="12" font-weight="bold" fill="#2563A8" text-anchor="middle"><tspan x="260" dy="0">Voorbeeld</tspan></text><text x="260" y="380" font-family="DM Sans" font-size="16" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="260" dy="0">Registreert de melding</tspan><tspan x="260" dy="22">met datum en relatie tot</tspan><tspan x="260" dy="22">de overledene</tspan></text><rect x="500" y="130" width="400" height="400" rx="12" fill="#F4F2EC" stroke="#14213D" stroke-width="2.5"/><rect x="500" y="130" width="400" height="64" rx="12" fill="#14213D"/><rect x="500" y="162" width="400" height="32" fill="#14213D"/><text x="700" y="172" font-family="Cormorant Garamond" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="700" dy="0">Kwaliteitseis</tspan></text><text x="700" y="240" font-family="DM Sans" font-size="15" font-weight="bold" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">Hoe goed doet het dat?</tspan></text><line x1="540" y1="280" x2="860" y2="280" stroke="#14213D" stroke-width="1"/><text x="700" y="340" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Voorbeeld</tspan></text><text x="700" y="380" font-family="DM Sans" font-size="16" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Beschikbaar 07:00–22:00,</tspan><tspan x="700" dy="22">max. 4 uur uitval per</tspan><tspan x="700" dy="22">maand</tspan></text><rect x="940" y="130" width="400" height="400" rx="12" fill="#F4F2EC" stroke="#9A5F0D" stroke-width="2.5"/><rect x="940" y="130" width="400" height="64" rx="12" fill="#9A5F0D"/><rect x="940" y="162" width="400" height="32" fill="#9A5F0D"/><text x="1140" y="172" font-family="Cormorant Garamond" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="1140" dy="0">Randvoorwaarde</tspan></text><text x="1140" y="240" font-family="DM Sans" font-size="15" font-weight="bold" fill="#55606F" text-anchor="middle"><tspan x="1140" dy="0">Binnen welke grenzen?</tspan></text><line x1="980" y1="280" x2="1300" y2="280" stroke="#9A5F0D" stroke-width="1"/><text x="1140" y="340" font-family="DM Sans" font-size="12" font-weight="bold" fill="#9A5F0D" text-anchor="middle"><tspan x="1140" dy="0">Voorbeeld</tspan></text><text x="1140" y="380" font-family="DM Sans" font-size="16" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1140" dy="0">Identiteitsdocumenten</tspan><tspan x="1140" dy="22">worden niet als scan</tspan><tspan x="1140" dy="22">opgeslagen</tspan></text>
</svg>