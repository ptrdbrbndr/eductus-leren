<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="800" viewBox="0 0 1500 800">
<rect width="1500" height="800" fill="#FFFFFF"/>
<text x="750" y="55" font-family="Cormorant Garamond" font-size="26" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="750" dy="0">Drie toetsen op een fragment van de risicoprofiel-regelset</tspan></text><rect x="80" y="140" width="670" height="56" fill="#14213D"/><text x="415" y="175" font-family="DM Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="415" dy="0">Toets</tspan></text><rect x="750" y="140" width="670" height="56" fill="#14213D"/><text x="1085" y="175" font-family="DM Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="1085" dy="0">Bevinding in het</tspan><tspan x="1085" dy="19.5">fragment</tspan></text><rect x="80" y="196" width="1340" height="60" fill="#F4F2EC" stroke="#DFDCD3" stroke-width="1"/><text x="415" y="231" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="415" dy="0">Volledigheid</tspan></text><text x="1085" y="231" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1085" dy="0">Gat gevonden: “horizon</tspan><tspan x="1085" dy="15">middellang + risicohouding</tspan><tspan x="1085" dy="15">zeer offensief” heeft geen</tspan><tspan x="1085" dy="15">regel</tspan></text><rect x="80" y="256" width="1340" height="60" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/><text x="415" y="291" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="415" dy="0">Consistentie</tspan></text><text x="1085" y="291" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1085" dy="0">Overlap gevonden: twee</tspan><tspan x="1085" dy="15">regels dekken “horizon</tspan><tspan x="1085" dy="15">lang + voorzichtig” met</tspan><tspan x="1085" dy="15">verschillende uitkomst</tspan></text><rect x="80" y="316" width="1340" height="60" fill="#F4F2EC" stroke="#DFDCD3" stroke-width="1"/><text x="415" y="351" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="415" dy="0">Minimaliteit</tspan></text><text x="1085" y="351" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1085" dy="0">Samenvoeging mogelijk:</tspan><tspan x="1085" dy="15">twee bijna-identieke</tspan><tspan x="1085" dy="15">regels voor “kort +</tspan><tspan x="1085" dy="15">voorzichtig” samengevoegd</tspan><tspan x="1085" dy="15">tot één</tspan></text>
</svg>