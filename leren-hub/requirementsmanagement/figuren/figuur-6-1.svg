e x1="1144" y1="265" x2="1166" y2="265" stroke="#2563A8" stroke-width="3" marker-end="url(#chArr)"/><rect x="1170" y="200" width="240" height="130" rx="10" fill="#14213D"/><text x="1290" y="261" font-family="DM Sans" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="1290" dy="0">Decoderen door</tspan><tspan x="1290" dy="19">derde</tspan></text><text x="1290" y="358" font-family="DM Sans" font-size="12" font-weight="normal" fill="#55606F" text-anchor="middle"><tspan x="1290" dy="0">afdeling Uitkeringen</tspan></text><text x="750" y="430" font-family="DM Sans" font-size="14" font-weight="normal" fill="#55606F" text-anchor="middle"><tspan x="750" dy="0">Vastleggen is communicatie, geen garantie — valideren blijft nodig.</tspan></text>
