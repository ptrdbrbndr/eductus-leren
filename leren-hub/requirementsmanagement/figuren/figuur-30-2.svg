<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="800" viewBox="0 0 1500 800">
<rect width="1500" height="800" fill="#FFFFFF"/>
<text x="750" y="55" font-family="Cormorant Garamond" font-size="26" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="750" dy="0">Vier rollen, vier kernvragen — boardsimulatie</tspan></text><rect x="80" y="140" width="670" height="56" fill="#14213D"/><text x="415" y="175" font-family="DM Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="415" dy="0">Rol</tspan></text><rect x="750" y="140" width="670" height="56" fill="#14213D"/><text x="1085" y="175" font-family="DM Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="1085" dy="0">Kernvraag</tspan></text><rect x="80" y="196" width="1340" height="60" fill="#F4F2EC" stroke="#DFDCD3" stroke-width="1"/><text x="415" y="231" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="415" dy="0">Hetty Landsheer (bestuur)</tspan></text><text x="1085" y="231" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1085" dy="0">Dient dit de</tspan><tspan x="1085" dy="15">Stelselovergang als</tspan><tspan x="1085" dy="15">geheel? Uit te leggen aan</tspan><tspan x="1085" dy="15">bestuur en deelnemers?</tspan></text><rect x="80" y="256" width="1340" height="60" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/><text x="415" y="291" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="415" dy="0">Bram Kessels</tspan><tspan x="415" dy="15">(programmadirecteur)</tspan></text><text x="1085" y="291" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1085" dy="0">Praktisch uitvoerbaar</tspan><tspan x="1085" dy="15">binnen planning en</tspan><tspan x="1085" dy="15">capaciteit? Impact op</tspan><tspan x="1085" dy="15">andere deelsystemen?</tspan></text><rect x="80" y="316" width="1340" height="60" fill="#F4F2EC" stroke="#DFDCD3" stroke-width="1"/><text x="415" y="351" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="415" dy="0">Ellen Voskuijl (DNB)</tspan></text><text x="1085" y="351" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1085" dy="0">Is financiële beheersing</tspan><tspan x="1085" dy="15">tijdens de transitie</tspan><tspan x="1085" dy="15">aantoonbaar op orde?</tspan></text><rect x="80" y="376" width="1340" height="60" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/><text x="415" y="411" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="415" dy="0">Radboud Achterberg (AFM)</tspan></text><text x="1085" y="411" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1085" dy="0">Is zorgvuldige</tspan><tspan x="1085" dy="15">informatievoorziening aan</tspan><tspan x="1085" dy="15">deelnemers aantoonbaar</tspan><tspan x="1085" dy="15">geborgd?</tspan></text>
</svg>