gisseur.</tspan></text><text x="1095" y="274" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1095" dy="0">Wegwijzer publiceert</tspan></text><text x="1095" y="318" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1095" dy="0">een gebeurtenis; KERN</tspan></text><text x="1095" y="362" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1095" dy="0">en vermogensbeheer</tspan></text><text x="1095" y="406" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1095" dy="0">reageren zelfstandig</tspan></text>
