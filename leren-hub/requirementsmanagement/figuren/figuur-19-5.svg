-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="303.33333333333337" dy="0">Openstaande conflicten</tspan></text><text x="750.0000000000001" y="291" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="750.0000000000001" dy="0">2 (belangenconflicten)</tspan></text><text x="1196.6666666666667" y="291" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1196.6666666666667" dy="0">Voorgelegd aan Hetty,</tspan><tspan x="1196.6666666666667" dy="15">besluit binnen twee weken</tspan></text><rect x="80" y="316" width="1340" height="60" fill="#F4F2EC" stroke="#DFDCD3" stroke-width="1"/><text x="303.33333333333337" y="351" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="303.33333333333337" dy="0">Doorlooptijd (klein)</tspan></text><text x="750.0000000000001" y="351" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="750.0000000000001" dy="0">gem. 2 dagen</tspan></text><text x="1196.6666666666667" y="351" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1196.6666666666667" dy="0">Binnen verwachting</tspan></text><rect x="80" y="376" width="1340" height="60" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/><text x="303.33333333333337" y="411" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="303.33333333333337" dy="0">Doorlooptijd</tspan><tspan x="303.33333333333337" dy="15">(middel/groot)</tspan></text><text x="750.0000000000001" y="411" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="750.0000000000001" dy="0">gem. 3 weken</tspan></text><text x="1196.6666666666667" y="411" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="11