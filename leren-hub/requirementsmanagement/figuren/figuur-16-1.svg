<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="700" viewBox="0 0 1500 700">
<rect width="1500" height="700" fill="#FFFFFF"/>
<text x="750" y="55" font-family="Cormorant Garamond" font-size="26" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="750" dy="0">Dezelfde regelset — als tabel (40 rijen) naast als boom</tspan></text><rect x="80" y="140" width="650" height="440" rx="10" fill="#F4F2EC" stroke="#1B4A80" stroke-width="2"/><rect x="80" y="140" width="650" height="50" rx="10" fill="#1B4A80"/><rect x="80" y="165" width="650" height="25" fill="#1B4A80"/><text x="405" y="173" font-family="DM Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="405" dy="0">Tabel</tspan></text><text x="405" y="230" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="405" dy="0">40+ rijen, één per</tspan></text><text x="405" y="274" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="405" dy="0">combinatie van leeftijd,</tspan></text><text x="405" y="318" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="405" dy="0">horizon en</tspan></text><text x="405" y="362" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="405" dy="0">risicohouding.</tspan></text><text x="405" y="406" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"></text><text x="405" y="450" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="405" dy="0">Elke rij apart</tspan></text><text x="405" y="494" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="405" dy="0">controleerbaar —</tspan></text><text x="405" y="538" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="405" dy="0">geschikt voor Petra's</tspan></text><text x="405" y="582" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="405" dy="0">zorgplicht-toetsing.</tspan></text><rect x="770" y="140" width="650" height="440" rx="10" fill="#F4F2EC" stroke="#1B4A80" stroke-width="2"/><rect x="770" y="140" width="650" height="50" rx="10" fill="#1B4A80"/><rect x="770" y="165" width="650" height="25" fill="#1B4A80"/><text x="1095" y="173" font-family="DM Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="1095" dy="0">Boom</tspan></text><text x="1095" y="230" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1095" dy="0">Horizon eerst</tspan></text><text x="1095" y="274" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1095" dy="0">(zwaarste voorwaarde),</tspan></text><text x="1095" y="318" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1095" dy="0">dan risicohouding.</tspan></text><text x="1095" y="362" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"></text><text x="1095" y="406" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1095" dy="0">Aanzienlijk compacter,</tspan></text><text x="1095" y="450" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1095" dy="0">logica te volgen —</tspan></text><text x="1095" y="494" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1095" dy="0">geschikt voor het</tspan></text><text x="1095" y="538" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1095" dy="0">gesprek met Sven</tspan></text><text x="1095" y="582" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1095" dy="0">en Corrie.</tspan></text>
</svg>