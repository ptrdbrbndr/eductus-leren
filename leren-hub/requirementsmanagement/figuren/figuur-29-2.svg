ht="60" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/><text x="247.5" y="411" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="247.5" dy="0">Contractuele status</tspan><tspan x="247.5" dy="15">onduidelijk (26)</tspan></text><text x="582.5" y="411" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="582.5" dy="0">Hoog — juridisch risico</tspan></text><text x="917.5" y="411" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="917.5" dy="0">Kost tijd, niet urgent</tspan><tspan x="917.5" dy="15">onomkeerbaar</tspan></text><text x="1252.5" y="411" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1252.5" dy="0">Bepaalt ruimte voor de</tspan><tspan x="1252.5" dy="15">andere drie</tspan></text>
