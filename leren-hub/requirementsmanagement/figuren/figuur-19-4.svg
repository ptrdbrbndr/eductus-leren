<text x="750" y="55" font-family="Cormorant Garamond" font-size="26" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="750" dy="0">Dezelfde metriek — afrekenen versus sturen</tspan></text><rect x="80" y="140" width="650" height="440" rx="10" fill="#F4F2EC" stroke="#1B4A80" stroke-width="2"/><rect x="80" y="140" width="650" height="50" rx="10" fill="#1B4A80"/><rect x="80" y="165" width="650" height="25" fill="#1B4A80"/><text x="405" y="173" font-family="DM Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="405" dy="0">Kaal cijfer</tspan><tspan x="405" dy="19.5">(afrekenen)</tspan></text><text x="405" y="230" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="405" dy="0">Openstaande conflicten:</tspan><tspan x="405" dy="17">2</tspan></text><text x="405" y="274" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"></text><text x="405" y="318" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="405" dy="0">Rode cel.</tspan></text><text x="405" y="362" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="405" dy="0">Geen toelichting.</tspan></text><text x="405" y="406" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="405" dy="0">Wekt de indruk van</tspan></text><text x="405" y="450" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="405" dy="0">een oordeel over</tspan></text><text x="405" y="494" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="405" dy="0">een persoon.</tspan></text><rect x="770" y="140" width="650" height="440" rx="10" fill="#F4F2EC" stroke="#1B4A80" stroke-width="2"/><rect x="770" y="140" width="650" height="50" rx="10" fill="#1B4A80"/><rect x="770" y="165" width="650" height="25" fill="#1B4A80"/><text x="1095" y="173" font-family="DM Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="1095" dy="0">Met context en vraag</tspan><tspan x="1095" dy="19.5">(sturen)</tspan></text><text x="1095" y="230" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1095" dy="0">Dit conflict staat al</tspan></text><text x="1095" y="274" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1095" dy="0">drie sprints open —</tspan></text><text x="1095" y="318" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1095" dy="0">wat is nodig om</tspan></text><text x="1095" y="362" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1095" dy="0">het te doorbreken?</tspan></text><text x="1095" y="406" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"></text><text x="1095" y="450" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1095" dy="0">Uitnodiging tot gesprek.</tspan></text>
