<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500">
<rect width="1500" height="500" fill="#FFFFFF"/>
<text x="750" y="55" font-family="Cormorant Garamond" font-size="26" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="750" dy="0">Doel → interactie → gedrag</tspan></text><defs><marker id="chArr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L8,3 L0,6 Z" fill="#2563A8"/>
  </marker></defs><rect x="90" y="200" width="420" height="130" rx="10" fill="#14213D"/><text x="300" y="261" font-family="DM Sans" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="300" dy="0">Doel</tspan></text><text x="300" y="358" font-family="DM Sans" font-size="12" font-weight="normal" fill="#55606F" text-anchor="middle"><tspan x="300" dy="0">“nabestaanden minder</tspan><tspan x="300" dy="14">laten bellen”</tspan></text><line x1="514" y1="265" x2="536" y2="265" stroke="#2563A8" stroke-width="3" marker-end="url(#chArr)"/><rect x="540" y="200" width="420" height="130" rx="10" fill="#1B4A80"/><text x="750" y="261" font-family="DM Sans" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="750" dy="0">Interactie</tspan></text><text x="750" y="358" font-family="DM Sans" font-size="12" font-weight="normal" fill="#55606F" text-anchor="middle"><tspan x="750" dy="0">“status raadplegen”</tspan></text><line x1="964" y1="265" x2="986" y2="265" stroke="#2563A8" stroke-width="3" marker-end="url(#chArr)"/><rect x="990" y="200" width="420" height="130" rx="10" fill="#14213D"/><text x="1200" y="261" font-family="DM Sans" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="1200" dy="0">Gedrag</tspan></text><text x="1200" y="358" font-family="DM Sans" font-size="12" font-weight="normal" fill="#55606F" text-anchor="middle"><tspan x="1200" dy="0">toestanden en</tspan><tspan x="1200" dy="14">overgangen van de</tspan><tspan x="1200" dy="14">melding</tspan></text><text x="750" y="430" font-family="DM Sans" font-size="14" font-weight="normal" fill="#55606F" text-anchor="middle"><tspan x="750" dy="0">Een toestand zonder herleidbare interactie, zonder herleidbaar doel:</tspan><tspan x="750" dy="18.2">functionaliteit die niemand kan verantwoorden (R7).</tspan></text>
</svg>