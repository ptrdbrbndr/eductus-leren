.5" dy="15">Faisal apart</tspan></text><rect x="80" y="256" width="1340" height="60" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/><text x="247.5" y="291" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="247.5" dy="0">Workshop</tspan></text><text x="582.5" y="291" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="582.5" dy="0">Conflicten direct</tspan><tspan x="582.5" dy="15">zichtbaar</tspan></text><text x="917.5" y="291" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="917.5" dy="0">Stille stem kan verdwijnen</tspan><tspan x="917.5" dy="15">in de groep</tspan></text><text x="1252.5" y="291" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1252.5" dy="0">Wilma en Faisal samen over</tspan><tspan x="1252.5" dy="15">zelfbediening</tspan></text><rect x="80" y="316" width="1340" height="60" fill="#F4F2EC" stroke="#DFDCD3" stroke-width="1"/><text x="247.5" y="351" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="247.5" dy="0">Documentanalyse</tspan></text><text x="582.5" y="351" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="582.5" dy="0">Vindt vanzelfsprekend</tspan><tspan x="582.5" dy="15">geworden eisen</tspan></text><text x="917.5" y="351" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="917.5" dy="0">Legt nooit het waarom uit</tspan></text><text x="1252.5" y="351" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1252.5" dy="0">Klachtenregistraties,</tspan><tspan x="1252.5" dy="15">post-mortem WGP 2.0</tspan></text><rect x="80" y="376" width="1340" height="60" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/><text x="247.5" y="41