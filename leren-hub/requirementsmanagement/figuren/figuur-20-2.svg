<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="750" viewBox="0 0 1400 750">
<rect width="1400" height="750" fill="#FFFFFF"/>
<text x="700" y="55" font-family="Cormorant Garamond" font-size="26" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Voorbeeldprompt: ambiguïteit detecteren</tspan></text><rect x="220" y="140" width="960" height="70" rx="8" fill="#F4F2EC" stroke="#2563A8" stroke-width="2"/><text x="200" y="180" font-family="DM Sans" font-size="13" font-weight="bold" fill="#1B4A80" text-anchor="end"><tspan x="200" dy="0">Context</tspan></text><text x="700" y="182" font-family="DM Sans" font-size="14" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">de requirementstekst wordt letterlijk</tspan><tspan x="700" dy="18.2">meegegeven, niet samengevat</tspan></text><line x1="206" y1="175" x2="220" y2="175" stroke="#2563A8" stroke-width="1.5"/><rect x="220" y="235" width="960" height="70" rx="8" fill="#F4F2EC" stroke="#2563A8" stroke-width="2"/><text x="200" y="275" font-family="DM Sans" font-size="13" font-weight="bold" fill="#1B4A80" text-anchor="end"><tspan x="200" dy="0">Opdracht</tspan></text><text x="700" y="277" font-family="DM Sans" font-size="14" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">identificeer lexicale, syntactische,</tspan><tspan x="700" dy="18.2">verwijzende of vage ambiguïteit (deel 6)</tspan></text><line x1="206" y1="270" x2="220" y2="270" stroke="#2563A8" stroke-width="1.5"/><rect x="220" y="330" width="960" height="70" rx="8" fill="#F4F2EC" stroke="#2563A8" stroke-width="2"/><text x="200" y="370" font-family="DM Sans" font-size="13" font-weight="bold" fill="#1B4A80" text-anchor="end"><tspan x="200" dy="0">Grens</tspan></text><text x="700" y="372" font-family="DM Sans" font-size="14" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">zonder zelf de tekst te herschrijven</tspan></text><line x1="206" y1="365" x2="220" y2="365" stroke="#2563A8" stroke-width="1.5"/><rect x="220" y="425" width="960" height="70" rx="8" fill="#F4F2EC" stroke="#2563A8" stroke-width="2"/><text x="200" y="465" font-family="DM Sans" font-size="13" font-weight="bold" fill="#1B4A80" text-anchor="end"><tspan x="200" dy="0">Bronvermelding</tspan></text><text x="700" y="467" font-family="DM Sans" font-size="14" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">geef per punt aan welke soort ambiguïteit en</tspan><tspan x="700" dy="18.2">welke alternatieve lezingen mogelijk zijn</tspan></text><line x1="206" y1="460" x2="220" y2="460" stroke="#2563A8" stroke-width="1.5"/>
</svg>