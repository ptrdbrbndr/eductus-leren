<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="800" viewBox="0 0 1500 800">
<rect width="1500" height="800" fill="#FFFFFF"/>
<text x="750" y="55" font-family="Cormorant Garamond" font-size="26" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="750" dy="0">Refinement — vier vragen, vier vindplaatsen</tspan></text><rect x="80" y="140" width="670" height="56" fill="#14213D"/><text x="415" y="175" font-family="DM Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="415" dy="0">Vraag tijdens</tspan><tspan x="415" dy="19.5">refinement</tspan></text><rect x="750" y="140" width="670" height="56" fill="#14213D"/><text x="1085" y="175" font-family="DM Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="1085" dy="0">Behandeld in</tspan></text><rect x="80" y="196" width="1340" height="60" fill="#F4F2EC" stroke="#DFDCD3" stroke-width="1"/><text x="415" y="231" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="415" dy="0">Is deze user story ambigu?</tspan></text><text x="1085" y="231" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1085" dy="0">Deel 6</tspan></text><rect x="80" y="256" width="1340" height="60" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/><text x="415" y="291" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="415" dy="0">Wie heeft hier mandaat</tspan><tspan x="415" dy="15">over?</tspan></text><text x="1085" y="291" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1085" dy="0">Deel 12</tspan></text><rect x="80" y="316" width="1340" height="60" fill="#F4F2EC" stroke="#DFDCD3" stroke-width="1"/><text x="415" y="351" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="415" dy="0">Raakt dit item een ander</tspan><tspan x="415" dy="15">systeem?</tspan></text><text x="1085" y="351" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1085" dy="0">Deel 18</tspan></text><rect x="80" y="376" width="1340" height="60" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/><text x="415" y="411" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="415" dy="0">Draagt dit item</tspan><tspan x="415" dy="15">aantoonbaar bij aan een</tspan><tspan x="415" dy="15">hoger doel?</tspan></text><text x="1085" y="411" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1085" dy="0">Deel 7, deel 17</tspan></text>
