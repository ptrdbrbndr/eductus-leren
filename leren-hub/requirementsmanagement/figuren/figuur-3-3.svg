<text x="750" y="55" font-family="Cormorant Garamond" font-size="26" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="750" dy="0">Vier requirementsbronnen naast belanghebbenden</tspan></text><rect x="80" y="140" width="670" height="56" fill="#14213D"/><text x="415" y="175" font-family="DM Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="415" dy="0">Bron</tspan></text><rect x="750" y="140" width="670" height="56" fill="#14213D"/><text x="1085" y="175" font-family="DM Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="1085" dy="0">Voorbeeld uit het</tspan><tspan x="1085" dy="19.5">Nabestaandenloket</tspan></text><rect x="80" y="196" width="1340" height="60" fill="#F4F2EC" stroke="#DFDCD3" stroke-width="1"/><text x="415" y="231" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="415" dy="0">Bestaande systemen</tspan></text><text x="1085" y="231" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1085" dy="0">Hoe KERN nu al overlijdens</tspan><tspan x="1085" dy="15">verwerkt, ook zonder</tspan><tspan x="1085" dy="15">documentatie</tspan></text><rect x="80" y="256" width="1340" height="60" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/><text x="415" y="291" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="415" dy="0">Documenten</tspan></text><text x="1085" y="291" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1085" dy="0">De post-mortem van WGP 2.0</tspan><tspan x="1085" dy="15">zelf — lessen verpakt als</tspan><tspan x="1085" dy="15">requirements</tspan></text><rect x="80" y="316" width="1340" height="60" fill="#F4F2EC" stroke="#DFDCD3" stroke-width="1"/><text x="415" y="351" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="415" dy="0">Wet- en regelgeving</tspan></text><text x="1085" y="351" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1085" dy="0">Pensioenwet en AVG,</tspan><tspan x="1085" dy="15">geïnterpreteerd door een</tspan><tspan x="1085" dy="15">jurist</tspan></text><rect x="80" y="376" width="1340" height="60" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/><text x="415" y="411" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="415" dy="0">Observatie</tspan></text><text x="1085" y="411" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1085" dy="0">Meelopen met de</tspan><tspan x="1085" dy="15">servicedesk tijdens een</tspan><tspan x="1085" dy="15">telefoongesprek</tspan></text>
</svg>