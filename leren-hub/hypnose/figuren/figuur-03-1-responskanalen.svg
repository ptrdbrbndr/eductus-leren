<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'DM Sans', Arial, sans-serif" width="960" height="640" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper {{ fill:#FBFAF7; }}
      .label {{ font-size:14px; font-weight:700; fill:#14213D; }}
      .label-light {{ font-size:14px; font-weight:700; fill:#FBFAF7; }}
      .sub {{ font-size:12px; fill:#55606F; }}
      .sub-light {{ font-size:12px; fill:#DFDCD3; }}
      .title {{ font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }}
      .title-sm {{ font-family:'Cormorant Garamond', Georgia, serif; font-size:19px; fill:#14213D; font-weight:600; }}
      .kicker {{ font-size:11px; fill:#55606F; letter-spacing:.10em; }}
      .arrow {{ stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }}
      .arrow-muted {{ stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arrm); }}
      .arrow-amber {{ stroke:#E9A13B; stroke-width:2; fill:none; marker-end:url(#arra); }}
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arrm" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
  </defs>
<rect width="960" height="640" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 3 · WERKMODEL</text>
<text x="40" y="64" class="title">Drie responskanalen</text>
<text x="40" y="90" class="sub">Zelfde suggestie, drie zintuiglijke ingangen — een werkmodel, geen bewezen typologie.</text><rect x="60" y="140" width="260" height="340" rx="14" fill="#fff" stroke="#DFDCD3" stroke-width="1.5"/><rect x="60" y="140" width="260" height="46" rx="14" fill="#2563A8"/><rect x="60" y="166" width="260" height="20" fill="#2563A8"/><text x="190" y="170" text-anchor="middle" class="label-light" font-size="16">Visueel</text><text x="190" y="212" text-anchor="middle" class="sub">casusanker: Iris</text><text x="190" y="250" text-anchor="middle" class="sub" font-style="italic">"Je ziet het licht</text><text x="190" y="266" text-anchor="middle" class="sub" font-style="italic">langzaam zachter</text><text x="190" y="282" text-anchor="middle" class="sub" font-style="italic">worden."</text><rect x="350" y="140" width="260" height="340" rx="14" fill="#fff" stroke="#DFDCD3" stroke-width="1.5"/><rect x="350" y="140" width="260" height="46" rx="14" fill="#2563A8"/><rect x="350" y="166" width="260" height="20" fill="#2563A8"/><text x="480" y="170" text-anchor="middle" class="label-light" font-size="16">Kinesthetisch</text><text x="480" y="212" text-anchor="middle" class="sub">casusanker: Daan</text><text x="480" y="250" text-anchor="middle" class="sub" font-style="italic">"Merk hoe je schouders</text><text x="480" y="266" text-anchor="middle" class="sub" font-style="italic">zwaarder worden."</text><rect x="640" y="140" width="260" height="340" rx="14" fill="#fff" stroke="#DFDCD3" stroke-width="1.5"/><rect x="640" y="140" width="260" height="46" rx="14" fill="#2563A8"/><rect x="640" y="166" width="260" height="20" fill="#2563A8"/><text x="770" y="170" text-anchor="middle" class="label-light" font-size="16">Auditief</text><text x="770" y="212" text-anchor="middle" class="sub">casusanker: —</text><text x="770" y="250" text-anchor="middle" class="sub" font-style="italic">"Luister naar het ritme</text><text x="770" y="266" text-anchor="middle" class="sub" font-style="italic">van je ademhaling."</text><rect x="40" y="560" width="880" height="60" rx="8" fill="#14213D"/><text x="480" y="596" text-anchor="middle" class="label-light">Multi-sensorisch aanbieden, observeren wat aanslaat, aanpassen.</text>
</svg>
