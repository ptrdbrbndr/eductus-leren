<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'DM Sans', Arial, sans-serif" width="960" height="640" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper {{ fill:#FBFAF7; }}
      .label {{ font-size:14px; font-weight:700; fill:#14213D; }}
      .label-light {{ font-size:14px; font-weight:700; fill:#FBFAF7; }}
      .sub {{ font-size:12px; fill:#55606F; }}
      .sub-light {{ font-size:12px; fill:#DFDCD3; }}
      .title {{ font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }}
      .title-sm {{ font-family:'Cormorant Garamond', Georgia, serif; font-size:19px; fill:#14213D; font-weight:600; }}
      .kicker {{ font-size:11px; fill:#55606F; letter-spacing:.10em; }}
      .arrow {{ stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }}
      .arrow-muted {{ stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arrm); }}
      .arrow-amber {{ stroke:#E9A13B; stroke-width:2; fill:none; marker-end:url(#arra); }}
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arrm" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
  </defs>
<rect width="960" height="640" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 23 · OEFENMARATHON</text>
<text x="40" y="64" class="title">Vier rondes, oplopend in spanning</text>
<text x="40" y="90" class="sub">De grensgeval-ronde staat bewust als sluitstuk — daar is de verleiding tot routine het grootst.</text><line x1="100" y1="340" x2="860" y2="340" stroke="#DFDCD3" stroke-width="3"/><circle cx="100.000000" cy="340" r="12" fill="#2563A8"/><text x="100.000000" y="310.000000" text-anchor="middle" class="label" font-size="13">Verse casus</text><line x1="100.000000" y1="332" x2="100.000000" y2="306" stroke="#DFDCD3" stroke-width="1"/><circle cx="353.333333" cy="340" r="12" fill="#2563A8"/><text x="353.333333" y="386.000000" text-anchor="middle" class="label" font-size="13">Trajectmoment</text><line x1="353.333333" y1="348" x2="353.333333" y2="370" stroke="#DFDCD3" stroke-width="1"/><circle cx="606.666667" cy="340" r="12" fill="#2563A8"/><text x="606.666667" y="310.000000" text-anchor="middle" class="label" font-size="13">Groepselement</text><line x1="606.666667" y1="332" x2="606.666667" y2="306" stroke="#DFDCD3" stroke-width="1"/><circle cx="860.000000" cy="340" r="12" fill="#E9A13B"/><text x="860.000000" y="386.000000" text-anchor="middle" class="label" font-size="13">Grensgeval</text><line x1="860.000000" y1="348" x2="860.000000" y2="370" stroke="#DFDCD3" stroke-width="1"/><rect x="40" y="560" width="880" height="60" rx="8" fill="#14213D"/><text x="480" y="596" text-anchor="middle" class="label-light">Cumulatieve checklist bij elke ronde: Traject · Uitvoering · Proces · Afsluiting · Grenzen.</text>
</svg>
