<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'DM Sans', Arial, sans-serif" width="960" height="640" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper {{ fill:#FBFAF7; }}
      .label {{ font-size:14px; font-weight:700; fill:#14213D; }}
      .label-light {{ font-size:14px; font-weight:700; fill:#FBFAF7; }}
      .sub {{ font-size:12px; fill:#55606F; }}
      .sub-light {{ font-size:12px; fill:#DFDCD3; }}
      .title {{ font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }}
      .title-sm {{ font-family:'Cormorant Garamond', Georgia, serif; font-size:19px; fill:#14213D; font-weight:600; }}
      .kicker {{ font-size:11px; fill:#55606F; letter-spacing:.10em; }}
      .arrow {{ stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }}
      .arrow-muted {{ stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arrm); }}
      .arrow-amber {{ stroke:#E9A13B; stroke-width:2; fill:none; marker-end:url(#arra); }}
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arrm" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
  </defs>
<rect width="960" height="640" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 6 · RICHTVERDELING</text>
<text x="40" y="64" class="title">Waar de tijd van een sessie naartoe gaat</text>
<text x="40" y="90" class="sub">Verdieping is een middel, geen doel — de meeste tijd hoort bij het suggestiewerk zelf.</text><text x="184" y="235" text-anchor="end" class="label" font-size="15">Inductie</text><rect x="200" y="200" width="680" height="60" rx="8" fill="#55606F" opacity="0.15"/><rect x="200" y="200" width="170" height="60" rx="8" fill="#2563A8"/><text x="330" y="235" class="label-light" font-size="15">25%</text><text x="184" y="325" text-anchor="end" class="label" font-size="15">Verdieping</text><rect x="200" y="290" width="680" height="60" rx="8" fill="#55606F" opacity="0.15"/><rect x="200" y="290" width="102" height="60" rx="8" fill="#55606F"/><text x="262" y="325" class="label-light" font-size="15">15%</text><text x="184" y="415" text-anchor="end" class="label" font-size="15">Suggestiewerk</text><rect x="200" y="380" width="680" height="60" rx="8" fill="#55606F" opacity="0.15"/><rect x="200" y="380" width="306" height="60" rx="8" fill="#E9A13B"/><text x="466" y="415" class="label-light" font-size="15">45%</text><text x="184" y="505" text-anchor="end" class="label" font-size="15">Afronding</text><rect x="200" y="470" width="680" height="60" rx="8" fill="#55606F" opacity="0.15"/><rect x="200" y="470" width="102" height="60" rx="8" fill="#2563A8"/><text x="262" y="505" class="label-light" font-size="15">15%</text><rect x="40" y="560" width="880" height="60" rx="8" fill="#14213D"/><text x="480" y="596" text-anchor="middle" class="label-light">Meer dan twee verdiepingsstappen is bijna altijd overbodig.</text>
</svg>
