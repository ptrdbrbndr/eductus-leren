<rect width="960" height="640" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 2 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Acht mythes, claim tegenover waarde</text>
<text x="40" y="90" class="sub">Elke mythe volgt hetzelfde drieluik: wat wordt beweerd, wat zegt onderzoek, en welke waarde zit er verstopt.</text><rect x="40" y="130" width="205" height="170" rx="10" fill="#fff" stroke="#DFDCD3" stroke-width="1.5"/><circle cx="68" cy="158" r="16" fill="#2563A8"/><text x="68" y="163" text-anchor="middle" class="label-light" font-size="13">1</text><text x="90" y="154" class="label" font-size="13">Controleverlies</text><text x="56" y="200" class="sub">status: weerlegd</text><text x="56" y="222" class="sub">waarde:</text><text x="56" y="237" class="sub">moeiteloosheid =</text><text x="56" y="252" class="sub">waardevol</text><rect x="260" y="130" width="205" height="170" rx="10" fill="#fff" stroke="#DFDCD3" stroke-width="1.5"/><circle cx="288" cy="158" r="16" fill="#2563A8"/><text x="288" y="163" text-anchor="middle" class="label-light" font-size="13">2</text><text x="310" y="154" class="label" font-size="13">Hypnose is slaap</text><text x="276" y="200" class="sub">status: weerlegd</text><text x="276" y="222" class="sub">waarde: rustbeeld</text><text x="276" y="237" class="sub">bruikbaar</text><rect x="480" y="130" width="205" height="170" rx="10" fill="#fff" stroke="#DFDCD3" stroke-width="1.5"/><circle cx="508" cy="158" r="16" fill="#2563A8"/><text x="508" y="163" text-anchor="middle" class="label-light" font-size="13">3</text><text x="530" y="154" class="label" font-size="13">Blijven hangen</text><text x="496" y="200" class="sub">status: weerlegd</text><text x="496" y="222" class="sub">waarde: nette</text><text x="496" y="237" class="sub">afronding hoort</text><text x="496" y="252" class="sub">erbij</text><rect x="700" y="130" width="205" height="170" rx="10" fill="#fff" stroke="#DFDCD3" stroke-width="1.5"/><circle cx="728" cy="158" r="16" fill="#2563A8"/><text x="728" y="163" text-anchor="middle" class="label-light" font-size="13">4</text><text x="750" y="154" class="label" font-size="13">Alleen zwakke</text><text x="750" y="169" class="label" font-size="13">mensen</text><text x="716" y="200" class="sub">status: weerlegd</text><text x="716" y="222" class="sub">waarde: reageren =</text><text x="716" y="237" class="sub">vaardigheid</text><rect x="40" y="315" width="205" height="170" rx="10" fill="#fff" stroke="#DFDCD3" stroke-width="1.5"/><circle cx="68" cy="343" r="16" fill="#2563A8"/><text x="68" y="348" text-anchor="middle" class="label-light" font-size="13">5</text><text x="90" y="339" class="label" font-size="13">Speciale gaven</text><text x="56" y="385" class="sub">status: weerlegd</text><text x="56" y="407" class="sub">waarde: kernzin 1:</text><text x="56" y="422" class="sub">bescheidenheid</text><rect x="260" y="315" width="205" height="170" rx="10" fill="#F4E2DD" stroke="#8A3324" stroke-width="1.5"/><circle cx="288" cy="343" r="16" fill="#8A3324"/><text x="288" y="348" text-anchor="middle" class="label-light" font-size="13">6</text><text x="310" y="339" class="label" font-size="13">Waarheidsserum</text><text x="276" y="385" class="sub">status: grensles</text><text x="276" y="407" class="sub">waarde: nooit</text><text x="276" y="422" class="sub">regressiewerk</text><rect x="480" y="315" width="205" height="170" rx="10" fill="#fff" stroke="#DFDCD3" stroke-width="1.5"/><circle cx="508" cy="343" r="16" fill="#2563A8"/><text x="508" y="348" text-anchor="middle" class="label-light" font-size="13">7</text><text x="530" y="339" class="label" font-size="13">Werkt bij mij niet</text><text x="496" y="385" class="sub">status: weerlegd</text><text x="496" y="407" class="sub">waarde:</text><text x="496" y="422" class="sub">verwachtingsmanagement</text><rect x="700" y="315" width="205" height="170" rx="10" fill="#fff" stroke="#DFDCD3" stroke-width="1.5"/><circle cx="728" cy="343" r="16" fill="#2563A8"/><text x="728" y="348" text-anchor="middle" class="label-light" font-size="13">8</text><text x="750" y="339" class="label" font-size="13">Eén-sessie-wonder</text><text x="716" y="385" class="sub">status: weerlegd</text><text x="716" y="407" class="sub">waarde: brug naar</text><text x="716" y="422" class="sub">spoor A</text><rect x="40" y="560" width="880" height="60" rx="8" fill="#14213D"/><text x="480" y="596" text-anchor="middle" class="label-light">Mythe 6 is uitsluitend een grensles: nooit regressie- of herinneringswerk.</text>
</svg>
