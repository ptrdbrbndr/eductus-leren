<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'DM Sans', Arial, sans-serif" width="960" height="640" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper {{ fill:#FBFAF7; }}
      .label {{ font-size:14px; font-weight:700; fill:#14213D; }}
      .label-light {{ font-size:14px; font-weight:700; fill:#FBFAF7; }}
      .sub {{ font-size:12px; fill:#55606F; }}
      .sub-light {{ font-size:12px; fill:#DFDCD3; }}
      .title {{ font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }}
      .title-sm {{ font-family:'Cormorant Garamond', Georgia, serif; font-size:19px; fill:#14213D; font-weight:600; }}
      .kicker {{ font-size:11px; fill:#55606F; letter-spacing:.10em; }}
      .arrow {{ stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }}
      .arrow-muted {{ stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arrm); }}
      .arrow-amber {{ stroke:#E9A13B; stroke-width:2; fill:none; marker-end:url(#arra); }}
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arrm" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
  </defs>
<rect width="960" height="640" class="paper"/>
<text x="40" y="34" class="kicker">CURSUSBREED · CASUSDOSSIER</text>
<text x="40" y="64" class="title">De vijf hoofdpersonen</text>
<text x="40" y="90" class="sub">Vijf fictieve personen die de hele cursus vergezellen, elk met hun eigen vraag en leerfunctie.</text><rect x="40" y="140" width="168" height="360" rx="12" fill="#fff" stroke="#DFDCD3" stroke-width="1.5"/><circle cx="124" cy="186" r="26" fill="#2563A8"/><text x="124" y="240" text-anchor="middle" class="title-sm">Daan (38)</text><text x="124" y="258" text-anchor="middle" class="sub">projectmanager</text><text x="124" y="288" text-anchor="middle" class="sub" font-style="italic">"Werkt dit wel</text><text x="124" y="304" text-anchor="middle" class="sub" font-style="italic">echt?"</text><line x1="56" y1="330" x2="192" y2="330" stroke="#DFDCD3" stroke-width="1"/><text x="124" y="356" text-anchor="middle" class="label" font-size="12">De scepticus</text><rect x="220" y="140" width="168" height="360" rx="12" fill="#fff" stroke="#DFDCD3" stroke-width="1.5"/><circle cx="304" cy="186" r="26" fill="#2563A8"/><text x="304" y="240" text-anchor="middle" class="title-sm">Iris (29)</text><text x="304" y="258" text-anchor="middle" class="sub">UX-designer</text><text x="304" y="288" text-anchor="middle" class="sub" font-style="italic">"Ik lig te lang</text><text x="304" y="304" text-anchor="middle" class="sub" font-style="italic">wakker."</text><line x1="236" y1="330" x2="372" y2="330" stroke="#DFDCD3" stroke-width="1"/><text x="304" y="356" text-anchor="middle" class="label" font-size="12">De ideale</text><text x="304" y="372" text-anchor="middle" class="label" font-size="12">zelfhypnose-cliënt</text><rect x="400" y="140" width="168" height="360" rx="12" fill="#fff" stroke="#DFDCD3" stroke-width="1.5"/><circle cx="484" cy="186" r="26" fill="#2563A8"/><text x="484" y="240" text-anchor="middle" class="title-sm">Karim (45)</text><text x="484" y="258" text-anchor="middle" class="sub">accountmanager</text><text x="484" y="288" text-anchor="middle" class="sub" font-style="italic">"Ik klap dicht bij</text><text x="484" y="304" text-anchor="middle" class="sub" font-style="italic">presentaties."</text><line x1="416" y1="330" x2="552" y2="330" stroke="#DFDCD3" stroke-width="1"/><text x="484" y="356" text-anchor="middle" class="label" font-size="12">De prestatiecasus</text><rect x="580" y="140" width="168" height="360" rx="12" fill="#fff" stroke="#DFDCD3" stroke-width="1.5"/><circle cx="664" cy="186" r="26" fill="#2563A8"/><text x="664" y="240" text-anchor="middle" class="title-sm">Els (52)</text><text x="664" y="258" text-anchor="middle" class="sub">verpleegkundige</text><text x="664" y="288" text-anchor="middle" class="sub" font-style="italic">"Dit is mijn laatste</text><text x="664" y="304" text-anchor="middle" class="sub" font-style="italic">poging."</text><line x1="596" y1="330" x2="732" y2="330" stroke="#DFDCD3" stroke-width="1"/><text x="664" y="356" text-anchor="middle" class="label" font-size="12">De gewoontecasus</text><rect x="760" y="140" width="168" height="360" rx="12" fill="#fff" stroke="#DFDCD3" stroke-width="1.5"/><circle cx="844" cy="186" r="26" fill="#E9A13B"/><text x="844" y="240" text-anchor="middle" class="title-sm">Mark (33)</text><text x="844" y="258" text-anchor="middle" class="sub">softwareontwikkelaar</text><text x="844" y="288" text-anchor="middle" class="sub" font-style="italic">"Misschien helpt</text><text x="844" y="304" text-anchor="middle" class="sub" font-style="italic">hypnose."</text><line x1="776" y1="330" x2="912" y2="330" stroke="#DFDCD3" stroke-width="1"/><text x="844" y="356" text-anchor="middle" class="label" font-size="12">De doorverwijscasus</text><rect x="40" y="560" width="880" height="60" rx="8" fill="#14213D"/><text x="480" y="596" text-anchor="middle" class="label-light">Mark keert in elk niveau terug — en wordt in deze cursus nooit behandeld.</text>
</svg>
