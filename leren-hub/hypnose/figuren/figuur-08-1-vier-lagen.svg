<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'DM Sans', Arial, sans-serif" width="960" height="640" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper {{ fill:#FBFAF7; }}
      .label {{ font-size:14px; font-weight:700; fill:#14213D; }}
      .label-light {{ font-size:14px; font-weight:700; fill:#FBFAF7; }}
      .sub {{ font-size:12px; fill:#55606F; }}
      .sub-light {{ font-size:12px; fill:#DFDCD3; }}
      .title {{ font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }}
      .title-sm {{ font-family:'Cormorant Garamond', Georgia, serif; font-size:19px; fill:#14213D; font-weight:600; }}
      .kicker {{ font-size:11px; fill:#55606F; letter-spacing:.10em; }}
      .arrow {{ stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }}
      .arrow-muted {{ stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arrm); }}
      .arrow-amber {{ stroke:#E9A13B; stroke-width:2; fill:none; marker-end:url(#arra); }}
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arrm" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
  </defs>
<rect width="960" height="640" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 8 · SYNTHESE NIVEAU 1</text>
<text x="40" y="64" class="title">Het vier-lagen-model</text>
<text x="40" y="90" class="sub">Elke laag draagt de volgende. Wie laag 1 mist, is gevaarlijker dan wie niets kan.</text><rect x="150.000000" y="500" width="660.000000" height="68" rx="10" fill="#2563A8"/><text x="480" y="530" text-anchor="middle" class="label-light" font-size="16">Laag 4 — Structuur</text><text x="480" y="550" text-anchor="middle" class="sub-light">delen 5-7 · inductie, verdieping, afronding</text><rect x="210.000000" y="422" width="540.000000" height="68" rx="10" fill="#2563A8"/><text x="480" y="452" text-anchor="middle" class="label-light" font-size="16">Laag 3 — Taal</text><text x="480" y="472" text-anchor="middle" class="sub-light">deel 4 · bouwstenen, patronen, stem, toestemming</text><rect x="270.000000" y="344" width="420.000000" height="68" rx="10" fill="#2563A8"/><text x="480" y="374" text-anchor="middle" class="label-light" font-size="16">Laag 2 — Waarneming</text><text x="480" y="394" text-anchor="middle" class="sub-light">deel 3 · absorptie, suggestibiliteit, kanalen</text><rect x="330.000000" y="266" width="300.000000" height="68" rx="10" fill="#14213D"/><text x="480" y="296" text-anchor="middle" class="label-light" font-size="16">Laag 1 — Houding</text><text x="480" y="316" text-anchor="middle" class="sub-light">delen 1-2 · drieluik, vijf grenzen, mythes</text><text x="480" y="112" text-anchor="middle" class="title-sm">Mark</text><text x="480" y="132" text-anchor="middle" class="sub">staat naast alle vier lagen als grens</text><rect x="40" y="560" width="880" height="60" rx="8" fill="#14213D"/><text x="480" y="596" text-anchor="middle" class="label-light">Eén evaluatiestandaard door alles heen: reageert hij, en is hij comfortabel?</text>
</svg>
