<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'DM Sans', Arial, sans-serif" width="960" height="640" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper {{ fill:#FBFAF7; }}
      .label {{ font-size:14px; font-weight:700; fill:#14213D; }}
      .label-light {{ font-size:14px; font-weight:700; fill:#FBFAF7; }}
      .sub {{ font-size:12px; fill:#55606F; }}
      .sub-light {{ font-size:12px; fill:#DFDCD3; }}
      .title {{ font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }}
      .title-sm {{ font-family:'Cormorant Garamond', Georgia, serif; font-size:19px; fill:#14213D; font-weight:600; }}
      .kicker {{ font-size:11px; fill:#55606F; letter-spacing:.10em; }}
      .arrow {{ stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }}
      .arrow-muted {{ stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arrm); }}
      .arrow-amber {{ stroke:#E9A13B; stroke-width:2; fill:none; marker-end:url(#arra); }}
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arrm" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
  </defs>
<rect width="960" height="640" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 17 · TERUGVALPREVENTIE</text>
<text x="40" y="64" class="title">Van vroeg signaal tot passende actie</text>
<text x="40" y="90" class="sub">Een lapse die als relapse wordt behandeld, wordt er vaak zelf een.</text><rect x="60" y="150" width="200" height="70" rx="10" fill="#2563A8"/><text x="160" y="192" text-anchor="middle" class="label-light">Vroeg signaal</text><path d="M260,185 L360,185" class="arrow"/><rect x="360" y="150" width="200" height="70" rx="10" fill="#14213D"/><text x="460" y="192" text-anchor="middle" class="label-light">Noodplan</text><path d="M460,220 L460,280" class="arrow"/><rect x="330" y="280" width="260" height="60" rx="10" fill="#fff" stroke="#DFDCD3" stroke-width="1.5"/><text x="460" y="316" text-anchor="middle" class="label">Lapse, of relapse?</text><path d="M400,340 L280,420" class="arrow-amber"/><path d="M520,340 L640,420" class="arrow-muted"/><rect x="140" y="420" width="230" height="80" rx="10" fill="#E9A13B" opacity="0.15"/><text x="255" y="450" text-anchor="middle" class="label">Lapse</text><text x="255" y="470" text-anchor="middle" class="sub">informatie, geen eindpunt</text><text x="255" y="488" text-anchor="middle" class="sub">→ terug naar het plan</text><rect x="540" y="420" width="230" height="80" rx="10" fill="#55606F" opacity="0.12"/><text x="655" y="450" text-anchor="middle" class="label">Relapse</text><text x="655" y="470" text-anchor="middle" class="sub">serieus nemen</text><text x="655" y="488" text-anchor="middle" class="sub">→ vangnet activeren</text><rect x="40" y="560" width="880" height="60" rx="8" fill="#14213D"/><text x="480" y="596" text-anchor="middle" class="label-light">Een gemiste dag is geen mislukking — de gewoonte breekt pas na een reeks.</text>
</svg>
