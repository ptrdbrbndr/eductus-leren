<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'DM Sans', Arial, sans-serif" width="960" height="640" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper {{ fill:#FBFAF7; }}
      .label {{ font-size:14px; font-weight:700; fill:#14213D; }}
      .label-light {{ font-size:14px; font-weight:700; fill:#FBFAF7; }}
      .sub {{ font-size:12px; fill:#55606F; }}
      .sub-light {{ font-size:12px; fill:#DFDCD3; }}
      .title {{ font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }}
      .title-sm {{ font-family:'Cormorant Garamond', Georgia, serif; font-size:19px; fill:#14213D; font-weight:600; }}
      .kicker {{ font-size:11px; fill:#55606F; letter-spacing:.10em; }}
      .arrow {{ stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }}
      .arrow-muted {{ stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arrm); }}
      .arrow-amber {{ stroke:#E9A13B; stroke-width:2; fill:none; marker-end:url(#arra); }}
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arrm" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
  </defs>
<rect width="960" height="640" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 18 · PROFESSIONEEL PROTOCOL</text>
<text x="40" y="64" class="title">Het zesfasenprotocol</text>
<text x="40" y="90" class="sub">Het vierfasenmodel uit deel 5, uitgerekt tot zes fasen — een denkkader, geen script.</text><path d="M470.000000,175.000000 Q535.168412,237.125000 621.554446,262.500000" class="arrow-muted"/><circle cx="470.000000" cy="175.000000" r="30" fill="#2563A8"/><text x="470.000000" y="181.000000" text-anchor="middle" class="label-light" font-size="16">1</text><text x="470.000000" y="115.000000" text-anchor="middle" class="label" font-size="13">Intake</text><path d="M621.554446,262.500000 Q600.336823,350.000000 621.554446,437.500000" class="arrow-muted"/><circle cx="621.554446" cy="262.500000" r="30" fill="#14213D"/><text x="621.554446" y="268.500000" text-anchor="middle" class="label-light" font-size="16">2</text><text x="681.515970" y="232.500000" text-anchor="start" class="label" font-size="13">Beschrijven</text><path d="M621.554446,437.500000 Q535.168412,462.875000 470.000000,525.000000" class="arrow-muted"/><circle cx="621.554446" cy="437.500000" r="30" fill="#2563A8"/><text x="621.554446" y="443.500000" text-anchor="middle" class="label-light" font-size="16">3</text><text x="681.515970" y="467.500000" text-anchor="start" class="label" font-size="13">Luisteren</text><path d="M470.000000,525.000000 Q404.831588,462.875000 318.445554,437.500000" class="arrow-muted"/><circle cx="470.000000" cy="525.000000" r="30" fill="#14213D"/><text x="470.000000" y="531.000000" text-anchor="middle" class="label-light" font-size="16">4</text><text x="470.000000" y="585.000000" text-anchor="middle" class="label" font-size="13">Dialoog</text><path d="M318.445554,437.500000 Q339.663177,350.000000 318.445554,262.500000" class="arrow-muted"/><circle cx="318.445554" cy="437.500000" r="30" fill="#2563A8"/><text x="318.445554" y="443.500000" text-anchor="middle" class="label-light" font-size="16">5</text><text x="258.484030" y="467.500000" text-anchor="end" class="label" font-size="13">Weerklank</text><path d="M318.445554,262.500000 Q404.831588,237.125000 470.000000,175.000000" class="arrow-muted"/><circle cx="318.445554" cy="262.500000" r="30" fill="#14213D"/><text x="318.445554" y="268.500000" text-anchor="middle" class="label-light" font-size="16">6</text><text x="258.484030" y="232.500000" text-anchor="end" class="label" font-size="13">Afsluiting</text><circle cx="470" cy="350" r="55" fill="#E9A13B" opacity="0.1"/><rect x="40" y="560" width="880" height="60" rx="8" fill="#14213D"/><text x="480" y="596" text-anchor="middle" class="label-light">Fase 1 stopt een contra-indicatie net zo vroeg als altijd — hoe uitgebreid het protocol ook is.</text>
</svg>
