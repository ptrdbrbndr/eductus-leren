<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'DM Sans', Arial, sans-serif" width="960" height="640" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper {{ fill:#FBFAF7; }}
      .label {{ font-size:14px; font-weight:700; fill:#14213D; }}
      .label-light {{ font-size:14px; font-weight:700; fill:#FBFAF7; }}
      .sub {{ font-size:12px; fill:#55606F; }}
      .sub-light {{ font-size:12px; fill:#DFDCD3; }}
      .title {{ font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }}
      .title-sm {{ font-family:'Cormorant Garamond', Georgia, serif; font-size:19px; fill:#14213D; font-weight:600; }}
      .kicker {{ font-size:11px; fill:#55606F; letter-spacing:.10em; }}
      .arrow {{ stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }}
      .arrow-muted {{ stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arrm); }}
      .arrow-amber {{ stroke:#E9A13B; stroke-width:2; fill:none; marker-end:url(#arra); }}
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arrm" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
  </defs>
<rect width="960" height="640" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 12 · TWEE GEREEDSCHAPPEN</text>
<text x="40" y="64" class="title">Anker en posthypnotische suggestie</text>
<text x="40" y="90" class="sub">Beide roepen een eerder opgebouwde toestand opnieuw op — met een andere vorm.</text><circle cx="280" cy="300" r="90" fill="#2563A8" opacity="0.1"/><circle cx="280" cy="300" r="50" fill="#2563A8"/><circle cx="280" cy="300" r="20" fill="#14213D"/><text x="280" y="420" text-anchor="middle" class="title-sm">Anker — de knop</text><text x="280" y="444" text-anchor="middle" class="sub">Specifieke stimulus,</text><text x="280" y="460" text-anchor="middle" class="sub">bewust geactiveerd door de</text><text x="280" y="476" text-anchor="middle" class="sub">cliënt zelf.</text><ellipse cx="680" cy="300" rx="34" ry="46" fill="#E9A13B"/><path d="M680,254 Q700,220 680,190" class="arrow-amber"/><text x="680" y="420" text-anchor="middle" class="title-sm">Posthypnotische suggestie — het zaadje</text><text x="680" y="444" text-anchor="middle" class="sub">Instructie die vanzelf opkomt</text><text x="680" y="460" text-anchor="middle" class="sub">bij een situatie, zonder</text><text x="680" y="476" text-anchor="middle" class="sub">bewuste handeling.</text><line x1="480" y1="230" x2="480" y2="470" stroke="#DFDCD3" stroke-dasharray="4 4"/><text x="480" y="500" text-anchor="middle" class="sub">gedeelde wortel: een eerder opgebouwde toestand</text><rect x="40" y="560" width="880" height="60" rx="8" fill="#14213D"/><text x="480" y="596" text-anchor="middle" class="label-light">Kort werkt omdat lang is voorgeoefend — bij beide gereedschappen.</text>
</svg>
