<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'DM Sans', Arial, sans-serif" width="960" height="640" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper {{ fill:#FBFAF7; }}
      .label {{ font-size:14px; font-weight:700; fill:#14213D; }}
      .label-light {{ font-size:14px; font-weight:700; fill:#FBFAF7; }}
      .sub {{ font-size:12px; fill:#55606F; }}
      .sub-light {{ font-size:12px; fill:#DFDCD3; }}
      .title {{ font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }}
      .title-sm {{ font-family:'Cormorant Garamond', Georgia, serif; font-size:19px; fill:#14213D; font-weight:600; }}
      .kicker {{ font-size:11px; fill:#55606F; letter-spacing:.10em; }}
      .arrow {{ stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }}
      .arrow-muted {{ stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arrm); }}
      .arrow-amber {{ stroke:#E9A13B; stroke-width:2; fill:none; marker-end:url(#arra); }}
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arrm" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
  </defs>
<rect width="960" height="640" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 20 · KINDEREN EN GEZIN</text>
<text x="40" y="64" class="title">Drie harde kindgrenzen</text>
<text x="40" y="90" class="sub">Elke hoek is een grens op zich; het kantelpunt zit in wie eigenlijk de cliënt is.</text><path d="M480,160 L250,480 L710,480 Z" fill="#2563A8" opacity="0.08" stroke="#2563A8" stroke-width="2"/><circle cx="480" cy="160" r="30" fill="#14213D"/><text x="480" y="166" text-anchor="middle" class="label-light" font-size="18">A</text><text x="480" y="130" text-anchor="middle" class="label" font-size="14">Geen directe begeleiding</text><text x="480" y="148" text-anchor="middle" class="sub">ongeacht toestemming of</text><text x="480" y="163" text-anchor="middle" class="sub">aanwezigheid van een ouder</text><circle cx="250" cy="480" r="30" fill="#14213D"/><text x="250" y="486" text-anchor="middle" class="label-light" font-size="18">B</text><text x="250" y="520" text-anchor="middle" class="label" font-size="14">Geen omweg via de ouder</text><text x="250" y="538" text-anchor="middle" class="sub">instructie aan de ouder is</text><text x="250" y="553" text-anchor="middle" class="sub">dezelfde overtreding</text><circle cx="710" cy="480" r="30" fill="#2563A8"/><text x="710" y="486" text-anchor="middle" class="label-light" font-size="18">C</text><text x="710" y="520" text-anchor="middle" class="label" font-size="14">Ouder mag zelf cliënt zijn</text><text x="710" y="538" text-anchor="middle" class="sub">met een eigen, volwassen</text><text x="710" y="553" text-anchor="middle" class="sub">doel — toegestaan</text><rect x="40" y="560" width="880" height="60" rx="8" fill="#14213D"/><text x="480" y="596" text-anchor="middle" class="label-light">Aanwezigheid van een vertrouwde volwassene verandert niets aan grens A of B.</text>
</svg>
