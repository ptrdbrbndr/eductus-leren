<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'DM Sans', Arial, sans-serif" width="960" height="640" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper {{ fill:#FBFAF7; }}
      .label {{ font-size:14px; font-weight:700; fill:#14213D; }}
      .label-light {{ font-size:14px; font-weight:700; fill:#FBFAF7; }}
      .sub {{ font-size:12px; fill:#55606F; }}
      .sub-light {{ font-size:12px; fill:#DFDCD3; }}
      .title {{ font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }}
      .title-sm {{ font-family:'Cormorant Garamond', Georgia, serif; font-size:19px; fill:#14213D; font-weight:600; }}
      .kicker {{ font-size:11px; fill:#55606F; letter-spacing:.10em; }}
      .arrow {{ stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }}
      .arrow-muted {{ stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arrm); }}
      .arrow-amber {{ stroke:#E9A13B; stroke-width:2; fill:none; marker-end:url(#arra); }}
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arrm" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
  </defs>
<rect width="960" height="640" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 11 · METAFOOR BOUWEN</text>
<text x="40" y="64" class="title">Dezelfde structuur, andere inhoud</text>
<text x="40" y="90" class="sub">Een werkzame metafoor is isomorf: de structuur komt overeen, de inhoud verschilt.</text><text x="240" y="120" text-anchor="middle" class="title-sm">Karims presentatiespanning</text><text x="740" y="120" text-anchor="middle" class="title-sm">Een hardloper voor de start</text><rect x="120" y="150" width="240" height="70" rx="10" fill="#fff" stroke="#DFDCD3" stroke-width="1.5"/><rect x="620" y="150" width="240" height="70" rx="10" fill="#fff" stroke="#DFDCD3" stroke-width="1.5"/><text x="240" y="180" text-anchor="middle" class="label" font-size="13">Opbouw van spanning</text><text x="740" y="180" text-anchor="middle" class="label" font-size="13">Wachten voor de start</text><path d="M365,185 L615,185" class="arrow-amber" stroke-dasharray="4 4"/><rect x="120" y="250" width="240" height="70" rx="10" fill="#fff" stroke="#DFDCD3" stroke-width="1.5"/><rect x="620" y="250" width="240" height="70" rx="10" fill="#fff" stroke="#DFDCD3" stroke-width="1.5"/><text x="240" y="280" text-anchor="middle" class="label" font-size="13">Het startsignaal</text><text x="740" y="280" text-anchor="middle" class="label" font-size="13">Het schot</text><path d="M365,285 L615,285" class="arrow-amber" stroke-dasharray="4 4"/><rect x="120" y="350" width="240" height="70" rx="10" fill="#fff" stroke="#DFDCD3" stroke-width="1.5"/><rect x="620" y="350" width="240" height="70" rx="10" fill="#fff" stroke="#DFDCD3" stroke-width="1.5"/><text x="240" y="380" text-anchor="middle" class="label" font-size="13">Lichaam weet wat te doen</text><text x="740" y="380" text-anchor="middle" class="label" font-size="13">Benen beginnen vanzelf</text><path d="M365,385 L615,385" class="arrow-amber" stroke-dasharray="4 4"/><rect x="120" y="450" width="240" height="70" rx="10" fill="#fff" stroke="#DFDCD3" stroke-width="1.5"/><rect x="620" y="450" width="240" height="70" rx="10" fill="#fff" stroke="#DFDCD3" stroke-width="1.5"/><text x="240" y="480" text-anchor="middle" class="label" font-size="13">Eerste zin gezegd — verder</text><text x="740" y="480" text-anchor="middle" class="label" font-size="13">Eerste honderd meter —</text><text x="740" y="496" text-anchor="middle" class="label" font-size="13">ritme</text><path d="M365,485 L615,485" class="arrow-amber" stroke-dasharray="4 4"/><rect x="40" y="560" width="880" height="60" rx="8" fill="#14213D"/><text x="480" y="596" text-anchor="middle" class="label-light">Structuur uitwerken, dan pas inhoud kiezen — nooit andersom.</text>
</svg>
