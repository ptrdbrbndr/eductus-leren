<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'DM Sans', Arial, sans-serif" width="960" height="640" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper {{ fill:#FBFAF7; }}
      .label {{ font-size:14px; font-weight:700; fill:#14213D; }}
      .label-light {{ font-size:14px; font-weight:700; fill:#FBFAF7; }}
      .sub {{ font-size:12px; fill:#55606F; }}
      .sub-light {{ font-size:12px; fill:#DFDCD3; }}
      .title {{ font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }}
      .title-sm {{ font-family:'Cormorant Garamond', Georgia, serif; font-size:19px; fill:#14213D; font-weight:600; }}
      .kicker {{ font-size:11px; fill:#55606F; letter-spacing:.10em; }}
      .arrow {{ stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }}
      .arrow-muted {{ stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arrm); }}
      .arrow-amber {{ stroke:#E9A13B; stroke-width:2; fill:none; marker-end:url(#arra); }}
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arrm" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
  </defs>
<rect width="960" height="640" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 21 · ETHIEK EN GRENZEN</text>
<text x="40" y="64" class="title">Eén principe, steeds nieuwe lagen</text>
<text x="40" y="90" class="sub">Alle grenzen uit de cursus beschermen hetzelfde middelpunt.</text><circle cx="480" cy="360" r="230" fill="#fff" stroke="#DFDCD3" stroke-width="1.5"/><circle cx="480" cy="360" r="180" fill="#F3E7CF" stroke="#E3CFA6" stroke-width="1.5"/><circle cx="480" cy="360" r="130" fill="#E2ECE8" stroke="#2563A8" stroke-width="1.5"/><circle cx="480" cy="360" r="75" fill="#2563A8" stroke="#2563A8" stroke-width="1.5"/><circle cx="480" cy="360" r="30" fill="#14213D"/><text x="480" y="357" text-anchor="middle" class="label-light" font-size="11">de cliënt</text><text x="480" y="371" text-anchor="middle" class="label-light" font-size="11">houdt de regie</text><text x="480" y="150" text-anchor="middle" class="label" font-size="13">Drieluik &amp; evaluatiestandaard</text><text x="480" y="198" text-anchor="middle" class="label" font-size="13">Contra-indicaties &amp; kindgrenzen</text><text x="480" y="246" text-anchor="middle" class="label" font-size="13">Vijf harde grenzen</text><text x="480" y="294" text-anchor="middle" class="label-light" font-size="11">Twee kernzinnen</text><rect x="40" y="560" width="880" height="60" rx="8" fill="#14213D"/><text x="480" y="596" text-anchor="middle" class="label-light">Gebruik uw invloed alleen binnen wat is toegestaan — en nooit voor uzelf.</text>
</svg>
