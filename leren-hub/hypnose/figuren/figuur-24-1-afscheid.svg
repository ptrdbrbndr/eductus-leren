<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'DM Sans', Arial, sans-serif" width="960" height="640" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper {{ fill:#FBFAF7; }}
      .label {{ font-size:14px; font-weight:700; fill:#14213D; }}
      .label-light {{ font-size:14px; font-weight:700; fill:#FBFAF7; }}
      .sub {{ font-size:12px; fill:#55606F; }}
      .sub-light {{ font-size:12px; fill:#DFDCD3; }}
      .title {{ font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }}
      .title-sm {{ font-family:'Cormorant Garamond', Georgia, serif; font-size:19px; fill:#14213D; font-weight:600; }}
      .kicker {{ font-size:11px; fill:#55606F; letter-spacing:.10em; }}
      .arrow {{ stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }}
      .arrow-muted {{ stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arrm); }}
      .arrow-amber {{ stroke:#E9A13B; stroke-width:2; fill:none; marker-end:url(#arra); }}
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arrm" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
  </defs>
<rect width="960" height="640" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 24 · CAPSTONE</text>
<text x="40" y="64" class="title">Afscheid van de vijf casuspersonen</text>
<text x="40" y="90" class="sub">Niemand van de vijf is 'opgelost' — uw omgang met hen wel.</text><circle cx="137" cy="220" r="46" fill="#2563A8"/><text x="137" y="226" text-anchor="middle" class="label-light" font-size="16">Daan</text><rect x="60" y="290" width="155" height="46" rx="10" fill="#fff" stroke="#DFDCD3" stroke-width="1.5"/><text x="137" y="318" text-anchor="middle" class="label" font-size="14">scepsis</text><circle cx="307" cy="220" r="46" fill="#2563A8"/><text x="307" y="226" text-anchor="middle" class="label-light" font-size="16">Iris</text><rect x="230" y="290" width="155" height="46" rx="10" fill="#fff" stroke="#DFDCD3" stroke-width="1.5"/><text x="307" y="318" text-anchor="middle" class="label" font-size="14">precisie</text><circle cx="477" cy="220" r="46" fill="#2563A8"/><text x="477" y="226" text-anchor="middle" class="label-light" font-size="16">Karim</text><rect x="400" y="290" width="155" height="46" rx="10" fill="#fff" stroke="#DFDCD3" stroke-width="1.5"/><text x="477" y="318" text-anchor="middle" class="label" font-size="14">herhaling</text><circle cx="647" cy="220" r="46" fill="#2563A8"/><text x="647" y="226" text-anchor="middle" class="label-light" font-size="16">Els</text><rect x="570" y="290" width="155" height="46" rx="10" fill="#fff" stroke="#DFDCD3" stroke-width="1.5"/><text x="647" y="318" text-anchor="middle" class="label" font-size="14">volhouden</text><circle cx="817" cy="220" r="46" fill="#E9A13B"/><text x="817" y="226" text-anchor="middle" class="label-light" font-size="16">Mark</text><rect x="740" y="290" width="155" height="46" rx="10" fill="#fff" stroke="#DFDCD3" stroke-width="1.5"/><text x="817" y="318" text-anchor="middle" class="label" font-size="14">grens</text><rect x="40" y="560" width="880" height="60" rx="8" fill="#14213D"/><text x="480" y="596" text-anchor="middle" class="label-light">Nieuwsgierig, kritisch, consequent — bij de honderdste vraag net als bij de eerste.</text>
</svg>
