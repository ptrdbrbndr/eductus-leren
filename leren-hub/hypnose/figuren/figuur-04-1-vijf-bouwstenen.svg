<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'DM Sans', Arial, sans-serif" width="960" height="640" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper {{ fill:#FBFAF7; }}
      .label {{ font-size:14px; font-weight:700; fill:#14213D; }}
      .label-light {{ font-size:14px; font-weight:700; fill:#FBFAF7; }}
      .sub {{ font-size:12px; fill:#55606F; }}
      .sub-light {{ font-size:12px; fill:#DFDCD3; }}
      .title {{ font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }}
      .title-sm {{ font-family:'Cormorant Garamond', Georgia, serif; font-size:19px; fill:#14213D; font-weight:600; }}
      .kicker {{ font-size:11px; fill:#55606F; letter-spacing:.10em; }}
      .arrow {{ stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }}
      .arrow-muted {{ stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arrm); }}
      .arrow-amber {{ stroke:#E9A13B; stroke-width:2; fill:none; marker-end:url(#arra); }}
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arrm" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
  </defs>
<rect width="960" height="640" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 4 · EZELSBRUG</text>
<text x="40" y="64" class="title">De vijf bouwstenen van een goede suggestie</text>
<text x="40" y="90" class="sub">Elke suggestie in deze cursus toetst u aan deze vijf, als een hand met vijf vingers.</text><rect x="44" y="180" width="165" height="165" rx="82" fill="#2563A8" opacity="0.12"/><circle cx="126" cy="260" r="34" fill="#2563A8"/><text x="126" y="268" text-anchor="middle" class="label-light" font-size="20">1</text><text x="126" y="330" text-anchor="middle" class="label" font-size="13">Positief</text><text x="126" y="347" text-anchor="middle" class="label" font-size="13">geformuleerd</text><rect x="221" y="180" width="165" height="165" rx="82" fill="#2563A8" opacity="0.12"/><circle cx="303" cy="260" r="34" fill="#2563A8"/><text x="303" y="268" text-anchor="middle" class="label-light" font-size="20">2</text><text x="303" y="330" text-anchor="middle" class="label" font-size="13">Zintuiglijk</text><text x="303" y="347" text-anchor="middle" class="label" font-size="13">concreet</text><rect x="398" y="180" width="165" height="165" rx="82" fill="#2563A8" opacity="0.12"/><circle cx="480" cy="260" r="34" fill="#2563A8"/><text x="480" y="268" text-anchor="middle" class="label-light" font-size="20">3</text><text x="480" y="330" text-anchor="middle" class="label" font-size="13">Permissief</text><text x="480" y="347" text-anchor="middle" class="label" font-size="13">kader</text><rect x="575" y="180" width="165" height="165" rx="82" fill="#2563A8" opacity="0.12"/><circle cx="657" cy="260" r="34" fill="#2563A8"/><text x="657" y="268" text-anchor="middle" class="label-light" font-size="20">4</text><text x="657" y="330" text-anchor="middle" class="label" font-size="13">Tempo en</text><text x="657" y="347" text-anchor="middle" class="label" font-size="13">timing</text><rect x="752" y="180" width="165" height="165" rx="82" fill="#2563A8" opacity="0.12"/><circle cx="834" cy="260" r="34" fill="#2563A8"/><text x="834" y="268" text-anchor="middle" class="label-light" font-size="20">5</text><text x="834" y="330" text-anchor="middle" class="label" font-size="13">Herhaling</text><text x="834" y="347" text-anchor="middle" class="label" font-size="13">met variatie</text><rect x="40" y="560" width="880" height="60" rx="8" fill="#14213D"/><text x="480" y="596" text-anchor="middle" class="label-light">Geen enkele bouwsteen staat op zichzelf — een goede suggestie combineert ze.</text>
</svg>
