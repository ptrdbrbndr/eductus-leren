<svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig6-title fig6-desc">
<title id="fig6-title">De zettenladder: positioneren, herschrijven, weglopen</title>
<desc id="fig6-desc">Drie oplopende stappen met toenemende kosten — positioneren, herschrijven, weglopen — als volgorde om te overwegen bij een ongunstig platform, met Fleur's case als voorbeeld.</desc>
<defs>
<marker id="fig6-arrow" markerWidth="8" markerHeight="6" refX="4" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#55606F"/>
</marker>
</defs>
<style>
.fig6-h{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:15px;fill:#14213D}
.fig6-row{font-family:Georgia,'Times New Roman',serif;font-size:11px;fill:#55606F}
.fig6-lbl{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:8.5px;letter-spacing:0.6px;fill:#7C8794}
.fig6-num{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:13px;fill:#FBFAF7}
</style>
<rect width="800" height="520" fill="#FBFAF7"/>
<text x="40" y="36" font-family="Georgia,serif" font-size="20" font-weight="700" fill="#14213D">De zettenladder</text>
<text x="40" y="58" font-family="Georgia,serif" font-size="13" fill="#55606F">Van goedkoop naar duur — probeer eerst de onderste sport</text>

<line x1="40" y1="440" x2="800" y2="440" stroke="#14213D" stroke-width="1"/>
<line x1="220" y1="345" x2="290" y2="345" stroke="#55606F" stroke-width="1.2" marker-end="url(#fig6-arrow)"/>
<line x1="460" y1="265" x2="530" y2="265" stroke="#55606F" stroke-width="1.2" marker-end="url(#fig6-arrow)"/>

<!-- Step 1: Positioneren (recommended start = accent) -->
<rect x="60" y="360" width="160" height="80" fill="rgba(233,161,59,0.08)" stroke="#E9A13B" stroke-width="1.5"/>
<circle cx="140" cy="345" r="14" fill="#E9A13B"/>
<text x="140" y="349" class="fig6-num" text-anchor="middle">1</text>
<text x="80" y="384" class="fig6-h">Positioneren</text>
<text x="80" y="402" class="fig6-row">Kost: tijd om regels te leren</text>
<text x="80" y="418" class="fig6-row">gebruiken</text>

<!-- Step 2: Herschrijven -->
<rect x="300" y="280" width="160" height="160" fill="#FFFFFF" stroke="#14213D" stroke-width="1"/>
<circle cx="380" cy="265" r="14" fill="#14213D"/>
<text x="380" y="269" class="fig6-num" text-anchor="middle">2</text>
<text x="320" y="304" class="fig6-h">Herschrijven</text>
<text x="320" y="326" class="fig6-row">Kost: invloed, tijd,</text>
<text x="320" y="342" class="fig6-row">soms weerstand</text>
<text x="320" y="366" class="fig6-row">Levert: structurele</text>
<text x="320" y="382" class="fig6-row">verandering voor iedereen</text>

<!-- Step 3: Weglopen -->
<rect x="540" y="200" width="160" height="240" fill="#FFFFFF" stroke="#14213D" stroke-width="1"/>
<circle cx="620" cy="185" r="14" fill="#14213D"/>
<text x="620" y="189" class="fig6-num" text-anchor="middle">3</text>
<text x="560" y="224" class="fig6-h">Weglopen</text>
<text x="560" y="246" class="fig6-row">Kost: opgebouwde</text>
<text x="560" y="262" class="fig6-row">positie, nieuwe start</text>
<text x="560" y="286" class="fig6-row">Levert: andere</text>
<text x="560" y="302" class="fig6-row">incentive-curve</text>
<text x="560" y="326" class="fig6-lbl">LAATSTE REDMIDDEL</text>

<line x1="40" y1="466" x2="760" y2="466" stroke="#E3E0D8" stroke-width="0.8"/>
<text x="40" y="486" font-family="Georgia,serif" font-style="italic" font-size="12.5" fill="#55606F">Fleur begon bij 1: ze herschreef haar openingsalinea's binnen de bestaande regels vóór ze aan weglopen dacht.</text>
</svg>
