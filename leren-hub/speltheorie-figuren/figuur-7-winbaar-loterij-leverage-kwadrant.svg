<svg viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig7-title fig7-desc">
<title id="fig7-title">Kwadrant winbaar/loterij tegenover zonder/met leverage</title>
<desc id="fig7-desc">Tweeassig kwadrant met winbaar-versus-loterij op de verticale as en zonder-versus-met-leverage op de horizontale as, met Bram en Sofie geplaatst: Sofie's winbare spel met leverage is het doel van deze module.</desc>
<style>
.fig7-h{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:12px;fill:#14213D}
.fig7-s{font-family:Georgia,'Times New Roman',serif;font-size:11px;fill:#55606F}
.fig7-axis{font-family:Arial,Helvetica,sans-serif;font-weight:600;font-size:9px;letter-spacing:1px;fill:#7C8794}
.fig7-name{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:12px;fill:#14213D}
</style>
<rect width="800" height="460" fill="#FBFAF7"/>
<text x="40" y="36" font-family="Georgia,serif" font-size="20" font-weight="700" fill="#14213D">Winbaar en leverage naast elkaar</text>
<text x="40" y="58" font-family="Georgia,serif" font-size="13" fill="#55606F">Bram speelt winbaar zonder vermenigvuldiger; Sofie voegt leverage toe</text>

<!-- quadrant background quarters -->
<rect x="120" y="90" width="280" height="150" fill="rgba(20,33,61,0.03)"/>
<rect x="400" y="90" width="280" height="150" fill="rgba(233,161,59,0.08)"/>
<rect x="120" y="240" width="280" height="150" fill="#FFFFFF"/>
<rect x="400" y="240" width="280" height="150" fill="rgba(20,33,61,0.02)"/>

<rect x="120" y="90" width="560" height="300" fill="none" stroke="#14213D" stroke-width="1"/>
<line x1="400" y1="90" x2="400" y2="390" stroke="#E3E0D8" stroke-width="1"/>
<line x1="120" y1="240" x2="680" y2="240" stroke="#E3E0D8" stroke-width="1"/>

<text x="400" y="80" class="fig7-axis" text-anchor="middle">HERHAALBARE WEG BEKEND</text>
<text x="130" y="106" class="fig7-h">Winbaar</text>
<text x="130" y="384" class="fig7-h">Loterij</text>
<text x="128" y="404" class="fig7-axis">GEEN HERHAALBARE WEG</text>
<text x="130" y="264" class="fig7-axis">ZONDER LEVERAGE</text>
<text x="678" y="264" class="fig7-axis" text-anchor="end">MET LEVERAGE</text>

<!-- Bram: top-left -->
<circle cx="240" cy="150" r="7" fill="#14213D"/>
<text x="256" y="146" class="fig7-name">Bram</text>
<text x="256" y="162" class="fig7-s">meer uren, plafond bij</text>
<text x="256" y="176" class="fig7-s">eigen beschikbare tijd</text>

<!-- Sofie: top-right (focal) -->
<circle cx="560" cy="150" r="8" fill="#E9A13B" stroke="#14213D" stroke-width="1"/>
<text x="576" y="146" class="fig7-name">Sofie</text>
<text x="576" y="162" class="fig7-s">cursus blijft opleveren</text>
<text x="576" y="176" class="fig7-s">zonder herhaalde inzet</text>
<rect x="556" y="192" width="120" height="14" rx="2" fill="rgba(233,161,59,0.08)"/>
<text x="616" y="203" class="fig7-axis" text-anchor="middle" fill="#9a6418">DOEL VAN DEZE MODULE</text>

<!-- bottom-left: loterij zonder leverage -->
<text x="150" y="290" class="fig7-s">Eén keer viraal proberen</text>
<text x="150" y="306" class="fig7-s">zonder vaardigheid eronder</text>

<!-- bottom-right: loterij met leverage -->
<text x="430" y="290" class="fig7-s">Grote gok met geleend</text>
<text x="430" y="306" class="fig7-s">kapitaal op onbewezen idee</text>
<text x="430" y="326" font-family="Georgia,serif" font-style="italic" font-size="10.5" fill="#7C8794">geen kortere weg — leverage</text>
<text x="430" y="340" font-family="Georgia,serif" font-style="italic" font-size="10.5" fill="#7C8794">vermenigvuldigt ook verlies</text>

<line x1="40" y1="420" x2="760" y2="420" stroke="#E3E0D8" stroke-width="0.8"/>
<text x="40" y="440" font-family="Georgia,serif" font-style="italic" font-size="12.5" fill="#55606F">De rechterbovenhoek — winbaar mét leverage — is waar deze module naartoe werkt.</text>
</svg>
