<svg viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig8-title fig8-desc">
<title id="fig8-title">Het eindaudit-sjabloon: de zeven modules samengebracht</title>
<desc id="fig8-desc">Overzichtsdiagram dat toont hoe het eindaudit-sjabloon van module 8 elk van de zeven eerdere modules als kolom gebruikt, en samenkomt in een besluit met een 14-dagen-experiment.</desc>
<defs>
<marker id="fig8-arrow" markerWidth="8" markerHeight="6" refX="4" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#55606F"/>
</marker>
</defs>
<style>
.fig8-h{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:14px;fill:#14213D}
.fig8-num{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:11px;fill:#FBFAF7}
.fig8-tag{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:9.5px;fill:#14213D}
.fig8-s{font-family:Georgia,'Times New Roman',serif;font-size:9.5px;fill:#55606F}
</style>
<rect width="800" height="460" fill="#FBFAF7"/>
<text x="40" y="34" font-family="Georgia,serif" font-size="20" font-weight="700" fill="#14213D">Het eindaudit-sjabloon</text>
<text x="40" y="54" font-family="Georgia,serif" font-size="13" fill="#55606F">Module 8 voegt niets nieuws toe — het zet de zeven modellen naast elkaar op één situatie</text>

<line x1="400" y1="98" x2="400" y2="122" stroke="#55606F" stroke-width="1.2" marker-end="url(#fig8-arrow)"/>

<!-- hub -->
<rect x="240" y="62" width="320" height="36" rx="8" fill="#14213D"/>
<text x="400" y="85" font-family="Arial,sans-serif" font-weight="700" font-size="13" fill="#FBFAF7" text-anchor="middle">JOUW HOOFDSPEL — EINDAUDIT</text>

<!-- 7-column banner -->
<rect x="60" y="126" width="680" height="150" fill="#FFFFFF" stroke="#14213D" stroke-width="1"/>
<!-- column 1 -->
<circle cx="76" cy="146" r="10" fill="#14213D"/><text x="76" y="150" class="fig8-num" text-anchor="middle">1</text>
<text x="65" y="172" class="fig8-tag">Spel</text>
<text x="65" y="188" class="fig8-s">Spelers, zetten,</text>
<text x="65" y="200" class="fig8-s">payoffs, info</text>
<line x1="157" y1="132" x2="157" y2="270" stroke="#E3E0D8" stroke-width="0.8"/>
<!-- column 2 -->
<circle cx="173" cy="146" r="10" fill="#14213D"/><text x="173" y="150" class="fig8-num" text-anchor="middle">2</text>
<text x="163" y="172" class="fig8-tag">Escalatie-</text>
<text x="163" y="184" class="fig8-tag">punt</text>
<text x="163" y="200" class="fig8-s">Straf nr. 2?</text>
<line x1="254" y1="132" x2="254" y2="270" stroke="#E3E0D8" stroke-width="0.8"/>
<!-- column 3 -->
<circle cx="270" cy="146" r="10" fill="#14213D"/><text x="270" y="150" class="fig8-num" text-anchor="middle">3</text>
<text x="260" y="172" class="fig8-tag">Structuur-</text>
<text x="260" y="184" class="fig8-tag">hefboom</text>
<text x="260" y="200" class="fig8-s">Inzet of regel?</text>
<line x1="351" y1="132" x2="351" y2="270" stroke="#E3E0D8" stroke-width="0.8"/>
<!-- column 4 -->
<circle cx="367" cy="146" r="10" fill="#14213D"/><text x="367" y="150" class="fig8-num" text-anchor="middle">4</text>
<text x="357" y="172" class="fig8-tag">Incentive</text>
<text x="357" y="188" class="fig8-s">Wie geeft advies,</text>
<text x="357" y="200" class="fig8-s">wie verdient?</text>
<line x1="448" y1="132" x2="448" y2="270" stroke="#E3E0D8" stroke-width="0.8"/>
<!-- column 5 -->
<circle cx="464" cy="146" r="10" fill="#14213D"/><text x="464" y="150" class="fig8-num" text-anchor="middle">5</text>
<text x="454" y="172" class="fig8-tag">Nominaal/</text>
<text x="454" y="184" class="fig8-tag">reëel</text>
<text x="454" y="200" class="fig8-s">Meetbaar voordeel?</text>
<line x1="545" y1="132" x2="545" y2="270" stroke="#E3E0D8" stroke-width="0.8"/>
<!-- column 6 -->
<circle cx="561" cy="146" r="10" fill="#14213D"/><text x="561" y="150" class="fig8-num" text-anchor="middle">6</text>
<text x="551" y="172" class="fig8-tag">Zet</text>
<text x="551" y="188" class="fig8-s">Positioneren /</text>
<text x="551" y="200" class="fig8-s">herschrijven / weg</text>
<line x1="642" y1="132" x2="642" y2="270" stroke="#E3E0D8" stroke-width="0.8"/>
<!-- column 7 (focal — feeds the decision) -->
<rect x="646" y="132" width="88" height="138" fill="rgba(233,161,59,0.08)"/>
<circle cx="662" cy="146" r="10" fill="#E9A13B"/><text x="662" y="150" class="fig8-num" text-anchor="middle" fill="#14213D">7</text>
<text x="654" y="172" class="fig8-tag">Winbaar/</text>
<text x="654" y="184" class="fig8-tag">leverage</text>
<text x="654" y="200" class="fig8-s">De moeite waard?</text>

<text x="76" y="250" font-family="Georgia,serif" font-style="italic" font-size="10.5" fill="#7C8794">Elke kolom levert één rij van het sjabloon; module 1 geeft de startrij.</text>

<line x1="240" y1="290" x2="240" y2="312" stroke="#55606F" stroke-width="1.2" marker-end="url(#fig8-arrow)"/>
<line x1="560" y1="290" x2="560" y2="312" stroke="#55606F" stroke-width="1.2" marker-end="url(#fig8-arrow)"/>

<!-- final: Besluit + Experiment -->
<rect x="140" y="316" width="200" height="70" rx="8" fill="#FFFFFF" stroke="#14213D" stroke-width="1"/>
<text x="240" y="340" class="fig8-h" text-anchor="middle">Besluit</text>
<text x="240" y="358" class="fig8-s" text-anchor="middle">Blijven / herpositioneren /</text>
<text x="240" y="372" class="fig8-s" text-anchor="middle">herschrijven / exit</text>

<rect x="460" y="316" width="200" height="70" rx="8" fill="rgba(233,161,59,0.08)" stroke="#E9A13B" stroke-width="1.5"/>
<text x="560" y="340" class="fig8-h" text-anchor="middle">Experiment</text>
<text x="560" y="358" class="fig8-s" text-anchor="middle">Eén meetbare actie,</text>
<text x="560" y="372" class="fig8-s" text-anchor="middle">meetpunt over 14 dagen</text>

<line x1="40" y1="410" x2="760" y2="410" stroke="#E3E0D8" stroke-width="0.8"/>
<text x="40" y="430" font-family="Georgia,serif" font-style="italic" font-size="12.5" fill="#55606F">Het besluit is pas onderbouwd als minstens twee van de acht rijen ernaar wijzen.</text>
</svg>
