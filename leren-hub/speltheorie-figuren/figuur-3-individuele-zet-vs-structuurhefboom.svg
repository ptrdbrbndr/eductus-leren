<svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig3-title fig3-desc">
<title id="fig3-title">Individuele zet versus structuurhefboom bij de file</title>
<desc id="fig3-desc">Twee grafieken naast elkaar: vroeger vertrekken verschuift alleen de verkeerspiek naar een eerder tijdstip, terwijl een congestieprijs de piek daadwerkelijk verlaagt en spreidt.</desc>
<style>
.fig3-h{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:14px;fill:#14213D}
.fig3-sub{font-family:Georgia,'Times New Roman',serif;font-size:12px;fill:#55606F}
.fig3-axis{font-family:Arial,Helvetica,sans-serif;font-size:9px;fill:#7C8794}
.fig3-mono{font-family:'Courier New',ui-monospace,monospace;font-size:11px;fill:#14213D}
.fig3-lbl{font-family:Arial,Helvetica,sans-serif;font-weight:600;font-size:9px;letter-spacing:0.6px;fill:#7C8794}
</style>
<rect width="800" height="560" fill="#FBFAF7"/>
<text x="40" y="36" font-family="Georgia,serif" font-size="20" font-weight="700" fill="#14213D">Individuele zet versus structuurhefboom</text>
<text x="40" y="58" font-family="Georgia,serif" font-size="13" fill="#55606F">Wat er met de drukte gebeurt als iedereen verstandig kiest, versus als de regel verandert</text>

<!-- Panel left: individuele zet -->
<rect x="40" y="86" width="340" height="240" rx="8" fill="#FFFFFF" stroke="#14213D" stroke-width="1"/>
<text x="60" y="112" class="fig3-h">Individuele zet</text>
<text x="60" y="130" class="fig3-sub">Vroeger vertrekken om de spits voor te zijn</text>
<line x1="60" y1="290" x2="360" y2="290" stroke="#14213D" stroke-width="1"/>
<text x="60" y="304" class="fig3-axis">7u</text>
<text x="355" y="304" class="fig3-axis" text-anchor="end">10u</text>
<text x="205" y="304" class="fig3-axis" text-anchor="middle">TIJD</text>
<!-- before curve (dashed) -->
<path d="M 60 280 Q 150 150 240 280" fill="none" stroke="#7C8794" stroke-width="1.2" stroke-dasharray="4,3"/>
<!-- after curve (shifted, same height) -->
<path d="M 60 280 Q 130 152 200 280" fill="none" stroke="#14213D" stroke-width="1.6"/>
<circle cx="130" cy="152" r="3.5" fill="#14213D"/>
<rect x="215" y="140" width="130" height="14" rx="2" fill="#FFFFFF"/>
<text x="280" y="151" class="fig3-lbl" text-anchor="middle">PIEK GELIJK, VERSCHOVEN</text>

<!-- Panel right: structuurhefboom (focal) -->
<rect x="420" y="86" width="340" height="240" rx="8" fill="rgba(233,161,59,0.08)" stroke="#E9A13B" stroke-width="1.5"/>
<text x="440" y="112" class="fig3-h">Structuurhefboom</text>
<text x="440" y="130" class="fig3-sub">Congestieprijs op het drukste tijdstip</text>
<line x1="440" y1="290" x2="740" y2="290" stroke="#14213D" stroke-width="1"/>
<text x="440" y="304" class="fig3-axis">7u</text>
<text x="735" y="304" class="fig3-axis" text-anchor="end">10u</text>
<text x="585" y="304" class="fig3-axis" text-anchor="middle">TIJD</text>
<!-- before curve (dashed, same as left) -->
<path d="M 440 280 Q 530 150 620 280" fill="none" stroke="#7C8794" stroke-width="1.2" stroke-dasharray="4,3"/>
<!-- after curve (flattened + lower, spread wide) -->
<path d="M 440 280 Q 585 225 740 280" fill="none" stroke="#E9A13B" stroke-width="2"/>
<rect x="520" y="196" width="130" height="14" rx="2" fill="rgba(233,161,59,0.08)"/>
<text x="585" y="207" class="fig3-lbl" text-anchor="middle" fill="#14213D">PIEK DAALT, SPREIDT</text>

<!-- legend -->
<line x1="60" y1="340" x2="90" y2="340" stroke="#7C8794" stroke-width="1.2" stroke-dasharray="4,3"/>
<text x="96" y="344" class="fig3-axis">zonder ingreep (huidige drukte)</text>
<line x1="300" y1="340" x2="330" y2="340" stroke="#14213D" stroke-width="1.6"/>
<text x="336" y="344" class="fig3-axis">na individuele zet</text>
<line x1="520" y1="340" x2="550" y2="340" stroke="#E9A13B" stroke-width="2"/>
<text x="556" y="344" class="fig3-axis">na structuurhefboom</text>

<!-- comparison table -->
<line x1="40" y1="372" x2="760" y2="372" stroke="#E3E0D8" stroke-width="0.8"/>
<text x="40" y="392" font-family="Arial,sans-serif" font-size="9" font-weight="700" letter-spacing="1px" fill="#7C8794">VERTAALD NAAR RAVI&#8217;S TEAM</text>

<rect x="40" y="404" width="340" height="72" rx="6" fill="#FFFFFF" stroke="#14213D" stroke-width="1"/>
<text x="58" y="426" class="fig3-mono" font-weight="700">Individuele zet</text>
<text x="58" y="446" class="fig3-mono">Sneller reageren dan de groep</text>
<text x="58" y="464" class="fig3-mono" fill="#55606F">→ norm schuift naar 22:00, evenveel werk</text>

<rect x="420" y="404" width="340" height="72" rx="6" fill="rgba(233,161,59,0.08)" stroke="#E9A13B" stroke-width="1.5"/>
<text x="438" y="426" class="fig3-mono" font-weight="700">Structuurhefboom</text>
<text x="438" y="446" class="fig3-mono">Afgesproken reactievenster 9-18u</text>
<text x="438" y="464" class="fig3-mono" fill="#55606F">→ niemand hoeft harder te werken</text>

<line x1="40" y1="496" x2="760" y2="496" stroke="#E3E0D8" stroke-width="0.8"/>
<text x="40" y="516" font-family="Georgia,serif" font-style="italic" font-size="12.5" fill="#55606F">Het verschil zit niet in inzet: bij een structuurhefboom verandert de regel zelf, niet alleen het gedrag van één persoon.</text>
</svg>
