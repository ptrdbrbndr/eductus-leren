<svg viewBox="0 0 800 580" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig4-title fig4-desc">
<title id="fig4-title">De incentive-checklist als beslisboom</title>
<desc id="fig4-desc">Beslisboom die start bij een advies- of aanbodmoment, vraagt wie aan een &#8220;ja&#8221; verdient, en vertakt naar geruststelling of vergelijken vóór je tekent, met twee vervolgvragen aan het eind.</desc>
<defs>
<marker id="fig4-arrow" markerWidth="8" markerHeight="6" refX="4" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#55606F"/>
</marker>
<marker id="fig4-arrow-accent" markerWidth="8" markerHeight="6" refX="4" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#E9A13B"/>
</marker>
</defs>
<style>
.fig4-t{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:13px;fill:#14213D}
.fig4-s{font-family:Georgia,'Times New Roman',serif;font-size:11.5px;fill:#55606F}
.fig4-lbl{font-family:Arial,Helvetica,sans-serif;font-weight:600;font-size:9px;letter-spacing:0.8px;fill:#7C8794}
</style>
<rect width="800" height="580" fill="#FBFAF7"/>
<text x="40" y="36" font-family="Georgia,serif" font-size="20" font-weight="700" fill="#14213D">De incentive-checklist</text>
<text x="40" y="58" font-family="Georgia,serif" font-size="13" fill="#55606F">Wie verdient aan jouw &#8220;ja&#8221;, vóór je tekent</text>

<!-- connectors drawn first -->
<line x1="400" y1="100" x2="400" y2="140" stroke="#55606F" stroke-width="1.2" marker-end="url(#fig4-arrow)"/>

<path d="M 340 204 V 225 H 210 V 246" fill="none" stroke="#55606F" stroke-width="1.2" marker-end="url(#fig4-arrow)"/>
<path d="M 460 204 V 225 H 590 V 246" fill="none" stroke="#E9A13B" stroke-width="1.2" marker-end="url(#fig4-arrow-accent)"/>

<line x1="210" y1="314" x2="210" y2="356" stroke="#55606F" stroke-width="1.2" marker-end="url(#fig4-arrow)"/>
<line x1="590" y1="314" x2="590" y2="356" stroke="#E9A13B" stroke-width="1.2" marker-end="url(#fig4-arrow-accent)"/>

<line x1="210" y1="412" x2="210" y2="450" stroke="#55606F" stroke-width="1.2" marker-end="url(#fig4-arrow)"/>
<line x1="590" y1="412" x2="590" y2="450" stroke="#E9A13B" stroke-width="1.2" marker-end="url(#fig4-arrow-accent)"/>

<!-- N0 start -->
<rect x="300" y="40" width="200" height="56" rx="8" fill="#FFFFFF" stroke="#14213D" stroke-width="1"/>
<text x="400" y="64" class="fig4-t" text-anchor="middle">Advies- of aanbod-</text>
<text x="400" y="82" class="fig4-t" text-anchor="middle">moment</text>

<!-- N1 question -->
<rect x="260" y="140" width="280" height="64" rx="8" fill="rgba(20,33,61,0.05)" stroke="#14213D" stroke-width="1"/>
<text x="400" y="166" class="fig4-t" text-anchor="middle">Wie verdient hier wat,</text>
<text x="400" y="184" class="fig4-t" text-anchor="middle">als ik &#8220;ja&#8221; zeg?</text>

<!-- N2 left branch -->
<rect x="80" y="250" width="260" height="64" rx="8" fill="#FFFFFF" stroke="#14213D" stroke-width="1"/>
<text x="210" y="274" class="fig4-t" text-anchor="middle">Gekoppeld aan mijn</text>
<text x="210" y="292" class="fig4-t" text-anchor="middle">uitkomst</text>
<rect x="88" y="298" width="60" height="12" rx="2" fill="transparent" stroke="rgba(20,33,61,0.4)" stroke-width="0.8"/>
<text x="118" y="307" font-family="'Courier New',monospace" font-size="7" fill="#55606F" text-anchor="middle">bv. UURBASIS</text>

<!-- N3 right branch (focal) -->
<rect x="460" y="250" width="260" height="64" rx="8" fill="rgba(233,161,59,0.08)" stroke="#E9A13B" stroke-width="1.5"/>
<text x="590" y="274" class="fig4-t" text-anchor="middle">Gekoppeld aan alleen</text>
<text x="590" y="292" class="fig4-t" text-anchor="middle">mijn handtekening</text>
<rect x="468" y="298" width="70" height="12" rx="2" fill="transparent" stroke="rgba(233,161,59,0.5)" stroke-width="0.8"/>
<text x="503" y="307" font-family="'Courier New',monospace" font-size="7" fill="#9a6418" text-anchor="middle">bv. COMMISSIE</text>

<!-- N4 -->
<rect x="80" y="360" width="260" height="52" rx="8" fill="#FFFFFF" stroke="#14213D" stroke-width="1"/>
<text x="210" y="381" class="fig4-s" text-anchor="middle">Vaak geruststellend —</text>
<text x="210" y="398" class="fig4-s" text-anchor="middle">check toch de andere twee vragen</text>

<!-- N5 focal -->
<rect x="460" y="360" width="260" height="52" rx="8" fill="rgba(233,161,59,0.08)" stroke="#E9A13B" stroke-width="1.5"/>
<text x="590" y="381" class="fig4-s" text-anchor="middle">Vergelijk vóór je tekent:</text>
<text x="590" y="398" class="fig4-s" text-anchor="middle">kosten, voorwaarden, alternatief</text>

<!-- merged checklist box -->
<rect x="140" y="450" width="520" height="90" rx="8" fill="#FFFFFF" stroke="#14213D" stroke-width="1"/>
<text x="400" y="472" class="fig4-lbl" text-anchor="middle">TWEE VERVOLGVRAGEN, ALTIJD</text>
<text x="164" y="494" class="fig4-s">1. Wat zou deze partij aanraden als hij zelf niets verdiende?</text>
<text x="164" y="516" class="fig4-s">2. Verandert het advies als ik de vraag anders stel?</text>
<text x="164" y="534" font-family="Georgia,serif" font-style="italic" font-size="11" fill="#55606F">Incentive-asymmetrie is een reden om te verifiëren, geen bewijs van een fout advies.</text>

<line x1="40" y1="560" x2="760" y2="560" stroke="#E3E0D8" stroke-width="0.8"/>
</svg>
