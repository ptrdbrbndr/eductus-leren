<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig5-title fig5-desc">
<title id="fig5-title">Nominaal versus reëel bij Nadia's salarisverhoging</title>
<desc id="fig5-desc">Gegroepeerde staafgrafiek van Nadia's nominale salaris, vaste lasten en reële ruimte in jaar 1 en jaar 2: het nominale salaris stijgt 5%, maar de reële ruimte nauwelijks.</desc>
<style>
.fig5-t{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:12px;fill:#14213D}
.fig5-v{font-family:'Courier New',ui-monospace,monospace;font-size:10.5px;fill:#14213D}
.fig5-lbl{font-family:Arial,Helvetica,sans-serif;font-weight:600;font-size:9px;letter-spacing:0.5px;fill:#7C8794}
</style>
<rect width="800" height="480" fill="#FBFAF7"/>
<text x="40" y="36" font-family="Georgia,serif" font-size="20" font-weight="700" fill="#14213D">Nominaal versus reëel</text>
<text x="40" y="58" font-family="Georgia,serif" font-size="13" fill="#55606F">Nadia's cijfers: +5% nominaal salaris, +0,4% reële ruimte</text>

<line x1="40" y1="380" x2="760" y2="380" stroke="#14213D" stroke-width="1"/>

<!-- Group 1: Nominaal salaris -->
<rect x="152" y="128" width="56" height="252" fill="#14213D"/>
<text x="180" y="120" class="fig5-v" text-anchor="middle">48.000</text>
<rect x="220" y="116" width="56" height="264" fill="#55606F"/>
<text x="248" y="108" class="fig5-v" text-anchor="middle">50.400</text>
<text x="214" y="404" class="fig5-t" text-anchor="middle">Nominaal salaris</text>
<text x="214" y="420" class="fig5-lbl" text-anchor="middle">+5%</text>

<!-- Group 2: Vaste lasten -->
<rect x="372" y="264" width="56" height="116" fill="#14213D"/>
<text x="400" y="256" class="fig5-v" text-anchor="middle">22.000</text>
<rect x="440" y="260" width="56" height="120" fill="#55606F"/>
<text x="468" y="252" class="fig5-v" text-anchor="middle">23.012</text>
<text x="434" y="404" class="fig5-t" text-anchor="middle">Vaste lasten</text>
<text x="434" y="420" class="fig5-lbl" text-anchor="middle">+4,6%</text>

<!-- Group 3: Reële ruimte (focal) -->
<rect x="592" y="244" width="56" height="136" fill="rgba(233,161,59,0.10)" stroke="#14213D" stroke-width="1"/>
<text x="620" y="236" class="fig5-v" text-anchor="middle">26.000</text>
<rect x="660" y="236" width="56" height="144" fill="#E9A13B" stroke="#E9A13B" stroke-width="1"/>
<text x="688" y="228" class="fig5-v" text-anchor="middle" font-weight="700">27.388</text>
<text x="654" y="404" class="fig5-t" text-anchor="middle" font-weight="700">Reële ruimte</text>
<text x="654" y="420" class="fig5-lbl" text-anchor="middle" fill="#9a6418" font-weight="700">+0,4% van salaris</text>

<!-- legend -->
<rect x="360" y="446" width="14" height="10" fill="#14213D"/>
<text x="380" y="455" class="fig5-lbl">JAAR 1</text>
<rect x="450" y="446" width="14" height="10" fill="#55606F"/>
<text x="470" y="455" class="fig5-lbl">JAAR 2</text>
</svg>
