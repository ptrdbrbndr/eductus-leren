<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig2-title fig2-desc">
<title id="fig2-title">Escalatiediagram van de dollarveiling-case: Youssef's biedrondes</title>
<desc id="fig2-desc">Vier biedrondes van 440.000 tot 478.000 euro, met per ronde het groeiende verlies dat optreedt als op dat moment gestopt wordt met bieden.</desc>
<defs>
<marker id="fig2-arrow" markerWidth="8" markerHeight="6" refX="4" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#2563A8"/>
</marker>
</defs>
<style>
.fig2-round{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:12px;fill:#14213D}
.fig2-bod{font-family:'Courier New',ui-monospace,monospace;font-size:12px;fill:#2563A8;font-weight:700}
.fig2-loss{font-family:Georgia,'Times New Roman',serif;font-size:11.5px;fill:#55606F}
.fig2-losslabel{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:10px;fill:#14213D}
</style>
<rect width="800" height="500" fill="#FBFAF7"/>
<text x="40" y="36" font-family="Georgia,serif" font-size="20" font-weight="700" fill="#14213D">Het escalatiepunt</text>
<text x="40" y="58" font-family="Georgia,serif" font-size="13" fill="#55606F">Vier biedrondes van Youssef — het bod stijgt, en het verlies bij stoppen stijgt sneller</text>

<!-- bod line (top track) -->
<line x1="160" y1="150" x2="220" y2="125" stroke="#2563A8" stroke-width="1.5" marker-end="url(#fig2-arrow)"/>
<line x1="320" y1="125" x2="380" y2="103" stroke="#2563A8" stroke-width="1.5" marker-end="url(#fig2-arrow)"/>
<line x1="480" y1="103" x2="540" y2="80" stroke="#2563A8" stroke-width="1.5" marker-end="url(#fig2-arrow)"/>

<circle cx="160" cy="150" r="5" fill="#2563A8"/>
<text x="160" y="140" class="fig2-bod" text-anchor="middle">440.000</text>
<circle cx="320" cy="125" r="5" fill="#2563A8"/>
<text x="320" y="115" class="fig2-bod" text-anchor="middle">455.000</text>
<circle cx="480" cy="103" r="5" fill="#2563A8"/>
<text x="480" y="93" class="fig2-bod" text-anchor="middle">465.000</text>
<circle cx="640" cy="80" r="5" fill="#2563A8"/>
<text x="640" y="70" class="fig2-bod" text-anchor="middle">478.000 (winnend)</text>
<text x="720" y="128" font-family="Arial,sans-serif" font-size="9" fill="#2563A8" text-anchor="end">BOD IN EURO</text>

<!-- loss bars (growing) -->
<rect x="120" y="360" width="80" height="60" rx="4" fill="rgba(233,161,59,0.08)" stroke="#E3E0D8" stroke-width="1"/>
<rect x="280" y="300" width="80" height="120" rx="4" fill="rgba(233,161,59,0.08)" stroke="#E3E0D8" stroke-width="1"/>
<rect x="440" y="240" width="80" height="180" rx="4" fill="rgba(233,161,59,0.14)" stroke="#E3E0D8" stroke-width="1"/>
<rect x="600" y="180" width="80" height="240" rx="4" fill="rgba(233,161,59,0.08)" stroke="#E9A13B" stroke-width="1.5"/>

<text x="160" y="440" class="fig2-round" text-anchor="middle">RONDE 1</text>
<text x="320" y="440" class="fig2-round" text-anchor="middle">RONDE 2</text>
<text x="480" y="440" class="fig2-round" text-anchor="middle">RONDE 3</text>
<text x="640" y="440" class="fig2-round" text-anchor="middle">RONDE 4</text>

<text x="160" y="378" class="fig2-losslabel" text-anchor="middle">Niets</text>
<text x="320" y="318" class="fig2-losslabel" text-anchor="middle">2 weken +</text>
<text x="320" y="332" class="fig2-loss" text-anchor="middle">keuring</text>
<text x="480" y="258" class="fig2-losslabel" text-anchor="middle">Tijd + keuring +</text>
<text x="480" y="272" class="fig2-loss" text-anchor="middle">emotie</text>
<text x="640" y="198" class="fig2-losslabel" text-anchor="middle" fill="#14213D">Alles hierboven,</text>
<text x="640" y="212" class="fig2-loss" text-anchor="middle">zonder huis</text>

<line x1="40" y1="420" x2="760" y2="420" stroke="#14213D" stroke-width="1"/>
<text x="40" y="464" font-family="Arial,sans-serif" font-size="9" font-weight="600" letter-spacing="1px" fill="#7C8794">VERLIES BIJ STOPPEN — GROEIT ELKE RONDE</text>
<line x1="40" y1="478" x2="760" y2="478" stroke="#E3E0D8" stroke-width="0.8"/>
<text x="40" y="492" font-family="Georgia,serif" font-style="italic" font-size="12.5" fill="#55606F">Bij elke ronde verschuift de vraag van &#8220;is dit huis dit bod waard&#8221; naar &#8220;is doorgaan minder erg dan alles tot nu toe verliezen&#8221;.</text>
</svg>
