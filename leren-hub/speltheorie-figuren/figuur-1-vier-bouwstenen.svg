<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig1-title fig1-desc">
<title id="fig1-title">De vier bouwstenen van een spel, toegepast op Wendy's beoordelingsgesprek</title>
<desc id="fig1-desc">Vier gestapelde stappen — spelers, zetten, payoffs, informatie — elk met de invulling voor Wendy en haar werkgever; de payoffs-stap is gemarkeerd als de plek waar de wringing zit.</desc>
<defs>
<marker id="fig1-arrow" markerWidth="8" markerHeight="6" refX="4" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#55606F"/>
</marker>
</defs>
<style>
.fig1-name{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:15px;fill:#14213D}
.fig1-desc{font-family:Georgia,'Times New Roman',serif;font-size:13px;fill:#55606F}
.fig1-mono{font-family:'Courier New',ui-monospace,monospace;font-size:11.5px;fill:#14213D}
.fig1-num{font-family:Arial,Helvetica,sans-serif;font-weight:700;font-size:12px;fill:#FBFAF7}
.fig1-eyebrow{font-family:Arial,Helvetica,sans-serif;font-weight:600;font-size:9px;letter-spacing:1.2px;fill:#7C8794}
</style>
<rect width="800" height="500" fill="#FBFAF7"/>
<text x="40" y="36" font-family="Georgia,serif" font-size="20" font-weight="700" fill="#14213D">Het spelbord in vier vragen</text>
<text x="40" y="58" font-family="Georgia,serif" font-size="13" fill="#55606F">Wendy's beoordelingsgesprek, ingevuld per bouwsteen</text>

<!-- connecting arrows -->
<line x1="76" y1="150" x2="76" y2="186" stroke="#55606F" stroke-width="1.2" marker-end="url(#fig1-arrow)"/>
<line x1="76" y1="254" x2="76" y2="290" stroke="#55606F" stroke-width="1.2" marker-end="url(#fig1-arrow)"/>
<line x1="76" y1="358" x2="76" y2="394" stroke="#55606F" stroke-width="1.2" marker-end="url(#fig1-arrow)"/>

<!-- Row 1: Spelers -->
<rect x="40" y="86" width="720" height="64" rx="8" fill="#FFFFFF" stroke="#14213D" stroke-width="1"/>
<circle cx="76" cy="118" r="16" fill="#14213D"/>
<text x="76" y="122" class="fig1-num" text-anchor="middle">01</text>
<text x="108" y="112" class="fig1-name">Spelers</text>
<text x="108" y="130" class="fig1-desc">Wie heeft invloed op de uitkomst?</text>
<line x1="428" y1="98" x2="428" y2="138" stroke="#E3E0D8" stroke-width="1"/>
<text x="448" y="112" class="fig1-eyebrow">WENDY&#8217;S SITUATIE</text>
<text x="448" y="130" class="fig1-mono">Wendy · haar werkgever (manager)</text>

<!-- Row 2: Zetten -->
<rect x="40" y="190" width="720" height="64" rx="8" fill="#FFFFFF" stroke="#14213D" stroke-width="1"/>
<circle cx="76" cy="222" r="16" fill="#14213D"/>
<text x="76" y="226" class="fig1-num" text-anchor="middle">02</text>
<text x="108" y="216" class="fig1-name">Zetten</text>
<text x="108" y="234" class="fig1-desc">Wat kan elke speler kiezen?</text>
<line x1="428" y1="202" x2="428" y2="242" stroke="#E3E0D8" stroke-width="1"/>
<text x="448" y="212" class="fig1-eyebrow">WENDY&#8217;S SITUATIE</text>
<text x="448" y="230" class="fig1-mono">Wendy: overtreffen / precies halen</text>
<text x="448" y="245" class="fig1-mono">Werkgever: verhogen / gelijk houden</text>

<!-- Row 3: Payoffs (focal) -->
<rect x="40" y="294" width="720" height="64" rx="8" fill="rgba(233,161,59,0.08)" stroke="#E9A13B" stroke-width="1.5"/>
<circle cx="76" cy="326" r="16" fill="#E9A13B"/>
<text x="76" y="330" class="fig1-num" text-anchor="middle" fill="#14213D">03</text>
<text x="108" y="320" class="fig1-name">Payoffs — hier zit de wringing</text>
<text x="108" y="338" class="fig1-desc">Wat levert elke combinatie op, voor wie?</text>
<line x1="428" y1="306" x2="428" y2="346" stroke="rgba(20,33,61,0.25)" stroke-width="1"/>
<text x="448" y="316" class="fig1-eyebrow">WENDY&#8217;S SITUATIE</text>
<text x="448" y="334" class="fig1-mono">Overtreffen → bonus nu, hoger target later</text>
<text x="448" y="349" class="fig1-mono">Precies halen → geen bonus, gelijk target</text>

<!-- Row 4: Informatie -->
<rect x="40" y="398" width="720" height="64" rx="8" fill="#FFFFFF" stroke="#14213D" stroke-width="1"/>
<circle cx="76" cy="430" r="16" fill="#14213D"/>
<text x="76" y="434" class="fig1-num" text-anchor="middle">04</text>
<text x="108" y="424" class="fig1-name">Informatie</text>
<text x="108" y="442" class="fig1-desc">Wie weet wat, op het moment van de zet?</text>
<line x1="428" y1="410" x2="428" y2="450" stroke="#E3E0D8" stroke-width="1"/>
<text x="448" y="420" class="fig1-eyebrow">WENDY&#8217;S SITUATIE</text>
<text x="448" y="438" class="fig1-mono">Werkgever stelt target pas ná afloop vast</text>

<line x1="40" y1="480" x2="760" y2="480" stroke="#E3E0D8" stroke-width="0.8"/>
<text x="40" y="494" font-family="Georgia,serif" font-style="italic" font-size="12.5" fill="#55606F">Niet de spelers, niet de informatie — de payoffs belonen overtreffen met een hoger target, niet met evenredig meer.</text>
</svg>
