<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'DM Sans', Arial, sans-serif" width="960" height="640" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:19px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.10em; }
      .arrow { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-muted { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arrm); }
      .arrow-amber { stroke:#E9A13B; stroke-width:2; fill:none; marker-end:url(#arra); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arrm" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
  </defs>
<rect width="960" height="640" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 10 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">De dossierstructuur</text>
<text x="40" y="96" class="sub">Zeven observaties, elk met dezelfde driedeling, plus een korte inleiding en afsluiting die de rode draad</text>
<text x="40" y="114" class="sub">benoemt.</text>
<rect x="50" y="240" width="151.2" height="100" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/><text x="125.6" y="295" text-anchor="middle" class="label">Inleiding</text><line x1="201.2" y1="290" x2="227.2" y2="290" class="arrow"/><rect x="227.2" y="240" width="151.2" height="100" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/><text x="302.79999999999995" y="295" text-anchor="middle" class="label">O1–O3</text><line x1="378.4" y1="290" x2="404.4" y2="290" class="arrow"/><rect x="404.4" y="240" width="151.2" height="100" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/><text x="480" y="295" text-anchor="middle" class="label">O4–O5</text><line x1="555.5999999999999" y1="290" x2="581.5999999999999" y2="290" class="arrow"/><rect x="581.5999999999999" y="240" width="151.2" height="100" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/><text x="657.1999999999999" y="295" text-anchor="middle" class="label">O6–O7</text><line x1="732.8" y1="290" x2="758.8" y2="290" class="arrow"/><rect x="758.8" y="240" width="151.2" height="100" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/><text x="834.4" y="287" text-anchor="middle" class="label">Afsluiting (rode</text>
<text x="834.4" y="303" text-anchor="middle" class="label">draad)</text>
<rect x="40" y="560" width="880" height="60" rx="8" fill="#14213D"/>
      <text x="480" y="586" text-anchor="middle" class="label-light">Dezelfde driedeling per observatie maakt het dossier voor de beoordelaars herkenbaar.</text>
      
</svg>