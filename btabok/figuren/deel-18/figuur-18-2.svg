<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'DM Sans', Arial, sans-serif" width="960" height="640" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:19px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.10em; }
      .arrow { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-muted { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arrm); }
      .arrow-amber { stroke:#E9A13B; stroke-width:2; fill:none; marker-end:url(#arra); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arrm" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
  </defs>
<rect width="960" height="640" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 18 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Drie architecten, drie 'technische views'</text>
<text x="40" y="96" class="sub">Drie verschillende invullingen van 'de technische view' naast elkaar — geen twee zien er hetzelfde uit.</text>
<rect x="60" y="160" width="264" height="260" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/><rect x="60" y="160" width="264" height="44" rx="8" fill="#2563A8"/><rect x="60" y="182" width="264" height="22" fill="#2563A8"/><text x="192" y="188" text-anchor="middle" class="label-light">Architect A</text><text x="192" y="236" text-anchor="middle" class="sub">Eigen sjabloon, eigen</text>
<text x="192" y="251" text-anchor="middle" class="sub">niveau van detail</text><rect x="348" y="160" width="264" height="260" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/><rect x="348" y="160" width="264" height="44" rx="8" fill="#2563A8"/><rect x="348" y="182" width="264" height="22" fill="#2563A8"/><text x="480" y="188" text-anchor="middle" class="label-light">Architect B</text><text x="480" y="236" text-anchor="middle" class="sub">Ander sjabloon, andere</text>
<text x="480" y="251" text-anchor="middle" class="sub">focus</text><rect x="636" y="160" width="264" height="260" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/><rect x="636" y="160" width="264" height="44" rx="8" fill="#2563A8"/><rect x="636" y="182" width="264" height="22" fill="#2563A8"/><text x="768" y="188" text-anchor="middle" class="label-light">Architect C</text><text x="768" y="236" text-anchor="middle" class="sub">Weer een andere invulling</text>
<rect x="40" y="560" width="880" height="60" rx="8" fill="#14213D"/>
      <text x="480" y="586" text-anchor="middle" class="label-light">Zonder standaard levert 'de technische view' drie keer iets anders op.</text>
      
</svg>