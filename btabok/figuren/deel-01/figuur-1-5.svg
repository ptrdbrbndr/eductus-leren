<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'DM Sans', Arial, sans-serif" width="960" height="640" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:19px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.10em; }
      .arrow { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-muted { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arrm); }
      .arrow-amber { stroke:#E9A13B; stroke-width:2; fill:none; marker-end:url(#arra); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arrm" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
  </defs>
<rect width="960" height="640" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 1 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">De CITA-trap</text>
<text x="40" y="96" class="sub">Per trede de toetsvorm en de ervaringsdrempel: CITA-F, CITA-A, CITA-S, CITA-P.</text>
<line x1="80" y1="530" x2="880" y2="530" stroke="#DFDCD3" stroke-width="2"/><rect x="90" y="460" width="146" height="60" rx="4" fill="#CBDCEF" stroke="#2563A8" stroke-width="1.5"/><text x="163" y="484" text-anchor="middle" class="label">CITA-F —</text>
<text x="163" y="498" text-anchor="middle" class="label">kennisexamen</text><rect x="246" y="400" width="146" height="120" rx="4" fill="#CBDCEF" stroke="#2563A8" stroke-width="1.5"/><text x="319" y="424" text-anchor="middle" class="label">CITA-A —</text>
<text x="319" y="438" text-anchor="middle" class="label">cursus +</text>
<text x="319" y="452" text-anchor="middle" class="label">scenario-examen</text>
<text x="319" y="466" text-anchor="middle" class="label">(3-5 jr)</text><rect x="402" y="340" width="146" height="180" rx="4" fill="#CBDCEF" stroke="#2563A8" stroke-width="1.5"/><text x="475" y="364" text-anchor="middle" class="label">CITA-S —</text>
<text x="475" y="378" text-anchor="middle" class="label">boardgesprek</text>
<text x="475" y="392" text-anchor="middle" class="label">1u + dossier</text>
<text x="475" y="406" text-anchor="middle" class="label">(5+ jr)</text><rect x="558" y="280" width="146" height="240" rx="4" fill="#CBDCEF" stroke="#2563A8" stroke-width="1.5"/><text x="631" y="304" text-anchor="middle" class="label">CITA-P —</text>
<text x="631" y="318" text-anchor="middle" class="label">boardinterview</text>
<text x="631" y="332" text-anchor="middle" class="label">+ dossier</text>
<text x="631" y="346" text-anchor="middle" class="label">(8-10 jr)</text><rect x="714" y="220" width="146" height="300" rx="4" fill="#E9A13B" stroke="#2563A8" stroke-width="1.5"/><text x="787" y="244" text-anchor="middle" class="label">CITA-D —</text>
<text x="787" y="258" text-anchor="middle" class="label">hoogste</text>
<text x="787" y="272" text-anchor="middle" class="label">boardniveau</text>
<rect x="40" y="560" width="880" height="60" rx="8" fill="#14213D"/>
      <text x="480" y="586" text-anchor="middle" class="label-light">Elke trede vraagt niet alleen meer kennis, maar een ander soort bewijs.</text>
      
</svg>