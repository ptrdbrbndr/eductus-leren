<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'DM Sans', Arial, sans-serif" width="960" height="640" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:19px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.10em; }
      .arrow { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-muted { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arrm); }
      .arrow-amber { stroke:#E9A13B; stroke-width:2; fill:none; marker-end:url(#arra); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arrm" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
  </defs>
<rect width="960" height="640" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 7 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Het besluitenlogboek ingevuld</text>
<text x="40" y="96" class="sub">Vijf velden, ingevuld voor het koppelvlak-besluit dat drie jaar geleden spoorloos verdween.</text>
<rect x="210" y="175" width="690" height="34" rx="4" fill="#14213D" stroke="#14213D" stroke-width="1.5"/><text x="555" y="196" text-anchor="middle" class="label-light">Koppelvlak</text>
<text x="555" y="208" text-anchor="middle" class="label-light">(gereconstrueerd)</text><rect x="60" y="209" width="150" height="48" rx="4" fill="#F4F2EC" stroke="#DFDCD3" stroke-width="1"/><text x="135" y="237" text-anchor="middle" class="label">Context</text><rect x="210" y="209" width="690" height="48" rx="4" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/><text x="555" y="237" text-anchor="middle" class="sub">Twee systemen</text>
<text x="555" y="249" text-anchor="middle" class="sub">moesten</text>
<text x="555" y="261" text-anchor="middle" class="sub">razendsnel</text>
<text x="555" y="273" text-anchor="middle" class="sub">gekoppeld</text>
<text x="555" y="285" text-anchor="middle" class="sub">worden vóór</text>
<text x="555" y="297" text-anchor="middle" class="sub">een deadline</text><rect x="60" y="257" width="150" height="48" rx="4" fill="#F4F2EC" stroke="#DFDCD3" stroke-width="1"/><text x="135" y="285" text-anchor="middle" class="label">Alternatieven</text><rect x="210" y="257" width="690" height="48" rx="4" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/><text x="555" y="285" text-anchor="middle" class="sub">(1)</text>
<text x="555" y="297" text-anchor="middle" class="sub">puntsgewijs</text>
<text x="555" y="309" text-anchor="middle" class="sub">(2) tussenlaag</text>
<text x="555" y="321" text-anchor="middle" class="sub">(3) uitstel</text>
<text x="555" y="333" text-anchor="middle" class="sub">tot na de</text>
<text x="555" y="345" text-anchor="middle" class="sub">deadline</text><rect x="60" y="305" width="150" height="48" rx="4" fill="#F4F2EC" stroke="#DFDCD3" stroke-width="1"/><text x="135" y="333" text-anchor="middle" class="label">Besluit</text><rect x="210" y="305" width="690" height="48" rx="4" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/><text x="555" y="333" text-anchor="middle" class="sub">Puntsgewijze</text>
<text x="555" y="345" text-anchor="middle" class="sub">integratie,</text>
<text x="555" y="357" text-anchor="middle" class="sub">met voornemen</text>
<text x="555" y="369" text-anchor="middle" class="sub">dit later te</text>
<text x="555" y="381" text-anchor="middle" class="sub">vervangen</text><rect x="60" y="353" width="150" height="48" rx="4" fill="#F4F2EC" stroke="#DFDCD3" stroke-width="1"/><text x="135" y="381" text-anchor="middle" class="label">Motivering</text><rect x="210" y="353" width="690" height="48" rx="4" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/><text x="555" y="381" text-anchor="middle" class="sub">Tijdsdruk; de</text>
<text x="555" y="393" text-anchor="middle" class="sub">tussenlaag zou</text>
<text x="555" y="405" text-anchor="middle" class="sub">de deadline</text>
<text x="555" y="417" text-anchor="middle" class="sub">niet gehaald</text>
<text x="555" y="429" text-anchor="middle" class="sub">hebben</text><rect x="60" y="401" width="150" height="48" rx="4" fill="#F4F2EC" stroke="#DFDCD3" stroke-width="1"/><text x="135" y="429" text-anchor="middle" class="label">Heroverwegingsmoment</text><rect x="210" y="401" width="690" height="48" rx="4" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/><text x="555" y="429" text-anchor="middle" class="sub">Zodra het</text>
<text x="555" y="441" text-anchor="middle" class="sub">aantal</text>
<text x="555" y="453" text-anchor="middle" class="sub">koppelvlakken</text>
<text x="555" y="465" text-anchor="middle" class="sub">met dit</text>
<text x="555" y="477" text-anchor="middle" class="sub">patroon een</text>
<text x="555" y="489" text-anchor="middle" class="sub">drempel</text>
<text x="555" y="501" text-anchor="middle" class="sub">overschrijdt</text>
<rect x="40" y="560" width="880" height="60" rx="8" fill="#14213D"/>
      <text x="480" y="586" text-anchor="middle" class="label-light">Het laatste veld — het heroverwegingsmoment — is precies wat dit besluit miste.</text>
      
</svg>