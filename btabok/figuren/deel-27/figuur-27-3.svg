<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'DM Sans', Arial, sans-serif" width="960" height="640" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:19px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.10em; }
      .arrow { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-muted { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arrm); }
      .arrow-amber { stroke:#E9A13B; stroke-width:2; fill:none; marker-end:url(#arra); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arrm" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
  </defs>
<rect width="960" height="640" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 27 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Checklistvraag per roadmapitem</text>
<text x="40" y="96" class="sub">Toegepast op elk roadmapitem, met een simpele ja/nee-uitkomst die de afhankelijkheidspijlen oplevert.</text>
<rect x="130" y="185" width="28" height="28" rx="5" fill="#FFFFFF" stroke="#2563A8" stroke-width="2"/><path d="M135,200 L142,207 L153,191" stroke="#2563A8" stroke-width="2.5" fill="none"/><text x="180" y="205" text-anchor="start" class="label">Raakt dit item een andere werkstroom?</text><rect x="810" y="185" width="60" height="28" rx="14" fill="#DDEFE0"/><text x="840" y="204" text-anchor="middle" class="sub">ja</text><rect x="130" y="237" width="28" height="28" rx="5" fill="#FFFFFF" stroke="#2563A8" stroke-width="2"/><path d="M135,252 L142,259 L153,243" stroke="#2563A8" stroke-width="2.5" fill="none"/><text x="180" y="257" text-anchor="start" class="label">Is de volgorde vastgelegd?</text><rect x="810" y="237" width="60" height="28" rx="14" fill="#FBE4E4"/><text x="840" y="256" text-anchor="middle" class="sub">nee</text><rect x="130" y="289" width="28" height="28" rx="5" fill="#FFFFFF" stroke="#2563A8" stroke-width="2"/><path d="M135,304 L142,311 L153,295" stroke="#2563A8" stroke-width="2.5" fill="none"/><text x="180" y="309" text-anchor="start" class="label">Is de eigenaar op de hoogte?</text><rect x="810" y="289" width="60" height="28" rx="14" fill="#DDEFE0"/><text x="840" y="308" text-anchor="middle" class="sub">ja</text>
<rect x="40" y="560" width="880" height="60" rx="8" fill="#14213D"/>
      <text x="480" y="586" text-anchor="middle" class="label-light">Drie simpele ja/nee-vragen leveren de afhankelijkheidspijlen op de portefeuillekaart op.</text>
      
</svg>