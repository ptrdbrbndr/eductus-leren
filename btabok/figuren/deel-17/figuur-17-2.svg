<rect width="960" height="640" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 17 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Het gedeelde besluitenlogboek, doorzoekbaar</text>
<text x="40" y="96" class="sub">Als tabel, doorzoekbaar op trefwoord, met de vijf velden uit deel 7 ongewijzigd maar nu met een extra kolom</text>
<text x="40" y="114" class="sub">'auteur'.</text>
