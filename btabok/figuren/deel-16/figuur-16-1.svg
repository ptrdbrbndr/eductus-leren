<text x="40" y="64" class="title">Vijfendertig ongesorteerde punten</text>
<text x="40" y="96" class="sub">Een lange, ongesorteerde lijst van architectuurpunten met wisselende oorsprong — incidenten, teamverzoeken,</text>
<text x="40" y="114" class="sub">de legacytriage van deel 9.</text>
