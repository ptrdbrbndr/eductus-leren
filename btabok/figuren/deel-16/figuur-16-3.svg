<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'DM Sans', Arial, sans-serif" width="960" height="640" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:19px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.10em; }
      .arrow { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-muted { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arrm); }
      .arrow-amber { stroke:#E9A13B; stroke-width:2; fill:none; marker-end:url(#arra); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arrm" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
  </defs>
<rect width="960" height="640" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 16 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Vijfendertig punten naar de vier investeringstypen</text>
<text x="40" y="96" class="sub">De vijfendertig punten hergroepeerd naar de vier investeringstypen uit deel 3 — renderend, beschermend,</text>
<text x="40" y="114" class="sub">verplicht, optiescheppend.</text>
<text x="204" y="210" text-anchor="end" class="label">Renderend</text><rect x="220" y="190" width="408.57142857142856" height="26" rx="5" fill="#2563A8"/><text x="638.5714285714286" y="209" text-anchor="start" class="sub">22 — grootste deel, kortste terugverdientijd eerst</text><text x="204" y="256" text-anchor="end" class="label">Beschermend</text><rect x="220" y="236" width="148.57142857142856" height="26" rx="5" fill="#2563A8"/><text x="378.57142857142856" y="255" text-anchor="start" class="sub">8 — vast budgetdeel, ook zonder incident</text><text x="204" y="302" text-anchor="end" class="label">Verplicht</text><rect x="220" y="282" width="55.714285714285715" height="26" rx="5" fill="#2563A8"/><text x="285.7142857142857" y="301" text-anchor="start" class="sub">3 — eerst, geen discussie over of</text><text x="204" y="348" text-anchor="end" class="label">Optiescheppend</text><rect x="220" y="328" width="37.14285714285714" height="26" rx="5" fill="#2563A8"/><text x="267.1428571428571" y="347" text-anchor="start" class="sub">2 — klein, bewust gereserveerd</text>
<rect x="40" y="560" width="880" height="60" rx="8" fill="#14213D"/>
      <text x="480" y="586" text-anchor="middle" class="label-light">Zonder deze indeling was het budget bijna volledig naar renderend gegaan — en bleven de drie verplichte punten buiten beeld.</text>
      
</svg>