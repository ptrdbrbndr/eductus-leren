<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'DM Sans', Arial, sans-serif" width="960" height="640" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:19px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.10em; }
      .arrow { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-muted { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arrm); }
      .arrow-amber { stroke:#E9A13B; stroke-width:2; fill:none; marker-end:url(#arra); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arrm" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
  </defs>
<rect width="960" height="640" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 22 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Een voorbeeldscenario voor het Solution-spoor</text>
<text x="40" y="96" class="sub">Nieuw team sluit over drie maanden aan met een eigen dienst op twee bestaande systemen, zonder bestaand</text>
<text x="40" y="114" class="sub">koppelvlakpatroon — de vier verwachte denkstappen.</text>
<rect x="50" y="240" width="195.5" height="100" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/><text x="147.75" y="287" text-anchor="middle" class="label">Patroon zoeken in</text>
<text x="147.75" y="303" text-anchor="middle" class="label">besluitenlogboek (d.17)</text><line x1="245.5" y1="290" x2="271.5" y2="290" class="arrow"/><rect x="271.5" y="240" width="195.5" height="100" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/><text x="369.25" y="287" text-anchor="middle" class="label">Scope- en contextdiagram</text>
<text x="369.25" y="303" text-anchor="middle" class="label">(d.6)</text><line x1="467" y1="290" x2="493" y2="290" class="arrow"/><rect x="493" y="240" width="195.5" height="100" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/><text x="590.75" y="287" text-anchor="middle" class="label">Stakeholderkaart actueel?</text>
<text x="590.75" y="303" text-anchor="middle" class="label">(d.4, d.17)</text><line x1="688.5" y1="290" x2="714.5" y2="290" class="arrow"/><rect x="714.5" y="240" width="195.5" height="100" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/><text x="812.25" y="287" text-anchor="middle" class="label">Binnen of buiten kaders?</text>
<text x="812.25" y="303" text-anchor="middle" class="label">(d.19)</text>
<rect x="40" y="560" width="880" height="60" rx="8" fill="#14213D"/>
      <text x="480" y="586" text-anchor="middle" class="label-light">Niet het antwoord telt, maar de zichtbare denkstappen ernaartoe, in een zinnige volgorde.</text>
      
</svg>