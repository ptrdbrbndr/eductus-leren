<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'DM Sans', Arial, sans-serif" width="960" height="640" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:19px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.10em; }
      .arrow { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-muted { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arrm); }
      .arrow-amber { stroke:#E9A13B; stroke-width:2; fill:none; marker-end:url(#arra); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arrm" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
  </defs>
<rect width="960" height="640" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 9 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Systemen gesorteerd op leeftijd</text>
<text x="40" y="96" class="sub">Claudette's eerste lijst — systemen gesorteerd op leeftijd, van 22 jaar oud naar 2 jaar oud.</text>
<text x="204" y="210" text-anchor="end" class="label">Systeem A</text><rect x="220" y="190" width="617.5" height="26" rx="5" fill="#2563A8"/><text x="847.5" y="209" text-anchor="start" class="sub">22 jr</text><text x="204" y="256" text-anchor="end" class="label">Systeem B</text><rect x="220" y="236" width="454.99999999999994" height="26" rx="5" fill="#2563A8"/><text x="685" y="255" text-anchor="start" class="sub">14 jr</text><text x="204" y="302" text-anchor="end" class="label">Systeem C</text><rect x="220" y="282" width="325" height="26" rx="5" fill="#2563A8"/><text x="555" y="301" text-anchor="start" class="sub">9 jr</text><text x="204" y="348" text-anchor="end" class="label">Systeem D</text><rect x="220" y="328" width="195" height="26" rx="5" fill="#2563A8"/><text x="425" y="347" text-anchor="start" class="sub">5 jr</text><text x="204" y="394" text-anchor="end" class="label">Systeem E</text><rect x="220" y="374" width="78" height="26" rx="5" fill="#2563A8"/><text x="308" y="393" text-anchor="start" class="sub">2 jr</text>
<rect x="40" y="560" width="880" height="60" rx="8" fill="#14213D"/>
      <text x="480" y="586" text-anchor="middle" class="label-light">Leeftijd is makkelijk te meten — en zegt bijna niets over het echte risico.</text>
      
</svg>