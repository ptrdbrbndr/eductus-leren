<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'DM Sans', Arial, sans-serif" width="960" height="640" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:19px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.10em; }
      .arrow { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-muted { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arrm); }
      .arrow-amber { stroke:#E9A13B; stroke-width:2; fill:none; marker-end:url(#arra); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arrm" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
  </defs>
<rect width="960" height="640" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 13 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Transformatie in drie fasen</text>
<text x="40" y="96" class="sub">Stabiliseren, uitbreiden, optimaliseren — met per fase een ander soort besluit toegestaan.</text>
<rect x="50" y="240" width="269.3333333333333" height="100" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/><text x="184.66666666666666" y="287" text-anchor="middle" class="label">Stabiliseren — kleine, laag-risico</text>
<text x="184.66666666666666" y="303" text-anchor="middle" class="label">verbeteringen</text><line x1="319.3333333333333" y1="290" x2="345.3333333333333" y2="290" class="arrow"/><rect x="345.3333333333333" y="240" width="269.3333333333333" height="100" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/><text x="480" y="295" text-anchor="middle" class="label">Uitbreiden — categorie 2-voorstellen</text><line x1="614.6666666666666" y1="290" x2="640.6666666666666" y2="290" class="arrow"/><rect x="640.6666666666666" y="240" width="269.3333333333333" height="100" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/><text x="775.3333333333333" y="287" text-anchor="middle" class="label">Optimaliseren — categorie 1, nieuwe</text>
<text x="775.3333333333333" y="303" text-anchor="middle" class="label">capabilities na heroverweging</text>
<rect x="40" y="560" width="880" height="60" rx="8" fill="#14213D"/>
      <text x="480" y="586" text-anchor="middle" class="label-light">Mutatieplatform zit nu in de stabiliseringsfase — de chatbot past pas in de volgende.</text>
      
</svg>