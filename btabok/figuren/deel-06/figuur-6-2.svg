<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'DM Sans', Arial, sans-serif" width="960" height="640" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:19px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.10em; }
      .arrow { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-muted { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arrm); }
      .arrow-amber { stroke:#E9A13B; stroke-width:2; fill:none; marker-end:url(#arra); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arrm" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
  </defs>
<rect width="960" height="640" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 6 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Wat versus hoe</text>
<text x="40" y="96" class="sub">Zesendertig punten uitgesplitst in twee kolommen — wat (requirement) en hoe (oplossing die zich voordeed als</text>
<text x="40" y="114" class="sub">requirement).</text>
<rect x="60" y="180" width="380" height="280" rx="8" fill="#F4F2EC" stroke="#2563A8" stroke-width="1.5"/><text x="250" y="210" text-anchor="middle" class="label">Wat (requirement)</text><text x="250" y="248" text-anchor="middle" class="sub">• Gevolgen van de keuze kunnen</text>
<text x="250" y="262" text-anchor="middle" class="sub">beoordelen</text><text x="250" y="278" text-anchor="middle" class="sub">• Simulatie voelt direct en betrouwbaar</text><text x="250" y="308" text-anchor="middle" class="sub">• Resultaat kunnen bewaren of delen</text><rect x="520" y="180" width="380" height="280" rx="8" fill="#F4F2EC" stroke="#2563A8" stroke-width="1.5"/><text x="710" y="210" text-anchor="middle" class="label">Hoe (oplossing)</text><text x="710" y="248" text-anchor="middle" class="sub">• "Moet een grafiek tonen"</text><text x="710" y="278" text-anchor="middle" class="sub">• "Moet binnen 2 sec. reageren"</text><text x="710" y="308" text-anchor="middle" class="sub">• "Moet exporteerbaar naar PDF"</text><circle cx="480" cy="320" r="24" fill="#E9A13B"/><text x="480" y="325" text-anchor="middle" class="label">vs</text>
<rect x="40" y="560" width="880" height="60" rx="8" fill="#14213D"/>
      <text x="480" y="586" text-anchor="middle" class="label-light">Een flink deel van de 'eisen' bleek een oplossing in vermomming.</text>
      
</svg>