<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'DM Sans', Arial, sans-serif" width="960" height="640" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:19px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.10em; }
      .arrow { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-muted { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arrm); }
      .arrow-amber { stroke:#E9A13B; stroke-width:2; fill:none; marker-end:url(#arra); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arrm" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
  </defs>
<rect width="960" height="640" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 8 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">De spanningsdriehoek</text>
<text x="40" y="96" class="sub">Snelheid, beveiliging, beheersbaarheid — met bij elke as wat je opoffert als je de andere twee</text>
<text x="40" y="114" class="sub">maximaliseert.</text>
<polygon points="480,200 596.9134295108993,402.5 363.08657048910084,402.50000000000006" fill="#F4F2EC" stroke="#2563A8" stroke-width="2"/><circle cx="480" cy="200" r="10" fill="#E9A13B"/><text x="480" y="162.2" text-anchor="middle" class="label">Snelheid</text><text x="480" y="182.2" text-anchor="middle" class="sub">ten koste van controle</text><circle cx="596.9134295108993" cy="402.5" r="10" fill="#E9A13B"/><text x="629.6491897739511" y="421.4" text-anchor="middle" class="label">Beveiliging</text><text x="629.6491897739511" y="441.4" text-anchor="middle" class="sub">ten koste van tempo</text><circle cx="363.08657048910084" cy="402.50000000000006" r="10" fill="#E9A13B"/><text x="330.3508102260491" y="421.4000000000001" text-anchor="middle" class="label">Beheersbaarheid</text><text x="330.3508102260491" y="441.4000000000001" text-anchor="middle" class="sub">ten koste van snelheid</text>
<rect x="40" y="560" width="880" height="60" rx="8" fill="#14213D"/>
      <text x="480" y="586" text-anchor="middle" class="label-light">Alle drie maximaliseren kan niet — het profiel maakt de afruil expliciet.</text>
      
</svg>