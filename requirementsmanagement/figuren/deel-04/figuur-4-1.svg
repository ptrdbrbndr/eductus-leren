<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
<rect width="1200" height="900" fill="#FFFFFF"/>
<text x="600" y="55" font-family="Cormorant Garamond" font-size="26" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="600" dy="0">Het ijsbergmodel — het wizard-voorbeeld</tspan></text><rect x="0" y="320" width="1200" height="520" fill="#EAF1F8"/><line x1="0" y1="320" x2="1200" y2="320" stroke="#2563A8" stroke-width="2"/><text x="1160" y="310" font-family="DM Sans" font-size="12" font-weight="normal" fill="#1B4A80" text-anchor="end"><tspan x="1160" dy="0">waterlijn</tspan></text><polygon points="150,190 1050,190 1010,130 190,130" fill="#1E2F52" opacity="1"/><text x="600" y="168" font-family="DM Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="600" dy="0">De vraag: “een wizard in vier</tspan><tspan x="600" dy="19.5">stappen”</tspan></text><polygon points="250,380 950,380 890,480 310,480" fill="#0D1728" opacity="0.85"/><text x="600" y="425" font-family="DM Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="600" dy="0">De wens: een overzichtelijk</tspan><tspan x="600" dy="19.5">formulier</tspan></text><polygon points="175,510 1025,510 965,610 235,610" fill="#0D1728" opacity="0.7"/><text x="600" y="555" font-family="DM Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="600" dy="0">Het doel: geen invulfouten bij</tspan><tspan x="600" dy="19.5">nabestaanden</tspan></text><polygon points="100,640 1100,640 1040,740 160,740" fill="#0D1728" opacity="0.55"/><text x="600" y="685" font-family="DM Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="600" dy="0">De onderliggende behoefte</tspan></text><text x="600" y="708" font-family="DM Sans" font-size="12" font-weight="normal" fill="#CADCFC" text-anchor="middle"><tspan x="600" dy="0">minder herstelwerk Uitkeringen, minder</tspan><tspan x="600" dy="14">vertraging nabestaande</tspan></text>
</svg>