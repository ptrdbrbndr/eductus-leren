<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500">
<rect width="1500" height="500" fill="#FFFFFF"/>
<text x="750" y="55" font-family="Cormorant Garamond" font-size="26" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="750" dy="0">De doorvraagketen — Faisals voorbeeld</tspan></text><defs><marker id="chArr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L8,3 L0,6 Z" fill="#2563A8"/>
  </marker></defs><rect x="90" y="200" width="307.5" height="130" rx="10" fill="#14213D"/><text x="243.75" y="261" font-family="DM Sans" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="243.75" dy="0">“Altijd handmatig</tspan><tspan x="243.75" dy="19">akkoord”</tspan></text><text x="243.75" y="358" font-family="DM Sans" font-size="12" font-weight="normal" fill="#55606F" text-anchor="middle"><tspan x="243.75" dy="0">1 ontwerp mogelijk</tspan></text><line x1="401.5" y1="265" x2="423.5" y2="265" stroke="#2563A8" stroke-width="3" marker-end="url(#chArr)"/><rect x="427.5" y="200" width="307.5" height="130" rx="10" fill="#1B4A80"/><text x="581.25" y="261" font-family="DM Sans" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="581.25" dy="0">“Automatische stop</tspan><tspan x="581.25" dy="19">gaat soms mis”</tspan></text><text x="581.25" y="358" font-family="DM Sans" font-size="12" font-weight="normal" fill="#55606F" text-anchor="middle"><tspan x="581.25" dy="0">iets meer ruimte</tspan></text><line x1="739" y1="265" x2="761" y2="265" stroke="#2563A8" stroke-width="3" marker-end="url(#chArr)"/><rect x="765" y="200" width="307.5" height="130" rx="10" fill="#14213D"/><text x="918.75" y="261" font-family="DM Sans" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="918.75" dy="0">“BRP-koppeling</tspan><tspan x="918.75" dy="19">faalt bij gelijke</tspan><tspan x="918.75" dy="19">namen”</tspan></text><text x="918.75" y="358" font-family="DM Sans" font-size="12" font-weight="normal" fill="#55606F" text-anchor="middle"><tspan x="918.75" dy="0">oorzaak zichtbaar</tspan></text><line x1="1076.5" y1="265" x2="1098.5" y2="265" stroke="#2563A8" stroke-width="3" marker-end="url(#chArr)"/><rect x="1102.5" y="200" width="307.5" height="130" rx="10" fill="#1B4A80"/><text x="1256.25" y="261" font-family="DM Sans" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="1256.25" dy="0">“Onterechte stop</tspan><tspan x="1256.25" dy="19">is onherstelbare</tspan><tspan x="1256.25" dy="19">schade”</tspan></text><text x="1256.25" y="358" font-family="DM Sans" font-size="12" font-weight="normal" fill="#55606F" text-anchor="middle"><tspan x="1256.25" dy="0">doel —</tspan><tspan x="1256.25" dy="14">automatisering</tspan><tspan x="1256.25" dy="14">mogelijk voor</tspan><tspan x="1256.25" dy="14">duidelijke gevallen</tspan></text><text x="750" y="430" font-family="DM Sans" font-size="14" font-weight="normal" fill="#55606F" text-anchor="middle"><tspan x="750" dy="0">Hoe dieper de laag, hoe meer ontwerpruimte overblijft.</tspan></text>
</svg>