<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="800" viewBox="0 0 1500 800">
<rect width="1500" height="800" fill="#FFFFFF"/>
<text x="750" y="55" font-family="Cormorant Garamond" font-size="26" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="750" dy="0">Drie coachingstechnieken</tspan></text><rect x="80" y="140" width="670" height="56" fill="#14213D"/><text x="415" y="175" font-family="DM Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="415" dy="0">Techniek</tspan></text><rect x="750" y="140" width="670" height="56" fill="#14213D"/><text x="1085" y="175" font-family="DM Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="1085" dy="0">Voorbeeldzin</tspan></text><rect x="80" y="196" width="1340" height="60" fill="#F4F2EC" stroke="#DFDCD3" stroke-width="1"/><text x="415" y="231" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="415" dy="0">Beschrijf het patroon,</tspan><tspan x="415" dy="15">niet het incident</tspan></text><text x="1085" y="231" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1085" dy="0">“Ik zie hier hetzelfde</tspan><tspan x="1085" dy="15">patroon als bij de</tspan><tspan x="1085" dy="15">ontbrekende deelnemersraad</tspan><tspan x="1085" dy="15">in Kwintes”</tspan></text><rect x="80" y="256" width="1340" height="60" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/><text x="415" y="291" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="415" dy="0">Vraag naar de redenering</tspan></text><text x="1085" y="291" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1085" dy="0">“Wat was de overweging om</tspan><tspan x="1085" dy="15">deze belanghebbende hier</tspan><tspan x="1085" dy="15">niet mee te nemen?”</tspan></text><rect x="80" y="316" width="1340" height="60" fill="#F4F2EC" stroke="#DFDCD3" stroke-width="1"/><text x="415" y="351" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="415" dy="0">Laat de collega zelf de</tspan><tspan x="415" dy="15">correctie vinden</tspan></text><text x="1085" y="351" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1085" dy="0">Feiten en opties leveren,</tspan><tspan x="1085" dy="15">het besluit bij de ander</tspan><tspan x="1085" dy="15">laten</tspan></text>
</svg>