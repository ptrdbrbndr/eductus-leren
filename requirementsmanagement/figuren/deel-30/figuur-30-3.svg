<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="750" viewBox="0 0 1400 750">
<rect width="1400" height="750" fill="#FFFFFF"/>
<text x="700" y="55" font-family="Cormorant Garamond" font-size="26" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Verdedigingsfragment — kruisverwijzing tussen rollen</tspan></text><rect x="220" y="140" width="960" height="70" rx="8" fill="#F4F2EC" stroke="#2563A8" stroke-width="2"/><text x="200" y="180" font-family="DM Sans" font-size="13" font-weight="bold" fill="#1B4A80" text-anchor="end"><tspan x="200" dy="0">Ellen vraagt</tspan></text><text x="700" y="182" font-family="DM Sans" font-size="14" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">“Is het risico van de dubbele profieldefinitie</tspan><tspan x="700" dy="18.2">beheerst?”</tspan></text><line x1="206" y1="175" x2="220" y2="175" stroke="#2563A8" stroke-width="1.5"/><rect x="220" y="235" width="960" height="70" rx="8" fill="#F4F2EC" stroke="#2563A8" stroke-width="2"/><text x="200" y="275" font-family="DM Sans" font-size="13" font-weight="bold" fill="#1B4A80" text-anchor="end"><tspan x="200" dy="0">Antwoord</tspan></text><text x="700" y="277" font-family="DM Sans" font-size="14" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">“Ja — zie bevinding 2, met een verplichte</tspan><tspan x="700" dy="18.2">naamgevingsregel als mitigatie.”</tspan></text><line x1="206" y1="270" x2="220" y2="270" stroke="#2563A8" stroke-width="1.5"/><rect x="220" y="330" width="960" height="70" rx="8" fill="#F4F2EC" stroke="#2563A8" stroke-width="2"/><text x="200" y="370" font-family="DM Sans" font-size="13" font-weight="bold" fill="#1B4A80" text-anchor="end"><tspan x="200" dy="0">Bram vraagt (later)</tspan></text><text x="700" y="372" font-family="DM Sans" font-size="14" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">“Is dat praktisch uitvoerbaar binnen de</tspan><tspan x="700" dy="18.2">planning?”</tspan></text><line x1="206" y1="365" x2="220" y2="365" stroke="#2563A8" stroke-width="1.5"/><rect x="220" y="425" width="960" height="70" rx="8" fill="#F4F2EC" stroke="#2563A8" stroke-width="2"/><text x="200" y="465" font-family="DM Sans" font-size="13" font-weight="bold" fill="#1B4A80" text-anchor="end"><tspan x="200" dy="0">Antwoord, met</tspan><tspan x="200" dy="16.900000000000002">verwijzing</tspan></text><text x="700" y="467" font-family="DM Sans" font-size="14" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">“Dezelfde mitigatie die ik net aan Ellen</tspan><tspan x="700" dy="18.2">noemde is qua doorlooptijd beperkt — geen</tspan><tspan x="700" dy="18.2">planningsimpact.”</tspan></text><line x1="206" y1="460" x2="220" y2="460" stroke="#2563A8" stroke-width="1.5"/>
</svg>