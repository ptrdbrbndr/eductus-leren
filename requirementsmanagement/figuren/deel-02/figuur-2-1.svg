<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
<rect width="1400" height="820" fill="#FFFFFF"/>
<text x="700" y="55" font-family="Cormorant Garamond" font-size="26" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">De negen principes — waarvoor ze je behoeden</tspan></text><rect x="80" y="130" width="386.6666666666667" height="60" fill="#14213D"/><text x="273.33333333333337" y="168" font-family="DM Sans" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="273.33333333333337" dy="0">Verkeerde inhoud</tspan></text><circle cx="106" cy="234" r="5" fill="#E9A13B"/><text x="126" y="240" font-family="DM Sans" font-size="15" font-weight="normal" fill="#14213D" text-anchor="start"><tspan x="126" dy="0">1. Waarde is de reden van</tspan><tspan x="126" dy="19">bestaan</tspan></text><circle cx="106" cy="297" r="5" fill="#E9A13B"/><text x="126" y="303" font-family="DM Sans" font-size="15" font-weight="normal" fill="#14213D" text-anchor="start"><tspan x="126" dy="0">2. Belanghebbenden bepalen</tspan><tspan x="126" dy="19">wat waarde is</tspan></text><circle cx="106" cy="360" r="5" fill="#E9A13B"/><text x="126" y="366" font-family="DM Sans" font-size="15" font-weight="normal" fill="#14213D" text-anchor="start"><tspan x="126" dy="0">5. Probleem, eis en</tspan><tspan x="126" dy="19">oplossing zijn</tspan><tspan x="126" dy="19">verstrengeld</tspan></text><circle cx="106" cy="423" r="5" fill="#E9A13B"/><text x="126" y="429" font-family="DM Sans" font-size="15" font-weight="normal" fill="#14213D" text-anchor="start"><tspan x="126" dy="0">8. Ophalen is niet alleen</tspan><tspan x="126" dy="19">opschrijven wat men vraagt</tspan></text><rect x="80" y="130" width="386.6666666666667" height="630" fill="none" stroke="#DFDCD3" stroke-width="1.5"/><rect x="506.6666666666667" y="130" width="386.6666666666667" height="60" fill="#14213D"/><text x="700" y="168" font-family="DM Sans" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="700" dy="0">Verkeerd begrip</tspan></text><circle cx="532.6666666666667" cy="234" r="5" fill="#E9A13B"/><text x="552.6666666666667" y="240" font-family="DM Sans" font-size="15" font-weight="normal" fill="#14213D" text-anchor="start"><tspan x="552.6666666666667" dy="0">3. Gedeeld begrip is het</tspan><tspan x="552.6666666666667" dy="19">echte product</tspan></text><circle cx="532.6666666666667" cy="297" r="5" fill="#E9A13B"/><text x="552.6666666666667" y="303" font-family="DM Sans" font-size="15" font-weight="normal" fill="#14213D" text-anchor="start"><tspan x="552.6666666666667" dy="0">4. Context bepaalt</tspan><tspan x="552.6666666666667" dy="19">betekenis</tspan></text><circle cx="532.6666666666667" cy="360" r="5" fill="#E9A13B"/><text x="552.6666666666667" y="366" font-family="DM Sans" font-size="15" font-weight="normal" fill="#14213D" text-anchor="start"><tspan x="552.6666666666667" dy="0">6. Valideren kan niet aan</tspan><tspan x="552.6666666666667" dy="19">het eind</tspan></text><rect x="506.6666666666667" y="130" width="386.6666666666667" height="630" fill="none" stroke="#DFDCD3" stroke-width="1.5"/><rect x="933.3333333333334" y="130" width="386.6666666666667" height="60" fill="#14213D"/><text x="1126.6666666666667" y="168" font-family="DM Sans" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="1126.6666666666667" dy="0">Verkeerd proces</tspan></text><circle cx="959.3333333333334" cy="234" r="5" fill="#E9A13B"/><text x="979.3333333333334" y="240" font-family="DM Sans" font-size="15" font-weight="normal" fill="#14213D" text-anchor="start"><tspan x="979.3333333333334" dy="0">7. Requirements veranderen</tspan><tspan x="979.3333333333334" dy="19">— reken erop</tspan></text><circle cx="959.3333333333334" cy="297" r="5" fill="#E9A13B"/><text x="979.3333333333334" y="303" font-family="DM Sans" font-size="15" font-weight="normal" fill="#14213D" text-anchor="start"><tspan x="979.3333333333334" dy="0">9. Systematisch werken,</tspan><tspan x="979.3333333333334" dy="19">met beleid gedoseerd</tspan></text><rect x="933.3333333333334" y="130" width="386.6666666666667" height="630" fill="none" stroke="#DFDCD3" stroke-width="1.5"/>
</svg>