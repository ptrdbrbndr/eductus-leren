<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="800" viewBox="0 0 1500 800">
<rect width="1500" height="800" fill="#FFFFFF"/>
<text x="750" y="55" font-family="Cormorant Garamond" font-size="26" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="750" dy="0">Vier soorten ambiguïteit</tspan></text><rect x="80" y="140" width="446.6666666666667" height="56" fill="#14213D"/><text x="303.33333333333337" y="175" font-family="DM Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="303.33333333333337" dy="0">Soort</tspan></text><rect x="526.6666666666667" y="140" width="446.6666666666667" height="56" fill="#14213D"/><text x="750.0000000000001" y="175" font-family="DM Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="750.0000000000001" dy="0">Voorbeeld</tspan></text><rect x="973.3333333333334" y="140" width="446.6666666666667" height="56" fill="#14213D"/><text x="1196.6666666666667" y="175" font-family="DM Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="1196.6666666666667" dy="0">Vraag die het</tspan><tspan x="1196.6666666666667" dy="19.5">blootlegt</tspan></text><rect x="80" y="196" width="1340" height="60" fill="#F4F2EC" stroke="#DFDCD3" stroke-width="1"/><text x="303.33333333333337" y="231" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="303.33333333333337" dy="0">Lexicaal</tspan></text><text x="750.0000000000001" y="231" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="750.0000000000001" dy="0">“Corrigeren” — aanpassen</tspan><tspan x="750.0000000000001" dy="15">vóór, of terugdraaien ná</tspan><tspan x="750.0000000000001" dy="15">verwerking?</tspan></text><text x="1196.6666666666667" y="231" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1196.6666666666667" dy="0">Welke van de twee</tspan><tspan x="1196.6666666666667" dy="15">betekenissen is bedoeld?</tspan></text><rect x="80" y="256" width="1340" height="60" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/><text x="303.33333333333337" y="291" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="303.33333333333337" dy="0">Syntactisch</tspan></text><text x="750.0000000000001" y="291" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="750.0000000000001" dy="0">“Meldingen … die zijn</tspan><tspan x="750.0000000000001" dy="15">ingediend door een</tspan><tspan x="750.0000000000001" dy="15">uitvaartondernemer”</tspan></text><text x="1196.6666666666667" y="291" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1196.6666666666667" dy="0">Slaat de bijzin op de</tspan><tspan x="1196.6666666666667" dy="15">melding of op de</tspan><tspan x="1196.6666666666667" dy="15">deelnemer?</tspan></text><rect x="80" y="316" width="1340" height="60" fill="#F4F2EC" stroke="#DFDCD3" stroke-width="1"/><text x="303.33333333333337" y="351" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="303.33333333333337" dy="0">Verwijzend</tspan></text><text x="750.0000000000001" y="351" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="750.0000000000001" dy="0">“… wordt zij geïnformeerd”</tspan><tspan x="750.0000000000001" dy="15">— de nabestaande of de</tspan><tspan x="750.0000000000001" dy="15">medewerker?</tspan></text><text x="1196.6666666666667" y="351" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1196.6666666666667" dy="0">Waar verwijst “zij”</tspan><tspan x="1196.6666666666667" dy="15">precies naar?</tspan></text><rect x="80" y="376" width="1340" height="60" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/><text x="303.33333333333337" y="411" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="303.33333333333337" dy="0">Vaagheid</tspan></text><text x="750.0000000000001" y="411" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="750.0000000000001" dy="0">“Bij een groot aantal</tspan><tspan x="750.0000000000001" dy="15">foutieve meldingen”</tspan></text><text x="1196.6666666666667" y="411" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1196.6666666666667" dy="0">Wat is “groot” — vanaf</tspan><tspan x="1196.6666666666667" dy="15">welk aantal?</tspan></text>
</svg>