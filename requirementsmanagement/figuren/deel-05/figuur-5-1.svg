<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="700" viewBox="0 0 1500 700">
<rect width="1500" height="700" fill="#FFFFFF"/>
<text x="750" y="55" font-family="Cormorant Garamond" font-size="26" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="750" dy="0">Dezelfde beslisregel — als tekst, als tabel, als backlogitem</tspan></text><rect x="80" y="140" width="420" height="440" rx="10" fill="#F4F2EC" stroke="#1B4A80" stroke-width="2"/><rect x="80" y="140" width="420" height="50" rx="10" fill="#1B4A80"/><rect x="80" y="165" width="420" height="25" fill="#1B4A80"/><text x="290" y="173" font-family="DM Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="290" dy="0">Tekst</tspan></text><text x="290" y="230" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="290" dy="0">“De werkgever kan een</tspan></text><text x="290" y="274" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="290" dy="0">aanlevering corrigeren,</tspan></text><text x="290" y="318" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="290" dy="0">mits dit gebeurt vóór</tspan></text><text x="290" y="362" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="290" dy="0">verwerking door KERN en</tspan></text><text x="290" y="406" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="290" dy="0">niet bij een reeds</tspan></text><text x="290" y="450" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="290" dy="0">uitgekeerde termijn.”</tspan></text><rect x="540" y="140" width="420" height="440" rx="10" fill="#F4F2EC" stroke="#1B4A80" stroke-width="2"/><rect x="540" y="140" width="420" height="50" rx="10" fill="#1B4A80"/><rect x="540" y="165" width="420" height="25" fill="#1B4A80"/><text x="750" y="173" font-family="DM Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="750" dy="0">Tabel (beslistabel)</tspan></text><text x="750" y="230" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="750" dy="0">Vóór verwerking | Al</tspan><tspan x="750" dy="17">uitgekeerd</tspan></text><text x="750" y="274" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="750" dy="0">Nee | — → corrigeren</tspan><tspan x="750" dy="17">toegestaan</tspan></text><text x="750" y="318" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="750" dy="0">Ja | Nee → corrigeren</tspan><tspan x="750" dy="17">toegestaan</tspan></text><text x="750" y="362" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="750" dy="0">Ja | Ja → alleen</tspan><tspan x="750" dy="17">terugvorderen</tspan></text><rect x="1000" y="140" width="420" height="440" rx="10" fill="#F4F2EC" stroke="#1B4A80" stroke-width="2"/><rect x="1000" y="140" width="420" height="50" rx="10" fill="#1B4A80"/><rect x="1000" y="165" width="420" height="25" fill="#1B4A80"/><text x="1210" y="173" font-family="DM Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="1210" dy="0">Backlogitem</tspan></text><text x="1210" y="230" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1210" dy="0">Als werkgever wil ik een</tspan></text><text x="1210" y="274" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1210" dy="0">aanlevering corrigeren</tspan></text><text x="1210" y="318" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1210" dy="0">vóór verwerking.</tspan></text><text x="1210" y="362" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1210" dy="0">AC1: correctie</tspan><tspan x="1210" dy="17">geblokkeerd</tspan></text><text x="1210" y="406" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1210" dy="0">ná uitkering.</tspan></text><text x="1210" y="450" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1210" dy="0">AC2: melding met reden.</tspan></text>
</svg>