<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="700" viewBox="0 0 1500 700">
<rect width="1500" height="700" fill="#FFFFFF"/>
<text x="750" y="55" font-family="Cormorant Garamond" font-size="26" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="750" dy="0">Wat een taalmodel wel en niet doet — het bewaartermijn-voorbeeld</tspan></text><rect x="80" y="140" width="650" height="440" rx="10" fill="#F4F2EC" stroke="#1B4A80" stroke-width="2"/><rect x="80" y="140" width="650" height="50" rx="10" fill="#1B4A80"/><rect x="80" y="165" width="650" height="25" fill="#1B4A80"/><text x="405" y="173" font-family="DM Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="405" dy="0">Wel</tspan></text><text x="405" y="230" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="405" dy="0">Patronen herkennen</tspan></text><text x="405" y="274" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="405" dy="0">en reproduceren:</tspan></text><text x="405" y="318" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="405" dy="0">zinsbouw, structuur,</tspan></text><text x="405" y="362" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="405" dy="0">gangbare formuleringen,</tspan></text><text x="405" y="406" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="405" dy="0">samenvatten van</tspan></text><text x="405" y="450" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="405" dy="0">aangeleverde tekst</tspan></text><rect x="770" y="140" width="650" height="440" rx="10" fill="#F4F2EC" stroke="#1B4A80" stroke-width="2"/><rect x="770" y="140" width="650" height="50" rx="10" fill="#1B4A80"/><rect x="770" y="165" width="650" height="25" fill="#1B4A80"/><text x="1095" y="173" font-family="DM Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="1095" dy="0">Niet</tspan></text><text x="1095" y="230" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1095" dy="0">Weten of iets waar is.</tspan></text><text x="1095" y="274" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1095" dy="0">Toegang tot de</tspan></text><text x="1095" y="318" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1095" dy="0">werkelijke situatie,</tspan></text><text x="1095" y="362" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1095" dy="0">tenzij aangeleverd.</tspan></text><text x="1095" y="406" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1095" dy="0">“Conform de geldende</tspan></text><text x="1095" y="450" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1095" dy="0">richtlijn” — verzonnen,</tspan></text><text x="1095" y="494" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1095" dy="0">niet geraadpleegd</tspan></text>
</svg>