<text x="750" y="55" font-family="Cormorant Garamond" font-size="26" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="750" dy="0">Drie klassen van wijziging</tspan></text><rect x="80" y="140" width="446.6666666666667" height="56" fill="#14213D"/><text x="303.33333333333337" y="175" font-family="DM Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="303.33333333333337" dy="0">Klasse</tspan></text><rect x="526.6666666666667" y="140" width="446.6666666666667" height="56" fill="#14213D"/><text x="750.0000000000001" y="175" font-family="DM Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="750.0000000000001" dy="0">Voorbeeld</tspan></text><rect x="973.3333333333334" y="140" width="446.6666666666667" height="56" fill="#14213D"/><text x="1196.6666666666667" y="175" font-family="DM Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="1196.6666666666667" dy="0">Besluitvormingsniveau</tspan></text><rect x="80" y="196" width="1340" height="60" fill="#F4F2EC" stroke="#DFDCD3" stroke-width="1"/><text x="303.33333333333337" y="231" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="303.33333333333337" dy="0">Klein/lokaal</tspan></text><text x="750.0000000000001" y="231" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="750.0000000000001" dy="0">Tekstuele verduidelijking</tspan><tspan x="750.0000000000001" dy="15">op een scherm</tspan></text><text x="1196.6666666666667" y="231" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1196.6666666666667" dy="0">Het team zelf, Ruben legt</tspan><tspan x="1196.6666666666667" dy="15">vast</tspan></text><rect x="80" y="256" width="1340" height="60" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/><text x="303.33333333333337" y="291" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="303.33333333333337" dy="0">Middel</tspan></text><text x="750.0000000000001" y="291" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="750.0000000000001" dy="0">Aanpassing die ook KERN's</tspan><tspan x="750.0000000000001" dy="15">statusverwerking raakt</tspan></text><text x="1196.6666666666667" y="291" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1196.6666666666667" dy="0">Ruben en Bram samen</tspan></text><rect x="80" y="316" width="1340" height="60" fill="#F4F2EC" stroke="#DFDCD3" stroke-width="1"/><text x="303.33333333333337" y="351" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="303.33333333333337" dy="0">Groot</tspan></text><text x="750.0000000000001" y="351" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="750.0000000000001" dy="0">Wijziging in het aantal</tspan><tspan x="750.0000000000001" dy="15">risicoprofielen (raakt</tspan><tspan x="750.0000000000001" dy="15">baseline)</tspan></text><text x="1196.6666666666667" y="351" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1196.6666666666667" dy="0">Formeel, via Hetty naar</tspan><tspan x="1196.6666666666667" dy="15">het fondsbestuur</tspan></text>
</svg>