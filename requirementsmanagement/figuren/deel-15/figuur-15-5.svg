    <path d="M0,0 L8,3 L0,6 Z" fill="#2563A8"/>
  </marker></defs><rect x="90" y="200" width="420" height="130" rx="10" fill="#14213D"/><text x="300" y="261" font-family="DM Sans" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="300" dy="0">Wegwijzer</tspan></text><text x="300" y="358" font-family="DM Sans" font-size="12" font-weight="normal" fill="#55606F" text-anchor="middle"><tspan x="300" dy="0">slaat de</tspan><tspan x="300" dy="14">profielkeuze op</tspan></text><line x1="514" y1="265" x2="536" y2="265" stroke="#2563A8" stroke-width="3" marker-end="url(#chArr)"/><rect x="540" y="200" width="420" height="130" rx="10" fill="#1B4A80"/><text x="750" y="261" font-family="DM Sans" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="750" dy="0">Vermogensbeheerplatform</tspan></text><text x="750" y="358" font-family="DM Sans" font-size="12" font-weight="normal" fill="#55606F" text-anchor="middle"><tspan x="750" dy="0">past de belegging</tspan><tspan x="750" dy="14">aan</tspan></text><line x1="964" y1="265" x2="986" y2="265" stroke="#2563A8" stroke-width="3" marker-end="url(#chArr)"/><rect x="990" y="200" width="420" height="130" rx="10" fill="#14213D"/><text x="1200" y="261" font-family="DM Sans" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="1200" dy="0">KERN</tspan></text><text x="1200" y="358" font-family="DM Sans" font-size="12" font-weight="normal" fill="#55606F" text-anchor="middle"><tspan x="1200" dy="0">gebruikt juiste</tspan><tspan x="1200" dy="14">gegevens bij</tspan><tspan x="1200" dy="14">uitkering</tspan></text><text x="750" y="430" font-family="DM Sans" font-size="14" font-weight="normal" fill="#55606F" text-anchor="middle"><tspan x="750" dy="0">Elk systeem heeft een eigen toestandsmodel; ze moeten via berichten op</tspan><tspan x="750" dy="18.2">elkaar aansluiten.</tspan></text>
