<text x="750" y="55" font-family="Cormorant Garamond" font-size="26" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="750" dy="0">Vier prioriteitscategorieën — voorbeelden uit deze cursus</tspan></text><rect x="80" y="140" width="446.6666666666667" height="56" fill="#14213D"/><text x="303.33333333333337" y="175" font-family="DM Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="303.33333333333337" dy="0">Categorie</tspan></text><rect x="526.6666666666667" y="140" width="446.6666666666667" height="56" fill="#14213D"/><text x="750.0000000000001" y="175" font-family="DM Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="750.0000000000001" dy="0">Vraag</tspan></text><rect x="973.3333333333334" y="140" width="446.6666666666667" height="56" fill="#14213D"/><text x="1196.6666666666667" y="175" font-family="DM Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="1196.6666666666667" dy="0">Voorbeeld</tspan></text><rect x="80" y="196" width="1340" height="60" fill="#F4F2EC" stroke="#DFDCD3" stroke-width="1"/><text x="303.33333333333337" y="231" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="303.33333333333337" dy="0">Onmisbaar</tspan></text><text x="750.0000000000001" y="231" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="750.0000000000001" dy="0">Haalt het hoofddoel het</tspan><tspan x="750.0000000000001" dy="15">zonder dit niet?</tspan></text><text x="1196.6666666666667" y="231" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1196.6666666666667" dy="0">Overlijden vaststellen via</tspan><tspan x="1196.6666666666667" dy="15">het BRP-signaal</tspan></text><rect x="80" y="256" width="1340" height="60" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/><text x="303.33333333333337" y="291" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="303.33333333333337" dy="0">Belangrijk</tspan></text><text x="750.0000000000001" y="291" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="750.0000000000001" dy="0">Draagt aantoonbaar bij,</tspan><tspan x="750.0000000000001" dy="15">systeem werkt ook zonder</tspan></text><text x="1196.6666666666667" y="291" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1196.6666666666667" dy="0">Proactief informeren bij</tspan><tspan x="1196.6666666666667" dy="15">statuswijziging</tspan></text><rect x="80" y="316" width="1340" height="60" fill="#F4F2EC" stroke="#DFDCD3" stroke-width="1"/><text x="303.33333333333337" y="351" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="303.33333333333337" dy="0">Wenselijk</tspan></text><text x="750.0000000000001" y="351" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="750.0000000000001" dy="0">Marginale of indirecte</tspan><tspan x="750.0000000000001" dy="15">bijdrage</tspan></text><text x="1196.6666666666667" y="351" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1196.6666666666667" dy="0">Exportfunctie naar Excel</tspan><tspan x="1196.6666666666667" dy="15">voor de servicedesk</tspan></text><rect x="80" y="376" width="1340" height="60" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/><text x="303.33333333333337" y="411" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="303.33333333333337" dy="0">Later, met reden</tspan></text><text x="750.0000000000001" y="411" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="750.0000000000001" dy="0">Bewust uitgesteld, met</tspan><tspan x="750.0000000000001" dy="15">reden en</tspan><tspan x="750.0000000000001" dy="15">heroverwegingsmoment</tspan></text><text x="1196.6666666666667" y="411" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1196.6666666666667" dy="0">Uitvaartondernemers pas in</tspan><tspan x="1196.6666666666667" dy="15">fase 2 (Anouk, deel 1)</tspan></text>
