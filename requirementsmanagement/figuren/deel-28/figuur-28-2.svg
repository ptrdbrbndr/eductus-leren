<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="700" viewBox="0 0 1500 700">
<rect width="1500" height="700" fill="#FFFFFF"/>
<text x="750" y="55" font-family="Cormorant Garamond" font-size="26" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="750" dy="0">Dezelfde bevinding, drie doelgroepen</tspan></text><rect x="80" y="140" width="420" height="440" rx="10" fill="#F4F2EC" stroke="#1B4A80" stroke-width="2"/><rect x="80" y="140" width="420" height="50" rx="10" fill="#1B4A80"/><rect x="80" y="165" width="420" height="25" fill="#1B4A80"/><text x="290" y="173" font-family="DM Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="290" dy="0">RE-team</tspan></text><text x="290" y="230" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="290" dy="0">“De traceer-</tspan></text><text x="290" y="274" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="290" dy="0">baarheidsketen van</tspan></text><text x="290" y="318" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="290" dy="0">de rekenregels is</tspan></text><text x="290" y="362" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="290" dy="0">onvolledig.”</tspan></text><rect x="540" y="140" width="420" height="440" rx="10" fill="#F4F2EC" stroke="#1B4A80" stroke-width="2"/><rect x="540" y="140" width="420" height="50" rx="10" fill="#1B4A80"/><rect x="540" y="165" width="420" height="25" fill="#1B4A80"/><text x="750" y="173" font-family="DM Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="750" dy="0">Bestuur</tspan></text><text x="750" y="230" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="750" dy="0">“We kunnen nu niet</tspan></text><text x="750" y="274" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="750" dy="0">aantonen dat elke</tspan></text><text x="750" y="318" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="750" dy="0">wijziging formeel</tspan></text><text x="750" y="362" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="750" dy="0">is goedgekeurd —</tspan></text><text x="750" y="406" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="750" dy="0">een risico bij</tspan><tspan x="750" dy="17">toetsing.”</tspan></text><rect x="1000" y="140" width="420" height="440" rx="10" fill="#F4F2EC" stroke="#1B4A80" stroke-width="2"/><rect x="1000" y="140" width="420" height="50" rx="10" fill="#1B4A80"/><rect x="1000" y="165" width="420" height="25" fill="#1B4A80"/><text x="1210" y="173" font-family="DM Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="1210" dy="0">Toezichthouder</tspan></text><text x="1210" y="230" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1210" dy="0">“Elke wijziging aan</tspan></text><text x="1210" y="274" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1210" dy="0">de rekenregels wordt</tspan></text><text x="1210" y="318" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1210" dy="0">traceerbaar gemaakt</tspan></text><text x="1210" y="362" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1210" dy="0">naar een formeel</tspan></text><text x="1210" y="406" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1210" dy="0">besluit, per kwartaal</tspan></text><text x="1210" y="450" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1210" dy="0">gerapporteerd.”</tspan></text>
</svg>