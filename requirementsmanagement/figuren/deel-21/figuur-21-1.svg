<text x="750" y="55" font-family="Cormorant Garamond" font-size="26" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="750" dy="0">Eén requirement, uitgesplitst in twee user stories</tspan></text><rect x="80" y="140" width="650" height="440" rx="10" fill="#F4F2EC" stroke="#1B4A80" stroke-width="2"/><rect x="80" y="140" width="650" height="50" rx="10" fill="#1B4A80"/><rect x="80" y="165" width="650" height="25" fill="#1B4A80"/><text x="405" y="173" font-family="DM Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="405" dy="0">User story 1</tspan></text><text x="405" y="230" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="405" dy="0">Als deelnemer wil ik</tspan></text><text x="405" y="274" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="405" dy="0">mijn risicoprofiel zien,</tspan></text><text x="405" y="318" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="405" dy="0">zodat ik weet welk</tspan></text><text x="405" y="362" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="405" dy="0">risiconiveau bij mij</tspan><tspan x="405" dy="17">past.</tspan></text><text x="405" y="406" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"></text><text x="405" y="450" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="405" dy="0">AC: profiel komt overeen</tspan></text><text x="405" y="494" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="405" dy="0">met de beslisboom</tspan></text><text x="405" y="538" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="405" dy="0">(deel 16), getoetst op</tspan></text><text x="405" y="582" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="405" dy="0">3 testcombinaties</tspan></text><rect x="770" y="140" width="650" height="440" rx="10" fill="#F4F2EC" stroke="#1B4A80" stroke-width="2"/><rect x="770" y="140" width="650" height="50" rx="10" fill="#1B4A80"/><rect x="770" y="165" width="650" height="25" fill="#1B4A80"/><text x="1095" y="173" font-family="DM Sans" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="1095" dy="0">User story 2</tspan></text><text x="1095" y="230" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1095" dy="0">Als deelnemer wil ik</tspan></text><text x="1095" y="274" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1095" dy="0">een toelichting bij mijn</tspan></text><text x="1095" y="318" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1095" dy="0">profiel lezen, zodat ik</tspan></text><text x="1095" y="362" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1095" dy="0">begrijp waarom.</tspan></text><text x="1095" y="406" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"></text><text x="1095" y="450" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1095" dy="0">AC: noemt horizon en</tspan></text><text x="1095" y="494" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1095" dy="0">risicohouding, voldoet</tspan></text><text x="1095" y="538" font-family="DM Sans" font-size="13" font-weight="normal" fill="#14213D" text-anchor="middle"><tspan x="1095" dy="0">aan leesbaarheidseis</tspan></text><text x="1095" y="582" font-family="DM Sans" font-size="13" font-weight="normal" fill="#1421