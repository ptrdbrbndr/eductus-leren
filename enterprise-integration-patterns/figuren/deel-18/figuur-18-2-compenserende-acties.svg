<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'DM Sans', Arial, sans-serif" width="960" height="460" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:11px; font-weight:700; fill:#0D1B2A; }
      .sub { font-size:11px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-d { stroke:#E8A020; stroke-width:2; fill:none; marker-end:url(#arra); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1A4F8B"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#E8A020"/></marker>
</defs>
<rect width="960" height="460" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 18 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Compenseren in plaats van terugdraaien</text>
<text x="40" y="96" class="sub">Dezelfde vijf stappen, maar stap 3 voegt nu nieuwe, corrigerende acties toe.</text>

<g font-size="9.5">
<rect x="60" y="150" width="140" height="55" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/><text x="130" y="182" text-anchor="middle" class="label" font-size="10">1. Portaal</text>
<rect x="240" y="150" width="140" height="55" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/><text x="310" y="182" text-anchor="middle" class="label" font-size="10">2. KERN</text>
<rect x="420" y="150" width="140" height="55" rx="6" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/><text x="490" y="182" text-anchor="middle" class="label" font-size="10" fill="#8A5A0E">3. Fraudecontrole</text>
<rect x="600" y="150" width="140" height="55" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/><text x="670" y="182" text-anchor="middle" class="label" font-size="10">4. Administrateur</text>
<rect x="780" y="150" width="140" height="55" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/><text x="850" y="182" text-anchor="middle" class="label" font-size="10">5. Deelnemer</text>
</g>
<line x1="200" y1="177" x2="240" y2="177" class="arrow"/>
<line x1="380" y1="177" x2="420" y2="177" class="arrow"/>
<line x1="560" y1="177" x2="600" y2="177" class="arrow"/>
<line x1="740" y1="177" x2="780" y2="177" class="arrow"/>

<line x1="450" y1="205" x2="330" y2="280" class="arrow-d"/>
<line x1="490" y1="205" x2="490" y2="280" class="arrow-d"/>
<line x1="530" y1="205" x2="650" y2="280" class="arrow-d"/>

<rect x="220" y="290" width="200" height="50" rx="6" fill="#FFFFFF" stroke="#E8A020" stroke-width="2"/><text x="320" y="320" text-anchor="middle" class="sub" fill="#8A5A0E" font-size="10">nieuwe correctie naar KERN</text>
<rect x="430" y="290" width="200" height="50" rx="6" fill="#FFFFFF" stroke="#E8A020" stroke-width="2"/>
<text x="530" y="320" text-anchor="middle" class="sub" fill="#8A5A0E" font-size="10">nieuw bericht naar administrateur</text>
<rect x="640" y="290" width="200" height="50" rx="6" fill="#FFFFFF" stroke="#E8A020" stroke-width="2"/><text x="740" y="320" text-anchor="middle" class="sub" fill="#8A5A0E" font-size="10">nieuwe notificatie naar deelnemer</text>

<text x="480" y="400" text-anchor="middle" class="sub" fill="#8A5A0E">elke compensatie is een nieuwe, toevoegende gebeurtenis — niet het ongedaan maken van het verleden</text>
</svg>
