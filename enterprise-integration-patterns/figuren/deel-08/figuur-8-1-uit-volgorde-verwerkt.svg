<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="'DM Sans', Arial, sans-serif" width="960" height="420" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:12px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:12px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:11px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#1A4F8B; stroke-width:1.5; fill:none; marker-end:url(#arrb); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1A4F8B"/></marker>
</defs>
<rect width="960" height="420" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 8 · TIJDLIJN</text>
<text x="40" y="64" class="title">Verzonden in volgorde, afgerond uit volgorde</text>
<text x="40" y="96" class="sub">Twee parallelle verwerkers ronden bericht 3 vóór bericht 2 af.</text>

<text x="60" y="140" class="sub">verzending</text>
<line x1="60" y1="155" x2="900" y2="155" stroke="#5B6675" stroke-width="1.5"/>
<circle cx="200" cy="155" r="7" fill="#1A4F8B"/><text x="200" y="145" text-anchor="middle" class="sub">1</text>
<circle cx="450" cy="155" r="7" fill="#1A4F8B"/><text x="450" y="145" text-anchor="middle" class="sub">2</text>
<circle cx="700" cy="155" r="7" fill="#1A4F8B"/><text x="700" y="145" text-anchor="middle" class="sub">3</text>

<text x="60" y="230" class="sub">verwerker A</text>
<line x1="60" y1="245" x2="900" y2="245" stroke="#8AAFD4" stroke-width="1.5"/>
<line x1="200" y1="155" x2="330" y2="245" class="arrow"/>
<rect x="290" y="230" width="80" height="30" rx="4" fill="#C5D8F0"/><text x="330" y="250" text-anchor="middle" class="sub" font-size="10">1 klaar</text>

<line x1="450" y1="155" x2="800" y2="245" class="arrow"/>
<rect x="760" y="230" width="80" height="30" rx="4" fill="#F5F4F0" stroke="#E8A020" stroke-width="2"/>
<text x="800" y="250" text-anchor="middle" class="sub" fill="#8A5A0E" font-size="10">2 traag</text>

<text x="60" y="330" class="sub">verwerker B</text>
<line x1="60" y1="345" x2="900" y2="345" stroke="#8AAFD4" stroke-width="1.5"/>
<line x1="700" y1="155" x2="600" y2="345" class="arrow" stroke="#E8A020"/>
<rect x="560" y="330" width="80" height="30" rx="4" fill="#E8A020"/>
<text x="600" y="350" text-anchor="middle" class="sub" font-size="10">3 klaar eerst</text>

<text x="480" y="395" text-anchor="middle" class="sub" fill="#8A5A0E">parallellisatie levert snelheid — en kwijtraken van volgorde als bijwerking</text>
</svg>
