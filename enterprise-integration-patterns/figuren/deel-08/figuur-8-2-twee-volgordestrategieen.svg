<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="'DM Sans', Arial, sans-serif" width="960" height="440" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:13px; font-weight:700; fill:#0D1B2A; }
      .sub { font-size:11px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
    </style>
</defs>
<rect width="960" height="440" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 8 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Twee strategieën om volgorde te bewaken</text>
<text x="40" y="96" class="sub">Bewaak het hele kanaal, of alleen wat bij elkaar hoort.</text>

<rect x="50" y="130" width="410" height="270" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="255" y="160" text-anchor="middle" class="label" font-size="12">Volgorde over het hele kanaal</text>
<rect x="80" y="190" width="350" height="50" rx="6" fill="#C5D8F0"/>
<text x="255" y="220" text-anchor="middle" class="sub">één trage verwerker, alles serieel</text>
<text x="255" y="270" text-anchor="middle" class="sub" fill="#8A5A0E">simpel te garanderen, maar traag bij drukte</text>

<rect x="500" y="130" width="410" height="270" rx="8" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>
<text x="705" y="160" text-anchor="middle" class="label" font-size="12" fill="#8A5A0E">Volgorde per object</text>
<rect x="530" y="190" width="160" height="50" rx="6" fill="#F5F4F0" stroke="#E8A020" stroke-width="1.5"/>
<text x="610" y="220" text-anchor="middle" class="sub" font-size="10">verwerker 1</text>
<rect x="700" y="190" width="160" height="50" rx="6" fill="#F5F4F0" stroke="#E8A020" stroke-width="1.5"/>
<text x="780" y="220" text-anchor="middle" class="sub" font-size="10">verwerker 2</text>
<text x="705" y="270" text-anchor="middle" class="sub">berichten van hetzelfde object altijd naar dezelfde verwerker</text>
<text x="705" y="290" text-anchor="middle" class="sub" fill="#8A5A0E">parallel én in volgorde — waar het telt</text>

<text x="480" y="420" text-anchor="middle" class="sub" fill="#8A5A0E">volgorde is meestal maar op één niveau nodig: dat van het object, niet het kanaal</text>
</svg>
