<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="'DM Sans', Arial, sans-serif" width="960" height="440" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:11.5px; font-weight:700; fill:#14213D; }
      .label-light { font-size:11.5px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:10.5px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    </style>
</defs>
<rect width="960" height="440" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 27 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Eén pool die opsoupeerd kan worden, of twee die dat niet kunnen</text>
<text x="40" y="96" class="sub">Bulkheads: gescheiden capaciteit voorkomt dat het ene proces het andere verstikt.</text>

<text x="230" y="140" text-anchor="middle" class="sub" font-weight="700">vóór de maatregel</text>
<rect x="90" y="160" width="280" height="120" rx="10" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2"/>
<text x="230" y="195" text-anchor="middle" class="label" font-size="11">gedeelde capaciteitspool</text>
<line x1="130" y1="230" x2="330" y2="230" stroke="#E9A13B" stroke-width="1"/>
<text x="230" y="255" text-anchor="middle" class="sub">invaaraanvragen ⟷ controleherberekeningen</text>
<text x="230" y="272" text-anchor="middle" class="sub" fill="#9A5F0D">de een kan de ander volledig opsoupeerd</text>

<text x="720" y="140" text-anchor="middle" class="sub" font-weight="700">na de maatregel</text>
<rect x="590" y="160" width="150" height="120" rx="10" fill="#2563A8"/>
<text x="665" y="195" text-anchor="middle" class="label-light" font-size="10.5">pool: invaar-</text>
<text x="665" y="212" text-anchor="middle" class="label-light" font-size="10.5">aanvragen</text>
<text x="665" y="240" text-anchor="middle" class="sub" fill="#D6E4F2" font-size="9.5">eigen, gegarandeerde</text>
<text x="665" y="256" text-anchor="middle" class="sub" fill="#D6E4F2" font-size="9.5">capaciteit</text>

<rect x="750" y="160" width="150" height="120" rx="10" fill="#2563A8"/>
<text x="825" y="195" text-anchor="middle" class="label-light" font-size="10.5">pool: controle-</text>
<text x="825" y="212" text-anchor="middle" class="label-light" font-size="10.5">herberekeningen</text>
<text x="825" y="240" text-anchor="middle" class="sub" fill="#D6E4F2" font-size="9.5">eigen, gegarandeerde</text>
<text x="825" y="256" text-anchor="middle" class="sub" fill="#D6E4F2" font-size="9.5">capaciteit</text>

<text x="480" y="360" text-anchor="middle" class="sub" fill="#9A5F0D">scheiding houdt een probleem in het ene proces uit het andere</text>
</svg>
