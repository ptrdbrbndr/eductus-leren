<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="'DM Sans', Arial, sans-serif" width="1000" height="420" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:11px; font-weight:700; fill:#0D1B2A; }
      .sub { font-size:10.5px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
    </style>
</defs>
<rect width="1000" height="420" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 27 · TIJDLIJN</text>
<text x="40" y="64" class="title">Een golf die door de keten trekt</text>
<text x="40" y="96" class="sub">Wat begint als één traag systeem, verspreidt zich binnen een uur naar de hele invaarketen.</text>

<line x1="80" y1="330" x2="920" y2="330" stroke="#0D1B2A" stroke-width="1.5"/>
<text x="920" y="325" text-anchor="end" class="sub" font-size="9.5">tijd →</text>

<line x1="150" y1="330" x2="150" y2="200" stroke="#1A4F8B" stroke-width="1.5"/>
<circle cx="150" cy="200" r="6" fill="#1A4F8B"/>
<text x="150" y="180" text-anchor="middle" class="sub" font-weight="700">t0</text>
<text x="150" y="160" text-anchor="middle" class="sub">datakwaliteitscontrole</text>
<text x="150" y="145" text-anchor="middle" class="sub">wordt traag</text>

<line x1="420" y1="330" x2="420" y2="160" stroke="#E8A020" stroke-width="2"/>
<circle cx="420" cy="160" r="7" fill="#E8A020"/>
<text x="420" y="140" text-anchor="middle" class="sub" font-weight="700">+45 min</text>
<text x="420" y="120" text-anchor="middle" class="sub">ook de rekenkern</text>
<text x="420" y="105" text-anchor="middle" class="sub">stapelt op</text>

<line x1="750" y1="330" x2="750" y2="90" stroke="#E8A020" stroke-width="2.5"/>
<circle cx="750" cy="90" r="9" fill="#E8A020"/>
<text x="750" y="70" text-anchor="middle" class="sub" font-weight="700" fill="#8A5A0E">binnen 1 uur</text>
<text x="750" y="50" text-anchor="middle" class="sub" fill="#8A5A0E">hele invaarketen</text>
<text x="750" y="35" text-anchor="middle" class="sub" fill="#8A5A0E">staat vast</text>

<path d="M 150,200 Q 285,240 420,160 Q 585,80 750,90" fill="none" stroke="#8A5A0E" stroke-width="1.5" stroke-dasharray="3 3"/>

<text x="500" y="390" text-anchor="middle" class="sub" fill="#8A5A0E">geen apart incident per systeem — één golf, drie tijdstippen, dezelfde oorzaak</text>
</svg>
