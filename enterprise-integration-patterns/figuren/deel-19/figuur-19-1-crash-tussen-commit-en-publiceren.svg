<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="'DM Sans', Arial, sans-serif" width="960" height="400" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:12px; font-weight:700; fill:#14213D; }
      .sub { font-size:11px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    </style>
</defs>
<rect width="960" height="400" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 19 · TIJDLIJN</text>
<text x="40" y="64" class="title">De crash tussen twee stappen die bij elkaar horen</text>
<text x="40" y="96" class="sub">Database bijgewerkt, event nooit gepubliceerd — twee waarheden ontstaan.</text>

<line x1="80" y1="220" x2="880" y2="220" stroke="#2563A8" stroke-width="2"/>

<circle cx="250" cy="220" r="9" fill="#2563A8"/>
<text x="250" y="200" text-anchor="middle" class="label" font-size="11">database bijgewerkt</text>
<text x="250" y="255" text-anchor="middle" fill="#2563A8" font-size="16">✓</text>

<line x1="420" y1="180" x2="420" y2="260" stroke="#9A5F0D" stroke-width="2" stroke-dasharray="3 3"/>
<text x="420" y="170" text-anchor="middle" class="sub" fill="#9A5F0D" font-size="10.5">crash</text>

<circle cx="600" cy="220" r="9" fill="#FBFAF7" stroke="#E9A13B" stroke-width="2.5"/>
<text x="600" y="200" text-anchor="middle" class="label" font-size="11">event gepubliceerd</text>
<text x="600" y="255" text-anchor="middle" fill="#9A5F0D" font-size="16">✕</text>
<text x="600" y="278" text-anchor="middle" class="sub" fill="#9A5F0D" font-size="10">nooit gebeurd</text>

<rect x="330" y="300" width="380" height="70" rx="8" fill="#14213D"/>
<text x="520" y="330" text-anchor="middle" class="sub" fill="#FBFAF7" font-size="11">"voor de buitenwereld bestaat deze mutatie niet —</text>
<text x="520" y="350" text-anchor="middle" class="sub" fill="#FBFAF7" font-size="11">voor KERN wel"</text>
</svg>
