<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="'DM Sans', Arial, sans-serif" width="960" height="420" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:12px; font-weight:700; fill:#14213D; }
      .label-light { font-size:12px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:11px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563A8"/></marker>
</defs>
<rect width="960" height="420" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 19 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Het outbox-patroon</text>
<text x="40" y="96" class="sub">Eén atomaire transactie, gevolgd door een aparte relay die publiceert.</text>

<rect x="80" y="160" width="330" height="160" rx="10" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="245" y="185" text-anchor="middle" class="label" font-size="12">één databasetransactie</text>
<rect x="105" y="205" width="280" height="45" rx="6" fill="#FBFAF7" stroke="#2563A8" stroke-width="1.2"/><text x="245" y="232" text-anchor="middle" class="sub" font-size="10.5">mutatietabel bijgewerkt</text>
<rect x="105" y="260" width="280" height="45" rx="6" fill="#FBFAF7" stroke="#2563A8" stroke-width="1.2"/><text x="245" y="287" text-anchor="middle" class="sub" font-size="10.5">outbox-tabel bijgewerkt</text>
<text x="245" y="335" text-anchor="middle" class="sub" fill="#9A5F0D" font-size="10.5">atomair — samen of geen van beide</text>

<line x1="410" y1="280" x2="500" y2="280" class="arrow"/>
<text x="455" y="270" text-anchor="middle" class="sub" font-size="9.5">periodiek uitgelezen</text>

<rect x="510" y="250" width="170" height="60" rx="8" fill="#2563A8"/>
<text x="595" y="285" text-anchor="middle" class="label-light" font-size="11">relay</text>

<line x1="680" y1="280" x2="780" y2="280" class="arrow"/>
<rect x="790" y="250" width="140" height="60" rx="8" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
<text x="860" y="285" text-anchor="middle" class="sub" fill="#9A5F0D" font-size="10.5">extern kanaal</text>

<text x="480" y="380" text-anchor="middle" class="sub" fill="#9A5F0D">de relay kan falen en opnieuw proberen — de outbox-rij blijft het bewijs dat het moet gebeuren</text>
</svg>
