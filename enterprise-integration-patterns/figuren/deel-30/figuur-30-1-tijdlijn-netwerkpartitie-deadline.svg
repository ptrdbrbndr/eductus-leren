<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" font-family="'DM Sans', Arial, sans-serif" width="1000" height="440" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:11px; font-weight:700; fill:#14213D; }
      .sub { font-size:10.5px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    </style>
</defs>
<rect width="1000" height="440" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 30 · MASTERPROEF · TIJDLIJN</text>
<text x="40" y="64" class="title">Zes dagen tussen verzenden en zekerheid</text>
<text x="40" y="96" class="sub">Tussen donderdag en maandag hangt de status van honderden tot duizenden deelnemers in de lucht.</text>

<line x1="80" y1="330" x2="920" y2="330" stroke="#14213D" stroke-width="1.5"/>
<text x="920" y="325" text-anchor="end" class="sub" font-size="9.5">tijd →</text>

<circle cx="150" cy="330" r="6" fill="#2563A8"/>
<line x1="150" y1="330" x2="150" y2="200" stroke="#2563A8" stroke-width="1.5"/>
<text x="150" y="180" text-anchor="middle" class="sub" font-weight="700">dinsdag</text>
<text x="150" y="160" text-anchor="middle" class="sub">batch verzonden</text>

<circle cx="420" cy="330" r="8" fill="#E9A13B"/>
<line x1="420" y1="330" x2="420" y2="150" stroke="#E9A13B" stroke-width="2.5"/>
<text x="420" y="130" text-anchor="middle" class="sub" font-weight="700" fill="#9A5F0D">donderdag</text>
<text x="420" y="110" text-anchor="middle" class="sub" fill="#9A5F0D">netwerkpartitie ontdekt</text>

<rect x="420" y="150" width="330" height="170" fill="#E9A13B" fill-opacity="0.12" stroke="none"/>
<text x="585" y="200" text-anchor="middle" class="title" font-size="34" fill="#9A5F0D">?</text>
<text x="585" y="235" text-anchor="middle" class="sub" fill="#9A5F0D" font-weight="700">status onbekend voor</text>
<text x="585" y="253" text-anchor="middle" class="sub" fill="#9A5F0D">100 tot 4.000 deelnemers</text>

<circle cx="750" cy="330" r="8" fill="#14213D"/>
<line x1="750" y1="330" x2="750" y2="150" stroke="#14213D" stroke-width="2.5" stroke-dasharray="5 3"/>
<text x="750" y="130" text-anchor="middle" class="sub" font-weight="700">maandag</text>
<text x="750" y="110" text-anchor="middle" class="sub">DNB-deadline</text>

<text x="500" y="395" text-anchor="middle" class="sub" fill="#9A5F0D">vier dagen onzekerheid, één harde deadline — de kern van de masterproef</text>
</svg>
