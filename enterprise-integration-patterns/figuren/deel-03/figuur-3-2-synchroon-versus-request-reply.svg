<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'DM Sans', Arial, sans-serif" width="960" height="460" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:13px; font-weight:700; fill:#0D1B2A; }
      .sub { font-size:12px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1A4F8B"/></marker>
</defs>
<rect width="960" height="460" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 3 · TIJDLIJN</text>
<text x="40" y="64" class="title">Synchrone aanroep versus request-reply</text>
<text x="40" y="96" class="sub">Links blokkeert de aanvrager; rechts gaat hij verder tot het antwoord terugkomt.</text>

<text x="60" y="140" class="label">Synchroon</text>
<line x1="60" y1="160" x2="60" y2="330" stroke="#5B6675" stroke-width="1.5"/>
<line x1="420" y1="160" x2="420" y2="330" stroke="#5B6675" stroke-width="1.5"/>
<path d="M60,190 L420,220" class="arrow"/>
<text x="240" y="205" text-anchor="middle" class="sub" font-size="11">aanroep</text>
<rect x="150" y="235" width="180" height="30" rx="4" fill="#F5F4F0" stroke="#E8A020" stroke-width="2"/>
<text x="240" y="255" text-anchor="middle" class="sub" fill="#8A5A0E" font-size="10">aanvrager wacht — geblokkeerd</text>
<path d="M420,290 L60,300" class="arrow"/>
<text x="240" y="315" text-anchor="middle" class="sub" font-size="11">antwoord terug</text>

<text x="540" y="140" class="label">Request-reply</text>
<line x1="540" y1="160" x2="540" y2="380" stroke="#5B6675" stroke-width="1.5"/>
<line x1="900" y1="160" x2="900" y2="380" stroke="#5B6675" stroke-width="1.5"/>
<path d="M540,190 L900,210" class="arrow"/>
<text x="720" y="205" text-anchor="middle" class="sub" font-size="11">aanroep (correlatie-ID)</text>
<rect x="560" y="225" width="200" height="30" rx="4" fill="#C5D8F0"/>
<text x="660" y="245" text-anchor="middle" class="sub" font-size="10">aanvrager gaat verder met ander werk</text>
<path d="M900,300 L540,340" class="arrow" stroke-dasharray="4 3"/>
<text x="720" y="325" text-anchor="middle" class="sub" font-size="11">antwoord op apart kanaal</text>
<text x="720" y="360" text-anchor="middle" class="sub" fill="#8A5A0E" font-size="10">gekoppeld via correlatie-ID</text>

<text x="480" y="430" text-anchor="middle" class="sub" fill="#8A5A0E">request-reply behoudt het antwoord-idee, maar niet de blokkade</text>
</svg>
