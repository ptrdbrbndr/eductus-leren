<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="'DM Sans', Arial, sans-serif" width="960" height="420" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:13px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:13px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:11px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1A4F8B"/></marker>
</defs>
<rect width="960" height="420" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 3 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Vier stappen naar een eerlijk statusgevoel</text>
<text x="40" y="96" class="sub">Bevestiging meteen, status op aanvraag, notificatie bij wijziging.</text>

<circle cx="90" cy="200" r="18" fill="#1A4F8B"/><text x="90" y="206" text-anchor="middle" fill="#F5F4F0" font-weight="700">1</text>
<rect x="130" y="170" width="180" height="60" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="220" y="195" text-anchor="middle" class="label" font-size="11">Werkgever dient</text>
<text x="220" y="212" text-anchor="middle" class="label" font-size="11">mutatie in</text>

<path d="M310,200 L360,200" class="arrow"/>
<circle cx="390" cy="200" r="18" fill="#1A4F8B"/><text x="390" y="206" text-anchor="middle" fill="#F5F4F0" font-weight="700">2</text>
<rect x="430" y="170" width="180" height="60" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="520" y="195" text-anchor="middle" class="label" font-size="11">Directe bevestiging</text>
<text x="520" y="212" text-anchor="middle" class="label" font-size="11">+ referentienummer</text>

<path d="M610,200 L660,200" class="arrow"/>
<circle cx="690" cy="200" r="18" fill="#1A4F8B"/><text x="690" y="206" text-anchor="middle" fill="#F5F4F0" font-weight="700">3</text>
<rect x="730" y="170" width="180" height="60" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="820" y="195" text-anchor="middle" class="label" font-size="11">Statuspagina</text>
<text x="820" y="212" text-anchor="middle" class="label" font-size="11">op aanvraag</text>

<path d="M820,230 L820,270 L220,270 L220,290" class="arrow" fill="none"/>
<circle cx="220" cy="320" r="18" fill="#E8A020"/><text x="220" y="326" text-anchor="middle" fill="#0D1B2A" font-weight="700">4</text>
<rect x="260" y="290" width="220" height="60" rx="8" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>
<text x="370" y="315" text-anchor="middle" class="label" font-size="11" fill="#8A5A0E">Optionele notificatie</text>
<text x="370" y="332" text-anchor="middle" class="label" font-size="11" fill="#8A5A0E">zodra status wijzigt</text>

<text x="480" y="400" text-anchor="middle" class="sub" fill="#8A5A0E">niet één antwoord, maar een reeks eerlijke tussenstanden</text>
</svg>
