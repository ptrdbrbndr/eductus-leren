<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="'DM Sans', Arial, sans-serif" width="960" height="420" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .sub { font-size:12px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
    </style>
</defs>
<rect width="960" height="420" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 3 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Verzonden — ? — verwerkt</text>
<text x="40" y="96" class="sub">De testcoördinator ziet het portaal, maar niet wat daarna gebeurt.</text>

<circle cx="150" cy="220" r="45" fill="#C5D8F0" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="150" y="215" text-anchor="middle" class="sub" font-size="11">testco-</text>
<text x="150" y="230" text-anchor="middle" class="sub" font-size="11">ordinator</text>

<rect x="240" y="185" width="150" height="70" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="315" y="225" text-anchor="middle" class="label" font-size="12">Werkgevers-</text>
<text x="315" y="243" text-anchor="middle" class="label" font-size="12">portaal</text>

<line x1="420" y1="220" x2="900" y2="220" stroke="#1A4F8B" stroke-width="2"/>
<circle cx="420" cy="220" r="7" fill="#1A4F8B"/>
<text x="420" y="250" text-anchor="middle" class="sub" font-weight="700">verzonden</text>

<rect x="560" y="195" width="180" height="50" rx="6" fill="#F5F4F0" stroke="#E8A020" stroke-width="2" stroke-dasharray="5 4"/>
<text x="650" y="225" text-anchor="middle" class="sub" fill="#8A5A0E" font-weight="700">?</text>

<circle cx="880" cy="220" r="7" fill="#5B6675" fill-opacity="0.4"/>
<text x="880" y="250" text-anchor="middle" class="sub">verwerkt</text>

<text x="480" y="360" text-anchor="middle" class="sub" fill="#8A5A0E">de kloof tussen verzenden en verwerken is precies waar messaging expliciete keuzes vraagt</text>
</svg>
