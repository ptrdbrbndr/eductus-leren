<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="'DM Sans', Arial, sans-serif" width="960" height="420" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .sub { font-size:12px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    </style>
</defs>
<rect width="960" height="420" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 3 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Verzonden — ? — verwerkt</text>
<text x="40" y="96" class="sub">De testcoördinator ziet het portaal, maar niet wat daarna gebeurt.</text>

<circle cx="150" cy="220" r="45" fill="#CBDCEF" stroke="#2563A8" stroke-width="1.5"/>
<text x="150" y="215" text-anchor="middle" class="sub" font-size="11">testco-</text>
<text x="150" y="230" text-anchor="middle" class="sub" font-size="11">ordinator</text>

<rect x="240" y="185" width="150" height="70" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="315" y="225" text-anchor="middle" class="label" font-size="12">Werkgevers-</text>
<text x="315" y="243" text-anchor="middle" class="label" font-size="12">portaal</text>

<line x1="420" y1="220" x2="900" y2="220" stroke="#2563A8" stroke-width="2"/>
<circle cx="420" cy="220" r="7" fill="#2563A8"/>
<text x="420" y="250" text-anchor="middle" class="sub" font-weight="700">verzonden</text>

<rect x="560" y="195" width="180" height="50" rx="6" fill="#FBFAF7" stroke="#E9A13B" stroke-width="2" stroke-dasharray="5 4"/>
<text x="650" y="225" text-anchor="middle" class="sub" fill="#9A5F0D" font-weight="700">?</text>

<circle cx="880" cy="220" r="7" fill="#55606F" fill-opacity="0.4"/>
<text x="880" y="250" text-anchor="middle" class="sub">verwerkt</text>

<text x="480" y="360" text-anchor="middle" class="sub" fill="#9A5F0D">de kloof tussen verzenden en verwerken is precies waar messaging expliciete keuzes vraagt</text>
</svg>
