<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="'DM Sans', Arial, sans-serif" width="960" height="500" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:12px; font-weight:700; fill:#0D1B2A; }
      .sub { font-size:11px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
    </style>
</defs>
<rect width="960" height="500" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 24 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Drie cursussen, één gedeeld onderwerp</text>
<text x="40" y="96" class="sub">Event sourcing raakt domeinmodel, opslag en transport — elk beschrijft een ander deel.</text>

<circle cx="380" cy="270" r="150" fill="#1A4F8B" fill-opacity="0.18" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="290" y="180" text-anchor="middle" class="label" font-size="12">domeinmodel</text>
<text x="290" y="198" text-anchor="middle" class="sub" font-size="9.5">(DDD-cursus)</text>

<circle cx="580" cy="270" r="150" fill="#E8A020" fill-opacity="0.20" stroke="#E8A020" stroke-width="1.5"/>
<text x="670" y="180" text-anchor="middle" class="label" font-size="12">opslag</text>
<text x="670" y="198" text-anchor="middle" class="sub" font-size="9.5">(databasecursus)</text>

<circle cx="480" cy="400" r="150" fill="#5B6675" fill-opacity="0.16" stroke="#5B6675" stroke-width="1.5"/>
<text x="480" y="470" text-anchor="middle" class="label" font-size="12">transport</text>
<text x="480" y="488" text-anchor="middle" class="sub" font-size="9.5">(deze cursus — EIP)</text>

<rect x="410" y="290" width="150" height="50" rx="8" fill="#FFFFFF" stroke="#0D1B2A" stroke-width="1.5"/>
<text x="485" y="312" text-anchor="middle" class="label" font-size="10.5">event sourcing</text>
<text x="485" y="330" text-anchor="middle" class="sub" font-size="9">het gedeelde middengebied</text>
</svg>
