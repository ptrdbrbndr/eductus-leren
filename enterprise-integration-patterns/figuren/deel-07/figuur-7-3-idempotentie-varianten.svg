<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="'DM Sans', Arial, sans-serif" width="960" height="420" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:13px; font-weight:700; fill:#0D1B2A; }
      .sub { font-size:12px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
    </style>
</defs>
<rect width="960" height="420" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 7 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Verhogen versus corrigeren</text>
<text x="40" y="96" class="sub">Dezelfde herhaling, twee heel verschillende gevolgen.</text>

<rect x="60" y="140" width="400" height="220" rx="8" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>
<text x="260" y="170" text-anchor="middle" class="label" fill="#8A5A0E">"verhoog met €340"</text>
<text x="260" y="195" text-anchor="middle" class="sub">niet-idempotent</text>
<rect x="90" y="220" width="340" height="40" rx="4" fill="#F5F4F0"/><text x="105" y="245" class="sub" font-size="11">1e uitvoering: saldo +€340</text>
<rect x="90" y="270" width="340" height="40" rx="4" fill="#F5F4F0" stroke="#E8A020" stroke-width="1.5"/><text x="105" y="295" class="sub" fill="#8A5A0E" font-size="11">2e uitvoering: saldo nóg +€340</text>
<text x="260" y="335" text-anchor="middle" class="sub" fill="#8A5A0E" font-weight="700">effect verdubbelt</text>

<rect x="500" y="140" width="400" height="220" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="700" y="170" text-anchor="middle" class="label">"corrigeer naar €12.340"</text>
<text x="700" y="195" text-anchor="middle" class="sub">idempotent</text>
<rect x="530" y="220" width="340" height="40" rx="4" fill="#C5D8F0"/><text x="545" y="245" class="sub" font-size="11">1e uitvoering: saldo = €12.340</text>
<rect x="530" y="270" width="340" height="40" rx="4" fill="#C5D8F0"/><text x="545" y="295" class="sub" font-size="11">2e uitvoering: saldo = €12.340</text>
<text x="700" y="335" text-anchor="middle" class="sub" font-weight="700">geen extra effect</text>

<text x="480" y="400" text-anchor="middle" class="sub" fill="#8A5A0E">idempotentie is een eigenschap van de operatie, niet van het kanaal</text>
</svg>
