<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="'DM Sans', Arial, sans-serif" width="960" height="420" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:12px; font-weight:700; fill:#0D1B2A; }
      .sub { font-size:11px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
    </style>
</defs>
<rect width="960" height="420" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 7 · TIJDLIJN</text>
<text x="40" y="64" class="title">Eén poging, een onderbreking, een retry — twee berichten</text>
<text x="40" y="96" class="sub">At-least-once levert soms te veel af, niet te weinig.</text>

<line x1="80" y1="220" x2="900" y2="220" stroke="#1A4F8B" stroke-width="2"/>

<circle cx="160" cy="220" r="8" fill="#1A4F8B"/>
<text x="160" y="200" text-anchor="middle" class="sub">bericht 1 verzonden</text>

<rect x="260" y="205" width="140" height="30" rx="4" fill="#F5F4F0" stroke="#E8A020" stroke-width="2" stroke-dasharray="4 3"/>
<text x="330" y="197" text-anchor="middle" class="sub" fill="#8A5A0E">netwerkonderbreking</text>

<circle cx="480" cy="220" r="8" fill="#E8A020"/>
<text x="480" y="200" text-anchor="middle" class="sub" fill="#8A5A0E">geen bevestiging</text>

<circle cx="600" cy="220" r="8" fill="#1A4F8B"/>
<text x="600" y="200" text-anchor="middle" class="sub">bericht 1 (retry) verzonden</text>

<circle cx="740" cy="220" r="8" fill="#1A4F8B"/>
<circle cx="770" cy="220" r="8" fill="#1A4F8B"/>
<text x="755" y="250" text-anchor="middle" class="sub">beide komen aan bij KERN — 2s verschil</text>
<text x="755" y="270" text-anchor="middle" class="sub" font-weight="700">beide worden verwerkt</text>

<text x="480" y="340" text-anchor="middle" class="sub" fill="#8A5A0E">zonder idempotentie verwerkt KERN dezelfde mutatie tweemaal</text>
</svg>
