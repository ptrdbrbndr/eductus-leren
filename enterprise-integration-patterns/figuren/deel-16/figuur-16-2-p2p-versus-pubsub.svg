<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'DM Sans', Arial, sans-serif" width="960" height="460" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:12px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:12px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:11px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .panel-title { font-size:13px; font-weight:700; fill:#8A5A0E; }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1A4F8B"/></marker>
</defs>
<rect width="960" height="460" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 16 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Eén queue met concurrenten, of drie eigen queues</text>
<text x="40" y="96" class="sub">Schaalbaarheid via verdeling, versus elk zijn eigen volledige kopie.</text>

<line x1="480" y1="130" x2="480" y2="430" stroke="#C9C4B8" stroke-width="1"/>

<text x="230" y="140" text-anchor="middle" class="panel-title">(a) point-to-point met schaalbaarheid</text>
<rect x="150" y="170" width="110" height="45" rx="6" fill="#1A4F8B"/><text x="205" y="197" text-anchor="middle" class="label-light" font-size="10">exchange</text>
<line x1="205" y1="215" x2="205" y2="255" class="arrow"/>
<rect x="150" y="255" width="110" height="40" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/><text x="205" y="280" text-anchor="middle" class="sub" font-size="10">queue</text>
<line x1="205" y1="295" x2="160" y2="340" class="arrow"/>
<line x1="205" y1="295" x2="250" y2="340" class="arrow"/>
<rect x="110" y="340" width="90" height="40" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/><text x="155" y="365" text-anchor="middle" class="sub" font-size="9">consumer A</text>
<rect x="210" y="340" width="90" height="40" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/><text x="255" y="365" text-anchor="middle" class="sub" font-size="9">consumer B</text>
<text x="230" y="410" text-anchor="middle" class="sub" font-size="10">elk bericht naar precies één consumer, om de beurt</text>

<text x="730" y="140" text-anchor="middle" class="panel-title">(b) publish-subscribe</text>
<rect x="670" y="170" width="120" height="45" rx="6" fill="#1A4F8B"/><text x="730" y="197" text-anchor="middle" class="label-light" font-size="10">exchange</text>
<line x1="700" y1="215" x2="640" y2="250" class="arrow"/>
<line x1="730" y1="215" x2="730" y2="250" class="arrow"/>
<line x1="760" y1="215" x2="820" y2="250" class="arrow"/>
<rect x="590" y="250" width="100" height="35" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/><text x="640" y="272" text-anchor="middle" class="sub" font-size="9">queue 1</text>
<rect x="680" y="250" width="100" height="35" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/><text x="730" y="272" text-anchor="middle" class="sub" font-size="9">queue 2</text>
<rect x="770" y="250" width="100" height="35" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/><text x="820" y="272" text-anchor="middle" class="sub" font-size="9">queue 3</text>
<line x1="640" y1="285" x2="640" y2="330" class="arrow"/>
<line x1="730" y1="285" x2="730" y2="330" class="arrow"/>
<line x1="820" y1="285" x2="820" y2="330" class="arrow"/>
<rect x="595" y="330" width="90" height="35" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/><text x="640" y="352" text-anchor="middle" class="sub" font-size="9">consumer 1</text>
<rect x="685" y="330" width="90" height="35" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/><text x="730" y="352" text-anchor="middle" class="sub" font-size="9">consumer 2</text>
<rect x="775" y="330" width="90" height="35" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/><text x="820" y="352" text-anchor="middle" class="sub" font-size="9">consumer 3</text>
<text x="730" y="410" text-anchor="middle" class="sub" font-size="10">elk bericht naar alle drie, elk krijgt een eigen kopie</text>
</svg>
