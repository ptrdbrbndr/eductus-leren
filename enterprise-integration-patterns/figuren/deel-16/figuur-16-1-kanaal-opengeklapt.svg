<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="'DM Sans', Arial, sans-serif" width="960" height="420" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:12px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:12px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:11px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1A4F8B"/></marker>
</defs>
<rect width="960" height="420" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 16 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Het kanaal, opengeklapt</text>
<text x="40" y="96" class="sub">Wat tot nu toe een wolk was, blijkt exchange, queues en routeerregels.</text>

<ellipse cx="180" cy="230" rx="110" ry="70" fill="#8AAFD4" opacity="0.5" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="180" y="235" text-anchor="middle" class="label" font-size="12">"kanaal"</text>

<line x1="290" y1="230" x2="380" y2="230" class="arrow"/>
<text x="335" y="215" text-anchor="middle" class="sub" font-size="10">opengeklapt</text>

<rect x="390" y="140" width="110" height="50" rx="6" fill="#1A4F8B"/>
<text x="445" y="170" text-anchor="middle" class="label-light" font-size="11">exchange</text>

<line x1="500" y1="165" x2="580" y2="130" class="arrow"/>
<line x1="500" y1="165" x2="580" y2="230" class="arrow"/>
<line x1="500" y1="165" x2="580" y2="330" class="arrow"/>

<rect x="590" y="105" width="140" height="45" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/><text x="660" y="132" text-anchor="middle" class="sub" font-size="10">queue: mutaties</text>
<rect x="590" y="208" width="140" height="45" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/><text x="660" y="235" text-anchor="middle" class="sub" font-size="10">queue: audit-trail</text>
<rect x="590" y="308" width="140" height="45" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/><text x="660" y="335" text-anchor="middle" class="sub" font-size="10">queue: notificaties</text>

<text x="480" y="130" class="sub" font-size="10" fill="#8A5A0E">routeerregels bepalen wélke queue elk bericht bereikt</text>
<text x="480" y="390" text-anchor="middle" class="sub" fill="#8A5A0E">een kanaal is nooit één ding — het is een configuratie</text>
</svg>
