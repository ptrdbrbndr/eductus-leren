<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="'DM Sans', Arial, sans-serif" width="1000" height="420" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
