<circle cx="780" cy="230" r="5"/><circle cx="780" cy="250" r="5"/><circle cx="780" cy="270" r="5"/>
<circle cx="780" cy="290" r="5"/><circle cx="780" cy="310" r="5"/><circle cx="780" cy="210" r="5"/>
<circle cx="780" cy="190" r="5"/><circle cx="780" cy="170" r="5"/><circle cx="780" cy="150" r="5"/>
