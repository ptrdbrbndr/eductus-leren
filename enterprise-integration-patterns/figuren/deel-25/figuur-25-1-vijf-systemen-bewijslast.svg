<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="'DM Sans', Arial, sans-serif" width="1000" height="420" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:11.5px; font-weight:700; fill:#0D1B2A; }
      .sub { font-size:10.5px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1A4F8B"/></marker>
</defs>
<rect width="1000" height="420" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 25 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Vijf systemen, vijf soorten bewijslast</text>
<text x="40" y="96" class="sub">Elke schakel in de keten draagt een eigen verantwoordingsplicht.</text>

<g font-size="10">
<rect x="30" y="160" width="160" height="90" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="110" y="185" text-anchor="middle" class="label">brondata</text>
<text x="110" y="205" text-anchor="middle" class="sub">bewijslast:</text>
<text x="110" y="222" text-anchor="middle" class="sub" fill="#8A5A0E">herkomst</text>

<line x1="190" y1="205" x2="220" y2="205" class="arrow"/>
<rect x="220" y="160" width="160" height="90" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="300" y="185" text-anchor="middle" class="label">datakwaliteit</text>
<text x="300" y="205" text-anchor="middle" class="sub">bewijslast:</text>
<text x="300" y="222" text-anchor="middle" class="sub" fill="#8A5A0E">validatiecriteria</text>

<line x1="380" y1="205" x2="410" y2="205" class="arrow"/>
<rect x="410" y="160" width="160" height="90" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="490" y="185" text-anchor="middle" class="label">rekenkern</text>
<text x="490" y="205" text-anchor="middle" class="sub">bewijslast:</text>
<text x="490" y="222" text-anchor="middle" class="sub" fill="#8A5A0E">regels + versie</text>

<line x1="570" y1="205" x2="600" y2="205" class="arrow"/>
<rect x="600" y="160" width="180" height="90" rx="8" fill="#FFFFFF" stroke="#E8A020" stroke-width="2"/>
<text x="690" y="185" text-anchor="middle" class="label">invaaradministratie</text>
<text x="690" y="205" text-anchor="middle" class="sub">bewijslast:</text>
<text x="690" y="222" text-anchor="middle" class="sub" fill="#8A5A0E">onveranderlijk vastgelegd</text>

<line x1="780" y1="205" x2="810" y2="205" class="arrow"/>
<rect x="810" y="160" width="160" height="90" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="890" y="185" text-anchor="middle" class="label">communicatie</text>
<text x="890" y="205" text-anchor="middle" class="sub">bewijslast:</text>
<text x="890" y="222" text-anchor="middle" class="sub" fill="#8A5A0E">bevestiging kennisgeving</text>
</g>
<text x="500" y="370" text-anchor="middle" class="sub" fill="#8A5A0E">elke schakel moet zijn eigen deel van het verhaal kunnen bewijzen</text>
</svg>
