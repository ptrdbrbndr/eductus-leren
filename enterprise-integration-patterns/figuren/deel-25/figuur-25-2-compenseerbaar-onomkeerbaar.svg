<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="'DM Sans', Arial, sans-serif" width="1000" height="420" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:11px; font-weight:700; fill:#0D1B2A; }
      .sub { font-size:10.5px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1A4F8B"/></marker>
</defs>
<rect width="1000" height="420" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 25 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Waar de keten van omkeerbaar naar onomkeerbaar gaat</text>
<text x="40" y="96" class="sub">Dezelfde vijf schakels als in 25.1, nu met de breuklijn tussen herstellen en formeel corrigeren.</text>

<g font-size="9.5">
<rect x="30" y="160" width="150" height="80" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="105" y="188" text-anchor="middle" class="label" font-size="10.5">brondata</text>
<line x1="180" y1="200" x2="205" y2="200" class="arrow"/>
<rect x="205" y="160" width="150" height="80" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="280" y="188" text-anchor="middle" class="label" font-size="10.5">datakwaliteit</text>
<line x1="355" y1="200" x2="380" y2="200" class="arrow"/>
<rect x="380" y="160" width="150" height="80" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="455" y="188" text-anchor="middle" class="label" font-size="10.5">rekenkern / goedkeuring</text>
</g>

<line x1="558" y1="120" x2="558" y2="300" stroke="#0D1B2A" stroke-width="2" stroke-dasharray="6 4"/>
<text x="558" y="110" text-anchor="middle" class="sub" font-weight="700">breukvlak</text>

<g font-size="9.5">
<line x1="530" y1="200" x2="600" y2="200" class="arrow"/>
<rect x="600" y="160" width="180" height="80" rx="8" fill="#FFFFFF" stroke="#E8A020" stroke-width="2"/>
<text x="690" y="188" text-anchor="middle" class="label" font-size="10.5">invaaradministratie</text>
<line x1="780" y1="200" x2="805" y2="200" class="arrow"/>
<rect x="805" y="160" width="150" height="80" rx="8" fill="#FFFFFF" stroke="#E8A020" stroke-width="2"/>
<text x="880" y="188" text-anchor="middle" class="label" font-size="10.5">communicatie</text>
</g>

<text x="290" y="270" text-anchor="middle" class="sub" fill="#1A4F8B" font-weight="700">links: compenseerbaar</text>
<text x="290" y="288" text-anchor="middle" class="sub">terugdraaien of corrigeren kan nog binnen de eigen stap</text>

<text x="780" y="270" text-anchor="middle" class="sub" fill="#8A5A0E" font-weight="700">rechts: onomkeerbaar</text>
<text x="780" y="288" text-anchor="middle" class="sub">alleen nog een formeel hersteltraject, geen stille correctie</text>
</svg>
