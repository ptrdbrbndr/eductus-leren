<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'DM Sans', Arial, sans-serif" width="960" height="460" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:13px; font-weight:700; fill:#14213D; }
      .sub { font-size:12px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-d { stroke:#E9A13B; stroke-width:2; stroke-dasharray:4 3; fill:none; marker-end:url(#arra); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#E9A13B"/></marker>
</defs>
<rect width="960" height="460" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 4 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">De content-based router</text>
<text x="40" y="96" class="sub">Eén ruit, vier uitgangen — drie bekende typen en een vangnet voor de rest.</text>

<rect x="60" y="210" width="150" height="50" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="135" y="240" text-anchor="middle" class="sub" font-size="11">inkomend bericht</text>
<line x1="210" y1="235" x2="330" y2="235" class="arrow"/>

<polygon points="330,190 420,235 330,280 240,235" fill="#6FA3D6" stroke="#2563A8" stroke-width="1.5"/>
<text x="330" y="240" text-anchor="middle" class="label" font-size="11">router</text>

<line x1="420" y1="215" x2="620" y2="100" class="arrow"/>
<rect x="630" y="70" width="220" height="50" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="740" y="100" text-anchor="middle" class="sub" font-size="11">adreswijziging-verwerker</text>

<line x1="420" y1="235" x2="620" y2="235" class="arrow"/>
<rect x="630" y="210" width="220" height="50" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="740" y="240" text-anchor="middle" class="sub" font-size="11">dienstverband-verwerker</text>

<line x1="420" y1="255" x2="620" y2="330" class="arrow"/>
<rect x="630" y="305" width="220" height="50" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="740" y="335" text-anchor="middle" class="sub" font-size="11">salaris-verwerker</text>

<line x1="330" y1="280" x2="330" y2="400" class="arrow-d"/>
<rect x="230" y="400" width="200" height="45" rx="6" fill="#FBFAF7" stroke="#E9A13B" stroke-width="2"/>
<text x="330" y="428" text-anchor="middle" class="sub" fill="#9A5F0D" font-size="11">invalid message channel</text>

<text x="480" y="430" text-anchor="middle" class="sub" fill="#9A5F0D"></text>
</svg>
