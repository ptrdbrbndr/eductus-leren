<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="'DM Sans', Arial, sans-serif" width="960" height="380" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:11px; font-weight:700; fill:#14213D; }
      .sub { font-size:11px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563A8"/></marker>
</defs>
<rect width="960" height="380" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 17 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Een estafette zonder coach</text>
<text x="40" y="96" class="sub">Zes stappen, elk gericht op de volgende — niemand overziet de hele race.</text>

<g font-size="9.5">
<rect x="40" y="200" width="120" height="50" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/><text x="100" y="230" text-anchor="middle" class="label" font-size="10">mutatie ontvangen</text>
<rect x="190" y="200" width="120" height="50" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/><text x="250" y="230" text-anchor="middle" class="label" font-size="10">gevalideerd</text>
<rect x="340" y="200" width="120" height="50" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/><text x="400" y="230" text-anchor="middle" class="label" font-size="10">verrijkt</text>
<rect x="490" y="200" width="120" height="50" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/><text x="550" y="230" text-anchor="middle" class="label" font-size="10">vertaald</text>
<rect x="640" y="200" width="120" height="50" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/><text x="700" y="230" text-anchor="middle" class="label" font-size="10">verwerkt bij KERN</text>
<rect x="790" y="200" width="120" height="50" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/><text x="850" y="222" text-anchor="middle" class="label" font-size="10">bevestigd aan</text><text x="850" y="236" text-anchor="middle" class="label" font-size="10">werkgever</text>
</g>
<line x1="160" y1="225" x2="190" y2="225" class="arrow"/>
<line x1="310" y1="225" x2="340" y2="225" class="arrow"/>
<line x1="460" y1="225" x2="490" y2="225" class="arrow"/>
<line x1="610" y1="225" x2="640" y2="225" class="arrow"/>
<line x1="760" y1="225" x2="790" y2="225" class="arrow"/>

<text x="480" y="330" text-anchor="middle" class="sub" fill="#9A5F0D">elke schakel weet alleen wie erna komt — niemand ziet de hele keten tegelijk</text>
</svg>
