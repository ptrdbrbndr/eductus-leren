<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'DM Sans', Arial, sans-serif" width="960" height="460" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:11px; font-weight:700; fill:#14213D; }
      .label-light { font-size:11px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:11px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow2 { stroke:#2563A8; stroke-width:1.5; fill:none; marker-end:url(#arrb); }
      .panel-title { font-size:13px; font-weight:700; fill:#9A5F0D; }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563A8"/></marker>
</defs>
<rect width="960" height="460" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 17 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Ketting zonder centrum, of ster met dirigent</text>
<text x="40" y="96" class="sub">Choreografie verspreidt de regie, orkestratie concentreert haar.</text>

<line x1="480" y1="130" x2="480" y2="430" stroke="#D9D5C8" stroke-width="1"/>

<text x="230" y="140" text-anchor="middle" class="panel-title">choreografie</text>
<circle cx="100" cy="230" r="26" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/><text x="100" y="234" text-anchor="middle" class="sub" font-size="9">A</text>
<circle cx="190" cy="200" r="26" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/><text x="190" y="204" text-anchor="middle" class="sub" font-size="9">B</text>
<circle cx="280" cy="250" r="26" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/><text x="280" y="254" text-anchor="middle" class="sub" font-size="9">C</text>
<circle cx="220" cy="330" r="26" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/><text x="220" y="334" text-anchor="middle" class="sub" font-size="9">D</text>
<circle cx="120" cy="340" r="26" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/><text x="120" y="344" text-anchor="middle" class="sub" font-size="9">E</text>
<path d="M124,215 L166,204" class="arrow2"/>
<path d="M212,214 L262,240" class="arrow2"/>
<path d="M266,272 L238,313" class="arrow2"/>
<path d="M196,335 L144,338" class="arrow2"/>
<text x="230" y="410" text-anchor="middle" class="sub" font-size="10">elke stap kent alleen zijn eigen buur</text>

<text x="730" y="140" text-anchor="middle" class="panel-title">orkestratie</text>
<rect x="680" y="215" width="100" height="45" rx="6" fill="#2563A8"/><text x="730" y="242" text-anchor="middle" class="label-light" font-size="10">orkestrator</text>
<circle cx="730" cy="130" r="22" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/><text x="730" y="134" text-anchor="middle" class="sub" font-size="9">A</text>
<circle cx="830" cy="185" r="22" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/><text x="830" y="189" text-anchor="middle" class="sub" font-size="9">B</text>
<circle cx="850" cy="290" r="22" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/><text x="850" y="294" text-anchor="middle" class="sub" font-size="9">C</text>
<circle cx="760" cy="360" r="22" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/><text x="760" y="364" text-anchor="middle" class="sub" font-size="9">D</text>
<circle cx="640" cy="300" r="22" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/><text x="640" y="304" text-anchor="middle" class="sub" font-size="9">E</text>
<path d="M715,215 L730,152" class="arrow2"/>
<path d="M770,222 L818,195" class="arrow2"/>
<path d="M780,250 L838,278" class="arrow2"/>
<path d="M745,258 L762,340" class="arrow2"/>
<path d="M700,240 L650,285" class="arrow2"/>
<text x="730" y="410" text-anchor="middle" class="sub" font-size="10">elke stap krijgt opdracht en bevestigt terug</text>
</svg>
