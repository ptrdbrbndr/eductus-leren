<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="'DM Sans', Arial, sans-serif" width="960" height="480" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .sub { font-size:12px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
    </style>
</defs>
<rect width="960" height="480" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 1 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Drie signalen dat request/response niet meer past</text>
<text x="40" y="96" class="sub">Elk signaal wijst op een andere reden om over te stappen op messaging.</text>

<rect x="50" y="140" width="270" height="240" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<circle cx="90" cy="180" r="16" fill="#1A4F8B"/>
<text x="90" y="185" text-anchor="middle" fill="#F5F4F0" font-weight="700" font-size="14">1</text>
<text x="115" y="185" class="label" font-size="13">Onvoorspelbare tijd</text>
<text x="70" y="220" class="sub">Verwerkingstijd hangt af van</text>
<text x="70" y="238" class="sub">een externe partij, batch of</text>
<text x="70" y="256" class="sub">handmatige stap — structureel</text>
<text x="70" y="274" class="sub">variabel, niet incidenteel</text>
<rect x="70" y="300" width="230" height="50" rx="6" fill="#F5F4F0" stroke="#E8A020" stroke-width="2"/>
<text x="185" y="330" text-anchor="middle" class="sub" fill="#8A5A0E" font-size="11">validatie bij externe administrateur</text>

<rect x="345" y="140" width="270" height="240" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<circle cx="385" cy="180" r="16" fill="#1A4F8B"/>
<text x="385" y="185" text-anchor="middle" fill="#F5F4F0" font-weight="700" font-size="14">2</text>
<text x="410" y="185" class="label" font-size="13">Ontkoppeling in tijd</text>
<text x="365" y="220" class="sub">Zender en ontvanger hoeven</text>
<text x="365" y="238" class="sub">niet gelijktijdig actief te zijn —</text>
<text x="365" y="256" class="sub">een onderhoudsvenster mag</text>
<text x="365" y="274" class="sub">geen foutmelding veroorzaken</text>
<rect x="365" y="300" width="230" height="50" rx="6" fill="#F5F4F0" stroke="#E8A020" stroke-width="2"/>
<text x="480" y="330" text-anchor="middle" class="sub" fill="#8A5A0E" font-size="11">mutatie om 4 uur 's nachts</text>

<rect x="640" y="140" width="270" height="240" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<circle cx="680" cy="180" r="16" fill="#1A4F8B"/>
<text x="680" y="185" text-anchor="middle" fill="#F5F4F0" font-weight="700" font-size="14">3</text>
<text x="705" y="185" class="label" font-size="12">Eén-naar-veel</text>
<text x="660" y="220" class="sub">Eén actie moet meerdere,</text>
<text x="660" y="238" class="sub">onafhankelijke ontvangers</text>
<text x="660" y="256" class="sub">bereiken — serieel opgebouwd</text>
<text x="660" y="274" class="sub">faalt de hele keten bij één weigering</text>
<rect x="660" y="300" width="230" height="50" rx="6" fill="#F5F4F0" stroke="#E8A020" stroke-width="2"/>
<text x="775" y="330" text-anchor="middle" class="sub" fill="#8A5A0E" font-size="11">KERN, loket, audit-trail, administrateur</text>

<text x="480" y="430" text-anchor="middle" class="sub" fill="#8A5A0E">bij het Werkgeversportaal-incident golden signaal 1 en 2 allebei</text>
</svg>
