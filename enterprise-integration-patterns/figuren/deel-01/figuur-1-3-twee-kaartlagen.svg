<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="'DM Sans', Arial, sans-serif" width="960" height="520" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:13px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1A4F8B"/></marker>
</defs>
<rect width="960" height="520" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 1 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Eén keten, twee kaartlagen</text>
<text x="40" y="96" class="sub">De vraag is nooit "REST of messaging" voor een heel systeem, maar per koppeling.</text>

<rect x="60" y="130" width="840" height="130" rx="8" fill="#C5D8F0"/>
<text x="80" y="155" class="label" font-size="12" fill="#1A4F8B">SYNCHRONE LAAG</text>
<rect x="90" y="175" width="150" height="55" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="165" y="207" text-anchor="middle" class="sub" font-size="12">gebruiker</text>
<line x1="240" y1="202" x2="330" y2="202" class="arrow"/>
<rect x="340" y="175" width="150" height="55" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="415" y="207" text-anchor="middle" class="sub" font-size="12">portaal</text>
<line x1="490" y1="202" x2="580" y2="202" class="arrow"/>
<rect x="590" y="175" width="150" height="55" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="665" y="207" text-anchor="middle" class="sub" font-size="12">gateway</text>

<circle cx="740" cy="260" r="10" fill="#E8A020"/>
<text x="765" y="264" class="sub" fill="#8A5A0E" font-size="11">Caspars incident: precies op de overgang</text>

<rect x="60" y="290" width="840" height="130" rx="8" fill="#0D1B2A"/>
<text x="80" y="315" class="label-light" font-size="12">ASYNCHRONE LAAG</text>
<rect x="90" y="335" width="150" height="55" rx="6" fill="#1A4F8B"/>
<text x="165" y="367" text-anchor="middle" class="label-light" font-size="12">KERN</text>
<line x1="240" y1="362" x2="330" y2="362" stroke="#8AAFD4" stroke-width="2" marker-end="url(#arrb)"/>
<rect x="340" y="335" width="150" height="55" rx="6" fill="#1A4F8B"/>
<text x="415" y="360" text-anchor="middle" class="label-light" font-size="11">externe</text>
<text x="415" y="376" text-anchor="middle" class="label-light" font-size="11">administrateur</text>
<line x1="490" y1="362" x2="580" y2="362" stroke="#8AAFD4" stroke-width="2" marker-end="url(#arrb)"/>
<rect x="590" y="335" width="150" height="55" rx="6" fill="#1A4F8B"/>
<text x="665" y="360" text-anchor="middle" class="label-light" font-size="11">Nabestaanden-</text>
<text x="665" y="376" text-anchor="middle" class="label-light" font-size="11">loket</text>

<text x="480" y="470" text-anchor="middle" class="sub" fill="#8A5A0E">de keuze ligt per koppeling, niet per systeem</text>
</svg>
