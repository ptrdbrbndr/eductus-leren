<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="'DM Sans', Arial, sans-serif" width="960" height="480" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:13px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563A8"/></marker>
</defs>
<rect width="960" height="480" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 1 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Een keten erft haar traagste schakel</text>
<text x="40" y="96" class="sub">Elke synchrone pijl wacht op de volgende — de onzekerheid stapelt zich op.</text>

<rect x="60" y="180" width="180" height="70" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="150" y="220" text-anchor="middle" class="label" font-size="13">Werkgeversportaal</text>

<line x1="240" y1="215" x2="380" y2="215" class="arrow"/>
<text x="310" y="200" text-anchor="middle" class="sub" font-size="11">sync, ~200ms</text>

<rect x="390" y="180" width="180" height="70" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="480" y="220" text-anchor="middle" class="label" font-size="13">KERN</text>

<line x1="570" y1="215" x2="710" y2="215" class="arrow"/>
<text x="640" y="200" text-anchor="middle" class="sub" fill="#9A5F0D" font-weight="700" font-size="11">sync, 0,5–40s</text>

<rect x="720" y="180" width="180" height="70" rx="8" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
<text x="810" y="212" text-anchor="middle" class="label" font-size="12">Externe pensioen-</text>
<text x="810" y="230" text-anchor="middle" class="label" font-size="12">administrateur</text>

<rect x="60" y="300" width="840" height="70" rx="8" fill="#14213D"/>
<text x="480" y="330" text-anchor="middle" class="label-light">Wachttijd van het portaal = som van alle schakels — inclusief de onvoorspelbaarste</text>
<text x="480" y="352" text-anchor="middle" class="sub" fill="#DFDCD3" font-size="11">Caspars incident ontstond niet in één schakel, maar in de optelling ervan</text>

<text x="480" y="420" text-anchor="middle" class="sub" fill="#9A5F0D">een dertig-secondentimeout op het portaal was nooit voor deze keten bedacht</text>
</svg>
