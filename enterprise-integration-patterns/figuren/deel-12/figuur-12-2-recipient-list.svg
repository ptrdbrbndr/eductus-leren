<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'DM Sans', Arial, sans-serif" width="960" height="460" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:12px; font-weight:700; fill:#14213D; }
      .label-light { font-size:12px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:11px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563A8"/></marker>
</defs>
<rect width="960" height="460" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 12 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">De recipient list als vertakkingscomponent</text>
<text x="40" y="96" class="sub">De bestemmingslijst wordt berekend — niet vooraf vastgelegd.</text>

<rect x="60" y="180" width="160" height="60" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="140" y="215" text-anchor="middle" class="label" font-size="11">inkomend bericht</text>
<line x1="220" y1="210" x2="300" y2="210" class="arrow"/>

<rect x="310" y="160" width="220" height="100" rx="8" fill="#2563A8"/>
<text x="420" y="190" text-anchor="middle" class="label-light">recipient list</text>
<text x="420" y="215" text-anchor="middle" class="sub" fill="#DFDCD3" font-size="10">berekent bestemmingen op basis van</text>
<text x="420" y="232" text-anchor="middle" class="sub" fill="#DFDCD3" font-size="10">bedrag + uitkeringsstatus</text>

<line x1="530" y1="185" x2="650" y2="90" class="arrow"/>
<line x1="530" y1="200" x2="650" y2="160" class="arrow"/>
<line x1="530" y1="215" x2="650" y2="230" class="arrow"/>
<line x1="530" y1="230" x2="650" y2="300" class="arrow"/>
<line x1="530" y1="245" x2="650" y2="370" class="arrow"/>

<rect x="660" y="65" width="230" height="46" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/><text x="775" y="93" text-anchor="middle" class="sub" font-size="10.5">salarisadministratie</text>
<rect x="660" y="135" width="230" height="46" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/><text x="775" y="163" text-anchor="middle" class="sub" font-size="10.5">deelnemersadministratie</text>
<rect x="660" y="205" width="230" height="46" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/><text x="775" y="233" text-anchor="middle" class="sub" font-size="10.5">KERN</text>
<rect x="660" y="275" width="230" height="46" rx="6" fill="#FBFAF7" stroke="#E9A13B" stroke-width="2" stroke-dasharray="4 3"/><text x="775" y="303" text-anchor="middle" class="sub" fill="#9A5F0D" font-size="10.5">uitkeringsmodule — variabel</text>
<rect x="660" y="345" width="230" height="46" rx="6" fill="#FBFAF7" stroke="#E9A13B" stroke-width="2" stroke-dasharray="4 3"/><text x="775" y="373" text-anchor="middle" class="sub" fill="#9A5F0D" font-size="10.5">externe administrateur — variabel</text>

<text x="480" y="430" text-anchor="middle" class="sub" fill="#9A5F0D">het aantal uitgaande pijlen staat niet vast — de lijst zelf is het resultaat van de berekening</text>
</svg>
