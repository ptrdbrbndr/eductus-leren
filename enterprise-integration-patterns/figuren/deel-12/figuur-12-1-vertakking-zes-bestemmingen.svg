<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="'DM Sans', Arial, sans-serif" width="960" height="520" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:12px; font-weight:700; fill:#0D1B2A; }
      .sub { font-size:11px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-d { stroke:#E8A020; stroke-width:2; stroke-dasharray:4 3; fill:none; marker-end:url(#arra); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1A4F8B"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#E8A020"/></marker>
</defs>
<rect width="960" height="520" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 12 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Eén bericht, zes mogelijke bestemmingen</text>
<text x="40" y="96" class="sub">Drie voorwaardelijke takken, drie takken die altijd meegaan.</text>

<rect x="60" y="240" width="180" height="60" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="150" y="275" text-anchor="middle" class="label" font-size="11">salariscorrectie-bericht</text>
<line x1="240" y1="270" x2="320" y2="270" class="arrow"/>
<polygon points="320,230 400,270 320,310 240,270" fill="#8AAFD4" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="320" y="274" text-anchor="middle" class="label" font-size="10">vertakking</text>

<line x1="400" y1="245" x2="620" y2="60" class="arrow-d"/>
<rect x="630" y="35" width="230" height="46" rx="6" fill="#FFFFFF" stroke="#E8A020" stroke-width="2"/>
<text x="745" y="63" text-anchor="middle" class="sub" fill="#8A5A0E" font-size="11">KERN — indien &gt; €10.000</text>

<line x1="400" y1="255" x2="620" y2="130" class="arrow"/>
<rect x="630" y="105" width="230" height="46" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="745" y="133" text-anchor="middle" class="sub" font-size="11">salarisadministratie — altijd</text>

<line x1="400" y1="265" x2="620" y2="200" class="arrow-d"/>
<rect x="630" y="175" width="230" height="46" rx="6" fill="#FFFFFF" stroke="#E8A020" stroke-width="2"/>
<text x="745" y="203" text-anchor="middle" class="sub" fill="#8A5A0E" font-size="11">uitkeringsmodule — indien lopende uitkering</text>

<line x1="400" y1="275" x2="620" y2="270" class="arrow"/>
<rect x="630" y="245" width="230" height="46" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="745" y="273" text-anchor="middle" class="sub" font-size="11">deelnemersadministratie — altijd</text>

<line x1="400" y1="285" x2="620" y2="340" class="arrow-d"/>
<rect x="630" y="315" width="230" height="46" rx="6" fill="#FFFFFF" stroke="#E8A020" stroke-width="2"/>
<text x="745" y="343" text-anchor="middle" class="sub" fill="#8A5A0E" font-size="11">externe administrateur — indien &gt; €10.000</text>

<line x1="400" y1="295" x2="620" y2="410" class="arrow"/>
<rect x="630" y="385" width="230" height="46" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="745" y="413" text-anchor="middle" class="sub" font-size="11">audit-trail — altijd</text>

<text x="480" y="480" text-anchor="middle" class="sub" fill="#8A5A0E">niet elk bericht raakt elke bestemming — de voorwaarde bepaalt de vertakking, niet het berichttype</text>
</svg>
