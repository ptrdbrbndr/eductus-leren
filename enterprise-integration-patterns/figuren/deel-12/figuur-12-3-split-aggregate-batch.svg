<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'DM Sans', Arial, sans-serif" width="960" height="460" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:12px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:12px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:11px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1A4F8B"/></marker>
</defs>
<rect width="960" height="460" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 12 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Splitsen, verwerken, weer samenvoegen</text>
<text x="40" y="96" class="sub">Eén batch van 200 correcties door de volledige keten, en terug tot één resultaat.</text>

<rect x="30" y="190" width="110" height="60" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="85" y="215" text-anchor="middle" class="label" font-size="10">batch</text>
<text x="85" y="232" text-anchor="middle" class="sub" font-size="9.5">200 correcties</text>
<line x1="140" y1="220" x2="200" y2="220" class="arrow"/>

<polygon points="200,190 250,220 200,250 150,220" fill="#8AAFD4" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="200" y="224" text-anchor="middle" class="label" font-size="9">splitter</text>

<line x1="250" y1="205" x2="330" y2="150" class="arrow"/>
<line x1="250" y1="220" x2="330" y2="220" class="arrow"/>
<line x1="250" y1="235" x2="330" y2="290" class="arrow"/>
<text x="290" y="130" class="sub" font-size="10">200×</text>

<rect x="335" y="130" width="90" height="40" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/><text x="380" y="154" text-anchor="middle" class="sub" font-size="9.5">router</text>
<rect x="335" y="200" width="90" height="40" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/><text x="380" y="224" text-anchor="middle" class="sub" font-size="9.5">translator</text>
<rect x="335" y="270" width="90" height="40" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/><text x="380" y="294" text-anchor="middle" class="sub" font-size="8.5">recipient list</text>

<line x1="425" y1="150" x2="520" y2="200" class="arrow"/>
<line x1="425" y1="220" x2="520" y2="215" class="arrow"/>
<line x1="425" y1="290" x2="520" y2="230" class="arrow"/>

<rect x="525" y="150" width="130" height="130" rx="8" fill="#1A4F8B"/>
<text x="590" y="205" text-anchor="middle" class="label-light" font-size="12">aggregator</text>
<text x="590" y="225" text-anchor="middle" class="sub" fill="#E4E1D8" font-size="9.5">wacht op alle 200</text>
<text x="590" y="240" text-anchor="middle" class="sub" fill="#E4E1D8" font-size="9.5">(tellen-strategie)</text>

<line x1="655" y1="215" x2="740" y2="215" class="arrow"/>
<rect x="750" y="185" width="180" height="60" rx="8" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>
<text x="840" y="212" text-anchor="middle" class="sub" fill="#8A5A0E" font-size="10.5">één resultaatbericht</text>
<text x="840" y="230" text-anchor="middle" class="sub" fill="#8A5A0E" font-size="10.5">terug naar werkgever</text>

<text x="480" y="400" text-anchor="middle" class="sub" fill="#8A5A0E">de werkgever ziet nooit 200 losse berichten — alleen de samenvatting die eruit ontstaat</text>
</svg>
