<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="'DM Sans', Arial, sans-serif" width="960" height="420" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:13px; font-weight:700; fill:#0D1B2A; }
      .sub { font-size:12px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
    </style>
</defs>
<rect width="960" height="420" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 9 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">214 berichten, drie maanden, niemand keek</text>
<text x="40" y="96" class="sub">Een wachtrij die stil groeit, is geen incident totdat iemand ernaar zoekt.</text>

<rect x="120" y="150" width="140" height="110" rx="6" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>
<text x="190" y="140" text-anchor="middle" class="label" fill="#8A5A0E" font-size="20">214</text>
<circle cx="150" cy="175" r="4" fill="#5B6675" fill-opacity="0.3"/>
<circle cx="175" cy="165" r="6" fill="#5B6675" fill-opacity="0.3"/>
<circle cx="200" cy="180" r="5" fill="#5B6675" fill-opacity="0.3"/>
<circle cx="225" cy="170" r="7" fill="#5B6675" fill-opacity="0.25"/>
<circle cx="160" cy="200" r="8" fill="#5B6675" fill-opacity="0.2"/>
<circle cx="220" cy="210" r="6" fill="#5B6675" fill-opacity="0.2"/>
<text x="190" y="240" text-anchor="middle" class="sub" fill="#8A5A0E">dead letter channel</text>

<line x1="330" y1="200" x2="900" y2="200" stroke="#1A4F8B" stroke-width="2"/>
<circle cx="380" cy="200" r="6" fill="#1A4F8B"/><text x="380" y="185" text-anchor="middle" class="sub" font-size="10">maand 1</text>
<circle cx="600" cy="200" r="6" fill="#1A4F8B"/><text x="600" y="185" text-anchor="middle" class="sub" font-size="10">maand 2</text>
<circle cx="820" cy="200" r="6" fill="#1A4F8B"/><text x="820" y="185" text-anchor="middle" class="sub" font-size="10">maand 3</text>
<text x="600" y="230" text-anchor="middle" class="sub" fill="#8A5A0E">niemand keek</text>

<text x="480" y="340" text-anchor="middle" class="sub" fill="#8A5A0E">een wachtrij zonder monitoring is een gebeurtenis die wacht om ontdekt te worden</text>
</svg>
