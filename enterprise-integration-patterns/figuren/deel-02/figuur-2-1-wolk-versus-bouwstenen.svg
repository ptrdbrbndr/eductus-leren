<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="'DM Sans', Arial, sans-serif" width="960" height="480" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .sub { font-size:12px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#55606F"/></marker>
</defs>
<rect width="960" height="480" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 2 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Caspars whiteboard</text>
<text x="40" y="96" class="sub">"Messaging" is geen ding — het zijn drie afzonderlijke bouwstenen.</text>

<ellipse cx="190" cy="230" rx="130" ry="90" fill="#CBDCEF" stroke="#2563A8" stroke-width="1.5"/>
<text x="190" y="220" text-anchor="middle" class="label" font-size="15">"messaging"</text>
<text x="190" y="245" text-anchor="middle" class="sub" font-size="11">— één vage wolk</text>

<line x1="360" y1="230" x2="440" y2="230" class="arrow"/>
<text x="400" y="215" text-anchor="middle" class="sub" font-size="11">ontrafeld</text>

<rect x="460" y="140" width="150" height="80" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="535" y="175" text-anchor="middle" class="label" font-size="13">Bericht</text>
<text x="535" y="196" text-anchor="middle" class="sub" font-size="10">de eenheid die verstuurd wordt</text>

<rect x="640" y="140" width="150" height="80" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="715" y="175" text-anchor="middle" class="label" font-size="13">Kanaal</text>
<text x="715" y="196" text-anchor="middle" class="sub" font-size="10">waar het bericht op staat</text>

<rect x="550" y="280" width="150" height="80" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="625" y="315" text-anchor="middle" class="label" font-size="13">Endpoint</text>
<text x="625" y="336" text-anchor="middle" class="sub" font-size="10">wie zendt of ontvangt</text>

<text x="480" y="430" text-anchor="middle" class="sub" fill="#9A5F0D">drie losse begrippen, elk met een eigen rol — geen synoniemen</text>
</svg>
