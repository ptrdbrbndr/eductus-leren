<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="'DM Sans', Arial, sans-serif" width="960" height="480" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:12px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
    </style>
</defs>
<rect width="960" height="480" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 2 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Anatomie van een bericht</text>
<text x="40" y="96" class="sub">Header boven payload — plus drie berichtstypen als varianten van dezelfde vorm.</text>

<rect x="60" y="130" width="560" height="90" rx="8" fill="#1A4F8B"/>
<text x="80" y="155" class="label-light">HEADER</text>
<text x="80" y="178" class="label-light" font-size="11">herkomst</text>
<text x="230" y="178" class="label-light" font-size="11">type</text>
<text x="340" y="178" class="label-light" font-size="11">correlatie-ID</text>
<text x="500" y="178" class="label-light" font-size="11">timestamp</text>
<text x="80" y="200" class="sub" fill="#C5D8F0" font-size="10">metadata over het bericht, niet de inhoud zelf</text>

<rect x="60" y="230" width="560" height="90" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="80" y="255" class="label" font-size="13">PAYLOAD</text>
<text x="80" y="280" class="sub" font-size="11">de daadwerkelijke inhoud — bijv. de dienstverbandmutatie zelf</text>

<rect x="660" y="130" width="240" height="55" rx="6" fill="#C5D8F0" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="780" y="163" text-anchor="middle" class="label" font-size="12">Command message</text>
<rect x="660" y="200" width="240" height="55" rx="6" fill="#8AAFD4" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="780" y="233" text-anchor="middle" class="label" font-size="12">Document message</text>
<rect x="660" y="270" width="240" height="55" rx="6" fill="#1A4F8B" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="780" y="303" text-anchor="middle" class="label-light" font-size="12">Event message</text>

<text x="480" y="400" text-anchor="middle" class="sub" fill="#8A5A0E">zelfde envelop, drie bedoelingen — command doet iets, document draagt iets, event meldt iets</text>
</svg>
