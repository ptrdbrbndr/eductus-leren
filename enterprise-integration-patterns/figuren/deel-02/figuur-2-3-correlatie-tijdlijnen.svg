<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="'DM Sans', Arial, sans-serif" width="960" height="480" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:13px; font-weight:700; fill:#0D1B2A; }
      .sub { font-size:12px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-d { stroke:#E8A020; stroke-width:2; stroke-dasharray:4 3; fill:none; marker-end:url(#arra); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1A4F8B"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#E8A020"/></marker>
</defs>
<rect width="960" height="480" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 2 · TIJDLIJN</text>
<text x="40" y="64" class="title">Verzonden in volgorde, teruggekomen door elkaar</text>
<text x="40" y="96" class="sub">Alleen de correlatie-ID's koppelen antwoord aan vraag correct.</text>

<text x="60" y="140" class="label" font-size="12">Portaal → KERN</text>
<line x1="60" y1="160" x2="900" y2="160" stroke="#1A4F8B" stroke-width="2"/>
<circle cx="150" cy="160" r="7" fill="#1A4F8B"/><text x="150" y="185" text-anchor="middle" class="sub" font-size="11">M1 (id-A)</text>
<circle cx="350" cy="160" r="7" fill="#1A4F8B"/><text x="350" y="185" text-anchor="middle" class="sub" font-size="11">M2 (id-B)</text>
<circle cx="550" cy="160" r="7" fill="#1A4F8B"/><text x="550" y="185" text-anchor="middle" class="sub" font-size="11">M3 (id-C)</text>

<text x="60" y="260" class="label" font-size="12">KERN → Portaal</text>
<line x1="60" y1="280" x2="900" y2="280" stroke="#8AAFD4" stroke-width="2"/>
<circle cx="250" cy="280" r="7" fill="#E8A020"/><text x="250" y="305" text-anchor="middle" class="sub" font-size="11">antwoord id-C</text>
<circle cx="450" cy="280" r="7" fill="#E8A020"/><text x="450" y="305" text-anchor="middle" class="sub" font-size="11">antwoord id-A</text>
<circle cx="650" cy="280" r="7" fill="#E8A020"/><text x="650" y="305" text-anchor="middle" class="sub" font-size="11">antwoord id-B</text>

<path d="M150,167 C150,220 250,220 250,273" class="arrow-d"/>
<path d="M350,167 C350,230 450,230 450,273" class="arrow-d"/>
<path d="M550,167 C550,215 650,215 650,273" class="arrow-d"/>

<text x="480" y="400" text-anchor="middle" class="sub" fill="#8A5A0E">de aankomstvolgorde van antwoorden zegt niets over de verzendvolgorde van vragen</text>
</svg>
