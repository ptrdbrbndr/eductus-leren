<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="'DM Sans', Arial, sans-serif" width="960" height="520" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:12px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:13px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:11px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1A4F8B"/></marker>
</defs>
<rect width="960" height="520" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 11 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">De broker als centrale as</text>
<text x="40" y="96" class="sub">Elk systeem praat kanoniek — de broker routeert en levert af, zonder paarsgewijze vertaalkennis.</text>

<rect x="410" y="270" width="140" height="70" rx="8" fill="#1A4F8B"/>
<text x="480" y="310" text-anchor="middle" class="label-light" font-size="13">broker</text>

<g stroke="#1A4F8B" stroke-width="1.8" fill="none">
<line x1="480" y1="270" x2="480" y2="170"/>
<line x1="540" y1="285" x2="640" y2="220"/>
<line x1="550" y1="305" x2="700" y2="290"/>
<line x1="540" y1="325" x2="640" y2="400"/>
<line x1="480" y1="340" x2="480" y2="440"/>
<line x1="420" y1="325" x2="320" y2="400"/>
<line x1="410" y1="305" x2="260" y2="290"/>
<line x1="420" y1="285" x2="320" y2="220"/>
</g>

<g font-size="10.5">
<rect x="420" y="120" width="120" height="50" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/><text x="480" y="150" text-anchor="middle" class="label" font-size="11">Werkgevers-portaal</text>
<rect x="640" y="170" width="120" height="50" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/><text x="700" y="200" text-anchor="middle" class="label" font-size="11">KERN</text>
<rect x="700" y="265" width="140" height="50" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/><text x="770" y="295" text-anchor="middle" class="label" font-size="10.5">externe administrateur</text>
<rect x="640" y="375" width="120" height="50" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/><text x="700" y="405" text-anchor="middle" class="label" font-size="11">Nabestaan-denloket</text>
<rect x="420" y="440" width="120" height="50" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/><text x="480" y="470" text-anchor="middle" class="label" font-size="11">Wegwijzer</text>
<rect x="200" y="375" width="120" height="50" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/><text x="260" y="405" text-anchor="middle" class="label" font-size="10.5">audit-trail</text>
<rect x="140" y="265" width="140" height="50" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/><text x="210" y="295" text-anchor="middle" class="label" font-size="10.5">zelfbedienings-portaal</text>
<rect x="200" y="170" width="120" height="50" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/><text x="260" y="200" text-anchor="middle" class="label" font-size="11">HR-systeem</text>
</g>

<rect x="60" y="450" width="200" height="40" rx="6" fill="none" stroke="none"/>
<text x="480" y="500" text-anchor="middle" class="sub" fill="#8A5A0E">geen systeem hoeft ooit het dialect van een ander systeem te kennen — alleen het kanonieke</text>
</svg>
