<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'DM Sans', Arial, sans-serif" width="960" height="460" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:13px; font-weight:700; fill:#14213D; }
      .sub { font-size:12px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    </style>
</defs>
<rect width="960" height="460" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 5 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Twee koppelvlakspecificaties naast elkaar</text>
<text x="40" y="96" class="sub">Zelfde gegevens, drie gemarkeerde verschillen.</text>

<rect x="60" y="140" width="380" height="260" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="250" y="170" text-anchor="middle" class="label">KERN (intern formaat)</text>
<rect x="90" y="195" width="320" height="40" rx="4" fill="#CBDCEF"/><text x="105" y="220" class="sub" font-size="11">sleutelveld: deelnemerId</text>
<rect x="90" y="245" width="320" height="40" rx="4" fill="#CBDCEF"/><text x="105" y="270" class="sub" font-size="11">bedrag: centen (integer)</text>
<rect x="90" y="295" width="320" height="40" rx="4" fill="#CBDCEF"/><text x="105" y="320" class="sub" font-size="11">datum: ISO 8601</text>

<rect x="520" y="140" width="380" height="260" rx="8" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
<text x="710" y="170" text-anchor="middle" class="label" fill="#9A5F0D">Externe administrateur</text>
<rect x="550" y="195" width="320" height="40" rx="4" fill="#FBFAF7" stroke="#E9A13B" stroke-width="1.5"/><text x="565" y="220" class="sub" fill="#9A5F0D" font-size="11">sleutelveld: polis + geboortedatum</text>
<rect x="550" y="245" width="320" height="40" rx="4" fill="#FBFAF7" stroke="#E9A13B" stroke-width="1.5"/><text x="565" y="270" class="sub" fill="#9A5F0D" font-size="11">bedrag: decimaal (string)</text>
<rect x="550" y="295" width="320" height="40" rx="4" fill="#FBFAF7" stroke="#E9A13B" stroke-width="1.5"/><text x="565" y="320" class="sub" fill="#9A5F0D" font-size="11">datum: dd-mm-jjjj</text>

<text x="480" y="430" text-anchor="middle" class="sub" fill="#9A5F0D">drie verschillen die een directe koppeling zonder vertaling laten breken</text>
</svg>
