<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'DM Sans', Arial, sans-serif" width="960" height="460" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:13px; font-weight:700; fill:#0D1B2A; }
      .sub { font-size:12px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
    </style>
</defs>
<rect width="960" height="460" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 5 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Twee koppelvlakspecificaties naast elkaar</text>
<text x="40" y="96" class="sub">Zelfde gegevens, drie gemarkeerde verschillen.</text>

<rect x="60" y="140" width="380" height="260" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="250" y="170" text-anchor="middle" class="label">KERN (intern formaat)</text>
<rect x="90" y="195" width="320" height="40" rx="4" fill="#C5D8F0"/><text x="105" y="220" class="sub" font-size="11">sleutelveld: deelnemerId</text>
<rect x="90" y="245" width="320" height="40" rx="4" fill="#C5D8F0"/><text x="105" y="270" class="sub" font-size="11">bedrag: centen (integer)</text>
<rect x="90" y="295" width="320" height="40" rx="4" fill="#C5D8F0"/><text x="105" y="320" class="sub" font-size="11">datum: ISO 8601</text>

<rect x="520" y="140" width="380" height="260" rx="8" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>
<text x="710" y="170" text-anchor="middle" class="label" fill="#8A5A0E">Externe administrateur</text>
<rect x="550" y="195" width="320" height="40" rx="4" fill="#F5F4F0" stroke="#E8A020" stroke-width="1.5"/><text x="565" y="220" class="sub" fill="#8A5A0E" font-size="11">sleutelveld: polis + geboortedatum</text>
<rect x="550" y="245" width="320" height="40" rx="4" fill="#F5F4F0" stroke="#E8A020" stroke-width="1.5"/><text x="565" y="270" class="sub" fill="#8A5A0E" font-size="11">bedrag: decimaal (string)</text>
<rect x="550" y="295" width="320" height="40" rx="4" fill="#F5F4F0" stroke="#E8A020" stroke-width="1.5"/><text x="565" y="320" class="sub" fill="#8A5A0E" font-size="11">datum: dd-mm-jjjj</text>

<text x="480" y="430" text-anchor="middle" class="sub" fill="#8A5A0E">drie verschillen die een directe koppeling zonder vertaling laten breken</text>
</svg>
