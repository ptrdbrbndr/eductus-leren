<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'DM Sans', Arial, sans-serif" width="960" height="460" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:12px; font-weight:700; fill:#14213D; }
      .label-light { font-size:13px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:11px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563A8"/></marker>
</defs>
<rect width="960" height="460" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 5 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Drie bronnen, één kanoniek kanaal</text>
<text x="40" y="96" class="sub">Elke bron heeft een eigen translator; KERN ziet maar één formaat.</text>

<rect x="60" y="130" width="200" height="55" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="160" y="162" text-anchor="middle" class="label">Werkgeversportaal</text>
<rect x="60" y="210" width="200" height="55" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="160" y="242" text-anchor="middle" class="label">csv-batchupload</text>
<rect x="60" y="290" width="200" height="55" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="160" y="322" text-anchor="middle" class="label">Zelfbedieningsportaal</text>

<rect x="290" y="130" width="120" height="55" rx="6" fill="#6FA3D6"/><text x="350" y="162" text-anchor="middle" class="label-light" font-size="11">translator</text>
<rect x="290" y="210" width="120" height="55" rx="6" fill="#6FA3D6"/><text x="350" y="242" text-anchor="middle" class="label-light" font-size="11">translator</text>
<rect x="290" y="290" width="120" height="55" rx="6" fill="#6FA3D6"/><text x="350" y="322" text-anchor="middle" class="label-light" font-size="11">translator</text>

<line x1="410" y1="157" x2="600" y2="240" class="arrow"/>
<line x1="410" y1="237" x2="600" y2="240" class="arrow"/>
<line x1="410" y1="317" x2="600" y2="240" class="arrow"/>

<rect x="610" y="205" width="290" height="70" rx="8" fill="#2563A8"/>
<text x="755" y="235" text-anchor="middle" class="label-light">kanoniek mutatiekanaal</text>
<text x="755" y="255" text-anchor="middle" class="sub" fill="#CBDCEF" font-size="10">richting KERN</text>

<text x="480" y="400" text-anchor="middle" class="sub" fill="#9A5F0D">KERN spreekt één taal — de vertaling zit bij de bronnen, niet bij de ontvanger</text>
</svg>
