<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="'DM Sans', Arial, sans-serif" width="960" height="420" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:13px; font-weight:700; fill:#14213D; }
      .label-light { font-size:13px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563A8"/></marker>
</defs>
<rect width="960" height="420" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 5 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">De translator als tussenkomponent</text>
<text x="40" y="96" class="sub">Een expliciete vertaaltabel, niet twee systemen die elkaars formaat kennen.</text>

<rect x="60" y="160" width="170" height="60" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="145" y="196" text-anchor="middle" class="label" font-size="13">KERN</text>

<line x1="230" y1="190" x2="360" y2="190" class="arrow"/>

<rect x="370" y="140" width="220" height="240" rx="8" fill="#2563A8"/>
<text x="480" y="170" text-anchor="middle" class="label-light">Translator</text>
<rect x="390" y="190" width="180" height="40" rx="4" fill="#FBFAF7"/><text x="480" y="215" text-anchor="middle" class="sub" font-size="10">deelnemerId ↔ polis+geboortedatum</text>
<rect x="390" y="240" width="180" height="40" rx="4" fill="#FBFAF7"/><text x="480" y="265" text-anchor="middle" class="sub" font-size="10">centen ↔ decimaal bedrag</text>
<rect x="390" y="290" width="180" height="40" rx="4" fill="#FBFAF7"/><text x="480" y="315" text-anchor="middle" class="sub" font-size="10">ISO 8601 ↔ dd-mm-jjjj</text>

<line x1="590" y1="190" x2="720" y2="190" class="arrow"/>

<rect x="730" y="160" width="170" height="60" rx="8" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
<text x="815" y="188" text-anchor="middle" class="label" font-size="11" fill="#9A5F0D">externe</text>
<text x="815" y="205" text-anchor="middle" class="label" font-size="11" fill="#9A5F0D">administrateur</text>

<text x="480" y="400" text-anchor="middle" class="sub" fill="#9A5F0D">de vertaling zit op één plek, niet verspreid over beide kanten</text>
</svg>
