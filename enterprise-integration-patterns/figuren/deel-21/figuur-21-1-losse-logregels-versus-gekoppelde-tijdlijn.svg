<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="'DM Sans', Arial, sans-serif" width="960" height="480" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:11px; font-weight:700; fill:#0D1B2A; }
      .sub { font-size:10.5px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .panel-title { font-size:13px; font-weight:700; fill:#8A5A0E; }
    </style>
</defs>
<rect width="960" height="480" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 21 · TIJDLIJN</text>
<text x="40" y="64" class="title">Zeven logregels, of één verhaal</text>
<text x="40" y="96" class="sub">Dezelfde drie uur, twee manieren om ernaar te kijken.</text>

<text x="230" y="135" text-anchor="middle" class="panel-title">zeven losse logregels, drie uur uiteen</text>
<g font-size="9.5">
<rect x="60" y="150" width="340" height="24" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1"/><text x="70" y="167" class="sub" font-size="9.5">09:02 portaal.log — mutatie 48213 ontvangen</text>
<rect x="60" y="180" width="340" height="24" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1"/><text x="70" y="197" class="sub" font-size="9.5">09:14 gateway.log — doorgestuurd naar router</text>
<rect x="60" y="210" width="340" height="24" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1"/><text x="70" y="227" class="sub" font-size="9.5">09:41 router.log — geen match, fallback</text>
<rect x="60" y="240" width="340" height="24" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1"/><text x="70" y="257" class="sub" font-size="9.5">10:20 translator.log — vertaling voltooid</text>
<rect x="60" y="270" width="340" height="24" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1"/><text x="70" y="287" class="sub" font-size="9.5">10:55 KERN.log — mutatie verwerkt</text>
<rect x="60" y="300" width="340" height="24" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1"/><text x="70" y="317" class="sub" font-size="9.5">11:30 administrateur.log — bevestiging ontvangen</text>
<rect x="60" y="330" width="340" height="24" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1"/><text x="70" y="347" class="sub" font-size="9.5">12:05 audit.log — afgerond</text>
</g>
<text x="230" y="390" text-anchor="middle" class="sub" fill="#8A5A0E" font-size="10.5">pas na handmatig speurwerk blijkt het één verhaal</text>

<line x1="480" y1="130" x2="480" y2="440" stroke="#C9C4B8" stroke-width="1"/>

<text x="730" y="135" text-anchor="middle" class="panel-title">dezelfde gebeurtenissen, één gekoppelde tijdlijn</text>
<line x1="560" y1="230" x2="920" y2="230" stroke="#1A4F8B" stroke-width="2"/>
<circle cx="580" cy="230" r="6" fill="#1A4F8B"/>
<circle cx="630" cy="230" r="6" fill="#1A4F8B"/>
<circle cx="680" cy="230" r="6" fill="#1A4F8B"/>
<circle cx="730" cy="230" r="6" fill="#1A4F8B"/>
<circle cx="790" cy="230" r="6" fill="#1A4F8B"/>
<circle cx="850" cy="230" r="6" fill="#1A4F8B"/>
<circle cx="900" cy="230" r="6" fill="#1A4F8B"/>
<text x="730" y="260" text-anchor="middle" class="sub" font-size="10">alle zeven gekoppeld via één correlatie-ID</text>
<text x="730" y="390" text-anchor="middle" class="sub" fill="#8A5A0E" font-size="10.5">observability is niet meer logs verzamelen — het is ze aan elkaar knopen</text>
</svg>
