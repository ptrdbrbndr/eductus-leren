<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'DM Sans', Arial, sans-serif" width="960" height="460" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .sub { font-size:12px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    </style>
</defs>
<rect width="960" height="460" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 6 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Point-to-point versus publish-subscribe</text>
<text x="40" y="96" class="sub">Eén vaste ontvanger tegenover meerdere, elk met eigen vragen.</text>

<rect x="50" y="130" width="410" height="290" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="255" y="160" text-anchor="middle" class="label">Point-to-point</text>
<rect x="75" y="185" width="360" height="40" rx="4" fill="#CBDCEF"/><text x="90" y="210" class="sub" font-size="11">één ontvanger</text>
<rect x="75" y="235" width="360" height="40" rx="4" fill="#CBDCEF"/><text x="90" y="260" class="sub" font-size="11">geen abonneegeschiedenis</text>
<rect x="75" y="285" width="360" height="40" rx="4" fill="#CBDCEF"/><text x="90" y="310" class="sub" font-size="11">geen ordeningsvraagstuk tussen ontvangers</text>

<rect x="500" y="130" width="410" height="290" rx="8" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
<text x="705" y="160" text-anchor="middle" class="label" fill="#9A5F0D">Publish-subscribe</text>
<rect x="525" y="185" width="360" height="40" rx="4" fill="#FBFAF7" stroke="#E9A13B" stroke-width="1.5"/><text x="540" y="210" class="sub" fill="#9A5F0D" font-size="11">meerdere ontvangers</text>
<rect x="525" y="235" width="360" height="40" rx="4" fill="#FBFAF7" stroke="#E9A13B" stroke-width="1.5"/><text x="540" y="260" class="sub" fill="#9A5F0D" font-size="11">elk met een eigen antwoord op "sinds wanneer luister ik"</text>
<rect x="525" y="285" width="360" height="40" rx="4" fill="#FBFAF7" stroke="#E9A13B" stroke-width="1.5"/><text x="540" y="310" class="sub" fill="#9A5F0D" font-size="11">en "wat als ik gemist heb"</text>

<text x="480" y="400" text-anchor="middle" class="sub" fill="#9A5F0D">de rapportagetabel is een abonnee die te laat begon te luisteren</text>
</svg>
