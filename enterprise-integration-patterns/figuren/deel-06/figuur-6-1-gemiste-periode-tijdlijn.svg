<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="'DM Sans', Arial, sans-serif" width="960" height="420" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:13px; font-weight:700; fill:#0D1B2A; }
      .sub { font-size:12px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
    </style>
</defs>
<rect width="960" height="420" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 6 · TIJDLIJN</text>
<text x="40" y="64" class="title">Van maandag tot donderdag</text>
<text x="40" y="96" class="sub">De rapportagetabel sluit pas op donderdag aan — een hele periode werd gemist.</text>

<line x1="80" y1="220" x2="900" y2="220" stroke="#1A4F8B" stroke-width="2"/>
<circle cx="180" cy="220" r="8" fill="#1A4F8B"/><text x="180" y="200" text-anchor="middle" class="sub">ma</text>
<circle cx="380" cy="220" r="8" fill="#1A4F8B"/><text x="380" y="200" text-anchor="middle" class="sub">di</text>
<circle cx="580" cy="220" r="8" fill="#1A4F8B"/><text x="580" y="200" text-anchor="middle" class="sub">wo</text>
<circle cx="780" cy="220" r="10" fill="#E8A020"/><text x="780" y="200" text-anchor="middle" class="sub" fill="#8A5A0E" font-weight="700">do</text>

<rect x="140" y="245" width="80" height="30" rx="4" fill="#C5D8F0"/><text x="180" y="266" text-anchor="middle" class="sub" font-size="10">mutatie</text>
<rect x="340" y="245" width="80" height="30" rx="4" fill="#C5D8F0"/><text x="380" y="266" text-anchor="middle" class="sub" font-size="10">mutatie</text>
<rect x="540" y="245" width="80" height="30" rx="4" fill="#C5D8F0"/><text x="580" y="266" text-anchor="middle" class="sub" font-size="10">mutatie</text>

<rect x="150" y="150" width="600" height="40" rx="6" fill="#F5F4F0" stroke="#E8A020" stroke-width="2" stroke-dasharray="5 4"/>
<text x="450" y="175" text-anchor="middle" class="sub" fill="#8A5A0E" font-weight="700">gemiste periode — rapportagetabel leest nog niets</text>

<rect x="700" y="245" width="160" height="30" rx="4" fill="#E8A020"/><text x="780" y="266" text-anchor="middle" class="sub" fill="#0D1B2A" font-size="10">tabel sluit nu pas aan</text>

<text x="480" y="360" text-anchor="middle" class="sub" fill="#8A5A0E">point-to-point levert alles precies één keer af — maar alleen aan wie op dat moment luisterde</text>
</svg>
