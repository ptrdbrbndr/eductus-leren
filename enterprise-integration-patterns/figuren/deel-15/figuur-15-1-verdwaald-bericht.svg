<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'DM Sans', Arial, sans-serif" width="960" height="460" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:11px; font-weight:700; fill:#0D1B2A; }
      .sub { font-size:11px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1A4F8B"/></marker>
</defs>
<rect width="960" height="460" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 15 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Een bericht dat ergens onderweg verdwijnt</text>
<text x="40" y="96" class="sub">Zonder zicht op de keten kost het zoeken drie dagen aan losse logs en telefoontjes.</text>

<g font-size="9.5">
<rect x="40" y="160" width="95" height="50" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/><text x="87" y="188" text-anchor="middle" class="label" font-size="9.5">Portaal</text>
<rect x="150" y="160" width="95" height="50" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/><text x="197" y="188" text-anchor="middle" class="label" font-size="9.5">Gateway</text>
<rect x="260" y="160" width="95" height="50" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/><text x="307" y="188" text-anchor="middle" class="label" font-size="9.5">Router</text>
<rect x="370" y="160" width="95" height="50" rx="6" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/><text x="417" y="182" text-anchor="middle" class="label" font-size="9">Translator</text>
<text x="417" y="197" text-anchor="middle" class="sub" fill="#8A5A0E" font-size="8.5">bericht verdwijnt hier</text>
<rect x="480" y="160" width="95" height="50" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5" stroke-dasharray="3 2"/><text x="527" y="188" text-anchor="middle" class="label" font-size="9.5">KERN</text>
<rect x="590" y="160" width="95" height="50" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5" stroke-dasharray="3 2"/><text x="637" y="188" text-anchor="middle" class="label" font-size="8.5">Administrateur</text>
<rect x="700" y="160" width="95" height="50" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5" stroke-dasharray="3 2"/><text x="747" y="188" text-anchor="middle" class="label" font-size="8">Nabestaanden-loket</text>
<rect x="810" y="160" width="95" height="50" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5" stroke-dasharray="3 2"/><text x="857" y="188" text-anchor="middle" class="label" font-size="9.5">Wegwijzer</text>
</g>
<line x1="135" y1="185" x2="150" y2="185" class="arrow"/>
<line x1="245" y1="185" x2="260" y2="185" class="arrow"/>
<line x1="355" y1="185" x2="370" y2="185" class="arrow"/>
<line x1="465" y1="185" x2="480" y2="185" stroke="#E8A020" stroke-width="2" stroke-dasharray="2 3"/>
<text x="472" y="175" text-anchor="middle" fill="#8A5A0E" font-size="14">✕</text>

<rect x="60" y="260" width="840" height="150" rx="8" fill="#0D1B2A"/>
<text x="480" y="288" text-anchor="middle" class="sub" fill="#F5F4F0" font-weight="700" font-size="11">drie dagen speurwerk</text>
<text x="100" y="315" class="sub" fill="#C9C4B8" font-size="10">— logbestand portaal doorzocht (geen match)</text>
<text x="100" y="335" class="sub" fill="#C9C4B8" font-size="10">— telefoontje naar gatewaybeheerder</text>
<text x="100" y="355" class="sub" fill="#C9C4B8" font-size="10">— terminal-sessie op translator, handmatig grep</text>
<text x="100" y="375" class="sub" fill="#C9C4B8" font-size="10">— e-mail naar KERN-team: "hebben jullie dit gezien?"</text>

<text x="480" y="435" text-anchor="middle" class="sub" fill="#8A5A0E">niemand had één plek om de reis van het bericht te volgen</text>
</svg>
