<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="'DM Sans', Arial, sans-serif" width="960" height="420" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:12px; font-weight:700; fill:#0D1B2A; }
      .sub { font-size:11px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#1A4F8B; stroke-width:2.5; fill:none; marker-end:url(#arrb); }
      .arrow-thin { stroke:#E8A020; stroke-width:1.5; fill:none; marker-end:url(#arra); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1A4F8B"/></marker>
    <marker id="arra" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E8A020"/></marker>
</defs>
<rect width="960" height="420" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 15 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">De wire tap</text>
<text x="40" y="96" class="sub">De hoofdstroom merkt er niets van — de kopie gaat er stilletjes naast.</text>

<rect x="80" y="200" width="180" height="60" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="170" y="235" text-anchor="middle" class="label" font-size="11">Werkgeversportaal</text>
<line x1="260" y1="230" x2="400" y2="230" class="arrow"/>
<circle cx="330" cy="230" r="6" fill="#E8A020"/>
<rect x="700" y="200" width="180" height="60" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="790" y="235" text-anchor="middle" class="label" font-size="11">KERN</text>
<line x1="410" y1="230" x2="700" y2="230" class="arrow"/>

<line x1="330" y1="236" x2="330" y2="330" class="arrow-thin"/>
<rect x="220" y="330" width="220" height="60" rx="8" fill="#F5F4F0" stroke="#E8A020" stroke-width="2"/>
<text x="330" y="356" text-anchor="middle" class="sub" fill="#8A5A0E" font-size="10.5">centraal traceersysteem</text>
<text x="330" y="374" text-anchor="middle" class="sub" fill="#8A5A0E" font-size="9.5">kopie: alleen headers</text>

<text x="480" y="150" text-anchor="middle" class="sub" font-size="11">hoofdstroom ononderbroken</text>

<text x="480" y="415" text-anchor="middle" class="sub" fill="#8A5A0E">geen bevestiging vereist, geen invloed op de hoofdstroom</text>
</svg>
