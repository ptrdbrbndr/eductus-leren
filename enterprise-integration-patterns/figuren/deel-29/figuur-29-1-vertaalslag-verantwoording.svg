<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'DM Sans', Arial, sans-serif" width="960" height="460" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:11.5px; font-weight:700; fill:#0D1B2A; }
      .sub { font-size:10.5px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#1A4F8B; stroke-width:2.2; fill:none; marker-end:url(#arrb); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1A4F8B"/></marker>
</defs>
<rect width="960" height="460" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 29 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Van trace-boom naar leesbaar verhaal</text>
<text x="40" y="96" class="sub">Een DNB-medewerker zit tussen twee heel verschillende vormen van hetzelfde bewijs.</text>

<circle cx="150" cy="230" r="34" fill="#FFFFFF" stroke="#0D1B2A" stroke-width="1.5"/>
<text x="150" y="234" text-anchor="middle" class="sub" font-size="9">DNB-</text>
<text x="150" y="246" text-anchor="middle" class="sub" font-size="9">medewerker</text>

<rect x="230" y="130" width="230" height="200" rx="10" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="345" y="160" text-anchor="middle" class="label" font-size="11">technische logbestanden</text>
<text x="345" y="185" text-anchor="middle" class="sub" font-size="9.5">trace-boomstructuren</text>
<g stroke="#8AAFD4" stroke-width="1">
<line x1="270" y1="210" x2="420" y2="210"/>
<line x1="290" y1="230" x2="420" y2="230"/>
<line x1="310" y1="250" x2="420" y2="250"/>
<line x1="270" y1="270" x2="420" y2="270"/>
<line x1="290" y1="290" x2="420" y2="290"/>
</g>
<text x="345" y="315" text-anchor="middle" class="sub" fill="#5B6675" font-size="9">correct, maar ondoordringbaar</text>

<line x1="470" y1="230" x2="590" y2="230" class="arrow"/>
<text x="530" y="215" text-anchor="middle" class="sub" fill="#8A5A0E" font-weight="700">vertaalslag</text>

<rect x="600" y="130" width="240" height="200" rx="10" fill="#FFFFFF" stroke="#E8A020" stroke-width="2"/>
<text x="720" y="160" text-anchor="middle" class="label" font-size="11">verantwoordingsdocument</text>
<text x="720" y="185" text-anchor="middle" class="sub" font-size="9.5">leesbaar en gestructureerd</text>
<line x1="630" y1="210" x2="810" y2="210" stroke="#E8A020" stroke-width="1"/>
<text x="720" y="235" text-anchor="middle" class="sub" font-size="9.5">wat is gebeurd</text>
<text x="720" y="255" text-anchor="middle" class="sub" font-size="9.5">waarom het is gebeurd</text>
<text x="720" y="275" text-anchor="middle" class="sub" font-size="9.5">wie erbij betrokken was</text>
<text x="720" y="315" text-anchor="middle" class="sub" fill="#8A5A0E" font-size="9">navolgbaar zonder technische kennis</text>

<text x="480" y="410" text-anchor="middle" class="sub" fill="#8A5A0E">auditability zonder vertaalslag naar leesbare taal is geen verantwoording</text>
</svg>
