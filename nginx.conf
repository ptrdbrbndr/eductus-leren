server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # Basic Auth voor de hele site — wachtwoord via BASIC_AUTH_USER/PASS env vars,
    # .htpasswd wordt bij container-start gegenereerd (zie docker-entrypoint.sh)
    auth_basic           "Eductus";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Standaard: probeer bestand, anders 404 (geen SPA-fallback nodig)
    location / {
        try_files $uri $uri/ =404;
    }

    # HTML en cursusdata niet agressief cachen (modules/courses.json kunnen updaten)
    location ~* \.(html|json)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Basale security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Nette 404
    error_page 404 /index.html;
}
