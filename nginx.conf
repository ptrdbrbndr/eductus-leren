# Custom log-formaat voor traden.eductus.nl (module 3, admin-activiteitenlog).
# Pipe-gescheiden zodat generate-admin.sh dit met cut/awk kan parsen zonder
# extra packages. Alleen gebruikt door het traden.eductus.nl-serverblok
# hieronder — leren/cursus.eductus.nl loggen ongewijzigd naar de nginx-default.
log_format traden_access '$remote_user|$time_local|$request|$status';

# cursus.eductus.nl — de bestaande, oude vormgeving (per-cursus documentstijl,
# ongewijzigd sinds vóór de leren.eductus.nl-herstructurering van aug 2026).
server {
    listen       80;
    server_name  cursus.eductus.nl;
    root   /usr/share/nginx/html/cursus;
    index  index.html;

    auth_basic           "Eductus";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(html|json)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    error_page 404 /index.html;
}

# leren.eductus.nl — de nieuwe hub + cursussen in de sap-fundamenten-vormgeving.
# Cursussen die nog niet zijn omgezet, linken door naar cursus.eductus.nl.
server {
    listen       80 default_server;
    server_name  leren.eductus.nl _;
    root   /usr/share/nginx/html/leren;
    index  index.html;

    auth_basic           "Eductus";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(html|json)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    error_page 404 /index.html;
}

# traden.eductus.nl — deelbaar subdomein voor de tradingcursussen, met eigen
# individuele multi-user Basic Auth (los .htpasswd-bestand, losse auth-realm).
# Zelfde documentroot als leren.eductus.nl (gedeelde bestanden, geen duplicatie),
# maar met een eigen hub-landingspagina i.p.v. index.html.
server {
    listen       80;
    server_name  traden.eductus.nl;
    root   /usr/share/nginx/html/leren;
    index  traden-index.html;

    auth_basic           "Eductus Trading";
    auth_basic_user_file /etc/nginx/.htpasswd-traden;

    # Eigen access_log op het persistente volume (overleeft redeploys), alleen
    # voor dit serverblok — gebruikt door generate-admin.sh voor traden-admin.html.
    access_log /var/log/nginx-persist/traden-access.log traden_access;

    # Admin-activiteitenpagina: alleen zichtbaar voor Pieter, ook al hebben
    # Chris en Jan-Willem een geldig eigen account op ditzelfde serverblok.
    # auth_basic hierboven is de eerste laag (401 zonder geldige credentials);
    # deze check is de tweede laag (403 voor elk ander geldig account).
    location = /traden-admin.html {
        auth_basic           "Eductus Trading";
        auth_basic_user_file /etc/nginx/.htpasswd-traden;
        if ($remote_user != "pieter.de.brabander@ductus.nl") {
            return 403;
        }
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(html|json)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    error_page 404 /traden-index.html;
}
