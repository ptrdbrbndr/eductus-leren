# cursus.eductus.nl — de bestaande, oude vormgeving (per-cursus documentstijl,
# ongewijzigd sinds vóór de leren.eductus.nl-herstructurering van aug 2026).
server {
    listen       80;
    server_name  cursus.eductus.nl;
    root   /usr/share/nginx/html/cursus;
    index  index.html;

    auth_basic           "Eductus";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(html|json)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    error_page 404 /index.html;
}

# leren.eductus.nl — de nieuwe hub + cursussen in de sap-fundamenten-vormgeving.
# Cursussen die nog niet zijn omgezet, linken door naar cursus.eductus.nl.
server {
    listen       80 default_server;
    server_name  leren.eductus.nl _;
    root   /usr/share/nginx/html/leren;
    index  index.html;

    auth_basic           "Eductus";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(html|json)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    error_page 404 /index.html;
}
