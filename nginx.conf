# Custom log-formaat voor het admin-activiteitenoverzicht (module 3, alle drie
# de subdomeinen die deze container bedient). Pipe-gescheiden zodat
# generate-admin.sh dit met awk kan parsen zonder extra packages. Elk
# serverblok hieronder schrijft naar zijn EIGEN logbestand op het
# persistente volume (leren/cursus/traden-access.log) — geen gedeeld
# bestand nodig, generate-admin.sh leest alle drie en telt de domeinnaam
# zelf toe op basis van de bestandsnaam.
log_format admin_access '$remote_user|$time_local|$request|$status';

# cursus.eductus.nl — de bestaande, oude vormgeving (per-cursus documentstijl,
# ongewijzigd sinds vóór de leren.eductus.nl-herstructurering van aug 2026).
server {
    listen       80;
    server_name  cursus.eductus.nl;
    root   /usr/share/nginx/html/cursus;
    index  index.html;

    auth_basic           "Eductus";
    auth_basic_user_file /etc/nginx/.htpasswd;

    access_log /var/log/nginx-persist/cursus-access.log admin_access;

    # Puur UX-gemak: laat een ingelogde gebruiker zijn eigen username lezen,
    # zodat de hub-pagina's een "Admin"-knop kunnen tonen/verbergen. Geen
    # extra restrictie nodig — dit lekt alleen de eigen identiteit van de
    # aanroeper (die kent 'm toch al, hij heeft er net mee ingelogd), nooit
    # die van iemand anders. De échte beveiliging blijft de auth_request-
    # check op /admin.html hieronder, die dit endpoint niet aanraakt.
    location = /whoami {
        auth_basic           "Eductus";
        auth_basic_user_file /etc/nginx/.htpasswd;
        add_header X-Remote-User $remote_user always;
        add_header Cache-Control "no-store" always;
        default_type text/plain;
        return 200 "ok";
    }

    # Admin-activiteitenpagina (zie de uitgebreide toelichting in het
    # traden.eductus.nl-serverblok hieronder over waarom dit via auth_request
    # loopt i.p.v. een simpele "if" op $remote_user). Dit serverblok heeft
    # maar 1 gedeeld account (BASIC_AUTH_USER/PASS), dus de username-check is
    # hier vooral consistentie met de andere twee serverblokken.
    location = /admin.html {
        auth_basic           "Eductus";
        auth_basic_user_file /etc/nginx/.htpasswd;
        auth_request /_admin_check;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /_admin_check {
        internal;
        if ($remote_user != "pieter.de.brabander@ductus.nl") {
            return 403;
        }
        return 204;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(html|json)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    error_page 404 /index.html;
}

# leren.eductus.nl — de nieuwe hub + cursussen in de sap-fundamenten-vormgeving.
# Cursussen die nog niet zijn omgezet, linken door naar cursus.eductus.nl.
server {
    listen       80 default_server;
    server_name  leren.eductus.nl _;
    root   /usr/share/nginx/html/leren;
    index  index.html;

    auth_basic           "Eductus";
    auth_basic_user_file /etc/nginx/.htpasswd;

    access_log /var/log/nginx-persist/leren-access.log admin_access;

    # Puur UX-gemak — zie de toelichting in het cursus.eductus.nl-serverblok
    # hierboven. Zelfde principe, eigen auth_basic_user_file van dit domein.
    location = /whoami {
        auth_basic           "Eductus";
        auth_basic_user_file /etc/nginx/.htpasswd;
        add_header X-Remote-User $remote_user always;
        add_header Cache-Control "no-store" always;
        default_type text/plain;
        return 200 "ok";
    }

    location = /admin.html {
        auth_basic           "Eductus";
        auth_basic_user_file /etc/nginx/.htpasswd;
        auth_request /_admin_check;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /_admin_check {
        internal;
        if ($remote_user != "pieter.de.brabander@ductus.nl") {
            return 403;
        }
        return 204;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(html|json)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    error_page 404 /index.html;
}

# traden.eductus.nl — deelbaar subdomein voor de tradingcursussen, met eigen
# individuele multi-user Basic Auth (los .htpasswd-bestand, losse auth-realm).
# Zelfde documentroot als leren.eductus.nl (gedeelde bestanden, geen duplicatie),
# maar met een eigen hub-landingspagina i.p.v. index.html.
server {
    listen       80;
    server_name  traden.eductus.nl;
    root   /usr/share/nginx/html/leren;
    index  traden-index.html;

    auth_basic           "Eductus Trading";
    auth_basic_user_file /etc/nginx/.htpasswd-traden;

    # Eigen access_log op het persistente volume (overleeft redeploys), alleen
    # voor dit serverblok — gebruikt door generate-admin.sh voor admin.html.
    access_log /var/log/nginx-persist/traden-access.log admin_access;

    # Puur UX-gemak — zie de toelichting in het cursus.eductus.nl-serverblok
    # hierboven. Op dit domein zijn er 3 geldige accounts (Pieter/Chris/JW);
    # elk van de drie krijgt via dit endpoint alleen zijn EIGEN username
    # terug, nooit die van de andere twee.
    location = /whoami {
        auth_basic           "Eductus Trading";
        auth_basic_user_file /etc/nginx/.htpasswd-traden;
        add_header X-Remote-User $remote_user always;
        add_header Cache-Control "no-store" always;
        default_type text/plain;
        return 200 "ok";
    }

    # Admin-activiteitenpagina: alleen zichtbaar voor Pieter, ook al hebben
    # Chris en Jan-Willem een geldig eigen account op ditzelfde serverblok.
    # auth_basic hierboven is de eerste laag (401 zonder geldige/ontbrekende
    # credentials). De tweede laag (403 voor elk ander geldig account) staat
    # bewust NIET als "if ($remote_user != ...)" in deze location — nginx
    # evalueert een "if" in de rewrite-fase, vóór auth_basic's access-fase
    # draait, dus $remote_user zou dan alleen het (ongevalideerde) wachtwoord-
    # veld uit de Authorization-header decoderen i.p.v. een echt gevalideerde
    # login. Zonder credentials zou dat een lege $remote_user opleveren en dus
    # altijd 403 teruggeven in plaats van de vereiste 401-uitdaging. Met
    # auth_request wordt de subrequest pas na auth_basic's access-fase
    # afgehandeld, dus $remote_user is dan echt gevalideerd.
    location = /admin.html {
        auth_basic           "Eductus Trading";
        auth_basic_user_file /etc/nginx/.htpasswd-traden;
        auth_request /_admin_check;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location = /_admin_check {
        internal;
        if ($remote_user != "pieter.de.brabander@ductus.nl") {
            return 403;
        }
        return 204;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(html|json)$ {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    error_page 404 /traden-index.html;
}
