<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="'DM Sans', Arial, sans-serif" width="960" height="520" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#FBFAF7; }
      .col-head { font-size:12px; font-weight:700; fill:#55606F; text-anchor:middle; letter-spacing:.04em; }
      .row { fill:#FFFFFF; stroke:#DFDCD3; stroke-width:1.3; }
      .row-text { font-size:11.5px; fill:#14213D; }
      .dot-informeel { fill:#DFDCD3; stroke:#55606F; stroke-width:1.5; }
      .dot-gestandaardiseerd { fill:#6FA3D6; stroke:#2563A8; stroke-width:1.5; }
      .dot-geborgd { fill:#2563A8; stroke:#14213D; stroke-width:1.5; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
    </style>
  </defs>

  <rect width="960" height="520" class="paper"/>
  <text x="40" y="42" class="kicker">DEEL 27 · ZES GEBIEDEN, DRIE VOLWASSENHEIDSNIVEAUS</text>
  <text x="40" y="72" class="title">Positie per kennisgebied</text>

  <text x="480" y="110" class="col-head">INFORMEEL</text>
  <text x="700" y="110" class="col-head">GESTANDAARDISEERD</text>
  <text x="900" y="110" class="col-head" text-anchor="end">GEBORGD</text>

  <g>
    <rect x="40" y="122" width="880" height="42" class="row"/>
    <text x="56" y="148" class="row-text">Planning &amp; Monitoring</text>
    <circle cx="700" cy="143" r="8" class="dot-gestandaardiseerd"/>
  </g>
  <g>
    <rect x="40" y="166" width="880" height="42" class="row"/>
    <text x="56" y="192" class="row-text">Elicitation &amp; Collaboration</text>
    <circle cx="900" cy="187" r="8" class="dot-geborgd"/>
  </g>
  <g>
    <rect x="40" y="210" width="880" height="42" class="row"/>
    <text x="56" y="236" class="row-text">Requirements Life Cycle Mgmt</text>
    <circle cx="700" cy="231" r="8" class="dot-gestandaardiseerd"/>
  </g>
  <g>
    <rect x="40" y="254" width="880" height="42" class="row"/>
    <text x="56" y="280" class="row-text">Requirements Analysis &amp; Design</text>
    <circle cx="900" cy="275" r="8" class="dot-geborgd"/>
  </g>
  <g>
    <rect x="40" y="298" width="880" height="42" class="row"/>
    <text x="56" y="324" class="row-text">Strategy Analysis</text>
    <circle cx="480" cy="319" r="8" class="dot-informeel"/>
  </g>
  <g>
    <rect x="40" y="342" width="880" height="42" class="row"/>
    <text x="56" y="368" class="row-text">Solution Evaluation</text>
    <circle cx="480" cy="363" r="8" class="dot-informeel"/>
  </g>

  <text x="480" y="440" text-anchor="middle" font-size="12" fill="#6FA3D6">Scheve verdeling is normaal — het BA-fundament richt zich op de zwakste plekken</text>
</svg>
