<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'DM Sans', Arial, sans-serif" width="960" height="560" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#FBFAF7; }
      .field { fill:#FFFFFF; stroke:#2563A8; stroke-width:1.3; }
      .label { font-size:12.5px; font-weight:700; fill:#14213D; }
      .sub { font-size:10.5px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:26px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.1em; }
    </style>
  </defs>

  <rect width="960" height="560" class="paper"/>
  <text x="40" y="34" class="kicker">DEEL 27 · INSTRUMENT</text>
  <text x="40" y="64" class="title">Het BA-fundament</text>

  <rect x="40" y="112" width="880" height="60" rx="6" class="field"/>
  <text x="56" y="136" class="label">ZWAKSTE KENNISGEBIED</text>
  <text x="56" y="156" class="sub">uit figuur 27-1 — welk gebied staat nog op informeel niveau?</text>

  <rect x="40" y="184" width="880" height="60" rx="6" class="field"/>
  <text x="56" y="208" class="label">RISICO VAN NIET-BORGEN</text>
  <text x="56" y="228" class="sub">wat gaat er mis als dit gebied informeel blijft, op deze schaal?</text>

  <rect x="40" y="256" width="880" height="60" rx="6" class="field"/>
  <text x="56" y="280" class="label">EERSTE STAP NAAR STANDAARDISATIE</text>
  <text x="56" y="300" class="sub">concreet, haalbaar binnen dit programma</text>

  <!-- afsluitend, kritisch -->
  <g>
    <circle cx="58" cy="352" r="15" fill="#E9A13B"/>
    <path d="M52 352 l4 4 l8 -9" stroke="#14213D" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="40" y="374" width="880" height="70" rx="6" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
    <text x="56" y="400" class="label" fill="#9A5F0D">DE OPVOLGINGSVRAAG — afsluitend, kritisch veld</text>
    <text x="56" y="420" class="sub">wie borgt dit nadat het programma is afgerond en jij bent doorgeschoven?</text>
  </g>
</svg>
