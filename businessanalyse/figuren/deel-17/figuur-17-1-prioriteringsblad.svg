<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'DM Sans', Arial, sans-serif" width="960" height="560" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#F5F4F0; }
      .field { fill:#FFFFFF; stroke:#1A4F8B; stroke-width:1.3; }
      .head { fill:#C5D8F0; }
      .label { font-size:12.5px; font-weight:700; fill:#0D1B2A; }
      .sub { font-size:10.5px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:26px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.1em; }
    </style>
  </defs>

  <rect width="960" height="560" class="paper"/>
  <text x="40" y="34" class="kicker">DEEL 17 · INSTRUMENT</text>
  <text x="40" y="64" class="title">Het prioriteringsblad</text>

  <rect x="40" y="106" width="880" height="40" class="head"/>
  <text x="56" y="131" class="label">EIS</text>
  <text x="360" y="131" class="label">PRIORITEIT</text>
  <text x="520" y="131" class="label">ONDERBOUWING</text>
  <text x="760" y="131" class="label">BESLISSING</text>

  <rect x="40" y="146" width="880" height="60" class="field"/>
  <text x="56" y="172" class="sub">R-014</text>
  <text x="760" y="172" class="sub">goedgekeurd / afgewezen / uitgesteld</text>
  <rect x="40" y="206" width="880" height="60" class="field"/>
  <rect x="40" y="266" width="880" height="60" class="field"/>

  <!-- afsluitend -->
  <g>
    <circle cx="58" cy="364" r="15" fill="#E8A020"/>
    <path d="M52 364 l4 4 l8 -9" stroke="#0D1B2A" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="40" y="386" width="880" height="80" rx="6" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>
    <text x="56" y="412" class="label" fill="#8A5A0E">DE RIMPELVRAAG — afsluitend, verplicht veld</text>
    <text x="56" y="432" class="sub">welke eerder goedgekeurde eis moet worden heroverwogen als dit wordt goedgekeurd?</text>
    <text x="56" y="448" class="sub">vóór de beslissing, niet pas tijdens het testen ontdekt</text>
  </g>
</svg>
