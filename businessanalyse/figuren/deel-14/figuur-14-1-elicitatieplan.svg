<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="'DM Sans', Arial, sans-serif" width="960" height="580" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#FBFAF7; }
      .field { fill:#FFFFFF; stroke:#2563A8; stroke-width:1.4; }
      .label { font-size:13px; font-weight:700; fill:#14213D; }
      .sub { font-size:11px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:26px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.1em; }
      .field-num { font-size:12px; font-weight:700; fill:#FFFFFF; }
    </style>
  </defs>

  <rect width="960" height="580" class="paper"/>
  <text x="40" y="34" class="kicker">DEEL 14 · INSTRUMENT</text>
  <text x="40" y="64" class="title">Het elicitatieplan</text>

  <g>
    <circle cx="58" cy="140" r="14" fill="#2563A8"/><text x="58" y="145" text-anchor="middle" class="field-num">1</text>
    <rect x="40" y="163" width="880" height="60" rx="6" class="field"/>
    <text x="56" y="187" class="label">DOEL VAN DE SESSIE</text>
    <text x="56" y="207" class="sub">welke behoefte of welk gat wordt hiermee onderzocht?</text>
  </g>
  <g>
    <circle cx="58" cy="245" r="14" fill="#2563A8"/><text x="58" y="250" text-anchor="middle" class="field-num">2</text>
    <rect x="40" y="268" width="880" height="60" rx="6" class="field"/>
    <text x="56" y="292" class="label">DEELNEMERS EN TECHNIEK</text>
    <text x="56" y="312" class="sub">wie is nodig, en welke techniek uit niveau 1 wordt ingezet?</text>
  </g>
  <g>
    <circle cx="58" cy="350" r="14" fill="#2563A8"/><text x="58" y="355" text-anchor="middle" class="field-num">3</text>
    <rect x="40" y="373" width="880" height="60" rx="6" class="field"/>
    <text x="56" y="397" class="label">WIJZE VAN BEVESTIGEN</text>
    <text x="56" y="417" class="sub">hoe en wanneer wordt de output formeel vastgesteld met de deelnemers?</text>
  </g>

  <!-- afsluitend, geruststellend -->
  <g>
    <circle cx="58" cy="463" r="15" fill="#E9A13B"/>
    <path d="M52 463 l4 4 l8 -9" stroke="#14213D" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="40" y="485" width="880" height="70" rx="6" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
    <text x="56" y="511" class="label" fill="#9A5F0D">HET MINIMALE RESULTAAT — afsluitend, geruststellend veld</text>
    <text x="56" y="531" class="sub">waarmee is deze sessie toch geslaagd, ook als het grote doel niet wordt gehaald?</text>
  </g>
</svg>
