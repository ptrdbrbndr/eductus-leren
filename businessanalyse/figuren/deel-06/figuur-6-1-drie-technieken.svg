<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="'DM Sans', Arial, sans-serif" width="900" height="500" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#F5F4F0; }
      .col-head { fill:#1A4F8B; }
      .col-head-text { font-size:16px; font-weight:700; fill:#F5F4F0; text-anchor:middle; }
      .col-body { fill:#FFFFFF; stroke:#C5D8F0; stroke-width:1.5; }
      .row-label { font-size:11px; font-weight:700; fill:#8A5A0E; letter-spacing:.06em; }
      .txt { font-size:11.5px; fill:#0D1B2A; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#0D1B2A; font-weight:600; }
    </style>
  </defs>

  <rect width="900" height="500" class="paper"/>
  <text x="40" y="42" class="kicker">DEEL 6 · DRIE BASISTECHNIEKEN</text>
  <text x="40" y="72" class="title">Interview, documentanalyse, observatie</text>

  <!-- 3 kolommen -->
  <g>
    <rect x="40" y="100" width="260" height="46" class="col-head"/>
    <text x="170" y="130" class="col-head-text">Interview</text>
    <rect x="40" y="146" width="260" height="300" class="col-body"/>
    <text x="56" y="176" class="row-label">STERK</text>
    <text x="56" y="196" class="txt">vindt wat je nog niet</text>
    <text x="56" y="212" class="txt">wist te vragen (open interview)</text>
    <text x="56" y="250" class="row-label">ZWAK</text>
    <text x="56" y="270" class="txt">leunt op wat iemand zelf</text>
    <text x="56" y="286" class="txt">kan verwoorden</text>
  </g>
  <g>
    <rect x="320" y="100" width="260" height="46" class="col-head"/>
    <text x="450" y="130" class="col-head-text">Documentanalyse</text>
    <rect x="320" y="146" width="260" height="300" class="col-body"/>
    <text x="336" y="176" class="row-label">STERK</text>
    <text x="336" y="196" class="txt">haalt behoeften uit materiaal</text>
    <text x="336" y="212" class="txt">dat niet als zodanig is opgeschreven</text>
    <text x="336" y="250" class="row-label">ZWAK</text>
    <text x="336" y="270" class="txt">alleen bruikbaar als er</text>
    <text x="336" y="286" class="txt">al materiaal ligt</text>
  </g>
  <g>
    <rect x="600" y="100" width="260" height="46" class="col-head"/>
    <text x="730" y="130" class="col-head-text">Observatie</text>
    <rect x="600" y="146" width="260" height="300" class="col-body"/>
    <text x="616" y="176" class="row-label">STERK</text>
    <text x="616" y="196" class="txt">toont hoe iemand werkelijk</text>
    <text x="616" y="212" class="txt">werkt, niet hoe hij het beschrijft</text>
    <text x="616" y="250" class="row-label">ZWAK</text>
    <text x="616" y="270" class="txt">tijdrovend, en beperkt tot</text>
    <text x="616" y="286" class="txt">wat je live meemaakt</text>
  </g>

  <text x="450" y="475" text-anchor="middle" font-size="12" fill="#8AAFD4">Keuze hangt af van: wat je al weet, wie de kennis heeft, hoeveel iemand zelf kan verwoorden</text>
</svg>
