<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 680" font-family="'DM Sans', Arial, sans-serif" width="960" height="680" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#F5F4F0; }
      .field { fill:#FFFFFF; stroke:#1A4F8B; stroke-width:1.5; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .sub { font-size:12px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:26px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .field-num { font-size:12px; font-weight:700; fill:#FFFFFF; }
    </style>
  </defs>

  <rect width="960" height="680" class="paper"/>
  <text x="40" y="34" class="kicker">DEEL 6 · INSTRUMENT</text>
  <text x="40" y="64" class="title">Het behoefteblad</text>

  <g>
    <circle cx="58" cy="140" r="14" fill="#1A4F8B"/><text x="58" y="145" text-anchor="middle" class="field-num">1</text>
    <rect x="40" y="163" width="880" height="66" rx="6" class="field"/>
    <text x="56" y="187" class="label">DE BEHOEFTE, IN ÉÉN ZIN</text>
    <text x="56" y="207" class="sub">het probleem of de kans, niet de oplossing</text>
  </g>
  <g>
    <circle cx="58" cy="255" r="14" fill="#1A4F8B"/><text x="58" y="260" text-anchor="middle" class="field-num">2</text>
    <rect x="40" y="278" width="880" height="66" rx="6" class="field"/>
    <text x="56" y="302" class="label">BRON EN TECHNIEK</text>
    <text x="56" y="322" class="sub">van wie of wat opgehaald, en hoe — interview, documentanalyse, observatie</text>
  </g>
  <g>
    <circle cx="58" cy="370" r="14" fill="#1A4F8B"/><text x="58" y="375" text-anchor="middle" class="field-num">3</text>
    <rect x="40" y="393" width="880" height="66" rx="6" class="field"/>
    <text x="56" y="417" class="label">CITAAT OF WAARNEMING</text>
    <text x="56" y="437" class="sub">het letterlijke of waargenomen materiaal</text>
  </g>
  <g>
    <circle cx="58" cy="485" r="14" fill="#1A4F8B"/><text x="58" y="490" text-anchor="middle" class="field-num">4</text>
    <rect x="40" y="508" width="880" height="66" rx="6" class="field"/>
    <text x="56" y="532" class="label">INTERPRETATIE, APART GEMARKEERD</text>
    <text x="56" y="552" class="sub">wat jij ervan maakt, gescheiden van wat werkelijk gezegd of gezien is</text>
  </g>

  <!-- afsluitend -->
  <g>
    <circle cx="58" cy="606" r="15" fill="#E8A020"/>
    <path d="M52 606 l4 4 l8 -9" stroke="#0D1B2A" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="40" y="628" width="880" height="42" rx="6" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>
    <text x="56" y="654" class="label" fill="#8A5A0E">DE TEGENCHECK — getoetst aan een tweede, onafhankelijke bron? zo nee: "nog te bevestigen"</text>
  </g>
</svg>
