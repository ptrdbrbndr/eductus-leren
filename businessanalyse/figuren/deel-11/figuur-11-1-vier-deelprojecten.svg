<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="'DM Sans', Arial, sans-serif" width="900" height="500" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#FBFAF7; }
      .track { stroke:#6FA3D6; stroke-width:6; stroke-linecap:round; }
      .knob { fill:#2563A8; stroke:#FFFFFF; stroke-width:2; }
      .end { font-size:14px; font-weight:700; fill:#14213D; }
      .plabel { font-size:12.5px; fill:#14213D; font-weight:600; }
      .frame { fill:none; stroke:#DFDCD3; stroke-width:1.5; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
    </style>
  </defs>

  <rect width="900" height="500" class="paper"/>
  <text x="40" y="42" class="kicker">DEEL 11 · ÉÉN PROGRAMMAKADER, VIER POSITIES</text>
  <text x="40" y="72" class="title">Vier deelprojecten op de schaal</text>

  <rect x="40" y="100" width="820" height="360" rx="10" class="frame"/>

  <text x="90" y="140" class="end">Voorspellend</text>
  <text x="770" y="140" class="end" text-anchor="end">Adaptief</text>

  <g>
    <line x1="90" y1="185" x2="770" y2="185" class="track"/>
    <circle cx="200" cy="185" r="10" class="knob"/>
    <text x="90" y="210" class="plabel">Koppelvlak Polisadministratie</text>
  </g>
  <g>
    <line x1="90" y1="245" x2="770" y2="245" class="track"/>
    <circle cx="620" cy="245" r="10" class="knob"/>
    <text x="90" y="270" class="plabel">Salaris &amp; Deeltijd (Wtp-transitie)</text>
  </g>
  <g>
    <line x1="90" y1="305" x2="770" y2="305" class="track"/>
    <circle cx="420" cy="305" r="10" class="knob"/>
    <text x="90" y="330" class="plabel">Deelproject 3</text>
  </g>
  <g>
    <line x1="90" y1="365" x2="770" y2="365" class="track"/>
    <circle cx="520" cy="365" r="10" class="knob"/>
    <text x="90" y="390" class="plabel">Deelproject 4</text>
  </g>

  <text x="450" y="430" text-anchor="middle" font-size="12" fill="#6FA3D6">Ruimte voor eigen posities per deelproject, samenhang bewaakt op programmaniveau</text>
</svg>
