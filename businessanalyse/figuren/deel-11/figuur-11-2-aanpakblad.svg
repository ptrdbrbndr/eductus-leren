<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#F5F4F0; }
      .field { fill:#FFFFFF; stroke:#1A4F8B; stroke-width:1.4; }
      .label { font-size:13px; font-weight:700; fill:#0D1B2A; }
      .sub { font-size:10.5px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:26px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.1em; }
    </style>
  </defs>

  <rect width="960" height="620" class="paper"/>
  <text x="40" y="34" class="kicker">DEEL 11 · INSTRUMENT</text>
  <text x="40" y="64" class="title">Het aanpakblad</text>

  <!-- 4 kolommen, deelprojecten naast elkaar -->
  <g>
    <rect x="40" y="112" width="205" height="290" rx="6" class="field"/>
    <text x="56" y="138" class="label">DEELPROJECT 1</text>
    <text x="56" y="160" class="sub">Koppelvlak</text>
    <text x="56" y="174" class="sub">Polisadministratie</text>
    <text x="56" y="204" class="sub">positie op de schaal:</text>
    <text x="56" y="220" class="sub">voorspellend</text>

    <rect x="255" y="112" width="205" height="290" rx="6" class="field"/>
    <text x="271" y="138" class="label">DEELPROJECT 2</text>
    <text x="271" y="160" class="sub">Salaris &amp; Deeltijd</text>
    <text x="271" y="174" class="sub">(Wtp-transitie)</text>
    <text x="271" y="204" class="sub">positie op de schaal:</text>
    <text x="271" y="220" class="sub">adaptief</text>

    <rect x="470" y="112" width="205" height="290" rx="6" class="field"/>
    <text x="486" y="138" class="label">DEELPROJECT 3</text>
    <text x="486" y="204" class="sub">positie op de schaal:</text>

    <rect x="685" y="112" width="235" height="290" rx="6" class="field"/>
    <text x="701" y="138" class="label">DEELPROJECT 4</text>
    <text x="701" y="204" class="sub">positie op de schaal:</text>
  </g>

  <!-- afsluitend -->
  <g>
    <circle cx="58" cy="436" r="15" fill="#E8A020"/>
    <path d="M52 436 l4 4 l8 -9" stroke="#0D1B2A" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="40" y="458" width="880" height="80" rx="6" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>
    <text x="56" y="484" class="label" fill="#8A5A0E">BIJSTURINGSSIGNAAL — afsluitend veld</text>
    <text x="56" y="504" class="sub">welk signaal, bij welk deelproject, dwingt tot herzien van de gekozen aanpak?</text>
    <text x="56" y="520" class="sub">en wie moet dat signaal dan ontvangen, over de programmagrenzen heen?</text>
  </g>
</svg>
