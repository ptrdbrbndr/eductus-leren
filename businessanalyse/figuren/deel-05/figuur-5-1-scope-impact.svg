<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="'DM Sans', Arial, sans-serif" width="900" height="560" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#F5F4F0; }
      .impact { fill:#C5D8F0; stroke:#8AAFD4; stroke-width:1.5; }
      .scope { fill:#FFFFFF; stroke:#E8A020; stroke-width:3; stroke-dasharray:8 5; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; text-anchor:middle; }
      .sub { font-size:11.5px; fill:#5B6675; text-anchor:middle; }
      .dot { fill:#1A4F8B; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#0D1B2A; font-weight:600; }
    </style>
  </defs>

  <rect width="900" height="560" class="paper"/>
  <text x="40" y="42" class="kicker">DEEL 5 · IMPACT BESTAAT, SCOPE IS EEN KEUZE</text>
  <text x="40" y="72" class="title">Scope als grens binnen een groter impactgebied</text>

  <!-- groot impactgebied -->
  <ellipse cx="450" cy="330" rx="330" ry="180" class="impact"/>
  <text x="450" y="150" class="label">Impactgebied</text>
  <text x="450" y="170" class="sub">alles wat wordt geraakt, ongeacht scope</text>

  <!-- kleinere scope-grens erbinnen -->
  <rect x="330" y="260" width="240" height="140" rx="14" class="scope"/>
  <text x="450" y="320" class="label" fill="#8A5A0E">Scope</text>
  <text x="450" y="340" class="sub">wat je expliciet gaat opleveren</text>
  <text x="450" y="358" class="sub">een bewust getrokken grens</text>

  <!-- impactpunten, sommige binnen sommige buiten scope -->
  <circle cx="220" cy="280" r="6" class="dot"/>
  <text x="220" y="264" class="sub">correctieproces</text>
  <circle cx="640" cy="300" r="6" class="dot"/>
  <text x="640" y="284" class="sub">polisadministratie</text>
  <circle cx="240" cy="420" r="6" class="dot"/>
  <text x="240" y="440" class="sub">Klantenservice-rol</text>
  <circle cx="400" cy="330" r="6" fill="#E8A020"/>
  <text x="400" y="310" class="sub" fill="#8A5A0E">binnen scope</text>
  <circle cx="620" cy="440" r="6" class="dot"/>
  <text x="620" y="460" class="sub">koppelvlak systemen</text>
</svg>
