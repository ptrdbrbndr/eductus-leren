<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" font-family="'DM Sans', Arial, sans-serif" width="900" height="720" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#F5F4F0; }
      .core { fill:#1A4F8B; }
      .core-text { font-size:14px; font-weight:700; fill:#F5F4F0; text-anchor:middle; }
      .node { fill:#FFFFFF; stroke:#1A4F8B; stroke-width:1.5; }
      .node-text { font-size:13px; font-weight:700; fill:#0D1B2A; text-anchor:middle; }
      .sub { font-size:10.5px; fill:#5B6675; text-anchor:middle; }
      .link { stroke:#8AAFD4; stroke-width:1.5; }
      .scope { fill:none; stroke:#E8A020; stroke-width:2.5; stroke-dasharray:8 5; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#0D1B2A; font-weight:600; }
    </style>
  </defs>

  <rect width="900" height="720" class="paper"/>
  <text x="40" y="42" class="kicker">DEEL 5 · INSTRUMENT</text>
  <text x="40" y="72" class="title">De impactkaart</text>

  <circle cx="450" cy="400" r="420" class="scope" transform="scale(0.55,0.42) translate(370,200)" opacity="0"/>
  <ellipse cx="450" cy="400" rx="360" ry="230" class="scope"/>

  <g class="link">
    <line x1="450" y1="400" x2="450" y2="214"/>
    <line x1="450" y1="400" x2="705" y2="362"/>
    <line x1="450" y1="400" x2="705" y2="430"/>
    <line x1="450" y1="400" x2="195" y2="430"/>
  </g>

  <rect x="360" y="360" width="180" height="80" rx="10" class="core"/>
  <text x="450" y="396" class="core-text">Kernverandering</text>
  <text x="450" y="414" class="core-text" font-size="11">(veranderregel deel 1)</text>

  <g>
    <rect x="330" y="122" width="240" height="92" rx="10" class="node"/>
    <text x="450" y="150" class="node-text">Processen</text>
    <text x="450" y="170" class="sub">wat schuift mee?</text>
    <text x="450" y="184" class="sub">binnen of buiten scope?</text>
  </g>
  <g>
    <rect x="590" y="270" width="230" height="92" rx="10" class="node"/>
    <text x="705" y="296" class="node-text">Systemen &amp;</text>
    <text x="705" y="312" class="node-text">koppelvlakken</text>
    <text x="705" y="330" class="sub">wat schuift mee? binnen/buiten scope?</text>
  </g>
  <g>
    <rect x="590" y="430" width="230" height="92" rx="10" class="node"/>
    <text x="705" y="458" class="node-text">Mensen &amp; rollen</text>
    <text x="705" y="476" class="sub">wat schuift mee?</text>
    <text x="705" y="490" class="sub">binnen of buiten scope?</text>
  </g>
  <g>
    <rect x="80" y="430" width="230" height="92" rx="10" class="node"/>
    <text x="195" y="458" class="node-text">Gegevens</text>
    <text x="195" y="476" class="sub">wat schuift mee?</text>
    <text x="195" y="490" class="sub">binnen of buiten scope?</text>
  </g>

  <text x="450" y="640" text-anchor="middle" font-size="12" fill="#8A5A0E">Buiten de stippellijn: bewust uitgesloten (door wie, waarom) of nog niet besproken</text>
  <text x="450" y="670" text-anchor="middle" font-size="12" fill="#8AAFD4">Welke impact ontdekte je zelf pas bij het invullen — waarvan je dit vooraf niet had verwacht?</text>
</svg>
