<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="'DM Sans', Arial, sans-serif" width="960" height="480" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#F5F4F0; }
      .cohort { fill:#C5D8F0; stroke:#1A4F8B; stroke-width:1.5; }
      .cohort-text { font-size:13px; font-weight:700; fill:#0D1B2A; text-anchor:middle; }
      .sub { font-size:10.5px; fill:#3F5670; text-anchor:middle; }
      .effect-pos { fill:#1A4F8B; }
      .effect-neg { fill:#8A5A0E; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#0D1B2A; font-weight:600; }
    </style>
  </defs>

  <rect width="960" height="480" class="paper"/>
  <text x="40" y="42" class="kicker">DEEL 23 · WIE RAAKT VICTORS VOORSTEL, EN HOE</text>
  <text x="40" y="72" class="title">Cohorten en het compensatie-effect</text>

  <g>
    <rect x="60" y="120" width="200" height="140" rx="10" class="cohort"/>
    <text x="160" y="150" class="cohort-text">Cohort A</text>
    <text x="160" y="170" class="sub">vóór de overgang</text>
    <rect x="90" y="200" width="140" height="14" class="effect-pos"/>
    <text x="160" y="232" class="sub">effect: gunstig</text>
  </g>
  <g>
    <rect x="290" y="120" width="200" height="140" rx="10" class="cohort"/>
    <text x="390" y="150" class="cohort-text">Cohort B</text>
    <text x="390" y="170" class="sub">tijdens de overgang</text>
    <rect x="320" y="200" width="60" height="14" class="effect-neg"/>
    <text x="390" y="232" class="sub">effect: nadelig</text>
  </g>
  <g>
    <rect x="520" y="120" width="200" height="140" rx="10" class="cohort"/>
    <text x="620" y="150" class="cohort-text">Cohort C</text>
    <text x="620" y="170" class="sub">net ná de overgang</text>
    <rect x="550" y="200" width="100" height="14" class="effect-neg"/>
    <text x="620" y="232" class="sub">effect: licht nadelig</text>
  </g>
  <g>
    <rect x="750" y="120" width="150" height="140" rx="10" class="cohort"/>
    <text x="825" y="150" class="cohort-text">Cohort D</text>
    <text x="825" y="170" class="sub">ver ná de overgang</text>
    <rect x="770" y="200" width="110" height="14" class="effect-pos"/>
    <text x="825" y="232" class="sub">effect: gunstig</text>
  </g>

  <text x="480" y="330" text-anchor="middle" font-size="12" fill="#8A5A0E">Eén voorstel, vier verschillende effecten — het waardegat verschuift per cohort, niet uniform</text>
</svg>
