<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'DM Sans', Arial, sans-serif" width="960" height="560" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#F5F4F0; }
      .field { fill:#FFFFFF; stroke:#1A4F8B; stroke-width:1.3; }
      .label { font-size:12.5px; font-weight:700; fill:#0D1B2A; }
      .sub { font-size:10.5px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:26px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.1em; }
    </style>
  </defs>

  <rect width="960" height="560" class="paper"/>
  <text x="40" y="34" class="kicker">DEEL 23 · INSTRUMENT</text>
  <text x="40" y="64" class="title">De evenwichtstoets</text>

  <rect x="40" y="112" width="880" height="60" rx="6" class="field"/>
  <text x="56" y="136" class="label">HET VOORSTEL, PER COHORT</text>
  <text x="56" y="156" class="sub">wie profiteert, wie draagt de last, en hoeveel?</text>

  <rect x="40" y="184" width="880" height="60" rx="6" class="field"/>
  <text x="56" y="208" class="label">TEGENARGUMENT</text>
  <text x="56" y="228" class="sub">welk bezwaar is namens het benadeelde cohort al ingebracht?</text>

  <!-- afsluitend, kritisch -->
  <g>
    <circle cx="58" cy="290" r="15" fill="#E8A020"/>
    <path d="M52 290 l4 4 l8 -9" stroke="#0D1B2A" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="40" y="312" width="880" height="80" rx="6" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>
    <text x="56" y="338" class="label" fill="#8A5A0E">WEERLEGD OF GENEGEERD — afsluitende, kritische stap</text>
    <text x="56" y="358" class="sub">is het tegenargument inhoudelijk weerlegd, of alleen niet meer genoemd?</text>
    <text x="56" y="374" class="sub">dat onderscheid moet expliciet worden vastgelegd, niet verondersteld</text>
  </g>
</svg>
