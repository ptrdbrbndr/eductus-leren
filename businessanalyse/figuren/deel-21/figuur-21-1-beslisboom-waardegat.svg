<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="'DM Sans', Arial, sans-serif" width="960" height="500" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#F5F4F0; }
      .q { fill:#F5D9A8; stroke:#8A5A0E; stroke-width:1.4; }
      .q-text { font-size:12px; font-weight:700; fill:#0D1B2A; text-anchor:middle; }
      .a { fill:#C5D8F0; stroke:#1A4F8B; stroke-width:1.4; }
      .a-text { font-size:12px; font-weight:700; fill:#0D1B2A; text-anchor:middle; }
      .a-sub { font-size:10px; fill:#3F5670; text-anchor:middle; }
      .arrow { stroke:#5B6675; stroke-width:1.6; fill:none; marker-end:url(#arr21); }
      .elabel { font-size:10.5px; fill:#5B6675; text-anchor:middle; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#0D1B2A; font-weight:600; }
    </style>
    <marker id="arr21" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#5B6675"/></marker>
  </defs>

  <rect width="960" height="500" class="paper"/>
  <text x="40" y="42" class="kicker">DEEL 21 · DRIE VERKLARINGEN, ÉÉN VRAAGBOOM</text>
  <text x="40" y="72" class="title">Waarom blijft de waarde uit?</text>

  <rect x="380" y="100" width="200" height="60" rx="8" class="q"/>
  <text x="480" y="126" class="q-text">Werkt de oplossing</text>
  <text x="480" y="142" class="q-text">technisch zoals bedoeld?</text>

  <path d="M420 160 L280 220" class="arrow"/>
  <text x="330" y="195" class="elabel">nee</text>
  <rect x="160" y="220" width="240" height="70" rx="8" class="a"/>
  <text x="280" y="248" class="a-text">Gebrek in de oplossing</text>
  <text x="280" y="266" class="a-sub">techniek werkt niet zoals bedoeld</text>

  <path d="M560 160 L700 220" class="arrow"/>
  <text x="655" y="195" class="elabel">ja</text>
  <rect x="580" y="220" width="220" height="70" rx="8" class="q"/>
  <text x="690" y="248" class="q-text">Wordt de oplossing gebruikt</text>
  <text x="690" y="266" class="q-text">zoals bedoeld?</text>

  <path d="M640 290 L520 350" class="arrow"/>
  <text x="565" y="330" class="elabel">nee</text>
  <rect x="400" y="350" width="220" height="70" rx="8" class="a"/>
  <text x="510" y="378" class="a-text">Gebrek in het gebruik</text>
  <text x="510" y="396" class="a-sub">oplossing werkt, gedrag verandert niet mee</text>

  <path d="M740 290 L820 350" class="arrow"/>
  <text x="790" y="330" class="elabel">ja</text>
  <rect x="700" y="350" width="220" height="70" rx="8" class="a"/>
  <text x="810" y="378" class="a-text">Fout in het waardemodel</text>
  <text x="810" y="396" class="a-sub">de aanname zelf was onjuist</text>
</svg>
