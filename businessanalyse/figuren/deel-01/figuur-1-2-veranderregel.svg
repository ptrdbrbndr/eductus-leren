<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:15px; font-weight:700; fill:#14213D; letter-spacing:.02em; }
      .sub { font-size:12.5px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:26px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .field-num { font-size:12px; font-weight:700; fill:#FFFFFF; }
    </style>
  </defs>

  <rect width="960" height="620" class="paper"/>

  <!-- titelbalk -->
  <text x="40" y="34" class="kicker">DEEL 1 · INSTRUMENT</text>
  <text x="40" y="64" class="title">De veranderregel</text>

  <!-- doorlopende zin -->
  <text x="40" y="118" class="sub">Na deze verandering doet ⟮wie⟯ ⟮wat anders⟯, zodat ⟮welk verschil⟯. Dat merken we aan ⟮waarneembaar gevolg⟯.</text>

  <!-- veld 1: wie -->
  <g>
    <circle cx="58" cy="165" r="14" class="blue-line" fill="#2563A8"/>
    <text x="58" y="170" text-anchor="middle" class="field-num">1</text>
    <rect x="40" y="188" width="880" height="70" rx="6" fill="#FFFFFF" class="blue-line" stroke-width="1.5"/>
    <text x="56" y="212" class="label">WIE</text>
    <text x="56" y="234" class="sub">een mens of groep mensen — geen systeem, geen afdelingsnaam als schild</text>
  </g>

  <!-- veld 2: wat anders -->
  <g>
    <circle cx="58" cy="283" r="14" class="blue-line" fill="#2563A8"/>
    <text x="58" y="288" text-anchor="middle" class="field-num">2</text>
    <rect x="40" y="306" width="880" height="70" rx="6" fill="#FFFFFF" class="blue-line" stroke-width="1.5"/>
    <text x="56" y="330" class="label">WAT ANDERS</text>
    <text x="56" y="352" class="sub">het feitelijke gedrag dat verandert</text>
  </g>

  <!-- veld 3: welk verschil -->
  <g>
    <circle cx="58" cy="401" r="14" class="blue-line" fill="#2563A8"/>
    <text x="58" y="406" text-anchor="middle" class="field-num">3</text>
    <rect x="40" y="424" width="880" height="70" rx="6" fill="#FFFFFF" class="blue-line" stroke-width="1.5"/>
    <text x="56" y="448" class="label">WELK VERSCHIL / WAARNEEMBAAR GEVOLG</text>
    <text x="56" y="470" class="sub">wat merkbaar anders is, en waaraan je dat ziet</text>
  </g>

  <!-- afsluitend veld: wat niet verandert -->
  <g>
    <circle cx="58" cy="519" r="15" fill="#E9A13B"/>
    <path d="M52 519 l4 4 l8 -9" stroke="#14213D" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="40" y="542" width="880" height="60" rx="6" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
    <text x="56" y="565" class="label" fill="#9A5F0D">WAT NÍET VERANDERT — het veld dat het verschil maakt</text>
    <text x="56" y="586" class="sub">wat bewust blijft zoals het is</text>
  </g>
</svg>
