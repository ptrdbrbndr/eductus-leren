<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 460" font-family="'DM Sans', Arial, sans-serif" width="1040" height="460" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#F5F4F0; }
      .axis { stroke:#1A4F8B; stroke-width:2.5; }
      .tick { stroke:#8AAFD4; stroke-width:1.5; }
      .dot { fill:#1A4F8B; }
      .dot-end { fill:#E8A020; }
      .m-label { font-size:11.5px; fill:#5B6675; text-anchor:middle; }
      .e-label { font-size:13px; fill:#0D1B2A; text-anchor:middle; font-weight:600; }
      .e-sub { font-size:10.5px; fill:#5B6675; text-anchor:middle; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#0D1B2A; font-weight:600; }
      .num-dot { fill:#E8A020; }
      .num-text { font-size:11px; font-weight:700; fill:#0D1B2A; text-anchor:middle; }
      .legend-txt { font-size:12px; fill:#0D1B2A; }
      .legend-sub { font-size:10.5px; fill:#5B6675; }
    </style>
  </defs>

  <rect width="1040" height="460" class="paper"/>
  <text x="40" y="42" class="kicker">CASUSDOSSIER NIVEAU 1 · WGP 2.0</text>
  <text x="40" y="72" class="title">Tijdlijn: directiebesluit tot stopzetting</text>

  <!-- as: maand 0 t/m 20 met eigen ruimte, maand 21-26 genummerd i.v.m. dichte clustering -->
  <line x1="70" y1="230" x2="970" y2="230" class="axis"/>

  <g>
    <!-- maand 0 -->
    <line x1="70" y1="222" x2="70" y2="238" class="tick"/>
    <circle cx="70" cy="230" r="7" class="dot"/>
    <text x="70" y="196" class="e-label">Directiebesluit</text>
    <text x="70" y="212" class="e-sub">"vervang portaal"</text>
    <text x="70" y="256" class="m-label">maand 0</text>

    <!-- maand 1-8 specificatie -->
    <line x1="105" y1="222" x2="105" y2="238" class="tick"/>
    <circle cx="105" cy="230" r="6" class="dot"/>
    <line x1="347" y1="222" x2="347" y2="238" class="tick"/>
    <circle cx="347" cy="230" r="6" class="dot"/>
    <text x="226" y="196" class="e-label">Specificatiefase</text>
    <text x="226" y="212" class="e-sub">340 pagina's, incl. schermontwerp</text>
    <text x="226" y="256" class="m-label">maand 1–8</text>

    <!-- maand 9-20 bouw -->
    <line x1="381" y1="222" x2="381" y2="238" class="tick"/>
    <circle cx="381" cy="230" r="6" class="dot"/>
    <line x1="762" y1="222" x2="762" y2="238" class="tick"/>
    <circle cx="762" cy="230" r="6" class="dot"/>
    <text x="571" y="196" class="e-label">Bouw</text>
    <text x="571" y="212" class="e-sub">wijzigingsverzoeken → "volgende fase"</text>
    <text x="571" y="256" class="m-label">maand 9–20</text>

    <!-- late cluster: maand 21, 22, 23-25, 26 — genummerde stippen, geen inline labels -->
    <line x1="797" y1="222" x2="797" y2="238" class="tick"/>
    <circle cx="797" cy="230" r="9" class="num-dot"/>
    <text x="797" y="234" class="num-text">1</text>

    <line x1="831" y1="222" x2="831" y2="238" class="tick"/>
    <circle cx="831" cy="230" r="9" class="num-dot"/>
    <text x="831" y="234" class="num-text">2</text>

    <line x1="866" y1="222" x2="866" y2="238" class="tick"/>
    <line x1="935" y1="222" x2="935" y2="238" class="tick"/>
    <line x1="866" y1="230" x2="935" y2="230" stroke="#8AAFD4" stroke-width="1.5"/>
    <circle cx="900" cy="230" r="9" class="num-dot"/>
    <text x="900" y="234" class="num-text">3</text>

    <line x1="970" y1="216" x2="970" y2="244" stroke="#E8A020" stroke-width="2.5"/>
    <circle cx="970" cy="230" r="10" class="dot-end"/>
    <text x="970" y="234" class="num-text" fill="#F5F4F0">4</text>

    <text x="880" y="256" class="m-label">maand 21–26</text>
  </g>

  <!-- legenda voor het genummerde cluster — voorkomt elke labelbotsing -->
  <g>
    <rect x="620" y="300" width="380" height="150" rx="8" fill="#FFFFFF" stroke="#E4E1D8" stroke-width="1.5"/>
    <text x="640" y="326" font-size="11" fill="#5B6675" letter-spacing="0.08em">MAAND 21–25 · UITGELICHT</text>

    <circle cx="646" cy="350" r="9" class="num-dot"/><text x="646" y="354" class="num-text">1</text>
    <text x="666" y="354" class="legend-txt">Oplevering fase 1 — maand 21</text>
    <text x="666" y="368" class="legend-sub">indienst-, uitdienst- en salarismutaties</text>

    <circle cx="646" cy="392" r="9" class="num-dot"/><text x="646" y="396" class="num-text">2</text>
    <text x="666" y="396" class="legend-txt">Livegang — maand 22</text>
    <text x="666" y="410" class="legend-sub">voor alle werkgevers</text>

    <circle cx="646" cy="430" r="9" class="num-dot"/><text x="646" y="434" class="num-text">3</text>
    <text x="666" y="434" class="legend-txt">Gebruik blijft achter — maand 23–25</text>
    <text x="666" y="448" class="legend-sub">Klantenservice-belverkeer +1/3</text>
  </g>

  <g>
    <rect x="330" y="300" width="270" height="90" rx="8" fill="#FFFFFF" stroke="#E8A020" stroke-width="2"/>
    <circle cx="360" cy="332" r="10" fill="#E8A020"/><text x="360" y="337" class="num-text" fill="#F5F4F0">4</text>
    <text x="382" y="328" class="legend-txt" fill="#8A5A0E" font-weight="700">Stopzetting — maand 26</text>
    <text x="382" y="346" class="legend-sub">vóór fase 2, na een post-mortem</text>
    <text x="382" y="362" class="legend-sub">met zeven bevindingen</text>
  </g>
</svg>
