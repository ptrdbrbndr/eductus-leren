<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="'DM Sans', Arial, sans-serif" width="900" height="420" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#F5F4F0; }
      .ent { fill:#C5D8F0; stroke:#1A4F8B; stroke-width:1.5; }
      .ent-text { font-size:14px; font-weight:700; fill:#0D1B2A; text-anchor:middle; }
      .rel { stroke:#5B6675; stroke-width:1.8; fill:none; }
      .rel-label { font-size:11px; fill:#5B6675; text-anchor:middle; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#0D1B2A; font-weight:600; }
    </style>
  </defs>

  <rect width="900" height="420" class="paper"/>
  <text x="40" y="42" class="kicker">DEEL 18 · EIGEN VORM, GEEN UML</text>
  <text x="40" y="72" class="title">Eenvoudige entiteitsschets</text>

  <rect x="120" y="160" width="200" height="80" rx="10" class="ent"/>
  <text x="220" y="192" class="ent-text">Deelnemer</text>
  <text x="220" y="212" font-size="10.5" fill="#5B6675" text-anchor="middle">bijv. werkgever</text>

  <line x1="320" y1="200" x2="560" y2="200" class="rel"/>
  <text x="440" y="188" class="rel-label">is betrokken bij</text>
  <text x="440" y="222" class="rel-label">(0 of meer, gelijktijdig toegestaan)</text>

  <rect x="560" y="160" width="220" height="80" rx="10" class="ent"/>
  <text x="670" y="192" class="ent-text">Gebeurtenis</text>
  <text x="670" y="212" font-size="10.5" fill="#5B6675" text-anchor="middle">bijv. correctiemutatie</text>

  <text x="450" y="330" text-anchor="middle" font-size="12" fill="#8A5A0E">De relatie staat expliciet meerdere gelijktijdige gebeurtenissen toe — geen 1-op-1 aanname</text>
</svg>
