<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'DM Sans', Arial, sans-serif" width="960" height="560" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#F5F4F0; }
      .field { fill:#FFFFFF; stroke:#1A4F8B; stroke-width:1.3; }
      .head { fill:#C5D8F0; }
      .label { font-size:12px; font-weight:700; fill:#0D1B2A; }
      .sub { font-size:10.5px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:26px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.1em; }
    </style>
  </defs>

  <rect width="960" height="560" class="paper"/>
  <text x="40" y="34" class="kicker">DEEL 18 · INSTRUMENT</text>
  <text x="40" y="64" class="title">De modelkeuzetabel</text>

  <rect x="40" y="106" width="880" height="36" class="head"/>
  <text x="56" y="129" class="label">VORM</text>
  <text x="300" y="129" class="label">WANNEER GESCHIKT</text>
  <text x="640" y="129" class="label">GEKOZEN?</text>

  <g>
    <rect x="40" y="142" width="880" height="48" class="field"/>
    <text x="56" y="170" class="sub">Proces</text>
    <text x="300" y="170" class="sub">volgorde van stappen is de kern</text>
  </g>
  <g>
    <rect x="40" y="190" width="880" height="48" class="field"/>
    <text x="56" y="218" class="sub">Entiteit &amp; relatie</text>
    <text x="300" y="218" class="sub">structuur en samenhang tussen gegevens is de kern</text>
  </g>
  <g>
    <rect x="40" y="238" width="880" height="48" class="field"/>
    <text x="56" y="266" class="sub">Bedrijfsregel</text>
    <text x="300" y="266" class="sub">een als-dan-conditie is de kern</text>
  </g>
  <g>
    <rect x="40" y="286" width="880" height="48" class="field"/>
    <text x="56" y="314" class="sub">Tekst / lijst</text>
    <text x="300" y="314" class="sub">geen van bovenstaande — eenvoud wint</text>
  </g>

  <!-- afsluitend -->
  <g>
    <circle cx="58" cy="368" r="15" fill="#E8A020"/>
    <path d="M52 368 l4 4 l8 -9" stroke="#0D1B2A" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="40" y="390" width="880" height="70" rx="6" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>
    <text x="56" y="416" class="label" fill="#8A5A0E">HET AFGEWEZEN ALTERNATIEF — afsluitend veld</text>
    <text x="56" y="436" class="sub">welke andere vorm overwoog je, en waarom paste die minder goed?</text>
  </g>
</svg>
