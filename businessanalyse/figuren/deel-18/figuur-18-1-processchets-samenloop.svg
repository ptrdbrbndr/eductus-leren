<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="'DM Sans', Arial, sans-serif" width="900" height="500" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#F5F4F0; }
      .step { fill:#C5D8F0; stroke:#1A4F8B; stroke-width:1.5; }
      .step-text { font-size:12px; font-weight:700; fill:#0D1B2A; text-anchor:middle; }
      .dec { fill:#F5D9A8; stroke:#8A5A0E; stroke-width:1.5; }
      .dec-text { font-size:11px; font-weight:700; fill:#0D1B2A; text-anchor:middle; }
      .arrow { stroke:#5B6675; stroke-width:1.8; fill:none; marker-end:url(#arr18); }
      .elabel { font-size:10.5px; fill:#5B6675; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#0D1B2A; font-weight:600; }
    </style>
    <marker id="arr18" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#5B6675"/></marker>
  </defs>

  <rect width="900" height="500" class="paper"/>
  <text x="40" y="42" class="kicker">DEEL 18 · EIGEN VORM, GEEN BPMN</text>
  <text x="40" y="72" class="title">Processchets met een beslispunt bij samenloop</text>

  <rect x="60" y="130" width="150" height="56" rx="8" class="step"/>
  <text x="135" y="163" class="step-text">Mutatie komt binnen</text>

  <path d="M210 158 L280 158" class="arrow"/>

  <path d="M280 122 L360 158 L280 194 L200 158 Z" class="dec"/>
  <text x="280" y="154" class="dec-text">Twee gelijktijdige</text>
  <text x="280" y="168" class="dec-text">gebeurtenissen?</text>

  <path d="M360 158 L440 100" class="arrow"/>
  <text x="380" y="112" class="elabel">nee</text>
  <rect x="440" y="72" width="160" height="56" rx="8" class="step"/>
  <text x="520" y="105" class="step-text">Standaard verwerken</text>

  <path d="M280 194 L280 260" class="arrow"/>
  <text x="290" y="230" class="elabel">ja</text>
  <rect x="200" y="260" width="160" height="56" rx="8" class="step"/>
  <text x="280" y="293" class="step-text">Volgorde vaststellen</text>

  <path d="M360 288 L440 288" class="arrow"/>
  <rect x="440" y="260" width="180" height="56" rx="8" class="step"/>
  <text x="530" y="293" class="step-text">Aangepast vervolg per volgorde</text>

  <text x="450" y="430" text-anchor="middle" font-size="12" fill="#8A5A0E">Rechthoek = stap · ruit = beslispunt met vraag en uitkomsten · pijl = volgorde</text>
</svg>
