<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="'DM Sans', Arial, sans-serif" width="960" height="600" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#FBFAF7; }
      .field { fill:#FFFFFF; stroke:#2563A8; stroke-width:1.4; }
      .head { fill:#CBDCEF; }
      .label { font-size:12px; font-weight:700; fill:#14213D; }
      .sub { font-size:10.5px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:26px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.1em; }
    </style>
  </defs>

  <rect width="960" height="600" class="paper"/>
  <text x="40" y="34" class="kicker">DEEL 15 · INSTRUMENT</text>
  <text x="40" y="64" class="title">Het workshopdraaiboek</text>

  <!-- tijdvakken -->
  <rect x="40" y="106" width="880" height="34" class="head"/>
  <text x="56" y="129" class="label">TIJDVAK</text>
  <text x="220" y="129" class="label">ONDERWERP</text>
  <text x="480" y="129" class="label">WERKVORM</text>
  <text x="680" y="129" class="label">BEOOGDE OUTPUT</text>

  <rect x="40" y="140" width="880" height="44" class="field"/>
  <text x="56" y="166" class="sub">09:00–09:20</text>
  <rect x="40" y="184" width="880" height="44" class="field"/>
  <text x="56" y="210" class="sub">09:20–10:30</text>
  <rect x="40" y="228" width="880" height="44" class="field"/>
  <text x="56" y="254" class="sub">10:30–11:00</text>

  <!-- escalatieprotocol -->
  <rect x="40" y="290" width="880" height="60" rx="6" class="field"/>
  <text x="56" y="314" class="label">ESCALATIEPROTOCOL</text>
  <text x="56" y="334" class="sub">wat te doen als de discussie vastloopt of een deelnemer domineert?</text>

  <!-- afsluitend -->
  <g>
    <circle cx="58" cy="382" r="15" fill="#E9A13B"/>
    <path d="M52 382 l4 4 l8 -9" stroke="#14213D" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="40" y="404" width="880" height="80" rx="6" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
    <text x="56" y="430" class="label" fill="#9A5F0D">VERLIEZERSPROTOCOL — afsluitend veld</text>
    <text x="56" y="450" class="sub">als de groep een besluit neemt waar jij het niet mee eens bent — hoe leg je</text>
    <text x="56" y="466" class="sub">dat vast, zonder de workshop te laten ontsporen in een herhaalde discussie?</text>
  </g>
</svg>
