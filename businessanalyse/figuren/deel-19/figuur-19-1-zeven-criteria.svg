<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="'DM Sans', Arial, sans-serif" width="960" height="540" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#F5F4F0; }
      .grp { fill:#C5D8F0; }
      .grp-text { font-size:12px; font-weight:700; fill:#1A4F8B; letter-spacing:.04em; }
      .item { fill:#FFFFFF; stroke:#1A4F8B; stroke-width:1.3; }
      .item-text { font-size:12px; fill:#0D1B2A; }
      .check { stroke:#1A4F8B; stroke-width:2; fill:none; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#0D1B2A; font-weight:600; }
    </style>
  </defs>

  <rect width="960" height="540" class="paper"/>
  <text x="40" y="42" class="kicker">DEEL 19 · ZEVEN CRITERIA, DRIE GROEPEN</text>
  <text x="40" y="72" class="title">De kwaliteitschecklist</text>

  <!-- groep helderheid -->
  <rect x="40" y="110" width="270" height="30" rx="4" class="grp"/>
  <text x="56" y="130" class="grp-text">HELDERHEID</text>
  <rect x="40" y="148" width="270" height="40" class="item"/><path d="M56 168 l6 6 l12 -14" class="check"/><text x="82" y="172" class="item-text">Ondubbelzinnig</text>
  <rect x="40" y="196" width="270" height="40" class="item"/><path d="M56 216 l6 6 l12 -14" class="check"/><text x="82" y="220" class="item-text">Beknopt</text>
  <rect x="40" y="244" width="270" height="40" class="item"/><path d="M56 264 l6 6 l12 -14" class="check"/><text x="82" y="268" class="item-text">Toetsbaar</text>

  <!-- groep volledigheid -->
  <rect x="345" y="110" width="270" height="30" rx="4" class="grp"/>
  <text x="361" y="130" class="grp-text">VOLLEDIGHEID</text>
  <rect x="345" y="148" width="270" height="40" class="item"/><path d="M361 168 l6 6 l12 -14" class="check"/><text x="387" y="172" class="item-text">Volledig</text>
  <rect x="345" y="196" width="270" height="40" class="item"/><path d="M361 216 l6 6 l12 -14" class="check"/><text x="387" y="220" class="item-text">Haalbaar</text>

  <!-- groep samenhang -->
  <rect x="650" y="110" width="270" height="30" rx="4" class="grp"/>
  <text x="666" y="130" class="grp-text">SAMENHANG MET DE KETEN</text>
  <rect x="650" y="148" width="270" height="40" class="item"/><path d="M666 168 l6 6 l12 -14" class="check"/><text x="692" y="172" class="item-text">Consistent</text>
  <rect x="650" y="196" width="270" height="40" class="item"/><path d="M666 216 l6 6 l12 -14" class="check"/><text x="692" y="220" class="item-text">Passend bij de gekozen vorm</text>

  <text x="480" y="330" text-anchor="middle" font-size="12" fill="#8AAFD4">Geen willekeurige zeven punten — samen bepalen ze of een requirement bruikbaar is voor de hele keten</text>
</svg>
