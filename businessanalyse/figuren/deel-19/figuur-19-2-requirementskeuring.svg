<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'DM Sans', Arial, sans-serif" width="960" height="560" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#F5F4F0; }
      .field { fill:#FFFFFF; stroke:#1A4F8B; stroke-width:1.3; }
      .label { font-size:13px; font-weight:700; fill:#0D1B2A; }
      .sub { font-size:11px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:26px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.1em; }
    </style>
  </defs>

  <rect width="960" height="560" class="paper"/>
  <text x="40" y="34" class="kicker">DEEL 19 · INSTRUMENT</text>
  <text x="40" y="64" class="title">De requirementskeuring</text>

  <rect x="40" y="112" width="880" height="70" rx="6" class="field"/>
  <text x="56" y="136" class="label">REQUIREMENT ONDER KEURING</text>
  <text x="56" y="158" class="sub">de tekst zoals aangeleverd, ongewijzigd overgenomen</text>

  <rect x="40" y="194" width="880" height="110" rx="6" class="field"/>
  <text x="56" y="218" class="label">TOETS TEGEN DE ZEVEN CRITERIA</text>
  <text x="56" y="240" class="sub">helderheid: ondubbelzinnig · beknopt · toetsbaar</text>
  <text x="56" y="258" class="sub">volledigheid: volledig · haalbaar</text>
  <text x="56" y="276" class="sub">samenhang: consistent · passend bij de gekozen vorm</text>

  <rect x="40" y="316" width="880" height="60" rx="6" class="field"/>
  <text x="56" y="340" class="label">OORDEEL</text>
  <text x="56" y="360" class="sub">goedgekeurd, of afgekeurd — met verwijzing naar het criterium</text>

  <!-- afsluitend, geoefend -->
  <g>
    <circle cx="58" cy="404" r="15" fill="#E8A020"/>
    <path d="M52 404 l4 4 l8 -9" stroke="#0D1B2A" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="40" y="426" width="880" height="70" rx="6" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>
    <text x="56" y="452" class="label" fill="#8A5A0E">DE EERSTE ZIN VAN DE AFKEURING — afsluitend, geoefend veld</text>
    <text x="56" y="472" class="sub">hoe begin je het gesprek met wie dit heeft aangeleverd, zonder verdediging op te roepen?</text>
  </g>
</svg>
