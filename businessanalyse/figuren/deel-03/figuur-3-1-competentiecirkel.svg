<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 720" font-family="'DM Sans', Arial, sans-serif" width="900" height="720" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#FBFAF7; }
      .node { fill:#CBDCEF; stroke:#2563A8; stroke-width:1.5; }
      .node-text { font-size:13px; font-weight:700; fill:#14213D; text-anchor:middle; }
      .node-sub { font-size:10px; fill:#2A4A72; text-anchor:middle; }
      .link { stroke:#6FA3D6; stroke-width:1.5; }
      .hub { fill:#E9A13B; }
      .hub-text { font-size:16px; font-weight:700; fill:#14213D; text-anchor:middle; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
    </style>
  </defs>

  <rect width="900" height="720" class="paper"/>
  <text x="40" y="42" class="kicker">DEEL 3 · ZES CATEGORIEËN, ÉÉN VERMOGEN</text>
  <text x="40" y="72" class="title">De competenties rond "doorvragen"</text>

  <!-- verbindingen naar hub -->
  <g class="link">
    <line x1="450" y1="410" x2="450" y2="205"/>
    <line x1="450" y1="410" x2="660" y2="300"/>
    <line x1="450" y1="410" x2="660" y2="520"/>
    <line x1="450" y1="410" x2="450" y2="615"/>
    <line x1="450" y1="410" x2="240" y2="520"/>
    <line x1="450" y1="410" x2="240" y2="300"/>
  </g>

  <!-- hub -->
  <circle cx="450" cy="410" r="58" class="hub"/>
  <text x="450" y="405" class="hub-text">Doorvragen</text>
  <text x="450" y="425" font-size="10.5" fill="#14213D" text-anchor="middle">in plaats van noteren</text>

  <!-- zes knopen, elk 210 breed, header + sub op eigen regels, ruim gemarcheerd -->
  <g>
    <rect x="345" y="130" width="210" height="72" rx="10" class="node"/>
    <text x="450" y="154" class="node-text">Analytisch vermogen</text>
    <text x="450" y="172" class="node-sub">patronen zien, opties afwegen</text>
  </g>
  <g>
    <rect x="590" y="255" width="210" height="72" rx="10" class="node"/>
    <text x="695" y="279" class="node-text">Gedragskenmerken</text>
    <text x="695" y="297" class="node-sub">ethiek, betrouwbaarheid</text>
  </g>
  <g>
    <rect x="590" y="490" width="210" height="72" rx="10" class="node"/>
    <text x="695" y="514" class="node-text">Vakkennis</text>
    <text x="695" y="532" class="node-sub">organisatie, sector, methoden</text>
  </g>
  <g>
    <rect x="345" y="620" width="210" height="72" rx="10" class="node"/>
    <text x="450" y="644" class="node-text">Communicatieve vaardigheden</text>
    <text x="450" y="662" class="node-sub">luisteren vóór zenden</text>
  </g>
  <g>
    <rect x="100" y="490" width="210" height="72" rx="10" class="node"/>
    <text x="205" y="514" class="node-text">Interactievaardigheden</text>
    <text x="205" y="532" class="node-sub">gezag zonder formele macht</text>
  </g>
  <g>
    <rect x="100" y="255" width="210" height="72" rx="10" class="node"/>
    <text x="205" y="279" class="node-text">Hulpmiddelen &amp; technologie</text>
    <text x="205" y="297" class="node-sub">instrument als middel, geen doel</text>
  </g>
</svg>
