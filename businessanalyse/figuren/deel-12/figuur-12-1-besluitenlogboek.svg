<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="'DM Sans', Arial, sans-serif" width="960" height="580" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#F5F4F0; }
      .field { fill:#FFFFFF; stroke:#1A4F8B; stroke-width:1.3; }
      .head { fill:#C5D8F0; }
      .label { font-size:12px; font-weight:700; fill:#0D1B2A; }
      .sub { font-size:10.5px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:26px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.1em; }
      .lane { font-size:10px; fill:#1A4F8B; font-weight:700; letter-spacing:.06em; }
    </style>
  </defs>

  <rect width="960" height="580" class="paper"/>
  <text x="40" y="34" class="kicker">DEEL 12 · INSTRUMENT</text>
  <text x="40" y="64" class="title">Het besluitenlogboek</text>

  <!-- twee lanes: BA-lijn en architectuurlijn, gedeeld logboek -->
  <text x="56" y="112" class="lane">GEDEELD TUSSEN BA- EN ARCHITECTUURLIJN</text>

  <rect x="40" y="122" width="880" height="40" class="head"/>
  <text x="56" y="147" class="label">BESLUIT</text>
  <text x="300" y="147" class="label">GENOMEN DOOR</text>
  <text x="480" y="147" class="label">DATUM</text>
  <text x="580" y="147" class="label">STATUS</text>
  <text x="720" y="147" class="label">LIJN</text>

  <rect x="40" y="162" width="880" height="60" class="field"/>
  <text x="56" y="188" class="sub">bijvoorbeeld: koppelvlak blijft synchroon</text>
  <text x="300" y="188" class="sub">stuurgroep</text>
  <text x="480" y="188" class="sub">—</text>
  <text x="580" y="188" class="sub">open / besloten / herzien</text>
  <text x="720" y="188" class="sub">BA of architectuur</text>

  <rect x="40" y="222" width="880" height="60" class="field"/>
  <rect x="40" y="282" width="880" height="60" class="field"/>

  <!-- afsluitend -->
  <g>
    <circle cx="58" cy="378" r="15" fill="#E8A020"/>
    <path d="M52 378 l4 4 l8 -9" stroke="#0D1B2A" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="40" y="400" width="880" height="70" rx="6" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>
    <text x="56" y="426" class="label" fill="#8A5A0E">EIGENAARSCHAP VOOR WIJZIGING — afsluitend veld</text>
    <text x="56" y="446" class="sub">wie kan dit besluit nog terugdraaien, en onder welke voorwaarde?</text>
    <text x="56" y="460" class="sub">voorkomt zowel stilzwijgend overschrijven als onaantastbaar worden</text>
  </g>
</svg>
