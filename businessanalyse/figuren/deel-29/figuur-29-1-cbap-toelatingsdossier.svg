<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="'DM Sans', Arial, sans-serif" width="960" height="580" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#F5F4F0; }
      .field { fill:#FFFFFF; stroke:#1A4F8B; stroke-width:1.3; }
      .label { font-size:12.5px; font-weight:700; fill:#0D1B2A; }
      .sub { font-size:10.5px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:26px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.1em; }
    </style>
  </defs>

  <rect width="960" height="580" class="paper"/>
  <text x="40" y="34" class="kicker">DEEL 29 · INSTRUMENT</text>
  <text x="40" y="64" class="title">Het CBAP-toelatingsdossier</text>

  <rect x="40" y="112" width="880" height="60" rx="6" class="field"/>
  <text x="56" y="136" class="label">UREN PER KENNISGEBIED</text>
  <text x="56" y="156" class="sub">7.500 uur totaal, 900 uur in 4 van de 6 kennisgebieden — uit het BA-urenlogboek (deel 22)</text>

  <rect x="40" y="184" width="880" height="60" rx="6" class="field"/>
  <text x="56" y="208" class="label">PD-UREN EN REFERENTIES</text>
  <text x="56" y="228" class="sub">35 PD-uren in 4 jaar, 2 referenties</text>

  <rect x="40" y="256" width="880" height="60" rx="6" class="field"/>
  <text x="56" y="280" class="label">ONDERBOUWENDE VOORBEELDEN</text>
  <text x="56" y="300" class="sub">per kennisgebied: concreet werk dat de opgevoerde uren aannemelijk maakt</text>

  <!-- afsluitend, eerlijk -->
  <g>
    <circle cx="58" cy="352" r="15" fill="#E8A020"/>
    <path d="M52 352 l4 4 l8 -9" stroke="#0D1B2A" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="40" y="374" width="880" height="80" rx="6" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>
    <text x="56" y="400" class="label" fill="#8A5A0E">DE REFERENTIETWIJFEL — afsluitend, eerlijk veld</text>
    <text x="56" y="420" class="sub">is er een referent die twijfelt of hij dit voor jou zou willen bevestigen —</text>
    <text x="56" y="436" class="sub">en wat zegt die twijfel over het dossier zelf?</text>
  </g>
</svg>
