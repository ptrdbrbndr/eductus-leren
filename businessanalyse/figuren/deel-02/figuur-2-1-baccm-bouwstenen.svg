<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" font-family="'DM Sans', Arial, sans-serif" width="900" height="700" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#FBFAF7; }
      .node { fill:#CBDCEF; stroke:#2563A8; stroke-width:1.5; }
      .node-text { font-size:16px; font-weight:700; fill:#14213D; text-anchor:middle; }
      .node-sub { font-size:11px; fill:#55606F; text-anchor:middle; }
      .link { stroke:#6FA3D6; stroke-width:1.5; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
    </style>
  </defs>

  <rect width="900" height="700" class="paper"/>
  <text x="40" y="42" class="kicker">DEEL 2 · ZES KERNCONCEPTEN, GEEN HIËRARCHIE</text>
  <text x="40" y="72" class="title">De zes bouwstenen van business-analyse</text>

  <!-- verbindingen: zeshoek onderling verbonden, geen hiërarchie -->
  <g>
    <!-- hexagon punten rond middelpunt 450,400, radius 220 -->
    <line x1="450" y1="180" x2="640" y2="290" class="link"/>
    <line x1="640" y1="290" x2="640" y2="510" class="link"/>
    <line x1="640" y1="510" x2="450" y2="620" class="link"/>
    <line x1="450" y1="620" x2="260" y2="510" class="link"/>
    <line x1="260" y1="510" x2="260" y2="290" class="link"/>
    <line x1="260" y1="290" x2="450" y2="180" class="link"/>
    <!-- diagonalen, dunner, tonen dat alles met alles samenhangt -->
    <g stroke="#CBDCEF" stroke-width="1">
      <line x1="450" y1="180" x2="640" y2="510"/>
      <line x1="450" y1="180" x2="260" y2="510"/>
      <line x1="640" y1="290" x2="260" y2="290"/>
      <line x1="640" y1="290" x2="450" y2="620"/>
      <line x1="260" y1="290" x2="450" y2="620"/>
      <line x1="640" y1="510" x2="260" y2="510"/>
    </g>
  </g>

  <!-- 6 knopen -->
  <g>
    <rect x="370" y="140" width="160" height="70" rx="10" class="node"/>
    <text x="450" y="170" class="node-text">Verandering</text>
    <text x="450" y="188" class="node-sub">welke transformatie</text>
  </g>
  <g>
    <rect x="560" y="255" width="160" height="70" rx="10" class="node"/>
    <text x="640" y="285" class="node-text">Behoefte</text>
    <text x="640" y="303" class="node-sub">probleem of kans</text>
  </g>
  <g>
    <rect x="560" y="475" width="160" height="70" rx="10" class="node"/>
    <text x="640" y="505" class="node-text">Oplossing</text>
    <text x="640" y="523" class="node-sub">manier om tegemoet te komen</text>
  </g>
  <g>
    <rect x="370" y="585" width="160" height="70" rx="10" class="node"/>
    <text x="450" y="615" class="node-text">Belanghebbende</text>
    <text x="450" y="633" class="node-sub">relatie ermee</text>
  </g>
  <g>
    <rect x="180" y="475" width="160" height="70" rx="10" class="node"/>
    <text x="260" y="505" class="node-text">Waarde</text>
    <text x="260" y="523" class="node-sub">belang, voor wie</text>
  </g>
  <g>
    <rect x="180" y="255" width="160" height="70" rx="10" class="node"/>
    <text x="260" y="285" class="node-text">Context</text>
    <text x="260" y="303" class="node-sub">wat maakt dit mogelijk</text>
  </g>

  <!-- geen middelpunt-knoop: bewust, illustreert "geen hiërarchie" -->
  <text x="450" y="405" text-anchor="middle" font-size="12" fill="#6FA3D6" letter-spacing="0.08em">GEEN HIËRARCHIE — ELK CONCEPT WEEGT GELIJK</text>
</svg>
