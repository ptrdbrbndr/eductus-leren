<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="'DM Sans', Arial, sans-serif" width="960" height="660" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#F5F4F0; }
      .field { fill:#FFFFFF; stroke:#1A4F8B; stroke-width:1.5; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .sub { font-size:10.5px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:26px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.1em; }
    </style>
  </defs>

  <rect width="960" height="660" class="paper"/>
  <text x="40" y="34" class="kicker">DEEL 2 · INSTRUMENT</text>
  <text x="40" y="64" class="title">Het evenwichtsblad</text>

  <!-- 2x3 grid van de zes concepten, sub-tekst nu op twee regels -->
  <g>
    <rect x="40" y="112" width="280" height="120" rx="6" class="field"/>
    <text x="56" y="136" class="label">VERANDERING</text>
    <text x="56" y="158" class="sub">welke transformatie</text>
    <text x="56" y="174" class="sub">speelt hier?</text>

    <rect x="340" y="112" width="280" height="120" rx="6" class="field"/>
    <text x="356" y="136" class="label">BEHOEFTE</text>
    <text x="356" y="158" class="sub">welk probleem of welke kans</text>
    <text x="356" y="174" class="sub">ligt eraan ten grondslag?</text>

    <rect x="640" y="112" width="280" height="120" rx="6" class="field"/>
    <text x="656" y="136" class="label">OPLOSSING</text>
    <text x="656" y="158" class="sub">welke manier om tegemoet te komen</text>
    <text x="656" y="174" class="sub">ligt er, of wordt overwogen?</text>

    <rect x="40" y="244" width="280" height="120" rx="6" class="field"/>
    <text x="56" y="268" class="label">BELANGHEBBENDE(N)</text>
    <text x="56" y="290" class="sub">wie heeft er een relatie</text>
    <text x="56" y="306" class="sub">mee, en welke?</text>

    <rect x="340" y="244" width="280" height="120" rx="6" class="field"/>
    <text x="356" y="268" class="label">WAARDE</text>
    <text x="356" y="290" class="sub">wat is het belang, en</text>
    <text x="356" y="306" class="sub">voor wie precies?</text>

    <rect x="640" y="244" width="280" height="120" rx="6" class="field"/>
    <text x="656" y="268" class="label">CONTEXT</text>
    <text x="656" y="290" class="sub">welke omstandigheden maken</text>
    <text x="656" y="306" class="sub">dit mogelijk of juist lastig?</text>
  </g>

  <!-- afsluitende, verbindende zevende stap -->
  <g>
    <circle cx="58" cy="406" r="15" fill="#E8A020"/>
    <path d="M52 406 l4 4 l8 -9" stroke="#0D1B2A" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="40" y="428" width="880" height="92" rx="6" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>
    <text x="56" y="454" class="label" fill="#8A5A0E">SPANNINGSTOETS — het zevende, verbindende veld</text>
    <text x="56" y="478" class="sub">welk vakje is leeg, terwijl een aanpalend vakje wél vol is?</text>
    <text x="56" y="496" class="sub">welk vakje bevat een woord in plaats van een antwoord?</text>
  </g>

  <text x="480" y="576" text-anchor="middle" font-size="12" fill="#8AAFD4" letter-spacing="0.04em">ZES GELIJKWAARDIGE VAKKEN — DE SPANNING TUSSEN VAKKEN IS WAAR DE ANALYSE BEGINT</text>
</svg>
