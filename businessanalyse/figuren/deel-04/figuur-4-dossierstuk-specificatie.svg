<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" font-family="Georgia, 'Times New Roman', serif" width="720" height="560" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#F5F4F0; }
      .doc { fill:#FFFFFF; stroke:#5B6675; stroke-width:1; }
      .docline { stroke:#C9C6BC; stroke-width:1.2; }
      .field-outline { fill:none; stroke:#B7412E; stroke-width:1.2; stroke-dasharray:3 2; }
      .docheader { font-size:11px; fill:#5B6675; }
      .doctitle { font-size:13px; fill:#0D1B2A; font-weight:700; }
      .kicker { font-family:'DM Sans', Arial, sans-serif; font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:22px; fill:#0D1B2A; font-weight:600; }
      .cap { font-family:'DM Sans', Arial, sans-serif; font-size:11px; fill:#8A5A0E; }
    </style>
  </defs>

  <rect width="720" height="560" class="paper"/>
  <text x="40" y="36" class="kicker">DOSSIERSTUK 4-A · WGP 2.0 · GEEN DUCTUS-INSTRUMENT</text>
  <text x="40" y="62" class="title">Fragment specificatie, tot op veldniveau</text>

  <!-- pagina-faksimile -->
  <rect x="140" y="90" width="440" height="400" class="doc"/>
  <text x="164" y="118" class="docheader">Functioneel Ontwerp WGP 2.0 — v3.2 — pagina 214 van 340</text>
  <line x1="164" y1="128" x2="556" y2="128" class="docline"/>
  <text x="164" y="152" class="doctitle">4.7.12 — Correctiemutatie, veld "Ingangsdatum"</text>

  <line x1="164" y1="172" x2="556" y2="172" class="docline"/>
  <line x1="164" y1="188" x2="556" y2="188" class="docline"/>
  <line x1="164" y1="204" x2="480" y2="204" class="docline"/>

  <!-- veldspecificatie-blok, uitvoerig -->
  <rect x="164" y="220" width="392" height="130" class="field-outline"/>
  <text x="176" y="238" class="docheader" font-weight="700">Veld: Ingangsdatum</text>
  <line x1="176" y1="250" x2="540" y2="250" class="docline"/>
  <line x1="176" y1="264" x2="540" y2="264" class="docline"/>
  <line x1="176" y1="278" x2="540" y2="278" class="docline"/>
  <line x1="176" y1="292" x2="480" y2="292" class="docline"/>
  <line x1="176" y1="312" x2="540" y2="312" class="docline"/>
  <line x1="176" y1="326" x2="500" y2="326" class="docline"/>
  <text x="176" y="344" class="docheader" font-style="italic">Schermontwerp §4.7.12.3, kleurcode #2E5B8C</text>

  <line x1="164" y1="370" x2="556" y2="370" class="docline"/>
  <line x1="164" y1="386" x2="556" y2="386" class="docline"/>
  <line x1="164" y1="402" x2="440" y2="402" class="docline"/>
  <line x1="164" y1="426" x2="556" y2="426" class="docline"/>
  <line x1="164" y1="442" x2="500" y2="442" class="docline"/>
  <line x1="164" y1="458" x2="556" y2="458" class="docline"/>

  <text x="140" y="512" class="cap">340 pagina's tot op veldniveau — kleurenpalet en lettertype specificeren wat in een</text>
  <text x="140" y="530" class="cap">requirementsdocument niet thuishoort. Dit is illustratief, geen te ontwerpen Ductus-figuur.</text>
</svg>
