<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="'DM Sans', Arial, sans-serif" width="900" height="520" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#FBFAF7; }
      .track { stroke:#6FA3D6; stroke-width:6; stroke-linecap:round; }
      .knob { fill:#2563A8; stroke:#FFFFFF; stroke-width:2; }
      .knob-open { fill:#E9A13B; stroke:#FFFFFF; stroke-width:2; }
      .end { font-size:15px; font-weight:700; fill:#14213D; }
      .flabel { font-size:12.5px; fill:#14213D; font-weight:600; }
      .fval { font-size:11px; fill:#55606F; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
    </style>
  </defs>

  <rect width="900" height="520" class="paper"/>
  <text x="40" y="42" class="kicker">DEEL 4 · VIJF SCHUIFKNOPPEN, ÉÉN POSITIE</text>
  <text x="40" y="72" class="title">Van voorspellend naar adaptief</text>

  <text x="100" y="120" class="end" text-anchor="middle">Voorspellend</text>
  <text x="800" y="120" class="end" text-anchor="middle">Adaptief</text>

  <!-- 5 rails, elk een factor -->
  <g>
    <line x1="100" y1="160" x2="800" y2="160" class="track"/>
    <circle cx="620" cy="160" r="10" class="knob"/>
    <text x="100" y="185" class="flabel">Bekendheid van de behoefte</text>
    <text x="800" y="185" class="fval" text-anchor="end">goed bekend → voorspellend</text>
  </g>
  <g>
    <line x1="100" y1="220" x2="800" y2="220" class="track"/>
    <circle cx="560" cy="220" r="10" class="knob"/>
    <text x="100" y="245" class="flabel">Stabiliteit van de context</text>
    <text x="800" y="245" class="fval" text-anchor="end">veranderend → adaptief</text>
  </g>
  <g>
    <line x1="100" y1="280" x2="800" y2="280" class="track"/>
    <circle cx="260" cy="280" r="10" class="knob"/>
    <text x="100" y="305" class="flabel">Kosten van achteraf bijsturen</text>
    <text x="800" y="305" class="fval" text-anchor="end">hoog → voorspellend</text>
  </g>
  <g>
    <line x1="100" y1="340" x2="800" y2="340" class="track"/>
    <circle cx="470" cy="340" r="10" class="knob"/>
    <text x="100" y="365" class="flabel">Beschikbaarheid belanghebbenden</text>
    <text x="800" y="365" class="fval" text-anchor="end">doorlopend → adaptief</text>
  </g>
  <g>
    <line x1="100" y1="400" x2="800" y2="400" class="track"/>
    <circle cx="330" cy="400" r="10" class="knob-open"/>
    <text x="100" y="425" class="flabel" fill="#9A5F0D">Gebruikelijk in de organisatie</text>
    <text x="800" y="425" class="fval" text-anchor="end" fill="#9A5F0D">factor, geen vrijbrief</text>
  </g>

  <text x="450" y="480" text-anchor="middle" font-size="12" fill="#6FA3D6" letter-spacing="0.04em">GEEN VAN DE VIJF FACTOREN STAAT VAST VOORDAT ZE BEWUST IS AFGEWOGEN</text>
</svg>
