<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="'DM Sans', Arial, sans-serif" width="900" height="460" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#FBFAF7; }
      .track { stroke:#6FA3D6; stroke-width:6; stroke-linecap:round; }
      .knob { fill:#2563A8; stroke:#FFFFFF; stroke-width:2; }
      .end { font-size:14px; font-weight:700; fill:#14213D; }
      .cap-text { font-size:13px; font-weight:700; fill:#14213D; }
      .sub { font-size:10.5px; fill:#55606F; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
    </style>
  </defs>

  <rect width="900" height="460" class="paper"/>
  <text x="40" y="42" class="kicker">DEEL 24 · VERMOGEN, LOSGEKOPPELD VAN INVULLING</text>
  <text x="40" y="72" class="title">Capability-gereedheid</text>

  <text x="100" y="120" class="end" text-anchor="middle">niet gereed</text>
  <text x="800" y="120" class="end" text-anchor="middle">volledig gereed</text>

  <g>
    <text x="90" y="155" class="cap-text">Correcties met terugwerkende kracht</text>
    <line x1="100" y1="175" x2="800" y2="175" class="track"/>
    <circle cx="640" cy="175" r="10" class="knob"/>
    <text x="90" y="198" class="sub">huidige invulling: handmatig — het vermogen zelf is al grotendeels aanwezig</text>
  </g>
  <g>
    <text x="90" y="245" class="cap-text">Zelfbediening buiten kantoortijd</text>
    <line x1="100" y1="265" x2="800" y2="265" class="track"/>
    <circle cx="280" cy="265" r="10" class="knob"/>
    <text x="90" y="288" class="sub">huidige invulling: geen — vermogen moet grotendeels worden opgebouwd</text>
  </g>
  <g>
    <text x="90" y="335" class="cap-text">Samenloop van gebeurtenissen verwerken</text>
    <line x1="100" y1="355" x2="800" y2="355" class="track"/>
    <circle cx="440" cy="355" r="10" class="knob"/>
    <text x="90" y="378" class="sub">huidige invulling: gedeeltelijk, via handmatige correctie</text>
  </g>

  <text x="450" y="425" text-anchor="middle" font-size="12" fill="#6FA3D6">Gereedheid is een schaal, geen aan/uit — en zegt niets over hoe het vandaag is ingevuld</text>
</svg>
