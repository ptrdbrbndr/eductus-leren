<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="'DM Sans', Arial, sans-serif" width="900" height="480" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#FBFAF7; }
      .node { fill:#CBDCEF; stroke:#2563A8; stroke-width:1.5; }
      .node-text { font-size:14px; font-weight:700; fill:#14213D; text-anchor:middle; }
      .ex { font-size:11px; fill:#55606F; text-anchor:middle; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
    </style>
  </defs>

  <rect width="900" height="480" class="paper"/>
  <text x="40" y="42" class="kicker">DEEL 7 · VIER SOORTEN RELATIE TOT DE VERANDERING</text>
  <text x="40" y="72" class="title">Wie is een belanghebbende?</text>

  <g>
    <rect x="60" y="110" width="380" height="120" rx="10" class="node"/>
    <text x="250" y="145" class="node-text">Ondervindt</text>
    <text x="250" y="165" class="ex">de behoefte, of het gevolg van de oplossing</text>
    <text x="250" y="190" class="ex" font-style="italic">Gerard Hoogewerf · Klantenservice werkgevers</text>
  </g>
  <g>
    <rect x="460" y="110" width="380" height="120" rx="10" class="node"/>
    <text x="650" y="145" class="node-text">Beslist</text>
    <text x="650" y="165" class="ex">erover</text>
    <text x="650" y="190" class="ex" font-style="italic">stuurgroep · Hanneke Steenbergen · MT</text>
  </g>
  <g>
    <rect x="60" y="250" width="380" height="120" rx="10" class="node"/>
    <text x="250" y="285" class="node-text">Werkt eraan mee</text>
    <text x="250" y="305" class="ex">of moet ermee werken</text>
    <text x="250" y="330" class="ex" font-style="italic">analisten · bouwers · Klantenservice (vaak vergeten)</text>
  </g>
  <g>
    <rect x="460" y="250" width="380" height="120" rx="10" class="node"/>
    <text x="650" y="285" class="node-text">Heeft zeggenschap</text>
    <text x="650" y="305" class="ex">vanuit een andere rol</text>
    <text x="650" y="330" class="ex" font-style="italic">toezicht, regelgeving, aangrenzend systeem</text>
  </g>

  <text x="450" y="420" text-anchor="middle" font-size="12" fill="#9A5F0D">Eén persoon kan in meerdere categorieën tegelijk vallen — Klantenservice ondervindt én moet ermee werken</text>
</svg>
