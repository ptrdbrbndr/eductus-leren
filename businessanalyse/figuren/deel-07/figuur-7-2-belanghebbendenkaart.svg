<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'DM Sans', Arial, sans-serif" width="960" height="560" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#F5F4F0; }
      .field { fill:#FFFFFF; stroke:#1A4F8B; stroke-width:1.3; }
      .head { fill:#C5D8F0; }
      .label { font-size:12.5px; font-weight:700; fill:#0D1B2A; }
      .sub { font-size:10.5px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:26px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
    </style>
  </defs>

  <rect width="960" height="560" class="paper"/>
  <text x="40" y="34" class="kicker">DEEL 7 · INSTRUMENT</text>
  <text x="40" y="64" class="title">De belanghebbendenkaart</text>

  <!-- tabel: kolomkoppen -->
  <rect x="40" y="106" width="880" height="40" class="head"/>
  <text x="56" y="131" class="label">WIE</text>
  <text x="290" y="131" class="label">RELATIE</text>
  <text x="480" y="131" class="label">ROL, BELANG, INVLOED</text>
  <text x="740" y="131" class="label">AL GESPROKEN?</text>

  <!-- 3 voorbeeldrijen -->
  <g>
    <rect x="40" y="146" width="880" height="70" class="field"/>
    <text x="56" y="172" class="sub">Gerard Hoogewerf</text>
    <text x="290" y="172" class="sub">ondervindt</text>
    <text x="480" y="172" class="sub">kleine werkgever, avondgebruiker</text>
    <text x="740" y="172" class="sub">ja — open interview</text>
  </g>
  <g>
    <rect x="40" y="216" width="880" height="70" class="field"/>
    <text x="56" y="242" class="sub">Klantenservice werkgevers</text>
    <text x="290" y="242" class="sub">ondervindt + werkt mee</text>
    <text x="480" y="242" class="sub">vangt uitzonderingen op — dubbele relatie</text>
    <text x="740" y="242" class="sub">nee</text>
  </g>
  <g>
    <rect x="40" y="286" width="880" height="70" class="field"/>
    <text x="56" y="312" class="sub">Hanneke Steenbergen</text>
    <text x="290" y="312" class="sub">beslist</text>
    <text x="480" y="312" class="sub">opdrachtgever, stuurgroep</text>
    <text x="740" y="312" class="sub">ja</text>
  </g>

  <!-- afsluitend: representativiteitstoets -->
  <g>
    <circle cx="58" cy="408" r="15" fill="#E8A020"/>
    <path d="M52 408 l4 4 l8 -9" stroke="#0D1B2A" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="40" y="430" width="880" height="90" rx="6" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>
    <text x="56" y="456" class="label" fill="#8A5A0E">REPRESENTATIVITEITSTOETS — afsluitend, verplicht</text>
    <text x="56" y="478" class="sub">wie ontbreekt op deze kaart?</text>
    <text x="56" y="496" class="sub">is dat toevallig, of stelselmatig?</text>
  </g>
</svg>
