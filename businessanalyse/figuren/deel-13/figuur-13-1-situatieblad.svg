<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="'DM Sans', Arial, sans-serif" width="960" height="600" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#F5F4F0; }
      .field { fill:#FFFFFF; stroke:#1A4F8B; stroke-width:1.4; }
      .label { font-size:13px; font-weight:700; fill:#0D1B2A; }
      .sub { font-size:11px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:26px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.1em; }
      .gap { fill:#F5D9A8; }
    </style>
    <marker id="arr13" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1A4F8B"/>
    </marker>
  </defs>

  <rect width="960" height="600" class="paper"/>
  <text x="40" y="34" class="kicker">DEEL 13 · INSTRUMENT</text>
  <text x="40" y="64" class="title">Het situatieblad</text>

  <rect x="40" y="112" width="330" height="160" rx="6" class="field"/>
  <text x="56" y="138" class="label">HUIDIGE SITUATIE</text>
  <text x="56" y="160" class="sub">lappendeken · prima met</text>
  <text x="56" y="176" class="sub">zwakke plekken · nooit voor</text>
  <text x="56" y="192" class="sub">deze schaal ontworpen ·</text>
  <text x="56" y="208" class="sub">veel handmatig werk</text>

  <rect x="590" y="112" width="330" height="160" rx="6" class="field"/>
  <text x="606" y="138" class="label">GEWENSTE SITUATIE</text>

  <rect x="395" y="150" width="170" height="80" rx="6" class="gap"/>
  <text x="480" y="180" text-anchor="middle" class="label" fill="#8A5A0E">HET GAT</text>
  <text x="480" y="200" text-anchor="middle" font-size="10" fill="#8A5A0E">tussen huidig en gewenst</text>
  <line x1="370" y1="190" x2="393" y2="190" stroke="#1A4F8B" stroke-width="2" marker-end="url(#arr13)"/>
  <line x1="567" y1="190" x2="588" y2="190" stroke="#1A4F8B" stroke-width="2" marker-end="url(#arr13)"/>

  <rect x="40" y="292" width="880" height="70" rx="6" class="field"/>
  <text x="56" y="316" class="label">OVERGANGSAANPAK</text>
  <text x="56" y="336" class="sub">in welke stappen, en in welke volgorde, wordt het gat gedicht?</text>

  <!-- afsluitend, kritisch -->
  <g>
    <circle cx="58" cy="392" r="15" fill="#E8A020"/>
    <path d="M52 392 l4 4 l8 -9" stroke="#0D1B2A" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="40" y="414" width="880" height="70" rx="6" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>
    <text x="56" y="440" class="label" fill="#8A5A0E">AANNAMES — afsluitend, kritisch veld</text>
    <text x="56" y="460" class="sub">welke aanname over de huidige situatie is nooit geverifieerd, alleen verondersteld?</text>
  </g>
</svg>
