<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="'DM Sans', Arial, sans-serif" width="1000" height="420" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#F5F4F0; }
      .req { fill:#E8A020; stroke:#8A5A0E; stroke-width:1.5; }
      .req-text { font-size:14px; font-weight:700; fill:#0D1B2A; text-anchor:middle; }
      .node { fill:#C5D8F0; stroke:#1A4F8B; stroke-width:1.5; }
      .node-text { font-size:11.5px; font-weight:700; fill:#0D1B2A; text-anchor:middle; }
      .back { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .fwd { stroke:#5B6675; stroke-width:2; fill:none; marker-end:url(#arrf); }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#0D1B2A; font-weight:600; }
      .dir { font-size:11px; fill:#5B6675; font-weight:700; letter-spacing:.06em; }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1A4F8B"/></marker>
    <marker id="arrf" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#5B6675"/></marker>
  </defs>

  <rect width="1000" height="420" class="paper"/>
  <text x="40" y="42" class="kicker">DEEL 16 · ÉÉN REQUIREMENT, TWEE RICHTINGEN</text>
  <text x="40" y="72" class="title">Achterwaarts en voorwaarts</text>

  <text x="140" y="130" class="dir" text-anchor="middle">ACHTERWAARTS — waar komt dit vandaan?</text>
  <text x="860" y="130" class="dir" text-anchor="middle">VOORWAARTS — waar leidt dit naartoe?</text>

  <!-- centraal requirement -->
  <rect x="440" y="180" width="120" height="60" rx="8" class="req"/>
  <text x="500" y="216" class="req-text">Requirement</text>

  <!-- achterwaarts: 3 nodes links -->
  <rect x="60" y="150" width="150" height="50" rx="8" class="node"/>
  <text x="135" y="180" class="node-text">Behoefte</text>
  <rect x="60" y="215" width="150" height="50" rx="8" class="node"/>
  <text x="135" y="245" class="node-text">Belanghebbende</text>
  <rect x="60" y="280" width="150" height="50" rx="8" class="node"/>
  <text x="135" y="310" class="node-text">Besluit</text>

  <path d="M210 175 L438 195" class="back"/>
  <path d="M210 240 L438 215" class="back"/>
  <path d="M210 305 L438 230" class="back"/>

  <!-- voorwaarts: 3 nodes rechts -->
  <rect x="790" y="150" width="150" height="50" rx="8" class="node"/>
  <text x="865" y="180" class="node-text">Ontwerp</text>
  <rect x="790" y="215" width="150" height="50" rx="8" class="node"/>
  <text x="865" y="245" class="node-text">Test</text>
  <rect x="790" y="280" width="150" height="50" rx="8" class="node"/>
  <text x="865" y="310" class="node-text">Uitkomst</text>

  <path d="M562 195 L788 175" class="fwd"/>
  <path d="M562 215 L788 240" class="fwd"/>
  <path d="M562 230 L788 305" class="fwd"/>

  <text x="500" y="380" text-anchor="middle" font-size="12" fill="#8AAFD4">Wijzigt het requirement? Elke pijl is een signaal dat moet lopen — in beide richtingen</text>
</svg>
