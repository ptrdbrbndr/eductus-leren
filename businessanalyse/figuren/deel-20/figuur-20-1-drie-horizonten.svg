<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="'DM Sans', Arial, sans-serif" width="960" height="480" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#FBFAF7; }
      .h1 { fill:#6FA3D6; }
      .h2 { fill:#3F7AB8; }
      .h3 { fill:#2563A8; }
      .h-text { font-size:15px; font-weight:700; fill:#14213D; text-anchor:middle; }
      .h-text-light { font-size:15px; font-weight:700; fill:#FBFAF7; text-anchor:middle; }
      .h-sub { font-size:11px; fill:#14213D; text-anchor:middle; }
      .h-sub-light { font-size:11px; fill:#DFDCD3; text-anchor:middle; }
      .mindset { fill:#F5D9A8; opacity:0.55; }
      .mindset-text { font-size:11px; font-weight:700; fill:#9A5F0D; text-anchor:middle; letter-spacing:.04em; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
    </style>
  </defs>

  <rect width="960" height="480" class="paper"/>
  <text x="40" y="42" class="kicker">DEEL 20 · AGILE BUSINESS-ANALYSE</text>
  <text x="40" y="72" class="title">Drie horizonten, één doorlopende mindset</text>

  <!-- mindset-laag doorkruist alle drie -->
  <rect x="60" y="110" width="840" height="270" rx="10" class="mindset"/>
  <text x="480" y="132" class="mindset-text">MINDSET — LOOPT DOOR ALLE DRIE HEEN</text>

  <!-- drie horizonten, breed→smal -->
  <rect x="90" y="160" width="240" height="190" rx="10" class="h1"/>
  <text x="210" y="200" class="h-text">Strategieniveau</text>
  <text x="210" y="222" class="h-sub">langste termijn</text>
  <text x="210" y="238" class="h-sub">minste detail</text>
  <text x="210" y="260" class="h-sub">welke initiatieven</text>
  <text x="210" y="276" class="h-sub">zijn het waard?</text>

  <rect x="360" y="160" width="240" height="190" rx="10" class="h2"/>
  <text x="480" y="200" class="h-text-light">Initiatiefniveau</text>
  <text x="480" y="222" class="h-sub-light">middellange termijn</text>
  <text x="480" y="260" class="h-sub-light">hoe creëert dit</text>
  <text x="480" y="276" class="h-sub-light">initiatief waarde?</text>

  <rect x="630" y="160" width="240" height="190" rx="10" class="h3"/>
  <text x="750" y="200" class="h-text-light">Opleverniveau</text>
  <text x="750" y="222" class="h-sub-light">kortste termijn</text>
  <text x="750" y="238" class="h-sub-light">meeste detail</text>
  <text x="750" y="260" class="h-sub-light">requirements klaar</text>
  <text x="750" y="276" class="h-sub-light">om te bouwen</text>

  <text x="480" y="420" text-anchor="middle" font-size="12" fill="#6FA3D6">Geen trechter: elk niveau blijft doorlopend actief, niet eenmalig doorlopen</text>
</svg>
