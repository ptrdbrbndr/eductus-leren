<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="'DM Sans', Arial, sans-serif" width="960" height="600" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#F5F4F0; }
      .field { fill:#FFFFFF; stroke:#1A4F8B; stroke-width:1.4; }
      .label { font-size:12.5px; font-weight:700; fill:#0D1B2A; }
      .sub { font-size:10.5px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:26px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.1em; }
      .arrow { stroke:#8AAFD4; stroke-width:1.8; fill:none; marker-end:url(#arr20); }
    </style>
    <marker id="arr20" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#8AAFD4"/></marker>
  </defs>

  <rect width="960" height="600" class="paper"/>
  <text x="40" y="34" class="kicker">DEEL 20 · INSTRUMENT</text>
  <text x="40" y="64" class="title">De drie-horizontenkaart</text>

  <rect x="40" y="112" width="270" height="130" rx="6" class="field"/>
  <text x="56" y="136" class="label">STRATEGIE</text>
  <text x="56" y="158" class="sub">welke initiatieven?</text>

  <rect x="345" y="112" width="270" height="130" rx="6" class="field"/>
  <text x="361" y="136" class="label">INITIATIEF</text>
  <text x="361" y="158" class="sub">hoe creëert dit waarde?</text>

  <rect x="650" y="112" width="270" height="130" rx="6" class="field"/>
  <text x="666" y="136" class="label">OPLEVERING</text>
  <text x="666" y="158" class="sub">klaar om te bouwen?</text>

  <path d="M310 178 L345 178" class="arrow"/>
  <path d="M615 178 L650 178" class="arrow"/>

  <text x="480" y="272" text-anchor="middle" font-size="11" fill="#5B6675">terugstroom: inzichten van opleverniveau voeden strategie- en initiatiefniveau terug</text>
  <path d="M780 250 Q 480 300 180 250" class="arrow" stroke-dasharray="4 4"/>

  <!-- afsluitend -->
  <g>
    <circle cx="58" cy="326" r="15" fill="#E8A020"/>
    <path d="M52 326 l4 4 l8 -9" stroke="#0D1B2A" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="40" y="348" width="880" height="90" rx="6" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>
    <text x="56" y="374" class="label" fill="#8A5A0E">TERUGSTROOM EN VERPLAATSINGSVRAAG — afsluitende, doorlopende velden</text>
    <text x="56" y="394" class="sub">welk inzicht van het opleverniveau hoort eigenlijk terug naar strategie of initiatief?</text>
    <text x="56" y="410" class="sub">verschuift iets van horizon — hoort wat gisteren strategie was nu bij initiatief?</text>
  </g>
</svg>
