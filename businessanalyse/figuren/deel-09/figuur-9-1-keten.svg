<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="'DM Sans', Arial, sans-serif" width="900" height="420" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#F5F4F0; }
      .node { fill:#C5D8F0; stroke:#1A4F8B; stroke-width:1.5; }
      .head { font-size:16px; font-weight:700; fill:#0D1B2A; text-anchor:middle; }
      .sub { font-size:11px; fill:#5B6675; text-anchor:middle; }
      .arrow { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arr); }
      .break-arrow { stroke:#E8A020; stroke-width:2.5; stroke-dasharray:6 5; fill:none; marker-end:url(#arramber); }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#0D1B2A; font-weight:600; }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1A4F8B"/>
    </marker>
    <marker id="arramber" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#E8A020"/>
    </marker>
  </defs>

  <rect width="900" height="420" class="paper"/>
  <text x="40" y="42" class="kicker">DEEL 9 · WAAR DE KETEN BREEKT</text>
  <text x="40" y="72" class="title">Output → uitkomst → waarde</text>

  <rect x="60" y="150" width="200" height="90" rx="10" class="node"/>
  <text x="160" y="185" class="head">Output</text>
  <text x="160" y="205" class="sub">portaal is opgeleverd</text>
  <text x="160" y="222" class="sub">en werkt</text>

  <path d="M264 195 L380 195" class="break-arrow"/>
  <text x="322" y="175" font-size="13" fill="#8A5A0E" text-anchor="middle" font-weight="700">✕</text>
  <text x="322" y="230" font-size="10.5" fill="#8A5A0E" text-anchor="middle">keten breekt hier</text>

  <rect x="384" y="150" width="200" height="90" rx="10" class="node" opacity="0.5"/>
  <text x="484" y="185" class="head" opacity="0.6">Uitkomst</text>
  <text x="484" y="205" class="sub">gedrag verandert</text>
  <text x="484" y="222" class="sub">(bleef uit)</text>

  <path d="M588 195 L700 195" class="arrow" opacity="0.3"/>

  <rect x="700" y="150" width="200" height="90" rx="10" class="node" opacity="0.35"/>
  <text x="800" y="185" class="head" opacity="0.5">Waarde</text>
  <text x="800" y="205" class="sub" opacity="0.7">nooit bereikt</text>

  <text x="160" y="270" class="sub" font-style="italic">Klantenservice belverkeer +1/3</text>
</svg>
