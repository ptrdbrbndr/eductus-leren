<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="'DM Sans', Arial, sans-serif" width="960" height="660" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#F5F4F0; }
      .field { fill:#FFFFFF; stroke:#1A4F8B; stroke-width:1.5; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .sub { font-size:12px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:26px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .field-num { font-size:12px; font-weight:700; fill:#FFFFFF; }
    </style>
  </defs>

  <rect width="960" height="660" class="paper"/>
  <text x="40" y="34" class="kicker">DEEL 9 · INSTRUMENT</text>
  <text x="40" y="64" class="title">Het uitkomstenblad</text>

  <g>
    <circle cx="58" cy="140" r="14" fill="#1A4F8B"/><text x="58" y="145" text-anchor="middle" class="field-num">1</text>
    <rect x="40" y="163" width="880" height="60" rx="6" class="field"/>
    <text x="56" y="187" class="label">DE UITKOMST DIE JE BEOOGT</text>
    <text x="56" y="207" class="sub">welk gedrag verandert er — in de vorm van de veranderregel uit deel 1</text>
  </g>
  <g>
    <circle cx="58" cy="245" r="14" fill="#1A4F8B"/><text x="58" y="250" text-anchor="middle" class="field-num">2</text>
    <rect x="40" y="268" width="880" height="60" rx="6" class="field"/>
    <text x="56" y="292" class="label">DE MAATSTAF</text>
    <text x="56" y="312" class="sub">welk cijfer of signaal maakt die uitkomst zichtbaar?</text>
  </g>
  <g>
    <circle cx="58" cy="350" r="14" fill="#1A4F8B"/><text x="58" y="355" text-anchor="middle" class="field-num">3</text>
    <rect x="40" y="373" width="880" height="60" rx="6" class="field"/>
    <text x="56" y="397" class="label">DE NULMETING</text>
    <text x="56" y="417" class="sub">waarde van de maatstaf, gemeten vóórdat de verandering ingaat</text>
  </g>
  <g>
    <circle cx="58" cy="455" r="14" fill="#1A4F8B"/><text x="58" y="460" text-anchor="middle" class="field-num">4</text>
    <rect x="40" y="478" width="880" height="60" rx="6" class="field"/>
    <text x="56" y="502" class="label">DE STREEFWAARDE</text>
    <text x="56" y="522" class="sub">verwachte of nagestreefde waarde na de verandering, en op welk moment gemeten</text>
  </g>

  <!-- afsluitend -->
  <g>
    <circle cx="58" cy="576" r="15" fill="#E8A020"/>
    <path d="M52 576 l4 4 l8 -9" stroke="#0D1B2A" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="40" y="598" width="880" height="50" rx="6" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>
    <text x="56" y="622" class="label" fill="#8A5A0E">HET AFBREEKCRITERIUM — bij welke uitkomst zeg je vooraf: dit werkt niet?</text>
    <text x="56" y="640" class="sub">geformuleerd vóórdat je emotioneel geïnvesteerd bent in de gekozen oplossing</text>
  </g>
</svg>
