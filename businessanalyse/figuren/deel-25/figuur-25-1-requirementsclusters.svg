<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="'DM Sans', Arial, sans-serif" width="900" height="460" preserveAspectRatio="xMidYMid meet">
  <defs>
    <style>
      .paper { fill:#FBFAF7; }
      .gen { fill:#CBDCEF; stroke:#2563A8; stroke-width:1.5; }
      .spec { fill:#F5D9A8; stroke:#9A5F0D; stroke-width:1.5; }
      .param { fill:#DFDCD3; stroke:#55606F; stroke-width:1.5; stroke-dasharray:5 3; }
      .head { font-size:13px; font-weight:700; fill:#14213D; text-anchor:middle; }
      .item { font-size:10.5px; fill:#14213D; text-anchor:middle; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:24px; fill:#14213D; font-weight:600; }
    </style>
  </defs>

  <rect width="900" height="460" class="paper"/>
  <text x="40" y="42" class="kicker">DEEL 25 · DRIE MARKERINGEN VOOR ELK REQUIREMENT</text>
  <text x="40" y="72" class="title">Requirementsclusters</text>

  <g>
    <rect x="60" y="110" width="230" height="240" rx="10" class="gen"/>
    <text x="175" y="140" class="head">Generiek</text>
    <text x="175" y="170" class="item">geldt voor alle fondsen</text>
    <text x="175" y="190" class="item">gelijk, ongeacht klant</text>
  </g>
  <g>
    <rect x="335" y="110" width="230" height="240" rx="10" class="spec"/>
    <text x="450" y="140" class="head">Fonds-specifiek</text>
    <text x="450" y="170" class="item">geldt voor één fonds</text>
    <text x="450" y="190" class="item">niet herbruikbaar</text>
  </g>
  <g>
    <rect x="610" y="110" width="230" height="240" rx="10" class="param"/>
    <text x="725" y="140" class="head">Generiek-met-parameter</text>
    <text x="725" y="170" class="item">gedeelde regel,</text>
    <text x="725" y="188" class="item">per fonds ingesteld</text>
  </g>

  <text x="450" y="390" text-anchor="middle" font-size="12" fill="#9A5F0D">De derde categorie is bewust — voorkomt onnodige duplicatie én onterechte generalisatie</text>
</svg>
