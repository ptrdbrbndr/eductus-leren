<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'DM Sans', Arial, sans-serif" width="960" height="560" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-dark { fill:#2563A8; }
      .label { font-size:13px; font-weight:700; fill:#14213D; }
      .label-light { font-size:13px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:11px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:26px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563A8"/></marker>
</defs>
<rect width="960" height="560" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 14 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Een taakgericht scenario voor het deeltijdscherm</text>
<text x="40" y="92" class="sub">"Dien een deeltijdwijziging in die volgende maand ingaat" — met drie meetpunten onderweg.</text>

<!-- task card -->
<rect x="60" y="130" width="300" height="120" rx="10" fill="#FFFFFF" class="blue-line" stroke-width="1.5"/>
<text x="80" y="158" class="sub" font-weight="700" fill="#2563A8">DE TAAK</text>
<text x="80" y="185" class="label" font-size="13">"Dien een deeltijd-</text>
<text x="80" y="205" class="label" font-size="13">wijziging in die volgende</text>
<text x="80" y="225" class="label" font-size="13">maand ingaat"</text>

<path d="M370 190 L440 190" class="arrow"/>

<!-- gebruiker -->
<circle cx="480" cy="190" r="34" fill="#F4F2EC" stroke="#55606F" stroke-width="1.5"/>
<text x="480" y="196" text-anchor="middle" class="sub" font-weight="700">Nadia</text>
<text x="480" y="245" text-anchor="middle" class="sub">representatieve</text>
<text x="480" y="258" text-anchor="middle" class="sub">gebruiker (niet de bouwer)</text>

<path d="M520 190 L590 190" class="arrow"/>

<!-- scherm -->
<rect x="600" y="130" width="300" height="120" rx="10" fill="#FFFFFF" class="blue-line" stroke-width="1.5"/>
<text x="620" y="158" class="sub" font-weight="700" fill="#2563A8">HET DEELTIJDSCHERM</text>
<rect x="620" y="170" width="120" height="18" rx="3" fill="#DFDCD3"/>
<text x="626" y="183" class="sub" font-size="9">ingangsdatum</text>
<rect x="750" y="170" width="120" height="18" rx="3" fill="#DFDCD3"/>
<text x="756" y="183" class="sub" font-size="9">wijzigingsdatum</text>
<text x="620" y="215" class="sub" font-style="italic">twee ongemarkeerde</text>
<text x="620" y="230" class="sub" font-style="italic">datumvelden naast elkaar</text>

<!-- three measurement points -->
<g>
  <rect x="80" y="330" width="230" height="90" rx="8" class="blue-dark"/>
  <text x="195" y="360" text-anchor="middle" class="label-light">TIJD TOT VOLTOOIING</text>
  <text x="195" y="385" text-anchor="middle" class="sub" fill="#DFDCD3" font-size="10.5">hoe lang duurt het,</text>
  <text x="195" y="399" text-anchor="middle" class="sub" fill="#DFDCD3" font-size="10.5">gemeten in seconden</text>
</g>
<g>
  <rect x="365" y="330" width="230" height="90" rx="8" class="blue-dark"/>
  <text x="480" y="360" text-anchor="middle" class="label-light">AANTAL FOUTEN</text>
  <text x="480" y="385" text-anchor="middle" class="sub" fill="#DFDCD3" font-size="10.5">hoeveel keer het</text>
  <text x="480" y="399" text-anchor="middle" class="sub" fill="#DFDCD3" font-size="10.5">verkeerde veld gekozen</text>
</g>
<g>
  <rect x="650" y="330" width="230" height="90" rx="8" class="blue-dark"/>
  <text x="765" y="360" text-anchor="middle" class="label-light">HULP NODIG</text>
  <text x="765" y="385" text-anchor="middle" class="sub" fill="#DFDCD3" font-size="10.5">aantal keer dat de</text>
  <text x="765" y="399" text-anchor="middle" class="sub" fill="#DFDCD3" font-size="10.5">deelnemer vastloopt</text>
</g>

<rect x="130" y="450" width="700" height="60" rx="8" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
<text x="480" y="474" text-anchor="middle" class="sub" fill="#9A5F0D">"Vier van de vijf testgebruikers verwarden de twee datumvelden"</text>
<text x="480" y="492" text-anchor="middle" class="sub" fill="#9A5F0D">is een bevinding — met dezelfde bewijskracht als elke andere bevinding</text>
</svg>
