<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 770" font-family="'DM Sans', Arial, sans-serif" width="960" height="770" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-dark { fill:#2563A8; }
      .label { font-size:11.5px; font-weight:700; fill:#14213D; }
      .sub { font-size:10px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:26px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    </style>
</defs>
<rect width="960" height="770" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 12 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">De acht ISO 25010-kenmerken als wiel</text>
<text x="40" y="92" class="sub">Een gedeeld vocabulaire dat voorkomt dat elk team zijn eigen definitie van "kwaliteit" hanteert.</text>

<circle cx="480" cy="400" r="230" fill="none" stroke="#D9D5C8" stroke-width="1.5" stroke-dasharray="3 5"/>
<circle cx="480" cy="400" r="90" class="blue-dark"/>
<text x="480" y="393" text-anchor="middle" fill="#FBFAF7" font-size="14" font-weight="700">ISO 25010</text>
<text x="480" y="413" text-anchor="middle" fill="#DFDCD3" font-size="10.5">acht kwaliteits-</text>
<text x="480" y="427" text-anchor="middle" fill="#DFDCD3" font-size="10.5">kenmerken</text>

<!-- 8 spokes, angle step 45 starting at -90 -->
<!-- spoke 1: -90 -->
<line x1="480" y1="400" x2="480" y2="170" stroke="#2563A8" stroke-width="1.2"/>
<rect x="390" y="115" width="180" height="55" rx="6" fill="#FFFFFF" class="blue-line" stroke-width="1.5"/>
<text x="480" y="136" text-anchor="middle" class="label">FUNCTIONELE GESCHIKTHEID</text>
<text x="480" y="152" text-anchor="middle" class="sub">doet het wat het moet doen?</text>

<!-- spoke 2: -45 -->
<line x1="480" y1="400" x2="642" y2="238" stroke="#2563A8" stroke-width="1.2"/>
<rect x="655" y="185" width="180" height="55" rx="6" fill="#FFFFFF" class="blue-line" stroke-width="1.5"/>
<text x="745" y="206" text-anchor="middle" class="label">PRESTATIE-EFFICIËNTIE</text>
<text x="745" y="222" text-anchor="middle" class="sub">snelheid, resourcegebruik</text>

<!-- spoke 3: 0 -->
<line x1="480" y1="400" x2="710" y2="400" stroke="#2563A8" stroke-width="1.2"/>
<rect x="725" y="373" width="180" height="55" rx="6" fill="#FFFFFF" class="blue-line" stroke-width="1.5"/>
<text x="815" y="394" text-anchor="middle" class="label">COMPATIBILITEIT</text>
<text x="815" y="410" text-anchor="middle" class="sub">samenwerking tussen systemen</text>

<!-- spoke 4: 45 -->
<line x1="480" y1="400" x2="642" y2="562" stroke="#2563A8" stroke-width="1.2"/>
<rect x="655" y="565" width="180" height="55" rx="6" fill="#FFFFFF" class="blue-line" stroke-width="1.5"/>
<text x="745" y="586" text-anchor="middle" class="label">BRUIKBAARHEID</text>
<text x="745" y="602" text-anchor="middle" class="sub">begrijpelijkheid, leerbaarheid (D14)</text>

<!-- spoke 5: 90 -->
<line x1="480" y1="400" x2="480" y2="630" stroke="#2563A8" stroke-width="1.2"/>
<rect x="390" y="635" width="180" height="55" rx="6" fill="#FFFFFF" class="blue-line" stroke-width="1.5"/>
<text x="480" y="656" text-anchor="middle" class="label">BETROUWBAARHEID</text>
<text x="480" y="672" text-anchor="middle" class="sub">beschikbaarheid, herstelbaarheid</text>

<!-- spoke 6: 135 -->
<line x1="480" y1="400" x2="318" y2="562" stroke="#2563A8" stroke-width="1.2"/>
<rect x="125" y="565" width="180" height="55" rx="6" fill="#FFFFFF" class="blue-line" stroke-width="1.5"/>
<text x="215" y="586" text-anchor="middle" class="label">BEVEILIGING</text>
<text x="215" y="602" text-anchor="middle" class="sub">vertrouwelijkheid, integriteit</text>

<!-- spoke 7: 180 -->
<line x1="480" y1="400" x2="250" y2="400" stroke="#2563A8" stroke-width="1.2"/>
<rect x="55" y="373" width="180" height="55" rx="6" fill="#FFFFFF" class="blue-line" stroke-width="1.5"/>
<text x="145" y="394" text-anchor="middle" class="label">ONDERHOUDBAARHEID</text>
<text x="145" y="410" text-anchor="middle" class="sub">wijzigen zonder nieuw risico</text>

<!-- spoke 8: 225 -->
<line x1="480" y1="400" x2="318" y2="238" stroke="#2563A8" stroke-width="1.2"/>
<rect x="125" y="185" width="180" height="55" rx="6" fill="#FFFFFF" class="blue-line" stroke-width="1.5"/>
<text x="215" y="206" text-anchor="middle" class="label">OVERDRAAGBAARHEID</text>
<text x="215" y="222" text-anchor="middle" class="sub">verplaatsen of vervangen</text>

<rect x="140" y="710" width="680" height="46" rx="8" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
<text x="480" y="738" text-anchor="middle" class="sub" fill="#9A5F0D">Niet elk kenmerk weegt voor elk risico-item even zwaar — vandaar de matrix</text>
</svg>
