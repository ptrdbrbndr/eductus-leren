<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="'DM Sans', Arial, sans-serif" width="960" height="500" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .label { font-size:11.5px; font-weight:700; fill:#14213D; }
      .label-light { font-size:11.5px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:10.5px; fill:#55606F; }
      .cell { font-size:11px; font-weight:700; text-anchor:middle; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:26px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    </style>
</defs>
<rect width="960" height="500" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 12 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">De teststrategiematrix als kruistabel</text>
<text x="40" y="92" class="sub">Risico-items × kwaliteitskenmerken, met kleurcodering naar diepgang.</text>

<!-- header row -->
<rect x="40" y="120" width="260" height="40" fill="#2563A8"/>
<text x="170" y="145" text-anchor="middle" class="label-light">RISICO-ITEM</text>
<rect x="300" y="120" width="130" height="40" fill="#2563A8"/>
<text x="365" y="140" text-anchor="middle" class="label-light" font-size="10.5">FUNCTIO-</text>
<text x="365" y="153" text-anchor="middle" class="label-light" font-size="10.5">NEEL</text>
<rect x="430" y="120" width="130" height="40" fill="#2563A8"/>
<text x="495" y="145" text-anchor="middle" class="label-light" font-size="10.5">PRESTATIE</text>
<rect x="560" y="120" width="130" height="40" fill="#2563A8"/>
<text x="625" y="140" text-anchor="middle" class="label-light" font-size="10.5">COMPATI-</text>
<text x="625" y="153" text-anchor="middle" class="label-light" font-size="10.5">BILITEIT</text>
<rect x="690" y="120" width="130" height="40" fill="#2563A8"/>
<text x="755" y="140" text-anchor="middle" class="label-light" font-size="10.5">BETROUW-</text>
<text x="755" y="153" text-anchor="middle" class="label-light" font-size="10.5">BAARHEID</text>
<rect x="820" y="120" width="100" height="40" fill="#2563A8"/>
<text x="870" y="140" text-anchor="middle" class="label-light" font-size="10.5">BEVEILI-</text>
<text x="870" y="153" text-anchor="middle" class="label-light" font-size="10.5">GING</text>

<!-- row helper: colors: intensief=#2563A8 (dark blue fill, white text), gemiddeld=#6FA3D6, licht=#CBDCEF (dark text), n.v.t.=#DFDCD3 -->

<!-- row 1 -->
<rect x="40" y="160" width="260" height="60" fill="#FFFFFF" stroke="#D9D5C8"/>
<text x="52" y="184" class="sub" font-weight="700" fill="#14213D">Mutatieverwerking</text>
<text x="52" y="200" class="sub" font-weight="700" fill="#14213D">terugwerkende kracht</text>
<rect x="300" y="160" width="130" height="60" fill="#2563A8"/><text x="365" y="195" class="cell" fill="#FBFAF7">intensief</text>
<rect x="430" y="160" width="130" height="60" fill="#CBDCEF"/><text x="495" y="195" class="cell" fill="#14213D">licht</text>
<rect x="560" y="160" width="130" height="60" fill="#6FA3D6"/><text x="625" y="195" class="cell" fill="#14213D">gemiddeld</text>
<rect x="690" y="160" width="130" height="60" fill="#2563A8"/><text x="755" y="195" class="cell" fill="#FBFAF7">intensief</text>
<rect x="820" y="160" width="100" height="60" fill="#6FA3D6"/><text x="870" y="195" class="cell" fill="#14213D">gemiddeld</text>

<!-- row 2 -->
<rect x="40" y="220" width="260" height="60" fill="#FFFFFF" stroke="#D9D5C8"/>
