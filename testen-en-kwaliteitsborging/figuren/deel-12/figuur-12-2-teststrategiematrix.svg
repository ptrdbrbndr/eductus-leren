<text x="52" y="260" class="sub" font-weight="700" fill="#14213D">kernadministratie</text>
<rect x="300" y="220" width="130" height="60" fill="#2563A8"/><text x="365" y="255" class="cell" fill="#FBFAF7">intensief</text>
<rect x="430" y="220" width="130" height="60" fill="#6FA3D6"/><text x="495" y="255" class="cell" fill="#14213D">gemiddeld</text>
<rect x="560" y="220" width="130" height="60" fill="#2563A8"/><text x="625" y="255" class="cell" fill="#FBFAF7">intensief</text>
<rect x="690" y="220" width="130" height="60" fill="#2563A8"/><text x="755" y="255" class="cell" fill="#FBFAF7">intensief</text>
<rect x="820" y="220" width="100" height="60" fill="#6FA3D6"/><text x="870" y="255" class="cell" fill="#14213D">gemiddeld</text>

<!-- row 3 -->
<rect x="40" y="280" width="260" height="60" fill="#FFFFFF" stroke="#D9D5C8"/>
<text x="52" y="304" class="sub" font-weight="700" fill="#14213D">Portaalnavigatie</text>
<text x="52" y="320" class="sub" font-weight="700" fill="#14213D">en schermen</text>
<rect x="300" y="280" width="130" height="60" fill="#CBDCEF"/><text x="365" y="315" class="cell" fill="#14213D">licht</text>
<rect x="430" y="280" width="130" height="60" fill="#CBDCEF"/><text x="495" y="315" class="cell" fill="#14213D">licht</text>
<rect x="560" y="280" width="130" height="60" fill="#DFDCD3"/><text x="625" y="315" class="cell" fill="#55606F">n.v.t.</text>
<rect x="690" y="280" width="130" height="60" fill="#CBDCEF"/><text x="755" y="315" class="cell" fill="#14213D">licht</text>
<rect x="820" y="280" width="100" height="60" fill="#CBDCEF"/><text x="870" y="315" class="cell" fill="#14213D">licht</text>

<!-- row 4 -->
<rect x="40" y="340" width="260" height="60" fill="#FFFFFF" stroke="#D9D5C8"/>
<text x="52" y="364" class="sub" font-weight="700" fill="#14213D">Telefonische mutatie</text>
<text x="52" y="380" class="sub" font-weight="700" fill="#14213D">(handmatige invoer)</text>
<rect x="300" y="340" width="130" height="60" fill="#6FA3D6"/><text x="365" y="375" class="cell" fill="#14213D">gemiddeld</text>
<rect x="430" y="340" width="130" height="60" fill="#DFDCD3"/><text x="495" y="375" class="cell" fill="#55606F">n.v.t.</text>
<rect x="560" y="340" width="130" height="60" fill="#CBDCEF"/><text x="625" y="375" class="cell" fill="#14213D">licht</text>
<rect x="690" y="340" width="130" height="60" fill="#6FA3D6"/><text x="755" y="375" class="cell" fill="#14213D">gemiddeld</text>
<rect x="820" y="340" width="100" height="60" fill="#2563A8"/><text x="870" y="375" class="cell" fill="#FBFAF7">intensief</text>

<rect x="130" y="420" width="700" height="46" rx="8" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
<text x="480" y="448" text-anchor="middle" class="sub" fill="#9A5F0D">"Bewust niet" is een besluit, hardop genomen — niet een stilzwijgende lege cel</text>
