<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'DM Sans', Arial, sans-serif" width="960" height="560" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .blue-line { stroke:#1A4F8B; }
      .blue-dark { fill:#1A4F8B; }
      .label { font-size:13px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:13px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:11px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:26px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
    </style>
</defs>
<rect width="960" height="560" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 18 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Deploy en release als twee aparte schakelaars</text>
<text x="40" y="92" class="sub">Code kan gedeployed zijn en toch uitgeschakeld, of andersom nooit gedeployed maar wel "aangekondigd".</text>

<!-- switch: DEPLOY -->
<text x="230" y="150" text-anchor="middle" class="sub" font-weight="700" fill="#1A4F8B">DEPLOY</text>
<rect x="150" y="165" width="160" height="60" rx="30" fill="#1A4F8B"/>
<circle cx="270" cy="195" r="24" fill="#F5F4F0"/>
<text x="230" y="248" text-anchor="middle" class="sub">technisch uitgerold</text>

<!-- switch: RELEASE -->
<text x="730" y="150" text-anchor="middle" class="sub" font-weight="700" fill="#E8A020">RELEASE</text>
<rect x="650" y="165" width="160" height="60" rx="30" fill="#E4E1D8" stroke="#5B6675" stroke-width="1.5"/>
<circle cx="690" cy="195" r="24" fill="#FFFFFF" stroke="#5B6675" stroke-width="1.5"/>
<text x="730" y="248" text-anchor="middle" class="sub">niet zichtbaar voor gebruikers</text>

<!-- four quadrant table showing combinations -->
<g>
<rect x="130" y="290" width="360" height="90" rx="8" fill="#FFFFFF" class="blue-line" stroke-width="1.5"/>
<text x="310" y="320" text-anchor="middle" class="label" font-size="12">GEDEPLOYED, NIET RELEASED</text>
<text x="310" y="342" text-anchor="middle" class="sub">actief in productie, achter toggle uit</text>
<text x="310" y="360" text-anchor="middle" class="sub" font-style="italic">— testbaar in productie-omstandigheden</text>
</g>
<g>
<rect x="500" y="290" width="360" height="90" rx="8" fill="#FFFFFF" class="blue-line" stroke-width="1.5"/>
<text x="680" y="320" text-anchor="middle" class="label" font-size="12">NIET GEDEPLOYED, "AANGEKONDIGD"</text>
<text x="680" y="342" text-anchor="middle" class="sub">code bestaat nog niet in productie</text>
<text x="680" y="360" text-anchor="middle" class="sub" font-style="italic">— release-datum vastgelegd, niets live</text>
</g>

<rect x="130" y="420" width="700" height="60" rx="8" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>
<text x="480" y="444" text-anchor="middle" class="sub" fill="#8A5A0E">Door deploy en release te scheiden kan code onder echte omstandigheden</text>
<text x="480" y="462" text-anchor="middle" class="sub" fill="#8A5A0E">getest worden zonder dat een fout meteen alle 210.000 deelnemers raakt</text>
</svg>
