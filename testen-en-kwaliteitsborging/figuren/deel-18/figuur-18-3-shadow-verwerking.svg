<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'DM Sans', Arial, sans-serif" width="960" height="560" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .blue-line { stroke:#1A4F8B; }
      .blue-dark { fill:#1A4F8B; }
      .label { font-size:13px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:13px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:11px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:26px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#5B6675; stroke-width:1.8; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#1A4F8B; stroke-width:1.8; fill:none; marker-end:url(#arrb); }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#5B6675"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#1A4F8B"/></marker>
</defs>
<rect width="960" height="560" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 18 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Shadow-verwerking</text>
<text x="40" y="92" class="sub">Dezelfde invoer naar oud en nieuw systeem tegelijk, resultaten vergeleken — alleen het oude resultaat telt.</text>

<rect x="60" y="230" width="150" height="70" rx="8" fill="#FFFFFF" class="blue-line" stroke-width="1.5"/>
<text x="135" y="260" text-anchor="middle" class="label" font-size="12">INVOER</text>
<text x="135" y="280" text-anchor="middle" class="sub">één mutatie</text>

<path d="M210 250 L340 190" class="arrow-b"/>
<path d="M210 270 L340 340" class="arrow"/>

<rect x="345" y="140" width="230" height="90" rx="8" class="blue-dark"/>
<text x="460" y="172" text-anchor="middle" class="label-light">OUD SYSTEEM</text>
<text x="460" y="194" text-anchor="middle" fill="#E4E1D8" font-size="10.5">vertrouwde verwerking</text>
<text x="460" y="210" text-anchor="middle" fill="#E4E1D8" font-size="10.5" font-weight="700">resultaat telt</text>

<rect x="345" y="300" width="230" height="90" rx="8" fill="#F0EDE4" stroke="#5B6675" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="460" y="332" text-anchor="middle" class="label" font-size="12">NIEUW SYSTEEM</text>
<text x="460" y="354" text-anchor="middle" class="sub">herbouwde verwerking</text>
<text x="460" y="370" text-anchor="middle" class="sub" font-style="italic">resultaat wordt niet gebruikt</text>

<path d="M575 185 L680 230" class="arrow-b"/>
<path d="M575 345 L680 260" class="arrow"/>

<rect x="685" y="200" width="220" height="120" rx="8" fill="#FFFFFF" stroke="#E8A020" stroke-width="2"/>
<text x="795" y="230" text-anchor="middle" class="label" fill="#8A5A0E">VERGELIJKING</text>
<text x="795" y="255" text-anchor="middle" class="sub">wijken oud en nieuw af?</text>
<text x="795" y="273" text-anchor="middle" class="sub">is dat een verbetering</text>
<text x="795" y="289" text-anchor="middle" class="sub">of een fout?</text>
<text x="795" y="308" text-anchor="middle" class="sub" font-style="italic">geen impact op productie</text>

<rect x="130" y="440" width="700" height="60" rx="8" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>
<text x="480" y="464" text-anchor="middle" class="sub" fill="#8A5A0E">Bijzonder waardevol bij het orakelprobleem: de oude, vertrouwde verwerking</text>
<text x="480" y="482" text-anchor="middle" class="sub" fill="#8A5A0E">dient tijdelijk als vergelijkingsmateriaal voor de nieuwe</text>
</svg>
