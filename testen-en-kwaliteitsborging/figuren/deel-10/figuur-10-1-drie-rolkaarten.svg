<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="'DM Sans', Arial, sans-serif" width="960" height="520" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .mono { font-family: 'Courier New', monospace; }
</style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arramb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#9A5F0D"/></marker>
    </defs>
<rect width="960" height="520" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 10 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Drie rollen, drie vraagpatronen</text>
<text x="40" y="90" class="sub">Elke rol bevraagt de testaanpak vanuit een eigen invalshoek tijdens de verdediging.</text>
<rect x="90" y="130" width="240" height="330" rx="10" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<rect x="90" y="130" width="240" height="46" rx="10" fill="#2563A8" stroke="#2563A8" stroke-width="1.5"/>
<rect x="90" y="160" width="240" height="16" fill="#2563A8"/>
<text x="210" y="158" class="label-light" text-anchor="middle" font-size="13.5">Product owner</text>
<circle cx="124" cy="210" r="13" fill="#2563A8"/>
<text x="124" y="215" class="label-light" text-anchor="middle" font-weight="700" font-size="14">1</text>
<text x="150" y="200" class="sub" font-size="11">Kost dit niet te</text>
<text x="150" y="216" class="sub" font-size="11">veel tijd?</text>
<circle cx="124" cy="288" r="13" fill="#2563A8"/>
<text x="124" y="293" class="label-light" text-anchor="middle" font-weight="700" font-size="14">2</text>
<text x="150" y="278" class="sub" font-size="11">Waarom zoveel</text>
<text x="150" y="294" class="sub" font-size="11">aandacht voor een</text>
<text x="150" y="310" class="sub" font-size="11">randgeval?</text>
<circle cx="124" cy="366" r="13" fill="#2563A8"/>
<text x="124" y="371" class="label-light" text-anchor="middle" font-weight="700" font-size="14">3</text>
<text x="150" y="356" class="sub" font-size="11">Wat levert dit</text>
<text x="150" y="372" class="sub" font-size="11">concreet op?</text>
<rect x="360" y="130" width="240" height="330" rx="10" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<rect x="360" y="130" width="240" height="46" rx="10" fill="#2563A8" stroke="#2563A8" stroke-width="1.5"/>
<rect x="360" y="160" width="240" height="16" fill="#2563A8"/>
<text x="480" y="158" class="label-light" text-anchor="middle" font-size="13.5">Beheerorganisatie</text>
<circle cx="394" cy="210" r="13" fill="#2563A8"/>
<text x="394" y="215" class="label-light" text-anchor="middle" font-weight="700" font-size="14">1</text>
<text x="420" y="200" class="sub" font-size="11">Is de testomgeving</text>
<text x="420" y="216" class="sub" font-size="11">representatief?</text>
<circle cx="394" cy="288" r="13" fill="#2563A8"/>
<text x="394" y="293" class="label-light" text-anchor="middle" font-weight="700" font-size="14">2</text>
<text x="420" y="278" class="sub" font-size="11">Wie onderhoudt dit</text>
<text x="420" y="294" class="sub" font-size="11">straks?</text>
<circle cx="394" cy="366" r="13" fill="#2563A8"/>
<text x="394" y="371" class="label-light" text-anchor="middle" font-weight="700" font-size="14">3</text>
<text x="420" y="356" class="sub" font-size="11">Wat gebeurt er in</text>
<text x="420" y="372" class="sub" font-size="11">productie als dit</text>
<text x="420" y="388" class="sub" font-size="11">misgaat?</text>
<rect x="630" y="130" width="240" height="330" rx="10" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<rect x="630" y="130" width="240" height="46" rx="10" fill="#2563A8" stroke="#2563A8" stroke-width="1.5"/>
<rect x="630" y="160" width="240" height="16" fill="#2563A8"/>
<text x="750" y="158" class="label-light" text-anchor="middle" font-size="13.5">Stuurgroeplid</text>
<circle cx="664" cy="210" r="13" fill="#2563A8"/>
<text x="664" y="215" class="label-light" text-anchor="middle" font-weight="700" font-size="14">1</text>
<text x="690" y="200" class="sub" font-size="11">Weet ik genoeg om te</text>
<text x="690" y="216" class="sub" font-size="11">besluiten?</text>
<circle cx="664" cy="288" r="13" fill="#2563A8"/>
<text x="664" y="293" class="label-light" text-anchor="middle" font-weight="700" font-size="14">2</text>
<text x="690" y="278" class="sub" font-size="11">Wat is nog onzeker,</text>
<text x="690" y="294" class="sub" font-size="11">en waarom?</text>
<circle cx="664" cy="366" r="13" fill="#2563A8"/>
<text x="664" y="371" class="label-light" text-anchor="middle" font-weight="700" font-size="14">3</text>
<text x="690" y="356" class="sub" font-size="11">Wat gebeurt er als</text>
<text x="690" y="372" class="sub" font-size="11">ik nu ja zeg?</text>
<text x="480" y="490" text-anchor="middle" class="sub" fill="#9A5F0D">Een verdedigbare aanpak laat zien welke keuzes zijn gemaakt, en waarom — onder elk van deze drie blikken.</text>

</svg>