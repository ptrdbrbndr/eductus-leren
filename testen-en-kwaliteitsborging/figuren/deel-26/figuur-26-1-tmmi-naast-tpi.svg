<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="'DM Sans', Arial, sans-serif" width="960" height="600" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:13px; font-weight:700; fill:#14213D; }
      .label-light { font-size:13px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:11.5px; fill:#55606F; }
      .sub-light { font-size:11.5px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .colhead { font-size:15px; font-weight:700; fill:#2563A8; }
    </style>
</defs>
<rect width="960" height="600" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 26 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">TMMi en TPI — complementair, niet concurrerend</text>
<text x="40" y="96" class="sub">TMMi voor het grote plaatje, TPI voor de concrete hefboom.</text>

<!-- left column: TMMi -->
<rect x="60" y="140" width="400" height="400" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="260" y="172" text-anchor="middle" class="colhead">TMMi — het grote plaatje</text>
<text x="260" y="192" text-anchor="middle" class="sub" font-size="11">vijf volwassenheidsniveaus</text>

<rect x="90" y="470" width="340" height="40" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.2"/>
<text x="105" y="495" class="sub" font-size="11">1 · Ad-hoc, onvoorspelbaar</text>
<rect x="90" y="430" width="340" height="40" fill="#D6E4F2" stroke="#2563A8" stroke-width="1.2"/>
<text x="105" y="455" class="sub" font-size="11">2 · Beheerd — testbeleid en -strategie</text>
<rect x="90" y="390" width="340" height="40" fill="#CBDCEF" stroke="#2563A8" stroke-width="1.2"/>
<text x="105" y="415" class="sub" font-size="11">3 · Gedefinieerd — peer reviews</text>
<rect x="90" y="350" width="340" height="40" fill="#6FA3D6" stroke="#2563A8" stroke-width="1.2"/>
<text x="105" y="375" class="sub-light" font-size="11">4 · Beheerst en gemeten</text>
<rect x="90" y="310" width="340" height="40" fill="#2563A8" stroke="#2563A8" stroke-width="1.2"/>
<text x="105" y="335" class="sub-light" font-size="11">5 · Geoptimaliseerd, continu verbeterend</text>

<!-- right column: TPI -->
<rect x="500" y="140" width="400" height="400" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="700" y="172" text-anchor="middle" class="colhead">TPI — de concrete hefboom</text>
<text x="700" y="192" text-anchor="middle" class="sub" font-size="11">matrix van kernpunten × volwassenheid</text>

<rect x="530" y="220" width="340" height="46" rx="6" fill="#CBDCEF" stroke="#2563A8" stroke-width="1.2"/>
<text x="546" y="248" class="label" font-size="12">Testbasis</text>
<rect x="530" y="276" width="340" height="46" rx="6" fill="#CBDCEF" stroke="#2563A8" stroke-width="1.2"/>
<text x="546" y="304" class="label" font-size="12">Testomgeving</text>
<rect x="530" y="332" width="340" height="46" rx="6" fill="#CBDCEF" stroke="#2563A8" stroke-width="1.2"/>
<text x="546" y="360" class="label" font-size="12">Rapportage</text>
<rect x="530" y="388" width="340" height="46" rx="6" fill="#CBDCEF" stroke="#2563A8" stroke-width="1.2"/>
<text x="546" y="416" class="label" font-size="12">... (fijnmaziger kernpunten)</text>
<text x="700" y="500" text-anchor="middle" class="sub" font-size="11">direct toepasbaar, per kernpunt een concrete stap</text>

<text x="480" y="574" text-anchor="middle" class="sub" fill="#9A5F0D">Een gedeeld model voorkomt dat "verbeteren" een vage ambitie blijft.</text>
</svg>
