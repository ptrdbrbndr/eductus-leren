<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'DM Sans', Arial, sans-serif" width="960" height="560" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .blue-line { stroke:#1A4F8B; }
      .blue-dark { fill:#1A4F8B; }
      .label { font-size:13px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:13px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:11px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:26px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
    </style>
</defs>
<rect width="960" height="560" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 21 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Een schatting als bandbreedte, met expliciete aannames</text>
<text x="40" y="92" class="sub">Versus een enkel getal — en wat er gebeurt als de werkelijkheid afwijkt.</text>

<!-- single number -->
<rect x="80" y="140" width="360" height="150" rx="10" fill="#FFFFFF" stroke="#5B6675" stroke-width="1.5"/>
<text x="260" y="172" text-anchor="middle" class="sub" font-weight="700">"10 DAGEN"</text>
<text x="260" y="225" text-anchor="middle" font-size="34" font-weight="700" fill="#0D1B2A">10</text>
<text x="260" y="248" text-anchor="middle" class="sub">een precies getal</text>
<text x="260" y="268" text-anchor="middle" class="sub" font-style="italic">geen aannames zichtbaar</text>

<path d="M260 300 L260 335" stroke="#5B6675" stroke-width="2"/>
<rect x="130" y="340" width="260" height="60" rx="8" fill="#F0EDE4" stroke="#5B6675" stroke-width="1.5"/>
<text x="260" y="365" text-anchor="middle" class="sub" font-weight="700">afwijking → verwijt</text>
<text x="260" y="384" text-anchor="middle" class="sub" font-size="10">"Iris had het mis"</text>

<!-- bandwidth -->
<rect x="540" y="140" width="360" height="150" rx="10" fill="#FFFFFF" class="blue-line" stroke-width="1.5"/>
<text x="720" y="172" text-anchor="middle" class="sub" font-weight="700" fill="#1A4F8B">"8 TOT 14 DAGEN"</text>
<line x1="580" y1="225" x2="860" y2="225" stroke="#1A4F8B" stroke-width="6" stroke-linecap="round"/>
<circle cx="580" cy="225" r="8" fill="#1A4F8B"/>
<circle cx="860" cy="225" r="8" fill="#1A4F8B"/>
<text x="720" y="250" text-anchor="middle" class="sub">afhankelijk van bevindingen</text>
<text x="720" y="268" text-anchor="middle" class="sub" font-style="italic">in de terugwerkende-krachtmodule</text>

<path d="M720 300 L720 335" stroke="#1A4F8B" stroke-width="2"/>
<rect x="590" y="340" width="260" height="60" rx="8" class="blue-dark"/>
<text x="720" y="365" text-anchor="middle" class="label-light">afwijking → gesprek</text>
<text x="720" y="384" text-anchor="middle" fill="#E4E1D8" font-size="10">herleidbaar naar een aanname</text>

<rect x="130" y="440" width="700" height="50" rx="8" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>
<text x="480" y="460" text-anchor="middle" class="sub" fill="#8A5A0E">Een schatting is een momentopname, geen contract —</text>
<text x="480" y="478" text-anchor="middle" class="sub" fill="#8A5A0E">herijk bij nieuwe informatie</text>
</svg>
