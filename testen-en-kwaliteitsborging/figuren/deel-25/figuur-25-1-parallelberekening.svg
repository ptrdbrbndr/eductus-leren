<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'DM Sans', Arial, sans-serif" width="960" height="560" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:13px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:13px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:11.5px; fill:#5B6675; }
      .sub-light { font-size:11.5px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow-b { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1A4F8B"/></marker>
</defs>
<rect width="960" height="560" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 25 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Parallelberekening — twee onafhankelijke rekenwegen</text>
<text x="40" y="96" class="sub">Dezelfde brondata naar twee rekenwegen; de vergelijking is het eigenlijke testresultaat.</text>

<rect x="380" y="130" width="200" height="70" rx="8" fill="#1A4F8B" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="480" y="160" text-anchor="middle" class="label-light" font-size="13">Brondata</text>
<text x="480" y="180" text-anchor="middle" class="sub-light" font-size="11">aanspraken 340.000 deelnemers</text>

<path d="M420 202 L250 260" class="arrow-b"/>
<path d="M540 202 L710 260" class="arrow-b"/>

<rect x="120" y="262" width="260" height="120" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="250" y="296" text-anchor="middle" class="label" font-size="13">Primair systeem</text>
<text x="250" y="320" text-anchor="middle" class="sub" font-size="11">de reguliere,</text>
<text x="250" y="336" text-anchor="middle" class="sub" font-size="11">productiematige</text>
<text x="250" y="352" text-anchor="middle" class="sub" font-size="11">rekenweg</text>

<rect x="580" y="262" width="260" height="120" rx="8" fill="#C5D8F0" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="710" y="296" text-anchor="middle" class="label" font-size="13">Onafhankelijke</text>
<text x="710" y="316" text-anchor="middle" class="label" font-size="13">rekenmodule</text>
<text x="710" y="340" text-anchor="middle" class="sub" font-size="11">apart gebouwd, apart</text>
<text x="710" y="356" text-anchor="middle" class="sub" font-size="11">geverifieerd</text>

<path d="M280 384 L440 430" class="arrow-b"/>
<path d="M680 384 L520 430" class="arrow-b"/>

<rect x="370" y="432" width="220" height="70" rx="8" fill="#1A4F8B" stroke="#E8A020" stroke-width="3"/>
<text x="480" y="462" text-anchor="middle" class="label-light" font-size="13">Vergelijking</text>
<text x="480" y="482" text-anchor="middle" class="sub-light" font-size="11">= het eigenlijke testresultaat</text>

<text x="480" y="535" text-anchor="middle" class="sub" fill="#8A5A0E">Alleen zo sterk als de tweede rekenweg werkelijk onafhankelijk is — anders schijnzekerheid, geen aangetoonde zekerheid.</text>
</svg>
