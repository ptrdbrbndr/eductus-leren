<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="'DM Sans', Arial, sans-serif" width="960" height="500" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .blue-line { stroke:#1A4F8B; }
      .blue-fill { fill:#C5D8F0; }
      .blue-mid { fill:#8AAFD4; }
      .blue-dark { fill:#1A4F8B; }
      .amber { stroke:#E8A020; }
      .amber-fill { fill:#E8A020; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .sub-light { font-size:12px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#5B6675; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .mono { font-family: 'Courier New', monospace; }
</style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5B6675"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1A4F8B"/></marker>
    <marker id="arramb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8A5A0E"/></marker>
    </defs>
<rect width="960" height="500" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 3 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Shift-left en shift-right</text>
<text x="40" y="90" class="sub">Twee bewegingen rond hetzelfde middelpunt: de livegang.</text>
<line x1="140" y1="300" x2="820" y2="300" stroke="#5B6675" stroke-width="1.5"/>
<circle cx="480" cy="300" r="10" fill="#E8A020"/>
<text x="480" y="334" class="label" text-anchor="middle" font-size="13" fill="#8A5A0E">Livegang</text>
<path d="M440 300 L170 300" class="arrow-b"/>
<path d="M520 300 L790 300" class="arrow-b"/>
<rect x="150" y="150" width="260" height="100" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="280" y="182" class="label" text-anchor="middle" font-size="14">Shift-left</text>
<text x="280" y="204" class="sub" text-anchor="middle" font-size="10.5">meelezen bij acceptatiecriteria,</text>
<text x="280" y="220" class="sub" text-anchor="middle" font-size="10.5">testontwerp naast de bouw,</text>
<text x="280" y="236" class="sub" text-anchor="middle" font-size="10.5">statisch testen vooraf</text>
<rect x="550" y="150" width="260" height="100" rx="8" fill="#1A4F8B" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="680" y="182" class="label-light" text-anchor="middle" font-size="14">Shift-right</text>
<text x="680" y="204" class="sub-light" text-anchor="middle" font-size="10.5">monitoring, foutregistratie,</text>
<text x="680" y="220" class="sub-light" text-anchor="middle" font-size="10.5">gebruikersgedrag na livegang</text>
<text x="680" y="236" class="sub-light" text-anchor="middle" font-size="10.5">als bron van testkennis</text>
<text x="480" y="440" text-anchor="middle" class="sub" fill="#8A5A0E">Shift-right vervangt vooraf testen niet — het erkent wat pas onder echte belasting blijkt.</text>

</svg>