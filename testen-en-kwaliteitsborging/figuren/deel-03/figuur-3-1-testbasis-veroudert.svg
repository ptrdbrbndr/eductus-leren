<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" font-family="'DM Sans', Arial, sans-serif" width="1000" height="500" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .blue-line { stroke:#1A4F8B; }
      .blue-fill { fill:#C5D8F0; }
      .blue-mid { fill:#8AAFD4; }
      .blue-dark { fill:#1A4F8B; }
      .amber { stroke:#E8A020; }
      .amber-fill { fill:#E8A020; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .sub-light { font-size:12px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#5B6675; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .mono { font-family: 'Courier New', monospace; }
</style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5B6675"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1A4F8B"/></marker>
    <marker id="arramb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8A5A0E"/></marker>
    </defs>
<rect width="1000" height="500" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 3 · TIJDLIJN</text>
<text x="40" y="64" class="title">Een testbasis die stil bleef staan</text>
<text x="40" y="90" class="sub">FO v1.0 bij kick-off, drie wijzigingsverzoeken over achttien maanden — de testbasis bewoog niet mee.</text>
<line x1="100" y1="260" x2="900" y2="260" class="arrow-b"/>
<line x1="100" y1="254" x2="100" y2="266" stroke="#5B6675" stroke-width="1.5"/>
<text x="100" y="286" class="sub" text-anchor="middle" font-size="11">kick-off</text>
<line x1="366.66666666666663" y1="254" x2="366.66666666666663" y2="266" stroke="#5B6675" stroke-width="1.5"/>
<text x="366.66666666666663" y="286" class="sub" text-anchor="middle" font-size="11">maand 6</text>
<line x1="633.3333333333333" y1="254" x2="633.3333333333333" y2="266" stroke="#5B6675" stroke-width="1.5"/>
<text x="633.3333333333333" y="286" class="sub" text-anchor="middle" font-size="11">maand 12</text>
<line x1="900" y1="254" x2="900" y2="266" stroke="#5B6675" stroke-width="1.5"/>
<text x="900" y="286" class="sub" text-anchor="middle" font-size="11">maand 18</text>
<text x="920" y="266" class="sub" font-size="11">accept.test</text>
<line x1="100" y1="170" x2="900" y2="170" stroke="#1A4F8B" stroke-width="3"/>
<text x="100" y="150" class="label" font-size="12">FO v1.0 — testbasis (blijft ongewijzigd)</text>
<path d="M100 340 C 340 320, 580 250, 900 175" class="arrow"/>
<text x="100" y="360" class="label" font-size="12">Bouw (beweegt mee met elke wijziging)</text>
<line x1="277.77777777777777" y1="170" x2="277.77777777777777" y2="340" stroke="#8AAFD4" stroke-width="2" stroke-dasharray="4 3"/>
<circle cx="277.77777777777777" cy="170" r="8" fill="#8AAFD4"/>
<text x="287.77777777777777" y="195" class="sub" font-size="10.5" fill="#5B6675">wijziging 1 —</text>
<text x="287.77777777777777" y="209" class="sub" font-size="10.5" fill="#5B6675">onschuldig</text>
<line x1="500" y1="170" x2="500" y2="340" stroke="#8AAFD4" stroke-width="2" stroke-dasharray="4 3"/>
<circle cx="500" cy="170" r="8" fill="#8AAFD4"/>
<text x="510" y="195" class="sub" font-size="10.5" fill="#5B6675">wijziging 2 —</text>
<text x="510" y="209" class="sub" font-size="10.5" fill="#5B6675">onschuldig</text>
<line x1="722.2222222222223" y1="170" x2="722.2222222222223" y2="340" stroke="#E8A020" stroke-width="2" stroke-dasharray="4 3"/>
<circle cx="722.2222222222223" cy="170" r="8" fill="#E8A020"/>
<text x="732.2222222222223" y="195" class="sub" font-size="10.5" fill="#8A5A0E">wijziging 3 —</text>
<text x="732.2222222222223" y="209" class="sub" font-size="10.5" fill="#8A5A0E">terugwerkende kracht</text>
<text x="500" y="460" text-anchor="middle" class="sub" fill="#8A5A0E">Het document bleef er even gezaghebbend uitzien — niets aan de buitenkant verried de achterstand.</text>

</svg>