<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .mono { font-family: 'Courier New', monospace; }
</style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arramb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#9A5F0D"/></marker>
    </defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 3 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">De vier testniveaus als concentrische ringen</text>
<text x="40" y="90" class="sub">Elk niveau met zijn eigen testobject — zoeken op het verkeerde niveau vindt niets.</text>
<circle cx="480" cy="340" r="230" fill="#2563A8" opacity="0.92"/>
<circle cx="480" cy="340" r="175" fill="#3E6FA3" opacity="0.92"/>
<circle cx="480" cy="340" r="120" fill="#6C93C0" opacity="0.92"/>
<circle cx="480" cy="340" r="62" fill="#6FA3D6" opacity="0.92"/>
<text x="480" y="135" class="label-light" text-anchor="middle" font-size="13">Acceptatietest</text>
<text x="480" y="152" class="sub-light" text-anchor="middle" font-size="10">het systeem in de bedrijfscontext</text>
<text x="480" y="188" class="label-light" text-anchor="middle" font-size="13">Systeemtest</text>
<text x="480" y="205" class="sub-light" text-anchor="middle" font-size="10">functioneel + niet-functioneel ontwerp</text>
<text x="480" y="242" class="label-light" text-anchor="middle" font-size="13">Integratietest</text>
<text x="480" y="259" class="sub-light" text-anchor="middle" font-size="10">koppelvlakontwerp</text>
<text x="480" y="334" class="label" text-anchor="middle" font-size="13">Componenttest</text>
<text x="480" y="351" class="sub" text-anchor="middle" font-size="10">technisch ontwerp / code</text>
<text x="480" y="590" text-anchor="middle" class="sub" fill="#9A5F0D">De tegenstrijdigheid in het FO kon nooit op componentniveau gevonden worden.</text>

</svg>