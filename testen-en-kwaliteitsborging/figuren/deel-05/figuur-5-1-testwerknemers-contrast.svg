<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="'DM Sans', Arial, sans-serif" width="960" height="500" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .blue-line { stroke:#1A4F8B; }
      .blue-fill { fill:#C5D8F0; }
      .blue-mid { fill:#8AAFD4; }
      .blue-dark { fill:#1A4F8B; }
      .amber { stroke:#E8A020; }
      .amber-fill { fill:#E8A020; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .sub-light { font-size:12px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#5B6675; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .mono { font-family: 'Courier New', monospace; }
</style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5B6675"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1A4F8B"/></marker>
    <marker id="arramb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8A5A0E"/></marker>
    </defs>
<rect width="960" height="500" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 5 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Zevenenveertig brave namen</text>
<text x="40" y="90" class="sub">De testwerknemers naast een steekproef van echte namen — het contrast in variatie.</text>
<rect x="80" y="130" width="380" height="300" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="270" y="162" class="label" text-anchor="middle" font-size="14">Testomgeving WGP 2.0</text>
<text x="270" y="200" class="sub" text-anchor="middle" font-size="12.5">Jan de Vries</text>
<text x="270" y="232" class="sub" text-anchor="middle" font-size="12.5">Piet Bakker</text>
<text x="270" y="264" class="sub" text-anchor="middle" font-size="12.5">Anna Jansen</text>
<text x="270" y="296" class="sub" text-anchor="middle" font-size="12.5">Klaas Smit</text>
<text x="270" y="328" class="sub" text-anchor="middle" font-size="12.5">Marie Visser</text>
<text x="270" y="360" class="sub" text-anchor="middle" font-size="12.5">Willem de Boer</text>
<text x="270" y="410" class="sub" text-anchor="middle" font-size="11" fill="#8A5A0E">47 namen — allemaal in dit patroon</text>
<rect x="500" y="130" width="380" height="300" rx="8" fill="#1A4F8B" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="690" y="162" class="label-light" text-anchor="middle" font-size="14">Echt personeelsbestand</text>
<text x="690" y="200" class="sub-light" text-anchor="middle" font-size="12.5">Fatima El-Amrani</text>
<text x="690" y="232" class="sub-light" text-anchor="middle" font-size="12.5">Sanne d'Hondt</text>
<text x="690" y="264" class="sub-light" text-anchor="middle" font-size="12.5">José van der Berg-Kuyt</text>
<text x="690" y="296" class="sub-light" text-anchor="middle" font-size="12.5">Nguyễn Thi Lan</text>
<text x="690" y="328" class="sub-light" text-anchor="middle" font-size="12.5">O'Sullivan, Ruairí</text>
<text x="690" y="360" class="sub-light" text-anchor="middle" font-size="12.5">Aïcha ten Boom</text>
<text x="690" y="410" class="sub-light" text-anchor="middle" font-size="11">apostrofs, koppeltekens, diakritische tekens</text>
<text x="480" y="460" text-anchor="middle" class="sub" fill="#8A5A0E">Testgevallen die je intuïtief bedenkt, testen vooral het geval waar je toevallig aan denkt.</text>

</svg>