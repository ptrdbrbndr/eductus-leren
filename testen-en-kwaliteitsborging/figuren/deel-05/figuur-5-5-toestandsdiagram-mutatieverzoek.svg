<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="'DM Sans', Arial, sans-serif" width="1000" height="560" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .mono { font-family: 'Courier New', monospace; }
</style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arramb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#9A5F0D"/></marker>
    </defs>
<rect width="1000" height="560" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 5 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Toestandsdiagram van een mutatieverzoek</text>
<text x="40" y="90" class="sub">Alle toegestane overgangen als pijlen — de niet-toegestane overgang is gemarkeerd.</text>
<rect x="75" y="232" width="150" height="56" rx="10" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="150" y="265" class="label" text-anchor="middle" font-size="12">ingediend</text>
<rect x="295" y="232" width="150" height="56" rx="10" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="370" y="265" class="label" text-anchor="middle" font-size="12">behandeling</text>
<rect x="515" y="232" width="150" height="56" rx="10" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="590" y="265" class="label" text-anchor="middle" font-size="12">geaccepteerd</text>
<rect x="735" y="232" width="150" height="56" rx="10" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="810" y="265" class="label" text-anchor="middle" font-size="12">doorgezet</text>
<rect x="735" y="392" width="150" height="56" rx="10" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="810" y="425" class="label" text-anchor="middle" font-size="12">verwerkt</text>
<rect x="295" y="392" width="150" height="56" rx="10" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="370" y="425" class="label" text-anchor="middle" font-size="12">geblokkeerd</text>
<rect x="75" y="392" width="150" height="56" rx="10" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="150" y="425" class="label" text-anchor="middle" font-size="12">afgewezen</text>
<path d="M225 260 L295 260" class="arrow-b"/>
<path d="M445 260 L515 260" class="arrow-b"/>
<path d="M665 260 L735 260" class="arrow-b"/>
<path d="M810 288 L810 392" class="arrow-b"/>
<path d="M370 288 L370 392" class="arrow-b"/>
<path d="M340 288 L180 392" class="arrow-b"/>
<path d="M735 410 C 500 480, 450 300, 390 290" stroke="#E9A13B" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#arramb)"/>
<rect x="430" y="470" width="260" height="40" rx="6" fill="#FBFAF7" stroke="#E9A13B" stroke-width="1.5"/>
<text x="560" y="495" class="sub" text-anchor="middle" font-size="10.5" fill="#9A5F0D">niet toegestaan: "verwerkt" terug naar "behandeling"</text>
<text x="500" y="40" text-anchor="middle" class="sub" fill="#9A5F0D">Er bestond geen toestand voor "doorgezet, nog niet bevestigd" — en dus ook geen testgeval dat die zocht.</text>

</svg>