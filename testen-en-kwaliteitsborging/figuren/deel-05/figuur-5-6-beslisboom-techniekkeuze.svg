<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="'DM Sans', Arial, sans-serif" width="960" height="520" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .blue-line { stroke:#1A4F8B; }
      .blue-fill { fill:#C5D8F0; }
      .blue-mid { fill:#8AAFD4; }
      .blue-dark { fill:#1A4F8B; }
      .amber { stroke:#E8A020; }
      .amber-fill { fill:#E8A020; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .sub-light { font-size:12px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#5B6675; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .mono { font-family: 'Courier New', monospace; }
</style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5B6675"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1A4F8B"/></marker>
    <marker id="arramb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8A5A0E"/></marker>
    </defs>
<rect width="960" height="520" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 5 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Welke techniek bij welke testbasis?</text>
<text x="40" y="90" class="sub">Een beslisboom om van testbasis-vorm naar geschikte techniek te komen.</text>
<rect x="350" y="104" width="260" height="52" rx="8" fill="#1A4F8B" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="480" y="135" class="label-light" text-anchor="middle" font-size="13">Wat voor testbasis heb je?</text>
<path d="M480 156 C 480 200, 190 200, 190 240" class="arrow"/>
<rect x="90" y="240" width="200" height="56" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="190" y="262" class="sub" text-anchor="middle" font-size="10.5">Eén veld, breed bereik</text>
<path d="M190 296 L190 330" class="arrow-b"/>
<rect x="90" y="330" width="200" height="60" rx="6" fill="#8AAFD4" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="190" y="356" class="label" text-anchor="middle" font-size="12">Equivalentieklassen +</text>
<text x="190" y="374" class="label" text-anchor="middle" font-size="12">grenswaarden</text>
<path d="M480 156 C 480 200, 420 200, 420 240" class="arrow"/>
<rect x="320" y="240" width="200" height="56" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="420" y="262" class="sub" text-anchor="middle" font-size="10.5">Getalsgrens expliciet</text>
<text x="420" y="277" class="sub" text-anchor="middle" font-size="10.5">genoemd</text>
<path d="M420 296 L420 330" class="arrow-b"/>
<rect x="320" y="330" width="200" height="60" rx="6" fill="#8AAFD4" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="420" y="356" class="label" text-anchor="middle" font-size="12">Grenswaardeanalyse</text>
<text x="420" y="374" class="label" text-anchor="middle" font-size="12">(driepunts)</text>
<path d="M480 156 C 480 200, 650 200, 650 240" class="arrow"/>
<rect x="550" y="240" width="200" height="56" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="650" y="262" class="sub" text-anchor="middle" font-size="10.5">Meerdere condities</text>
<text x="650" y="277" class="sub" text-anchor="middle" font-size="10.5">samen</text>
<path d="M650 296 L650 330" class="arrow-b"/>
<rect x="550" y="330" width="200" height="60" rx="6" fill="#8AAFD4" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="650" y="356" class="label" text-anchor="middle" font-size="12">Beslissingstabel</text>
<path d="M480 156 C 480 200, 860 200, 860 240" class="arrow"/>
<rect x="760" y="240" width="200" height="56" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="860" y="262" class="sub" text-anchor="middle" font-size="10.5">Gedrag hangt van</text>
<text x="860" y="277" class="sub" text-anchor="middle" font-size="10.5">historie af</text>
<path d="M860 296 L860 330" class="arrow-b"/>
<rect x="760" y="330" width="200" height="60" rx="6" fill="#8AAFD4" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="860" y="356" class="label" text-anchor="middle" font-size="12">Toestandsovergangen</text>
<text x="480" y="470" text-anchor="middle" class="sub" fill="#8A5A0E">In de praktijk worden deze technieken gecombineerd, niet los ingezet.</text>

</svg>