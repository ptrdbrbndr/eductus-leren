<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="'DM Sans', Arial, sans-serif" width="960" height="420" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .mono { font-family: 'Courier New', monospace; }
</style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arramb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#9A5F0D"/></marker>
    </defs>
<rect width="960" height="420" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 5 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Vijf equivalentieklassen van het fte-percentage</text>
<text x="40" y="90" class="sub">Geldig: 0,1 tot en met 1,0 — elke klasse met een representatieve testwaarde.</text>
<line x1="90" y1="250" x2="870" y2="250" class="arrow-b"/>
<rect x="90" y="180" width="93.6" height="60" rx="4" fill="#F4F2EC" stroke="#2563A8" stroke-width="1"/>
<text x="136.8" y="206" class="sub" text-anchor="middle" font-size="10.5">&lt; 0,1</text>
<circle cx="136.8" cy="250" r="6" fill="#E9A13B"/>
<text x="136.8" y="274" class="sub" text-anchor="middle" font-size="11">0,0</text>
<rect x="183.6" y="180" width="390" height="60" rx="4" fill="#6FA3D6" stroke="#2563A8" stroke-width="1"/>
<text x="378.6" y="206" class="sub" text-anchor="middle" font-size="10.5">0,1–1,0 (stappen</text>
<text x="378.6" y="220" class="sub" text-anchor="middle" font-size="10.5">0,1)</text>
<circle cx="378.6" cy="250" r="6" fill="#2563A8"/>
<text x="378.6" y="274" class="sub" text-anchor="middle" font-size="11">0,6</text>
<rect x="573.6" y="180" width="101.39999999999998" height="60" rx="4" fill="#F4F2EC" stroke="#2563A8" stroke-width="1"/>
<text x="624.3" y="206" class="sub" text-anchor="middle" font-size="10.5">&gt; 1,0</text>
<circle cx="624.3" cy="250" r="6" fill="#E9A13B"/>
<text x="624.3" y="274" class="sub" text-anchor="middle" font-size="11">1,2</text>
<rect x="698.4" y="180" width="78" height="60" rx="4" fill="#F4F2EC" stroke="#2563A8" stroke-width="1"/>
<text x="737.4" y="206" class="sub" text-anchor="middle" font-size="10.5">niet in</text>
<text x="737.4" y="219" class="sub" text-anchor="middle" font-size="10.5">stappen</text>
<circle cx="737.4" cy="250" r="6" fill="#E9A13B"/>
<text x="737.4" y="274" class="sub" text-anchor="middle" font-size="11">0,63</text>
<rect x="792" y="180" width="78" height="60" rx="4" fill="#F4F2EC" stroke="#2563A8" stroke-width="1"/>
<text x="831" y="206" class="sub" text-anchor="middle" font-size="10.5">geen getal</text>
<circle cx="831" cy="250" r="6" fill="#E9A13B"/>
<text x="831" y="274" class="sub" text-anchor="middle" font-size="11">leeg / tekst</text>
<text x="480" y="380" text-anchor="middle" class="sub" fill="#9A5F0D">Vijf testgevallen dekken hiermee het volledige waardebereik — met een aanname over homogeniteit.</text>

</svg>