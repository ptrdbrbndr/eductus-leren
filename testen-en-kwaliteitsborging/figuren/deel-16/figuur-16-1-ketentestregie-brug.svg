<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'DM Sans', Arial, sans-serif" width="960" height="560" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-dark { fill:#2563A8; }
      .label { font-size:13px; font-weight:700; fill:#14213D; }
      .label-light { font-size:13px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:11px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:26px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    </style>
</defs>
<rect width="960" height="560" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 16 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Ketentestregie als brug tussen twee organisaties</text>
<text x="40" y="92" class="sub">Met één gedeeld koppelvlakontwerp als spil.</text>

<!-- two organisation blocks -->
<rect x="60" y="180" width="280" height="180" rx="10" fill="#FFFFFF" class="blue-line" stroke-width="1.5"/>
<text x="200" y="215" text-anchor="middle" class="label">MERIDIAAN</text>
<text x="200" y="238" text-anchor="middle" class="sub">portaalteam · Jelle Bakker</text>
<rect x="90" y="260" width="220" height="70" rx="6" fill="#F4F2EC"/>
<text x="200" y="288" text-anchor="middle" class="sub">eigen testproces,</text>
<text x="200" y="304" text-anchor="middle" class="sub">eigen "gereed"</text>

<rect x="620" y="180" width="280" height="180" rx="10" fill="#FFFFFF" class="blue-line" stroke-width="1.5"/>
<text x="760" y="215" text-anchor="middle" class="label">VESTARA</text>
<text x="760" y="238" text-anchor="middle" class="sub">testcoördinator · Ruben Sanders</text>
<rect x="650" y="260" width="220" height="70" rx="6" fill="#F4F2EC"/>
<text x="760" y="288" text-anchor="middle" class="sub">eigen testproces,</text>
<text x="760" y="304" text-anchor="middle" class="sub">contract gaat over levering</text>

<!-- bridge -->
<path d="M340 270 Q480 210 620 270" fill="none" stroke="#2563A8" stroke-width="4"/>
<rect x="410" y="230" width="140" height="70" rx="8" class="blue-dark"/>
<text x="480" y="258" text-anchor="middle" class="label-light" font-size="11">GEDEELD</text>
<text x="480" y="273" text-anchor="middle" class="label-light" font-size="11">KOPPELVLAK-</text>
<text x="480" y="288" text-anchor="middle" class="label-light" font-size="11">ONTWERP</text>

<!-- regie role beneath -->
<rect x="330" y="390" width="300" height="70" rx="10" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2"/>
<text x="480" y="418" text-anchor="middle" class="label" fill="#9A5F0D">KETENTESTREGIE — IRIS</text>
<text x="480" y="438" text-anchor="middle" class="sub">mandaat over de keten als geheel</text>
<path d="M480 360 L480 390" stroke="#E9A13B" stroke-width="2" stroke-dasharray="4 3"/>

<rect x="130" y="480" width="700" height="50" rx="8" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
<text x="480" y="500" text-anchor="middle" class="sub" fill="#9A5F0D">"Dat is bij ons getest" zegt niets over de keten — twee partijen kunnen</text>
<text x="480" y="518" text-anchor="middle" class="sub" fill="#9A5F0D">allebei gelijk hebben en samen toch ongelijk</text>
</svg>
