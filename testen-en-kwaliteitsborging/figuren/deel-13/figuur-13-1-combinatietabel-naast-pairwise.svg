<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'DM Sans', Arial, sans-serif" width="960" height="560" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .blue-line { stroke:#1A4F8B; }
      .label { font-size:12px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:12px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:10.5px; fill:#5B6675; }
      .cell { font-size:10.5px; text-anchor:middle; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:26px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
    </style>
</defs>
<rect width="960" height="560" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 13 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Volledige combinaties naast pairwise</text>
<text x="40" y="92" class="sub">Drie condities, elk twee waarden — dezelfde paren gedekt met de helft van het aantal regels.</text>

<text x="235" y="130" text-anchor="middle" class="sub" font-weight="700" fill="#5B6675">VOLLEDIGE COMBINATIETABEL — 8 REGELS</text>
<text x="720" y="130" text-anchor="middle" class="sub" font-weight="700" fill="#1A4F8B">PAIRWISE-TABEL — 4 REGELS</text>

<!-- left table -->
<g>
<rect x="80" y="145" width="310" height="30" fill="#1A4F8B"/>
<text x="150" y="165" text-anchor="middle" class="label-light" font-size="10.5">A</text>
<text x="235" y="165" text-anchor="middle" class="label-light" font-size="10.5">B</text>
<text x="320" y="165" text-anchor="middle" class="label-light" font-size="10.5">C</text>
<g font-size="10.5">
<!-- 8 rows -->
<rect x="80" y="175" width="310" height="28" fill="#FFFFFF" stroke="#C9C4B6"/><text x="150" y="194" class="cell">1</text><text x="235" y="194" class="cell">x</text><text x="320" y="194" class="cell">p</text>
<rect x="80" y="203" width="310" height="28" fill="#F0EDE4" stroke="#C9C4B6"/><text x="150" y="222" class="cell">1</text><text x="235" y="222" class="cell">x</text><text x="320" y="222" class="cell">q</text>
<rect x="80" y="231" width="310" height="28" fill="#FFFFFF" stroke="#C9C4B6"/><text x="150" y="250" class="cell">1</text><text x="235" y="250" class="cell">y</text><text x="320" y="250" class="cell">p</text>
<rect x="80" y="259" width="310" height="28" fill="#F0EDE4" stroke="#C9C4B6"/><text x="150" y="278" class="cell">1</text><text x="235" y="278" class="cell">y</text><text x="320" y="278" class="cell">q</text>
<rect x="80" y="287" width="310" height="28" fill="#FFFFFF" stroke="#C9C4B6"/><text x="150" y="306" class="cell">2</text><text x="235" y="306" class="cell">x</text><text x="320" y="306" class="cell">p</text>
<rect x="80" y="315" width="310" height="28" fill="#F0EDE4" stroke="#C9C4B6"/><text x="150" y="334" class="cell">2</text><text x="235" y="334" class="cell">x</text><text x="320" y="334" class="cell">q</text>
<rect x="80" y="343" width="310" height="28" fill="#FFFFFF" stroke="#C9C4B6"/><text x="150" y="362" class="cell">2</text><text x="235" y="362" class="cell">y</text><text x="320" y="362" class="cell">p</text>
<rect x="80" y="371" width="310" height="28" fill="#F0EDE4" stroke="#C9C4B6"/><text x="150" y="390" class="cell">2</text><text x="235" y="390" class="cell">y</text><text x="320" y="390" class="cell">q</text>
</g>
</g>

<!-- right table -->
<g>
<rect x="565" y="145" width="310" height="30" fill="#1A4F8B"/>
<text x="635" y="165" text-anchor="middle" class="label-light" font-size="10.5">A</text>
<text x="720" y="165" text-anchor="middle" class="label-light" font-size="10.5">B</text>
<text x="805" y="165" text-anchor="middle" class="label-light" font-size="10.5">C</text>
<rect x="565" y="175" width="310" height="34" fill="#C5D8F0" stroke="#1A4F8B" stroke-width="1.2"/><text x="635" y="197" class="cell" font-weight="700">1</text><text x="720" y="197" class="cell" font-weight="700">x</text><text x="805" y="197" class="cell" font-weight="700">p</text>
<rect x="565" y="209" width="310" height="34" fill="#C5D8F0" stroke="#1A4F8B" stroke-width="1.2"/><text x="635" y="231" class="cell" font-weight="700">1</text><text x="720" y="231" class="cell" font-weight="700">y</text><text x="805" y="231" class="cell" font-weight="700">q</text>
<rect x="565" y="243" width="310" height="34" fill="#C5D8F0" stroke="#1A4F8B" stroke-width="1.2"/><text x="635" y="265" class="cell" font-weight="700">2</text><text x="720" y="265" class="cell" font-weight="700">x</text><text x="805" y="265" class="cell" font-weight="700">q</text>
<rect x="565" y="277" width="310" height="34" fill="#C5D8F0" stroke="#1A4F8B" stroke-width="1.2"/><text x="635" y="299" class="cell" font-weight="700">2</text><text x="720" y="299" class="cell" font-weight="700">y</text><text x="805" y="299" class="cell" font-weight="700">p</text>
</g>
<text x="720" y="335" text-anchor="middle" class="sub" font-style="italic">elk paar van A×B, A×C, B×C komt hier minstens één keer voor</text>

<rect x="130" y="480" width="700" height="50" rx="8" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>
<text x="480" y="500" text-anchor="middle" class="sub" fill="#8A5A0E">Bij zeven condities: van ruim duizend naar circa 40 testgevallen —</text>
<text x="480" y="518" text-anchor="middle" class="sub" fill="#8A5A0E">een risicoafweging, geen technische garantie</text>
</svg>
