<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="'DM Sans', Arial, sans-serif" width="960" height="600" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .label { font-size:12px; font-weight:700; fill:#14213D; }
      .label-light { font-size:12px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:10.5px; fill:#55606F; }
      .cell { font-size:10.5px; text-anchor:middle; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:26px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    </style>
</defs>
<rect width="960" height="600" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 13 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Domeinanalyse: twee grenzen tegelijk</text>
<text x="40" y="92" class="sub">Datum en bedrag samen bepalen het geldige gebied — de gecombineerde grens wordt gemist als elke as apart wordt getest.</text>

<!-- 2D plane -->
<g>
  <line x1="120" y1="480" x2="120" y2="130" stroke="#55606F" stroke-width="1.5"/>
  <line x1="120" y1="480" x2="470" y2="480" stroke="#55606F" stroke-width="1.5"/>
  <text x="290" y="510" text-anchor="middle" class="sub">ingangsdatum → (grens bij 24 mnd)</text>
  <text x="60" y="300" text-anchor="middle" class="sub" transform="rotate(-90 60 300)">bedrag → (grens bij plausibiliteitsmarge)</text>

  <rect x="120" y="130" width="220" height="230" fill="#CBDCEF" opacity="0.6"/>
  <line x1="340" y1="130" x2="340" y2="480" stroke="#2563A8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="120" y1="360" x2="470" y2="360" stroke="#2563A8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="230" y="245" text-anchor="middle" class="sub" fill="#14213D" font-weight="700">geldig gebied (in)</text>

  <circle cx="340" cy="360" r="7" fill="#E9A13B"/>
  <text x="340" y="400" text-anchor="middle" class="sub" font-weight="700" fill="#9A5F0D">gecombineerde grens</text>
  <text x="340" y="415" text-anchor="middle" class="sub" fill="#9A5F0D">(on/on) — hier zit het risico</text>

  <circle cx="340" cy="200" r="6" fill="#2563A8"/>
  <circle cx="200" cy="360" r="6" fill="#2563A8"/>
  <circle cx="360" cy="360" r="6" fill="#55606F"/>
  <circle cx="340" cy="380" r="6" fill="#55606F"/>
</g>

<!-- table -->
<g>
<rect x="530" y="150" width="360" height="34" fill="#2563A8"/>
<text x="590" y="172" text-anchor="middle" class="label-light" font-size="10.5">DATUM</text>
<text x="700" y="172" text-anchor="middle" class="label-light" font-size="10.5">BEDRAG</text>
<text x="820" y="172" text-anchor="middle" class="label-light" font-size="10.5">IN / OUT</text>

<rect x="530" y="184" width="360" height="30" fill="#FFFFFF" stroke="#D9D5C8"/>
<text x="590" y="204" class="cell">on (24 mnd)</text><text x="700" y="204" class="cell">on (marge)</text><text x="820" y="204" class="cell" font-weight="700" fill="#2563A8">in</text>

<rect x="530" y="214" width="360" height="30" fill="#F4F2EC" stroke="#D9D5C8"/>
<text x="590" y="234" class="cell">on (24 mnd)</text><text x="700" y="234" class="cell">off (net over)</text><text x="820" y="234" class="cell" font-weight="700" fill="#55606F">out</text>

<rect x="530" y="244" width="360" height="30" fill="#FFFFFF" stroke="#D9D5C8"/>
<text x="590" y="264" class="cell">off (net over)</text><text x="700" y="264" class="cell">on (marge)</text><text x="820" y="264" class="cell" font-weight="700" fill="#55606F">out</text>

<rect x="530" y="274" width="360" height="30" fill="#F4F2EC" stroke="#D9D5C8"/>
<text x="590" y="294" class="cell">ruim binnen</text><text x="700" y="294" class="cell">ruim binnen</text><text x="820" y="294" class="cell" font-weight="700" fill="#2563A8">in</text>
</g>
<text x="710" y="335" text-anchor="middle" class="sub" font-style="italic">grenswaardeanalyse per variabele mist rij 1–2:</text>
<text x="710" y="350" text-anchor="middle" class="sub" font-style="italic">op de datumgrens, ruim binnen de bedraggrens</text>

<rect x="130" y="490" width="700" height="50" rx="8" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
<text x="480" y="510" text-anchor="middle" class="sub" fill="#9A5F0D">Een testgeval kan op één grens precies zitten en op de andere ruim binnen —</text>
<text x="480" y="528" text-anchor="middle" class="sub" fill="#9A5F0D">waardoor de plek waar beide grenzen elkaar raken nooit wordt geraakt</text>
</svg>
