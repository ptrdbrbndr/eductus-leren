<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'DM Sans', Arial, sans-serif" width="960" height="560" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:13px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:13px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:11.5px; fill:#5B6675; }
      .sub-light { font-size:11.5px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#5B6675; stroke-width:1.5; fill:none; marker-end:url(#arr); }
    </style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5B6675"/></marker>
</defs>
<rect width="960" height="560" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 28 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Observability als venster op het systeem</text>
<text x="40" y="96" class="sub">Logs, metrics en traces samen beantwoorden onvoorziene vragen achteraf die vooraf niet waren gesteld.</text>

<rect x="330" y="150" width="300" height="180" rx="10" fill="#1A4F8B"/>
<text x="480" y="230" text-anchor="middle" class="label-light" font-size="15">Het systeem</text>
<text x="480" y="252" text-anchor="middle" class="sub-light" font-size="11">Mutatieplatform / Stelselovergang</text>
<text x="480" y="270" text-anchor="middle" class="sub-light" font-size="11">interne toestand, normaal onzichtbaar</text>

<!-- three window panes around it -->
<rect x="120" y="150" width="180" height="180" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="210" y="190" text-anchor="middle" class="label" font-size="13">Logs</text>
<text x="210" y="216" text-anchor="middle" class="sub" font-size="11">wat er precies</text>
<text x="210" y="232" text-anchor="middle" class="sub" font-size="11">gebeurde, event</text>
<text x="210" y="248" text-anchor="middle" class="sub" font-size="11">voor event</text>

<rect x="660" y="150" width="180" height="180" rx="8" fill="#C5D8F0" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="750" y="190" text-anchor="middle" class="label" font-size="13">Metrics</text>
<text x="750" y="216" text-anchor="middle" class="sub" font-size="11">geaggregeerde</text>
<text x="750" y="232" text-anchor="middle" class="sub" font-size="11">cijfers over tijd</text>

<rect x="380" y="360" width="200" height="110" rx="8" fill="#8AAFD4" stroke="#E8A020" stroke-width="3"/>
<text x="480" y="396" text-anchor="middle" class="label-light" font-size="13">Traces</text>
<text x="480" y="420" text-anchor="middle" class="sub-light" font-size="11">het pad van één</text>
<text x="480" y="436" text-anchor="middle" class="sub-light" font-size="11">verzoek door het systeem</text>

<path d="M300 220 L330 220" class="arrow"/>
<path d="M660 220 L630 220" class="arrow"/>
<path d="M480 358 L480 332" class="arrow"/>

<text x="120" y="120" class="sub" font-size="11">? onvoorziene vraag achteraf</text>
<text x="700" y="120" class="sub" font-size="11" text-anchor="end">antwoord vindbaar, zonder vooraf te voorspellen</text>

<text x="480" y="520" text-anchor="middle" class="sub" fill="#8A5A0E">Zonder observability blijft een probleem onzichtbaar tot een gebruiker zich meldt; mét observability wordt het signaal actief opgepikt.</text>
</svg>
