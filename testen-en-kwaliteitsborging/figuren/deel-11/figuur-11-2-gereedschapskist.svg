<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-dark { fill:#2563A8; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:13px; font-weight:700; fill:#14213D; }
      .label-light { font-size:13px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:11.5px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:26px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    </style>
</defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 11 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">De bouwstenen als gereedschapskist</text>
<text x="40" y="92" class="sub">Elk team put naar behoefte uit dezelfde vijf bouwstenen — geen vaste volgorde, geen verplichte fase.</text>

<!-- five tools sticking out -->
<g>
  <rect x="76" y="180" width="130" height="220" rx="6" fill="#FFFFFF" class="blue-line" stroke-width="1.5"/>
  <rect x="76" y="180" width="130" height="34" rx="6" class="blue-dark"/>
  <text x="141" y="203" text-anchor="middle" class="label-light" font-size="11">BUSINESS-</text>
  <text x="141" y="245" text-anchor="middle" class="label" font-size="11">DRIVEN</text>
  <text x="141" y="270" text-anchor="middle" class="sub" font-size="10">teststrategie uit</text>
  <text x="141" y="285" text-anchor="middle" class="sub" font-size="10">bedrijfsdoel en risico</text>
</g>
<g>
  <rect x="222" y="150" width="130" height="250" rx="6" fill="#FFFFFF" class="blue-line" stroke-width="1.5"/>
  <rect x="222" y="150" width="130" height="34" rx="6" class="blue-dark"/>
  <text x="287" y="173" text-anchor="middle" class="label-light" font-size="11">STRUCTURED</text>
  <text x="287" y="215" text-anchor="middle" class="sub" font-size="10">equivalentieklassen,</text>
  <text x="287" y="230" text-anchor="middle" class="sub" font-size="10">grenswaarden,</text>
  <text x="287" y="245" text-anchor="middle" class="sub" font-size="10">beslissingstabellen</text>
</g>
<g>
  <rect x="368" y="195" width="130" height="205" rx="6" fill="#FFFFFF" class="blue-line" stroke-width="1.5"/>
  <rect x="368" y="195" width="130" height="34" rx="6" class="blue-dark"/>
  <text x="433" y="218" text-anchor="middle" class="label-light" font-size="11">EXPLORATORY</text>
  <text x="433" y="260" text-anchor="middle" class="sub" font-size="10">aanvulling bij een</text>
  <text x="433" y="275" text-anchor="middle" class="sub" font-size="10">onvolledige testbasis</text>
</g>
<g>
  <rect x="514" y="160" width="150" height="240" rx="6" fill="#FFFFFF" class="blue-line" stroke-width="1.5"/>
  <rect x="514" y="160" width="150" height="34" rx="6" class="blue-dark"/>
  <text x="589" y="183" text-anchor="middle" class="label-light" font-size="10.5">QUALITY ENGINEERING</text>
  <text x="589" y="225" text-anchor="middle" class="sub" font-size="10">kwaliteit inbouwen:</text>
  <text x="589" y="240" text-anchor="middle" class="sub" font-size="10">pair testing, contract-</text>
  <text x="589" y="255" text-anchor="middle" class="sub" font-size="10">gestuurd ontwikkelen</text>
</g>
<g>
  <rect x="680" y="175" width="150" height="225" rx="6" fill="#FFFFFF" class="blue-line" stroke-width="1.5"/>
  <rect x="680" y="175" width="150" height="34" rx="6" class="blue-dark"/>
  <text x="755" y="198" text-anchor="middle" class="label-light" font-size="10.5">AGILE / DEVOPS-FIT</text>
  <text x="755" y="240" text-anchor="middle" class="sub" font-size="10">sprints, continue</text>
  <text x="755" y="255" text-anchor="middle" class="sub" font-size="10">levering, release-trein</text>
</g>

<!-- toolbox base -->
<rect x="60" y="400" width="840" height="90" rx="10" fill="#2563A8"/>
<path d="M60 400 L60 385 Q60 375 70 375 L370 375 Q380 375 385 385 L395 400 Z" fill="#2563A8"/>
<rect x="480" y="430" width="18" height="30" rx="4" fill="#FBFAF7"/>
<text x="480" y="475" text-anchor="middle" class="sub" fill="#DFDCD3">TMAP — vijf bouwstenen, één gedeeld kader</text>

<rect x="130" y="530" width="700" height="46" rx="8" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
<text x="480" y="558" text-anchor="middle" class="sub" fill="#9A5F0D">Vijf teams, vijf tempo's — bouwstenen laten elk team zijn eigen tempo houden</text>
</svg>
