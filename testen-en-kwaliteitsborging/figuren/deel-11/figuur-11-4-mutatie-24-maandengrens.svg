<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'DM Sans', Arial, sans-serif" width="960" height="640" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-dark { fill:#2563A8; }
      .mono { font-family:'DM Mono', 'Courier New', monospace; font-size:14px; }
      .label { font-size:13px; font-weight:700; fill:#14213D; }
      .sub { font-size:11.5px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:26px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    </style>
</defs>
<rect width="960" height="640" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 11 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Een mutatie in de 24-maandengrens</text>
<text x="40" y="92" class="sub">Gedood door een driepuntsgrenstest, overleefd door een test die alleen het midden van de klasse raakt.</text>

<!-- code block -->
<rect x="60" y="115" width="840" height="90" rx="8" fill="#14213D"/>
<text x="84" y="150" class="mono" fill="#6FA3D6">if (ingangsdatum</text>
<text x="240" y="150" class="mono" fill="#FBFAF7">&gt;</text>
<text x="258" y="150" class="mono" fill="#6FA3D6">24_maanden_geleden) { afwijzen(); }</text>
<text x="84" y="180" class="mono" fill="#E9A13B">// mutatie: &gt; wordt ≥</text>

<!-- number line -->
<line x1="120" y1="330" x2="840" y2="330" stroke="#55606F" stroke-width="1.5"/>
<!-- boundary marker at 24 -->
<line x1="480" y1="300" x2="480" y2="360" stroke="#14213D" stroke-width="2"/>
<text x="480" y="390" text-anchor="middle" class="sub" font-weight="700">24 mnd — de grens</text>

<!-- three-point test -->
<circle cx="450" cy="330" r="7" fill="#2563A8"/>
<text x="450" y="270" text-anchor="middle" class="sub">23</text>
<circle cx="480" cy="330" r="7" fill="#2563A8"/>
<text x="480" y="250" text-anchor="middle" class="sub">24</text>
<circle cx="510" cy="330" r="7" fill="#2563A8"/>
<text x="510" y="270" text-anchor="middle" class="sub">25</text>
<path d="M420 245 h130 v-30 h-130 z" fill="none"/>
<rect x="400" y="180" width="170" height="42" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="485" y="206" text-anchor="middle" class="sub" font-weight="700" fill="#2563A8">driepuntsgrenstest</text>
<path d="M485 222 L485 315" stroke="#2563A8" stroke-width="1.3" stroke-dasharray="3 3"/>

<!-- midpoint test -->
<circle cx="220" cy="330" r="7" fill="#55606F"/>
<text x="220" y="270" text-anchor="middle" class="sub">5</text>
<rect x="135" y="180" width="170" height="42" rx="6" fill="#F4F2EC" stroke="#55606F" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="220" y="206" text-anchor="middle" class="sub" font-weight="700">test raakt alleen het midden</text>
<path d="M220 222 L220 315" stroke="#55606F" stroke-width="1.3" stroke-dasharray="3 3"/>

<!-- outcomes -->
<g>
  <rect x="380" y="440" width="220" height="90" rx="8" fill="#FFFFFF" class="blue-line" stroke-width="1.5"/>
  <circle cx="420" cy="475" r="14" fill="#2563A8"/>
  <path d="M413 475 l5 5 l9 -10" stroke="#FFFFFF" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="440" y="472" class="label" font-size="12">GEDODE MUTATIE</text>
  <text x="440" y="490" class="sub" font-size="10.5">een van de drie punten</text>
  <text x="440" y="504" class="sub" font-size="10.5">merkt de wijziging</text>
</g>
<g>
  <rect x="110" y="440" width="220" height="90" rx="8" fill="#F4F2EC" stroke="#55606F" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="150" cy="475" r="14" fill="#55606F"/>
  <path d="M144 469 l12 12 M156 469 l-12 12" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
  <text x="170" y="472" class="label" font-size="12">OVERLEEFDE MUTATIE</text>
  <text x="170" y="490" class="sub" font-size="10.5">het midden merkt</text>
  <text x="170" y="504" class="sub" font-size="10.5">niets</text>
</g>

<rect x="130" y="555" width="700" height="46" rx="8" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
<text x="480" y="583" text-anchor="middle" class="sub" fill="#9A5F0D">Dekking vraagt: is de regel aangeraakt? Mutatietesten vraagt: zou het opvallen?</text>
</svg>
