<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'DM Sans', Arial, sans-serif" width="960" height="560" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .blue-line { stroke:#1A4F8B; }
      .blue-dark { fill:#1A4F8B; }
      .label { font-size:12.5px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:12.5px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:11px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:26px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
    </style>
</defs>
<rect width="960" height="560" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 11 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Twee lijnen naast elkaar — geen van beide "beter"</text>
<text x="40" y="92" class="sub">Ze passen bij verschillende organisatiecontexten.</text>

<rect x="40" y="115" width="290" height="40" fill="none"/>
<rect x="330" y="115" width="290" height="40" rx="6" class="blue-dark"/>
<text x="475" y="140" text-anchor="middle" class="label-light">ISTQB (NIVEAU 1)</text>
<rect x="630" y="115" width="290" height="40" rx="6" fill="#E8A020"/>
<text x="775" y="140" text-anchor="middle" class="label" fill="#3A2A05">TMAP</text>

<!-- rows -->
<g>
  <text x="40" y="185" class="sub" font-weight="700" fill="#0D1B2A">Sturend principe</text>
  <rect x="330" y="165" width="290" height="44" rx="6" fill="#FFFFFF" class="blue-line" stroke-width="1.2"/>
  <text x="345" y="192" class="sub">Testproces met activiteiten</text>
  <rect x="630" y="165" width="290" height="44" rx="6" fill="#FFFFFF" stroke="#E8A020" stroke-width="1.2"/>
  <text x="645" y="192" class="sub">VOICE: waarde als vertrekpunt</text>
</g>
<g>
  <text x="40" y="243" class="sub" font-weight="700" fill="#0D1B2A">Organisatie van het werk</text>
  <rect x="330" y="223" width="290" height="44" rx="6" fill="#FFFFFF" class="blue-line" stroke-width="1.2"/>
  <text x="345" y="250" class="sub">Testniveaus, min of meer vast</text>
  <rect x="630" y="223" width="290" height="44" rx="6" fill="#FFFFFF" stroke="#E8A020" stroke-width="1.2"/>
  <text x="645" y="250" class="sub">Bouwstenen, naar behoefte</text>
</g>
<g>
  <text x="40" y="301" class="sub" font-weight="700" fill="#0D1B2A">Rolverdeling</text>
  <rect x="330" y="281" width="290" height="44" rx="6" fill="#FFFFFF" class="blue-line" stroke-width="1.2"/>
  <text x="345" y="308" class="sub">Testmanagement apart van testen</text>
  <rect x="630" y="281" width="290" height="44" rx="6" fill="#FFFFFF" stroke="#E8A020" stroke-width="1.2"/>
  <text x="645" y="308" class="sub">Whole-team, built-in quality</text>
</g>
<g>
  <text x="40" y="359" class="sub" font-weight="700" fill="#0D1B2A">Vraag bij dekking</text>
  <rect x="330" y="339" width="290" height="44" rx="6" fill="#FFFFFF" class="blue-line" stroke-width="1.2"/>
  <text x="345" y="366" class="sub">Hoeveel is aangeraakt?</text>
  <rect x="630" y="339" width="290" height="44" rx="6" fill="#FFFFFF" stroke="#E8A020" stroke-width="1.2"/>
  <text x="645" y="366" class="sub">Zou een fout worden gemerkt?</text>
</g>
<g>
  <text x="40" y="417" class="sub" font-weight="700" fill="#0D1B2A">Documentatiezwaarte</text>
  <rect x="330" y="397" width="290" height="44" rx="6" fill="#FFFFFF" class="blue-line" stroke-width="1.2"/>
  <text x="345" y="424" class="sub">Relatief zwaar — plan, rapport</text>
  <rect x="630" y="397" width="290" height="44" rx="6" fill="#FFFFFF" stroke="#E8A020" stroke-width="1.2"/>
  <text x="645" y="424" class="sub">Relatief licht, ingebed in team</text>
</g>

<rect x="130" y="470" width="700" height="52" rx="8" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>
<text x="480" y="493" text-anchor="middle" class="sub" fill="#8A5A0E">Iris kiest een mengvorm: risicogebaseerde discipline + precisie van ISTQB,</text>
<text x="480" y="510" text-anchor="middle" class="sub" fill="#8A5A0E">gedragen door TMAP-bouwstenen en whole-team-cultuur</text>
</svg>
