<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="'DM Sans', Arial, sans-serif" width="960" height="500" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-dark { fill:#2563A8; }
      .label { font-size:13px; font-weight:700; fill:#14213D; }
      .label-light { font-size:13px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:11px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:26px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
    </style>
</defs>
<rect width="960" height="500" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 15 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Drie technieken op een schaal van herleidbaarheid</text>
<text x="40" y="92" class="sub">Van "nog herleidbaar met sleutel" tot "nooit meer herleidbaar" — met maskeren als middenweg gericht op structuur.</text>

<line x1="100" y1="280" x2="860" y2="280" stroke="#55606F" stroke-width="2"/>
<path d="M860 280 L850 274 L850 286 Z" fill="#55606F"/>
<text x="100" y="310" class="sub">herleidbaar met sleutel</text>
<text x="820" y="310" text-anchor="end" class="sub">nooit meer herleidbaar</text>

<!-- pseudonimiseren -->
<circle cx="230" cy="280" r="10" class="blue-dark"/>
<rect x="115" y="150" width="230" height="105" rx="8" fill="#FFFFFF" class="blue-line" stroke-width="1.5"/>
<text x="230" y="178" text-anchor="middle" class="label">PSEUDONIMISEREN</text>
<text x="230" y="200" text-anchor="middle" class="sub">kunstmatige sleutel,</text>
<text x="230" y="216" text-anchor="middle" class="sub">terugherleiding mogelijk</text>
<text x="230" y="238" text-anchor="middle" class="sub" font-style="italic">— dezelfde "persoon" volgen</text>
<line x1="230" y1="255" x2="230" y2="270" stroke="#2563A8" stroke-width="1.5"/>

<!-- maskeren -->
<circle cx="480" cy="280" r="10" fill="#E9A13B"/>
<rect x="365" y="150" width="230" height="105" rx="8" fill="#FFFFFF" stroke="#E9A13B" stroke-width="1.5"/>
<text x="480" y="178" text-anchor="middle" class="label">MASKEREN</text>
<text x="480" y="200" text-anchor="middle" class="sub">plausibele, niet-herleidbare</text>
<text x="480" y="216" text-anchor="middle" class="sub">waarden, formaat behouden</text>
<text x="480" y="238" text-anchor="middle" class="sub" font-style="italic">— structuur, niet herleidbaarheid</text>
<line x1="480" y1="255" x2="480" y2="270" stroke="#E9A13B" stroke-width="1.5"/>

<!-- anonimiseren -->
<circle cx="730" cy="280" r="10" class="blue-dark"/>
<rect x="615" y="150" width="230" height="105" rx="8" fill="#FFFFFF" class="blue-line" stroke-width="1.5"/>
<text x="730" y="178" text-anchor="middle" class="label">ANONIMISEREN</text>
<text x="730" y="200" text-anchor="middle" class="sub">heridentificatie redelijker-</text>
<text x="730" y="216" text-anchor="middle" class="sub">wijs niet meer mogelijk</text>
<text x="730" y="238" text-anchor="middle" class="sub" font-style="italic">— strengste middel, kost data</text>
<line x1="730" y1="255" x2="730" y2="270" stroke="#2563A8" stroke-width="1.5"/>

<rect x="130" y="400" width="700" height="50" rx="8" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
<text x="480" y="420" text-anchor="middle" class="sub" fill="#9A5F0D">De vraag is niet "welke techniek is het veiligst" maar "welke techniek</text>
<text x="480" y="438" text-anchor="middle" class="sub" fill="#9A5F0D">past bij wat deze test moet aantonen, zonder meer risico dan nodig"</text>
</svg>
