<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="'DM Sans', Arial, sans-serif" width="960" height="600" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .blue-line { stroke:#1A4F8B; }
      .label { font-size:13px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:13px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:11px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:26px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
    </style>
</defs>
<rect width="960" height="600" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 17 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Drie abstractielagen als piramide</text>
<text x="40" y="92" class="sub">Testgevallen bovenaan blijven stabiel; technische implementatie onderaan is het gevoeligst voor wijziging, maar geïsoleerd.</text>

<!-- inverted structure: stable top wide, sensitive bottom narrow? per description: testgevallen bovenaan (stabiel), techn. impl onderaan (gevoelig maar geïsoleerd) -->
<polygon points="480,140 680,260 280,260" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="480" y="200" text-anchor="middle" class="label" font-size="12.5">LAAG 1 — TESTGEVALLEN</text>
<text x="480" y="222" text-anchor="middle" class="sub">mensentaal, losstaand van techniek</text>
<text x="480" y="240" text-anchor="middle" class="sub" font-style="italic">stabiel — blijft ongewijzigd bij een schermwijziging</text>

<polygon points="280,260 680,260 750,380 210,380" fill="#C5D8F0" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="480" y="315" text-anchor="middle" class="label" font-size="12.5">LAAG 2 — DOMEINACTIES</text>
<text x="480" y="337" text-anchor="middle" class="sub">herbruikbare, technologie-onafhankelijke stappen</text>
<text x="480" y="355" text-anchor="middle" class="sub" font-style="italic">"vul deeltijdformulier in", "verzend formulier"</text>

<polygon points="210,380 750,380 830,500 130,500" fill="#1A4F8B"/>
<text x="480" y="435" text-anchor="middle" class="label-light" font-size="12.5">LAAG 3 — TECHNISCHE IMPLEMENTATIE</text>
<text x="480" y="457" text-anchor="middle" fill="#E4E1D8" font-size="10.5">daadwerkelijke aanroepen naar scherm/API</text>
<text x="480" y="475" text-anchor="middle" fill="#E4E1D8" font-size="10.5" font-style="italic">meest gevoelig voor wijziging — maar hier geconcentreerd</text>

<rect x="130" y="530" width="700" height="50" rx="8" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>
<text x="480" y="550" text-anchor="middle" class="sub" fill="#8A5A0E">Wanneer het scherm wijzigt, hoeft alleen laag 3 te worden aangepast —</text>
<text x="480" y="568" text-anchor="middle" class="sub" fill="#8A5A0E">de testgevallen in laag 1 blijven ongewijzigd leesbaar en geldig</text>
</svg>
