<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="'DM Sans', Arial, sans-serif" width="960" height="600" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .blue-line { stroke:#1A4F8B; }
      .label { font-size:13px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:13px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:11px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:26px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
    </style>
</defs>
<rect width="960" height="600" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 17 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">De klassieke testpiramide</text>
<text x="40" y="92" class="sub">Veel componenttests, middelmatig veel integratietests, weinig end-to-end-tests.</text>

<polygon points="480,140 630,280 330,280" fill="#1A4F8B"/>
<text x="480" y="215" text-anchor="middle" class="label-light" font-size="12">END-TO-END</text>
<text x="480" y="235" text-anchor="middle" fill="#E4E1D8" font-size="10">weinig, traag, duur</text>

<polygon points="330,280 630,280 700,400 260,400" fill="#8AAFD4"/>
<text x="480" y="335" text-anchor="middle" class="label" font-size="12">INTEGRATIETESTS</text>
<text x="480" y="358" text-anchor="middle" class="sub">middelmatig veel</text>

<polygon points="260,400 700,400 780,520 180,520" fill="#C5D8F0"/>
<text x="480" y="455" text-anchor="middle" class="label" font-size="12">COMPONENTTESTS</text>
<text x="480" y="478" text-anchor="middle" class="sub">veel, snel, goedkoop — laagste niveau waar een fout zichtbaar is</text>

<rect x="130" y="540" width="700" height="46" rx="8" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>
<text x="480" y="568" text-anchor="middle" class="sub" fill="#8A5A0E">Een vaste vorm volgen zonder naar risico te kijken, is de nieuwe T2</text>
</svg>
