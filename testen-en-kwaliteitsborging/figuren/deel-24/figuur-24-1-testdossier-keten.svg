<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="'DM Sans', Arial, sans-serif" width="960" height="520" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:13px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:13px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:11.5px; fill:#5B6675; }
      .sub-light { font-size:11.5px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .field-num { font-size:12px; font-weight:700; fill:#FFFFFF; }
      .chain { stroke:#1A4F8B; stroke-width:2; }
    </style>
</defs>
<rect width="960" height="520" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 24 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Het testdossier — een keten van vier elementen</text>
<text x="40" y="96" class="sub">Elk element met een eigen bewaarplicht en toegankelijkheidseis; navolgbaar zonder de oorspronkelijke tester te raadplegen.</text>

<line x1="120" y1="140" x2="120" y2="420" class="chain"/>

<circle cx="120" cy="170" r="16" fill="#1A4F8B"/>
<text x="120" y="175" text-anchor="middle" class="field-num">1</text>
<rect x="160" y="140" width="740" height="62" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="178" y="164" class="label">TESTBASIS + INTERPRETATIE</text>
<text x="178" y="184" class="sub">de testbasis en, waar van toepassing, de juridische interpretatie (deel 23) waartegen is getest</text>

<circle cx="120" cy="235" r="16" fill="#1A4F8B"/>
<text x="120" y="240" text-anchor="middle" class="field-num">2</text>
<rect x="160" y="205" width="740" height="62" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="178" y="229" class="label">METHODE</text>
<text x="178" y="249" class="sub">de gebruikte methode, inclusief eventuele steekproefopzet (relevant voor "aannemelijk"-beweringen)</text>

<circle cx="120" cy="300" r="16" fill="#1A4F8B"/>
<text x="120" y="305" text-anchor="middle" class="field-num">3</text>
<rect x="160" y="270" width="740" height="62" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="178" y="294" class="label">UITKOMSTEN</text>
<text x="178" y="314" class="sub">de daadwerkelijke uitkomsten, niet alleen een samengevat oordeel</text>

<circle cx="120" cy="365" r="16" fill="#E8A020"/>
<path d="M114 365 l4 4 l8 -9" stroke="#0D1B2A" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="160" y="335" width="740" height="62" rx="6" fill="#1A4F8B" stroke="#E8A020" stroke-width="3"/>
<text x="178" y="359" class="label-light">WIE TESTTE / WIE VERIFIEERDE</text>
<text x="178" y="379" class="sub-light">wie de test heeft uitgevoerd, en wie — onafhankelijk — heeft geverifieerd</text>

<text x="480" y="460" text-anchor="middle" class="sub" fill="#8A5A0E">Een toezichtsdossier is het besluitvormend rapport plus het bewijs erachter — reproduceerbaar voor een derde.</text>
</svg>
