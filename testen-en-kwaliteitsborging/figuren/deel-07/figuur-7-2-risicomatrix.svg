<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'DM Sans', Arial, sans-serif" width="960" height="560" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .mono { font-family: 'Courier New', monospace; }
</style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arramb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#9A5F0D"/></marker>
    </defs>
<rect width="960" height="560" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 7 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Risicomatrix: kans × impact</text>
<text x="40" y="90" class="sub">Vier kwadranten: verwaarloosbaar, monitoren, aandacht, prioriteit.</text>
<rect x="200" y="150" width="276" height="166" rx="4" fill="#FBFAF7" stroke="#2563A8" stroke-width="1"/>
<text x="340" y="235" class="label" text-anchor="middle" font-size="15">Verwaarloosbaar</text>
<rect x="480" y="150" width="276" height="166" rx="4" fill="#6FA3D6" stroke="#2563A8" stroke-width="1"/>
<text x="620" y="235" class="label" text-anchor="middle" font-size="15">Aandacht</text>
<rect x="200" y="320" width="276" height="166" rx="4" fill="#D6E4F2" stroke="#2563A8" stroke-width="1"/>
<text x="340" y="405" class="label" text-anchor="middle" font-size="15">Monitoren</text>
<rect x="480" y="320" width="276" height="166" rx="4" fill="#2563A8" stroke="#2563A8" stroke-width="1"/>
<text x="620" y="405" class="label-light" text-anchor="middle" font-size="15">Prioriteit</text>
<path d="M200 490 L780 490" class="arrow-b"/>
<path d="M200 490 L200 130" class="arrow-b"/>
<text x="480" y="530" class="label" text-anchor="middle" font-size="13">kans →</text>
<text x="160" y="320" class="label" text-anchor="middle" font-size="13" transform="rotate(-90 160 320)">impact →</text>
<text x="480" y="530" text-anchor="middle" class="sub" fill="#9A5F0D">Een risicomatrix structureert het gesprek — zij is geen berekening die objectiviteit garandeert.</text>

</svg>