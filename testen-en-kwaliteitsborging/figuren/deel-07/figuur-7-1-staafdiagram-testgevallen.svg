<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="'DM Sans', Arial, sans-serif" width="960" height="480" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .blue-line { stroke:#1A4F8B; }
      .blue-fill { fill:#C5D8F0; }
      .blue-mid { fill:#8AAFD4; }
      .blue-dark { fill:#1A4F8B; }
      .amber { stroke:#E8A020; }
      .amber-fill { fill:#E8A020; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .sub-light { font-size:12px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#5B6675; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .mono { font-family: 'Courier New', monospace; }
</style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5B6675"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1A4F8B"/></marker>
    <marker id="arramb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8A5A0E"/></marker>
    </defs>
<rect width="960" height="480" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 7 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">180 tegen 4</text>
<text x="40" y="90" class="sub">De testgevallenverdeling van WGP 2.0 — terugwerkende kracht nauwelijks zichtbaar.</text>
<text x="205" y="388" class="sub" text-anchor="end" font-size="12">Inloggen / navigatie</text>
<rect x="220" y="370" width="620" height="26" rx="3" fill="#8AAFD4" stroke="none" stroke-width="1.5"/>
<text x="850" y="388" class="label" font-size="12.5" fill="#0D1B2A">180</text>
<text x="205" y="333" class="sub" text-anchor="end" font-size="12">Salaris toekomst/heden</text>
<rect x="220" y="315" width="244.55555555555554" height="26" rx="3" fill="#8AAFD4" stroke="none" stroke-width="1.5"/>
<text x="474.55555555555554" y="333" class="label" font-size="12.5" fill="#0D1B2A">71</text>
<text x="205" y="278" class="sub" text-anchor="end" font-size="12">Deeltijdwijziging</text>
<rect x="220" y="260" width="141.22222222222223" height="26" rx="3" fill="#8AAFD4" stroke="none" stroke-width="1.5"/>
<text x="371.22222222222223" y="278" class="label" font-size="12.5" fill="#0D1B2A">41</text>
<text x="205" y="223" class="sub" text-anchor="end" font-size="12">Overig</text>
<rect x="220" y="205" width="55.111111111111114" height="26" rx="3" fill="#8AAFD4" stroke="none" stroke-width="1.5"/>
<text x="285.1111111111111" y="223" class="label" font-size="12.5" fill="#0D1B2A">16</text>
<text x="205" y="168" class="sub" text-anchor="end" font-size="12">Salaris verleden (TWK)</text>
<rect x="220" y="150" width="13.777777777777779" height="26" rx="3" fill="#E8A020" stroke="none" stroke-width="1.5"/>
<text x="243.77777777777777" y="168" class="label" font-size="12.5" fill="#8A5A0E">4</text>
<text x="480" y="440" text-anchor="middle" class="sub" fill="#8A5A0E">Niemand besloot dat terugwerkende kracht onbelangrijk was — de verdeling ontstond uit gemak.</text>

