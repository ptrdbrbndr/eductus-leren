<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="'DM Sans', Arial, sans-serif" width="960" height="480" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .blue-line { stroke:#1A4F8B; }
      .blue-fill { fill:#C5D8F0; }
      .blue-mid { fill:#8AAFD4; }
      .blue-dark { fill:#1A4F8B; }
      .amber { stroke:#E8A020; }
      .amber-fill { fill:#E8A020; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .sub-light { font-size:12px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#5B6675; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .mono { font-family: 'Courier New', monospace; }
</style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5B6675"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1A4F8B"/></marker>
    <marker id="arramb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8A5A0E"/></marker>
    </defs>
<rect width="960" height="480" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 7 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Vier perspectieven voeden de productrisicoanalyse</text>
<text x="40" y="90" class="sub">Elk perspectief levert iets dat de andere drie niet zien.</text>
<rect x="90" y="115" width="260" height="90" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="220" y="146" class="label" text-anchor="middle" font-size="14">Tester</text>
<text x="220" y="168" class="sub" text-anchor="middle" font-size="10.5">technische kwetsbaarheid,</text>
<text x="220" y="184" class="sub" text-anchor="middle" font-size="10.5">complexiteit</text>
<path d="M220 205 L480 250" class="arrow-b"/>
<rect x="610" y="115" width="260" height="90" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="740" y="146" class="label" text-anchor="middle" font-size="14">Business / PO</text>
<text x="740" y="168" class="sub" text-anchor="middle" font-size="10.5">hoe vaak, welk financieel</text>
<text x="740" y="184" class="sub" text-anchor="middle" font-size="10.5">gevolg</text>
<path d="M740 205 L480 250" class="arrow-b"/>
<rect x="90" y="295" width="260" height="90" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="220" y="326" class="label" text-anchor="middle" font-size="14">Ontwikkelaars</text>
<text x="220" y="348" class="sub" text-anchor="middle" font-size="10.5">recent gewijzigd, complex,</text>
<text x="220" y="364" class="sub" text-anchor="middle" font-size="10.5">onervaren gebouwd</text>
<path d="M220 295 L480 250" class="arrow-b"/>
<rect x="610" y="295" width="260" height="90" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="740" y="326" class="label" text-anchor="middle" font-size="14">Beheer</text>
<text x="740" y="348" class="sub" text-anchor="middle" font-size="10.5">welke onderdelen gaven eerder</text>
<text x="740" y="364" class="sub" text-anchor="middle" font-size="10.5">storingen</text>
<path d="M740 295 L480 250" class="arrow-b"/>
<circle cx="480" cy="250" r="50" fill="#E8A020"/>
<text x="480" y="246" class="label" text-anchor="middle" font-size="11" fill="#FFFFFF">productrisico-</text>
<text x="480" y="262" class="label" text-anchor="middle" font-size="11" fill="#FFFFFF">analyse</text>
<text x="480" y="440" text-anchor="middle" class="sub" fill="#8A5A0E">Kans schat je zelden goed als tester alleen — impact vaak juist wel, met domeinkennis.</text>

</svg>