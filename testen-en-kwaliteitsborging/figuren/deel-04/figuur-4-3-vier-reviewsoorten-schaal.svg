<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" font-family="'DM Sans', Arial, sans-serif" width="1000" height="460" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .mono { font-family: 'Courier New', monospace; }
</style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arramb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#9A5F0D"/></marker>
    </defs>
<rect width="1000" height="460" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 4 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Vier reviewsoorten op een schaal van formaliteit</text>
<text x="40" y="90" class="sub">Meer formaliteit kost meer tijd — geen kwaliteitskeurmerk op zich, maar een keuze.</text>
<line x1="100" y1="300" x2="900" y2="300" class="arrow-b"/>
<line x1="100" y1="300" x2="100" y2="240" stroke="#2563A8" stroke-width="1.5" stroke-dasharray="3 3"/>
<rect x="5" y="160" width="190" height="78" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="100" y="186" class="label" text-anchor="middle" font-size="12.5">Informele review</text>
<text x="100" y="204" class="sub" text-anchor="middle" font-size="10">formaliteit: laag</text>
<text x="100" y="222" class="sub" text-anchor="middle" font-size="9.5">snel, een tweede blik</text>
<line x1="366.66666666666663" y1="300" x2="366.66666666666663" y2="210" stroke="#2563A8" stroke-width="1.5" stroke-dasharray="3 3"/>
<rect x="271.66666666666663" y="130" width="190" height="78" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="366.66666666666663" y="156" class="label" text-anchor="middle" font-size="12.5">Walkthrough</text>
<text x="366.66666666666663" y="174" class="sub" text-anchor="middle" font-size="10">formaliteit: gemiddeld</text>
<text x="366.66666666666663" y="192" class="sub" text-anchor="middle" font-size="9.5">auteur leidt, haalt</text>
<text x="366.66666666666663" y="205" class="sub" text-anchor="middle" font-size="9.5">instemming op</text>
<line x1="633.3333333333333" y1="300" x2="633.3333333333333" y2="180" stroke="#2563A8" stroke-width="1.5" stroke-dasharray="3 3"/>
<rect x="538.3333333333333" y="100" width="190" height="78" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="633.3333333333333" y="126" class="label" text-anchor="middle" font-size="12.5">Technische review</text>
<text x="633.3333333333333" y="144" class="sub" text-anchor="middle" font-size="10">formaliteit: gemiddeld-hoog</text>
<text x="633.3333333333333" y="162" class="sub" text-anchor="middle" font-size="9.5">vakinhoudelijk, door</text>
<text x="633.3333333333333" y="175" class="sub" text-anchor="middle" font-size="9.5">deskundigen</text>
<line x1="900" y1="300" x2="900" y2="150" stroke="#2563A8" stroke-width="1.5" stroke-dasharray="3 3"/>
<rect x="805" y="70" width="190" height="78" rx="8" fill="#2563A8" stroke="#2563A8" stroke-width="1.5"/>
<text x="900" y="96" class="label-light" text-anchor="middle" font-size="12.5">Inspectie</text>
<text x="900" y="114" class="sub-light" text-anchor="middle" font-size="10">formaliteit: hoog</text>
<text x="900" y="132" class="sub-light" text-anchor="middle" font-size="9.5">formele rollen,</text>
<text x="900" y="145" class="sub-light" text-anchor="middle" font-size="9.5">checklists, verslag</text>
<text x="100" y="324" class="sub" font-size="11">laag risico, korte levensduur</text>
<text x="900" y="324" class="sub" text-anchor="end" font-size="11">hoog risico, kritiek document</text>
<text x="500" y="420" text-anchor="middle" class="sub" fill="#9A5F0D">Voor WGP 2.0 was zelfs de lichtste vorm — een informele review — al voldoende geweest.</text>

</svg>