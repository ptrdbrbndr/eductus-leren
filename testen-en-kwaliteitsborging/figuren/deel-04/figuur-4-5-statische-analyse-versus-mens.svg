<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="'DM Sans', Arial, sans-serif" width="960" height="480" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .mono { font-family: 'Courier New', monospace; }
</style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arramb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#9A5F0D"/></marker>
    </defs>
<rect width="960" height="480" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 4 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Statische analyse naast menselijke review</text>
<text x="40" y="90" class="sub">Gereedschap vindt structuur, een mens vindt betekenis — beide nodig, beide vinden iets anders.</text>
<rect x="90" y="150" width="360" height="260" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="270" y="182" class="label" text-anchor="middle" font-size="14">Gereedschap vindt goed</text>
<text x="270" y="214" class="sub" text-anchor="middle" font-size="11.5">patronen</text>
<text x="270" y="236" class="sub" text-anchor="middle" font-size="11.5">ontbrekende volledigheid</text>
<text x="270" y="258" class="sub" text-anchor="middle" font-size="11.5">(gaten in een beslistabel)</text>
<text x="270" y="280" class="sub" text-anchor="middle" font-size="11.5">consistentieregels</text>
<text x="270" y="302" class="sub" text-anchor="middle" font-size="11.5">(ongebruikte variabele)</text>
<rect x="510" y="150" width="360" height="260" rx="8" fill="#2563A8" stroke="#2563A8" stroke-width="1.5"/>
<text x="690" y="182" class="label-light" text-anchor="middle" font-size="14">Een mens vindt goed</text>
<text x="690" y="214" class="sub-light" text-anchor="middle" font-size="11.5">betekenis</text>
<text x="690" y="236" class="sub-light" text-anchor="middle" font-size="11.5">bedoeling</text>
<text x="690" y="258" class="sub-light" text-anchor="middle" font-size="11.5">context</text>
<text x="690" y="280" class="sub-light" text-anchor="middle" font-size="11.5">(twee correcte zinnen die</text>
<text x="690" y="302" class="sub-light" text-anchor="middle" font-size="11.5">elkaar toch tegenspreken)</text>
<text x="480" y="440" text-anchor="middle" class="sub" fill="#9A5F0D">Statische analyse vervangt de menselijke review niet — zij vinden verschillende dingen.</text>

</svg>