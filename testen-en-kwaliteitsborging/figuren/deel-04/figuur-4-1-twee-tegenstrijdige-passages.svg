<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="'DM Sans', Arial, sans-serif" width="960" height="500" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .blue-line { stroke:#1A4F8B; }
      .blue-fill { fill:#C5D8F0; }
      .blue-mid { fill:#8AAFD4; }
      .blue-dark { fill:#1A4F8B; }
      .amber { stroke:#E8A020; }
      .amber-fill { fill:#E8A020; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .sub-light { font-size:12px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#5B6675; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .mono { font-family: 'Courier New', monospace; }
</style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5B6675"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1A4F8B"/></marker>
    <marker id="arramb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8A5A0E"/></marker>
    </defs>
<rect width="960" height="500" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 4 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Twee zinnen, één document, nooit naast elkaar gelegd</text>
<text x="40" y="90" class="sub">Beide correct Nederlands, beide intern consistent — samen spreken ze elkaar tegen.</text>
<rect x="60" y="130" width="400" height="280" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="260" y="162" class="label" text-anchor="middle" font-size="14">Hoofdstuk 4</text>
<text x="260" y="182" class="sub" text-anchor="middle" font-size="10.5">auteur: functioneel ontwerpteam</text>
<rect x="90" y="210" width="340" height="90" rx="8" fill="#F5F4F0" stroke="#5B6675" stroke-width="1"/>
<text x="260" y="236" class="sub" text-anchor="middle" font-size="11.5">"Een deeltijdwijziging gaat in per</text>
<text x="260" y="254" class="sub" text-anchor="middle" font-size="11.5">de eerste van de eerstvolgende maand."</text>
<text x="260" y="380" class="sub" text-anchor="middle" font-size="10.5">geschreven bij aanvang, portaalperspectief</text>
<rect x="500" y="130" width="400" height="280" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="700" y="162" class="label" text-anchor="middle" font-size="14">Bijlage B</text>
<text x="700" y="182" class="sub" text-anchor="middle" font-size="10.5">auteur: koppelvlakteam kernadministratie</text>
<rect x="530" y="210" width="340" height="90" rx="8" fill="#F5F4F0" stroke="#5B6675" stroke-width="1"/>
<text x="700" y="232" class="sub" text-anchor="middle" font-size="11.5">"Wijzigingen binnen de lopende maand</text>
<text x="700" y="249" class="sub" text-anchor="middle" font-size="11.5">worden met terugwerkende kracht</text>
<text x="700" y="266" class="sub" text-anchor="middle" font-size="11.5">verwerkt vanaf de ingangsdatum."</text>
<text x="700" y="380" class="sub" text-anchor="middle" font-size="10.5">later toegevoegd, kernadministratie-perspectief</text>
<path d="M460 260 L500 260" class="arrow"/>
<circle cx="480" cy="260" r="22" fill="#E8A020"/>
<text x="480" y="265" class="label" text-anchor="middle" font-size="16" fill="#FFFFFF">≠</text>
<text x="480" y="460" text-anchor="middle" class="sub" fill="#8A5A0E">Nooit als geheel gelezen met de vraag: spreekt dit zichzelf tegen?</text>

</svg>