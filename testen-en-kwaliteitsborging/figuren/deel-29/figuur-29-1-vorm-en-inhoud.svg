<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'DM Sans', Arial, sans-serif" width="960" height="560" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:11.5px; fill:#5B6675; }
      .sub-light { font-size:11.5px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
    </style>
</defs>
<rect width="960" height="560" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 29 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Vorm mag aansluiten, inhoud mag nooit verschuiven</text>
<text x="40" y="96" class="sub">"Positiever brengen" is een verzoek dat de grens tussen beide overschrijdt.</text>

<!-- left: vorm -->
<rect x="70" y="140" width="380" height="330" rx="10" fill="#C5D8F0" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="260" y="176" text-anchor="middle" class="label" font-size="16">VORM</text>
<text x="260" y="198" text-anchor="middle" class="sub" font-size="11">mag aansluiten bij het publiek</text>
<rect x="100" y="220" width="320" height="42" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1"/>
<text x="116" y="246" class="sub" font-size="11.5">toonzetting</text>
<rect x="100" y="272" width="320" height="42" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1"/>
<text x="116" y="298" class="sub" font-size="11.5">structuur van het rapport</text>
<rect x="100" y="324" width="320" height="42" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1"/>
<text x="116" y="350" class="sub" font-size="11.5">volgorde waarin dingen worden gebracht</text>

<!-- right: inhoud -->
<rect x="510" y="140" width="380" height="330" rx="10" fill="#1A4F8B" stroke="#E8A020" stroke-width="3"/>
<text x="700" y="176" text-anchor="middle" class="label-light" font-size="16">INHOUD</text>
<text x="700" y="198" text-anchor="middle" class="sub-light" font-size="11">mag nooit verschuiven onder druk</text>
<rect x="540" y="220" width="320" height="42" rx="6" fill="#0D1B2A" opacity="0.25"/>
<text x="556" y="246" class="sub-light" font-size="11.5">de feiten</text>
<rect x="540" y="272" width="320" height="42" rx="6" fill="#0D1B2A" opacity="0.25"/>
<text x="556" y="298" class="sub-light" font-size="11.5">de plaatsing op de ladder van zekerheid</text>

<!-- crossing arrow marked as violation -->
<line x1="450" y1="405" x2="510" y2="405" stroke="#E8A020" stroke-width="3"/>
<circle cx="480" cy="405" r="5" fill="#E8A020"/>
<rect x="330" y="420" width="300" height="56" rx="6" fill="#F5F4F0" stroke="#E8A020" stroke-width="2"/>
<text x="480" y="442" text-anchor="middle" class="sub" font-size="11" fill="#8A5A0E">"kun je het iets positiever brengen?"</text>
<text x="480" y="460" text-anchor="middle" class="sub" font-size="11" fill="#8A5A0E">— overschrijdt vorm naar inhoud</text>

<text x="480" y="525" text-anchor="middle" class="sub" fill="#8A5A0E">Positiever brengen is een vraag over vorm — tenzij zij eigenlijk vraagt om een andere trede te melden.</text>
</svg>
