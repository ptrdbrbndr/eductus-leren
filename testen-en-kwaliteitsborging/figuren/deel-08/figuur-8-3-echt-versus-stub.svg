<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="'DM Sans', Arial, sans-serif" width="960" height="480" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .blue-line { stroke:#1A4F8B; }
      .blue-fill { fill:#C5D8F0; }
      .blue-mid { fill:#8AAFD4; }
      .blue-dark { fill:#1A4F8B; }
      .amber { stroke:#E8A020; }
      .amber-fill { fill:#E8A020; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .sub-light { font-size:12px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#5B6675; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .mono { font-family: 'Courier New', monospace; }
</style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5B6675"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1A4F8B"/></marker>
    <marker id="arramb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8A5A0E"/></marker>
    </defs>
<rect width="960" height="480" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 8 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Twee testopstellingen</text>
<text x="40" y="90" class="sub">Rechtstreeks tegen de echte kernadministratie, versus tegen een stub.</text>
<rect x="90" y="150" width="360" height="250" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="270" y="182" class="label" text-anchor="middle" font-size="14">Echte kernadministratie</text>
<text x="270" y="214" class="sub" text-anchor="middle" font-size="11.5">traag</text>
<text x="270" y="236" class="sub" text-anchor="middle" font-size="11.5">afhankelijk van planning</text>
<text x="270" y="258" class="sub" text-anchor="middle" font-size="11.5">moeilijk te plannen</text>
<text x="270" y="280" class="sub" text-anchor="middle" font-size="11.5">+ toont echt gedrag</text>
<rect x="510" y="150" width="360" height="250" rx="8" fill="#8AAFD4" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="690" y="182" class="label" text-anchor="middle" font-size="14">Stub</text>
<text x="690" y="214" class="sub" text-anchor="middle" font-size="11.5">snel</text>
<text x="690" y="236" class="sub" text-anchor="middle" font-size="11.5">gecontroleerd</text>
<text x="690" y="258" class="sub" text-anchor="middle" font-size="11.5">herhaalbaar</text>
<text x="690" y="280" class="sub" text-anchor="middle" font-size="11.5">− risico: stub zelf klopt niet</text>
<text x="480" y="440" text-anchor="middle" class="sub" fill="#8A5A0E">Een stub is zo goed als de aanname erachter — die moet zelf ook getoetst worden.</text>

</svg>