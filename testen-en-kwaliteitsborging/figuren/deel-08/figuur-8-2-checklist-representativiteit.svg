<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="'DM Sans', Arial, sans-serif" width="960" height="420" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .mono { font-family: 'Courier New', monospace; }
</style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arramb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#9A5F0D"/></marker>
    </defs>
<rect width="960" height="420" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 8 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Checklist: verhult dit een risico?</text>
<text x="40" y="90" class="sub">Volume, processen, configuratie — steeds dezelfde vraag.</text>
<rect x="90" y="140" width="780" height="70" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<circle cx="130" cy="175" r="16" fill="#2563A8"/>
<text x="130" y="180" class="label-light" text-anchor="middle" font-weight="700" font-size="14">1</text>
<text x="170" y="168" class="label" font-size="14">Volume en schaal</text>
<text x="170" y="190" class="sub" font-size="11.5" fill="#9A5F0D">→ verhult dit een risico dat we wilden testen?</text>
<text x="700" y="175" class="sub" text-anchor="middle" font-size="10.5">treedt het gedrag</text>
<text x="700" y="189" class="sub" text-anchor="middle" font-size="10.5">pas bij omvang op?</text>
<rect x="90" y="230" width="780" height="70" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<circle cx="130" cy="265" r="16" fill="#2563A8"/>
<text x="130" y="270" class="label-light" text-anchor="middle" font-weight="700" font-size="14">2</text>
<text x="170" y="258" class="label" font-size="14">Ontbrekende processen</text>
<text x="170" y="280" class="sub" font-size="11.5" fill="#9A5F0D">→ verhult dit een risico dat we wilden testen?</text>
<text x="700" y="265" class="sub" text-anchor="middle" font-size="10.5">draait de</text>
<text x="700" y="279" class="sub" text-anchor="middle" font-size="10.5">nachtelijke batch</text>
<text x="700" y="293" class="sub" text-anchor="middle" font-size="10.5">daadwerkelijk?</text>
<rect x="90" y="320" width="780" height="70" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<circle cx="130" cy="355" r="16" fill="#2563A8"/>
<text x="130" y="360" class="label-light" text-anchor="middle" font-weight="700" font-size="14">3</text>
<text x="170" y="348" class="label" font-size="14">Configuratieverschillen</text>
<text x="170" y="370" class="sub" font-size="11.5" fill="#9A5F0D">→ verhult dit een risico dat we wilden testen?</text>
<text x="700" y="355" class="sub" text-anchor="middle" font-size="10.5">wijken instellingen</text>
<text x="700" y="369" class="sub" text-anchor="middle" font-size="10.5">of versies af van</text>
<text x="700" y="383" class="sub" text-anchor="middle" font-size="10.5">productie?</text>
<text x="480" y="400" text-anchor="middle" class="sub" fill="#9A5F0D">Niet "is het identiek?" — de vraag is of het verschil een bedoeld risico verhult.</text>

</svg>