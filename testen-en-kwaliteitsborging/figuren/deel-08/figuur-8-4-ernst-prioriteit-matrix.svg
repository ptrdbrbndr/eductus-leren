<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'DM Sans', Arial, sans-serif" width="960" height="560" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .blue-line { stroke:#1A4F8B; }
      .blue-fill { fill:#C5D8F0; }
      .blue-mid { fill:#8AAFD4; }
      .blue-dark { fill:#1A4F8B; }
      .amber { stroke:#E8A020; }
      .amber-fill { fill:#E8A020; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .sub-light { font-size:12px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#5B6675; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .mono { font-family: 'Courier New', monospace; }
</style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5B6675"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1A4F8B"/></marker>
    <marker id="arramb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8A5A0E"/></marker>
    </defs>
<rect width="960" height="560" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 8 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Ernst tegen prioriteit</text>
<text x="40" y="90" class="sub">Twee onafhankelijke assen — met voorbeelden uit de Meridiaan-casus in elk kwadrant.</text>
<rect x="220" y="150" width="276" height="166" rx="4" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="360" y="180" class="label" text-anchor="middle" font-size="12">Hoge ernst, lage</text>
<text x="360" y="196" class="label" text-anchor="middle" font-size="12">prioriteit</text>
<text x="360" y="228" class="sub" text-anchor="middle" font-size="10.5" font-style="italic">crash bij zelden gebruikt</text>
<text x="360" y="242" class="sub" text-anchor="middle" font-size="10.5" font-style="italic">randgeval</text>
<rect x="500" y="150" width="276" height="166" rx="4" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="640" y="180" class="label" text-anchor="middle" font-size="12">Hoge ernst, hoge</text>
<text x="640" y="196" class="label" text-anchor="middle" font-size="12">prioriteit</text>
<text x="640" y="228" class="sub" text-anchor="middle" font-size="10.5" font-style="italic">foutafhandeling ontbreekt</text>
<text x="640" y="242" class="sub" text-anchor="middle" font-size="10.5" font-style="italic">bij TWK-mutatie</text>
<rect x="220" y="320" width="276" height="166" rx="4" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="360" y="350" class="label" text-anchor="middle" font-size="12">Lage ernst, lage</text>
<text x="360" y="366" class="label" text-anchor="middle" font-size="12">prioriteit</text>
<text x="360" y="398" class="sub" text-anchor="middle" font-size="10.5" font-style="italic">tekstuele inconsistentie</text>
<text x="360" y="412" class="sub" text-anchor="middle" font-size="10.5" font-style="italic">in tooltip</text>
<rect x="500" y="320" width="276" height="166" rx="4" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="640" y="350" class="label" text-anchor="middle" font-size="12">Lage ernst, hoge</text>
<text x="640" y="366" class="label" text-anchor="middle" font-size="12">prioriteit</text>
<text x="640" y="398" class="sub" text-anchor="middle" font-size="10.5" font-style="italic">verkeerd knoplabel vlak</text>
<text x="640" y="412" class="sub" text-anchor="middle" font-size="10.5" font-style="italic">vóór demo</text>
<path d="M220 490 L800 490" class="arrow-b"/>
<path d="M220 490 L220 130" class="arrow-b"/>
<text x="500" y="530" class="label" text-anchor="middle" font-size="13">prioriteit (bedrijfsmatig) →</text>
<text x="180" y="320" class="label" text-anchor="middle" font-size="13" transform="rotate(-90 180 320)">ernst (technisch) →</text>
<text x="480" y="530" text-anchor="middle" class="sub" fill="#8A5A0E">Bij WGP 2.0 waren alle zes bevindingen "prioriteit laag" — zonder ernst apart vast te stellen.</text>

</svg>