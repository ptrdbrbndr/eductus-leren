<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .blue-line { stroke:#1A4F8B; }
      .blue-dark { fill:#1A4F8B; }
      .label { font-size:12.5px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:12.5px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:10.5px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:26px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
    </style>
</defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 22 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Vier rolkaarten, elk met drie voorbeeldvragen</text>
<text x="40" y="92" class="sub">Vier rollen bevragen vanuit vier verschillende risico's.</text>

<!-- card 1: Programmamanager -->
<g>
<rect x="50" y="130" width="205" height="330" rx="10" fill="#FFFFFF" class="blue-line" stroke-width="1.5"/>
<rect x="50" y="130" width="205" height="46" rx="10" class="blue-dark"/>
<text x="152" y="159" text-anchor="middle" class="label-light" font-size="12">PROGRAMMAMANAGER</text>
<text x="152" y="192" text-anchor="middle" class="sub" font-style="italic">Frank Duiker-achtig</text>
<text x="70" y="222" class="sub" font-weight="700">vanuit tijd en budget</text>
<text x="70" y="250" class="sub">"Waarom kost dit</text>
<text x="70" y="264" class="sub">zoveel?"</text>
<text x="70" y="290" class="sub">"Wat is de kortste</text>
<text x="70" y="304" class="sub">weg naar een</text>
<text x="70" y="318" class="sub">verantwoorde livegang?"</text>
<text x="70" y="344" class="sub">"Wat als we een</text>
<text x="70" y="358" class="sub">week later gaan?"</text>
</g>

<!-- card 2: Architect -->
<g>
<rect x="270" y="130" width="205" height="330" rx="10" fill="#FFFFFF" class="blue-line" stroke-width="1.5"/>
<rect x="270" y="130" width="205" height="46" rx="10" class="blue-dark"/>
<text x="372" y="159" text-anchor="middle" class="label-light" font-size="12">ARCHITECT</text>
<text x="372" y="192" text-anchor="middle" class="sub" font-style="italic">technische samenhang</text>
<text x="290" y="222" class="sub" font-weight="700">vanuit onderhoudbaarheid</text>
<text x="290" y="250" class="sub">"Is de automatiserings-</text>
<text x="290" y="264" class="sub">architectuur onderhoudbaar?"</text>
<text x="290" y="290" class="sub">"Past de pijplijnfasering</text>
<text x="290" y="304" class="sub">bij de rest van het</text>
<text x="290" y="318" class="sub">landschap?"</text>
<text x="290" y="344" class="sub">"Waar zit de technische</text>
<text x="290" y="358" class="sub">schuld?"</text>
</g>

<!-- card 3: Beheerorganisatie -->
<g>
<rect x="490" y="130" width="205" height="330" rx="10" fill="#FFFFFF" class="blue-line" stroke-width="1.5"/>
<rect x="490" y="130" width="205" height="46" rx="10" class="blue-dark"/>
<text x="592" y="152" text-anchor="middle" class="label-light" font-size="11">BEHEERORGANISATIE</text>
<text x="592" y="192" text-anchor="middle" class="sub" font-style="italic">Astrid Poelman-achtig</text>
<text x="510" y="222" class="sub" font-weight="700">vanuit exploitatie</text>
<text x="510" y="250" class="sub">"Is dit straks te</text>
<text x="510" y="264" class="sub">draaien?"</text>
<text x="510" y="290" class="sub">"Herstellen we bij</text>
<text x="510" y="304" class="sub">een storing zonder</text>
<text x="510" y="318" class="sub">mutaties te verliezen?"</text>
<text x="510" y="344" class="sub">"Wie draait de nacht-</text>
<text x="510" y="358" class="sub">elijke batch straks?"</text>
</g>

<!-- card 4: Ketenpartner -->
<g>
<rect x="710" y="130" width="205" height="330" rx="10" fill="#FFFFFF" class="blue-line" stroke-width="1.5"/>
<rect x="710" y="130" width="205" height="46" rx="10" class="blue-dark"/>
<text x="812" y="159" text-anchor="middle" class="label-light" font-size="12">KETENPARTNER</text>
<text x="812" y="192" text-anchor="middle" class="sub" font-style="italic">Ruben Sanders-achtig</text>
<text x="730" y="222" class="sub" font-weight="700">vanuit de externe kant</text>
<text x="730" y="250" class="sub">"Is de ketentestregie</text>
<text x="730" y="264" class="sub">realistisch?"</text>
<text x="730" y="290" class="sub">"Wie is eigenaar van</text>
<text x="730" y="304" class="sub">een grensbevinding?"</text>
<text x="730" y="330" class="sub">"Houdt het contract</text>
<text x="730" y="344" class="sub">stand bij een gewijzigd</text>
<text x="730" y="358" class="sub">bericht?"</text>
</g>

<rect x="130" y="500" width="700" height="60" rx="8" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>
<text x="480" y="524" text-anchor="middle" class="sub" fill="#8A5A0E">Een aanpak die voor alle vier hetzelfde antwoord geeft, heeft niet echt</text>
<text x="480" y="542" text-anchor="middle" class="sub" fill="#8A5A0E">vanuit hun perspectief gedacht — zij heeft één antwoord vier keer herhaald</text>
</svg>
