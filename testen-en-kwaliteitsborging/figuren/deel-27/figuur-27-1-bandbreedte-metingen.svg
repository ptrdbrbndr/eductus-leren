<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'DM Sans', Arial, sans-serif" width="960" height="560" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:13px; font-weight:700; fill:#0D1B2A; }
      .sub { font-size:11.5px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .axis { stroke:#5B6675; stroke-width:1.2; }
      .dot { fill:#1A4F8B; }
    </style>
</defs>
<rect width="960" height="560" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 27 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Niet-determinisme testen — bandbreedte in plaats van exact resultaat</text>
<text x="40" y="96" class="sub">Herhaalde metingen van dezelfde invoer, met een grens tussen "aanvaardbaar" en "zorgwekkend".</text>

<line x1="110" y1="140" x2="110" y2="440" class="axis"/>
<line x1="110" y1="440" x2="890" y2="440" class="axis"/>
<text x="70" y="145" class="sub" font-size="11">hoog</text>
<text x="70" y="440" class="sub" font-size="11">laag</text>
<text x="480" y="480" text-anchor="middle" class="sub">herhaalde meting van dezelfde invoer, in de tijd →</text>
<text x="40" y="290" class="sub" transform="rotate(-90 40 290)" text-anchor="middle">risicoscore</text>

<!-- acceptable band -->
<rect x="110" y="240" width="780" height="110" fill="#C5D8F0" opacity="0.55"/>
<text x="900" y="235" text-anchor="end" class="sub" font-size="11" fill="#1A4F8B">aanvaardbare bandbreedte</text>

<!-- threshold line -->
<line x1="110" y1="240" x2="890" y2="240" stroke="#E8A020" stroke-width="2" stroke-dasharray="6,4"/>
<text x="900" y="243" text-anchor="end" class="sub" font-size="10.5" fill="#8A5A0E">grens "zorgwekkend"</text>

<!-- scatter points -->
<circle cx="160" cy="300" r="7" class="dot"/>
<circle cx="220" cy="285" r="7" class="dot"/>
<circle cx="280" cy="310" r="7" class="dot"/>
<circle cx="340" cy="295" r="7" class="dot"/>
<circle cx="400" cy="270" r="7" class="dot"/>
<circle cx="460" cy="320" r="7" class="dot"/>
<circle cx="520" cy="255" r="7" class="dot"/>
<circle cx="580" cy="300" r="7" class="dot"/>
<circle cx="640" cy="330" r="7" class="dot"/>
<circle cx="700" cy="285" r="7" class="dot"/>
<circle cx="760" cy="215" r="8" fill="#E8A020" stroke="#8A5A0E" stroke-width="1.5"/>
<circle cx="820" cy="305" r="7" class="dot"/>

<rect x="700" y="150" width="180" height="50" rx="6" fill="#F5F4F0" stroke="#E8A020" stroke-width="2"/>
<text x="716" y="172" class="sub" font-size="10.5" fill="#8A5A0E">één meting buiten de band —</text>
<text x="716" y="188" class="sub" font-size="10.5" fill="#8A5A0E">is dit toeval of instabiliteit?</text>

<text x="480" y="530" text-anchor="middle" class="sub" fill="#8A5A0E">Niet "geeft dit exact resultaat X", maar "valt dit consistent binnen X ± Y, en is de variatie zelf stabiel over tijd?"</text>
</svg>
