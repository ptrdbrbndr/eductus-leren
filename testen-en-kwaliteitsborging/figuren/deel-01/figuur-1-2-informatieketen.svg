<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="'DM Sans', Arial, sans-serif" width="960" height="480" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .mono { font-family: 'Courier New', monospace; }
</style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arramb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#9A5F0D"/></marker>
    </defs>
<rect width="960" height="480" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 1 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Testen als informatieketen</text>
<text x="40" y="90" class="sub">Waarneming → bevinding → informatie → besluit — bij elke pijl gaat iets verloren.</text>
<rect x="55" y="190" width="190" height="110" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="150" y="234" class="label" text-anchor="middle" font-size="15">Waarneming</text>
<text x="150" y="260" class="sub" text-anchor="middle" font-size="11">wat de tester ziet gebeuren</text>
<path d="M245 245 L279 245" class="arrow-b"/>
<rect x="285" y="190" width="190" height="110" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="380" y="234" class="label" text-anchor="middle" font-size="15">Bevinding</text>
<text x="380" y="260" class="sub" text-anchor="middle" font-size="11">wat daarvan is vastgelegd</text>
<path d="M475 245 L509 245" class="arrow-b"/>
<rect x="515" y="190" width="190" height="110" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="610" y="234" class="label" text-anchor="middle" font-size="15">Informatie</text>
<text x="610" y="260" class="sub" text-anchor="middle" font-size="11">wat daarvan de lezer bereikt</text>
<path d="M705 245 L739 245" class="arrow-b"/>
<rect x="745" y="190" width="190" height="110" rx="8" fill="#2563A8" stroke="#2563A8" stroke-width="0"/>
<text x="840" y="234" class="label-light" text-anchor="middle" font-size="15">Besluit</text>
<text x="840" y="260" class="sub-light" text-anchor="middle" font-size="11">wat een ander ermee doet</text>
<text x="400" y="340" class="sub" text-anchor="middle">tester verantwoordelijk voor de eerste drie schakels</text>
<text x="820" y="340" class="sub" text-anchor="middle">de vierde schakel is niet aan de tester</text>
<text x="480" y="420" text-anchor="middle" class="sub" fill="#9A5F0D">De tester zorgt dat wie besluit, weet wat hij niet weet — hij neemt het besluit niet zelf.</text>

</svg>