<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" font-family="'DM Sans', Arial, sans-serif" width="1000" height="520" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .mono { font-family: 'Courier New', monospace; }
</style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arramb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#9A5F0D"/></marker>
    </defs>
<rect width="1000" height="520" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 1 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Oorzaak → afwijking → gevolg, met vier doorbraakmomenten</text>
<text x="40" y="90" class="sub">Bij WGP 2.0: twee lezingen van "ingangsdatum" — vier momenten waarop de keten had kunnen breken.</text>
<rect x="60" y="230" width="260" height="120" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="190" y="264" class="label" text-anchor="middle" font-size="15">Oorzaak</text>
<text x="190" y="290" class="sub" text-anchor="middle">twee mensen lezen "ingangsdatum"</text>
<text x="190" y="308" class="sub" text-anchor="middle">verschillend</text>
<path d="M320 290 L374 290" class="arrow-b"/>
<rect x="380" y="230" width="260" height="120" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="510" y="264" class="label" text-anchor="middle" font-size="15">Afwijking</text>
<text x="510" y="290" class="sub" text-anchor="middle">FO hoofdstuk 4 spreekt bijlage B</text>
<text x="510" y="308" class="sub" text-anchor="middle">tegen</text>
<path d="M640 290 L694 290" class="arrow-b"/>
<rect x="700" y="230" width="260" height="120" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="830" y="264" class="label" text-anchor="middle" font-size="15">Gevolg</text>
<text x="830" y="290" class="sub" text-anchor="middle">mutaties geaccepteerd, nooit</text>
<text x="830" y="308" class="sub" text-anchor="middle">verwerkt — zonder melding</text>
<line x1="190" y1="148" x2="190" y2="222" stroke="#E9A13B" stroke-width="2" stroke-dasharray="4 3"/>
<circle cx="190" cy="136" r="12" fill="#E9A13B"/>
<text x="190" y="141" class="label" text-anchor="middle" font-size="12" fill="#FFFFFF">✕</text>
<text x="190" y="168" class="sub" text-anchor="middle" font-size="11" fill="#9A5F0D">review</text>
<line x1="350" y1="148" x2="350" y2="222" stroke="#E9A13B" stroke-width="2" stroke-dasharray="4 3"/>
<circle cx="350" cy="136" r="12" fill="#E9A13B"/>
<text x="350" y="141" class="label" text-anchor="middle" font-size="12" fill="#FFFFFF">✕</text>
<text x="350" y="168" class="sub" text-anchor="middle" font-size="11" fill="#9A5F0D">testontwerp</text>
<line x1="510" y1="148" x2="510" y2="222" stroke="#E9A13B" stroke-width="2" stroke-dasharray="4 3"/>
<circle cx="510" cy="136" r="12" fill="#E9A13B"/>
<text x="510" y="141" class="label" text-anchor="middle" font-size="12" fill="#FFFFFF">✕</text>
<text x="510" y="168" class="sub" text-anchor="middle" font-size="11" fill="#9A5F0D">testdata</text>
<line x1="670" y1="148" x2="670" y2="222" stroke="#E9A13B" stroke-width="2" stroke-dasharray="4 3"/>
<circle cx="670" cy="136" r="12" fill="#E9A13B"/>
<text x="670" y="141" class="label" text-anchor="middle" font-size="12" fill="#FFFFFF">✕</text>
<text x="670" y="168" class="sub" text-anchor="middle" font-size="11" fill="#9A5F0D">ketentest</text>
<text x="500" y="480" text-anchor="middle" class="sub" fill="#9A5F0D">De afwijking ontstond in een document, veertien maanden vóór livegang — niet in code.</text>

</svg>