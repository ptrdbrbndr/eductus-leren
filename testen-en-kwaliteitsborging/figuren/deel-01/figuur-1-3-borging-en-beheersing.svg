<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'DM Sans', Arial, sans-serif" width="960" height="560" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .blue-line { stroke:#1A4F8B; }
      .blue-fill { fill:#C5D8F0; }
      .blue-mid { fill:#8AAFD4; }
      .blue-dark { fill:#1A4F8B; }
      .amber { stroke:#E8A020; }
      .amber-fill { fill:#E8A020; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .sub-light { font-size:12px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#5B6675; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .mono { font-family: 'Courier New', monospace; }
</style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5B6675"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1A4F8B"/></marker>
    <marker id="arramb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8A5A0E"/></marker>
    </defs>
<rect width="960" height="560" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 1 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Kwaliteitsborging en kwaliteitsbeheersing</text>
<text x="40" y="90" class="sub">Testen is onderdeel van beheersing (product), en voedt de borging (proces) met informatie.</text>
<rect x="60" y="120" width="840" height="380" rx="8" fill="#F0EDE4" stroke="#5B6675" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="480" y="150" class="label" text-anchor="middle" font-size="15">Kwaliteitsmanagement</text>
<rect x="100" y="180" width="340" height="280" rx="8" fill="#8AAFD4" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="270" y="212" class="label-light" text-anchor="middle" font-size="15">Kwaliteitsborging</text>
<text x="270" y="232" class="sub-light" text-anchor="middle">(proces)</text>
<text x="130" y="264" class="sub-light">werkafspraken</text>
<text x="130" y="286" class="sub-light">reviewpraktijken</text>
<text x="130" y="308" class="sub-light">definition of done</text>
<text x="130" y="330" class="sub-light">opleiding, retrospectives</text>
<rect x="520" y="180" width="340" height="280" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="690" y="212" class="label" text-anchor="middle" font-size="15">Kwaliteitsbeheersing</text>
<text x="690" y="232" class="sub" text-anchor="middle">(product)</text>
<rect x="550" y="254" width="280" height="90" rx="8" fill="#1A4F8B" stroke="#E8A020" stroke-width="2.5"/>
<text x="690" y="288" class="label-light" text-anchor="middle" font-size="15">Testen</text>
<text x="690" y="310" class="sub-light" text-anchor="middle" font-size="11">stelt vast: is dit product goed genoeg?</text>
<rect x="550" y="360" width="280" height="70" rx="8" fill="#F5F4F0" stroke="#1A4F8B" stroke-width="1"/>
<text x="690" y="388" class="sub" text-anchor="middle">overige beheersingsactiviteiten</text>
<text x="690" y="406" class="sub" text-anchor="middle" font-size="10">(inspecties, keuringen, controles)</text>
<path d="M550 300 C 460 300, 460 260, 442 240" class="arrow-b"/>
<text x="495" y="260" class="sub" text-anchor="middle" font-size="10" fill="#1A4F8B">informatie die</text>
<text x="495" y="273" class="sub" text-anchor="middle" font-size="10" fill="#1A4F8B">de borging bijstelt</text>
<text x="480" y="528" text-anchor="middle" class="sub" fill="#8A5A0E">Bij WGP 2.0 was er beheersing (er is getest) en vrijwel geen borging (niets leerde ervan).</text>

</svg>