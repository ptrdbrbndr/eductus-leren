<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" font-family="'DM Sans', Arial, sans-serif" width="1000" height="660" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .blue-line { stroke:#1A4F8B; }
      .blue-fill { fill:#C5D8F0; }
      .blue-mid { fill:#8AAFD4; }
      .blue-dark { fill:#1A4F8B; }
      .amber { stroke:#E8A020; }
      .amber-fill { fill:#E8A020; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .sub-light { font-size:12px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#5B6675; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .mono { font-family: 'Courier New', monospace; }
</style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5B6675"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1A4F8B"/></marker>
    <marker id="arramb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8A5A0E"/></marker>
    </defs>
<rect width="1000" height="660" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 1 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">De zeven testprincipes en de denkfout die elk corrigeert</text>
<text x="70" y="104" class="sub" font-size="11">principe</text>
<text x="230" y="104" class="sub" font-size="11">uitspraak</text>
<text x="660" y="104" class="sub" font-size="11">denkfout die het corrigeert</text>
<line x1="60" y1="116" x2="940" y2="116" stroke="#5B6675" stroke-width="1"/>
<circle cx="80" cy="140" r="14" fill="#1A4F8B"/>
<text x="80" y="145" class="label-light" text-anchor="middle" font-weight="700" font-size="14">1</text>
<text x="230" y="130" class="label" font-size="12.5">Testen toont aanwezigheid van afwijkingen aan,</text>
<text x="230" y="146" class="label" font-size="12.5">niet afwezigheid</text>
<rect x="650" y="118" width="300" height="50" rx="6" fill="#F5F4F0" stroke="#E8A020" stroke-width="1.5"/>
<text x="662" y="134" class="sub" font-size="11" fill="#8A5A0E">"98,1% geslaagd" verward met "98,1% goed"</text>
<line x1="60" y1="182" x2="940" y2="182" stroke="#E4E1D8" stroke-width="1"/>
<circle cx="80" cy="206" r="14" fill="#1A4F8B"/>
<text x="80" y="211" class="label-light" text-anchor="middle" font-weight="700" font-size="14">2</text>
<text x="230" y="196" class="label" font-size="12.5">Uitputtend testen is onmogelijk</text>
<rect x="650" y="184" width="300" height="50" rx="6" fill="#F5F4F0" stroke="#E8A020" stroke-width="1.5"/>
<text x="662" y="200" class="sub" font-size="11" fill="#8A5A0E">denken dat "alles testen" een optie is</text>
<line x1="60" y1="248" x2="940" y2="248" stroke="#E4E1D8" stroke-width="1"/>
<circle cx="80" cy="272" r="14" fill="#1A4F8B"/>
<text x="80" y="277" class="label-light" text-anchor="middle" font-weight="700" font-size="14">3</text>
<text x="230" y="262" class="label" font-size="12.5">Vroeg testen bespaart tijd en geld</text>
<rect x="650" y="250" width="300" height="50" rx="6" fill="#F5F4F0" stroke="#E8A020" stroke-width="1.5"/>
<text x="662" y="266" class="sub" font-size="11" fill="#8A5A0E">testen laten wachten tot de bouw af is</text>
<line x1="60" y1="314" x2="940" y2="314" stroke="#E4E1D8" stroke-width="1"/>
<circle cx="80" cy="338" r="14" fill="#1A4F8B"/>
<text x="80" y="343" class="label-light" text-anchor="middle" font-weight="700" font-size="14">4</text>
<text x="230" y="328" class="label" font-size="12.5">Afwijkingen clusteren</text>
<rect x="650" y="316" width="300" height="50" rx="6" fill="#F5F4F0" stroke="#E8A020" stroke-width="1.5"/>
<text x="662" y="332" class="sub" font-size="11" fill="#8A5A0E">gelijke aandacht overal, in plaats van</text>
<text x="662" y="347" class="sub" font-size="11" fill="#8A5A0E">waar het vaak misgaat</text>
<line x1="60" y1="380" x2="940" y2="380" stroke="#E4E1D8" stroke-width="1"/>
<circle cx="80" cy="404" r="14" fill="#1A4F8B"/>
<text x="80" y="409" class="label-light" text-anchor="middle" font-weight="700" font-size="14">5</text>
<text x="230" y="394" class="label" font-size="12.5">Tests slijten</text>
<rect x="650" y="382" width="300" height="50" rx="6" fill="#F5F4F0" stroke="#E8A020" stroke-width="1.5"/>
<text x="662" y="398" class="sub" font-size="11" fill="#8A5A0E">dezelfde testset jarenlang herhalen zonder</text>
<text x="662" y="413" class="sub" font-size="11" fill="#8A5A0E">herziening</text>
<line x1="60" y1="446" x2="940" y2="446" stroke="#E4E1D8" stroke-width="1"/>
<circle cx="80" cy="470" r="14" fill="#1A4F8B"/>
<text x="80" y="475" class="label-light" text-anchor="middle" font-weight="700" font-size="14">6</text>
<text x="230" y="460" class="label" font-size="12.5">Testen is contextafhankelijk</text>
<rect x="650" y="448" width="300" height="50" rx="6" fill="#F5F4F0" stroke="#E8A020" stroke-width="1.5"/>
<text x="662" y="464" class="sub" font-size="11" fill="#8A5A0E">één testaanpak toepassen op elk systeem</text>
<line x1="60" y1="512" x2="940" y2="512" stroke="#E4E1D8" stroke-width="1"/>
<circle cx="80" cy="536" r="14" fill="#1A4F8B"/>
<text x="80" y="541" class="label-light" text-anchor="middle" font-weight="700" font-size="14">7</text>
<text x="230" y="526" class="label" font-size="12.5">Afwezigheid van fouten is een misvatting</text>
<rect x="650" y="514" width="300" height="50" rx="6" fill="#F5F4F0" stroke="#E8A020" stroke-width="1.5"/>
<text x="662" y="530" class="sub" font-size="11" fill="#8A5A0E">"alle bevindingen opgelost" gelijkstellen</text>
<text x="662" y="545" class="sub" font-size="11" fill="#8A5A0E">aan bruikbaar</text>
<text x="500" y="628" text-anchor="middle" class="sub" fill="#8A5A0E">Geen regels — waarschuwingen tegen denkfouten die stelselmatig terugkeren.</text>

</svg>