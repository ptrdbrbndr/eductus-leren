<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'DM Sans', Arial, sans-serif" width="960" height="640" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .label { font-size:13px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:13px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:11.5px; fill:#5B6675; }
      .sub-light { font-size:11.5px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
    </style>
</defs>
<rect width="960" height="640" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 30 · MASTERPROEF</text>
<text x="40" y="64" class="title">Vier rollen aan de bestuurstafel</text>
<text x="40" y="96" class="sub">Elke rol vertegenwoordigt een andere kernvraag bij de boardsimulatie.</text>

<!-- table -->
<ellipse cx="480" cy="360" rx="260" ry="90" fill="#1A4F8B" stroke="#E8A020" stroke-width="2"/>
<text x="480" y="356" text-anchor="middle" class="label-light" font-size="14">Bestuurstafel</text>
<text x="480" y="376" text-anchor="middle" class="sub-light" font-size="11">de boardsimulatie — 45 minuten</text>

<!-- role card top-left: Bestuurder -->
<rect x="90" y="150" width="330" height="110" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="106" y="176" class="label" font-size="13">Bestuurder</text>
<text x="106" y="198" class="sub" font-size="11">moeten we dit melden, en aan wie,</text>
<text x="106" y="214" class="sub" font-size="11">en wat betekent dit voor het</text>
<text x="106" y="230" class="sub" font-size="11">vertrouwen van deelnemers?</text>

<!-- role card top-right: certificerend actuaris -->
<rect x="540" y="150" width="330" height="110" rx="8" fill="#C5D8F0" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="556" y="176" class="label" font-size="13">Certificerend actuaris</text>
<text x="556" y="198" class="sub" font-size="11">moet mijn eerder afgegeven</text>
<text x="556" y="214" class="sub" font-size="11">verklaring worden heroverwogen</text>
<text x="556" y="230" class="sub" font-size="11">in het licht van deze ontdekking?</text>

<!-- role card bottom-left: toezichthouder -->
<rect x="90" y="440" width="330" height="110" rx="8" fill="#8AAFD4" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="106" y="466" class="label-light" font-size="13">Toezichthouder</text>
<text x="106" y="488" class="sub-light" font-size="11">kan de instelling aantonen wat</text>
<text x="106" y="504" class="sub-light" font-size="11">zij beweert, en op welke manier —</text>
<text x="106" y="520" class="sub-light" font-size="11">precies het instrument uit deel 24?</text>

<!-- role card bottom-right: deelnemersvertegenwoordiger -->
<rect x="540" y="440" width="330" height="110" rx="8" fill="#1A4F8B" stroke="#E8A020" stroke-width="3"/>
<text x="556" y="466" class="label-light" font-size="13">Deelnemersvertegenwoordiger</text>
<text x="556" y="488" class="sub-light" font-size="11">wat betekent dit voor mijn</text>
<text x="556" y="504" class="sub-light" font-size="11">pensioen, in gewone taal —</text>
<text x="556" y="520" class="sub-light" font-size="11">lastigst te pareren met jargon</text>

<!-- connecting lines -->
<line x1="260" y1="260" x2="400" y2="310" stroke="#5B6675" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="700" y1="260" x2="560" y2="310" stroke="#5B6675" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="260" y1="440" x2="400" y2="400" stroke="#5B6675" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="700" y1="440" x2="560" y2="400" stroke="#5B6675" stroke-width="1" stroke-dasharray="3,3"/>

<text x="480" y="600" text-anchor="middle" class="sub" fill="#8A5A0E">De helft van de vragen ontvang je vooraf — de andere helft niet, zoals in een daadwerkelijke boardsituatie.</text>
</svg>
