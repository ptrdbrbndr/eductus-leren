<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" font-family="'DM Sans', Arial, sans-serif" width="960" height="660" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .mono { font-family: 'Courier New', monospace; }
</style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arramb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#9A5F0D"/></marker>
    </defs>
<rect width="960" height="660" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 6 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Drie technieken, drie verschillende vondsten</text>
<text x="40" y="90" class="sub">Black-box, white-box en ervaringsgebaseerd — een klein gebied waar alle drie iets vinden.</text>
<circle cx="390" cy="300" r="135" fill="#6FA3D6" opacity="0.65"/>
<circle cx="570" cy="300" r="135" fill="#2563A8" opacity="0.65"/>
<circle cx="480" cy="410" r="135" fill="#E9A13B" opacity="0.55"/>
<text x="310" y="220" class="label" text-anchor="middle" font-size="14">Black-box</text>
<text x="310" y="238" class="sub" text-anchor="middle" font-size="10.5">vanuit gedrag en eisen</text>
<text x="650" y="220" class="label-light" text-anchor="middle" font-size="14">White-box</text>
<text x="650" y="238" class="sub-light" text-anchor="middle" font-size="10.5">vanuit codestructuur</text>
<text x="480" y="500" class="label" text-anchor="middle" font-size="14" fill="#9A5F0D">Ervaringsgebaseerd</text>
<text x="480" y="518" class="sub" text-anchor="middle" font-size="10.5" fill="#9A5F0D">(apostrof, gelijktijdigheid —</text>
<text x="480" y="534" class="sub" text-anchor="middle" font-size="10.5" fill="#9A5F0D">nergens expliciet vermeld)</text>
<text x="480" y="610" text-anchor="middle" class="sub" fill="#9A5F0D">Elke techniek vindt een ander soort blinde vlek — samen vinden ze meer dan één alleen.</text>

</svg>