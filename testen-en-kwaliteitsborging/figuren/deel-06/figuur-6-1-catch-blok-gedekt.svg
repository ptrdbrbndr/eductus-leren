<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'DM Sans', Arial, sans-serif" width="960" height="460" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .mono { font-family: 'Courier New', monospace; }
</style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arramb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#9A5F0D"/></marker>
    </defs>
<rect width="960" height="460" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 6 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Gedekt — maar door wie, met welke intentie?</text>
<text x="40" y="90" class="sub">Het catch-blok stond in het dekkingsrapport als "bereikt". Nooit gericht getest.</text>
<rect x="120" y="130" width="500" height="230" rx="8" fill="#14213D" stroke="#2563A8" stroke-width="1.5"/>
<text x="150" y="168" class="mono" font-size="13" fill="#DFDCD3">try {</text>
<text x="150" y="195" class="mono" font-size="13" fill="#DFDCD3">  verzendMutatie(bericht);</text>
<text x="150" y="222" class="mono" font-size="13" fill="#E9A13B">} catch (fout) {</text>
<text x="150" y="249" class="mono" font-size="13" fill="#E9A13B">  // foutafhandeling</text>
<text x="150" y="276" class="mono" font-size="13" fill="#E9A13B">  logFout(fout);</text>
<text x="150" y="303" class="mono" font-size="13" fill="#E9A13B">  meldGebruiker();</text>
<text x="150" y="330" class="mono" font-size="13" fill="#DFDCD3">}</text>
<rect x="230" y="195" width="320" height="108" rx="4" fill="none" stroke="#E9A13B" stroke-width="2" stroke-dasharray="5 3"/>
<rect x="660" y="150" width="240" height="200" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="780" y="182" class="label" text-anchor="middle" font-size="13">Dekkingsrapport</text>
<text x="780" y="210" class="label" text-anchor="middle" font-size="14" fill="#2563A8">"gedekt" ✓</text>
<text x="780" y="244" class="sub" text-anchor="middle" font-size="11" fill="#9A5F0D">gedekt door welk</text>
<text x="780" y="260" class="sub" text-anchor="middle" font-size="11" fill="#9A5F0D">scenario, met welke</text>
<text x="780" y="276" class="sub" text-anchor="middle" font-size="11" fill="#9A5F0D">intentie?</text>
<path d="M550 260 L660 240" class="arrow-b"/>
<text x="480" y="410" text-anchor="middle" class="sub" fill="#9A5F0D">Een statement kan "bereikt" zijn zonder ooit gericht getest te zijn. Dekking meet aanraking, niet onderzoek.</text>

</svg>