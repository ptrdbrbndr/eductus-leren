<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'DM Sans', Arial, sans-serif" width="960" height="460" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .blue-line { stroke:#1A4F8B; }
      .blue-fill { fill:#C5D8F0; }
      .blue-mid { fill:#8AAFD4; }
      .blue-dark { fill:#1A4F8B; }
      .amber { stroke:#E8A020; }
      .amber-fill { fill:#E8A020; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .sub-light { font-size:12px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#5B6675; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .mono { font-family: 'Courier New', monospace; }
</style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5B6675"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1A4F8B"/></marker>
    <marker id="arramb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8A5A0E"/></marker>
    </defs>
<rect width="960" height="460" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 6 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Gedekt — maar door wie, met welke intentie?</text>
<text x="40" y="90" class="sub">Het catch-blok stond in het dekkingsrapport als "bereikt". Nooit gericht getest.</text>
<rect x="120" y="130" width="500" height="230" rx="8" fill="#0D1B2A" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="150" y="168" class="mono" font-size="13" fill="#E4E1D8">try {</text>
<text x="150" y="195" class="mono" font-size="13" fill="#E4E1D8">  verzendMutatie(bericht);</text>
<text x="150" y="222" class="mono" font-size="13" fill="#E8A020">} catch (fout) {</text>
<text x="150" y="249" class="mono" font-size="13" fill="#E8A020">  // foutafhandeling</text>
<text x="150" y="276" class="mono" font-size="13" fill="#E8A020">  logFout(fout);</text>
<text x="150" y="303" class="mono" font-size="13" fill="#E8A020">  meldGebruiker();</text>
<text x="150" y="330" class="mono" font-size="13" fill="#E4E1D8">}</text>
<rect x="230" y="195" width="320" height="108" rx="4" fill="none" stroke="#E8A020" stroke-width="2" stroke-dasharray="5 3"/>
<rect x="660" y="150" width="240" height="200" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="780" y="182" class="label" text-anchor="middle" font-size="13">Dekkingsrapport</text>
<text x="780" y="210" class="label" text-anchor="middle" font-size="14" fill="#1A4F8B">"gedekt" ✓</text>
<text x="780" y="244" class="sub" text-anchor="middle" font-size="11" fill="#8A5A0E">gedekt door welk</text>
<text x="780" y="260" class="sub" text-anchor="middle" font-size="11" fill="#8A5A0E">scenario, met welke</text>
<text x="780" y="276" class="sub" text-anchor="middle" font-size="11" fill="#8A5A0E">intentie?</text>
<path d="M550 260 L660 240" class="arrow-b"/>
<text x="480" y="410" text-anchor="middle" class="sub" fill="#8A5A0E">Een statement kan "bereikt" zijn zonder ooit gericht getest te zijn. Dekking meet aanraking, niet onderzoek.</text>

</svg>