<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="'DM Sans', Arial, sans-serif" width="960" height="420" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .mono { font-family: 'Courier New', monospace; }
</style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arramb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#9A5F0D"/></marker>
    </defs>
<rect width="960" height="420" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 6 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Statementdekking: 60%</text>
<text x="40" y="90" class="sub">Vijf statements, drie geraakt door de gegeven testset.</text>
<rect x="160" y="140" width="480" height="26" rx="3" fill="#D6E4F2" stroke="none" stroke-width="1.5"/>
<text x="172" y="158" class="mono" font-size="13" fill="#14213D">1  ontvang(mutatie)</text>
<text x="660" y="158" class="sub" font-size="10" fill="#2563A8">geraakt</text>
<rect x="160" y="172" width="480" height="26" rx="3" fill="#D6E4F2" stroke="none" stroke-width="1.5"/>
<text x="172" y="190" class="mono" font-size="13" fill="#14213D">2  valideer(mutatie)</text>
<text x="660" y="190" class="sub" font-size="10" fill="#2563A8">geraakt</text>
<rect x="160" y="204" width="480" height="26" rx="3" fill="#D6E4F2" stroke="none" stroke-width="1.5"/>
<text x="172" y="222" class="mono" font-size="13" fill="#14213D">3  verwerk(mutatie)</text>
<text x="660" y="222" class="sub" font-size="10" fill="#2563A8">geraakt</text>
<rect x="160" y="236" width="480" height="26" rx="3" fill="#FBFAF7" stroke="none" stroke-width="1.5"/>
<text x="172" y="254" class="mono" font-size="13" fill="#55606F">4  logAfwijking(mutatie)</text>
<text x="660" y="254" class="sub" font-size="10" fill="#9A5F0D">niet geraakt</text>
<rect x="160" y="268" width="480" height="26" rx="3" fill="#FBFAF7" stroke="none" stroke-width="1.5"/>
<text x="172" y="286" class="mono" font-size="13" fill="#55606F">5  bevestig(mutatie)</text>
<text x="660" y="286" class="sub" font-size="10" fill="#9A5F0D">niet geraakt</text>
<rect x="160" y="320" width="480" height="30" rx="4" fill="#2563A8" stroke="#2563A8" stroke-width="1.5"/>
<text x="400" y="340" class="label-light" text-anchor="middle" font-size="13">3 van 5 statements geraakt</text>
<text x="480" y="385" text-anchor="middle" class="sub" fill="#9A5F0D">Statementdekking meet alleen of een regel is uitgevoerd, niet met welk resultaat.</text>

</svg>