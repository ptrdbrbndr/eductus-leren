<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'DM Sans', Arial, sans-serif" width="960" height="460" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .mono { font-family: 'Courier New', monospace; }
</style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arramb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#9A5F0D"/></marker>
    </defs>
<rect width="960" height="460" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 6 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">100% statementdekking, de "onwaar"-tak nooit geraakt</text>
<text x="40" y="90" class="sub">Hetzelfde fragment met een if-statement: schijnbaar volledig, feitelijk half.</text>
<rect x="160" y="130" width="480" height="30" rx="4" fill="#FBFAF7" stroke="#2563A8" stroke-width="1.5"/>
<text x="400" y="150" class="mono" font-size="13">if (isPlausibel(mutatie)) {</text>
<rect x="210" y="170" width="400" height="60" rx="4" fill="#D6E4F2" stroke="#2563A8" stroke-width="1.5"/>
<text x="410" y="195" class="mono" font-size="12.5" fill="#14213D">  verwerk(mutatie)  // waar-tak</text>
<text x="410" y="213" class="sub" text-anchor="middle" font-size="10" fill="#2563A8">geraakt</text>
<rect x="160" y="240" width="480" height="30" rx="4" fill="#FBFAF7" stroke="#2563A8" stroke-width="1.5"/>
<text x="400" y="260" class="mono" font-size="13">} else {</text>
<rect x="210" y="280" width="400" height="60" rx="4" fill="#FBFAF7" stroke="#E9A13B" stroke-width="2" stroke-dasharray="4 3"/>
<text x="410" y="305" class="mono" font-size="12.5" fill="#9A5F0D">  blokkeer(mutatie)  // onwaar-tak</text>
<text x="410" y="323" class="sub" text-anchor="middle" font-size="10" fill="#9A5F0D">nooit geraakt</text>
<rect x="160" y="350" width="480" height="30" rx="4" fill="#FBFAF7" stroke="#2563A8" stroke-width="1.5"/>
<text x="400" y="370" class="mono" font-size="13">}</text>
<text x="720" y="200" class="label" text-anchor="middle" font-size="20" fill="#2563A8">100%</text>
<text x="720" y="220" class="sub" text-anchor="middle" font-size="11">statementdekking</text>
<text x="480" y="420" text-anchor="middle" class="sub" fill="#9A5F0D">Beslissingsdekking eist beide takken — vaak precies de foutafhandeling die anders wegvalt.</text>

</svg>