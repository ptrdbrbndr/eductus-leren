<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'DM Sans', Arial, sans-serif" width="960" height="460" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .blue-line { stroke:#1A4F8B; }
      .blue-fill { fill:#C5D8F0; }
      .blue-mid { fill:#8AAFD4; }
      .blue-dark { fill:#1A4F8B; }
      .amber { stroke:#E8A020; }
      .amber-fill { fill:#E8A020; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .sub-light { font-size:12px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#5B6675; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .mono { font-family: 'Courier New', monospace; }
</style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5B6675"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1A4F8B"/></marker>
    <marker id="arramb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8A5A0E"/></marker>
    </defs>
<rect width="960" height="460" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 6 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">100% statementdekking, de "onwaar"-tak nooit geraakt</text>
<text x="40" y="90" class="sub">Hetzelfde fragment met een if-statement: schijnbaar volledig, feitelijk half.</text>
<rect x="160" y="130" width="480" height="30" rx="4" fill="#F5F4F0" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="400" y="150" class="mono" font-size="13">if (isPlausibel(mutatie)) {</text>
<rect x="210" y="170" width="400" height="60" rx="4" fill="#DCE7F4" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="410" y="195" class="mono" font-size="12.5" fill="#0D1B2A">  verwerk(mutatie)  // waar-tak</text>
<text x="410" y="213" class="sub" text-anchor="middle" font-size="10" fill="#1A4F8B">geraakt</text>
<rect x="160" y="240" width="480" height="30" rx="4" fill="#F5F4F0" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="400" y="260" class="mono" font-size="13">} else {</text>
<rect x="210" y="280" width="400" height="60" rx="4" fill="#F5F4F0" stroke="#E8A020" stroke-width="2" stroke-dasharray="4 3"/>
<text x="410" y="305" class="mono" font-size="12.5" fill="#8A5A0E">  blokkeer(mutatie)  // onwaar-tak</text>
<text x="410" y="323" class="sub" text-anchor="middle" font-size="10" fill="#8A5A0E">nooit geraakt</text>
<rect x="160" y="350" width="480" height="30" rx="4" fill="#F5F4F0" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="400" y="370" class="mono" font-size="13">}</text>
<text x="720" y="200" class="label" text-anchor="middle" font-size="20" fill="#1A4F8B">100%</text>
<text x="720" y="220" class="sub" text-anchor="middle" font-size="11">statementdekking</text>
<text x="480" y="420" text-anchor="middle" class="sub" fill="#8A5A0E">Beslissingsdekking eist beide takken — vaak precies de foutafhandeling die anders wegvalt.</text>

</svg>