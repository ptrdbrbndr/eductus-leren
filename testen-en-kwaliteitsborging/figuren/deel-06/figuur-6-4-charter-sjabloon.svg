<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'DM Sans', Arial, sans-serif" width="960" height="560" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .blue-line { stroke:#1A4F8B; }
      .blue-fill { fill:#C5D8F0; }
      .blue-mid { fill:#8AAFD4; }
      .blue-dark { fill:#1A4F8B; }
      .amber { stroke:#E8A020; }
      .amber-fill { fill:#E8A020; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .sub-light { font-size:12px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#5B6675; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .mono { font-family: 'Courier New', monospace; }
</style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5B6675"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1A4F8B"/></marker>
    <marker id="arramb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8A5A0E"/></marker>
    </defs>
<rect width="960" height="560" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 6 · INSTRUMENTSJABLOON</text>
<text x="40" y="64" class="title">Charter-sjabloon voor exploratory testing</text>
<text x="40" y="90" class="sub">Missie, tijdsbox, aandachtsgebieden — en wat expliciet buiten scope valt.</text>
<rect x="80" y="130" width="800" height="380" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="110" y="165" class="label" font-size="14">Missie</text>
<rect x="110" y="177" width="740" height="50" rx="4" fill="#F5F4F0" stroke="#5B6675" stroke-width="1" stroke-dasharray="3 3"/>
<text x="126" y="207" class="sub" font-size="12" font-style="italic">Verken … met het doel … te ontdekken</text>
<text x="110" y="255" class="label" font-size="14">Tijdsbox</text>
<rect x="110" y="267" width="740" height="50" rx="4" fill="#F5F4F0" stroke="#5B6675" stroke-width="1" stroke-dasharray="3 3"/>
<text x="126" y="297" class="sub" font-size="12" font-style="italic">60–90 minuten, vaste starttijd</text>
<text x="110" y="345" class="label" font-size="14">Aandachtsgebieden</text>
<rect x="110" y="357" width="740" height="50" rx="4" fill="#F5F4F0" stroke="#5B6675" stroke-width="1" stroke-dasharray="3 3"/>
<text x="126" y="387" class="sub" font-size="12" font-style="italic">welke functies, koppelvlakken, gebruikersrollen</text>
<text x="110" y="435" class="label" font-size="14">Buiten scope</text>
<rect x="110" y="447" width="740" height="50" rx="4" fill="#F5F4F0" stroke="#5B6675" stroke-width="1" stroke-dasharray="3 3"/>
<text x="126" y="477" class="sub" font-size="12" font-style="italic">wat deze sessie bewust niet onderzoekt</text>
<rect x="80" y="530" width="0" height="0" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="480" y="535" text-anchor="middle" class="sub" fill="#8A5A0E">Afsluitend: wat is gevonden, en welke vervolgsessie verdient het?</text>

</svg>