<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'DM Sans', Arial, sans-serif" width="960" height="560" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .blue-line { stroke:#1A4F8B; }
      .label { font-size:12px; font-weight:700; fill:#0D1B2A; }
      .sub { font-size:10.5px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:26px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
    </style>
</defs>
<rect width="960" height="560" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 19 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Drie testvormen op een tijd-belasting-grafiek</text>
<text x="40" y="92" class="sub">Loadtest, stresstest en soaktest beantwoorden elk een andere vraag.</text>

<!-- axes -->
<line x1="120" y1="440" x2="900" y2="440" stroke="#5B6675" stroke-width="1.5"/>
<line x1="120" y1="440" x2="120" y2="130" stroke="#5B6675" stroke-width="1.5"/>
<text x="510" y="475" text-anchor="middle" class="sub">tijd →</text>
<text x="70" y="285" text-anchor="middle" class="sub" transform="rotate(-90 70 285)">belasting →</text>

<!-- realistic level dashed -->
<line x1="120" y1="330" x2="900" y2="330" stroke="#C9C4B6" stroke-width="1.2" stroke-dasharray="3 4"/>
<text x="895" y="325" text-anchor="end" class="sub" font-size="9.5">verwacht/realistisch niveau</text>

<!-- failure level -->
<line x1="120" y1="170" x2="900" y2="170" stroke="#C9C4B6" stroke-width="1.2" stroke-dasharray="3 4"/>
<text x="895" y="165" text-anchor="end" class="sub" font-size="9.5">systeem faalt / vertraagt sterk</text>

<!-- loadtest: realistic short bump -->
<path d="M160 440 L200 330 L300 330 L340 440" fill="none" stroke="#1A4F8B" stroke-width="3"/>
<text x="250" y="410" text-anchor="middle" class="sub" font-weight="700" fill="#1A4F8B">LOADTEST</text>
<text x="250" y="425" text-anchor="middle" class="sub" font-size="9.5">realistisch, kort</text>

<!-- stresstest: rising to failure -->
<path d="M400 440 Q560 440 640 170" fill="none" stroke="#E8A020" stroke-width="3"/>
<text x="530" y="290" text-anchor="middle" class="sub" font-weight="700" fill="#8A5A0E">STRESSTEST</text>
<text x="530" y="305" text-anchor="middle" class="sub" font-size="9.5">oplopend tot falen</text>

<!-- soaktest: long sustained realistic level -->
<path d="M680 440 L700 330 L880 330 L880 440" fill="none" stroke="#5B6675" stroke-width="3"/>
<text x="790" y="410" text-anchor="middle" class="sub" font-weight="700" fill="#5B6675">SOAKTEST</text>
<text x="790" y="425" text-anchor="middle" class="sub" font-size="9.5">realistisch, lang volgehouden</text>

<rect x="130" y="490" width="700" height="50" rx="8" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>
<text x="480" y="510" text-anchor="middle" class="sub" fill="#8A5A0E">De jaarwerkpiek vraagt om alle drie: verwacht volume, de marge daarboven,</text>
<text x="480" y="528" text-anchor="middle" class="sub" fill="#8A5A0E">en het aanhouden ervan over meerdere uren</text>
</svg>
