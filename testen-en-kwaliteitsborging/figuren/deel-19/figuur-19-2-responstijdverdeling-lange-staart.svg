<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'DM Sans', Arial, sans-serif" width="960" height="560" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .blue-line { stroke:#1A4F8B; }
      .label { font-size:12px; font-weight:700; fill:#0D1B2A; }
      .sub { font-size:10.5px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:26px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
    </style>
</defs>
<rect width="960" height="560" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 19 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Een responstijdverdeling met een lange staart</text>
<text x="40" y="92" class="sub">Het gemiddelde en het 95e-percentiel apart gemarkeerd — het gemiddelde verhult precies wat de staart onthult.</text>

<line x1="120" y1="420" x2="900" y2="420" stroke="#5B6675" stroke-width="1.5"/>
<line x1="120" y1="420" x2="120" y2="150" stroke="#5B6675" stroke-width="1.5"/>
<text x="510" y="455" text-anchor="middle" class="sub">responstijd →</text>
<text x="70" y="285" text-anchor="middle" class="sub" transform="rotate(-90 70 285)">aantal mutaties →</text>

<!-- distribution: right-skewed curve with long tail -->
<path d="M150 420 C 220 420, 250 190, 320 190 C 380 190, 400 300, 450 350 C 550 400, 700 415, 880 419" fill="#C5D8F0" stroke="#1A4F8B" stroke-width="2" opacity="0.85"/>

<!-- gemiddelde marker -->
<line x1="340" y1="150" x2="340" y2="420" stroke="#5B6675" stroke-width="2" stroke-dasharray="5 3"/>
<rect x="255" y="155" width="170" height="34" rx="6" fill="#FFFFFF" stroke="#5B6675" stroke-width="1.3"/>
<text x="340" y="177" text-anchor="middle" class="sub" font-weight="700">gemiddelde ≈ 1,2 s</text>

<!-- 95e percentile marker, in the tail -->
<line x1="650" y1="150" x2="650" y2="420" stroke="#E8A020" stroke-width="2" stroke-dasharray="5 3"/>
<rect x="565" y="155" width="180" height="34" rx="6" fill="#FFFFFF" stroke="#E8A020" stroke-width="1.6"/>
<text x="655" y="177" text-anchor="middle" class="sub" font-weight="700" fill="#8A5A0E">95e-percentiel ≈ 15 s</text>

<text x="780" y="400" class="sub" font-style="italic">de lange staart —</text>
<text x="780" y="415" class="sub" font-style="italic">5% dat vijftien seconden duurt</text>

<rect x="130" y="470" width="700" height="60" rx="8" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>
<text x="480" y="494" text-anchor="middle" class="sub" fill="#8A5A0E">Voor de gebruiker die op dat moment wacht, is dat percentage in de staart</text>
<text x="480" y="512" text-anchor="middle" class="sub" fill="#8A5A0E">het enige dat telt — niet het gemiddelde</text>
</svg>
