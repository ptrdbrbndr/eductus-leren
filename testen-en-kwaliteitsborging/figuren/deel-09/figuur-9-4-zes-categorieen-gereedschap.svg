<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'DM Sans', Arial, sans-serif" width="960" height="560" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .blue-line { stroke:#1A4F8B; }
      .blue-fill { fill:#C5D8F0; }
      .blue-mid { fill:#8AAFD4; }
      .blue-dark { fill:#1A4F8B; }
      .amber { stroke:#E8A020; }
      .amber-fill { fill:#E8A020; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .sub-light { font-size:12px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#5B6675; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .mono { font-family: 'Courier New', monospace; }
</style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5B6675"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1A4F8B"/></marker>
    <marker id="arramb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8A5A0E"/></marker>
    </defs>
<rect width="960" height="560" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 9 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Zes categorieën testgereedschap</text>
<text x="40" y="90" class="sub">Bij elk stuk gereedschap: wat doet dit niet?</text>
<rect x="90" y="150" width="250" height="160" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="215" y="190" class="label" text-anchor="middle" font-size="13.5">Testmanagement</text>
<line x1="120" y1="208" x2="310" y2="208" stroke="#E4E1D8" stroke-width="1"/>
<text x="215" y="240" class="sub" text-anchor="middle" font-size="10.5" fill="#8A5A0E">niet: zelf beslissen wat</text>
<text x="215" y="256" class="sub" text-anchor="middle" font-size="10.5" fill="#8A5A0E">getest moet worden</text>
<rect x="370" y="150" width="250" height="160" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="495" y="190" class="label" text-anchor="middle" font-size="13.5">Bevindingenbeheer</text>
<line x1="400" y1="208" x2="590" y2="208" stroke="#E4E1D8" stroke-width="1"/>
<text x="495" y="240" class="sub" text-anchor="middle" font-size="10.5" fill="#8A5A0E">niet: de kwaliteit van een</text>
<text x="495" y="256" class="sub" text-anchor="middle" font-size="10.5" fill="#8A5A0E">bevinding garanderen</text>
<rect x="650" y="150" width="250" height="160" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="775" y="190" class="label" text-anchor="middle" font-size="13.5">Testautomatisering</text>
<line x1="680" y1="208" x2="870" y2="208" stroke="#E4E1D8" stroke-width="1"/>
<text x="775" y="240" class="sub" text-anchor="middle" font-size="10.5" fill="#8A5A0E">niet: testontwerp</text>
<text x="775" y="256" class="sub" text-anchor="middle" font-size="10.5" fill="#8A5A0E">vervangen</text>
<rect x="90" y="340" width="250" height="160" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="215" y="380" class="label" text-anchor="middle" font-size="13.5">Statische analyse</text>
<line x1="120" y1="398" x2="310" y2="398" stroke="#E4E1D8" stroke-width="1"/>
<text x="215" y="430" class="sub" text-anchor="middle" font-size="10.5" fill="#8A5A0E">niet: betekenisproblemen</text>
<text x="215" y="446" class="sub" text-anchor="middle" font-size="10.5" fill="#8A5A0E">vinden</text>
<rect x="370" y="340" width="250" height="160" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="495" y="380" class="label" text-anchor="middle" font-size="13.5">Prestatiegereedschap</text>
<line x1="400" y1="398" x2="590" y2="398" stroke="#E4E1D8" stroke-width="1"/>
<text x="495" y="430" class="sub" text-anchor="middle" font-size="10.5" fill="#8A5A0E">niet: interpreteren wat</text>
<text x="495" y="446" class="sub" text-anchor="middle" font-size="10.5" fill="#8A5A0E">het betekent voor risico</text>
<rect x="650" y="340" width="250" height="160" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="775" y="380" class="label" text-anchor="middle" font-size="13.5">Testdatabeheer</text>
<line x1="680" y1="398" x2="870" y2="398" stroke="#E4E1D8" stroke-width="1"/>
<text x="775" y="430" class="sub" text-anchor="middle" font-size="10.5" fill="#8A5A0E">niet: bepalen welke</text>
<text x="775" y="446" class="sub" text-anchor="middle" font-size="10.5" fill="#8A5A0E">variatie nodig is</text>
<text x="480" y="530" text-anchor="middle" class="sub" fill="#8A5A0E">Gereedschap versnelt wat al goed doordacht is — het compenseert nooit wat slecht doordacht is.</text>

</svg>