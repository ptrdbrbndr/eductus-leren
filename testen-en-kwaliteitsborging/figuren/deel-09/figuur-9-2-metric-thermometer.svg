<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'DM Sans', Arial, sans-serif" width="960" height="460" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .blue-line { stroke:#1A4F8B; }
      .blue-fill { fill:#C5D8F0; }
      .blue-mid { fill:#8AAFD4; }
      .blue-dark { fill:#1A4F8B; }
      .amber { stroke:#E8A020; }
      .amber-fill { fill:#E8A020; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .sub-light { font-size:12px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#5B6675; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .mono { font-family: 'Courier New', monospace; }
</style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5B6675"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1A4F8B"/></marker>
    <marker id="arramb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#8A5A0E"/></marker>
    </defs>
<rect width="960" height="460" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 9 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Een metric als thermometer</text>
<text x="40" y="90" class="sub">Nuttig om te signaleren — gevaarlijk zodra je de thermometer zelf gaat verwarmen.</text>
<rect x="360" y="150" width="40" height="230" rx="20" fill="#F5F4F0" stroke="#1A4F8B" stroke-width="2"/>
<rect x="366" y="210" width="28" height="164" rx="14" fill="#8AAFD4" stroke="#1A4F8B" stroke-width="1.5"/>
<circle cx="380" cy="390" r="26" fill="#1A4F8B"/>
<text x="380" y="130" class="sub" text-anchor="middle" font-size="12">% geslaagd</text>
<rect x="560" y="170" width="320" height="220" rx="8" fill="#FFFFFF" stroke="#E8A020" stroke-width="2"/>
<text x="720" y="202" class="label" text-anchor="middle" font-size="14" fill="#8A5A0E">Perverse prikkel</text>
<text x="720" y="232" class="sub" text-anchor="middle" font-size="11.5">een lastig testgeval schrappen</text>
<text x="720" y="254" class="sub" text-anchor="middle" font-size="11.5">in plaats van oplossen —</text>
<text x="720" y="276" class="sub" text-anchor="middle" font-size="11.5">zodat het getal blijft kloppen</text>
<path d="M420 260 L560 260" stroke="#E8A020" stroke-width="2" fill="none" marker-end="url(#arramb)"/>
<text x="480" y="420" text-anchor="middle" class="sub" fill="#8A5A0E">Gebruik nooit één metric geïsoleerd — vraag altijd wat zij níet laat zien.</text>

</svg>