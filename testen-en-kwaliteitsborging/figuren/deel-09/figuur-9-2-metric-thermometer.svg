<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'DM Sans', Arial, sans-serif" width="960" height="460" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .mono { font-family: 'Courier New', monospace; }
</style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arramb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#9A5F0D"/></marker>
    </defs>
<rect width="960" height="460" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 9 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Een metric als thermometer</text>
<text x="40" y="90" class="sub">Nuttig om te signaleren — gevaarlijk zodra je de thermometer zelf gaat verwarmen.</text>
<rect x="360" y="150" width="40" height="230" rx="20" fill="#FBFAF7" stroke="#2563A8" stroke-width="2"/>
<rect x="366" y="210" width="28" height="164" rx="14" fill="#6FA3D6" stroke="#2563A8" stroke-width="1.5"/>
<circle cx="380" cy="390" r="26" fill="#2563A8"/>
<text x="380" y="130" class="sub" text-anchor="middle" font-size="12">% geslaagd</text>
<rect x="560" y="170" width="320" height="220" rx="8" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2"/>
<text x="720" y="202" class="label" text-anchor="middle" font-size="14" fill="#9A5F0D">Perverse prikkel</text>
<text x="720" y="232" class="sub" text-anchor="middle" font-size="11.5">een lastig testgeval schrappen</text>
<text x="720" y="254" class="sub" text-anchor="middle" font-size="11.5">in plaats van oplossen —</text>
<text x="720" y="276" class="sub" text-anchor="middle" font-size="11.5">zodat het getal blijft kloppen</text>
<path d="M420 260 L560 260" stroke="#E9A13B" stroke-width="2" fill="none" marker-end="url(#arramb)"/>
<text x="480" y="420" text-anchor="middle" class="sub" fill="#9A5F0D">Gebruik nooit één metric geïsoleerd — vraag altijd wat zij níet laat zien.</text>

</svg>