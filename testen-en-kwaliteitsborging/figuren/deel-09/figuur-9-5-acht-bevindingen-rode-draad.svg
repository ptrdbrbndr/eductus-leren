<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" font-family="'DM Sans', Arial, sans-serif" width="1000" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .mono { font-family: 'Courier New', monospace; }
</style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arramb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#9A5F0D"/></marker>
    </defs>
<rect width="1000" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 9 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Acht bevindingen, één rode draad</text>
<text x="40" y="90" class="sub">In geen van de acht gevallen ontbrak kennis — het ontbrak aan een moment dat haar bindend maakte.</text>
<circle cx="90" cy="140" r="16" fill="#2563A8"/>
<text x="90" y="145" class="label-light" text-anchor="middle" font-weight="700" font-size="14">T1</text>
<text x="140" y="145" class="label" font-size="13">Geen traceerbaarheid</text>
<text x="560" y="145" class="sub" font-size="11.5" fill="#9A5F0D">onzichtbaarheid van wat níet getest is</text>
<line x1="70" y1="166" x2="950" y2="166" stroke="#DFDCD3" stroke-width="1"/>
<circle cx="90" cy="192" r="16" fill="#2563A8"/>
<text x="90" y="197" class="label-light" text-anchor="middle" font-weight="700" font-size="14">T2</text>
<text x="140" y="197" class="label" font-size="13">Dekking niet risicogewogen</text>
<text x="560" y="197" class="sub" font-size="11.5" fill="#9A5F0D">aandacht volgde gemak, niet risico</text>
<line x1="70" y1="218" x2="950" y2="218" stroke="#DFDCD3" stroke-width="1"/>
<circle cx="90" cy="244" r="16" fill="#2563A8"/>
<text x="90" y="249" class="label-light" text-anchor="middle" font-weight="700" font-size="14">T3</text>
<text x="140" y="249" class="label" font-size="13">Verouderde testbasis</text>
<text x="560" y="249" class="sub" font-size="11.5" fill="#9A5F0D">stilzwijgende veroudering, niemands taak</text>
<line x1="70" y1="270" x2="950" y2="270" stroke="#DFDCD3" stroke-width="1"/>
<circle cx="90" cy="296" r="16" fill="#2563A8"/>
<text x="90" y="301" class="label-light" text-anchor="middle" font-weight="700" font-size="14">T4</text>
<text x="140" y="301" class="label" font-size="13">Geen statische toetsing</text>
<text x="560" y="301" class="sub" font-size="11.5" fill="#9A5F0D">de goedkoopste vindplaats overgeslagen</text>
<line x1="70" y1="322" x2="950" y2="322" stroke="#DFDCD3" stroke-width="1"/>
<circle cx="90" cy="348" r="16" fill="#2563A8"/>
<text x="90" y="353" class="label-light" text-anchor="middle" font-weight="700" font-size="14">T5</text>
<text x="140" y="353" class="label" font-size="13">Onrepresentatieve omgeving</text>
<text x="560" y="353" class="sub" font-size="11.5" fill="#9A5F0D">een ander, kleiner systeem getest</text>
<line x1="70" y1="374" x2="950" y2="374" stroke="#DFDCD3" stroke-width="1"/>
<circle cx="90" cy="400" r="16" fill="#2563A8"/>
<text x="90" y="405" class="label-light" text-anchor="middle" font-weight="700" font-size="14">T6</text>
<text x="140" y="405" class="label" font-size="13">Testdata zonder randgevallen</text>
<text x="560" y="405" class="sub" font-size="11.5" fill="#9A5F0D">intuïtie in plaats van systematiek</text>
<line x1="70" y1="426" x2="950" y2="426" stroke="#DFDCD3" stroke-width="1"/>
<circle cx="90" cy="452" r="16" fill="#2563A8"/>
<text x="90" y="457" class="label-light" text-anchor="middle" font-weight="700" font-size="14">T7</text>
<text x="140" y="457" class="label" font-size="13">Ketenpartner niet betrokken</text>
<text x="560" y="457" class="sub" font-size="11.5" fill="#9A5F0D">beide kanten getest, het midden nooit</text>
<line x1="70" y1="478" x2="950" y2="478" stroke="#DFDCD3" stroke-width="1"/>
<circle cx="90" cy="504" r="16" fill="#2563A8"/>
<text x="90" y="509" class="label-light" text-anchor="middle" font-weight="700" font-size="14">T8</text>
<text x="140" y="509" class="label" font-size="13">Exitcriterium was een percentage</text>
<text x="560" y="509" class="sub" font-size="11.5" fill="#9A5F0D">een norm zonder besluitwaarde</text>
<rect x="60" y="560" width="900" height="0" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="500" y="578" text-anchor="middle" class="sub" fill="#9A5F0D">Elke fout ontstond doordat iets dat iemand wist, nooit een vorm kreeg die het proces kon sturen.</text>

</svg>