<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'DM Sans', Arial, sans-serif" width="960" height="460" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .mono { font-family: 'Courier New', monospace; }
</style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arramb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#9A5F0D"/></marker>
    </defs>
<rect width="960" height="460" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 9 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Een criterium dat niemand aanraakt</text>
<text x="40" y="90" class="sub">"≥95% geslaagd, geen open bevinding hoog" — geen van T1–T7 wordt hierdoor beproefd.</text>
<rect x="340" y="140" width="280" height="80" rx="8" fill="#2563A8" stroke="#2563A8" stroke-width="1.5"/>
<text x="480" y="172" class="label-light" text-anchor="middle" font-size="14">Exitcriterium</text>
<text x="480" y="194" class="sub-light" text-anchor="middle" font-size="10.5">≥95% geslaagd, geen open bevinding hoog</text>
<rect x="150" y="290" width="160" height="50" rx="6" fill="#FBFAF7" stroke="#55606F" stroke-width="1" stroke-dasharray="3 3"/>
<text x="230" y="320" class="sub" text-anchor="middle" font-size="11">T1 traceerbaarheid</text>
<rect x="330" y="290" width="160" height="50" rx="6" fill="#FBFAF7" stroke="#55606F" stroke-width="1" stroke-dasharray="3 3"/>
<text x="410" y="320" class="sub" text-anchor="middle" font-size="11">T2 dekking/risico</text>
<rect x="510" y="290" width="160" height="50" rx="6" fill="#FBFAF7" stroke="#55606F" stroke-width="1" stroke-dasharray="3 3"/>
<text x="590" y="320" class="sub" text-anchor="middle" font-size="11">T3 verouderde basis</text>
<rect x="690" y="290" width="160" height="50" rx="6" fill="#FBFAF7" stroke="#55606F" stroke-width="1" stroke-dasharray="3 3"/>
<text x="770" y="320" class="sub" text-anchor="middle" font-size="11">T4 geen review</text>
<rect x="150" y="360" width="160" height="50" rx="6" fill="#FBFAF7" stroke="#55606F" stroke-width="1" stroke-dasharray="3 3"/>
<text x="230" y="390" class="sub" text-anchor="middle" font-size="11">T5 testomgeving</text>
<rect x="330" y="360" width="160" height="50" rx="6" fill="#FBFAF7" stroke="#55606F" stroke-width="1" stroke-dasharray="3 3"/>
<text x="410" y="390" class="sub" text-anchor="middle" font-size="11">T6 testdata</text>
<rect x="510" y="360" width="160" height="50" rx="6" fill="#FBFAF7" stroke="#55606F" stroke-width="1" stroke-dasharray="3 3"/>
<text x="590" y="390" class="sub" text-anchor="middle" font-size="11">T7 ketenpartner</text>
<text x="480" y="420" text-anchor="middle" class="sub" fill="#9A5F0D">Het criterium is haalbaar zonder ooit het juiste te hebben getest.</text>

</svg>