<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" font-family="'DM Sans', Arial, sans-serif" width="960" height="480" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
</defs>
<rect width="960" height="480" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 23 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Van wetsartikel naar testgeval — de traceerbaarheidsketen</text>
<text x="40" y="96" class="sub">Elke schakel expliciet vastgelegd; de tester test de interpretatie, niet de wet zelf.</text>

<rect x="40" y="180" width="200" height="140" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="140" y="220" text-anchor="middle" class="label" font-size="13">Wetsartikel</text>
<text x="140" y="242" text-anchor="middle" class="sub" font-size="11">Wtp, AMvB,</text>
<text x="140" y="258" text-anchor="middle" class="sub" font-size="11">DNB-richtsnoer</text>

<path d="M242 250 L288 250" class="arrow-b"/>

<rect x="290" y="180" width="210" height="140" rx="8" fill="#CBDCEF" stroke="#2563A8" stroke-width="1.5"/>
<text x="395" y="212" text-anchor="middle" class="label" font-size="13">Juridische</text>
<text x="395" y="230" text-anchor="middle" class="label" font-size="13">interpretatie</text>
<text x="395" y="254" text-anchor="middle" class="sub" font-size="11">vastgesteld door</text>
<text x="395" y="270" text-anchor="middle" class="sub" font-size="11">compliance-functie</text>
<text x="395" y="286" text-anchor="middle" class="sub" font-size="11">of jurist</text>

<path d="M502 250 L548 250" class="arrow-b"/>

<rect x="550" y="180" width="190" height="140" rx="8" fill="#6FA3D6" stroke="#2563A8" stroke-width="1.5"/>
<text x="645" y="220" text-anchor="middle" class="label-light" font-size="13">Testconditie</text>
<text x="645" y="248" text-anchor="middle" class="sub-light" font-size="11">afgeleid uit de</text>
<text x="645" y="264" text-anchor="middle" class="sub-light" font-size="11">vastgestelde interpretatie</text>

<path d="M742 250 L788 250" class="arrow-b"/>

<rect x="790" y="180" width="130" height="140" rx="8" fill="#2563A8" stroke="#E9A13B" stroke-width="3"/>
<text x="855" y="230" text-anchor="middle" class="label-light" font-size="13">Testgeval</text>
<text x="855" y="256" text-anchor="middle" class="sub-light" font-size="11">uitvoerbaar,</text>
<text x="855" y="272" text-anchor="middle" class="sub-light" font-size="11">traceerbaar</text>

<text x="480" y="400" text-anchor="middle" class="sub" fill="#9A5F0D">De scheiding tussen wet en interpretatie moet in het testwerk zichtbaar blijven — traceerbaarheid naar beide.</text>
</svg>
