<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    </defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 6 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">De aggregate root als enige toegangspoort</text>
<text x="40" y="96" class="sub">Alle wijzigingen aan iets binnen de grens lopen via het dossier — nooit rechtstreeks naar binnen.</text>
<circle cx="500" cy="200" r="20" class="blue-dark" fill="#2563A8" stroke="#E9A13B" stroke-width="3"/>
<text x="500" y="248" text-anchor="middle" class="label">dossier — aggregate root</text>
<rect x="320" y="330" width="360" height="220" rx="10" fill="none" stroke="#2563A8" stroke-width="2"/>
<rect x="330" y="360" width="140" height="40" rx="6" fill="#CBDCEF" fill-opacity="0.6" stroke="#2563A8"/>
<text x="400" y="385" text-anchor="middle" class="sub">vaststelling</text>
<rect x="530" y="360" width="140" height="40" rx="6" fill="#CBDCEF" fill-opacity="0.6" stroke="#2563A8"/>
<text x="600" y="385" text-anchor="middle" class="sub">onderbouwing</text>
<rect x="430" y="450" width="140" height="40" rx="6" fill="#CBDCEF" fill-opacity="0.6" stroke="#2563A8"/>
<text x="500" y="475" text-anchor="middle" class="sub">actieve status</text>
<path d="M500 224 L500 330" class="arrow-b"/>
<circle cx="80" cy="180" r="16" fill="#6FA3D6"/>
<text x="80" y="220" text-anchor="middle" class="sub">Willemijn</text>
<path d="M110 180 L460 200" class="arrow"/>
<circle cx="80" cy="300" r="16" fill="#6FA3D6"/>
<text x="80" y="340" text-anchor="middle" class="sub">medewerker A</text>
<path d="M110 300 L460 200" class="arrow"/>
<circle cx="880" cy="180" r="16" fill="#6FA3D6"/>
<text x="880" y="220" text-anchor="middle" class="sub">Rutger</text>
<path d="M850 180 L540 200" class="arrow"/>
<circle cx="880" cy="300" r="16" fill="#6FA3D6"/>
<text x="880" y="340" text-anchor="middle" class="sub">medewerker B</text>
<path d="M850 300 L540 200" class="arrow"/>
<text x="480" y="590" text-anchor="middle" class="sub" fill="#9A5F0D">niets binnen de grens wordt van buitenaf aangepast zonder dat de root ervan weet</text>
