<rect x="320" y="330" width="360" height="220" rx="10" fill="none" stroke="#1A4F8B" stroke-width="2"/>
<rect x="330" y="360" width="140" height="40" rx="6" fill="#C5D8F0" fill-opacity="0.6" stroke="#1A4F8B"/>
<text x="400" y="385" text-anchor="middle" class="sub">vaststelling</text>
<rect x="530" y="360" width="140" height="40" rx="6" fill="#C5D8F0" fill-opacity="0.6" stroke="#1A4F8B"/>
<text x="600" y="385" text-anchor="middle" class="sub">onderbouwing</text>
<rect x="430" y="450" width="140" height="40" rx="6" fill="#C5D8F0" fill-opacity="0.6" stroke="#1A4F8B"/>
<text x="500" y="475" text-anchor="middle" class="sub">actieve status</text>
<path d="M500 224 L500 330" class="arrow-b"/>
<circle cx="80" cy="180" r="16" fill="#8AAFD4"/>
<text x="80" y="220" text-anchor="middle" class="sub">Willemijn</text>
