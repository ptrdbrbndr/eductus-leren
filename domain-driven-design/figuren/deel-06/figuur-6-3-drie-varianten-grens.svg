<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .blue-line { stroke:#1A4F8B; }
      .blue-fill { fill:#C5D8F0; }
      .blue-mid { fill:#8AAFD4; }
      .blue-dark { fill:#1A4F8B; }
      .amber { stroke:#E8A020; }
      .amber-fill { fill:#E8A020; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .sub-light { font-size:12px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#5B6675; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5B6675"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1A4F8B"/></marker>
    </defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 6 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Drie varianten — te groot, te klein, de juiste grens</text>
<rect x="50" y="120" width="260" height="220" rx="10" fill="#FFFFFF" stroke="#5B6675" stroke-width="1.5"/>
<text x="180" y="150" text-anchor="middle" class="label" fill="#0D1B2A">TE GROOT</text>
<circle cx="180" cy="230" r="90" fill="#C5D8F0" fill-opacity="0.5" stroke="#1A4F8B"/>
<circle cx="140" cy="200" r="14" fill="#1A4F8B"/>
<circle cx="220" cy="200" r="14" fill="#1A4F8B"/>
<circle cx="180" cy="250" r="14" fill="#1A4F8B"/>
<circle cx="140" cy="290" r="14" fill="#1A4F8B"/>
<circle cx="220" cy="290" r="14" fill="#1A4F8B"/>
<text x="180" y="310" text-anchor="middle" class="sub" font-size="11">alles bij elkaar vegen</text>
<text x="180" y="360" text-anchor="middle" class="sub" font-style="italic">niemand kan meer iets kleins</text>
<text x="180" y="378" text-anchor="middle" class="sub" font-style="italic">wijzigen zonder alles te claimen</text>
<rect x="350" y="120" width="260" height="220" rx="10" fill="#FFFFFF" stroke="#5B6675" stroke-width="1.5"/>
<text x="480" y="150" text-anchor="middle" class="label" fill="#0D1B2A">TE KLEIN</text>
<circle cx="420" cy="210" r="12" fill="#1A4F8B"/>
<circle cx="520" cy="190" r="12" fill="#1A4F8B"/>
<circle cx="460" cy="270" r="12" fill="#1A4F8B"/>
<circle cx="540" cy="260" r="12" fill="#1A4F8B"/>
<circle cx="480" cy="160" r="12" fill="#1A4F8B"/>
<text x="480" y="310" text-anchor="middle" class="sub" font-size="11">alles los, geen garantie</text>
<text x="480" y="360" text-anchor="middle" class="sub" font-style="italic">bedrag wijzigt zonder</text>
<text x="480" y="378" text-anchor="middle" class="sub" font-style="italic">onderbouwing — Corné's incident</text>
<rect x="650" y="120" width="260" height="220" rx="10" fill="#FFFFFF" stroke="#E8A020" stroke-width="3"/>
<text x="780" y="150" text-anchor="middle" class="label" fill="#8A5A0E">DE JUISTE GRENS</text>
<circle cx="780" cy="230" r="55" fill="#C5D8F0" fill-opacity="0.6" stroke="#1A4F8B" stroke-width="2"/>
<circle cx="760" cy="215" r="12" fill="#1A4F8B"/>
<circle cx="800" cy="245" r="12" fill="#1A4F8B"/>
<circle cx="690" cy="190" r="10" fill="#8AAFD4"/>
<circle cx="870" cy="280" r="10" fill="#8AAFD4"/>
<text x="780" y="310" text-anchor="middle" class="sub" font-size="11">wat nooit uit elkaar mag vallen</text>
<text x="780" y="360" text-anchor="middle" class="sub" font-style="italic">bedrag + onderbouwing samen,</text>
<text x="780" y="378" text-anchor="middle" class="sub" font-style="italic">adres en correspondentie los</text>
</svg>