<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    </defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 6 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Drie varianten — te groot, te klein, de juiste grens</text>
<rect x="50" y="120" width="260" height="220" rx="10" fill="#FFFFFF" stroke="#55606F" stroke-width="1.5"/>
<text x="180" y="150" text-anchor="middle" class="label" fill="#14213D">TE GROOT</text>
<circle cx="180" cy="230" r="90" fill="#CBDCEF" fill-opacity="0.5" stroke="#2563A8"/>
<circle cx="140" cy="200" r="14" fill="#2563A8"/>
<circle cx="220" cy="200" r="14" fill="#2563A8"/>
<circle cx="180" cy="250" r="14" fill="#2563A8"/>
<circle cx="140" cy="290" r="14" fill="#2563A8"/>
<circle cx="220" cy="290" r="14" fill="#2563A8"/>
<text x="180" y="310" text-anchor="middle" class="sub" font-size="11">alles bij elkaar vegen</text>
<text x="180" y="360" text-anchor="middle" class="sub" font-style="italic">niemand kan meer iets kleins</text>
<text x="180" y="378" text-anchor="middle" class="sub" font-style="italic">wijzigen zonder alles te claimen</text>
<rect x="350" y="120" width="260" height="220" rx="10" fill="#FFFFFF" stroke="#55606F" stroke-width="1.5"/>
<text x="480" y="150" text-anchor="middle" class="label" fill="#14213D">TE KLEIN</text>
<circle cx="420" cy="210" r="12" fill="#2563A8"/>
<circle cx="520" cy="190" r="12" fill="#2563A8"/>
<circle cx="460" cy="270" r="12" fill="#2563A8"/>
<circle cx="540" cy="260" r="12" fill="#2563A8"/>
<circle cx="480" cy="160" r="12" fill="#2563A8"/>
<text x="480" y="310" text-anchor="middle" class="sub" font-size="11">alles los, geen garantie</text>
<text x="480" y="360" text-anchor="middle" class="sub" font-style="italic">bedrag wijzigt zonder</text>
<text x="480" y="378" text-anchor="middle" class="sub" font-style="italic">onderbouwing — Corné's incident</text>
<rect x="650" y="120" width="260" height="220" rx="10" fill="#FFFFFF" stroke="#E9A13B" stroke-width="3"/>
<text x="780" y="150" text-anchor="middle" class="label" fill="#9A5F0D">DE JUISTE GRENS</text>
<circle cx="780" cy="230" r="55" fill="#CBDCEF" fill-opacity="0.6" stroke="#2563A8" stroke-width="2"/>
<circle cx="760" cy="215" r="12" fill="#2563A8"/>
<circle cx="800" cy="245" r="12" fill="#2563A8"/>
<circle cx="690" cy="190" r="10" fill="#6FA3D6"/>
<circle cx="870" cy="280" r="10" fill="#6FA3D6"/>
<text x="780" y="310" text-anchor="middle" class="sub" font-size="11">wat nooit uit elkaar mag vallen</text>
<text x="780" y="360" text-anchor="middle" class="sub" font-style="italic">bedrag + onderbouwing samen,</text>
<text x="780" y="378" text-anchor="middle" class="sub" font-style="italic">adres en correspondentie los</text>
</svg>