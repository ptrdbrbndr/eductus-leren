<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 722" font-family="'DM Sans', Arial, sans-serif" width="960" height="722" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:21px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-a { stroke:#E9A13B; stroke-width:2; fill:none; marker-end:url(#arra); }
    </style>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
    </defs>
<rect width="960" height="722" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 14 · INSTRUMENT</text>
<text x="40" y="64" class="title">Het grensbeschermingsblad</text>
<text x="40" y="90" class="sub" text-anchor="start">Vastleggen of een context zich aanpast, zich beschermt, of een gedeelde vorm ontwerpt — ingevuld voor</text>
<text x="40" y="107" class="sub" text-anchor="start">Nabestaandenloket-KERN.</text>
<circle cx="58" cy="164" r="14" fill="#2563A8"/>
<text x="58" y="169" text-anchor="middle" class="field-num" font-size="12" font-weight="700" fill="#FFFFFF">1</text>
<rect x="40" y="184" width="880" height="62" rx="6" fill="#FFFFFF" class="blue-line" stroke-width="1.5"/>
<text x="56" y="206" class="label">BESCHRIJF HET MODEL WAAR DE CONTEXT ZICH TOE MOET VERHOUDEN</text>
<text x="56" y="226" class="sub" text-anchor="start">KERN: oud, gelaagd, twintig jaar aan uitzonderingen — niet stabiel genoeg om zonder buffer over te nemen</text>
<circle cx="58" cy="276" r="14" fill="#2563A8"/>
<text x="58" y="281" text-anchor="middle" class="field-num" font-size="12" font-weight="700" fill="#FFFFFF">2</text>
<rect x="40" y="296" width="880" height="62" rx="6" fill="#FFFFFF" class="blue-line" stroke-width="1.5"/>
<text x="56" y="318" class="label">WEEG DE KOSTEN VAN AANPASSEN TEGEN DE KOSTEN VAN BESCHERMEN</text>
<text x="56" y="338" class="sub" text-anchor="start">aanpassen is goedkoper maar vervuilt het model; een vertaallaag kost onderhoud maar houdt het model schoon</text>
<circle cx="58" cy="388" r="14" fill="#2563A8"/>
<text x="58" y="393" text-anchor="middle" class="field-num" font-size="12" font-weight="700" fill="#FFFFFF">3</text>
<rect x="40" y="408" width="880" height="62" rx="6" fill="#FFFFFF" class="blue-line" stroke-width="1.5"/>
<text x="56" y="430" class="label">KIES HET PATROON EN BESCHRIJF WAT HET VRAAGT</text>
<text x="56" y="450" class="sub" text-anchor="start">anti-corruption layer — een eigen vertaalcomponent met eigen onderhoud, gebouwd in niveau 1</text>
<circle cx="58" cy="500" r="14" fill="#2563A8"/>
<text x="58" y="505" text-anchor="middle" class="field-num" font-size="12" font-weight="700" fill="#FFFFFF">4</text>
<rect x="40" y="520" width="880" height="62" rx="6" fill="#FFFFFF" class="blue-line" stroke-width="1.5"/>
<text x="56" y="542" class="label">BENOEM WAT ER GEBEURT ALS DEZE BESCHERMING ER NIET IS</text>
<text x="56" y="562" class="sub" text-anchor="start">elke KERN-wijziging zou rechtstreeks in de rechtvaststelling doorwerken, ongezien, tot een nabestaande er last van</text>
<text x="56" y="579" class="sub" text-anchor="start">heeft</text>
<circle cx="58" cy="613" r="15" fill="#E9A13B"/>
<path d="M52 613 l4 4 l8 -9" stroke="#14213D" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="632" width="880" height="60" rx="6" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
<text x="56" y="654" class="label" fill="#9A5F0D">DAT HET VERSCHIL MAAKT</text>
<text x="56" y="674" class="sub" text-anchor="start">als het model aan de andere kant morgen wijzigt zonder dat wij het weten, wat merkt onze context dan als eerste —</text>
<text x="56" y="691" class="sub" text-anchor="start">acceptabel risico, of precies wat dit patroon moest afdekken?</text>
</svg>