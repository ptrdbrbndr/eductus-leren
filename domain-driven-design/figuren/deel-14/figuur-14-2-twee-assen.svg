<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .blue-line { stroke:#1A4F8B; }
      .blue-fill { fill:#C5D8F0; }
      .blue-mid { fill:#8AAFD4; }
      .blue-dark { fill:#1A4F8B; }
      .amber { stroke:#E8A020; }
      .amber-fill { fill:#E8A020; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .sub-light { font-size:12px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:21px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#5B6675; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-a { stroke:#E8A020; stroke-width:2; fill:none; marker-end:url(#arra); }
    </style>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5B6675"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1A4F8B"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E8A020"/></marker>
    </defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 14 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Twee assen, twee patroonparen</text>
<text x="40" y="96" class="sub" text-anchor="start">Bescherm/pas-aan als ene as; aanbied/vertaal als andere as — verwante maar losstaande patronen.</text>
<line x1="130" y1="100" x2="130" y2="480" class="arrow" stroke-width="1.2"/>
<text x="130" y="90" text-anchor="middle" class="kicker">BESCHERM ↔ PAS-AAN</text>
<rect x="60" y="140" width="140" height="90" rx="8" fill="#C5D8F0" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="130.0" y="179.0" text-anchor="middle" class="label">Anti-corruption layer</text>
<text x="130.0" y="197.0" text-anchor="middle" class="sub">beschermt</text>
<rect x="60" y="420" width="140" height="90" rx="8" fill="#C5D8F0" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="130.0" y="459.0" text-anchor="middle" class="label">Conformist</text>
<text x="130.0" y="477.0" text-anchor="middle" class="sub">past zich aan</text>
<line x1="620" y1="100" x2="620" y2="480" class="arrow" stroke-width="1.2"/>
<text x="620" y="90" text-anchor="middle" class="kicker">AANBIED ↔ VERTAAL</text>
<rect x="550" y="140" width="140" height="90" rx="8" fill="#E4E1D8" stroke="#5B6675" stroke-width="1.5"/>
<text x="620.0" y="179.0" text-anchor="middle" class="label">Open host service</text>
<text x="620.0" y="197.0" text-anchor="middle" class="sub">aanbod voor velen</text>
<rect x="550" y="420" width="140" height="90" rx="8" fill="#E4E1D8" stroke="#5B6675" stroke-width="1.5"/>
<text x="620.0" y="459.0" text-anchor="middle" class="label">Published language</text>
<text x="620.0" y="477.0" text-anchor="middle" class="sub">vertaalt één feit</text>
<text x="340" y="300" text-anchor="middle" class="kicker">verwant, niet</text>
<text x="340" y="318" text-anchor="middle" class="kicker">hetzelfde</text>
</svg>