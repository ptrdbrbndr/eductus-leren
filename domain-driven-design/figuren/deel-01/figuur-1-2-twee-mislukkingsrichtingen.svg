<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    </defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 1 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Twee mislukkingsrichtingen</text>
<rect x="60" y="120" width="400" height="420" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="260" y="155" text-anchor="middle" class="label">DDD toegepast waar het niet nodig is</text>
<rect x="90" y="180" width="340" height="60" rx="6" class="blue-fill" fill="#CBDCEF"/>
<text x="260" y="205" text-anchor="middle" class="sub" font-weight="700">Adresveld</text>
<text x="260" y="222" text-anchor="middle" class="sub">laag op alle vier de assen</text>
<path d="M260 240 L260 275" class="arrow"/>
<rect x="90" y="280" width="340" height="130" rx="6" fill="#F4F2EC" stroke="#55606F" stroke-dasharray="4 3"/>
<text x="260" y="310" text-anchor="middle" class="sub" font-weight="700">Zwaar domeinmodel, entities, events…</text>
<text x="260" y="332" text-anchor="middle" class="sub">voor een veld waar niemand ooit</text>
<text x="260" y="350" text-anchor="middle" class="sub">een probleem mee had</text>
<text x="260" y="480" text-anchor="middle" class="sub" font-style="italic">gevolg: overgeorganiseerd,</text>
<text x="260" y="498" text-anchor="middle" class="sub" font-style="italic">traag te bouwen, voor niets</text>
<rect x="500" y="120" width="400" height="420" rx="8" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="700" y="155" text-anchor="middle" class="label">DDD achterwege gelaten waar het wél nodig is</text>
<rect x="530" y="180" width="340" height="60" rx="6" class="blue-dark" fill="#2563A8"/>
<text x="700" y="205" text-anchor="middle" class="sub-light" font-weight="700">Vaststellen recht op partnerpensioen</text>
<text x="700" y="222" text-anchor="middle" class="sub-light">samenloop, uitzonderingen, hoge inzet</text>
<path d="M700 240 L700 275" class="arrow"/>
<rect x="530" y="280" width="340" height="130" rx="6" fill="#F4F2EC" stroke="#55606F" stroke-dasharray="4 3"/>
<text x="700" y="310" text-anchor="middle" class="sub" font-weight="700">Eén woord — "mutatie" — dat</text>
<text x="700" y="332" text-anchor="middle" class="sub">vijf of zes verschillende dingen</text>
<text x="700" y="350" text-anchor="middle" class="sub">tegelijk moet dekken</text>
<text x="700" y="480" text-anchor="middle" class="sub" font-style="italic">gevolg: technisch correct,</text>
<text x="700" y="498" text-anchor="middle" class="sub" font-style="italic">sluit niet aan op het werk — WGP 2.0</text>
<rect x="200" y="560" width="560" height="42" rx="8" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
<text x="480" y="585" text-anchor="middle" class="sub" fill="#9A5F0D">De complexiteitstoets maakt dit onderscheid vooraf, niet twee jaar later</text>
</svg>