<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="'DM Sans', Arial, sans-serif" width="960" height="540" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .red-fill { fill:#DFDCD3; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:21px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .field-num { font-size:12px; font-weight:700; fill:#FFFFFF; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-a { stroke:#E9A13B; stroke-width:2; fill:none; marker-end:url(#arra); }
</style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
    </defs>
<rect width="960" height="540" class="paper"/>
<text x="40" y="34" text-anchor="start" class="kicker" >DEEL 24 · CONCEPTDIAGRAM</text>
<text x="40" y="64" text-anchor="start" class="title" >De anti-corruption layer als vertaalschil</text>
<text x="40" y="90" text-anchor="start" class="sub" >Eén verward statusveld in het oude systeem wordt via de ACL naar drie expliciete toestanden in het</text>
<text x="40" y="107" text-anchor="start" class="sub" >nieuwe model vertaald.</text>
<rect x="60" y="200" width="260" height="140" rx="6" fill="#DFDCD3" stroke="#B33A3A" stroke-width="1.5" />
<text x="190.0" y="252.0" text-anchor="middle" class="label" >OUD SYSTEEM</text>
<text x="190.0" y="271.0" text-anchor="middle" class="sub" >statusveld “actief” — drie stille</text>
<text x="190.0" y="286.0" text-anchor="middle" class="sub" >betekenissen</text>
<rect x="380" y="200" width="200" height="140" rx="6" fill="#FFFFFF" stroke="#E9A13B" stroke-width="1.5" />
<text x="480.0" y="260.0" text-anchor="middle" class="label" >ACL</text>
<text x="480.0" y="279.0" text-anchor="middle" class="sub" >vertaalt op basis van context</text>
<rect x="660" y="130" width="240" height="80" rx="6" fill="#CBDCEF" stroke="#2563A8" stroke-width="1.5" />
<text x="780.0" y="168.0" text-anchor="middle" class="label" >in dienst</text>
<path d="M580 270 L660 170" class="arrow-b"/>
<rect x="660" y="240" width="240" height="80" rx="6" fill="#CBDCEF" stroke="#2563A8" stroke-width="1.5" />
<text x="780.0" y="278.0" text-anchor="middle" class="label" >op wachtlijst</text>
<path d="M580 270 L660 280" class="arrow-b"/>
<rect x="660" y="350" width="240" height="80" rx="6" fill="#CBDCEF" stroke="#2563A8" stroke-width="1.5" />
<text x="780.0" y="388.0" text-anchor="middle" class="label" >voorlopig actief</text>
<path d="M580 270 L660 390" class="arrow-b"/>
<path d="M320 270 L380 270" class="arrow-a"/>
</svg>