<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="'DM Sans', Arial, sans-serif" width="960" height="500" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .blue-line { stroke:#1A4F8B; }
      .blue-fill { fill:#C5D8F0; }
      .blue-mid { fill:#8AAFD4; }
      .blue-dark { fill:#1A4F8B; }
      .amber { stroke:#E8A020; }
      .amber-fill { fill:#E8A020; }
      .red-fill { fill:#E4E1D8; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .sub-light { font-size:12px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:21px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .field-num { font-size:12px; font-weight:700; fill:#FFFFFF; }
      .arrow { stroke:#5B6675; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-a { stroke:#E8A020; stroke-width:2; fill:none; marker-end:url(#arra); }
</style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5B6675"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1A4F8B"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E8A020"/></marker>
    </defs>
<rect width="960" height="500" class="paper"/>
<text x="40" y="34" text-anchor="start" class="kicker" >DEEL 24 · CONCEPTDIAGRAM</text>
<text x="40" y="64" text-anchor="start" class="title" >Twee uiterste routes, en een derde pad</text>
<text x="40" y="90" text-anchor="start" class="sub" >Big bang en laten-zoals-het-is dragen allebei een risico; strangler fig met ACL ligt ertussenin.</text>
<rect x="40" y="170" width="280" height="200" rx="6" fill="#E4E1D8" stroke="#B33A3A" stroke-width="1.5" />
<text x="180.0" y="252.0" text-anchor="middle" class="label" >BIG BANG</text>
<text x="180.0" y="271.0" text-anchor="middle" class="sub" >risico: alles tegelijk vervangen, geen tussenstap</text>
<text x="180.0" y="286.0" text-anchor="middle" class="sub" >terug</text>
<rect x="640" y="170" width="280" height="200" rx="6" fill="#E4E1D8" stroke="#B33A3A" stroke-width="1.5" />
<text x="780.0" y="252.0" text-anchor="middle" class="label" >LATEN ZOALS HET IS</text>
<text x="780.0" y="271.0" text-anchor="middle" class="sub" >risico: modder blijft, DNB-toets faalt op</text>
<text x="780.0" y="286.0" text-anchor="middle" class="sub" >onaantoonbaarheid</text>
<rect x="350" y="170" width="260" height="200" rx="6" fill="#FFFFFF" stroke="#E8A020" stroke-width="1.5" />
<text x="480.0" y="252.0" text-anchor="middle" class="label" >STRANGLER FIG + ACL</text>
<text x="480.0" y="271.0" text-anchor="middle" class="sub" >geleidelijk vervangen, afgeschermd door een</text>
<text x="480.0" y="286.0" text-anchor="middle" class="sub" >vertaallaag</text>
</svg>