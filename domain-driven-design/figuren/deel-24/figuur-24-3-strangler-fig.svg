<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="'DM Sans', Arial, sans-serif" width="960" height="520" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .red-fill { fill:#DFDCD3; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:21px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .field-num { font-size:12px; font-weight:700; fill:#FFFFFF; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-a { stroke:#E9A13B; stroke-width:2; fill:none; marker-end:url(#arra); }
</style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
    </defs>
<rect width="960" height="520" class="paper"/>
<text x="40" y="34" text-anchor="start" class="kicker" >DEEL 24 · CONCEPTDIAGRAM</text>
<text x="40" y="64" text-anchor="start" class="title" >De strangler fig: groeiend nieuw model, krimpend oud systeem</text>
<text x="40" y="90" text-anchor="start" class="sub" >De routeringslaag is de scheidslijn tussen oud en nieuw — en verschuift per stuk dat wordt</text>
<text x="40" y="107" text-anchor="start" class="sub" >gemigreerd.</text>
<circle cx="650" cy="300" r="190" fill="#DFDCD3" stroke="#B33A3A" stroke-width="1.5"/>
<circle cx="650" cy="300" r="190" fill="none" stroke="#2563A8" stroke-width="0"/>
<text x="650" y="150" text-anchor="middle" class="sub" >oud systeem — krimpt</text>
<circle cx="340" cy="300" r="130" fill="#CBDCEF" stroke="#2563A8" stroke-width="1.5"/>
<text x="340" y="155" text-anchor="middle" class="sub" >nieuw model — groeit</text>
<path d="M470 180 C 520 220, 520 380, 470 420" stroke="#E9A13B" stroke-width="3" fill="none" stroke-dasharray="6 4"/>
<text x="500" y="300" text-anchor="start" class="kicker" >routerings-</text>
<text x="500" y="315" text-anchor="start" class="kicker" >laag</text>
</svg>