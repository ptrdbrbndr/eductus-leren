<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .blue-line { stroke:#1A4F8B; }
      .blue-fill { fill:#C5D8F0; }
      .blue-mid { fill:#8AAFD4; }
      .blue-dark { fill:#1A4F8B; }
      .amber { stroke:#E8A020; }
      .amber-fill { fill:#E8A020; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .sub-light { font-size:12px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:21px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#5B6675; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-a { stroke:#E8A020; stroke-width:2; fill:none; marker-end:url(#arra); }
    </style>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5B6675"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1A4F8B"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E8A020"/></marker>
    </defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 16 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">De deeltijdwijziging uitgeschreven</text>
<text x="40" y="96" class="sub" text-anchor="start">Commando, event, beleidsregel, commando, event — met de voorlopige aggregaatgrens rond het dienstverband</text>
<text x="40" y="113" class="sub" text-anchor="start">gemarkeerd.</text>
<rect x="60" y="150" width="190" height="110" rx="8" fill="#1A4F8B" stroke="#0D1B2A" stroke-width="1"/>
<text x="155.0" y="199.0" text-anchor="middle" class="label-light">deeltijdwijziging doorgeven</text>
<text x="155.0" y="217.0" text-anchor="middle" class="sub">commando</text>
<rect x="290" y="150" width="190" height="110" rx="8" fill="#E8A020" stroke="#0D1B2A" stroke-width="1"/>
<text x="385.0" y="199.0" text-anchor="middle" class="label">deeltijdwijziging gemeld</text>
<text x="385.0" y="217.0" text-anchor="middle" class="sub">event</text>
<rect x="520" y="150" width="190" height="110" rx="8" fill="#8AAFD4" stroke="#0D1B2A" stroke-width="1"/>
<text x="615.0" y="199.0" text-anchor="middle" class="label">→ commando aan KERN</text>
<text x="615.0" y="217.0" text-anchor="middle" class="sub">regel</text>
<rect x="750" y="150" width="190" height="110" rx="8" fill="#E8A020" stroke="#0D1B2A" stroke-width="1"/>
<text x="845.0" y="199.0" text-anchor="middle" class="label">dienstverband gewijzigd</text>
<text x="845.0" y="217.0" text-anchor="middle" class="sub">event</text>
<path d="M255 205 L270 205" class="arrow-b"/>
<path d="M485 205 L500 205" class="arrow-b"/>
<path d="M715 205 L730 205" class="arrow-b"/>
<rect x="520" y="290" width="420" height="70" rx="6" fill="#FFFFFF" stroke="#E8A020" stroke-width="2" stroke-dasharray="5 3"/>
<text x="730" y="320" text-anchor="middle" class="kicker">voorlopige aggregaatgrens: het dienstverband</text>
<text x="730" y="340" text-anchor="middle" class="kicker">(percentage + ingangsdatum) binnen KERN</text>
</svg>