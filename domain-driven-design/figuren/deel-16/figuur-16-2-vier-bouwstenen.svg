<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:21px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-a { stroke:#E9A13B; stroke-width:2; fill:none; marker-end:url(#arra); }
    </style>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
    </defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 16 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Vier bouwstenen, in elkaars verlengde</text>
<text x="40" y="96" class="sub" text-anchor="start">Commando, domain event, beleidsregel, leesmodel — pijlen tonen hoe ze elkaar opvolgen.</text>
<rect x="40" y="180" width="210" height="120" rx="8" fill="#2563A8" stroke="#14213D" stroke-width="1"/>
<text x="145.0" y="234.0" text-anchor="middle" class="label-light">COMMANDO</text>
<text x="145.0" y="252.0" text-anchor="middle" class="sub">intentie:</text>
<text x="145.0" y="267.0" text-anchor="middle" class="sub">'deeltijdwijziging</text>
<text x="145.0" y="282.0" text-anchor="middle" class="sub">doorgeven'</text>
<rect x="270" y="180" width="210" height="120" rx="8" fill="#E9A13B" stroke="#14213D" stroke-width="1"/>
<text x="375.0" y="234.0" text-anchor="middle" class="label">DOMAIN EVENT</text>
<text x="375.0" y="252.0" text-anchor="middle" class="sub">voltooid feit:</text>
<text x="375.0" y="267.0" text-anchor="middle" class="sub">'deeltijdwijziging</text>
<text x="375.0" y="282.0" text-anchor="middle" class="sub">gemeld'</text>
<rect x="500" y="180" width="210" height="120" rx="8" fill="#6FA3D6" stroke="#14213D" stroke-width="1"/>
<text x="605.0" y="234.0" text-anchor="middle" class="label">BELEIDSREGEL</text>
<text x="605.0" y="252.0" text-anchor="middle" class="sub">als dit, dan automatisch</text>
<text x="605.0" y="267.0" text-anchor="middle" class="sub">dat</text>
<rect x="730" y="180" width="210" height="120" rx="8" fill="#55606F" stroke="#14213D" stroke-width="1"/>
<text x="835.0" y="234.0" text-anchor="middle" class="label-light">LEESMODEL</text>
<text x="835.0" y="252.0" text-anchor="middle" class="sub">venster nodig om het</text>
<text x="835.0" y="267.0" text-anchor="middle" class="sub">volgende commando te</text>
<text x="835.0" y="282.0" text-anchor="middle" class="sub">geven</text>
<path d="M255 240 L270 240" class="arrow-b"/>
<path d="M485 240 L500 240" class="arrow-b"/>
<path d="M715 240 L730 240" class="arrow-b"/>
</svg>