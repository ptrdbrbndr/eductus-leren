<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .blue-line { stroke:#1A4F8B; }
      .blue-fill { fill:#C5D8F0; }
      .blue-mid { fill:#8AAFD4; }
      .blue-dark { fill:#1A4F8B; }
      .amber { stroke:#E8A020; }
      .amber-fill { fill:#E8A020; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .sub-light { font-size:12px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#5B6675; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5B6675"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1A4F8B"/></marker>
    </defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 7 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Eén domain event, uitvergroot</text>
<rect x="180" y="130" width="600" height="380" rx="10" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="2"/>
<rect x="180" y="130" width="600" height="60" rx="10" class="blue-dark" fill="#1A4F8B"/>
<text x="480" y="168" text-anchor="middle" class="label-light" font-size="18">Bedrag herzien</text>
<text x="220" y="220" class="sub" font-weight="700">naam</text>
<text x="420" y="220" class="sub">in verleden tijd, domeintaal</text>
<text x="220" y="265" class="sub" font-weight="700">tijdstip</text>
<text x="420" y="265" class="sub">14 mei, 09:41</text>
<text x="220" y="310" class="sub" font-weight="700">oud bedrag</text>
<text x="420" y="310" class="sub">€ 512,40</text>
<text x="220" y="355" class="sub" font-weight="700">nieuw bedrag</text>
<text x="420" y="355" class="sub">€ 498,15</text>
<text x="220" y="400" class="sub" font-weight="700">reden</text>
<text x="420" y="400" class="sub">correctie bijzonder partnerpensioen</text>
<rect x="180" y="450" width="600" height="60" rx="0" class="amber-fill" fill="#E8A020" fill-opacity="0.15"/>
<text x="480" y="485" text-anchor="middle" class="sub" fill="#8A5A0E">onveranderlijk zodra vastgelegd — een correctie wordt een nieuw event</text>
</svg>