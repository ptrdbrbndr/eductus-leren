<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 722" font-family="'DM Sans', Arial, sans-serif" width="960" height="722" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .blue-line { stroke:#1A4F8B; }
      .amber { stroke:#E8A020; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; letter-spacing:.02em; }
      .sub { font-size:12px; fill:#5B6675; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .field-num { font-size:12px; font-weight:700; fill:#FFFFFF; }
    </style>
</defs>
<rect width="960" height="722" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 7 · INSTRUMENT</text>
<text x="40" y="64" class="title">De gebeurtenislijst</text>
<text x="40" y="96" class="sub">De significante gebeurtenissen van een aggregate inventariseren — ingevuld voor het dossier-cluster.</text>
<circle cx="58" cy="164" r="14" fill="#1A4F8B"/>
<text x="58" y="169" text-anchor="middle" class="field-num">1</text>
<rect x="40" y="184" width="880" height="62" rx="6" fill="#FFFFFF" class="blue-line" stroke-width="1.5"/>
<text x="56" y="206" class="label">WAT IS ER GEBEURD, IN VERLEDEN TIJD EN DOMEINTAAL</text>
<text x="56" y="226" class="sub">overlijden gemeld · recht vastgesteld · aanvraag toegekend/afgewezen · bedrag herzien · dossier heropend</text>
<circle cx="58" cy="276" r="14" fill="#1A4F8B"/>
<text x="58" y="281" text-anchor="middle" class="field-num">2</text>
<rect x="40" y="296" width="880" height="62" rx="6" fill="#FFFFFF" class="blue-line" stroke-width="1.5"/>
<text x="56" y="318" class="label">WAT MAAKT DIT MOMENT SIGNIFICANT GENOEG</text>
<text x="56" y="338" class="sub">zou Willemijn dit over een jaar nog willen kunnen naslaan? bij alle vijf: ja</text>
<circle cx="58" cy="388" r="14" fill="#1A4F8B"/>
<text x="58" y="393" text-anchor="middle" class="field-num">3</text>
<rect x="40" y="408" width="880" height="62" rx="6" fill="#FFFFFF" class="blue-line" stroke-width="1.5"/>
<text x="56" y="430" class="label">WELKE GEGEVENS REIZEN MEE MET HET EVENT</text>
<text x="56" y="450" class="sub">bij "bedrag herzien": oud bedrag, nieuw bedrag, reden, datum, wie de herziening doorvoerde</text>
<circle cx="58" cy="500" r="14" fill="#1A4F8B"/>
<text x="58" y="505" text-anchor="middle" class="field-num">4</text>
<rect x="40" y="520" width="880" height="62" rx="6" fill="#FFFFFF" class="blue-line" stroke-width="1.5"/>
<text x="56" y="542" class="label">KAN DIT MOMENT ONGEDAAN WORDEN, EN HOE LEG JE DAT VAST</text>
<text x="56" y="562" class="sub">nooit door het eerste event aan te passen — altijd als nieuw, tweede event ernaast</text>
<circle cx="58" cy="613" r="15" fill="#E8A020"/>
<path d="M52 613 l4 4 l8 -9" stroke="#0D1B2A" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="632" width="880" height="60" rx="6" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>
<text x="56" y="654" class="label" fill="#8A5A0E">DAT HET VERSCHIL MAAKT</text>
<text x="56" y="674" class="sub">als we dit als overschreven statusveld vastleggen in plaats van als gebeurtenis, wat kunnen we niet meer beantwoorden — wie loopt daar tegenaan?</text>
</svg>