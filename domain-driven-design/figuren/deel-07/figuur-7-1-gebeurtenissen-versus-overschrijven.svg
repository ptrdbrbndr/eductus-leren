<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .blue-line { stroke:#1A4F8B; }
      .blue-fill { fill:#C5D8F0; }
      .blue-mid { fill:#8AAFD4; }
      .blue-dark { fill:#1A4F8B; }
      .amber { stroke:#E8A020; }
      .amber-fill { fill:#E8A020; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .sub-light { font-size:12px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#5B6675; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5B6675"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1A4F8B"/></marker>
    </defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 7 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Een reeks feiten, tegenover één overschreven vak</text>
<text x="40" y="96" class="sub">Domain events blijven allemaal bestaan; een statusveld overschrijft telkens zichzelf.</text>
<line x1="80" y1="200" x2="880" y2="200" class="blue-line" stroke-width="2"/>
<circle cx="150" cy="200" r="8" fill="#1A4F8B"/>
<rect x="80" y="220" width="140" height="55" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="150" y="245" text-anchor="middle" class="sub" font-size="11">Overlijden</text>
<text x="150" y="262" text-anchor="middle" class="sub" font-size="11">gemeld</text>
<circle cx="340" cy="200" r="8" fill="#1A4F8B"/>
<rect x="270" y="220" width="140" height="55" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="340" y="245" text-anchor="middle" class="sub" font-size="11">Recht</text>
<text x="340" y="262" text-anchor="middle" class="sub" font-size="11">vastgesteld</text>
<circle cx="530" cy="200" r="8" fill="#1A4F8B"/>
<rect x="460" y="220" width="140" height="55" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="530" y="245" text-anchor="middle" class="sub" font-size="11">Aanvraag</text>
<text x="530" y="262" text-anchor="middle" class="sub" font-size="11">toegekend</text>
<circle cx="720" cy="200" r="8" fill="#1A4F8B"/>
<rect x="650" y="220" width="140" height="55" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="720" y="245" text-anchor="middle" class="sub" font-size="11">Bedrag</text>
<text x="720" y="262" text-anchor="middle" class="sub" font-size="11">herzien</text>
<text x="480" y="330" text-anchor="middle" class="sub" font-weight="700">al deze feiten blijven bestaan, naast elkaar</text>
<rect x="330" y="400" width="300" height="90" rx="8" fill="#0D1B2A"/>
<text x="480" y="430" text-anchor="middle" class="label-light">status: "toegekend"</text>
<text x="480" y="452" text-anchor="middle" class="sub-light" font-size="11">was: "in behandeling"</text>
<text x="480" y="470" text-anchor="middle" class="sub-light" font-size="11">— overschreven, niet meer terug te lezen</text>
<text x="480" y="540" text-anchor="middle" class="sub" fill="#8A5A0E">een gebeurtenis blijft staan — een status wordt overschreven en het verleden verdwijnt</text>
</svg>