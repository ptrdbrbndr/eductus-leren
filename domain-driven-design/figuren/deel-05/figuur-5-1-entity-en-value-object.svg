<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .blue-line { stroke:#1A4F8B; }
      .blue-fill { fill:#C5D8F0; }
      .blue-mid { fill:#8AAFD4; }
      .blue-dark { fill:#1A4F8B; }
      .amber { stroke:#E8A020; }
      .amber-fill { fill:#E8A020; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .sub-light { font-size:12px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#5B6675; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5B6675"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1A4F8B"/></marker>
    </defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 5 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Entity versus value object</text>
<rect x="70" y="120" width="380" height="380" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="260" y="155" text-anchor="middle" class="label">ENTITY</text>
<rect x="150" y="180" width="220" height="50" rx="6" class="amber-fill" fill="#E8A020"/>
<text x="260" y="212" text-anchor="middle" class="label" fill="#0D1B2A">"wie" — blijft staan</text>
<rect x="150" y="260" width="220" height="45" rx="6" fill="#F0EDE4"/>
<text x="260" y="288" text-anchor="middle" class="sub">naam: Willemijn de Wit</text>
<rect x="150" y="320" width="220" height="45" rx="6" fill="#F0EDE4"/>
<text x="260" y="348" text-anchor="middle" class="sub">adres: Kerkstraat 12</text>
<rect x="150" y="380" width="220" height="45" rx="6" fill="#F0EDE4"/>
<text x="260" y="408" text-anchor="middle" class="sub">→ verandert, blijft dezelfde</text>
<path d="M260 230 L260 258" class="arrow-b"/>
<path d="M260 305 L260 318" class="arrow-b"/>
<rect x="510" y="120" width="380" height="380" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="700" y="155" text-anchor="middle" class="label">VALUE OBJECT</text>
<rect x="590" y="200" width="220" height="90" rx="6" class="blue-dark" fill="#1A4F8B"/>
<text x="700" y="235" text-anchor="middle" class="label-light">€ 842,17</text>
<text x="700" y="258" text-anchor="middle" class="sub-light" font-size="11">de inhoud zelf ís het label</text>
<text x="700" y="330" text-anchor="middle" class="sub">verander de inhoud →</text>
<text x="700" y="350" text-anchor="middle" class="sub">geen ander exemplaar, een nieuw ding</text>
<text x="480" y="550" text-anchor="middle" class="sub" fill="#8A5A0E">Telt dit object door wie of wat het is, of door wat erin staat?</text>
</svg>