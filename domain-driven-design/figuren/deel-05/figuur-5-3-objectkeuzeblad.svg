<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 722" font-family="'DM Sans', Arial, sans-serif" width="960" height="722" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .amber { stroke:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; letter-spacing:.02em; }
      .sub { font-size:12px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .field-num { font-size:12px; font-weight:700; fill:#FFFFFF; }
    </style>
</defs>
<rect width="960" height="722" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 5 · INSTRUMENT</text>
<text x="40" y="64" class="title">Het objectkeuzeblad</text>
<text x="40" y="96" class="sub">Per begrip vaststellen of het een entity of een value object is — ingevuld voor drie begrippen.</text>
<circle cx="58" cy="164" r="14" fill="#2563A8"/>
<text x="58" y="169" text-anchor="middle" class="field-num">1</text>
<rect x="40" y="184" width="880" height="62" rx="6" fill="#FFFFFF" class="blue-line" stroke-width="1.5"/>
<text x="56" y="206" class="label">TWEE IDENTIEKE EXEMPLAREN TOCH VERSCHILLEND BEHANDELEN?</text>
<text x="56" y="226" class="sub">nabestaande: ja, twee mensen  ·  adres: nee, hetzelfde adres  ·  vaststelling: ja, apart aanwijsbaar</text>
<circle cx="58" cy="276" r="14" fill="#2563A8"/>
<text x="58" y="281" text-anchor="middle" class="field-num">2</text>
<rect x="40" y="296" width="880" height="62" rx="6" fill="#FFFFFF" class="blue-line" stroke-width="1.5"/>
<text x="56" y="318" class="label">"NOG HETZELFDE NA WIJZIGING VAN DE INHOUD" — ZINVOLLE VRAAG?</text>
<text x="56" y="338" class="sub">nabestaande: ja, blijft dezelfde  ·  adres: n.v.t.  ·  vaststelling: nee, wordt een nieuwe</text>
<circle cx="58" cy="388" r="14" fill="#2563A8"/>
<text x="58" y="393" text-anchor="middle" class="field-num">3</text>
<rect x="40" y="408" width="880" height="62" rx="6" fill="#FFFFFF" class="blue-line" stroke-width="1.5"/>
<text x="56" y="430" class="label">WAT IDENTIFICEERT HET BEGRIP, ALS ENTITY</text>
<text x="56" y="450" class="sub">nabestaande: BSN + dossiernummer  ·  vaststelling: dossier + vaststellingsmoment</text>
<circle cx="58" cy="500" r="14" fill="#2563A8"/>
<text x="58" y="505" text-anchor="middle" class="field-num">4</text>
<rect x="40" y="520" width="880" height="62" rx="6" fill="#FFFFFF" class="blue-line" stroke-width="1.5"/>
<text x="56" y="542" class="label">GEVOLG VAN EEN WIJZIGING VAN DE INHOUD</text>
<text x="56" y="562" class="sub">nabestaande: aanpassen, blijft hetzelfde ding  ·  adres: vervangen, ander ding  ·  vaststelling: nieuw ding ernaast</text>
<circle cx="58" cy="613" r="15" fill="#E9A13B"/>
<path d="M52 613 l4 4 l8 -9" stroke="#14213D" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="632" width="880" height="60" rx="6" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
<text x="56" y="654" class="label" fill="#9A5F0D">DAT HET VERSCHIL MAAKT</text>
<text x="56" y="674" class="sub">als we dit begrip verkeerd om behandelen, wat gaat er dan mis — en wie merkt dat als eerste?</text>
</svg>