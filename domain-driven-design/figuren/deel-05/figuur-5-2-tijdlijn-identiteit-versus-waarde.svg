<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    </defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 5 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Dossier 5216 — hetzelfde blokje, een nieuw blokje</text>
<text x="40" y="96" class="sub">De entity "nabestaande" blijft hetzelfde blokje; het bedrag wordt bij wijziging een nieuw blokje.</text>
<line x1="80" y1="180" x2="880" y2="180" class="blue-line" stroke-width="2"/>
<circle cx="140" cy="180" r="6" fill="#2563A8"/>
<text x="140" y="165" text-anchor="middle" class="sub">t0 — toekenning</text>
<circle cx="400" cy="180" r="6" fill="#2563A8"/>
<text x="400" y="165" text-anchor="middle" class="sub">t1 — verhuizing</text>
<circle cx="660" cy="180" r="6" fill="#2563A8"/>
<text x="660" y="165" text-anchor="middle" class="sub">t2 — hertrouwd</text>
<rect x="90" y="220" width="780" height="80" rx="8" class="blue-dark" fill="#2563A8"/>
<text x="480" y="250" text-anchor="middle" class="label-light">nabestaande — één en hetzelfde blokje, de hele tijdlijn door</text>
<text x="200" y="280" text-anchor="middle" class="sub-light" font-size="11">naam: mevr. X</text>
<text x="480" y="280" text-anchor="middle" class="sub-light" font-size="11">adres: Kerkstraat 12 → Dorpsweg 8</text>
<text x="760" y="280" text-anchor="middle" class="sub-light" font-size="11">achternaam wijzigt</text>
<text x="90" y="340" class="sub" font-weight="700">bedrag (value object) — bij wijziging: nieuw blokje ernaast</text>
<rect x="90" y="360" width="220" height="70" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="200" y="390" text-anchor="middle" class="sub" font-weight="700">€ 512,40</text>
<text x="200" y="410" text-anchor="middle" class="sub" font-size="11">eerste vaststelling</text>
<rect x="350" y="360" width="220" height="70" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="460" y="390" text-anchor="middle" class="sub" font-weight="700">€ 512,40</text>
<text x="460" y="410" text-anchor="middle" class="sub" font-size="11">ongewijzigd</text>
<rect x="610" y="360" width="220" height="70" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.5"/>
<text x="720" y="390" text-anchor="middle" class="sub" font-weight="700">€ 498,15</text>
<text x="720" y="410" text-anchor="middle" class="sub" font-size="11">na herziening</text>
<text x="480" y="470" text-anchor="middle" class="sub" fill="#9A5F0D">een gewijzigd bedrag is geen aangepast bedrag — het is een ander bedrag, ernaast</text>
</svg>