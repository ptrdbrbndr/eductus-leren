<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:21px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-a { stroke:#E9A13B; stroke-width:2; fill:none; marker-end:url(#arra); }
    </style>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
    </defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">CASUSDOSSIER · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Het Meridiaan-landschap — vijf blokken, nog geen relaties</text>
<text x="40" y="96" class="sub" text-anchor="start">Het startbeeld van deel 11: vijf systemen die elk voor zich zijn gebouwd, en nooit gezamenlijk in kaart</text>
<text x="40" y="113" class="sub" text-anchor="start">gebracht.</text>
<rect x="40" y="260" width="146" height="130" rx="8" fill="#CBDCEF" stroke="#2563A8" stroke-width="1.5"/>
<text x="113.0" y="319.0" text-anchor="middle" class="label">KERN</text>
<text x="113.0" y="337.0" text-anchor="middle" class="sub">polisadministratie</text>
<text x="113.0" y="352.0" text-anchor="middle" class="sub">(sinds jaren '90)</text>
<rect x="226" y="260" width="146" height="130" rx="8" fill="#CBDCEF" stroke="#2563A8" stroke-width="1.5"/>
<text x="299.0" y="319.0" text-anchor="middle" class="label">Werkgevers- portaal</text>
<text x="299.0" y="337.0" text-anchor="middle" class="sub">4.800 werkgevers melden</text>
<text x="299.0" y="352.0" text-anchor="middle" class="sub">mutaties</text>
<rect x="412" y="260" width="146" height="130" rx="8" fill="#CBDCEF" stroke="#2563A8" stroke-width="1.5"/>
<text x="485.0" y="319.0" text-anchor="middle" class="label">Mutatie- platform</text>
<text x="485.0" y="337.0" text-anchor="middle" class="sub">nog te bouwen — ambitie</text>
<text x="485.0" y="352.0" text-anchor="middle" class="sub">+ eerste stukken</text>
<rect x="598" y="260" width="146" height="130" rx="8" fill="#CBDCEF" stroke="#2563A8" stroke-width="1.5"/>
<text x="671.0" y="319.0" text-anchor="middle" class="label">Nabestaanden- loket</text>
<text x="671.0" y="337.0" text-anchor="middle" class="sub">niveau 1, in productie,</text>
<text x="671.0" y="352.0" text-anchor="middle" class="sub">grens al getrokken</text>
<rect x="784" y="260" width="146" height="130" rx="8" fill="#CBDCEF" stroke="#2563A8" stroke-width="1.5"/>
<text x="857.0" y="319.0" text-anchor="middle" class="label">Wegwijzer</text>
<text x="857.0" y="337.0" text-anchor="middle" class="sub">toont, beslist niets</text>
<text x="480" y="460" text-anchor="middle" class="kicker">vijf applicaties, nooit gezamenlijk beschreven — geen enkele relatie hier getekend</text>
</svg>