<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    </defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">CASUSDOSSIER · TIJDLIJN</text>
<text x="40" y="64" class="title">WGP 2.0 — van directiebesluit tot stopzetting</text>
<line x1="80" y1="330" x2="900" y2="330" class="blue-line" stroke-width="3"/>
<circle cx="80" cy="330" r="9" fill="#2563A8"/>
<text x="80" y="300" text-anchor="middle" class="sub" font-weight="700" fill="#14213D">Directiebesluit</text>
<text x="80" y="282" text-anchor="middle" class="sub">maand 0</text>
<text x="80" y="320" text-anchor="middle" class="sub" font-style="italic">"we vervangen het werkgeversportaal"</text>
<text x="80" y="336" text-anchor="middle" class="sub" font-style="italic">— vóór iemand het probleem kende</text>
<circle cx="270" cy="330" r="9" fill="#2563A8"/>
<text x="270" y="365" text-anchor="middle" class="sub" font-weight="700" fill="#14213D">Specificatie klaar</text>
<text x="270" y="381" text-anchor="middle" class="sub">maand 7</text>
<text x="270" y="401" text-anchor="middle" class="sub" font-style="italic">functioneel ontwerp,</text>
<text x="270" y="417" text-anchor="middle" class="sub" font-style="italic">340 pagina's</text>
<circle cx="470" cy="330" r="9" fill="#2563A8"/>
<text x="470" y="300" text-anchor="middle" class="sub" font-weight="700" fill="#14213D">Bouw klaar</text>
<text x="470" y="282" text-anchor="middle" class="sub">maand 20</text>
<text x="470" y="320" text-anchor="middle" class="sub" font-style="italic">13 maanden bouw</text>
<circle cx="620" cy="330" r="9" fill="#2563A8"/>
<text x="620" y="365" text-anchor="middle" class="sub" font-weight="700" fill="#14213D">Livegang</text>
<text x="620" y="381" text-anchor="middle" class="sub">maand 20</text>
<text x="620" y="401" text-anchor="middle" class="sub" font-style="italic">4 op de 10 mutaties niet</text>
<text x="620" y="417" text-anchor="middle" class="sub" font-style="italic">af te handelen via het portaal</text>
<circle cx="860" cy="330" r="9" fill="#2563A8"/>
<text x="860" y="300" text-anchor="middle" class="sub" font-weight="700" fill="#14213D">Stopgezet</text>
<text x="860" y="282" text-anchor="middle" class="sub">maand 26</text>
<text x="860" y="320" text-anchor="middle" class="sub" font-style="italic">ruim vóór de geplande</text>
<text x="860" y="336" text-anchor="middle" class="sub" font-style="italic">tweede fase</text>
<rect x="200" y="440" width="560" height="70" rx="8" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
<text x="480" y="465" text-anchor="middle" class="label" fill="#9A5F0D">Wat er níet stukging</text>
<text x="480" y="486" text-anchor="middle" class="sub">de software werkt, nauwelijks storingen — en toch is er niets bereikt</text>
</svg>