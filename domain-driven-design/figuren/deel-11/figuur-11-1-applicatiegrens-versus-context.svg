<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .blue-line { stroke:#1A4F8B; }
      .blue-fill { fill:#C5D8F0; }
      .blue-mid { fill:#8AAFD4; }
      .blue-dark { fill:#1A4F8B; }
      .amber { stroke:#E8A020; }
      .amber-fill { fill:#E8A020; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .sub-light { font-size:12px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:21px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#5B6675; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-a { stroke:#E8A020; stroke-width:2; fill:none; marker-end:url(#arra); }
    </style>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5B6675"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1A4F8B"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E8A020"/></marker>
    </defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 11 · CONCEPTDIAGRAM</text>
<text x="40" y="60" class="title-sm">Applicatiegrenzen naast een eerste verdeling in bounded contexts</text>
<text x="40" y="88" class="sub" text-anchor="start">Wat er al bestaat (boven) tegenover een voorlopige, nog niet definitieve indeling in kandidaat-modelgrenzen</text>
<text x="40" y="105" class="sub" text-anchor="start">(onder).</text>
<text x="40" y="160" text-anchor="start" class="kicker">APPLICATIEGRENZEN (bestaand)</text>
<rect x="40" y="180" width="146" height="90" rx="8" fill="#E4E1D8" stroke="#5B6675" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="113.0" y="229.0" text-anchor="middle" class="label">KERN</text>
<rect x="226" y="180" width="146" height="90" rx="8" fill="#E4E1D8" stroke="#5B6675" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="299.0" y="229.0" text-anchor="middle" class="label">Werkgevers- portaal</text>
<rect x="412" y="180" width="146" height="90" rx="8" fill="#E4E1D8" stroke="#5B6675" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="485.0" y="229.0" text-anchor="middle" class="label">Mutatie- platform</text>
<rect x="598" y="180" width="146" height="90" rx="8" fill="#E4E1D8" stroke="#5B6675" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="671.0" y="229.0" text-anchor="middle" class="label">Nabestaanden- loket</text>
<rect x="784" y="180" width="146" height="90" rx="8" fill="#E4E1D8" stroke="#5B6675" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="857.0" y="229.0" text-anchor="middle" class="label">Wegwijzer</text>
<path d="M480 290 L480 330" class="arrow"/>
<text x="40" y="370" text-anchor="start" class="kicker">KANDIDAAT-BOUNDED-CONTEXTS (voorlopig)</text>
<rect x="40" y="390" width="300" height="90" rx="8" fill="#C5D8F0" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="190.0" y="439.0" text-anchor="middle" class="label">KERN: bron van 'huidige situatie'</text>
<rect x="360" y="390" width="300" height="90" rx="8" fill="#C5D8F0" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="510.0" y="439.0" text-anchor="middle" class="label">Werkgeversportaal: bron van gemelde wijzigingen</text>
<rect x="680" y="390" width="244" height="90" rx="8" fill="#C5D8F0" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="802.0" y="439.0" text-anchor="middle" class="label">Wegwijzer: toont, zonder zeggenschap</text>
<text x="40" y="595" class="sub" text-anchor="start">De contextgrenzen vallen niet één-op-één samen met de applicatieblokken erboven.</text></svg>