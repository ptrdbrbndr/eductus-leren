<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="'DM Sans', Arial, sans-serif" width="960" height="380" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:21px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-a { stroke:#E9A13B; stroke-width:2; fill:none; marker-end:url(#arra); }
    </style>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
    </defs>
<rect width="960" height="380" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 20 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Vier teamvormen, drie samenwerkingslijnen</text>
<text x="40" y="96" class="sub" text-anchor="start">Elke vorm met een systeem uit het landschap als voorbeeld, plus drie manieren waarop teamparen samenwerken.</text>
<rect x="40" y="140" width="210" height="90" rx="8" fill="#CBDCEF" stroke="#2563A8" stroke-width="1.5"/>
<text x="145.0" y="179.0" text-anchor="middle" class="label">stroomgericht</text>
<text x="145.0" y="197.0" text-anchor="middle" class="sub">Nabestaandenloket</text>
<rect x="270" y="140" width="210" height="90" rx="8" fill="#CBDCEF" stroke="#2563A8" stroke-width="1.5"/>
<text x="375.0" y="179.0" text-anchor="middle" class="label">voorzienend</text>
<text x="375.0" y="197.0" text-anchor="middle" class="sub">gedeelde infra</text>
<rect x="500" y="140" width="210" height="90" rx="8" fill="#CBDCEF" stroke="#2563A8" stroke-width="1.5"/>
<text x="605.0" y="179.0" text-anchor="middle" class="label">ondersteunend</text>
<text x="605.0" y="197.0" text-anchor="middle" class="sub">Foppe (coach)</text>
<rect x="730" y="140" width="210" height="90" rx="8" fill="#CBDCEF" stroke="#2563A8" stroke-width="1.5"/>
<text x="835.0" y="179.0" text-anchor="middle" class="label">specialistisch</text>
<text x="835.0" y="197.0" text-anchor="middle" class="sub">actuariële berekening (KERN)</text>
<path d="M180 320 L380 320" class="arrow-b"/>
<text x="280" y="340" text-anchor="middle" class="kicker">intensief, tijdelijk</text>
<path d="M380 320 L580 320" class="arrow-b"/>
<text x="480" y="340" text-anchor="middle" class="kicker">als dienst</text>
<path d="M580 320 L780 320" class="arrow-b"/>
<text x="680" y="340" text-anchor="middle" class="kicker">tijdelijk ondersteunend</text>
</svg>