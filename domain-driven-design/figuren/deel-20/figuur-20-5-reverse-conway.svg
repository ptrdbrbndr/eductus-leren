<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="'DM Sans', Arial, sans-serif" width="960" height="440" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .blue-line { stroke:#1A4F8B; }
      .blue-fill { fill:#C5D8F0; }
      .blue-mid { fill:#8AAFD4; }
      .blue-dark { fill:#1A4F8B; }
      .amber { stroke:#E8A020; }
      .amber-fill { fill:#E8A020; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .sub-light { font-size:12px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:21px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#5B6675; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-a { stroke:#E8A020; stroke-width:2; fill:none; marker-end:url(#arra); }
    </style>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5B6675"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1A4F8B"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E8A020"/></marker>
    </defs>
<rect width="960" height="440" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 20 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Twee richtingen, één besluit</text>
<text x="40" y="96" class="sub" text-anchor="start">Organisatie → architectuur (ongestuurd) tegenover gewenste architectuur → organisatie (bewust) — wie neemt</text>
<text x="40" y="113" class="sub" text-anchor="start">dit besluit?</text>
<rect x="80" y="160" width="300" height="90" rx="8" fill="#E4E1D8" stroke="#5B6675" stroke-width="1.5"/>
<text x="230.0" y="209.0" text-anchor="middle" class="label">organisatie</text>
<path d="M380 205 L600 205" class="arrow"/>
<rect x="600" y="160" width="300" height="90" rx="8" fill="#C5D8F0" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="750.0" y="209.0" text-anchor="middle" class="label">architectuur</text>
<text x="480" y="190" text-anchor="middle" class="kicker">Conway's Law (ongestuurd)</text>
<rect x="600" y="320" width="300" height="90" rx="8" fill="#C5D8F0" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="750.0" y="369.0" text-anchor="middle" class="label">gewenste architectuur</text>
<path d="M600 365 L380 365" class="arrow-a"/>
<rect x="80" y="320" width="300" height="90" rx="8" fill="#E4E1D8" stroke="#5B6675" stroke-width="1.5"/>
<text x="230.0" y="369.0" text-anchor="middle" class="label">organisatie</text>
<text x="480" y="305" text-anchor="middle" class="kicker">reverse Conway (bewust)</text>
<rect x="420" y="240" width="120" height="34" rx="6" fill="#E8A020"/>
<text x="480" y="262" text-anchor="middle" class="sub" font-size="10" fill="#0D1B2A">wie beslist?</text>
</svg>