<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 722" font-family="'DM Sans', Arial, sans-serif" width="960" height="722" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .blue-line { stroke:#1A4F8B; }
      .blue-fill { fill:#C5D8F0; }
      .blue-mid { fill:#8AAFD4; }
      .blue-dark { fill:#1A4F8B; }
      .amber { stroke:#E8A020; }
      .amber-fill { fill:#E8A020; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .sub-light { font-size:12px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:21px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#5B6675; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-a { stroke:#E8A020; stroke-width:2; fill:none; marker-end:url(#arra); }
    </style>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5B6675"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1A4F8B"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E8A020"/></marker>
    </defs>
<rect width="960" height="722" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 20 · INSTRUMENT</text>
<text x="40" y="64" class="title">De teamgrenskaart</text>
<text x="40" y="90" class="sub" text-anchor="start">Vaststellen of de teamstructuur een contextgrens ondersteunt of tegenwerkt — ingevuld voor Wegwijzer-KERN.</text>
<circle cx="58" cy="164" r="14" fill="#1A4F8B"/>
<text x="58" y="169" text-anchor="middle" class="field-num" font-size="12" font-weight="700" fill="#FFFFFF">1</text>
<rect x="40" y="184" width="880" height="62" rx="6" fill="#FFFFFF" class="blue-line" stroke-width="1.5"/>
<text x="56" y="206" class="label">BENOEM DE CONTEXTGRENS EN HET PATROON</text>
<text x="56" y="226" class="sub" text-anchor="start">Wegwijzer-KERN, conformist (deel 14)</text>
<circle cx="58" cy="276" r="14" fill="#1A4F8B"/>
<text x="58" y="281" text-anchor="middle" class="field-num" font-size="12" font-weight="700" fill="#FFFFFF">2</text>
<rect x="40" y="296" width="880" height="62" rx="6" fill="#FFFFFF" class="blue-line" stroke-width="1.5"/>
<text x="56" y="318" class="label">BESCHRIJF DE TEAMS IN CONWAY-TERMEN</text>
<text x="56" y="338" class="sub" text-anchor="start">Wegwijzer: klein, nieuw, weinig onderhandelingspositie — historisch toeval, geen bewuste keuze</text>
<circle cx="58" cy="388" r="14" fill="#1A4F8B"/>
<text x="58" y="393" text-anchor="middle" class="field-num" font-size="12" font-weight="700" fill="#FFFFFF">3</text>
<rect x="40" y="408" width="880" height="62" rx="6" fill="#FFFFFF" class="blue-line" stroke-width="1.5"/>
<text x="56" y="430" class="label">TOETS TEAMVORM EN SAMENWERKINGSMANIER TEGEN HET PATROON</text>
<text x="56" y="450" class="sub" text-anchor="start">de derde manier (tijdelijk ondersteunend) ontbreekt — niemand heeft Wegwijzer ooit geholpen onafhankelijker te worden</text>
<circle cx="58" cy="500" r="14" fill="#1A4F8B"/>
<text x="58" y="505" text-anchor="middle" class="field-num" font-size="12" font-weight="700" fill="#FFFFFF">4</text>
<rect x="40" y="520" width="880" height="62" rx="6" fill="#FFFFFF" class="blue-line" stroke-width="1.5"/>
<text x="56" y="542" class="label">FORMULEER EEN REVERSE CONWAY-VOORSTEL, MET DE BESLISSER BENOEMD</text>
<text x="56" y="562" class="sub" text-anchor="start">tijdelijke ondersteuning vanuit KERN, geen teamuitbreiding — besluit ligt bij Iris</text>
<circle cx="58" cy="613" r="15" fill="#E8A020"/>
<path d="M52 613 l4 4 l8 -9" stroke="#0D1B2A" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="632" width="880" height="60" rx="6" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>
<text x="56" y="654" class="label" fill="#8A5A0E">DAT HET VERSCHIL MAAKT</text>
<text x="56" y="674" class="sub" text-anchor="start">als niemand deze mismatch benoemt, welke contextgrens verschuift er dan vanzelf — en naar wat, als de organisatie het</text>
<text x="56" y="691" class="sub" text-anchor="start">overneemt?</text>
</svg>