<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .blue-line { stroke:#1A4F8B; }
      .blue-fill { fill:#C5D8F0; }
      .blue-mid { fill:#8AAFD4; }
      .blue-dark { fill:#1A4F8B; }
      .amber { stroke:#E8A020; }
      .amber-fill { fill:#E8A020; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .sub-light { font-size:12px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#5B6675; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5B6675"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1A4F8B"/></marker>
    </defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 10 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">De negen instrumenten van niveau 1</text>
<rect x="60" y="100" width="840" height="40" fill="#1A4F8B"/>
<text x="90" y="126" class="label-light" font-size="12">#</text>
<text x="140" y="126" class="label-light" font-size="12">INSTRUMENT</text>
<text x="400" y="126" class="label-light" font-size="12">KERNVRAAG</text>
<rect x="60" y="140" width="840" height="46" fill="#FFFFFF"/>
<circle cx="90" cy="163" r="14" fill="#1A4F8B"/>
<text x="90" y="168" text-anchor="middle" class="label-light" font-size="12">1</text>
<text x="140" y="168" class="sub" font-weight="700">Complexiteitstoets</text>
<text x="400" y="168" class="sub">Rechtvaardigt dit onderdeel de investering van DDD?</text>
<rect x="60" y="186" width="840" height="46" fill="#F0EDE4"/>
<circle cx="90" cy="209" r="14" fill="#1A4F8B"/>
<text x="90" y="214" text-anchor="middle" class="label-light" font-size="12">2</text>
<text x="140" y="214" class="sub" font-weight="700">Taalkaart</text>
<text x="400" y="214" class="sub">Betekent dit woord voor iedereen hetzelfde?</text>
<rect x="60" y="232" width="840" height="46" fill="#FFFFFF"/>
<circle cx="90" cy="255" r="14" fill="#1A4F8B"/>
<text x="90" y="260" text-anchor="middle" class="label-light" font-size="12">3</text>
<text x="140" y="260" class="sub" font-weight="700">Domeinindeling</text>
<text x="400" y="260" class="sub">Core, supporting of generic?</text>
<rect x="60" y="278" width="840" height="46" fill="#F0EDE4"/>
<circle cx="90" cy="301" r="14" fill="#1A4F8B"/>
<text x="90" y="306" text-anchor="middle" class="label-light" font-size="12">4</text>
<text x="140" y="306" class="sub" font-weight="700">Modeltoets</text>
<text x="400" y="306" class="sub">Is dit de kaart, of al het terrein?</text>
<rect x="60" y="324" width="840" height="46" fill="#FFFFFF"/>
<circle cx="90" cy="347" r="14" fill="#1A4F8B"/>
<text x="90" y="352" text-anchor="middle" class="label-light" font-size="12">5</text>
<text x="140" y="352" class="sub" font-weight="700">Objectkeuzeblad</text>
<text x="400" y="352" class="sub">Entity of value object?</text>
<rect x="60" y="370" width="840" height="46" fill="#F0EDE4"/>
<circle cx="90" cy="393" r="14" fill="#1A4F8B"/>
<text x="90" y="398" text-anchor="middle" class="label-light" font-size="12">6</text>
<text x="140" y="398" class="sub" font-weight="700">Aggregaatschets</text>
<text x="400" y="398" class="sub">Wat moet gegarandeerd samen kloppen?</text>
<rect x="60" y="416" width="840" height="46" fill="#FFFFFF"/>
<circle cx="90" cy="439" r="14" fill="#1A4F8B"/>
<text x="90" y="444" text-anchor="middle" class="label-light" font-size="12">7</text>
<text x="140" y="444" class="sub" font-weight="700">Gebeurtenislijst</text>
<text x="400" y="444" class="sub">Wat is er gebeurd, onveranderlijk?</text>
<rect x="60" y="462" width="840" height="46" fill="#F0EDE4"/>
<circle cx="90" cy="485" r="14" fill="#1A4F8B"/>
<text x="90" y="490" text-anchor="middle" class="label-light" font-size="12">8</text>
<text x="140" y="490" class="sub" font-weight="700">Bouwsteenkaart</text>
<text x="400" y="490" class="sub">Welke bouwsteen draagt dit gedrag?</text>
<rect x="60" y="508" width="840" height="46" fill="#FFFFFF"/>
<circle cx="90" cy="531" r="14" fill="#1A4F8B"/>
<text x="90" y="536" text-anchor="middle" class="label-light" font-size="12">9</text>
<text x="140" y="536" class="sub" font-weight="700">Contextgrens</text>
<text x="400" y="536" class="sub">Waar houdt onze taal op geldig te zijn?</text>
</svg>