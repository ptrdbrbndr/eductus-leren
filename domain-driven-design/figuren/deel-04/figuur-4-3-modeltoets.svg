<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 834" font-family="'DM Sans', Arial, sans-serif" width="960" height="834" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .amber { stroke:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; letter-spacing:.02em; }
      .sub { font-size:12px; fill:#55606F; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .field-num { font-size:12px; font-weight:700; fill:#FFFFFF; }
    </style>
</defs>
<rect width="960" height="834" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 4 · INSTRUMENT</text>
<text x="40" y="64" class="title">De modeltoets</text>
<text x="40" y="96" class="sub">Een opgesteld modelfragment beoordelen: is dit nog de kaart, of is het al het terrein?</text>
<circle cx="58" cy="164" r="14" fill="#2563A8"/>
<text x="58" y="169" text-anchor="middle" class="field-num">1</text>
<rect x="40" y="184" width="880" height="62" rx="6" fill="#FFFFFF" class="blue-line" stroke-width="1.5"/>
<text x="56" y="206" class="label">HERKENT DE DOMEINEXPERT ELK BEGRIP ZONDER TECHNISCHE UITLEG</text>
<text x="56" y="226" class="sub">leg het fragment aan Willemijn voor — struikelt ze over een woord, en waarom?</text>
<circle cx="58" cy="276" r="14" fill="#2563A8"/>
<text x="58" y="281" text-anchor="middle" class="field-num">2</text>
<rect x="40" y="296" width="880" height="62" rx="6" fill="#FFFFFF" class="blue-line" stroke-width="1.5"/>
<text x="56" y="318" class="label">SPREEKT HET DE TAALKAART-TAAL, OF TECHNISCHE TAAL</text>
<text x="56" y="338" class="sub">"dossier" en "melding", of "Dossier" met een status_code?</text>
<circle cx="58" cy="388" r="14" fill="#2563A8"/>
<text x="58" y="393" text-anchor="middle" class="field-num">3</text>
<rect x="40" y="408" width="880" height="62" rx="6" fill="#FFFFFF" class="blue-line" stroke-width="1.5"/>
<text x="56" y="430" class="label">BESTAAT ELK VELD VANWEGE HET DOMEIN, OF VANWEGE DE TECHNIEK</text>
<text x="56" y="450" class="sub">zou dit veld blijven bestaan als we morgen van database wisselen?</text>
<circle cx="58" cy="500" r="14" fill="#2563A8"/>
<text x="58" y="505" text-anchor="middle" class="field-num">4</text>
<rect x="40" y="520" width="880" height="62" rx="6" fill="#FFFFFF" class="blue-line" stroke-width="1.5"/>
<text x="56" y="542" class="label">OVERLEEFT HET MODEL EEN TECHNISCHE VERANDERING</text>
<text x="56" y="562" class="sub">blijft het model overeind bij een ander opslagmechanisme, of moet het meeveranderen?</text>
<circle cx="58" cy="612" r="14" fill="#2563A8"/>
<text x="58" y="617" text-anchor="middle" class="field-num">5</text>
<rect x="40" y="632" width="880" height="62" rx="6" fill="#FFFFFF" class="blue-line" stroke-width="1.5"/>
<text x="56" y="654" class="label">KAN HET FRAGMENT DE REGEL UITLEGGEN, OF ALLEEN HET GEGEVEN VASTLEGGEN</text>
<text x="56" y="674" class="sub">geeft het een aanknopingspunt voor "waarom is dit zo besloten"?</text>
<circle cx="58" cy="725" r="15" fill="#E9A13B"/>
<path d="M52 725 l4 4 l8 -9" stroke="#14213D" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="744" width="880" height="60" rx="6" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
<text x="56" y="766" class="label" fill="#9A5F0D">DAT HET VERSCHIL MAAKT</text>
<text x="56" y="786" class="sub">als dit modelonderdeel samenvalt met de implementatie, wat kunnen we niet meer los aanpassen — en wie merkt dat het eerst?</text>
</svg>