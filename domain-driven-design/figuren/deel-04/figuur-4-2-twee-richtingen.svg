<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .blue-line { stroke:#1A4F8B; }
      .blue-fill { fill:#C5D8F0; }
      .blue-mid { fill:#8AAFD4; }
      .blue-dark { fill:#1A4F8B; }
      .amber { stroke:#E8A020; }
      .amber-fill { fill:#E8A020; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .sub-light { font-size:12px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#5B6675; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5B6675"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1A4F8B"/></marker>
    </defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 4 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Twee manieren om de kaart kwijt te raken</text>
<circle cx="260" cy="300" r="55" class="blue-dark" fill="#1A4F8B"/>
<text x="260" y="295" text-anchor="middle" class="label-light" font-size="12">domein-</text>
<text x="260" y="312" text-anchor="middle" class="label-light" font-size="12">model</text>
<path d="M310 260 C400 180, 520 160, 610 150" class="arrow"/>
<rect x="600" y="110" width="260" height="90" rx="8" fill="#FFFFFF" stroke="#5B6675" stroke-dasharray="4 3"/>
<text x="730" y="140" text-anchor="middle" class="sub" font-weight="700">Model drijft weg</text>
<text x="730" y="160" text-anchor="middle" class="sub">mooi op het whiteboard,</text>
<text x="730" y="178" text-anchor="middle" class="sub">niemand vindt het in de code terug</text>
<path d="M280 350 C370 440, 500 470, 610 480" class="arrow"/>
<rect x="600" y="440" width="260" height="90" rx="8" fill="#FFFFFF" stroke="#5B6675" stroke-dasharray="4 3"/>
<text x="730" y="470" text-anchor="middle" class="sub" font-weight="700">Model = implementatie</text>
<text x="730" y="490" text-anchor="middle" class="sub">Dossier met partnertype_code —</text>
<text x="730" y="508" text-anchor="middle" class="sub">een tabelontwerp verkleed als model</text>
<rect x="60" y="540" width="840" height="50" rx="8" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5"/>
<text x="480" y="570" text-anchor="middle" class="sub" fill="#8A5A0E">Beide valkuilen delen één patroon: het model stopt de taal van Willemijn te spreken</text>
</svg>