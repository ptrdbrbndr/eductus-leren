<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .blue-line { stroke:#1A4F8B; }
      .blue-fill { fill:#C5D8F0; }
      .blue-mid { fill:#8AAFD4; }
      .blue-dark { fill:#1A4F8B; }
      .amber { stroke:#E8A020; }
      .amber-fill { fill:#E8A020; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .sub-light { font-size:12px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#5B6675; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5B6675"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1A4F8B"/></marker>
    </defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 8 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">De repository als poort naar de opslag</text>
<rect x="80" y="200" width="260" height="140" rx="8" class="blue-fill" fill="#C5D8F0" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="210" y="240" text-anchor="middle" class="label">Domeinmodel</text>
<text x="210" y="265" text-anchor="middle" class="sub">"geef mij dossier 5216"</text>
<text x="210" y="290" text-anchor="middle" class="sub">Willemijn, Rutger, Tijmen</text>
<rect x="410" y="215" width="140" height="110" rx="10" class="blue-dark" fill="#1A4F8B" stroke="#E8A020" stroke-width="3"/>
<text x="480" y="260" text-anchor="middle" class="label-light" font-size="13">Repository</text>
<text x="480" y="282" text-anchor="middle" class="sub-light" font-size="10">alleen aggregate</text>
<text x="480" y="296" text-anchor="middle" class="sub-light" font-size="10">roots erdoorheen</text>
<rect x="620" y="200" width="260" height="140" rx="8" fill="#0D1B2A"/>
<text x="750" y="240" text-anchor="middle" class="label-light">Opslag</text>
<text x="750" y="265" text-anchor="middle" class="sub-light">database, bestand,</text>
<text x="750" y="285" text-anchor="middle" class="sub-light">opgeslagen gebeurtenissen —</text>
<text x="750" y="305" text-anchor="middle" class="sub-light">niet bekend aan het model</text>
<path d="M340 270 L408 270" class="arrow-b"/>
<path d="M550 270 L618 270" class="arrow-b"/>
<text x="480" y="410" text-anchor="middle" class="sub" fill="#8A5A0E">niet "alleen de onderbouwing" — de repository geeft altijd het complete dossier, via de root</text>
</svg>