<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    </defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 8 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">De repository als poort naar de opslag</text>
<rect x="80" y="200" width="260" height="140" rx="8" class="blue-fill" fill="#CBDCEF" stroke="#2563A8" stroke-width="1.5"/>
<text x="210" y="240" text-anchor="middle" class="label">Domeinmodel</text>
<text x="210" y="265" text-anchor="middle" class="sub">"geef mij dossier 5216"</text>
<text x="210" y="290" text-anchor="middle" class="sub">Willemijn, Rutger, Tijmen</text>
<rect x="410" y="215" width="140" height="110" rx="10" class="blue-dark" fill="#2563A8" stroke="#E9A13B" stroke-width="3"/>
<text x="480" y="260" text-anchor="middle" class="label-light" font-size="13">Repository</text>
<text x="480" y="282" text-anchor="middle" class="sub-light" font-size="10">alleen aggregate</text>
<text x="480" y="296" text-anchor="middle" class="sub-light" font-size="10">roots erdoorheen</text>
<rect x="620" y="200" width="260" height="140" rx="8" fill="#14213D"/>
<text x="750" y="240" text-anchor="middle" class="label-light">Opslag</text>
<text x="750" y="265" text-anchor="middle" class="sub-light">database, bestand,</text>
<text x="750" y="285" text-anchor="middle" class="sub-light">opgeslagen gebeurtenissen —</text>
<text x="750" y="305" text-anchor="middle" class="sub-light">niet bekend aan het model</text>
<path d="M340 270 L408 270" class="arrow-b"/>
<path d="M550 270 L618 270" class="arrow-b"/>
<text x="480" y="410" text-anchor="middle" class="sub" fill="#9A5F0D">niet "alleen de onderbouwing" — de repository geeft altijd het complete dossier, via de root</text>
</svg>