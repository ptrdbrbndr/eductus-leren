<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    </defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 8 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Vier meldingsroutes, één factory, één geldig dossier</text>
<rect x="90" y="130" width="160" height="70" rx="8" fill="#FFFFFF" stroke="#55606F" stroke-dasharray="4 3"/>
<text x="170" y="160" text-anchor="middle" class="sub" font-weight="700">Telefoontje</text>
<text x="170" y="178" text-anchor="middle" class="sub" font-weight="700">nabestaande</text>
<path d="M170 200 L480 270" class="arrow-b"/>
<rect x="310" y="130" width="160" height="70" rx="8" fill="#FFFFFF" stroke="#55606F" stroke-dasharray="4 3"/>
<text x="390" y="160" text-anchor="middle" class="sub" font-weight="700">Brief</text>
<text x="390" y="178" text-anchor="middle" class="sub" font-weight="700">notaris</text>
<path d="M390 200 L480 270" class="arrow-b"/>
<rect x="530" y="130" width="160" height="70" rx="8" fill="#FFFFFF" stroke="#55606F" stroke-dasharray="4 3"/>
<text x="610" y="160" text-anchor="middle" class="sub" font-weight="700">BRP-</text>
<text x="610" y="178" text-anchor="middle" class="sub" font-weight="700">signaal</text>
<path d="M610 200 L480 270" class="arrow-b"/>
<rect x="750" y="130" width="160" height="70" rx="8" fill="#FFFFFF" stroke="#55606F" stroke-dasharray="4 3"/>
<text x="830" y="160" text-anchor="middle" class="sub" font-weight="700">Melding</text>
<text x="830" y="178" text-anchor="middle" class="sub" font-weight="700">werkgever</text>
<path d="M830 200 L480 270" class="arrow-b"/>
<rect x="330" y="270" width="300" height="90" rx="10" class="blue-dark" fill="#2563A8"/>
<text x="480" y="305" text-anchor="middle" class="label-light">Factory</text>
<text x="480" y="328" text-anchor="middle" class="sub-light" font-size="11">controleert bestaand dossier, meldingstype,</text>
<text x="480" y="345" text-anchor="middle" class="sub-light" font-size="11">geldige beginstand</text>
<path d="M480 362 L480 430" class="arrow-b"/>
<rect x="380" y="430" width="200" height="70" rx="8" class="amber-fill" fill="#E9A13B"/>
<text x="480" y="470" text-anchor="middle" class="label" fill="#14213D">één geldig dossier</text>
<text x="480" y="550" text-anchor="middle" class="sub" fill="#9A5F0D">ongeacht de route: altijd dezelfde bewaakte weg naar een geldig ontstaan dossier</text>
</svg>