<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:21px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-a { stroke:#E9A13B; stroke-width:2; fill:none; marker-end:url(#arra); }
    </style>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
    </defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 18 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Eén aggregate, twee schrijvende teamvlakken versus één</text>
<text x="40" y="96" class="sub" text-anchor="start">Links: twee teams schrijven onafhankelijk rechtstreeks in dezelfde aggregate. Rechts: één team, zoals in</text>
<text x="40" y="113" class="sub" text-anchor="start">niveau 1.</text>
<rect x="60" y="180" width="300" height="140" rx="8" fill="#DFDCD3" stroke="#B33A3A" stroke-width="1.5"/>
<text x="210.0" y="244.0" text-anchor="middle" class="label">dienstverband</text>
<text x="210.0" y="262.0" text-anchor="middle" class="sub">2 teams schrijven rechtstreeks</text>
<path d="M70 150 L150 182" class="arrow-a"/>
<path d="M320 150 L240 182" class="arrow-a"/>
<text x="90" y="140" text-anchor="start" class="kicker">team KERN</text>
<text x="260" y="140" text-anchor="start" class="kicker">team MP</text>
<rect x="600" y="180" width="300" height="140" rx="8" fill="#CBDCEF" stroke="#2563A8" stroke-width="1.5"/>
<text x="750.0" y="244.0" text-anchor="middle" class="label">dienstverband</text>
<text x="750.0" y="262.0" text-anchor="middle" class="sub">1 team schrijft</text>
<path d="M750 150 L750 182" class="arrow-b"/>
<text x="715" y="140" text-anchor="start" class="kicker">één team</text>
</svg>