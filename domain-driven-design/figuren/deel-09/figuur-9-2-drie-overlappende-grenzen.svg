<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .blue-line { stroke:#1A4F8B; }
      .blue-fill { fill:#C5D8F0; }
      .blue-mid { fill:#8AAFD4; }
      .blue-dark { fill:#1A4F8B; }
      .amber { stroke:#E8A020; }
      .amber-fill { fill:#E8A020; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .sub-light { font-size:12px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#5B6675; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5B6675"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1A4F8B"/></marker>
    </defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 9 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Organisatiegrens, systeemgrens, modelgrens — niet hetzelfde</text>
<circle cx="400" cy="320" r="170" fill="#1A4F8B" fill-opacity="0.25" stroke="#1A4F8B" stroke-width="2"/>
<circle cx="560" cy="320" r="170" fill="#E8A020" fill-opacity="0.20" stroke="#E8A020" stroke-width="2"/>
<circle cx="480" cy="230" r="150" fill="#5B6675" fill-opacity="0.15" stroke="#5B6675" stroke-width="2"/>
<text x="290" y="400" text-anchor="middle" class="sub" font-weight="700" fill="#1A4F8B">organisatiegrens</text>
<text x="290" y="418" text-anchor="middle" class="sub" fill="#1A4F8B">Uitvoering algemeen</text>
<text x="670" y="400" text-anchor="middle" class="sub" font-weight="700" fill="#8A5A0E">systeemgrens</text>
<text x="670" y="418" text-anchor="middle" class="sub" fill="#8A5A0E">polisadministratie</text>
<text x="480" y="160" text-anchor="middle" class="sub" font-weight="700" fill="#5B6675">modelgrens</text>
<text x="480" y="178" text-anchor="middle" class="sub" fill="#5B6675">bounded context</text>
<text x="480" y="570" text-anchor="middle" class="sub" fill="#0D1B2A">de grens van het model volgt de samenhang van de taal, niet het organigram of het systeem</text>
</svg>