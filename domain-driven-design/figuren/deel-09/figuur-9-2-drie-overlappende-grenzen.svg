<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    </defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 9 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Organisatiegrens, systeemgrens, modelgrens — niet hetzelfde</text>
<circle cx="400" cy="320" r="170" fill="#2563A8" fill-opacity="0.25" stroke="#2563A8" stroke-width="2"/>
<circle cx="560" cy="320" r="170" fill="#E9A13B" fill-opacity="0.20" stroke="#E9A13B" stroke-width="2"/>
<circle cx="480" cy="230" r="150" fill="#55606F" fill-opacity="0.15" stroke="#55606F" stroke-width="2"/>
<text x="290" y="400" text-anchor="middle" class="sub" font-weight="700" fill="#2563A8">organisatiegrens</text>
<text x="290" y="418" text-anchor="middle" class="sub" fill="#2563A8">Uitvoering algemeen</text>
<text x="670" y="400" text-anchor="middle" class="sub" font-weight="700" fill="#9A5F0D">systeemgrens</text>
<text x="670" y="418" text-anchor="middle" class="sub" fill="#9A5F0D">polisadministratie</text>
<text x="480" y="160" text-anchor="middle" class="sub" font-weight="700" fill="#55606F">modelgrens</text>
<text x="480" y="178" text-anchor="middle" class="sub" fill="#55606F">bounded context</text>
<text x="480" y="570" text-anchor="middle" class="sub" fill="#14213D">de grens van het model volgt de samenhang van de taal, niet het organigram of het systeem</text>
</svg>