<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    </defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 9 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">De bounded context van het Nabestaandenloket</text>
<rect x="300" y="180" width="360" height="260" rx="10" class="blue-fill" fill="#CBDCEF" stroke="#2563A8" stroke-width="2"/>
<text x="480" y="220" text-anchor="middle" class="label">Nabestaandenloket</text>
<text x="480" y="245" text-anchor="middle" class="sub">melding → dossier → vaststelling</text>
<text x="480" y="263" text-anchor="middle" class="sub">→ toekenning/afwijzing</text>
<rect x="60" y="240" width="200" height="70" rx="8" fill="#FFFFFF" stroke="#55606F" stroke-dasharray="4 3"/>
<text x="160" y="270" text-anchor="middle" class="sub" font-weight="700">Polisadministratie</text>
<text x="160" y="290" text-anchor="middle" class="sub" font-size="11">BSN, deelnemersgegevens</text>
<circle cx="290" cy="275" r="10" fill="#E9A13B"/>
<path d="M260 275 L300 275" class="arrow-b"/>
<rect x="700" y="330" width="200" height="70" rx="8" fill="#FFFFFF" stroke="#55606F" stroke-dasharray="4 3"/>
<text x="800" y="360" text-anchor="middle" class="sub" font-weight="700">Mutatieplatform</text>
<text x="800" y="380" text-anchor="middle" class="sub" font-size="11">(toekomstig)</text>
<circle cx="670" cy="365" r="10" fill="#E9A13B"/>
<path d="M660 365 L700 365" class="arrow-b"/>
<text x="480" y="480" text-anchor="middle" class="sub" fill="#9A5F0D">inkomend en uitgaand: op elk overgangspunt is een bewuste vertaling nodig</text>
</svg>