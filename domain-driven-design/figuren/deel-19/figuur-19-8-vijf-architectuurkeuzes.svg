<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="'DM Sans', Arial, sans-serif" width="960" height="420" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .blue-line { stroke:#1A4F8B; }
      .blue-fill { fill:#C5D8F0; }
      .blue-mid { fill:#8AAFD4; }
      .blue-dark { fill:#1A4F8B; }
      .amber { stroke:#E8A020; }
      .amber-fill { fill:#E8A020; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .sub-light { font-size:12px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:21px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#5B6675; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-a { stroke:#E8A020; stroke-width:2; fill:none; marker-end:url(#arra); }
    </style>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5B6675"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1A4F8B"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E8A020"/></marker>
    </defs>
<rect width="960" height="420" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 19 · DAGDEEL B · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Vijf systemen, vijf architectuurkeuzes</text>
<text x="40" y="96" class="sub" text-anchor="start">Per systeem het toegekende patroon en het risico dat het afdekt — het landschapsbeeld waar dit deel naartoe</text>
<text x="40" y="113" class="sub" text-anchor="start">werkt.</text>
<rect x="40" y="150" width="160" height="220" rx="8" fill="#C5D8F0" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="120.0" y="254.0" text-anchor="middle" class="label">KERN</text>
<text x="120.0" y="272.0" text-anchor="middle" class="sub">gelaagd + CQRS</text>
<text x="48" y="330" class="sub" text-anchor="start">erosie van 14 jaar</text>
<text x="48" y="347" class="sub" text-anchor="start">tegengaan</text><rect x="216" y="150" width="160" height="220" rx="8" fill="#C5D8F0" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="296.0" y="254.0" text-anchor="middle" class="label">Werkgeversportaal</text>
<text x="296.0" y="272.0" text-anchor="middle" class="sub">gelaagd</text>
<text x="224" y="330" class="sub" text-anchor="start">klein team, eenvoud</text>
<text x="224" y="347" class="sub" text-anchor="start">boven indirectie</text><rect x="392" y="150" width="160" height="220" rx="8" fill="#C5D8F0" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="472.0" y="254.0" text-anchor="middle" class="label">Mutatieplatform</text>
<text x="472.0" y="272.0" text-anchor="middle" class="sub">hexagonaal</text>
<text x="400" y="330" class="sub" text-anchor="start">wisselende adapters,</text>
<text x="400" y="347" class="sub" text-anchor="start">meerdere bronnen</text><rect x="568" y="150" width="160" height="220" rx="8" fill="#C5D8F0" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="648.0" y="254.0" text-anchor="middle" class="label">Nabestaandenloket</text>
<text x="648.0" y="272.0" text-anchor="middle" class="sub">gelaagd</text>
<text x="576" y="330" class="sub" text-anchor="start">klein, stabiel, geen</text>
<text x="576" y="347" class="sub" text-anchor="start">asymmetrie</text><rect x="744" y="150" width="160" height="220" rx="8" fill="#C5D8F0" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="824.0" y="254.0" text-anchor="middle" class="label">Wegwijzer</text>
<text x="824.0" y="272.0" text-anchor="middle" class="sub">CQRS</text>
<text x="752" y="330" class="sub" text-anchor="start">leest alleen,</text>
<text x="752" y="347" class="sub" text-anchor="start">scherpste asymmetrie</text></svg>