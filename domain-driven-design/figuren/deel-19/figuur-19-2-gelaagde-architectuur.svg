<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'DM Sans', Arial, sans-serif" width="960" height="560" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:21px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-a { stroke:#E9A13B; stroke-width:2; fill:none; marker-end:url(#arra); }
    </style>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
    </defs>
<rect width="960" height="560" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 19 · DAGDEEL A · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Vier lagen, afhankelijkheden die naar beneden wijzen</text>
<text x="40" y="96" class="sub" text-anchor="start">Presentatie, applicatie, domein, infrastructuur — met één rode, doorbroken pijl die de uitzondering toont.</text>
<rect x="200" y="130" width="560" height="80" rx="8" fill="#DFDCD3" stroke="#14213D" stroke-width="1"/>
<text x="480.0" y="174.0" text-anchor="middle" class="label">presentatielaag</text>
<rect x="200" y="224" width="560" height="80" rx="8" fill="#6FA3D6" stroke="#14213D" stroke-width="1"/>
<text x="480.0" y="268.0" text-anchor="middle" class="label">applicatielaag</text>
<path d="M480 210 L480 226" class="arrow-b"/>
<rect x="200" y="318" width="560" height="80" rx="8" fill="#2563A8" stroke="#14213D" stroke-width="1"/>
<text x="480.0" y="362.0" text-anchor="middle" class="label-light">domeinlaag</text>
<path d="M480 304 L480 320" class="arrow-b"/>
<rect x="200" y="412" width="560" height="80" rx="8" fill="#55606F" stroke="#14213D" stroke-width="1"/>
<text x="480.0" y="456.0" text-anchor="middle" class="label-light">infrastructuurlaag</text>
<path d="M480 398 L480 414" class="arrow-b"/>
<path d="M200 170 C 100 300, 100 420, 200 466" stroke="#B33A3A" stroke-width="2.2" fill="none" stroke-dasharray="6 4" marker-end="url(#arr)"/>
<text x="70" y="320" text-anchor="middle" class="kicker">uitzondering</text>
</svg>