<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .blue-line { stroke:#1A4F8B; }
      .blue-fill { fill:#C5D8F0; }
      .blue-mid { fill:#8AAFD4; }
      .blue-dark { fill:#1A4F8B; }
      .amber { stroke:#E8A020; }
      .amber-fill { fill:#E8A020; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .sub-light { font-size:12px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#5B6675; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5B6675"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1A4F8B"/></marker>
    </defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 2 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Eén woord, drie ontstaansmomenten</text>
<text x="40" y="96" class="sub">Willemijn, Saïda en Daan gebruiken allemaal het woord "dossier" — voor iets anders.</text>
<circle cx="190" cy="150" r="32" class="blue-mid" fill="#8AAFD4"/>
<text x="190" y="156" text-anchor="middle" class="label-light">W</text>
<text x="190" y="200" text-anchor="middle" class="label">Willemijn</text>
<rect x="60" y="220" width="260" height="110" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="190" y="250" text-anchor="middle" class="sub" font-style="italic">"Zodra er een dossier binnenkomt,</text>
<text x="190" y="270" text-anchor="middle" class="sub" font-style="italic">kijk ik eerst of er een partner is."</text>
<rect x="60" y="350" width="260" height="46" rx="6" class="amber-fill" fill="#E8A020"/>
<text x="190" y="378" text-anchor="middle" class="label" fill="#0D1B2A" font-size="12">ontstaat bij: eerste signaal</text>
<circle cx="480" cy="150" r="32" class="blue-mid" fill="#8AAFD4"/>
<text x="480" y="156" text-anchor="middle" class="label-light">S</text>
<text x="480" y="200" text-anchor="middle" class="label">Saïda</text>
<rect x="350" y="220" width="260" height="110" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="480" y="250" text-anchor="middle" class="sub" font-style="italic">"Een dossier wordt pas geopend</text>
<text x="480" y="270" text-anchor="middle" class="sub" font-style="italic">na de compliance-check."</text>
<rect x="350" y="350" width="260" height="46" rx="6" class="amber-fill" fill="#E8A020"/>
<text x="480" y="378" text-anchor="middle" class="label" fill="#0D1B2A" font-size="12">ontstaat bij: check afgerond</text>
<circle cx="770" cy="150" r="32" class="blue-mid" fill="#8AAFD4"/>
<text x="770" y="156" text-anchor="middle" class="label-light">D</text>
<text x="770" y="200" text-anchor="middle" class="label">Daan</text>
<rect x="640" y="220" width="260" height="110" rx="8" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="770" y="250" text-anchor="middle" class="sub" font-style="italic">"Dossier = rij in tabel DOSSIER,</text>
<text x="770" y="270" text-anchor="middle" class="sub" font-style="italic">aangemaakt bij ontvangst signaal."</text>
<rect x="640" y="350" width="260" height="46" rx="6" class="amber-fill" fill="#E8A020"/>
<text x="770" y="378" text-anchor="middle" class="label" fill="#0D1B2A" font-size="12">ontstaat bij: databaserij</text>
<text x="480" y="450" text-anchor="middle" class="sub" fill="#8A5A0E">Drie gelijk-hebbende rollen, drie momenten — geen begrippenlijst lost dit op met één definitie</text>
</svg>