<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'DM Sans', Arial, sans-serif" width="960" height="460" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .blue-line { stroke:#1A4F8B; }
      .blue-fill { fill:#C5D8F0; }
      .blue-mid { fill:#8AAFD4; }
      .blue-dark { fill:#1A4F8B; }
      .amber { stroke:#E8A020; }
      .amber-fill { fill:#E8A020; }
      .red-fill { fill:#E4E1D8; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .sub-light { font-size:12px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:21px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .field-num { font-size:12px; font-weight:700; fill:#FFFFFF; }
      .arrow { stroke:#5B6675; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-a { stroke:#E8A020; stroke-width:2; fill:none; marker-end:url(#arra); }
</style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5B6675"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1A4F8B"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E8A020"/></marker>
    </defs>
<rect width="960" height="460" class="paper"/>
<text x="40" y="34" text-anchor="start" class="kicker" >DEEL 28 · CONCEPTDIAGRAM</text>
<text x="40" y="64" text-anchor="start" class="title" >Eén vraag, twee lagen</text>
<text x="40" y="90" text-anchor="start" class="sub" >Iris' vraag “op tijd, of goed” gesplitst in een modelleervraag die Daan kan beantwoorden, en een</text>
<text x="40" y="107" text-anchor="start" class="sub" >bestuurlijke vraag die dat niet is.</text>
<rect x="340" y="150" width="280" height="70" rx="6" fill="#1A4F8B" stroke="#1A4F8B" stroke-width="1.5" />
<text x="480.0" y="183.0" text-anchor="middle" class="label-light" >"OP TIJD, OF GOED?"</text>
<rect x="100" y="300" width="320" height="120" rx="6" fill="#C5D8F0" stroke="#1A4F8B" stroke-width="1.5" />
<text x="260.0" y="350.0" text-anchor="middle" class="label" >MODELLEERVRAAG</text>
<text x="260.0" y="369.0" text-anchor="middle" class="sub" >hoe verhouden de modellen zich — Daan beantwoordt</text>
<rect x="540" y="300" width="320" height="120" rx="6" fill="#FFF6E6" stroke="#E8A020" stroke-width="1.5" />
<text x="700.0" y="342.0" text-anchor="middle" class="label" >BESTUURLIJKE VRAAG</text>
<text x="700.0" y="361.0" text-anchor="middle" class="sub" >wie draagt de prijs, is dat aanvaardbaar — niet aan</text>
<text x="700.0" y="376.0" text-anchor="middle" class="sub" >Daan</text>
<path d="M420 220 L260 295" class="arrow"/>
<path d="M540 220 L700 295" class="arrow"/>
</svg>