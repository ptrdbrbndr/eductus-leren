<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="'DM Sans', Arial, sans-serif" width="960" height="500" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .blue-line { stroke:#1A4F8B; }
      .blue-fill { fill:#C5D8F0; }
      .blue-mid { fill:#8AAFD4; }
      .blue-dark { fill:#1A4F8B; }
      .amber { stroke:#E8A020; }
      .amber-fill { fill:#E8A020; }
      .red-fill { fill:#E4E1D8; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .sub-light { font-size:12px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:21px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .field-num { font-size:12px; font-weight:700; fill:#FFFFFF; }
      .arrow { stroke:#5B6675; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-a { stroke:#E8A020; stroke-width:2; fill:none; marker-end:url(#arra); }
</style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5B6675"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1A4F8B"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E8A020"/></marker>
    </defs>
<rect width="960" height="500" class="paper"/>
<text x="40" y="34" text-anchor="start" class="kicker" >DEEL 28 · CONCEPTDIAGRAM</text>
<text x="40" y="64" text-anchor="start" class="title" >"Op tijd of goed" uitgesplitst</text>
<text x="40" y="90" text-anchor="start" class="sub" >Per botsingspunt de modelvraag die Daan beantwoordt, en de uitkomstvraag die hij overdraagt.</text>
<text x="70" y="205" text-anchor="start" class="label" >Waardeoverdracht</text>
<rect x="300" y="170" width="280" height="70" rx="6" fill="#C5D8F0" stroke="#1A4F8B" stroke-width="1.5" />
<text x="440.0" y="195.0" text-anchor="middle" class="label" >modelvraag (Daan)</text>
<text x="440.0" y="214.0" text-anchor="middle" class="sub" >welke richting technisch het zuiverst is</text>
<rect x="610" y="170" width="280" height="70" rx="6" fill="#FFF6E6" stroke="#E8A020" stroke-width="1.5" />
<text x="750.0" y="195.0" text-anchor="middle" class="label" >uitkomstvraag (overgedragen)</text>
<text x="750.0" y="214.0" text-anchor="middle" class="sub" >welk compromis is aanvaardbaar</text>
<text x="70" y="305" text-anchor="start" class="label" >"Partner"</text>
<rect x="300" y="270" width="280" height="70" rx="6" fill="#C5D8F0" stroke="#1A4F8B" stroke-width="1.5" />
<text x="440.0" y="295.0" text-anchor="middle" class="label" >modelvraag (Daan)</text>
<text x="440.0" y="314.0" text-anchor="middle" class="sub" >welk patroon het risico correct modelleert</text>
<rect x="610" y="270" width="280" height="70" rx="6" fill="#FFF6E6" stroke="#E8A020" stroke-width="1.5" />
<text x="750.0" y="295.0" text-anchor="middle" class="label" >uitkomstvraag (overgedragen)</text>
<text x="750.0" y="314.0" text-anchor="middle" class="sub" >is het onomkeerbare risico aanvaardbaar</text>
<text x="70" y="405" text-anchor="start" class="label" >"Deelnemer in opbouw"</text>
<rect x="300" y="370" width="280" height="70" rx="6" fill="#C5D8F0" stroke="#1A4F8B" stroke-width="1.5" />
<text x="440.0" y="395.0" text-anchor="middle" class="label" >modelvraag (Daan)</text>
<text x="440.0" y="414.0" text-anchor="middle" class="sub" >hoe de definitie-drift technisch wordt opgelost</text>
<rect x="610" y="370" width="280" height="70" rx="6" fill="#FFF6E6" stroke="#E8A020" stroke-width="1.5" />
<text x="750.0" y="395.0" text-anchor="middle" class="label" >uitkomstvraag (overgedragen)</text>
<text x="750.0" y="414.0" text-anchor="middle" class="sub" >welke definitie de organisatie kiest</text>
</svg>