<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'DM Sans', Arial, sans-serif" width="960" height="460" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .red-fill { fill:#DFDCD3; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:21px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .field-num { font-size:12px; font-weight:700; fill:#FFFFFF; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-a { stroke:#E9A13B; stroke-width:2; fill:none; marker-end:url(#arra); }
</style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
    </defs>
<rect width="960" height="460" class="paper"/>
<text x="40" y="34" text-anchor="start" class="kicker" >DEEL 28 · CONCEPTDIAGRAM</text>
<text x="40" y="64" text-anchor="start" class="title" >Twee vraagtypen bij één besluit</text>
<text x="40" y="90" text-anchor="start" class="sub" >“Hoe verhouden de modellen zich” (DDD) naast “wie draagt de prijs, en is dat aanvaardbaar”</text>
<text x="40" y="107" text-anchor="start" class="sub" >(bestuurlijk) — met de plek waar ze in de praktijk door elkaar lopen.</text>
<rect x="80" y="190" width="340" height="140" rx="6" fill="#CBDCEF" stroke="#2563A8" stroke-width="1.5" />
<text x="250.0" y="250.0" text-anchor="middle" class="label" >DDD-VRAAG</text>
<text x="250.0" y="269.0" text-anchor="middle" class="sub" >hoe verhouden de modellen zich</text>
<rect x="540" y="190" width="340" height="140" rx="6" fill="#FDF3E3" stroke="#E9A13B" stroke-width="1.5" />
<text x="710.0" y="250.0" text-anchor="middle" class="label" >BESTUURLIJKE VRAAG</text>
<text x="710.0" y="269.0" text-anchor="middle" class="sub" >wie draagt de prijs, is dat aanvaardbaar</text>
<circle cx="480" cy="260" r="26" fill="#FFFFFF" stroke="#B33A3A" stroke-width="2.5"/>
<text x="480" y="267" text-anchor="middle" class="title-sm" >!</text>
<text x="480" y="320" text-anchor="middle" class="sub" >hier lopen ze in de praktijk door elkaar</text>
</svg>