<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .blue-line { stroke:#1A4F8B; }
      .blue-fill { fill:#C5D8F0; }
      .blue-mid { fill:#8AAFD4; }
      .blue-dark { fill:#1A4F8B; }
      .amber { stroke:#E8A020; }
      .amber-fill { fill:#E8A020; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .sub-light { font-size:12px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#5B6675; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5B6675"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1A4F8B"/></marker>
    </defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 3 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Het Meridiaan-domein en zijn subdomeinen</text>
<rect x="50" y="110" width="860" height="470" rx="10" fill="#F0EDE4" stroke="#5B6675" stroke-dasharray="4 3"/>
<text x="70" y="140" class="sub" font-weight="700">DOMAIN — pensioenuitvoering (Meridiaan Pensioen)</text>
<rect x="90" y="160" width="780" height="390" rx="10" class="blue-fill" fill="#C5D8F0" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="110" y="190" class="label">SUBDOMAIN — het Nabestaandenloket</text>
<rect x="120" y="220" width="220" height="90" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="230" y="258" text-anchor="middle" class="sub" font-weight="700">Vaststellen recht op</text>
<text x="230" y="278" text-anchor="middle" class="sub" font-weight="700">partner-/wezenpensioen</text>
<rect x="400" y="220" width="220" height="90" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="510" y="258" text-anchor="middle" class="sub" font-weight="700">Correspondentie-</text>
<text x="510" y="278" text-anchor="middle" class="sub" font-weight="700">adres bijhouden</text>
<rect x="660" y="220" width="220" height="90" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="770" y="258" text-anchor="middle" class="sub" font-weight="700">Documenten</text>
<text x="770" y="278" text-anchor="middle" class="sub" font-weight="700">opslaan</text>
<rect x="120" y="340" width="220" height="90" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="230" y="378" text-anchor="middle" class="sub" font-weight="700">Samenloopberekening</text>
<text x="230" y="398" text-anchor="middle" class="sub" font-weight="700">met UWV</text>
<rect x="400" y="340" width="220" height="90" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="510" y="378" text-anchor="middle" class="sub" font-weight="700">Dossier door de</text>
<text x="510" y="398" text-anchor="middle" class="sub" font-weight="700">stappen volgen</text>
<rect x="660" y="340" width="220" height="90" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="770" y="378" text-anchor="middle" class="sub" font-weight="700">Authenticatie</text>
<text x="770" y="398" text-anchor="middle" class="sub" font-weight="700">medewerkers</text>
<text x="480" y="480" text-anchor="middle" class="sub" font-style="italic">— kandidaat-subdomeinen binnen het Nabestaandenloket, elk met een eigen soort belang —</text>
</svg>