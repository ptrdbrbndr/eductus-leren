<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .blue-line { stroke:#1A4F8B; }
      .blue-fill { fill:#C5D8F0; }
      .blue-mid { fill:#8AAFD4; }
      .blue-dark { fill:#1A4F8B; }
      .amber { stroke:#E8A020; }
      .amber-fill { fill:#E8A020; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .sub-light { font-size:12px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#5B6675; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
    </style>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5B6675"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1A4F8B"/></marker>
    </defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 3 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">De indeling loopt dwars door de tabel DOSSIER</text>
<rect x="140" y="130" width="680" height="70" rx="6" fill="#0D1B2A"/>
<text x="480" y="172" text-anchor="middle" class="label-light">tabel DOSSIER — huidige polisadministratie</text>
<rect x="140" y="230" width="226" height="260" fill="#1A4F8B" stroke="#0D1B2A" stroke-width="1"/>
<text x="253" y="260" text-anchor="middle" font-size="12" fill="#F5F4F0">kolommen, velden</text>
<text x="253" y="278" text-anchor="middle" font-size="12" fill="#F5F4F0">van recht vaststellen</text>
<rect x="367" y="230" width="226" height="260" fill="#8AAFD4" stroke="#0D1B2A" stroke-width="1"/>
<text x="480" y="260" text-anchor="middle" font-size="12" fill="#F5F4F0">kolommen, velden</text>
<text x="480" y="278" text-anchor="middle" font-size="12" fill="#F5F4F0">van adres bijhouden</text>
<rect x="594" y="230" width="226" height="260" fill="#FFFFFF" stroke="#0D1B2A" stroke-width="1"/>
<text x="707" y="260" text-anchor="middle" font-size="12" fill="#0D1B2A">kolommen, velden</text>
<text x="707" y="278" text-anchor="middle" font-size="12" fill="#0D1B2A">van authenticatie</text>
<rect x="150" y="240" width="206" height="80" fill="none" stroke="#E8A020" stroke-width="3" stroke-dasharray="6 4"/>
<text x="253" y="335" text-anchor="middle" class="sub" fill="#8A5A0E" font-weight="700">CORE →</text>
<rect x="150" y="330" width="660" height="150" fill="none" stroke="#E8A020" stroke-width="3" stroke-dasharray="6 4"/>
<text x="480" y="500" text-anchor="middle" class="sub" fill="#8A5A0E">Dezelfde stippellijn-grenzen lopen dwars door alle drie de kolommen — de tabel kent geen onderscheid, het domein wel</text>
</svg>