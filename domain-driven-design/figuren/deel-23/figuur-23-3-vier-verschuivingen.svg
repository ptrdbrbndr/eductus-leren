<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'DM Sans', Arial, sans-serif" width="960" height="560" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .blue-line { stroke:#1A4F8B; }
      .blue-fill { fill:#C5D8F0; }
      .blue-mid { fill:#8AAFD4; }
      .blue-dark { fill:#1A4F8B; }
      .amber { stroke:#E8A020; }
      .amber-fill { fill:#E8A020; }
      .red-fill { fill:#E4E1D8; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .sub-light { font-size:12px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:21px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .field-num { font-size:12px; font-weight:700; fill:#FFFFFF; }
      .arrow { stroke:#5B6675; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-a { stroke:#E8A020; stroke-width:2; fill:none; marker-end:url(#arra); }
</style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5B6675"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1A4F8B"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E8A020"/></marker>
    </defs>
<rect width="960" height="560" class="paper"/>
<text x="40" y="34" text-anchor="start" class="kicker" >DEEL 23 · CONCEPTDIAGRAM</text>
<text x="40" y="64" text-anchor="start" class="title" >Vier verschuivingen werken op het landschap in</text>
<text x="40" y="90" text-anchor="start" class="sub" >Continu wordt eenmalig, de foutmarge krimpt naar nul, er komt een externe toetsende partij, en het</text>
<text x="40" y="107" text-anchor="start" class="sub" >domein breidt uit naar datakwaliteit.</text>
<rect x="80" y="400" width="160" height="90" rx="6" fill="#C5D8F0" stroke="#1A4F8B" stroke-width="1.5" />
<text x="160.0" y="443.0" text-anchor="middle" class="label" >KERN</text>
<rect x="260" y="400" width="160" height="90" rx="6" fill="#C5D8F0" stroke="#1A4F8B" stroke-width="1.5" />
<text x="340.0" y="443.0" text-anchor="middle" class="label" >Mutatie- platform</text>
<rect x="440" y="400" width="160" height="90" rx="6" fill="#C5D8F0" stroke="#1A4F8B" stroke-width="1.5" />
<text x="520.0" y="443.0" text-anchor="middle" class="label" >Werkgevers- portaal</text>
<rect x="620" y="400" width="160" height="90" rx="6" fill="#C5D8F0" stroke="#1A4F8B" stroke-width="1.5" />
<text x="700.0" y="443.0" text-anchor="middle" class="label" >Wegwijzer</text>
<rect x="800" y="400" width="160" height="90" rx="6" fill="#C5D8F0" stroke="#1A4F8B" stroke-width="1.5" />
<text x="880.0" y="443.0" text-anchor="middle" class="label" >Invaar- administratie</text>
<text x="140" y="150" text-anchor="middle" class="label" >continu → eenmalig</text>
<path d="M140 165 L140 395" class="arrow-a"/>
<text x="360" y="150" text-anchor="middle" class="label" >foutmarge → nul</text>
<path d="M360 165 L360 395" class="arrow-a"/>
<text x="580" y="150" text-anchor="middle" class="label" >externe toetsende partij</text>
<path d="M580 165 L580 395" class="arrow-a"/>
<text x="800" y="150" text-anchor="middle" class="label" >domein breidt: datakwaliteit</text>
<path d="M800 165 L800 395" class="arrow-a"/>
</svg>