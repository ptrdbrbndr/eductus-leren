<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="'DM Sans', Arial, sans-serif" width="960" height="500" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .red-fill { fill:#DFDCD3; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:21px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .field-num { font-size:12px; font-weight:700; fill:#FFFFFF; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-a { stroke:#E9A13B; stroke-width:2; fill:none; marker-end:url(#arra); }
</style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
    </defs>
<rect width="960" height="500" class="paper"/>
<text x="40" y="34" text-anchor="start" class="kicker" >DEEL 23 · CONCEPTDIAGRAM</text>
<text x="40" y="64" text-anchor="start" class="title" >Twee uitersten, een middenweg</text>
<text x="40" y="90" text-anchor="start" class="sub" >Alles heroverwegen en niets heroverwegen dragen allebei een risico; de herijkingstoets ligt</text>
<text x="40" y="107" text-anchor="start" class="sub" >ertussenin.</text>
<rect x="60" y="160" width="360" height="220" rx="6" fill="#DFDCD3" stroke="#B33A3A" stroke-width="1.5" />
<text x="240.0" y="252.0" text-anchor="middle" class="label" >ALLES HEROVERWEGEN</text>
<text x="240.0" y="271.0" text-anchor="middle" class="sub" >risico: analyseverlamming, negen maanden verdampen in</text>
<text x="240.0" y="286.0" text-anchor="middle" class="sub" >heropening van elk besluit</text>
<rect x="540" y="160" width="360" height="220" rx="6" fill="#DFDCD3" stroke="#B33A3A" stroke-width="1.5" />
<text x="720.0" y="252.0" text-anchor="middle" class="label" >NIETS HEROVERWEGEN</text>
<text x="720.0" y="271.0" text-anchor="middle" class="sub" >risico: blinde vlek — datakwaliteit en foutmarge zijn niet</text>
<text x="720.0" y="286.0" text-anchor="middle" class="sub" >meer wat ze waren</text>
<rect x="380" y="380" width="200" height="90" rx="6" fill="#FFFFFF" stroke="#E9A13B" stroke-width="1.5" />
<text x="480.0" y="415.0" text-anchor="middle" class="label" >HERIJKINGSTOETS</text>
<text x="480.0" y="434.0" text-anchor="middle" class="sub" >de middenweg</text>
<path d="M300 300 L420 400" class="arrow-a"/>
<path d="M660 300 L540 400" class="arrow-a"/>
</svg>