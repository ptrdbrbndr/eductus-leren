<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="'DM Sans', Arial, sans-serif" width="960" height="500" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .blue-line { stroke:#1A4F8B; }
      .blue-fill { fill:#C5D8F0; }
      .blue-mid { fill:#8AAFD4; }
      .blue-dark { fill:#1A4F8B; }
      .amber { stroke:#E8A020; }
      .amber-fill { fill:#E8A020; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .sub-light { font-size:12px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:21px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#5B6675; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-a { stroke:#E8A020; stroke-width:2; fill:none; marker-end:url(#arra); }
    </style>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5B6675"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1A4F8B"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E8A020"/></marker>
    </defs>
<rect width="960" height="500" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 17 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">De gesplitste gele kaart</text>
<text x="40" y="96" class="sub" text-anchor="start">Twee kolommen naast elkaar, elk met eigen groene voorbeelden — en een rode kaart die tijdens het gesprek</text>
<text x="40" y="113" class="sub" text-anchor="start">naar blauw verhuist.</text>
<rect x="60" y="110" width="410" height="60" rx="8" fill="#E8A020" stroke="#8A5A0E" stroke-width="1"/>
<text x="265.0" y="144.0" text-anchor="middle" class="label">Signaal = directe reden voor navraag</text>
<rect x="490" y="110" width="410" height="60" rx="8" fill="#E8A020" stroke="#8A5A0E" stroke-width="1"/>
<text x="695.0" y="144.0" text-anchor="middle" class="label">Signaal = onderdeel van lopend proces</text>
<rect x="60" y="200" width="410" height="70" rx="8" fill="#C5D8F0" stroke="#1A4F8B" stroke-width="1"/>
<text x="265.0" y="229.0" text-anchor="middle" class="label">adreswijziging partner</text>
<text x="265.0" y="247.0" text-anchor="middle" class="sub">→ gerichte navraag</text>
<rect x="490" y="200" width="410" height="70" rx="8" fill="#C5D8F0" stroke="#1A4F8B" stroke-width="1"/>
<text x="695.0" y="229.0" text-anchor="middle" class="label">gewijzigde begunstigde</text>
<text x="695.0" y="247.0" text-anchor="middle" class="sub">→ al onderdeel van aanvraag</text>
<rect x="60" y="300" width="410" height="70" rx="8" fill="#E4E1D8" stroke="#B33A3A" stroke-width="1.5"/>
<text x="265.0" y="339.0" text-anchor="middle" class="label">wie voert de navraag uit?</text>
<path d="M265 370 L265 410" class="arrow-a"/>
<rect x="60" y="410" width="410" height="60" rx="8" fill="#8AAFD4" stroke="#1A4F8B" stroke-width="1"/>
<text x="265.0" y="444.0" text-anchor="middle" class="label">→ de context die het signaal ontving</text>
</svg>