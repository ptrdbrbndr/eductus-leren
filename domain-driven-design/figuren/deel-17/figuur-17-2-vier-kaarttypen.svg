<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="'DM Sans', Arial, sans-serif" width="960" height="470" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .blue-line { stroke:#1A4F8B; }
      .blue-fill { fill:#C5D8F0; }
      .blue-mid { fill:#8AAFD4; }
      .blue-dark { fill:#1A4F8B; }
      .amber { stroke:#E8A020; }
      .amber-fill { fill:#E8A020; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .sub-light { font-size:12px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:21px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#5B6675; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-a { stroke:#E8A020; stroke-width:2; fill:none; marker-end:url(#arra); }
    </style>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5B6675"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1A4F8B"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E8A020"/></marker>
    </defs>
<rect width="960" height="470" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 17 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">De vier kaarttypen in kleur</text>
<text x="40" y="96" class="sub" text-anchor="start">Geel bovenaan, blauw ernaast, groen eronder in een rij, rood los ertussen.</text>
<rect x="370" y="110" width="220" height="70" rx="8" fill="#E8A020" stroke="#8A5A0E" stroke-width="1"/>
<text x="480.0" y="149.0" text-anchor="middle" class="label">GEEL — de regel</text>
<rect x="680" y="110" width="220" height="70" rx="8" fill="#8AAFD4" stroke="#1A4F8B" stroke-width="1"/>
<text x="790.0" y="149.0" text-anchor="middle" class="label">BLAUW — randvoorwaarde</text>
<rect x="60" y="300" width="300" height="80" rx="8" fill="#C5D8F0" stroke="#1A4F8B" stroke-width="1"/>
<text x="210.0" y="344.0" text-anchor="middle" class="label">GROEN — voorbeeld</text>
<rect x="390" y="300" width="300" height="80" rx="8" fill="#C5D8F0" stroke="#1A4F8B" stroke-width="1"/>
<text x="540.0" y="344.0" text-anchor="middle" class="label">GROEN — voorbeeld</text>
<rect x="720" y="300" width="180" height="80" rx="8" fill="#E4E1D8" stroke="#B33A3A" stroke-width="1.5"/>
<text x="810.0" y="344.0" text-anchor="middle" class="label">ROOD — vraag</text>
<path d="M480 180 L210 298" class="arrow"/>
<path d="M480 180 L540 298" class="arrow"/>
<path d="M210 298 L600 180" class="arrow-a"/>
<text x="60" y="420" text-anchor="start" class="kicker">een groen voorbeeld kan tot een nieuwe blauwe of rode kaart leiden</text>
</svg>