<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="'DM Sans', Arial, sans-serif" width="960" height="440" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:21px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-a { stroke:#E9A13B; stroke-width:2; fill:none; marker-end:url(#arra); }
    </style>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
    </defs>
<rect width="960" height="440" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 17 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Het volledig ingevulde bord voor de ondergrensregel</text>
<text x="40" y="96" class="sub" text-anchor="start">Één gele kaart, één blauwe, twee groene, twee rode.</text>
<rect x="300" y="110" width="360" height="60" rx="8" fill="#E9A13B" stroke="#9A5F0D" stroke-width="1"/>
<text x="480.0" y="144.0" text-anchor="middle" class="label">32u → 6u (17%): bevestiging vereist</text>
<rect x="60" y="210" width="280" height="80" rx="8" fill="#CBDCEF" stroke="#2563A8" stroke-width="1"/>
<text x="200.0" y="244.0" text-anchor="middle" class="label">32u → 6u</text>
<text x="200.0" y="262.0" text-anchor="middle" class="sub">handmatige bevestiging</text>
<rect x="360" y="210" width="280" height="80" rx="8" fill="#CBDCEF" stroke="#2563A8" stroke-width="1"/>
<text x="500.0" y="244.0" text-anchor="middle" class="label">8u → 4u</text>
<text x="500.0" y="262.0" text-anchor="middle" class="sub">referentiepunt onduidelijk</text>
<rect x="660" y="210" width="240" height="80" rx="8" fill="#DFDCD3" stroke="#B33A3A" stroke-width="1.5"/>
<text x="780.0" y="254.0" text-anchor="middle" class="label">ondergrens: % of absoluut aantal uren?</text>
<rect x="60" y="330" width="280" height="80" rx="8" fill="#6FA3D6" stroke="#2563A8" stroke-width="1"/>
<text x="200.0" y="364.0" text-anchor="middle" class="label">tijdelijke wijziging (zorgverlof)</text>
<text x="200.0" y="382.0" text-anchor="middle" class="sub">lichtere regel, geen bevestiging</text>
<rect x="360" y="330" width="540" height="80" rx="8" fill="#DFDCD3" stroke="#B33A3A" stroke-width="1.5"/>
<text x="630.0" y="374.0" text-anchor="middle" class="label">eindresultaat of omvang van elke wijziging? wat bij een reeks kleine wijzigingen?</text>
</svg>