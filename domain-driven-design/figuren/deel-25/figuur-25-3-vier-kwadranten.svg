<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'DM Sans', Arial, sans-serif" width="960" height="560" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .red-fill { fill:#DFDCD3; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:21px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .field-num { font-size:12px; font-weight:700; fill:#FFFFFF; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-a { stroke:#E9A13B; stroke-width:2; fill:none; marker-end:url(#arra); }
</style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
    </defs>
<rect width="960" height="560" class="paper"/>
<path d="M140 480 L820 480" class="arrow"/>
<path d="M140 480 L140 140" class="arrow"/>
<text x="480.0" y="520" text-anchor="middle" class="sub" >kan het domein de tussentijd verdragen →</text>
<text x="60" y="310.0" text-anchor="middle" class="sub" transform="rotate(-90 60 320)">gegarandeerd eindpunt ↑</text>
<rect x="180" y="160" width="300" height="130" rx="6" fill="#CBDCEF" stroke="#2563A8" stroke-width="1.5" />
<text x="330.0" y="215.0" text-anchor="middle" class="label" >eventual consistency</text>
<text x="330.0" y="234.0" text-anchor="middle" class="sub" >veilig, geen actie nodig</text>
<rect x="500" y="160" width="300" height="130" rx="6" fill="#CBDCEF" stroke="#2563A8" stroke-width="1.5" />
<text x="650.0" y="215.0" text-anchor="middle" class="label" >saga met compensatie</text>
<text x="650.0" y="234.0" text-anchor="middle" class="sub" >verdraagt tussentijd niet, wel herstelbaar</text>
<rect x="180" y="320" width="300" height="130" rx="6" fill="#CBDCEF" stroke="#2563A8" stroke-width="1.5" />
<text x="330.0" y="375.0" text-anchor="middle" class="label" >strikte consistentie</text>
<text x="330.0" y="394.0" text-anchor="middle" class="sub" >verdraagt geen tussentijd</text>
<rect x="500" y="320" width="300" height="130" rx="6" fill="#CBDCEF" stroke="#2563A8" stroke-width="1.5" />
<text x="650.0" y="375.0" text-anchor="middle" class="label" >heronderzoek nodig</text>
<text x="650.0" y="394.0" text-anchor="middle" class="sub" >geen garantie, geen tolerantie</text>
</svg>