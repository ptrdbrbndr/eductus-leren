<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="'DM Sans', Arial, sans-serif" width="960" height="500" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .blue-line { stroke:#1A4F8B; }
      .blue-fill { fill:#C5D8F0; }
      .blue-mid { fill:#8AAFD4; }
      .blue-dark { fill:#1A4F8B; }
      .amber { stroke:#E8A020; }
      .amber-fill { fill:#E8A020; }
      .red-fill { fill:#E4E1D8; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .sub-light { font-size:12px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:21px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .field-num { font-size:12px; font-weight:700; fill:#FFFFFF; }
      .arrow { stroke:#5B6675; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-a { stroke:#E8A020; stroke-width:2; fill:none; marker-end:url(#arra); }
</style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5B6675"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1A4F8B"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E8A020"/></marker>
    </defs>
<rect width="960" height="500" class="paper"/>
<text x="40" y="34" text-anchor="start" class="kicker" >DEEL 25 · CONCEPTDIAGRAM</text>
<text x="40" y="64" text-anchor="start" class="title" >Een saga met compenserende stap</text>
<text x="40" y="90" text-anchor="start" class="sub" >Een keten van stappen over drie contexts; bij een mislukte stap werkt een compenserende stap terug</text>
<text x="40" y="107" text-anchor="start" class="sub" >door de al voltooide stappen.</text>
<rect x="100" y="180" width="220" height="100" rx="6" fill="#C5D8F0" stroke="#1A4F8B" stroke-width="1.5" />
<text x="210.0" y="228.0" text-anchor="middle" class="label" >stap 1 KERN</text>
<path d="M320 230 L380 230" class="arrow-b"/>
<rect x="380" y="180" width="220" height="100" rx="6" fill="#C5D8F0" stroke="#1A4F8B" stroke-width="1.5" />
<text x="490.0" y="220.0" text-anchor="middle" class="label" >stap 2 invaar-</text>
<text x="490.0" y="239.0" text-anchor="middle" class="sub" >admin.</text>
<path d="M600 230 L660 230" class="arrow-b"/>
<rect x="660" y="180" width="220" height="100" rx="6" fill="#E4E1D8" stroke="#B33A3A" stroke-width="1.5" />
<text x="770.0" y="220.0" text-anchor="middle" class="label" >stap 3 mutatie-</text>
<text x="770.0" y="239.0" text-anchor="middle" class="sub" >platform (X)</text>
<path d="M540 300 C 400 380, 200 380, 120 300" stroke="#E8A020" stroke-width="2.5" fill="none" marker-end="url(#arra)"/>
<text x="340" y="400" text-anchor="middle" class="sub" >compenserende stap — werkt terug door voltooide stappen</text>
</svg>