<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .blue-line { stroke:#1A4F8B; }
      .blue-fill { fill:#C5D8F0; }
      .blue-mid { fill:#8AAFD4; }
      .blue-dark { fill:#1A4F8B; }
      .amber { stroke:#E8A020; }
      .amber-fill { fill:#E8A020; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .sub-light { font-size:12px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:21px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#5B6675; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-a { stroke:#E8A020; stroke-width:2; fill:none; marker-end:url(#arra); }
    </style>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5B6675"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1A4F8B"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E8A020"/></marker>
    </defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 13 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Drie relatieparen, drie machtsverhoudingen</text>
<text x="40" y="96" class="sub" text-anchor="start">Twee gelijke pijlen voor partnership, een gedeeld middenstuk voor shared kernel, een grote en een kleine</text>
<text x="40" y="113" class="sub" text-anchor="start">pijl voor customer/supplier.</text>
<rect x="40" y="160" width="268" height="110" rx="8" fill="#C5D8F0" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="174.0" y="209.0" text-anchor="middle" class="label">PARTNERSHIP</text>
<text x="174.0" y="227.0" text-anchor="middle" class="sub">Werkgeversportaal ↔ Mutatieplatform</text>
<path d="M90 300 L220 300" class="arrow-b"/>
<path d="M220 315 L90 315" class="arrow-b"/>
<rect x="346" y="160" width="268" height="110" rx="8" fill="#C5D8F0" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="480.0" y="209.0" text-anchor="middle" class="label">SHARED KERNEL</text>
<text x="480.0" y="227.0" text-anchor="middle" class="sub">KERN ↔ Mutatieplatform</text>
<rect x="440" y="295" width="80" height="30" rx="6" fill="#E8A020"/>
<text x="480" y="315" text-anchor="middle" class="sub" font-size="10" fill="#0D1B2A">gedeeld</text>
<rect x="652" y="160" width="268" height="110" rx="8" fill="#C5D8F0" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="786.0" y="209.0" text-anchor="middle" class="label">CUSTOMER/SUPPLIER</text>
<text x="786.0" y="227.0" text-anchor="middle" class="sub">Mutatieplatform ↔ Nabestaandenloket</text>
<path d="M760 300 L860 300" class="arrow-b"/>
<path d="M860 315 L770 315" class="arrow" stroke-width="1"/>
</svg>