<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'DM Sans', Arial, sans-serif" width="960" height="460" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:21px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-a { stroke:#E9A13B; stroke-width:2; fill:none; marker-end:url(#arra); }
    </style>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
    </defs>
<rect width="960" height="460" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 22 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Zeven context-mappingpatronen, één opfrisser</text>
<text x="40" y="96" class="sub" text-anchor="start">Elk patroon met de kernvraag die het beantwoordt en één woord voor het risico van de verkeerde keuze.</text>
<rect x="40" y="118" width="300" height="42" fill="#CBDCEF" stroke="#2563A8" stroke-width="1"/>
<text x="52" y="145" class="label" font-size="12">Partnership</text>
<rect x="340" y="118" width="380" height="42" fill="#FFFFFF" stroke="#55606F" stroke-width="1"/>
<text x="352" y="145" class="sub">wie kan zonder wie niet vooruit?</text>
<rect x="720" y="118" width="200" height="42" fill="#DFDCD3" stroke="#55606F" stroke-width="1"/>
<text x="732" y="145" class="sub" font-size="10">stilzwijgende aanname</text>
<rect x="40" y="164" width="300" height="42" fill="#CBDCEF" stroke="#2563A8" stroke-width="1"/>
<text x="52" y="191" class="label" font-size="12">Shared kernel</text>
<rect x="340" y="164" width="380" height="42" fill="#FFFFFF" stroke="#55606F" stroke-width="1"/>
<text x="352" y="191" class="sub">wie bezit dit begrip samen?</text>
<rect x="720" y="164" width="200" height="42" fill="#DFDCD3" stroke="#55606F" stroke-width="1"/>
<text x="732" y="191" class="sub" font-size="10">dubbele, afwijkende definitie</text>
<rect x="40" y="210" width="300" height="42" fill="#CBDCEF" stroke="#2563A8" stroke-width="1"/>
<text x="52" y="237" class="label" font-size="12">Customer/supplier</text>
<rect x="340" y="210" width="380" height="42" fill="#FFFFFF" stroke="#55606F" stroke-width="1"/>
<text x="352" y="237" class="sub">wie heeft zeggenschap?</text>
<rect x="720" y="210" width="200" height="42" fill="#DFDCD3" stroke="#55606F" stroke-width="1"/>
<text x="732" y="237" class="sub" font-size="10">onrealistische belofte</text>
<rect x="40" y="256" width="300" height="42" fill="#CBDCEF" stroke="#2563A8" stroke-width="1"/>
<text x="52" y="283" class="label" font-size="12">Conformist</text>
<rect x="340" y="256" width="380" height="42" fill="#FFFFFF" stroke="#55606F" stroke-width="1"/>
<text x="352" y="283" class="sub">is dit bewust of gewoonte?</text>
<rect x="720" y="256" width="200" height="42" fill="#DFDCD3" stroke="#55606F" stroke-width="1"/>
<text x="732" y="283" class="sub" font-size="10">blinde vlek bij wijziging</text>
<rect x="40" y="302" width="300" height="42" fill="#CBDCEF" stroke="#2563A8" stroke-width="1"/>
<text x="52" y="329" class="label" font-size="12">Anti-corruption layer</text>
<rect x="340" y="302" width="380" height="42" fill="#FFFFFF" stroke="#55606F" stroke-width="1"/>
<text x="352" y="329" class="sub">wat beschermen we?</text>
<rect x="720" y="302" width="200" height="42" fill="#DFDCD3" stroke="#55606F" stroke-width="1"/>
<text x="732" y="329" class="sub" font-size="10">onnodig hoge onderhoudskosten</text>
<rect x="40" y="348" width="300" height="42" fill="#CBDCEF" stroke="#2563A8" stroke-width="1"/>
<text x="52" y="375" class="label" font-size="12">Open host service</text>
<rect x="340" y="348" width="380" height="42" fill="#FFFFFF" stroke="#55606F" stroke-width="1"/>
<text x="352" y="375" class="sub">voor wie is dit aanbod?</text>
<rect x="720" y="348" width="200" height="42" fill="#DFDCD3" stroke="#55606F" stroke-width="1"/>
<text x="732" y="375" class="sub" font-size="10">koppeling op maat voor één afnemer</text>
<rect x="40" y="394" width="300" height="42" fill="#CBDCEF" stroke="#2563A8" stroke-width="1"/>
<text x="52" y="421" class="label" font-size="12">Published language</text>
<rect x="340" y="394" width="380" height="42" fill="#FFFFFF" stroke="#55606F" stroke-width="1"/>
<text x="352" y="421" class="sub">welke taal, los van de zender?</text>
<rect x="720" y="394" width="200" height="42" fill="#DFDCD3" stroke="#55606F" stroke-width="1"/>
<text x="732" y="421" class="sub" font-size="10">documentatie in plaats van vertaling</text>
</svg>