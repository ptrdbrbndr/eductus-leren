<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="'DM Sans', Arial, sans-serif" width="960" height="500" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .blue-line { stroke:#1A4F8B; }
      .blue-fill { fill:#C5D8F0; }
      .blue-mid { fill:#8AAFD4; }
      .blue-dark { fill:#1A4F8B; }
      .amber { stroke:#E8A020; }
      .amber-fill { fill:#E8A020; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .sub-light { font-size:12px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:21px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#5B6675; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-a { stroke:#E8A020; stroke-width:2; fill:none; marker-end:url(#arra); }
    </style>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5B6675"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1A4F8B"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E8A020"/></marker>
    </defs>
<rect width="960" height="500" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 22 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Vier rondes, vier bevragende rollen</text>
<text x="40" y="96" class="sub" text-anchor="start">Per ronde de rol die bevraagt en het type vraag dat daarbij hoort.</text>
<rect x="40" y="140" width="220" height="80" rx="8" fill="#C5D8F0" stroke="#1A4F8B" stroke-width="1"/>
<text x="150.0" y="174.0" text-anchor="middle" class="label">Ronde 1</text>
<text x="150.0" y="192.0" text-anchor="middle" class="sub">compliance-adviseur</text>
<rect x="280" y="140" width="640" height="80" rx="8" fill="#FFFFFF" stroke="#5B6675" stroke-width="1"/>
<text x="600.0" y="184.0" text-anchor="middle" class="label">context map en kerndomein</text>
<rect x="40" y="236" width="220" height="80" rx="8" fill="#C5D8F0" stroke="#1A4F8B" stroke-width="1"/>
<text x="150.0" y="270.0" text-anchor="middle" class="label">Ronde 2</text>
<text x="150.0" y="288.0" text-anchor="middle" class="sub">actuaris</text>
<rect x="280" y="236" width="640" height="80" rx="8" fill="#FFFFFF" stroke="#5B6675" stroke-width="1"/>
<text x="600.0" y="280.0" text-anchor="middle" class="label">architectuur en aggregates</text>
<rect x="40" y="332" width="220" height="80" rx="8" fill="#C5D8F0" stroke="#1A4F8B" stroke-width="1"/>
<text x="150.0" y="366.0" text-anchor="middle" class="label">Ronde 3</text>
<text x="150.0" y="384.0" text-anchor="middle" class="sub">bestuurder</text>
<rect x="280" y="332" width="640" height="80" rx="8" fill="#FFFFFF" stroke="#5B6675" stroke-width="1"/>
<text x="600.0" y="376.0" text-anchor="middle" class="label">teams en integratie-events</text>
<rect x="40" y="428" width="220" height="80" rx="8" fill="#C5D8F0" stroke="#1A4F8B" stroke-width="1"/>
<text x="150.0" y="462.0" text-anchor="middle" class="label">Ronde 4</text>
<text x="150.0" y="480.0" text-anchor="middle" class="sub">Iris zelf</text>
<rect x="280" y="428" width="640" height="80" rx="8" fill="#FFFFFF" stroke="#5B6675" stroke-width="1"/>
<text x="600.0" y="472.0" text-anchor="middle" class="label">de samenhang tussen bouwstenen</text>
</svg>