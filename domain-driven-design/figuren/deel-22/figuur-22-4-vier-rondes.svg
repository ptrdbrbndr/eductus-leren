<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="'DM Sans', Arial, sans-serif" width="960" height="500" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:21px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-a { stroke:#E9A13B; stroke-width:2; fill:none; marker-end:url(#arra); }
    </style>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
    </defs>
<rect width="960" height="500" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 22 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Vier rondes, vier bevragende rollen</text>
<text x="40" y="96" class="sub" text-anchor="start">Per ronde de rol die bevraagt en het type vraag dat daarbij hoort.</text>
<rect x="40" y="140" width="220" height="80" rx="8" fill="#CBDCEF" stroke="#2563A8" stroke-width="1"/>
<text x="150.0" y="174.0" text-anchor="middle" class="label">Ronde 1</text>
<text x="150.0" y="192.0" text-anchor="middle" class="sub">compliance-adviseur</text>
<rect x="280" y="140" width="640" height="80" rx="8" fill="#FFFFFF" stroke="#55606F" stroke-width="1"/>
<text x="600.0" y="184.0" text-anchor="middle" class="label">context map en kerndomein</text>
<rect x="40" y="236" width="220" height="80" rx="8" fill="#CBDCEF" stroke="#2563A8" stroke-width="1"/>
<text x="150.0" y="270.0" text-anchor="middle" class="label">Ronde 2</text>
<text x="150.0" y="288.0" text-anchor="middle" class="sub">actuaris</text>
<rect x="280" y="236" width="640" height="80" rx="8" fill="#FFFFFF" stroke="#55606F" stroke-width="1"/>
<text x="600.0" y="280.0" text-anchor="middle" class="label">architectuur en aggregates</text>
<rect x="40" y="332" width="220" height="80" rx="8" fill="#CBDCEF" stroke="#2563A8" stroke-width="1"/>
<text x="150.0" y="366.0" text-anchor="middle" class="label">Ronde 3</text>
<text x="150.0" y="384.0" text-anchor="middle" class="sub">bestuurder</text>
<rect x="280" y="332" width="640" height="80" rx="8" fill="#FFFFFF" stroke="#55606F" stroke-width="1"/>
<text x="600.0" y="376.0" text-anchor="middle" class="label">teams en integratie-events</text>
<rect x="40" y="428" width="220" height="80" rx="8" fill="#CBDCEF" stroke="#2563A8" stroke-width="1"/>
<text x="150.0" y="462.0" text-anchor="middle" class="label">Ronde 4</text>
<text x="150.0" y="480.0" text-anchor="middle" class="sub">Iris zelf</text>
<rect x="280" y="428" width="640" height="80" rx="8" fill="#FFFFFF" stroke="#55606F" stroke-width="1"/>
<text x="600.0" y="472.0" text-anchor="middle" class="label">de samenhang tussen bouwstenen</text>
</svg>