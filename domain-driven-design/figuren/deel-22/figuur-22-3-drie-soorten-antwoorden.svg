<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:21px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-a { stroke:#E9A13B; stroke-width:2; fill:none; marker-end:url(#arra); }
    </style>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
    </defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 22 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Drie soorten antwoorden, nu landschap-breed</text>
<text x="40" y="96" class="sub" text-anchor="start">Oppervlakkig ja, onderbouwd nee, eerlijke onzekerheid — met voorbeelduitspraken over het geheel in plaats</text>
<text x="40" y="113" class="sub" text-anchor="start">van één model.</text>
<rect x="40" y="150" width="268" height="220" rx="8" fill="#DFDCD3" stroke="#14213D" stroke-width="1"/>
<text x="174.0" y="254.0" text-anchor="middle" class="label">OPPERVLAKKIG JA</text>
<text x="174.0" y="272.0" text-anchor="middle" class="sub">losse uitkomsten zonder</text>
<text x="174.0" y="287.0" text-anchor="middle" class="sub">samenhang</text>
<rect x="346" y="150" width="268" height="220" rx="8" fill="#CBDCEF" stroke="#14213D" stroke-width="1"/>
<text x="480.0" y="254.0" text-anchor="middle" class="label">ONDERBOUWD NEE</text>
<text x="480.0" y="272.0" text-anchor="middle" class="sub">alternatief bewust</text>
<text x="480.0" y="287.0" text-anchor="middle" class="sub">afgewezen, met reden</text>
<rect x="652" y="150" width="268" height="220" rx="8" fill="#E9A13B" stroke="#14213D" stroke-width="1"/>
<text x="786.0" y="254.0" text-anchor="middle" class="label">EERLIJKE ONZEKERHEID</text>
<text x="786.0" y="272.0" text-anchor="middle" class="sub">openstaande vraag</text>
<text x="786.0" y="287.0" text-anchor="middle" class="sub">erkend, met reden waarom</text>
<text x="786.0" y="302.0" text-anchor="middle" class="sub">nu nog niet</text>
</svg>