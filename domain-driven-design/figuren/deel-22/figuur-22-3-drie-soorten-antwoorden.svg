<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .blue-line { stroke:#1A4F8B; }
      .blue-fill { fill:#C5D8F0; }
      .blue-mid { fill:#8AAFD4; }
      .blue-dark { fill:#1A4F8B; }
      .amber { stroke:#E8A020; }
      .amber-fill { fill:#E8A020; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .sub-light { font-size:12px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:21px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#5B6675; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-a { stroke:#E8A020; stroke-width:2; fill:none; marker-end:url(#arra); }
    </style>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5B6675"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1A4F8B"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E8A020"/></marker>
    </defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 22 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Drie soorten antwoorden, nu landschap-breed</text>
<text x="40" y="96" class="sub" text-anchor="start">Oppervlakkig ja, onderbouwd nee, eerlijke onzekerheid — met voorbeelduitspraken over het geheel in plaats</text>
<text x="40" y="113" class="sub" text-anchor="start">van één model.</text>
<rect x="40" y="150" width="268" height="220" rx="8" fill="#E4E1D8" stroke="#0D1B2A" stroke-width="1"/>
<text x="174.0" y="254.0" text-anchor="middle" class="label">OPPERVLAKKIG JA</text>
<text x="174.0" y="272.0" text-anchor="middle" class="sub">losse uitkomsten zonder</text>
<text x="174.0" y="287.0" text-anchor="middle" class="sub">samenhang</text>
<rect x="346" y="150" width="268" height="220" rx="8" fill="#C5D8F0" stroke="#0D1B2A" stroke-width="1"/>
<text x="480.0" y="254.0" text-anchor="middle" class="label">ONDERBOUWD NEE</text>
<text x="480.0" y="272.0" text-anchor="middle" class="sub">alternatief bewust</text>
<text x="480.0" y="287.0" text-anchor="middle" class="sub">afgewezen, met reden</text>
<rect x="652" y="150" width="268" height="220" rx="8" fill="#E8A020" stroke="#0D1B2A" stroke-width="1"/>
<text x="786.0" y="254.0" text-anchor="middle" class="label">EERLIJKE ONZEKERHEID</text>
<text x="786.0" y="272.0" text-anchor="middle" class="sub">openstaande vraag</text>
<text x="786.0" y="287.0" text-anchor="middle" class="sub">erkend, met reden waarom</text>
<text x="786.0" y="302.0" text-anchor="middle" class="sub">nu nog niet</text>
</svg>