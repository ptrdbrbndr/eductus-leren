<rect width="960" height="620" class="paper"/>
<text x="40" y="34" text-anchor="start" class="kicker" >DEEL 27 · INSTRUMENT</text>
<text x="40" y="64" text-anchor="start" class="title" >De richtingenkaart</text>
<text x="40" y="90" text-anchor="start" class="sub" >Drie richtingen als rijen, drie kolommen plus het laatste veld — voor elk van de drie botsingspunten</text>
<text x="40" y="107" text-anchor="start" class="sub" >een eigen kaart.</text>
