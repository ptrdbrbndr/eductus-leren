<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="'DM Sans', Arial, sans-serif" width="960" height="520" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .blue-line { stroke:#1A4F8B; }
      .blue-fill { fill:#C5D8F0; }
      .blue-mid { fill:#8AAFD4; }
      .blue-dark { fill:#1A4F8B; }
      .amber { stroke:#E8A020; }
      .amber-fill { fill:#E8A020; }
      .red-fill { fill:#E4E1D8; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .sub-light { font-size:12px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:21px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .field-num { font-size:12px; font-weight:700; fill:#FFFFFF; }
      .arrow { stroke:#5B6675; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-a { stroke:#E8A020; stroke-width:2; fill:none; marker-end:url(#arra); }
</style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5B6675"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1A4F8B"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E8A020"/></marker>
    </defs>
<rect width="960" height="520" class="paper"/>
<text x="40" y="34" text-anchor="start" class="kicker" >DEEL 27 · CONCEPTDIAGRAM</text>
<text x="40" y="64" text-anchor="start" class="title" >Drie richtingen, drie prijzen</text>
<text x="40" y="90" text-anchor="start" class="sub" >Shared kernel, anti-corruption layer, tijdelijk conformist — elk met wat ze beschermen, wat ze</text>
<text x="40" y="107" text-anchor="start" class="sub" >kosten, en wat ze van de organisatie vragen.</text>
<rect x="50" y="160" width="270" height="60" rx="6" fill="#1A4F8B" stroke="#1A4F8B" stroke-width="1.5" />
<text x="185.0" y="188.0" text-anchor="middle" class="label-light" >SHARED KERNEL</text>
<text x="185" y="250" text-anchor="middle" class="sub" >beschermt: één waarheid</text>
<text x="185" y="280" text-anchor="middle" class="sub" >kost: gezamenlijke governance</text>
<text x="185" y="310" text-anchor="middle" class="sub" >vraagt: blijvende discipline</text>
<rect x="350" y="160" width="270" height="60" rx="6" fill="#1A4F8B" stroke="#1A4F8B" stroke-width="1.5" />
<text x="485.0" y="188.0" text-anchor="middle" class="label-light" >ANTI-CORRUPTION LAYER</text>
<text x="485" y="250" text-anchor="middle" class="sub" >beschermt: beide modellen apart</text>
<text x="485" y="280" text-anchor="middle" class="sub" >kost: onderhoud van de vertaling</text>
<text x="485" y="310" text-anchor="middle" class="sub" >vraagt: een eigenaar van de laag</text>
<rect x="650" y="160" width="270" height="60" rx="6" fill="#1A4F8B" stroke="#1A4F8B" stroke-width="1.5" />
<text x="785.0" y="188.0" text-anchor="middle" class="label-light" >TIJDELIJK CONFORMIST</text>
<text x="785" y="250" text-anchor="middle" class="sub" >beschermt: snelheid nu</text>
<text x="785" y="280" text-anchor="middle" class="sub" >kost: verlies bij de volger</text>
<text x="785" y="310" text-anchor="middle" class="sub" >vraagt: houden aan “tijdelijk”</text>
</svg>