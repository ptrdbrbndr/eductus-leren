<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="'DM Sans', Arial, sans-serif" width="960" height="360" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:21px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-a { stroke:#E9A13B; stroke-width:2; fill:none; marker-end:url(#arra); }
    </style>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
    </defs>
<rect width="960" height="360" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 21 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">De partnership, met twee vervolglagen</text>
<text x="40" y="96" class="sub" text-anchor="start">Reeds afgebakende mutaties lopen via een domain event; nieuwe, nog niet afgebakende mutaties houden de</text>
<text x="40" y="113" class="sub" text-anchor="start">partnership nodig.</text>
<rect x="60" y="120" width="840" height="80" rx="8" fill="#CBDCEF" stroke="#2563A8" stroke-width="1"/>
<text x="480.0" y="154.0" text-anchor="middle" class="label">partnership: Werkgeversportaal ↔ Mutatieplatform</text>
<text x="480.0" y="172.0" text-anchor="middle" class="sub">gezamenlijk uitvinden, blijft nodig</text>
<rect x="60" y="230" width="410" height="90" rx="8" fill="#E9A13B" stroke="#9A5F0D" stroke-width="1"/>
<text x="265.0" y="269.0" text-anchor="middle" class="label">reeds afgebakende mutaties</text>
<text x="265.0" y="287.0" text-anchor="middle" class="sub">→ domain event</text>
<rect x="490" y="230" width="410" height="90" rx="8" fill="#FFFFFF" stroke="#55606F" stroke-width="1"/>
<text x="695.0" y="269.0" text-anchor="middle" class="label">nieuwe, nog niet afgebakende mutaties</text>
<text x="695.0" y="287.0" text-anchor="middle" class="sub">→ partnership blijft nodig</text>
</svg>