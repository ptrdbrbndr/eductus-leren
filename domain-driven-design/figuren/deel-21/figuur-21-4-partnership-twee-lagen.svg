<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="'DM Sans', Arial, sans-serif" width="960" height="360" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .blue-line { stroke:#1A4F8B; }
      .blue-fill { fill:#C5D8F0; }
      .blue-mid { fill:#8AAFD4; }
      .blue-dark { fill:#1A4F8B; }
      .amber { stroke:#E8A020; }
      .amber-fill { fill:#E8A020; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .sub-light { font-size:12px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:21px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#5B6675; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-a { stroke:#E8A020; stroke-width:2; fill:none; marker-end:url(#arra); }
    </style>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5B6675"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1A4F8B"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E8A020"/></marker>
    </defs>
<rect width="960" height="360" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 21 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">De partnership, met twee vervolglagen</text>
<text x="40" y="96" class="sub" text-anchor="start">Reeds afgebakende mutaties lopen via een domain event; nieuwe, nog niet afgebakende mutaties houden de</text>
<text x="40" y="113" class="sub" text-anchor="start">partnership nodig.</text>
<rect x="60" y="120" width="840" height="80" rx="8" fill="#C5D8F0" stroke="#1A4F8B" stroke-width="1"/>
<text x="480.0" y="154.0" text-anchor="middle" class="label">partnership: Werkgeversportaal ↔ Mutatieplatform</text>
<text x="480.0" y="172.0" text-anchor="middle" class="sub">gezamenlijk uitvinden, blijft nodig</text>
<rect x="60" y="230" width="410" height="90" rx="8" fill="#E8A020" stroke="#8A5A0E" stroke-width="1"/>
<text x="265.0" y="269.0" text-anchor="middle" class="label">reeds afgebakende mutaties</text>
<text x="265.0" y="287.0" text-anchor="middle" class="sub">→ domain event</text>
<rect x="490" y="230" width="410" height="90" rx="8" fill="#FFFFFF" stroke="#5B6675" stroke-width="1"/>
<text x="695.0" y="269.0" text-anchor="middle" class="label">nieuwe, nog niet afgebakende mutaties</text>
<text x="695.0" y="287.0" text-anchor="middle" class="sub">→ partnership blijft nodig</text>
</svg>