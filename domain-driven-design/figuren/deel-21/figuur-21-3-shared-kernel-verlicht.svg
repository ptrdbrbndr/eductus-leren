<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .blue-line { stroke:#1A4F8B; }
      .blue-fill { fill:#C5D8F0; }
      .blue-mid { fill:#8AAFD4; }
      .blue-dark { fill:#1A4F8B; }
      .amber { stroke:#E8A020; }
      .amber-fill { fill:#E8A020; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .sub-light { font-size:12px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:21px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#5B6675; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-a { stroke:#E8A020; stroke-width:2; fill:none; marker-end:url(#arra); }
    </style>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5B6675"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1A4F8B"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E8A020"/></marker>
    </defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 21 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">De shared kernel, verlicht door een event</text>
<text x="40" y="96" class="sub" text-anchor="start">De shared kernel zelf wordt smaller — alleen de betekenis, niet de dagelijkse feiten, die via het</text>
<text x="40" y="113" class="sub" text-anchor="start">integratie-event lopen.</text>
<rect x="360" y="140" width="240" height="90" rx="8" fill="#E8A020" stroke="#8A5A0E" stroke-width="1"/>
<text x="480.0" y="179.0" text-anchor="middle" class="label">shared kernel</text>
<text x="480.0" y="197.0" text-anchor="middle" class="sub">smaller: alleen de betekenis</text>
<rect x="60" y="280" width="300" height="90" rx="8" fill="#C5D8F0" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="210.0" y="329.0" text-anchor="middle" class="label">KERN</text>
<rect x="600" y="280" width="300" height="90" rx="8" fill="#C5D8F0" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="750.0" y="329.0" text-anchor="middle" class="label">Mutatieplatform</text>
<path d="M360 325 L120 325" class="arrow-b"/>
<path d="M600 325 L660 325" class="arrow-b"/>
<path d="M360 190 L750 280" stroke="#E8A020" stroke-width="3" marker-end="url(#arra)"/>
<text x="600" y="240" text-anchor="middle" class="kicker">integratie-event: dienstverband gewijzigd</text>
<text x="600" y="258" text-anchor="middle" class="kicker">neemt de dagelijkse stroom over</text>
</svg>