<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="'DM Sans', Arial, sans-serif" width="960" height="520" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .blue-line { stroke:#1A4F8B; }
      .blue-fill { fill:#C5D8F0; }
      .blue-mid { fill:#8AAFD4; }
      .blue-dark { fill:#1A4F8B; }
      .amber { stroke:#E8A020; }
      .amber-fill { fill:#E8A020; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .sub-light { font-size:12px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:21px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#5B6675; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-a { stroke:#E8A020; stroke-width:2; fill:none; marker-end:url(#arra); }
    </style>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5B6675"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1A4F8B"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E8A020"/></marker>
    </defs>
<rect width="960" height="520" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 21 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Bron en afnemer, één smalle doorgang</text>
<text x="40" y="96" class="sub" text-anchor="start">Binnen de bron-cirkel het interne model gearceerd als niet zichtbaar voor de afnemer; daartussen één</text>
<text x="40" y="113" class="sub" text-anchor="start">doorgang: het integratie-event.</text>
<circle cx="240" cy="300" r="140" fill="#C5D8F0" stroke="#1A4F8B" stroke-width="2"/>
<circle cx="240" cy="300" r="80" fill="#8AAFD4" fill-opacity="0.5"/>
<text x="240" y="296" text-anchor="middle" class="kicker">bron-context</text>
<text x="240" y="314" text-anchor="middle" class="kicker">intern model — niet zichtbaar</text>
<circle cx="720" cy="300" r="140" fill="#E4E1D8" stroke="#5B6675" stroke-width="2"/>
<text x="720" y="300" text-anchor="middle" class="kicker">afnemer-context</text>
<path d="M380 300 L580 300" stroke="#E8A020" stroke-width="4" marker-end="url(#arra)"/>
<text x="480" y="270" text-anchor="middle" class="kicker">integratie-event</text>
<text x="480" y="288" text-anchor="middle" class="kicker">al vertaald bij vertrek</text>
</svg>