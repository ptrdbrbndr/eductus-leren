<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="'DM Sans', Arial, sans-serif" width="960" height="520" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:21px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-a { stroke:#E9A13B; stroke-width:2; fill:none; marker-end:url(#arra); }
    </style>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
    </defs>
<rect width="960" height="520" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 21 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Bron en afnemer, één smalle doorgang</text>
<text x="40" y="96" class="sub" text-anchor="start">Binnen de bron-cirkel het interne model gearceerd als niet zichtbaar voor de afnemer; daartussen één</text>
<text x="40" y="113" class="sub" text-anchor="start">doorgang: het integratie-event.</text>
<circle cx="240" cy="300" r="140" fill="#CBDCEF" stroke="#2563A8" stroke-width="2"/>
<circle cx="240" cy="300" r="80" fill="#6FA3D6" fill-opacity="0.5"/>
<text x="240" y="296" text-anchor="middle" class="kicker">bron-context</text>
<text x="240" y="314" text-anchor="middle" class="kicker">intern model — niet zichtbaar</text>
<circle cx="720" cy="300" r="140" fill="#DFDCD3" stroke="#55606F" stroke-width="2"/>
<text x="720" y="300" text-anchor="middle" class="kicker">afnemer-context</text>
<path d="M380 300 L580 300" stroke="#E9A13B" stroke-width="4" marker-end="url(#arra)"/>
<text x="480" y="270" text-anchor="middle" class="kicker">integratie-event</text>
<text x="480" y="288" text-anchor="middle" class="kicker">al vertaald bij vertrek</text>
</svg>