<text x="595.0" y="244.0" text-anchor="middle" class="sub" >examenvorm geoefend</text>
<rect x="720" y="170" width="190" height="130" rx="6" fill="#E8A020" stroke="#E8A020" stroke-width="1.5" />
<text x="815.0" y="225.0" text-anchor="middle" class="label" >30</text>
