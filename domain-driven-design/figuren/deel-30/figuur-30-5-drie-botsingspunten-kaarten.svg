<text x="480.0" y="260.0" text-anchor="middle" class="label" >"Partner"</text>
<text x="480.0" y="279.0" text-anchor="middle" class="sub" >bestuur, Nabestaandenloket</text>
<rect x="640" y="190" width="260" height="160" rx="6" fill="#C5D8F0" stroke="#1A4F8B" stroke-width="1.5" />
<text x="770.0" y="260.0" text-anchor="middle" class="label" >"Deelnemer in opbouw"</text>
