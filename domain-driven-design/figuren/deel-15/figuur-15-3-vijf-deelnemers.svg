<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="'DM Sans', Arial, sans-serif" width="960" height="620" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .blue-line { stroke:#1A4F8B; }
      .blue-fill { fill:#C5D8F0; }
      .blue-mid { fill:#8AAFD4; }
      .blue-dark { fill:#1A4F8B; }
      .amber { stroke:#E8A020; }
      .amber-fill { fill:#E8A020; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .sub-light { font-size:12px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:21px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .arrow { stroke:#5B6675; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-a { stroke:#E8A020; stroke-width:2; fill:none; marker-end:url(#arra); }
    </style>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5B6675"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1A4F8B"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E8A020"/></marker>
    </defs>
<rect width="960" height="620" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 15 · DAGDEEL A · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Vijf deelnemers, elk bij zijn eigen systeem</text>
<text x="40" y="96" class="sub" text-anchor="start">Wie waar staat, vóór de sessie begint — positie langs de nog lege wandindeling.</text>
<rect x="40" y="140" width="880" height="60" rx="8" fill="#FFFFFF" stroke="#5B6675" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="480.0" y="174.0" text-anchor="middle" class="label">nog lege wandindeling</text>
<circle cx="113" cy="300" r="34" fill="#C5D8F0" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="113" y="305" text-anchor="middle" class="sub" font-size="10">Vera</text>
<text x="113" y="355" text-anchor="middle" class="sub" font-size="10">(KERN)</text>
<path d="M113 240 L113 266" class="arrow"/>
<circle cx="299" cy="300" r="34" fill="#C5D8F0" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="299" y="305" text-anchor="middle" class="sub" font-size="10">Karsten</text>
<text x="299" y="355" text-anchor="middle" class="sub" font-size="10">(WGP)</text>
<path d="M299 240 L299 266" class="arrow"/>
<circle cx="485" cy="300" r="34" fill="#C5D8F0" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="485" y="305" text-anchor="middle" class="sub" font-size="10">Otto</text>
<text x="485" y="355" text-anchor="middle" class="sub" font-size="10">(MP)</text>
<path d="M485 240 L485 266" class="arrow"/>
<circle cx="671" cy="300" r="34" fill="#C5D8F0" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="671" y="305" text-anchor="middle" class="sub" font-size="10">Priya</text>
<text x="671" y="355" text-anchor="middle" class="sub" font-size="10">(Wegwijzer)</text>
<path d="M671 240 L671 266" class="arrow"/>
<circle cx="857" cy="300" r="34" fill="#C5D8F0" stroke="#1A4F8B" stroke-width="1.5"/>
<text x="857" y="305" text-anchor="middle" class="sub" font-size="10">Willemijn</text>
<text x="857" y="355" text-anchor="middle" class="sub" font-size="10">(NBL)</text>
<path d="M857 240 L857 266" class="arrow"/>
</svg>