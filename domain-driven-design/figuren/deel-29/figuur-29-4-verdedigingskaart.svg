<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="'DM Sans', Arial, sans-serif" width="960" height="640" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .blue-line { stroke:#1A4F8B; }
      .blue-fill { fill:#C5D8F0; }
      .blue-mid { fill:#8AAFD4; }
      .blue-dark { fill:#1A4F8B; }
      .amber { stroke:#E8A020; }
      .amber-fill { fill:#E8A020; }
      .red-fill { fill:#E4E1D8; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .sub-light { font-size:12px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:21px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .field-num { font-size:12px; font-weight:700; fill:#FFFFFF; }
      .arrow { stroke:#5B6675; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-a { stroke:#E8A020; stroke-width:2; fill:none; marker-end:url(#arra); }
</style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5B6675"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1A4F8B"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E8A020"/></marker>
    </defs>
<rect width="960" height="640" class="paper"/>
<text x="40" y="34" text-anchor="start" class="kicker" >DEEL 29 · INSTRUMENT</text>
<text x="40" y="64" text-anchor="start" class="title" >De verdedigingskaart</text>
<text x="40" y="90" text-anchor="start" class="sub" >Structureert de schriftelijke uitwerking als voorbereiding op de mondelinge verdediging.</text>
<circle cx="58" cy="164" r="14" fill="#1A4F8B" stroke="none" stroke-width="0"/>
<text x="58" y="169" text-anchor="middle" class="field-num" >1</text>
<rect x="40" y="184" width="880" height="62" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5" />
<text x="56" y="206" text-anchor="start" class="label" >VELD 1 — DE CLAIM</text>
<text x="56" y="226" text-anchor="start" class="sub" >het gekozen besluit, kort en scherp geformuleerd</text>
<circle cx="58" cy="276" r="14" fill="#1A4F8B" stroke="none" stroke-width="0"/>
<text x="58" y="281" text-anchor="middle" class="field-num" >2</text>
<rect x="40" y="296" width="880" height="62" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5" />
<text x="56" y="318" text-anchor="start" class="label" >VELD 2 — DE ONDERBOUWING, PER ALTERNATIEF SERIEUS OVERWOGEN</text>
<text x="56" y="338" text-anchor="start" class="sub" >elk alternatief expliciet gewogen, niet alleen genoemd om afgeserveerd te worden</text>
<circle cx="58" cy="388" r="14" fill="#1A4F8B" stroke="none" stroke-width="0"/>
<text x="58" y="393" text-anchor="middle" class="field-num" >3</text>
<rect x="40" y="408" width="880" height="62" rx="6" fill="#FFFFFF" stroke="#1A4F8B" stroke-width="1.5" />
<text x="56" y="430" text-anchor="start" class="label" >VELD 3 — WAT BUITEN HET EIGEN MANDAAT VALT</text>
<text x="56" y="450" text-anchor="start" class="sub" >expliciet benoemd, niet verzwegen om voller te lijken</text>
<circle cx="58" cy="500" r="15" fill="#E8A020" stroke="none" stroke-width="0"/>
<path d="M52 500 l4 4 l8 -9" stroke="#0D1B2A" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="40" y="519" width="880" height="60" rx="6" fill="#FFFFFF" stroke="#E8A020" stroke-width="2.5" />
<text x="56" y="541" text-anchor="start" class="label" fill="#8A5A0E">HET VELD DAT HET VERSCHIL MAAKT — DE VRAAG DIE JE HOOPT DAT NIEMAND STELT</text>
<text x="56" y="561" text-anchor="start" class="sub" >zelf het zwakste punt vinden vóór de mondelinge verdediging, in plaats van hopen dat het gemist wordt</text>
</svg>