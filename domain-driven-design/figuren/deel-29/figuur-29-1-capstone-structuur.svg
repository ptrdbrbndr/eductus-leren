<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" font-family="'DM Sans', Arial, sans-serif" width="960" height="460" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#F5F4F0; }
      .blue-line { stroke:#1A4F8B; }
      .blue-fill { fill:#C5D8F0; }
      .blue-mid { fill:#8AAFD4; }
      .blue-dark { fill:#1A4F8B; }
      .amber { stroke:#E8A020; }
      .amber-fill { fill:#E8A020; }
      .red-fill { fill:#E4E1D8; }
      .label { font-size:14px; font-weight:700; fill:#0D1B2A; }
      .label-light { font-size:14px; font-weight:700; fill:#F5F4F0; }
      .sub { font-size:12px; fill:#5B6675; }
      .sub-light { font-size:12px; fill:#E4E1D8; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#0D1B2A; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:21px; fill:#0D1B2A; font-weight:600; }
      .kicker { font-size:11px; fill:#5B6675; letter-spacing:.12em; }
      .field-num { font-size:12px; font-weight:700; fill:#FFFFFF; }
      .arrow { stroke:#5B6675; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#1A4F8B; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-a { stroke:#E8A020; stroke-width:2; fill:none; marker-end:url(#arra); }
</style>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#5B6675"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1A4F8B"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E8A020"/></marker>
    </defs>
<rect width="960" height="460" class="paper"/>
<text x="40" y="34" text-anchor="start" class="kicker" >DEEL 29 · TIJDLIJN</text>
<text x="40" y="64" text-anchor="start" class="title" >De capstone-structuur</text>
<text x="40" y="90" text-anchor="start" class="sub" >Systeemtype kiezen, NDA, twee taken, keuze, drie dagen bedenktijd, schriftelijke uitwerking,</text>
<text x="40" y="107" text-anchor="start" class="sub" >mondelinge verdediging voor twee examinatoren.</text>
<path d="M60 260 L900 260" class="arrow"/>
<circle cx="60.0" cy="260" r="8" fill="#1A4F8B" stroke="none" stroke-width="0"/>
<text x="60.0" y="225" text-anchor="middle" class="sub" >systeemtype</text>
<text x="60.0" y="240" text-anchor="middle" class="sub" >kiezen</text>
<circle cx="200.0" cy="260" r="8" fill="#1A4F8B" stroke="none" stroke-width="0"/>
<text x="200.0" y="240" text-anchor="middle" class="sub" >NDA</text>
<circle cx="340.0" cy="260" r="8" fill="#1A4F8B" stroke="none" stroke-width="0"/>
<text x="340.0" y="225" text-anchor="middle" class="sub" >twee</text>
<text x="340.0" y="240" text-anchor="middle" class="sub" >taken</text>
<circle cx="480.0" cy="260" r="8" fill="#1A4F8B" stroke="none" stroke-width="0"/>
<text x="480.0" y="225" text-anchor="middle" class="sub" >keuze</text>
<text x="480.0" y="240" text-anchor="middle" class="sub" >maken</text>
<circle cx="620.0" cy="260" r="8" fill="#1A4F8B" stroke="none" stroke-width="0"/>
<text x="620.0" y="225" text-anchor="middle" class="sub" >3 dagen</text>
<text x="620.0" y="240" text-anchor="middle" class="sub" >bedenktijd</text>
<circle cx="760.0" cy="260" r="8" fill="#1A4F8B" stroke="none" stroke-width="0"/>
<text x="760.0" y="225" text-anchor="middle" class="sub" >schriftelijke</text>
<text x="760.0" y="240" text-anchor="middle" class="sub" >uitwerking</text>
<circle cx="900.0" cy="260" r="8" fill="#1A4F8B" stroke="none" stroke-width="0"/>
<text x="900.0" y="225" text-anchor="middle" class="sub" >mondelinge</text>
<text x="900.0" y="240" text-anchor="middle" class="sub" >verdediging</text>
</svg>