<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'DM Sans', Arial, sans-serif" width="960" height="560" preserveAspectRatio="xMidYMid meet">
<defs>
    <style>
      .paper { fill:#FBFAF7; }
      .blue-line { stroke:#2563A8; }
      .blue-fill { fill:#CBDCEF; }
      .blue-mid { fill:#6FA3D6; }
      .blue-dark { fill:#2563A8; }
      .amber { stroke:#E9A13B; }
      .amber-fill { fill:#E9A13B; }
      .label { font-size:14px; font-weight:700; fill:#14213D; }
      .label-light { font-size:14px; font-weight:700; fill:#FBFAF7; }
      .sub { font-size:12px; fill:#55606F; }
      .sub-light { font-size:12px; fill:#DFDCD3; }
      .title { font-family:'Cormorant Garamond', Georgia, serif; font-size:25px; fill:#14213D; font-weight:600; }
      .title-sm { font-family:'Cormorant Garamond', Georgia, serif; font-size:21px; fill:#14213D; font-weight:600; }
      .kicker { font-size:11px; fill:#55606F; letter-spacing:.12em; }
      .arrow { stroke:#55606F; stroke-width:1.5; fill:none; marker-end:url(#arr); }
      .arrow-b { stroke:#2563A8; stroke-width:2; fill:none; marker-end:url(#arrb); }
      .arrow-a { stroke:#E9A13B; stroke-width:2; fill:none; marker-end:url(#arra); }
    </style>

    <marker id="arr" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#55606F"/></marker>
    <marker id="arrb" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#2563A8"/></marker>
    <marker id="arra" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#E9A13B"/></marker>
    </defs>
<rect width="960" height="560" class="paper"/>
<text x="40" y="34" class="kicker">DEEL 12 · CONCEPTDIAGRAM</text>
<text x="40" y="64" class="title">Drie concentrische banden: kerndomein, ondersteunend, generiek</text>
<text x="40" y="96" class="sub" text-anchor="start">De vijf Meridiaan-systemen (of delen daarvan), elk in de band waar ze — volgens Meridiaans eigen strategie —</text>
<text x="40" y="113" class="sub" text-anchor="start">thuishoren.</text>
<circle cx="480" cy="320" r="220" fill="#FBFAF7" stroke="#55606F" stroke-width="1.2"/>
<circle cx="480" cy="320" r="150" fill="#DFDCD3" stroke="#55606F" stroke-width="1.2"/>
<circle cx="480" cy="320" r="80" fill="#2563A8"/>
<text x="480" y="318" text-anchor="middle" class="label-light">KERNDOMEIN</text>
<text x="480" y="336" text-anchor="middle" class="sub-light" font-size="10">rechtvaststelling o.b.v.</text>
<text x="480" y="349" text-anchor="middle" class="sub-light" font-size="10">dienstverbandgeschiedenis</text>
<text x="480" y="180" text-anchor="middle" class="label">ONDERSTEUNEND</text>
<text x="480" y="198" text-anchor="middle" class="sub">Wegwijzer · correctiekanaal WGP</text>
<text x="480" y="108" text-anchor="middle" class="label">GENERIEK</text>
<text x="480" y="126" text-anchor="middle" class="sub">authenticatie · documentopslag</text>
</svg>