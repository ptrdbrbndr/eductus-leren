<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
<rect width="1400" height="720" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563A8"/></marker></defs>
<text x="700" y="46" font-family="Cormorant Garamond" font-size="25" font-weight="bold" font-style="normal" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Wat artikel 220e wel en niet uitschakelt — één blokje uit de vier toetsen van deel 5</tspan></text>
<text x="700" y="100" font-family="DM Sans" font-size="16" font-weight="bold" font-style="normal" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Artikel 220e — eerbiedigende werking voor de progressieve premie</tspan></text>
<rect x="90" y="150" width="380" height="190" rx="10" fill="#FFFFFF" stroke="#E3E0D8" stroke-width="1"/>
<rect x="90" y="150" width="380" height="44" rx="10" fill="#B9BFC8" stroke="#E3E0D8" stroke-width="1"/>
<rect x="90" y="184" width="380" height="10" rx="0" fill="#B9BFC8" stroke="none" stroke-width="1"/>
<text x="280" y="177" font-family="DM Sans" font-size="14" font-weight="bold" font-style="normal" fill="#FFFFFF" text-anchor="middle"><tspan x="280" dy="0">Toets 2</tspan></text>
<text x="280" y="230" font-family="DM Sans" font-size="13.5" font-weight="normal" font-style="normal" fill="#14213D" text-anchor="middle"><tspan x="280" dy="0">Premie voor alle</tspan><tspan x="280" dy="17">deelnemers gelijk?</tspan></text>
<rect x="120" y="270" width="320" height="34" rx="6" fill="#F1EEE6" stroke="#E9A13B" stroke-width="1"/>
<text x="280" y="291" font-family="DM Sans" font-size="12.5" font-weight="bold" font-style="normal" fill="#55606F" text-anchor="middle"><tspan x="280" dy="0">uitgeschakeld</tspan></text>
<text x="280" y="322" font-family="DM Sans" font-size="11.5" font-weight="normal" font-style="italic" fill="#55606F" text-anchor="middle"><tspan x="280" dy="0">staffel mag blijven staan</tspan></text>
<line x1="110" y1="170" x2="450" y2="170" stroke="#8A93A0" stroke-width="2"/>
<rect x="510" y="150" width="380" height="190" rx="10" fill="#FFFFFF" stroke="#E3E0D8" stroke-width="1"/>
<rect x="510" y="150" width="380" height="44" rx="10" fill="#14213D" stroke="#E3E0D8" stroke-width="1"/>
<rect x="510" y="184" width="380" height="10" rx="0" fill="#14213D" stroke="none" stroke-width="1"/>
<text x="700" y="177" font-family="DM Sans" font-size="14" font-weight="bold" font-style="normal" fill="#FFFFFF" text-anchor="middle"><tspan x="700" dy="0">Toets 3</tspan></text>
<text x="700" y="230" font-family="DM Sans" font-size="13.5" font-weight="normal" font-style="normal" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Blijft binnen</tspan><tspan x="700" dy="17">de fiscale grens?</tspan></text>
<rect x="540" y="270" width="320" height="34" rx="6" fill="#EAF1F9" stroke="#2563A8" stroke-width="1"/>
<text x="700" y="291" font-family="DM Sans" font-size="12.5" font-weight="bold" font-style="normal" fill="#2563A8" text-anchor="middle"><tspan x="700" dy="0">blijft van kracht</tspan></text>
<text x="700" y="322" font-family="DM Sans" font-size="11.5" font-weight="normal" font-style="italic" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">moet nog worden getoetst</tspan></text>
<rect x="930" y="150" width="380" height="190" rx="10" fill="#FFFFFF" stroke="#E3E0D8" stroke-width="1"/>
<rect x="930" y="150" width="380" height="44" rx="10" fill="#14213D" stroke="#E3E0D8" stroke-width="1"/>
<rect x="930" y="184" width="380" height="10" rx="0" fill="#14213D" stroke="none" stroke-width="1"/>
<text x="1120" y="177" font-family="DM Sans" font-size="14" font-weight="bold" font-style="normal" fill="#FFFFFF" text-anchor="middle"><tspan x="1120" dy="0">Toets 4</tspan></text>
<text x="1120" y="230" font-family="DM Sans" font-size="13.5" font-weight="normal" font-style="normal" fill="#14213D" text-anchor="middle"><tspan x="1120" dy="0">Nabestaandenpensioen</tspan><tspan x="1120" dy="17">naar nieuw kader?</tspan></text>
<rect x="960" y="270" width="320" height="34" rx="6" fill="#EAF1F9" stroke="#2563A8" stroke-width="1"/>
<text x="1120" y="291" font-family="DM Sans" font-size="12.5" font-weight="bold" font-style="normal" fill="#2563A8" text-anchor="middle"><tspan x="1120" dy="0">blijft van kracht</tspan></text>
<text x="1120" y="322" font-family="DM Sans" font-size="11.5" font-weight="normal" font-style="italic" fill="#55606F" text-anchor="middle"><tspan x="1120" dy="0">moet worden aangepast</tspan></text>
<text x="700" y="400" font-family="DM Sans" font-size="13" font-weight="normal" font-style="italic" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">Alleen toets 2 wordt uitgeschakeld — de regeling moet voor het overige worden verbouwd,</tspan></text>
<text x="700" y="420" font-family="DM Sans" font-size="13" font-weight="normal" font-style="italic" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">niet ongewijzigd blijven.</tspan></text>
</svg>