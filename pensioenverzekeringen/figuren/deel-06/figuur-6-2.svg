<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
<rect width="1400" height="720" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563A8"/></marker></defs>
<text x="700" y="46" font-family="Cormorant Garamond" font-size="25" font-weight="bold" font-style="normal" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Twee regelingen naast elkaar in de tijd: de gesloten groep dooft uit</tspan></text>
<line x1="200" y1="420" x2="1220" y2="420" stroke="#DFDCD3" stroke-width="2"/>
<line x1="460" y1="220" x2="460" y2="450" stroke="#E9A13B" stroke-width="2" stroke-dasharray="5,4"/>
<text x="460" y="210" font-family="DM Sans" font-size="12" font-weight="bold" font-style="normal" fill="#14213D" text-anchor="middle"><tspan x="460" dy="0">omzetdatum</tspan></text>
<path d="M200,330 L460,330 L1160,400 L1160,420 L200,420 Z" fill="#2563A8" fill-opacity="0.18" stroke="#2563A8" stroke-width="2"/>
<text x="220" y="320" font-family="DM Sans" font-size="13" font-weight="bold" font-style="normal" fill="#2563A8" text-anchor="start"><tspan x="220" dy="0">Regeling oud — progressieve staffel</tspan></text>
<text x="220" y="400" font-family="DM Sans" font-size="11.5" font-weight="normal" font-style="normal" fill="#55606F" text-anchor="start"><tspan x="220" dy="0">gesloten voor nieuwe instroom,</tspan><tspan x="220" dy="14">populatie dooft geleidelijk uit</tspan></text>
<path d="M460,420 L1220,420 L1220,510 L460,460 Z" fill="#E9A13B" fill-opacity="0.22" stroke="#E9A13B" stroke-width="2"/>
<text x="1200" y="480" font-family="DM Sans" font-size="13" font-weight="bold" font-style="normal" fill="#8A6414" text-anchor="end"><tspan x="1200" dy="0">Regeling nieuw — vlakke premie</tspan></text>
<text x="1200" y="520" font-family="DM Sans" font-size="11.5" font-weight="normal" font-style="normal" fill="#55606F" text-anchor="end"><tspan x="1200" dy="0">open voor iedereen die na</tspan><tspan x="1200" dy="14">de omzetting in dienst komt</tspan></text>
</svg>