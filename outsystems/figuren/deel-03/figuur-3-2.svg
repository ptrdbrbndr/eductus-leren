<text x="558" y="444" font-family="DM Sans" font-size="11" fill="#55606F"><tspan x="558" dy="0">Aangemaakt</tspan></text>

<!-- MeldingDocument junction -->
<rect x="940" y="330" width="230" height="100" rx="6" fill="#FBFAF7" stroke="#2563A8" stroke-width="1.5" stroke-dasharray="3 3"/>
<rect x="940" y="330" width="230" height="34" rx="6" fill="#2563A8" opacity="0.85"/>
<rect x="940" y="352" width="230" height="12" fill="#2563A8" opacity="0.85"/>
<text x="1055" y="353" font-family="DM Sans" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="1055" dy="0">MeldingDocument</tspan></text>
<text x="958" y="384" font-family="DM Sans" font-size="10" fill="#14213D"><tspan x="958" dy="0">tussenentity</tspan></text>
<text x="958" y="402" font-family="DM Sans" font-size="10" fill="#55606F"><tspan x="958" dy="0">MeldingId, DocumentId, GekoppeldOp</tspan></text>

<!-- Document -->
<rect x="1240" y="290" width="150" height="130" rx="6" fill="#F4F6F9" stroke="#2563A8" stroke-width="1.5"/>
<rect x="1240" y="290" width="150" height="34" rx="6" fill="#2563A8"/>
<rect x="1240" y="312" width="150" height="12" fill="#2563A8"/>
<text x="1315" y="313" font-family="DM Sans" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="1315" dy="0">Document</tspan></text>
<text x="1258" y="345" font-family="DM Sans" font-size="11" fill="#14213D"><tspan x="1258" dy="0">Id</tspan></text>
<text x="1258" y="364" font-family="DM Sans" font-size="11" fill="#55606F"><tspan x="1258" dy="0">Bestandsnaam</tspan></text>
<text x="1258" y="383" font-family="DM Sans" font-size="11" fill="#55606F"><tspan x="1258" dy="0">Type</tspan></text>

<!-- connections -->
<!-- Werkgever - Melding -->
<line x1="340" y1="355" x2="540" y2="355" stroke="#14213D" stroke-width="1.75"/>
<text x="358" y="348" font-family="DM Sans" font-size="13" font-weight="bold" fill="#14213D">1</text>
<text x="512" y="348" font-family="DM Sans" font-size="13" font-weight="bold" fill="#14213D">*</text>

<!-- Melding - MeldingStatus -->
<line x1="710" y1="270" x2="710" y2="200" stroke="#14213D" stroke-width="1.75"/>
<text x="716" y="262" font-family="DM Sans" font-size="13" font-weight="bold" fill="#14213D">*</text>
<text x="716" y="212" font-family="DM Sans" font-size="13" font-weight="bold" fill="#14213D">1</text>

<!-- Melding - MeldingDocument -->
<line x1="810" y1="378" x2="940" y2="378" stroke="#14213D" stroke-width="1.75"/>
<text x="822" y="371" font-family="DM Sans" font-size="13" font-weight="bold" fill="#14213D">1</text>
<text x="915" y="371" font-family="DM Sans" font-size="13" font-weight="bold" fill="#14213D">*</text>

<!-- MeldingDocument - Document -->
<line x1="1170" y1="378" x2="1240" y2="378" stroke="#14213D" stroke-width="1.75"/>
<text x="1182" y="371" font-family="DM Sans" font-size="13" font-weight="bold" fill="#14213D">*</text>
<text x="1218" y="371" font-family="DM Sans" font-size="13" font-weight="bold" fill="#14213D">1</text>

<!-- legend -->
<rect x="110" y="470" width="1280" height="180" rx="6" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/>
<text x="130" y="498" font-family="DM Sans" font-size="13" font-weight="bold" fill="#14213D"><tspan x="130" dy="0">Leeswijzer</tspan></text>
<rect x="130" y="514" width="18" height="18" rx="3" fill="#F4F6F9" stroke="#14213D" stroke-width="1.5"/>
<text x="158" y="527" font-family="DM Sans" font-size="12" fill="#55606F"><tspan x="158" dy="0">Gewone entity — reguliere tabel</tspan></text>
<rect x="130" y="542" width="18" height="18" rx="3" fill="#FBF4E6" stroke="#E9A13B" stroke-width="2" stroke-dasharray="4 3"/>
<text x="158" y="555" font-family="DM Sans" font-size="12" fill="#55606F"><tspan x="158" dy="0">Static entity — vaste, type-veilige waardelijst (rijen door developer vastgelegd)</tspan></text>
<rect x="130" y="570" width="18" height="18" rx="3" fill="#FBFAF7" stroke="#2563A8" stroke-width="1.5" stroke-dasharray="2 2"/>
<text x="158" y="583" font-family="DM Sans" font-size="12" fill="#55606F"><tspan x="158" dy="0">Tussenentity — lost many-to-many op, biedt ruimte voor relatie-specifieke attributen</tspan></text>
<text x="130" y="612" font-family="DM Sans" font-size="12" fill="#55606F"><tspan x="130" dy="0">Melding → Werkgever en Melding → MeldingStatus: many-to-one (rechtstreekse foreign key).</tspan></text>
<text x="130" y="632" font-family="DM Sans" font-size="12" fill="#55606F"><tspan x="130" dy="0">Melding ↔ Document: many-to-many, opgelost via de tussenentity MeldingDocument.</tspan></text>
</svg>
