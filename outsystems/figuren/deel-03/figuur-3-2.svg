<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
<rect width="1400" height="720" fill="#FFFFFF"/>
<text x="700" y="48" font-family="Cormorant Garamond" font-size="26" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Relatiediagram: Melding — Werkgever — MeldingStatus — Document</tspan></text>

<!-- Werkgever -->
<rect x="110" y="290" width="230" height="130" rx="6" fill="#F4F6F9" stroke="#2563A8" stroke-width="1.5"/>
