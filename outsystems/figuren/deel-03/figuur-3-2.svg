<text x="128" y="345" font-family="DM Sans" font-size="11" fill="#14213D"><tspan x="128" dy="0">Id</tspan></text>
<text x="128" y="364" font-family="DM Sans" font-size="11" fill="#55606F"><tspan x="128" dy="0">Naam</tspan></text>
<text x="128" y="383" font-family="DM Sans" font-size="11" fill="#55606F"><tspan x="128" dy="0">KvK-nummer</tspan></text>
<text x="128" y="402" font-family="DM Sans" font-size="11" fill="#55606F"><tspan x="128" dy="0">...</tspan></text>

<!-- MeldingStatus (static) -->
<rect x="540" y="80" width="250" height="120" rx="6" fill="#FBF4E6" stroke="#E9A13B" stroke-width="2" stroke-dasharray="7 4"/>
<rect x="540" y="80" width="250" height="34" rx="6" fill="#E9A13B"/>
<rect x="540" y="102" width="250" height="12" fill="#E9A13B"/>
<text x="665" y="103" font-family="DM Sans" font-size="14" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="665" dy="0">MeldingStatus</tspan></text>
<text x="558" y="136" font-family="DM Sans" font-size="10" fill="#14213D"><tspan x="558" dy="0">static entity</tspan></text>
<text x="558" y="154" font-family="DM Sans" font-size="11" fill="#55606F"><tspan x="558" dy="0">Nieuw · InBehandeling</tspan></text>
<text x="558" y="172" font-family="DM Sans" font-size="11" fill="#55606F"><tspan x="558" dy="0">Afgehandeld · Afgewezen</tspan></text>

<!-- Melding (central) -->
<rect x="540" y="270" width="270" height="200" rx="6" fill="#F4F6F9" stroke="#14213D" stroke-width="2"/>
