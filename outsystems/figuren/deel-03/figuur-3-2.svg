<rect x="540" y="294" width="270" height="14" fill="#14213D"/>
<text x="675" y="295" font-family="DM Sans" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="675" dy="0">Melding</tspan></text>
<text x="558" y="330" font-family="DM Sans" font-size="11" fill="#14213D"><tspan x="558" dy="0">Id</tspan></text>
<text x="558" y="349" font-family="DM Sans" font-size="11" fill="#55606F"><tspan x="558" dy="0">WerkgeverId (FK)</tspan></text>
<text x="558" y="368" font-family="DM Sans" font-size="11" fill="#55606F"><tspan x="558" dy="0">MeldingStatusId (FK)</tspan></text>
