<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
<rect width="1400" height="720" fill="#FFFFFF"/>
<text x="700" y="48" font-family="Cormorant Garamond" font-size="26" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Entity-editor met Melding-attributen</tspan></text>

<!-- window frame -->
<rect x="100" y="80" width="1200" height="590" rx="6" fill="#FFFFFF" stroke="#14213D" stroke-width="1.5"/>
<!-- title bar -->
<rect x="100" y="80" width="1200" height="40" rx="6" fill="#14213D"/>
<rect x="100" y="106" width="1200" height="14" fill="#14213D"/>
<circle cx="124" cy="100" r="5" fill="#E9A13B"/>
<circle cx="142" cy="100" r="5" fill="#2563A8"/>
<circle cx="160" cy="100" r="5" fill="#DFDCD3"/>
<text x="700" y="105" font-family="DM Sans" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="700" dy="0">Data — Entity: Melding</tspan></text>

<!-- sidebar -->
<rect x="100" y="120" width="220" height="550" fill="#F4F6F9" stroke="#DFDCD3" stroke-width="1"/>
<text x="120" y="146" font-family="DM Sans" font-size="11" font-weight="bold" fill="#55606F"><tspan x="120" dy="0">ENTITIES</tspan></text>
<rect x="112" y="158" width="196" height="32" rx="4" fill="#2563A8"/>
<text x="124" y="178" font-family="DM Sans" font-size="13" font-weight="bold" fill="#FFFFFF"><tspan x="124" dy="0">Melding</tspan></text>
<rect x="112" y="196" width="196" height="32" rx="4" fill="none"/>
<text x="124" y="216" font-family="DM Sans" font-size="13" fill="#55606F"><tspan x="124" dy="0">Werkgever</tspan></text>
<rect x="112" y="234" width="196" height="32" rx="4" fill="none"/>
<text x="124" y="254" font-family="DM Sans" font-size="13" fill="#55606F"><tspan x="124" dy="0">MeldingStatus</tspan></text>
<text x="255" y="254" font-family="DM Sans" font-size="9" fill="#E9A13B"><tspan x="255" dy="0">static</tspan></text>
<rect x="112" y="272" width="196" height="32" rx="4" fill="none"/>
<text x="124" y="292" font-family="DM Sans" font-size="13" fill="#55606F"><tspan x="124" dy="0">Document</tspan></text>

<!-- main area -->
<text x="345" y="150" font-family="DM Sans" font-size="18" font-weight="bold" fill="#14213D"><tspan x="345" dy="0">Melding</tspan></text>
<text x="345" y="172" font-family="DM Sans" font-size="12" fill="#55606F"><tspan x="345" dy="0">Wie meldt (werkgever, deelnemer), wanneer het verzuim start, en de status</tspan></text>

<!-- toolbar -->
<rect x="345" y="188" width="130" height="28" rx="4" fill="#FBF4E6" stroke="#E9A13B" stroke-width="1.5"/>
<text x="410" y="207" font-family="DM Sans" font-size="11" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="410" dy="0">+ Nieuw attribuut</tspan></text>

<!-- table header -->
<rect x="345" y="230" width="920" height="34" fill="#14213D"/>
<text x="365" y="252" font-family="DM Sans" font-size="12" font-weight="bold" fill="#FFFFFF"><tspan x="365" dy="0">Naam</tspan></text>
<text x="640" y="252" font-family="DM Sans" font-size="12" font-weight="bold" fill="#FFFFFF"><tspan x="640" dy="0">Type</tspan></text>
<text x="850" y="252" font-family="DM Sans" font-size="12" font-weight="bold" fill="#FFFFFF"><tspan x="850" dy="0">Verplicht</tspan></text>
<text x="985" y="252" font-family="DM Sans" font-size="12" font-weight="bold" fill="#FFFFFF"><tspan x="985" dy="0">Sleutel / relatie</tspan></text>

<!-- rows -->
<!-- row 1: Id -->
<rect x="345" y="264" width="920" height="40" fill="#FBFAF7" stroke="#DFDCD3" stroke-width="1"/>
<circle cx="373" cy="284" r="7" fill="#E9A13B"/>
<text x="373" y="288" font-family="DM Sans" font-size="9" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="373" dy="0">#</tspan></text>
<text x="390" y="289" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D"><tspan x="390" dy="0">Id</tspan></text>
<text x="640" y="289" font-family="DM Sans" font-size="12" fill="#55606F"><tspan x="640" dy="0">Integer</tspan></text>
<text x="850" y="289" font-family="DM Sans" font-size="12" fill="#55606F"><tspan x="850" dy="0">—</tspan></text>
<text x="985" y="289" font-family="DM Sans" font-size="12" fill="#2563A8"><tspan x="985" dy="0">technische identifier (automatisch)</tspan></text>

<!-- row 2: WerkgeverId -->
<rect x="345" y="304" width="920" height="40" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/>
<text x="365" y="329" font-family="DM Sans" font-size="12" fill="#14213D"><tspan x="365" dy="0">WerkgeverId</tspan></text>
<text x="640" y="329" font-family="DM Sans" font-size="12" fill="#55606F"><tspan x="640" dy="0">Integer</tspan></text>
<text x="850" y="329" font-family="DM Sans" font-size="12" fill="#55606F"><tspan x="850" dy="0">ja</tspan></text>
<text x="985" y="329" font-family="DM Sans" font-size="12" fill="#2563A8"><tspan x="985" dy="0">FK → Werkgever (many-to-one)</tspan></text>

<!-- row 3: MeldingStatusId -->
<rect x="345" y="344" width="920" height="40" fill="#FBFAF7" stroke="#DFDCD3" stroke-width="1"/>
<text x="365" y="369" font-family="DM Sans" font-size="12" fill="#14213D"><tspan x="365" dy="0">MeldingStatusId</tspan></text>
<text x="640" y="369" font-family="DM Sans" font-size="12" fill="#55606F"><tspan x="640" dy="0">Integer</tspan></text>
<text x="850" y="369" font-family="DM Sans" font-size="12" fill="#55606F"><tspan x="850" dy="0">ja</tspan></text>
<text x="985" y="369" font-family="DM Sans" font-size="12" fill="#2563A8"><tspan x="985" dy="0">FK → MeldingStatus (static entity)</tspan></text>

<!-- row 4: DeelnemerNaam -->
<rect x="345" y="384" width="920" height="40" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/>
<text x="365" y="409" font-family="DM Sans" font-size="12" fill="#14213D"><tspan x="365" dy="0">DeelnemerNaam</tspan></text>
<text x="640" y="409" font-family="DM Sans" font-size="12" fill="#55606F"><tspan x="640" dy="0">Text</tspan></text>
<text x="850" y="409" font-family="DM Sans" font-size="12" fill="#55606F"><tspan x="850" dy="0">ja</tspan></text>
<text x="985" y="409" font-family="DM Sans" font-size="12" fill="#55606F"><tspan x="985" dy="0">—</tspan></text>

<!-- row 5: StartDatum -->
<rect x="345" y="424" width="920" height="40" fill="#FBFAF7" stroke="#DFDCD3" stroke-width="1"/>
<text x="365" y="449" font-family="DM Sans" font-size="12" fill="#14213D"><tspan x="365" dy="0">StartDatum</tspan></text>
<text x="640" y="449" font-family="DM Sans" font-size="12" fill="#55606F"><tspan x="640" dy="0">Date</tspan></text>
<text x="850" y="449" font-family="DM Sans" font-size="12" fill="#55606F"><tspan x="850" dy="0">ja</tspan></text>
<text x="985" y="449" font-family="DM Sans" font-size="12" fill="#55606F"><tspan x="985" dy="0">—</tspan></text>

<!-- row 6: Omschrijving -->
<rect x="345" y="464" width="920" height="40" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/>
<text x="365" y="489" font-family="DM Sans" font-size="12" fill="#14213D"><tspan x="365" dy="0">Omschrijving</tspan></text>
<text x="640" y="489" font-family="DM Sans" font-size="12" fill="#55606F"><tspan x="640" dy="0">Text</tspan></text>
<text x="850" y="489" font-family="DM Sans" font-size="12" fill="#55606F"><tspan x="850" dy="0">optioneel</tspan></text>
<text x="985" y="489" font-family="DM Sans" font-size="12" fill="#55606F"><tspan x="985" dy="0">—</tspan></text>

<!-- row 7: Aangemaakt -->
<rect x="345" y="504" width="920" height="40" fill="#FBFAF7" stroke="#DFDCD3" stroke-width="1"/>
<text x="365" y="529" font-family="DM Sans" font-size="12" fill="#14213D"><tspan x="365" dy="0">Aangemaakt</tspan></text>
<text x="640" y="529" font-family="DM Sans" font-size="12" fill="#55606F"><tspan x="640" dy="0">DateTime</tspan></text>
<text x="850" y="529" font-family="DM Sans" font-size="12" fill="#55606F"><tspan x="850" dy="0">ja</tspan></text>
<text x="985" y="529" font-family="DM Sans" font-size="12" fill="#55606F"><tspan x="985" dy="0">—</tspan></text>

<rect x="345" y="544" width="920" height="1" fill="#DFDCD3"/>

<!-- footnote -->
<rect x="345" y="562" width="920" height="80" rx="5" fill="#F4F6F9" stroke="#DFDCD3" stroke-width="1"/>
<text x="365" y="586" font-family="DM Sans" font-size="12" fill="#55606F"><tspan x="365" dy="0">Elke entity krijgt automatisch een technische Id — niet zelf te modelleren.</tspan></text>
<text x="365" y="606" font-family="DM Sans" font-size="12" fill="#55606F"><tspan x="365" dy="0">Attributen krijgen een type (Text, Integer, Date, Boolean, ...) en optioneel</tspan></text>
<text x="365" y="626" font-family="DM Sans" font-size="12" fill="#55606F"><tspan x="365" dy="0">constraints, zoals verplicht of optioneel.</tspan></text>
</svg>
