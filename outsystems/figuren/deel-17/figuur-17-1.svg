<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
<rect width="1400" height="720" fill="#FFFFFF"/>
<text x="700" y="46" font-family="Cormorant Garamond" font-size="26" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">SSO-configuratie-inspanning: O11 versus ODC</tspan></text>
<text x="700" y="72" font-family="DM Sans" font-size="13" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">Zelfde eindresultaat, andere hoeveelheid bewust werk om er te komen</tspan></text>

<!-- Column headers -->
<rect x="120" y="100" width="520" height="42" rx="6" fill="#14213D"/>
<text x="380" y="127" font-family="DM Sans" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="380" dy="0">O11 — native IT Users</tspan></text>
<rect x="760" y="100" width="520" height="42" rx="6" fill="#2563A8"/>
<text x="1020" y="127" font-family="DM Sans" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="1020" dy="0">ODC — IAM-first</tspan></text>

<line x1="700" y1="100" x2="700" y2="580" stroke="#DFDCD3" stroke-width="1.5" stroke-dasharray="6 5"/>

<!-- O11 rows -->
<rect x="140" y="160" width="480" height="66" rx="5" fill="#F4F6F9" stroke="#2563A8" stroke-width="1.5"/>
<text x="380" y="186" font-family="DM Sans" font-size="14" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="380" dy="0">Native IT Users</tspan></text>
<text x="380" y="205" font-family="DM Sans" font-size="11" fill="#55606F" text-anchor="middle"><tspan x="380" dy="0">uitgangspunt: accounts direct in het platform</tspan></text>
<line x1="380" y1="226" x2="380" y2="246" stroke="#14213D" stroke-width="2"/>

<rect x="140" y="248" width="480" height="66" rx="5" fill="#FBF4E6" stroke="#E9A13B" stroke-width="2.5"/>
<text x="380" y="272" font-family="DM Sans" font-size="14" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="380" dy="0">SSO: aparte, bewuste stap</tspan></text>
<text x="380" y="291" font-family="DM Sans" font-size="11" fill="#55606F" text-anchor="middle"><tspan x="380" dy="0">koppeling met de IdP moet expliciet toegevoegd</tspan></text>
<text x="380" y="306" font-family="DM Sans" font-size="11" fill="#55606F" text-anchor="middle"><tspan x="380" dy="0">worden bovenop het native mechanisme</tspan></text>
<line x1="380" y1="314" x2="380" y2="334" stroke="#14213D" stroke-width="2"/>

<rect x="140" y="336" width="480" height="66" rx="5" fill="#F4F6F9" stroke="#2563A8" stroke-width="1.5"/>
<text x="380" y="362" font-family="DM Sans" font-size="14" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="380" dy="0">Rolmapping controleren</tspan></text>
<text x="380" y="381" font-family="DM Sans" font-size="11" fill="#55606F" text-anchor="middle"><tspan x="380" dy="0">handmatig valideren tegen bestaande rollen</tspan></text>
<line x1="380" y1="402" x2="380" y2="422" stroke="#14213D" stroke-width="2"/>

<rect x="140" y="424" width="480" height="66" rx="5" fill="#F4F6F9" stroke="#2563A8" stroke-width="1.5"/>
<text x="380" y="450" font-family="DM Sans" font-size="14" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="380" dy="0">Aparte testflow</tspan></text>
<text x="380" y="469" font-family="DM Sans" font-size="11" fill="#55606F" text-anchor="middle"><tspan x="380" dy="0">SSO-pad los valideren van de reguliere login</tspan></text>

<!-- ODC rows -->
<rect x="780" y="160" width="480" height="66" rx="5" fill="#F4F6F9" stroke="#2563A8" stroke-width="1.5"/>
<text x="1020" y="186" font-family="DM Sans" font-size="14" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="1020" dy="0">IAM-first uitgangspunt</tspan></text>
<text x="1020" y="205" font-family="DM Sans" font-size="11" fill="#55606F" text-anchor="middle"><tspan x="1020" dy="0">identity provider staat standaard aan de basis</tspan></text>
<line x1="1020" y1="226" x2="1020" y2="246" stroke="#14213D" stroke-width="2"/>

<rect x="780" y="248" width="480" height="66" rx="5" fill="#FBF4E6" stroke="#E9A13B" stroke-width="2.5"/>
<text x="1020" y="272" font-family="DM Sans" font-size="14" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="1020" dy="0">SSO: natuurlijke uitbreiding</tspan></text>
<text x="1020" y="291" font-family="DM Sans" font-size="11" fill="#55606F" text-anchor="middle"><tspan x="1020" dy="0">vloeit rechtstreeks voort uit het IAM-ontwerp,</tspan></text>
<text x="1020" y="306" font-family="DM Sans" font-size="11" fill="#55606F" text-anchor="middle"><tspan x="1020" dy="0">geen aparte laag om overheen te bouwen</tspan></text>

<rect x="780" y="336" width="480" height="66" rx="5" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="1020" y="374" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle" font-style="italic"><tspan x="1020" dy="0">— geen aparte stap nodig —</tspan></text>

<rect x="780" y="424" width="480" height="66" rx="5" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="1020" y="462" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle" font-style="italic"><tspan x="1020" dy="0">— geen aparte stap nodig —</tspan></text>

<!-- Convergence -->
<rect x="140" y="518" width="1120" height="66" rx="6" fill="#FFFFFF" stroke="#14213D" stroke-width="1.5"/>
<text x="700" y="546" font-family="DM Sans" font-size="14" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Zelfde eindresultaat: gebruiker meldt zich centraal aan via SSO</tspan></text>
<text x="700" y="568" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">het verschil zit niet in wát er werkt, maar in hoeveel bewuste stappen dat kost</tspan></text>

<text x="700" y="660" font-family="Cormorant Garamond" font-size="19" font-style="italic" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Waar O11 SSO toevoegt, heeft ODC het al ingebouwd.</tspan></text>
</svg>
