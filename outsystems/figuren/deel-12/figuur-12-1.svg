<rect x="500" y="448" width="400" height="100" rx="6" fill="#FFFFFF" stroke="#14213D" stroke-width="2.5"/>
<text x="700" y="480" font-family="DM Sans" font-size="17" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">MeridiaanMutatiesCore</tspan></text>
<text x="700" y="502" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">library — gedeelde mutatielogica</tspan></text>
<text x="700" y="521" font-family="DM Sans" font-size="11" fill="#2563A8" text-anchor="middle"><tspan x="700" dy="0">publieke interface: server actions</tspan></text>
<text x="700" y="537" font-family="DM Sans" font-size="11" fill="#2563A8" text-anchor="middle"><tspan x="700" dy="0">interne structuur blijft priv&#233;</tspan></text>

<text x="700" y="620" font-family="DM Sans" font-size="13" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">Twee applicaties, &#233;&#233;n bron van waarheid: mutatielogica leeft eenmaal in de Core, niet gedupliceerd in beide apps.</tspan></text>

