<line x1="700" y1="330" x2="700" y2="390" stroke="#14213D" stroke-width="2.5" marker-end="url(#arrow121)"/>

<text x="500" y="316" font-family="DM Sans" font-size="12" font-weight="bold" fill="#55606F" text-anchor="middle"><tspan x="500" dy="0">gebruikt</tspan></text>
