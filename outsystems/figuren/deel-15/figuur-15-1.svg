<path d="M0,0 L10,5 L0,10 z" fill="#14213D"/>
</marker>
</defs>
<rect width="1400" height="720" fill="#FFFFFF"/>
<text x="700" y="48" font-family="Cormorant Garamond" font-size="26" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">MeridiaanDesignSystem naast MeridiaanMutatiesCore &#8212; beide Foundation-laag</tspan></text>

<!-- End-user layer band -->
<rect x="150" y="90" width="1100" height="130" rx="6" fill="#F4F6F9" stroke="#DFDCD3" stroke-width="1"/>
<text x="185" y="115" font-family="DM Sans" font-size="12" font-weight="bold" fill="#55606F"><tspan x="185" dy="0">END-USER LAYER</tspan></text>

<rect x="220" y="135" width="260" height="66" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="2"/>
<text x="350" y="163" font-family="DM Sans" font-size="14" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="350" dy="0">WGP 2.0</tspan></text>
<text x="350" y="182" font-family="DM Sans" font-size="10" fill="#55606F" text-anchor="middle"><tspan x="350" dy="0">applicatie &#8212; ODC</tspan></text>

<rect x="570" y="135" width="260" height="66" rx="6" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1.5"/>
<text x="700" y="163" font-family="DM Sans" font-size="14" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Verzuimmeldingen</tspan></text>
<text x="700" y="182" font-family="DM Sans" font-size="10" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">satellietapp &#8212; O11</tspan></text>

<rect x="920" y="135" width="260" height="66" rx="6" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="1050" y="163" font-family="DM Sans" font-size="12" font-weight="bold" fill="#55606F" text-anchor="middle"><tspan x="1050" dy="0">+ overige satellieten</tspan></text>
<text x="1050" y="182" font-family="DM Sans" font-size="10" fill="#55606F" text-anchor="middle"><tspan x="1050" dy="0">(toekomstige doorontwikkeling)</tspan></text>

<!-- arrows down to both foundation modules -->
<line x1="350" y1="201" x2="350" y2="240" stroke="#14213D" stroke-width="2"/>
<line x1="700" y1="201" x2="700" y2="240" stroke="#14213D" stroke-width="2"/>
<line x1="1050" y1="201" x2="1050" y2="240" stroke="#14213D" stroke-width="2"/>

<line x1="350" y1="240" x2="475" y2="240" stroke="#14213D" stroke-width="2"/>
<line x1="700" y1="240" x2="475" y2="240" stroke="#14213D" stroke-width="2"/>
<line x1="475" y1="240" x2="475" y2="272" stroke="#14213D" stroke-width="2" marker-end="url(#arrow151)"/>

<line x1="700" y1="240" x2="925" y2="240" stroke="#14213D" stroke-width="2"/>
<line x1="1050" y1="240" x2="925" y2="240" stroke="#14213D" stroke-width="2"/>
<line x1="925" y1="240" x2="925" y2="272" stroke="#14213D" stroke-width="2" marker-end="url(#arrow151)"/>

<!-- Foundation layer band -->
<rect x="150" y="278" width="1100" height="330" rx="6" fill="#FBFAF7" stroke="#14213D" stroke-width="2"/>
<text x="700" y="305" font-family="DM Sans" font-size="14" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">FOUNDATION LAYER &#8212; generieke bouwstenen, los van bedrijfslogica-inhoud</tspan></text>

<line x1="700" y1="320" x2="700" y2="580" stroke="#DFDCD3" stroke-width="1"/>

<!-- MeridiaanDesignSystem -->
<rect x="240" y="335" width="400" height="230" rx="6" fill="#FFFFFF" stroke="#2563A8" stroke-width="2.5"/>
<text x="440" y="365" font-family="DM Sans" font-size="16" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="440" dy="0">MeridiaanDesignSystem</tspan></text>
<text x="440" y="386" font-family="DM Sans" font-size="11" fill="#2563A8" text-anchor="middle"><tspan x="440" dy="0">styling &#8212; hoe het eruitziet</tspan></text>

<rect x="270" y="404" width="150" height="30" rx="4" fill="#F4F6F9" stroke="#DFDCD3" stroke-width="1"/>
<text x="345" y="424" font-family="DM Sans" font-size="10" fill="#14213D" text-anchor="middle"><tspan x="345" dy="0">Thema</tspan></text>
<rect x="430" y="404" width="180" height="30" rx="4" fill="#F4F6F9" stroke="#DFDCD3" stroke-width="1"/>
<text x="520" y="424" font-family="DM Sans" font-size="10" fill="#14213D" text-anchor="middle"><tspan x="520" dy="0">kleuren · typografie · spacing</tspan></text>

<rect x="270" y="444" width="340" height="30" rx="4" fill="#F4F6F9" stroke="#DFDCD3" stroke-width="1"/>
<text x="440" y="464" font-family="DM Sans" font-size="10" fill="#14213D" text-anchor="middle"><tspan x="440" dy="0">KnopPrimair &#183; KnopSecundair</tspan></text>

<rect x="270" y="484" width="340" height="30" rx="4" fill="#F4F6F9" stroke="#DFDCD3" stroke-width="1"/>
<text x="440" y="504" font-family="DM Sans" font-size="10" fill="#14213D" text-anchor="middle"><tspan x="440" dy="0">FormulierVeld &#183; MeldingBanner</tspan></text>

<text x="440" y="540" font-family="DM Sans" font-size="10" fill="#55606F" text-anchor="middle"><tspan x="440" dy="0">geen kennis van Verzuimmeldingen</tspan></text>
<text x="440" y="556" font-family="DM Sans" font-size="10" fill="#55606F" text-anchor="middle"><tspan x="440" dy="0">of WGP 2.0 &#8212; alleen parameters</tspan></text>

<!-- MeridiaanMutatiesCore -->
<rect x="760" y="335" width="400" height="230" rx="6" fill="#FFFFFF" stroke="#E9A13B" stroke-width="2.5"/>
<text x="960" y="365" font-family="DM Sans" font-size="16" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="960" dy="0">MeridiaanMutatiesCore</tspan></text>
<text x="960" y="386" font-family="DM Sans" font-size="11" fill="#E9A13B" text-anchor="middle"><tspan x="960" dy="0">bedrijfslogica &#8212; wat het doet</tspan></text>

<rect x="790" y="404" width="340" height="30" rx="4" fill="#FBF4E6" stroke="#DFDCD3" stroke-width="1"/>
<text x="960" y="424" font-family="DM Sans" font-size="10" fill="#14213D" text-anchor="middle"><tspan x="960" dy="0">gedeelde mutatielogica</tspan></text>

<rect x="790" y="444" width="340" height="30" rx="4" fill="#FBF4E6" stroke="#DFDCD3" stroke-width="1"/>
<text x="960" y="464" font-family="DM Sans" font-size="10" fill="#14213D" text-anchor="middle"><tspan x="960" dy="0">Werkgever-entity (eigenaarschap, deel 13)</tspan></text>

<rect x="790" y="484" width="340" height="30" rx="4" fill="#FBF4E6" stroke="#DFDCD3" stroke-width="1"/>
<text x="960" y="504" font-family="DM Sans" font-size="10" fill="#14213D" text-anchor="middle"><tspan x="960" dy="0">publieke interface: server actions</tspan></text>

<text x="960" y="540" font-family="DM Sans" font-size="10" fill="#55606F" text-anchor="middle"><tspan x="960" dy="0">geen styling, geen schermen &#8212;</tspan></text>
<text x="960" y="556" font-family="DM Sans" font-size="10" fill="#55606F" text-anchor="middle"><tspan x="960" dy="0">alleen logica en data</tspan></text>

<text x="700" y="650" font-family="DM Sans" font-size="13" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">Twee verschillende soorten libraries, &#233;&#233;n laag: stijl en bedrijfslogica horen gescheiden &#8212; en allebei in de Foundation.</tspan></text>
</svg>
