<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
<defs>
<marker id="arrow9" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#14213D"/>
</marker>
</defs>
<rect width="1400" height="720" fill="#FFFFFF"/>
<text x="700" y="42" font-family="Cormorant Garamond" font-size="26" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Verzuimmeldingen &#8594; Mutatie-API &#8594; Mutatieplatform</tspan></text>

<!-- Main flow -->
<rect x="80" y="180" width="340" height="130" rx="6" fill="#FBF4E6" stroke="#E9A13B" stroke-width="2.5"/>
<text x="250" y="217" font-family="DM Sans" font-size="17" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="250" dy="0">Verzuimmeldingen</tspan></text>
<text x="250" y="240" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle"><tspan x="250" dy="0">AanmaakMelding — server action</tspan></text>
<rect x="190" y="266" width="120" height="24" rx="12" fill="#E9A13B" stroke="#14213D" stroke-width="1"/>
<text x="250" y="282" font-family="DM Sans" font-size="11" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="250" dy="0">O11 &amp; ODC</tspan></text>

<line x1="420" y1="245" x2="522" y2="245" stroke="#14213D" stroke-width="2" marker-end="url(#arrow9)"/>
<text x="471" y="228" font-family="DM Sans" font-size="12" font-weight="bold" fill="#2563A8" text-anchor="middle"><tspan x="471" dy="0">REST Consume</tspan></text>
<text x="471" y="268" font-family="DM Sans" font-size="10" fill="#55606F" text-anchor="middle"><tspan x="471" dy="0">OpenAPI-specificatie</tspan></text>

<rect x="530" y="180" width="340" height="130" rx="6" fill="#F4F6F9" stroke="#2563A8" stroke-width="1.5"/>
<text x="700" y="217" font-family="DM Sans" font-size="17" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Mutatie-API</tspan></text>
<text x="700" y="240" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">koppelvlak — API-cursus</tspan></text>
<text x="700" y="261" font-family="DM Sans" font-size="11" fill="#2563A8" text-anchor="middle"><tspan x="700" dy="0">— reeds gebouwd —</tspan></text>

<line x1="870" y1="245" x2="972" y2="245" stroke="#14213D" stroke-width="2" marker-end="url(#arrow9)"/>
<text x="921" y="228" font-family="DM Sans" font-size="12" font-weight="bold" fill="#2563A8" text-anchor="middle"><tspan x="921" dy="0">registreert mutatie</tspan></text>

<rect x="980" y="180" width="340" height="130" rx="6" fill="#F4F6F9" stroke="#2563A8" stroke-width="1.5"/>
<text x="1150" y="217" font-family="DM Sans" font-size="17" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="1150" dy="0">Mutatieplatform</tspan></text>
<text x="1150" y="240" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle"><tspan x="1150" dy="0">bedrijfslogica — SA-cursus</tspan></text>
<text x="1150" y="261" font-family="DM Sans" font-size="11" fill="#2563A8" text-anchor="middle"><tspan x="1150" dy="0">— reeds gebouwd —</tspan></text>

<!-- Failure / retry sub-flow -->
<line x1="250" y1="310" x2="250" y2="398" stroke="#14213D" stroke-width="2" marker-end="url(#arrow9)"/>
<text x="266" y="358" font-family="DM Sans" font-size="10" fill="#55606F" text-anchor="start"><tspan x="266" dy="0">áls de aanroep faalt</tspan></text>

<rect x="80" y="400" width="260" height="72" rx="5" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1.5"/>
<text x="210" y="430" font-family="DM Sans" font-size="13" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="210" dy="0">Exception Handler</tspan></text>
<text x="210" y="450" font-family="DM Sans" font-size="10" fill="#55606F" text-anchor="middle"><tspan x="210" dy="0">verplicht bij elke externe aanroep</tspan></text>

<line x1="340" y1="436" x2="378" y2="436" stroke="#14213D" stroke-width="2" marker-end="url(#arrow9)"/>

<rect x="380" y="400" width="280" height="72" rx="5" fill="#FBF4E6" stroke="#E9A13B" stroke-width="2"/>
<text x="520" y="430" font-family="DM Sans" font-size="13" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="520" dy="0">Status: nog te verwerken</tspan></text>
<text x="520" y="450" font-family="DM Sans" font-size="10" fill="#55606F" text-anchor="middle"><tspan x="520" dy="0">melding zelf blijft wél opgeslagen</tspan></text>

<line x1="660" y1="436" x2="698" y2="436" stroke="#14213D" stroke-width="2" marker-end="url(#arrow9)"/>

<rect x="700" y="400" width="260" height="72" rx="5" fill="#F4F6F9" stroke="#2563A8" stroke-width="1.5"/>
<text x="830" y="430" font-family="DM Sans" font-size="13" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="830" dy="0">Timer</tspan></text>
<text x="830" y="450" font-family="DM Sans" font-size="10" fill="#55606F" text-anchor="middle"><tspan x="830" dy="0">elke nacht — probeert opnieuw</tspan></text>

<path d="M830,400 L830,350 L700,350 L700,314" fill="none" stroke="#2563A8" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow9)"/>
<text x="765" y="343" font-family="DM Sans" font-size="10" fill="#2563A8" text-anchor="middle"><tspan x="765" dy="0">opnieuw aanroepen</tspan></text>

<!-- Legend -->
<rect x="380" y="600" width="16" height="16" rx="3" fill="#FBF4E6" stroke="#E9A13B" stroke-width="2"/>
<text x="404" y="613" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="start"><tspan x="404" dy="0">Verzuimmeldingen — onderwerp van dit deel</tspan></text>
<rect x="800" y="600" width="16" height="16" rx="3" fill="#F4F6F9" stroke="#2563A8" stroke-width="1.5"/>
<text x="824" y="613" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="start"><tspan x="824" dy="0">bestaande koppelvlakken — elders behandeld</tspan></text>
</svg>
