<rect width="1400" height="940" fill="#FFFFFF"/>
<text x="700" y="40" font-family="Cormorant Garamond" font-size="26" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Het volledige WGP 2.0-landschap — alle lagen en modules uit deel 11-20</tspan></text>
