<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
<defs>
<marker id="arrow192" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#14213D"/>
</marker>
</defs>
<rect width="1400" height="720" fill="#FFFFFF"/>
<text x="700" y="48" font-family="Cormorant Garamond" font-size="26" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Getrapte uitrol: ODC eerst, dan de O11-satellieten</tspan></text>
<text x="700" y="76" font-family="DM Sans" font-size="13" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">Eerst beperkt, dan breed — risico verminderen in een gemengd landschap</tspan></text>

<!-- Phase 1 box -->
<rect x="170" y="170" width="300" height="160" rx="7" fill="#F4F6F9" stroke="#2563A8" stroke-width="1.5"/>
<circle cx="200" cy="196" r="14" fill="#14213D"/>
<text x="200" y="201" font-family="DM Sans" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="200" dy="0">1</tspan></text>
<text x="320" y="201" font-family="DM Sans" font-size="14" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="320" dy="0">Fase 1 — WGP 2.0</tspan></text>
<text x="320" y="222" font-family="DM Sans" font-size="11" fill="#55606F" text-anchor="middle"><tspan x="320" dy="0">(ODC)</tspan></text>
<line x1="200" y1="238" x2="440" y2="238" stroke="#DFDCD3" stroke-width="1"/>
<text x="320" y="262" font-family="DM Sans" font-size="12" fill="#14213D" text-anchor="middle"><tspan x="320" dy="0">Nieuw, beter getest</tspan></text>
<text x="320" y="284" font-family="DM Sans" font-size="12" fill="#14213D" text-anchor="middle"><tspan x="320" dy="0">Eerste livegang, nauwlettend</tspan></text>
<text x="320" y="303" font-family="DM Sans" font-size="12" fill="#14213D" text-anchor="middle"><tspan x="320" dy="0">gemonitord</tspan></text>

<!-- Phase 2 box -->
<rect x="830" y="170" width="340" height="160" rx="7" fill="#FBF4E6" stroke="#E9A13B" stroke-width="2.5"/>
<circle cx="864" cy="196" r="14" fill="#14213D"/>
<text x="864" y="201" font-family="DM Sans" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="864" dy="0">2</tspan></text>
<text x="1000" y="201" font-family="DM Sans" font-size="14" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="1000" dy="0">Fase 2 — O11-satellieten</tspan></text>
<text x="1000" y="222" font-family="DM Sans" font-size="11" fill="#55606F" text-anchor="middle"><tspan x="1000" dy="0">(veertien apps, waaronder Verzuimmeldingen)</tspan></text>
<line x1="864" y1="238" x2="1140" y2="238" stroke="#DFDCD3" stroke-width="1"/>
<text x="1000" y="262" font-family="DM Sans" font-size="12" fill="#14213D" text-anchor="middle"><tspan x="1000" dy="0">Ouder, fragieler</tspan></text>
<text x="1000" y="284" font-family="DM Sans" font-size="12" fill="#14213D" text-anchor="middle"><tspan x="1000" dy="0">Uitrol pas na validatie van</tspan></text>
<text x="1000" y="303" font-family="DM Sans" font-size="12" fill="#14213D" text-anchor="middle"><tspan x="1000" dy="0">fase 1 in productie</tspan></text>

<!-- Connectors to timeline -->
<line x1="320" y1="330" x2="320" y2="420" stroke="#2563A8" stroke-width="2"/>
<line x1="1000" y1="330" x2="1000" y2="420" stroke="#E9A13B" stroke-width="2"/>

<!-- Timeline -->
<line x1="140" y1="430" x2="320" y2="430" stroke="#14213D" stroke-width="2.5"/>
<line x1="320" y1="430" x2="1000" y2="430" stroke="#DFDCD3" stroke-width="2.5" stroke-dasharray="8 6"/>
<line x1="1000" y1="430" x2="1300" y2="430" stroke="#14213D" stroke-width="2.5" marker-end="url(#arrow192)"/>
<circle cx="320" cy="430" r="9" fill="#2563A8"/>
<circle cx="1000" cy="430" r="9" fill="#E9A13B"/>
<text x="1300" y="412" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D" text-anchor="end"><tspan x="1300" dy="0">tijd →</tspan></text>

<text x="660" y="464" font-family="DM Sans" font-size="12" font-style="italic" fill="#55606F" text-anchor="middle"><tspan x="660" dy="0">monitoring &amp; validatie-periode</tspan></text>

<!-- Caption -->
<rect x="330" y="510" width="740" height="60" rx="6" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1.5"/>
<text x="700" y="536" font-family="DM Sans" font-size="13" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Zelfde principe als het design system (deel 15)</tspan></text>
<text x="700" y="556" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">nu landschapsbreed toegepast op de uitrol zelf</tspan></text>

<text x="700" y="640" font-family="Cormorant Garamond" font-size="19" font-style="italic" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Eerst het nieuwe bewijzen, dan het oude meenemen.</tspan></text>
</svg>
