<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
<rect width="1400" height="720" fill="#FFFFFF"/>
<text x="700" y="42" font-family="Cormorant Garamond" font-size="26" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Aggregate-editor met SQL-preview naast elkaar</tspan></text>

<!-- Outer editor window -->
<rect x="60" y="86" width="1280" height="524" rx="6" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1.5"/>
<rect x="60" y="86" width="1280" height="42" rx="6" fill="#14213D"/>
<rect x="60" y="108" width="1280" height="20" fill="#14213D"/>
<text x="400" y="113" font-family="DM Sans" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="400" dy="0">Aggregate: MeldingOverzicht</tspan></text>
<rect x="1150" y="95" width="150" height="22" rx="11" fill="#2563A8"/>
<text x="1225" y="110" font-family="DM Sans" font-size="10" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="1225" dy="0">AGGREGATE</tspan></text>

<line x1="740" y1="128" x2="740" y2="610" stroke="#DFDCD3" stroke-width="1.5"/>

<!-- LEFT: aggregate tree / filters -->
<text x="90" y="158" font-family="DM Sans" font-size="13" font-weight="bold" fill="#14213D" text-anchor="start"><tspan x="90" dy="0">Bron</tspan></text>
<rect x="90" y="168" width="220" height="30" rx="4" fill="#F4F6F9" stroke="#2563A8" stroke-width="1.5"/>
<text x="104" y="188" font-family="DM Sans" font-size="12" font-weight="bold" fill="#14213D" text-anchor="start"><tspan x="104" dy="0">Melding</tspan></text>
<text x="130" y="220" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="start"><tspan x="130" dy="0">&#8627; Join: MeldingStatus — op StatusId</tspan></text>

<text x="90" y="256" font-family="DM Sans" font-size="13" font-weight="bold" fill="#14213D" text-anchor="start"><tspan x="90" dy="0">Filters</tspan></text>
<rect x="90" y="266" width="600" height="32" rx="4" fill="#FBF4E6" stroke="#E9A13B" stroke-width="1.5"/>
<text x="104" y="287" font-family="DM Sans" font-size="12" fill="#14213D" text-anchor="start"><tspan x="104" dy="0">M.WerkgeverId = CurrentWerkgeverId()</tspan></text>

<text x="90" y="326" font-family="DM Sans" font-size="13" font-weight="bold" fill="#14213D" text-anchor="start"><tspan x="90" dy="0">Sorteren</tspan></text>
<rect x="90" y="336" width="600" height="32" rx="4" fill="#F4F6F9" stroke="#2563A8" stroke-width="1.5"/>
<text x="104" y="357" font-family="DM Sans" font-size="12" fill="#14213D" text-anchor="start"><tspan x="104" dy="0">Startdatum — Descending</tspan></text>

<text x="90" y="396" font-family="DM Sans" font-size="13" font-weight="bold" fill="#14213D" text-anchor="start"><tspan x="90" dy="0">Kolommen (output)</tspan></text>
<rect x="94" y="410" width="12" height="12" fill="#14213D"/>
<text x="114" y="420" font-family="DM Sans" font-size="12" fill="#14213D" text-anchor="start"><tspan x="114" dy="0">MeldingId</tspan></text>
<rect x="94" y="434" width="12" height="12" fill="#14213D"/>
<text x="114" y="444" font-family="DM Sans" font-size="12" fill="#14213D" text-anchor="start"><tspan x="114" dy="0">Werknemer</tspan></text>
<rect x="94" y="458" width="12" height="12" fill="#14213D"/>
<text x="114" y="468" font-family="DM Sans" font-size="12" fill="#14213D" text-anchor="start"><tspan x="114" dy="0">Startdatum</tspan></text>
<rect x="360" y="410" width="12" height="12" fill="#14213D"/>
<text x="380" y="420" font-family="DM Sans" font-size="12" fill="#14213D" text-anchor="start"><tspan x="380" dy="0">Einddatum</tspan></text>
<rect x="360" y="434" width="12" height="12" fill="#14213D"/>
<text x="380" y="444" font-family="DM Sans" font-size="12" fill="#14213D" text-anchor="start"><tspan x="380" dy="0">StatusNaam (via join)</tspan></text>

<text x="90" y="508" font-family="DM Sans" font-size="13" font-weight="bold" fill="#14213D" text-anchor="start"><tspan x="90" dy="0">Paginering</tspan></text>
<rect x="90" y="518" width="290" height="32" rx="4" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/>
<text x="104" y="539" font-family="DM Sans" font-size="12" fill="#14213D" text-anchor="start"><tspan x="104" dy="0">Max Records: 20 · Start Index: 0</tspan></text>

<rect x="90" y="566" width="600" height="30" rx="4" fill="#FBF4E6" stroke="#E9A13B" stroke-width="1.5"/>
<text x="104" y="586" font-family="DM Sans" font-size="11" font-weight="bold" fill="#14213D" text-anchor="start"><tspan x="104" dy="0">Aggregate = standaard: 90% van de queries zonder zelf SQL te onderhouden</tspan></text>

<!-- RIGHT: generated SQL preview -->
<text x="770" y="158" font-family="DM Sans" font-size="13" font-weight="bold" fill="#14213D" text-anchor="start"><tspan x="770" dy="0">Gegenereerde SQL</tspan></text>
<text x="1330" y="158" font-family="DM Sans" font-size="11" fill="#55606F" text-anchor="end"><tspan x="1330" dy="0">(read-only preview)</tspan></text>

<rect x="770" y="170" width="560" height="330" rx="4" fill="#14213D"/>
<text x="790" y="200" font-family="DM Sans" font-size="13" text-anchor="start"><tspan fill="#E9A13B">SELECT</tspan><tspan fill="#DCE4F0" dy="0"> M.MeldingId, M.Werknemer,</tspan></text>
<text x="790" y="226" font-family="DM Sans" font-size="13" fill="#DCE4F0" text-anchor="start"><tspan x="790" dy="0">    M.Startdatum, M.Einddatum,</tspan></text>
<text x="790" y="252" font-family="DM Sans" font-size="13" fill="#DCE4F0" text-anchor="start"><tspan x="790" dy="0">    S.Naam </tspan><tspan fill="#E9A13B">AS</tspan><tspan fill="#DCE4F0"> StatusNaam</tspan></text>
<text x="790" y="286" font-family="DM Sans" font-size="13" text-anchor="start"><tspan fill="#E9A13B">FROM</tspan><tspan fill="#DCE4F0"> {Melding} M</tspan></text>
<text x="790" y="320" font-family="DM Sans" font-size="13" text-anchor="start"><tspan fill="#E9A13B">JOIN</tspan><tspan fill="#DCE4F0"> {MeldingStatus} S </tspan></text>
<text x="790" y="344" font-family="DM Sans" font-size="13" text-anchor="start"><tspan fill="#E9A13B">  ON</tspan><tspan fill="#DCE4F0"> S.MeldingStatusId = M.StatusId</tspan></text>
<text x="790" y="378" font-family="DM Sans" font-size="13" text-anchor="start"><tspan fill="#E9A13B">WHERE</tspan><tspan fill="#DCE4F0"> M.WerkgeverId = @Werkgever</tspan></text>
<text x="790" y="412" font-family="DM Sans" font-size="13" text-anchor="start"><tspan fill="#E9A13B">ORDER BY</tspan><tspan fill="#DCE4F0"> M.Startdatum </tspan><tspan fill="#E9A13B">DESC</tspan></text>
<text x="790" y="446" font-family="DM Sans" font-size="13" text-anchor="start"><tspan fill="#E9A13B">OFFSET</tspan><tspan fill="#DCE4F0"> @StartIndex </tspan><tspan fill="#E9A13B">ROWS FETCH NEXT</tspan></text>
<text x="790" y="470" font-family="DM Sans" font-size="13" text-anchor="start"><tspan fill="#DCE4F0">    @MaxRecords </tspan><tspan fill="#E9A13B">ROWS ONLY</tspan></text>

<text x="770" y="524" font-family="DM Sans" font-size="11" fill="#55606F" text-anchor="start"><tspan x="770" dy="0">&#8596; blijft synchroon met wijzigingen in het datamodel</tspan></text>

<rect x="770" y="566" width="560" height="30" rx="4" fill="#F4F6F9" stroke="#2563A8" stroke-width="1.5"/>
<text x="784" y="586" font-family="DM Sans" font-size="11" fill="#55606F" text-anchor="start"><tspan x="784" dy="0">Advanced SQL = uitzondering, alleen bij een concrete grens</tspan></text>
</svg>
