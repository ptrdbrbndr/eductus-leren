<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
<defs>
<marker id="arrow162" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#14213D"/>
</marker>
</defs>
<rect width="1400" height="720" fill="#FFFFFF"/>
<text x="700" y="48" font-family="Cormorant Garamond" font-size="26" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">De tussenlaag-oplossing: legacy-systeem ontsloten richting ODC</tspan></text>
<text x="700" y="76" font-family="DM Sans" font-size="13" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">ODC kent geen Integration Studio — dat is een keuze, geen gat</tspan></text>

<!-- Box 1: legacy system -->
<rect x="90" y="290" width="320" height="150" rx="7" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1.5"/>
<text x="250" y="332" font-family="DM Sans" font-size="17" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="250" dy="0">Legacy-systeem</tspan></text>
<text x="250" y="356" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle"><tspan x="250" dy="0">on-premise, geen REST-interface</tspan></text>
<text x="250" y="376" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle"><tspan x="250" dy="0">enige toegang: .NET-component,</tspan></text>
<text x="250" y="394" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle"><tspan x="250" dy="0">stored procedure of SOAP</tspan></text>

<line x1="410" y1="365" x2="486" y2="365" stroke="#14213D" stroke-width="2" marker-end="url(#arrow162)"/>

<!-- Box 2: O11 wrapper -->
<rect x="490" y="270" width="380" height="190" rx="7" fill="#FBF4E6" stroke="#E9A13B" stroke-width="2.5"/>
<rect x="510" y="286" width="60" height="26" rx="13" fill="#14213D"/>
<text x="540" y="304" font-family="DM Sans" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="540" dy="0">O11</tspan></text>
<text x="680" y="336" font-family="DM Sans" font-size="17" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="680" dy="0">O11-wrapper</tspan></text>
<text x="680" y="358" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle"><tspan x="680" dy="0">Integration Studio-extension +</tspan></text>
<text x="680" y="376" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle"><tspan x="680" dy="0">REST-module eromheen</tspan></text>
<rect x="570" y="392" width="220" height="26" rx="13" fill="#FFFFFF" stroke="#2563A8" stroke-width="1.2"/>
<text x="680" y="410" font-family="DM Sans" font-size="11" font-weight="bold" fill="#2563A8" text-anchor="middle"><tspan x="680" dy="0">publiceert een REST-koppelvlak</tspan></text>
<text x="680" y="438" font-family="DM Sans" font-size="11" fill="#55606F" text-anchor="middle"><tspan x="680" dy="0">vaak gebouwd in O11, precies zoals deel 16.1</tspan></text>

<line x1="870" y1="365" x2="946" y2="365" stroke="#14213D" stroke-width="2" marker-end="url(#arrow162)"/>
<text x="908" y="345" font-family="DM Sans" font-size="11" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="908" dy="0">REST</tspan></text>

<!-- Box 3: ODC consumer -->
<rect x="950" y="290" width="360" height="150" rx="7" fill="#F4F6F9" stroke="#2563A8" stroke-width="1.5"/>
<rect x="970" y="306" width="60" height="26" rx="13" fill="#2563A8"/>
<text x="1000" y="324" font-family="DM Sans" font-size="12" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="1000" dy="0">ODC</tspan></text>
<text x="1145" y="356" font-family="DM Sans" font-size="17" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="1145" dy="0">ODC-consumer</tspan></text>
<text x="1145" y="380" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle"><tspan x="1145" dy="0">WGP 2.0-module roept de REST-API</tspan></text>
<text x="1145" y="398" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle"><tspan x="1145" dy="0">aan als gewone externe koppeling</tspan></text>

<!-- caption -->
<rect x="230" y="510" width="940" height="66" rx="6" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1.5"/>
<text x="700" y="536" font-family="DM Sans" font-size="14" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">O11 en ODC: complementair, niet concurrerend</tspan></text>
<text x="700" y="558" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">ODC's API-gebaseerde uitgangspunt maakt de tussenlaag nodig — en O11 is daar de aangewezen bouwer van</tspan></text>

<text x="700" y="660" font-family="Cormorant Garamond" font-size="19" font-style="italic" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Waar ODC geen Integration Studio heeft, levert O11 de brug.</tspan></text>
</svg>
