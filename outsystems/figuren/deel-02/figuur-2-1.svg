<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
<rect width="1400" height="720" fill="#FFFFFF"/>
<text x="700" y="48" font-family="Cormorant Garamond" font-size="26" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">Gelaagd diagram: O11-stack naast ODC-stack</tspan></text>

<!-- column headers -->
<rect x="90" y="66" width="600" height="34" rx="4" fill="#14213D"/>
<text x="390" y="89" font-family="DM Sans" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="390" dy="0">O11</tspan></text>
<rect x="710" y="66" width="600" height="34" rx="4" fill="#2563A8"/>
<text x="1010" y="89" font-family="DM Sans" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="1010" dy="0">ODC</tspan></text>

<!-- Layer 1: Bouwen -->
<rect x="90" y="110" width="600" height="92" fill="#F4F6F9" stroke="#DFDCD3" stroke-width="1"/>
<rect x="710" y="110" width="600" height="92" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/>
<text x="55" y="162" font-family="DM Sans" font-size="12" font-weight="bold" fill="#55606F" text-anchor="end"><tspan x="55" dy="0">Bouwen</tspan></text>
<text x="390" y="150" font-family="DM Sans" font-size="17" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="390" dy="0">Service Studio</tspan></text>
<text x="390" y="172" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle"><tspan x="390" dy="0">Desktop-ontwikkelomgeving</tspan></text>
<text x="1010" y="150" font-family="DM Sans" font-size="17" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="1010" dy="0">ODC Studio</tspan></text>
<text x="1010" y="172" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle"><tspan x="1010" dy="0">Ontwikkelomgeving tegen cloud-workspace</tspan></text>

<!-- Layer 2: Draait op -->
<rect x="90" y="202" width="600" height="92" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/>
<rect x="710" y="202" width="600" height="92" fill="#F4F6F9" stroke="#DFDCD3" stroke-width="1"/>
<text x="55" y="254" font-family="DM Sans" font-size="12" font-weight="bold" fill="#55606F" text-anchor="end"><tspan x="55" dy="0">Draait op</tspan></text>
<text x="390" y="242" font-family="DM Sans" font-size="17" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="390" dy="0">Environments</tspan></text>
<text x="390" y="264" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle"><tspan x="390" dy="0">Development / Test / Acceptance / Production</tspan></text>
<text x="1010" y="242" font-family="DM Sans" font-size="17" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="1010" dy="0">Cloud-workspace</tspan></text>
<text x="1010" y="264" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle"><tspan x="1010" dy="0">Stages als eersteklas concept</tspan></text>

<!-- Layer 3: Beheer/promotie -->
<rect x="90" y="294" width="600" height="92" fill="#F4F6F9" stroke="#DFDCD3" stroke-width="1"/>
<rect x="710" y="294" width="600" height="92" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/>
<text x="55" y="346" font-family="DM Sans" font-size="12" font-weight="bold" fill="#55606F" text-anchor="end"><tspan x="55" dy="0">Beheer /</tspan></text>
<text x="55" y="360" font-family="DM Sans" font-size="12" font-weight="bold" fill="#55606F" text-anchor="end"><tspan x="55" dy="0">promotie</tspan></text>
<text x="390" y="334" font-family="DM Sans" font-size="17" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="390" dy="0">LifeTime</tspan></text>
<text x="390" y="356" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle"><tspan x="390" dy="0">Centraal overzicht, geautoriseerde promotie</tspan></text>
<text x="1010" y="334" font-family="DM Sans" font-size="17" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="1010" dy="0">ODC Portal</tspan></text>
<text x="1010" y="356" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle"><tspan x="1010" dy="0">Dieper geïntegreerd met de pipeline</tspan></text>

<!-- Layer 4: Publiceren -->
<rect x="90" y="386" width="600" height="92" fill="#FBF4E6" stroke="#E9A13B" stroke-width="1.5"/>
<rect x="710" y="386" width="600" height="92" fill="#FBF4E6" stroke="#E9A13B" stroke-width="1.5"/>
<text x="55" y="438" font-family="DM Sans" font-size="12" font-weight="bold" fill="#55606F" text-anchor="end"><tspan x="55" dy="0">Publiceren</tspan></text>
<text x="390" y="426" font-family="DM Sans" font-size="17" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="390" dy="0">Publish + LifeTime-promotie</tspan></text>
<text x="390" y="448" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle"><tspan x="390" dy="0">TrueChange: incrementeel, alleen wat wijzigde</tspan></text>
<text x="1010" y="426" font-family="DM Sans" font-size="17" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="1010" dy="0">1-Click Publish</tspan></text>
<text x="1010" y="448" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle"><tspan x="1010" dy="0">TrueChange: zelfde mechanisme, cloud-native</tspan></text>

<!-- Layer 5: Infrastructuur-eigenaarschap -->
<rect x="90" y="478" width="600" height="100" fill="#14213D"/>
<rect x="710" y="478" width="600" height="100" fill="#2563A8"/>
<text x="55" y="522" font-family="DM Sans" font-size="12" font-weight="bold" fill="#55606F" text-anchor="end"><tspan x="55" dy="0">Infra-</tspan></text>
<text x="55" y="536" font-family="DM Sans" font-size="12" font-weight="bold" fill="#55606F" text-anchor="end"><tspan x="55" dy="0">structuur</tspan></text>

<!-- server rack icon left -->
<g transform="translate(320,498)">
<rect x="0" y="0" width="44" height="60" rx="3" fill="none" stroke="#FFFFFF" stroke-width="2"/>
<line x1="6" y1="14" x2="38" y2="14" stroke="#FFFFFF" stroke-width="2"/>
<line x1="6" y1="30" x2="38" y2="30" stroke="#FFFFFF" stroke-width="2"/>
<line x1="6" y1="46" x2="38" y2="46" stroke="#FFFFFF" stroke-width="2"/>
<circle cx="12" cy="7" r="1.6" fill="#E9A13B"/>
<circle cx="12" cy="23" r="1.6" fill="#E9A13B"/>
<circle cx="12" cy="39" r="1.6" fill="#E9A13B"/>
</g>
<text x="390" y="522" font-family="DM Sans" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="390" dy="0">Meridiaan-beheerd</tspan></text>
<text x="390" y="544" font-family="DM Sans" font-size="12" fill="#DFDCD3" text-anchor="middle"><tspan x="390" dy="0">Eigen (of gehoste) servers, eigen verantwoordelijkheid</tspan></text>

<!-- cloud icon right -->
<g transform="translate(940,505)">
<path d="M12,40 a14,14 0 0 1 -2,-27.8 a18,18 0 0 1 34.6,-4 a13,13 0 0 1 -3.6,31.8 z" fill="none" stroke="#FFFFFF" stroke-width="2"/>
</g>
<text x="1010" y="522" font-family="DM Sans" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="middle"><tspan x="1010" dy="0">OutSystems-beheerd</tspan></text>
<text x="1010" y="544" font-family="DM Sans" font-size="12" fill="#DFDCD3" text-anchor="middle"><tspan x="1010" dy="0">Geen door Meridiaan te beheren servers</tspan></text>

<!-- outer borders -->
<rect x="90" y="110" width="600" height="468" fill="none" stroke="#14213D" stroke-width="2"/>
<rect x="710" y="110" width="600" height="468" fill="none" stroke="#14213D" stroke-width="2"/>

<line x1="700" y1="60" x2="700" y2="620" stroke="#DFDCD3" stroke-width="1.5" stroke-dasharray="6 5"/>

<rect x="90" y="620" width="1220" height="66" rx="5" fill="#FFFFFF" stroke="#DFDCD3" stroke-width="1"/>
<text x="700" y="646" font-family="DM Sans" font-size="13" font-weight="bold" fill="#14213D" text-anchor="middle"><tspan x="700" dy="0">TrueChange — gedeeld mechanisme in beide platformen</tspan></text>
<text x="700" y="666" font-family="DM Sans" font-size="12" fill="#55606F" text-anchor="middle"><tspan x="700" dy="0">Houdt bij welk element wijzigde, hercompileert alleen dat element en zijn afhankelijkheden</tspan></text>
</svg>
